name: MojPlayWin cPanel Passenger inventory (read only)
# Read-only verification rerun for scoped /about/ publication assessment, 2026-10-18. No host writes.
# 2026-10-24: Recheck protected child-site and restore isolation before any new paid store release; diagnostic only.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-cpanel-readonly-inventory.yml"
      - "scripts/mojplaywin_cpanel_readonly_inventory.py"
      - "tests/test_mojplaywin_cpanel_readonly_inventory.py"
      - "scripts/mojplaywin_rewrite_backup_readonly.py"
      - "tests/test_mojplaywin_rewrite_backup_readonly.py"
      - "scripts/mojplaywin_cpanel_domains_backups_readonly.py"
      - "tests/test_mojplaywin_cpanel_domains_backups_readonly.py"
      - "scripts/mojplaywin_backup_restore_readiness_readonly.py"
      - "tests/test_mojplaywin_backup_restore_readiness_readonly.py"
      - "scripts/mojplaywin_db_backend_config_hints_readonly.py"
      - "tests/test_mojplaywin_db_backend_config_hints_readonly.py"
      - "scripts/mojplaywin_backup_vps_destination_readonly.py"
      - "tests/test_mojplaywin_backup_vps_destination_readonly.py"
      - "scripts/mojplaywin_mysql_quota_sanitize_readonly.py"
      - "tests/test_mojplaywin_mysql_quota_sanitize_readonly.py"
      - "scripts/mojplaywin_consistent_db_preflight_readonly.py"
      - "tests/test_mojplaywin_consistent_db_preflight_readonly.py"
      - "scripts/mojplaywin_backup_vps_failure_readonly.py"
      - "tests/test_mojplaywin_backup_vps_failure_readonly.py"
      - "scripts/mojplaywin_isolated_restore_capabilities_readonly.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-passenger-inventory-read-only
  cancel-in-progress: false
jobs:
  inspect-no-server-writes:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate sanitizer with synthetic mappings before SSH
        run: |
          python3 -m unittest discover -s tests -p 'test_mojplaywin_cpanel_readonly_inventory.py'
          python3 -m py_compile scripts/mojplaywin_cpanel_readonly_inventory.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Query only PassengerApps list_applications, sanitize before printing
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel 'uapi --output=json PassengerApps list_applications' | python3 scripts/mojplaywin_cpanel_readonly_inventory.py
      - name: Inspect WSGI htaccess and static Django route evidence without server writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_live_routing_fingerprint.py'
          python3 -m py_compile scripts/mojplaywin_live_routing_fingerprint.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_live_routing_fingerprint.py
      - name: Inspect .htaccess rewrites and legacy backup metadata (never restore)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_rewrite_backup_readonly.py'
          python3 -m py_compile scripts/mojplaywin_rewrite_backup_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_rewrite_backup_readonly.py
      - name: Read account domain types and backup list (no creation or restore)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_cpanel_domains_backups_readonly.py'
          python3 -m py_compile scripts/mojplaywin_cpanel_domains_backups_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'uapi --output=json DomainInfo list_domains' | python3 scripts/mojplaywin_cpanel_domains_backups_readonly.py --kind domains
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'uapi --output=json Backup list_backups' | python3 scripts/mojplaywin_cpanel_domains_backups_readonly.py --kind backups

      - name: Inventory backup prerequisites from file metadata only (NO backup created)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_restore_readiness_readonly.py'
          python3 -m py_compile scripts/mojplaywin_backup_restore_readiness_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_backup_restore_readiness_readonly.py

      - name: Read ONLY backend scheme hints from scoped config files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_db_backend_config_hints_readonly.py'
          python3 -m py_compile scripts/mojplaywin_db_backend_config_hints_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_db_backend_config_hints_readonly.py

      - name: Read-only off-host VPS storage and shared host backup tool prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_vps_destination_readonly.py'
          python3 -m py_compile scripts/mojplaywin_backup_vps_destination_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-vps python3 - vps < scripts/mojplaywin_backup_vps_destination_readonly.py
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - cpanel < scripts/mojplaywin_backup_vps_destination_readonly.py

      - name: Read-only UAPI MySQL database sizes and cPanel quota (redact identifiers)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_mysql_quota_sanitize_readonly.py'
          python3 -m py_compile scripts/mojplaywin_mysql_quota_sanitize_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'uapi --output=json Mysql list_databases' | python3 scripts/mojplaywin_mysql_quota_sanitize_readonly.py mysql
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'uapi --output=json Quota get_local_quota_info' | python3 scripts/mojplaywin_mysql_quota_sanitize_readonly.py quota

      - name: Read-only verify scoped MySQL login and bounded source-root disk sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_consistent_db_preflight_readonly.py'
          python3 -m py_compile scripts/mojplaywin_consistent_db_preflight_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 75s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_consistent_db_preflight_readonly.py

      - name: Read-only VPS private encrypted backup failure reason metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_vps_failure_readonly.py'
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-vps python3 - < scripts/mojplaywin_backup_vps_failure_readonly.py

      - name: Inspect VPS isolation runtime capability (no DB or container writes)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_isolated_restore_capabilities_readonly.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-vps python3 - < scripts/mojplaywin_isolated_restore_capabilities_readonly.py
