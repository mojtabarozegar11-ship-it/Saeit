name: Revenue P0 source-only non-deployment checks
on:
  push:
    branches:
      - work/revenue-dual-offer-readiness-20261114
    paths:
      - ".github/workflows/revenue-p0-source-only.yml"
      - "scripts/revenue_dual_offer_qualifier.py"
      - "scripts/revenue_intake_io.py"
      - "scripts/mojtaba_revenue_portfolio.py"
      - "scripts/mojtaba_revenue_cli.py"
      - "scripts/mojtaba_revenue_public_attestation_readonly.py"
      - "scripts/mojtaba_revenue_margin.py"
      - "tests/test_mojtaba_revenue*.py"
      - "tests/test_revenue_*.py"
      - "tests/test_mojtaba_qualifier_integration.py"
      - "docs/revenue-p0/**"
      - "core/templates/core/services.html"
      - "core/templates/mojplaywin/section.html"
      - "core/templates/brands/mojplaywin/page.html"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/revenue-p0-source-only.yml"
      - "scripts/revenue_dual_offer_qualifier.py"
      - "scripts/revenue_intake_io.py"
      - "scripts/mojtaba_revenue_portfolio.py"
      - "scripts/mojtaba_revenue_cli.py"
      - "scripts/mojtaba_revenue_public_attestation_readonly.py"
      - "scripts/mojtaba_revenue_margin.py"
      - "tests/test_mojtaba_revenue*.py"
      - "tests/test_revenue_*.py"
      - "tests/test_mojtaba_qualifier_integration.py"
      - "docs/revenue-p0/**"
      - "core/templates/core/services.html"
      - "core/templates/mojplaywin/section.html"
      - "core/templates/brands/mojplaywin/page.html"
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline unit/source contracts
        run: python3 -m unittest discover -s tests -p 'test_revenue_*.py' -v
      - name: Verify single-bot qualifier integration without network
        run: python3 -m unittest -v tests.test_mojtaba_qualifier_integration
      - name: Enforce ten-channel one-bot commercial gates and CLI invariants
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/revenue_intake_io.py scripts/mojtaba_revenue_portfolio.py scripts/mojtaba_revenue_cli.py scripts/mojtaba_revenue_margin.py scripts/mojtaba_revenue_public_attestation_readonly.py scripts/revenue_dual_offer_qualifier.py
          python3 -m unittest discover -s tests -p 'test_mojtaba_revenue*.py' -v
      - name: Prove sample portfolio and KPI outputs are expressly synthetic
        run: |
          set -euo pipefail
          python3 scripts/mojtaba_revenue_cli.py --catalog >/tmp/mojtaba-catalog.json
          python3 scripts/mojtaba_revenue_cli.py --qualify docs/revenue-p0/mojtaba-portfolio-inquiry.synthetic.json >/tmp/mojtaba-synthetic-inquiry.json
          python3 scripts/mojtaba_revenue_cli.py --synthetic-kpis docs/revenue-p0/mojtaba-portfolio-kpi.synthetic.json >/tmp/mojtaba-synthetic-kpis.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/mojtaba-catalog.json'))
          b=json.load(open('/tmp/mojtaba-synthetic-inquiry.json'))
          c=json.load(open('/tmp/mojtaba-synthetic-kpis.json'))
          assert len(a['offers'])==10 and a['canonical_bot']=='mojtaba.bot.ai'
          assert all(x['commercial_mode']=='inquiry_only' for x in a['offers'])
          assert b['canonical_bot']=='mojtaba.bot.ai' and b['payment_verified'] is False
          assert b['collected_revenue'] is None and b['auto_send'] is False
          assert c['synthetic_example'] is True and c['actual_revenue'] is None
          print('MOJTABA_SINGLE_BOT_PORTFOLIO=10; FINANCIAL_RELEASE=NO_GO; ACTUAL_REVENUE=UNKNOWN')
          PY
      - name: Observe public service pages and canonical domain via GET only
        run: |
          set -euo pipefail
          python3 scripts/mojtaba_revenue_public_attestation_readonly.py
      - name: Keep non-mutating public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojtaba-revenue-get-only-readiness
          path: ${{ runner.temp }}/mojtaba-revenue-attestation/
          retention-days: 7
          if-no-files-found: warn
      - name: Reject non-anonymized or phantom payment test output
        run: |
          python3 scripts/revenue_dual_offer_qualifier.py docs/revenue-p0/example-checkout-intake.synthetic.json > /tmp/revenue_checkout.json
          python3 scripts/revenue_dual_offer_qualifier.py docs/revenue-p0/example-farm-intake.synthetic.json > /tmp/revenue_farm.json
          python3 - <<'PY'
          import json
          for item in ('/tmp/revenue_checkout.json', '/tmp/revenue_farm.json'):
              result=json.load(open(item,encoding='utf-8'))
              assert result['canonical_bot']=='mojtaba.bot.ai'
              assert result['order_state']=='inquiry_only'
              assert result['payment_state']=='not_requested'
              assert result['delivery_state']=='not_delivered'
              assert result['personal_data_exported'] is False
          print('REVENUE_SOURCE_ONLY=passed; payment_and_delivery=UNVERIFIED')
          PY
