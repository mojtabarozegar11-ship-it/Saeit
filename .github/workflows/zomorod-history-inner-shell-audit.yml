name: Zomorod history & inner shell read-only audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-history-inner-shell-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Examine archival content and current public inner pages without changes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel python3 - <<'PY'
          import os,re,hashlib
          from pathlib import Path
          from html.parser import HTMLParser
          home=Path.home()
          root=home/'public_html'
          banned={'mohammad','ghanadi','amozeshgah','tala','education','business','site-heritage','static','admin'}
          class AuditParser(HTMLParser):
              def __init__(self):super().__init__();self.in_main=0;self.in_head=0;self.capture_h=False;self.h=[];self.text=[];self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='main':self.in_main+=1
                  elif tag=='head':self.in_head+=1
                  if tag in ('h1','h2','h3') and self.in_main:self.capture_h=True
                  if tag=='a' and self.in_main and a.get('href'):self.links.append(a.get('href'))
              def handle_endtag(self,tag):
                  if tag=='main':self.in_main=max(0,self.in_main-1)
                  if tag=='head':self.in_head=max(0,self.in_head-1)
                  if tag in ('h1','h2','h3'):self.capture_h=False
              def handle_data(self,data):
                  if self.in_main:
                      z=' '.join(data.split())
                      if z:self.text.append(z)
                      if z and self.capture_h and len(self.h)<20:self.h.append(z[:90])
          current=[]
          for dp,dirs,files in os.walk(root,followlinks=False):
              here=Path(dp);rel=here.relative_to(root)
              dirs[:]=[d for d in dirs if d not in banned and not d.startswith('.') and not d.startswith('__') and not (here/d).is_symlink()]
              if len(rel.parts)>5:dirs[:]=[];continue
              for name in files:
                  item=here/name;parts=item.relative_to(root).parts
                  if (name!='index.html' and parts!=('zm-specialist-library-2026.html',)) or item.is_symlink():continue
                  if any(p.startswith('__') for p in parts):continue
                  try:html=item.read_text(encoding='utf-8')
                  except Exception:continue
                  a=AuditParser()
                  try:a.feed(html)
                  except Exception:continue
                  current.append((str(item.relative_to(root)),html,a))
          current.sort()
          print('AUDIT_MAIN_HTML_COUNT='+str(len(current)))
          for rel,data,a in current:
              marker='zm-unified-v7-20261018' in data or 'zm-v7-header' in data
              print('CURRENT_PAGE',rel,'shell='+str(int(marker)),'main_chars='+str(len(' '.join(a.text))),'h_count='+str(len(a.h)),'img='+str(len(re.findall('<img',data,re.I))),'h1='+('|'.join(a.h[:2]))[:160])
          targets=[root/'site-heritage/home-before-v6-20261018/index.html',root/'site-heritage/home-before-redesign/index.html',root/'site-heritage/home-before-redesign/company/index.html',root/'site-heritage/home-before-redesign/about/index.html']
          for item in targets:
              if not item.is_file():print('HISTORIC_MISSING',str(item.relative_to(root)));continue
              data=item.read_text(encoding='utf-8',errors='replace');a=AuditParser();a.feed(data)
              print('HISTORIC_PAGE',str(item.relative_to(root)),'bytes='+str(len(data.encode())),'main_chars='+str(len(' '.join(a.text))),'h='+('|'.join(a.h[:12]))[:800],'links='+str(len(set(a.links))))
          snapshots=list((home/'.backups').glob('zomorod-v7-unify/*/original-pages.tar'))
          print('V7_ORIGINAL_TAR_COUNT='+str(len(snapshots)))
          for item in snapshots[:5]:print('V7_ORIGINAL_ARCHIVE',str(item.relative_to(home)),'bytes='+str(item.stat().st_size))
          print('CHECK_THEME_ASSET='+str((root/'static/site/zomorod-v7/inner-v7.css').is_file()))
          PY
      - name: Clean temporary keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
