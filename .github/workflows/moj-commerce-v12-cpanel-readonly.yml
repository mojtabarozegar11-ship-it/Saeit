name: MOJ Commerce v1.2 production MariaDB read-only prerequisites (NO DEPLOY)
on:
  push:
    branches: ['feature/moj-commerce-v12-mariadb-isolated-20261022']
    paths:
      - '.github/workflows/moj-commerce-v12-cpanel-readonly.yml'
      - 'tools/moj_commerce_v12_live_mariadb_readonly.py'
      - 'tests/test_moj_commerce_v12_readonly_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moj-commerce-v12-cpanel-readonly
  cancel-in-progress: false
jobs:
  verify-no-deploy:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/moj-commerce-v12-mariadb-isolated-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate sanitized metadata-only inspector without production access
        run: |
          python3 -m unittest -v tests.test_moj_commerce_v12_readonly_probe
          python3 -m py_compile tools/moj_commerce_v12_live_mariadb_readonly.py
      - name: Read production MariaDB metadata and hosting quota over pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$VPS_KEY" || -z "$HOST_KEY" ]]; then
            echo 'MOJ_COMMERCE_V12_RELAY=BLOCKED_MISSING_CREDENTIAL'; exit 1
          fi
          d="$RUNNER_TEMP/moj-commerce-v12-ssh"
          install -d -m 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net 2>/dev/null' > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
          timeout 100s ssh -T -F "$d/config" saeit-host 'python3 -' < tools/moj_commerce_v12_live_mariadb_readonly.py
          echo 'MOJ_COMMERCE_V12_RELAY_READONLY=COMPLETED'
          echo 'MOJ_COMMERCE_V12_PRODUCTION_WRITES=ZERO'
          echo 'MOJ_COMMERCE_V12_MIGRATIONS=ZERO'
          echo 'MOJ_COMMERCE_V12_PAYMENT_BROADCASTS=ZERO'
          echo 'MOJ_COMMERCE_V12_PRODUCTION_DEPLOYMENT=NONE'
