name: Check production settings bound to MojPlayWin staging database
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-django-active-database-settings-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-live-staging-db-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Evaluate effective Django database path and staging env DB references without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,subprocess
          H=Path.home()
          db=H/"Saeit-staging/mojplaywin.sqlite3"
          print("STAGING_SQLITE_EXISTS="+("yes" if db.is_file() else "no"))
          for loc in ("Saeit/.env","Saeit-staging/.env","Saeit/config/settings.py","Saeit-staging/config/settings.py","Saeit-staging/passenger_wsgi.py","Saeit/passenger_wsgi.py","public_html/.htaccess"):
              p=H/loc
              if not p.is_file():continue
              s=p.read_text(errors="ignore")
              matches=[]
              for line in s.splitlines():
                  t=line.strip()
                  if re.search(r"(?i)(database|sqlite|db_path|db_name|DATABASE_URL|Saeit-staging)",t):
                      # Never print secrets: only named signals.
                      for marker in ("mojplaywin.sqlite3","db.sqlite3","DATABASE_URL","DATABASES","SQLITE","Saeit-staging"):
                          if marker.lower() in t.lower():matches.append(marker)
              print("ACTIVE_DB_CONFIG="+loc+" markers="+",".join(sorted(set(matches))))
          for dirstr in ("Saeit","Saeit-staging"):
              root=H/dirstr
              p=root/".venv/bin/python"
              if not p.is_file():p=H/"Saeit/.venv/bin/python"
              if not p.is_file():continue
              command="import sys;sys.path.insert(0,"+repr(str(root))+");import os;os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings');from django.conf import settings;print(str(settings.DATABASES.get('default',{}).get('NAME','')))"
              r=subprocess.run([str(p),"-c",command],cwd=root,capture_output=True,text=True,timeout=15)
              name=r.stdout.strip().splitlines()[-1] if r.returncode==0 and r.stdout.strip() else "[unavailable]"
              print("EFFECTIVE_DJANGO_DATABASE="+dirstr+" path="+name[:200])
          print("SETTINGS_DB_CHECK_DONE=yes")
          PY
          REMOTE
      - name: Remove ephemeral keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"

# Owner-requested read-only production/staging database binding audit, 2026-10-28.
