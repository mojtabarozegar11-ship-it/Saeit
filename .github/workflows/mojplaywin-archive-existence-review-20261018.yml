name: MojPlayWin priced digital archive existence, safe metadata audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-archive-existence-review-20261018.yml"]
permissions:
  contents: read
jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect integrity and presence of private product artifacts, never expose file paths
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 95s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          cd /home/zomorod2/Saeit-staging
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,json,pathlib,re,zipfile
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from core.models import Product
          root=pathlib.Path('/home/zomorod2').resolve()
          rows=[]
          for p in Product.objects.filter(price__gt=0).order_by('pk'):
            m=p.metadata if isinstance(p.metadata,dict) else {}
            record={'id':p.pk,'positive_price':p.price>0,'rights_declared':m.get('owner_exclusive_rights_declared') is True}
            for k in ('factory_status','factory_state','factory_publication_permission',
                      'factory_software_qa','third_party_license_audit','fulfillment_status'):
              v=m.get(k,None)
              if isinstance(v,bool):record[k]=v
              elif isinstance(v,(int,float)):record[k]=v
              elif isinstance(v,str):record[k]=re.sub('[^a-zA-Z0-9_ -]','_',v[:66])
              elif v is None:record[k]='unset'
              else:record[k]='structured'
            for key in ('factory_archive_private','factory_inbox_relative_ref'):
              value=m.get(key)
              state={'metadata_present':bool(value),'safe_regular_file':False,'nonzero_bytes':False,'recognized_archive':False}
              if isinstance(value,str) and value and len(value)<500:
                try:
                  path=pathlib.Path(value)
                  if not path.is_absolute():path=(root/'Saeit-staging'/path)
                  resolved=path.resolve(strict=False)
                  if root in resolved.parents and resolved.is_file() and not resolved.is_symlink():
                    state['safe_regular_file']=True
                    state['nonzero_bytes']=resolved.stat().st_size>1000
                    if resolved.suffix.lower()=='.zip' and resolved.stat().st_size<100000000:
                      state['recognized_archive']=zipfile.is_zipfile(resolved)
                except (OSError,ValueError):pass
              record[key]=state
            rows.append(record)
          print('MPW_PRODUCT_ARTIFACT_GATE='+json.dumps(rows))
          PY
          BASH
