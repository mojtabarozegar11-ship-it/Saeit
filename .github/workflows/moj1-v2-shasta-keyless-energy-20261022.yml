name: MOJ1 V2 keyless Shasta energy simulation (no broadcast)
on:
  push:
    branches: ['moj1/shasta-pilot-20261021']
    paths:
      - '.github/workflows/moj1-v2-shasta-keyless-energy-20261022.yml'
      - 'experiments/moj1-pilot/contracts/MojCoinGuarded.sol'
      - 'experiments/moj1-pilot/contracts/MojGenesisFactoryGuarded.sol'
      - 'experiments/moj1-pilot/scripts/v2-shasta-energy-readonly.mjs'
      - 'experiments/moj1-pilot/package-lock.json'
      - 'experiments/moj1-pilot/shasta-deployment.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moj1-v2-shasta-keyless-${{ github.ref }}
  cancel-in-progress: false
jobs:
  keyless-shasta-estimate:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/moj1/shasta-pilot-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated pilot tooling
        working-directory: experiments/moj1-pilot
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile V2 without broadcasting
        working-directory: experiments/moj1-pilot
        run: npm run compile
      - name: Read-only Shasta contract-creation Energy simulation
        working-directory: experiments/moj1-pilot
        env:
          MOJ1_SHASTA_ENERGY_READONLY: YES_KEYLESS_NO_BROADCAST
        run: |
          node scripts/v2-shasta-energy-readonly.mjs
          echo 'MOJ1_SHASTA_V2_BROADCAST=NO'
          echo 'MOJ1_WALLET_SECRETS_USED=NO'
          echo 'MOJ1_MAINNET_RELEASE=BLOCKED'
      - name: Retain untrusted estimation result for independent review
        uses: actions/upload-artifact@v4
        with:
          name: moj1-v2-shasta-keyless-energy-${{ github.run_id }}
          path: experiments/moj1-pilot/artifacts/v2-shasta-energy-readonly.json
          if-no-files-found: error
          retention-days: 14
