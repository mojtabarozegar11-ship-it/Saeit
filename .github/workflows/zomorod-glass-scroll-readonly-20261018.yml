name: Zomorod glass real scroll and usability diagnostic 20261018
on:
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-glass-scroll-readonly-20261018.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Chromium mobile and desktop real movement and accessibility probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zm-glass-scroll"
          cd "$RUNNER_TEMP/zm-glass-scroll"
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0
          npx playwright install chromium
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const conf of [{width:1440,mobile:false},{width:390,mobile:true},{width:320,mobile:true}]){
              const page=await browser.newPage({
                viewport:{width:conf.width,height:860},isMobile:conf.mobile,hasTouch:conf.mobile,
                deviceScaleFactor:conf.mobile?2:1
              });
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e).slice(0,300)));
              await page.addInitScript(()=>{
                window.__zmShifts=0;
                try{
                  new PerformanceObserver(list=>list.getEntries().forEach(e=>{
                    if(!e.hadRecentInput)window.__zmShifts+=e.value;
                  })).observe({type:'layout-shift',buffered:true});
                }catch(_){}
              });
              await page.goto('https://zomorodmelal.ir/?__glass_scroll_audit='+conf.width,
                {waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('.topic-card').first().waitFor({timeout:22000});
              const info=await page.evaluate(async()=>{
                const cards=[...document.querySelectorAll('.topic-card')];
                const tracks=[...document.querySelectorAll('.card-track')];
                const shelves=[...document.querySelectorAll('.orbit-shelf')];
                const target=shelves[14];
                target.scrollIntoView({behavior:'instant',block:'center'});
                await new Promise(r=>setTimeout(r,850));
                const visibleCards=cards.filter(c=>{
                  const r=c.getBoundingClientRect();
                  return r.top<innerHeight&&r.bottom>0&&r.left<innerWidth&&r.right>0;
                });
                const active=visibleCards.find(c=>c.closest('.card-track'))||cards[0];
                const track=active.closest('.card-track');
                const originalScroll=track.scrollLeft;
                const direction=getComputedStyle(track).direction;
                let desired=direction==='rtl'?-120:120;
                track.scrollLeft=originalScroll+desired;
                await new Promise(r=>setTimeout(r,400));
                const scrollChange=track.scrollLeft-originalScroll;
                const card=active;
                const label=card.querySelector('.topic-name');
                const computed=getComputedStyle(card);
                const labelComputed=getComputedStyle(label);
                const ratio=(rect)=>[Math.round(rect.left),Math.round(rect.top),Math.round(rect.width),Math.round(rect.height)];
                const baselineRows=tracks.slice(0,6).map(x=>[x.offsetTop,x.offsetHeight,x.offsetWidth]);
                const style=document.getElementById('zm-glass-floating-cards-20261018');
                const withStyle=style?.sheet;
                if(withStyle)withStyle.disabled=true;
                const withoutRows=tracks.slice(0,6).map(x=>[x.offsetTop,x.offsetHeight,x.offsetWidth]);
                if(withStyle)withStyle.disabled=false;
                const report={
                  cardCount:cards.length,rowCount:tracks.length,shelves:shelves.length,
                  scrollHeight:document.scrollingElement.scrollHeight,
                  mobileViewport:innerWidth,
                  scrollY:scrollY,
                  availableVisible:visibleCards.length,
                  firstActive:ratio(card.getBoundingClientRect()),
                  label:ratio(label.getBoundingClientRect()),
                  labelText:label.textContent.slice(0,80),
                  scrollChange,direction,
                  activeCardHref:card.getAttribute('href'),
                  labelColor:labelComputed.color,
                  labelBg:labelComputed.backgroundImage,
                  outline:computed.outlineStyle,
                  glass:computed.backdropFilter,
                  animation:computed.animationName,
                  transform:computed.transform,
                  rowGeometryStable:JSON.stringify(baselineRows)===JSON.stringify(withoutRows),
                  layoutShift:window.__zmShifts||0,
                  animationCount:document.getAnimations().length,
                  imageLoaded:!!card.querySelector('img')?.naturalWidth,
                  pauseControl:!!document.querySelector('.motion-toggle,[aria-label*="حرکت"],[id*="motion"]'),
                  motionClass:document.documentElement.className+' '+document.body.className
                };
                return report;
              });
              console.log('GLASS_SCROLL_DIAG='+JSON.stringify({config:conf,...info,pageErrors}));
              if(info.cardCount!==605||info.rowCount!==29||info.shelves!==29||
                !info.rowGeometryStable||info.glass==='none'||info.animation==='none'||
                info.availableVisible<1||pageErrors.length>0)throw Error('Structural browser regression '+conf.width);
              await page.close();
            }
            await browser.close();
            console.log('GLASS_SCROLL_READONLY_COMPLETE=yes');
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS
          node audit.cjs
