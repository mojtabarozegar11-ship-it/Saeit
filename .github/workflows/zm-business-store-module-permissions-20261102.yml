name: ZM guarded private store module permissions repair
on:
  push:
    branches: [feature/zm-business-php-persian-reports-20261102]
    paths: [".github/workflows/zm-business-store-module-permissions-20261102.yml"]
permissions:
  contents: read
concurrency:
  group: zm-live-php-private-reports-only
  cancel-in-progress: false
jobs:
  store-module-permissions:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
      - name: Restrict change scope to existing private file mode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -f content/zomorod-business/app.php
          php -l content/zomorod-business/app.php
          echo 'FILE_PERMISSION_ONLY_SCOPE=confirmed'
      - name: Configure pinned GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-store-permission-fix"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"

      - name: Repair exactly one private store module permission with automatic rollback
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-store-permission-fix"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          commit="$1"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          root="$HOME/.private/zomorod-business"
          store="$root/site_store.php"
          backup="$HOME/.backups/zm-store-private-mode/$commit"
          phpbin="$(command -v php || echo /opt/cpanel/ea-php82/root/usr/bin/php)"
          test -d "$root" && test ! -L "$root"
          test -f "$store" && test ! -L "$store"
          test "$(stat -c %a "$store")" = 644
          test "$(stat -c %u "$store")" = "$(id -u)"
          "$phpbin" -l "$store" >/dev/null
          test ! -e "$backup" && test ! -L "$backup"
          install -d -m 700 "$backup"
          cp -p "$store" "$backup/site_store.before.php"
          chmod 600 "$backup/site_store.before.php"
          sha_before="$(sha256sum "$store" | awk '{print $1}')"
          test "$(sha256sum "$backup/site_store.before.php" | awk '{print $1}')" = "$sha_before"
          printf '%s\n' "$sha_before" > "$backup/content.before.sha256"
          chmod 600 "$backup/content.before.sha256"
          changed=0
          active=1
          rollback() {
            if test "$changed" = 1; then
              if chmod 644 "$store"; then
                echo 'STORE_PERMISSION_ROLLBACK=restored_original_644'
              else
                echo 'STORE_PERMISSION_ROLLBACK=FAILED' >&2
              fi
            fi
          }
          trap 'rc=$?; trap - EXIT; if test "$active" = 1; then rollback; fi; exit "$rc"' EXIT
          changed=1
          chmod 600 "$store"
          test "$(stat -c %a "$store")" = 600
          test "$(sha256sum "$store" | awk '{print $1}')" = "$sha_before"
          "$phpbin" -l "$store" >/dev/null
          html="$(curl -fsSL --connect-timeout 8 --max-time 25 'https://zomorodmelal.ir/business/?page=store_manager')"
          grep -Fq 'ورود مدیر و حسابدار' <<<"$html"
          active=0
          trap - EXIT
          echo 'STORE_MODULE_MODE_BEFORE=644'
          echo 'STORE_MODULE_MODE_AFTER=600'
          echo 'STORE_MODULE_CONTENT_SHA=unchanged'
          echo 'STORE_PAGE_ANONYMOUS_GATE=verified'
          echo 'STORE_MODULE_BACKUP=private_preserved'
          echo 'FINANCIAL_DB_WRITES=none'
          REMOTE
      - name: Clean transient keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/zm-store-permission-fix"
