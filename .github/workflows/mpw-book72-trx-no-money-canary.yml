name: MojPlayWin book72 TRX mainnet nonpayment canary
on:
  push:
    branches: [audit/mpw-book72-go-live-gates-20261015]
    paths: [.github/workflows/mpw-book72-trx-no-money-canary.yml]
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare pinned SSH connections to authorized site host
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/astra-live-payment"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/$item.key"
            chmod 600 "$d/$item.key"
            ssh-keygen -y -P '' -f "$d/$item.key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Mainnet read-only validation with synthetic one-sun attempt
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/astra-live-payment/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/Saeit-staging"
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONPATH="$app"
          cd "$app"
          for py in "$HOME/virtualenv/Saeit-staging/3.11/bin/python" "$app/.venv/bin/python" "$HOME/virtualenv/Saeit-staging/3.10/bin/python"; do
            if test -x "$py" && "$py" -c 'import django' >/dev/null 2>&1; then
              "$py" - <<'PY'
          import django
          django.setup()
          from decimal import Decimal
          from datetime import datetime,timezone
          from django.conf import settings
          from core.models import Product,Order,PaymentIntent,LedgerEntry
          from scripts.mojplaywin_direct_wallet_rates import fetch_fresh_rates
          from scripts.mojplaywin_native_chain_verify import (
              LockedQuote,verify_trx_transfer,VerificationError,TRX_RECEIVER
          )
          from scripts.mojplaywin_native_rpc_clients import (
              tron_solidity_rpc,NativeRpcUnavailable
          )
          product=Product.objects.get(pk=72)
          if product.price!=Decimal("7.50") or product.active:
              raise RuntimeError("Refuse canary on a changed or public book")
          if getattr(settings,"MPW_COMMERCE_RELEASE_READY",False) is True:
              raise RuntimeError("Refuse canary when money collection is enabled")
          before=(Order.objects.count(),PaymentIntent.objects.count(),LedgerEntry.objects.count())
          from mpw_commerce.models import CommerceInvoice,CommerceReceipt
          before_native=(CommerceInvoice.objects.count(),CommerceReceipt.objects.count())
          rates=fetch_fresh_rates()
          trx_rate=Decimal(rates["TRX"].usd_per_asset)
          sun_value=trx_rate/Decimal(1000000)
          assert sun_value>0 and sun_value<product.price
          expected_sun=int((product.price/trx_rate*Decimal(1000000)).to_integral_value())
          print("MPW_ONE_SUN_VALUE_LESS_THAN_BOOK_PRICE=YES")
          print("MPW_TRX_REQUIRED_MORE_THAN_ONE_SUN="+str(expected_sun>1))
          print("MPW_TRX_QUOTE_IS_NOT_AN_INVOICE=YES")
          now=int(datetime.now(timezone.utc).timestamp()*1000)
          quote=LockedQuote(
              order_id=72,network="tron-mainnet",smallest_units=1,
              expected_sender=TRX_RECEIVER,
              created_at_ms=now-60000,expires_at_ms=now+60000,
              quote_currency="USD",quote_amount="7.50")
          txhash="0"*64
          try:
              verify_trx_transfer(txhash,quote,tron_solidity_rpc)
          except VerificationError:
              print("MPW_FAKE_ONE_SUN_TRX_MAINNET_TX_REJECTED=YES")
          except NativeRpcUnavailable:
              print("MPW_TRX_RPC_UNAVAILABLE_NO_PAYMENT_ACCEPTED=YES")
          else:
              raise RuntimeError("Unexpected proof from a nonexistent TRON transaction")
          assert before==(Order.objects.count(),PaymentIntent.objects.count(),LedgerEntry.objects.count())
          assert before_native==(CommerceInvoice.objects.count(),CommerceReceipt.objects.count())
          print("MPW_ORDERS_RECEIPTS_LEDGER_UNCHANGED=YES")
          print("MPW_BOOK72_UNPUBLISHED=YES")
          print("MPW_REAL_MONEY_TRANSFER_PERFORMED=NO")
          PY
              exit 0
            fi
          done
          exit 1
          REMOTE
      - name: Clean temporary identities
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/astra-live-payment"
