name: MojPlayWin post-remediation storefront security and system regression
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-post-repair-regression-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Validate live security, site routes, revenue state and heartbeat staff display
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 140s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import json,urllib.request,urllib.parse,urllib.error,os,sys,pathlib,time
          root=pathlib.Path('/home/zomorod2/Saeit-staging')
          os.chdir(root);sys.path.insert(0,str(root));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.core import checks
          from core.models import Product,OrderItem
          from mpw_commerce.models import CommerceInvoice,CommerceReceipt,CommerceFulfillment
          from command_center.mpw_two_books_panel import _status_dict
          issues=checks.run_checks(include_deployment_checks=True)
          status=_status_dict()
          worker=status.get('worker',{})
          print('MPW_REPAIR_PANEL_HEALTH='+json.dumps({'heartbeat_present':worker.get('present'),
            'healthy':worker.get('healthy'),'state':worker.get('state'),
            'age_seconds':worker.get('age_seconds'),
            'panel_orders':status.get('orders_total'),'verified_receipts':status.get('verified_receipts_count'),
            'revenue_usd':status.get('confirmed_revenue_usd'),
            'duplicate_namespace':any(i.id=='urls.W005' for i in issues),
            'django_check_ids':[i.id for i in issues]}))
          sites=[('main','https://mojplaywin.com/'),
            ('store','https://mojplaywin.com/store/'),
            ('game','https://mojplaywin.com/games/crown-defender/'),
            ('private_subsystem','https://mojplaywin.com/picm/'),
            ('research_host','https://zomorodmelal.ir/'),
            ('gold_subsite','https://zomorodmelal.ir/tala/')]
          for name,url in sites:
            req=urllib.request.Request(url,headers={'User-Agent':'MojPlayWin-PostRelease-Regressions/1','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=12) as response:
                read=response.read(115000)
                report={'site':name,'http':response.status,
                 'mime':response.headers.get('Content-Type','').split(';')[0],
                 'hsts':response.headers.get('Strict-Transport-Security',''),
                 'csp':response.headers.get('Content-Security-Policy','')[:130],
                 'target':urllib.parse.urlparse(response.geturl()).path}
                if name=='store':
                  txt=read.decode('utf8','replace')
                  report['buy_links']=txt.count('class="mpw-crypto-buy"')
                print('MPW_REPAIR_HTTP='+json.dumps(report))
            except urllib.error.HTTPError as exc:
              print('MPW_REPAIR_HTTP='+json.dumps({'site':name,'http':exc.code}))
            except Exception as exc:
              print('MPW_REPAIR_HTTP='+json.dumps({'site':name,'error':type(exc).__name__}))
          for pid in (72,225):
            p=Product.objects.get(pk=pid)
            print('MPW_REPAIR_BOOK='+json.dumps({'id':pid,'active':p.active,'price':str(p.price)}))
          ids=OrderItem.objects.filter(product_id__in=(72,225)).values_list('order_id',flat=True)
          print('MPW_REPAIR_COMMERCE_COUNTS='+json.dumps({
            'invoices':CommerceInvoice.objects.filter(order_id__in=ids).count(),
            'receipts':CommerceReceipt.objects.filter(invoice__order_id__in=ids).count(),
            'fulfillments':CommerceFulfillment.objects.filter(item__product_id__in=(72,225)).count()}))
          PY
          BASH
