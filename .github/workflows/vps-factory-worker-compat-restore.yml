name: VPS Factory Validation Worker ABI Repair (manual, no task execution)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-factory-worker-compat-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate the isolated worker source
        run: |
          set -euo pipefail
          python3 -m py_compile core/factory_worker_compat.py core/management/commands/factory_product_step.py
          python3 -m unittest discover -s tests -p 'test_factory_worker_compat_contract.py' -v
      - name: Install pinned compatibility entrypoint without running tasks
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          work="$RUNNER_TEMP/factory-worker-compat"
          install -d -m 700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$work/key"
          chmod 600 "$work/key"
          ssh-keygen -y -P '' -f "$work/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$work/known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known" -o ConnectTimeout=15)
          tar -cf "$work/bundle.tar" core/factory_worker_compat.py core/management/commands/factory_product_step.py
          digest="$(sha256sum "$work/bundle.tar" | awk '{print $1}')"
          ssh "${opts[@]}" githubops@178.239.147.150 'install -d -m 700 /home/githubops/factory-runtime/operations/factory-worker-abi-repair'
          scp "${opts[@]}" "$work/bundle.tar" githubops@178.239.147.150:/home/githubops/factory-runtime/operations/factory-worker-abi-repair/bundle.tar
          ssh "${opts[@]}" githubops@178.239.147.150 python3 - "$digest" <<'REMOTE'
          import hashlib
          from datetime import datetime, timezone
          import os
          import pathlib
          import pwd
          import py_compile
          import subprocess
          import sys
          import tarfile
          import tempfile

          expected_archive_digest = sys.argv[1]
          operations = pathlib.Path('/home/githubops/factory-runtime/operations/factory-worker-abi-repair')
          app = pathlib.Path('/home/githubops/factory-runtime/django-app')
          archive = operations / 'bundle.tar'
          command_rel = 'core/management/commands/factory_product_step.py'
          compat_rel = 'core/factory_worker_compat.py'
          expected_paths = {command_rel, compat_rel}
          original_command_sha = '16db26a1add66cd4cb9e96c8f992441d15e4324f6ffbb763189a0be923032978'
          pinned_worker_sha = '3b890e7f2d9f383130a4aa711f6b251ee124a7a903ebdd2a29acf3278368bbee'
          pinned_runtime_sha = '9cebdf4a60162b6b9c7b1a36364baa9748395ce42e8e0f86bacfaa82a422731b'

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def abort(message):
              raise SystemExit(message)

          if os.geteuid() == 0 or pwd.getpwuid(os.geteuid()).pw_name != 'githubops':
              abort('FACTORY_ABI_REPAIR_REFUSES_ROOT')
          if digest(archive.read_bytes()) != expected_archive_digest:
              abort('FACTORY_ABI_REPAIR_ARCHIVE_MISMATCH')
          if not app.is_dir() or app.is_symlink():
              abort('FACTORY_ABI_REPAIR_APP_ROOT_MISSING')
          if digest((app/'core/worker_runner.py').read_bytes()) != pinned_worker_sha:
              abort('FACTORY_ABI_REPAIR_WORKER_CHANGED')
          if digest((app/'core/task_runtime.py').read_bytes()) != pinned_runtime_sha:
              abort('FACTORY_ABI_REPAIR_TASK_RUNTIME_CHANGED')

          with tarfile.open(archive, mode='r:') as tar:
              members = tar.getmembers()
              if {member.name for member in members} != expected_paths or not all(
                  member.isfile() and not member.issym() and not member.islnk()
                  and member.size < 50000 for member in members
              ):
                  abort('FACTORY_ABI_REPAIR_UNEXPECTED_ARCHIVE_MEMBERS')
              sources = {m.name: tar.extractfile(m).read() for m in members}

          for rel in expected_paths:
              target = app / rel
              if target.is_symlink() or not target.parent.is_dir():
                  abort('FACTORY_ABI_REPAIR_UNSAFE_TARGET')
          old_command = app / command_rel
          if not old_command.is_file():
              abort('FACTORY_ABI_REPAIR_ORIGINAL_COMMAND_MISSING')
          current_hash = digest(old_command.read_bytes())
          if current_hash not in {original_command_sha, digest(sources[command_rel])}:
              abort('FACTORY_ABI_REPAIR_COMMAND_CHANGED')
          if (app/compat_rel).exists() and digest((app/compat_rel).read_bytes()) != digest(sources[compat_rel]):
              abort('FACTORY_ABI_REPAIR_COMPAT_TARGET_CHANGED')

          # Preserve original bytes and allow a complete rollback if the live
          # Django import of either module fails. No task or scheduler is run.
          with tempfile.TemporaryDirectory(prefix='factory-worker-repair-', dir=str(operations)) as staging:
              stage = pathlib.Path(staging)
              originals = {rel: (app/rel).read_bytes() if (app/rel).exists() else None
                           for rel in expected_paths}
              backup = operations/'backups'/datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
              backup.mkdir(parents=True, mode=0o700, exist_ok=False)
              for rel, original in originals.items():
                  if original is not None:
                      saved = backup/(pathlib.Path(rel).name+'.original')
                      saved.write_bytes(original)
                      saved.chmod(0o600)
              (backup/'manifest.txt').write_text(
                  '\n'.join(rel+':'+(digest(original) if original is not None else 'not_present')
                            for rel, original in sorted(originals.items())), encoding='utf-8')
              try:
                  for rel in (compat_rel, command_rel):
                      target = app / rel
                      tmp = stage / pathlib.Path(rel).name
                      tmp.write_bytes(sources[rel])
                      py_compile.compile(str(tmp), doraise=True)
                      tmp.chmod(0o644)
                      os.replace(tmp, target)
                  env = dict(os.environ, SAEIT_ENV='production', MOJ_FACTORY_LOCAL_MODE='1',
                             DJANGO_SETTINGS_MODULE='config.settings',
                             MOJ_PAID_LLM_ENABLED='0', MOJ_LLM_DAILY_CALL_BUDGET='0',
                             MOJ_LLM_MAX_COST_MINOR='0')
                  probe = subprocess.run([
                      '/home/githubops/factory-runtime/.venv/bin/python', '-B', '-c',
                      'import django; django.setup(); '
                      'from core.factory_worker_compat import FactoryWorkerCompatibility; '
                      'from core.management.commands.factory_product_step import Command; '
                      'assert FactoryWorkerCompatibility.ALLOWED_ACTIONS == frozenset({"product_validation"}); '
                      'assert Command is not None'
                  ], cwd=str(app), env=env, capture_output=True, text=True, timeout=30)
                  if probe.returncode:
                      raise RuntimeError('Factory Django import failed: '+probe.stderr[-600:])
              except Exception:
                  for rel, original in originals.items():
                      target = app / rel
                      if original is None:
                          target.unlink(missing_ok=True)
                      else:
                          restore = stage / (pathlib.Path(rel).name+'.rollback')
                          restore.write_bytes(original)
                          restore.chmod(0o644)
                          os.replace(restore, target)
                  print('FACTORY_ABI_REPAIR_ROLLED_BACK')
                  raise
          print('FACTORY_ABI_REPAIR_INSTALLED_IMPORT_VERIFIED_TASKS_EXECUTED_0')
          REMOTE
