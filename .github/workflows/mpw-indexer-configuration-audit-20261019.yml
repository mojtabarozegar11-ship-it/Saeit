name: MojPlayWin indexer dependency error reason read only
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-indexer-configuration-audit-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect only public scanner configuration and non-secret control flow
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 130s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,pathlib,ast,json,re,inspect
          r=pathlib.Path('/home/zomorod2/Saeit-staging')
          os.chdir(r);sys.path.insert(0,str(r))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.conf import settings
          packages=['scripts/mojplaywin_direct_wallet_discovery.py','mpw_commerce/trusted_chain.py','mpw_commerce/auto_reconcile.py']
          for fn in packages:
            f=r/fn
            if not f.is_file():continue
            src=f.read_text('utf8','replace')
            tree=ast.parse(src)
            result={'file':fn,'functions':[],'settings_keys':sorted(set(x.value for x in ast.walk(tree)
                if isinstance(x,ast.Constant) and isinstance(x.value,str) and re.match(r'^(?:MPW|TRON|ETH|INDEXER|RPC)_[A-Z0-9_]+$',x.value)))}
            for node in tree.body:
              if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):continue
              if node.name not in ('fetch_indexer','discover_eth','discover_trx','ethereum_rpc','tron_solidity_rpc',
                 'verify_with_trusted_rpc','reconcile_pending_orders'):continue
              lines=[]
              for line in src.splitlines()[node.lineno-1:node.end_lineno]:
                if any(t in line.lower() for t in ('secret','api_key','private_key','mnemonic','recipient=','wallet_address','token=','auth_header')):continue
                clean=re.sub(r'https?://[^ \t)"\\]+','[https-endpoint]',line)
                clean=re.sub(r'0x[a-fA-F0-9]{30,}|T[1-9A-HJ-NP-Za-km-z]{33}','[public-address]',clean)
                lines.append(clean[:170])
              result['functions'].append({'name':node.name,'code':lines[:130]})
            print('MPW_INDEXER_DEPENDENCY='+json.dumps(result))
          for key in ('MPW_ETHERSCAN_API_KEY','MPW_TRONGRID_API_KEY','MPW_ETH_RPC_URL','MPW_TRON_RPC_URL'):
            print('MPW_INDEXER_RUNTIME='+json.dumps({'name':key,'configured':bool(getattr(settings,key,None) or os.environ.get(key))}))
          PY
          BASH
