name: MojPlayWin Astra previews - Django route recovery

on:
  push:
    branches: [factory/astra-commercial-catalog-20261015]
    paths:
      - .github/workflows/astra-four-preview-django-route.yml
      - core/astra_preview_views.py
      - scripts/astra_mpw_route_install.py
      - tests/test_astra_mpw_route_install.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-four-preview-django-route
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Safety tests for narrow, reversible route patch
        run: |
          python3 -m py_compile core/astra_preview_views.py scripts/astra_mpw_route_install.py
          python3 -m unittest discover -s tests -p test_astra_mpw_route_install.py -v

  install-and-verify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare trusted VPS and host relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/astra-route-fix"
          install -d -m 700 "$d"
          for key in VPS_KEY HOST_KEY; do
            test -n "${!key}"
            printf '%s' "${!key}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/$key"
            chmod 600 "$d/$key"
            ssh-keygen -y -P '' -f "$d/$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY
            UserKnownHostsFile $d/vps.known
          Host host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            ProxyJump vps
            IdentityFile $d/HOST_KEY
            UserKnownHostsFile $d/host.known
          Host *
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 12
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
      - name: Install safe allowlisted Django preview route only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/astra-route-fix"
          ssh -F "$d/config" host 'test -f "$HOME/Saeit-staging/config/urls.py" && test -f "$HOME/mojplaywin.com/factory-previews/index.html"'
          scp -q -F "$d/config" core/astra_preview_views.py 'host:.saeit-astra-four-inbox/astra_preview_views.py'
          scp -q -F "$d/config" scripts/astra_mpw_route_install.py 'host:.saeit-astra-four-inbox/astra_mpw_route_install.py'
          ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -eEuo pipefail
          umask 077
          app="$HOME/Saeit-staging"
          inbox="$HOME/.saeit-astra-four-inbox"
          doc="$HOME/mojplaywin.com"
          py="$HOME/virtualenv/Saeit-staging/3.11/bin/python"
          test -x "$py"
          test "$(id -un)" = zomorod2
          test -f "$doc/factory-previews/circuit-courier/index.html"
          old="$(mktemp "$inbox/.old-astra-urls-XXXXXXXX")"
          cp -p "$app/config/urls.py" "$old"
          rollback() {
            cp -p "$old" "$app/config/urls.py"
            echo ASTRA_PREVIEW_ROUTE_ROLLED_BACK=1
          }
          trap 'rollback' ERR
          "$py" "$inbox/astra_mpw_route_install.py" --app "$app" --module-source "$inbox/astra_preview_views.py" --backups "$inbox"
          "$py" "$inbox/astra_mpw_route_install.py" --app "$app" --module-source "$inbox/astra_preview_views.py" --backups "$inbox" --apply
          cd "$app"
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONPATH="$app"
          "$py" -m django check
          "$py" - <<'PY'
          import django
          django.setup()
          from django.test import Client
          from django.urls import resolve
          from django.apps import apps
          checks=["/factory-previews/","/factory-previews/circuit-courier/",
                  "/factory-previews/farm-procurement-audit/",
                  "/factory-previews/farm-water-land-margin-audit/",
                  "/factory-previews/orchard-decision-audit/"]
          for url in checks:
              response=Client(HTTP_HOST="mojplaywin.com").get(url,secure=True,follow=True)
              assert response.status_code==200,(url,response.status_code)
              assert b"MojPlayWin" in response.content
              print("ASTRA_INTERNAL_PREVIEW_ROUTE="+url+":200")
          for url in checks[:2]:
              outside=Client(HTTP_HOST="zomorodmelal.ir").get(url,secure=True)
              assert outside.status_code != 200,(url,outside.status_code)
              print("ASTRA_PREVIEW_CROSS_DOMAIN_NOT_SERVED="+str(outside.status_code))
          unknown=Client(HTTP_HOST="mojplaywin.com").get(
              "/factory-previews/unlisted-product/",secure=True)
          assert unknown.status_code != 200,unknown.status_code
          product=apps.get_model("core","Product")
          assert product.objects.filter(active=True,metadata__astra_sku__startswith="ASTRA-").count()==0
          print("ASTRA_PREVIEW_DJANGO_ROUTE_CHECK=PASSED")
          print("ASTRA_PREVIEW_ACTIVE_FACTORY_PRODUCTS=0")
          PY
          trap - ERR
          rm -f "$old"
          mkdir -p "$doc/tmp"
          touch "$doc/tmp/restart.txt"
          echo ASTRA_PREVIEW_PASSENGER_RESTART_TRIGGERED=1
          REMOTE
      - name: Check public URLs after Django reload
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/astra-route-fix"
          status=""
          for attempt in 1 2 3 4; do
            status="$(curl -sSL --max-time 18 -o "$d/catalog.html" -w '%{http_code}' 'https://mojplaywin.com/factory-previews/' || true)"
            if test "$status" = 200 && grep -q 'Four original digital product previews' "$d/catalog.html"; then
              break
            fi
            sleep 4
          done
          echo ASTRA_PREVIEW_PUBLIC_CATALOG_HTTP="$status"
          test "$status" = 200
          grep -q 'Four original digital product previews' "$d/catalog.html"
          for slug in circuit-courier farm-procurement-audit farm-water-land-margin-audit orchard-decision-audit; do
            status="$(curl -sSL --max-time 20 -o "$d/$slug.html" -w '%{http_code}' "https://mojplaywin.com/factory-previews/$slug/" || true)"
            echo ASTRA_PREVIEW_PUBLIC_ITEM="$slug:$status"
            test "$status" = 200
            grep -q 'Not available for purchase' "$d/$slug.html"
          done
          status="$(curl -sSL --max-time 20 -o "$d/store.html" -w '%{http_code}' 'https://mojplaywin.com/store/')"
          echo ASTRA_PREVIEW_STORE_HTTP="$status"
          test "$status" = 200
          grep -q 'ASTRA EARLY PREVIEW' "$d/store.html"
          echo ASTRA_PREVIEW_FOUR_PUBLIC_DETAIL_PAGES=VERIFIED
          echo ASTRA_PREVIEW_PAID_CHECKOUT=NOT_OPEN
      - name: Cleanup ephemeral keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/astra-route-fix"
