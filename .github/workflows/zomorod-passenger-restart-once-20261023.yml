name: One-time guarded Zomorod Passenger restart 20261023
on:
  push:
    branches: [zomorod/about-science-evidence-20261023]
    paths: [.github/workflows/zomorod-passenger-restart-once-20261023.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare fingerprint-pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-public-health-relay"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo 'RELAY_PINNED=yes'
      - name: Guarded restart only while Zomorod is unavailable
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-public-health-relay"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,shlex,time
          from pathlib import Path
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError
          def code(url):
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as r:return r.status
              except HTTPError as e:return e.code
              except Exception as e:return type(e).__name__
          home=Path.home()
          ht=home/'public_html/.htaccess'
          conf={}
          for line in ht.read_text().splitlines():
              try:tokens=shlex.split(line)
              except ValueError:continue
              if len(tokens)>1 and tokens[0].startswith('Passenger'):conf[tokens[0]]=tokens[1]
          root=Path(conf.get('PassengerAppRoot',''))
          py=Path(conf.get('PassengerPython',''))
          startup=root/conf.get('PassengerStartupFile','passenger_wsgi.py')
          assert root.is_dir() and not root.is_symlink()
          assert root.name=='Saeit' and root.parent==home
          assert py.is_file() and os.access(py,os.X_OK)
          assert startup.is_file() and not startup.is_symlink()
          before=code('https://zomorodmelal.ir/about/')
          other=code('https://mojplaywin.com/')
          print('RESTART_PRECHECK_ZOMOROD',before,'MOJPLAYWIN',other)
          if before!=503:
              print('RESTART_SKIPPED_SITE_NOT_503');raise SystemExit(0)
          assert other==200,'Shared hosting not sufficiently healthy'
          directory=root/'tmp'
          assert directory.is_dir() and not directory.is_symlink()
          marker=directory/'.zm-about-graceful-restart-once-20261023'
          if marker.exists():
              print('RESTART_ALREADY_ATTEMPTED');raise SystemExit(0)
          with marker.open('x') as f:
              f.write('One-time isolated Passenger restart due to publicly verified 503.\n')
          restart=directory/'restart.txt'
          assert not restart.is_symlink()
          restart.touch(exist_ok=True)
          print('RESTART_TRIGGERED_ONCE')
          for n in range(4):
              time.sleep(3)
              new=code('https://zomorodmelal.ir/about/')
              print('PUBLIC_AFTER_RESTART',n+1,new)
              if new==200:break
          print('MOJPLAYWIN_AFTER',code('https://mojplaywin.com/'))
          PY
      - name: Remove runner key files
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-public-health-relay"
          test ! -f "$d/vps.key" || shred -u "$d/vps.key"
          test ! -f "$d/host.key" || shred -u "$d/host.key"
