name: Mojtaba personal identity aliases and authentic portrait SEO
on:
  push:
    branches: [main]
    paths:
      - scripts/mojtaba_personal_identity_aliases_20261023.py
      - tests/test_mojtaba_personal_identity_aliases_20261023.py
      - .github/workflows/mojtaba-personal-identity-aliases-20261023.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/mojtaba_personal_identity_aliases_20261023.py
      - tests/test_mojtaba_personal_identity_aliases_20261023.py
      - .github/workflows/mojtaba-personal-identity-aliases-20261023.yml
permissions: {contents: read}
concurrency:
  group: mojtaba-identity-aliases-20261023
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p 'test_mojtaba_personal_identity_aliases_20261023.py' -v
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin authenticated SSH relay and cPanel server host keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mojtaba-identity-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -T -F "$d/config" vps 'timeout 10s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo MOJTABA_VERIFIED_RELAY=PASS
      - name: Patch only personal Django base Person metadata with backup
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojtaba-identity-ssh"
          timeout 70s ssh -T -F "$d/config" cpanel /home/zomorod2/mojtaba_personal/.venv_personal_test/bin/python - install "$GITHUB_RUN_ID" < scripts/mojtaba_personal_identity_aliases_20261023.py
      - name: Validate live person identity, original photo, canonical and other paths
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in 1 2 3 4 5; do
            code="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/personal-identity.html" -w '%{http_code}' "https://mojplaywin.com/mojtaba.roozegar/?identity_verify=$GITHUB_RUN_ID-$i")"
            test "$code" = 200 && break
            sleep 2
          done
          test "$code" = 200
          python3 - "$RUNNER_TEMP/personal-identity.html" <<'PY'
          import json,re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding="utf8")
          scripts=re.findall(r'<script\s+type="application/ld\+json"\s*>(.*?)</script>',text,re.S)
          found=[]
          for script in scripts:
              try: obj=json.loads(script)
              except ValueError: continue
              if obj.get("@type")=="ProfilePage" and obj.get("mainEntity",{}).get("name")=="Mojtaba Roozegar":
                  found.append(obj)
          assert len(found)==1
          person=found[0]["mainEntity"]
          expected={"روزگار","Roozegar","مجتبی روزگار","Mojtaba Roozegar","دکتر مجتبی روزگار","Dr.mojtaba.rozegar"}
          assert expected.issubset(set(person["alternateName"]))
          assert "official_profile_20261016/portrait" in person["image"]
          assert '<link rel="canonical" href="https://mojplaywin.com/mojtaba.roozegar/">' in text
          assert "noindex" not in text.lower().split("</head>",1)[0]
          print("MOJTABA_PERSONAL_LIVE_STRUCTURED_IDENTITY=PASS")
          PY
          photo="$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' 'https://mojplaywin.com/mojtaba.roozegar/assets/personal_site/official_profile_20261016/portrait.2935ce8cb70d.webp')"
          test "$photo" = 200
          for path in / /mojtaba.roozegar/about/ /mojtaba.roozegar/blog/; do
            code="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            test "$code" = 200
          done
          echo MOJTABA_PERSONAL_SITE_HEALTH_AND_REAL_PHOTO=PASS
      - name: Rollback exact template bytes if live verification fails
        if: failure() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojtaba-identity-ssh"
          timeout 60s ssh -T -F "$d/config" cpanel /home/zomorod2/mojtaba_personal/.venv_personal_test/bin/python - rollback "$GITHUB_RUN_ID" < scripts/mojtaba_personal_identity_aliases_20261023.py
      - name: Remove temporary relay private keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojtaba-identity-ssh"
