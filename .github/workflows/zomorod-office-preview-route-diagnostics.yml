name: Diagnose isolated Zomorod office preview routing (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-preview-route-diagnostics.yml"
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.pull_request.number == 1724 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            exit 1
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Inspect Selector registration and Passenger mapping without changes
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel) ;; *) exit 1 ;; esac
          timeout 100s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          selector="/usr/sbin/cloudlinux-selector"
          rel="zomorod_office_preflight_2a8a0f4b9e17"
          uri="company/office-preflight-2a8a0f4b9e17"
          root="/home/zomorod2/$rel"
          docroot="/home/zomorod2/public_html"
          protected="/home/zomorod2/.private/zomorod-company-office"
          test -d "$root" && test ! -L "$root"
          test -f "$root/.preview-registered" && test ! -L "$root/.preview-registered"
          test -f "$root/office_passenger_wsgi.py"
          test -f "$root/.env" && test "$(stat -c '%a' "$root/.env")" = 600
          test -f "$root/office-preview.sqlite3"
          echo "PREVIEW_APP_ROOT=preserved_verified"
          test -f "$root/.selector-create.json"
          python3 - "$root/.selector-create.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print("SELECTOR_CREATE_RESULT="+str(x.get("result")))
          print("SELECTOR_CREATE_RESPONSE_KEYS="+",".join(sorted(x.keys())))
          print("SELECTOR_CREATE_DATA_TYPE="+type(x.get("data")).__name__)
          PY
          "$selector" get --json --interpreter python --domain zomorodmelal.ir | python3 -c '
          import json,sys
          x=json.load(sys.stdin)
          print("SELECTOR_GET_RESULT="+str(x.get("result")))
          print("SELECTOR_GET_DATA_TYPE="+type(x.get("data")).__name__)
          if isinstance(x.get("data"),(dict,list)):
              print("SELECTOR_GET_HAS_DATA=true")
          '
          backup="$protected/preflight-public-html-htaccess-20261031.bak"
          test -f "$backup"
          if cmp -s -- "$docroot/.htaccess" "$backup"; then
            echo "ROOT_PASSENGER_HTACCESS_AFTER_PREVIEW=unchanged"
          else
            echo "ROOT_PASSENGER_HTACCESS_AFTER_PREVIEW=changed"
          fi
          for folder in "$docroot" "$docroot/company" "$docroot/$uri" "$root"; do
            case "$folder" in
              "$docroot") tag=site_root ;;
              "$docroot/company") tag=company_directory ;;
              "$docroot/$uri") tag=preview_uri_directory ;;
              "$root") tag=preview_app_root ;;
              *) exit 1 ;;
            esac
            if test -d "$folder"; then
              echo "ROUTING_DIRECTORY_$tag=present"
            else
              echo "ROUTING_DIRECTORY_$tag=absent"
            fi
            file="$folder/.htaccess"
            if test -f "$file" && test ! -L "$file"; then
              echo "ROUTING_HTACCESS_$tag=present"
              awk '/^[[:space:]]*Passenger/ {print "ROUTING_" t "_DIRECTIVE=" $1}' t="$tag" "$file" | sort -u
              if grep -Eq '^[[:space:]]*PassengerBaseURI[[:space:]]+/' "$file"; then
                echo "ROUTING_PASSENGER_BASE_URI_$tag=present"
              fi
            else
              echo "ROUTING_HTACCESS_$tag=absent"
            fi
          done
          awk '/^[[:space:]]*PassengerEnabled[[:space:]]/ {
              val=tolower($2)
              if(val=="on"||val=="off") print "COMPANY_PARENT_PASSENGER_ENABLED=" val
              else print "COMPANY_PARENT_PASSENGER_ENABLED=nonstandard"
          }' "$docroot/company/.htaccess"
          awk 'NF && $1 !~ /^#/ {print "PREVIEW_URI_HTACCESS_KEY=" $1}' "$docroot/$uri/.htaccess" | sort -u
          for py in "/home/zomorod2/virtualenv/$rel/3.10/bin/python" "/home/zomorod2/virtualenv/$rel/3.10.22/bin/python"; do
            if test -x "$py"; then echo "PREVIEW_SELECTOR_VENV=present"; fi
          done
          if test -x "/home/zomorod2/virtualenv/$rel/3.10/bin/python"; then
            (cd "$root" && DJANGO_SETTINGS_MODULE=office_runtime.settings "/home/zomorod2/virtualenv/$rel/3.10/bin/python" - <<'PY'
          try:
              from office_passenger_wsgi import application
              from django.conf import settings
              assert settings.FORCE_SCRIPT_NAME=="/company/office-preflight-2a8a0f4b9e17"
              assert settings.ROOT_URLCONF=="office_runtime.urls"
          except Exception as exc:
              print("PREVIEW_SELECTOR_WSGI_IMPORT=failed_"+type(exc).__name__)
          else:
              print("PREVIEW_SELECTOR_WSGI_IMPORT=passed")
          PY
            )
          fi
          echo "READONLY_PREVIEW_ROUTE_DIAGNOSTIC=complete"
          REMOTE
      - name: Check external routing status without touching server
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://zomorodmelal.ir/api/health/" \
            "https://zomorodmelal.ir/company/office-preflight-2a8a0f4b9e17/" \
            "https://zomorodmelal.ir/company/office-preflight-2a8a0f4b9e17/secure-login/"; do
            code="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "$url" || true)"
            case "$url" in
              */api/health/) echo "PUBLIC_HEALTH_STATUS=$code" ;;
              */secure-login/) echo "PREVIEW_LOGIN_STATUS=$code" ;;
              *) echo "PREVIEW_ROOT_STATUS=$code" ;;
            esac
          done
          echo "ROUTE_DIAGNOSTIC_NO_CHANGES=true"
      - name: Remove runner transient relay credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
