name: MOJ Arena global static quality

on:
  pull_request:
    paths:
      - "site_releases/mojplaywin/arena/**"
      - ".github/workflows/moj-arena-global-static-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out exact code
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site_releases/mojplaywin/arena/app.js
          node --check site_releases/mojplaywin/arena/revenue/models.js
          node --check site_releases/mojplaywin/arena/casino/casino.js
          node --check site_releases/mojplaywin/arena/validate.cjs
      - name: Verify 50 revenue channels and locked casino design
        shell: bash
        run: |
          set -euo pipefail
          node site_releases/mojplaywin/arena/validate.cjs

# This workflow has NO production access, deployments, secrets, SSH,
# user-funds operations or shared Passenger/cPanel modifications.
