name: MojPlayWin reviewed buyer-email source restoration — no mail or payment
on:
  push:
    branches: [fix/mpw-restore-reviewed-email-recovery-source-20261114]
  pull_request:
    branches: [fix/mpw-live-checkout-csp-source-gaps-20261114]
permissions:
  contents: read
jobs:
  owner-email-source-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile migration, model, service, safe manifest and regression tests
        run: |
          python3 -m py_compile core/models.py core/guest_recovery_models.py
          python3 -m py_compile core/migrations/0049_mpw_guest_email_recovery.py
          python3 -m py_compile services/mpw_trx_email_recovery.py
          python3 -m py_compile tests/test_mpw_reviewed_email_recovery_restore_20261114.py
          python3 -m py_compile scripts/mpw_checkout_source_coverage_20261114.py
      - name: Run 44 reviewed buyer email source invariants without Django/database
        run: python3 -m unittest discover -s tests -p 'test_mpw_reviewed_email_recovery_restore_20261114.py' -v
      - name: Preserve 105 checkout CSP and source graph regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_mpw_checkout_security_middleware_20261114.py' -v
          python3 -m unittest discover -s tests -p 'test_mpw_checkout_source_coverage_20261114.py' -v
      - name: Validate exact known recovery improvements and refuse commerce release
        run: |
          python3 - <<'PY'
          from scripts.mpw_checkout_source_coverage_20261114 import audit,ROOT
          r=audit(ROOT)
          assert r['source_files_present']==8 and r['source_files_required']==11
          assert r['explicit_source_routes_count']==1
          assert r['files']['services/mpw_trx_email_recovery.py']=='present_regular_bounded'
          assert r['files']['core/migrations/0049_mpw_guest_email_recovery.py']=='present_regular_bounded'
          for f in ('mpw_commerce/buyer_orders.py','mpw_commerce/product_checkout_page.py',
                    'mpw_commerce/templates/mpw_commerce/product_checkout.html'):
              assert r['files'][f]=='missing_or_unsafe'
          assert not r['commerce_app_installed_in_reviewed_settings_source']
          assert not r['complete_versioned_buyer_checkout_source_candidate']
          assert not r['release_permitted']
          assert r['actual_collected_revenue'] is None
          print('REVIEWED_EMAIL_RECOVERY_SOURCE=RESTORED; COMPONENTS=8/11; ROUTES=1/4; RELEASE=NO-GO')
          PY
      - name: Confirm no SMTP/SSH/migration execution or production money
        run: echo 'EMAIL_SENT=NO; MIGRATIONS_EXECUTED=NO; DB_READ=NO; SSH=NO; TRX=NO; PRODUCTION_EDIT=NO'
