name: Publish 20 Vancouver enterprise intelligent web studies
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: personal-v17-vancouver-enterprise20-20261016
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: Publish twenty Vancouver enterprise smart website articles 2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check technical English content and SVG generators
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_vancouver_enterprise_web20_publish.py
          python3 -m unittest discover -s tests -p test_mojtaba_vancouver_enterprise_web20.py -v
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Transfer bounded journals and installer to separate personal hosting
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.enterprise-web20-$GITHUB_RUN_ID"
          timeout 30s ssh -F "$SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 90s scp -F "$SSH_CONFIG" scripts/mojtaba_vancouver_enterprise_web20_publish.py "saeit-host:$stage/publisher.py"
          for n in 1 2 3 4; do
            printf -v file 'content/mojtaba_vancouver_enterprise_web_part_%s_20261016.json' "$n"
            timeout 90s scp -F "$SSH_CONFIG" "$file" "saeit-host:$stage/"
          done
          for f in \
            mojtaba_seven_full_independent_journal_20261016.json \
            mojtaba_six_advanced_journal_articles_20261016.json \
            mojtaba_ten_advanced_website_engineering_20261016.json \
            mojtaba_vancouver_collab_part_a_20261016.json \
            mojtaba_vancouver_collab_part_b_20261016.json; do
            timeout 90s scp -F "$SSH_CONFIG" "content/$f" "saeit-host:$stage/"
          done
      - name: Install 20 with image assets and verify 53 individual published pages
        shell: bash
        run: |
          set -euo pipefail
          timeout 780s ssh -F "$SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          umask 077
          id="$1"
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          stage="/home/zomorod2/.enterprise-web20-$id"
          py="$app/../.venv_personal_test/bin/python"
          script="$stage/publisher.py"
          backup="$HOME/.backups/mojtaba-enterprise-smart-web20/$id"
          installed=0
          finished=0
          cleanup() {
            code=$?
            trap - EXIT
            if test "$installed" = 1 && test "$finished" = 0 && test -f "$backup/state.json"; then
              "$py" "$script" rollback --app "$app" --backup "$backup" && echo "ENTERPRISE_20_AUTO_ROLLBACK=success" || echo "ENTERPRISE_20_AUTO_ROLLBACK=manual_attention"
            fi
            exit "$code"
          }
          trap cleanup EXIT
          test -f "$app/manage.py" && test -x "$py" && test ! -L "$app"
          "$py" "$script" check --app "$app" --content "$stage"
          cd "$app"
          "$py" - "$stage" <<'PY_PREFLIGHT'
          import importlib.util,os,sys
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django;django.setup()
          from core.models import Post
          from django.urls import reverse
          from django.template import engines
          from xml.etree import ElementTree as ET
          stage=Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location("enterprise",stage/"publisher.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          new=mod.load_articles(stage)
          older=mod.load_older(stage)
          assert len(new)==20 and len(older)==33
          assert Post.objects.filter(slug__in=older,published=True).count()==33
          assert not Post.objects.filter(slug__in=[r["slug"] for r in new]).exists()
          for index,r in enumerate(new,1):
              ET.fromstring(mod.svg_diagram(r,index))
              assert reverse("personal_site:post_detail",kwargs={"slug":r["slug"]})=="/mojtaba.roozegar/blog/"+r["slug"]+"/"
          for key,text in mod.templates(mod.APP).items():
              engines["django"].engine.from_string(mod.patch(key,text,new))
              print("ENTERPRISE_20_LIVE_TEMPLATE_PREFLIGHT="+key,flush=True)
          print("ENTERPRISE_20_NEW_20_OLD_33_PREFLIGHT=yes",flush=True)
          PY_PREFLIGHT
          "$py" "$script" install --app "$app" --content "$stage" --backup "$backup"
          installed=1
          "$py" manage.py check --deploy
          "$py" manage.py collectstatic --noinput --verbosity 0
          test ! -d "$app/tmp" || touch "$app/tmp/restart.txt"
          "$py" - "$stage" <<'PY_VERIFY'
          import json,sys,time
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request,urlopen
          from html import unescape
          from html.parser import HTMLParser
          folder=Path(sys.argv[1])
          new=sum((json.loads((folder/("mojtaba_vancouver_enterprise_web_part_"+str(n)+"_20261016.json")).read_text())["articles"] for n in range(1,5)),[])
          old_names=("mojtaba_seven_full_independent_journal_20261016.json","mojtaba_six_advanced_journal_articles_20261016.json","mojtaba_ten_advanced_website_engineering_20261016.json","mojtaba_vancouver_collab_part_a_20261016.json","mojtaba_vancouver_collab_part_b_20261016.json")
          prior=sum((json.loads((folder/n).read_text())["articles"] for n in old_names),[])
          assert len(new)==20 and len(prior)==33
          base="https://mojplaywin.com/mojtaba.roozegar/"
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.images=[];self.portrait=[];self.portrait_b=[]
              def handle_starttag(self,t,attrs):
                  if t!="img":return
                  src=dict(attrs).get("src","")
                  if src:self.images.append(src)
                  if "owner_gallery_20261015_b/" in src:self.portrait_b.append(src)
                  elif "owner_gallery_20261015/" in src:self.portrait.append(src)
          cache={}
          def get(url):
              if url in cache:return cache[url]
              with urlopen(Request(url,headers={"User-Agent":"MojtabaEnterpriseWeb20LiveAudit/1"}),timeout=23) as r:
                  if r.status!=200:raise ValueError("Non200: "+url)
                  body=r.read(4500000)
                  cache[url]=body
                  return body
          def verify(route,check):
              error=""
              for n in range(7):
                  try:
                      url=base+route+"?enterprise_verify="+str(time.time_ns())
                      check(get(url).decode("utf-8","replace"))
                      return
                  except Exception as exc:
                      error=str(exc);print("ENTERPRISE_20_RETRY="+route+" "+error[:140],flush=True);time.sleep(3)
              raise ValueError("Production check failed "+route+" "+error)
          for route in ("","blog/"):
              def index_ok(doc):
                  for token in ('id="mpw-vancouver-enterprise-20-index-20261016"','id="mpw-vancouver-collab-photo-ten-20261016"','id="mpw-website-ten-index-20261016"','id="mpw-fifty-editorials-20261015"'):
                      if token not in doc:raise ValueError("Missing existing or new index "+token)
                  p=Page();p.feed(doc)
                  if sum("enterprise_web_diagrams_20261016/" in s for s in p.images)<20:raise ValueError("20 image cards missing")
              verify(route,index_ok)
              print("ENTERPRISE_20_PUBLIC_INDEX_OK="+(route or "home"),flush=True)
          for item in new:
              slug=item["slug"];found=[]
              def article_ok(doc,slug=slug,item=item):
                  if item["title"] not in unescape(doc):raise ValueError("New full article title missing")
                  if 'id="mpw-vancouver-enterprise-illustration-20261016"' not in doc:raise ValueError("New detail image missing")
                  p=Page();p.feed(doc)
                  hits=[u for u in p.images if slug in u and "enterprise_web_diagrams_20261016/" in u]
                  if not hits:raise ValueError("New matching diagram missing")
                  found.append(hits[0])
              verify("blog/"+slug+"/",article_ok)
              image=get(urljoin(base,found[0])).lstrip()
              if not image.startswith(b"<svg") or b"<title" not in image or b"<script" in image:
                  raise ValueError("SVG image was not served "+slug)
              print("ENTERPRISE_20_PUBLIC_ARTICLE_WITH_SVG="+slug,flush=True)
          for item in prior:
              def old_ok(doc,item=item):
                  if item["title"] not in unescape(doc):raise ValueError("Previous article missing")
                  p=Page();p.feed(doc)
                  if not p.images:raise ValueError("Previous article image missing")
              verify("blog/"+item["slug"]+"/",old_ok)
          print("ENTERPRISE_20_ALL_33_OLDER_ARTICLES_PRESERVED=yes",flush=True)
          def gallery_ok(doc):
              p=Page();p.feed(doc)
              if len(p.portrait)!=10 or len(p.portrait_b)!=10:raise ValueError("20 owner photos missing")
          verify("gallery/",gallery_ok)
          print("ENTERPRISE_20_OWNER_GALLERY_20_IMAGES_PRESERVED=yes",flush=True)
          print("ENTERPRISE_20_NEW_20_LIVE_ARTICLES_WITH_IMAGES=yes",flush=True)
          PY_VERIFY
          for domain in "https://mojplaywin.com/" "https://zomorodmelal.ir/"; do
            status="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 24 "$domain")"
            test "$status" = 200
            echo "ENTERPRISE_20_ORIGINAL_SITE_HEALTHY=$domain HTTP_200"
          done
          finished=1
          trap - EXIT
          echo "ENTERPRISE_20_LIVE_PUBLICATION_CONFIRMED=yes"
          echo "ENTERPRISE_20_SAFE_BACKUP=$backup"
          rm -rf "$stage"
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/photo-relay"
