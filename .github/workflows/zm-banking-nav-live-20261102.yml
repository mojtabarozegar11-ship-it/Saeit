name: ZM guarded bank navigation inside private accounting desk
on:
  workflow_dispatch:
    inputs:
      historical_patch_acknowledged:
        description: 'Obsolete one-hunk bank navigation patch: use only when independently reviewed; normal app release uses the 20261103 workflow'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: zm-live-php-private-reports-only
  cancel-in-progress: false
jobs:
  guarded-bank-navigation:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && inputs.historical_patch_acknowledged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
      - name: Exact one-hunk source and anonymous/authenticated synthetic acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=35c0255e39437f6e6d29525f6940e3db09914167
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          test "$(git diff --numstat "$base" "$GITHUB_SHA" -- content/zomorod-business/app.php | awk '{print $1":"$2}')" = '6:1'
          git diff --no-ext-diff --binary "$base" "$GITHUB_SHA" -- content/zomorod-business/app.php > "$RUNNER_TEMP/zm-bank-nav.patch"
          test "$(grep -c '^@@ ' "$RUNNER_TEMP/zm-bank-nav.patch")" = 1
          test "$(grep -c '^+[^+]' "$RUNNER_TEMP/zm-bank-nav.patch")" = 6
          test "$(grep -c '^-[^-]' "$RUNNER_TEMP/zm-bank-nav.patch")" = 1
          grep -Fq 'href="/business/banking.php">بانک ملت و شهر' content/zomorod-business/app.php
          php -l content/zomorod-business/app.php
          python3 -m unittest discover -s tests -p 'test_zm_business_logout_http.py' -v
          sha256sum "$RUNNER_TEMP/zm-bank-nav.patch" | awk '{print $1}' > "$RUNNER_TEMP/zm-bank-nav.sha"
          echo 'APP_DELTA=single_guarded_navigation_hunk'
          echo 'LEDGER_MIGRATION=no'
      - name: Configure pinned two-hop transport
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-bank-nav"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host zm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host zm-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump zm-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" zm-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.candidate" "$d/host.known"
      - name: Preserve exact live core application with owner-only backup
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-bank-nav"
          ssh -F "$d/config" zm-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          root="$HOME/.private/zomorod-business"
          app="$root/app.php"
          db="$root/management.sqlite3"
          bank="$HOME/public_html/business/banking.php"
          stage="$root/.bank-nav-$sha"
          backup="$HOME/.backups/zm-business-bank-nav/$sha"
          for f in "$app" "$db" "$bank"; do test -f "$f" && test ! -L "$f"; done
          test "$(stat -c %a "$app")" = 600
          test "$(stat -c %a "$db")" = 600
          test "$(stat -c %a "$bank")" = 644
          test ! -e "$stage" && test ! -L "$stage"
          test ! -e "$backup" && test ! -L "$backup"
          phpbin=/opt/cpanel/ea-php82/root/usr/bin/php
          test -x "$phpbin"
          "$phpbin" -l "$app" >/dev/null
          command -v patch >/dev/null
          umask 077
          install -d -m 700 "$stage" "$backup"
          cp -p "$app" "$backup/app.before.php"
          cp -p "$app" "$stage/app.php"
          sha256sum "$app" | awk '{print $1}' > "$stage/app.before.sha"
          echo 'PRIVATE_APP_BACKUP=owner_only'
          REMOTE
      - name: Transfer only reviewed one-hunk navigation change
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-bank-nav"
          stage="/home/zomorod2/.private/zomorod-business/.bank-nav-$GITHUB_SHA"
          scp -F "$d/config" "$RUNNER_TEMP/zm-bank-nav.patch" "zm-cpanel:$stage/app.patch"
          scp -F "$d/config" scripts/zm_production_app_guard.py content/zomorod-business/app.production-20261103.php "zm-cpanel:$stage/"
      - name: Apply reversible exact navigation patch and verify live login
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-bank-nav"
          digest="$(cat "$RUNNER_TEMP/zm-bank-nav.sha")"
          ssh -F "$d/config" zm-cpanel bash -se -- "$GITHUB_SHA" "$digest" <<'REMOTE'
          set -euo pipefail
          sha="$1"; digest="$2"
          [[ "$sha" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^[a-f0-9]{64}$ ]]
          root="$HOME/.private/zomorod-business"
          app="$root/app.php"
          db="$root/management.sqlite3"
          stage="$root/.bank-nav-$sha"
          backup="$HOME/.backups/zm-business-bank-nav/$sha"
          phpbin=/opt/cpanel/ea-php82/root/usr/bin/php
          previous="$(cat "$stage/app.before.sha")"
          test "$(sha256sum "$stage/app.patch" | awk '{print $1}')" = "$digest"
          test "$(sha256sum "$app" | awk '{print $1}')" = "$previous"
          test "$(sha256sum "$backup/app.before.php" | awk '{print $1}')" = "$previous"
          patch --batch --forward --fuzz=0 "$stage/app.php" "$stage/app.patch" >/dev/null
          grep -Fq 'href="/business/banking.php">بانک ملت و شهر' "$stage/app.php"
          "$phpbin" -l "$stage/app.php" >/dev/null
          # The deployment candidate must match the attested live source.
          # A changed candidate needs a separately reviewed reconciliation release.
          python3 "$stage/zm_production_app_guard.py" \
            --live "$app" \
            --reference "$stage/app.production-20261103.php" \
            --candidate "$stage/app.php" \
            --expected-live-sha256 ad9c80fc1bcff01c53cb58acabd088890e9f1dd0b7e3c38c95bd1ff4d67f27a7
          next="$(sha256sum "$stage/app.php" | awk '{print $1}')"
          test "$next" != "$previous"
          install -m 600 "$stage/app.php" "$stage/app.publish.php"
          modified=0
          rollback() {
            set +e
            if test "$modified" = 1; then
              cp -p "$backup/app.before.php" "$stage/app.rollback.php"
              if mv -f "$stage/app.rollback.php" "$app"; then echo 'NAV_ROLLBACK=restored'; else echo 'NAV_ROLLBACK=manual_backup_preserved' >&2; fi
            fi
          }
          trap 'rc=$?; trap - EXIT; rollback; exit "$rc"' EXIT
          modified=1
          mv -f "$stage/app.publish.php" "$app"
          "$phpbin" -l "$app" >/dev/null
          test "$(sha256sum "$app" | awk '{print $1}')" = "$next"
          test "$(stat -c %a "$app")" = 600
          test "$(stat -c %a "$db")" = 600
          code="$(curl --silent --show-error --location --max-time 30 --output "$stage/anonymous.html" --write-out '%{http_code}' 'https://zomorodmelal.ir/business/?page=dashboard')"
          test "$code" = 200
          grep -Fq 'ورود مدیر و حسابدار' "$stage/anonymous.html"
          ! grep -Fq 'href="/business/banking.php"' "$stage/anonymous.html"
          modified=0
          trap - EXIT
          echo 'LIVE_NAVIGATION_BANK_LINK=installed_for_authenticated_roles'
          echo 'EXISTING_LEDGER_DATA_MODIFIED=no'
          echo 'OWNER_PRIVATE_APP_BACKUP=preserved'
          echo 'AUTHENTICATED_OWNER_VIEW=still_pending'
          REMOTE
      - name: Remove temporary transport keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/zm-bank-nav"
