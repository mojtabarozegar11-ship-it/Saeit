name: MojPlayWin isolate product SEO and customer login language template read only
# Read-only live render requested 2026-10-24 to locate active store, product and login templates.
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-product-seo-login-template-readonly-20261020.yml"]
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Identify exact view and template paths without reading customer data
        run: |
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,inspect,ast,re
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          assert app.is_dir() and not app.is_symlink()
          os.chdir(app);sys.path.insert(0,str(app));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.urls import resolve
          from django.template.loader import get_template
          for route in ('/store/','/store/product/72/','/store/product/225/','/store/product/72/checkout/','/accounts/login/','/accounts/register/'):
              m=resolve(route);f=m.func;u=inspect.unwrap(f)
              candidates=[f,u,getattr(f,'view_class',None)]
              result={'route':route,'resolved_name':m.url_name,'module':f.__module__,'fn':getattr(f,'__name__','unnamed')}
              for obj in candidates:
                  if obj is None:continue
                  for key in ('template_name','authentication_form','form_class'):
                      val=getattr(obj,key,None)
                      if val is not None:result[key]=str(val)[:160]
              try:
                  src=inspect.getsource(u)
                  extracts=[]
                  for line in src.splitlines():
                      line=line.strip()
                      if ('render(' in line or 'template_name' in line or ('return ' in line and 'Template' in line)):
                          if not any(t in line.lower() for t in ('password','secret','api_key','token','private','wallet')):
                              extracts.append(line[:210])
                  result['render_calls']=extracts[:20]
              except (OSError,TypeError):pass
              print('MPW_VIEW_TEMPLATE_ROUTING='+json.dumps(result))
          roots=[app/'core/templates',app/'templates',app/'mpw_commerce/templates']
          for root in roots:
              if not root.is_dir():continue
              names=[p.relative_to(root).as_posix() for p in root.rglob('*.html') if not p.is_symlink() and any(k in p.name.lower() for k in ('login','register','account','product','checkout','store'))]
              print('MPW_RELEVANT_TEMPLATE_FILENAMES='+json.dumps({'root':root.relative_to(app).as_posix(),'names':names[:70]}))
          for root in roots:
              if not root.is_dir():continue
              shown=0
              for path in root.rglob('*.html'):
                  if path.is_symlink() or not path.is_file() or 'store' not in path.name.lower():continue
                  text=path.read_text('utf8','replace')
                  print('MPW_STORE_TEMPLATE='+json.dumps({'path':path.relative_to(app).as_posix(),'chars':len(text),'source':text[:12000]},ensure_ascii=False))
                  shown+=1
                  if shown>=6:break
          for rel in ('core/templates/brands/mojplaywin/product.html','mpw_commerce/templates/mpw_commerce/customer_login.html','mpw_commerce/templates/mpw_commerce/customer_register.html','core/templates/brands/mojplaywin/base.html','core/templates/mojplaywin/site_base.html'):
              path=app/rel
              if not path.is_file() or path.is_symlink():continue
              raw=path.read_text('utf8','replace')
              # Static Django templates only: never inspect credentials, runtime DB or environment files.
              print('MPW_TEMPLATE_RENDER_SCOPE='+json.dumps({'path':rel,'chars':len(raw),'text':raw[:9000]},ensure_ascii=False))
          PY
      - name: Erase temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
