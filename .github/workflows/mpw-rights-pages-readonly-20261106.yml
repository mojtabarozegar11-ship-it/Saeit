name: MPW rights pages bounded read-only inventory

on:
  push:
    branches: [audit/mpw-rights-page-shape-readonly-20261106-v1]
    paths:
      - .github/workflows/mpw-rights-pages-readonly-20261106.yml
      - scripts/mpw_rights_pages_readonly_inventory_20261106.py

permissions: {contents: read}
concurrency:
  group: mpw-rights-pages-readonly-20261106
  cancel-in-progress: false

jobs:
  read-only-inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/audit/mpw-rights-page-shape-readonly-20261106-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate inventory script does not import application code
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_rights_pages_readonly_inventory_20261106.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path("scripts/mpw_rights_pages_readonly_inventory_20261106.py")
          t=ast.parse(p.read_text(encoding="utf-8"))
          banned={"write_text","write_bytes","unlink","remove","rmdir","rename","replace","mkdir","touch","open","exec","eval","__import__"}
          hits={n.attr for n in ast.walk(t) if isinstance(n,ast.Attribute) and n.attr in banned}
          assert not hits, f"Inventory script contains write/execute methods: {hits}"
          print("MPW_READONLY_SCRIPT_STATIC_CONTRACT=PASS")
          PY
      - name: Configure pinned GitHub-to-VPS-to-cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-rights-pages-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 30s ssh -i "$d/vps.key" -p 22 -o UserKnownHostsFile="$d/vps.known" -o StrictHostKeyChecking=yes -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Observe only the target rights-checkout module shape
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-rights-pages-inventory-ssh/config" saeit-cpanel 'python3 -' < scripts/mpw_rights_pages_readonly_inventory_20261106.py
      - name: Delete runner-only SSH credentials
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-rights-pages-inventory-ssh"
          if test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/config"
            rmdir -- "$d"
          fi
