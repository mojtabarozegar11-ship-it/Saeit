name: VPS factory coordinated one-minute cadence
# Owner-requested continuous factory production activation.
on:
  pull_request:
    paths:
      - "deploy/install_factory_every_minute.sh"
      - "deploy/install_autonomous_factory_products.sh"
      - "deploy/install_production_warehouse.sh"
      - "tests/test_factory_every_minute.py"
      - "scripts/factory_continuous_production_orders.py"
      - "tests/test_factory_continuous_production_orders.py"
      - "deploy/install_factory_continuous_orders.sh"
      - ".github/workflows/vps-factory-every-minute-20261019.yml"
  push:
    branches: [main]
    paths:
      - "deploy/install_factory_every_minute.sh"
      - "deploy/install_autonomous_factory_products.sh"
      - "deploy/install_production_warehouse.sh"
      - "tests/test_factory_every_minute.py"
      - "scripts/factory_continuous_production_orders.py"
      - "tests/test_factory_continuous_production_orders.py"
      - "deploy/install_factory_continuous_orders.sh"
      - ".github/workflows/vps-factory-every-minute-20261019.yml"
permissions:
  contents: read
concurrency:
  group: saeit-vps-factory-minute-cadence
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install pinned offline spreadsheet QA dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
      - name: Check 1-minute cron, sequential production and QA, offline warehouse, rollback
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_factory_every_minute.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_continuous_production_orders.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_production_warehouse.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_vps_product_cycle.py' -v
  deploy:
    needs: contract
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && (contains(github.event.head_commit.message, '[approved-factory-minute-20261019]') || contains(github.event.head_commit.message, '[approved-factory-work-orders-20261019]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Publish ONE cron tick per minute on existing independent factory VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-minute"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          ssh_vps() {
            ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 githubops@178.239.147.150 "$@"
          }
          ssh_vps 'test "$(id -un)" = githubops && test -d "$HOME/factory-runtime/operations/production-warehouse" && test -s "$HOME/factory-runtime/private/autonomous-product-cycle/production-warehouse/stock-register.json" && echo FACTORY_MINUTE_VPS_PREFLIGHT=PASS'
          stage="/home/githubops/factory-runtime/operations/.factory-minute-install-$GITHUB_RUN_ID.sh"
          sha="$(sha256sum deploy/install_factory_every_minute.sh | awk '{print $1}')"
          cat deploy/install_factory_every_minute.sh | ssh_vps "umask 077; test ! -e '$stage'; cat > '$stage'; chmod 700 '$stage'"
          ssh_vps "test \"\$(sha256sum '$stage' | awk '{print \$1}')\" = '$sha' && bash -n '$stage' && bash '$stage'"
          echo FACTORY_MINUTE_DEPLOY_SCRIPT=PASS
          ssh_vps 'python3 -' <<'PY'
          from pathlib import Path
          import json, subprocess,datetime
          home=Path.home()
          ops=home/"factory-runtime"/"operations"
          cron=subprocess.check_output(["crontab","-l"],text=True)
          entries=[x for x in cron.splitlines() if "SAEIT_FACTORY_EVERY_MINUTE_V1" in x and not x.lstrip().startswith("#")]
          expected="* * * * * /bin/bash "+str(ops/"production-warehouse"/"run-minute-cycle.sh")+" # SAEIT_AUTONOMOUS_PRODUCTS_V2 SAEIT_PRODUCTION_WAREHOUSE_V1 SAEIT_FACTORY_EVERY_MINUTE_V1"
          assert entries==[expected],entries
          assert cron.count("SAEIT_AUTONOMOUS_PRODUCTS_V2")==1
          assert cron.count("SAEIT_PRODUCTION_WAREHOUSE_V1")==1
          assert (ops/"production-warehouse"/"run-minute-cycle.sh").is_file()
          reg=json.loads((home/"factory-runtime"/"private"/"autonomous-product-cycle"/"production-warehouse"/"stock-register.json").read_text())
          assert reg["sites_contacted"]==0 and reg["distribution_enabled"] is False
          print("FACTORY_CRON_INTERVAL_SECONDS=60")
          print("FACTORY_PRODUCE_THEN_STOCK_ORDER=YES")
          print("FACTORY_CRON_SINGLE_DRIVER=YES")
          print("FACTORY_WAREHOUSE_VERSIONS="+str(reg["finished_goods_versions"]))
          print("FACTORY_SITE_DISTRIBUTION=DISABLED")
          print("FACTORY_ONE_MINUTE_INSTALL_VERIFIED=PASS")
          PY
          # Run the same scheduled runner once to confirm production and QA
          # without waiting for or altering any website.
          ssh_vps 'python3 -u -' <<'PY'
          from pathlib import Path
          import json, subprocess, time
          home=Path.home()/"factory-runtime"
          ops=home/"operations"
          private=home/"private/autonomous-product-cycle"
          log=ops/"factory-minute-cycle.log"
          offset=log.stat().st_size if log.exists() else 0
          started=time.time()
          deadline=time.monotonic()+600
          print("FACTORY_FRESH_CYCLE_OBSERVATION_STARTED=true",flush=True)
          fresh=""
          while time.monotonic()<deadline:
              if log.exists():
                  with log.open("rb") as stream:
                      stream.seek(offset)
                      fresh=stream.read().decode("utf8",errors="replace")
              blocks=fresh.split("FACTORY_MINUTE_START_UTC=")[1:]
              complete=[b for b in blocks if "FACTORY_MINUTE_END_UTC=" in b]
              if complete:
                  latest=complete[-1]
                  if "FACTORY_MINUTE_MANUFACTURING_FAILED=" in latest or "FACTORY_MINUTE_WAREHOUSE_FAILED=" in latest:
                      raise SystemExit("FRESH_MINUTE_STAGE_FAILED")
                  if all(k in latest for k in ("FACTORY_MINUTE_MANUFACTURING_FINISHED=true",
                                               "FACTORY_MINUTE_WAREHOUSE_FINISHED=true")):
                      break
              time.sleep(10)
          else:
              raise SystemExit("FRESH_MINUTE_COMPLETION_NOT_OBSERVED")
          state=private/"production-state.json"
          inventory=private/"production-warehouse/stock-register.json"
          # A runner can skip a busy inner lock. Require fresh durable maker output too.
          if not state.is_file() or state.stat().st_mtime < started:
              raise SystemExit("FRESH_MANUFACTURING_STATE_NOT_OBSERVED")
          if inventory.stat().st_mtime < started:
              raise SystemExit("FRESH_WAREHOUSE_STATE_NOT_OBSERVED")
          production=json.loads(state.read_text())
          reg=json.loads(inventory.read_text())
          assert isinstance(production,dict)
          assert reg["sites_contacted"]==0 and reg["distribution_enabled"] is False
          assert reg["finished_goods_versions"]>=1
          print("FACTORY_FRESH_MANUFACTURING_STATE=PASS")
          print("FACTORY_FRESH_WAREHOUSE_STATE=PASS")
          print("FACTORY_MINUTE_MANUAL_CYCLE=PASS")
          print("FACTORY_MINUTE_STOCK_VERSIONS="+str(reg["finished_goods_versions"]))
          print("FACTORY_MINUTE_NO_SITE_TRANSFER=PASS")
          # Report only aggregate fields; never task payloads or credentials.
          for key,value in sorted(production.items()):
              if isinstance(value,(int,bool)) and not any(x in key.lower() for x in ("secret","token","key")):
                  print("FACTORY_PRODUCTION_"+key.upper()+"="+str(value))
          PY
          # Only the existing private VPS factory is modified; no sites.
          order_stage="/home/githubops/factory-runtime/operations/.workorders-source-$GITHUB_RUN_ID"
          ssh_vps "umask 077; test ! -e '$order_stage'; mkdir -m 700 '$order_stage'"
          for src in scripts/factory_continuous_production_orders.py deploy/install_factory_continuous_orders.sh; do
            file="$(basename "$src")"
            cat "$src" | ssh_vps "umask 077; cat > '$order_stage/$file'"
            digest="$(sha256sum "$src" | awk '{print $1}')"
            ssh_vps "test \"\$(sha256sum '$order_stage/$file' | awk '{print \$1}')\" = '$digest'"
          done
          ssh_vps "bash -n '$order_stage/install_factory_continuous_orders.sh' && bash '$order_stage/install_factory_continuous_orders.sh' '$order_stage/factory_continuous_production_orders.py'"
          ssh_vps 'python3 -' <<'PY'
          from pathlib import Path
          import json,subprocess
          home=Path.home()/"factory-runtime"
          ops=home/"operations"
          private=home/"private"/"autonomous-product-cycle"
          cron=subprocess.check_output(["crontab","-l"],text=True)
          assert cron.count("SAEIT_FACTORY_EVERY_MINUTE_V1")==1
          runner=(ops/"production-warehouse"/"run-minute-cycle.sh").read_text()
          assert runner.count("FACTORY_AUTONOMOUS_WORK_ORDER_GENERATOR_V1")==1
          assert runner.index("run-local-cycle.sh")<runner.index("generate-orders.py")<runner.index("run-warehouse.sh")
          info=json.loads((private/"production-instructions"/"order-status.json").read_text())
          assert info["instructions_issued_total"]>=1 and info["candidate_instructions"]>=1
          assert info["site_connection_required"] is False and info["distribution_enabled"] is False
          print("FACTORY_INSTRUCTION_ENGINE_ACTIVE=PASS")
          print("FACTORY_ORDERS_PENDING="+str(info["pending_instructions"]))
          print("FACTORY_ORDERS_ISSUED_TOTAL="+str(info["instructions_issued_total"]))
          print("FACTORY_INSTRUCTIONS_AVAILABLE="+str(info["candidate_instructions"]))
          PY
      - name: Final scheduling result
        run: |
          echo "FACTORY_SCHEDULE=EVERY_60_SECONDS"
          echo "FACTORY_QA_AND_WAREHOUSE=SEQUENTIAL"
          echo "FACTORY_CROSS_TICK_OVERLAP=LOCKED"
          echo "FACTORY_INDEPENDENT_OF_SITES=true"

  live-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect actual private production progress and stage failure codes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-minute"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          ssh_vps() {
            ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 githubops@178.239.147.150 "$@"
          }
          ssh_vps 'python3 -u -' <<'PY'
          import json, os, time
          from pathlib import Path
          base=Path.home()/"factory-runtime"
          private=base/"private/autonomous-product-cycle"
          for name in ("production-state.json","production-health.json","production-instructions/order-status.json",
                       "production-warehouse/stock-register.json","customer-packs/status.json"):
              path=private/name
              if not path.is_file(): print("STATE_MISSING="+name); continue
              data=json.loads(path.read_text())
              print("STATE_FILE="+name+" AGE_SECONDS="+str(round(time.time()-path.stat().st_mtime)))
              for key,value in data.items():
                  if isinstance(value,(bool,int,float)) or key in ("cycle_status","last_action","zero_new_products_reason_code","last_cycle_finished_at_utc"):
                      print("STATE_VALUE "+key+"="+str(value))
              for key in ("quality_failures_this_cycle","designer_failures","research_failures"):
                  for item in data.get(key,[])[:8]:
                      if isinstance(item,dict):
                          print("FAILURE_CODE="+str(item.get("code",item.get("type","unknown"))))
          for filename in ("factory-minute-cycle.log","autonomous-product-cycle.log"):
              path=base/"operations"/filename
              if path.is_file():
                  print("LOG="+filename+" AGE_SECONDS="+str(round(time.time()-path.stat().st_mtime)))
                  with path.open("rb") as f:
                      f.seek(max(0,path.stat().st_size-24000))
                      lines=f.read().decode("utf8",errors="replace").splitlines()
                  for line in lines[-50:]:
                      if line.startswith(("VPS_FACTORY_","FACTORY_","Traceback","TimeoutError","ModuleNotFoundError","ImportError","sqlite3.OperationalError")):
                          print("LOG_SIGNAL="+line[:240])
          # Factory-only, aggregate queue/scheduler/gate census. No VPS writes.
          import collections, re, subprocess, shutil
          cron_run=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=6,check=False)
          live_cron=([row for row in cron_run.stdout.splitlines()
                      if row.strip() and not row.lstrip().startswith("#")]
                     if cron_run.returncode==0 else [])
          for tag in ("SAEIT_FACTORY_EVERY_MINUTE_V1",
                      "SAEIT_STRICT_SERIAL_PRODUCT_TO_QC1000_20261025",
                      "SAEIT_AGRI200_AUTONOMOUS_CLOSED_LOOP_V1",
                      "SAEIT_ENGLISH_FIRST_SINGLE_ACTIVE_20261025"):
              print("FACTORY_CRON_COUNT "+tag+"="+str(sum(tag in row for row in live_cron)))
          print("FACTORY_DISK_FREE_GIB="+str(round(shutil.disk_usage(private).free/2**30,3)))
          area=private/"production-instructions"
          orders=area/"orders"
          known=("site-topic-snapshot","mojplaywin-site-qa-return",
                 "owner_requested_education700_p0","owner_requested_single_leech_english_20261025")
          by_origin=collections.Counter()
          by_state=collections.Counter()
          order_id_set=set()
          corrupt=0
          if orders.is_dir() and not orders.is_symlink():
              for p in orders.iterdir():
                  if p.suffix!=".json": continue
                  try:
                      if p.is_symlink() or not p.is_file() or p.stat().st_size>250000:
                          raise ValueError("unsafe")
                      item=json.loads(p.read_text(encoding="utf8"))
                      if not isinstance(item,dict) or not re.fullmatch(r"WO-[0-9]{8}[.]json",p.name):
                          raise ValueError("schema")
                      order_id_set.add(p.stem)
                      origin=item.get("origin")
                      by_origin[origin if origin in known else "other"]+=1
                      status=item.get("status")
                      by_state[status if status in ("issued","blocked_rework","in_engineering","completed_verified") else "other"]+=1
                  except (OSError,ValueError,TypeError):
                      corrupt+=1
          print("FACTORY_CURRENT_ORDERS="+str(len(order_id_set))+
                " UNSAFE="+str(corrupt)+" ORIGINS="+json.dumps(dict(by_origin),sort_keys=True)+
                " STATUSES="+json.dumps(dict(by_state),sort_keys=True))
          for label,filename in (
              ("agri200","owner-agri200-p0-index.json"),
              ("education700","owner-education700-p0-index.json"),
              ("jobs300","owner-jobs300-ir-p0-index.json"),
              ("women200","owner-women-home200-ir-p0-index.json")):
              path=area/filename
              if path.is_symlink() or not path.is_file():
                  print("FACTORY_INDEX "+label+"=MISSING_OR_UNSAFE");continue
              try:
                  index=json.loads(path.read_text(encoding="utf8"))
                  if not isinstance(index,dict):raise ValueError("root")
                  raw=index.get("order_ids_ranked")
                  if isinstance(raw,list) and len(raw)<=2000:
                      ids=[i for i in raw if isinstance(i,str) and re.fullmatch(r"WO-[0-9]{8}",i)]
                      print("FACTORY_INDEX "+label+" LISTED="+str(len(ids))+
                            " PRESENT="+str(sum(i in order_id_set for i in ids))+
                            " MISSING="+str(sum(i not in order_id_set for i in ids)))
                  else:
                      print("FACTORY_INDEX "+label+" NO_COMPATIBLE_RANKED_IDS")
              except (OSError,ValueError,TypeError):
                  print("FACTORY_INDEX "+label+" INVALID_JSON")
          for label,folder in (
              ("stage01_proofs","stage-01/receipts"),
              ("stage02_sources","stage-02/receipts"),
              ("stage03_designs","stage-03/receipts"),
              ("stage04_prototypes","stage-04/receipts"),
              ("stage05_manuscripts","stage-05/completed-drafts"),
              ("stage06_qc1000","stage-06/strict-qc1000")):
              d=area/folder
              count=sum(p.is_file() and not p.is_symlink() and p.suffix==".json"
                        for p in d.iterdir()) if d.is_dir() and not d.is_symlink() else 0
              print("FACTORY_GATE_RECEIPTS "+label+"="+str(count))
          # Exactly five current, stocked factory product families; never resurrect
          # previously purged historical order IDs. Report factual release blockers.
          stocks=private/"production-warehouse/stock-register.json"
          candidate_rows=[]
          if stocks.is_file() and not stocks.is_symlink():
              stock=json.loads(stocks.read_text(encoding="utf8"))
              if isinstance(stock.get("records"),list):
                  by_product={}
                  for record in stock["records"]:
                      if not isinstance(record,dict):continue
                      product=record.get("product_id")
                      if isinstance(product,str) and re.fullmatch(r"[a-z0-9]+(?:_[a-z0-9]+)*",product):
                          by_product.setdefault(product,[]).append(record)
                  for product in sorted(by_product)[:5]:
                      family=by_product[product]
                      manifest=private/"digital-products"/product/"manufacturing_manifest.json"
                      title=product
                      if manifest.is_file() and not manifest.is_symlink():
                          meta=json.loads(manifest.read_text(encoding="utf8"))
                          title=str(meta.get("name",product))[:100]
                      customer=private/"customer-packs"/product
                      packs=0
                      if customer.is_dir() and not customer.is_symlink():
                          packs=sum((v/"candidate_manifest.json").is_file() and
                                    not (v/"candidate_manifest.json").is_symlink()
                                    for v in customer.iterdir() if v.is_dir() and not v.is_symlink())
                      qa_work=private/"quality-excellence/production-workorders"/product/"current.json"
                      evidence=private/"quality-excellence/rework"/product/"current.json"
                      candidate_rows.append({"product_id":product,"title":title,
                          "stock_versions":len(family),"customer_packs":packs,
                          "qa_return":qa_work.is_file() and evidence.is_file(),
                          "commercial_release":False,
                          "latest_stock_evidence":str(family[-1].get("customer_archive_qa","unknown"))[:60]})
          print("FACTORY_FIRST_FIVE_TARGETS="+json.dumps(candidate_rows,ensure_ascii=False,sort_keys=True))
          # Sanitized independent QA defect codes for these five only;
          # never print private evidence passages, full source, or customer info.
          for candidate in candidate_rows:
              product=candidate["product_id"]
              for label,filename in (
                  ("quality_assessment",private/"quality-excellence/rework"/product/"current.json"),
                  ("production_workorder",private/"quality-excellence/production-workorders"/product/"current.json")):
                  if filename.is_symlink() or not filename.is_file() or filename.stat().st_size>2_000_000:continue
                  value=json.loads(filename.read_text(encoding="utf8"))
                  print("FACTORY_FIRST_FIVE_QA_KEYS "+product+" "+label+"="+
                        ",".join(sorted(str(k) for k in value.keys())))
                  print("FACTORY_FIRST_FIVE_QA_METRICS "+product+" "+label+"="+json.dumps({k:value.get(k) for k in ("quality_points_verified","required_quality_points","documentary_evidence_points","quality_status","rework_closeout_status","missing_documentary_group_count","unresolved_technical_or_domain_defects","measured_zip_integrity_Q068") if isinstance(value.get(k),(int,float,bool,str,type(None)))},sort_keys=True))
                  for key in ("defects","rework_actions","required_criterion_work"):
                      item=value.get(key)
                      if isinstance(item,list):
                          print("FACTORY_FIRST_FIVE_QA_ITEMS "+product+" "+label+" "+key+"="+json.dumps([str(x.get("code",x.get("reason",x.get("criterion",x))) if isinstance(x,dict) else x)[:95] for x in item[:8]]))
                  for key in ("failed_checks","defect_codes","return_reasons","failed_dimensions","quality_defects",
                              "rework_codes","required_actions","release_gate"):
                      found=value.get(key)
                      if isinstance(found,(list,dict)) and len(found)<=25:
                          codes=list(found.keys()) if isinstance(found,dict) else found
                          safe=[str(x)[:100] for x in codes if isinstance(x,(str,int))]
                          print("FACTORY_FIRST_FIVE_QA_CODES "+product+" "+label+" "+key+"="+json.dumps(safe))

          print("FACTORY_DIAGNOSTICS_READ_ONLY=true")
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():continue
              try:
                  args=(proc/"cmdline").read_bytes().decode(errors="replace").replace("\x00"," ")
                  if str(base) not in args or not any(x in args for x in ("run-minute-cycle","run-local-cycle","factory_vps_product_cycle","factory_build_50","factory_customer_packager","run-warehouse")): continue
                  comm=(proc/"comm").read_text().strip()
                  wait=(proc/"wchan").read_text().strip()
                  print("FACTORY_PROCESS pid="+proc.name+" comm="+comm+" wait="+wait)
              except (OSError,PermissionError):pass
          PY
