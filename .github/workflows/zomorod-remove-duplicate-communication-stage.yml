name: Prune exact redundant communication-core snapshot staging
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-remove-duplicate-communication-stage.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-dedupe-communication-stage
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify full SHA-256 equality of exact snapshot before deleting staging copy
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import os,hashlib,shutil,subprocess
          from pathlib import Path
          H=Path.home()
          assert str(H)=="/home/zomorod2"
          name="communication-core-20261005-051054"
          old=H/"Saeit-staging/zomorod_json_admin_stage/backups"/name
          keep=H/"Saeit/backups"/name
          assert old.is_dir() and keep.is_dir() and not old.is_symlink() and not keep.is_symlink()
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10)
          assert str(old) not in cron.stdout
          ps=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10)
          assert str(old) not in ps.stdout
          def fullmap(root):
              d={}
              for here,dirs,files in os.walk(root,followlinks=False):
                  dirs.sort();files.sort()
                  for folder in dirs:
                      assert not (Path(here)/folder).is_symlink()
                  for file in files:
                      p=Path(here)/file
                      assert p.is_file() and not p.is_symlink()
                      h=hashlib.sha256()
                      with p.open("rb") as f:
                          for part in iter(lambda:f.read(1024*1024),b""):h.update(part)
                      d[str(p.relative_to(root))]=(p.stat().st_size,h.digest())
              return d
          m1=fullmap(old);m2=fullmap(keep)
          assert m1 and m1==m2 and len(m1)==14, "SNAPSHOT_NOT_IDENTICAL"
          before=int(subprocess.run(["du","-sk",str(old)],capture_output=True,text=True,timeout=50,check=True).stdout.split()[0])*1024
          shutil.rmtree(old)
          assert not old.exists()
          assert fullmap(keep)==m2
          print("STAGING_COMMUNICATION_SNAPSHOT_DELETED="+name)
          print("IDENTICAL_FILES_HASH_CHECKED="+str(len(m1)))
          print("REDUNDANT_COMMUNICATION_SNAPSHOT_BYTES="+str(before))
          print("CANONICAL_SNAPSHOT_UNTOUCHED=yes")
          PY
          REMOTE
      - name: Confirm main site and agents remain accessible
        shell: bash
        run: |
          set -euo pipefail
          for path in / /agents/; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "AFTER_COMMUNICATION_CLEAN=$path:$code"
            test "$code" = 200
          done
      - name: Cleanup temporary connection material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
