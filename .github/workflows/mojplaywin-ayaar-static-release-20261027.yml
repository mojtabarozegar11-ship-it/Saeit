name: MojPlayWin AYAR exact-path isolated static release
on:
  push:
    branches: [release/ayaar-exact-path-20261027]
    paths:
      - ".github/workflows/mojplaywin-ayaar-static-release-20261027.yml"
      - "site_releases/mojplaywin/ayaar-20261027/**"
      - "scripts/deploy_ayaar_exact_path_20261027.py"
permissions:
  contents: read
concurrency:
  group: mpw-ayaar-exact-path-one-time-release
  cancel-in-progress: false
jobs:
  deploy-exact-static-directory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/release/ayaar-exact-path-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source, paths and static-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy_ayaar_exact_path_20261027.py
          python3 - <<'PY'
          from pathlib import Path
          import ast
          base=Path('site_releases/mojplaywin/ayaar-20261027')
          expected={'index.html','methodology.html','styles.css','hero.css','app.js','favicon.svg','hero-art.svg'}
          assert {x.name for x in base.iterdir()}==expected
          for f in base.iterdir():
              assert f.is_file() and not f.is_symlink()
              assert 0<f.stat().st_size<350000
          assert b'mojplaywin.com/ayaar/' in (base/'index.html').read_bytes()
          assert b'AYAR-PREASSESSMENT-v1' in (base/'app.js').read_bytes()
          ast.parse(Path('scripts/deploy_ayaar_exact_path_20261027.py').read_text('utf-8'))
          print('AYAAR_BOUNDED_STATIC_SOURCE=PASS')
          PY
      - name: Confirm public baseline before production access
        shell: bash
        run: |
          set -euo pipefail
          for route in / /store/ /saman/ /taniya/ /mojtaba.roozegar/; do
            status="$(curl --connect-timeout 9 --max-time 24 --retry 1 -L -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route")"
            echo "PRESERVED_ROUTE_BASELINE=$route:$status"
            test "$status" = 200
          done
          status="$(curl --connect-timeout 9 --max-time 24 -L -sS -o /dev/null -w '%{http_code}' 'https://mojplaywin.com/ayaar/')"
          echo "AYAAR_BEFORE_STATUS=$status"
          test "$status" = 404
      - name: Prepare host-key-pinned GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/ayaar-pinned-relay"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            path="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$path"
            chmod 600 "$path"
            ssh-keygen -y -P '' -f "$path" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 13
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Preflight exact document root and prepare private payload
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ayaar-pinned-relay"
          config="$d/config"
          rid="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$rid" =~ ^[0-9]{5,25}_[0-9]{1,3}$ ]]
          sha="$GITHUB_SHA"
          timeout 55s ssh -T -F "$config" saeit-cpanel "python3 - preflight '$rid' '$sha'" < scripts/deploy_ayaar_exact_path_20261027.py
          payload="$RUNNER_TEMP/ayaar-static-payload"
          install -d -m 700 "$payload"
          cp -- site_releases/mojplaywin/ayaar-20261027/* "$payload/"
          (
            cd "$payload"
            sha256sum app.js favicon.svg hero-art.svg hero.css index.html methodology.html styles.css > manifest.sha256
          )
          AYAAR_RUN_ID="$rid" AYAAR_SOURCE_SHA="$sha" AYAAR_PAYLOAD="$payload" python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['AYAAR_PAYLOAD'])/'deployment.json'
          p.write_text(json.dumps({'run_id':os.environ['AYAAR_RUN_ID'],'source_sha':os.environ['AYAAR_SOURCE_SHA'],'identity':'MPW_AYAAR_EXACT_PATH_V1'},sort_keys=True),encoding='utf-8')
          PY
          timeout 55s ssh -T -F "$config" saeit-cpanel "mkdir -m 700 '/home/zomorod2/.mpw-ayaar-stage-$rid'"
          tar -C "$payload" -cf - . | timeout 65s ssh -T -F "$config" saeit-cpanel "tar -C '/home/zomorod2/.mpw-ayaar-stage-$rid' -xf -"
          timeout 55s ssh -T -F "$config" saeit-cpanel "python3 - install '$rid' '$sha'" < scripts/deploy_ayaar_exact_path_20261027.py
      - name: Verify AYAR and preserved routes or quarantine only new directory
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ayaar-pinned-relay"
          rid="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sha="$GITHUB_SHA"
          healthy=true
          body="$RUNNER_TEMP/ayaar-home.html"
          status="$(curl --connect-timeout 9 --max-time 24 --retry 1 -sS -o "$body" -w '%{http_code}' 'https://mojplaywin.com/ayaar/' || true)"
          echo "AYAAR_PUBLIC_HTTP=$status"
          if test "$status" != 200 || ! grep -q 'AYAR — Digital Product Review' "$body"; then healthy=false; fi
          for route in /ayaar/app.js /ayaar/styles.css /ayaar/methodology.html; do
            status="$(curl --connect-timeout 9 --max-time 24 --retry 1 -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "AYAAR_STATIC_ASSET=$route:$status"
            if test "$status" != 200; then healthy=false; fi
          done
          for route in / /store/ /saman/ /taniya/ /mojtaba.roozegar/; do
            status="$(curl --connect-timeout 9 --max-time 24 --retry 1 -L -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "PRESERVED_ROUTE_AFTER=$route:$status"
            if test "$status" != 200; then healthy=false; fi
          done
          if test "$healthy" != true; then
            echo "AYAAR_POSTFLIGHT_FAILED_QUARANTINING_OWN_NEW_DIRECTORY"
            timeout 55s ssh -T -F "$d/config" saeit-cpanel "python3 - rollback '$rid' '$sha'" < scripts/deploy_ayaar_exact_path_20261027.py
            exit 1
          fi
          echo "AYAAR_PUBLIC_EXACT_PATH_VERIFIED=TRUE"
          echo "NO_SHARED_DJANGO_PASSENGER_DATABASE_OR_OTHER_SUBSITE_CHANGED"
