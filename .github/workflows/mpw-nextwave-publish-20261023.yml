name: MojPlayWin new Nextwave public release
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-nextwave-publish-20261023.yml]
permissions:
  contents: read
concurrency:
  group: mpw-nextwave-publish-20261023
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check original release identity and original deploy lock
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_nextwave_release_20261023.py
          python3 - <<'PY'
          from pathlib import Path
          import json,urllib.request,urllib.error
          root=Path('mpw-editorial/nextwave/20261023')
          m=json.loads((root/'release.json').read_text())
          assert m['release_id']=='NEXTWAVE-20261023-01' and len(m['items'])==2
          for p in ('index.html','release.json','orbit-switch/index.html','frame-budget-lab/index.html'):
              assert (root/p).is_file()
          assert ('if: '+chr(36)+'{{ false }}') in Path('.github/workflows/mojplaywin-main-deploy.yml').read_text()
          for path in ('/','/games/','/products/','/mpw-editorial/index.html'):
              with urllib.request.urlopen('https://mojplaywin.com'+path,timeout=20) as r: assert r.status==200,path
          try:
              with urllib.request.urlopen('https://mojplaywin.com/mpw-editorial/nextwave/20261023/release.json',timeout=20) as r:raise RuntimeError('Release route already occupied')
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          print('ORIGINAL_RELEASE_SAFE_TO_DEPLOY')
          PY
      - name: Connect via verified VPS SSH host keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          CPANEL_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-nextwave";install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$CPANEL_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/cpanel.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/cpanel.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/cpanel.key\n UserKnownHostsFile %s/cpanel.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 10\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/cpanel.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/cpanel.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/cpanel.candidate" "$d/host.known"
      - name: Stage and atomically install only new Nextwave versioned directory
        id: install
        shell: bash
        run: |
          set -euo pipefail
          c="$RUNNER_TEMP/mpw-nextwave/config"
          ssh -T -F "$c" saeit-cpanel "umask 077; mkdir -p /home/zomorod2/.private_mpw_nextwave_20261023/staging-$GITHUB_RUN_ID"
          tar -cf - -C mpw-editorial/nextwave 20261023 | ssh -T -F "$c" saeit-cpanel "umask 077; tar -xf - -C /home/zomorod2/.private_mpw_nextwave_20261023/staging-$GITHUB_RUN_ID"
          ssh -T -F "$c" saeit-cpanel "python3 - install $GITHUB_RUN_ID $GITHUB_SHA" < scripts/mpw_nextwave_release_20261023.py
      - name: Verify public release HTTP 200 and both interactive browser apps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          base='https://mojplaywin.com/mpw-editorial/nextwave/20261023/'
          for name in ('index.html','release.json','orbit-switch/index.html','frame-budget-lab/index.html'):
              with urllib.request.urlopen(base+name,timeout=20) as r:
                  b=r.read(100000)
                  assert r.status==200
                  if name=='release.json':assert json.loads(b)['release_id']=='NEXTWAVE-20261023-01'
              print('NEW_ORIGINAL_RELEASE_LIVE_HTTP200',name)
          for name in ('/','/games/','/products/','/mpw-editorial/arcade-lab/20261022/index.html'):
              with urllib.request.urlopen('https://mojplaywin.com'+name,timeout=20) as r:assert r.status==200
          PY
          chrome="$(command -v google-chrome || command -v chromium)"
          for app in orbit-switch frame-budget-lab; do
            timeout 45s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom "https://mojplaywin.com/mpw-editorial/nextwave/20261023/$app/index.html?selftest=1" > "$RUNNER_TEMP/$app.html" 2>/dev/null
            if test "$app" = orbit-switch; then marker=ORBIT_SWITCH_FUNCTIONAL_TEST_PASS; else marker=FRAME_BUDGET_FUNCTIONAL_TEST_PASS; fi
            grep -Fq "$marker" "$RUNNER_TEMP/$app.html"
            grep -Fq 'data-result="pass"' "$RUNNER_TEMP/$app.html"
            echo "NEW_APP_LIVE_CHROME_PASS $app"
          done
      - name: Rollback only the new directory if any test fails
        if: failure() && steps.install.outcome == 'success'
        shell: bash
        run: |
          ssh -T -F "$RUNNER_TEMP/mpw-nextwave/config" saeit-cpanel "python3 - rollback $GITHUB_RUN_ID $GITHUB_SHA" < scripts/mpw_nextwave_release_20261023.py
      - name: Remove ephemeral runner SSH keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mpw-nextwave"
