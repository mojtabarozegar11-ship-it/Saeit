name: Zomorod company accessibility and mobile performance safe fixes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-company-a11y-live-fix-20261018.yml
permissions:
  contents: read
concurrency:
  group: zomorod-company-about-additive
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Selftest company-only CSS surgical insertion and rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_company_a11y_patch_20261018.py
          python3 scripts/zomorod_company_a11y_patch_20261018.py selftest
      - name: Public read-only baseline and protected routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          for path in ('/company/','/','/about/','/search/','/store/','/tala/'):
              with urlopen(Request('https://zomorodmelal.ir'+path,headers={'Cache-Control':'no-cache,no-store','User-Agent':'ZMCompanyGlassPreflight/1'}),timeout=30) as r:
                  data=r.read(5000000)
                  assert r.status==200 and len(data)>200,path
              if path=='/company/':
                  assert len(data)>40000
                  assert b'zm-history-company-content-20261018' in data
                  assert b'zm-unified-v7-20261018' in data
                  assert b'zm-history-card' in data and b'zm-card-grid' in data
                  assert b'zm-company-cinematic-glass-20261018' in data and b'zm-company-thick-glass-20261018' in data and b'zm-company-audit-fixes-20261018' not in data
              print('PREFLIGHT_ROUTE_OK='+path,flush=True)
          PY
      - name: Prepare verified VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo PINNED_HOST_AND_RELAY_VERIFIED=yes
      - name: Stage only company CSS installer outside public_html
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-company-a11y-stage-$GITHUB_RUN_ID"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat scripts/zomorod_company_a11y_patch_20261018.py | timeout 50s ssh -T -F "$d/config" saeit-cpanel "cat > '$stage/apply.py'"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "test -s '$stage/apply.py' && python3 '$stage/apply.py' selftest"
      - name: Record original protected cPanel file digests
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/zm-glass-headers-ssh/config" saeit-cpanel 'python3 -' <<'PY' > "$RUNNER_TEMP/zm-row-protected-before.txt"
          import hashlib
          from pathlib import Path
          root=Path('/home/zomorod2/public_html')
          for name in ('.htaccess','search/index.html','store/index.php','topics/index.html','about/index.html','index.html','tala/index.php','business/index.php'):
              path=root/name
              if path.is_file() and not path.is_symlink():
                  print(name+' '+hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          test -s "$RUNNER_TEMP/zm-row-protected-before.txt"
      - name: Make one atomic company-only CSS insertion after verified backup
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-company-a11y-stage-$GITHUB_RUN_ID"
          expected="$(timeout 35s ssh -T -F "$d/config" saeit-cpanel 'sha256sum /home/zomorod2/public_html/company/index.html' | awk '{print $1}')"
          test "$(printf '%s' "$expected" | wc -c)" -eq 64
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/apply.py' apply '$GITHUB_RUN_ID' '$expected'"
      - name: Verify one CSS insertion in live company page and protected routes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-company-a11y-stage-$GITHUB_RUN_ID"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/apply.py' verify '$GITHUB_RUN_ID'"
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          found=False
          for attempt in range(8):
              try:
                  u='https://zomorodmelal.ir/company/?__company_glass='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                  with urlopen(Request(u,headers={'Cache-Control':'no-cache,no-store','User-Agent':'ZMCompanyGlassPublishQA/1'}),timeout=30) as r:
                      data=r.read(5000000)
                      assert r.status==200 and len(data)>40000
                  assert data.count(b'id="zm-company-audit-fixes-20261018"')==1 and data.count(b'id="zm-company-cinematic-glass-20261018"')==1 and data.count(b'id="zm-company-thick-glass-20261018"')==1
                  assert b'zm-history-company-content-20261018' in data
                  assert b'zm-unified-v7-20261018' in data
                  assert b'zm-history-card' in data and b'zm-card-grid' in data
                  found=True
                  break
              except Exception as exc:
                  print('PUBLIC_RETRY='+str(attempt)+' '+repr(exc)[:140],flush=True)
                  time.sleep(3)
          assert found,'Company-only cinematic glass CSS not visible publicly'
          for path in ('/','/about/','/search/','/store/','/tala/'):
              with urlopen(Request('https://zomorodmelal.ir'+path,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
                  assert r.status==200 and len(r.read(250000))>200,path
              print('PROTECTED_ROUTE_STILL_OK='+path,flush=True)
          print('COMPANY_A11Y_LIVE_CONFIRMED=yes',flush=True)
          PY
      - name: Chromium company cards and heading panels in five screen sizes
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zm-company-glass-chrome";mkdir -p "$dir";cd "$dir"
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install chromium
          cat > test.cjs <<'JS'
          const {chromium}=require('playwright');
          const AxeBuilder=require('@axe-core/playwright').default;
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const width of [1440,1024,768,390,320]){
              const context=await browser.newContext({viewport:{width,height:900}});const page=await context.newPage();
              await page.goto('https://zomorodmelal.ir/company/?__cg_browser='+width,{waitUntil:'domcontentloaded',timeout:50000});
              await page.locator('.zm-history-card').first().waitFor({state:'attached',timeout:22000});
              const report=await page.evaluate(()=>{
                const style=document.getElementById('zm-company-audit-fixes-20261018');
                if(!style?.sheet)throw Error('Company glass stylesheet missing');
                const find=s=>[...document.querySelectorAll(s)];
                const cards=find('.zm-card'),articles=find('.zm-article'),history=find('.zm-history-card');
                const panels=find('.zm-section-head'),details=find('.zm-history-topic');
                const c=getComputedStyle(cards[0]),p=getComputedStyle(panels[0]);
                const summary=getComputedStyle(details[0].querySelector('summary'));
                const elements=[...cards.slice(0,6),...articles.slice(0,4),...panels.slice(0,2)];
                const geometry=()=>elements.map(e=>[e.offsetWidth]);
                const before=geometry();style.sheet.disabled=true;
                const after=geometry();style.sheet.disabled=false;
                return {cards:cards.length,articles:articles.length,history:history.length,
                  panels:panels.length,details:details.length,glass:c.backdropFilter,
                  panelGlass:p.backdropFilter,summaryGlass:summary.backdropFilter,
                  gradient:c.backgroundImage,float:c.animationName,
                  thickCardLayers:(c.boxShadow.match(/rgba?\(/g)||[]).length,
                  thickPanelLayers:(p.boxShadow.match(/rgba?\(/g)||[]).length,
                  overflowX:Math.max(document.body.scrollWidth,document.documentElement.scrollWidth)-innerWidth,
                  primaryLinkColor:getComputedStyle(document.querySelector('#main a.zm-link:not(.zm-link-ghost)')).color,
                  navSkipWrapped:!!document.querySelector('nav.zm-company-skip-landmark > a.zm-skip'),
                  unchangedGeometry:JSON.stringify(before)===JSON.stringify(after)};
              });
              console.log('COMPANY_GLASS_VIEWPORT='+JSON.stringify({width,...report}));
              if(report.cards<6||report.articles<4||report.history<40||
                 report.panels<2||report.details<10||report.glass==='none'||
                 report.panelGlass==='none'||report.summaryGlass==='none'||
                 !report.gradient.includes('gradient')||report.float==='none'||report.thickCardLayers<5||report.thickPanelLayers<5||!report.unchangedGeometry||report.overflowX>3||report.primaryLinkColor!=='rgb(23, 55, 42)'||!report.navSkipWrapped)
                throw Error('Company a11y/glass regression '+width);
              if(width===390||width===1440){
                const a=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','best-practice']).analyze();
                console.log('COMPANY_A11Y_AXE='+JSON.stringify({width,violations:a.violations.map(v=>({id:v.id,count:v.nodes.length,impact:v.impact}))}));
                const serious=a.violations.filter(v=>v.id==='color-contrast'||v.id==='region');
                if(serious.length)throw Error('Accessibility regression '+width+' '+JSON.stringify(serious.map(v=>({id:v.id,examples:v.nodes.slice(0,3).map(n=>n.html)}))));
                const t=await page.locator('main a[href]').evaluateAll(els=>els.filter(x=>getComputedStyle(x).display!=='none' && x.offsetWidth>0).map(x=>({text:(x.textContent||'').trim().slice(0,25),h:x.getBoundingClientRect().height})));
                const small=t.filter(x=>x.h<40);
                console.log('COMPANY_TOUCH_AUDIT='+JSON.stringify({width,links:t.length,small}));
                if(small.length)throw Error('Touch area regression '+width);
              }
              await page.close();await context.close();
            }
            const page=await browser.newPage({viewport:{width:390,height:900}});
            await page.emulateMedia({reducedMotion:'reduce'});
            await page.goto('https://zomorodmelal.ir/company/?__company_reduce_motion',{waitUntil:'domcontentloaded',timeout:50000});
            const a=await page.locator('.zm-card').first().evaluate(el=>getComputedStyle(el).animationName);
            if(a!=='none')throw Error('Reduced motion broken: '+a);
            await browser.close();
            console.log('COMPANY_A11Y_5_VIEWPORTS_REDUCED_MOTION=passed');
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS
          node test.cjs
      - name: Assert protected files remain byte identical
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/zm-glass-headers-ssh/config" saeit-cpanel 'python3 -' <<'PY' > "$RUNNER_TEMP/zm-row-protected-after.txt"
          import hashlib
          from pathlib import Path
          root=Path('/home/zomorod2/public_html')
          for name in ('.htaccess','search/index.html','store/index.php','topics/index.html','about/index.html','index.html','tala/index.php','business/index.php'):
              path=root/name
              if path.is_file() and not path.is_symlink():
                  print(name+' '+hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          diff -u "$RUNNER_TEMP/zm-row-protected-before.txt" "$RUNNER_TEMP/zm-row-protected-after.txt"
          echo PROTECTED_SUBSITES_BYTE_IDENTICAL=yes
      - name: Restore exact previous company page on downstream failure
        if: failure() && steps.stage.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-company-a11y-stage-$GITHUB_RUN_ID"
          timeout 70s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/apply.py' rollback '$GITHUB_RUN_ID'"
      - name: Remove temporary company installer only; retain verified backup
        if: always()
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-company-a11y-stage-$GITHUB_RUN_ID"
          if test -s "$d/config"; then
              timeout 35s ssh -T -F "$d/config" saeit-cpanel "rm -f '$stage/apply.py';rmdir '$stage'" || true
          fi
          rm -rf "$d"
