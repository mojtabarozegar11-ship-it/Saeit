name: D MOJ PROP real Plan1 payment-cache integrity (source only)
on:
  push:
    branches:
      - d/mojprop-cached-purchase-failclosed-20261116
  pull_request:
    branches:
      - feature/prop-firm-policy-v11-20261114
    paths:
      - prop_firm/portal.py
      - tests/test_moj_prop_purchase_cache_d.py
      - .github/workflows/d-mojprop-purchase-cache-20261116.yml

permissions:
  contents: read

jobs:
  purchase-cache-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEBUG: 'true'
      SECRET_KEY: 'nonproduction-ci-only'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install source dependencies
        run: python -m pip install -r requirements.txt
      - name: Check app migration consistency
        run: python manage.py makemigrations --check --dry-run prop_firm
      - name: Test future settlement, chronological stages and release
        run: |
          python manage.py test \
            tests.test_moj_prop_future_evidence_c144 \
            tests.test_moj_prop_purchase_cache_d \
            tests.test_moj_prop_phase_sequence_c141 \
            tests.test_moj_prop_release_gate \
            tests.test_moj_prop_plan_qualification \
            --verbosity 2
