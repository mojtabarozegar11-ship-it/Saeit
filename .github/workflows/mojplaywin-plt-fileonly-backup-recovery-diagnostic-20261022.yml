name: MojPlayWin PLT file-only read-only backup restore diagnostic 20261022
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-plt-fileonly-backup-recovery-diagnostic-20261022.yml"
      - "scripts/mojplaywin_restore_files_isolated_runner.py"
      - "tests/test_mojplaywin_recovery_isolated_once.py"
permissions:
  contents: read
concurrency:
  group: mojplaywin-plt-fileonly-diag-20261022
  cancel-in-progress: false
jobs:
  diagnose_verified_existing_file_archive:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, '[approved-plt-file-diag-20261022]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify synthetic safe extraction before private read
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_mojplaywin_recovery_isolated_once.py'
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Demand exactly one complete independent AES256 SQL+files manifest pair
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          script64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 50s ssh -T -F "$d/config" saeit-vps "python3 -c '$call' '$script64' check"
      - name: Isolated file-only recovery of approved AES256 archive; never touch production
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          stream64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          restore_dir=$(mktemp -d "$RUNNER_TEMP/mojplaywin-restore-XXXXXXXX")
          chmod 700 "$restore_dir"
          cleanup() {
            if [[ "$restore_dir" == "$RUNNER_TEMP"/mojplaywin-restore-* ]]; then
              rm -rf -- "$restore_dir"
            fi
          }
          trap cleanup EXIT
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$free" -ge 6000000000 || { echo "NO-GO: not enough isolated recovery disk"; exit 1; }
          timeout 3300s ssh -T -F "$d/config" saeit-vps \
            "nice -n 15 python3 -c '$call' '$stream64' files" |
            timeout 3300s python3 -B scripts/mojplaywin_restore_files_isolated_runner.py "$restore_dir"
          echo "ATELIER_PRIVATE_FILE_ARCHIVE_RESTORED_IN_CLEAN_SANDBOX=PASS"
          echo "ATELIER_PUBLIC_PAYMENT_DELIVERY=STILL_UNVERIFIED"
