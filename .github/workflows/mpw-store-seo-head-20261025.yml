name: MojPlayWin isolated store search snippet metadata release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-store-seo-head-20261025.yml"
      - "scripts/mpw_store_seo_head_20261025.py"
permissions: {contents: read}
concurrency:
  group: mpw-store-seo-head-only
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review source and selftest exact single-page patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_store_seo_head_20261025.py
          python3 scripts/mpw_store_seo_head_20261025.py selftest
      - name: Protect existing public routes before any change
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          urls=['https://mojplaywin.com/','https://mojplaywin.com/store/',
                'https://mojplaywin.com/store/product/72/',
                'https://mojplaywin.com/store/product/225/',
                'https://mojplaywin.com/store/product/879/',
                'https://zomorodmelal.ir/']
          state={}
          for u in urls:
              req=urllib.request.Request(u,headers={'User-Agent':'MPWStoreMetaRelease/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      state[u]=r.status
              except urllib.error.HTTPError as e:
                  state[u]=e.code
          print('MPW_META_BASELINE='+json.dumps(state))
          if any(x!=200 for x in state.values()):
              raise SystemExit('Protected public route unavailable; no deployment')
          with open(os.environ['RUNNER_TEMP']+'/mpw-meta-baseline.json','w') as f:json.dump(state,f)
          PY
      - name: Establish pinned private SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-meta-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Apply exact reversible store metadata correction
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-meta-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - install '$GITHUB_RUN_ID'" < scripts/mpw_store_seo_head_20261025.py
      - name: Independently verify live store metadata and unchanged protected pages
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time,os,html
          from html.parser import HTMLParser
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title=False
                  self.title=''
                  self.tags={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title':self.in_title=True
                  if tag=='meta':
                      key=a.get('name') or a.get('property')
                      if key:self.tags[key]=a.get('content','')
              def handle_endtag(self,tag):
                  if tag=='title':self.in_title=False
              def handle_data(self,data):
                  if self.in_title:self.title+=data
          title='Digital Books & Website Kits | MojPlayWin'
          description=('Explore two original English digital books and an editable website kit. '
                       'Compare listed prices and review account-based TRX checkout and private delivery terms.')
          u='https://mojplaywin.com/store/'
          for i in range(12):
              req=urllib.request.Request(u+'?__mpw_meta_verify='+os.environ['GITHUB_RUN_ID']+'-'+str(i),headers={'Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=html.unescape(r.read(400000).decode('utf8','replace'))
                      status=r.status
              except urllib.error.HTTPError as e:
                  status=e.code;body=html.unescape(e.read(400000).decode('utf8','replace'))
              # Inspect only the document head: product cards may contain nested
              # snippets or embedded markup that are not page-level metadata.
              head_markup=body.split('</head>',1)[0]
              checks={'title':title in head_markup,
                      'description':description in head_markup,
                      'og_title_tag':'property="og:title"' in head_markup,
                      'og_description_tag':'property="og:description"' in head_markup,
                      'chess_link':'/store/product/72/' in body,
                      'taniya_link':'/store/product/225/' in body}
              ok=(status==200 and all(checks.values()))
              print('MPW_STORE_META_VERIFY='+json.dumps({'attempt':i,'status':status,'checks':checks}))
              if ok:break
              time.sleep(4)
          else:raise SystemExit('Store metadata not visible; rollback required')
          with open(os.environ['RUNNER_TEMP']+'/mpw-meta-baseline.json') as f:expected=json.load(f)
          for url,old in expected.items():
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  if r.status!=old:raise SystemExit('Protected route changed: '+url)
          for url,expected_title in (
              ('https://mojplaywin.com/store/product/72/','The Science and Practice of Chess Improvement | MojPlayWin'),
              ('https://mojplaywin.com/store/product/225/','Taniya and the Little Baker Worms | MojPlayWin'),
              ('https://mojplaywin.com/store/product/879/','Atelier Interior — Client-Ready Website Kit | MojPlayWin')):
              with urllib.request.urlopen(url,timeout=20) as r:
                  body=r.read(150000).decode('utf8','replace')
                  if '<title>'+expected_title+'</title>' not in body:
                      raise SystemExit('Product metadata changed: '+url)
          print('MPW_STORE_ONLY_META_LIVE=PASS;ORDERS_AND_PAYMENTS_UNCHANGED=YES')
          PY
      - name: Roll back on any verification failure
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-meta-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" < scripts/mpw_store_seo_head_20261025.py
      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-meta-ssh"
