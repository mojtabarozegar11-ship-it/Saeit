name: ZM store live source identity read-only gate
on:
  push:
    branches:
      - feature/zm-business-php-persian-reports-20261102
    paths:
      - '.github/workflows/zm-store-readonly-live-source-20261102.yml'
permissions:
  contents: read
concurrency:
  group: zm-store-live-identity-readonly
  cancel-in-progress: false
jobs:
  compare-sources:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin sources to immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s content/zomorod-v11/store_index.php
          test -s content/zomorod-v11/site_store.php
          sha256sum content/zomorod-v11/store_index.php content/zomorod-v11/site_store.php
          echo 'LIVE_ACCOUNTING_MUTATION_AUTHORIZED=no'
      - name: Configure pinned two-hop cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-store-identity"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host zm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host zm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump zm-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" zm-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.candidate" "$d/host.known"
      - name: Compare active public and private PHP files without mutation
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-store-identity"
          received="$(ssh -F "$d/config" zm-host bash -se <<'REMOTE'
          set -euo pipefail
          public="$HOME/public_html/store/index.php"
          private="$HOME/.private/zomorod-business/site_store.php"
          for file in "$public" "$private"; do
            test -f "$file" && test ! -L "$file"
          done
          echo "LIVE_PUBLIC_STORE_SHA256=$(sha256sum "$public" | awk '{print $1}')"
          echo "LIVE_PRIVATE_STORE_SHA256=$(sha256sum "$private" | awk '{print $1}')"
          echo "LIVE_PUBLIC_STORE_MODE=$(stat -c %a "$public")"
          echo "LIVE_PRIVATE_STORE_MODE=$(stat -c %a "$private")"
          if command -v /opt/cpanel/ea-php82/root/usr/bin/php >/dev/null; then
            /opt/cpanel/ea-php82/root/usr/bin/php -l "$public" >/dev/null
            /opt/cpanel/ea-php82/root/usr/bin/php -l "$private" >/dev/null
            echo 'LIVE_PHP82_SYNTAX=valid'
          fi
          echo 'FINANCIAL_DATABASE_TOUCHED=no'
          echo 'SOURCE_IDENTITY_AUDIT_COMPLETE=yes'
          REMOTE
          )"
          printf '%s\n' "$received"
          grep -Fxq 'SOURCE_IDENTITY_AUDIT_COMPLETE=yes' <<< "$received"
          grep -Fxq 'FINANCIAL_DATABASE_TOUCHED=no' <<< "$received"
          grep -Eq '^LIVE_PUBLIC_STORE_SHA256=[a-f0-9]{64}$' <<< "$received"
          grep -Eq '^LIVE_PRIVATE_STORE_SHA256=[a-f0-9]{64}$' <<< "$received"
          echo 'DEPLOY_EXECUTED=no'
      - name: Clean relay keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zm-store-identity"
