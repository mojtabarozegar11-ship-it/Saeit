name: Zomorod office guarded live release (owner authorized)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-guarded-production-release.yml"
      - "scripts/zomorod_office_guarded_release_20261031.py"
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: zomorod-office-live-release
  cancel-in-progress: false
jobs:
  quality:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/zomorod-messaging-main-integration-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      SECRET_KEY: private-office-ci-only-never-production-20261031
      DEBUG: "False"
      ALLOWED_HOSTS: testserver,localhost
      DATABASE_URL: sqlite:///office_release_quality.sqlite3
      COMPANY_MESSAGING_SEND_ENABLED: "false"
      COMPANY_MARKETING_PUBLISH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exactly pinned candidate and Python syntax
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile scripts/zomorod_office_guarded_release_20261031.py
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 manage.py makemigrations --check --dry-run enterprise_portal ecosystem_hub company_messaging company_marketing
          python3 manage.py check
      - name: Verify 168 private office messaging and ERP regressions before any production action
        run: |
          set -euo pipefail
          python3 manage.py test company_messaging company_marketing enterprise_portal ecosystem_hub --verbosity 1
          echo "OFFICE_RELEASE_QUALITY=passed"
  deploy:
    needs: quality
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/zomorod-messaging-main-integration-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Abort if current GitHub head or main changed since verified baseline
        uses: actions/github-script@v7
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const pr=await github.rest.pulls.get({owner,repo,pull_number:1666});
            if(pr.data.head.sha!==process.env.RELEASE_HEAD)core.setFailed('RELEASE_PR_HEAD_CHANGED');
            if(pr.data.base.sha!=='4912c369363d236278afc7e17c06a18a47733226')core.setFailed('MAIN_CHANGED_AFTER_PREFLIGHT');
            if(pr.data.head.ref!=='feature/zomorod-messaging-main-integration-20261030')core.setFailed('WRONG_SOURCE_BRANCH');
            if(pr.data.state!=='open')core.setFailed('RELEASE_PR_NOT_OPEN');
            if(pr.data.head.repo.full_name!==`${owner}/${repo}`)core.setFailed('UNTRUSTED_SOURCE_REPOSITORY');
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Wait for exact immutable private-stage artifact to exist
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          ready=0
          for attempt in $(seq 1 18); do
            if timeout 22s ssh -F "$d/config" "$COMMAND_HOST" "test -s /home/zomorod2/.private/zomorod-messaging-release-stages/$SOURCE_SHA/manifest.txt" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 6
          done
          test "$ready" -eq 1
          echo "IMMUTABLE_PRIVATE_STAGE_READY=yes"
      - name: Deploy only additive office Django modules with mandatory rollback and live verification
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          test -f scripts/zomorod_office_guarded_release_20261031.py
          timeout 280s ssh -F "$d/config" "$COMMAND_HOST" python3 -B - "$SOURCE_SHA" < scripts/zomorod_office_guarded_release_20261031.py
      - name: Clean temporary relay credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
