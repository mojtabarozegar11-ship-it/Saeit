name: Zomorod read-only active database and migration inventory
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-site-database-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-site-db-ro
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read schema metadata without changing or creating a database
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          cd "$HOME/Saeit"
          "$HOME/virtualenv/Saeit/3.10/bin/python" - <<'PY'
          import os,sqlite3,pathlib,urllib.parse,hashlib,datetime
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.conf import settings
          conn=settings.DATABASES["default"]
          engine=conn["ENGINE"]
          print("SITE_DB_BACKEND="+engine.split(".")[-1])
          print("SITE_DB_CONNECTION_HOST_TYPE="+("configured" if conn.get("HOST") else "local"))
          print("SITE_DB_ENV_DATABASE_URL="+("configured" if os.environ.get("DATABASE_URL") else "missing"))
          if not engine.endswith("sqlite3"):
              print("SITE_DB_READONLY_RESULT=external_database_requires_native_readonly_client")
              raise SystemExit(0)
          name=pathlib.Path(str(conn["NAME"]))
          if not name.is_absolute(): name=pathlib.Path.cwd()/name
          print("SITE_DB_PATH_KIND="+("app_root" if name.parent==pathlib.Path.cwd() else "other"))
          print("SITE_DB_FILENAME="+name.name)
          if not name.is_file():
              print("SITE_DB_FILE=missing_NO_CREATE")
              raise SystemExit(0)
          st=name.stat()
          print("SITE_DB_FILE=present")
          print("SITE_DB_BYTES="+str(st.st_size))
          print("SITE_DB_MODIFIED_UTC="+datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat())
          with name.open("rb") as f:
              print("SITE_DB_MAGIC="+("sqlite3" if f.read(16)==b"SQLite format 3\x00" else "unrecognized"))
          # SQLite URI mode=ro guarantees no implicit creation or migrations.
          uri="file:"+urllib.parse.quote(str(name))+"?mode=ro"
          db=sqlite3.connect(uri,uri=True,timeout=1)
          try:
              items={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              print("SITE_DB_TABLES_TOTAL="+str(len(items)))
              for t in ("django_migrations","auth_user","core_agent","core_agenttask","core_knowledgeagentrun","core_knowledgebook","core_order","core_paymentintent"):
                  print("SITE_DB_TABLE="+t+" present="+str(t in items))
              if "django_migrations" in items:
                  m=db.execute("SELECT app,COUNT(*) FROM django_migrations GROUP BY app ORDER BY app").fetchall()
                  for app,count in m:
                      print("SITE_DB_MIGRATIONS_APP="+app+" count="+str(count))
              else:
                  print("SITE_DB_MIGRATIONS=table_missing")
              print("SITE_DB_READONLY_RESULT=success")
          finally:
              db.close()
          PY
          python3 - <<'PY'
          from pathlib import Path
          home=Path.home()
          roots=[home/"Saeit",home/".backups"/"zomorodmelal-app"]
          for root in roots:
              if not root.is_dir():continue
              print("SITE_DATABASE_CANDIDATE_ROOT="+str(root.relative_to(home)))
              children=list(root.iterdir()) if root==home/"Saeit" else sorted(root.iterdir(),reverse=True)[:18]
              for child in children:
                  if child.is_file() and child.name.endswith((".sqlite3",".sqlite",".db")):
                      print("SITE_DATABASE_CANDIDATE_FILE="+str(child.relative_to(home))+" bytes="+str(child.stat().st_size))
                  elif child.is_dir() and root!=home/"Saeit":
                      for known in ("db.sqlite3","database.sqlite3","Saeit/db.sqlite3"):
                          p=child/known
                          if p.is_file():
                              print("SITE_DATABASE_CANDIDATE_BACKUP="+str(p.relative_to(home))+" bytes="+str(p.stat().st_size))
          PY
          REMOTE
      - name: Locate historical main-app DB snapshots by path and metadata only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import os,pathlib,datetime,sqlite3,urllib.parse
          home=pathlib.Path.home()
          roots=[
            home/".backups"/"zomorodmelal-app",
            home/".backups"/"zomorodmelal-root-homepage",
            home/"Saeit",
            home/"Saeit-staging",
            home/"backups",
          ]
          disallowed=("mohammad","ghanadi","amozeshgah","picm","mojplaywin","zahra","roham")
          names=[]
          examined=0
          for root in roots:
              if not root.is_dir():continue
              print("SITE_DB_BACKUP_SEARCH_ROOT="+str(root.relative_to(home)))
              for base,dirs,files in os.walk(root,followlinks=False):
                  parent=pathlib.Path(base)
                  depth=len(parent.relative_to(root).parts)
                  dirs[:]=sorted(d for d in dirs if not any(x in d.lower() for x in disallowed) and not d.startswith(".")) if depth<5 else []
                  for name in files:
                      examined+=1
                      if examined>12000:break
                      lname=name.lower()
                      if not (lname.endswith((".sqlite3",".sqlite",".db",".sql",".sql.gz",".sqlite3.gz",".sqlite3.bak")) or (lname.endswith((".zip",".tar",".tar.gz")) and ("backup" in lname or "zomorod" in lname))):
                          continue
                      full=parent/name
                      if full.is_symlink() or any(s in str(full.relative_to(home)).lower() for s in disallowed): continue
                      try: st=full.stat()
                      except OSError: continue
                      names.append((st.st_size,st.st_mtime,full))
                  if examined>12000:break
              if examined>12000:break
          print("SITE_DB_BACKUP_FILES_MATCHED="+str(len(names)))
          print("SITE_DB_FILES_EXAMINED="+str(examined))
          for size,mtime,path in sorted(names,reverse=True)[:85]:
              stamp=datetime.datetime.fromtimestamp(mtime,datetime.timezone.utc).isoformat(timespec="seconds")
              print("SITE_DB_BACKUP_CANDIDATE path="+str(path.relative_to(home))+" bytes="+str(size)+" modified_utc="+stamp)
              if size>100 and size<150_000_000 and path.name.endswith((".sqlite3",".sqlite",".db",".sqlite3.bak")):
                  try:
                      with path.open("rb") as f: magic=f.read(16)
                      if magic!=b"SQLite format 3\x00":continue
                      uri="file:"+urllib.parse.quote(str(path))+"?mode=ro"
                      conn=sqlite3.connect(uri,uri=True,timeout=1)
                      try:
                          tables={row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                          print("SITE_DB_BACKUP_SCHEMA path="+str(path.relative_to(home))+" tables="+str(len(tables))+" has_agents="+str("core_agent" in tables)+" has_auth="+str("auth_user" in tables)+" has_migrations="+str("django_migrations" in tables))
                      finally:conn.close()
                  except Exception as exc:
                      print("SITE_DB_BACKUP_SCHEMA_READ_FAILED="+type(exc).__name__)
          PY
          REMOTE
      - name: Remove runner SSH relay keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
