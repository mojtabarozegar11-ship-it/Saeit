name: Factory OFF owner-approved limited Termux OAuth SSH key addition
on:
  pull_request:
    paths:
      - '.github/workflows/factory-off-owner-termux-oauth-key-admission-20261118.yml'
permissions:
  contents: read
concurrency:
  group: factory-owner-termux-oauth-key-admission
  cancel-in-progress: false
jobs:
  add-exact-key:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.number == 2698 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Add only owner-approved public key via pinned SSH, preserve all existing bytes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 8 -t rsa 127.0.0.1 > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 60s ssh -T -i "$d/key" -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$d/known" -o GlobalKnownHostsFile=/dev/null \
            -o BatchMode=yes -o ForwardAgent=no -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 githubops@127.0.0.1 'exec python3 -B -' <<'PY'
          import base64,datetime,fcntl,hashlib,json,os,pathlib,pwd,stat
          assert pwd.getpwuid(os.geteuid()).pw_name=='githubops' and os.geteuid()!=0
          os.umask(0o077)
          expires='20261119235959Z'
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.strptime(expires,'%Y%m%d%H%M%SZ').replace(tzinfo=datetime.timezone.utc)
          blob='AAAAC3NzaC1lZDI1NTE5AAAAIJDm9QcA4ko2uaV2BNY36fahTpSGQLbhoc3jX689gAUU'
          fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(blob,validate=True)).digest()).decode().rstrip('=')
          assert fingerprint=='SHA256:Av33jUwQPezIs9AyflrqpHGFMCpAb3q8p+REc3qXMpU'
          home=pathlib.Path.home()
          kit=home/'factory-owner-drive-setup-20261118'
          assert home==pathlib.Path('/home/githubops') and not home.is_symlink()
          assert not kit.is_symlink() and kit.stat().st_uid==os.geteuid() and kit.stat().st_mode&0o077==0
          for name,pin in (
              ('factory_owner_drive_setup.py','03f20faf0cb763017e97dfbf32a5faf9081f21ec'),
              ('factory_rclone_dual_parts.py','f9c6d8445144744920246a128c977bdc850eb80f'),
              ('factory_rclone_ephemeral_binary.py','fa088e6531c302b95044d014ac8e8c568fb9ca7a')):
              p=kit/name
              s=p.lstat(); assert stat.S_ISREG(s.st_mode) and s.st_uid==os.geteuid() and s.st_mode&0o077==0 and s.st_size<100000
              raw=p.read_bytes()
              assert hashlib.sha1(('blob '+str(len(raw))+chr(0)).encode()+raw).hexdigest()==pin
          d=home/'.ssh'; s=d.lstat()
          assert stat.S_ISDIR(s.st_mode) and s.st_uid==os.geteuid() and not s.st_mode&0o022
          # Limit this key to the staged owner-only setup, loopback port, TTY, and expiry.
          line=('restrict,pty,port-forwarding,permitopen="127.0.0.1:53682",expiry-time="'+expires+'",command="cd /home/githubops/factory-owner-drive-setup-20261118 && exec python3 -B factory_owner_drive_setup.py --configure" ssh-ed25519 '+blob+' owner-termux-drive-20261118').encode('ascii')
          dirfd=os.open(d,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
          try:
              fd=os.open('authorized_keys',os.O_RDWR|os.O_APPEND|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=dirfd)
              with os.fdopen(fd,'r+b',buffering=0) as f:
                  fcntl.flock(f,fcntl.LOCK_EX)
                  st=os.fstat(f.fileno())
                  assert stat.S_ISREG(st.st_mode) and st.st_uid==os.geteuid() and st.st_nlink==1 and not st.st_mode&0o022 and st.st_size<=262144
                  before=f.read(262145)
                  assert len(before)==st.st_size
                  matches=[x for x in before.splitlines() if not x.lstrip().startswith(b'#') and blob.encode() in x.split()]
                  if matches:
                      assert matches==[line], 'KEY_ALREADY_PRESENT_WITH_DIFFERENT_SCOPE'
                      added=False; expected=before
                  else:
                      suffix=(b'' if not before or before.endswith(b'\n') else b'\n')+line+b'\n'
                      assert f.write(suffix)==len(suffix)
                      os.fsync(f.fileno())
                      expected=before+suffix;added=True
                  f.seek(0)
                  after=f.read(263169)
                  assert after==expected and after.startswith(before)
                  now=os.stat('authorized_keys',dir_fd=dirfd,follow_symlinks=False)
                  assert (now.st_dev,now.st_ino)==(st.st_dev,st.st_ino)
                  print('FACTORY_TERMUX_KEY_ADMISSION='+json.dumps({'exact_public_key_fingerprint_verified':True,'key_added':added,'previous_bytes_preserved':True,'previous_bytes':len(before),'new_bytes':len(after),'restricted_setup_only':True,'loopback_forward_port':53682,'expiry_utc':expires,'oauth_executed':False,'factory_started':False,'production_modified':False},sort_keys=True))
          finally:
              os.close(dirfd)
          PY
