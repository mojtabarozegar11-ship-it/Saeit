name: Remove scoped obsolete mixed-theme and rollback archives after protected snapshot

on:
  push:
    branches: [restore-zomorod-pre-seo-20261107]
    paths: [.github/workflows/zomorod-final-purge-mixed-legacy-20261107.yml]

permissions:
  contents: read

concurrency:
  group: zomorod-verified-mixed-legacy-final-purge
  cancel-in-progress: false

jobs:
  purge:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pin relay and cPanel SSH identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-final-legacy-purge"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'

      - name: Verify exact current snapshot and remove only previously inventoried old archives
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s ssh -T -F "$RUNNER_TEMP/zm-final-legacy-purge/config" saeit-cpanel "python3 - '$GITHUB_RUN_ID'" <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,stat,tarfile
          runid=__import__('sys').argv[1]
          assert re.fullmatch(r'[0-9]{5,20}',runid)
          h=Path('/home/zomorod2');web=h/'public_html';b=h/'.backups';p=h/'.private'
          assert os.geteuid()!=0 and os.geteuid()==web.stat().st_uid
          assert all(x.is_dir() and not x.is_symlink() for x in (web,b,p))
          sha=lambda data:hashlib.sha256(data).hexdigest()
          live={
              'index.html':'0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585',
              'about/index.html':'cd980f1497190cd86ec9fd09e4794a699563894c529358fef39d63810e3ef107',
              'company/index.html':'75e9c3cb8387494fc25a67b5561af1853a478fbaca96d73e96a7a48ae0cd5281',
              'services/index.html':'189997166683646b29743a8f328cbc822c5ffeb68732f12cf999fecff0fcdcc0',
              'industry/index.html':'aa71ad70e6d01066800bf63cd8ea791dddebbbbcc07df13aae0aaa054889c039',
              'research/index.html':'e53fea2b0d7f1dc82c19b09fd246aef9107cbae7b812ab17e1c69c87f79b0ef7',
              'knowledge/index.html':'b489d29011e38c3a7bdf52340b8bedd75fbdb824eee7c83d2b8f47924aba5856',
              'agriculture/index.html':'d842c74262d254b1bae8ec89ba43fca11aada52da85871cf93f7a8234102af59',
              'contact/index.html':'c84d8040cf6b0b9cfdd2b778338b6377c19630a0b482c04e34dc0947ae5978bf',
          }
          snapshot=p/'zm-current-theme-snapshot-20261107/42331730214'
          archive=snapshot/'current-theme.tar.gz'
          manifest=snapshot/'manifest.json'
          assert archive.is_file() and manifest.is_file() and not archive.is_symlink()
          archive_sha='c02d480168635c7b20854b72f5fe642746c49fdf077d7520cf95611b20d813c4'
          def protect():
              for rel,digest in live.items():
                  f=web/rel
                  assert f.is_file() and not f.is_symlink() and sha(f.read_bytes())==digest,('CURRENT_THEME_CHANGED_ABORT',rel)
              assert sha(archive.read_bytes())==archive_sha,'CURRENT_SNAPSHOT_CHANGED_ABORT'
              for rel in ('static/site/zomorod-v7/inner-v7.css','static/site/zomorod-v10/inner-v10.css','assets/zm-nova-detail-v1.css','agriculture/assets/zm-nova-agriculture-v1.css','agriculture/assets/zm-agritech-luxe-v3.css'):
                  f=web/rel
                  assert f.is_file() and not f.is_symlink() and f.stat().st_size>100,('LIVE_STYLESHEET_MISSING',rel)
          protect()
          manifest_data=json.loads(manifest.read_text(encoding='utf-8'))
          assert len(manifest_data['files'])==724
          assert all(manifest_data['protected_core'][rel]==digest for rel,digest in live.items())
          with tarfile.open(archive,'r:gz') as t:
              members=t.getmembers()
              assert len(members)==724 and all(m.isfile() and m.name in manifest_data['files'] for m in members)
              for m in members:
                  assert sha(t.extractfile(m).read())==manifest_data['files'][m.name]['sha256'],('SNAPSHOT_CORRUPT',m.name)
          targets=(
              (b,'zomorod-v11',13,4810204),
              (b,'zomorod-v12-contact',12,4530387),
              (b,'zomorod-live-inpage',129,2632161),
              (p,'zm-internal-pre-seo-restore-20261107',263,3822128),
              (p,'zm-about-v12-recovery-20261107',3,37029),
          )
          def inventory(root):
              count=size=0
              for dirname,dirs,files in os.walk(root,followlinks=False):
                  for item in dirs:
                      assert not (Path(dirname)/item).is_symlink(),'LINKED_DIRECTORY_ABORT'
                  for item in files:
                      file=Path(dirname)/item;info=file.lstat()
                      assert stat.S_ISREG(info.st_mode),'SPECIAL_FILE_ABORT'
                      count+=1;size+=info.st_size
              return count,size
          for parent,name,count,size in targets:
              source=parent/name
              assert source.parent==parent and source.is_dir() and not source.is_symlink()
              assert inventory(source)==(count,size),('INVENTORY_CHANGED_ABORT',name,inventory(source),(count,size))
          staging_parent=p/'zm-final-legacy-disposal-20261107'
          staging_parent.mkdir(mode=0o700,exist_ok=True)
          assert not staging_parent.is_symlink()
          staging=staging_parent/runid
          staging.mkdir(mode=0o700)
          moved=[]
          try:
              protect()
              for parent,name,count,size in targets:
                  source=parent/name;dest=staging/name
                  assert inventory(source)==(count,size)
                  os.rename(source,dest)
                  moved.append((source,dest))
              protect()
          except BaseException:
              for source,dest in reversed(moved):
                  if dest.exists() and not source.exists():os.rename(dest,source)
              raise
          total=0
          for parent,name,count,size in targets:
              dest=staging/name
              assert dest.parent==staging and inventory(dest)==(count,size)
              shutil.rmtree(dest)
              total+=size
              print('DELETED_OBSOLETE_MIXED_OR_ROLLBACK_ARCHIVE',name,'bytes',size,'files',count,flush=True)
          staging.rmdir()
          protect()
          assert all(not (parent/name).exists() for parent,name,_,_ in targets)
          print('MIXED_LEGACY_PURGE_COMPLETE','archives',len(targets),'removed_bytes',total,'current_snapshot_verified_724_files=yes',flush=True)
          PY

      - name: Remove temporary runner keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zm-final-legacy-purge"
