name: Ramadan War complete models and real-browser preflight
on:
  pull_request:
    paths:
      - 'games/ramadan-war/**'
      - 'tests/game/ramadan-*.test.mjs'
      - '.github/workflows/zomorod-ramadan-war-web-card.yml'
      - '.github/workflows/zomorod-ramadan-war-model-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replace repository-truncated models with fully hash-attested originals
        run: |
          set -euo pipefail
          bash -n games/ramadan-war/fetch_verified_models.sh
          bash games/ramadan-war/fetch_verified_models.sh
      - name: Parse code and assert all model files are complete
        run: |
          set -euo pipefail
          node --check games/ramadan-war/game.js
          node --check games/ramadan-war/engine3d.js
          node --check games/ramadan-war/site-smoke.cjs
          python3 -m py_compile games/ramadan-war/deploy.py
          test "$(wc -c < games/ramadan-war/soldier-rigged-ccby.glb)" -eq 3094592
          test "$(wc -c < games/ramadan-war/m24-sniper-ccby.glb)" -eq 1247684
      - name: Exercise fail-closed release SHA-256 verification (offline)
        run: python3 -m unittest discover -s games/ramadan-war -p 'test_verify_public_release.py' -v
      - name: Verify scoped deployment rollback and concurrent-writer protection (offline)
        run: python3 -m unittest discover -s games/ramadan-war -p 'test_deploy_rollback.py' -v
      - name: Verify offline preview packaging and failure-mode regression
        run: python3 -m unittest discover -s games/ramadan-war -p 'test_build_preview.py' -v
      - name: Verify all preview runtime imports and fail-closed MOJ1 policy
        run: python3 -m unittest discover -s games/ramadan-war -p 'test_preview_runtime_deps.py' -v
      - name: Verify integrated campaign save, input, accessibility and security regressions
        run: node --test tests/game/ramadan-input-guard.test.mjs tests/game/ramadan-save-validation.test.mjs
      - name: Full desktop and mobile gameplay with real GLB texture loading
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ramadan-playwright"
          cd "$RUNNER_TEMP/ramadan-playwright"
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 --directory games/ramadan-war > "$RUNNER_TEMP/ramadan-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          GAME_URL=http://127.0.0.1:8765/ NODE_PATH="$RUNNER_TEMP/ramadan-playwright/node_modules" node games/ramadan-war/site-smoke.cjs
      - name: Build SHA-256-verified standalone playable web preview
        run: |
          set -euo pipefail
          python3 games/ramadan-war/build_preview.py --output "$RUNNER_TEMP/ramadan-war-preview.zip"
          python3 -m zipfile -t "$RUNNER_TEMP/ramadan-war-preview.zip"
      - name: Upload playable preview ZIP after successful real-browser QA
        uses: actions/upload-artifact@v4
        with:
          name: ramadan-war-web-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/ramadan-war-preview.zip
          if-no-files-found: error
          retention-days: 14
      # Preview is offline and cannot mutate production. The strict live-card
      # release gate remains mandatory and never treats DNS failure as success.
      - name: Verify bounded DNS retry and strict live-card rejection (offline)
        run: python3 -m unittest discover -s games/ramadan-war -p 'test_live_cards.py' -v
      - name: Read-only protection check of currently live IT cards
        run: python3 games/ramadan-war/check_live_cards.py
