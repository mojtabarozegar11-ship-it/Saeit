name: Ramadan War complete models and real-browser preflight
on:
  pull_request:
    paths:
      - 'games/ramadan-war/**'
      - '.github/workflows/zomorod-ramadan-war-web-card.yml'
      - '.github/workflows/zomorod-ramadan-war-model-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replace repository-truncated models with fully hash-attested originals
        run: |
          set -euo pipefail
          bash -n games/ramadan-war/fetch_verified_models.sh
          bash games/ramadan-war/fetch_verified_models.sh
      - name: Parse code and assert all model files are complete
        run: |
          set -euo pipefail
          node --check games/ramadan-war/game.js
          node --check games/ramadan-war/engine3d.js
          node --check games/ramadan-war/site-smoke.cjs
          python3 -m py_compile games/ramadan-war/deploy.py
          test "$(wc -c < games/ramadan-war/soldier-rigged-ccby.glb)" -eq 3094592
          test "$(wc -c < games/ramadan-war/m24-sniper-ccby.glb)" -eq 1247684
      - name: Verify complete, reversible Ramadan release bundle and local JS imports
        run: |
          set -euo pipefail
          python3 games/ramadan-war/check_release_dependencies.py
          python3 -m unittest discover -s games/ramadan-war -p 'test_*.py'
      - name: Read-only protection check of currently live IT cards
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import json, re
          with urlopen(Request('https://zomorodmelal.ir/', headers={'Cache-Control': 'no-cache', 'User-Agent': 'RamadanReadOnlyCardQA/1'}), timeout=40) as response:
              assert response.status == 200
              page = response.read(3500000)
          match = re.search(rb'window[.]ZOMOROD_ORBIT_DATA=([{].*?[}]);</script>', page, re.S)
          assert match, 'Cannot locate live homepage manifest'
          rows = json.loads(match.group(1))['rows']
          row = next(item for item in rows if item.get('id') == 'ZM-R25')
          cards = row['cards']
          assert row['title'] == 'فناوری اطلاعات و خدمات دیجیتال' and len(cards) >= 24
          assert cards[0]['id'] == 'ZM-R25-GAME-FARM-DOMINION-20261019'
          assert cards[1]['id'] == 'ZM-R25-GAME-RAMADAN-WAR-20261022' and cards[1]['canonicalUrl'] == '/ramadan-war/'
          assert cards[2]['id'] == 'ZM-R25-GAME-ARROW-ESCAPE-20261022' and cards[2]['canonicalUrl'] == '/arrow-escape/'
          assert cards[3]['slug'] == 'website-design'
          print('LIVE_IT_FIRST_FOUR_CARDS=PASS count=',len(cards))
          # Read-only live-route smoke: a homepage card alone does not prove
          # that the actual game, JavaScript and CSS resolve successfully.
          from urllib.parse import urlsplit
          for route,signature in [
              ('/ramadan-war/',b'ZM-RAMADAN-WAR-WEB-CARD-20261022'),
              ('/ramadan-war/game.js',b'RamadanWarDebug'),
              ('/ramadan-war/game.css',b'#game'),
          ]:
              with urlopen(Request('https://zomorodmelal.ir'+route,
                  headers={'Cache-Control':'no-cache','User-Agent':'RamadanReadOnlyRouteQA/1'}),timeout=40) as response:
                  assert response.status==200, 'live game asset not HTTP 200: '+route
                  resolved=urlsplit(response.geturl())
                  assert resolved.hostname in ('zomorodmelal.ir','www.zomorodmelal.ir') and resolved.path==route, 'unexpected redirect: '+route
                  mime=response.headers.get_content_type()
                  expected={'/ramadan-war/':('text/html',),
                      '/ramadan-war/game.js':('text/javascript','application/javascript','application/x-javascript','text/x-javascript'),
                      '/ramadan-war/game.css':('text/css',)}[route]
                  assert mime in expected, 'live asset served with incorrect MIME: '+route+' '+mime
                  body=response.read(4000001)
                  assert len(body)<=4000000, 'live asset exceeds read-only QA limit: '+route
                  declared=response.headers.get('Content-Length')
                  if declared is not None:
                      assert int(declared)==len(body), 'truncated live asset: '+route
              if route.endswith(('.js','.css')):
                  assert not body.lstrip().lower().startswith((b'<!doctype html',b'<html')), 'HTML fallback masquerading as game asset: '+route
              assert signature in body, 'live game asset signature missing: '+route
              print('LIVE_RAMADAN_ROUTE=PASS',route,len(body))
          PY
      - name: Full desktop and mobile gameplay with real GLB texture loading
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ramadan-playwright"
          cd "$RUNNER_TEMP/ramadan-playwright"
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 --directory games/ramadan-war > "$RUNNER_TEMP/ramadan-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          GAME_URL=http://127.0.0.1:8765/ NODE_PATH="$RUNNER_TEMP/ramadan-playwright/node_modules" node games/ramadan-war/site-smoke.cjs
