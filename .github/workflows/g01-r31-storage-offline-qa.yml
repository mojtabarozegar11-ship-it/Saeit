name: G-01 R31 storage and S-01 offline audit regressions
on:
  pull_request:
    paths:
      - 'games/crown-defender/index.html'
      - 'games/echoform/signal-lattice.html'
      - 'games/g01-handoffs/g01_s01_checkout_focus_audit_r30.py'
      - 'tests/game/g01-r31-*.test.cjs'
      - 'tests/site/g01_s01_checkout_focus_audit_r31_test.py'
      - '.github/workflows/g01-r31-storage-offline-qa.yml'
  workflow_dispatch:
jobs:
  offline-behavior:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify earned-credit rollback
        run: node --test tests/game/g01-r31-crown-unlock.test.cjs
      - name: Verify ECHOFORM storage readback
        run: node --test tests/game/g01-r31-echo-best-storage.test.cjs
      - name: Verify S-01 offline checkout form action audit
        run: python3 -m unittest discover -s tests/site -p 'g01_s01_checkout_focus_audit_r31_test.py' -v
