name: One-time corporate outbound email canary to owner Gmail
run-name: Company SMTP owner canary - 24 Oct 2026
on:
  push:
    branches: ['ops/china-import-500-final136-20261023']
    paths: ['.github/workflows/company-mail-outbound-canary-20261024.yml']
permissions:
  contents: read
jobs:
  send_once:
    if: "${{ github.event.head_commit.message == 'test(mail): one-time owner SMTP delivery canary' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Prepare pinned secure SSH bridge to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/company-mail-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/vps.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          {
            echo 'Host bridge'; echo '  HostName 178.239.147.150'; echo '  User githubops'; echo "  IdentityFile $d/vps.key"; echo "  UserKnownHostsFile $d/vps.known";
            echo 'Host company'; echo '  HostName zohal.pws-dns.net'; echo '  User zomorod2'; echo '  Port 1396'; echo "  IdentityFile $d/host.key"; echo "  UserKnownHostsFile $d/host.known"; echo '  ProxyJump bridge';
            echo 'Host *'; echo '  StrictHostKeyChecking yes'; echo '  IdentitiesOnly yes'; echo '  BatchMode yes'; echo '  ConnectTimeout 12'; echo '  ForwardAgent no'; echo '  RequestTTY no';
          } > "$d/config"
          chmod 600 "$d/config"
          echo SSH_BRIDGE_PIN_VERIFIED
      - name: Submit exactly one owner-addressed message into corporate Exim
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/company-mail-inspect"
          timeout 40s ssh -T -F "$d/config" company /usr/sbin/sendmail -t -i -f moj_1ro_1@zomorodmelal.ir <<'MAIL'
          From: Zomorod Melal Mail Diagnostics <moj_1ro_1@zomorodmelal.ir>
          To: Mojtaba Roozegar <mojtaba.rozegar11@gmail.com>
          Subject: ZM-MAIL-OUTBOUND-CANARY-20261024-1135
          Date: Sat, 24 Oct 2026 11:35:00 +0330
          MIME-Version: 1.0
          Content-Type: text/plain; charset=UTF-8
          X-ZM-Canary: owner-authorized-once-20261024

          This is a one-time company mail server outbound deliverability test addressed only to the owner's Gmail inbox. No reply is required.
          MAIL
          echo COMPANY_EXIM_LOCAL_QUEUE_ACCEPTED=1
          echo REMOTE_GMAIL_DELIVERY_NOT_YET_VERIFIED
      - name: Remove SSH keys
        if: always()
        run: |
          d="$RUNNER_TEMP/company-mail-inspect"
          test ! -d "$d" || find "$d" -maxdepth 1 -type f -exec shred -u {} +
