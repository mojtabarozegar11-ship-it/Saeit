name: Mojtaba direct social API safe tests
on:
  pull_request:
    paths:
      - 'scripts/mojtaba_direct_social_publisher_20261026.py'
      - 'tests/test_mojtaba_direct_social_publisher_20261026.py'
      - '.github/workflows/mojtaba-direct-social-api-tests-20261026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-network, isolated regression tests
        env:
          MPW_SOCIAL_EXECUTION_ENABLED: '0'
        run: python -m unittest discover -s tests -p 'test_mojtaba_direct_social_publisher_20261026.py' -v
