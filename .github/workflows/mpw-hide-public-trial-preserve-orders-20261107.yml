name: Hide public MojPlayWin trial without affecting orders
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-hide-public-trial-preserve-orders-20261107.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-hide-public-trial-preserve-orders
  cancel-in-progress: false
jobs:
  hide:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-hide-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Remove trial from public code paths and preserve all orders
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-hide-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import hashlib,json,os,pwd,stat
          from pathlib import Path
          APP=Path('/home/zomorod2/Saeit-staging')
          WSGI=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          BACKUP=Path('/home/zomorod2/.mpw-trial-779-owner-release-20261026')
          FILES={'view':APP/'core/brand_views.py','settings':APP/'config/settings.py','store':APP/'core/templates/mojplaywin/store.html','detail':APP/'core/templates/brands/mojplaywin/product.html'}
          if pwd.getpwuid(os.getuid()).pw_name!='zomorod2' or APP.is_symlink() or not APP.is_dir() or WSGI.is_symlink() or not WSGI.is_file():
              raise RuntimeError('UNTRUSTED_LIVE_ROOT')
          if "APP='/home/zomorod2/Saeit-staging'" not in WSGI.read_text(errors='replace'):
              raise RuntimeError('PASSENGER_ROOT_MISMATCH')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          candidates=[]
          if BACKUP.is_dir() and not BACKUP.is_symlink():
              for d in BACKUP.iterdir():
                  if not d.is_dir() or d.is_symlink() or not d.name.isdigit(): continue
                  m=d/'manifest.json'
                  if not m.is_file() or m.is_symlink(): continue
                  try:
                      data=json.loads(m.read_text())
                      if data.get('state')!='installed': continue
                      if all(sha(FILES[k])==data['after'][k] for k in FILES): candidates.append((d,data))
                  except Exception: continue
          if len(candidates)!=1:
              raise RuntimeError('EXPECTED_ONE_VERIFIED_RELEASE_MANIFEST_GOT_'+str(len(candidates)))
          d,data=candidates[0]
          before={k:(d/(k+'.bak')).read_bytes() for k in FILES}
          if any(hashlib.sha256(v).hexdigest()!=data['before'][k] for k,v in before.items()):
              raise RuntimeError('BACKUP_MANIFEST_HASH_MISMATCH')
          for k,p in FILES.items():
              mode=stat.S_IMODE(p.stat().st_mode)
              tmp=p.with_name('.mpw-hide-'+k)
              fd=os.open(str(tmp),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,mode)
              try:
                  with os.fdopen(fd,'wb') as f: f.write(before[k]); f.flush(); os.fsync(f.fileno())
                  os.replace(tmp,p)
              finally:
                  if tmp.exists(): tmp.unlink()
          for folder in (APP/'tmp',WSGI.parent/'tmp'):
              folder.mkdir(mode=0o700,exist_ok=True)
              flag=folder/'restart.txt'
              fd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600); os.close(fd); os.utime(flag,None)
          os.chdir(APP); import sys; sys.path.insert(0,str(APP)); os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django; django.setup()
          from core.models import Product,OrderItem
          p=Product.objects.get(pk=779)
          print('MPW_779_PRESERVED='+json.dumps({'active':p.active,'orders':OrderItem.objects.filter(product_id=779).count(),'asset_retained':True,'public_code_restored':True}))
          if not p.active or OrderItem.objects.filter(product_id=779).count()<1: raise RuntimeError('ORDER_OR_PRODUCT_PRESERVATION_CHECK_FAILED')
          PY
      - name: Verify live catalog and original products
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request('https://mojplaywin.com/commerce/trx-easy/',headers={'Cache-Control':'no-cache, no-store, max-age=0','User-Agent':'MPW-Hide-779/1'})
          with urllib.request.urlopen(req,timeout=25) as r:
              body=r.read(240000).decode('utf-8','replace')
          if 'MojPlayWin Secure TRX Purchase' in body or '/store/product/779/' in body or '/commerce/book/779/' in body:
              raise RuntimeError('TRIAL_STILL_PUBLIC')
          for path in ('/store/','/store/product/72/','/store/product/225/','/store/product/879/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Hide-779/1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status != 200: raise RuntimeError(path+' HTTP '+str(r.status))
          print('MPW_PUBLIC_CATALOG=PASS')
          print('MPW_ORIGINAL_PRODUCTS=HEALTHY')
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-hide-ssh"
