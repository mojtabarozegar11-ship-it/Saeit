name: MPW private merchant-only TRON Mainnet acceptance
on:
  workflow_dispatch:
    inputs:
      canary_action:
        description: 'Read-only preflight, one real invoice plus automatic verification, or verify'
        required: true
        type: choice
        default: preflight
        options: [preflight, issue, verify]
      sender:
        description: 'Mainnet public sender TRON address; NEVER seed or private key'
        required: false
        type: string
      invoice_id:
        description: 'Previously issued private canary invoice ID for verify only'
        required: false
        type: string
permissions: {contents: read}
jobs:
  merchant-private-canary:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91433ec0ebe4474eab09e167626871f0678f4ef7
          persist-credentials: false
      - name: Test immutable reviewed merchant canary source before accessing relay
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_trx_private_canary_20261023.py
          python3 -B -m unittest tests.test_mpw_trx_private_canary_20261023 -q
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        id: link
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          # Use the already-proven pinned VPS public host key; avoid a
          # runner-side ssh-keyscan dependency before relay authentication.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_observed="$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)"
          test "$vps_observed" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'

          # Use the already-proven pinned public cPanel host key; do not depend
          # on a VPS-side ssh-keyscan that can fail before the authenticated hop.
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName 178.239.147.125\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\n ControlMaster auto\n ControlPath %s/cpanel.sock\n ControlPersist 300\nHost saeit-cpanel-direct\n HostName 178.239.147.125\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump none\n ControlMaster auto\n ControlPath %s/direct.sock\n ControlPersist 300\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 30\n ConnectionAttempts 3\n ServerAliveInterval 15\n ServerAliveCountMax 4\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"

          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          host_observed="$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)"
          test "$host_observed" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.candidate" "$d/host.known"
          echo 'VPS_HOST_KEY=verified'
          echo 'CPANEL_HOST_KEY=verified'

          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -d /home/zomorod2/Saeit-staging' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -d /home/zomorod2/Saeit-staging' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Check both actual TRON solidified heads on cPanel without funds or DB writes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 125s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" "$COMMAND_HOST" '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preflight' < scripts/mpw_trx_private_canary_20261023.py
      - name: Inventory real low-value digital SKU and merchant staff accounts without writes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" "$COMMAND_HOST" 'MPW_TRX_CANARY_EXPECTED_SENDER=THFNU1iEXHd71WjEgjqUksd2UnMg2pUi73 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - inventory' < scripts/mpw_trx_private_canary_20261023.py
      - name: Issue exactly one private merchant Mainnet invoice; show exact address and amount
        if: github.event_name == 'workflow_dispatch' && inputs.canary_action == 'issue'
        id: issue
        env:
          CANARY_SENDER: ${{ inputs.sender }}
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          [[ "$CANARY_SENDER" =~ ^T[1-9A-HJ-NP-Za-km-z]{33}$ ]] || { echo 'INVALID_PUBLIC_MAINNET_SENDER'; exit 2; }
          output="$(timeout 125s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" "$COMMAND_HOST" "MPW_TRX_CANARY_ISSUE_ACK=merchant-one-time-mainnet-canary-20261115 MPW_TRX_CANARY_BUYER_ID=auto MPW_TRX_CANARY_PRODUCT_ID=auto MPW_TRX_CANARY_EXPECTED_SENDER=$CANARY_SENDER /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - issue" < scripts/mpw_trx_private_canary_20261023.py)"
          printf '%s\n' "$output"
          CANARY_RESULT="$output" python3 -c 'import json,os; lines=[s for s in os.environ["CANARY_RESULT"].splitlines() if s.startswith("MPW_PRIVATE_MAINNET_CANARY=")]; d=json.loads(lines[-1].split("=",1)[1]); n=d.get("invoice_id"); assert d.get("status") in ("PRIVATE_CANARY_INVOICE_CREATED","EXISTING_PRIVATE_CANARY") and type(n) is int and 0<n<2**63; print("invoice_id="+str(n))' >> "$GITHUB_OUTPUT"
      - name: Automatically witness finalized Mainnet payment, accounting and exact buyer download
        if: github.event_name == 'workflow_dispatch' && inputs.canary_action == 'issue'
        env:
          CANARY_SENDER: ${{ inputs.sender }}
          CANARY_INVOICE_ID: ${{ steps.issue.outputs.invoice_id }}
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          [[ "$CANARY_SENDER" =~ ^T[1-9A-HJ-NP-Za-km-z]{33}$ ]] || exit 2
          [[ "$CANARY_INVOICE_ID" =~ ^[1-9][0-9]{0,18}$ ]] || exit 2
          for attempt in $(seq 1 35); do
            result="$(timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" "$COMMAND_HOST" "MPW_TRX_CANARY_BUYER_ID=auto MPW_TRX_CANARY_PRODUCT_ID=auto MPW_TRX_CANARY_EXPECTED_SENDER=$CANARY_SENDER /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify --invoice-id $CANARY_INVOICE_ID" < scripts/mpw_trx_private_canary_20261023.py)"
            if [[ "$result" == *'PRIVATE_CANARY_PAYMENT_AND_DOWNLOAD_PASSED'* ]]; then
              printf '%s\n' "$result"
              echo 'PRIVATE_CANARY_ACCEPTED_REAL_MAINNET_PAYMENT=PASS'
              exit 0
            fi
            echo "PRIVATE_MAINNET_SETTLEMENT_PENDING attempt=$attempt/35"
            sleep 15
          done
          echo 'PRIVATE_MAINNET_CANARY_NOT_SETTLED_BEFORE_TIMEOUT; PUBLIC_RELEASE_STAYS_OFF'
          exit 2
      - name: Independently recheck an existing real private canary receipt
        if: github.event_name == 'workflow_dispatch' && inputs.canary_action == 'verify'
        env:
          CANARY_SENDER: ${{ inputs.sender }}
          CANARY_INVOICE_ID: ${{ inputs.invoice_id }}
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          [[ "$CANARY_SENDER" =~ ^T[1-9A-HJ-NP-Za-km-z]{33}$ ]] || { echo 'INVALID_PUBLIC_MAINNET_SENDER'; exit 2; }
          [[ "$CANARY_INVOICE_ID" =~ ^[1-9][0-9]{0,18}$ ]] || { echo 'INVALID_CANARY_INVOICE_ID'; exit 2; }
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" "$COMMAND_HOST" "MPW_TRX_CANARY_BUYER_ID=auto MPW_TRX_CANARY_PRODUCT_ID=auto MPW_TRX_CANARY_EXPECTED_SENDER=$CANARY_SENDER /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify --invoice-id $CANARY_INVOICE_ID" < scripts/mpw_trx_private_canary_20261023.py
      - name: Cleanup relay key material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config" "$d/cpanel.sock" "$d/direct.sock"; rmdir "$d"; fi
