name: Mojtaba revenue cycle 02 isolated database and sales controls
on:
  push:
    branches:
      - feature/mojtaba-revenue-ops-db-ci-cycle02-20261114
    paths:
      - .github/workflows/mojtaba-revenue-cycle02-db-ci-20261114.yml
permissions:
  contents: read
jobs:
  verify-readonly-revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SECRET_KEY: local-ci-not-production-20261114
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///test-revenue-cycle02.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Python 3.11 runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project requirements with no external credentials
        run: python -m pip install -r requirements.txt
      - name: Compile all changed source and test modules
        run: |
          python -m py_compile core/revenue_unit_economics.py core/service_sales_controls.py core/economic_master_agent.py
          python -m py_compile command_center/revenue_operations.py command_center/commerce_funnel.py command_center/urls.py
          python -m py_compile core/management/commands/mojtaba_quote_scenario_readonly.py core/management/commands/mojtaba_revenue_ops_readonly.py
          python -m py_compile command_center/tests/test_revenue_operations_20261114.py core/tests/test_service_sales_controls_20261114.py core/tests/test_revenue_unit_economics_20261114.py
      - name: Validate Django application configuration
        run: python manage.py check
      - name: Pure-money regressions
        run: python -m unittest discover -s core/tests -p 'test_revenue_unit_economics_20261114.py' -q
      - name: Six-service commercial release controls
        run: python -m unittest discover -s core/tests -p 'test_service_sales_controls_20261114.py' -q
      - name: Isolated SQLite Django CRM and funnel regressions
        run: python -m pytest command_center/tests/test_revenue_operations_20261114.py -q --disable-warnings --maxfail=1
