name: Run Zomorod site agent cycle
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-site-agent-cycle.yml"
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-site-agent-cycle
  cancel-in-progress: false
jobs:
  site-agent-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare the pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-agent"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Verify the exact Zomorod app and runtime
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          test -d "$app" && test -f "$app/manage.py"
          raw="$(mktemp "$HOME/.zomorod-agent-app.XXXXXX.json")"
          trap 'rm -f -- "$raw"' EXIT
          uapi --output=json PassengerApps list_applications > "$raw"
          python3 - "$raw" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          stack=[data]; matches=[]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  if str(value.get("domain","")).lower()=="zomorodmelal.ir" and value.get("base_uri")=="/" and value.get("path")=="/home/zomorod2/Saeit":
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          if len(matches)!=1:
              raise SystemExit("ZOMOROD_ROOT_APP_MAPPING=not_verified")
          print("ZOMOROD_ROOT_APP_MAPPING=verified")
          PY
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          test -n "$selector" || { echo "CLOUDLINUX_SELECTOR=unavailable" >&2; exit 1; }
          python3 - "$HOME/.cl.selector/python-selector.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          app=data.get("Saeit",{})
          if str(app.get("domain","")).lower()!="zomorodmelal.ir" or app.get("app_uri") not in ("",None) or str(app.get("python_version"))!="3.10":
              raise SystemExit("SELECTOR_ROOT_APP_MAPPING=not_verified")
          print("SELECTOR_ROOT_APP_MAPPING=verified")
          print("SELECTOR_PYTHON_VERSION=3.10")
          PY
          run_selector() {
            label="$1"; shift
            output="$(mktemp "$HOME/.zomorod-agent-$label.XXXXXX.json")"
            if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- "$@" > "$output"; then
              rm -f -- "$output"
              echo "SELECTOR_$label=failed" >&2
              return 1
            fi
            python3 - "$output" "$label" <<'PY'
          import base64,json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          result=data.get("result")
          print(f"SELECTOR_{sys.argv[2]}={result}")
          payload=data.get("data")
          if isinstance(payload,str) and payload:
              try:
                  output=base64.b64decode(payload,validate=True).decode("utf-8","replace")
              except Exception as exc:
                  raise SystemExit(f"SELECTOR_{sys.argv[2]}_OUTPUT_DECODE_FAILED={type(exc).__name__}")
              if output.strip():
                  print(output.rstrip())
          else:
              for key in ("stdout","output"):
                  value=data.get(key)
                  if isinstance(value,str) and value.strip():
                      print(value.strip())
          if result!="success":
              raise SystemExit(1)
          PY
            rm -f -- "$output"
          }
          run_selector DJANGO_CHECK check
          run_selector DJANGO_MIGRATE_CHECK migrate --check
          echo "SITE_AGENT_RUNTIME=ready"
          REMOTE
      - name: Run one bounded, review-only site cycle
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          test -n "$selector"
          python3 - "$HOME/.cl.selector/python-selector.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          app=data.get("Saeit",{})
          if str(app.get("domain","")).lower()!="zomorodmelal.ir" or app.get("app_uri") not in ("",None) or str(app.get("python_version"))!="3.10":
              raise SystemExit("SELECTOR_ROOT_APP_MAPPING_CHANGED")
          PY
          cd /home/zomorod2/Saeit
          run_selector() {
            label="$1"; shift
            output="$(mktemp "$HOME/.zomorod-agent-run-$label.XXXXXX.json")"
            if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- "$@" > "$output"; then
              rm -f -- "$output"
              echo "SELECTOR_$label=failed" >&2
              return 1
            fi
            python3 - "$output" "$label" <<'PY'
          import base64,json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          result=data.get("result")
          print(f"SELECTOR_{sys.argv[2]}={result}")
          payload=data.get("data")
          if isinstance(payload,str) and payload:
              try:
                  output=base64.b64decode(payload,validate=True).decode("utf-8","replace")
              except Exception as exc:
                  raise SystemExit(f"SELECTOR_{sys.argv[2]}_OUTPUT_DECODE_FAILED={type(exc).__name__}")
              if output.strip():
                  print(output.rstrip())
          else:
              for key in ("stdout","output"):
                  value=data.get(key)
                  if isinstance(value,str) and value.strip():
                      print(value.strip())
          if result!="success":
              raise SystemExit(1)
          PY
            rm -f -- "$output"
          }
          run_selector COMPANY_ACTIVITY_CYCLE company_activity_agent_cycle
          run_selector KNOWLEDGE_AGENT_CYCLE knowledge_agent_cycle
          run_selector KNOWLEDGE_AGENT_GENERATE knowledge_agent_generate
          echo "AGENT_OUTPUT_POLICY=review_only"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-agent"
