name: Run Zomorod site agent cycle
# Until authenticated relay and independent cPanel execution are proven,
# allow only an explicitly authorized, bounded manual invocation.
# Never use GitHub Actions as the continuous site-agent scheduler.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-site-agent-cycle
  cancel-in-progress: false
jobs:
  site-agent-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare the pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-agent"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # Retry only transient host-key discovery, never a fingerprint mismatch.
          vps_scan=""
          for attempt in 1 2 3; do
            vps_scan="$(ssh-keyscan -T 8 -t rsa 178.239.147.150 2>/dev/null || true)"
            test -n "$vps_scan" && break
            if test "$attempt" -lt 3; then sleep 2; fi
          done
          if test -z "$vps_scan"; then
            echo "SITE_AGENT_RELAY=VPS_HOST_KEY_UNREACHABLE" >&2
            exit 1
          fi
          printf '%s\n' "$vps_scan" > "$d/vps.known"
          if test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "SITE_AGENT_RELAY=VPS_HOST_KEY_MISMATCH" >&2
            exit 1
          fi
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # Keep the verified VPS jump host and independently pinned cPanel key.
          # Suppress SSH details: public Actions logs receive status only.
          scan=""
          for attempt in 1 2 3; do
            scan="$(timeout 28s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null || true)"
            test -n "$scan" && break
            if test "$attempt" -lt 3; then sleep 2; fi
          done
          if test -z "$scan"; then
            echo "SITE_AGENT_RELAY=VPS_TO_CPANEL_UNREACHABLE_OR_UNAUTHENTICATED" >&2
            exit 1
          fi
          printf '%s\n' "$scan" > "$d/host.candidate"
          if test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "SITE_AGENT_RELAY=CPANEL_HOST_KEY_MISMATCH" >&2
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Verify the exact Zomorod app and runtime
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          htaccess=/home/zomorod2/public_html/.htaccess
          test -d "$app" && test -f "$app/manage.py" && test -f "$htaccess"
          raw="$(mktemp "$HOME/.zomorod-agent-app.XXXXXX.json")"
          trap 'rm -f -- "$raw"' EXIT
          uapi --output=json PassengerApps list_applications > "$raw"
          python3 - "$raw" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          stack=[data]; matches=[]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  if str(value.get("domain","")).lower()=="zomorodmelal.ir" and value.get("base_uri")=="/" and value.get("path")=="/home/zomorod2/Saeit":
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          if len(matches)!=1:
              raise SystemExit("ZOMOROD_ROOT_APP_MAPPING=not_verified")
          print("ZOMOROD_ROOT_APP_MAPPING=verified")
          allowed={"domain","base_uri","path","python","python_path","python_version","passenger_python"}
          for key in sorted(allowed):
              value=matches[0].get(key)
              if isinstance(value,(str,int,float,bool)):
                  print(f"PASSENGER_APP_{key.upper()}={value}")
          PY
          # PassengerPython may point at CloudLinux's lswsgi entrypoint, not a
          # callable Python interpreter. Never execute that value as Python.
          # The live Django application has a separate, app-owned virtualenv.
          passenger_entry="$(awk '$1 == "PassengerPython" { gsub(/"/, "", $2); print $2; exit }' "$htaccess")"
          printf 'PASSENGER_ENTRYPOINT_PRESENT=%s\n' "$([ -n "$passenger_entry" ] && echo yes || echo no)"
          python_path="$app/.venv/bin/python"
          if ! test -f "$app/.venv/pyvenv.cfg" || ! test -x "$python_path"; then
            echo "SITE_AGENT_VENV_INTERPRETER=missing" >&2
            exit 1
          fi
          "$python_path" -c 'import pathlib,sys; expected=pathlib.Path("/home/zomorod2/Saeit/.venv").resolve(); assert pathlib.Path(sys.prefix).resolve()==expected, "wrong interpreter"'
          echo "SITE_AGENT_VENV_INTERPRETER=verified"
          "$python_path" -c 'import django, environ, rest_framework, whitenoise'
          cd "$app"
          "$python_path" manage.py check
          "$python_path" - <<'DBREADONLY'
          import os
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection
          print("SITE_AGENT_ENV_FILE_PRESENT=" + str((Path.cwd() / ".env").is_file()))
          print("SITE_AGENT_DB_ENGINE=" + str(settings.DATABASES["default"]["ENGINE"]).rsplit(".", 1)[-1])
          with connection.cursor() as cur:
              names=set(connection.introspection.table_names(cur))
              print("SITE_AGENT_DB_TABLE_COUNT=" + str(len(names)))
              print("SITE_AGENT_DB_MIGRATIONS_TABLE_PRESENT=" + str("django_migrations" in names))
              if "django_migrations" in names:
                  cur.execute("SELECT COUNT(*) FROM django_migrations")
                  print("SITE_AGENT_DB_APPLIED_MIGRATIONS=" + str(cur.fetchone()[0]))
          DBREADONLY
          if ! "$python_path" manage.py migrate --check; then
            # The Django runner currently resolves to an empty SQLite database.
            # Do not auto-migrate a production-facing app or invent agent data.
            # Use the existing isolated eleven-agent PHP runtime instead.
            echo "SITE_AGENT_DJANGO_SCHEMA=unavailable"
            echo "SITE_AGENT_FALLBACK=isolated_php_eleven"
            exit 0
          fi
          echo "SITE_AGENT_MIGRATIONS_PENDING=no"
          # Bounded read-only inventory: diagnose source/schema drift before any
          # command is allowed to create drafts or queue tasks.
          "$python_path" - <<'AGENT_READONLY'
          import os
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.core.management import get_commands
          from django.db import connection
          from django.db.migrations.loader import MigrationLoader
          from django.db.migrations.recorder import MigrationRecorder
          app = Path("/home/zomorod2/Saeit")
          required = {
              "company_activity_agent_cycle": "core/management/commands/company_activity_agent_cycle.py",
              "company_activity_agent_module": "core/company_activity_agent.py",
              "knowledge_agent_cycle": "core/management/commands/knowledge_agent_cycle.py",
              "knowledge_agent_module": "core/knowledge_agent.py",
              "knowledge_quality_module": "core/knowledge_quality.py",
              "newsletter_process_queue": "core/management/commands/newsletter_process_queue.py",
          }
          registered = get_commands()
          for label, rel in required.items():
              print(f"CPANEL_AGENT_SOURCE_{label.upper()}={'present' if (app / rel).is_file() else 'missing'}")
              if label.endswith("_cycle") or label == "newsletter_process_queue":
                  print(f"CPANEL_AGENT_COMMAND_{label.upper()}={'present' if label in registered else 'missing'}")
          existing = set(connection.introspection.table_names())
          for table in ("core_companyactivityagentplan", "core_companyactivityreport", "core_knowledgeagentplan", "core_knowledgebook", "core_knowledgeagentrun", "core_newslettersubmission"):
              print(f"CPANEL_AGENT_TABLE_{table.upper()}={'present' if table in existing else 'missing'}")
          loader = MigrationLoader(connection)
          applied = MigrationRecorder(connection).applied_migrations()
          print("CPANEL_CORE_MIGRATIONS_ON_DISK=" + str(sum(1 for app_label, _ in loader.disk_migrations if app_label == "core")))
          print("CPANEL_CORE_MIGRATIONS_APPLIED=" + str(sum(1 for app_label, _ in applied if app_label == "core")))
          # Only bounded aggregate counts; no owner submissions, messages or payloads.
          from core.newsletter_models import NewsletterSubmission
          from core.models import Agent, NewsletterSchedule, AgentTask
          from core.knowledge_agent_models import KnowledgeAgentRun
          print("CPANEL_NEWSLETTER_ENGINE_SOURCE=" + ("present" if (app / "core/newsletter_engine.py").is_file() else "missing"))
          print("CPANEL_NEWSLETTER_CONTENT_LINK_SOURCE=" + ("present" if (app / "core/company_content_models.py").is_file() else "missing"))
          for status in ("queued", "processing", "drafted", "rejected"):
              print(f"CPANEL_NEWSLETTER_SUBMISSIONS_{status.upper()}=" + str(NewsletterSubmission.objects.filter(status=status).count()))
          schedules = list(NewsletterSchedule.objects.filter(active=True).values_list("publication_requires_approval", flat=True)[:2])
          print("CPANEL_NEWSLETTER_ACTIVE_SCHEDULE_COUNT=" + str(NewsletterSchedule.objects.filter(active=True).count()))
          print("CPANEL_NEWSLETTER_UNAPPROVED_SCHEDULING_ENABLED=" + str(any(not required for required in schedules)))
          for code in ("content-director", "newsletter-specialist", "newsletter-company-news", "newsletter-world-watch", "newsletter-unit-reports", "knowledge-content-director"):
              agent = Agent.objects.filter(code=code).values_list("active", flat=True).first()
              print("CPANEL_AGENT_" + code.upper().replace("-", "_") + "=" + ("missing" if agent is None else "active" if agent else "disabled"))
          for status in ("queued", "blocked", "completed"):
              print("CPANEL_KNOWLEDGE_RUNS_" + status.upper() + "=" + str(KnowledgeAgentRun.objects.filter(status=status).count()))
          print("CPANEL_KNOWLEDGE_QUEUED_TASKS=" + str(AgentTask.objects.filter(action_type="knowledge_content_generation", status="queued").count()))
          print("CPANEL_AGENT_INVENTORY=readonly_no_changes")
          AGENT_READONLY
          available="$("$python_path" manage.py help --commands)"
          for command in company_activity_agent_cycle knowledge_agent_cycle; do
            if ! printf '%s\n' "$available" | grep -Fxq "$command"; then
              echo "SITE_AGENT_COMMAND_MISSING=$command" >&2
              exit 1
            fi
          done
          echo "SITE_AGENT_COMMANDS=verified"
          echo "SITE_AGENT_RUNTIME=ready"
          REMOTE
      - name: Run one bounded, approval-gated site cycle
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          python_path="$app/.venv/bin/python"
          test -f "$app/.venv/pyvenv.cfg" && test -x "$python_path"
          "$python_path" -c 'import pathlib,sys; expected=pathlib.Path("/home/zomorod2/Saeit/.venv").resolve(); assert pathlib.Path(sys.prefix).resolve()==expected, "wrong interpreter"'
          echo "SITE_AGENT_RUN_INTERPRETER=verified"
          cd "$app"
          if "$python_path" manage.py migrate --check >/dev/null 2>&1; then
            activity_output="$("$python_path" manage.py company_activity_agent_cycle)"
            queue_output="$("$python_path" manage.py knowledge_agent_cycle)"
            printf '%s\n' "$activity_output" "$queue_output"
            # A zero-exit Django command may have only reported WAIT. Count
            # documented outputs separately from successful task invocation.
            reports=0
            if [[ "$activity_output" =~ COMPANY_ACTIVITY_AGENT=QUEUED\ REPORTS=([0-9]+) ]]; then
              reports="${BASH_REMATCH[1]}"
            fi
            echo "SITE_AGENT_CREATED_REPORTS=$reports"
            echo "SITE_AGENT_DRAFTS_GENERATED=0"
            echo "SITE_AGENT_PAID_GENERATION=not_scheduled"
            if (( reports > 0 )); then
              echo "SITE_AGENT_MEASURED_OUTPUT=created_for_review"
            else
              echo "SITE_AGENT_MEASURED_OUTPUT=none"
            fi
            echo "SITE_AGENT_DJANGO_CYCLE=invoked"
          else
            agent_file="$HOME/.private/zomorod-business/site_agents.php"
            agent_db="$HOME/.private/zomorod-business/site_agents.sqlite3"
            test -s "$agent_file" && test -s "$agent_db" && test ! -L "$agent_file" && test ! -L "$agent_db"
            phpbin="$(command -v php || true)"
            if test -z "$phpbin"; then phpbin=/opt/cpanel/ea-php82/root/usr/bin/php; fi
            "$phpbin" -d display_errors=0 -r '
            require $argv[1];
            $db=zmAgentDb(dirname($argv[1]));
            $before=(int)$db->query("SELECT COUNT(*) FROM runs")->fetchColumn();
            $out=zmAgentCycle($db);
            $after=(int)$db->query("SELECT COUNT(*) FROM runs")->fetchColumn();
            $expected=["agriculture","commerce","content","economic","master","media","quality","research","security","seo","weather"];
            $seen=[];
            foreach($out as $entry){
              if(!is_array($entry) || count($entry)<3) exit(8);
              [$code,$status,$http]=$entry;
              if($status!=="ok" || (int)$http!==200) exit(8);
              $seen[]=$code;
            }
            if(count($out)!==11 || $after-$before!==11 || array_diff($expected,$seen) || count(array_unique($seen))!==11) exit(8);
            echo "SITE_AGENT_PRIVATE_HTTP_CHECKS=11\n";
            echo "SITE_AGENT_PRIVATE_BUSINESS_OUTPUT=unverified\n";
            ' "$agent_file"
            echo "SITE_AGENT_DJANGO_CYCLE=unavailable_database_schema"
          fi
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-agent"
