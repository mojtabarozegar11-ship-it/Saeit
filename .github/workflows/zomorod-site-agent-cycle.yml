name: Run Zomorod site agent cycle
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-site-agent-cycle.yml"
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-site-agent-cycle
  cancel-in-progress: false
jobs:
  site-agent-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare the pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-agent"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Verify the exact Zomorod app and runtime
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          htaccess=/home/zomorod2/public_html/.htaccess
          test -d "$app" && test -f "$app/manage.py" && test -f "$htaccess"
          raw="$(mktemp "$HOME/.zomorod-agent-app.XXXXXX.json")"
          trap 'rm -f -- "$raw"' EXIT
          uapi --output=json PassengerApps list_applications > "$raw"
          python3 - "$raw" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          stack=[data]; matches=[]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  if str(value.get("domain","")).lower()=="zomorodmelal.ir" and value.get("base_uri")=="/" and value.get("path")=="/home/zomorod2/Saeit":
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          if len(matches)!=1:
              raise SystemExit("ZOMOROD_ROOT_APP_MAPPING=not_verified")
          print("ZOMOROD_ROOT_APP_MAPPING=verified")
          allowed={"domain","base_uri","path","python","python_path","python_version","passenger_python"}
          for key in sorted(allowed):
              value=matches[0].get(key)
              if isinstance(value,(str,int,float,bool)):
                  print(f"PASSENGER_APP_{key.upper()}={value}")
          PY
          # PassengerPython may point at CloudLinux's lswsgi entrypoint, not a
          # callable Python interpreter. Never execute that value as Python.
          # The live Django application has a separate, app-owned virtualenv.
          passenger_entry="$(awk '$1 == "PassengerPython" { gsub(/"/, "", $2); print $2; exit }' "$htaccess")"
          printf 'PASSENGER_ENTRYPOINT_PRESENT=%s\n' "$([ -n "$passenger_entry" ] && echo yes || echo no)"
          python_path="$app/.venv/bin/python"
          if ! test -f "$app/.venv/pyvenv.cfg" || ! test -x "$python_path"; then
            echo "SITE_AGENT_VENV_INTERPRETER=missing" >&2
            exit 1
          fi
          "$python_path" -c 'import pathlib,sys; expected=pathlib.Path("/home/zomorod2/Saeit/.venv").resolve(); assert pathlib.Path(sys.prefix).resolve()==expected, "wrong interpreter"'
          echo "SITE_AGENT_VENV_INTERPRETER=verified"
          "$python_path" -c 'import django, environ, rest_framework, whitenoise'
          cd "$app"
          "$python_path" manage.py check
          "$python_path" - <<'DBREADONLY'
          import os
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection
          print("SITE_AGENT_ENV_FILE_PRESENT=" + str((Path.cwd() / ".env").is_file()))
          print("SITE_AGENT_DB_ENGINE=" + str(settings.DATABASES["default"]["ENGINE"]).rsplit(".", 1)[-1])
          with connection.cursor() as cur:
              names=set(connection.introspection.table_names(cur))
              print("SITE_AGENT_DB_TABLE_COUNT=" + str(len(names)))
              print("SITE_AGENT_DB_MIGRATIONS_TABLE_PRESENT=" + str("django_migrations" in names))
              if "django_migrations" in names:
                  cur.execute("SELECT COUNT(*) FROM django_migrations")
                  print("SITE_AGENT_DB_APPLIED_MIGRATIONS=" + str(cur.fetchone()[0]))
          DBREADONLY
          if ! "$python_path" manage.py migrate --check; then
            # The Django runner currently resolves to an empty SQLite database.
            # Do not auto-migrate a production-facing app or invent agent data.
            # Use the existing isolated eleven-agent PHP runtime instead.
            echo "SITE_AGENT_DJANGO_SCHEMA=unavailable"
            echo "SITE_AGENT_FALLBACK=isolated_php_eleven"
            exit 0
          fi
          echo "SITE_AGENT_MIGRATIONS_PENDING=no"
          echo "SITE_AGENT_RUNTIME=ready"
          REMOTE
      - name: Run one bounded, approval-gated site cycle
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          python_path="$app/.venv/bin/python"
          test -f "$app/.venv/pyvenv.cfg" && test -x "$python_path"
          "$python_path" -c 'import pathlib,sys; expected=pathlib.Path("/home/zomorod2/Saeit/.venv").resolve(); assert pathlib.Path(sys.prefix).resolve()==expected, "wrong interpreter"'
          echo "SITE_AGENT_RUN_INTERPRETER=verified"
          cd "$app"
          if "$python_path" manage.py migrate --check >/dev/null 2>&1; then
            "$python_path" manage.py company_activity_agent_cycle
            "$python_path" manage.py knowledge_agent_cycle
            "$python_path" manage.py knowledge_agent_generate
            echo "SITE_AGENT_DJANGO_CYCLE=executed"
          else
            agent_file="$HOME/.private/zomorod-business/site_agents.php"
            agent_db="$HOME/.private/zomorod-business/site_agents.sqlite3"
            test -s "$agent_file" && test -s "$agent_db" && test ! -L "$agent_file" && test ! -L "$agent_db"
            phpbin="$(command -v php || true)"
            if test -z "$phpbin"; then phpbin=/opt/cpanel/ea-php82/root/usr/bin/php; fi
            "$phpbin" -d display_errors=0 -r '
            require $argv[1];
            $db=zmAgentDb(dirname($argv[1]));
            $before=(int)$db->query("SELECT COUNT(*) FROM runs")->fetchColumn();
            $out=zmAgentCycle($db);
            $after=(int)$db->query("SELECT COUNT(*) FROM runs")->fetchColumn();
            $expected=["agriculture","commerce","content","economic","master","media","quality","research","security","seo","weather"];
            $seen=[];
            foreach($out as $entry){
              if(!is_array($entry) || count($entry)<3) exit(8);
              [$code,$status,$http]=$entry;
              if($status!=="ok" || (int)$http!==200) exit(8);
              $seen[]=$code;
            }
            if(count($out)!==11 || $after-$before!==11 || array_diff($expected,$seen) || count(array_unique($seen))!==11) exit(8);
            echo "SITE_AGENT_PRIVATE_FALLBACK_ACTIVE=11\n";
            ' "$agent_file"
            echo "SITE_AGENT_DJANGO_CYCLE=unavailable_database_schema"
          fi
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-agent"
