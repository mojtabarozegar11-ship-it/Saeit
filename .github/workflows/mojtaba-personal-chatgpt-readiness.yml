name: Mojtaba ChatGPT SearchBot readiness audit
on:
  pull_request:
    paths:
      - .github/workflows/mojtaba-personal-chatgpt-readiness.yml
      - scripts/mojtaba_personal_chatgpt_search_readiness.py
      - tests/test_mojtaba_personal_chatgpt_search_readiness.py
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: mojtaba-personal-chatgpt-readonly
  cancel-in-progress: false
jobs:
  quality:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
        github.event.issue.title == 'Ops: Mojtaba ChatGPT search readiness check'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for domain-root robots, crawler identity and SEO parsing
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_personal_chatgpt_search_readiness.py
          python3 -m unittest discover -s tests -p 'test_mojtaba_personal_chatgpt_search_readiness.py' -v
  public-readonly:
    needs: quality
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
        github.event.issue.title == 'Ops: Mojtaba ChatGPT search readiness check'))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify root robots, ChatGPT user agents, bilingual About FAQ and sitemap
        run: |
          set -euo pipefail
          python3 scripts/mojtaba_personal_chatgpt_search_readiness.py --timeout 12
