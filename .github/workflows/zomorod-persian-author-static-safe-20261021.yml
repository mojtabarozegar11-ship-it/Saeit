name: Zomorod Persian author static route safe publication
on:
  push:
    branches: [main]
    paths:
      - public/authors/mojtaba-rozegar/index.html
      - scripts/zomorod_author_profile_route_release_20261023.py
      - tests/test_zomorod_author_identity_seo.py
      - .github/workflows/zomorod-persian-author-static-safe-20261021.yml
  pull_request:
    branches: [main]
    paths:
      - public/authors/mojtaba-rozegar/index.html
      - scripts/zomorod_author_profile_route_release_20261023.py
      - tests/test_zomorod_author_identity_seo.py
      - .github/workflows/zomorod-persian-author-static-safe-20261021.yml
permissions: {contents: read}
concurrency:
  group: zomorod-persian-author-static-safe
  cancel-in-progress: false
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify canonical Persian profile and identity schema
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          path=Path("public/authors/mojtaba-rozegar/index.html")
          raw=path.read_text(encoding="utf8")
          assert '<html lang="fa" dir="rtl">' in raw and 'id="profile-name"' in raw
          assert '<link rel="canonical" href="https://zomorodmelal.ir/authors/mojtaba-rozegar/">' in raw
          data=json.loads(raw.split('<script type="application/ld+json">')[1].split('</script>')[0])
          assert data["@type"]=="ProfilePage" and data["mainEntity"]["name"]=="مجتبی روزگار"
          assert raw.count('</html>')==1 and 'ceo-mojtaba-rozegar.webp' in raw
          print("ZM_AUTHOR_STATIC_SOURCE_QA=PASS")
          PY
          python3 -m unittest discover -s tests -p 'test_zomorod_author_identity_seo.py' -v
  deploy:
    needs: source-qa
    if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned SSH relay to verified cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/author-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -T -F "$d/config" vps 'timeout 10s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo ZM_AUTHOR_PINNED_RELAY=PASS
      - name: Stage original page privately with SHA256 verification
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/author-ssh"
          stage="/home/zomorod2/.private-zm-author-route/$GITHUB_RUN_ID"
          timeout 45s ssh -T -F "$d/config" cpanel "umask 077; test ! -e '$stage' && mkdir -p '$stage' && chmod 700 '$stage'"
          timeout 45s scp -q -F "$d/config" public/authors/mojtaba-rozegar/index.html "cpanel:$stage/source.html"
          timeout 45s scp -q -F "$d/config" scripts/zomorod_author_profile_route_release_20261023.py "cpanel:$stage/release.py"
          expected="$(sha256sum public/authors/mojtaba-rozegar/index.html | cut -d' ' -f1)"
          actual="$(timeout 45s ssh -T -F "$d/config" cpanel "sha256sum '$stage/source.html' | cut -d' ' -f1")"
          test "$actual" = "$expected"
          timeout 45s ssh -T -F "$d/config" cpanel "test -s '$stage/release.py' && test ! -L '$stage/release.py'"
          echo ZM_AUTHOR_STAGING_SHA256=PASS
      - name: Atomically install updated Persian profile and remove only its obsolete redirect
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/author-ssh"
          expected="$(sha256sum public/authors/mojtaba-rozegar/index.html | cut -d' ' -f1)"
          stage="/home/zomorod2/.private-zm-author-route/$GITHUB_RUN_ID"
          timeout 70s ssh -T -F "$d/config" cpanel "python3 '$stage/release.py' install '$GITHUB_RUN_ID' '$expected'"
      - name: Verify live Persian author route and unrelated URLs
        run: |
          set -euo pipefail
          url="https://zomorodmelal.ir/authors/mojtaba-rozegar/"
          status=000
          for i in 1 2 3 4 5; do
            status="$(curl -sS --max-time 18 -o "$RUNNER_TEMP/author-public.html" -w '%{http_code}' "$url?verify=$GITHUB_RUN_ID-$i")"
            test "$status" = 200 && break
            sleep 3
          done
          test "$status" = 200
          grep -Fq 'id="profile-name"' "$RUNNER_TEMP/author-public.html"
          grep -Fq 'دکتر مجتبی روزگار' "$RUNNER_TEMP/author-public.html"
          grep -Fq 'https://zomorodmelal.ir/authors/mojtaba-rozegar/' "$RUNNER_TEMP/author-public.html"
          image_code="$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp")"
          test "$image_code" = 200
          sitemap_code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/author-sitemap.xml" -w '%{http_code}' "https://zomorodmelal.ir/sitemap.xml")"
          test "$sitemap_code" = 200
          grep -Fq 'https://zomorodmelal.ir/authors/mojtaba-rozegar/' "$RUNNER_TEMP/author-sitemap.xml"
          for path in / /about/ /en/authors/mojtaba-rozegar/; do
            status="$(curl -sSL --max-time 18 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path")"
            test "$status" = 200
          done
          echo ZM_AUTHOR_LIVE_PROFILE_AND_SIBLINGS=PASS
      - name: Restore both original profile and redirect if live verification fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/author-ssh"
          stage="/home/zomorod2/.private-zm-author-route/$GITHUB_RUN_ID"
          timeout 50s ssh -T -F "$d/config" cpanel "python3 '$stage/release.py' rollback '$GITHUB_RUN_ID'"
      - name: Delete temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/author-ssh"
