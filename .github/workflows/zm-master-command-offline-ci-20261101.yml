name: Zomorod Business OS offline Django verification

on:
  push:
    branches:
      - feature/zm-master-agent-hourly-command-20261101
      - feature/zm-intent-router-marketing-agent-20261101
      - feature/zm-command-to-calendar-tasks-20261101
      - feature/zm-hourly-smart-task-watch-20261101
      - feature/zm-task-review-approval-workflow-20261101
      - feature/zm-agent-warning-followup-20261101
      - c01/private-project-register-20261101
      - integration/zm-business-os-onepass-20261101
  pull_request:
    branches:
      - main
      - feature/zm-business-os-unified-dashboard-20261101
      - feature/zm-master-agent-hourly-command-20261101
      - feature/zm-intent-router-marketing-agent-20261101
      - feature/zm-command-to-calendar-tasks-20261101
      - feature/zm-hourly-smart-task-watch-20261101
      - feature/zm-task-review-approval-workflow-20261101

permissions:
  contents: read

concurrency:
  group: zm-master-command-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-command-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-not-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Ensure generic deploy has no automatic DB migration
        run: python -m unittest discover -s tests -p 'test_zm_release_preflight.py' -v
      - name: Private-office URL cutover regression
        run: python -m pytest -q tests/test_zomorod_company_office_fallback.py
      - name: Migration consistency against model definitions
        run: python manage.py makemigrations --check --dry-run
      - name: Integrated ERP, factory management, marketing and messaging regression
        run: |
          python manage.py test \
            ecosystem_hub \
            enterprise_portal \
            company_marketing \
            company_messaging
      - name: Release boundary
        run: |
          echo "CI_ONLY=1"
          echo "NO_HOST_CONTACT=1"
          echo "NO_MERGE_DEPLOY_DB_CHANGE=1"
