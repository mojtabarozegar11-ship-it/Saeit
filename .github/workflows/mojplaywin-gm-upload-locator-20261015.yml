name: MojPlayWin final GM chess upload discovery (read only)
on:
  push:
    branches: [audit/mpw-chess-file-readonly-20261015]
    paths: ['.github/workflows/mojplaywin-gm-upload-locator-20261015.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check chess ebook location and SHA256 on cPanel without changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-root-audit"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 115s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          home=Path.home()
          expected_name="MojPlayWin_Chess_Grandmaster_Final_Covered_2026.pdf"
          expected_bytes=3631972
          expected_sha="3837fc3cb21ed1a2e7c33e0db8f8e10d158583309b02b97d4d674d25a147207a"
          skip={".ssh",".git",".cache","mail","logs","node_modules","staticfiles","venv","virtualenv","__pycache__",".cpanel"}
          count=0; matches=0
          for root,dirs,files in os.walk(home,topdown=True,followlinks=False):
              path=Path(root)
              depth=len(path.relative_to(home).parts)
              dirs[:]=[d for d in dirs if d not in skip and not d.startswith(".") and depth<7]
              for name in files:
                  if not name.lower().endswith(".pdf"): continue
                  p=path/name
                  try:
                      st=p.lstat()
                      if p.is_symlink() or not p.is_file(): continue
                      if st.st_size!=expected_bytes and name!=expected_name: continue
                      count+=1
                      h=hashlib.sha256()
                      with p.open("rb") as f:
                          for chunk in iter(lambda:f.read(524288),b""):h.update(chunk)
                      sha=h.hexdigest()
                      print("CANDIDATE_REL_PATH="+str(p.relative_to(home)))
                      print("CANDIDATE_BYTES="+str(st.st_size))
                      print("CANDIDATE_SHA256="+sha)
                      print("CANDIDATE_EXACT_FINAL="+str(st.st_size==expected_bytes and sha==expected_sha))
                      matches+=int(st.st_size==expected_bytes and sha==expected_sha)
                  except (OSError,ValueError) as ex: print("CANDIDATE_ERROR="+type(ex).__name__)
          print("GM_UPLOAD_CANDIDATES="+str(count))
          print("GM_EXACT_MATCHES="+str(matches))
          print("READ_ONLY_NO_FILES_MODIFIED=True")
          PY
          REMOTE

      - name: Remove transient keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-root-audit"
