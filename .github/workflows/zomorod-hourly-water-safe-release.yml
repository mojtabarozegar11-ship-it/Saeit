name: Safely publish prior Zomorod irrigation, greenhouse and Water Path
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-hourly-water-safe-release.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[approved-zm-hourly-release-20261023]'))
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish existing fingerprint-pinned VPS relay to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Prepare isolated release backup on cPanel before copying any source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          id="$GITHUB_RUN_ID"
          dest="/home/zomorod2/.zm-water-release-installer-$id.py"
          timeout 55s scp -q -F "$d/config" scripts/zomorod_hourly_water_safe_release.py "host:$dest"
          timeout 55s ssh -T -F "$d/config" host "python3 -m py_compile '$dest' && python3 '$dest' prepare '$id'"
          echo "RELEASE_SAFETY_PREPARE=PASS"
      - name: Transfer only the three existing approved release candidates to private staging
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          base="/home/zomorod2/.backups/zomorod-hourly-water-20261023/$GITHUB_RUN_ID"
          tar -cf - -C content/zomorod-hourly-20261023 irrigation-planner ventilation-estimator water-path-game |
            timeout 90s ssh -T -F "$d/config" host "tar -xf - -C '$base/stage'"
          timeout 55s ssh -T -F "$d/config" host \
            "test -s '$base/stage/irrigation-planner/index.html' && test -s '$base/stage/ventilation-estimator/index.html' && test -s '$base/stage/water-path-game/index.html'"
          echo "RELEASE_CANDIDATES_STAGED=PASS"
      - name: Atomically install only the new tool and game routes and two scoped category cards
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          id="$GITHUB_RUN_ID"
          dest="/home/zomorod2/.zm-water-release-installer-$id.py"
          timeout 100s ssh -T -F "$d/config" host "python3 '$dest' apply '$id'"
      - name: Verify live HTTP bodies, release markers and protected pages, or fail for rollback
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          id="$GITHUB_RUN_ID"
          dest="/home/zomorod2/.zm-water-release-installer-$id.py"
          timeout 420s ssh -T -F "$d/config" host "python3 '$dest' verify '$id'"
          echo "PUBLIC_RELEASE_AND_PROTECTED_SMOKE=PASS"
      - name: Roll back only touched file paths if any deployment stage fails
        if: failure() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          id="$GITHUB_RUN_ID"
          dest="/home/zomorod2/.zm-water-release-installer-$id.py"
          if test -f "$d/config"; then
            timeout 130s ssh -T -F "$d/config" host "python3 '$dest' rollback '$id'"
          fi
      - name: Remove ephemeral SSH keys; keep private versioned backup and manifest for recovery
        if: always()
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          id="$GITHUB_RUN_ID"
          dest="/home/zomorod2/.zm-water-release-installer-$id.py"
          if test -f "$d/config"; then
            timeout 45s ssh -T -F "$d/config" host "test -f '$dest' && rm -f -- '$dest'" || true
          fi
          rm -rf "$d"
