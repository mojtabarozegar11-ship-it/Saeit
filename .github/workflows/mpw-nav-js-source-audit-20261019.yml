name: MojPlayWin navigation and null-JS read-only root-source audit
on:
  pull_request:
    paths:
      - ".github/workflows/mpw-nav-js-source-audit-20261019.yml"
permissions: {contents: read}
jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Open host-key-pinned relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only compare static root headers and faulty inline scripts
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel 'python3 -c '"'"'
          from pathlib import Path
          import re,hashlib,json
          root=Path("/home/zomorod2/mojplaywin.com/design-preview-20261017")
          home=root/"production-home-20261017.html"
          pages=root/"mpw-ten-editorials-20261018/pages"
          names=["about","services","studio","agents","research","knowledge","store","company"]
          hp=home.read_text("utf-8")
          m=re.search(r"<header\b[^>]*class=[\"\\x27]mw-site-nav[\"\\x27][^>]*>[\s\S]*?</header>",hp,re.I)
          print("HOME_HEADER",len(m.group(0)) if m else 0,hashlib.sha256(m.group(0).encode()).hexdigest()[:18] if m else "missing",m.group(0)[:240] if m else "")
          for name in names:
              p=pages/(name+".html")
              if not p.is_file():continue
              s=p.read_text("utf-8")
              hdr=re.search(r"<header\b[^>]*class=[\"\\x27](?:mw-site-nav|mpw-header)[\"\\x27][^>]*>[\s\S]*?</header>",s,re.I)
              scripts=re.findall(r"<script\b[^>]*>[\s\S]*?</script>",s,re.I)
              bad=[x for x in scripts if "querySelectorAll" in x and (".nav" in x or ".menu-toggle" in x)]
              print("PAGE_NAV",name,len(s),hashlib.sha256(s.encode()).hexdigest()[:14],len(hdr.group(0)) if hdr else 0,
                    hdr.group(0)[:115] if hdr else "missing","inline-scripts",len(scripts),"suspects",len(bad))
              for i,script in enumerate(bad[:3]):
                  print("PAGE_BAD_JS",name,i,repr(script[:1800]))
              for script in scripts[:1]:
                  if name in ("about","services","studio"):print("PAGE_FIRST_JS",name,repr(script[:650]))
          '"'"''
