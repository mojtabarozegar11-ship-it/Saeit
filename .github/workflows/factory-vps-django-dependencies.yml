name: Factory VPS Django Requirements Install
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-django-dependencies.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Build isolated Python venv and install Django requirements
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=15 -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -f "$base/django-app/requirements.txt"
          test -f "$base/django-app/manage.py"
          py="$base/python311/cpython-3.11.17-linux-x86_64-gnu/bin/python3.11"
          "$py" -m venv "$base/.venv"
          "$base/.venv/bin/python" -m ensurepip --upgrade
          "$base/.venv/bin/python" -m pip install --disable-pip-version-check --timeout 20 --retries 2 -r "$base/django-app/requirements.txt"
          "$base/.venv/bin/python" -c 'import django; print("DJANGO_VERSION",django.get_version())'
          echo FACTORY_DJANGO_VENV_READY_NO_SERVICE_CHANGES
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
