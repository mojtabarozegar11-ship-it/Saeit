name: MojPlayWin commercial TRX real MariaDB purchase-to-download test
on:
  push:
    branches: [fix/mpw-tron-provider-auth-20261022]
    paths:
      - .github/workflows/mpw-trx-commercial-mariadb-e2e-20261023.yml
      - tests/test_mpw_trx_commercial_real_mariadb_e2e.py
      - services/mpw_walletless_commercial_intent.py
      - services/mpw_trx_commercial_web.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  purchase-to-file-isolated-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: test_walletless_ci
          MARIADB_USER: walletless
          MARIADB_PASSWORD: local-only-no-money
          MARIADB_ROOT_PASSWORD: local-root-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install ephemeral test MariaDB and Django dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Django>=5.2,<6' 'mysqlclient>=2.2,<3' 'PyMySQL==1.1.2' 'segno==1.6.6'
      - name: Compile actual commercial checkout code and isolated E2E test
        run: |
          set -euo pipefail
          python3 -B -m py_compile services/mpw_walletless_commercial_intent.py services/mpw_trx_commercial_web.py tests/test_mpw_trx_commercial_real_mariadb_e2e.py
      - name: Test durable order invoice two-provider proof ledger receipt entitlement and private download
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_mpw_trx_commercial_real_mariadb_e2e -v
          echo 'TRX_ISOLATED_COMMERCIAL_MARIADB_PURCHASE_TO_PRIVATE_DOWNLOAD=PASS'
          echo 'PRODUCTION_FINANCIAL_WRITES=0; TEST_NETWORK_AND_SYNTHETIC_CHAIN_ONLY=TRUE'
