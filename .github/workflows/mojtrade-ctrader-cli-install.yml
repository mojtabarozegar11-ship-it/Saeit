name: MojTrade official cTrader CLI install

on:
  pull_request:
    branches: [main]
    paths:
      - "trading/MojTradeOmegaXDemoBot.cs"
      - ".github/workflows/mojtrade-ctrader-cli-install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojtrade-ctrader-cli-install
  cancel-in-progress: true

jobs:
  install-cli:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 20
    steps:
      - name: Install official Homebrew and Spotware cTrader CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1; then
            export NONINTERACTIVE=1
            export CI=1
            bash -c "$(curl --fail --silent --show-error --location https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          if [ -x "${HOME}/.linuxbrew/bin/brew" ]; then
            eval "$("${HOME}/.linuxbrew/bin/brew" shellenv)"
          elif [ -x "${HOME}/.linuxbrew/bin/brew" ]; then
            eval "$("${HOME}/.linuxbrew/bin/brew" shellenv)"
          fi
          brew tap spotware/tap https://github.com/spotware/homebrew-tap
          brew install spotware/tap/ctrader-cli
          ctrader-cli --version
          ctrader-cli --help >/dev/null
          echo "cli_install=verified"
          echo "No cTrader credentials, account login, cBot run, backtest, deployment or order is performed."
