name: MojPlayWin security and monitoring remediation inventory
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-remediation-inventory-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect MojPlayWin Apache, CSP requirements, cron and Django security only
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 120s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,pathlib,json,hashlib,re
          root=pathlib.Path('/home/zomorod2/Saeit-staging')
          app=pathlib.Path('/home/zomorod2/mojplaywin.com')
          os.chdir(root);sys.path.insert(0,str(root))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.core import checks
          from django.conf import settings
          from django.test import RequestFactory
          from core.models import Product
          from mpw_commerce.product_checkout_page import product_checkout_page
          for key in ('SECURE_SSL_REDIRECT','SECURE_HSTS_SECONDS','SECURE_HSTS_INCLUDE_SUBDOMAINS','SECURE_HSTS_PRELOAD','SECURE_CONTENT_TYPE_NOSNIFF','SESSION_COOKIE_SECURE','CSRF_COOKIE_SECURE','X_FRAME_OPTIONS'):
            print('MPW_SETTING='+json.dumps({key:getattr(settings,key,None)}))
          items=checks.run_checks(include_deployment_checks=True)
          print('MPW_DJANGO_ISSUES='+json.dumps([{'id':i.id,'level':i.level,'msg':str(i.msg)[:180]} for i in items]))
          ht=app/'.htaccess'
          if ht.is_file():
            s=ht.read_text('utf8','replace')
            sanitized=[]
            for line in s.splitlines():
              if any(x in line.lower() for x in ('secret','key=','token','password','authorization')): continue
              sanitized.append(line[:240])
            print('MPW_HTACCESS='+json.dumps({'sha256':hashlib.sha256(s.encode()).hexdigest(),
                  'lines':sanitized[:130],'size':len(s)}))
          rf=RequestFactory()
          for pk in (72,225):
            p=Product.objects.select_related('owner').get(pk=pk)
            req=rf.get('/commerce/book/%d/'%pk,secure=True,HTTP_HOST='mojplaywin.com')
            req.user=p.owner
            response=product_checkout_page(req,pk)
            html=response.content.decode('utf8','replace')
            urls=re.findall(r'(?:src|href)=["\x27](https?://[^"\x27]+)',html)
            forms=re.findall(r'<script[^>]*>',html,re.I)
            print('MPW_CHECKOUT_FRONTEND='+json.dumps({'pk':pk,'http':response.status_code,
             'script_tags':forms[:10],'external_hosts':sorted(set(re.findall(r'https?://([^/]+)', '\n'.join(urls))))[:20],
             'uses_inline_script':'<script>' in html,
             'uses_inline_styles':'style=' in html,
             'needs_wallet_api':any(x in html for x in ('window.ethereum','tronWeb','tronLink')),
             'includes_google_fonts':'fonts.googleapis.com' in html}))
          private=pathlib.Path('/home/zomorod2/.mpw-commerce-two-books')
          worker=private/'reconcile_worker.py'
          if worker.is_file():
            src=worker.read_text('utf8','replace')
            print('MPW_WORKER_SOURCE='+json.dumps({'sha256':hashlib.sha256(src.encode()).hexdigest(),'lines':len(src.splitlines()),
              'has_lock':'flock(' in src,'has_scoping':'issubset({72, 225})' in src,'has_success_log':'MPW_WORKER_RESULT=' in src}))
          PY
          BASH
