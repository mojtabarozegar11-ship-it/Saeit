name: Moj Play Win stage and verify live dynamic sitemap three additions
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-sitemap-extra-php-stage.yml"]
permissions:
  contents: read
jobs:
  safe-sitemap-dynamic-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage ONLY new isolated sitemap PHP script under the existing preview directory
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          file=scripts/mojplaywin_sitemap_dynamic_three_additions.php
          target=/home/zomorod2/mojplaywin.com/design-preview-20261017/_mpw_sitemap_three_indexable_20261017.php
          expected=$(sha256sum "$file"|cut -d' ' -f1)
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$target' && test ! -L '$target'"
          timeout 38s scp -q -F "$d/config" "$file" "saeit-cpanel:$target"
          actual=$(timeout 40s ssh -T -F "$d/config" saeit-cpanel "chmod 644 '$target'; php -l '$target' >&2; sha256sum '$target'|cut -d' ' -f1")
          test "$expected" = "$actual"
          echo "DYNAMIC_SITEMAP_PHP_STAGE_BYTE_FOR_BYTE_IDENTICAL"
      - name: Compare dynamic original sitemap with augmented version and validate XML without rewrite
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.request import Request,urlopen
          import hashlib,json
          base="https://mojplaywin.com"
          extra=("/market/","/industry/","/economy/")
          needle=b"".join(('<url><loc>'+base+p+'</loc></url>').encode() for p in extra)
          def get(url):
              req=Request(url,headers={"Cache-Control":"no-store","User-Agent":"MojPlayWin-sitemap-live-wrapper-isolation-test"})
              with urlopen(req,timeout=20) as r:
                  if r.status!=200:raise RuntimeError("Sitemap non-200")
                  return r.read(1200000),r.headers.get("X-MPW-Sitemap-Augmentation","")
          for i in range(3):
              original,_=get(base+"/sitemap.xml?__mpw_sitemap_passthru=1")
              updated,marker=get(base+"/design-preview-20261017/_mpw_sitemap_three_indexable_20261017.php")
              assert marker=="three-indexable-main-pages"
              assert updated.replace(needle,b"")==original, "Other sitemap bytes changed"
              tree=ET.fromstring(updated)
              locs=[tag.text for tag in tree.iter() if tag.tag.endswith("loc")]
              assert len(locs)==len(set(locs)),"Duplicate sitemap loc"
              assert len(locs)>=30
              for p in extra:assert locs.count(base+p)==1
              assert all(url.startswith(base+"/") for url in locs)
              print(json.dumps({"classification":"MOJ_PLAY_WIN_SITEMAP_DYNAMIC_SOURCE_QA",
                 "run":i+1,"original_entries":len(locs)-3,"new_entries":len(locs),
                 "xml_valid":True,"all_original_dynamic_entries_preserved":True,
                 "added_only_market_industry_economy":True,"rewrite_changed":False},sort_keys=True))
          PY
      - name: Verify previous nine corrected live pages and protected subsite status
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for path in / /store/ /research/ /company/ /knowledge/ /ventures/agriculture/ /ventures/jewelry-gold/ /market/ /industry/ /economy/ /saman/ /picm/login/ /farnaz/ /mojtaba.roozegar/;do
            test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 17 "https://mojplaywin.com$path")" = 200 || exit 45
          done
          echo "ALL_NINE_CURRENT_CANONICAL_ROUTES_AND_PROTECTED_MAIN_CHILD_URLS_200"
