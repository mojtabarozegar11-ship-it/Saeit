name: F41 merchant audit buyer-evaluation release
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/f41_merchant_audit_cli.py
      - tests/test_f41_merchant_audit_cli.py
      - docs/f41_merchant_audit.md
      - examples/f41-merchant-audit/**
      - deploy/f41_merchant_audit_private_install.sh
      - .github/workflows/f41-merchant-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/f41_merchant_audit_cli.py
      - tests/test_f41_merchant_audit_cli.py
      - docs/f41_merchant_audit.md
      - examples/f41-merchant-audit/**
      - deploy/f41_merchant_audit_private_install.sh
      - .github/workflows/f41-merchant-audit.yml
permissions: {contents: read}
concurrency:
  group: f41-merchant-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  buyer-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execute buyer-facing demo and strict negative tests
        run: |
          set -euo pipefail
          bash -n deploy/f41_merchant_audit_private_install.sh
          python3 -B -m unittest discover -s tests -p test_f41_merchant_audit_cli.py -v
          python3 -B -m py_compile scripts/f41_merchant_audit_cli.py
          out="$RUNNER_TEMP/f41-merchant-audit-demo"
          python3 -B scripts/f41_merchant_audit_cli.py --invoices examples/f41-merchant-audit/invoices.csv --payments examples/f41-merchant-audit/payments.csv --out "$out"
          python3 -B scripts/f41_merchant_audit_cli.py --invoices examples/f41-merchant-audit/invoices.csv --payments examples/f41-merchant-audit/payments.csv --out "$out" --verify
          python3 -B - "$out/report.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text("utf8"))
          assert r["summary"]["invoice_count"]==2
          assert r["summary"]["unlinked_invoice_ids"]==1
          assert r["summary"]["status_counts"]["MATCHED_EXPORT_UNVERIFIED"]==1
          assert r["summary"]["status_counts"]["NO_PAYMENT_IN_EXPORT"]==1
          assert r["delivery_authorized"] is False
          assert r["chain_finality_verified"] is False
          print("F41_MERCHANT_BUYER_ACCEPTANCE=PASS")
          PY
  private-vps-evaluation:
    needs: buyer-acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install isolated read-only product candidate on private VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          work="$(mktemp -d)"
          chmod 700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$work/key"
          chmod 600 "$work/key"
          ssh-keygen -y -P '' -f "$work/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$work/known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          echo F41_MERCHANT_RELAY_HOST_PIN=PASS
          printf 'Host f41-vps\n  HostName 178.239.147.150\n  User githubops\n  IdentityFile %s/key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s/known\n  BatchMode yes\n  ConnectTimeout 15\n' "$work" "$work" > "$work/config"
          stage="/home/githubops/factory-runtime/operations/.f41-merchant-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$work/config" -T f41-vps "umask 077; mkdir -m 700 '$stage'"
          scp -F "$work/config" scripts/f41_merchant_audit_cli.py "f41-vps:$stage/cli.py"
          scp -F "$work/config" tests/test_f41_merchant_audit_cli.py "f41-vps:$stage/tests.py"
          scp -F "$work/config" docs/f41_merchant_audit.md "f41-vps:$stage/README.md"
          scp -F "$work/config" examples/f41-merchant-audit/LICENSE.txt "f41-vps:$stage/LICENSE.txt"
          scp -F "$work/config" examples/f41-merchant-audit/invoices.csv "f41-vps:$stage/invoices.csv"
          scp -F "$work/config" examples/f41-merchant-audit/payments.csv "f41-vps:$stage/payments.csv"
          scp -F "$work/config" deploy/f41_merchant_audit_private_install.sh "f41-vps:$stage/install.sh"
          ssh -F "$work/config" -T f41-vps "bash -n '$stage/install.sh' && bash '$stage/install.sh' '$stage' '$GITHUB_SHA' '$GITHUB_RUN_ID'"
