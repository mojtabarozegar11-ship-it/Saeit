name: ZM guarded live Persian action deduplication and hourly private index release
on:
  push:
    branches: [feature/zm-business-php-persian-reports-20261102]
    paths: [".github/workflows/zm-business-action-index-guarded-release-20261102.yml"]
permissions:
  contents: read
concurrency:
  group: zm-live-php-private-reports-only
  cancel-in-progress: false
jobs:
  viewer-health:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
      - name: Exact-head Persian viewer and accounting-safe synthetic checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -l content/zomorod-business/chatgpt_reports.php
          test "$(git hash-object content/zomorod-business/chatgpt_reports.php)" = "d3d68129e2fa7364eaf00efe922a5f1f5a8e8f8d"
          python3 -m unittest discover -s tests -p 'test_zm_business_report_archive_php.py'
          python3 -m unittest discover -s tests -p 'test_zm_chatgpt_action_index.py'
          test "$(git hash-object scripts/zm_chatgpt_action_index.py)" = "6ee7887f48140e4339c263acebecac68f3d2fcd8"
          python3 -m unittest discover -s tests -p 'test_zomorod_chatgpt_report_snapshot.py'
          git cat-file blob ba64918bff6b9e309596a15ec5683450b730c825 | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/old-viewer.sha"
          sha256sum content/zomorod-business/chatgpt_reports.php | awk '{print $1}' > "$RUNNER_TEMP/new-viewer.sha"
          echo 'VIEWER_OFFLINE_TESTS=pass'
      - name: Configure pinned GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-php-viewer-freshness"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Preserve exact current viewer as rollback backup
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-php-viewer-freshness"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$(cat "$RUNNER_TEMP/old-viewer.sha")" <<'REMOTE'
          set -euo pipefail
          sha="$1"; expected="$2"
          root="$HOME/.private/zomorod-business"
          viewer="$root/chatgpt_reports.php"
          archive="$root/chatgpt_reports_archive.sqlite3"
          stage="$root/.report-viewer-freshness-$sha"
          backup="$HOME/.backups/zm-report-viewer-freshness/$sha"
          test -f "$viewer" && test ! -L "$viewer"
          test -f "$archive" && test ! -L "$archive"
          test "$(stat -c %a "$viewer")" = 600
          test "$(stat -c %a "$archive")" = 600
          test "$(sha256sum "$viewer" | awk '{print $1}')" = "$expected"
          test ! -e "$stage" && test ! -e "$backup"
          test ! -e "$root/chatgpt_actions_index.sqlite3"
          test ! -L "$root/chatgpt_actions_index.sqlite3"
          test ! -e "$root/.chatgpt-action-indexer"
          test ! -L "$root/.chatgpt-action-indexer"
          test ! -e "$root/.chatgpt-actions-index.lock"
          install -d -m 700 "$stage" "$backup"
          cp -p "$viewer" "$backup/viewer.before.php"
          crontab -l > "$backup/crontab.before"
          grep -Fq '.chatgpt-report-sync/run-hourly.sh' "$backup/crontab.before"
          ! grep -Fq 'ZM_CHATGPT_ACTION_INDEX' "$backup/crontab.before"
          echo 'LIVE_VIEWER_EXPECTED_SHA=matched'
          echo 'READ_ONLY_REPORT_ARCHIVE=preserved'
          REMOTE
      - name: Stage only RTL private report renderer
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-php-viewer-freshness"
          stage="/home/zomorod2/.private/zomorod-business/.report-viewer-freshness-$GITHUB_SHA"
          tar -cf - -C content/zomorod-business chatgpt_reports.php |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C '$stage'"
          tar -cf - -C scripts zm_chatgpt_action_index.py |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C '$stage'"
      - name: Atomically deploy private action index, new viewer and hourly maintenance with rollback
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-php-viewer-freshness"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$(cat "$RUNNER_TEMP/old-viewer.sha")" "$(cat "$RUNNER_TEMP/new-viewer.sha")" <<'REMOTE'
          set -euo pipefail
          sha="$1"; old="$2"; new="$3"
          root="$HOME/.private/zomorod-business"
          viewer="$root/chatgpt_reports.php"
          archive="$root/chatgpt_reports_archive.sqlite3"
          index="$root/chatgpt_actions_index.sqlite3"
          worker="$root/.chatgpt-action-indexer"
          stage="$root/.report-viewer-freshness-$sha"
          backup="$HOME/.backups/zm-report-viewer-freshness/$sha"
          phpbin="$(command -v php || echo /opt/cpanel/ea-php82/root/usr/bin/php)"
          "$phpbin" -l "$stage/chatgpt_reports.php"
          /usr/bin/python3 -m py_compile "$stage/zm_chatgpt_action_index.py"
          test "$(sha256sum "$viewer" | awk '{print $1}')" = "$old"
          test "$(sha256sum "$stage/chatgpt_reports.php" | awk '{print $1}')" = "$new"
          test -f "$archive" && test ! -L "$archive"
          test ! -e "$index" && test ! -L "$index"
          test ! -e "$worker" && test ! -L "$worker"
          test ! -e "$root/.chatgpt-actions-index.lock"
          crontab -l > "$stage/crontab.current"
          cmp "$stage/crontab.current" "$backup/crontab.before"
          changed=0
          installed=0
          cron_added=0
          rollback() {
            set +e
            if test "$cron_added" = 1; then
              crontab "$backup/crontab.before" || :
            fi
            if test "$changed" = 1; then
              cp -p "$backup/viewer.before.php" "$stage/viewer.rollback.php"
              if mv -f "$stage/viewer.rollback.php" "$viewer"; then
                echo 'VIEWER_ROLLBACK=restored'
              else
                echo 'VIEWER_ROLLBACK=failed_backup_preserved' >&2
              fi
            fi
            if test "$installed" = 1; then
              rm -f "$index" "$root/.chatgpt-actions-index.lock" "$worker/index.py"
              rmdir "$worker" || :
            fi
          }
          trap 'rc=$?; trap - EXIT; rollback; exit "$rc"' EXIT
          install -d -m 700 "$worker"
          installed=1
          install -m 600 "$stage/zm_chatgpt_action_index.py" "$worker/index.py"
          /usr/bin/python3 "$worker/index.py" --source "$archive" --output "$index" > "$stage/index.result"
          grep -Fxq 'ACTION_INDEX=updated' "$stage/index.result"
          grep -Fxq 'FINANCIAL_DB_TOUCHED=no' "$stage/index.result"
          test "$(stat -c %a "$index")" = 600
          install -m 600 "$stage/chatgpt_reports.php" "$stage/viewer.new.php"
          changed=1
          mv -f "$stage/viewer.new.php" "$viewer"
          "$phpbin" -l "$viewer"
          test "$(sha256sum "$viewer" | awk '{print $1}')" = "$new"
          test "$(stat -c %a "$viewer")" = 600
          test "$(stat -c %a "$archive")" = 600
          "$phpbin" -d display_errors=0 -r '
            function role(){return "admin";}
            function esc($v){return htmlspecialchars((string)$v,ENT_QUOTES|ENT_SUBSTITUTE,"UTF-8");}
            function bail($m,$c=403){throw new RuntimeException("DENIED");}
            $_GET=["cycle"=>"05","p"=>"1"];
            require $argv[1];
            ob_start();
            zmBusinessChatgptReports($argv[2]);
            $html=ob_get_clean();
            if(strpos($html,"اتاق فرمان چرخهٔ ساعتی ۰۵")===false ||
               strpos($html,"نمایهٔ جلوگیری از تکرار")===false ||
               strpos($html,"اعتبارسنجی آرشیو ناموفق")!==false)exit(1);
          ' "$viewer" "$root"
          code="$(curl -sSL --max-time 25 -o "$stage/anonymous.html" -w '%{http_code}' 'https://zomorodmelal.ir/business/?page=chatgpt_reports' || true)"
          test "$code" = 200
          grep -Fq 'ورود مدیر و حسابدار' "$stage/anonymous.html"
          ! grep -Fq 'پایش پنج چرخهٔ ساعتی' "$stage/anonymous.html"
          schedule="55 * * * * /usr/bin/python3 $worker/index.py --source $archive --output $index >/dev/null 2>&1 # ZM_CHATGPT_ACTION_INDEX"
          cp "$backup/crontab.before" "$stage/crontab.proposed"
          printf '\n%s\n' "$schedule" >> "$stage/crontab.proposed"
          crontab -l > "$stage/crontab.current"
          cmp "$stage/crontab.current" "$backup/crontab.before"
          crontab "$stage/crontab.proposed"
          cron_added=1
          crontab -l > "$backup/crontab.after"
          grep -Fqx "$schedule" "$backup/crontab.after"
          changed=0
          installed=0
          cron_added=0
          trap - EXIT
          echo 'LIVE_ACTION_INDEX=installed'
          echo 'ACTION_INDEX_HOURLY=minute_55'
          echo 'LIVE_PERSIAN_REPORT_INDEX=installed'
          echo 'FINANCIAL_DATABASE_TOUCHED=no'
          echo 'ORIGINAL_REPORT_ARCHIVES=unchanged'
          echo 'ROLLBACK_BACKUP=preserved'
          REMOTE
      - name: Cleanup ephemeral relay material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/zm-php-viewer-freshness"
          rm -f "$RUNNER_TEMP/old-viewer.sha" "$RUNNER_TEMP/new-viewer.sha"
