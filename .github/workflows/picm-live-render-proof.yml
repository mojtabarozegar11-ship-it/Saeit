name: PICM Live End-to-End 256px Protected Render Proof
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: mojplaywin-picm-proof
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: prove PICM site-to-engine-to-result 2026-10-15'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned relay and cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/picm-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P '' -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$WORK/config" <<EOF
          Host picm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" picm-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat >> "$WORK/config" <<EOF
          Host picm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump picm-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo PICM_RELAY_READY
      - name: Verify persistent VPS worker without restarting it
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 30s ssh -F "$WORK/config" picm-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          dir="$HOME/.local/share/saeit-picm"
          test -f "$dir/worker.pid" && test -r "$dir/worker-token"
          pid="$(cat "$dir/worker.pid")"
          [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid"
          tr '\0' ' ' < "/proc/$pid/cmdline" | grep -Fq "saeit-picm/worker.py"
          echo PICM_PRIVATE_WORKER_ALIVE_AFTER_DEPLOY
          REMOTE
      - name: Submit a single synthetic 1-step render using real Django queue
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 50s ssh -F "$WORK/config" picm-host 'bash -se' > "$RUNNER_TEMP/picm-test-receipt" <<'REMOTE'
          set -Eeuo pipefail
          app=/home/zomorod2/Saeit-staging
          for p in "$app/.venv/bin/python" "$app/venv/bin/python" /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python; do
            if test -x "$p" && "$p" -c 'import django' >/dev/null 2>&1; then
              cd "$app"
              export DJANGO_SETTINGS_MODULE=config.settings
              "$p" - <<'PY'
          import django,json
          from django.test import RequestFactory
          from types import SimpleNamespace
          django.setup()
          from core.picm_views import picm_submit
          req=RequestFactory().post('/picm/api/submit/',data=json.dumps({'prompt':'Green leaves in a sunny greenhouse','style':'illustration','steps':1}),content_type='application/json')
          req.user=SimpleNamespace(pk=-20261015,is_authenticated=True)
          response=picm_submit(req)
          assert response.status_code==202, response.status_code
          ident=json.loads(response.content)['id']
          print('PICM_SYNTHETIC_JOB_ID='+ident)
          PY
              exit 0
            fi
          done
          echo PICM_DJANGO_INTERPRETER_NOT_FOUND
          exit 9
          REMOTE
          grep -E '^PICM_SYNTHETIC_JOB_ID=[a-f0-9]{32}$' "$RUNNER_TEMP/picm-test-receipt"
          test "$(grep -c '^PICM_SYNTHETIC_JOB_ID=' "$RUNNER_TEMP/picm-test-receipt")" = 1
          sed -n 's/^PICM_SYNTHETIC_JOB_ID=//p' "$RUNNER_TEMP/picm-test-receipt" > "$RUNNER_TEMP/picm-id"
      - name: Confirm image returned to original site as a real 256px PNG
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          ident="$(cat "$RUNNER_TEMP/picm-id")"
          [[ "$ident" =~ ^[a-f0-9]{32}$ ]]
          for attempt in $(seq 1 45); do
            state="$(timeout 20s ssh -F "$WORK/config" picm-host "python3 -c 'import json,pathlib; p=pathlib.Path(\"/home/zomorod2/.picm-queue/$ident.json\"); print(json.loads(p.read_text())[\"state\"])'" || true)"
            if [[ "$state" == "done" ]]; then
              timeout 30s ssh -F "$WORK/config" picm-host "python3 -c 'import hashlib,pathlib,struct; p=pathlib.Path(\"/home/zomorod2/.picm-queue/$ident.png\"); x=p.read_bytes(); assert len(x)>1024 and x[:8]==bytes.fromhex(\"89504e470d0a1a0a\") and struct.unpack(\">II\",x[16:24])==(256,256); print(\"PICM_REAL_END_TO_END_PNG_256x256_CONFIRMED\"); print(\"PICM_PNG_SHA256=\"+hashlib.sha256(x).hexdigest())'"
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then echo PICM_SYNTHETIC_RENDER_FAILED_BY_ENGINE; exit 8; fi
            sleep 12
          done
          echo PICM_RENDER_NOT_COMPLETED_WITHIN_TEST_WINDOW
          exit 9
      - name: Remove temporary runner SSH materials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/picm-ssh" "$RUNNER_TEMP/picm-test-receipt" "$RUNNER_TEMP/picm-id"
