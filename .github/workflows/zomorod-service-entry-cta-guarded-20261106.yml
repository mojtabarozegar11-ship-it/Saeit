name: Guarded live Zomorod service entry CTAs
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - scripts/zomorod_service_entry_cta_guarded_20261106.py
      - .github/workflows/zomorod-service-entry-cta-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-service-entry-cta-20261106
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check guarded deployment logic without customer writes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_service_entry_cta_guarded_20261106.py
          python3 scripts/zomorod_service_entry_cta_guarded_20261106.py selftest
      - name: Authenticate to cPanel using pinned SSH identities
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-service-entry-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Inspect exact origin pages before modification
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-service-entry-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/zomorod_service_entry_cta_guarded_20261106.py
      - name: Back up and publish both exact live HTML entry points
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-service-entry-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_service_entry_cta_guarded_20261106.py
      - name: Verify exact origin files and publicly visible lead paths
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-service-entry-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_service_entry_cta_guarded_20261106.py
          python3 - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen
          run_id = os.environ['RUN_ID']
          pages = [('/', 'zm-service-entry-home-20261106'),
                   ('/agriculture/', 'zm-service-entry-agriculture-20261106')]
          for path, marker in pages:
              for attempt in range(6):
                  try:
                      url = 'https://zomorodmelal.ir' + path + '?zm_service_entry=' + run_id + '-' + str(attempt)
                      request = Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Zomorod-Service-Entry-Verify/1.0'})
                      with urlopen(request, timeout=27) as response:
                          page = response.read(650000).decode('utf-8', 'replace')
                          if response.status != 200:
                              raise RuntimeError('PUBLIC_ROUTE_NOT_200')
                      if marker not in page or 'href="/ask-master/index.php"' not in page:
                          raise RuntimeError('SERVICE_ENTRY_NOT_PUBLICLY_VISIBLE')
                      print('PUBLIC_SERVICE_ENTRY_VERIFIED=' + path)
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(4)
          with urlopen(Request('https://zomorodmelal.ir/ask-master/index.php',
                               headers={'Cache-Control':'no-cache'}), timeout=27) as response:
              form = response.read(240000).decode('utf-8', 'replace')
              if response.status != 200 or 'value="service_question"' not in form:
                  raise RuntimeError('EXISTING_SPECIALIST_FORM_NOT_AVAILABLE')
          print('EXISTING_SERVICE_FORM_VERIFIED=1')
          PY
      - name: Restore original pages if post-deploy verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-service-entry-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_service_entry_cta_guarded_20261106.py
