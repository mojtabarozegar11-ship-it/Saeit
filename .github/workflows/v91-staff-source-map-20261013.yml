name: V91 Staff Source Map via SSH (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: MojPlayWin domain mapping check 2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read source layout on cPanel over VPS SSH, no writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/v91-ssh"
          mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 80s ssh -F "$d/config" saeit-host 'python3 -' <<'REMOTE'
          from pathlib import Path
          root=Path('/home/zomorod2')
          roots=[
            root/'saeit_v91/zomorodmelal',
            root/'saeit_v91/mojplaywin_site',
            root/'saeit_v91_runtime_stage_20261012/zomorodmelal',
            root/'saeit_v91_runtime_stage_20261012/mojplaywin_site',
            root/'Saeit',
            root/'Saeit-staging',
            root/'mojplaywin.com',
          ]
          for p in roots:
            print('PROJECT',p,'exists',p.is_dir(),'manage', (p/'manage.py').is_file())
            if not p.is_dir(): continue
            print(' TOPDIRS',','.join(sorted(x.name for x in p.iterdir() if x.is_dir() and not x.name.startswith('.'))[:42]))
            for f in ['config/urls.py','config/settings.py','command_center/urls.py','portal/urls.py','sitecore/urls.py','staff/urls.py','workbench_v91/urls.py']:
              if (p/f).is_file():
                print(' FILE',f,'bytes',(p/f).stat().st_size)
            print(' STAFF_PATHS')
            count=0
            for f in p.rglob('*'):
              try: rel=f.relative_to(p)
              except: continue
              if len(rel.parts)>5: continue
              if any(x in {'venv','.venv','node_modules','staticfiles','media','__pycache__','.git'} for x in rel.parts): continue
              if any(w in f.name.lower() for w in ['staff','workbench','dashboard','builder','editor','admin_panel','admin_dashboard']):
                if f.is_file(): print('  ',rel.as_posix(),f.stat().st_size);count+=1
              if count>=35:break
            print(' STAFFFILENAME_COUNT_SHOWN',count)
          print('MAPPED_APP_PAYMENT_AUDIT')
          mapped=root/'mojplaywin.com'
          print('MAPPED_APP_ROOT',mapped,'exists',mapped.is_dir(),'manage', (mapped/'manage.py').is_file(),'passenger_wsgi',(mapped/'passenger_wsgi.py').is_file())
          if mapped.is_dir():
            for x in sorted(mapped.iterdir()):
              try:
                kind='dir' if x.is_dir() else 'file'
                target=str(x.resolve()) if x.is_symlink() else ''
                print('MAPPED_ENTRY',x.name,kind,'symlink_target',target)
              except Exception as e: print('MAPPED_ENTRY_ERROR',x.name,type(e).__name__)
          wsgi=mapped/'passenger_wsgi.py'
          if wsgi.is_file():
            for n,line in enumerate(wsgi.read_text(errors='ignore').splitlines(),1):
              stripped=line.strip()
              if stripped.startswith(('import ','from ','sys.path')):
                print('WSGI_IMPORT_OR_PATH',n,stripped[:240])
              if any(k in stripped for k in ('DJANGO_SETTINGS_MODULE','sys.path','os.chdir','__file__','config.wsgi')):
                print('WSGI_RUNTIME_PATH_HINT',n,stripped[:240])
          ini=mapped/'.user.ini'
          if ini.is_file():
            for n,line in enumerate(ini.read_text(errors='ignore').splitlines(),1):
              if '=' in line:
                key=line.split('=',1)[0].strip()
                print('USER_INI_KEY',n,key)
          for base in [root/'Saeit',root/'saeit_v91/mojplaywin_site',root/'saeit_v91_runtime_stage_20261012/mojplaywin_site']:
            for rel in ['config/wsgi.py','config/settings.py','config/urls.py','sitecore/urls.py','sitecore/commerce_views.py','sitecore/commerce_gateway.py']:
              q=base/rel
              if q.is_file(): print('POSSIBLE_APP_MODULE',q,'bytes',q.stat().st_size)
          skip={'venv','.venv','node_modules','staticfiles','media','__pycache__','.git','backups','backup','tmp'}
          terms=('payment','crypto','tron','ethereum','wallet','invoice','checkout','commerce','gateway','webhook','order')
          shown=0
          for f in mapped.rglob('*.py'):
            try: rel=f.relative_to(mapped)
            except: continue
            if len(rel.parts)>7 or any(x.lower() in skip for x in rel.parts): continue
            if not any(t in f.name.lower() for t in terms) and f.name!='urls.py' and 'settings' not in f.name.lower(): continue
            print('PAYMENT_SOURCE',rel.as_posix(),'bytes',f.stat().st_size)
            try: lines=f.read_text(errors='ignore').splitlines()
            except: continue
            for n,line in enumerate(lines,1):
              stripped=line.strip()
              if stripped.startswith(('def ','async def ','class ')):
                print('  SYMBOL',n,stripped[:180])
              if f.name=='urls.py' and any(t in stripped.lower() for t in ['path(','re_path(','include(','payment','crypto','checkout','order']):
                print('  URL',n,stripped[:220])
            shown+=1
            if shown>=80: break
          print('PAYMENT_SOURCE_COUNT_SHOWN',shown)
          print('HOST_ARCHIVES')
          for p in root.glob('*V91*zip'):
            if p.is_file():print('ZIP',p.name,p.stat().st_size)
          print('MOJPLAYWIN_DOMAIN_MAPPING_AUDIT')
          candidates=[
            root/'public_html',
            root/'domains',
            root/'domains/mojplaywin.com',
            root/'domains/mojplaywin.com/public_html',
            root/'mojplaywin.com',
            root/'mojplaywin.com/public_html',
            root/'public_html/mojplaywin',
            root/'public_html/mojplaywin.com',
            root/'mojplaywin_site',
            root/'saeit_v91/mojplaywin_site',
            root/'saeit_v91_runtime_stage_20261012/mojplaywin_site',
          ]
          for p in candidates:
            if p.exists():
              print('DOMAIN_PATH',p,'directory',p.is_dir(),'resolved',p.resolve())
          for base in [root/'public_html',root/'domains',root/'mojplaywin.com']:
            if not base.is_dir(): continue
            for f in base.rglob('.htaccess'):
              try: depth=len(f.relative_to(base).parts)
              except: continue
              if depth>5: continue
              try: lines=f.read_text(errors='ignore').splitlines()
              except: continue
              relevant=[x.strip()[:300] for x in lines if any(k in x for k in ['PassengerAppRoot','PassengerBaseURI','PassengerStartupFile','ServerName','ServerAlias'])]
              print('WEBROOT_CONFIG',f,'directives',' | '.join(relevant) if relevant else 'none')
          print('HOME_MATCHING_DIRS',','.join(sorted(p.name for p in root.iterdir() if p.is_dir() and 'mojplaywin' in p.name.lower())))
          print('MAP_DONE')
          REMOTE
