name: V91 Staff Source Map via SSH (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: MojPlayWin domain mapping check 2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read active payment code through VPS relay, no writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/v91-ssh"
          mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 80s ssh -F "$d/config" saeit-host 'python3 -' <<'REMOTE'
          from pathlib import Path
          import ast,re
          root=Path('/home/zomorod2')
          wrapper=root/'mojplaywin.com/passenger_wsgi.py'
          txt=wrapper.read_text(errors='ignore') if wrapper.is_file() else ''
          app_path=None
          for line in txt.splitlines():
            stripped=line.strip()
            if stripped.startswith('APP') and '=' in stripped:
              app_path=stripped.split('=',1)[1].strip().strip('"').strip("'")
              break
          app=Path(app_path).resolve() if app_path else None
          print('ACTIVE_APP',app,'exists',bool(app and app.is_dir()))
          def safe(line):
            upper=line.upper()
            sensitive=('SECRET','API_KEY','APIKEY','PRIVATE_KEY','PASSWORD','MNEMONIC','SEED','WALLET','ADDRESS','DESTINATION','RPC_URL','ENDPOINT','TOKEN')
            if '=' in line and not any(op in line for op in ('==','!=','<=','>=')) and any(k in upper for k in sensitive):
              line=line.split('=',1)[0].rstrip()+' = [redacted]'
            if '://' in line:
              line=line.split('://',1)[0]+'://[endpoint redacted]'
            if '0x' in line.lower():
              line=line[:line.lower().find('0x')]+'[address redacted]'
            return line[:260]
          if not app or not app.is_dir(): raise SystemExit('active app root not resolved')
          for name in ['config/urls.py','core/urls.py']:
            p=app/name
            if not p.is_file(): continue
            print('ROUTES_BEGIN',name)
            for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
              if any(k in line.lower() for k in ('path(','re_path(','include(','checkout','crypto','payment','order')):
                print('ROUTE',n,safe(line.strip()))
            print('ROUTES_END',name)
          for name in ['core/cryptopay_checkout.py','core/cryptopay_order.py','core/cryptopay_tron.py','core/cryptopay_rpc.py','core/cryptopay_v1.py']:
            p=app/name
            if not p.is_file(): print('SOURCE_MISSING',name);continue
            print('SOURCE_BEGIN',name)
            for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
              print('CODE',n,safe(line.rstrip()))
            print('SOURCE_END',name)
          models=app/'core/models.py'
          if models.is_file():
            tree=ast.parse(models.read_text(errors='ignore'))
            print('MODEL_FIELDS')
            for node in tree.body:
              if isinstance(node,ast.ClassDef) and any(k in node.name.lower() for k in ('product','order','payment','ledger','webhook')):
                fields=[]
                for child in node.body:
                  if isinstance(child,ast.Assign):
                    for target in child.targets:
                      if isinstance(target,ast.Name): fields.append(target.id)
                  elif isinstance(child,ast.AnnAssign) and isinstance(child.target,ast.Name): fields.append(child.target.id)
                print('MODEL',node.name,','.join(fields))
          for name in ['core/cryptopay_mainnet_config.py','core/cryptopay_tron_config.py']:
            p=app/name
            if not p.is_file(): print('CONFIG_MISSING',name);continue
            print('CONFIG_PRESENT',name,'bytes',p.stat().st_size)
          import importlib.util,os,sys
          def load_config(name):
            path=app/'core'/name
            if not path.is_file(): return None
            try:
              spec=importlib.util.spec_from_file_location('audit_'+name.replace('.py',''),path)
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod
            except Exception as exc:
              print('CONFIG_IMPORT_ERROR',name,type(exc).__name__)
              return None
          tron=load_config('cryptopay_tron_config.py')
          if tron:
            print('TRON_MAINNET_ENABLED',getattr(tron,'MAINNET_ENABLED',None) is True)
            print('TRON_RECEIVER_MATCHES_SCREENSHOT',getattr(tron,'RECEIVING_ADDRESS',None)=='THFNU1iEXHd71WjEgjqUksd2UnMg2pUi73')
            print('TRON_USDT_CONTRACT_CONFIGURED',bool(getattr(tron,'USDT_CONTRACT',None)))
            print('TRON_EXPECTED_ATOMIC',getattr(tron,'EXPECTED_ATOMIC',None))
          evm=load_config('cryptopay_mainnet_config.py')
          if evm:
            print('EVM_CONFIG_FLAGS',{k:(getattr(evm,k) if isinstance(getattr(evm,k),bool) else bool(getattr(evm,k))) for k in dir(evm) if k.isupper() and any(t in k for t in ('ENABLE','NETWORK','ASSET','CHAIN','ADDRESS','CONTRACT','RPC','CONFIRM'))})
            print('EVM_RECEIVER_MATCHES_SCREENSHOT',getattr(evm,'RECEIVING_ADDRESS',None)=='0x89149b01f59115B86553561F12438D2ADF517E75')
          private=root/'private_products'
          files=[p for p in private.rglob('*') if p.is_file()] if private.is_dir() else []
          print('PRIVATE_DELIVERY_ROOT',private.is_dir(),'file_count',len(files))
          try:
            os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
            sys.path.insert(0,str(app))
            import django
            django.setup()
            from core.models import Product
            print('PRODUCT_COUNTS','all',Product.objects.count(),'active',Product.objects.filter(active=True).count(),'active_usd_12',Product.objects.filter(active=True,currency='USD',price=12).count())
          except Exception as exc:
            print('PRODUCT_QUERY_ERROR',type(exc).__name__)
          REMOTE
