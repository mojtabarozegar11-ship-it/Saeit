name: Guarded live Zomorod concrete services and metadata release
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - scripts/zomorod_services_offers_guarded_20261106.py
      - .github/workflows/zomorod-services-offers-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-services-offers-20261106
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate single-file guarded content release
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_services_offers_guarded_20261106.py
          python3 scripts/zomorod_services_offers_guarded_20261106.py selftest
      - name: Authenticate pinned SSH identity to existing cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-services-offers-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Inspect exact live service page before any change
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 65s ssh -T -F "$RUNNER_TEMP/zm-services-offers-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/zomorod_services_offers_guarded_20261106.py
      - name: Back up and update only services index HTML
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          timeout 65s ssh -T -F "$RUNNER_TEMP/zm-services-offers-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_services_offers_guarded_20261106.py
      - name: Verify public offer section and metadata plus existing form
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          timeout 65s ssh -T -F "$RUNNER_TEMP/zm-services-offers-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_services_offers_guarded_20261106.py
          python3 - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen
          for attempt in range(6):
              try:
                  url='https://zomorodmelal.ir/services/?zm_offer=' + os.environ['RUN_ID'] + '-' + str(attempt)
                  req=Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Zomorod-Service-Offers-Verify/1.0'})
                  with urlopen(req,timeout=26) as response:
                      html=response.read(400000).decode('utf-8','replace')
                      if response.status!=200:raise RuntimeError('SERVICES_NOT_200')
                  for needle in ('id="zm-service-deliverables-20261106"',
                                 '<title>شرکت خدمات کشاورزی و اقتصاد تولید | زمرد ملل</title>',
                                 'ارزیابی اقتصادی واحد کشاورزی','مدیریت آب و منابع تولید',
                                 'امکان‌سنجی پروژهٔ تولیدی','href="/ask-master/index.php"',
                                 'id="zm-services-action-hub-20261106"'):
                      if needle not in html:raise RuntimeError('SERVICE_OFFER_TOKEN_MISSING')
                  print('LIVE_SERVICE_OFFERS_PUBLIC_VERIFIED=1')
                  break
              except Exception:
                  if attempt==5:raise
                  time.sleep(4)
          PY
      - name: Restore byte-exact old services page on verification failure
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 65s ssh -T -F "$RUNNER_TEMP/zm-services-offers-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_services_offers_guarded_20261106.py
