name: MojPlayWin live store audit source of truth
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-live-audit-now-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read production sale state and on-chain fulfillment counts
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 105s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,pathlib,json,subprocess,time
          r=pathlib.Path('/home/zomorod2/Saeit-staging')
          os.chdir(r);sys.path.insert(0,str(r));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,Order,OrderItem
          from mpw_commerce.models import CommerceInvoice,CommerceReceipt,CommerceFulfillment
          from django.conf import settings
          flags=('RELEASE_READY','CUSTOMER_HTTP_ENABLED','INVOICING_ENABLED','BUYER_SIGNATURE_ENABLED','SETTLEMENT_ENABLED','REAL_RPC_ENABLED','AUTORECONCILE_ENABLED','DOWNLOADS_ENABLED')
          res={'flags':{k:getattr(settings,'MPW_COMMERCE_'+k,False) is True for k in flags}}
          res['books']=[]
          for pk in (72,225):
            p=Product.objects.select_related('knowledge_article').get(pk=pk)
            m=p.metadata or {}
            res['books'].append({'id':pk,'price':str(p.price),'active':p.active,'published':bool(p.knowledge_article and p.knowledge_article.published),
              'quality':m.get('quality_approved') is True,'license':m.get('license_verified') is True,'file':m.get('asset_verified') is True})
          ids=OrderItem.objects.filter(product_id__in=(72,225)).values_list('order_id',flat=True)
          res['orders']=Order.objects.filter(pk__in=ids).count()
          res['paid_orders']=Order.objects.filter(pk__in=ids,status='paid').count()
          res['invoices']=CommerceInvoice.objects.filter(order_id__in=ids).count()
          res['receipts']=CommerceReceipt.objects.filter(invoice__order_id__in=ids).count()
          res['fulfillments']=CommerceFulfillment.objects.filter(item__product_id__in=(72,225)).count()
          c=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=7)
          res['one_minute_worker']=sum('MPW_TWO_BOOKS_RECONCILE_MINUTE_V1' in s for s in c.stdout.splitlines()) if c.returncode==0 else -1
          log=pathlib.Path('/home/zomorod2/.mpw-commerce-two-books/worker.log')
          res['worker_log_exists']=log.is_file()
          res['worker_log_age_minutes']=round((time.time()-log.stat().st_mtime)/60,1) if log.is_file() else None
          print('MPW_AUDIT_LIVE_STATE='+json.dumps(res))
          PY
          BASH
