name: Factory toolchain read-only status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-toolchain-status.yml']
  pull_request:
    paths: ['.github/workflows/factory-toolchain-status.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect private transfer and proof metadata
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/toolchain-ssh"
          mkdir -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs
          options=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote=(ssh "${options[@]}" githubops@178.239.147.150)
          "${remote[@]}" 'python3 -' <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/'factory-runtime/operations'
          for stage in sorted(root.glob('toolchain-source-*')):
              print('STAGE='+stage.name)
              print(json.dumps({p.name:p.stat().st_size for p in stage.iterdir() if p.is_file()},sort_keys=True))
          # Compare the retired transfer bundle against bounded installed model/toolchain candidates.
          import hashlib, os
          stage=root/'toolchain-source-39232784800-1'
          if stage.is_dir():
              for name in ('install.sh','prove.py','metadata.json','SHA256SUMS'):
                  p=stage/name
                  if p.is_file():
                      print('STAGED_METADATA_'+name+'='+json.dumps(p.read_text(errors='replace')[:3000]))
          local_roots=[root/'build-toolchain',Path.home()/'.cache/huggingface',Path.home()/'models',Path.home()/'comfyui-isolated']
          found=[]
          visited=0
          for base in local_roots:
              if not base.is_dir() or base.is_symlink(): continue
              for walk,dirs,names in os.walk(base,followlinks=False):
                  dirs[:]=[d for d in dirs if not (Path(walk)/d).is_symlink()]
                  for name in names:
                      visited+=1
                      p=Path(walk)/name
                      if p.suffix.lower()=='.gguf' or name=='runtime.tar.xz':
                          try:
                              size=p.stat().st_size
                              if size>0:
                                  h=hashlib.sha256()
                                  with p.open('rb') as stream:
                                      for chunk in iter(lambda:stream.read(1024*1024),b''): h.update(chunk)
                                  found.append({'path':str(p),'bytes':size,'sha256':h.hexdigest()})
                          except OSError: pass
                      if visited>=5000: break
                  if visited>=5000: break
              if visited>=5000: break
          print('INSTALLED_MODEL_RUNTIME_CANDIDATES='+json.dumps(found,sort_keys=True))
          print('MODEL_SCAN_VISITED_FILES='+str(visited))
          versions=root/'build-toolchain/versions'
          asset_dirs=[]
          for version in versions.iterdir() if versions.is_dir() else []:
              if not version.is_dir() or version.is_symlink(): continue
              for rel in ('models','bin','work'):
                  folder=version/rel
                  if folder.is_dir() and not folder.is_symlink():
                      entries=[]
                      for item in list(folder.iterdir())[:80]:
                          try: entries.append({'name':item.name,'kind':'dir' if item.is_dir() else 'file','bytes':item.stat().st_size if item.is_file() else None})
                          except OSError: pass
                      asset_dirs.append({'version':version.name,'dir':rel,'entries':entries})
          print('INSTALLED_TOOLCHAIN_ASSET_DIRS='+json.dumps(asset_dirs,sort_keys=True))
          if stage.is_dir():
              for name in ('install.sh','prove.py'):
                  p=stage/name
                  if p.is_file():
                      selected=[line for line in p.read_text(errors='replace').splitlines() if any(word in line.lower() for word in ('model','gguf','llama'))]
                      print('MODEL_REFERENCE_LINES_'+name+'='+json.dumps(selected[:100]))

          versions=root/'build-toolchain/versions'
          if versions.is_dir():
              for version in sorted(versions.iterdir()):
                  if not version.is_dir(): continue
                  print('VERSION='+version.name)
                  proof=version/'proof.json'
                  if proof.is_file():
                      report=json.loads(proof.read_text())
                      print('PROOF='+json.dumps({k:v['passed'] for k,v in report['checks'].items()},sort_keys=True))
                  piplog=version/'pip-install.log'
                  if piplog.is_file():
                      print('PIP_LOG_BYTES='+str(piplog.stat().st_size))
          manifest=root/'build-toolchain/toolchain-manifest.json'
          if manifest.is_file():
              report=json.loads(manifest.read_text())
              assert len(report['checks'])==6 and all(x['passed'] for x in report['checks'].values())
              print('VERIFIED_PACKAGES='+json.dumps(report['packages'],sort_keys=True))
              print('LOCAL_MODEL_EVIDENCE='+json.dumps(report['checks']['local_language_model']['evidence'],sort_keys=True))
          factory=Path.home()/'factory-runtime'
          production=factory/'private/autonomous-product-cycle/production-state.json'
          if production.is_file():
              state=json.loads(production.read_text())
              print('FACTORY_REGISTERED_RECIPE_COUNT='+str(state.get('registered_recipe_count')))
              print('PRODUCTION_STATE_MTIME='+str(production.stat().st_mtime))
          print('EXISTING_COMFYUI_CPU_ENV='+str((Path.home()/'comfyui-isolated/env-cpu/bin/python').is_file()))
          print('CURRENT_MANIFEST='+str((root/'build-toolchain/toolchain-manifest.json').is_file()))
          import subprocess
          tools=json.loads((root/'build-toolchain/toolchain-manifest.json').read_text())
          diagnostic_code="import json\nfrom pathlib import Path\nfrom openpyxl import load_workbook\nroot=Path.home()/'factory-runtime/private/autonomous-product-cycle'\nstate=json.loads((root/'build-50/capacity_planning_workbook/state.json').read_text())\nfolder=Path(state['attempt_folder'])\nfolder.resolve().relative_to((root/'build-50').resolve())\nprint('WORKBOOK50_DEFECTS='+json.dumps(state.get('defects')))\nprint('WORKBOOK50_FILES='+json.dumps([p.name for p in folder.iterdir() if p.is_file() and p.name.startswith('workbook')]))\nfile=folder/'workbook.xlsx'\nif file.is_file():\n book=load_workbook(file,data_only=False)\n print('WORKBOOK50_SHEETS='+json.dumps(book.sheetnames))\n for sheet in book.worksheets[1:]:\n  color=sheet['A2'].font.color\n  print('WORKBOOK50_LAYOUT='+json.dumps({'sheet':sheet.title,'freeze':sheet.freeze_panes,'input_locked':sheet['B3'].protection.locked,'formula_locked':sheet['B8'].protection.locked,'formula_type':sheet['B8'].data_type,'navigation':str(sheet['A12'].hyperlink),'navigation_value':sheet['A12'].value,'fill':str(sheet['A2'].fill.fgColor),'font':str(color),'validation_ranges':[str(v.sqref) for v in sheet.data_validations.dataValidation]},default=str))\n print('WORKBOOK50_GUIDE_BYTES='+str((folder/'user-guide.md').stat().st_size))\n"
          subprocess.run([tools['python'],'-c',diagnostic_code],check=True,timeout=45)
          PY
