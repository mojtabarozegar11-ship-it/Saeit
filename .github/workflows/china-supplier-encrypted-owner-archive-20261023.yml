          CERT
          timeout 280s ssh -T -F "$d/config" company python3 - < scripts/company_bundle_supplier_catalogues_private_20261023.py | openssl cms -encrypt -binary -aes256 -outform DER -out "$RUNNER_TEMP/supplier-catalogues-20261023.cms" "$d/recipient.pem"
          test -s "$RUNNER_TEMP/supplier-catalogues-20261023.cms"
          openssl cms -cmsout -print -inform DER -in "$RUNNER_TEMP/supplier-catalogues-20261023.cms" >/dev/null
          echo ENCRYPTED_CATALOGUE_ARCHIVE_READY=true
          stat -c 'ENCRYPTED_ARCHIVE_BYTES=%s' "$RUNNER_TEMP/supplier-catalogues-20261023.cms"
      - name: Upload encrypted only (GitHub public repo, key NOT present)
        uses: actions/upload-artifact@v4
        with:
          name: supplier-catalogues-encrypted-owner-20261023
          path: ${{ runner.temp }}/supplier-catalogues-20261023.cms
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Remove private runner SSH materials
        if: always()
        run: |
          d="$RUNNER_TEMP/company-mail-inspect"
          test ! -d "$d" || find "$d" -maxdepth 1 -type f -exec shred -u {} +
