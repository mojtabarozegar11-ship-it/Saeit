name: One-shot Zomorod immutable JavaScript cache control
on:
  push:
    branches: [fix/zomorod-js-immutable-cache-20261107]
    paths:
      - .github/workflows/zomorod-js-cache-one-shot-20261107.yml
permissions:
  contents: read
concurrency:
  group: zomorod-js-cache-only-20261107
  cancel-in-progress: false
jobs:
  publish_cache_only:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline safety tests and exact public source preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_js_cache_guard_20261107.py
          python3 -m unittest discover -s tests -p test_zomorod_js_cache_guard_20261107.py -v
          curl --fail --location --silent --show-error --max-time 35 \
            'https://zomorodmelal.ir/?zm_cache_preflight=20261107' \
            -o "$RUNNER_TEMP/zm-page.html"
          test "$(sha256sum "$RUNNER_TEMP/zm-page.html" | cut -d' ' -f1)" = \
            '99e9c38cd20aaf400a3c68c2064211dc48d4ff0e518ee4815061ea0ca2626edc'
          curl --fail --location --silent --show-error --max-time 35 \
            'https://zomorodmelal.ir/static/site/zomorod-perf/zomorod-home-runtime-e0455f2cafacaee34b5c.js' \
            -o "$RUNNER_TEMP/zm-runtime.js"
          test "$(sha256sum "$RUNNER_TEMP/zm-runtime.js" | cut -d' ' -f1)" = \
            'e0455f2cafacaee34b5c6cfba8157af575caeda1df6c8f64e92b6575c944ca07'
      - name: Authenticate direct cPanel or pinned VPS relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-js-cache-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct \
              'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel \
              'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
          else
            echo 'Authenticated cPanel path unavailable'; exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Read-only cPanel exact-hash and cache configuration preflight
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-js-cache-ssh/config" "$COMMAND_HOST" \
            'python3 -' < scripts/zomorod_js_cache_guard_20261107.py
      - name: Apply one-asset cache rule with self-rollback
        id: apply
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 120s ssh -T -F "$RUNNER_TEMP/zm-js-cache-ssh/config" "$COMMAND_HOST" \
            'python3 - --apply' < scripts/zomorod_js_cache_guard_20261107.py
      - name: Independent public immutable-cache and unchanged-template verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 35 \
            'https://zomorodmelal.ir/?zm_cache_postverify=20261107' \
            -o "$RUNNER_TEMP/zm-home-after.html"
          test "$(sha256sum "$RUNNER_TEMP/zm-home-after.html" | cut -d' ' -f1)" = \
            '99e9c38cd20aaf400a3c68c2064211dc48d4ff0e518ee4815061ea0ca2626edc'
          curl --fail --location --silent --show-error --max-time 35 \
            'https://zomorodmelal.ir/static/site/zomorod-perf/zomorod-home-runtime-e0455f2cafacaee34b5c.js?zm_cache_postverify=20261107' \
            -D "$RUNNER_TEMP/zm-js-headers.txt" -o "$RUNNER_TEMP/zm-js-after.js"
          test "$(sha256sum "$RUNNER_TEMP/zm-js-after.js" | cut -d' ' -f1)" = \
            'e0455f2cafacaee34b5c6cfba8157af575caeda1df6c8f64e92b6575c944ca07'
          grep -i 'cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/zm-js-headers.txt"
          echo 'ZOMOROD_ONE_ASSET_CACHE_VERIFIED=PASS'
      - name: Revert only new cache rule if external verification fails
        if: failure() && steps.apply.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-js-cache-ssh/config" "$COMMAND_HOST" \
            'python3 - --rollback' < scripts/zomorod_js_cache_guard_20261107.py
