name: Management ledger cPanel read-only receipt 2026-11-07

# One-time evidence collection for PR #2127. No production writes or restarts.
# Only a push which changes this bounded receipt or its sanitizer on the audit branch runs it.
on:
  push:
    branches:
      - feature/management-ledger-autopilot-safe-20261107
    paths:
      - .github/workflows/management-ledger-cpanel-readonly-receipt-20261107.yml
      - scripts/management_passenger_binding_readonly.py
      - scripts/management_domain_docroot_readonly.py
      - scripts/cpanel_management_runtime_probe.sh

permissions:
  contents: read

concurrency:
  group: management-ledger-cpanel-readonly-receipt-20261107
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed diagnostic bridge from this exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # UAPI-only metadata (redacted on the runner), not Python invocation.
      - name: Attest management Passenger mapping without production mutation
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          bash deploy/cpanel_direct_command.sh management_passenger_binding

      - name: Attest domain document root without logging raw cPanel metadata
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m unittest -q scripts.tests.test_management_domain_docroot_readonly
          bash deploy/cpanel_direct_command.sh management_domain_docroot

      - name: Collect redacted Passenger process and source fingerprints
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash -n scripts/cpanel_management_runtime_probe.sh
          bash deploy/cpanel_direct_command.sh management_runtime_fingerprint
