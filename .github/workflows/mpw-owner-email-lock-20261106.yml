name: MPW one-off owner-approved email lock release

on:
  push:
    branches: [fix/mpw-owner-email-lock-20261106]
    paths:
      - .github/workflows/mpw-owner-email-lock-20261106.yml

permissions: {contents: read}
concurrency:
  group: mpw-owner-email-lock-20261106
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/fix/mpw-owner-email-lock-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate exact candidate and fail-closed guard
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_owner_email_lock_guarded_release_20261106.py
          python3 scripts/mpw_owner_email_lock_guarded_release_20261106.py selftest
          printf '%s  %s\n' 'd2a3400d2b94d23603c879dfba7ebbf70782a2d26c33cb5476d14ce1be3912f6' 'mpw_revenue_20261020/earn/inquiry.php' | sha256sum -c -
      - name: Configure fingerprint-verified VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-mail-lock-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 30s ssh -i "$d/vps.key" -p 22 -o UserKnownHostsFile="$d/vps.known" -o StrictHostKeyChecking=yes -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Guard exact live PHP, lint, backup and publish the no-mail candidate
        id: publication
        run: |
          set -euo pipefail
          script="$(base64 -w0 scripts/mpw_owner_email_lock_guarded_release_20261106.py)"
          config="$RUNNER_TEMP/mpw-mail-lock-ssh/config"
          for mode in preflight publish; do
            base64 -w0 mpw_revenue_20261020/earn/inquiry.php | base64 -d | timeout 75s ssh -T -F "$config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))' '$mode' '$GITHUB_RUN_ID'"
          done
      - name: Public GET-only verification of no-mail inquiry form and store
        run: |
          python3 - <<'PY'
          import urllib.request
          root='https://mojplaywin.com'
          with urllib.request.urlopen(root+'/mpw-editorial/revenue/inquiry.php?service=general',timeout=30) as response:
              body=response.read(120000).decode('utf8','replace')
              assert response.status==200
          assert 'Automatic email notifications are disabled' in body
          assert 'No automatic email receipt or response is sent by this form.' in body
          assert 'name="csrf"' in body and 'type="email"' in body
          with urllib.request.urlopen(root+'/store/',timeout=25) as response:
              assert response.status==200 and b'mpw-products' in response.read(100000)
          print('MPW_INQUIRY_NO_AUTOMATIC_MAIL_AND_STORE_GET=PASS')
          PY
      - name: Roll back only the one inquiry PHP when live checks fail
        if: failure() && steps.publication.outcome == 'success'
        run: |
          script="$(base64 -w0 scripts/mpw_owner_email_lock_guarded_release_20261106.py)"
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-mail-lock-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))' rollback '$GITHUB_RUN_ID'"
      - name: Delete only runner temporary relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-mail-lock-ssh"
          if test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/config"
            rmdir -- "$d"
          fi
