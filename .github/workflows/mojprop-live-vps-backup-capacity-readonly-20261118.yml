name: MOJ PROP — owner VPS backup admission and alternate disk evidence (read only)
on:
  push:
    branches: [audit/mojprop-live-capacity-and-backup-admission-20261118]
    paths:
      - .github/workflows/mojprop-live-vps-backup-capacity-readonly-20261118.yml
permissions: {contents: read}
jobs:
  authentic-standalone-vps-capacity-evidence:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Verify factory runner and loopback ssh identity
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$(id -un)" != "githubrunner" || -z "${VPS_KEY:-}" ]]; then
            echo "MOJPROP_VPS_CAPACITY=BLOCKED_RUNNER_OR_KEY"
            exit 1
          fi
          dir="$RUNNER_TEMP/mojprop-vps-capacity-$GITHUB_RUN_ID"
          install -d -m 700 "$dir"
          trap 'rm -f "$dir/key" "$dir/known"; rmdir "$dir" 2>/dev/null || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$dir/key"
          chmod 600 "$dir/key"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null 2>&1
          timeout 12s ssh-keyscan -T 8 -p 22 -t rsa 127.0.0.1 > "$dir/known" 2>/dev/null || true
          actual="$(ssh-keygen -lf "$dir/known" -E sha256 2>/dev/null | awk '{print $2}' | sort -u || true)"
          if [[ "$actual" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" ]]; then
            echo "MOJPROP_VPS_CAPACITY=BLOCKED_HOST_FINGERPRINT"
            exit 1
          fi
          echo "VPS_LOOPBACK_PINNED_IDENTITY=verified"
          sshcmd=(ssh -T -i "$dir/key" -p 22
            -o UserKnownHostsFile="$dir/known" -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no
            -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=2
            githubops@127.0.0.1)
          timeout 25s "${sshcmd[@]}" 'test "$(id -un)" = githubops' >/dev/null
          echo "VPS_OWNER_PRIVATE_ACCOUNT=verified"
          timeout 115s "${sshcmd[@]}" 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' <<'PRIVATE_RO_PY'
          import json,os,stat,shutil,subprocess,re,time
          from pathlib import Path
          home=Path.home()
          gi=1024**3
          private=home/'.private-mojplaywin-offhost-backups'
          key=home/'.config'/'mojplaywin-backup-recovery'/'recovery-key.bin'
          def private_dir(p):
              try:
                  s=p.lstat()
                  return stat.S_ISDIR(s.st_mode) and s.st_uid==os.geteuid() and not s.st_mode & 0o077
              except OSError:return False
          def private_key(p):
              try:
                  s=p.lstat()
                  return stat.S_ISREG(s.st_mode) and s.st_uid==os.geteuid() and not s.st_mode & 0o177 and s.st_size==32
              except OSError:return False
          sources={
              'home':home,
              'backup_home':private,
              'var_tmp':Path('/var/tmp'),
              'tmp':Path('/tmp'),
              'mnt':Path('/mnt'),
              'srv':Path('/srv'),
              'media':Path('/media'),
              'data':Path('/data'),
              'opt':Path('/opt'),
          }
          disks={}
          for name,p in sources.items():
              try:
                  if p.is_symlink() or not p.is_dir():continue
                  node=p.stat()
                  fs=os.statvfs(p)
                  free=fs.f_bavail*fs.f_frsize
                  size=fs.f_blocks*fs.f_frsize
                  disks[name]={'free_bytes':free,'filesystem_bytes':size,
                       'device_id':node.st_dev,
                       'distinct_from_home_device':node.st_dev!=home.stat().st_dev,
                       'private_existing_target':private_dir(p),
                       'has_10gib_free':free>=10*gi}
              except OSError:continue
          summary={}
          targets={
              'private_encrypted_backups':private,
              'factory_runtime':home/'factory-runtime',
              'user_cache':home/'.cache',
              'user_local':home/'.local',
              'user_logs':home/'logs',
              'user_temp':home/'tmp',
              'home_total':home,
          }
          for keyname,p in targets.items():
              item={'directory_exists':False,'allocation_measured':False}
              try:
                  if p.is_symlink() or not p.is_dir():
                      summary[keyname]=item
                      continue
                  item['directory_exists']=True
                  cmd=subprocess.run(['nice','-n','19','du','-skx',str(p)],
                       stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                       timeout=14,check=False)
                  if cmd.returncode==0 and len(cmd.stdout)<1024:
                      item['allocated_bytes']=int(cmd.stdout.decode('ascii').split()[0])*1024
                      item['allocation_measured']=True
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):pass
              summary[keyname]=item
          count=0
          fullpair=0
          partial=0
          if private_dir(private):
              sets={}
              try:
                  for p in private.iterdir():
                      count+=1
                      if count>2500:break
                      if p.name.endswith('.partial'):partial+=1
                      m=re.fullmatch(r'(mojplaywin_[0-9]{8}T[0-9]{6}Z_[0-9a-f]{16})_(mysql|files)_gpgv2\.(gpg|manifest\.json)',p.name)
                      if m and p.is_file() and not p.is_symlink():
                          sets.setdefault(m.group(1),set()).add((m.group(2),m.group(3)))
                  expected={('mysql','gpg'),('files','gpg'),('mysql','manifest.json'),('files','manifest.json')}
                  fullpair=sum(expected<=f for f in sets.values())
              except OSError:pass
          home_free=disks.get('home',{}).get('free_bytes',0)
          live_gpg=shutil.which('gpg') is not None
          # Do not change historical 10GiB source admission; do not delete old backups.
          result={
             'classification':'READONLY_VPS_CAPACITY_FRESH_BACKUP_GATE',
             'backend_user_authenticated':True,
             'existing_key_metadata_owner_private_32_bytes':private_key(key),
             'private_archive_root_owner_only':private_dir(private),
             'gpg_available':live_gpg,
             'measured_filesystem_free_bytes':home_free,
             'requires_minimum_free_bytes':10*gi,
             'fresh_backup_capacity_gate_passed':bool(home_free>=10*gi),
             'additional_bytes_needed_to_reach_10gib':max(0,10*gi-home_free),
             'candidate_locations':disks,
             'classed_directory_usage':summary,
             'private_archive_four_part_pair_count':fullpair,
             'private_archive_partial_names_count':partial,
             'private_archive_listing_bounded':count<=2500,
             'files_deleted':0,'database_bytes_read':False,
             'secret_key_bytes_read':False,'payment_collected':False,
             'backup_written':False,'isolated_restore_performed':False,
             'release_authorized':False
          }
          print('MOJPROP_AUTHENTIC_VPS_STORAGE_ADMISSION='+json.dumps(result,sort_keys=True))
          PRIVATE_RO_PY
          echo "MOJPROP_VPS_READONLY_CAPACITY_COMPLETED=true"
