name: Replace slow offsite transfer with compressed transfer
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-cancel-slow-offsite-transfer-20261018.yml"]
permissions:
  actions: write
  contents: read
jobs:
  cancel-slow-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop slow non-compressed transfer without touching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/39112048569"
          status="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" | python3 -c 'import json,sys;print(json.load(sys.stdin)["status"])')"
          echo "OLD_TRANSFER_STATUS=$status"
          if test "$status" != completed; then
            statuscode="$(curl -sS -o "$RUNNER_TEMP/cancel.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url/cancel")"
            echo "CANCEL_RESPONSE_CODE=$statuscode"
            test "$statuscode" = 202 -o "$statuscode" = 409
            for n in $(seq 1 30); do
              state="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" | python3 -c 'import json,sys;print(json.load(sys.stdin)["status"])')"
              test "$state" = completed && break
              sleep 3
            done
          fi
          final="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" | python3 -c 'import json,sys; j=json.load(sys.stdin); print(str(j["status"])+"/"+str(j.get("conclusion")))')"
          echo "OLD_TRANSFER_FINAL=$final"
          test "$(echo "$final" | cut -d/ -f1)" = completed
