name: MojPlayWin main app docroot graceful cache refresh and 20 sample QA
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-docroot-template-refresh-20261019.yml"]
permissions: {contents: read}
concurrency:
  group: mojplaywin-main-docroot-only-template-refresh
  cancel-in-progress: false
jobs:
  verify_and_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify live baseline on protected main and sibling pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json
          sites=('/','/store/','/taniya/','/farnaz/','/saman/','/picm/','/zahra/')
          out={}
          for p in sites:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+p,timeout=17) as r:out[p]=r.status
              except urllib.error.HTTPError as e:out[p]=e.code
          for p in ('/','/store/','/taniya/','/farnaz/','/saman/','/picm/'):
              if out[p]!=200:raise RuntimeError('Protected main-site baseline failed: '+p)
          with open(os.environ['RUNNER_TEMP']+'/mpw-docroot-response-baseline.json','w') as f:json.dump(out,f)
          print('MPW_DOCROOT_BASELINE='+json.dumps(out))
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Refresh exact audited main Passenger docroot template workers gracefully
        id: refresh
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          from pathlib import Path
          h=Path('/home/zomorod2')
          web=h/'mojplaywin.com'
          app=h/'Saeit-staging'
          wsgi=web/'passenger_wsgi.py'
          template=app/'core/templates/mojplaywin/store.html'
          if web.is_symlink() or app.is_symlink() or wsgi.is_symlink() or template.is_symlink():
              raise SystemExit('PROTECTED_LINK_NOT_ALLOWED')
          if not web.is_dir() or not app.is_dir() or not wsgi.is_file() or not template.is_file():
              raise SystemExit('AUDITED_APP_NOT_PRESENT')
          if "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):
              raise SystemExit('PASSENGER_MAIN_APP_IDENTITY_MISMATCH')
          data=template.read_bytes()
          if data.count(b'href="/store/product/72/checkout/"')!=1 or data.count(b'href="/store/product/225/checkout/"')!=1:
              raise SystemExit('LIVE_PAYMENT_LINKS_NOT_ON_DISK')
          d=web/'tmp'
          if d.is_symlink():raise SystemExit('MAIN_DOCROOT_TMP_IS_SYMLINK')
          d.mkdir(exist_ok=True)
          target=d/'restart.txt'
          if target.is_symlink() or (target.exists() and not target.is_file()):
              raise SystemExit('INVALID_RESTART_MARKER')
          target.touch()
          print('MPW_DOCROOT_GRACEFUL_TEMPLATE_RELOAD_REQUESTED=YES')
          PY
      - name: Verify 20 independent live replies and all protected paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,hashlib,os,time,json
          url='https://mojplaywin.com/store/'
          records=[]
          for i in range(20):
              req=urllib.request.Request(url+'?__docroot_refresh='+os.environ['GITHUB_RUN_ID']+'-'+str(i)+'-'+str(time.time_ns()),headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      data=r.read(950000);code=r.status
                  content=data.decode('utf8','replace')
                  correct=(code==200 and content.count('href="/store/product/72/checkout/"')==1 and content.count('href="/store/product/225/checkout/"')==1 and 'Payment is not open for these books yet.' not in content and 'id="mpw-book-buyer-details"' in content)
                  records.append({'n':i,'code':code,'correct':correct,'sha':hashlib.sha256(data).hexdigest()[:12]})
              except Exception as e:
                  records.append({'n':i,'correct':False,'error':type(e).__name__})
              if i<5:time.sleep(1)
          print('MPW_DOCROOT_20_SAMPLE='+json.dumps(records))
          if sum(1 for r in records if r['correct'])!=20:
              raise RuntimeError('Mixed store templates persist after docroot reload')
          with open(os.environ['RUNNER_TEMP']+'/mpw-docroot-response-baseline.json') as f:before=json.load(f)
          after={}
          for p in before:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+p,timeout=18) as r:after[p]=r.status
              except urllib.error.HTTPError as e:after[p]=e.code
          if before!=after:raise RuntimeError('Protected site response regression after refresh')
          print('MPW_DOCROOT_20_OF_20=PASS;CHILD_SITES=UNCHANGED;PAYMENT_CONFIGURATION=UNCHANGED')
          PY
