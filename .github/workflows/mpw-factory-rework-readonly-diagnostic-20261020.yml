name: Read-only private MojPlayWin factory rework blockers and prior order state
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-factory-rework-readonly-diagnostic-20261020.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-rework-readonly-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect only aggregate source-bound blockers on existing VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/readonly-rework"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 110s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 githubops@178.239.147.150 python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json,re
          root=Path.home()/'factory-runtime/private/autonomous-product-cycle'
          base=root/'design-state/mojplaywin-actual-technical-repair'
          stage=root/'design-intake/mojplaywin-stage1-quality-returns'
          orders=root/'production-instructions/orders'
          reasons=Counter(); states=Counter(); families=Counter()
          recipes=Counter(); evidence=Counter(); count=0; blocked=0
          files=sorted(stage.glob('*.json'))
          assert len(files)<=50
          for p in files:
              assert p.is_file() and not p.is_symlink()
              ret=json.loads(p.read_text())
              product=ret['product_id']; version=ret['source_sha256']
              assert re.fullmatch(r'[a-z][a-z0-9_]{1,63}',product) and re.fullmatch(r'[0-9a-f]{64}',version)
              receipt=base/p.name
              assert receipt.is_file() and not receipt.is_symlink()
              doc=json.loads(receipt.read_text())
              state=doc.get('consumer_bundle_status','unknown')
              states[state]+=1; count+=1
              if state in ('held_for_rework','absent'):
                  blocked+=1
                  message=str(doc.get('blocking_reason') or 'NO_REASON')
                  token=message.rsplit(':',1)[-1].split(' ',1)[0]
                  if not re.fullmatch(r'[A-Z0-9_]{3,90}',token):token='UNCLASSIFIED'
                  reasons[token]+=1
              stock=root/'production-warehouse/finished'/product/version/'warehouse_manifest.json'
              assert stock.is_file() and not stock.is_symlink()
              manifest=json.loads(stock.read_text())
              family=manifest.get('family_id')
              families[family if isinstance(family,str) and re.fullmatch('F[0-9]{2}',family) else 'UNDECLARED']+=1
              recipes['compatible' if re.fullmatch(r'(?:synth|sheet)_[a-f0-9]{24}',product) else 'other_native_product']+=1
              evidence['generated_recipe_present' if (root/'generated-product-recipes'/product/'design_receipt.json').is_file() else 'generated_recipe_absent']+=1
          order_states=Counter(); order_phases=Counter(); site_orders=0; legacy_cycles=Counter()
          if orders.is_dir() and not orders.is_symlink():
              for p in orders.glob('WO-*.json'):
                  if not p.is_file() or p.is_symlink():continue
                  data=json.loads(p.read_text())
                  if data.get('requesting_site')!='mojplaywin.com':continue
                  site_orders+=1
                  status=str(data.get('status','unknown'))
                  phase=str(data.get('phase','unknown'))
                  order_states[status if re.fullmatch(r'[a-z_]{1,55}',status) else 'unknown']+=1
                  order_phases[phase if re.fullmatch(r'[a-z_]{1,55}',phase) else 'unknown']+=1
                  cycle=str(data.get('bridge_cycle',''))
                  if re.fullmatch(r'[0-9]{8}',cycle):legacy_cycles[cycle]+=1
          print('READONLY_REWORK_PRODUCTS='+str(count))
          print('READONLY_REWORK_BLOCKED='+str(blocked))
          for name,counts in [('BLOCKERS',reasons),('STATUS',states),('FAMILY',families),('RECIPE_KIND',recipes),('RECIPE_EVIDENCE',evidence),('SITE_WORK_ORDER_STATUS',order_states),('SITE_WORK_ORDER_PHASE',order_phases),('SITE_WORK_ORDER_CYCLES',legacy_cycles)]:
              print('READONLY_'+name+'='+json.dumps(dict(sorted(counts.items())),sort_keys=True))
          print('READONLY_SITE_WORK_ORDER_TOTAL='+str(site_orders))
          print('READONLY_AUDIT_NO_MUTATION=PASS')
          PY
