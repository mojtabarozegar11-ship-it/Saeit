name: Zomorod 4 safe visual effects targeted DOM audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-fx4-readonly-audit-20261018.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"

      - name: Inspect static homepage CSS class declarations without writes
        shell: bash
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/zomorod-baseline-inventory/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('/home/zomorod2/public_html/index.html')
          assert p.is_file() and not p.is_symlink()
          b=p.read_bytes()
          s=b.decode('utf8')
          print('FX4_SHA256='+hashlib.sha256(b).hexdigest())
          print('FX4_BYTES='+str(len(b)))
          for key in ('<header class="topbar wrap"','<div class="solar-area"','id="solar-stage"','class="central-globe"','class="globe-ring ring-one"','class="orbital-stars"','class="orbital-cards"','zm-gold-search-toolbar-20261018','zm-topics-top-icon-20261018','<footer class="footer"'):
            print('FX4_MARKER '+key+' COUNT='+str(s.count(key)))
          for name in ('globe-ring','ring-one','ring-two','ring-three','orbital-stars','orbital-card','orbit-card','planet-card','central-globe','solar-stage','top-actions','header-orbit','zomorod-icon','footer-social-icon','orbital-cards'):
            pats=list(re.finditer(r'(?<![a-zA-Z0-9_-])\.'+re.escape(name)+r'(?![a-zA-Z0-9_-])[^{]{0,150}\{',s))
            print('FX4_CSS_SELECTOR '+name+' COUNT='+str(len(pats)))
            for m in pats[:3]:
              body=s[m.start():m.start()+470]
              body=body.split('}',1)[0].replace('\n',' ')
              print('FX4_CSS_EXCERPT '+name+': '+body[:450])
          for kw in ('@keyframes ring','@keyframes orbit','@keyframes globe','@keyframes twinkle','@keyframes star'):
            for m in list(re.finditer(re.escape(kw),s,re.I))[:2]:
              print('FX4_ANIMATION '+kw+' '+s[m.start():m.start()+210].replace('\n',' ')[:210])
          PY
      - name: Cleanup SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-baseline-inventory"
