name: MojPlayWin routing and middleware safe source mapping
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-route-security-source-inventory-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Identify repeated namespace and middleware insertion boundary
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,pathlib,json,hashlib,re,ast
          r=pathlib.Path('/home/zomorod2/Saeit-staging')
          os.chdir(r);sys.path.insert(0,str(r));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.urls import get_resolver
          from django.conf import settings
          urls=r/'config/urls.py'
          s=urls.read_text('utf8','replace')
          lines=s.splitlines()
          matches=[{'line':i,'source':ln.strip()[:200]} for i,ln in enumerate(lines,1)
              if 'mpw_commerce' in ln or 'urlpatterns +=' in ln or ('commerce/' in ln and 'path(' in ln)]
          print('MPW_URLS_DUPLICATION='+json.dumps({'hash':hashlib.sha256(s.encode()).hexdigest(),
            'references':matches,'last_45':lines[-45:]}))
          m=list(settings.MIDDLEWARE)
          print('MPW_MIDDLEWARE_STACK='+json.dumps({'middlewares':m,
            'security_middleware_count':sum('SecurityMiddleware' in x for x in m),
            'settings_content':[(i,x.strip()[:200]) for i,x in enumerate((r/'config/settings.py').read_text('utf8','replace').splitlines(),1)
              if 'MIDDLEWARE' in x or 'SecurityMiddleware' in x or 'SECURE_HSTS' in x or 'SECURE_SSL_REDIRECT' in x]}))
          for key in ('/commerce/book/72/','/commerce/checkout/order/','/commerce/checkout/verify/','/commerce/my-purchases/'):
            from django.urls import resolve
            x=resolve(key)
            print('MPW_RESOLVED='+json.dumps({'path':key,'app_names':x.app_names,'namespaces':x.namespaces,'url_name':x.url_name}))
          PY
          BASH
