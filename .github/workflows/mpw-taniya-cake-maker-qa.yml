name: Taniya Cake Maker gameplay and export QA
on:
  pull_request:
    paths:
      - 'templates/taniya_studio/index.html'
      - 'tests/game/taniya-cake.cjs'
      - 'tests/game/taniya-cake-browser.cjs'
      - '.github/workflows/mpw-taniya-cake-maker-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cake-maker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Cake Maker state, decoration export and safe reset
        run: node tests/game/taniya-cake.cjs
      - name: Parse the complete Taniya studio inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('templates/taniya_studio/index.html').read_text('utf-8')
          assert html.count('<script>')==1
          Path('/tmp/taniya-cake-full.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/taniya-cake-full.js
      - name: Exercise actual Cake Maker UI and SVG downloads in desktop and mobile Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taniya-playwright"
          cd "$RUNNER_TEMP/taniya-playwright"
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/taniya-playwright/node_modules" node tests/game/taniya-cake-browser.cjs
