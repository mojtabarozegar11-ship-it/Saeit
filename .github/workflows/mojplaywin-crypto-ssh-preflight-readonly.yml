name: MojPlayWin crypto isolated-host preflight (READ ONLY)
on:
  push:
    branches:
      - feature/mojplaywin-crypto-gateway-20261018
    paths:
      - .github/workflows/mojplaywin-crypto-ssh-preflight-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojplaywin-crypto-ssh-preflight-readonly
  cancel-in-progress: false

jobs:
  observe-without-writes:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate existing bounded read-only probes locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mojplaywin_cpanel_readonly_inventory.py \
            scripts/mojplaywin_live_routing_fingerprint.py \
            scripts/mojplaywin_backup_restore_readiness_readonly.py \
            scripts/mojplaywin_isolated_restore_capabilities_readonly.py
          echo "PROBE_SOURCE_CHECK=passed"
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"
      - name: Inspect Passenger mapping without disclosing app roots
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel 'uapi --output=json PassengerApps list_applications' | python3 scripts/mojplaywin_cpanel_readonly_inventory.py
      - name: Inspect main domain routing and protected child sites without writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_live_routing_fingerprint.py
      - name: Inspect cPanel backup prerequisites without reading user file contents
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_backup_restore_readiness_readonly.py
      - name: Check sanitized effective MySQL preflight without DB modifications
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 80s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_consistent_db_preflight_readonly.py
      - name: Inspect offhost backup capability and aborted backup metadata
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-vps python3 - vps < scripts/mojplaywin_backup_vps_destination_readonly.py
          timeout 40s ssh -T -F "$d/config" saeit-vps python3 - < scripts/mojplaywin_backup_vps_failure_readonly.py
      - name: Inspect VPS isolated restore capabilities without server writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-vps python3 - < scripts/mojplaywin_isolated_restore_capabilities_readonly.py
      - name: Test cPanel-to-VPS simultaneous SSH pipe with synthetic 64KiB only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          outcome="$(
            timeout 45s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import sys; sys.stdout.buffer.write(b\"A\" * 65536)'" |
            timeout 45s ssh -T -F "$d/config" saeit-vps "python3 -c 'import sys; b=sys.stdin.buffer.read(); print(\"SYNTHETIC_STREAM_PASS=\" + str(len(b)==65536 and b==b\"A\"*65536))'"
          )"
          test "$outcome" = "SYNTHETIC_STREAM_PASS=True"
          echo "$outcome"
          echo "SOURCE_DATA_READ=false"
          echo "BACKUP_WRITTEN=false"
      - name: Diagnose AES-GCM using synthetic data solely in VPS memory
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 30s ssh -T -F "$d/config" saeit-vps python3 - < scripts/mojplaywin_crypto_backup_inmemory_readonly.py
      - name: Explicitly deny production release
        shell: bash
        run: |
          echo "READ_ONLY_PREFLIGHT=completed"
          echo "BACKUP_CREATED=false"
          echo "RESTORE_TESTED=false"
          echo "SERVER_FILES_CHANGED=false"
          echo "CRYPTO_PAYMENT_ENABLED=false"
          echo "PRODUCTION_RELEASE_PERMITTED=false"
