name: Atelier Interior public store discoverability and buyer CTA audit
on:
  push:
    branches: [feature/atelier-sale-readiness-20261021]
    paths:
      - ".github/workflows/atelier-interior-public-buyer-discovery-20261021.yml"
permissions: {contents: read}
jobs:
  site_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public store and product link without logins or writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from html.parser import HTMLParser
          import json,re
          def fetch(path):
              with urlopen(Request("https://mojplaywin.com"+path,headers={"User-Agent":"AtelierPublicBuyerLinkAudit/1.0"}),timeout=25) as resp:
                  raw=resp.read(4000000).decode("utf8","replace")
                  return resp.status,raw
          store,stxt=fetch("/store/")
          product,ptxt=fetch("/store/product/879/")
          links=re.findall(r'href\s*=\s*["\']([^"\']+)["\']',stxt,re.I)
          p_links=re.findall(r'href\s*=\s*["\']([^"\']+)["\']',ptxt,re.I)
          f={
              "store_http":store,"product_http":product,
              "store_has_product_879_link":any("/store/product/879/" in x for x in links),
              "store_has_atelier_name":"Atelier Interior" in stxt,
              "store_mentions_preview_only_for_atelier":"Atelier Interior" in stxt and "preview only" in stxt.lower(),
              "product_has_checkout_cta":any("/store/product/879/checkout/" in x for x in p_links),
              "product_has_usd_price":"6.80" in ptxt or "$6.8" in ptxt,
              "product_has_svg_disclosure":"SVG" in ptxt or "illustrations" in ptxt.lower(),
          }
          print("ATELIER_PUBLIC_BUYER_DISCOVERY="+json.dumps(f,sort_keys=True))
          from html.parser import HTMLParser
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.a=[]
                  self.forms=[]
                  self.buttons=[]
                  self.inputs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="a":
                      self.a.append({"href":d.get("href",""),"title":d.get("title","")})
                  if tag=="form":
                      self.forms.append({"action":d.get("action",""),"method":d.get("method","")})
                  if tag=="button":
                      self.buttons.append({"type":d.get("type",""),"class":d.get("class","")})
                  if tag=="input":
                      self.inputs.append({"type":d.get("type",""),"name":d.get("name","")})
          i=Inspector()
          i.feed(ptxt)
          print("ATELIER_BUYER_PAGE_STRUCTURE="+json.dumps({"links":[a for a in i.a if any(k in str(a).lower() for k in ["checkout","product","buy","cart","login","register","order"])][:30],"forms":i.forms[:12],"buttons":i.buttons[:15],"inputs":[v for v in i.inputs if v["type"] not in ("hidden",)][0:15],"contains_buy_word":("buy" in ptxt.lower()),"contains_purchase_word":("purchase" in ptxt.lower())},sort_keys=True))
          print("ATELIER_STORE_ANCHORS="+json.dumps({"product_path_in_html":("/store/product/879/" in stxt),"atelier_word":("atelier" in stxt.lower()),"store_html_chars":len(stxt)},sort_keys=True))
          for label,blob,term in [("STORE_ATELIER",stxt,"atelier"),("PRODUCT_PURCHASE",ptxt,"purchase"),("PRODUCT_ATELIER",ptxt,"atelier")]:
              m=re.search(term,blob,re.I)
              if m:
                  raw=blob[max(0,m.start()-800):m.end()+1500]
                  scrubbed=re.sub(r"(?is)<script.*?</script>|<style.*?</style>","",raw)
                  print("ATELIER_PUBLIC_CONTEXT_"+label+"="+json.dumps(scrubbed[:1800]))
          print("ATELIER_CHECKOUT_REFS="+json.dumps(re.findall(r".{0,90}(?:checkout|purchase|payment|contact).{0,100}",ptxt,re.I)[:12]))
          from hashlib import sha256
          for label,path in [("store","/store/"),("product","/store/product/879/")]:
              for suff in ["","?atelier_probe_20261021=979"]:
                  req=Request("https://mojplaywin.com"+path+suff,headers={"User-Agent":"AtelierCacheSafetyProbe/1.0","Cache-Control":"no-cache"})
                  with urlopen(req,timeout=25) as resp:
                      body=resp.read(200000).decode("utf8","replace")
                      print("ATELIER_PUBLIC_CACHE="+json.dumps({"page":label,"cache_bust":bool(suff),"status":resp.status,"age":resp.headers.get("Age",""),"cache_control":resp.headers.get("Cache-Control","")[:70],"cf_cache_status":resp.headers.get("CF-Cache-Status",""),"etag":resp.headers.get("ETag","")[:60],"sha":sha256(body.encode()).hexdigest()[:14]},sort_keys=True))
          assert store==200 and product==200
          PY
