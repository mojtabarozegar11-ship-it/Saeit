name: Classify recoverable temp build and private proof files
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-proof-build-cache-file-inventory.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-proof-cache-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Inventory old release copies proof backups JDK and Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import os,json,subprocess,stat,time,shutil
          from pathlib import Path
          h=Path.home()
          def bytesof(p):
              if p.is_file():return p.stat().st_size
              r=subprocess.run(["du","-sk","--",str(p)],capture_output=True,text=True,timeout=35)
              return int(r.stdout.split()[0])*1024 if r.returncode==0 and r.stdout else -1
          for name in (".mpw-private-db-backups",".mpw-proof-backups","Saeit-staging/admin-smoke",".cagefs/tmp/jdk-17.0.20.1+1",".gradle/wrapper/dists"):
              p=h/name
              if not p.is_dir():continue
              print("AUDIT_DIR="+name+" bytes="+str(bytesof(p)))
              dirs=sorted([q for q in p.iterdir() if not q.is_symlink()],key=lambda x:bytesof(x),reverse=True)
              for q in dirs[:12]:
                  print("AUDIT_CHILD="+json.dumps({"parent":name,"name":q.name,"size":bytesof(q),"type":"dir" if q.is_dir() else "file"}))
              for q in dirs[:3]:
                  if not q.is_dir():continue
                  subs=sorted([t for t in q.iterdir() if not t.is_symlink()],key=lambda x:bytesof(x),reverse=True)
                  for sub in subs[:15]:
                      print("AUDIT_GRANDCHILD="+json.dumps({"parent":name+"/"+q.name,"name":sub.name,"size":bytesof(sub),"type":"dir" if sub.is_dir() else "file"}))
          print("JAVA_BINARY="+str(shutil.which("java")))
          print("JAVAC_BINARY="+str(shutil.which("javac")))
          proc=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10)
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10)
          for term in (".cagefs/tmp/jdk-17",".gradle/wrapper",".mpw-private-db-backups",".mpw-proof-backups","Saeit-staging/admin-smoke"):
              print("CACHE_DEPENDENCY="+term+" process="+str(sum(term in x for x in proc.stdout.splitlines()))+" cron="+str(sum(term in x for x in cron.stdout.splitlines())))
          print("RECOVERY_CANDIDATES_REVIEWED=yes")
          PY
          REMOTE
      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
