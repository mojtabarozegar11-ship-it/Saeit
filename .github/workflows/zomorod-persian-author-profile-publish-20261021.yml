name: Publish Mojtaba Roozegar Persian author profile
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-persian-author-profile-publish-20261021.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-persian-author-profile-20261021
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified owner profile page
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mojtaba-author.html" <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>مجتبی روزگار | Mojtaba Roozegar | زمرد ملل</title>
          <meta name="description" content="معرفی مجتبی روزگار، محقق و پژوهشگر و مدیرعامل شرکت کشت و صنعت زمرد ملل؛ Mojtaba Roozegar و نام انگلیسی Mojtaba Rozegar.">
          <meta name="robots" content="index,follow,max-image-preview:large">
          <link rel="canonical" href="https://zomorodmelal.ir/authors/mojtaba-rozegar/">
          <meta property="og:type" content="profile">
          <meta property="og:locale" content="fa_IR">
          <meta property="og:title" content="مجتبی روزگار | Mojtaba Roozegar | زمرد ملل">
          <meta property="og:description" content="معرفی رسمی مجتبی روزگار؛ محقق و پژوهشگر و مدیرعامل شرکت کشت و صنعت زمرد ملل.">
          <meta property="og:url" content="https://zomorodmelal.ir/authors/mojtaba-rozegar/">
          <meta property="og:image" content="https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp">
          <meta property="og:image:alt" content="پرتره مجتبی روزگار، Mojtaba Roozegar و Mojtaba Rozegar">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp">
          <script type="application/ld+json">
          {"@context":"https://schema.org","@type":"ProfilePage","url":"https://zomorodmelal.ir/authors/mojtaba-rozegar/","name":"مجتبی روزگار | Mojtaba Roozegar | زمرد ملل","inLanguage":"fa-IR","mainEntity":{"@type":"Person","@id":"https://zomorodmelal.ir/authors/mojtaba-rozegar/#person","name":"مجتبی روزگار","alternateName":["Mojtaba Roozegar","Mojtaba Rozegar","روزگار","Roozegar","Rozegar"],"url":"https://zomorodmelal.ir/authors/mojtaba-rozegar/","image":"https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp","description":"محقق و پژوهشگر و مدیرعامل شرکت کشت و صنعت زمرد ملل.","jobTitle":["محقق","پژوهشگر","مدیرعامل"],"worksFor":{"@type":"Organization","name":"شرکت کشت و صنعت زمرد ملل","url":"https://zomorodmelal.ir/"},"sameAs":["https://mojplaywin.com/mojtaba.roozegar/","https://zomorodmelal.ir/en/authors/mojtaba-rozegar/"]}}
          </script>
          <style>
          :root{color-scheme:dark;--bg:#111c18;--panel:#1b3027;--gold:#d9bd7b;--text:#f4eee1;--muted:#d4ccb9}
          *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#10221b,#182d25 55%,#151c18);color:var(--text);font:17px/2 system-ui,-apple-system,"Segoe UI",sans-serif}
          main{width:min(1050px,calc(100% - 32px));margin:48px auto;padding:clamp(20px,5vw,52px);border:1px solid #d9bd7b70;border-radius:24px;background:var(--panel);box-shadow:0 18px 60px #0005}
          .profile{display:grid;grid-template-columns:minmax(210px,340px) minmax(0,1fr);gap:clamp(24px,5vw,52px);align-items:center}
          figure{margin:0}img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 28%;border:3px solid var(--gold);border-radius:18px}
          figcaption{margin-top:10px;text-align:center;color:var(--muted);font-size:14px}h1{margin:0 0 8px;color:#f2d48a;font-size:clamp(30px,5vw,48px);line-height:1.4}
          .latin{color:var(--muted);direction:ltr;text-align:right}.label{color:var(--gold);font-size:13px;letter-spacing:.08em}
          .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}.links a{color:#f5dc9d;text-decoration:underline;text-underline-offset:4px}
          footer{margin-top:40px;padding-top:18px;border-top:1px solid #d9bd7b55;color:var(--muted);font-size:14px}
          @media(max-width:690px){.profile{grid-template-columns:1fr}figure{width:min(100%,340px);margin:auto}}
          </style>
          </head>
          <body>
          <main>
            <section class="profile" aria-labelledby="profile-name">
              <figure>
                <img src="https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp"
                     alt="پرتره مجتبی روزگار، Mojtaba Roozegar و Mojtaba Rozegar، مدیرعامل و پژوهشگر"
                     width="500" height="620" fetchpriority="high" decoding="async">
                <figcaption>تصویر رسمی مجتبی روزگار</figcaption>
              </figure>
              <div>
                <p class="label">پروفایل رسمی · پژوهش و مدیریت علمی</p>
                <h1 id="profile-name">مجتبی روزگار</h1>
                <p class="latin" lang="en">Mojtaba Roozegar · also written Mojtaba Rozegar</p>
                <p><strong>محقق، پژوهشگر و مدیرعامل شرکت کشت و صنعت زمرد ملل</strong></p>
                <p>در این صفحه، معرفی رسمی مجتبی روزگار و پیوند فعالیت‌های پژوهشی مجموعه با کشاورزی، ژنتیک، اصلاح نژاد و توسعه فناوری ارائه می‌شود. این مسیر بر مطالعه علمی، بررسی شواهد و توجه به شرایط واقعی اجرا تکیه دارد.</p>
                <nav class="links" aria-label="پیوندهای رسمی">
                  <a href="https://zomorodmelal.ir/about/">درباره زمرد ملل</a>
                  <a href="https://zomorodmelal.ir/en/authors/mojtaba-rozegar/" hreflang="en">English profile</a>
                  <a href="https://mojplaywin.com/mojtaba.roozegar/">وب‌سایت شخصی</a>
                </nav>
              </div>
            </section>
            <footer>این صفحه، پروفایل معرفی و نویسندگی مجتبی روزگار در وب‌سایت زمرد ملل است.</footer>
          </main>
          </body>
          </html>
          HTML
          python3 - "$RUNNER_TEMP/mojtaba-author.html" <<'PY'
          import json,sys
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path(sys.argv[1]);html=p.read_text(encoding="utf-8")
          class Check(HTMLParser):
              def __init__(self):super().__init__();self.title=False;self.text=[];self.img=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=="title":self.title=True
                  if t=="img":self.img.append(d)
              def handle_endtag(self,t):
                  if t=="title":self.title=False
              def handle_data(self,d):
                  if self.title:self.text.append(d)
          q=Check();q.feed(html)
          assert "".join(q.text)=="مجتبی روزگار | Mojtaba Roozegar | زمرد ملل"
          assert len(q.img)==1 and len(q.img[0].get("alt",""))>15
          schema=html.split('<script type="application/ld+json">',1)[1].split('</script>',1)[0]
          ld=json.loads(schema)
          assert ld["@type"]=="ProfilePage" and ld["mainEntity"]["name"]=="مجتبی روزگار"
          assert set(ld["mainEntity"]["alternateName"])=={"Mojtaba Roozegar","Mojtaba Rozegar","روزگار","Roozegar","Rozegar"}
          print("PERSIAN_AUTHOR_PROFILE_HTML=validated")
          PY
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 25 https://zomorodmelal.ir/authors/mojtaba-rozegar/ || true)"
          test "$code" = 404
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 25 https://zomorodmelal.ir/en/authors/mojtaba-rozegar/ || true)"
          test "$code" = 200
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 25 https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp || true)"
          test "$code" = 200
          echo "STALE_PERSIAN_AUTHOR_URL=404_ENGLISH_PROFILE=200_OWNER_PHOTO=200"
      - name: Configure pinned VPS relay and cPanel identity
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-author"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_SAEIT_RELAY_VERIFIED=yes"
      - name: Enrich the indexed English author profile and redirect the broken Persian route
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-author"
          sha="$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$sha" <<'REMOTE'
          set -euo pipefail
          backup="$HOME/.backups/zomorod-persian-author/$1"
          test ! -e "$backup"
          mkdir -p "$backup/stage"
          chmod 700 "$backup" "$backup/stage"
          REMOTE
          scp -F "$d/config" "$RUNNER_TEMP/mojtaba-author.html" "saeit-cpanel:/home/zomorod2/.backups/zomorod-persian-author/$sha/stage/profile.html"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$sha" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          web="$HOME/public_html"
          profile="$web/en/authors/mojtaba-rozegar/index.html"
          root_htaccess="$web/.htaccess"
          backup="$HOME/.backups/zomorod-persian-author/$sha"
          source="$backup/stage/profile.html"
          test -s "$source" && test -s "$profile" && test -s "$root_htaccess" && test -s "$web/index.html"
          test ! -L "$web" && test ! -L "$profile" && test ! -L "$root_htaccess" && test ! -L "$web/index.html"
          test ! -e "$backup/profile.original.html" && test ! -e "$backup/htaccess.original"
          cp -p "$profile" "$backup/profile.original.html"
          cp -p "$root_htaccess" "$backup/htaccess.original"
          sha256sum "$web/index.html" > "$backup/protected.root-index.sha256"
          profile_installed=0
          htaccess_installed=0
          expected_profile=""
          expected_htaccess=""
          rollback() {
            rc=$?
            trap - EXIT
            set +e
            if test "$profile_installed" = 1 && test -f "$profile" && test "$(sha256sum "$profile" | cut -d' ' -f1)" = "$expected_profile"; then
              cp -p "$backup/profile.original.html" "$profile.rollback.$sha" && mv -f "$profile.rollback.$sha" "$profile"
            fi
            if test "$htaccess_installed" = 1 && test -f "$root_htaccess" && test "$(sha256sum "$root_htaccess" | cut -d' ' -f1)" = "$expected_htaccess"; then
              cp -p "$backup/htaccess.original" "$root_htaccess.rollback.$sha" && mv -f "$root_htaccess.rollback.$sha" "$root_htaccess"
            fi
            exit "$rc"
          }
          trap rollback EXIT
          python3 - "$source" "$profile" "$sha" <<'PY'
          from pathlib import Path
          import json,re,sys
          source=Path(sys.argv[1]).read_text(encoding="utf-8")
          target=Path(sys.argv[2])
          original=target.read_text(encoding="utf-8")
          english="https://zomorodmelal.ir/en/authors/mojtaba-rozegar/"
          image="https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp"
          assert original.count("</body>")==1 and original.count("</head>")==1
          assert re.search(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']'+re.escape(english)+r'["\']',original,re.I)
          assert "application/ld+json" not in original
          marker='id="mojtaba-roozegar-official-profile-20261021"'
          assert marker not in original
          ld={
            "@context":"https://schema.org","@type":"ProfilePage","url":english,
            "name":"Mojtaba Roozegar (Mojtaba Rozegar) | Zomorod Melal","inLanguage":"en",
            "mainEntity":{
              "@type":"Person","@id":english+"#person","name":"Mojtaba Roozegar",
              "alternateName":["Mojtaba Roozegar","Mojtaba Rozegar","مجتبی روزگار","روزگار","Roozegar","Rozegar"],
              "url":english,"image":image,
              "description":"Mojtaba Roozegar (also written Mojtaba Rozegar), researcher and chief executive of Zomorod Melal Agricultural and Industrial Company.",
              "jobTitle":["Researcher","Chief Executive Officer"],
              "worksFor":{"@type":"Organization","name":"Zomorod Melal Agricultural and Industrial Company","url":"https://zomorodmelal.ir/"},
              "sameAs":["https://mojplaywin.com/mojtaba.roozegar/","https://zomorodmelal.ir/about/"]
            }
          }
          schema='<script type="application/ld+json">'+json.dumps(ld,ensure_ascii=False,separators=(",",":"))+'</script>'
          def set_meta(html,attr,value,tag):
              pat=re.compile(r'<meta\b(?=[^>]*\b'+attr+r'\s*=\s*["\']'+re.escape(value)+r'["\'])[^>]*>',re.I)
              found=list(pat.finditer(html))
              if len(found)>1: raise ValueError("duplicate metadata: "+value)
              if found:
                  m=found[0];return html[:m.start()]+tag+html[m.end():]
              return html.replace("</head>",tag+"\n</head>",1)
          html=original
          title=re.compile(r'<title\b[^>]*>[\s\S]*?</title>',re.I)
          assert len(title.findall(html))==1
          html=title.sub("<title>Mojtaba Roozegar (Mojtaba Rozegar) | Zomorod Melal</title>",html,count=1)
          metas=[
            ("name","description",'<meta name="description" content="Official profile of Mojtaba Roozegar (Mojtaba Rozegar), researcher and CEO of Zomorod Melal; also known as مجتبی روزگار, Roozegar and Rozegar.">'),
            ("property","og:title",'<meta property="og:title" content="Mojtaba Roozegar (Mojtaba Rozegar) | Zomorod Melal">'),
            ("property","og:description",'<meta property="og:description" content="Official profile of Mojtaba Roozegar (Mojtaba Rozegar), researcher and CEO of Zomorod Melal.">'),
            ("property","og:image",'<meta property="og:image" content="'+image+'">'),
            ("property","og:image:alt",'<meta property="og:image:alt" content="Mojtaba Roozegar, Mojtaba Rozegar (مجتبی روزگار), official profile photograph">'),
            ("name","twitter:card",'<meta name="twitter:card" content="summary_large_image">'),
            ("name","twitter:image",'<meta name="twitter:image" content="'+image+'">'),
          ]
          for attr,value,tag in metas: html=set_meta(html,attr,value,tag)
          html=html.replace("</head>",schema+"\n</head>",1)
          section="""<section id="mojtaba-roozegar-official-profile-20261021" class="mr-profile" aria-labelledby="mr-profile-title">
          <style>.mr-profile{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:28px;align-items:center;margin:36px 0;padding:24px;border:1px solid #c7a75b;border-radius:16px;background:#f7f4ed;color:#25251f}.mr-profile img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 28%;border-radius:12px}.mr-profile h1{margin:0 0 8px}.mr-profile .mr-alias{direction:ltr;text-align:left}.mr-profile a{margin-right:14px}@media(max-width:650px){.mr-profile{grid-template-columns:1fr}.mr-profile figure{max-width:280px;margin:auto}}</style>
          <figure><img src="IMAGE" alt="Mojtaba Roozegar, Mojtaba Rozegar (مجتبی روزگار), researcher and CEO of Zomorod Melal" width="500" height="620" loading="eager" fetchpriority="high" decoding="async"><figcaption>Official profile photograph of Mojtaba Roozegar</figcaption></figure>
          <div><p>Official author and leadership profile</p><h1 id="mr-profile-title">Mojtaba Roozegar</h1>
          <p class="mr-alias" lang="en">Mojtaba Roozegar · also written Mojtaba Rozegar</p>
          <p lang="fa" dir="rtl">مجتبی روزگار؛ محقق، پژوهشگر و مدیرعامل شرکت کشت و صنعت زمرد ملل.</p>
          <p>Mojtaba Roozegar (also spelled Mojtaba Rozegar, Roozegar or Rozegar) is a researcher and the chief executive of Zomorod Melal Agricultural and Industrial Company. His professional profile connects research and agricultural development with the company’s work.</p>
          <nav aria-label="Official profile links"><a href="https://zomorodmelal.ir/about/">About Zomorod Melal</a><a href="https://mojplaywin.com/mojtaba.roozegar/">Personal website</a></nav></div></section>""".replace("IMAGE",image)
          html=html.replace("</body>",section+"\n</body>",1)
          out=target.with_name(target.name+".seo-next."+sys.argv[3])
          out.write_text(html,encoding="utf-8");out.chmod(target.stat().st_mode&0o777);out.replace(target)
          print("ENGLISH_AUTHOR_PHOTO_BIO_SCHEMA=staged")
          PY
          profile_installed=1
          expected_profile="$(sha256sum "$profile" | cut -d' ' -f1)"
          python3 - "$root_htaccess" "$sha" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);raw=p.read_bytes()
          rule=b'RedirectMatch 301 ^/authors/mojtaba-rozegar/?$ https://zomorodmelal.ir/en/authors/mojtaba-rozegar/'
          assert rule not in raw
          tmp=p.with_name(p.name+".redirect-next."+sys.argv[2])
          tmp.write_bytes(rule+bytes([10])+raw);tmp.chmod(p.stat().st_mode&0o777);tmp.replace(p)
          print("PERSIAN_AUTHOR_301_STAGED=yes")
          PY
          htaccess_installed=1
          expected_htaccess="$(sha256sum "$root_htaccess" | cut -d' ' -f1)"
          origin_code="$(curl -k -sS --max-time 25 --resolve 'zomorodmelal.ir:443:127.0.0.1' -D "$backup/origin-headers.txt" -o "$backup/origin-redirect.body" -w '%{http_code}' "https://zomorodmelal.ir/authors/mojtaba-rozegar/?seo_verify=$sha" || true)"
          echo "PERSIAN_AUTHOR_ORIGIN_HTTP=$origin_code"
          test "$origin_code" = 301
          grep -iFq 'Location: https://zomorodmelal.ir/en/authors/mojtaba-rozegar/' "$backup/origin-headers.txt"
          dest_code="$(curl -k -sS --max-time 25 --resolve 'zomorodmelal.ir:443:127.0.0.1' -o "$backup/origin-profile.html" -w '%{http_code}' "https://zomorodmelal.ir/en/authors/mojtaba-rozegar/?seo_verify=$sha" || true)"
          echo "ENGLISH_AUTHOR_ORIGIN_HTTP=$dest_code"
          test "$dest_code" = 200
          for token in 'mojtaba-roozegar-official-profile-20261021' 'Mojtaba Roozegar' 'Mojtaba Rozegar' 'مجتبی روزگار' 'Roozegar' 'Rozegar' '"@type":"ProfilePage"';do grep -Fq "$token" "$backup/origin-profile.html";done
          imgcode="$(curl -sS -L --max-time 25 -o "$backup/live-photo.webp" -w '%{http_code}' "https://zomorodmelal.ir/static/site/zomorod-about/ceo-mojtaba-rozegar.webp?seo_verify=$sha" || true)"
          echo "PROFILE_IMAGE_HTTP=$imgcode"
          test "$imgcode" = 200
          test "$(sha256sum "$backup/live-photo.webp" | cut -d' ' -f1)" = "482cad022c1739a464d17f0e023c69fcd6971d72bc67881f8ec24218bd2d8e41"
          (cd "$web";sha256sum -c --status "$backup/protected.root-index.sha256")
          echo "ROOT_INDEX_UNCHANGED=yes"
          edge_code="$(curl -sS --max-time 25 -o "$backup/public-redirect.body" -w '%{http_code}' "https://zomorodmelal.ir/authors/mojtaba-rozegar/?seo_verify=$sha" || true)"
          echo "PERSIAN_AUTHOR_PUBLIC_EDGE_HTTP=$edge_code"
          if test "$edge_code" != 301 && test "$edge_code" != 404;then exit 1;fi
          trap - EXIT
          echo "PERSIAN_ROUTE_REDIRECT_AND_ENGLISH_PROFILE_ORIGIN=verified"
          echo "PHOTO_AND_SCHEMA=verified"
          echo "PUBLIC_EDGE_HTTP=$edge_code"
          echo "BACKUP=$backup"
          REMOTE
      - name: Remove short-lived SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-author" "$RUNNER_TEMP/mojtaba-author.html"
