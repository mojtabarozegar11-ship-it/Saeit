name: MojPlayWin publish new design to real root with automatic rollback
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-publish-main-root-atomic.yml"]
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-only-root-deploy
  cancel-in-progress: false
jobs:
  exact-root-only-cutover:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact canary source and candidate are committed in trusted repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_safe_root_rewrite.py
          grep -q 'EXPECTED = "4f261f4563494f7ba8e9947e3ebcaa915815b5ffc451ad7348f3620300a695fd"' scripts/mojplaywin_safe_root_rewrite.py
          grep -q 'PROD_NAME = "production-home-20261017.html"' scripts/mojplaywin_safe_root_rewrite.py
          grep -Fq 'RewriteCond %{REQUEST_URI} ^/$' scripts/mojplaywin_safe_root_rewrite.py
          grep -Fq 'RewriteRule ^.*$ /design-preview-20261017/' scripts/mojplaywin_safe_root_rewrite.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Record independent sites and core original pages before atomic root publication
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          paths=("/saman/" "/picm/login/" "/farnaz/" "/studio.Roham/" "/mojtaba.roozegar/" "/zahra%24%24/"
                 "/store/" "/games/" "/ai/" "/blockchain/" "/research/" "/company/" "/services/" "/knowledge/")
          : > "$RUNNER_TEMP/untouched-before.txt"
          for path in "${paths[@]}"; do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 14 "https://mojplaywin.com$path")
            printf '%s %s\n' "$path" "$status" >> "$RUNNER_TEMP/untouched-before.txt"
            case "$path" in /saman/|/picm/login/|/farnaz/|/studio.Roham/|/mojtaba.roozegar/|/zahra%24%24/)
              test "$status" = 200 || { echo "NO_GO_PROTECTED_SITE_NOT_HEALTHY_BEFORE"; exit 51; } ;;
            esac
          done
          before_root=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 'https://mojplaywin.com/')
          test "$before_root" = 200
          before_conf=$(timeout 30s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'sha256sum /home/zomorod2/mojplaywin.com/.htaccess' | cut -d' ' -f1)
          test "$before_conf" = 4f261f4563494f7ba8e9947e3ebcaa915815b5ffc451ad7348f3620300a695fd
          echo "BASELINE_ORIGINAL_14_ROUTES_AND_HTACCESS_VERIFIED"
      - name: Atomic root-only cutover, live acceptance, commit or guaranteed rollback
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          armed=no
          cleanup() {
            if test "$armed" = yes; then
              echo "FAIL_SAFE: restoring original main-root rewrite configuration"
              timeout 40s ssh -T -F "$d/config" saeit-cpanel 'python3 - rollback' < scripts/mojplaywin_safe_root_rewrite.py || echo "WATCHDOG_FALLBACK_WILL_ROLL_BACK_WITHIN_120_SECONDS"
            fi
          }
          trap cleanup EXIT
          timeout 40s ssh -T -F "$d/config" saeit-cpanel 'python3 - root' < scripts/mojplaywin_safe_root_rewrite.py
          armed=yes
          python3 - <<'PY'
          import re,json,urllib.request
          from html.parser import HTMLParser
          root="https://mojplaywin.com/"
          q=root+"?__mpw_root_acceptance=20261017"
          def read(url,limit=400000,timeout=22):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"Cache-Control":"no-cache",
                       "User-Agent":"MojPlayWin-independent-root-release-check"}),timeout=timeout) as resp:
                  if resp.status!=200:raise RuntimeError("unexpected HTTP status")
                  data=resp.read(limit+1)
                  if len(data)>limit:raise RuntimeError("response too large")
                  return data
          html=read(q,400000).decode("utf-8")
          checks={
              "exact_root_marker":"MJWP_ROOT_CANDIDATE_ONLY_20261017" in html,
              "brand_present":"MojPlay" in html,
              "three_carousels":html.count('class="mpo-ring"')==3,
              "all_eighteen_cards":html.count('class="mpo-orbit-card"')==18,
              "moving_globe":'data-globe-orbit="continuous"' in html,
              "same_domain_canonical":'href="https://mojplaywin.com/"' in html,
              "no_preview_noindex":"noindex,nofollow,noarchive" not in html,
              "same_site_static_assets":"/design-preview-20261017/static/" in html,
              "no_preview_links":'href="store.html"' not in html,
              "all_guides_preserved":html.count('id="home-guide-')==10,
              "site_directory":'id="site-directory"' in html,
              "no_password_form":'<form ' not in html
          }
          if not all(checks.values()):
              print(json.dumps({"ROOT_RELEASE_ACCEPTANCE_FAIL":checks},sort_keys=True))
              raise RuntimeError("Main-root content acceptance failed")
          imgs=re.findall(r'(?:src|href)="(/design-preview-20261017/static/[^"]+)"',html)
          required=[x for x in imgs if ("global-technology-orbit" in x and x.endswith(".svg")) or
                                        ("globe-orbit." in x and x.endswith(".js"))]
          if len(required)!=2:raise RuntimeError("orbital assets missing from HTML")
          for path in required:read(root.rstrip("/")+path,150000)
          print(json.dumps({"ROOT_RENDER_ACCEPTED":checks,"verified_orbit_assets":len(required)},sort_keys=True))
          PY
          : > "$RUNNER_TEMP/untouched-after.txt"
          paths=("/saman/" "/picm/login/" "/farnaz/" "/studio.Roham/" "/mojtaba.roozegar/" "/zahra%24%24/"
                 "/store/" "/games/" "/ai/" "/blockchain/" "/research/" "/company/" "/services/" "/knowledge/")
          for path in "${paths[@]}"; do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 14 "https://mojplaywin.com$path")
            printf '%s %s\n' "$path" "$status" >> "$RUNNER_TEMP/untouched-after.txt"
          done
          cmp "$RUNNER_TEMP/untouched-before.txt" "$RUNNER_TEMP/untouched-after.txt" || {
            echo "NO_GO_OTHER_SITE_OR_DEEP_ROUTE_STATUS_CHANGE"
            exit 61
          }
          timeout 40s ssh -T -F "$d/config" saeit-cpanel 'python3 - commit' < scripts/mojplaywin_safe_root_rewrite.py
          armed=no
          echo "LIVE_ROOT_NEW_THEME_PUBLISHED_ALL_PROTECTED_URLS_UNCHANGED"
          {
            echo "## MojPlayWin main homepage published"
            echo "- https://mojplaywin.com/ — original domain root now presents approved original template."
            echo "- Entire 22-page preview remains available separately. Deep dynamic pages untouched."
            echo "- Atomic and exactly matched .htaccess rewrite. Shared Passenger never restarted."
            echo "- All 14 previously protected/deep URL statuses unchanged."
            echo "- Private original .htaccess retained as reversible backup."
          } >> "$GITHUB_STEP_SUMMARY"
