name: MojPlayWin exact About static publication with atomic rollback
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-about-exact-static-release-20261018.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  publish-about-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-mpw-about-static-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated builder and reversible exact-route helper
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_about_isolated_static_builder_20261018.py scripts/mojplaywin_about_exact_route_20261018.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import mojplaywin_about_exact_route_20261018 as m
          assert m.RULE.startswith('# MPW_EXACT_ABOUT')
          assert '^/about/$' in m.RULE and '^about/$' in m.RULE
          assert '[END,QSD]' in m.RULE
          for name in ('/store/','/about/mojtaba-rozegar/','/picm/','/farnaz/','/saman/'):
            assert name not in m.RULE
          print('MPW_EXACT_ROUTE_SOURCE_TEST=PASS')
          PY
      - name: Fetch precisely pinned editorial edition (never merge shared Django)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/feature/mojplaywin-complete-about-20261018
          test "$(git rev-parse FETCH_HEAD)" = "cc01cfe28f22cd1c9ff8407ad856127079e5899e"
          mkdir -p "$RUNNER_TEMP/mpw-about-source"
          for f in about.html about_research_dossier.html about_complementary_portfolio.html theme.html; do
            git show "FETCH_HEAD:core/templates/mojplaywin/$f" > "$RUNNER_TEMP/mpw-about-source/$f"
          done
          grep -q 'COMPLEMENTARY SPECIALISM 30' "$RUNNER_TEMP/mpw-about-source/about_complementary_portfolio.html"
          grep -q 'SPECIALISM 28' "$RUNNER_TEMP/mpw-about-source/about_research_dossier.html"
      - name: Snapshot HTTP health of all known protected root and child paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          routes=[
            "https://mojplaywin.com/","https://mojplaywin.com/store/",
            "https://mojplaywin.com/about/mojtaba-rozegar/",
            "https://mojplaywin.com/mojtaba.roozegar/",
            "https://mojplaywin.com/mojtaba.roozegar/about/",
            "https://mojplaywin.com/farnaz/","https://mojplaywin.com/saman/",
            "https://mojplaywin.com/picm/","https://zomorodmelal.ir/"]
          result={}
          for url in routes:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"MPWAboutReleaseHealth/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=17) as r:
                status=r.status;content_type=r.headers.get('Content-Type','')
            except urllib.error.HTTPError as e:
              status=e.code;content_type=e.headers.get('Content-Type','')
            except Exception as e:
              raise SystemExit("BASELINE_NO_GO network error for "+url+": "+type(e).__name__)
            result[url]={"status":status,"content_type":content_type}
            print("BASELINE_ROUTE="+url+" "+str(status))
          for url in ("https://mojplaywin.com/","https://mojplaywin.com/store/","https://mojplaywin.com/mojtaba.roozegar/","https://mojplaywin.com/farnaz/"):
            if result[url]["status"]!=200:raise SystemExit("BASELINE_NO_GO protected critical route not HTTP 200: "+url)
          with open(os.environ["RUNNER_TEMP"]+"/mpw-about-baseline.json","w") as f:json.dump(result,f)
          PY
      - name: Compose versioned About HTML without replacing legacy content
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mojplaywin_about_isolated_static_builder_20261018.py \
            --source-dir "$RUNNER_TEMP/mpw-about-source" \
            --output "$RUNNER_TEMP/complete-about-20261018.html"
          test "$(wc -c < "$RUNNER_TEMP/complete-about-20261018.html")" -gt 50000
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage only the additive About asset in private account home
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          scp -q -F "$d/config" "$RUNNER_TEMP/complete-about-20261018.html"             "saeit-cpanel:/home/zomorod2/.mpw-about-stage-$GITHUB_RUN_ID.html"
      - name: Commit exact /about/ GET rewrite atomically and preserve rollback
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          digest=$(sha256sum "$RUNNER_TEMP/complete-about-20261018.html" | awk '{print $1}')
          timeout 55s ssh -T -F "$d/config" saeit-cpanel             "python3 - install '$GITHUB_RUN_ID' '$digest'"             < scripts/mojplaywin_about_exact_route_20261018.py
      - name: Verify live About 58 chapters and unchanged protected paths
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base=json.load(open(os.environ["RUNNER_TEMP"]+"/mpw-about-baseline.json"))
          url="https://mojplaywin.com/about/"
          tested=False
          for attempt in range(1,5):
            try:
              req=urllib.request.Request(url+"?__mpw_full_about_live="+os.environ["GITHUB_RUN_ID"]+"-"+str(attempt),headers={"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"MPWAboutPostPublish/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                content=r.read(650000).decode("utf-8","replace");code=r.status
              hits=[m for m in ("MPW_ABOUT_RESEARCH_80_20_V1","SPECIALISM 28","COMPLEMENTARY SPECIALISM 30","Original by Default","Mojtaba Roozegar") if m in content]
              print("ABOUT_LIVE_ATTEMPT="+str(attempt)+" status="+str(code)+" markers="+str(len(hits)))
              if code==200 and len(hits)==5:
                tested=True;break
            except Exception as e:
              print("ABOUT_LIVE_RETRY="+type(e).__name__)
            time.sleep(3)
          if not tested:raise SystemExit("LIVE_ABOUT_NOT_VISIBLE: rollback required")
          for url,expected in base.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"MPWAboutReleaseHealth/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=19) as r:status=r.status
            except urllib.error.HTTPError as e:status=e.code
            except Exception as e:raise SystemExit("PROTECTED_UNREACHABLE "+url+" "+type(e).__name__)
            print("PROTECTED_AFTER="+url+" status="+str(status)+" before="+str(expected["status"]))
            if status!=expected["status"]:raise SystemExit("PROTECTED_PATH_CHANGED "+url)
          print("MPW_ABOUT_LIVE_PUBLICATION_VERIFIED=yes")
          PY
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel             "python3 - status '$GITHUB_RUN_ID'"             < scripts/mojplaywin_about_exact_route_20261018.py
      - name: Roll back exact About rewrite and additive file on smoke failure
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel             "python3 - rollback '$GITHUB_RUN_ID'"             < scripts/mojplaywin_about_exact_route_20261018.py
      - name: Remove only private temporary transfer file
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          if test -e "$d/config"; then
            ssh -T -F "$d/config" -o ConnectTimeout=10 saeit-cpanel               "test ! -L /home/zomorod2/.mpw-about-stage-$GITHUB_RUN_ID.html && rm -f -- /home/zomorod2/.mpw-about-stage-$GITHUB_RUN_ID.html" || true
          fi
