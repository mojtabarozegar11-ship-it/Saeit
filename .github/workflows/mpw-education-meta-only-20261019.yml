name: MojPlayWin education meta branding one-file correction
on:
  pull_request:
    paths:
      - "scripts/mpw_dynamic_main_shell_20261019.php"
      - "scripts/mpw_education_meta_hotfix_20261019.py"
      - ".github/workflows/mpw-education-meta-only-20261019.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mpw_dynamic_main_shell_20261019.php"
      - "scripts/mpw_education_meta_hotfix_20261019.py"
      - ".github/workflows/mpw-education-meta-only-20261019.yml"
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-dynamic-exact19-atomic
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Lint and selftest exact PHP presentation change
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_education_meta_hotfix_20261019.py
          python3 scripts/mpw_education_meta_hotfix_20261019.py selftest
          php -l scripts/mpw_dynamic_main_shell_20261019.php
          php scripts/mpw_dynamic_main_shell_20261019.php selftest
  release:
    needs: contract
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-mpw-edu-meta-20261019]')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check current main-only education branding and protected availability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          for path in ('/education/','/weather/','/store/','/farnaz/','/saman/','/picm/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=22) as r:
                  if r.status!=200:raise SystemExit('UNHEALTHY_BEFORE '+path)
              print('BASELINE_OK '+path,flush=True)
          PY
      - name: Set up pinned VPS and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-footer-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage one metadata-only PHP source outside public webroot
        run: |
          set -euo pipefail
          sha="$(sha256sum scripts/mpw_dynamic_main_shell_20261019.php | awk '{print $1}')"
          printf '%s' "$sha" > "$RUNNER_TEMP/mpw-edu-php-sha"
          timeout 45s sh -c 'cat scripts/mpw_dynamic_main_shell_20261019.php | ssh -T -F "$1" saeit-cpanel "umask 077; cat > /home/zomorod2/.mpw-main-shell-staging-$2.php"' -- "$RUNNER_TEMP/mpw-footer-inventory/config" "$GITHUB_RUN_ID"
      - name: Server PHP selftest and exact checksum preflight
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/mpw-footer-inventory/config"
          name="/home/zomorod2/.mpw-main-shell-staging-$GITHUB_RUN_ID.php"
          timeout 30s ssh -T -F "$cfg" saeit-cpanel "if command -v php >/dev/null 2>&1; then php -l '$name' && php '$name' selftest; else /opt/cpanel/ea-php82/root/usr/bin/php -l '$name' && /opt/cpanel/ea-php82/root/usr/bin/php '$name' selftest; fi"
          sum="$(cat "$RUNNER_TEMP/mpw-edu-php-sha")"
          timeout 40s ssh -T -F "$cfg" saeit-cpanel python3 - audit "$GITHUB_RUN_ID" "$sum" < scripts/mpw_education_meta_hotfix_20261019.py
      - name: Replace exactly one main-only PHP bridge atomically
        run: |
          set -euo pipefail
          sum="$(cat "$RUNNER_TEMP/mpw-edu-php-sha")"
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-footer-inventory/config" saeit-cpanel python3 - install "$GITHUB_RUN_ID" "$sum" < scripts/mpw_education_meta_hotfix_20261019.py
      - name: Verify updated education metadata and no other route regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re
          site='https://mojplaywin.com'
          for path in ('/education/','/weather/','/store/','/farnaz/','/saman/','/picm/'):
              with urllib.request.urlopen(urllib.request.Request(site+path,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'}),timeout=22) as r:
                  b=r.read(2300000).decode('utf8','replace')
                  if r.status!=200:raise SystemExit('POSTUPDATE_UNHEALTHY '+path)
                  if path=='/education/':
                      match=re.search(r'<meta\b(?=[^>]*name="description")[^>]*>',b,re.I)
                      if not match or 'MojPlayWin education' not in match.group(0) or 'Zomorodmelal' in match.group(0):
                          raise SystemExit('EDUCATION_DESCRIPTION_NOT_CORRECTED')
                  if path in ('/education/','/weather/','/store/') and r.headers.get('X-MPW-Main-Shell')!='exact-owner-only':
                      raise SystemExit('OWNER_SHELL_NOT_ACTIVE '+path)
                  if path in ('/farnaz/','/saman/','/picm/') and r.headers.get('X-MPW-Main-Shell'):
                      raise SystemExit('PROTECTED_CHILD_ROUTED_IN_ERROR '+path)
                  print('FINAL_ROUTE_OK '+path,flush=True)
          print('MPW_EDUCATION_META_FINAL_QA=PASS',flush=True)
          PY
      - name: Revert only scoped PHP file if verification fails
        if: failure()
        run: |
          cfg="$RUNNER_TEMP/mpw-footer-inventory/config"
          if test -s "$cfg" && test -f "$RUNNER_TEMP/mpw-edu-php-sha"; then
            timeout 50s ssh -T -F "$cfg" saeit-cpanel python3 - rollback "$GITHUB_RUN_ID" < scripts/mpw_education_meta_hotfix_20261019.py || true
          fi
      - name: Clear temporary credentials and PHP stage
        if: always()
        run: |
          cfg="$RUNNER_TEMP/mpw-footer-inventory/config"
          if test -s "$cfg"; then
            timeout 22s ssh -T -F "$cfg" saeit-cpanel "rm -f -- /home/zomorod2/.mpw-main-shell-staging-$GITHUB_RUN_ID.php" || true
          fi
          rm -rf -- "$RUNNER_TEMP/mpw-footer-inventory"
