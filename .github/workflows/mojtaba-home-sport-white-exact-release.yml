name: Mojtaba personal home sport and white photo cards only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojtaba-home-sport-white-exact-release.yml"]
permissions:
  contents: read
concurrency:
  group: mojtaba-v17-inner-pages-production
  cancel-in-progress: false
jobs:
  release-personal-home-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[approved-home-casual-white-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test screenshot-specific three-card replacement in isolation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mojtaba_personal_home_sport_white_only_20261018.py' -v
          python3 -m py_compile scripts/mojtaba_personal_home_sport_white_only_20261018.py
      - name: Protect existing public site routes before changes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          links=['https://mojplaywin.com/mojtaba.roozegar/','https://mojplaywin.com/mojtaba.roozegar/gallery/','https://mojplaywin.com/mojtaba.roozegar/about/','https://mojplaywin.com/mojtaba.roozegar/resume/','https://mojplaywin.com/','https://mojplaywin.com/store/','https://mojplaywin.com/about/','https://mojplaywin.com/farnaz/','https://mojplaywin.com/picm/','https://zomorodmelal.ir/']
          statuses={}
          for u in links:
            req=urllib.request.Request(u,headers={'User-Agent':'MojtabaSportWhiteBefore/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as res:
              code=res.status
              if u.endswith('/mojtaba.roozegar/'):
                body=res.read(350000).decode('utf-8','replace')
                if not all(x in body for x in ('New perspectives','Personal executive portrait','Executive close-up portrait','Four professional portrait views')):
                  raise SystemExit('SCREENSHOT_SOURCE_CHANGED_NO_GO')
            statuses[u]=code
            print('BEFORE_PERSONAL_HOME_CARD='+u+' '+str(code))
            if code!=200:raise SystemExit('BASELINE_NO_GO')
          with open(os.environ['RUNNER_TEMP']+'/personal_home_photo_baseline.json','w') as f:json.dump(statuses,f)
          PY
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"

      - name: Stage scoped editor in nonpublic personal account home
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-personal-sport-white-$GITHUB_RUN_ID"
          timeout 25s ssh -T -F "$SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 55s scp -q -F "$SSH_CONFIG" scripts/mojtaba_personal_home_sport_white_only_20261018.py "saeit-host:$stage/patch.py"
      - name: Atomically replace only the homepage photo section and preserve rollback
        id: install
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-personal-sport-white-$GITHUB_RUN_ID"
          timeout 55s ssh -T -F "$SSH_CONFIG" saeit-host "python3 '$stage/patch.py' install '$GITHUB_RUN_ID'"
      - name: Verify live casual, sport and white-shirt photo selection and protected routes
        run: |
          python3 - <<'PY'
          import json,urllib.request,os,time
          good=False
          for attempt in range(1,6):
            req=urllib.request.Request('https://mojplaywin.com/mojtaba.roozegar/?_photo_revision='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt),headers={'Cache-Control':'no-cache','User-Agent':'MojtabaSportWhiteAfter/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as res: page=res.read(500000).decode('utf-8','replace')
              good=(page.count('class="mpw-portrait-card')==3 and 'mpw-personal-home-sport-white-20261018' in page and all(x in page for x in ('Casual sport portrait','Outdoor sport-jacket portrait','White-shirt portrait')) and all(x not in page for x in ('Personal executive portrait','Executive close-up portrait','Four professional portrait views')))
              print('SPORT_WHITE_LIVE_CHECK='+str(attempt)+' '+str(good))
              if good:break
            except Exception as e:print('SPORT_WHITE_RETRY='+type(e).__name__)
            time.sleep(4)
          if not good:raise SystemExit('NEW_HOME_PHOTOS_NOT_VERIFIED')
          baseline=json.load(open(os.environ['RUNNER_TEMP']+'/personal_home_photo_baseline.json'))
          for url,expected in baseline.items():
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MojtabaSportWhiteAfter/1.0'})
            with urllib.request.urlopen(req,timeout=20) as res:code=res.status
            if code!=expected:raise SystemExit('PROTECTED_PATH_CHANGED '+url)
            print('AFTER_PERSONAL_HOME_CARD='+url+' '+str(code))
          print('PERSONAL_HOME_SPORT_WHITE_COMPLETE=yes')
          PY
      - name: Rollback only personal homepage template after failed health check
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-personal-sport-white-$GITHUB_RUN_ID"
          timeout 60s ssh -T -F "$SSH_CONFIG" saeit-host "python3 '$stage/patch.py' rollback '$GITHUB_RUN_ID'"
      - name: Remove private temporary code; retain recovery backup
        if: always()
        run: |
          stage="/home/zomorod2/.mpw-personal-sport-white-$GITHUB_RUN_ID"
          if test -f "$RUNNER_TEMP/photo-relay/config"; then
            ssh -T -F "$RUNNER_TEMP/photo-relay/config" saeit-host "test -d '$stage' && test ! -L '$stage' && rm -f '$stage/patch.py' && rmdir '$stage'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/photo-relay" || true
