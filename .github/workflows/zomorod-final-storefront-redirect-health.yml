name: Read only storefront redirect and protected path health check
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-final-storefront-redirect-health.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-final-shop-health
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Inspect storefront URL redirect and important protected site endpoints without mutation
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://mojplaywin.com/store/" "https://mojplaywin.com/farnaz/" "https://mojplaywin.com/mojtaba.roozegar/" "https://zomorodmelal.ir/tala/"; do
            result="$(curl --max-time 20 -sS -L --max-redirs 6 -o /dev/null -w '%{http_code} %{num_redirects} %{url_effective}' "$url" || true)"
            echo "PROTECTED_FINAL_REDIRECT=$url $result"
          done
      - name: Read-only current home and official quota before closing cleanup
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          test "$HOME" = /home/zomorod2
          du -sk -- "$HOME" | awk '{print "STORAGE_FINAL_DU_KB=" $1}'
          uapi --output=json Quota get_quota_info | python3 -c 'import json,sys; q=json.load(sys.stdin).get("result",{}).get("data",{});print("STORAGE_FINAL_CPANEL_MB="+str(q.get("megabytes_used")));print("STORAGE_LIMIT_MB="+str(q.get("megabyte_limit")))'
          test -f "$HOME/Saeit/manage.py"
          test -f "$HOME/Saeit/agent_imports/v91_genomes/generation64_dependency_manifest.json"
          test -f "$HOME/.backups/legacy-v91-source-20261018.tar.gz"
          test -d "$HOME/saeit_v91_runtime_stage_20261012"
          echo "CORE_AND_AGENT_FILES_PRESERVED=yes"
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
