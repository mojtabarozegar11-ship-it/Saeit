name: VPS SQLite offsite restore proof to cPanel
on:
  push:
    branches: [main]
    paths: [".github/workflows/vps-sqlite-offsite-restore-proof-20261107.yml"]
permissions:
  contents: read
concurrency:
  group: vps-sqlite-offsite-restore-proof-20261107
  cancel-in-progress: false
jobs:
  restore-proof:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Prepare pinned VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/sqlite-restore-proof"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "PINNED_RELAY=verified"
      - name: Copy one verified SQLite backup to isolated cPanel staging and prove restore
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/sqlite-restore-proof"
          src="/home/githubops/factory-runtime/operations/backups/master-before-20261105T210434Z.sqlite3"
          dst="/home/zomorod2/restore-staging/factory/master-before-20261105T210434Z.sqlite3"
          # Never overwrite a previous interrupted transfer. A host-level df
          # is not the same as the cPanel account quota; require BOTH gates.
          ssh -F "$d/config" saeit-vps "test -f '$src'; stat -c 'SOURCE_BYTES=%s SOURCE_MTIME=%Y' '$src'"
          source_bytes="$(ssh -F "$d/config" saeit-vps "stat -c %s '$src'")"
          [[ "$source_bytes" =~ ^[0-9]+$ ]]
          ssh -T -F "$d/config" saeit-cpanel "python3 - '$source_bytes'" <<'PY'
          import json, os, shutil, stat, subprocess, sys
          from pathlib import Path
          source_bytes = int(sys.argv[1])
          home = Path("/home/zomorod2")
          destination = home/"restore-staging/factory/master-before-20261105T210434Z.sqlite3"
          if source_bytes <= 0 or home.is_symlink() or not home.is_dir():
              raise SystemExit("RESTORE_PREFLIGHT_INVALID_SOURCE_OR_HOME")
          for ancestor in (destination.parent, destination.parent.parent):
              if ancestor.is_symlink():
                  raise SystemExit("RESTORE_PREFLIGHT_SYMLINK_PARENT")
          if os.path.lexists(destination):
              info = destination.lstat()
              print("CPANEL_RESTORE_DESTINATION_ALREADY_PRESENT=1", flush=True)
              print("CPANEL_RESTORE_DESTINATION_BYTES="+str(info.st_size), flush=True)
              raise SystemExit("RESTORE_PREFLIGHT_EXISTING_PARTIAL_REVIEW_REQUIRED")
          fs = os.statvfs(home)
          filesystem_free = fs.f_bavail * fs.f_frsize
          required_fs_free = source_bytes + 2 * 1024**3
          print("CPANEL_FILESYSTEM_FREE_BYTES="+str(filesystem_free), flush=True)
          if filesystem_free < required_fs_free:
              raise SystemExit("RESTORE_PREFLIGHT_FILESYSTEM_SPACE_INSUFFICIENT")
          # cPanel account quotas are not reliably reflected in statvfs/df.
          cpapi2 = shutil.which("cpapi2")
          if cpapi2 is None and Path("/usr/local/cpanel/bin/cpapi2").is_file():
              cpapi2 = "/usr/local/cpanel/bin/cpapi2"
          if not cpapi2:
              raise SystemExit("RESTORE_PREFLIGHT_ACCOUNT_QUOTA_UNAVAILABLE")
          result = subprocess.run(
              [cpapi2, "--user=zomorod2", "DiskUsage", "fetchdiskusagewithextras"],
              capture_output=True, text=True, timeout=40, check=False,
          )
          if result.returncode != 0:
              raise SystemExit("RESTORE_PREFLIGHT_ACCOUNT_QUOTA_QUERY_FAILED")
          try:
              payload = json.loads(result.stdout)
              info = payload["cpanelresult"]["data"][0]
              quota_used = int(info["quotaused"])
              quota_limit = info["quotalimit"]
          except (ValueError, TypeError, KeyError, IndexError) as exc:
              raise SystemExit("RESTORE_PREFLIGHT_ACCOUNT_QUOTA_UNPARSEABLE") from exc
          if quota_limit in (None, "", "unlimited"):
              print("CPANEL_ACCOUNT_QUOTA_UNLIMITED=1", flush=True)
          else:
              try:
                  limit = int(quota_limit)
              except (ValueError, TypeError) as exc:
                  raise SystemExit("RESTORE_PREFLIGHT_ACCOUNT_QUOTA_INVALID") from exc
              account_free = limit - quota_used
              print("CPANEL_ACCOUNT_FREE_BYTES="+str(account_free), flush=True)
              if limit <= 0 or quota_used < 0 or account_free < source_bytes + 1024**3:
                  raise SystemExit("RESTORE_PREFLIGHT_ACCOUNT_QUOTA_INSUFFICIENT")
          print("CPANEL_RESTORE_PREFLIGHT_PASSED=1", flush=True)
          PY
          ssh -F "$d/config" saeit-cpanel "install -d -m 700 /home/zomorod2/restore-staging/factory; test ! -e '$dst'; test ! -L '$dst'"
          timeout 780s bash -o pipefail -c "ssh -F '$d/config' saeit-vps 'cat -- "$src"' | ssh -F '$d/config' saeit-cpanel 'umask 077; cat > "$dst"'"
          ssh -F "$d/config" saeit-vps "sha256sum '$src'"
          ssh -F "$d/config" saeit-cpanel "sha256sum '$dst'; stat -c 'RESTORED_BYTES=%s' '$dst'"
          src_hash="$(ssh -F "$d/config" saeit-vps "sha256sum '$src' | awk '{print \$1}'")"
          dst_hash="$(ssh -F "$d/config" saeit-cpanel "sha256sum '$dst' | awk '{print \$1}'")"
          test "$src_hash" = "$dst_hash"
          echo "RESTORE_TRANSFER_HASH_MATCH=1"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import sqlite3
          from pathlib import Path
          path=Path("/home/zomorod2/restore-staging/factory/master-before-20261105T210434Z.sqlite3")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("RESTORE_TARGET_UNSAFE")
          conn=sqlite3.connect("file:"+str(path)+"?mode=ro",uri=True,timeout=90)
          result=conn.execute("PRAGMA quick_check").fetchone()[0]
          integrity=conn.execute("PRAGMA integrity_check").fetchone()[0]
          page_count=conn.execute("PRAGMA page_count").fetchone()[0]
          conn.close()
          print("RESTORE_CPanel_QUICK_CHECK="+str(result),flush=True)
          print("RESTORE_CPanel_INTEGRITY_CHECK="+str(integrity),flush=True)
          print("RESTORE_CPanel_PAGE_COUNT="+str(page_count),flush=True)
          if result!="ok" or integrity!="ok": raise SystemExit("RESTORE_PROOF_FAILED")
          PY
          echo "OFFSITE_FUNCTIONAL_RESTORE_VERIFIED=1"
          echo "PRODUCTION_FILES_CHANGED=0"
          echo "VPS_BACKUPS_DELETED=0"
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/sqlite-restore-proof"
          if test -d "$d"; then rm -rf -- "$d"; fi
