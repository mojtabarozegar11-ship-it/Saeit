name: VPS SQLite offsite restore proof to cPanel
on:
  push:
    branches: [main]
    paths: [".github/workflows/vps-sqlite-offsite-restore-proof-20261107.yml"]
permissions:
  contents: read
concurrency:
  group: vps-sqlite-offsite-restore-proof-20261107
  cancel-in-progress: false
jobs:
  restore-proof:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare pinned VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/sqlite-restore-proof"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "PINNED_RELAY=verified"
      - name: Copy one verified SQLite backup to isolated cPanel staging and prove restore
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/sqlite-restore-proof"
          src="/home/githubops/factory-runtime/operations/backups/master-before-20261105T210434Z.sqlite3"
          dst="/home/zomorod2/restore-staging/factory/master-before-20261105T210434Z.sqlite3"
          ssh -F "$d/config" saeit-vps "test -f '$src'; stat -c 'SOURCE_BYTES=%s SOURCE_MTIME=%Y' '$src'"
          ssh -F "$d/config" saeit-cpanel "install -d -m 700 /home/zomorod2/restore-staging/factory; rm -f -- '$dst'"
          timeout 780s bash -o pipefail -c "ssh -F '$d/config' saeit-vps 'cat -- "$src"' | ssh -F '$d/config' saeit-cpanel 'umask 077; cat > "$dst"'"
          ssh -F "$d/config" saeit-vps "sha256sum '$src'"
          ssh -F "$d/config" saeit-cpanel "sha256sum '$dst'; stat -c 'RESTORED_BYTES=%s' '$dst'"
          src_hash="$(ssh -F "$d/config" saeit-vps "sha256sum '$src' | awk '{print \$1}'")"
          dst_hash="$(ssh -F "$d/config" saeit-cpanel "sha256sum '$dst' | awk '{print \$1}'")"
          test "$src_hash" = "$dst_hash"
          echo "RESTORE_TRANSFER_HASH_MATCH=1"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import sqlite3
          from pathlib import Path
          path=Path("/home/zomorod2/restore-staging/factory/master-before-20261105T210434Z.sqlite3")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("RESTORE_TARGET_UNSAFE")
          conn=sqlite3.connect("file:"+str(path)+"?mode=ro",uri=True,timeout=90)
          result=conn.execute("PRAGMA quick_check").fetchone()[0]
          integrity=conn.execute("PRAGMA integrity_check").fetchone()[0]
          page_count=conn.execute("PRAGMA page_count").fetchone()[0]
          conn.close()
          print("RESTORE_CPanel_QUICK_CHECK="+str(result),flush=True)
          print("RESTORE_CPanel_INTEGRITY_CHECK="+str(integrity),flush=True)
          print("RESTORE_CPanel_PAGE_COUNT="+str(page_count),flush=True)
          if result!="ok" or integrity!="ok": raise SystemExit("RESTORE_PROOF_FAILED")
          PY
          echo "OFFSITE_FUNCTIONAL_RESTORE_VERIFIED=1"
          echo "PRODUCTION_FILES_CHANGED=0"
          echo "VPS_BACKUPS_DELETED=0"
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/sqlite-restore-proof"
          if test -d "$d"; then rm -rf -- "$d"; fi
