name: Mojtaba VPS AppArmor and cgroup host policy — owner read-only

# No push, PR, schedule, or generic dispatch: one exact owner comment on
# the dedicated production blocker issue can invoke this audit.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: mojtaba-vps-host-policy-owner-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 2869 &&
      !github.event.issue.pull_request &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'MOJTABA-VPS-HOST-POLICY-READONLY-20261122'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Checkout trusted reviewed code without stored token
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm immutable audit source and parse contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object -- deploy/mojtaba_vps_host_policy_readonly_20261122.py)" = "2a3ce542c64fd2d5bfe38d7bb4522e15d08bdf69"
          python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("deploy/mojtaba_vps_host_policy_readonly_20261122.py").read_text(encoding="utf-8"))'
          echo "MOJTABA_VPS_SECURITY_AUDITOR_PIN=verified"

      - name: Read only VPS prerequisites through existing pinned SSH loopback
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${VPS_KEY:-}" ]]; then
            echo "::error::Existing scoped VPS SSH key not available; no fallback"
            exit 1
          fi
          d="$(mktemp -d "$RUNNER_TEMP/mojtaba-vps-host-policy.XXXXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; v=sys.stdin.read(); print(v.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          if ! ssh-keygen -y -P '' -f "$d/key" >/dev/null 2>&1; then
            echo "::error::Existing SSH key is invalid; no auth fallback"
            exit 1
          fi
          if ! timeout 12s ssh-keyscan -T 7 -p 22 -t rsa 127.0.0.1 > "$d/known" 2>"$d/scan.err"; then
            echo "::error::Existing VPS loopback SSH endpoint unavailable"
            exit 1
          fi
          actual="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"
          if [[ "$actual" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" ]]; then
            echo "::error::Pinned VPS host identity mismatch; connection refused"
            exit 1
          fi
          echo "MOJTABA_VPS_EXISTING_SSH_IDENTITY=verified"
          if ! timeout 55s ssh -T -i "$d/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" \
            -o ConnectTimeout=9 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -p 22 githubops@127.0.0.1 \
            'test "$(id -un)" = githubops && exec python3 -B -' \
            < deploy/mojtaba_vps_host_policy_readonly_20261122.py \
            > "$d/result" 2>"$d/ssh.err"; then
            echo "::error::VPS read-only SSH command failed; no fallback"
            exit 1
          fi
          python3 - "$d/result" <<'PY'
          import json,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          prefix="MOJTABA_VPS_HOST_POLICY_READONLY="
          assert len(lines)==1 and lines[0].startswith(prefix), "Invalid sanitized receipt"
          result=json.loads(lines[0][len(prefix):])
          assert result["schema"]=="mojtaba.bot.ai.vps-host-policy.readonly.v1"
          assert result["read_only"] is True
          assert result["rootless_networkless_sandbox_attested"] is False
          assert result["host_secrets_hidden_attested"] is False
          assert result["worker_started_or_changed"] is False
          assert result["package_installed_or_config_changed"] is False
          assert set(result["bwrap_trusted_paths"]) == {
            "/usr/bin/bwrap", "/usr/local/bin/bwrap", "/bin/bwrap"
          }
          assert set(result["kernel"]) == {
            "max_user_namespaces", "unprivileged_userns_clone",
            "apparmor_restrict_unprivileged_userns"
          }
          assert set(result["cgroup"]) == {
            "cgroup_v2_root_present", "current_v2_path_valid",
            "cpu_max", "memory_max", "pids_max", "memory_current_mib"
          }
          # The reporter holds no path names, credentials or untrusted data.
          safe={
            "schema":result["schema"],
            "os_release":result["os_release"],
            "kernel":result["kernel"],
            "apparmor_profile_attached":result["apparmor_profile_attached"],
            "bwrap_trusted_paths":result["bwrap_trusted_paths"],
            "cgroup":result["cgroup"],
            "rootless_networkless_sandbox_attested":False,
            "host_secrets_hidden_attested":False,
            "worker_started_or_changed":False,
            "package_installed_or_config_changed":False,
          }
          print("MOJTABA_VPS_HOST_POLICY_SAFE_SUMMARY="+json.dumps(safe,sort_keys=True))
          PY
