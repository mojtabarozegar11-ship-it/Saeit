name: Moj messaging - no-card edge route reachability (read only)
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths: ['.github/workflows/moj-messaging-free-edge-route-probe-20261028.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check Cloudflare and Render TLS paths from VPS, without changing network
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$(mktemp -d "$RUNNER_TEMP/mmsg-edge-probe.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          timeout 80s ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10 githubops@178.239.147.150 'python3 -' <<'PY'
          import socket,ssl,ipaddress
          hosts=[('workers.dev','WORKERS_DEV'),('www.cloudflare.com','CLOUDFLARE'),('render.com','RENDER'),('github.com','GITHUB')]
          for host,label in hosts:
              try:
                  info=socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_STREAM)
                  ips=list(dict.fromkeys(x[4][0] for x in info if ipaddress.ip_address(x[4][0]).is_global))
                  print('MMSG_EDGE_'+label+'_DNS='+('PUBLIC' if ips else 'NO_PUBLIC_IP'),flush=True)
              except Exception as exc:
                  print('MMSG_EDGE_'+label+'_DNS='+type(exc).__name__,flush=True)
                  continue
              good=False
              for ip in ips[:2]:
                  try:
                      with socket.create_connection((ip,443),timeout=6) as raw:
                          with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                              print('MMSG_EDGE_'+label+'_TLS=PASS_'+str(tls.version()),flush=True)
                              good=True
                              break
                  except Exception as exc:
                      print('MMSG_EDGE_'+label+'_TLS=FAIL_'+type(exc).__name__,flush=True)
              if not good: print('MMSG_EDGE_'+label+'_REACHABLE=NO',flush=True)
          print('MMSG_VPS_AND_ACCOUNT_STATE_UNCHANGED=PASS',flush=True)
          PY
