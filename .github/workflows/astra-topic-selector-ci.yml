name: Astra Topic Selector Quality Gate

on:
  push:
    branches:
      - feature/astra-topic-selection-quality-gate-20261015
      - feature/astra-factory-v2-architecture-20261014
    paths:
      - scripts/astra_opportunity_selector.py
      - tests/test_astra_opportunity_selector.py
      - .github/workflows/astra-topic-selector-ci.yml
  pull_request:
    branches:
      - feature/astra-factory-v2-architecture-20261014
    paths:
      - scripts/astra_opportunity_selector.py
      - tests/test_astra_opportunity_selector.py
      - .github/workflows/astra-topic-selector-ci.yml

permissions:
  contents: read

jobs:
  selector-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify selector syntax
        run: python -m py_compile scripts/astra_opportunity_selector.py tests/test_astra_opportunity_selector.py
      - name: Run research priority and evidence gate regressions
        run: python -m unittest discover -s tests -p 'test_astra_opportunity_selector.py' -v
