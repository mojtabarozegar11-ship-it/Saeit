name: MojPlayWin crypto installed file identity (READ ONLY)
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths: [.github/workflows/mojplaywin-crypto-live-version-readonly.yml]
permissions:
  contents: read
jobs:
  identify:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"


      - name: Check current payment route fingerprint versus Git history
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          livefile=/home/zomorod2/mojplaywin.com/checkout/crypto/index.php
          remote_sha="$(timeout 30s ssh -T -F "$d/config" saeit-cpanel "test -f '$livefile' && test ! -L '$livefile' && sha256sum '$livefile' | cut -d' ' -f1")"
          echo "LIVE_GATEWAY_SHA256=$remote_sha"
          match=""
          for commit in $(git log --format=%H -n 60 -- isolated_crypto_gateway/index.php); do
            digest="$(git show "$commit:isolated_crypto_gateway/index.php" | sha256sum | cut -d' ' -f1)"
            if [ "$digest" = "$remote_sha" ]; then
              match="${commit:0:14}"
              break
            fi
          done
          echo "LIVE_GATEWAY_MATCHES_REPO_COMMIT=${match:-unrecognized}"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "php -l '$livefile' && php '/home/zomorod2/mojplaywin.com/checkout/crypto/bootstrap.php' status && test -f '/home/zomorod2/.mojplaywin-crypto-payments-v1/payments.sqlite3' && echo PRIVATE_DB_PRESENT=true"
          echo "LIVE_GATEWAY_CONTENT_WAS_NOT_READ_INTO_CI=true"
          echo "PRODUCTION_FILES_CHANGED=false"
