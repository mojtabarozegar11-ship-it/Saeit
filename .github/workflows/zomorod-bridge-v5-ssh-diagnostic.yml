name: Zomorod SSH relay stage-specific read-only diagnosis
on:
  push:
    branches: [feature/zomorod-command-bridge-v5-private-e2e-20261029]
    paths: [".github/workflows/zomorod-bridge-v5-ssh-diagnostic.yml"]
permissions:
  contents: read
jobs:
  relay-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Diagnose SSH secrets, pinned hosts and reachability with no production changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-ssh-diagnostic"
          mkdir -m 700 "$d"
          trap 'rm -rf "$d"' EXIT
          refuse(){ echo "SSH_RELAY_DIAGNOSIS=$1"; exit 1; }
          test -n "$VPS_KEY" && test -n "$HOST_KEY" || refuse credentials_not_present
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null 2>&1 || refuse vps_key_invalid
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null 2>&1 || refuse cpanel_key_invalid
          echo "PRIVATE_SSH_KEY_FORMAT=VALID"
          if ! timeout 13 ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null; then
            refuse vps_port_or_keyscan_unreachable
          fi
          test -s "$d/vps.known" || refuse vps_no_host_key
          vps_fp="$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)"
          test "$vps_fp" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" || refuse vps_host_fingerprint_mismatch
          echo "PINNED_VPS_HOST_KEY=MATCHED"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          if ! timeout 13 ssh -F "$d/config" saeit-vps 'printf "RELAY_AUTHENTICATED\n"' >/dev/null 2>&1; then
            refuse vps_login_or_access_denied
          fi
          echo "VPS_SSH_LOGIN=PASS"
          if ! scan="$(timeout 13 ssh -F "$d/config" saeit-vps 'timeout 10s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"; then
            refuse cpanel_from_vps_port_unreachable
          fi
          test -n "$scan" || refuse cpanel_from_vps_no_host_key
          printf '%s\n' "$scan" > "$d/host.candidate"
          cp_fp="$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)"
          test "$cp_fp" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" || refuse cpanel_host_fingerprint_mismatch
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_HOST_KEY=MATCHED"
          if ! timeout 20 ssh -F "$d/config" saeit-cpanel 'printf "AUTHORIZED_PRIVATE_HOST\n"' >/dev/null 2>&1; then
            refuse cpanel_login_or_access_denied
          fi
          echo "CPANEL_PRIVATE_SSH=PASS"
          echo "SSH_RELAY_DIAGNOSIS=ALL_STAGES_PASS"
          echo "PRODUCTION_FILES=UNTOUCHED"
          echo "PRIVATE_COMMANDS=NOT_SENT"
