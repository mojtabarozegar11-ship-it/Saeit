name: MojPlayWin no-DDL TRX PaymentIntent isolated MariaDB test
on:
  push:
    branches: [fix/mpw-tron-provider-auth-20261022]
    paths:
      - services/mpw_walletless_existing_intent_pilot.py
      - services/mpw_walletless_existing_intent_staging_web.py
      - tests/test_mpw_walletless_existing_intent_pilot.py
      - .github/workflows/mpw-walletless-existing-intent-mariadb-20261022.yml
  pull_request:
    branches: [feature/mpw-walletless-trx-e2e-20261022]
    paths:
      - services/mpw_walletless_existing_intent_pilot.py
      - services/mpw_walletless_existing_intent_staging_web.py
      - tests/test_mpw_walletless_existing_intent_pilot.py
      - .github/workflows/mpw-walletless-existing-intent-mariadb-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no-ddl-walletless-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: test_walletless_ci
          MARIADB_USER: walletless
          MARIADB_PASSWORD: local-only-no-money
          MARIADB_ROOT_PASSWORD: local-root-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Django with ephemeral MariaDB driver
        run: |
          python3 -m pip install --disable-pip-version-check 'Django>=5.2,<6' 'mysqlclient>=2.2,<3' 'PyMySQL==1.1.2' 'segno==1.6.6'
      - name: Static production-write guard, compile and test no-DDL adapter
        run: |
          set -euo pipefail
          python3 -m py_compile services/mpw_walletless_existing_intent_pilot.py services/mpw_walletless_existing_intent_staging_web.py tests/test_mpw_walletless_existing_intent_pilot.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('services/mpw_walletless_existing_intent_pilot.py').read_text()
          assert '_test_only_guard' in s
          assert '_test_db(settings, db)' in s
          assert 'PaymentIntent.objects.create' in s
          assert 'PaymentWebhookEvent.objects.create' in s
          assert 'LedgerEntry.objects.create' in s
          assert not any(x in s.upper() for x in ('CREATE TABLE','ALTER TABLE','DROP TABLE','GRANT ALL'))
          print('EXISTING_PAYMENT_TABLE_ONLY=PASS')
          PY
          python3 -m unittest discover -s tests -p 'test_mpw_walletless_existing_intent_pilot.py' -v
          echo 'TRX_NO_DDL_EXISTING_MARIADB_E2E=PASS; PRODUCTION_PAYMENT_WRITES=0'
