name: One-shot factory P0 disk/intake fail-closed regression
on:
  push:
    branches:
      - fix/master-enospc-cron-restore-20261029
    paths:
      - .github/workflows/factory-agri200-preflight-oneshot-20261029.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise real isolated full/missing/intact intake preflight and stage guards
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_agri200_onepass_dispatch_20261023.py -v
          python3 -B -m unittest discover -s tests -p 'test_factory_master*' -v
          echo FACTORY_P0_OFFLINE_SAFETY_QA=PASS
