name: Manually publish verified Zomorod business private files
# A PR merge must never trigger a live write; release requires explicit manual dispatch.
on:
  workflow_dispatch:
    inputs:
      expected_current_app_sha256:
        description: 'SHA256 of verified live private app.php from a recent read-only host audit'
        required: true
        type: string
      expected_current_dossier_sha256:
        description: 'SHA256 of live genetics-center.php, or ABSENT if independently verified missing'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zomorod-business-safe-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate both PHP files and guarded installer
        run: |
          set -euo pipefail
          php -l content/zomorod-business/app.php
          php -l content/zomorod-business/genetics-center.php
          bash -n scripts/zomorod_business_genetics_guarded_install.sh
          test -s content/zomorod-business/app.php
          test -s content/zomorod-business/genetics-center.php
          test -s scripts/zomorod_business_genetics_guarded_install.sh
      - name: Prepare pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-business-update"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d"/*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -T -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "PINNED_RELAY=verified"
          echo "RELAY_CONFIG=$d" >> "$GITHUB_ENV"
      - name: Stage and publish the verified private files only
        shell: bash
        env:
          EXPECTED_APP: ${{ inputs.expected_current_app_sha256 }}
          EXPECTED_DOSSIER: ${{ inputs.expected_current_dossier_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APP" =~ ^[0-9a-f]{64}$ ]] || exit 2
          if [[ "$EXPECTED_DOSSIER" != ABSENT ]]; then
            [[ "$EXPECTED_DOSSIER" =~ ^[0-9a-f]{64}$ ]] || exit 2
          fi
          source_dir=content/zomorod-business
          app_hash="$(sha256sum "$source_dir/app.php" | awk '{print $1}')"
          dossier_hash="$(sha256sum "$source_dir/genetics-center.php" | awk '{print $1}')"
          d="$RELAY_CONFIG"
          stage="/home/zomorod2/.private/zomorod-business/.stage-$GITHUB_SHA"
          # Refuse to overwrite any earlier staging directory.
          ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && install -d -m 700 '$stage'"
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/app.php'" < "$source_dir/app.php"
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/genetics-center.php'" < "$source_dir/genetics-center.php"
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/install.sh'" < scripts/zomorod_business_genetics_guarded_install.sh
          ssh -T -F "$d/config" saeit-cpanel "bash '$stage/install.sh' '$EXPECTED_APP' '$EXPECTED_DOSSIER' '$app_hash' '$dossier_hash' '$GITHUB_SHA' '$stage'"
      - name: Remove temporary SSH keys
        if: always()
        run: rm -rf "${RUNNER_TEMP}/zomorod-business-update"
