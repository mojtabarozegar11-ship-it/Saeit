name: Factory exact inactive draft safety checks
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/import_factory_store_drafts.py
      - tests/test_factory_store_draft_importer.py
      - .github/workflows/vps-store-django-draft-import.yml
      - .github/workflows/factory-exact-inactive-draft-ci-20261106.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single_version_inactive_draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required Django test runtime
        run: python -m pip install -r requirements.txt
      - name: Verify private draft admission and public-release guard coexist
        env:
          DEBUG: 'False'
          SECRET_KEY: github-ci-only-not-live
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python -m pytest -q tests/test_factory_store_draft_importer.py tests/test_publish_verified_factory_store_listing.py
          python -m unittest discover -s product_recipes/farm_enterprise_economics -p test_calculator.py
          python -m py_compile scripts/import_factory_store_drafts.py
