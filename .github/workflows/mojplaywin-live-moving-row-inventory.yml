name: MojPlayWin main-only moving row and card public HTML audit
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-live-moving-row-inventory.yml"]
permissions:
  contents: read
jobs:
  inspect-main-only-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned GitHub to VPS to cPanel private read-only relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-rows-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect ONLY original main static homepage orbit and animated horizontal lanes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-rows-inventory"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path("/home/zomorod2/mojplaywin.com/design-preview-20261017/production-home-20261017.html")
          assert p.is_file() and not p.is_symlink()
          s=p.read_text("utf-8")
          tokens=('marquee','ticker','track','rail','lane','moving','scroll-row','orbit-card','carousel','row-strip','scrolling','band-')
          matches=[]
          for m in re.finditer('|'.join(re.escape(x) for x in tokens),s,re.I):
              if len(matches)>=95:break
              context=s[max(0,m.start()-180):m.start()+240]
              matches.append({"at":m.start(),"token":m.group(),"context":context})
          print("MOVING_ROWS_LIVE_MAIN_ONLY="+json.dumps({
            "sha256":hashlib.sha256(s.encode()).hexdigest(),
            "bytes":len(s),"orbit_count":s.count('class="mpo-orbit-card"'),
            "matches":matches},sort_keys=True))
          for label,a,b in [("SECTION_TOP",60000,62200),("FIRST_TO_SECOND",64000,65800),
                            ("SECOND_TO_THIRD",67500,69300),("THIRD_END",70800,73800),
                            ("ORBIT_JS",99000,len(s))]:
              print("PUBLIC_MAIN_FRAGMENT_"+label+"="+json.dumps(s[a:b]))
          print("ORBIT_INIT_SELECTORS="+json.dumps({
             "tracks":len(re.findall(r'<ul class="mpo-orbit-track"',s)),
             "arrow_controls":len(re.findall(r'data-orbit-(?:next|prev)',s)),
             "expr":list(set(re.findall(r'(?:querySelectorAll|querySelector)\([^)]{0,110}\)',s)))[:30]
          }))
          scripts=re.findall(r'<script[^>]*>.*?</script>',s,re.S|re.I)
          print("SCRIPT_ELEMENT_COUNT="+str(len(scripts)))
          for idx,script in enumerate(scripts[-8:]):
              print("EXISTING_PUBLIC_SCRIPT_"+str(idx)+"="+json.dumps(script[:4400]))
          print("NO_SOURCE_MODIFICATIONS=true")
          PY
      - name: Clear SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-rows-inventory"
