name: MojPlayWin About ten illustrated team profiles safe exact publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mojplaywin-about-team-isolated-live-release-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  team-about-only:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[approved-mpw-team-about-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated editable source and deterministic reversible HTML composition
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_about_team_isolated_patch_20261018.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p='scripts/mojplaywin_about_team_isolated_patch_20261018.py'
          spec=importlib.util.spec_from_file_location('mpw',p)
          mpw=importlib.util.module_from_spec(spec);spec.loader.exec_module(mpw)
          snippet=Path('content/mojplaywin_about_team_section_20261018.html').read_text('utf-8')
          assert len(snippet.encode())>=22000
          assert snippet.count('class="mpw-team-card"')==10
          assert snippet.count('data:image/avif;base64,')==1
          assert 'AI-generated illustrations' in snippet
          assert 'The role focuses on evaluating opportunities' in snippet
          assert not any(x in snippet for x in ('<script','<iframe','{%','{{'))
          origin='<html><head></head><body><main><h1>About</h1>'+' '.join(mpw.EXISTING_MARKERS)+'</main></body></html>'
          compiled=mpw.compose(origin,snippet).decode('utf-8')
          assert compiled.replace('\n<!-- MPW_TEAM_ADDON_V1 -->\n'+snippet+'\n','',1)==origin
          assert compiled.count('<h1')==origin.count('<h1')
          assert compiled.count('mpw-team-card')>=10
          print('TEAM_SAFE_COMPOSITION_TEST=PASS')
          PY
      - name: Record prepublication status of main and all known protected paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import os,json
          root='https://mojplaywin.com'
          paths=['/','/about/','/store/','/about/mojtaba-rozegar/',
                 '/mojtaba.roozegar/','/mojtaba.roozegar/about/',
                 '/farnaz/','/saman/','/picm/','/taniya/','/zahra/']
          statuses={}
          for path in paths:
            url=root+path
            try:
              req=Request(url,headers={'User-Agent':'MPWTeamSafeRelease/1.0','Cache-Control':'no-cache'})
              with urlopen(req,timeout=17) as r:code=r.status
            except HTTPError as e:code=e.code
            except Exception as e:raise RuntimeError('BASELINE_NETWORK_ERROR '+url+' '+type(e).__name__)
            statuses[url]=code
            print('BASELINE '+url+' '+str(code))
          for path in ('/','/about/','/store/','/mojtaba.roozegar/','/farnaz/'):
            if statuses[root+path]!=200:raise RuntimeError('UNHEALTHY_CRITICAL_BASELINE '+path)
          with open(os.environ['RUNNER_TEMP']+'/mpw-team-baseline.json','w') as f:json.dump(statuses,f)
          PY
      - name: Establish locked host-key verified GitHub to VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-team-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
          echo 'PINNED_TEAM_RELAY_READY'
      - name: Stage exactly one new team HTML snippet in private home
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-team-ssh"
          scp -q -F "$d/config" content/mojplaywin_about_team_section_20261018.html \
            "saeit-cpanel:/home/zomorod2/.mpw-team-stage-$GITHUB_RUN_ID.html"
      - name: Add team information only to existing exact About asset, with rollback snapshot
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-team-ssh"
          digest=$(sha256sum content/mojplaywin_about_team_section_20261018.html | awk '{print $1}')
          timeout 65s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID' '$digest'" < scripts/mojplaywin_about_team_isolated_patch_20261018.py
      - name: Verify ten detailed profiles, old About material and other paths at live URLs
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,re,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          baseline=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-team-baseline.json'))
          about='https://mojplaywin.com/about/'
          expected=('mpw-meet-team-20261018','MPW_TEAM_ADDON_V1','Sophia','Isabella',
                    'Olivia','Camila','Valentina','Emma','Charlotte','Amelia','Luca','Noah',
                    'AI-generated illustrations','The role focuses on evaluating opportunities',
                    'Original by Default','MPW_ABOUT_RESEARCH_80_20_V1',
                    'SPECIALISM 28','COMPLEMENTARY SPECIALISM 30','Mojtaba Roozegar')
          found=False
          for i in range(1,7):
            try:
              req=Request(about+'?__team_live='+os.environ['GITHUB_RUN_ID']+'-'+str(i),
                          headers={'User-Agent':'MPWTeamPostPublish/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urlopen(req,timeout=20) as r:status=r.status;html=r.read(1600000).decode('utf-8','replace')
              found=(status==200 and all(s in html for s in expected)
                     and html.count('class="mpw-team-card"')==10
                     and len(re.findall(r'<h1\b',html,re.I))==1)
              print('TEAM_ABOUT_LIVE_ATTEMPT='+str(i)+' status='+str(status)+' validated='+str(found))
              if not found and i in (1,6):
                print('TEAM_ABOUT_DIAGNOSTIC missing='+repr([x for x in expected if x not in html])
                      +' cards='+str(html.count('class="mpw-team-card"'))
                      +' h1='+str(len(re.findall(r'<h1\b',html,re.I)))
                      +' html_bytes='+str(len(html.encode('utf-8'))))
              if found:break
            except Exception as e:print('TEAM_ABOUT_LIVE_RETRY='+type(e).__name__)
            time.sleep(3)
          if not found:raise RuntimeError('TEAM_ABOUT_NOT_VISIBLE_OR_INCOMPLETE')
          for url,old_status in baseline.items():
            req=Request(url,headers={'User-Agent':'MPWTeamSafeRelease/1.0','Cache-Control':'no-cache'})
            try:
              with urlopen(req,timeout=19) as r:status=r.status
            except HTTPError as e:status=e.code
            if status!=old_status:raise RuntimeError('PROTECTED_STATUS_CHANGED '+url+' '+str(status)+'!='+str(old_status))
            print('PROTECTED_UNCHANGED '+url+' '+str(status))
          print('MPW_TEAM_ABOUT_RELEASE_VERIFIED=YES')
          PY
          d="$RUNNER_TEMP/mojplaywin-team-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - status '$GITHUB_RUN_ID'" < scripts/mojplaywin_about_team_isolated_patch_20261018.py
      - name: Roll back only this exact About change after any publication or smoke failure
        if: failure() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure')
        shell: bash
        run: |
          d="$RUNNER_TEMP/mojplaywin-team-ssh"
          if test -f "$d/config"; then
            timeout 50s ssh -T -F "$d/config" saeit-cpanel \
              "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mojplaywin_about_team_isolated_patch_20261018.py || true
          fi
      - name: Remove only private staging source for this exact run
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mojplaywin-team-ssh"
          if test -f "$d/config"; then
            ssh -T -F "$d/config" -o ConnectTimeout=10 saeit-cpanel \
              "test ! -L /home/zomorod2/.mpw-team-stage-$GITHUB_RUN_ID.html && rm -f -- /home/zomorod2/.mpw-team-stage-$GITHUB_RUN_ID.html" || true
          fi