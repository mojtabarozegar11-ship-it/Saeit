name: MojPlayWin isolated crypto verification environment setup
on:
  push:
    branches: [release/mojplaywin-chess-product-20261014]
    paths: ['.github/workflows/mojplaywin-crypto-isolated-setup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install crypto verifier in separate private cPanel Python venv (not live website)
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-proof-preflight"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
            p=Path(filename)
            p.write_text(p.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 285s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          umask 077
          venv="$HOME/.mpw-proof-crypto-py311"
          site_python=/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python
          stage=/home/zomorod2/Saeit-staging/mojplaywin-chess-product-prep-20261014
          script="$stage/mpw_native_checkout/crypto_subprocess_verify.py"
          test -x "$site_python"
          test -f "$script"
          if ! test -x "$venv/bin/python"; then
            "$site_python" -m venv "$venv"
          fi
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input --quiet "eth-account==0.13.7"
          "$venv/bin/python" -I -c "from eth_account import Account; from eth_keys import keys; from eth_utils import keccak; print('MPW_ISOLATED_CRYPTO_IMPORT_OK')"
          printf '{"asset":"ETH","message":"MojPlayWin Merchant Wallet Ownership - invalid proof for isolated runtime test","signature":"0x%s"}' "$(printf '0%.0s' $(seq 1 130))" | "$venv/bin/python" -I "$script" > "$venv/negative-result.json" || true
          "$venv/bin/python" - "$venv/negative-result.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])) == {"verified":False}
          print("MPW_ISOLATED_CRYPTO_REFUSES_UNVERIFIED_SIGNATURE")
          PY
          rm -f "$venv/negative-result.json"
          echo MPW_ISOLATED_CRYPTO_PYTHON_READY
          echo LIVE_VENV_DATABASE_AND_WEBSITE_FILES_UNMODIFIED
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-proof-preflight"
