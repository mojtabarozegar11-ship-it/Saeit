name: MojPlayWin install isolated crypto payment route (DISABLED)
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths:
      - .github/workflows/mojplaywin-crypto-staged-publish.yml
permissions:
  contents: read
concurrency:
  group: mojplaywin-crypto-isolated-route-publish
  cancel-in-progress: false
jobs:
  stage-disabled:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fail if isolated source or reversible installer is invalid
        run: |
          set -euo pipefail
          php -l isolated_crypto_gateway/index.php
          php -l isolated_crypto_gateway/bootstrap.php
          python3 -m py_compile scripts/mojplaywin_crypto_publish_standalone.py
          grep -q "MOJPLAYWIN_OFFLINE_PAYMENT_INVOICE_TEST" .github/workflows/mojplaywin-crypto-php-sandbox.yml
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"


      - name: Stage fresh MAIN-domain payment path only, never enable real payments
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          stage="/home/zomorod2/.mojplaywin-crypto-source-$GITHUB_RUN_ID"
          i="$(sha256sum isolated_crypto_gateway/index.php | cut -d' ' -f1)"
          b="$(sha256sum isolated_crypto_gateway/bootstrap.php | cut -d' ' -f1)"
          ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          for file in index.php bootstrap.php; do
            ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/$file'" < "isolated_crypto_gateway/$file"
          done
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/installer.py'" < scripts/mojplaywin_crypto_publish_standalone.py
          installed=false
          cleanup() {
            if [ "$installed" = true ]; then
              echo "WARNING: stage created, live checkout remains disabled even if smoke failed."
            fi
            ssh -T -F "$d/config" saeit-cpanel "test -d '$stage' && rm -f -- '$stage/index.php' '$stage/bootstrap.php' '$stage/installer.py' && rmdir -- '$stage'" || true
          }
          trap cleanup EXIT
          paths=(/ /store/ /farnaz/ /taniya/ /mojtaba.roozegar/ /saman/)
          for path in "${paths[@]}"; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            echo "${path//[^[:alnum:]]/_}=$code" >> "$RUNNER_TEMP/pre.codes"
          done
          if timeout 20s ssh -T -F "$d/config" saeit-cpanel "test -f '/home/zomorod2/mojplaywin.com/checkout/crypto/index.php'"; then
            echo "EXISTING_GATEWAY_DETECTED=true"
            timeout 45s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' verify '$stage' '$i' '$b'"
          else
            timeout 45s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' publish '$stage' '$i' '$b'"
            installed=true
          fi
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "php -l '/home/zomorod2/mojplaywin.com/checkout/crypto/index.php' && php '/home/zomorod2/mojplaywin.com/checkout/crypto/bootstrap.php' init && php '/home/zomorod2/mojplaywin.com/checkout/crypto/bootstrap.php' status"
          status="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/payment-closed" -w '%{http_code}' https://mojplaywin.com/checkout/crypto/index.php)"
          echo "ISOLATED_PAYMENT_HANDLER_WHILE_DISABLED=$status"
          test "$status" = 503
          root_status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/checkout/crypto/)"
          echo "ISOLATED_CHECKOUT_ROOT_WHILE_DISABLED=$root_status"
          if [ "$root_status" = 404 ]; then
            echo "ROOT_DIRECTORY_ROUTE_NEEDS_EXPLICIT_INDEX_PHP=true"
          else
            test "$root_status" = 503
          fi
          for path in "${paths[@]}"; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            echo "${path//[^[:alnum:]]/_}=$code" >> "$RUNNER_TEMP/post.codes"
          done
          diff -u "$RUNNER_TEMP/pre.codes" "$RUNNER_TEMP/post.codes"
          echo "CHILD_SITE_SMOKE_UNCHANGED=true"
          echo "REAL_PAYMENTS_ENABLED=false"
          echo "SHARED_DJANGO_RESTARTED=false"
