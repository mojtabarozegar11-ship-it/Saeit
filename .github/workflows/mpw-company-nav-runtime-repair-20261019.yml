name: MojPlayWin Company zero JavaScript error safe repair
on:
  pull_request:
    paths:
      - "scripts/mpw_company_nav_null_guard_atomic_20261019.py"
      - "tests/test_mpw_company_nav_null_guard_20261019.py"
      - ".github/workflows/mpw-company-nav-runtime-repair-20261019.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mpw_company_nav_null_guard_atomic_20261019.py"
      - ".github/workflows/mpw-company-nav-runtime-repair-20261019.yml"
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  preflight-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify minimal guarded source patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_company_nav_null_guard_atomic_20261019.py
          python3 -m pip install -q pytest
          python3 -m pytest -q --noconftest tests/test_mpw_company_nav_null_guard_20261019.py
  deploy-and-verify:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[approved-mpw-company-nav-20261019]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check exact route, original script and safe previous site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_company_nav_null_guard_atomic_20261019.py
          python3 -m pip install -q pytest
          python3 -m pytest -q --noconftest tests/test_mpw_company_nav_null_guard_20261019.py
          python3 - <<'PY'
          import urllib.request,hashlib,time
          origin='https://mojplaywin.com'
          def request(path):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache'}),timeout=18) as r:
                          if r.status!=200:raise RuntimeError('HTTP '+str(r.status))
                          return r.read(1700000)
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          public=request('/company/')
          direct=request('/design-preview-20261017/mpw-ten-editorials-20261018/pages/company.html')
          if hashlib.sha256(public).digest()!=hashlib.sha256(direct).digest():
              raise SystemExit('Live Company is not served from the permitted static file')
          original=public.decode('utf-8','replace')
          if "n.querySelectorAll('a').forEach" not in original or 'MPW_COMPANY_NAV_NULL_GUARD_20261019' in original:
              raise SystemExit('Legacy source changed, manual review required')
          for url in ('/about/','/store/','/contact/','/about/mojtaba-rozegar/'):
              request(url)
          print('COMPANY_ORIGINAL_STATIC_ROUTE=PASS')
          PY
      - name: Prepare Chromium before production writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpw-company-nav-browser"
          cd "$RUNNER_TEMP/mpw-company-nav-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent playwright
          npx playwright install --with-deps chromium
      - name: Open host-key-pinned relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Atomic fix only obsolete Company inline navigation script
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 75s ssh -T -F "$d/config" saeit-cpanel \
             "python3 - install '$GITHUB_RUN_ID'" < scripts/mpw_company_nav_null_guard_atomic_20261019.py
      - name: Verify page HTML and render in mobile and desktop Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mpw-company-nav-browser"
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const size of [{width:390,height:844},{width:1365,height:900}]){
                const page=await browser.newPage({viewport:size});
                const errors=[];
                page.on('pageerror',e=>errors.push((e.stack||String(e)).slice(0,450)));
                const response=await page.goto('https://mojplaywin.com/company/?verified_nav='+process.env.GITHUB_RUN_ID+'-'+size.width,
                  {waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(650);
                const result=await page.evaluate(()=>({
                  h1:document.querySelectorAll('main h1').length,
                  cards:document.querySelectorAll('.mpw-ten-card').length,
                  marker:document.documentElement.innerHTML.includes('MPW_COMPANY_NAV_NULL_GUARD_20261019'),
                  documentWidth:document.documentElement.scrollWidth,viewportWidth:innerWidth,
                  business:!!document.querySelector('#mpw-business-contact-20261019 a[href^="mailto:"]')
                }));
                console.log('COMPANY_BROWSER_VERIFICATION='+JSON.stringify({viewport:size.width,status:response.status(),errors,...result}));
                if(response.status()!==200||errors.length||result.h1!==1||result.cards!==10||
                   !result.marker||!result.business||result.documentWidth>result.viewportWidth+4) {
                  throw Error('Real-browser Company postpublication check failed');
                }
                await page.screenshot({path:'company-'+size.width+'.png',fullPage:false});
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node verify.cjs
      - name: Roll back exact Company HTML if any verification fails
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_company_nav_null_guard_atomic_20261019.py
      - name: Upload mobile and desktop verification snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpw-company-fixed-nav-mobile-desktop
          path: |
            ${{ runner.temp }}/mpw-company-nav-browser/company-*.png
          if-no-files-found: ignore
          retention-days: 14
