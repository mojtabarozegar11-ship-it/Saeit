name: Social Drafts - Daily Safe Pilot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate two brand draft queues (no publication)
        shell: bash
        run: |
          mkdir -p output
          python3 - <<'PY'
          import json, datetime, pathlib
          day = datetime.datetime.now(datetime.timezone.utc).date()
          topics = {
            "personal": ["اقتصاد کشاورزی و مدیریت تولید", "پژوهش علمی و نوآوری", "کارآفرینی و مدیریت کسب‌وکار"],
            "company": ["معرفی خدمات شرکت زمرد ملل", "پژوهش و توسعه در کشاورزی", "آموزش و دانشنامه تخصصی"],
          }
          for brand, choices in topics.items():
            topic = choices[day.toordinal() % len(choices)]
            draft = {
              "brand": brand, "date_utc": day.isoformat(),
              "topic": topic, "status": "draft_requires_review",
              "text": f"پیشنویس موضوع: {topic}. متن نهایی باید با منابع معتبر و بازبینی انسانی تکمیل شود.",
              "publish": False, "approved": False,
              "note": "No social account access; not published or queued for publication."
            }
            pathlib.Path(f"output/{brand}.json").write_text(
              json.dumps(draft, ensure_ascii=False, indent=2), encoding="utf-8"
            )
          PY
      - name: Enforce hard ban and non-publication policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          forbidden_values = ('dr.mojtaba.rozegar', '7317306')
          destination_keys = {
              'destination', 'destinations', 'account_handle', 'account_id',
              'metricool_brand_id', 'brand_id', 'brandid', 'providers',
              'social_network', 'publicationdate', 'scheduled_at',
          }

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key.casefold() in destination_keys:
                          raise SystemExit('SOCIAL_POLICY_BLOCK: draft binds a destination')
                      walk(child)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, str):
                  lowered = value.casefold()
                  if any(blocked in lowered for blocked in forbidden_values):
                      raise SystemExit('SOCIAL_POLICY_BLOCK: prohibited identifier')

          files = sorted(Path('output').glob('*.json'))
          if not files:
              raise SystemExit('SOCIAL_POLICY_BLOCK: missing draft artifacts')
          for file in files:
              draft = json.loads(file.read_text(encoding='utf-8'))
              walk(draft)
              if draft.get('publish') is not False or draft.get('approved') is not False:
                  raise SystemExit('SOCIAL_POLICY_BLOCK: drafts must not publish')
              if draft.get('status') != 'draft_requires_review':
                  raise SystemExit('SOCIAL_POLICY_BLOCK: unexpected draft state')
          print('SOCIAL_POLICY_PASS: drafts only, no destinations, hard ban enforced')
          PY
      - name: Upload draft artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: social-drafts
          path: output/*.json
          retention-days: 7
