name: VPS Factory Production Continuity
on:
  schedule:
    # Every hour: verify or recover the existing isolated VPS factory loop.
    - cron: "13 * * * *"
  push:
    branches: [main]
    paths: [.github/workflows/vps-factory-production-continuity.yml]
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths: [.github/workflows/vps-factory-production-continuity.yml, .github/workflows/vps-factory-persistence.yml]
permissions:
  contents: read
concurrency:
  group: saeit-vps-factory-continuity
  cancel-in-progress: false
jobs:
  pause-loop-low-disk:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[factory-pause-low-disk-loop-20261029]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Gracefully pause only the verified loop when free disk is below reserve
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/factory-pause"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          ssh -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/factory-runtime"
          ops="$root/operations"
          script="$ops/vps-only-loop.sh"
          pidfile="$ops/vps-only-loop.pid"
          free_bytes="$(df -B1 --output=avail "$root" | awk 'NR==2 {print $1}')"
          [[ "$free_bytes" =~ ^[0-9]+$ ]]
          echo "FACTORY_PAUSE_FREE_BYTES=$free_bytes"
          if (( free_bytes >= 536870912 )); then
            echo FACTORY_PAUSE_SKIPPED_DISK_ABOVE_RESERVE
            exit 0
          fi
          pid="$(cat "$pidfile" 2>/dev/null || true)"
          if ! [[ "$pid" =~ ^[0-9]+$ ]] || ! test -r "/proc/$pid/cmdline"; then
            echo FACTORY_PAUSE_NO_VERIFIED_PID
            exit 1
          fi
          if [[ "$(stat -c %u "/proc/$pid")" != "$(id -u)" ]] || ! tr '\0' ' ' < "/proc/$pid/cmdline" | grep -Fq -- "$script"; then
            echo FACTORY_PAUSE_PID_IDENTITY_MISMATCH
            exit 1
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo FACTORY_PAUSE_PROCESS_ALREADY_EXITED
            exit 0
          fi
          kill -TERM "$pid"
          echo FACTORY_PAUSE_TERM_SENT=true
          for attempt in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo FACTORY_PAUSE_LOOP_STOPPED=true
              exit 0
            fi
            sleep 1
          done
          echo FACTORY_PAUSE_LOOP_STOPPED=false
          exit 1
          REMOTE

  audit-readonly:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[factory-readonly-audit-20261029]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read current factory VPS disk, cron, process and database state
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/factory-audit"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          ssh -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/factory-runtime"
          test -d "$root" && test ! -L "$root"
          free_bytes="$(df -B1 --output=avail "$root" | awk 'NR==2 {print $1}')"
          disk_size_bytes="$(df -B1 --output=size "$root" | awk 'NR==2 {print $1}')"
          disk_used_bytes="$(df -B1 --output=used "$root" | awk 'NR==2 {print $1}')"
          inode_free="$(df -Pi "$root" | awk 'NR==2 {print $4}')"
          ram_total_kb="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          [[ "$free_bytes" =~ ^[0-9]+$ && "$disk_size_bytes" =~ ^[0-9]+$ && "$disk_used_bytes" =~ ^[0-9]+$ && "$inode_free" =~ ^[0-9]+$ && "$ram_total_kb" =~ ^[0-9]+$ ]]
          echo FACTORY_AUDIT_FILESYSTEM_SIZE_BYTES="$disk_size_bytes"
          echo FACTORY_AUDIT_FILESYSTEM_USED_BYTES="$disk_used_bytes"
          echo FACTORY_AUDIT_FREE_BYTES="$free_bytes"
          echo FACTORY_AUDIT_RAM_TOTAL_KB="$ram_total_kb"
          echo FACTORY_AUDIT_INODES_FREE="$inode_free"
          echo FACTORY_AUDIT_RESERVE_BYTES="$((512*1024*1024))"
          python3 -c '
          import os, subprocess, sys
          root = sys.argv[1]
          sudo_available = subprocess.run(["sudo", "-n", "true"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False).returncode == 0
          prefix = ["sudo", "-n"] if sudo_available else []
          def scan(path, seconds):
              return subprocess.run(
                  prefix + ["timeout", str(seconds) + "s", "du", "-x", "--max-depth=1", "-B1", "--null", path],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False,
              )
          print("FACTORY_AUDIT_PRIVILEGED_READ_AVAILABLE=" + str(sudo_available).lower())
          result = scan(root, 20)
          totals = {"application": 0, "operations": 0, "runtime_data": 0, "temporary": 0, "backups": 0, "other": 0}
          names = {"django-app": "application", "operations": "operations", "var": "runtime_data", "tmp": "temporary", "backups": "backups"}
          for record in result.stdout.split(bytes([0])):
              if not record:
                  continue
              try:
                  size, path = record.split(bytes([9]), 1)
                  path_text = os.fsdecode(path.rstrip(bytes([47])))
                  if path_text == root.rstrip("/"):
                      continue
                  name = os.path.basename(path_text)
                  totals[names.get(name, "other")] += int(size)
              except (ValueError, OSError):
                  continue
          for key, value in totals.items():
              print(f"FACTORY_AUDIT_USAGE_{key.upper()}_BYTES={value}")
          print("FACTORY_AUDIT_USAGE_SCAN_COMPLETE=" + str(result.returncode == 0).lower())
          if sudo_available:
              fs = scan("/", 30)
              fs_totals = {"home": 0, "var": 0, "usr": 0, "opt": 0, "root": 0, "tmp": 0, "system": 0, "other": 0}
              fs_names = {"home": "home", "var": "var", "usr": "usr", "opt": "opt", "root": "root", "tmp": "tmp", "etc": "system", "lib": "system", "lib64": "system", "bin": "system", "sbin": "system", "boot": "system", "snap": "system"}
              for record in fs.stdout.split(bytes([0])):
                  if not record:
                      continue
                  try:
                      size, path = record.split(bytes([9]), 1)
                      path_text = os.fsdecode(path.rstrip(bytes([47])))
                      if not path_text:
                          continue
                      name = os.path.basename(path_text)
                      fs_totals[fs_names.get(name, "other")] += int(size)
                  except (ValueError, OSError):
                      continue
              for key, value in fs_totals.items():
                  print(f"FACTORY_AUDIT_FILESYSTEM_TOP_{key.upper()}_BYTES={value}")
              print("FACTORY_AUDIT_FILESYSTEM_TOP_SCAN_COMPLETE=" + str(fs.returncode == 0).lower())
          else:
              print("FACTORY_AUDIT_FILESYSTEM_TOP_SCAN_COMPLETE=not_authorized")
          ' "$root"
          current="$(mktemp /tmp/factory-audit-cron.XXXXXX)"
          trap 'rm -f -- "$current"' EXIT
          crontab -l > "$current" 2>/dev/null || : > "$current"
          echo FACTORY_AUDIT_CRON_MASTER_TAGS="$(grep -Ec 'SAEIT_MASTER_AGENT_V1|SAEIT_FACTORY_EVERY_MINUTE_V1|SAEIT_FACTORY_LIFECYCLE_12_V1' "$current" || true)"
          echo FACTORY_AUDIT_CRON_LEECH_TAGS="$(grep -Ec 'LEECH|leech' "$current" || true)"
          echo FACTORY_AUDIT_CRON_OTHER_LINES="$(grep -Ec -v 'SAEIT_MASTER_AGENT_V1|SAEIT_FACTORY_EVERY_MINUTE_V1|SAEIT_FACTORY_LIFECYCLE_12_V1' "$current" || true)"
          ops="$root/operations"
          script="$ops/vps-only-loop.sh"
          pidfile="$ops/vps-only-loop.pid"
          pid="$(cat "$pidfile" 2>/dev/null || true)"
          if [[ "$pid" =~ ^[0-9]+$ ]] && test -r "/proc/$pid/cmdline" && tr '\0' ' ' < "/proc/$pid/cmdline" | grep -Fq -- "$script"; then
            echo FACTORY_AUDIT_LOOP_STATUS=verified_running
            echo FACTORY_AUDIT_LOOP_ELAPSED_SECONDS="$(ps -p "$pid" -o etimes= | tr -d ' ')"
          else
            echo FACTORY_AUDIT_LOOP_STATUS=not_verified_running
          fi
          log="$ops/vps-only-factory.log"
          if test -f "$log" && test ! -L "$log"; then
            echo FACTORY_AUDIT_LOOP_LOG_BYTES="$(stat -c %s "$log")"
            echo FACTORY_AUDIT_LOOP_LOG_AGE_SECONDS="$(( $(date +%s) - $(stat -c %Y "$log") ))"
            echo FACTORY_AUDIT_LOCK_ERRORS_LAST_500="$(tail -n 500 "$log" | grep -c -F 'database is locked' || true)"
            echo FACTORY_AUDIT_TICK_FAILURES_LAST_500="$(tail -n 500 "$log" | grep -c -F 'TICK_EXIT_FAILURE' || true)"
          else
            echo FACTORY_AUDIT_LOOP_LOG_STATUS=missing_or_unsafe
          fi
          cd "$root/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
          "$root/.venv/bin/python" -B -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings"); import django; django.setup(); from django.conf import settings; from pathlib import Path; from django.db import connection; from core.models import AgentTask, FactoryRun, Product; db=settings.DATABASES["default"]; engine=db["ENGINE"]; print("FACTORY_AUDIT_DB_ENGINE_KIND="+("sqlite" if engine.endswith("sqlite3") else "non_sqlite")); source=Path(db["NAME"]) if engine.endswith("sqlite3") else None; present=bool(source and source.is_file() and not source.is_symlink()); print("FACTORY_AUDIT_DB_FILE_STATUS="+("present" if present else "unsafe_or_missing")); print("FACTORY_AUDIT_DB_BYTES="+str(source.stat().st_size if present else "unavailable")); cursor=connection.cursor() if engine.endswith("sqlite3") else None; cursor.execute("PRAGMA journal_mode") if cursor else None; print("FACTORY_AUDIT_SQLITE_JOURNAL_MODE="+str(cursor.fetchone()[0]) if cursor else "FACTORY_AUDIT_SQLITE_JOURNAL_MODE=not_applicable"); cursor.execute("PRAGMA busy_timeout") if cursor else None; print("FACTORY_AUDIT_SQLITE_BUSY_TIMEOUT_MS="+str(cursor.fetchone()[0]) if cursor else "FACTORY_AUDIT_SQLITE_BUSY_TIMEOUT_MS=not_applicable"); print("FACTORY_AUDIT_AGENT_TASK_ROWS="+str(AgentTask.objects.count())); print("FACTORY_AUDIT_FACTORY_RUN_ROWS="+str(FactoryRun.objects.count())); print("FACTORY_AUDIT_PRODUCT_ROWS="+str(Product.objects.count()))'
          echo FACTORY_AUDIT_READ_ONLY=true
          REMOTE

  ensure:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && (github.event_name != 'pull_request' || (github.event.pull_request.number == 1872 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe existing independent VPS factory loop (read only)
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-continuity-readonly"
          mkdir -p "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          script="$base/operations/vps-only-loop.sh"
          pidfile="$base/operations/vps-only-loop.pid"
          log="$base/operations/vps-only-factory.log"
          test -x "$script"
          echo FACTORY_CONTINUITY_MODE=READ_ONLY
          free_bytes="$(df -B1 --output=avail "$base" | awk 'NR==2 {print $1}')"
          echo "FACTORY_DISK_FREE_BYTES=$free_bytes"
          status=NOT_VERIFIED_RUNNING
          if test -f "$pidfile" && test ! -L "$pidfile"; then
            pid="$(tr -d '\n' < "$pidfile")"
            if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
              if [[ "$(stat -c %u "/proc/$pid" 2>/dev/null)" == "$(id -u)" ]] && tr '\0' ' ' < "/proc/$pid/cmdline" | grep -Fq -- "$script"; then
                status=VERIFIED_RUNNING
              fi
            fi
          fi
          echo "FACTORY_LOOP_STATUS=$status"
          if test -f "$log" && test ! -L "$log"; then
            echo "FACTORY_LOOP_LOG_AGE_SECONDS=$(( $(date +%s) - $(stat -c %Y "$log") ))"
            echo "FACTORY_TICK_FAILURES_LAST_500=$(tail -n 500 "$log" | grep -c -F 'TICK_EXIT_FAILURE' || true)"
            echo "FACTORY_SQLITE_LOCKS_LAST_500=$(tail -n 500 "$log" | grep -c -F 'database is locked' || true)"
          else
            echo FACTORY_LOOP_LOG_STATUS=ABSENT_OR_UNSAFE
          fi
          # Verify local boot/cron ownership without printing any crontab contents.
          watchdog="$base/operations/ensure-vps-only-loop.sh"
          watchdog_script=NOT_VERIFIED
          if test -x "$watchdog" && test ! -L "$watchdog"; then
            watchdog_script=VERIFIED
          fi
          daemon_active=NO
          if systemctl is-active --quiet cron 2>/dev/null || systemctl is-active --quiet crond 2>/dev/null; then
            daemon_active=YES
          fi
          daemon_enabled=NO
          if systemctl is-enabled --quiet cron 2>/dev/null || systemctl is-enabled --quiet crond 2>/dev/null; then
            daemon_enabled=YES
          fi
          cron_entries="$(crontab -l 2>/dev/null || true)"
          expected_reboot='@reboot /bin/bash /home/githubops/factory-runtime/operations/ensure-vps-only-loop.sh >> /home/githubops/factory-runtime/operations/vps-only-watchdog.log 2>&1 # SAEIT_FACTORY_AUTOSTART'
          expected_five='*/5 * * * * /bin/bash /home/githubops/factory-runtime/operations/ensure-vps-only-loop.sh >> /home/githubops/factory-runtime/operations/vps-only-watchdog.log 2>&1 # SAEIT_FACTORY_AUTOSTART'
          reboot_count="$(printf '%s\n' "$cron_entries" | grep -Fxc -- "$expected_reboot" || true)"
          five_count="$(printf '%s\n' "$cron_entries" | grep -Fxc -- "$expected_five" || true)"
          echo "FACTORY_LOCAL_WATCHDOG_SCRIPT=$watchdog_script"
          echo "FACTORY_LOCAL_CRON_DAEMON_ACTIVE=$daemon_active"
          echo "FACTORY_LOCAL_CRON_DAEMON_ENABLED=$daemon_enabled"
          echo "FACTORY_LOCAL_CRON_REBOOT_RULE_COUNT=$reboot_count"
          echo "FACTORY_LOCAL_CRON_FIVE_MIN_RULE_COUNT=$five_count"
          watchdog_configuration=HOLD
          if [[ "$watchdog_script" == VERIFIED && "$daemon_active" == YES && "$daemon_enabled" == YES && "$reboot_count" == 1 && "$five_count" == 1 ]]; then
            watchdog_configuration=CONFIGURATION_VERIFIED_ONLY
          fi
          echo "FACTORY_VPS_LOCAL_AUTONOMY=$watchdog_configuration"
          cd "$base/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
          "$base/.venv/bin/python" -B - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.apps import apps
          Run = apps.get_model("core", "FactoryRun")
          Product = apps.get_model("core", "Product")
          Artifact = apps.get_model("core", "FactoryArtifact")
          Manifest = apps.get_model("core", "FactoryReleaseManifest")
          Task = apps.get_model("core", "AgentTask")
          active_runs = Run.objects.filter(status="active")
          linked_ids = active_runs.exclude(product_id__isnull=True).values_list("product_id", flat=True).distinct()
          distinct = linked_ids.count()
          factory_drafts = Product.objects.filter(pk__in=linked_ids, factory_managed=True, active=False).count()
          published_factory_products = Product.objects.filter(factory_managed=True, active=True).count()
          missing_product = active_runs.filter(product_id__isnull=True).count()
          print("FACTORY_ACTIVE_RUN_RECORDS=" + str(active_runs.count()))
          print("FACTORY_ACTIVE_RUN_DISTINCT_PRODUCT_IDS=" + str(distinct))
          print("FACTORY_ACTIVE_RUN_MISSING_PRODUCT=" + str(missing_product))
          print("FACTORY_ACTIVE_RUN_LINKED_FACTORY_DRAFTS=" + str(factory_drafts))
          print("FACTORY_ACTIVE_RUN_LINKED_OTHER_PRODUCTS=" + str(distinct - factory_drafts))
          print("FACTORY_MANAGED_PUBLISHED_PRODUCTS=" + str(published_factory_products))
          print("FACTORY_ARTIFACT_ROWS=" + str(Artifact.objects.count()))
          print("FACTORY_RELEASE_MANIFEST_ROWS=" + str(Manifest.objects.count()))
          print("FACTORY_QUEUED_AGENT_TASKS=" + str(Task.objects.filter(status="queued").count()))
          one_sku = distinct == 1 and factory_drafts == 1 and missing_product == 0 and published_factory_products == 0
          print("FACTORY_GLOBAL_SINGLE_SKU_EVIDENCE=" + ("CANDIDATE_ONLY" if one_sku else "HOLD"))
          print("FACTORY_PRODUCTION_RELEASE_AUTHORIZED=NO")
          PY
          REMOTE

# Operator-requested safe continuity verification on 2026-10-14; VPS-local watchdog remains authoritative.
# Owner-requested existing-loop activation check: VPS factory, 2026-10-16.
# Owner-requested read-only VPS capacity remeasurement (2026-10-29).
# [factory-readonly-audit-20261029]

# [factory-run-existing-diagnostics]
# [factory-run-existing-diagnostics2]
# [factory-run-existing-diagnostics3]
