name: VPS Factory Production Continuity
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-factory-production-continuity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ensure one running factory loop and report actual production progress
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "LOCAL_FAILURE line=$LINENO exit=$rc"; exit "$rc"' ERR
          umask 077
          test -n "$VPS_KEY"
          echo VPS_KEY_PRESENT
          d="$RUNNER_TEMP/vps-factory"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/key"
          chmod 600 "$d/key"
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          echo VPS_HOSTKEY_VERIFIED
          ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          trap 'rc=$?; echo "REMOTE_FAILURE line=$LINENO exit=$rc"; exit "$rc"' ERR
          base="$HOME/factory-runtime"
          ops="$base/operations"
          script="$ops/vps-only-loop.sh"
          pidfile="$ops/vps-only-loop.pid"
          test -x "$script"
          grep -q 'FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider' "$script"
          echo VPS_FACTORY_PREFLIGHT_OK
          exec 9>"$ops/vps-only-launch-v2.lock"
          if ! flock -n 9; then
            echo FACTORY_LAUNCH_LOCK_BUSY
            current_pid="$(cat "$pidfile" 2>/dev/null || true)"
            if [[ "$current_pid" =~ ^[0-9]+$ ]] && kill -0 "$current_pid" 2>/dev/null; then
              current_cmd="$(ps -p "$current_pid" -o args= || true)"
              case "$current_cmd" in
                *"$script"*)
                  echo FACTORY_LOOP_ALIVE
                  echo "FACTORY_PID=$current_pid"
                  echo FACTORY_RECENT_ACTIVITY
                  tail -n 35 "$ops/vps-only-factory.log" || true
                  exit 0
                  ;;
                *)
                  echo FACTORY_PID_NOT_VERIFIED
                  printf 'PID_COMMAND=%s\n' "$current_cmd"
                  exit 1
                  ;;
              esac
            fi
            echo FACTORY_LOCK_BUSY_NO_VERIFIED_PID
            ps -eo pid,ppid,args | grep -F 'vps-only-loop' | grep -v grep || true
            exit 1
          fi
          if test -s "$pidfile" && kill -0 "$(cat "$pidfile")" 2>/dev/null; then
            echo FACTORY_LOOP_ALIVE
          else
            nohup "$script" 9>&- </dev/null >> "$ops/vps-only-launch.log" 2>&1 &
            printf '%s\n' "$!" > "$pidfile"
            sleep 3
            kill -0 "$(cat "$pidfile")"
            echo FACTORY_LOOP_RECOVERED
          fi
          echo "FACTORY_PID=$(cat "$pidfile")"
          echo FACTORY_RECENT_ACTIVITY
          tail -n 35 "$ops/vps-only-factory.log" || true
          REMOTE
