              ps -p "$current_pid" -o args= || true
              exit 1
            fi
            echo FACTORY_LOCK_BUSY_NO_VERIFIED_PID
            ps -eo pid,ppid,args | grep -F 'vps-only-loop' | grep -v grep || true
            exit 1
          fi
          normalize_existing_pidfile || true
          if pid_is_factory "$current_pid"; then
            report_factory "$current_pid"
          elif [[ "$current_pid" =~ ^[0-9]+$ ]] && kill -0 "$current_pid" 2>/dev/null; then
            echo FACTORY_PID_NOT_VERIFIED
            ps -p "$current_pid" -o args= || true
            exit 1
          else
            if [[ "$recovery_authorized" != "true" || "$offhost_backup_verified" != "true" ]]; then
              echo FACTORY_AUTOSTART_BLOCKED_RECOVERY_GATE
              exit 0
