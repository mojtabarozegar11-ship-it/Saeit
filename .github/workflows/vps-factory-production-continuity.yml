name: VPS Factory Production Continuity
on:
  # Legacy factory continuity never runs source-patching or stop commands
  # from schedule, push, PR, or commit-message tags. Separate existing
  # system-health workflow retains its reviewed hourly read-only schedule.
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only audit, authorized recovery, or authorized pause
        required: true
        type: choice
        options:
          - audit
          - recover
          - pause
        default: audit
      recovery_authorized:
        description: Owner has authorized a one-time factory loop recovery
        required: true
        type: boolean
        default: false
      offhost_backup_verified:
        description: Restorable off-host backup was independently verified
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: saeit-vps-factory-continuity
  cancel-in-progress: false
jobs:
  # A manual dispatch lacking both owner assertions must FAIL, not silently
  # turn green because the mutating recovery job was skipped.
  blocked-unapproved-recovery:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && ((inputs.operation != 'audit' && inputs.operation != 'recover' && inputs.operation != 'pause') || (inputs.operation != 'audit' && (github.actor != 'mojtabarozegar11-ship-it' || inputs.recovery_authorized != true || inputs.offhost_backup_verified != true))) }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse unapproved factory recovery
        shell: bash
        run: |
          echo "FACTORY_RECOVERY_GATE=BLOCKED_MISSING_OWNER_APPROVAL_OR_VERIFIED_BACKUP"
          exit 1

  pause-loop-low-disk:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'mojtabarozegar11-ship-it' && inputs.operation == 'pause' && inputs.recovery_authorized == true && inputs.offhost_backup_verified == true }}"
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 3
    steps:
      - name: Gracefully pause only the verified loop when free disk is below reserve
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/factory-pause"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/known"
          chmod 600 "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          ssh -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/factory-runtime"
          ops="$root/operations"
          script="$ops/vps-only-loop.sh"
          pidfile="$ops/vps-only-loop.pid"
          free_bytes="$(df -B1 --output=avail "$root" | awk 'NR==2 {print $1}')"
          [[ "$free_bytes" =~ ^[0-9]+$ ]]
          echo "FACTORY_PAUSE_FREE_BYTES=$free_bytes"
          if (( free_bytes >= 536870912 )); then
            echo FACTORY_PAUSE_SKIPPED_DISK_ABOVE_RESERVE
            exit 0
          fi
          pid="$(cat "$pidfile" 2>/dev/null || true)"
          if ! [[ "$pid" =~ ^[0-9]+$ ]] || ! test -r "/proc/$pid/cmdline"; then
            echo FACTORY_PAUSE_NO_VERIFIED_PID
            exit 1
          fi
          if [[ "$(stat -c %u "/proc/$pid")" != "$(id -u)" ]] || ! tr '\0' ' ' < "/proc/$pid/cmdline" | grep -Fq -- "$script"; then
            echo FACTORY_PAUSE_PID_IDENTITY_MISMATCH
            exit 1
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo FACTORY_PAUSE_PROCESS_ALREADY_EXITED
            exit 0
          fi
          kill -TERM "$pid"
          echo FACTORY_PAUSE_TERM_SENT=true
          for attempt in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo FACTORY_PAUSE_LOOP_STOPPED=true
              exit 0
            fi
            sleep 1
          done
          echo FACTORY_PAUSE_LOOP_STOPPED=false
          exit 1
          REMOTE

  audit-readonly:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'audit' }}"
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read current factory VPS disk, cron, process and database state
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/factory-audit"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/known"
          chmod 600 "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          ssh -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/factory-runtime"
          test -d "$root" && test ! -L "$root"
          free_bytes="$(df -B1 --output=avail "$root" | awk 'NR==2 {print $1}')"
          disk_size_bytes="$(df -B1 --output=size "$root" | awk 'NR==2 {print $1}')"
          disk_used_bytes="$(df -B1 --output=used "$root" | awk 'NR==2 {print $1}')"
          inode_free="$(df -Pi "$root" | awk 'NR==2 {print $4}')"
          ram_total_kb="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          [[ "$free_bytes" =~ ^[0-9]+$ && "$disk_size_bytes" =~ ^[0-9]+$ && "$disk_used_bytes" =~ ^[0-9]+$ && "$inode_free" =~ ^[0-9]+$ && "$ram_total_kb" =~ ^[0-9]+$ ]]
          echo FACTORY_AUDIT_FILESYSTEM_SIZE_BYTES="$disk_size_bytes"
          echo FACTORY_AUDIT_FILESYSTEM_USED_BYTES="$disk_used_bytes"
          echo FACTORY_AUDIT_FREE_BYTES="$free_bytes"
          echo FACTORY_AUDIT_RAM_TOTAL_KB="$ram_total_kb"
          echo FACTORY_AUDIT_INODES_FREE="$inode_free"
          echo FACTORY_AUDIT_RESERVE_BYTES="$((512*1024*1024))"
          python3 -c '
          import os, subprocess, sys
          root = sys.argv[1]
          sudo_available = subprocess.run(["sudo", "-n", "true"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False).returncode == 0
          prefix = ["sudo", "-n"] if sudo_available else []
          def scan(path, seconds):
              return subprocess.run(
                  prefix + ["timeout", str(seconds) + "s", "du", "-x", "--max-depth=1", "-B1", "--null", path],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False,
              )
          print("FACTORY_AUDIT_PRIVILEGED_READ_AVAILABLE=" + str(sudo_available).lower())
          result = scan(root, 20)
          totals = {"application": 0, "operations": 0, "runtime_data": 0, "temporary": 0, "backups": 0, "other": 0}
          names = {"django-app": "application", "operations": "operations", "var": "runtime_data", "tmp": "temporary", "backups": "backups"}
          for record in result.stdout.split(bytes([0])):
              if not record:
                  continue
              try:
                  size, path = record.split(bytes([9]), 1)
                  path_text = os.fsdecode(path.rstrip(bytes([47])))
                  if path_text == root.rstrip("/"):
                      continue
                  name = os.path.basename(path_text)
                  totals[names.get(name, "other")] += int(size)
              except (ValueError, OSError):
                  continue
          for key, value in totals.items():
              print(f"FACTORY_AUDIT_USAGE_{key.upper()}_BYTES={value}")
          print("FACTORY_AUDIT_USAGE_SCAN_COMPLETE=" + str(result.returncode == 0).lower())
          if sudo_available:
              fs = scan("/", 30)
              fs_totals = {"home": 0, "var": 0, "usr": 0, "opt": 0, "root": 0, "tmp": 0, "system": 0, "other": 0}
              fs_names = {"home": "home", "var": "var", "usr": "usr", "opt": "opt", "root": "root", "tmp": "tmp", "etc": "system", "lib": "system", "lib64": "system", "bin": "system", "sbin": "system", "boot": "system", "snap": "system"}
              for record in fs.stdout.split(bytes([0])):
                  if not record:
                      continue
                  try:
                      size, path = record.split(bytes([9]), 1)
                      path_text = os.fsdecode(path.rstrip(bytes([47])))
                      if not path_text:
                          continue
                      name = os.path.basename(path_text)
                      fs_totals[fs_names.get(name, "other")] += int(size)
                  except (ValueError, OSError):
                      continue
              for key, value in fs_totals.items():
                  print(f"FACTORY_AUDIT_FILESYSTEM_TOP_{key.upper()}_BYTES={value}")
              print("FACTORY_AUDIT_FILESYSTEM_TOP_SCAN_COMPLETE=" + str(fs.returncode == 0).lower())
          else:
              print("FACTORY_AUDIT_FILESYSTEM_TOP_SCAN_COMPLETE=not_authorized")
          ' "$root"
          current="$(mktemp /tmp/factory-audit-cron.XXXXXX)"
          trap 'rm -f -- "$current"' EXIT
          crontab -l > "$current" 2>/dev/null || : > "$current"
          echo FACTORY_AUDIT_CRON_MASTER_TAGS="$(grep -Ec 'SAEIT_MASTER_AGENT_V1|SAEIT_FACTORY_EVERY_MINUTE_V1|SAEIT_FACTORY_LIFECYCLE_12_V1' "$current" || true)"
          echo FACTORY_AUDIT_CRON_LEECH_TAGS="$(grep -Ec 'LEECH|leech' "$current" || true)"
          echo FACTORY_AUDIT_CRON_OTHER_LINES="$(grep -Ec -v 'SAEIT_MASTER_AGENT_V1|SAEIT_FACTORY_EVERY_MINUTE_V1|SAEIT_FACTORY_LIFECYCLE_12_V1' "$current" || true)"
          ops="$root/operations"
          script="$ops/vps-only-loop.sh"
          pidfile="$ops/vps-only-loop.pid"
          pid="$(cat "$pidfile" 2>/dev/null || true)"
          if [[ "$pid" =~ ^[0-9]+$ ]] && test -r "/proc/$pid/cmdline" && tr '\0' ' ' < "/proc/$pid/cmdline" | grep -Fq -- "$script"; then
            echo FACTORY_AUDIT_LOOP_STATUS=verified_running
            echo FACTORY_AUDIT_LOOP_ELAPSED_SECONDS="$(ps -p "$pid" -o etimes= | tr -d ' ')"
          else
            echo FACTORY_AUDIT_LOOP_STATUS=not_verified_running
          fi
          log="$ops/vps-only-factory.log"
          if test -f "$log" && test ! -L "$log"; then
            echo FACTORY_AUDIT_LOOP_LOG_BYTES="$(stat -c %s "$log")"
            echo FACTORY_AUDIT_LOOP_LOG_AGE_SECONDS="$(( $(date +%s) - $(stat -c %Y "$log") ))"
            echo FACTORY_AUDIT_LOCK_ERRORS_LAST_500="$(tail -n 500 "$log" | grep -c -F 'database is locked' || true)"
            echo FACTORY_AUDIT_TICK_FAILURES_LAST_500="$(tail -n 500 "$log" | grep -c -F 'TICK_EXIT_FAILURE' || true)"
          else
            echo FACTORY_AUDIT_LOOP_LOG_STATUS=missing_or_unsafe
          fi
          cd "$root/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
          "$root/.venv/bin/python" -B -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings"); import django; django.setup(); from django.conf import settings; from pathlib import Path; from django.db import connection; from core.models import AgentTask, FactoryRun, Product; db=settings.DATABASES["default"]; engine=db["ENGINE"]; print("FACTORY_AUDIT_DB_ENGINE_KIND="+("sqlite" if engine.endswith("sqlite3") else "non_sqlite")); source=Path(db["NAME"]) if engine.endswith("sqlite3") else None; present=bool(source and source.is_file() and not source.is_symlink()); print("FACTORY_AUDIT_DB_FILE_STATUS="+("present" if present else "unsafe_or_missing")); print("FACTORY_AUDIT_DB_BYTES="+str(source.stat().st_size if present else "unavailable")); cursor=connection.cursor() if engine.endswith("sqlite3") else None; cursor.execute("PRAGMA journal_mode") if cursor else None; print("FACTORY_AUDIT_SQLITE_JOURNAL_MODE="+str(cursor.fetchone()[0]) if cursor else "FACTORY_AUDIT_SQLITE_JOURNAL_MODE=not_applicable"); cursor.execute("PRAGMA busy_timeout") if cursor else None; print("FACTORY_AUDIT_SQLITE_BUSY_TIMEOUT_MS="+str(cursor.fetchone()[0]) if cursor else "FACTORY_AUDIT_SQLITE_BUSY_TIMEOUT_MS=not_applicable"); print("FACTORY_AUDIT_AGENT_TASK_ROWS="+str(AgentTask.objects.count())); print("FACTORY_AUDIT_FACTORY_RUN_ROWS="+str(FactoryRun.objects.count())); print("FACTORY_AUDIT_PRODUCT_ROWS="+str(Product.objects.count()))'
          echo FACTORY_AUDIT_READ_ONLY=true
          REMOTE

  ensure:
    # This job patches deployed Python and may start the factory. Only an
    # owner-authorized manual event with a verified backup may run it.
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'mojtabarozegar11-ship-it' && inputs.operation == 'recover' && inputs.recovery_authorized == true && inputs.offhost_backup_verified == true }}"
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 8
    steps:
      - name: Ensure one running factory loop and report actual production progress
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "LOCAL_FAILURE line=$LINENO exit=$rc"; exit "$rc"' ERR
          umask 077
          test -n "$VPS_KEY"
          echo VPS_KEY_PRESENT
          d="$RUNNER_TEMP/vps-factory"; mkdir -p "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          chmod 600 "$d/key"
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/known"
          chmod 600 "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          echo VPS_HOSTKEY_VERIFIED
          ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          trap 'rc=$?; echo "REMOTE_FAILURE line=$LINENO exit=$rc"; exit "$rc"' ERR
          base="$HOME/factory-runtime"
          ops="$base/operations"
          script="$ops/vps-only-loop.sh"
          pidfile="$ops/vps-only-loop.pid"
          log="$ops/vps-only-factory.log"
          test -x "$script"
          cd "$base/django-app"
          "$base/.venv/bin/python" - <<'PATCH'
          from pathlib import Path
          import ast, os
          path = Path("core/management/commands/factory_staging_tick.py")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("FACTORY_DIAGNOSTIC_SOURCE_UNSAFE")
          source = path.read_text(encoding="utf-8")
          old = '                self.stderr.write(f"FACTORY_RUN_ERROR run={run.run_id} type={type(exc).__name__}")'
          new = '                frames = ">".join(f"{Path(frame.filename).name}:{frame.lineno}:{frame.name}" for frame in __import__("traceback").extract_tb(exc.__traceback__))[-400:]\n                self.stderr.write(f"FACTORY_RUN_ERROR run={run.run_id} type={type(exc).__name__} frames={frames}")'
          if old in source:
              updated = source.replace(old, new, 1)
              ast.parse(updated, filename=str(path))
              backup = path.with_name(path.name + ".pre-frame-diagnostic")
              if not backup.exists():
                  backup.write_text(source, encoding="utf-8")
                  os.chmod(backup, path.stat().st_mode & 0o777)
              temp = path.with_name(path.name + ".diagnostic-tmp")
              temp.write_text(updated, encoding="utf-8")
              os.chmod(temp, path.stat().st_mode & 0o777)
              os.replace(temp, path)
              print("FACTORY_BOUNDED_FRAME_DIAGNOSTIC_INSTALLED")
          elif 'FACTORY_RUN_ERROR run={run.run_id} type={type(exc).__name__} frames={frames}' in source:
              print("FACTORY_BOUNDED_FRAME_DIAGNOSTIC_ALREADY_INSTALLED")
          else:
              raise SystemExit("FACTORY_DIAGNOSTIC_SOURCE_MISMATCH")
          PATCH
          "$base/.venv/bin/python" - <<'FIX'
          from pathlib import Path
          import ast, os
          path = Path("core/management/commands/factory_staging_tick.py")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("FACTORY_FIX_SOURCE_UNSAFE")
          source = path.read_text(encoding="utf-8")
          lines = source.splitlines(keepends=True)
          remove = {"factory=True,", "run_id=run.run_id,", "goal=run.goal,"}
          counts = {target: sum(line.strip() == target for line in lines) for target in remove}
          if all(counts[target] == 1 for target in remove):
              updated = "".join(line for line in lines if line.strip() not in remove)
          elif all(counts[target] == 0 for target in remove):
              updated = source
              print("FACTORY_UNSUPPORTED_CALL_OPTIONS_ALREADY_REMOVED")
          else:
              raise SystemExit("FACTORY_FIX_CALLSITE_MISMATCH")
          updated = updated.replace("Path(frame.filename).name", "frame.filename.rsplit('/', 1)[-1]")
          ast.parse(updated, filename=str(path))
          backup = path.with_name(path.name + ".pre-vps-options-fix")
          if not backup.exists():
              backup.write_text(source, encoding="utf-8")
              os.chmod(backup, path.stat().st_mode & 0o777)
          temp = path.with_name(path.name + ".fix-tmp")
          temp.write_text(updated, encoding="utf-8")
          os.chmod(temp, path.stat().st_mode & 0o777)
          os.replace(temp, path)
          print("FACTORY_UNSUPPORTED_CALL_OPTIONS_FIXED")
          print("FACTORY_FRAME_LOGGER_FIXED")

          FIX
          # Trigger immediate post-patch factory progress snapshot.
          recovery_authorized='${{ inputs.recovery_authorized }}'
          offhost_backup_verified='${{ inputs.offhost_backup_verified }}'
          grep -q 'FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider' "$script"
          echo VPS_FACTORY_PREFLIGHT_OK
          report_database_state() {
            echo FACTORY_READ_ONLY_QUEUE_DIAGNOSTICS
            cd "$base/django-app"
            export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
            export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
            "$base/.venv/bin/python" - <<'PY'
          import json, os, re
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          # Read-only SQLite contention diagnostics. Never print DATABASE_URL,
          # credentials, the database name or private task payloads.
          from django.conf import settings
          from django.db import connection
          from pathlib import Path
          engine=settings.DATABASES["default"]["ENGINE"]
          print("FACTORY_DB_ENGINE_KIND="+("sqlite" if engine.endswith("sqlite3") else "non_sqlite"))
          if engine.endswith("sqlite3"):
              timeout=settings.DATABASES["default"].get("OPTIONS",{}).get("timeout",5)
              print("FACTORY_SQLITE_CONFIGURED_BUSY_TIMEOUT_SECONDS="+str(timeout))
              with connection.cursor() as cursor:
                  cursor.execute("PRAGMA journal_mode")
                  print("FACTORY_SQLITE_JOURNAL_MODE="+str(cursor.fetchone()[0]))
                  cursor.execute("PRAGMA busy_timeout")
                  print("FACTORY_SQLITE_ACTUAL_BUSY_TIMEOUT_MS="+str(cursor.fetchone()[0]))
              for name in ("core/management/commands/factory_staging_tick.py",
                           "core/management/commands/seed_factory_agents.py"):
                  file=Path(name)
                  if file.is_file() and not file.is_symlink():
                      rows=file.read_text(encoding="utf8").splitlines()
                      points=[i for i,row in enumerate(rows)
                              if "seed_factory_agents" in row or "atomic" in row
                              or "transaction" in row or "retry" in row.lower()]
                      print("FACTORY_SOURCE_SIGNALS="+file.name+":"+
                            ",".join(str(i+1)+":"+rows[i].strip()[:120] for i in points[:20]))
          # Bounded private-runtime control-flow inspection; credentials and payloads excluded.
          for file_name, low, high in (
              ("core/management/commands/factory_staging_tick.py", 15, 180),
              ("core/management/commands/seed_factory_agents.py", 32, 68),
          ):
              file = Path(file_name)
              if file.is_file() and not file.is_symlink():
                  for line_no, line in enumerate(file.read_text(encoding="utf-8").splitlines(), 1):
                      if low <= line_no <= high:
                          if re.search(r"(?i)(password|secret|token|api_key|private_key)", line):
                              continue
                          print(f"FACTORY_CODE_WINDOW {file.name}:{line_no}:{line[:150]}")
          import inspect
          from django.core.management import call_command
          try:
              from core.management.commands.autonomous_master_loop import Command as MasterCommand
              signature = inspect.signature(MasterCommand.handle)
              accepted = sorted(name for name, param in signature.parameters.items()
                                if name != "self" and param.kind not in
                                (inspect.Parameter.VAR_POSITIONAL, inspect.Parameter.VAR_KEYWORD))
              passed = {"factory", "run_id", "goal", "max_steps"}
              print("FACTORY_MASTER_HANDLE_ACCEPTED_OPTIONS=" + ",".join(accepted))
              print("FACTORY_MASTER_HANDLE_UNSUPPORTED_CALL_OPTIONS=" + ",".join(sorted(passed - set(accepted))))
              print("FACTORY_MASTER_HANDLE_HAS_VAR_KW=" + str(any(
                  param.kind == inspect.Parameter.VAR_KEYWORD for param in signature.parameters.values())).lower())
              print("FACTORY_DJANGO_CALL_COMMAND_SIGNATURE=" + str(inspect.signature(call_command)))
              print("FACTORY_MASTER_HANDLE_SIGNATURE=" + str(signature))
              method_lines, first_line = inspect.getsourcelines(MasterCommand.handle)
              for offset, line in enumerate(method_lines[:180]):
                  if re.search(r"(?i)(password|secret|token|api_key|private_key)", line):
                      continue
                  print(f"FACTORY_MASTER_HANDLE_CODE {first_line + offset}:{line.rstrip()[:180]}")
          except Exception as exc:
              print("FACTORY_MASTER_HANDLE_INSPECTION_ERROR=" + type(exc).__name__)
          from django.apps import apps
          pattern = re.compile(r"(factory|task|queue|probe|opportun|evidence|research|workflow|schedule|job|run)", re.I)
          for model in apps.get_app_config("core").get_models():
              if pattern.search(model.__name__) or pattern.search(model._meta.db_table):
                  try:
                      print(f"FACTORY_MODEL_COUNT {model._meta.label}={model.objects.count()}")
                  except Exception as exc:
                      print(f"FACTORY_MODEL_COUNT_ERROR {model._meta.label}={type(exc).__name__}")
          for model_name in ("FactoryRun", "Product", "AgentTask"):
              model = apps.get_model("core", model_name)
              safe_fields = [field.name for field in model._meta.concrete_fields
                             if field.name in {"status", "state", "stage", "phase", "recipe", "product_code", "run_type"}]
              print("FACTORY_SAFE_STATE_FIELDS " + model_name + "=" + ",".join(safe_fields))
              for field_name in safe_fields:
                  try:
                      from django.db.models import Count
                      rows = list(model.objects.values(field_name).annotate(n=Count("pk")).order_by(field_name)[:20])
                      print("FACTORY_SAFE_STATE_COUNTS " + model_name + "." + field_name + "=" +
                            json.dumps(rows, sort_keys=True, default=str))
                  except Exception as exc:
                      print("FACTORY_SAFE_STATE_COUNT_ERROR " + model_name + "." + field_name + "=" + type(exc).__name__)
          path = os.path.join(os.path.dirname(os.path.dirname(__file__)) if "__file__" in globals() else ".", "var/factory/discovery/latest.json")
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              print("FACTORY_DISCOVERY_KEYS=" + ",".join(sorted(k for k in data if isinstance(k, str))[:40]))
              for key in ("status", "stage", "opportunity_count", "evidence_count", "pending_evidence_count", "waiting_for_evidence"):
                  value = data.get(key)
                  if isinstance(value, (str, int, float, bool)) or value is None:
                      print(f"FACTORY_DISCOVERY_{key.upper()}={value}")
          except FileNotFoundError:
              print("FACTORY_DISCOVERY_FILE_MISSING")
          except Exception as exc:
              print(f"FACTORY_DISCOVERY_READ_ERROR={type(exc).__name__}")
          PY
          }
          pid_is_factory() {
            [[ "$1" =~ ^[0-9]+$ ]] &&
              kill -0 "$1" 2>/dev/null &&
              [[ "$(stat -c %u "/proc/$1" 2>/dev/null)" == "$(id -u)" ]] &&
              tr '\0' ' ' < "/proc/$1/cmdline" | grep -Fq -- "$script"
          }
          normalize_existing_pidfile() {
            local raw original tmp
            raw="$(cat "$pidfile" 2>/dev/null || true)"
            original="$raw"
            if [[ "$raw" == *'\n' ]]; then
              raw="$(printf '%s' "$raw" | sed 's/\\n$//')"
            fi
            if pid_is_factory "$raw"; then
              if [[ "$raw" != "$original" ]]; then
                tmp="$pidfile.tmp.$BASHPID"
                (umask 077; printf '%s\n' "$raw" > "$tmp")
                mv -f -- "$tmp" "$pidfile"
                echo FACTORY_PIDFILE_LITERAL_BACKSLASH_N_REPAIRED
              fi
              current_pid="$raw"
              return 0
            fi
            current_pid=""
            return 1
          }
          report_factory() {
            local fpid="$1"
            echo FACTORY_LOOP_ALIVE
            echo "FACTORY_PID=$fpid"
            ps -p "$fpid" -o etime=,args= | sed 's/^/FACTORY_PROCESS=/'
            if command -v pstree >/dev/null 2>&1; then pstree -ap "$fpid" | head -n 30 | sed 's/^/FACTORY_PROCESS_TREE=/'; else ps -o pid,ppid,stat,etime,args --ppid "$fpid" | sed 's/^/FACTORY_PROCESS_CHILD=/'; fi
            grep -nE 'trap|while|manage.py|factory_staging_tick|sleep|flock|wait|kill|exec' "$script" | head -n 60 | sed 's/^/FACTORY_LOOP_CONTROL_SOURCE=/'
            if test -f "$log"; then
              printf 'FACTORY_LOG_MTIME=%s\\n' "$(stat -c %y "$log")"
