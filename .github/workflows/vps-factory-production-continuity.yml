              printf 'FACTORY_AGENT_SEED_NO_WRITE_LAST_500=%s\n' "$(tail -n 500 "$log" | grep -c -F 'FACTORY_AGENT_SEED_HEALTHY_NO_WRITE' || true)"
              printf 'FACTORY_AGENT_SEED_REFRESH_LAST_500=%s\n' "$(tail -n 500 "$log" | grep -c -F 'FACTORY_AGENT_SEED_REFRESHED' || true)"
              printf 'FACTORY_SQLITE_LOCK_ERRORS_LAST_500=%s\n' "$(tail -n 500 "$log" | grep -c -F 'database is locked' || true)"
              printf 'FACTORY_TICK_FAILURES_LAST_500=%s\n' "$(tail -n 500 "$log" | grep -c -F 'TICK_EXIT_FAILURE' || true)"
            else
              echo FACTORY_LOG_MISSING
            fi
            report_database_state
          }
          exec 9>"$ops/vps-only-launch-v2.lock"
          if ! flock -n 9; then
