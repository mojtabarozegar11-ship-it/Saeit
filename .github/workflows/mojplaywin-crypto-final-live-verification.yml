name: MojPlayWin live ETH TRX service checkout status (READ ONLY)
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths: [.github/workflows/mojplaywin-crypto-final-live-verification.yml]
permissions:
  contents: read
jobs:
  status:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"


      - name: Verify real PHP entrypoint and protected websites without sending funds
        shell: bash
        run: |
          set -euo pipefail
          base=https://mojplaywin.com
          for route in /checkout/crypto/index.php /checkout/crypto/ /store/ /farnaz/; do
            code="$(curl -sS --retry 1 --retry-delay 2 --max-time 18 -o "$RUNNER_TEMP/live-page" -w '%{http_code}' "$base$route")"
            echo "LIVE_ROUTE_STATUS_${route//[^[:alnum:]]/_}=$code"
            test "$code" = 200
            if [ "$route" = /checkout/crypto/index.php ]; then
              grep -q 'MojPlayWin secure payments' "$RUNNER_TEMP/live-page"
              grep -q 'TRON mainnet' "$RUNNER_TEMP/live-page"
              grep -q 'Ethereum mainnet' "$RUNNER_TEMP/live-page"
            fi
          done
          for route in /checkout/crypto/bootstrap.php /checkout/crypto/index.php?id=invalid; do
            code="$(curl -sS --retry 1 --retry-delay 2 --max-time 18 -o "$RUNNER_TEMP/denied" -w '%{http_code}' "$base$route")"
            echo "DENIED_CRYPTO_ROUTE_HTTP_STATUS=$code"
            test "$code" = 404
          done
      - name: Read merchant isolated payment state and dedicated cron without changing data
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import json,sqlite3,subprocess
          from pathlib import Path
          root=Path('/home/zomorod2/.mojplaywin-crypto-payments-v1')
          script=Path('/home/zomorod2/mojplaywin.com/checkout/crypto/index.php')
          if script.is_symlink() or not script.is_file() or root.is_symlink():
              raise SystemExit('Unsafe payment gateway file or private storage.')
          enabled=(root/'enabled.flag').is_file()
          if not enabled:
              raise SystemExit('Gateway is not enabled.')
          uri=(root/'payments.sqlite3').as_uri().replace('file://','file:')+'?mode=ro'
          db=sqlite3.connect(uri,uri=True,timeout=3)
          kinds=dict(db.execute('SELECT status,COUNT(*) FROM invoices GROUP BY status').fetchall())
          allowed={'awaiting_payment','confirming','paid'}
          if not set(kinds).issubset(allowed):raise SystemExit('Invalid invoice state detected.')
          cmd=subprocess.run(['crontab','-l'],capture_output=True,timeout=12,text=True)
          if cmd.returncode!=0:raise SystemExit('Dedicated cron listing unavailable.')
          matches=[line for line in cmd.stdout.splitlines() if not line.lstrip().startswith('#') and '/mojplaywin.com/checkout/crypto/index.php reconcile' in line]
          if len(matches)!=1:raise SystemExit('Expected exactly one crypto reconciliation cron entry.')
          if not matches[0].strip().startswith('*/3 '):raise SystemExit('Unrecognized automatic reconciliation cadence.')
          print(json.dumps({
            'main_domain_payment_gateway_enabled':enabled,
            'independent_private_database_present':True,
            'automatic_chain_reconciliation_every_minutes':3,
            'invoices_waiting_for_payment':kinds.get('awaiting_payment',0),
            'invoices_waiting_for_confirmations':kinds.get('confirming',0),
            'paid_invoices_count':kinds.get('paid',0),
            'real_money_transfer_test_completed':False,
            'store_products_auto_delivery_test_completed':False,
            'other_sites_changed':False,
            'production_data_modified_by_this_check':False,
          },sort_keys=True))
          PY
