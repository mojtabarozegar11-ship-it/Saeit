name: Inspect isolated banknew backend route (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/banknew-route-readiness-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banknew-route-observation
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Observe only banknew route and isolated Python capabilities
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import importlib.util, os, sys
          root=Path('/home/zomorod2/mojplaywin.com')
          page=root/'banknew'
          assert root.is_dir() and not root.is_symlink(), 'EXPECTED_ROOT_MISSING'
          assert page.is_dir() and not page.is_symlink(), 'BANKNEW_PAGE_MISSING'
          guard=page/'.htaccess'
          policy=guard.read_text(encoding='utf-8') if guard.is_file() and not guard.is_symlink() else ''
          print('BANKNEW_STATIC_HTML='+str((page/'index.html').is_file()))
          print('BANKNEW_STATIC_JS='+str((page/'app.js').is_file()))
          print('BANKNEW_HAS_LOCAL_HTACCESS='+str(bool(policy)))
          print('BANKNEW_PASSENGER_DISABLED='+str('PassengerEnabled off' in policy))
          print('BANKNEW_HAS_LOCAL_WSGI='+str((page/'passenger_wsgi.py').is_file()))
          print('BANKNEW_LOCAL_AUTH_ROUTE_DIR='+str((page/'auth').is_dir()))
          print('BANKNEW_HOST_PYTHON='+str(sys.version_info.major)+'.'+str(sys.version_info.minor))
          print('BANKNEW_HOST_DJANGO_AVAILABLE='+str(importlib.util.find_spec('django') is not None))
          print('BANKNEW_ISOLATED_API_MOUNT_CONFIGURED='+str((page/'auth'/'passenger_wsgi.py').is_file()))
          print('BANKNEW_CONTENT_ROOT_WRITABLE='+str(os.access(page,os.W_OK)))
          print('READ_ONLY_NO_CONFIG_OR_CUSTOMER_DATA_EMITTED=YES')
          PY
      - name: Remove temporary relay credentials
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/mpw-structure-ssh"; then
            find "$RUNNER_TEMP/mpw-structure-ssh" -type f -exec shred -u -- {} +
            rmdir "$RUNNER_TEMP/mpw-structure-ssh"
          fi
