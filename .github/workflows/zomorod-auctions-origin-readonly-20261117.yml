name: Zomorod auction live route origin forensic read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zomorod-auctions-origin-readonly-20261117.yml'
permissions:
  contents: read
concurrency:
  group: zomorod-auctions-origin-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 10
    steps:
      - name: Authenticate with existing verified factory to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-auction-route-audit"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 127.0.0.1 > "$d/vps.known" 2>/dev/null
          test -s "$d/vps.known"
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 127.0.0.1
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          ssh -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2'
          echo AUCTIONS_ORIGIN_RELAY=verified
      - name: Inspect routing descriptors and auction paths without mutating cPanel
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zomorod-auction-route-audit/config" saeit-cpanel python3 -B - <<'PY'
          from pathlib import Path
          import json, subprocess, os, re
          home=Path("/home/zomorod2"); root=home/"public_html"
          def metadata(p):
              try:
                  if p.is_symlink(): return "SYMLINK"
                  if p.is_file(): return "FILE size="+str(p.stat().st_size)
                  if p.is_dir(): return "DIRECTORY"
                  return "ABSENT"
              except OSError as e: return "STAT_ERROR "+type(e).__name__
          print("ORIGIN_ACCOUNT", os.geteuid(), os.getenv("USER"), flush=True)
          paths=[
              root,root/".htaccess",root/"index.html",root/"index.php",
              root/"auctions",root/"auctions/index.html",root/"auctions/index.php",
              root/"sitemap-auctions.xml",
              home/"Saeit",home/"Saeit/.htaccess",home/"Saeit/passenger_wsgi.py",
              home/"Saeit/public/auctions",home/"Saeit/core/templates/core/auctions.html",
              home/"Saeit/config/urls.py",
              home/"Saeit-staging", home/"Saeit-staging/public/auctions",
          ]
          for n in (346,347,348,349,350):
              paths.append(root/f"auctions/{n}")
              paths.append(root/f"auctions/{n}/index.html")
          for p in paths:
              print("ORIGIN_PATH",str(p),metadata(p),flush=True)
          for name in ("public_html","Saeit","Saeit-staging"):
              p=home/name
              if p.is_dir() and not p.is_symlink():
                  dirs=sorted(q.name for q in p.iterdir() if q.is_dir() and not q.is_symlink())
                  print("ORIGIN_DIR_LIST",name,dirs[:90], "count",len(dirs),flush=True)
          ht=root/".htaccess"
          if ht.is_file() and not ht.is_symlink():
              lines=ht.read_text(errors="replace").splitlines()
              safe=[]
              for line in lines:
                  s=line.strip()
                  if re.match(r"^(Passenger(?:AppRoot|BaseURI|Enabled|StartupFile|AppType)|DirectoryIndex|RewriteEngine|RewriteBase|RewriteRule|RewriteCond|SetHandler)\b",s,re.I):
                      if any(x in s.lower() for x in ("token","key=","secret","password","authorization")):
                          safe.append("[redacted directive]")
                      else: safe.append(s[:230])
              print("ORIGIN_ROUTING_DIRECTIVES",json.dumps(safe[:55],ensure_ascii=False),flush=True)
              print("ORIGIN_HTACCESS_SHA256",__import__("hashlib").sha256(ht.read_bytes()).hexdigest(),flush=True)
          # DomainInfo is authoritative for cPanel domain mapping; never assume public routes are regular files.
          cmd=subprocess.run(["uapi","--output=json","DomainInfo","domains_data"],capture_output=True,text=True,timeout=30)
          print("ORIGIN_UAPI_EXIT",cmd.returncode,flush=True)
          if cmd.returncode==0:
              o=json.loads(cmd.stdout); hits=[]
              def walk(x):
                  if isinstance(x,dict):
                      d=x.get("domain") or x.get("servername")
                      p=x.get("documentroot") or x.get("document_root") or x.get("docroot")
                      if isinstance(d,str) and "zomorodmelal" in d.lower():
                          hits.append({"domain":d,"documentroot":p})
                      for v in x.values():walk(v)
                  elif isinstance(x,list):
                      for v in x:walk(v)
              walk(o)
              print("ORIGIN_UAPI_DOMAIN_MATCHES",json.dumps(hits,ensure_ascii=False),flush=True)
          # Minimal bounded read-only route pattern check in existing app source.
          for p in (home/"Saeit/config/urls.py",home/"Saeit/core/commerce_views.py"):
              if p.is_file() and not p.is_symlink() and p.stat().st_size<1000000:
                  text=p.read_text(errors="replace")
                  matched=[ln[:180].strip() for ln in text.splitlines() if "auction" in ln.lower() or "مزایده" in ln][:15]
                  print("ORIGIN_APP_AUCTION_REFERENCES",str(p),json.dumps(matched,ensure_ascii=False),flush=True)
          PY
      - name: Purge transient authentication material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-auction-route-audit"
