name: Factory C170+C171 owner process and app registry (READ ONLY)
on:
  pull_request:
    paths:
      - 'scripts/factory_c170_owner_proc_footprint_readonly.py'
      - 'tests/test_factory_c170_owner_proc_footprint_readonly.py'
      - 'scripts/factory_c171_passenger_uapi_readonly.py'
      - 'tests/test_factory_c171_passenger_uapi_readonly.py'
      - 'docs/factory_c171_passenger_registry_readonly.md'
      - '.github/workflows/factory-c170-owner-proc-footprint-readonly.yml'
permissions:
  contents: read
concurrency:
  group: factory-c170-owner-proc-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  one_owner_readonly_preflight:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: SHA-pinned C170 20 + C171 32 offline identity and privacy tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -L scripts/factory_c170_owner_proc_footprint_readonly.py
          test ! -L tests/test_factory_c170_owner_proc_footprint_readonly.py
          test "$(git hash-object scripts/factory_c170_owner_proc_footprint_readonly.py)" = '8747858dad6ce46eb06547b38c00ffc87b44f421'
          test "$(git hash-object tests/test_factory_c170_owner_proc_footprint_readonly.py)" = 'fbe8bf98d216c4616233eb4842a5e7462531c832'
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_factory_c170_owner_proc_footprint_readonly.py' -q
          test ! -L scripts/factory_c171_passenger_uapi_readonly.py
          test ! -L tests/test_factory_c171_passenger_uapi_readonly.py
          test "$(git hash-object scripts/factory_c171_passenger_uapi_readonly.py)" = '912ac20c17505767b284e784db2b714889d10d9e'
          test "$(git hash-object tests/test_factory_c171_passenger_uapi_readonly.py)" = '8077c1d1be51dfdd8e23ed4aace976aaac6dccf4'
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_factory_c171_passenger_uapi_readonly.py' -q
      - name: One owner-only cPanel process-name and cwd hint observation
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY" || exit 65
          umask 077
          work="$(mktemp -d -p "$RUNNER_TEMP" c170.owner.XXXXXXXX)"
          trap 'rm -f -- "$work/host.key" "$work/known" "$work/config"; rmdir -- "$work" 2>/dev/null || true' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); sys.stdout.write(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n")' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P '' -f "$work/host.key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$work/known"
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          printf 'Host cpanel\n HostName 178.239.147.125\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/known\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 1\n ForwardAgent no\n RequestTTY no\n' "$work" "$work" > "$work/config"
          chmod 600 "$work/config"
          timeout 35s ssh -T -F "$work/config" cpanel 'test "$(id -un)" = "zomorod2"'
          timeout 80s ssh -T -F "$work/config" cpanel \
            'PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/factory_c170_owner_proc_footprint_readonly.py \
            | python3 -c 'import sys,json; s=sys.stdin.read(11000); p="FACTORY_C170_PROC_FOOTPRINT_READONLY="; a=[v for v in s.splitlines() if v.startswith(p)]; assert len(a)==1,"NO_SANITIZED_RESULT"; d=json.loads(a[0][len(p):]); assert d["schema"]=="factory.cpanel.owner-proc-footprint.readonly.c170.v1" and d["read_only"] is True and d["owner_verified"] is True,"WRONG_OWNER"; assert set(d)=={"schema","read_only","owner_verified","scan_completed","candidate_processes_observed","candidate_staging_cwd_hints","candidate_webroot_cwd_hints","candidate_other_cwd_hints","candidate_cwd_unverified","process_limit_exceeded","proc_scan_limit_exceeded","proc_error_occurred","customer_contents_read","cmdline_read","environ_read","mysql_connected","passenger_live_db_identity_proven","worker_code_identity_proven","complete_media_scope_proven","backup_created","production_modified"}; assert all(d[k] is False for k in ("customer_contents_read","cmdline_read","environ_read","mysql_connected","passenger_live_db_identity_proven","worker_code_identity_proven","complete_media_scope_proven","backup_created","production_modified")); print(a[0]); print("C170_DECISION=PROC_FOOTPRINT_ONLY_NO_DB_IDENTITY_OR_BACKUP")'
          # Second command reuses EXACT authenticated owner SSH session config.
          # Raw Passenger UAPI JSON stays INSIDE owner cPanel Python; only the
          # allowlisted counters/flags traverse encrypted SSH into CI output.
          timeout 80s ssh -T -F "$work/config" cpanel \
            'PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/factory_c171_passenger_uapi_readonly.py \
            | python3 -c 'import sys,json; s=sys.stdin.read(8192); p="FACTORY_C171_PASSENGER_UAPI_READONLY="; a=[v for v in s.splitlines() if v.startswith(p)]; assert len(a)==1,"NO_C171_SAFE_OUTPUT"; d=json.loads(a[0][len(p):]); assert set(d)=={"schema","read_only","owner_verified","uapi_query_completed","registry_status","registered_apps","enabled_apps","staging_app_roots","webroot_app_roots","other_owner_app_roots","outside_owner_app_roots","unverified_app_roots","target_domain_registrations","target_domain_staging_paths","target_domain_webroot_paths","target_domain_other_paths","uapi_response_size_exceeded","uapi_timeout","registered_metadata_not_runtime_attestation","live_passenger_worker_identity_proven","live_database_identity_proven","complete_media_scope_proven","envvars_output","file_contents_read","mysql_connected","current_backup_created","production_modified"},"C171_UNEXPECTED_PROVIDER_FIELDS"; assert d["schema"]=="factory.cpanel.passenger-uapi.readonly.c171.v1" and d["owner_verified"] is True and d["read_only"] is True,"C171_WRONG_OWNER"; assert all(d[k] is False for k in ("envvars_output","file_contents_read","mysql_connected","current_backup_created","production_modified","live_passenger_worker_identity_proven","live_database_identity_proven","complete_media_scope_proven")),"UNSAFE_C171_CLAIM"; print(a[0]); print("C171_DECISION=REGISTRATION_METADATA_ONLY_NO_RUNTIME_DB_OR_BACKUP")'
