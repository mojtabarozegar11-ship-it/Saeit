name: MojPlayWin TRX invoice Android wallet controls responsive production fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-trx-invoice-android-responsive-release-20261026.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-invoice-responsive-isolated
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile guarded invoice renderer patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_trx_invoice_mobile_wallet_layout_20261026.py
      - name: Baseline MojPlayWin customer catalog is healthy
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          for route in ('/store/product/779/','/store/product/72/','/store/product/225/','/store/product/879/','/accounts/login/'):
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=15) as r:status=r.status
              except urllib.error.HTTPError as e:status=e.code
              print('MPW_MOBILE_BASELINE='+json.dumps({'route':route,'status':status}))
              if status!=200:raise RuntimeError('Protected baseline failed '+route)
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-invoice-diag-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Guard exact invoice CSS and no production edits in preflight
        run: |
          set -euo pipefail
          timeout 60s ssh -T -F "$RUNNER_TEMP/mpw-invoice-diag-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - check" < scripts/mpw_trx_invoice_mobile_wallet_layout_20261026.py
      - name: Atomic mobile layout repair with backed-up rollback and live Django tests
        run: |
          set -euo pipefail
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-invoice-diag-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - apply" < scripts/mpw_trx_invoice_mobile_wallet_layout_20261026.py
      - name: Verify purchase and product URLs still function after restart
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          for route in ('/store/product/779/','/store/product/72/','/store/product/225/','/store/product/879/','/commerce/book/779/'):
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=16) as r:
                      status=r.status;final=r.url
              except urllib.error.HTTPError as e:status=e.code;final=e.url
              print('MPW_MOBILE_POST_RELEASE='+json.dumps({'route':route,'status':status,'final':final}))
              if status!=200:raise RuntimeError('Live protected route failed '+route)
          PY
