name: Validate Zomorod source in isolated cPanel staging
on:
  push:
    branches:
      - codex/zomorod-runtime-repair-20261016
    paths:
      - ".github/workflows/zomorod-stage-source-preflight.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-stage-source-preflight
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-stage"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Clone exact tested source into isolated staging and run read only gates
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-stage"
          ssh -F "$d/config" saeit-cpanel bash -se -- "47c38ec3810326790f6f954b515b4f11d59042d1" <<'REMOTE'
          set -Eeuo pipefail
          commit="$1"
          app=/home/zomorod2/Saeit
          backup=/home/zomorod2/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b
          stage="/home/zomorod2/.backups/zomorodmelal-complete/source-preflight-$commit"
          packages="/home/zomorod2/.backups/zomorodmelal-complete/packages-preflight-$commit"
          py=/home/zomorod2/virtualenv/Saeit/3.10/bin/python
          test -s "$backup/public_html.tar.gz" && test -s "$backup/application-source.tar.gz" && test -s "$backup/database-manifest.json"
          test -x "$py" && test -f "$app/manage.py"
          test ! -e "$stage" && test ! -e "$packages"
          git clone --quiet --depth 1 --branch main https://github.com/mojtabarozegar11-ship-it/Saeit.git "$stage"
          actual="$(git -C "$stage" rev-parse HEAD)"
          test "$actual" = "$commit"
          echo "STAGED_SOURCE_COMMIT=$actual"
          if test -f "$app/.env"; then cp -p "$app/.env" "$stage/.env"; chmod 600 "$stage/.env"; echo "STAGED_ENV_COPY=present"; fi
          for name in db.sqlite3 media uploads user_uploads; do
            if test -e "$app/$name"; then cp -a "$app/$name" "$stage/$name"; fi
          done
          mkdir -m 700 "$packages"
          "$py" -m pip install --disable-pip-version-check --no-input --target "$packages" -r "$stage/requirements.txt"
          export PYTHONPATH="$packages:$stage"
          cd "$stage"
          "$py" manage.py check
          "$py" manage.py makemigrations --check --dry-run
          route_result="$("$py" - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.urls import resolve
          required=["/","/industry/","/research/","/agents/","/api/health/","/api/bridge/health/","/admin/login/","/amozeshgah/","/agriculture/livestock/"]
          for route in required:
              match=resolve(route)
              print("STAGED_ROUTE="+route+" VIEW="+match.func.__module__)
          PY
          )"
          printf '%s\n' "$route_result"
          plan="$stage/.migration-plan.txt"
          if "$py" manage.py migrate --plan > "$plan" 2>&1; then
            count="$(grep -c '^    ' "$plan" || true)"
            echo "STAGED_MIGRATION_PLAN_EXIT=0"
            echo "STAGED_PENDING_MIGRATION_LINES=$count"
          else
            echo "STAGED_MIGRATION_PLAN_EXIT=1"
            tail -n 15 "$plan"
          fi
          echo "LIVE_APPLICATION_UNCHANGED=yes"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-stage"
