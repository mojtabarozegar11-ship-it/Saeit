name: Factory agricultural strict QC1000 and immutable repair routing
on:
  pull_request:
    paths:
      - scripts/factory_agri200_strict_qc_20261023.py
      - tests/test_factory_agri200_strict_qc_20261023.py
      - deploy/install_factory_agri200_strict_qc_20261023.sh
      - factory_config/quality_100_criteria.json
      - .github/workflows/factory-agri200-strict-qc-20261023.yml
  push:
    branches: [main]
    paths:
      - scripts/factory_agri200_strict_qc_20261023.py
      - tests/test_factory_agri200_strict_qc_20261023.py
      - deploy/install_factory_agri200_strict_qc_20261023.sh
      - factory_config/quality_100_criteria.json
      - .github/workflows/factory-agri200-strict-qc-20261023.yml
permissions: {contents: read}
concurrency:
  group: factory-agri200-strict-qc
  cancel-in-progress: false
jobs:
  regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate 100 non-compensatory gates, ZIP tampering, immutable repair and no fake approvals
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_factory_agri200_strict_qc_20261023.py' -v
          bash -n deploy/install_factory_agri200_strict_qc_20261023.sh
  private-vps-install:
    needs: regression-tests
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-agri200-strict-qc-20261023]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify pinned VPS identity, install private worker, execute and keep production untouched
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/agri200-strict-qc"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_vps() {
            ssh -T -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 githubops@178.239.147.150 "$@"
          }
          ssh_vps 'test "$(id -un)" = githubops && test -x "$HOME/factory-runtime/.venv/bin/python" && test -f "$HOME/factory-runtime/operations/production-instructions/stage34-autonomous-handoff.py" && test -f "$HOME/factory-runtime/operations/production-instructions/stage5-evidence-workbook.py" && test -d "$HOME/factory-runtime/private/autonomous-product-cycle/production-instructions/stage-05/completed-drafts"'
          target="/home/githubops/factory-runtime/operations/.strict-qc-$GITHUB_RUN_ID"
          ssh_vps "umask 077; test ! -e '$target'; install -d -m 700 '$target/scripts' '$target/tests' '$target/deploy' '$target/factory_config'"
          for file in \
            scripts/factory_stage34_autonomous_handoff_20261023.py \
            scripts/factory_stage5_evidence_workbook_20261023.py \
            scripts/factory_agri200_downloadable_20261023.py \
            scripts/factory_agri200_strict_qc_20261023.py \
            tests/test_factory_stage34_autonomous_handoff_20261023.py \
            tests/test_factory_agri200_strict_qc_20261023.py \
            factory_config/quality_100_criteria.json \
            deploy/install_factory_agri200_strict_qc_20261023.sh; do
            ssh_vps "umask 077; cat > '$target/$file'; chmod 600 '$target/$file'" < "$file"
            expected="$(sha256sum "$file" | awk '{print $1}')"
            ssh_vps "test \"\$(sha256sum '$target/$file' | awk '{print \$1}')\" = '$expected'"
          done
          ssh_vps "timeout 160s /home/githubops/factory-runtime/.venv/bin/python -B -m unittest discover -s '$target/tests' -p 'test_factory_agri200_strict_qc_20261023.py' -v"
          ssh_vps "bash -n '$target/deploy/install_factory_agri200_strict_qc_20261023.sh'"
          ssh_vps "timeout 350s bash '$target/deploy/install_factory_agri200_strict_qc_20261023.sh' '$target/scripts/factory_agri200_strict_qc_20261023.py' '$target/factory_config/quality_100_criteria.json'"
