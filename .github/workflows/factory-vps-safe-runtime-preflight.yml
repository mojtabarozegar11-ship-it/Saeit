name: Factory VPS Safe Runtime Preflight
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-safe-runtime-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Verify database backend, factory dependencies, and available user-space runtimes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          timeout 90 ssh -F "$d/config" saeit-host 'bash -s' <<'REMOTE'
          set -eu
          cd /home/zomorod2/Saeit-staging
          echo ACTIVE_DATABASE_BACKEND_ONLY
          SAEIT_ENV=production DJANGO_SETTINGS_MODULE=config.settings /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c 'import django;django.setup();from django.db import connections;d=connections["default"];print("ENGINE="+d.settings_dict["ENGINE"]);print("DB_ALIAS=default");print("FACTORY_TABLE_COUNT="+str(sum("factory" in t for t in d.introspection.table_names())))' || echo DB_PROBE_FAILED
          echo FACTORY_MANAGEMENT_COMMANDS
          find core/management/commands -maxdepth 1 -name '*factory*' -printf '%f\n' 2>/dev/null | sort | head -30
          echo FACTORY_IMPORT_REFERENCES
          grep -hE '^(from|import) ' core/factory*.py | sort -u | head -90 || true
          echo FACTORY_RUNTIME_STATE_FILE_COUNT
          find var/factory -type f ! -path '*/astra-backups/*' | wc -l
          echo FACTORY_STATE_TOTAL_EXCLUDING_BACKUPS
          du -sk --exclude=astra-backups var/factory | head -1
          REMOTE
          timeout 55 ssh -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -eu
          echo VPS_USERSPACE_RUNTIME_CANDIDATES
          for p in /usr/local/bin/python3.11 /opt/python/bin/python3.11 /home/githubops/.pyenv/shims/python3.11 /home/githubops/miniconda3/bin/python /usr/bin/python3.10 /usr/bin/python3.9; do if test -x "$p"; then "$p" --version; fi; done
          echo VPS_USERSPACE_TOOLS
          for p in curl wget tar gzip git gcc make pip3 docker podman; do command -v "$p" || true; done
          echo VPS_MODULE_BUNDLE_CONTENT
          tar -tzf "$HOME/factory-transfer-incoming/factory-only-modules.tar.gz" | sort
          echo VPS_USER_WRITABLE
          test -w "$HOME" && echo HOME_WRITABLE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
