name: Zomorod broken Persian author route scoped Apache redirect
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-author-redirect-modalias-20261021.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/zomorod-author-redirect-modalias-20261021.yml
permissions: {contents: read}
concurrency:
  group: zomorod-persian-author-redirect-guarded
  cancel-in-progress: false
jobs:
  verify-redirect-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact existing canonical destination and no broad rewrite changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/zomorod-author-redirect-modalias-20261021.yml")
          doc=p.read_text(encoding="utf8")
          rule="RedirectMatch 301 ^/authors/mojtaba-rozegar/?$ https://zomorodmelal.ir/en/authors/mojtaba-rozegar/"
          assert doc.count(rule)==2
          assert not any(line.strip()=="RewriteEngine On" for line in doc.splitlines())
          assert 'AUTHOR_ROUTE_ROLLBACK_VERIFIED' in doc
          print("ZM_AUTHOR_SCOPED_REDIRECT_SOURCE_QA=PASS")
          PY
  deploy:
    needs: verify-redirect-contract
    if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Ensure target English author profile currently serves real content
        run: |
          set -euo pipefail
          code="$(curl -sSL --max-time 25 -o "$RUNNER_TEMP/author-en.html" -w '%{http_code}' "https://zomorodmelal.ir/en/authors/mojtaba-rozegar/")"
          test "$code" = 200
          grep -Fq 'mojtaba-roozegar-official-profile-20261021' "$RUNNER_TEMP/author-en.html"
          echo AUTHOR_EXISTING_ENGLISH_DESTINATION=PASS
      - name: Establish pinned SSH relay to verified cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/author-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -T -F "$d/config" vps 'timeout 10s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo ZM_AUTHOR_PINNED_RELAY=PASS
      - name: Back up exact Apache file and install only one mod_alias redirect
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/author-ssh"
          timeout 70s ssh -T -F "$d/config" cpanel python3 - "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import hashlib,os,sys,tempfile
          run=sys.argv[1]
          assert run.isdigit()
          home=Path("/home/zomorod2")
          assert Path.home()==home
          app=home/"Saeit"
          root=home/"public_html"
          ht=root/".htaccess"
          backup=home/".private-zm-author-redirect"/run
          assert app.is_dir() and root.is_dir() and ht.is_file() and not ht.is_symlink()
          assert not backup.exists() and not backup.is_symlink()
          raw=ht.read_bytes()
          assert b'PassengerAppRoot "/home/zomorod2/Saeit"' in raw, "HOST_APP_MAPPING_DRIFT"
          rule=b'RedirectMatch 301 ^/authors/mojtaba-rozegar/?$ https://zomorodmelal.ir/en/authors/mojtaba-rozegar/'
          assert rule not in raw and b'authors/mojtaba-rozegar' not in raw, "AUTHOR_RULE_CONFLICT"
          backup.mkdir(mode=0o700,parents=True)
          (backup/"original.htaccess").write_bytes(raw)
          os.chmod(backup/"original.htaccess",0o600)
          before=hashlib.sha256(raw).hexdigest()
          updated=rule+b"\n"+raw
          installed=hashlib.sha256(updated).hexdigest()
          (backup/"original.sha256").write_text(before+"\n")
          (backup/"installed.sha256").write_text(installed+"\n")
          fd,tmp=tempfile.mkstemp(prefix=".author-redirect-",dir=str(root))
          try:
              with os.fdopen(fd,"wb") as f:
                  f.write(updated);f.flush();os.fsync(f.fileno())
              os.chmod(tmp,ht.stat().st_mode&0o777)
              assert hashlib.sha256(ht.read_bytes()).hexdigest()==before, "HTACCESS_CHANGED_DURING_RELEASE"
              os.replace(tmp,ht)
          finally:
              if os.path.exists(tmp):os.unlink(tmp)
          assert hashlib.sha256(ht.read_bytes()).hexdigest()==installed
          print("AUTHOR_ONE_RULE_INSTALLED_WITH_BACKUP=PASS")
          PY
      - name: Verify 301 to existing author and site health
        shell: bash
        run: |
          set -euo pipefail
          url="https://zomorodmelal.ir/authors/mojtaba-rozegar/"
          code=000
          for i in 1 2 3 4 5; do
            code="$(curl -sS --max-time 22 -D "$RUNNER_TEMP/author-headers" -o "$RUNNER_TEMP/author-body" -w '%{http_code}' "$url?auth_check=$GITHUB_RUN_ID-$i")"
            test "$code" = 301 && break
            sleep 2
          done
          echo AUTHOR_PUBLIC_REDIRECT_HTTP="$code"
          test "$code" = 301
          grep -iFq 'Location: https://zomorodmelal.ir/en/authors/mojtaba-rozegar/' "$RUNNER_TEMP/author-headers"
          final="$(curl -sSL --max-time 30 -o "$RUNNER_TEMP/author-final" -w '%{http_code}' "$url")"
          test "$final" = 200
          grep -Fq 'mojtaba-roozegar-official-profile-20261021' "$RUNNER_TEMP/author-final"
          for path in / /about/ /company/ /robots.txt /sitemap.xml; do
            health="$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path")"
            test "$health" = 200
          done
          echo AUTHOR_PUBLIC_301_AND_SIBLINGS=PASS
      - name: Restore exact original Apache bytes if verification failed
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/author-ssh"
          timeout 60s ssh -T -F "$d/config" cpanel python3 - "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import hashlib,os,sys,tempfile
          run=sys.argv[1]
          assert run.isdigit()
          root=Path("/home/zomorod2/public_html")
          ht=root/".htaccess"
          evidence=Path("/home/zomorod2/.private-zm-author-redirect")/run
          original=(evidence/"original.htaccess").read_bytes()
          expected=(evidence/"installed.sha256").read_text().strip()
          assert not ht.is_symlink() and hashlib.sha256(ht.read_bytes()).hexdigest()==expected
          assert hashlib.sha256(original).hexdigest()==(evidence/"original.sha256").read_text().strip()
          fd,tmp=tempfile.mkstemp(prefix=".author-rollback-",dir=str(root))
          try:
              with os.fdopen(fd,"wb") as f:
                  f.write(original);f.flush();os.fsync(f.fileno())
              os.chmod(tmp,ht.stat().st_mode&0o777)
              os.replace(tmp,ht)
          finally:
              if os.path.exists(tmp):os.unlink(tmp)
          assert ht.read_bytes()==original
          print("AUTHOR_ROUTE_ROLLBACK_VERIFIED=PASS")
          PY
      - name: Delete temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/author-ssh"
