name: Zomorod treasury private offline SQLite regression
on:
  push:
    branches: [feature/zomorod-erp-treasury-offline-v7-20261029]
    paths:
      - "content/zomorod-business/treasury_control.php"
      - "scripts/zomorod_treasury_synthetic_qa.php"
      - ".github/workflows/zomorod-treasury-offline-ci.yml"
  pull_request:
    paths:
      - "content/zomorod-business/treasury_control.php"
      - "scripts/zomorod_treasury_synthetic_qa.php"
permissions:
  contents: read
jobs:
  pure-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
      - name: Test private treasury approval and baseline payroll in temporary SQLite
        shell: bash
        run: |
          set -euo pipefail
          php -r 'exit(extension_loaded("pdo_sqlite")?0:2);'
          php -l content/zomorod-business/treasury_control.php
          php scripts/zomorod_treasury_synthetic_qa.php
          php scripts/zomorod_payroll_control_synthetic_qa.php
          php scripts/zomorod_workflow_desk_synthetic_qa.php
          python3 scripts/zomorod_workflow_web_synthetic_qa.py
          echo "OFFLINE_TREASURY_AND_BASELINE=PASS"
          echo "LIVE_BANK_OR_ACCOUNTING=NOT_TOUCHED"
