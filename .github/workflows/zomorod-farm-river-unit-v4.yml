name: Farm Dominion River Pulse strategy nine unit tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zomorod-farm-river-unit-v4.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          node --check games/farm-wars-v3/src/main.js
          node --check games/farm-wars-v3/src/strategy.mjs
          node --test games/farm-wars-v3/tests/strategy.test.mjs
