name: cPanel commerce sandbox and smoke archive safeguards READ ONLY
on:
  pull_request:
    paths:
      - .github/workflows/cpanel-commerce-sandboxes-and-smoke-archive-content-20261025.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect staging commerce databases and archived smoke tests for customer-data safety
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-incomplete-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          timeout 420s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,json,tarfile,subprocess,time
          h=Path('/home/zomorod2')
          if os.geteuid()==0 or Path.home()!=h or h.is_symlink():raise SystemExit('UNSAFE_USER')
          ps=subprocess.run(['ps','-u','zomorod2','-o','args='],capture_output=True,text=True,timeout=12)
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=12)
          active=ps.stdout+'\n'+cron.stdout
          out={}
          for name in ['Saeit-staging/moj-commerce-v10-sandbox','Saeit-staging/moj-commerce-v12-sandbox','Saeit-staging/admin-smoke']:
           root=h/name
           if root.is_symlink() or not root.is_dir():raise SystemExit('INVALID_ROOT')
           groups=[]
           for child in sorted(root.iterdir()):
            x={'name':child.name,'active_ref':str(child) in active or child.name in active,'age_days':round((time.time()-child.stat().st_mtime)/86400,1)}
            if child.is_symlink():raise SystemExit('UNSAFE_SYMLINK')
            if child.is_dir():
             files=[]
             for here,dirs,fs in os.walk(child,followlinks=False):
              for nm in fs:
               f=Path(here)/nm
               if f.is_symlink() or not f.is_file():continue
               rel=str(f.relative_to(child))
               files.append((f.stat().st_size,rel))
             x['files']=len(files);x['bytes']=sum(i[0] for i in files)
             x['largest']=sorted(files,reverse=True)[:15]
             x['databases']=[i for i in files if any(q in i[1].lower() for q in ['.db','.sqlite','.sql','.pem','.key','customer','orders'])]
             x['game_product_media_count']=sum(1 for b,nm in files if any(q in nm.lower() for q in ['game','product','media']))
            elif child.is_file():
             x['bytes']=child.stat().st_size
             if name.endswith('admin-smoke') and child.name.endswith('.tar.gz'):
              try:
               with tarfile.open(child,'r:gz') as tf:
                members=tf.getmembers();regular=[m for m in members if m.isfile()]
                x['members']=len(members)
                x['db_members']=[{'name':m.name[:150],'bytes':m.size} for m in regular if any(q in m.name.lower() for q in ['.sqlite','.db','.sql','customer','orders','private'])][:30]
                x['large_members']=[{'name':m.name[:120],'bytes':m.size} for m in sorted(regular,key=lambda z:-z.size)[:6]]
                x['symlinks']=sum(m.issym() or m.islnk() for m in members)
              except Exception as e:x['tar_error']=type(e).__name__
            groups.append(x)
           out[name]=groups
          print('CPANEL_COMMERCE_SMOKE_SAFETY='+json.dumps({'targets':out,'mutations':0},sort_keys=True),flush=True)

          PY
          echo CPANEL_COMMERCE_SMOKE_READONLY=PASS
