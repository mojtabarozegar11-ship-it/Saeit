name: MojPlayWin Field Studio 50 guides and Prism Relay public release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-fieldguides-publish-20261023.yml"
permissions:
  contents: read
concurrency:
  group: mpw-fieldguides-release-20261023
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild and audit 54 original static files plus protected public baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_fieldguides_build_20261023.py scripts/mpw_fieldguides_deploy_20261023.py
          python3 scripts/mpw_fieldguides_build_20261023.py --out "$RUNNER_TEMP/mpw-field-studio/20261023"
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'mpw-field-studio/20261023'
          m=json.loads((root/'release.json').read_text())
          assert m['release_id']=='MPW-FIELDGUIDES-20261023-01' and m['guide_count']==50 and m['stage_count']==150 and len(m['files_sha256'])==53
          assert len(list((root/'guides').glob('*/index.html')))==50
          for name,value in m['files_sha256'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==value
          assert ('if: '+chr(36)+'{{ false }}') in Path('.github/workflows/mojplaywin-main-deploy.yml').read_text()
          host='https://mojplaywin.com'
          for path in ('/','/games/','/products/','/mpw-editorial/index.html','/mpw-editorial/nextwave/20261023/index.html','/mpw-editorial/asset-lab/20261023/index.html'):
              with urllib.request.urlopen(host+path,timeout=20) as r:assert r.status==200,path
              print('UNCHANGED_BEFORE',path)
          try:
              with urllib.request.urlopen(host+'/mpw-editorial/field-guides/20261023/release.json',timeout=20) as r:
                  raise RuntimeError('Existing version conflicts: no overwrite allowed')
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          print('FIELD_STUDIO_CONTENT_AND_PROTECTED_SITE_PREFLIGHT_PASS')
          PY
      - name: Local JavaScript functional tests on independent game and catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8967 --bind 127.0.0.1 --directory "$RUNNER_TEMP/mpw-field-studio/20261023" >/dev/null 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do if curl -fsS -o /dev/null http://127.0.0.1:8967/index.html;then break;fi;sleep 1;done
          chrome="$(command -v google-chrome || command -v chromium)"
          timeout 40s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom 'http://127.0.0.1:8967/prism-relay/index.html?selftest=1' > "$RUNNER_TEMP/game-dom.html" 2>/dev/null
          grep -Fq 'PRISM_RELAY_FUNCTIONAL_TEST_PASS' "$RUNNER_TEMP/game-dom.html"
          grep -Fq 'data-result="pass"' "$RUNNER_TEMP/game-dom.html"
          timeout 40s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom 'http://127.0.0.1:8967/index.html?selftest=1' > "$RUNNER_TEMP/index-dom.html" 2>/dev/null
          grep -Fq 'FIELDGUIDES_SEARCH_SELFTEST_PASS' "$RUNNER_TEMP/index-dom.html"
          grep -Fq 'data-result="pass"' "$RUNNER_TEMP/index-dom.html"
          echo "ORIGINAL_150_STAGE_GAME_AND_50_GUIDE_CATALOG_BROWSER_PASS"
      - name: Establish authorized and fingerprint-pinned VPS SSH relay to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          CPANEL_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-field-ssh";install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$CPANEL_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/cpanel.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/cpanel.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/cpanel.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 10\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/cpanel.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/cpanel.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/cpanel.candidate" "$d/host.known"
          echo "FIELD_STUDIO_PINNED_SSH_RELAY_READY"
      - name: Transfer privately and atomically publish only this new isolated version
        id: install
        shell: bash
        run: |
          set -euo pipefail
          c="$RUNNER_TEMP/mpw-field-ssh/config"
          ssh -T -F "$c" saeit-cpanel "umask 077; mkdir -p /home/zomorod2/.private_mpw_fieldguides_20261023/staging-$GITHUB_RUN_ID"
          tar -cf - -C "$RUNNER_TEMP/mpw-field-studio" 20261023 | ssh -T -F "$c" saeit-cpanel "umask 077; tar -xf - -C /home/zomorod2/.private_mpw_fieldguides_20261023/staging-$GITHUB_RUN_ID"
          ssh -T -F "$c" saeit-cpanel "python3 - install $GITHUB_RUN_ID $GITHUB_SHA" < scripts/mpw_fieldguides_deploy_20261023.py
      - name: Verify each of 54 public files by SHA256 and preserve protected pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,urllib.request
          base='https://mojplaywin.com/mpw-editorial/field-guides/20261023/'
          with urllib.request.urlopen(base+'release.json',timeout=22) as r:
              manifest=json.load(r);assert r.status==200
          assert manifest['release_id']=='MPW-FIELDGUIDES-20261023-01' and manifest['guide_count']==50 and len(manifest['files_sha256'])==53
          for name,expected in manifest['files_sha256'].items():
              with urllib.request.urlopen(base+name,timeout=22) as r:
                  body=r.read(200000);assert r.status==200,name
              assert hashlib.sha256(body).hexdigest()==expected,name
              print('PUBLIC_CONTENT_SHA256_PASS',name)
          for p in ('/','/games/','/products/','/mpw-editorial/nextwave/20261023/index.html','/mpw-editorial/asset-lab/20261023/index.html'):
              with urllib.request.urlopen('https://mojplaywin.com'+p,timeout=22) as r:assert r.status==200,p
          print('FIELD_STUDIO_54_PUBLIC_CONTENT_FILES_VERIFIED')
          PY
      - name: Verify live puzzle and index with mobile and desktop Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium)"
          for mode in mobile desktop; do
            if test "$mode" = mobile; then size="390,844"; else size="1440,900"; fi
            timeout 40s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --window-size="$size" --dump-dom 'https://mojplaywin.com/mpw-editorial/field-guides/20261023/prism-relay/index.html?selftest=1' > "$RUNNER_TEMP/game-$mode.html" 2>/dev/null
            grep -Fq 'PRISM_RELAY_FUNCTIONAL_TEST_PASS' "$RUNNER_TEMP/game-$mode.html"
            grep -Fq 'data-result="pass"' "$RUNNER_TEMP/game-$mode.html"
            timeout 40s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --window-size="$size" --dump-dom 'https://mojplaywin.com/mpw-editorial/field-guides/20261023/index.html?selftest=1' > "$RUNNER_TEMP/index-$mode.html" 2>/dev/null
            grep -Fq 'FIELDGUIDES_SEARCH_SELFTEST_PASS' "$RUNNER_TEMP/index-$mode.html"
            grep -Fq 'data-result="pass"' "$RUNNER_TEMP/index-$mode.html"
            echo "FIELD_STUDIO_LIVE_BROWSER_PASS" "$mode"
          done
      - name: Exact hash-guarded rollback on failed post-install test
        if: failure() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure')
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/mpw-field-ssh/config";then
            ssh -T -F "$RUNNER_TEMP/mpw-field-ssh/config" saeit-cpanel "python3 - rollback $GITHUB_RUN_ID $GITHUB_SHA" < scripts/mpw_fieldguides_deploy_20261023.py
          fi
      - name: Remove runner SSH key material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mpw-field-ssh"
