name: S-01 anonymous checkout controls GET-only evidence
on:
  pull_request:
    paths:
      - scripts/s01_public_checkout_controls_readonly_20261029.cjs
      - .github/workflows/s01-public-checkout-controls-readonly-20261029.yml
permissions: {contents: read}
concurrency:
  group: s01-public-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  observe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate bounded read-only source
        run: node --check scripts/s01_public_checkout_controls_readonly_20261029.cjs
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Observe public storefront without submissions
        run: node scripts/s01_public_checkout_controls_readonly_20261029.cjs
      - name: Save public-only control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-anonymous-checkout-controls
          path: s01-public-checkout-controls.json
          if-no-files-found: warn
          retention-days: 7
