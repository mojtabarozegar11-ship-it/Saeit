name: MOJ PROP C150 terminal buyer consent row-lock proof (NO RELEASE)
on:
  push:
    branches: [fix/mojprop-c150-terminal-consent-rowlock-20261117]
  pull_request:
    branches: [feature/prop-firm-policy-v11-20261114]
    paths:
      - 'prop_firm/lead_models.py'
      - 'tests/test_prop_interest_rowlock_c150_20261117.py'
      - '.github/workflows/mojprop-c150-consent-rowlock-ci.yml'
permissions:
  contents: read
concurrency:
  group: mojprop-c150-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ephemeral-consent-isolation:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: c150-synthetic-only-isolated
      DEBUG: 'true'
      ALLOWED_HOSTS: localhost,127.0.0.1,mojplaywin.com,www.mojplaywin.com
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies (ephemeral only)
        run: python3 -m pip install -r requirements.txt
      - name: Verify configuration / no new migrations
        run: |
          set -euo pipefail
          python3 manage.py check
          python3 manage.py makemigrations --check --dry-run
      - name: Execute synthetic real ORM consent and native guest form regressions
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_prop_interest_rowlock_c150_20261117.py \
            tests/test_moj_prop_interest_intake.py \
            tests/test_moj_prop_browser_form_d.py \
            tests/test_prop_consent_review_orm.py \
            tests/test_prop_plan1_orm_consent_review.py
          echo 'C150_WITHDRAWN_TERMINAL_UNDER_SERIALIZED_SAVE=true'
          echo 'C150_NO_CUSTOMER_POST_PAYMENT_EMAIL_TRADE_DEPLOY=true'
