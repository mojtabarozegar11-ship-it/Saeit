name: Analyze CloudLinux temp and obsolete browser build caches
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-cloudlinux-temp-and-browser-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-cloudlinux-browser-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Check age and directory structure of server temp, old browser and Gradle assets read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,time
          H=Path.home()
          def du(p):
              try:
                  r=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=45)
                  return int(r.stdout.split()[0])*1024 if r.returncode==0 and r.stdout else -1
              except Exception:return -1
          for rel in (".cagefs/tmp",".gradle","browser","mojplaywin-release-20261009-200458","virtualenv",".mpw-proof-backups",".mpw-private-db-backups"):
              root=H/rel
              if not root.is_dir():continue
              print("TEMP_ROOT="+rel+" size="+str(du(root)))
              kids=[]
              for p in root.iterdir():
                  if p.is_symlink():continue
                  kids.append({"name":p.name,"bytes":du(p) if p.is_dir() else p.stat().st_size,"age_days":round((time.time()-p.stat().st_mtime)/86400,1),"type":"directory" if p.is_dir() else "file"})
              for x in sorted(kids,key=lambda a:a["bytes"],reverse=True)[:30]:
                  print("TEMP_CHILD="+json.dumps({"root":rel,**x}))
          proc=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=12)
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=12)
          for mark in ("browser/chromium","browser/node_modules",".gradle","mojplaywin-release-20261009-200458",".cagefs/tmp"):
              print("CACHE_ACTIVITY="+mark+" process="+str(sum(mark in x for x in proc.stdout.splitlines()))+" cron="+str(sum(mark in x for x in cron.stdout.splitlines())))
          print("TEMP_CLASSIFICATION_DONE=yes")
          PY
          REMOTE
      - name: Remove ephemeral ssh material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
