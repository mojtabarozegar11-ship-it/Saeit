name: MojPlayWin backup provenance metadata v6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-provenance:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 8
    env:
      HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare pinned cPanel relay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          work="$RUNNER_TEMP/mpw-provenance-v6"
          install -d -m 700 "$work"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P '' -f "$work/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$work/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$work/config" <<EOF
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $work/host.key
            UserKnownHostsFile $work/host.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 20
            ServerAliveCountMax 3
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          printf '%s
' "$work" > "$RUNNER_TEMP/mpw-provenance-v6-path"

      - name: Read metadata only
        shell: bash
        run: |
          set -euo pipefail
          work="$(cat "$RUNNER_TEMP/mpw-provenance-v6-path")"
          timeout 110s ssh -T -F "$work/config" saeit-cpanel 'python3 -B -' < scripts/mpw_backup_provenance_readonly_20261119_v6.py > "$RUNNER_TEMP/mpw-provenance-v6-output"
          python3 - "$RUNNER_TEMP/mpw-provenance-v6-output" <<'PY'
          import json, sys
          rows = [line for line in open(sys.argv[1], encoding="utf-8")
                  if line.startswith("MPW_BACKUP_PROVENANCE_READONLY=")]
          assert len(rows) == 1
          data = json.loads(rows[0].split("=", 1)[1])
          assert data["read_only"] is True
          assert data["metadata_only"] is True
          assert data["raw_content_read"] is False
          assert data["temporary_files_created"] is False
          assert data["files_deleted"] is False
          assert data["deployment_performed"] is False
          assert data["external_transfer"] is False
          assert data["restore_verified"] is False
          assert data["safe_to_delete"] is False
          assert data["raw_identified"] is True
          assert data["second_identified"] is True
          assert data["error_category"] == "NONE"
          print(rows[0], end="")
          PY

      - name: Confirm no mutation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s
' 'READ_ONLY=1' 'CONTENT_READ=0' 'TEMPORARY_FILES=0' 'DELETION=0' 'DEPLOYMENT=0' 'EXTERNAL_TRANSFER=0' 'RESTORE=0'
