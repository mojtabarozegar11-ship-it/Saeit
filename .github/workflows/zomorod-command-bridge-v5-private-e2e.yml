name: Zomorod command bridge v5 private synthetic E2E
on:
  push:
    branches: [feature/zomorod-command-bridge-v5-private-e2e-20261029]
    paths: [".github/workflows/zomorod-command-bridge-v5-private-e2e.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-private-command-bridge-e2e
  cancel-in-progress: false
jobs:
  isolated-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic cryptographic E2E on CI runner with no production credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_bridge_v5_private_e2e.py
          python3 scripts/test_zomorod_company_private_bridge_v4.py
          python3 scripts/zomorod_bridge_v5_private_e2e.py scripts/zomorod_company_private_bridge_v4.py "$RUNNER_TEMP"
      - name: Connect through pinned VPS to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_PRIVATE_RELAY=verified"






      - name: Run private synthetic E2E on cPanel against deployed code, not business data
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          expected="$(sha256sum scripts/zomorod_company_private_bridge_v4.py | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$expected" <<'REMOTE'
          set -euo pipefail
          p="$HOME/.private/zomorod-business"
          test -d "$p" && test ! -L "$p"
          test -f "$p/company_bridge.py" && test ! -L "$p/company_bridge.py"
          test "$(sha256sum "$p/company_bridge.py" | awk '{print $1}')" = "$1"
          test -f "$p/.company-bridge.key" && test ! -L "$p/.company-bridge.key"
          test -f "$p/command-center.sqlite3" && test ! -L "$p/command-center.sqlite3"
          test "$(stat -c %a "$p/.company-bridge.key")" = 600
          test "$(stat -c %a "$p/command-center.sqlite3")" = 600
          python3 "$p/company_bridge.py" --db "$p/command-center.sqlite3" --key "$p/.company-bridge.key" status
          echo "EXISTING_PRIVATE_BRIDGE_CHECK=PASS"
          REMOTE
          ssh -F "$d/config" saeit-cpanel 'python3 - "$HOME/.private/zomorod-business/company_bridge.py" "$HOME/.private/zomorod-business"' < scripts/zomorod_bridge_v5_private_e2e.py
          echo "REMOTE_SYNTHETIC_BRIDGE_E2E=PASS"
          echo "REAL_CHAT_SIGNER=NOT_CONNECTED"
          echo "RECURRING_AUTOMATION=NOT_CREATED"
      - name: Remove runner SSH relay keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-business-tokenless"
