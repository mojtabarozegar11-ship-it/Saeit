name: MPW 340-topic PHP source read-only diagnostic

on:
  push:
    branches: [audit/mpw-topic-reader-20261106]
    paths:
      - scripts/mpw_topic_reader_diagnostics_20261106.py
      - .github/workflows/mpw-topic-reader-diagnostics-20261106.yml

permissions: {contents: read}
concurrency:
  group: mpw-topic-php-diagnostics
  cancel-in-progress: false

jobs:
  audit-source:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/audit/mpw-topic-reader-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify diagnostic is purely read-only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_topic_reader_diagnostics_20261106.py
          python3 - <<'PY'
          import ast
          source=open('scripts/mpw_topic_reader_diagnostics_20261106.py').read()
          tree=ast.parse(source)
          forbidden=('unlink','write_text','write_bytes','rmdir','mkdir','remove','replace','rename','chmod','chown','system','Popen','run','exec','eval')
          assert not any(isinstance(x,ast.Call) and isinstance(x.func,ast.Attribute) and x.func.attr in forbidden for x in ast.walk(tree))
          print('READ_ONLY_AST_CHECK_PASS')
          PY
      - name: Establish pinned VPS to cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-topic-readonly-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 30s ssh -i "$d/vps.key" -p 22 -o UserKnownHostsFile="$d/vps.known" -o StrictHostKeyChecking=yes -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Audit live topic source structure without modification
        run: |
          set -euo pipefail
          payload="$(base64 -w0 scripts/mpw_topic_reader_diagnostics_20261106.py)"
          timeout 60s ssh -T -F "$RUNNER_TEMP/mpw-topic-readonly-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$payload\"))'"
      - name: Remove temporary SSH credentials
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-topic-readonly-ssh"
          if test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/config"
            rmdir -- "$d"
          fi
