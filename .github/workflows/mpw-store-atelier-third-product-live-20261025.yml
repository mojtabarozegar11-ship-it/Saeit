name: MojPlayWin - publish verified third product on active store
on:
  push:
    branches: [main]
    paths:
      - "scripts/mpw_store_atelier_third_product_discovery_20261025.py"
      - ".github/workflows/mpw-store-atelier-third-product-live-20261025.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-isolated-store-third-product
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact patch scope and current product
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_store_atelier_third_product_discovery_20261025.py
          curl -fsSL --max-time 25 https://mojplaywin.com/store/product/879/ -o "$RUNNER_TEMP/atelier.html"
          grep -Fq 'Atelier Interior' "$RUNNER_TEMP/atelier.html"
          grep -Fq '6.80' "$RUNNER_TEMP/atelier.html"
          curl -fsSL --max-time 25 https://mojplaywin.com/store/ -o "$RUNNER_TEMP/store-before.html"
          grep -Fq 'id="catalog"' "$RUNNER_TEMP/store-before.html"
          grep -Fq 'The Science and Practice of Chess Improvement' "$RUNNER_TEMP/store-before.html"
          grep -Fq 'Taniya and the Little Baker Worms' "$RUNNER_TEMP/store-before.html"
          if grep -Fq 'mpw-atelier-discovery-20261025' "$RUNNER_TEMP/store-before.html"; then
            echo "ALREADY_LIVE_DO_NOT_REPEAT"; exit 1
          fi
          echo "LIVE_PRODUCT_AND_STORE_BASELINE_VERIFIED"
      - name: Configure pinned VPS and isolated cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-atelier-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY_VERIFIED"
      - name: Publish isolated storefront card, verify live and rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-atelier-ssh"
          stage="/home/zomorod2/.mpw-atelier-stage-$GITHUB_RUN_ID"
          installed=0
          cleanup() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$installed" -eq 1; then
              echo "STOREFRONT_SMOKE_FAILED_ATTEMPTING_ROLLBACK"
              ssh -F "$d/config" saeit-cpanel "python3 '$stage/patch.py' rollback '$GITHUB_RUN_ID'" || echo "MANUAL_RECOVERY_REQUIRED"
            fi
            ssh -F "$d/config" saeit-cpanel "rm -rf -- '$stage'" || true
            rm -rf -- "$d"
            exit "$rc"
          }
          trap cleanup EXIT
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && install -d -m 700 '$stage'"
          scp -F "$d/config" scripts/mpw_store_atelier_third_product_discovery_20261025.py "saeit-cpanel:$stage/patch.py"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/patch.py' apply '$GITHUB_RUN_ID'"
          installed=1
          success=0
          for attempt in 1 2 3 4 5; do
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://mojplaywin.com/store/?atelier_release=$GITHUB_RUN_ID&attempt=$attempt" -o "$RUNNER_TEMP/store-after.html" || true
            if python3 - "$RUNNER_TEMP/store-after.html" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text('utf-8')
          assert s.count('id="mpw-atelier-discovery-20261025"')==1
          assert '/store/product/879/?utm_source=mojplaywin' in s
          assert 'Atelier Interior' in s and 'US $6.80' in s
          assert 'The Science and Practice of Chess Improvement' in s
          assert 'Taniya and the Little Baker Worms' in s
          assert 'id="catalog"' in s and 'id="mpw-original-books"' in s
          print('ATELIER_THIRD_PRODUCT_VISIBLE_WITH_TWO_BOOKS')
          PY
            then success=1; break; fi
            sleep 4
          done
          test "$success" -eq 1
          for path in / /store/product/72/ /store/product/225/ /store/product/879/ /mojtaba.roozegar/; do
            code="$(curl -L --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            test "$code" = 200
          done
          code="$(curl -L --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://zomorodmelal.ir/)"
          test "$code" = 200
          echo "MPW_THIRD_PRODUCT_LIVE_WITH_PROTECTED_SITES_HEALTHY"
