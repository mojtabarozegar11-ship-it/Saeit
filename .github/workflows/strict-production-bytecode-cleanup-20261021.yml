name: Strict reproducible production source cache cleanup 2026-10-21
on:
  push:
    branches: [audit/safe-storage-20261021]
    paths: [.github/workflows/strict-production-bytecode-cleanup-20261021.yml]
permissions: {contents: read}
concurrency:
  group: strict-production-bytecode-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assert site health before cache-only cleanup
        run: |
          set -euo pipefail
          for url in https://zomorodmelal.ir/ https://zomorodmelal.ir/agents/ https://mojplaywin.com/ https://mojplaywin.com/games/;do
            code="$(curl -sS -L --max-time 18 -o /dev/null -w '%{http_code}' "$url")"
            echo "PROD_CACHE_BEFORE=$url:$code"
            test "$code" = 200
          done
      - name: Prepare SSH relay pinned to both server identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/prod-bytecode-20261021"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host zm-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host zm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            ProxyJump zm-vps
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 12
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" zm-vps 'timeout 12s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo PROD_CACHE_PINNED_RELAY=yes
      - name: Clear only generated bytecode and test caches under production source
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/prod-bytecode-20261021"
          timeout 155s ssh -T -F "$d/config" zm-host 'python3 -' <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,stat
          h=Path.home()
          root=h/"Saeit"
          assert str(h)=="/home/zomorod2"
          assert root.is_dir() and not root.is_symlink()
          assert (root/"manage.py").is_file()
          protected={"backups","var","media","staticfiles",".venv","node_modules",".git","private"}
          caches={"__pycache__", ".pytest_cache", ".ruff_cache", ".mypy_cache"}
          def active():
              p=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10,check=True)
              markers=("pip install","npm ci","npm install","pytest ","manage.py test","manage.py migrate","collectstatic","git pull","git checkout","rsync ")
              return any(any(mark in line.lower() for mark in markers) for line in p.stdout.splitlines())
          print("PROD_CACHE_SCOPE=GENERATED_SOURCE_CACHE_ONLY",flush=True)
          if active():
              print("PROD_CACHE_SKIP=active_deploy_or_test",flush=True)
          else:
              dev=root.stat().st_dev
              targets=[]
              for base,dirs,files in os.walk(root,followlinks=False):
                  depth=len(Path(base).relative_to(root).parts)
                  keep=[]
                  for name in dirs:
                      p=Path(base)/name
                      if p.is_symlink():continue
                      if name in caches and p.stat().st_dev==dev:
                          if name=="__pycache__":
                              allowed=all(x.is_file() and not x.is_symlink() and x.suffix in {".pyc",".pyo"} for x in p.rglob("*"))
                          else:
                              allowed=all(not x.is_symlink() and x.stat().st_dev==dev for x in p.rglob("*"))
                          if allowed: targets.append(p)
                      elif name not in protected and depth<10 and p.stat().st_dev==dev:
                          keep.append(name)
                  dirs[:]=keep
              assert len(targets)<=350
              size=0
              for p in targets:
                  t=subprocess.run(["du","-sk","--",str(p)],capture_output=True,text=True,timeout=8,check=True)
                  size+=int(t.stdout.split()[0])
              assert size<=50000
              if active():
                  print("PROD_CACHE_SKIP=build_started",flush=True)
              else:
                  n=0
                  for p in targets:
                      assert p.is_dir() and not p.is_symlink() and root.resolve() in p.resolve().parents
                      assert p.stat().st_dev==dev
                      shutil.rmtree(p)
                      assert not p.exists()
                      n+=1
                  print("PROD_CACHE_DIRS_DELETED="+str(n),flush=True)
                  print("PROD_CACHE_ESTIMATED_KB_FREED="+str(size),flush=True)
          print("PROD_CACHE_OPERATION_DONE=yes",flush=True)
          PY
      - name: Assert public health again after cache cleanup
        if: always()
        run: |
          set -euo pipefail
          for url in https://zomorodmelal.ir/ https://zomorodmelal.ir/agents/ https://mojplaywin.com/ https://mojplaywin.com/games/;do
            code="$(curl -sS -L --max-time 18 -o /dev/null -w '%{http_code}' "$url")"
            echo "PROD_CACHE_AFTER=$url:$code"
            test "$code" = 200
          done
      - name: Remove temporary credentials on GitHub runner
        if: always()
        run: |
          d="$RUNNER_TEMP/prod-bytecode-20261021"
          if test -d "$d" && test ! -L "$d";then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/config"
            rmdir -- "$d" || true
          fi
