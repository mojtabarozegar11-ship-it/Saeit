name: Factory VPS backup and disk inventory — owner-only read-only
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: factory-drive-inventory-20261117
  cancel-in-progress: false
jobs:
  inventory:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 1600 &&
      !github.event.issue.pull_request &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'MOJ-FACTORY-VPS-DISK-READONLY-20261117'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 12
    steps:
      - name: Fetch factory backup metadata over pinned SSH from self-hosted factory runner
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/key"
          chmod 600 "$work/key"
          ssh-keygen -y -P '' -f "$work/key" >/dev/null
          target=""
          for host in 127.0.0.1 178.239.147.150; do
            ssh-keyscan -T 5 -p 22 -t rsa "$host" > "$work/known" 2>/dev/null || true
            test -s "$work/known" || continue
            actual="$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)"
            if test "$actual" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then target="$host"; break; fi
          done
          test -n "$target" || { echo FACTORY_SSH_HOST_PIN_UNAVAILABLE; exit 78; }
          timeout 240s ssh -T -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ForwardAgent=no "githubops@$target" 'test "$(id -un)" = githubops && PYTHONDONTWRITEBYTECODE=1 python3 -B -' <<'PY'
          import datetime, hashlib, json, os, pathlib, re, sqlite3, stat
          root=pathlib.Path('/home/githubops/factory-runtime')
          backup=root/'operations'/'backups'
          def status(p):
              try:
                  st=p.lstat()
                  return 'directory' if stat.S_ISDIR(st.st_mode) else 'symlink' if stat.S_ISLNK(st.st_mode) else 'file' if stat.S_ISREG(st.st_mode) else 'other'
              except FileNotFoundError:
                  return 'missing'
          def disk(p):
              try:
                  v=os.statvfs(p)
                  return {'free_bytes':v.f_frsize*v.f_bavail,'total_bytes':v.f_frsize*v.f_blocks}
              except Exception as e:
                  return {'error':type(e).__name__}
          data={'schema':'moj.factory.backup-inventory.v1','read_only':True,'files_deleted':0,'factory_root':status(root),'vps_home_disk':disk('/home/githubops'),'factory_disk':disk(root) if status(root)=='directory' else None,'backup_root':status(backup),'files':[],'counts':{},'known_snapshot_bytes':0}
          pattern=re.compile(r'^master-before-[0-9]{8}T[0-9]{6}Z[.]sqlite3$')
          all_files=[]
          if status(backup)=='directory':
              for p in backup.iterdir():
                  try:
                      st=p.lstat()
                      if not stat.S_ISREG(st.st_mode) or st.st_nlink != 1: continue
                      all_files.append((p,st))
                  except OSError:
                      continue
          snapshots=[(p,st) for p,st in all_files if pattern.fullmatch(p.name)]
          snapshots.sort(key=lambda t:(t[1].st_mtime_ns,t[0].name),reverse=True)
          data['counts']={'regular_files':len(all_files),'master_snapshots':len(snapshots),'other_files':len(all_files)-len(snapshots)}
          data['known_snapshot_bytes']=sum(st.st_size for p,st in snapshots)
          for p,st in snapshots[:25]:
              row={'name':p.name,'bytes':st.st_size,'mtime_utc':datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat(),'sqlite_quick_check':'not_run'}
              # Metadata only: avoid multi-minute SQLite scans in inventory.
              data['files'].append(row)
          data['other_bytes']=sum(st.st_size for p,st in all_files if not pattern.fullmatch(p.name))
          data['backup_dir_disk']=disk(backup) if status(backup)=='directory' else None
          # Low-priority bounded disk usage inventory; never read file contents or remove paths.
          import subprocess
          try:
              p=subprocess.run(['nice','-n','15','du','-x','-B1','-d1','--',str(root)],capture_output=True,text=True,timeout=90,check=False)
              if p.returncode==0:
                  observed={}
                  for line in p.stdout.splitlines():
                      amount,sep,path=line.partition('\t')
                      if not sep or not amount.isdigit(): continue
                      name=pathlib.Path(path).name
                      if path==str(root):name='factory_total'
                      if name in {'factory_total','operations','django-app','private','autonomous_factory','.venv','models','warehouse'}:
                          observed[name]=int(amount)
                  data['factory_usage_bytes']=observed
              else:data['factory_usage_bytes']={'state':'incomplete'}
          except (OSError,subprocess.TimeoutExpired):
              data['factory_usage_bytes']={'state':'time_budget'}
          # One-pass bounded home and operations capacity mapping (no contents disclosed).
          def breakdown(path,scope):
              try:
                  p=subprocess.run(['nice','-n','15','du','-x','-B1','-d1','--',str(path)],capture_output=True,text=True,timeout=70,check=False)
                  if p.returncode!=0: return {'status':'incomplete'}
                  rows=[]
                  for line in p.stdout.splitlines():
                      amount,sep,name=line.partition('\t')
                      if not sep or not amount.isdigit() or name==str(path):continue
                      key=pathlib.Path(name).name
                      if scope=='home':
                          category=key if key in {'factory-runtime','.cache','.local','.npm','.config'} else 'other'
                      else:
                          category='backups' if key=='backups' else 'toolchain' if key.startswith('toolchain') else 'logs' if 'log' in key else 'other'
                      rows.append((key,category,int(amount)))
                  totals={}
                  for _,category,n in rows:totals[category]=totals.get(category,0)+n
                  largest=sorted(rows,key=lambda x:x[2],reverse=True)[:8]
                  return {'status':'observed','totals':totals,'top_hashed':[{'id':hashlib.sha256(x[0].encode()).hexdigest()[:12],'category':x[1],'bytes':x[2]} for x in largest]}
              except (OSError,subprocess.TimeoutExpired):
                  return {'status':'time_budget'}
          data['home_usage']=breakdown(pathlib.Path('/home/githubops'),'home')
          data['operations_usage']=breakdown(backup.parent,'operations')
          # Bounded, metadata-only backup subdirectory classification: no content reads.
          def classify_backup_tree(top, limit=12000, max_depth=4):
              if status(top)!='directory':return {'status':'unsafe_or_absent'}
              from collections import defaultdict
              stacks=[(top,0)]
              visited=0
              categories=defaultdict(lambda:{'files':0,'logical_bytes':0,'allocated_bytes':0,'old_files':0,'old_bytes':0})
              kinds=defaultdict(lambda:{'files':0,'logical_bytes':0})
              oldest=9999999999
              now=datetime.datetime.now(datetime.timezone.utc).timestamp()
              errors=0
              while stacks and visited<limit:
                  folder,depth=stacks.pop()
                  if depth>max_depth:continue
                  try:
                      with os.scandir(folder) as it:ents=list(it)
                  except OSError:
                      errors+=1;continue
                  for e in ents:
                      visited+=1
                      if visited>limit:break
                      try:
                          v=e.stat(follow_symlinks=False)
                          if stat.S_ISLNK(v.st_mode):continue
                          if stat.S_ISDIR(v.st_mode):
                              if depth<max_depth:stacks.append((pathlib.Path(e.path),depth+1))
                              continue
                          if not stat.S_ISREG(v.st_mode):continue
                          rel=pathlib.Path(e.path).relative_to(top)
                          bucket=rel.parts[0] if len(rel.parts)>1 else '(root)'
                          b=categories[bucket]
                          b['files']+=1;b['logical_bytes']+=v.st_size
                          b['allocated_bytes']+=getattr(v,'st_blocks',0)*512
                          age=max(0,now-v.st_mtime)
                          if age>14*86400:
                              b['old_files']+=1;b['old_bytes']+=v.st_size
                          suffix=pathlib.Path(e.name).suffix.lower()
                          if suffix in {'.sqlite3','.json','.gz','.tar','.log','.zip','.f01enc'}:category=suffix
                          else:category='other'
                          k=kinds[category];k['files']+=1;k['logical_bytes']+=v.st_size
                      except (OSError,ValueError):errors+=1
              entries=[{'id':hashlib.sha256(k.encode()).hexdigest()[:12],'root' :k=='(root)',**v} for k,v in categories.items()]
              entries.sort(key=lambda x:x['logical_bytes'],reverse=True)
              return {'status':'complete' if not stacks and visited<=limit else 'truncated','visited':visited,'errors':errors,'buckets':entries[:16],'suffixes':dict(kinds)}
          data['backup_tree']=classify_backup_tree(backup)
          print('MOJ_FACTORY_BACKUP_INVENTORY='+json.dumps(data,sort_keys=True))
          PY
          echo MOJ_FACTORY_READONLY_AUDIT_COMPLETE=true
