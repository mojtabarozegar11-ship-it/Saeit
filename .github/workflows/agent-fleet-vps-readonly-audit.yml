name: Agent fleet VPS read-only inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saeit-agent-fleet-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shell script syntax
        run: bash -n deploy/audit_agent_fleet_vps_readonly.sh
      - name: Inventory VPS agents without writing to database or schedules
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # Evidence is explicitly stage-labelled. Missing connectivity is not
          # evidence that the VPS runtime is absent or that the key changed.
          if test -z "${VPS_KEY:-}"; then
            echo AGENT_FLEET_PREFLIGHT_FAILURE=credential_unavailable
            exit 2
          fi
          d="$RUNNER_TEMP/agent-fleet-inventory"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known" "$d/ssh.stderr"; rmdir "$d" 2>/dev/null || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          if ! ssh-keygen -y -P '' -f "$d/key" >/dev/null 2>&1; then
            echo AGENT_FLEET_PREFLIGHT_FAILURE=private_key_unusable
            exit 2
          fi
          echo AGENT_FLEET_PREFLIGHT_PRIVATE_KEY=valid_format
          if ! ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null || ! test -s "$d/known"; then
            echo AGENT_FLEET_PREFLIGHT_FAILURE=host_key_scan_unavailable
            echo AGENT_FLEET_RUNTIME_STATUS=unknown_no_ssh_session
            exit 3
          fi
          if ! observed="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"; then
            echo AGENT_FLEET_PREFLIGHT_FAILURE=host_key_unreadable
            exit 3
          fi
          if test "$observed" != 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'; then
            echo AGENT_FLEET_PREFLIGHT_FAILURE=pinned_host_key_mismatch
            echo AGENT_FLEET_RUNTIME_STATUS=unknown_identity_not_verified
            exit 4
          fi
          echo AGENT_FLEET_PREFLIGHT_HOST_KEY=pinned_verified
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          if ssh "${opts[@]}" githubops@178.239.147.150 'bash -s' < deploy/audit_agent_fleet_vps_readonly.sh 2>"$d/ssh.stderr"; then
            echo AGENT_FLEET_RUNTIME_AUDIT=read_only_complete
          else
            status=$?
            if test "$status" -eq 255; then
              if grep -qi 'permission denied' "$d/ssh.stderr"; then
                echo AGENT_FLEET_PREFLIGHT_FAILURE=ssh_authentication_denied
              elif grep -Eqi 'timed out|no route to host|network is unreachable' "$d/ssh.stderr"; then
                echo AGENT_FLEET_PREFLIGHT_FAILURE=ssh_transport_unreachable
              else
                echo AGENT_FLEET_PREFLIGHT_FAILURE=ssh_transport_unknown
              fi
              echo AGENT_FLEET_RUNTIME_STATUS=unknown_no_verified_session
            else
              echo AGENT_FLEET_PREFLIGHT_FAILURE=remote_audit_exit_nonzero
              echo AGENT_FLEET_REMOTE_AUDIT_EXIT_CODE="$status"
              echo AGENT_FLEET_RUNTIME_STATUS=partially_observed_audit_incomplete
            fi
            exit "$status"
          fi
