name: Diagnose Mojtaba Roozegar author route
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-author-route-diagnostics.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-author-route-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned VPS relay and cPanel identity
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-route-diagnostic"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_SAEIT_RELAY_VERIFIED=yes"
      - name: Read route, directory, and local and public HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-route-diagnostic"
          ssh -F "$d/config" saeit-cpanel bash -s <<'REMOTE'
          set -euo pipefail
          route="$HOME/Saeit/config/urls.py"
          public="$HOME/public_html"
          target="$public/authors/mojtaba-rozegar"
          echo "DEPLOYED_DJANGO_ROUTE:"
          grep -n -B 2 -A 2 'authors/mojtaba-rozegar' "$route" || true
          if test -e "$target"; then
            echo "PERSIAN_STATIC_TARGET_EXISTS=yes"
            find "$target" -maxdepth 2 -mindepth 1 -printf '%y %p\n' | head -40
          else
            echo "PERSIAN_STATIC_TARGET_EXISTS=no"
          fi
          echo "AUTHOR_ENGLISH_PAGE_MARKER:"
          grep -o 'mojtaba-roozegar-official-profile-20261021' "$public/en/authors/mojtaba-rozegar/index.html" | head -1
          for path in authors/mojtaba-rozegar/ en/authors/mojtaba-rozegar/; do
            code="$(curl -k -sS --max-time 20 --resolve 'zomorodmelal.ir:443:127.0.0.1' -D "$HOME/.zomorod-route-$RANDOM.headers" -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/$path?route_diagnostic=$(date +%s%N)" || true)"
            echo "ORIGIN_HTTP=$path $code"
          done
          REMOTE
      - name: Remove short-lived SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-route-diagnostic"
