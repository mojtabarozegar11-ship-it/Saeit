name: Diagnose Mojtaba Roozegar author route
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-author-route-diagnostics.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-author-route-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned VPS relay and cPanel identity
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-route-diagnostic"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_SAEIT_RELAY_VERIFIED=yes"
      - name: Read route, directory, and local and public HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-route-diagnostic"
          source_sha="$(sha256sum config/urls.py | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$source_sha" <<'REMOTE'
          set -euo pipefail
          source_sha="$1"
          route="$HOME/Saeit/config/urls.py"
          public="$HOME/public_html"
          target="$public/authors/mojtaba-rozegar"
          echo "DEPLOYED_DJANGO_ROUTE:"
          grep -n -B 2 -A 2 'authors/mojtaba-rozegar' "$route" || true
          echo "DEPLOYED_URLCONF_SHA=$(sha256sum "$route" | awk '{print $1}')"
          echo "SOURCE_URLCONF_SHA=$source_sha"
          sed -n '1,18p' "$route"
          if test -e "$target"; then
            echo "PERSIAN_STATIC_TARGET_EXISTS=yes"
            find "$target" -maxdepth 2 -mindepth 1 -printf '%y %p\n' | head -40
          else
            echo "PERSIAN_STATIC_TARGET_EXISTS=no"
          fi
          echo "AUTHORS_PARENT:"
          ls -la "$public/authors" 2>/dev/null || true
          if test -f "$public/authors/.htaccess"; then
            grep -niE 'authors|Rewrite|Passenger|DirectoryIndex' "$public/authors/.htaccess" || true
          fi
          if test -f "$target/.htaccess"; then
            grep -niE 'authors|Rewrite|Passenger|DirectoryIndex' "$target/.htaccess" || true
          fi
          echo "ROOT_AUTH_REWRITE_RULES:"
          grep -niE 'RewriteEngine|RewriteRule|RewriteCond|PassengerEnabled|PassengerAppRoot|PassengerBaseURI|PassengerPython' "$public/.htaccess" || true
          cd "$HOME/Saeit"
          python="$HOME/virtualenv/Saeit/3.10/bin/python"
          "$python" manage.py shell -c 'from django.test import Client; from django.urls import resolve; p="/authors/mojtaba-rozegar/"; print("DJANGO_RESOLVER_VIEW="+resolve(p).view_name); r=Client().get(p, secure=True, HTTP_HOST="zomorodmelal.ir"); print("DJANGO_CLIENT_STATUS="+str(r.status_code)); print("DJANGO_CLIENT_LOCATION="+str(r.get("Location","")))' 2>&1
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          test -n "$selector"
          "$selector" restart --json --interpreter python --user "$USER" --app-root Saeit >/dev/null
          mkdir -p "$HOME/Saeit/tmp"
          touch "$HOME/Saeit/tmp/restart.txt"
          echo "PASSENGER_TARGETED_RESTART=done"
          echo "AUTHOR_ENGLISH_PAGE_MARKER:"
          grep -o 'mojtaba-roozegar-official-profile-20261021' "$public/en/authors/mojtaba-rozegar/index.html" | head -1
          if test -e "$target"; then
            test -d "$target" && test ! -L "$target"
            first="$(find "$target" -mindepth 1 -maxdepth 1 -print -quit)"
            if test -n "$first"; then
              echo "STALE_ROUTE_DIRECTORY_NOT_EMPTY=refusing_to_remove"
              exit 1
            fi
            rmdir "$target"
            echo "EMPTY_STALE_ROUTE_DIRECTORY_REMOVED=yes"
          else
            echo "EMPTY_STALE_ROUTE_DIRECTORY_REMOVED=already_absent"
          fi
          parent="$public/authors"
          if test -d "$parent"; then
            test ! -L "$parent"
            first="$(find "$parent" -mindepth 1 -maxdepth 1 -print -quit)"
            if test -n "$first"; then
              echo "AUTHORS_PARENT_NOT_EMPTY=refusing_to_remove"
              exit 1
            fi
            rmdir "$parent"
            echo "EMPTY_AUTHORS_PARENT_REMOVED=yes"
          else
            echo "EMPTY_AUTHORS_PARENT_REMOVED=already_absent"
          fi
          REMOTE
          for path in about/ robots.txt sitemap.xml company/; do
            public_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/$path?route_compare=$GITHUB_SHA" || true)"
            echo "PUBLIC_COMPARE_HTTP=$path $public_code"
          done
          headers="$RUNNER_TEMP/author-route.headers"
          body="$RUNNER_TEMP/author-route.html"
          code="$(curl -sS --max-time 25 -D "$headers" -o "$body" -w '%{http_code}' "https://zomorodmelal.ir/authors/mojtaba-rozegar/?route_verify=$GITHUB_SHA" || true)"
          echo "PERSIAN_AUTHOR_PUBLIC_HTTP=$code"
          echo "PUBLIC_DNS="
          getent ahostsv4 zomorodmelal.ir | head -4 || true
          echo "PUBLIC_HEADERS_BEGIN"
          sed -n '1,16p' "$headers"
          echo "PUBLIC_HEADERS_END"
          echo "PUBLIC_BODY_BEGIN"
          head -c 400 "$body" || true
          echo
          echo "PUBLIC_BODY_END"
          final="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "https://zomorodmelal.ir/authors/mojtaba-rozegar/?route_verify=$GITHUB_SHA" || true)"
          echo "PERSIAN_AUTHOR_FINAL_HTTP=$final"
          grep -Fq 'mojtaba-roozegar-official-profile-20261021' "$body" && echo "PUBLIC_PROFILE_MARKER=found" || echo "PUBLIC_PROFILE_MARKER=missing"
          echo "PERSIAN_AUTHOR_ROUTE_DIAGNOSTIC=complete"
      - name: Remove short-lived SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-route-diagnostic"
