name: MojPlayWin final buyer payment and delivery evidence read only 2026-10-20
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-final-real-payment-readonly-20261020.yml"]
# Read-only rerun requested 2026-10-24 to inspect current live checkout and order state.

permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify audit is read-only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_payment_final_readiness_inspector.py
          ! grep -Eq 'objects\.(create|update|delete)|\.save\(|\.delete\(|subprocess\.run|requests\.post|urllib\.request\.urlopen' scripts/mpw_payment_final_readiness_inspector.py
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect real Django checkout and delivery models without altering payments
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_final_readiness_inspector.py
      - name: Inspect real invoice receipt and customer billing routes without data writes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_billing_documents_live_readonly_20261020.py
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_billing_documents_live_readonly_20261020.py
      - name: Reverify the already-published verified download contract from sealed backup
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_live_checkout_status_download_contract_20261020.py
          python3 scripts/mpw_live_checkout_status_download_contract_20261020.py selftest
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify 39436884055" < scripts/mpw_live_checkout_status_download_contract_20261020.py
      - name: Inspect real customer CTA checkout handler, receipt settlement and purchase-page link without data writes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_live_real_buyer_journey_readonly_20261020.py
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_live_real_buyer_journey_readonly_20261020.py
      - name: Inspect low-value TRX order and quote constraints without modifying invoices
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_low_value_trx_invoice_scope_readonly_20261020.py
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_low_value_trx_invoice_scope_readonly_20261020.py
      - name: Inspect small-price test PDF product requirements without server changes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_micro_trx_trial_inventory_readonly_20261020.py
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_micro_trx_trial_inventory_readonly_20261020.py
      - name: Diagnose real Android mobile customer login CSRF cookie and trusted origin without changing server
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_customer_mobile_csrf_403_readonly_20261020.py
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_customer_mobile_csrf_403_readonly_20261020.py
      - name: Diagnose Android customer login CSRF cookies and reverse-proxy headers without changing security settings
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_customer_mobile_csrf_403_readonly_20261020.py
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_customer_mobile_csrf_403_readonly_20261020.py
      - name: Inspect exact live mobile customer 403 form and source without security changes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_customer_mobile_csrf_rootcause_details_readonly_20261020.py
          timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_customer_mobile_csrf_rootcause_details_readonly_20261020.py
      - name: Verify anonymous two-book buyer routes and no false 404
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          base="https://mojplaywin.com"
          for path in ('/store/','/store/product/72/','/store/product/225/','/store/product/72/checkout/','/store/product/225/checkout/'):
              req=urllib.request.Request(base+path,headers={'User-Agent':'MPWPaymentReadonlyCheck/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=17) as r:
                      status=r.status;dest=r.geturl()
              except urllib.error.HTTPError as e:
                  status=e.code;dest=e.geturl()
              print('MPW_CHECKOUT_ANONYMOUS_HTTP='+json.dumps(dict(path=path,status=status,redirected_to_login=('login' in dest.lower()))))
              if status>=500:raise RuntimeError('Checkout server error: '+path)
              if path.startswith('/store/product/') and status==404:raise RuntimeError('Published product checkout is missing')
          print('MPW_PAYMENT_ANONYMOUS_ROUTES_SMOKE=PASS')
          PY
      - name: Inspect isolated micro TRX product prerequisites without writing data
        run: |
          set -euo pipefail
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,inspect,importlib.util,stat
          from pathlib import Path
          from types import SimpleNamespace
          ROOT=Path('/home/zomorod2/Saeit-staging')
          if ROOT.is_symlink() or not ROOT.is_dir():raise RuntimeError("Wrong app root")
          os.chdir(ROOT);sys.path.insert(0,str(ROOT))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,KnowledgeArticle
          from mpw_commerce.buyer_orders import _private_file
          def out(tag,detail):print(tag+'='+json.dumps(detail,sort_keys=True,default=str))
          out('MPW_MICRO_SCHEMA',{'product':[(f.name,f.get_internal_type(),f.null) for f in Product._meta.fields],'article':[(f.name,f.get_internal_type(),f.null) for f in KnowledgeArticle._meta.fields]})
          out('MPW_MICRO_READER',{'file_resolver_source':inspect.getsource(_private_file)[:5500]})
          for pk in (72,225):
              p=Product.objects.select_related('knowledge_article').get(pk=pk)
              m=p.metadata.get('mpw_commerce',{})
              v=Path(_private_file(SimpleNamespace(product=p)))
              out('MPW_MICRO_SOURCE',{'pk':pk,'private_file_exists':v.is_file(),'symlink':v.is_symlink(),
                  'extension':v.suffix,'bytes':v.stat().st_size if v.is_file() else 0,
                  'source_in_home':str(v).startswith('/home/zomorod2/'),
                  'file_parent_writable':os.access(v.parent,os.W_OK),
                  'file_parent_mode':oct(stat.S_IMODE(v.parent.stat().st_mode)),
                  'enabled':m.get('enabled'), 'fulfillment':m.get('fulfillment'),
                  'product_owner_assigned':p.owner_id is not None,
                  'article_published':p.knowledge_article.published if p.knowledge_article_id else False})
          out('MPW_MICRO_PDF_LIBS',{name:bool(importlib.util.find_spec(name)) for name in ('pypdf','PyPDF2','fitz')})
          print('MPW_MICRO_PREFLIGHT_READONLY=PASS')
          PY
      - name: Classify walletless versus legacy cron without touching payments
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,subprocess,inspect
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          if app.is_symlink() or not app.is_dir():raise SystemExit('UNSAFE_APP_ROOT')
          os.chdir(app);sys.path.insert(0,str(app))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from core.models import PaymentIntent
          from mpw_commerce.models import CommerceInvoice
          from django.db.models import Count
          def emit(label,data):print(label+'='+json.dumps(data,sort_keys=True))
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=15,check=False)
          entries=[s for s in cron.stdout.splitlines() if s.strip() and not s.lstrip().startswith('#')]
          walletless=sum(('mpw_walletless' in s or 'mpw_trx_commercial' in s or 'reconcile_commercial_intent' in s) for s in entries)
          legacy=sum(('mpw_commerce_reconcile' in s or 'mpw_commerce_live_inbound_reconciler' in s) for s in entries)
          emit('MPW_P0_SCHEDULER_SCOPE',{'cron_readable':cron.returncode==0,'entry_count':len(entries),'walletless_reconciler_entries':walletless,'legacy_reconciler_entries':legacy,'cron_data_redacted':True})
          rows=list(PaymentIntent.objects.filter(provider='mpw_walletless_trx_v1').values('status').annotate(count=Count('pk')).order_by('status'))
          emit('MPW_P0_ACTIVE_INTENTS',{'provider':'mpw_walletless_trx_v1','status_counts':{r['status']:r['count'] for r in rows}})
          emit('MPW_P0_LEGACY_INVOICES',{'count':CommerceInvoice.objects.count()})
          from services import mpw_trx_commercial_web as web
          fn=getattr(web,'reconcile_commercial_intent_from_candidates',None)
          emit('MPW_P0_RECONCILER_INTERFACE',{'callback_present':callable(fn),'callback_module':getattr(fn,'__module__',None),'parameters':list(inspect.signature(fn).parameters) if callable(fn) else [],'route_callback_present':callable(getattr(web,'_reconcile_invoice',None))})
          try:
              from services.mpw_trx_commercial_chain import read_only_independent_pair
              pair=read_only_independent_pair()
              emit('MPW_P0_TRON_PROVIDERS',{'available':True,'provider_a_type':type(getattr(pair,'identifier_a',None)).__name__,'provider_b_type':type(getattr(pair,'identifier_b',None)).__name__,'no_tx_broadcast':True})
          except Exception as exc:
              emit('MPW_P0_TRON_PROVIDERS',{'available':False,'error_type':type(exc).__name__,'no_tx_broadcast':True})
          print('MPW_P0_PRIVATE_DIAGNOSTIC_READONLY=PASS')
          PY
      - name: Locate exact solidity gateway transport failure without changing payments
        run: |
          set -euo pipefail
          timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,time
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/home/zomorod2/Saeit-staging')
          if root.is_symlink() or not root.is_dir():raise SystemExit('UNSAFE_APP_ROOT')
          os.chdir(root);sys.path.insert(0,str(root))
          from scripts.mpw_tron_public_dual_probe_readonly_20261023 import NODES,get,head_height_and_age
          for idx,provider in enumerate(NODES):
              started=time.monotonic()
              result={'operator_index':idx+1,'solidity_head_valid':False,'read_only':True}
              try:
                  block=get(provider,'head')
                  head_height_and_age(block,datetime.now(timezone.utc))
                  result['solidity_head_valid']=True
              except Exception as exc:
                  result['error_type']=type(exc).__name__
                  if hasattr(exc,'code') and type(exc.code) is int:result['http_status']=exc.code
              result['elapsed_seconds']=round(time.monotonic()-started,2)
              print('MPW_TRON_INDEPENDENT_GATEWAY='+json.dumps(result,sort_keys=True))
          print('MPW_TRON_INDEPENDENT_GATEWAY_SCOPE=READ_ONLY')
          PY
      - name: Check supported same-operator backup Solidity routes without writes
        run: |
          set -euo pipefail
          timeout 82s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,time,urllib.request,urllib.error
          from datetime import datetime,timezone
          candidates=(
              ('publicnode-solidity-post','https://tron-solidity-rpc.publicnode.com/walletsolidity/getnowblock','POST'),
              ('publicnode-full-get','https://tron-rpc.publicnode.com/walletsolidity/getnowblock','GET'),
              ('publicnode-full-post','https://tron-rpc.publicnode.com/walletsolidity/getnowblock','POST'),
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          for label,url,method in candidates:
              result={'route':label,'read_only':True,'fresh_finalized_head':False}
              tick=time.monotonic()
              try:
                  req=urllib.request.Request(url,method=method,
                      data=b'{}' if method=='POST' else None,
                      headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'MojPlayWin-Readonly-Diagnostic/1.0'})
                  with opener.open(req,timeout=12) as h:
                      if h.status!=200 or h.headers.get_content_type()!='application/json':raise ValueError('Invalid RPC metadata')
                      raw=h.read(2_000_001)
                  if len(raw)>2_000_000:raise ValueError('Oversize response')
                  v=json.loads(raw)['block_header']['raw_data']
                  age=datetime.now(timezone.utc).timestamp()-v['timestamp']/1000
                  result['fresh_finalized_head']=(type(v['number']) is int and v['number']>0 and -60<=age<=600)
              except Exception as exc:
                  result['error_type']=type(exc).__name__
                  if hasattr(exc,'code') and type(exc.code) is int:result['http_status']=exc.code
              result['seconds']=round(time.monotonic()-tick,2)
              print('MPW_TRON_PUBLICNODE_BACKUP='+json.dumps(result,sort_keys=True))
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"

