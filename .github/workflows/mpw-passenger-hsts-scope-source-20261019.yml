name: MojPlayWin Passenger HSTS scope safety source inspection
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-passenger-hsts-scope-source-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify which process loads MojPlayWin Django HSTS and all other Passenger apps
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 115s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          python3 - <<'PY'
          import pathlib,json,hashlib,re
          root=pathlib.Path('/home/zomorod2')
          a=root/'mojplaywin.com/passenger_wsgi.py'
          data=a.read_text('utf8','replace')
          print('MPW_PASSENGER_WSGI_SOURCE='+json.dumps({'sha':hashlib.sha256(a.read_bytes()).hexdigest(),
             'code':data[:9000],'bytes':len(data)}))
          conf=root/'Saeit-staging/config/settings.py'
          lines=conf.read_text('utf8','replace').splitlines()
          selected=[{'line':i,'text':s.strip()[:180]} for i,s in enumerate(lines,1)
            if ('env(' in s and any(k in s for k in ('SECURE_HSTS','SECURE_SSL_REDIRECT'))) or 'SILENCED_SYSTEM_CHECKS' in s]
          print('MPW_HSTS_SETTINGS_BINDING='+json.dumps(selected))
          for sibling in ('Saeit-staging-web','Saeit-staging-src','factory.zomorodmelal.ir'):
            file=root/sibling/'passenger_wsgi.py'
            if file.is_file():
              body=file.read_text('utf8','replace')
              print('MPW_PASSENGER_OTHER_ISOLATION='+json.dumps({'dir':sibling,
                'own_wsgi':True,'sha':hashlib.sha256(file.read_bytes()).hexdigest(),
                'imports_same_shared_config':'Saeit-staging' in body,
                'has_hsts_env_override':'SECURE_HSTS_SECONDS' in body}))
          PY
          BASH
