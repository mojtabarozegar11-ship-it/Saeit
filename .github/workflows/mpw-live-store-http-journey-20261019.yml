name: MojPlayWin live storefront user journey and HTTPS audit
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-live-store-http-journey-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Check real public URLs, anonymous access and checkout security headers
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 125s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl
          paths=[('store','/store/'),('product72','/store/product/72/'),
                 ('product225','/store/product/225/'),
                 ('book72','/commerce/book/72/'),
                 ('book225','/commerce/book/225/'),
                 ('checkout72','/store/product/72/checkout/'),
                 ('checkout225','/store/product/225/checkout/'),
                 ('login','/accounts/login/'),('register','/accounts/register/'),
                 ('purchases','/commerce/my-purchases/'),
                 ('dashboard','/staff/command-center/mpw-two-books/'),
                 ('download_unauthorized','/commerce/download/1/'),
                 ('create_order_by_get','/commerce/checkout/order/'),
                 ('invoice_by_get','/commerce/checkout/invoice/'),
                 ('wrong_book','/commerce/book/999999/')]
          for label,path in paths:
            req=urllib.request.Request('https://mojplaywin.com'+path,headers={'User-Agent':'MojPlayWin-external-store-audit','Cache-Control':'no-store'})
            try:
              with urllib.request.urlopen(req,timeout=9) as response:
                data=response.read(125000)
                result={'label':label,'http':response.status,
                  'landed':urllib.parse.urlparse(response.geturl()).path,
                  'mime':response.headers.get('Content-Type','').split(';')[0],
                  'hsts':bool(response.headers.get('Strict-Transport-Security')),
                  'csp':bool(response.headers.get('Content-Security-Policy')),
                  'xframe':bool(response.headers.get('X-Frame-Options')),
                  'nosniff':bool(response.headers.get('X-Content-Type-Options')),
                  'pdf_exposed':data.startswith(b'%PDF-')}
                if label=='store':
                  text=data.decode('utf8','replace')
                  result['buy_button_count']=text.count('class="mpw-crypto-buy"')
                  result['book72_card']='mpw-sale-book72' in text
                  result['book225_card']='mpw-sale-book225' in text
                  result['book72_buy_link']='/commerce/book/72/' in text
                  result['book225_buy_link']='/commerce/book/225/' in text
                print('MPW_LIVE_HTTP_AUDIT='+json.dumps(result))
            except urllib.error.HTTPError as ex:
              print('MPW_LIVE_HTTP_AUDIT='+json.dumps({'label':label,'http':ex.code,
                'landed':urllib.parse.urlparse(ex.geturl()).path}))
            except Exception as exc:
              print('MPW_LIVE_HTTP_AUDIT='+json.dumps({'label':label,'error':type(exc).__name__}))
          PY
          BASH
