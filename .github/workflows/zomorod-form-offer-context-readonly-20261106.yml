name: Readonly Zomorod service topic source structure
on:
  push:
    branches: [audit/zm-form-offer-context-readonly-20261106]
    paths:
      - .github/workflows/zomorod-form-offer-context-readonly-20261106.yml
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate direct cPanel or pinned VPS relay read-only
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-form-topic-ro-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/ask-master/index.php' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/ask-master/index.php' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Inspect only source hash and limited form markup anchors
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 65s ssh -T -F "$RUNNER_TEMP/zm-form-topic-ro-ssh/config" "$COMMAND_HOST" 'python3 -' <<'PY'
          import hashlib, os, re
          from pathlib import Path
          target = Path('/home/zomorod2/public_html/ask-master/index.php')
          if os.geteuid() == 0 or os.geteuid() != target.stat().st_uid or target.is_symlink():
              raise SystemExit('REFUSE_UNSAFE_FORM_SOURCE')
          data = target.read_bytes()
          text = data.decode('utf-8')
          print('FORM_SHA256=' + hashlib.sha256(data).hexdigest())
          print('FORM_BYTES=' + str(len(data)))
          markers = ['zm-ask-master-service-kind-20261106:route',
                     'zm-specialist-intent-20261106:form',
                     '<textarea name="question"', '</textarea>', '</form>',
                     '<label>پرسش شما</label>', 'service_question']
          for marker in markers:
              print('ANCHOR_COUNT=' + marker + ':' + str(text.count(marker)))
          needle = '<textarea name="question"'
          pos = text.find(needle)
          if pos >= 0:
              excerpt = text[max(0,pos-190):pos+460].replace('\r',' ').replace('\n',' ')
              excerpt = re.sub(r'(?i)(password|secret|token|api_key)\s*[:=]\s*[^\s]+',r'\1=[REDACTED]',excerpt)
              print('FORM_MARKUP_NEAR_TEXTAREA=' + repr(excerpt))
          print('FORM_READONLY_INSPECTION_COMPLETE=1')
          PY
