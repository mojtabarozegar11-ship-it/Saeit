name: Zomorod Persian author accurate sitemap lastmod
on:
  pull_request:
    paths:
      - scripts/zomorod_author_sitemap_recency_20261030.py
      - tests/test_zomorod_author_sitemap_recency_20261030.py
      - .github/workflows/zomorod-author-sitemap-recency-20261030.yml
  push:
    branches: [main]
    paths:
      - scripts/zomorod_author_sitemap_recency_20261030.py
      - tests/test_zomorod_author_sitemap_recency_20261030.py
      - .github/workflows/zomorod-author-sitemap-recency-20261030.yml
permissions:
  contents: read
concurrency:
  group: zomorod-persian-author-sitemap-lastmod
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify one entry only and protected sitemap scope
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_author_sitemap_recency_20261030.py
          python3 -m unittest discover -s tests -p 'test_zomorod_author_sitemap_recency_20261030.py' -v
  publish:
    needs: tests
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Backup, atomically correct only the author lastmod, verify live
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          stage="/home/zomorod2/.zm-author-lastmod-$GITHUB_RUN_ID"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 45s scp -q -F "$d/config" scripts/zomorod_author_sitemap_recency_20261030.py "saeit-cpanel:$stage/update.py"
          timeout 180s ssh -T -F "$d/config" saeit-cpanel "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          id="$1"
          script="/home/zomorod2/.zm-author-lastmod-$id/update.py"
          installed=0
          verified=0
          finish() {
            code=$?
            trap - EXIT
            if test "$installed" = 1 && test "$verified" = 0; then
              python3 "$script" rollback --run-id "$id" || echo "SITEMAP_ROLLBACK_REQUIRES_ATTENTION=YES"
            fi
            exit "$code"
          }
          trap finish EXIT
          python3 "$script" check
          installed=1
          python3 "$script" install --run-id "$id"
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import time
          url="https://zomorodmelal.ir/sitemap.xml?_author_lastmod="+str(time.time_ns())
          with urlopen(Request(url,headers={"Cache-Control":"no-cache"}),timeout=30) as r:
              body=r.read(3000000)
              assert r.status==200
          old=b"<loc>https://zomorodmelal.ir/authors/mojtaba-rozegar/</loc><lastmod>2026-10-23</lastmod>"
          new=b"<loc>https://zomorodmelal.ir/authors/mojtaba-rozegar/</loc><lastmod>2026-10-30</lastmod>"
          assert body.count(new)==1, "CURRENT_SITEMAP_TIMESTAMP_NOT_PUBLIC"
          assert body.count(old)==0, "OLD_TIMESTAMP_STILL_PUBLIC"
          from xml.etree import ElementTree
          ElementTree.fromstring(body)
          print("AUTHOR_SITEMAP_PUBLIC_DATE=2026-10-30",flush=True)
          PY
          verified=1
          echo "AUTHOR_SITEMAP_RECENCY_RELEASE=PASS"
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
