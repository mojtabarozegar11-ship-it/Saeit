name: Atelier Interior product 879 strictly scoped live sale and rollback smoke
on:
  push:
    branches: [feature/atelier-sale-readiness-20261021]
    paths:
      - ".github/workflows/atelier-interior-owner-live-sale-20261021.yml"
      - "scripts/atelier_interior_live_sale_activate_20261021.py"
permissions: {contents: read}
concurrency:
  group: atelier-interior-879-live-sale
  cancel-in-progress: false
jobs:
  publish_verified_exact_product:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/atelier-sale-readiness-20261021' &&
      startsWith(github.event.head_commit.message, '[owner-atelier-live-sale-20261021]')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate exact seller scope and available rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/atelier_interior_live_sale_activate_20261021.py selftest
          python3 -m py_compile scripts/atelier_interior_live_sale_activate_20261021.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Record public protected-path baselines
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/atelier-pre-public"
          for p in / /store/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            s="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$p" || true)"
            test "$s" != 000
            printf '%s=%s\n' "$p" "$s" >> "$RUNNER_TEMP/atelier-pre-public"
          done
      - name: Activate only Product 879 after on-host hash and checkout-gate verification
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_live_sale_activate_20261021.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            "ATELIER_REAL_SALE_APPROVAL=owner-2026-10-21 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64' activate"
      - name: Reject broken listing, checkout or anonymous access; preserve site paths
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/atelier-post-public"
          for p in / /store/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            s="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$p" || true)"
            printf '%s=%s\n' "$p" "$s" >> "$RUNNER_TEMP/atelier-post-public"
          done
          cmp "$RUNNER_TEMP/atelier-pre-public" "$RUNNER_TEMP/atelier-post-public"
          listing="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/atelier-public-product.html" -w '%{http_code}' "https://mojplaywin.com/store/product/879/" || true)"
          test "$listing" = 200
          python3 -c 'from pathlib import Path;p=Path("'$RUNNER_TEMP'/atelier-public-product.html").read_text(encoding="utf8",errors="replace");assert "Atelier Interior" in p and ("6.80" in p or "6.8" in p)'
          checkout="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://mojplaywin.com/store/product/879/checkout/" || true)"
          case "$checkout" in 200|302|303) ;; *) echo "BAD_CHECKOUT_HTTP=$checkout";exit 1;; esac
          download="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://mojplaywin.com/commerce/download/879/" || true)"
          test "$download" != 200 && test "$download" != 000
          echo "ATELIER_PUBLIC_PRODUCT_879_SALE_SMOKE=PASS listing=$listing checkout=$checkout anonymous_download=$download"
      - name: Revert exact Product 879 automatically if any release step failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_live_sale_activate_20261021.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            "ATELIER_ROLLBACK_OWNER_SCOPE=owner-2026-10-21 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64' rollback"
