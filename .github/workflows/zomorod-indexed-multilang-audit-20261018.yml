name: Zomorod indexed multilingual read-only audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-indexed-multilang-audit-20261018.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Report root static HTML and language status
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,re,json
          root=Path.home()/'public_html'
          assert root.is_dir() and not root.is_symlink()
          banned={'mohammad','ghanadi','amozeshgah','tala','education','business','site-heritage','static','admin','cgi-bin','private','app'}
          found=[]
          for dp,dirs,files in os.walk(root,followlinks=False):
              base=Path(dp);rel=base.relative_to(root)
              dirs[:]=[d for d in dirs if d not in banned and not d.startswith('.') and not (base/d).is_symlink()]
              if len(rel.parts)>5:dirs[:]=[];continue
              if 'index.html' not in files or (base/'index.html').is_symlink():continue
              p=base/'index.html';s=p.read_text(encoding='utf-8',errors='replace')
              lang=re.search(r'<html\b[^>]*\blang=["\x27]([^"\x27]+)',s,re.I)
              canon=re.search(r'<link\b[^>]*\brel=["\x27]canonical["\x27][^>]*>',s,re.I)
              href=re.search(r'\bhref=["\x27]([^"\x27]+)',canon.group(0),re.I) if canon else None
              found.append(dict(path=str(p.relative_to(root)),lang=lang.group(1) if lang else '?',v7='zm-unified-v7-20261018' in s,v10='data-zm-v10="shared-theme"' in s,bytes=len(s.encode()),canonical=href.group(1) if href else None,hreflangs=re.findall(r'hreflang=["\x27]([^"\x27]+)',s,re.I)))
          print('PAGE_TOTAL',len(found))
          for row in sorted(found,key=lambda r:r['path']):print('PAGE',json.dumps(row,ensure_ascii=False))
          for name in ('robots.txt','sitemap.xml','.htaccess'):
              p=root/name
              print('SEO_FILE',name,'exists=',p.exists(),'bytes=',p.stat().st_size if p.is_file() else 0)
          print('READONLY_AUDIT=PASS')
          PY
      - name: Test public indexed and multilingual routes
        shell: bash
        run: |
          for path in / /about/ /company/ /research/ /industry/ /knowledge/ /agriculture/ /agriculture/genetics/ /robots.txt /sitemap.xml /en/ /ar/ /ru/ /fr/ /tr/ /de/ /es/; do
            s="$(curl -sS -L --connect-timeout 5 --max-time 12 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "PUBLIC_HTTP $path $s"
          done
      - name: Clean temporary keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
