name: Prune 3 verified retired VPS rollback archives without touching factory or stores
on:
  pull_request:
    paths:
      - scripts/prune_verified_retired_factory_rollbacks_20261025.py
      - .github/workflows/prune-verified-retired-factory-rollbacks-20261025.yml
  push:
    branches: [main]
    paths:
      - scripts/prune_verified_retired_factory_rollbacks_20261025.py
      - .github/workflows/prune-verified-retired-factory-rollbacks-20261025.yml
permissions: {contents: read}
concurrency:
  group: saeit-vps-old-rollback-safe-retirement-20261025
  cancel-in-progress: false
jobs:
  prune-only-expired-verified-duplicates:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-prune-three-retired-rollbacks-20261025]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate Python syntax
        run: |
          set -euo pipefail
          python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("scripts/prune_verified_retired_factory_rollbacks_20261025.py").read_text())'
      - name: Verify all three newer restore points and retired archive hashes before any deletion
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/prune-retired-factory-rollbacks"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          command=(PYTHONDONTWRITEBYTECODE=1 python3 -)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo EXPLICIT_OWNER_APPROVAL=APPLY_THREE_ALLOWLISTED_ARCHIVES
            command+=(--apply)
          else
            echo ARCHIVE_RETIREMENT=PREVIEW_READ_ONLY
          fi
          timeout 900s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o TCPKeepAlive=yes githubops@178.239.147.150 "${command[*]}" < scripts/prune_verified_retired_factory_rollbacks_20261025.py
          echo CUSTOMER_ORDERS_STOREFRONTS_PRODUCTION_DB=NOT_TOUCHED
