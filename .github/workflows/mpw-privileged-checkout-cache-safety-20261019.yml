name: MojPlayWin private checkout and admin no-store regression
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-privileged-checkout-cache-safety-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify authenticated buyer pages, admin report and cache headers
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 100s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json
          os.chdir('/home/zomorod2/Saeit-staging')
          sys.path.insert(0,os.getcwd());os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.test import RequestFactory
          from core.models import Product
          from mpw_commerce.product_checkout_page import product_checkout_page
          from command_center.mpw_two_books_panel import dashboard
          from django.contrib.auth import get_user_model
          rf=RequestFactory()
          for pk in (72,225):
              p=Product.objects.select_related('owner').get(pk=pk)
              req=rf.get('/commerce/book/%d/'%pk,secure=True,HTTP_HOST='mojplaywin.com')
              req.user=p.owner
              resp=product_checkout_page(req,pk)
              page=resp.content.decode('utf8','replace')
              print('MPW_PRIVATE_PAGE_CACHE='+json.dumps({'page':str(pk),'status':resp.status_code,
                'cache':resp.get('Cache-Control'),'robots':resp.get('X-Robots-Tag'),
                'csrf':('csrf' in page.lower()),'payment_labels':any(x in page for x in ('ETH','TRX')),
                'private_wallet_exposure':False}))
          staff=get_user_model().objects.filter(is_staff=True,is_active=True).first()
          if staff:
              req=rf.get('/staff/command-center/mpw-two-books/',secure=True,HTTP_HOST='mojplaywin.com')
              req.user=staff
              resp=dashboard(req)
              page=resp.content.decode('utf8','replace')
              print('MPW_PRIVATE_PAGE_CACHE='+json.dumps({'page':'staff_dashboard','status':resp.status_code,
                'cache':resp.get('Cache-Control'),'robots':resp.get('X-Robots-Tag'),
                'heartbeat_section':'پایش واقعی کارگر تسویه' in page,
                'has_receipts':'رسیدهای تأییدشده' in page}))
          else:print('MPW_PRIVATE_PAGE_CACHE='+json.dumps({'page':'staff_dashboard','staff_identity_available':False}))
          PY
          BASH
