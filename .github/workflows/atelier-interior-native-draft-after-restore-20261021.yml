name: Atelier owner-approved native inactive record ONLY after verified isolated restore
on:
  workflow_run:
    workflows: ["MojPlayWin approved GPGv2 compressed MySQL completion and isolated restore 20261021"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: atelier-native-owner-approved-draft-after-restoration
  cancel-in-progress: false
jobs:
  register_exact_inactive_draft:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.id == 39640624346 &&
      github.event.workflow_run.head_sha == '3f05202110b0d401ddff5d82b4b2c9f3a9e9ef9f' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prove strictly inactive, idempotent, exact-priced private draft safety
        run: |
          set -euo pipefail
          python3 -B scripts/atelier_interior_register_native_draft_20261021.py selftest
          python3 -B -m py_compile scripts/atelier_interior_register_native_draft_20261021.py
          test "${{ github.event.workflow_run.id }}" = 39640624346
          test "${{ github.event.workflow_run.conclusion }}" = success
          echo "ATELIER_VERIFIED_ISOLATED_RESTORE_EVENT=PASS"
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Validate both independent AES256 manifests still exist before any Django write
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          script64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 50s ssh -T -F "$d/config" saeit-vps "python3 -c '$call' '$script64' check"
      - name: Register only exact SHA-matched Atelier ZIP as inactive native Product
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_register_native_draft_20261021.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 95s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64'"
      - name: Verify main and child routes remain HTTP200; never switch on public sale
        shell: bash
        run: |
          set -euo pipefail
          for path in / /store/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            test "$code" = 200
          done
          echo "ATELIER_INACTIVE_PRODUCT_SAFE_PATH_HEALTH=PASS"
          echo "ATELIER_PUBLIC_CHECKOUT_STILL_DISABLED=TRUE"
