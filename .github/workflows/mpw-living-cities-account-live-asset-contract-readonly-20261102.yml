name: MojPlayWin account game live asset contract read-only
on:
  pull_request:
    paths:
      - '.github/workflows/mpw-living-cities-account-live-asset-contract-readonly-20261102.yml'
      - 'scripts/mpw_living_cities_account_asset_candidate.py'
      - 'core/tests/test_living_cities_account_asset_candidate.py'
permissions: {contents: read}
concurrency:
  group: mpw-account-asset-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live_source_contract:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mpw-living-cities-account-api-integration-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test exact 20-language account-asset transformation, no publish
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s core/tests -p 'test_living_cities_account_asset_candidate.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m py_compile scripts/mpw_living_cities_account_asset_candidate.py
      - name: Establish host-key-pinned VPS relay to the exact cPanel owner
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Verify exact live game sources in place without changing any files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 85s ssh -T -F "$d/config" host \\
            'PYTHONDONTWRITEBYTECODE=1 python3 -B - check' \\
            < scripts/mpw_living_cities_account_asset_candidate.py
          echo 'MPW_GAME_ACCOUNT_ASSET_LIVE_READONLY_VERIFIED=YES'
          echo 'MPW_GAME_PUBLISH_PERFORMED=NO'
      - name: Remove ephemeral runner-only SSH credentials
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/farm-v4-ssh"
          if [ -d "$d" ]; then
            rm -rf -- "$d"
          fi
