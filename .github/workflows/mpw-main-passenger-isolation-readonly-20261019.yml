name: MojPlayWin main Passenger isolation and safe reload preflight
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-main-passenger-isolation-readonly-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Determine whether refreshing only main-domain Passenger is isolated from sub-sites
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 105s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          python3 - <<'PY'
          import pathlib,json,os,re
          home=pathlib.Path('/home/zomorod2')
          main=home/'mojplaywin.com'
          info={'main_root_exists':main.is_dir(),'main_wsgi':(main/'passenger_wsgi.py').is_file(),
                'main_tmp_restart_dir':(main/'tmp').is_dir(),
                'main_htaccess_passenger':[],'other_wsgi_app_roots':[],
                'main_wsgi_shared_target':False}
          if (main/'.htaccess').is_file():
            for line in (main/'.htaccess').read_text('utf8','replace').splitlines():
              if line.strip().startswith(('PassengerAppRoot','PassengerPython','PassengerEnabled','PassengerBaseURI','PassengerAppType')):
                info['main_htaccess_passenger'].append(line[:190])
          if (main/'passenger_wsgi.py').is_file():
            text=(main/'passenger_wsgi.py').read_text('utf8','replace')
            info['main_wsgi_shared_target']='/home/zomorod2/Saeit-staging' in text
          for child in home.iterdir():
            if not child.is_dir() or child.is_symlink() or child.name.startswith('.'):
              continue
            if child.name in ('Saeit-staging','virtualenv','mail','tmp','logs','etc','ssl','public_ftp','softaculous_backups','trash'):
              continue
            p=child/'passenger_wsgi.py'
            if p.is_file() and child!=main:
              raw=p.read_text('utf8','replace')
              info['other_wsgi_app_roots'].append({'dir':child.name,
                  'same_backend_root':'/home/zomorod2/Saeit-staging' in raw,
                  'has_own_tmp_restart':(child/'tmp').is_dir()})
          info['other_wsgi_app_roots']=info['other_wsgi_app_roots'][:35]
          print('MPW_PASSENGER_ISOLATION='+json.dumps(info))
          PY
          BASH
