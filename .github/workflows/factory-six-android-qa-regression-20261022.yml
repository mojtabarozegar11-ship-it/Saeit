name: Private Android emulated-evidence regression
on:
  push:
    branches: [feature/six-device-and-independent-qa-evidence-20261022]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Fake APK/phone proof must be rejected
        run: |
          python3 -B -m py_compile scripts/factory_android_emulator_runtime_check.py scripts/factory_six_native_candidate_bundle.py scripts/factory_six_native_independent_rework.py
          python3 -B -m unittest discover -s tests -p test_factory_android_emulator_evidence.py -v
          python3 -B -m unittest discover -s tests -p test_factory_six_native_independent_rework.py -v
