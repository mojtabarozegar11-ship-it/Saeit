name: Moj messaging - cPanel egress feasibility (read only)
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths: ['.github/workflows/moj-messaging-cpanel-egress-probe-20261028.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare cPanel outbound TLS with pinned jump SSH, no site changes
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          d="$(mktemp -d "$RUNNER_TEMP/mmsg-egress-probe.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 35s ssh -i "$d/vps.key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o ConnectTimeout=10 githubops@178.239.147.150 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          chmod 600 "$d/"*.known
          printf '%s\n' "Host vps" " HostName 178.239.147.150" " User githubops" " IdentityFile $d/vps.key" " UserKnownHostsFile $d/vps.known" " StrictHostKeyChecking yes" "Host panel" " HostName zohal.pws-dns.net" " Port 1396" " User zomorod2" " IdentityFile $d/host.key" " UserKnownHostsFile $d/host.known" " StrictHostKeyChecking yes" " ProxyJump vps" "Host *" " BatchMode yes" " IdentitiesOnly yes" " ForwardAgent no" " ConnectTimeout 10" > "$d/config"
          mapfile -t WA_IPS < <(python3 - <<'PY'
          import socket,ipaddress
          infos=socket.getaddrinfo('web.whatsapp.com',443,socket.AF_INET,socket.SOCK_STREAM)
          ips=list(dict.fromkeys(a[4][0] for a in infos if ipaddress.ip_address(a[4][0]).is_global))
          for ip in ips[:2]: print(ip)
          PY
          )
          test "${#WA_IPS[@]}" -gt 0
          timeout 70s ssh -F "$d/config" panel python3 - "${WA_IPS[@]}" <<'PY'
          import socket,ssl,sys,ipaddress
          def probe(host,label):
              try:
                  infos=socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_STREAM)
                  ips=list(dict.fromkeys(v[4][0] for v in infos if ipaddress.ip_address(v[4][0]).is_global))
              except Exception as exc:
                  print('MMSG_PANEL_'+label+'_DNS='+type(exc).__name__,flush=True)
                  return False
              print('MMSG_PANEL_'+label+'_DNS='+('PUBLIC' if ips else 'NO_PUBLIC_IP'),flush=True)
              for ip in ips[:2]:
                  try:
                      with socket.create_connection((ip,443),timeout=7) as raw:
                          with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                              print('MMSG_PANEL_'+label+'_TLS=PASS_'+str(tls.version()),flush=True)
                              return True
                  except Exception as exc:
                      print('MMSG_PANEL_'+label+'_TLS=FAIL_'+type(exc).__name__,flush=True)
              return False
          wa=probe('web.whatsapp.com','WA')
          via_runner=False
          for ip in sys.argv[1:3]:
              if not ipaddress.ip_address(ip).is_global: raise SystemExit('Unsafe address rejected')
              try:
                  with socket.create_connection((ip,443),timeout=7) as raw:
                      with ssl.create_default_context().wrap_socket(raw,server_hostname='web.whatsapp.com') as tls:
                          print('MMSG_PANEL_WA_RUNNER_IP_TLS=PASS_'+str(tls.version()),flush=True)
                          via_runner=True
                          break
              except Exception as exc:
                  print('MMSG_PANEL_WA_RUNNER_IP_TLS=FAIL_'+type(exc).__name__,flush=True)
          gh=probe('github.com','GITHUB')
          good=wa or via_runner
          print('MMSG_PANEL_EGRESS_CANDIDATE='+('PASS' if good else 'NO'),flush=True)
          print('MMSG_PANEL_SITE_FILES_UNCHANGED=PASS',flush=True)
          sys.exit(0 if good else 1)
          PY
