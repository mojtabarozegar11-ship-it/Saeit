name: MojPlayWin live authenticated checkout CSP security acceptance
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-live-authenticated-csp-acceptance-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Validate true HTTPS sessions, checkout policies and protected delivery, no purchases
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 150s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,re,base64,hashlib,urllib.request,urllib.error,urllib.parse
          root='/home/zomorod2/Saeit-staging'
          os.chdir(root);sys.path.insert(0,root);os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.conf import settings
          from django.contrib.auth import SESSION_KEY,BACKEND_SESSION_KEY,HASH_SESSION_KEY
          from django.contrib.sessions.backends.db import SessionStore
          from core.models import Product,OrderItem
          from mpw_commerce.models import CommerceInvoice,CommerceReceipt
          before={'orders':OrderItem.objects.filter(product_id__in=(72,225)).count(),
                  'invoices':CommerceInvoice.objects.count(),'receipts':CommerceReceipt.objects.count()}
          p=Product.objects.select_related('owner').get(pk=72)
          assert p.owner_id and p.owner.is_active
          session=SessionStore()
          session[SESSION_KEY]=str(p.owner.pk)
          session[BACKEND_SESSION_KEY]=settings.AUTHENTICATION_BACKENDS[0]
          session[HASH_SESSION_KEY]=p.owner.get_session_auth_hash()
          session.save()
          reports=[]
          try:
            for pk in (72,225):
              req=urllib.request.Request('https://mojplaywin.com/commerce/book/'+str(pk)+'/',headers={
                'Cookie':settings.SESSION_COOKIE_NAME+'='+session.session_key,
                'Cache-Control':'no-cache',
                'User-Agent':'MPW-two-book-security-audit-20261019'})
              with urllib.request.urlopen(req,timeout=13) as response:
                body=response.read(100000)
                path=urllib.parse.urlparse(response.geturl()).path
                assert response.status==200 and path=='/commerce/book/'+str(pk)+'/'
                meta=re.search(rb'<meta http-equiv="Content-Security-Policy" content="([^"]+)">',body)
                assert meta and b"default-src 'none'" in meta.group(1) and b"connect-src 'self'" in meta.group(1)
                matches={}
                for tag in (b'script',b'style'):
                  v=re.findall(b'<'+tag+b'(?:\\s[^>]*)?>(.*?)</'+tag+b'\\s*>',body,re.I|re.S)
                  assert len(v)==1
                  expected=b"'sha256-"+base64.b64encode(hashlib.sha256(v[0]).digest())+b"'"
                  matches[tag.decode()]=expected in meta.group(1)
                assert all(matches.values())
                assert b'Ethereum mainnet' in body and b'TRON mainnet' in body
                assert 'no-store' in response.headers.get('Cache-Control','')
                assert 'max-age=86400' in response.headers.get('Strict-Transport-Security','')
                reports.append({'id':pk,'http':response.status,'checkout_path_correct':True,
                                'valid_script_hash':matches['script'],
                                'valid_style_hash':matches['style'],
                                'hsts':True,'cache_no_store':True})
          finally:
            session.delete()
          after={'orders':OrderItem.objects.filter(product_id__in=(72,225)).count(),
                  'invoices':CommerceInvoice.objects.count(),'receipts':CommerceReceipt.objects.count()}
          assert before==after, 'The no-payment smoke test changed the commerce ledger'
          print('MPW_AUTHENTICATED_LIVE_CSP='+json.dumps({'books':reports,
            'ledger_untouched':True,'temporary_session_deleted':True}))
          PY
          BASH
