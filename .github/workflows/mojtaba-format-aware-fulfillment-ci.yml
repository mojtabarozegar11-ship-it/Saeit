name: Mojtaba single-bot format-aware fulfillment contracts — isolated only

on:
  push:
    branches:
      - fix/mojtaba-format-aware-fulfillment-20261114
    paths:
      - core/fulfillment_preflight.py
      - core/tests/test_mojtaba_fulfillment_formats_20261114.py
      - .github/workflows/mojtaba-format-aware-fulfillment-ci.yml
  pull_request:
    paths:
      - core/fulfillment_preflight.py
      - core/tests/test_mojtaba_fulfillment_formats_20261114.py
      - .github/workflows/mojtaba-format-aware-fulfillment-ci.yml

permissions:
  contents: read

concurrency:
  group: mojtaba-format-fulfillment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-format-contracts-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      DEBUG: "true"
      SECRET_KEY: "isolated-format-contract-key"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1,mojplaywin.com"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TRADE_EMAIL_ENABLED: "false"
      CROWN_STORE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install existing pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system and syntax checks
        run: |
          python manage.py check
          python -m py_compile core/fulfillment_preflight.py core/tests/test_mojtaba_fulfillment_formats_20261114.py
      - name: Isolated 42 new and 55 existing no-write preflight tests
        run: |
          python -m pytest -q \
            core/tests/test_mojtaba_fulfillment_formats_20261114.py \
            core/tests/test_mojtaba_fulfillment_preflight_20261114.py
