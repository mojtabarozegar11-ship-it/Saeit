name: MojPlayWin two book customer checkout render and payment audit read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-two-books-e2e-readonly-20261019.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-2books-e2e-audit-readonly-20261019
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check audit source cannot change invoices or funds
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_two_books_e2e_readonly_audit_20261019.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/mpw_two_books_e2e_readonly_audit_20261019.py').read_text('utf8')
          assert 'MPW_SALES_E2E_READ_ONLY_AUDIT=' in p
          assert '"real_money_transferred":False' in p
          assert '.objects.create(' not in p and '.save(' not in p and '.delete(' not in p
          assert '.update(' not in p
          print('MPW_E2E_AUDIT_SAFETY=PASS')
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect live order data and payment gates without creating customer orders
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_two_books_e2e_readonly_audit_20261019.py
      - name: Inspect actual checkout handler versus enabled commerce engine
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_two_books_checkout_effective_handler_audit_20261019.py
      - name: Verify product and checkout endpoints publicly without authentication
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          paths=["/store/","/store/product/72/","/store/product/225/","/store/product/72/checkout/","/store/product/225/checkout/"]
          for path in paths:
              req=urllib.request.Request("https://mojplaywin.com"+path,headers={"Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      status=r.status
                      dest=r.url
              except urllib.error.HTTPError as e:
                  status=e.code
                  dest=e.url
              print("MPW_BUYER_PUBLIC_GET="+json.dumps({"path":path,"status":status,"redirected_to_login":"/login" in dest or "/accounts/" in dest,"url_path_only":dest.split("mojplaywin.com")[-1].split("?")[0][:120]}))
          PY
