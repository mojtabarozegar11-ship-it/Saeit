name: MojPlayWin recover private digital product file references read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-product-file-location-readonly.yml"]
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Test artifact path bases without printing private paths or files
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 95s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          cd /home/zomorod2/Saeit-staging
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,json,pathlib
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from core.models import Product
          home=pathlib.Path('/home/zomorod2').resolve()
          bases=[('app',home/'Saeit-staging'),('home',home),('docroot',home/'mojplaywin.com'),
            ('parent',home/'Saeit-staging'/'..'),('media',home/'Saeit-staging'/'media'),
            ('private',home/'private'),('v91',home/'v91')]
          rows=[]
          for p in Product.objects.filter(pk__in=[72,147,225,283,284,285,286]).order_by('pk'):
            metadata=p.metadata if isinstance(p.metadata,dict) else {}
            report={'product':p.pk}
            for key in ['factory_archive_private','factory_inbox_relative_ref']:
              val=metadata.get(key)
              info={'set':isinstance(val,str) and bool(val),'is_absolute':False,'is_file_direct':False,
                'basename_present':False,'has_any_candidate':False,'possible_location_groups':[]}
              if isinstance(val,str) and val and len(val)<500:
                hint=pathlib.Path(val)
                info['is_absolute']=hint.is_absolute()
                info['extension']=hint.suffix.lower()[:12]
                info['path_components']=len(hint.parts)
                paths=[hint] if hint.is_absolute() else [base/hint for _,base in bases]
                for candidate in paths:
                  try:
                    rp=candidate.resolve(strict=False)
                    if home in rp.parents and rp.is_file() and not rp.is_symlink():
                      info['has_any_candidate']=True
                      info['possible_location_groups'].append(next((name for name,base in bases if str(rp).startswith(str(base.resolve())+'/')),'home'))
                  except (OSError,ValueError):pass
              report[key]=info
            rows.append(report)
          print('MPW_PRIVATE_ASSET_RECONCILIATION='+json.dumps(rows))
          PY
          BASH
