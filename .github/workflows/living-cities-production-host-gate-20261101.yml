name: Living Cities production host gate - read only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/living-cities-production-host-gate-20261101.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-cities-host-gate-readonly
  cancel-in-progress: false
jobs:
  identify-runtime:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public game route and main site before any host access
        shell: bash
        run: |
          set -euo pipefail
          for route in / /living-cities/play/ /games/; do
            status="$(curl -sSL --max-time 24 --retry 1 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "ZM_HTTP route=$route code=$status"
          done
      - name: Connect only using pinned VPS to cPanel identities
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Read sanitized Passenger and Python availability
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 50s ssh -T -F "$d/config" host 'uapi --output=json PassengerApps list_applications' | python3 -c '
          import sys,json
          j=json.load(sys.stdin)
          items=j.get("data",[]) if isinstance(j,dict) else []
          if isinstance(items,dict):items=items.get("applications",[])
          print("PASSENGER_COUNT="+str(len(items)) if isinstance(items,list) else "PASSENGER_FORMAT=unrecognized")
          if isinstance(items,list):
           for a in items:
            if not isinstance(a,dict):continue
            keys=("name","domain","base_uri","deployment_mode","app_root","path","type")
            print("PASSENGER_APP="+json.dumps({k:str(a[k])[:120] for k in keys if k in a},ensure_ascii=False))
          '
          timeout 45s ssh -T -F "$d/config" host 'python3 -' <<'PY'
          from pathlib import Path
          import os, shutil
          home=Path("/home/zomorod2")
          roots=[home/"Saeit",home/"Saeit-staging",home/"public_html",home/"zomorodmelal.ir",home/"mojplaywin.com"]
          for p in roots:
              if p.is_dir() and not p.is_symlink():
                  print("CPANEL_ROOT name="+p.name+" dir=yes writable="+str(os.access(p,os.W_OK)))
                  for f in ("manage.py","passenger_wsgi.py",".htaccess","config/urls.py","apps/living_cities/client.py"):
                      q=p/f
                      print("CPANEL_MARKER root="+p.name+" file="+f+" present="+str(q.is_file() and not q.is_symlink()))
              else:
                  print("CPANEL_ROOT name="+p.name+" dir=no")
          print("CPANEL_RUNTIME_PYTHON3="+str(shutil.which("python3") is not None))
          print("CPANEL_RUNTIME_UAPI="+str(shutil.which("uapi") is not None))
          print("CPANEL_PUBLIC_GAME_FOLDER_EXISTS="+str((home/"public_html/living-cities").exists()))
          print("CPANEL_INVENTORY_READ_ONLY=PASS")
          PY
      - name: Verify VPS recovery storage and relay without host writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 40s ssh -T -F "$d/config" vps 'python3 -' <<'PY'
          import os, shutil
          from pathlib import Path
          print("VPS_IDENTITY="+str(os.geteuid()))
          print("VPS_FREE_MIB="+str(shutil.disk_usage(str(Path.home())).free//1048576))
          print("VPS_HOME_BACKUP_LOCATION="+str((Path.home()/"backups").is_dir()))
          print("VPS_GATE_READ_ONLY=PASS")
          PY
      - name: Verify static game routing, Passenger ownership and available private source without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 50s ssh -T -F "$d/config" host 'python3 -' <<'PY'
          from pathlib import Path
          import re
          home=Path("/home/zomorod2")
          p=home/"public_html/.htaccess"
          if p.is_file() and not p.is_symlink():
              rows=p.read_text(errors="replace").splitlines()
              print("ROOT_HTACCESS_LINES="+str(len(rows)))
              for name in ("PassengerBaseURI","PassengerAppRoot","PassengerEnabled","RewriteEngine","RewriteRule","RewriteCond","FallbackResource","DirectoryIndex"):
                  matches=[r.strip() for r in rows if re.match(r"^\s*"+name+r"\s",r,re.I)]
                  print("ROOT_RULE_"+name.upper()+"_COUNT="+str(len(matches)))
                  if name in ("PassengerBaseURI","PassengerEnabled","PassengerAppRoot"):
                      for row in matches:
                          parts=row.split(None,1)
                          val=parts[1] if len(parts)>1 else ""
                          if name=="PassengerAppRoot":val=Path(val).name
                          print("ROOT_RULE_"+name.upper()+"="+val[:120])
              print("ROOT_HTACCESS_PRESENT=yes")
          else:print("ROOT_HTACCESS_PRESENT=no")
          for path in (home/"public_html/farm-wars/index.html",home/"public_html/games/index.html",home/"public_html/living-cities/play/index.html"):
              print("STATIC_ROUTE="+str(path.relative_to(home/"public_html"))+" exists="+str(path.is_file()))
          for base in (home/"Bazei",home/"bazei",home/"Saeit/Bazei",home/"Saeit-staging/Bazei",home/"apps/Bazei"):
              print("PRIVATE_BAZEI_AT="+str(base.relative_to(home))+" git="+str((base/".git").exists())+" source="+str((base/"apps/living_cities/client.py").is_file()))
          PY
          timeout 40s ssh -T -F "$d/config" vps 'python3 -' <<'PY'
          from pathlib import Path
          h=Path.home()
          for p in (h/"Bazei",h/"bazei",h/"factory-runtime/Bazei",h/"projects/Bazei",h/"Saeit"):
              print("VPS_REPO_PATH="+str(p.relative_to(h))+" git="+str((p/".git").exists())+" source="+str((p/"apps/living_cities/client.py").is_file()))
          PY
      - name: Remove all temporary SSH materials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
