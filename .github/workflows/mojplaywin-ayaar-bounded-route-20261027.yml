name: MojPlayWin AYAR exact-path bounded route deployment
on:
  push:
    branches: [release/ayaar-exact-path-20261027]
    paths:
      - ".github/workflows/mojplaywin-ayaar-bounded-route-20261027.yml"
      - "scripts/deploy_ayaar_bounded_route_20261027.py"
permissions:
  contents: read
concurrency:
  group: mpw-ayaar-one-bounded-route-deployment
  cancel-in-progress: false
jobs:
  bounded-route-release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/release/ayaar-exact-path-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bounded release source
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy_ayaar_bounded_route_20261027.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site_releases/mojplaywin/ayaar-20261027')
          expected={'index.html','methodology.html','styles.css','hero.css','app.js','favicon.svg','hero-art.svg'}
          assert {f.name for f in p.iterdir()} == expected
          for f in p.iterdir():
              assert f.is_file() and not f.is_symlink() and 0 < f.stat().st_size < 350000
          assert b'AYAR-PREASSESSMENT-v1' in (p/'app.js').read_bytes()
          assert b'mojplaywin.com/ayaar/' in (p/'index.html').read_bytes()
          print('AYAAR_BOUNDED_SOURCE_VALID=TRUE')
          PY
      - name: Record untouched public routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /store/ /saman/ /taniya/ /mojtaba.roozegar/; do
            s="$(curl --connect-timeout 9 --max-time 25 -L -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route")"
            echo "PRESERVED_BEFORE=$route:$s"
            test "$s" = 200
          done
          s="$(curl --connect-timeout 9 --max-time 25 -sS -o /dev/null -w '%{http_code}' 'https://mojplaywin.com/ayaar/')"
          echo "AYAAR_BEFORE=$s"
          test "$s" = 404
      - name: Establish pinned GitHub VPS cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/ayaar-pinned-relay"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            path="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$path"
            chmod 600 "$path"
            ssh-keygen -y -P '' -f "$path" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 13
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Preflight pinned shared configuration and stage complete AYAR package
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ayaar-pinned-relay/config"
          rid="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sha="$GITHUB_SHA"
          [[ "$rid" =~ ^[0-9]{5,25}_[0-9]{1,3}$ ]]
          timeout 55s ssh -T -F "$config" saeit-cpanel "python3 - preflight '$rid' '$sha'" < scripts/deploy_ayaar_bounded_route_20261027.py
          payload="$RUNNER_TEMP/ayaar-route-package"
          install -d -m 700 "$payload"
          cp -- site_releases/mojplaywin/ayaar-20261027/* "$payload/"
          ( cd "$payload" && sha256sum app.js favicon.svg hero-art.svg hero.css index.html methodology.html styles.css > manifest.sha256 )
          AYAAR_RUN_ID="$rid" AYAAR_SOURCE_SHA="$sha" AYAAR_PAYLOAD="$payload" python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['AYAAR_PAYLOAD'])/'deployment.json'
          p.write_text(json.dumps({'run_id':os.environ['AYAAR_RUN_ID'],'source_sha':os.environ['AYAAR_SOURCE_SHA'],'identity':'MPW_AYAAR_BOUNDED_ROUTE_V2'},sort_keys=True),encoding='utf-8')
          PY
          timeout 55s ssh -T -F "$config" saeit-cpanel "mkdir -m 700 '/home/zomorod2/.mpw-ayaar-route-stage-$rid'"
          tar -C "$payload" -cf - . | timeout 65s ssh -T -F "$config" saeit-cpanel "tar -C '/home/zomorod2/.mpw-ayaar-route-stage-$rid' -xf -"
          timeout 55s ssh -T -F "$config" saeit-cpanel "python3 - install '$rid' '$sha'" < scripts/deploy_ayaar_bounded_route_20261027.py
      - name: Verify public function and auto-rollback on regression
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ayaar-pinned-relay/config"
          rid="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sha="$GITHUB_SHA"
          healthy=true
          page="$RUNNER_TEMP/ayaar-probed.html"
          code="$(curl --connect-timeout 9 --max-time 28 --retry 1 -sS -o "$page" -w '%{http_code}' 'https://mojplaywin.com/ayaar/' || true)"
          echo "AYAAR_PUBLIC_HTTP=$code"
          if test "$code" != 200 || ! grep -q 'AYAR — Digital Product Review' "$page"; then healthy=false; fi
          for route in /ayaar/app.js /ayaar/styles.css /ayaar/methodology.html /ayaar/favicon.svg; do
            code="$(curl --connect-timeout 9 --max-time 28 --retry 1 -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "AYAAR_ASSET_HTTP=$route:$code"
            if test "$code" != 200; then healthy=false; fi
          done
          for route in / /store/ /saman/ /taniya/ /mojtaba.roozegar/; do
            code="$(curl --connect-timeout 9 --max-time 28 --retry 1 -L -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "PRESERVED_AFTER=$route:$code"
            if test "$code" != 200; then healthy=false; fi
          done
          if test "$healthy" != true; then
            echo 'AYAAR_HEALTH_GATE_FAILED_ROLLING_BACK_EXACT_PATCH'
            timeout 55s ssh -T -F "$config" saeit-cpanel "python3 - rollback '$rid' '$sha'" < scripts/deploy_ayaar_bounded_route_20261027.py
            exit 1
          fi
          echo 'AYAAR_EXACT_PUBLIC_PATH_LIVE=TRUE'
          echo 'AYAAR_SHARED_ROUTES_AND_PASSENGER_PRESERVED=TRUE'
