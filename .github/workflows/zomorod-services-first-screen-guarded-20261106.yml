name: Guarded Zomorod services first-screen conversion layout
on:
  push:
    branches: [audit/zm-services-first-screen-20261106]
    paths:
      - scripts/zomorod_services_first_screen_guarded_20261106.py
      - .github/workflows/zomorod-services-first-screen-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-services-first-screen-guarded-20261106
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate reversible one-file layout adjustment
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_services_first_screen_guarded_20261106.py
          python3 scripts/zomorod_services_first_screen_guarded_20261106.py selftest
      - name: Authenticate pinned cPanel directly or through existing VPS relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-first-screen-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/services/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/services/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Confirm existing production services SHA
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-first-screen-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/zomorod_services_first_screen_guarded_20261106.py
      - name: Back up and reorder services hero atomically
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-first-screen-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_services_first_screen_guarded_20261106.py
      - name: Verify origin, visible H1, existing CTA and inquiry form
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-first-screen-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_services_first_screen_guarded_20261106.py
          python3 - <<'PY'
          import os, time
          from urllib.request import Request, urlopen
          mark = 'zm-services-first-screen-20261106'
          hero = '<section class="zm-hero">'
          h1 = '<h1>خدمات کشاورزی <em>و اقتصاد تولید</em></h1>'
          for attempt in range(6):
              url = 'https://zomorodmelal.ir/services/?first_screen=' + os.environ['GITHUB_RUN_ID'] + '-' + str(attempt)
              try:
                  with urlopen(Request(url, headers={'Cache-Control': 'no-cache'}), timeout=27) as r:
                      html = r.read(150_000).decode('utf-8')
                      if r.status != 200 or html.count(mark) != 1 or html.count(h1) != 1:
                          raise RuntimeError('PUBLIC_SERVICES_H1_NOT_UPDATED')
                  if not (html.index('<main id="main">') < html.index(mark)
                          < html.index(hero) < html.index(h1)
                          < html.index('zm-services-action-hub-20261106')
                          < html.index('zm-service-deliverables-20261106')):
                      raise RuntimeError('PUBLIC_SERVICES_HERO_NOT_FIRST')
                  if ('/ask-master/index.php?service=1' not in html
                          or html.count('zm-service-deliverables-20261106') != 2):
                      raise RuntimeError('PUBLIC_SERVICES_CTA_LOST')
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(4)
          for path in ('contact/', 'ask-master/index.php?service=1'):
              with urlopen(Request('https://zomorodmelal.ir/' + path), timeout=27) as r:
                  if r.status != 200:
                      raise RuntimeError('CUSTOMER_INQUIRY_ROUTE_NOT_AVAILABLE')
          print('PUBLIC_FIRST_SCREEN_AND_INQUIRY_PATH_VERIFIED=1')
          PY
      - name: Roll back only if our verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-first-screen-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_services_first_screen_guarded_20261106.py
