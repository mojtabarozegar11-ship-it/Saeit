name: Zomorod Orbital V6 safeguarded performance preview
on:
  push:
    branches: [zomorod/orbital-v5-safe-release-20261018]
    paths: [".github/workflows/zomorod-orbital-v6-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-orbital-v6-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify the 17 families and 340 items are retained in source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          base=Path("content/zomorod-orbital-v6")
          html=(base/"index.html").read_text()
          data=(base/"data.js").read_text()
          app=(base/"app.js").read_text()
          assert 100_000<len(html.encode())<300_000
          assert len(data.encode())>1_300_000
          assert 'id="orbital-cards"' in html and 'id="orbit-shelves"' in html
          assert 'src="./data.js" defer' in html and 'src="./app.js" defer' in html
          payload=json.loads(data.removeprefix("window.ZOMOROD_ORBIT_DATA=").rstrip().rstrip(";"))
          assert len(payload["rows"])==17
          assert all(len(r["cards"])==20 for r in payload["rows"])
          assert 'ensureCards' in app and 'IntersectionObserver' in app
          print("V6_SOURCES=verified_17_rows_340_cards")
          PY
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"


      - name: Immutable backup of currently active root and protected independent sites
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          umask 077
          sha="$1"
          web="$HOME/public_html"
          backup="$HOME/.backups/zomorod-orbital-v6/$sha"
          preview="$web/__zm_orbital_v6_preview_20261018"
          test -d "$web" && test -s "$web/index.html" && test ! -L "$web/index.html"
          test -s "$web/.htaccess" && test ! -L "$web/.htaccess"
          test ! -e "$preview" && test ! -L "$preview"
          for child in mohammad ghanadi amozeshgah; do
            test -s "$web/$child/index.html" && test ! -L "$web/$child/index.html"
          done
          test ! -e "$backup"
          mkdir -p "$backup"
          chmod 700 "$backup"
          cp -p "$web/index.html" "$backup/index.original.html"
          cmp -s "$web/index.html" "$backup/index.original.html"
          sha256sum "$web/index.html" "$web/.htaccess" "$web/mohammad/index.html" "$web/ghanadi/index.html" "$web/amozeshgah/index.html" > "$backup/protected.sha256"
          echo "V6_ROOT_BACKUP=exact_snapshot_verified"
          REMOTE
      - name: Transfer only three static files under newly isolated preview directory
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          preview="/home/zomorod2/public_html/__zm_orbital_v6_preview_20261018"
          ssh -F "$d/config" saeit-cpanel "set -eu; test ! -e '$preview'; mkdir -m 755 '$preview'"
          tar -cf - -C content/zomorod-orbital-v6 index.html data.js app.js |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C '$preview'"
          ssh -F "$d/config" saeit-cpanel "cat > '$preview/.htaccess'" <<'HT'
          PassengerEnabled off
          DirectoryIndex index.html
          Options -Indexes
          Header set X-Robots-Tag "noindex, nofollow"
          HT
          ssh -F "$d/config" saeit-cpanel "chmod 644 '$preview/index.html' '$preview/data.js' '$preview/app.js' '$preview/.htaccess'"
      - name: Check live preview and immutable root/subsite hashes or fail closed
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          html_sha="$(sha256sum content/zomorod-orbital-v6/index.html|cut -d' ' -f1)"
          data_sha="$(sha256sum content/zomorod-orbital-v6/data.js|cut -d' ' -f1)"
          app_sha="$(sha256sum content/zomorod-orbital-v6/app.js|cut -d' ' -f1)"
          if ! ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$html_sha" "$data_sha" "$app_sha" <<'REMOTE'
          set -euo pipefail
          sha="$1"; rootsha="$2"; datasha="$3"; appsha="$4"
          web="$HOME/public_html"
          preview="$web/__zm_orbital_v6_preview_20261018"
          backup="$HOME/.backups/zomorod-orbital-v6/$sha"
          test "$(sha256sum "$preview/index.html"|cut -d' ' -f1)" = "$rootsha"
          test "$(sha256sum "$preview/data.js"|cut -d' ' -f1)" = "$datasha"
          test "$(sha256sum "$preview/app.js"|cut -d' ' -f1)" = "$appsha"
          cmp -s "$web/index.html" "$backup/index.original.html"
          sha256sum -c --status "$backup/protected.sha256"
          for item in index.html data.js app.js; do
            url="https://zomorodmelal.ir/__zm_orbital_v6_preview_20261018/$item?check=$sha"
            status="$(curl -sS -L --max-time 30 -o "$backup/$item.response" -w '%{http_code}' "$url" || true)"
            echo "V6_ASSET=$item HTTP=$status"
            test "$status" = 200
          done
          grep -Fq 'id="orbit-shelves"' "$backup/index.html.response"
          grep -Fq 'window.ZOMOROD_ORBIT_DATA' "$backup/data.js.response"
          for route in / /mohammad/ /ghanadi/ /amozeshgah/; do
            code="$(curl -sS -L --max-time 18 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "V6_PROTECTED_ROUTE=$route CODE=$code"
            test "$code" = 200
          done
          sha256sum -c --status "$backup/protected.sha256"
          echo "V6_PREVIEW=online_root_and_subsites_unchanged"
          REMOTE
          then
            echo "V6_PREVIEW=NOT_APPROVED"
            exit 1
          fi
      - name: Clean relay private keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
