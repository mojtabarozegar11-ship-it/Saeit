name: Preserve one old robot DB compressed and remove redundant raw file
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-robot-db-single-compression-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-one-robot-db-compress
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Archive one historical database with verified lossless compression, never touching live DBs
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,gzip,os,subprocess,sqlite3
          h=Path.home()
          assert h==Path("/home/zomorod2")
          p=h/".backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b/database/var/mother_robot/lab/upgrade-g28-1791077099027995723/project/db.sqlite3"
          assert p.is_file() and not p.is_symlink() and p.stat().st_size==144031744
          assert (h/"Saeit/var/mother_robot/lab/upgrade-g28-1791077099027995723/project/db.sqlite3").is_file()
          assert (h/"Saeit/manage.py").is_file()
          gz=p.with_name("db.sqlite3.gz")
          tmp=p.with_name(".db.sqlite3.gz.partial")
          assert not gz.exists() and not tmp.exists()
          cr=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10)
          ps=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10)
          assert "/mother_robot/lab/" not in cr.stdout
          assert not any(str(p) in row and "python3 - " not in row for row in ps.stdout.splitlines())
          def digest(path,decode=False):
              d=hashlib.sha256()
              op=gzip.open if decode else open
              with op(path,"rb") as f:
                  for part in iter(lambda:f.read(2*1024*1024),b""):d.update(part)
              return d.hexdigest()
          original_sha=digest(p)
          try:
              with p.open("rb") as inp, gzip.open(tmp,"wb",compresslevel=1) as out:
                  for chunk in iter(lambda:inp.read(1024*1024),b""):out.write(chunk)
              with tmp.open("rb") as fd:os.fsync(fd.fileno())
              assert digest(tmp,True)==original_sha
              assert digest(p)==original_sha
              os.replace(tmp,gz)
              assert digest(gz,True)==original_sha
              zipped=gz.stat().st_size
              print("ARCHIVAL_DB_GZIP_VERIFIED=yes")
              print("ARCHIVAL_DB_ORIGINAL_BYTES="+str(p.stat().st_size))
              print("ARCHIVAL_DB_COMPRESSED_BYTES="+str(zipped))
              p.unlink()
              assert not p.exists() and gz.is_file()
              print("ARCHIVAL_DB_RAW_REMOVED=yes")
              print("ARCHIVAL_DB_RECOVERABLE=yes")
              print("ACTIVE_DATABASES_UNMODIFIED=yes")
          finally:
              if tmp.exists():tmp.unlink()
          PY
          REMOTE
      - name: Public site safety check
        shell: bash
        run: |
          set -euo pipefail
          for site in "https://zomorodmelal.ir/" "https://zomorodmelal.ir/agents/" "https://mojplaywin.com/"; do
            code="$(curl --max-time 16 -sS -o /dev/null -w '%{http_code}' "$site" || true)"
            echo "AFTER_DB_ARCHIVE_SITE=$site:$code"
            test "$code" = 200
          done
      - name: Clean SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
