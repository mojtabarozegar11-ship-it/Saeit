jobs:
  read_only_live_intake_source_identity:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 6
    steps:
      - name: Checkout exact owner-authored PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact immutable read-only diagnostic and privacy regressions
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mojprop_live_intake_source_drift_readonly_c95.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest tests.test_mojprop_live_intake_source_drift_readonly_c95 -q
          python3 -B -m py_compile scripts/mojprop_passenger_source_readonly_c118.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest tests.test_mojprop_passenger_source_readonly_c118 -q
          python3 -B -m py_compile scripts/mojprop_owner_backup_catalog_readonly_c120.py
