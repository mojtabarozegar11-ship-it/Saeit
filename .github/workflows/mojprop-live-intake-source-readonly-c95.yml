            < scripts/mojprop_live_intake_source_drift_readonly_c95.py \
            | python3 -c 'import json,sys; data=sys.stdin.read(6000); prefix="MOJPROP_C95_LIVE_INTAKE_SOURCE_READONLY="; lines=[x for x in data.splitlines() if x.startswith(prefix)]; assert len(lines)==1,"MISSING_SANITIZED_QUEUE"; d=json.loads(lines[0][len(prefix):]); assert d["schema"]=="mojprop.intake.live_source_drift.readonly.v1" and d["read_only"] is True and d["customer_data_accessed"] is False and d["customer_lead_created"] is False and d["production_release_permitted"] is False; assert isinstance(d["source_identity"],dict) and len(d["source_identity"])==5; assert all(v in ("matches","drifted","missing","unsafe","unavailable") for v in d["source_identity"].values()); print(lines[0])'
