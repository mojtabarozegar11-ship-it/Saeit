name: Zomorod ERP V6 private staging only through 30GB relay
on:
  push:
    branches: ['feature/zomorod-erp-v6-verified-source-20261029']
    paths:
      - '.github/workflows/zomorod-erp-v6-private-stage.yml'
permissions:
  contents: read
concurrency:
  group: zomorod-erp-v6-private-stage-20261029
  cancel-in-progress: false
jobs:
  isolated-private-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm all V6 source hashes and make isolated transfer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('release-candidates/zomorod-erp-v6-verified')
          manifest=json.loads((root/'MANIFEST.json').read_text())
          assert manifest['status']=='DEVELOPMENT_ONLY_NOT_PRODUCTION_DEPLOYABLE'
          assert manifest['production_data_included'] is False
          assert manifest['secret_material_included'] is False
          assert len(manifest['files'])==45
          for row in manifest['files']:
              path=root/row['path']
              assert path.is_file() and not path.is_symlink()
              contents=path.read_bytes()
              assert len(contents)==row['bytes'] and hashlib.sha256(contents).hexdigest()==row['sha256']
          print('V6_STAGE_SOURCE_HASHES=45_OF_45_VERIFIED')
          print('V6_LIVE_SITE_MODIFICATION=FORBIDDEN')
          PY
          tar -C release-candidates/zomorod-erp-v6-verified -czf "$RUNNER_TEMP/zmr-v6-private-stage.tgz" .
      - name: Prepare pinned cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Stage exact candidate only inside 0700 private directory
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          stage="/home/zomorod2/.private/zomorod-business/.erp-v6-stage-bca9cba6"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          ssh -F "$d/config" "$COMMAND_HOST" "test -d /home/zomorod2/.private/zomorod-business && test \"\$(stat -c %a /home/zomorod2/.private/zomorod-business)\" = 700 && install -d -m 700 '$stage' && test ! -L '$stage' && test \"\$(stat -c %u '$stage')\" = \"\$(id -u)\""
          scp -F "$d/config" "$RUNNER_TEMP/zmr-v6-private-stage.tgz" "$COMMAND_HOST:$stage/source.tar.gz"
          ssh -F "$d/config" "$COMMAND_HOST" "chmod 600 '$stage/source.tar.gz' && tar -tzf '$stage/source.tar.gz' >/dev/null && tar -xzf '$stage/source.tar.gz' -C '$stage'"
          echo 'V6_PRIVATE_STAGE_TRANSFER=SUCCESS'
          echo 'PRODUCTION_DEPLOYMENT=NOT_PERFORMED'
      - name: Compare staged V6 against private live runtime read-only
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          ssh -F "$d/config" "$COMMAND_HOST" "python3 -B -" <<'PY'
          import hashlib,json,os,sqlite3,subprocess
          from pathlib import Path
          private=Path('/home/zomorod2/.private/zomorod-business')
          stage=private/'.erp-v6-stage-bca9cba6'
          manifest=json.loads((stage/'MANIFEST.json').read_text())
          if len(manifest['files'])!=45: raise SystemExit('V6_STAGE_MANIFEST_MISSING')
          for x in manifest['files']:
              f=stage/x['path']
              if not f.is_file() or f.is_symlink(): raise SystemExit('V6_STAGE_SOURCE_MISSING')
              b=f.read_bytes()
              if len(b)!=x['bytes'] or hashlib.sha256(b).hexdigest()!=x['sha256']:
                  raise SystemExit('V6_STAGE_HASH_MISMATCH')
          print('V6_STAGED_MANIFEST=45_OF_45_VERIFIED')
          php_candidates=[Path('/opt/cpanel/ea-php83/root/usr/bin/php'),
                          Path('/opt/cpanel/ea-php82/root/usr/bin/php'),Path('/usr/bin/php')]
          php=next((str(p) for p in php_candidates if p.is_file()),None)
          if not php: raise SystemExit('V6_STAGE_PHP_MISSING')
          files=sorted((stage/'content/zomorod-business').glob('*.php'))
          if len(files)<10: raise SystemExit('V6_STAGE_FILES_MISSING')
          for f in files:
              check=subprocess.run([php,'-l',str(f)],stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,timeout=8,check=False)
              if check.returncode: raise SystemExit('V6_STAGE_PHP_LINT_FAILED')
          print('V6_STAGE_PHP_LINT=PASS')
          print('V6_STAGE_MODULES='+str(len(files)))
          existing_roots=[private,Path('/home/zomorod2/public_html/business')]
          checked=0;changed=0
          for p in files:
              relative=p.name
              locations=[root/relative for root in existing_roots if (root/relative).is_file()]
              if locations:
                  checked+=1
                  if all(hashlib.sha256(q.read_bytes()).digest()!=hashlib.sha256(p.read_bytes()).digest() for q in locations):
                      changed+=1
          print('V6_LIVE_MODULE_NAMES_MATCHED='+str(checked))
          print('V6_STAGED_MODULES_DIFFERING_FROM_LIVE='+str(changed))
          print('V6_PRIVATE_LIVE_APP_PRESENT='+str((private/'app.php').is_file()))
          print('V6_PRIVATE_SITE_AGENTS_PRESENT='+str((private/'site_agents.php').is_file()))
          print('V6_PRIVATE_SITE_STORE_PRESENT='+str((private/'site_store.php').is_file()))
          dbfile=private/'management.sqlite3'
          if not dbfile.is_file() or dbfile.stat().st_mode & 0o077:
              raise SystemExit('V6_LIVE_PRIVATE_DB_PERMISSIONS')
          conn=sqlite3.connect('file:'+str(dbfile)+'?mode=ro',uri=True,timeout=12)
          try:
              if conn.execute('PRAGMA quick_check').fetchone()[0]!='ok':
                  raise SystemExit('V6_LIVE_SQLITE_INTEGRITY')
              admins=conn.execute("SELECT COUNT(*) FROM users WHERE role='admin' AND active=1").fetchone()[0]
              if admins!=1: raise SystemExit('V6_LIVE_ADMIN_COUNT')
          finally:
              conn.close()
          print('V6_LIVE_SQLITE_INTEGRITY=ok')
          print('V6_LIVE_ACTIVE_ADMIN=ONE')
          print('V6_PRODUCTION_DEPLOYMENT=NOT_PERFORMED')
          PY
      - name: Remove temporary runner transfer and SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-command-channel" "$RUNNER_TEMP/zmr-v6-private-stage.tgz"
