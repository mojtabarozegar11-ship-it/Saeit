name: MojPlayWin cPanel source-side encrypted backup rehearsal (synthetic ONLY)
on:
  push:
    branches:
      - feature/mojplaywin-crypto-gateway-20261018
    paths:
      - .github/workflows/mojplaywin-cpanel-source-encrypted-synthetic.yml
      - scripts/mojplaywin_cpanel_synthetic_chunk_relay.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-source-encrypted-synthetic
  cancel-in-progress: false
jobs:
  temp-fixtures-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI temporary recovery runtime
        run: python -m pip install 'cryptography>=43,<48'
      - name: Confirm scripted source-encryption probe is valid
        run: |
          python -m py_compile scripts/mojplaywin_chunked_encrypted_snapshot.py
          python -m py_compile scripts/mojplaywin_cpanel_synthetic_chunk_relay.py
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"

      - name: Encrypt cPanel synthetic fixture before transfer; resume VPS ciphertext; recover in CI
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          python3 scripts/mojplaywin_cpanel_synthetic_chunk_relay.py "$d/config" scripts/mojplaywin_chunked_encrypted_snapshot.py |
            python3 -c 'import json,sys; j=json.load(sys.stdin); print(json.dumps(j,sort_keys=True)); assert j.get("source_checksum_matches_restored_file") and j.get("source_encryption_performed_on_cpanel") and not j.get("key_transmitted_to_vps")'
      - name: Production remains blocked
        run: |
          echo "SOURCE_FILES_CREATED=synthetic-tmp-only"
          echo "VPS_FILES_CREATED=synthetic-tmp-only"
          echo "CUSTOMER_DATA_READ=false"
          echo "REAL_BACKUP_CREATED=false"
          echo "LIVE_CRYPTO_PAYMENTS_ENABLED=false"
          echo "PRODUCTION_RELEASE_PERMITTED=false"
