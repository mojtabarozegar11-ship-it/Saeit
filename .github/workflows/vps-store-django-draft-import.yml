name: Factory Private Products to MojPlayWin Django Drafts
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-store-django-draft-import.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-store-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-store-preflight"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            key="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$key"
            chmod 600 "$key"
            ssh-keygen -y -P '' -f "$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Inspect factory product handoff source
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          echo VPS_USER="$(id -un)"
          test -s "$base/private/autonomous-product-cycle/production-state.json"
          test -s "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          echo VPS_MANUFACTURED_ZIP_PRESENT
          stat -c 'VPS_ZIP_BYTES=%s PERMISSIONS=%a' "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          python3 - "$base/private/autonomous-product-cycle/production-state.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          for k in ('mode','depends_on_orders','built_product_count','artifact_qa_passed','publishable_product_count','store_distribution_state'):
            print('VPS_FACTORY_'+k.upper()+'='+str(j.get(k)))
          PY
          REMOTE
      - name: Inspect cPanel private staging and storefront runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo CPANEL_USER="$(id -un)"
          echo CPANEL_HOME="$HOME"
          for path in /home/zomorod2/Saeit-staging /home/zomorod2/zomorodmelal.ir /home/zomorod2/mojplaywin.com /home/zomorod2/mojtabarozegar.ir /home/zomorod2/public_html; do
            if test -d "$path" && test ! -L "$path"; then
              echo CPANEL_DIR_PRESENT="$(basename "$path")"
              if test -f "$path/manage.py"; then echo CPANEL_DJANGO_SOURCE="$(basename "$path")"; fi
              if test -f "$path/passenger_wsgi.py"; then echo CPANEL_PASSENGER_SOURCE="$(basename "$path")"; fi
              if test -d "$path/.venv"; then echo CPANEL_LOCAL_VENV="$(basename "$path")"; fi
            else
              echo CPANEL_DIR_MISSING="$(basename "$path")"
            fi
          done
          test -d /home/zomorod2/Saeit-staging
          test -w /home/zomorod2/Saeit-staging
          echo CPANEL_STAGING_WRITABLE
          if test -f /home/zomorod2/Saeit-staging/core/models.py; then
            grep -q '^class Product(' /home/zomorod2/Saeit-staging/core/models.py && echo CPANEL_DJANGO_PRODUCT_MODEL_PRESENT
          fi
          command -v python3 >/dev/null && python3 --version
          df -h "$HOME" | tail -n 1 | awk '{print "CPANEL_DISK_FREE=" $4}'
          REMOTE
      - name: Install guarded MojPlayWin Django draft importer
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-store-preflight"
          scp -F "$d/config" scripts/import_factory_store_drafts.py saeit-cpanel:/home/zomorod2/.saeit-factory-inbox/bin/import_factory_store_drafts.py.tmp
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/.saeit-factory-inbox"
          script="$root/bin/import_factory_store_drafts.py"
          tmp="$script.tmp"
          test -s "$tmp"
          python3 -m py_compile "$tmp"
          chmod 600 "$tmp"
          mv -f "$tmp" "$script"
          echo DJANGO_FACTORY_DRAFT_IMPORTER_INSTALLED
          REMOTE
      - name: Register one QA-verified factory asset as inactive MojPlayWin draft
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-store-preflight"
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          app="$HOME/Saeit-staging"
          root="$HOME/.saeit-factory-inbox"
          docroot="$HOME/mojplaywin.com"
          script="$root/bin/import_factory_store_drafts.py"
          cd "$app"
          selected=""
          for python in /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/virtualenv/Saeit-staging/3.10/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python "$app/.venv/bin/python"; do
            if test -x "$python" && "$python" -c 'import django' >/dev/null 2>&1; then
              selected="$python"
              break
            fi
          done
          test -n "$selected" || { echo STORE_DJANGO_RUNTIME_MISSING; exit 1; }
          export DJANGO_SETTINGS_MODULE=config.settings PYTHONPATH="$app"
          "$selected" "$script" --inbox "$root" --app "$app" --document-root "$docroot" --sole-active-superuser
          "$selected" "$script" --inbox "$root" --app "$app" --document-root "$docroot" --sole-active-superuser --apply
          "$selected" "$script" --inbox "$root" --app "$app" --document-root "$docroot" --sole-active-superuser --apply
          "$selected" - <<'PY'
          import django
          django.setup()
          from django.apps import apps
          P=apps.get_model("core","Product")
          print("STORE_DJANGO_AFTER_TOTAL="+str(P.objects.count()))
          print("STORE_DJANGO_AFTER_ACTIVE="+str(P.objects.filter(active=True).count()))
          count=P.objects.filter(metadata__factory_origin="saeit_vps",active=False).count()
          print("STORE_DJANGO_FACTORY_INACTIVE="+str(count))
          assert count >= 1
          PY
          command -v crontab >/dev/null
          ops="$root/bin"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          crontab -l > "$ops/cron-before-product-import-$stamp.txt" 2>/dev/null || : > "$ops/cron-before-product-import-$stamp.txt"
          chmod 600 "$ops/cron-before-product-import-$stamp.txt"
          grep -v SAEIT_FACTORY_PRODUCT_DRAFT_IMPORT "$ops/cron-before-product-import-$stamp.txt" > "$ops/draft-cron.tmp" || true
          printf '%s\n' "47 * * * * /usr/bin/flock -n $ops/draft-import.lock /bin/bash -c 'cd $app && DJANGO_SETTINGS_MODULE=config.settings PYTHONPATH=$app $selected $script --inbox $root --app $app --document-root $docroot --sole-active-superuser --apply' >> $root/draft-import.log 2>&1 # SAEIT_FACTORY_PRODUCT_DRAFT_IMPORT" >> "$ops/draft-cron.tmp"
          chmod 600 "$ops/draft-cron.tmp"
          crontab "$ops/draft-cron.tmp"
          rm -f "$ops/draft-cron.tmp"
          test "$(crontab -l | grep -c SAEIT_FACTORY_PRODUCT_DRAFT_IMPORT)" = 1
          echo MOJPLAYWIN_PRIVATE_FACTORY_DRAFT_IMPORT_SCHEDULED
          echo MOJPLAYWIN_STORE_PRODUCTS_REMAIN_INACTIVE_UNTIL_OWNER_APPROVAL
          REMOTE
      - name: Clean temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/factory-store-preflight"
