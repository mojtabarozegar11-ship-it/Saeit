name: Zomorod safe npm cache reclaim on production cPanel 2026-11-04
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-safe-npm-cache-reclaim-20261104.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-safe-npm-cache-reclaim-20261104
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Reclaim reproducible npm download cache only after strict preflight
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path("/home/zomorod2")
          npm=root/".npm"
          cache=npm/"_npx"
          def quota():
              try:
                  raw=subprocess.check_output(["uapi","--output=json","Quota","get_quota_info"],text=True,timeout=35)
                  return json.loads(raw)["result"]["data"].get("megabytes_remain")
              except Exception:return "unavailable"
          def disk(p):
              value=subprocess.check_output(["du","-sk","--",str(p)],text=True,timeout=50).split()[0]
              return int(value)
          assert Path.home()==root and root.is_dir(),"WRONG_ACCOUNT"
          assert npm.is_dir() and not npm.is_symlink(),"NPM_ROOT_INVALID"
          assert cache.is_dir() and not cache.is_symlink(),"NPM_CACHE_INVALID"
          assert cache.resolve()==root/".npm"/"_npx","NPM_CACHE_PATH_MISMATCH"
          assert npm.stat().st_uid==os.geteuid() and cache.stat().st_uid==os.geteuid(),"NPM_CACHE_NOT_OWNED"
          assert any((x/"node_modules").is_dir() for x in cache.iterdir() if x.is_dir() and not x.is_symlink()),"NOT_STANDARD_NPX_CACHE"
          active=subprocess.run(["pgrep","-u",str(os.geteuid()),"-f","(npm|npx|/_npx/) (install|ci|rebuild|update|exec)"],capture_output=True,text=True,timeout=6) if shutil.which("pgrep") else None
          assert active is not None and active.returncode==1,"CONCURRENT_NPM_OPERATION_OR_UNKNOWN"
          old=disk(cache)
          assert old>=200000,"CACHE_TOO_SMALL_FOR_OPERATION"
          print("NPX_CACHE_KIB_BEFORE="+str(old))
          print("QUOTA_MB_BEFORE="+str(quota()))
          shutil.rmtree(cache)
          assert not cache.exists(),"CACHE_PURGE_INCOMPLETE"
          after=disk(npm)
          print("NPM_DIRECTORY_KIB_AFTER="+str(after))
          print("QUOTA_MB_AFTER="+str(quota()))
          print("NPX_REGENERABLE_CACHE_RECLAIM_COMPLETE=yes")
          PY
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -rf -- "$d"; fi
