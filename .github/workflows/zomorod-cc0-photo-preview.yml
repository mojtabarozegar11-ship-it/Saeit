name: Zomorod CC0 unique editorial photo preview
on:
  push:
    branches: ["restore-zomorod-corporate-content-20261017"]
    paths:
      - "scripts/zomorod_cc0_photography.py"
      - ".github/workflows/zomorod-cc0-photo-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated image validator
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Curate CC0 photos and generate quality-control contact sheet (no changes committed)
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/zomorod_cc0_photography.py --preview
          test -s zomorod-cc0-contact-sheet.jpg
          test "$(find core/static/site/editorial -name '*.webp' -type f | wc -l)" -eq 17
          echo "CC0_CONTACT_SHEET_IMAGES=17"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zomorod-cc0-photo-review-17
          path: |
            zomorod-cc0-contact-sheet.jpg
            core/static/site/editorial/*.webp
          retention-days: 5
