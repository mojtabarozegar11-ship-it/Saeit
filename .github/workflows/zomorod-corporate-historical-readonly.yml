name: Zomorod Corporate 1AM Backup Readonly Audit
on:
  pull_request:
    branches: [main]
    paths:
      - "content/zomorod-nova-pages/about.html"
      - "content/zomorod-nova-pages/company.html"
      - ".github/workflows/zomorod-corporate-historical-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on page/file deletion or unexpected modification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-status "$(git merge-base HEAD origin/main)" HEAD > /tmp/zomorod-changed-files.txt
          cat /tmp/zomorod-changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              'content/zomorod-nova-pages/about.html',
              'content/zomorod-nova-pages/company.html',
              'content/zomorod-nova-pages/services.html',
              'content/zomorod-nova-pages/industry.html',
              'content/zomorod-nova-pages/research.html',
              'content/zomorod-nova-pages/knowledge.html',
              'content/zomorod-new-home/index.html',
              'docs/zomorod-cc0-editorial-photographs.json',
              'scripts/zomorod_cc0_photography.py',
              '.github/workflows/zomorod-cc0-photo-feasibility.yml',
              '.github/workflows/zomorod-cc0-photo-preview.yml',
              '.github/workflows/zomorod-cc0-photo-apply.yml',
              'core/static/site/editorial/01-farm-machinery.webp',
              'core/static/site/editorial/02-crop-economics.webp',
              'core/static/site/editorial/03-water-soil.webp',
              'core/static/site/editorial/04-plant-genetics.webp',
              'core/static/site/editorial/05-smart-systems.webp',
              'core/static/site/editorial/06-livestock.webp',
              'core/static/site/editorial/07-food-processing.webp',
              'core/static/site/editorial/08-digital-research.webp',
              'core/static/site/editorial/09-economic-analysis.webp',
              'core/static/site/editorial/10-company-landscape.webp',
              'core/static/site/editorial/11-protected-cultivation.webp',
              'core/static/site/editorial/12-professional-services.webp',
              'core/static/site/editorial/13-field-consulting.webp',
              'core/static/site/editorial/14-industrial-technology.webp',
              'core/static/site/editorial/15-scientific-research.webp',
              'core/static/site/editorial/16-microbiology.webp',
              'core/static/site/editorial/17-learning-resources.webp',
              'tests/test_zomorod_corporate_content_restoration.py',
              '.github/workflows/zomorod-corporate-historical-readonly.yml',
              'core/static/site/emerald-system.css',
              'docs/zomorod-litespeed-503-recovery-20261017.md',
              '.github/workflows/zomorod-complete-backup-catalog-readonly.yml',
              '.github/workflows/zomorod-final-live-acceptance.yml',
              '.github/workflows/zomorod-image-library-readonly.yml',
              '.github/workflows/zomorod-selector-uri-canary.yml',
              '.github/workflows/zomorod-selector-uri-rollback.yml',
              '.github/workflows/zomorod-emerald-css-recovery.yml',
              '.github/workflows/zomorod-emerald-css-export.yml',
          }
          changed = [line.split('\t', 1) for line in Path('/tmp/zomorod-changed-files.txt').read_text().splitlines()]
          assert changed, 'Nothing to verify'
          for status, path in changed:
              assert status in ('A','M'), f'Deletion, rename or other destructive change forbidden: {status} {path}'
              assert path in allowed, f'Out-of-scope site file changed: {path}'
          print('NO_REMOVED_PAGES=true')
          print('CHANGED_FILES_SCOPED=true')
          PY
      - name: Verify all existing visible content remains on both pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class MainText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_main = False
                  self.depth = 0
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'main':
                      self.in_main = True
                  if self.in_main:
                      self.depth += 1
              def handle_endtag(self, tag):
                  if self.in_main:
                      self.depth -= 1
                      if self.depth == 0:
                          self.in_main = False
              def handle_data(self, text):
                  if self.in_main and text.strip():
                      self.text.append(' '.join(text.split()))

          paths = [
              'content/zomorod-new-home/index.html',
              *(f'content/zomorod-nova-pages/{slug}.html' for slug in
                ('about', 'company', 'services', 'industry', 'research', 'knowledge')),
          ]
          for path in paths:
              slug = path.rsplit('/', 1)[-1].removesuffix('.html')
              before = subprocess.check_output(['git', 'show', 'origin/main:'+path], text=True)
              after = Path(path).read_text(encoding='utf-8')
              p, q = MainText(), MainText()
              p.feed(before)
              q.feed(after)
              older, newer = Counter(p.text), Counter(q.text)
              lost = [text for text, count in older.items() if newer[text] < count]
              assert not lost, f'{slug}: original visible content removed or shortened: {lost[:8]}'
              assert len(q.text) >= len(p.text), f'{slug}: unexpected content loss'
              print(f'ORIGINAL_CONTENT_PRESERVED={slug}:true; fragments={len(p.text)}')
          PY
      - name: Offline content checks
        run: python -m unittest discover -s tests -p test_zomorod_corporate_content_restoration.py -v
      - name: Prepare fingerprint-pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-readonly"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" > /dev/null
          ssh-keygen -y -P "" -f "$d/host.key" > /dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "RELAY_PINNED=verified"
      - name: Inspect only original host snapshots and live file fingerprints
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          web="$HOME/public_html"
          echo "READ_ONLY=true"
          echo "HOST_CLOCK=$(date -Is)"
          echo "REQUESTED_BACKUP_LOCAL=2026-10-14T01:00:00+03:30"
          for slug in about company; do
            p="$web/$slug/index.html"
            if [ -f "$p" ]; then
              echo "PAGE=$slug BYTES=$(stat -c '%s' "$p") SHA256=$(sha256sum "$p" | cut -d' ' -f1)"
            else
              echo "MISSING_PAGE=$slug"
            fi
          done
          for name in index.html site-heritage/home-before-redesign/index.html mohammad/index.html ghanadi/index.html amozeshgah/index.html; do
            p="$web/$name"
            if [ -f "$p" ]; then
              echo "PROTECTED=$name BYTES=$(stat -c '%s' "$p") SHA256=$(sha256sum "$p" | cut -d' ' -f1)"
            else
              echo "MISSING_PROTECTED=$name"
            fi
          done
          for n in zomorodmelal-root-homepage zomorodmelal-app zomorod-nova-publish; do
            dir="$HOME/.backups/$n"
            if [ -d "$dir" ]; then
              echo "BACKUP_DIR=$n"
              find "$dir" -maxdepth 4 -type f \( -iname '*.html' -o -iname '*.manifest' -o -iname '*company*' -o -iname '*about*' -o -iname '*backup*' \) -printf '%TY-%Tm-%TdT%TH:%TM %s %f\n' | sort | head -n 75
            else
              echo "BACKUP_DIR_ABSENT=$n"
            fi
          done
          for path in / /about/ /company/ /site-heritage/home-before-redesign/ /mohammad/ /ghanadi/ /amozeshgah/ /company/executive/ /contact/ /economy/ /market/; do
            code="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "HTTP=$path:$code"
          done
          REMOTE
      - name: Discover candidate 14 Oct 1AM host backups by timestamp only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          echo "BACKUP_TIME_WINDOW=2026-10-13T20:00_to_2026-10-14T06:00_HOST_LOCAL"
          for name in zomorodmelal-root-homepage zomorodmelal-app zomorod-nova-publish; do
            dir="$HOME/.backups/$name"
            test -d "$dir" || continue
            echo "BACKUP_CANDIDATE_SOURCE=$name"
            find "$dir" -maxdepth 2 -mindepth 1 -printf '%y %TY-%Tm-%TdT%TH:%TM %s %P\n' | sort | sed -n '1,45p'
            echo "EARLY_14_OCT_CANDIDATES=$name"
            find "$dir" -maxdepth 5 -type f -newermt '2026-10-13 20:00' ! -newermt '2026-10-14 06:00' -printf '%TY-%Tm-%TdT%TH:%TM %s %f\n' | sort | sed -n '1,55p'
          done
          echo "NEARBY_BACKUP_DIRECTORIES"
          find "$HOME/.backups" -maxdepth 2 -type d -newermt '2026-10-13 20:00' ! -newermt '2026-10-14 06:00' -printf '%TY-%Tm-%TdT%TH:%TM %f\n' | sort | sed -n '1,60p'
          REMOTE
      - name: Verify unique image paths exist on live host before release
        shell: bash
        run: |
          set -euo pipefail
          for asset in /static/site/heroes/ai.webp /static/site/heroes/economy.webp /static/site/heroes/smart-agriculture.webp; do
            code="$(curl -sSL --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$asset" || true)"
            echo "NEW_PAGE_ASSET=$asset STATUS=$code"
            test "$code" = 200
          done
      - name: Identify original 01AM historic restoration sources and broken route handlers read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import pathlib,os,datetime,hashlib
          home=pathlib.Path.home()
          paths=[home/'.backups',home/'Saeit'/'backups',home/'Saeit'/'var'/'backups',home/'backups',home/'backup']
          print("RESTORE_PROBE=read_only")
          print("RESTORE_CLOCK="+datetime.datetime.now(datetime.timezone.utc).isoformat())
          hits=[]
          for root in paths:
              print("SOURCE_DIR="+str(root.relative_to(home))+" is_dir="+str(root.is_dir()))
              if not root.is_dir():continue
              for folder,dirs,files in os.walk(root):
                  depth=len(pathlib.Path(folder).relative_to(root).parts)
                  dirs[:]=sorted(d for d in dirs if not d.startswith('.') and not any(z in d.lower() for z in ('mohammad','ghanadi','amozeshgah','secrets','token','ssh','credentials','venv'))) if depth<5 else []
                  if depth>5:continue
                  for filename in files:
                      name=filename.lower()
                      if not (name in ('index.html','company.html','about.html','original-home.html','.htaccess','passenger_wsgi.py','manifest.json') or any(z in name for z in ('20261015','20261014','2026-10-15','2026-10-14','backup','restore','snapshot','root-home','site-full'))):
                          continue
                      f=pathlib.Path(folder)/filename
                      if f.is_symlink():continue
                      try:stat=f.stat()
                      except OSError:continue
                      if stat.st_size>500_000_000:continue
                      m=datetime.datetime.fromtimestamp(stat.st_mtime,datetime.timezone.utc).isoformat(timespec='minutes')
                      if any(z in str(f).lower() for z in ('secret','token','passwd','credential')):continue
                      hits.append((str(f.relative_to(home)),stat.st_size,m))
          print("HISTORICAL_CANDIDATE_COUNT="+str(len(hits)))
          for rel,size,mtime in sorted(hits,key=lambda x:x[2])[:110]:
              print("HISTORICAL_FILE="+rel+" bytes="+str(size)+" modified_utc="+mtime)
          web=home/'public_html'
          for slug in ('contact','economy','market','company','agents','admin','newsletter','store','blog','auctions'):
              p=web/slug
              q=p/'index.html'
              route='/' + slug + '/'
              print("ROUTE_FILES="+route+" folder="+str(p.is_dir())+" static_index="+str(q.is_file())+" local_htaccess="+str((p/'.htaccess').is_file()))
              if q.is_file() and not q.is_symlink():
                  print("ROUTE_STATIC_SHA256="+route+" "+hashlib.sha256(q.read_bytes()).hexdigest()[:24])
          for app in (home/'Saeit'/'passenger_wsgi.py',home/'public_html'/'passenger_wsgi.py',home/'Saeit'/'config'/'wsgi.py'):
              print("APP_RUNTIME_FILE="+str(app.relative_to(home))+" present="+str(app.is_file()))
          for cfg in (home/'public_html'/'.htaccess',home/'Saeit'/'.htaccess'):
              print("ROOT_ROUTING_FILE="+str(cfg.relative_to(home))+" present="+str(cfg.is_file()))
              if not cfg.is_file():continue
              for line in cfg.read_text(errors='replace').splitlines():
                  item=line.strip()
                  if item.startswith('#') or not item:continue
                  key=item.split()[0]
                  if key.lower().startswith(('passenger','rewrite','directoryindex','addhandler','options')):
                      if key.lower().startswith('passenger') and any(t in key.lower() for t in ('path','root','python','app','startup')):
                          print("ROUTING_DIRECTIVE="+key+" VALUE=REDACTED")
                      else:
                          print("ROUTING_DIRECTIVE_NAME="+key)
          PY
          REMOTE
      - name: Check 01AM snapshot fingerprints and Django startup without changing live routes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import os, pathlib, datetime, shlex, subprocess
          home=pathlib.Path.home()
          utc=datetime.timezone.utc
          start=datetime.datetime(2026,10,13,17,30,tzinfo=utc)
          end=datetime.datetime(2026,10,14,1,30,tzinfo=utc)
          roots=[home/'.backups',home/'Saeit'/'backups',home/'Saeit'/'var'/'backups']
          found=[]
          for root in roots:
              if not root.is_dir():continue
              for directory,dirs,files in os.walk(root):
                  depth=len(pathlib.Path(directory).relative_to(root).parts)
                  dirs[:]=[x for x in dirs if not x.startswith('.') and not any(k in x.lower() for k in ('mojtaba','mohammad','ghanadi','amozeshgah','secret','ssh','credentials','token'))] if depth<5 else []
                  for filename in files:
                      f=pathlib.Path(directory)/filename
                      if f.is_symlink():continue
                      name=filename.lower()
                      if not (name in ('index.html','company.html','about.html','passenger_wsgi.py','manifest.json','urls.py','views.py') or any(k in name for k in ('20261015','20261014','snapshot','restor','backup'))):continue
                      try:
                          st=f.stat()
                          dt=datetime.datetime.fromtimestamp(st.st_mtime,utc)
                      except OSError:continue
                      if start<=dt<=end and st.st_size<=300_000_000:
                          found.append((dt, str(f.relative_to(home)),st.st_size))
          print('NEAR_1AM_CANDIDATES='+str(len(found)))
          for dt,rel,sz in sorted(found)[:90]:
              print('NEAR_1AM_FILE='+dt.isoformat(timespec='minutes')+' size='+str(sz)+' path='+rel)
          rootcfg=home/'public_html'/'.htaccess'
          if rootcfg.is_file():
              for raw in rootcfg.read_text(errors='replace').splitlines():
                  text=raw.strip()
                  if not text or text.startswith('#'):continue
                  try:tokens=shlex.split(text)
                  except ValueError:continue
                  if not tokens:continue
                  key=tokens[0].lower()
                  if key in ('passengerpython','passengerapproot','passengerstartupfile','passengerbaseuri'):
                      val=tokens[1] if len(tokens)>1 else ''
                      if key in ('passengerpython','passengerapproot'):
                          target=pathlib.Path(val)
                          print('PASSENGER_CONFIG='+key+' configured=yes path_exists='+str(target.exists())+' is_file='+str(target.is_file()))
                      else:print('PASSENGER_CONFIG='+key+' configured=yes')
          for n in ('virtualenv/Saeit/3.10/bin/python','Saeit/passenger_wsgi.py','Saeit/.env','Saeit/db.sqlite3'):
              f=home/n
              print('RUNTIME_ASSET='+n+' present='+str(f.is_file())+' bytes='+(str(f.stat().st_size) if f.is_file() else '0'))
          exe=home/'virtualenv'/'Saeit'/'3.10'/'bin'/'python'
          app=home/'Saeit'
          if exe.is_file() and app.is_dir():
              code='import os;os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings");from passenger_wsgi import application;print("DJANGO_WSGI_IMPORT=PASS")'
              try:
                  proc=subprocess.run([str(exe),'-B','-c',code],cwd=app,text=True,capture_output=True,timeout=25,env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1'))
                  print('DJANGO_WSGI_EXIT='+str(proc.returncode))
                  if 'DJANGO_WSGI_IMPORT=PASS' in proc.stdout:print('DJANGO_WSGI_IMPORT=PASS')
                  else:
                      out=proc.stderr or proc.stdout
                      kinds=['ModuleNotFoundError','ImportError','RuntimeError','django.core.exceptions','sqlite3.OperationalError','OperationalError','No module named','RecursionError','pydantic_core','segmentation fault','PermissionError','FileNotFoundError']
                      print('DJANGO_WSGI_KNOWN_ERRORS='+','.join(k for k in kinds if k in out))
                      print('DJANGO_WSGI_LAST_EXCEPTION_CLASS='+next((x.split(':',1)[0].split('.')[-1] for x in out.splitlines()[::-1] if 'Error:' in x or 'Exception:' in x),'none'))
              except subprocess.TimeoutExpired:
                  print('DJANGO_WSGI_IMPORT=TIMEOUT')
          logs=[home/'Saeit'/'stderr.log',home/'Saeit'/'passenger.log',home/'public_html'/'error_log',home/'public_html'/'stderr.log']
          for file in logs:
              if not file.is_file():continue
              with file.open('rb') as stream:
                  stream.seek(max(0,file.stat().st_size-48000))
                  text=stream.read(48000).decode('utf-8','replace')
              tokens=['set_env_vars.py','VIRTUAL_ENV','Passenger','Traceback','ModuleNotFoundError','RecursionError','PythonHome','pydantic_core']
              print('RUNTIME_LOG_CATEGORY='+file.name+' bytes='+str(file.stat().st_size)+' markers='+','.join(t for t in tokens if t.lower() in text.lower()))
          PY
          REMOTE
      - name: Classify Passenger failure traceback without exposing private error text
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import pathlib,re,collections
          home=pathlib.Path.home()
          p=home/'Saeit'/'stderr.log'
          if not p.is_file():
              print('PASSENGER_LOG=missing');raise SystemExit
          with p.open('rb') as fh:
              fh.seek(max(0,p.stat().st_size-350000))
              s=fh.read(350000).decode('utf8','replace')
          errors=re.findall(r'(?m)^([a-zA-Z_][a-zA-Z0-9_.]*(?:Error|Exception)):\s*[^\n]*',s)
          print('PASSENGER_ERRORS_IN_TAIL='+repr(dict(collections.Counter(errors).most_common(12))))
          chunks=s.split('Traceback (most recent call last):')
          print('PASSENGER_TRACEBACKS_IN_TAIL='+str(len(chunks)-1))
          for block in chunks[-4:]:
              if not block.strip():continue
              frames=re.findall(r'File "([^"]+)", line (\d+), in ([^\n]+)',block)
              print('TRACEBACK_FRAMES='+str(len(frames))+' frame_tails='+','.join(pathlib.Path(f).name+':'+n+':'+re.sub('[^a-zA-Z0-9_]', '', fun)[:30] for f,n,fun in frames[-6:]))
              types=re.findall(r'(?m)^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):',block)
              print('TRACEBACK_EXCEPTION='+(types[-1] if types else 'unresolved'))
          for term in ('set_env_vars.py','VIRTUAL_ENV','populate() isn\'t reentrant','max children','Resource temporarily unavailable','pydantic_core'):
              print('PASSENGER_ERROR_MARKER='+term+' count='+str(s.lower().count(term.lower())))
          PY
          REMOTE
      - name: Correlate 14 Oct 01AM backup and cloud selector live status
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,subprocess,json,collections,re
          home=Path.home()
          target=datetime.fromisoformat('2026-10-13T21:30:00+00:00')
          starts=target.timestamp()-3600
          ends=target.timestamp()+3600
          roots=[home/'.backups',home/'Saeit'/'backups',home/'Saeit'/'var'/'backups']
          hits=[]
          for root in roots:
              if not root.is_dir():continue
              for folder,dirs,files in os.walk(root):
