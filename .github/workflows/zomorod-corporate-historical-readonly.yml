name: Zomorod Corporate 1AM Backup Readonly Audit
on:
  pull_request:
    branches: [main]
    paths:
      - "content/zomorod-nova-pages/about.html"
      - "content/zomorod-nova-pages/company.html"
      - ".github/workflows/zomorod-corporate-historical-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Offline content checks
        run: python -m unittest discover -s tests -p test_zomorod_corporate_content_restoration.py -v
      - name: Prepare fingerprint-pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-readonly"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" > /dev/null
          ssh-keygen -y -P "" -f "$d/host.key" > /dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "RELAY_PINNED=verified"
      - name: Inspect only original host snapshots and live file fingerprints
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          web="$HOME/public_html"
          echo "READ_ONLY=true"
          echo "HOST_CLOCK=$(date -Is)"
          echo "REQUESTED_BACKUP_LOCAL=2026-10-15T01:00:00+03:30"
          for slug in about company; do
            p="$web/$slug/index.html"
            if [ -f "$p" ]; then
              echo "PAGE=$slug BYTES=$(stat -c '%s' "$p") SHA256=$(sha256sum "$p" | cut -d' ' -f1)"
            else
              echo "MISSING_PAGE=$slug"
            fi
          done
          for name in index.html site-heritage/home-before-redesign/index.html mohammad/index.html ghanadi/index.html amozeshgah/index.html; do
            p="$web/$name"
            if [ -f "$p" ]; then
              echo "PROTECTED=$name BYTES=$(stat -c '%s' "$p") SHA256=$(sha256sum "$p" | cut -d' ' -f1)"
            else
              echo "MISSING_PROTECTED=$name"
            fi
          done
          for n in zomorodmelal-root-homepage zomorodmelal-app zomorod-nova-publish; do
            dir="$HOME/.backups/$n"
            if [ -d "$dir" ]; then
              echo "BACKUP_DIR=$n"
              find "$dir" -maxdepth 4 -type f \( -iname '*.html' -o -iname '*.manifest' -o -iname '*company*' -o -iname '*about*' -o -iname '*backup*' \) -printf '%TY-%Tm-%TdT%TH:%TM %s %f\n' | sort | head -n 75
            else
              echo "BACKUP_DIR_ABSENT=$n"
            fi
          done
          for path in / /about/ /company/ /site-heritage/home-before-redesign/ /mohammad/ /ghanadi/ /amozeshgah/ /company/executive/ /contact/ /economy/ /market/; do
            code="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "HTTP=$path:$code"
          done
          REMOTE
      - name: Discover candidate 15 Oct 1AM host backups by timestamp only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-readonly"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          echo "BACKUP_TIME_WINDOW=2026-10-14T20:00_to_2026-10-15T06:00_HOST_LOCAL"
          for name in zomorodmelal-root-homepage zomorodmelal-app zomorod-nova-publish; do
            dir="$HOME/.backups/$name"
            test -d "$dir" || continue
            echo "BACKUP_CANDIDATE_SOURCE=$name"
            find "$dir" -maxdepth 2 -mindepth 1 -printf '%y %TY-%Tm-%TdT%TH:%TM %s %P\n' | sort | sed -n '1,45p'
            echo "EARLY_15_OCT_CANDIDATES=$name"
            find "$dir" -maxdepth 5 -type f -newermt '2026-10-14 20:00' ! -newermt '2026-10-15 06:00' -printf '%TY-%Tm-%TdT%TH:%TM %s %f\n' | sort | sed -n '1,55p'
          done
          echo "NEARBY_BACKUP_DIRECTORIES"
          find "$HOME/.backups" -maxdepth 2 -type d -newermt '2026-10-14 20:00' ! -newermt '2026-10-15 06:00' -printf '%TY-%Tm-%TdT%TH:%TM %f\n' | sort | sed -n '1,60p'
          REMOTE
      - name: Erase runner-only relay credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-readonly"
