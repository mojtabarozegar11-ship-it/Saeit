name: MojPlayWin walletless gateway cPanel staging contract audit (read only)
on:
  push:
    branches: [fix/mpw-tron-provider-auth-20261022]
    paths:
      - scripts/mpw_gateway_stage_contract_probe_20261022.py
      - scripts/mpw_gateway_cpanel_uapi_capability_20261022.py
      - scripts/mpw_tron_dual_provider_auth_readonly_20261022.py
      - .github/workflows/mpw-gateway-stage-contract-audit-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cpanel-staging-read-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/fix/mpw-tron-provider-auth-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify probe can only introspect metadata
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_gateway_stage_contract_probe_20261022.py
          python3 - <<'PY'
          import ast,pathlib
          tree=ast.parse(pathlib.Path('scripts/mpw_gateway_stage_contract_probe_20261022.py').read_text())
          # This is a read-only diagnostic. Reject obvious SQL mutation and shell execution.
          content=ast.unparse(tree).upper()
          for forbidden in ('CURSOR.EXECUTE(', 'OBJECTS.CREATE(', 'OBJECTS.UPDATE(',
                            'OBJECTS.DELETE(', 'SUBPROCESS.', 'OS.SYSTEM('):
              assert forbidden not in content, forbidden
          print('READ_ONLY_CONTRACT_PROBE=CHECKED')
          PY
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 3\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 50s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Inspect real staging Django model and MariaDB schema without writing
        run: |
          set -euo pipefail
          timeout 130s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' < scripts/mpw_gateway_stage_contract_probe_20261022.py
      - name: Discover whether cPanel can provision a separate test database (read only)
        run: |
          set -euo pipefail
          timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' < scripts/mpw_gateway_cpanel_uapi_capability_20261022.py
      - name: Verify two production RPC sources against read-only native TRX canary
        run: |
          set -euo pipefail
          if timeout 45s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel 'test -r /home/zomorod2/Saeit-staging/services/mpw_tron_independent_solidified_rpc.py'; then
            timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' < scripts/mpw_tron_dual_provider_auth_readonly_20261022.py
          else
            echo '{"status":"BLOCKED","reason":"rpc_verifier_not_deployed_in_cpanel_staging","public_payment_activated":false,"financial_writes":0}'
          fi
          echo 'READ_ONLY=TRUE; FINANCIAL_WRITES=0; PUBLIC_PAYMENT_ACTIVATION=0'
      - name: Clean ephemeral SSH material
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/mpw-gateway-contract-ssh"
