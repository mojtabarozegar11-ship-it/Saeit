name: Factory evolved-source to verified private ZIP and QA receipt
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/factory_evolution_rebuild.py
      - tests/test_factory_evolution_rebuild.py
      - .github/workflows/factory-evolved-zip-rebuild-20261021.yml
  push:
    branches: [main]
    paths:
      - scripts/factory_evolution_rebuild.py
      - tests/test_factory_evolution_rebuild.py
      - .github/workflows/factory-evolved-zip-rebuild-20261021.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: factory-evolution-package-rebuild-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measured-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned genuine workbook dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
      - name: Prove rebuild, changed ZIP SHA, preserved originals and post-write rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/factory_evolution_rebuild.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_factory_evolution_rebuild -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_factory_source_evolution -v
          echo FACTORY_EVOLVED_ARCHIVE_REGRESSIONS=PASS
          echo FACTORY_INDEPENDENT_1000_QUALITY_AUTO_APPROVAL=false
  rebuild-private-vps:
    needs: measured-rebuild
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate pinned VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/evolved-zip"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          echo FACTORY_EVOLVED_ZIP_PINNED_SSH=PASS
      - name: Rebuild stale private products under both factory locks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/evolved-zip"
          opts=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          host="githubops@178.239.147.150"
          stage="/home/githubops/factory-runtime/operations/.evolved-zip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          scp -q "${opts[@]}" scripts/factory_evolution_rebuild.py "$host:$stage"
          expected="$(sha256sum scripts/factory_evolution_rebuild.py | cut -d' ' -f1)"
          actual="$(ssh -T "${opts[@]}" "$host" "sha256sum '$stage' | cut -d' ' -f1")"
          test "$expected" = "$actual"
          timeout 540s ssh -T "${opts[@]}" "$host" "bash -se -- '$stage'" <<'REMOTE'
          set -euo pipefail
          umask 077
          stage="$1"
          base="$HOME/factory-runtime"
          ops="$base/operations"
          target="$ops/autonomous-product-runtime/scripts"
          python="$base/.venv/bin/python"
          private="$base/private/autonomous-product-cycle"
          test "$(id -un)" = githubops && test -d "$target" && test ! -L "$target" && test -x "$python" && test -d "$private"
          exec 8>"$ops/autonomous-product-cycle.lock"
          flock -w 180 8
          exec 9>"$private/.production-cycle.lock"
          flock -w 60 9
          file="$target/factory_evolution_rebuild.py"
          previous="$ops/backup-evolved-zip-$RANDOM.py"
          already=0
          if test -e "$file"; then
            test -f "$file" && test ! -L "$file"
            cp -p "$file" "$previous"
            already=1
          fi
          restore() {
            rc=$?
            if test "$rc" -ne 0; then
              if test "$already" -eq 1; then cp -p "$previous" "$file"; else rm -f "$file"; fi
              echo FACTORY_EVOLVED_ZIP_INSTALL_ROLLED_BACK=YES
            fi
            exit "$rc"
          }
          trap restore EXIT
          temp="$(mktemp "$target/.evolved-zip.XXXXXXXX")"
          cp "$stage" "$temp"
          chmod 600 "$temp"
          mv -f "$temp" "$file"
          test "$(sha256sum "$file" | cut -d' ' -f1)" = "$(sha256sum "$stage" | cut -d' ' -f1)"
          echo FACTORY_EVOLVED_ZIP_EXECUTOR_SHA_VERIFIED=PASS
          "$python" -B -m py_compile "$file"
          "$python" -B "$file" --root "$private" --scripts "$target" --limit 3
          trap - EXIT
          echo FACTORY_EVOLVED_ZIP_PRIVATE_REBUILD=PASS
          echo FACTORY_EVOLVED_ZIP_PUBLICATION=0
          REMOTE
      - name: Remove transient SSH credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/evolved-zip"
