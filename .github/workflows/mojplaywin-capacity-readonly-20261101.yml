name: MojPlayWin VPS off-host capacity inventory - read-only only
on:
  pull_request:
    types: [synchronize]
    branches: [diagnostic/mpw-backup-pair-pin-20261101]
    paths:
      - ".github/workflows/mojplaywin-capacity-readonly-20261101.yml"
permissions:
  contents: read
concurrency:
  group: mojplaywin-backup-capacity-inventory-20261101
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.action == 'synchronize' && github.actor == 'mojtabarozegar11-ship-it' && github.event.pull_request.number == 1738 && github.head_ref == 'diagnostic/mpw-pinned-direct-preflight-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "IMMUTABLE_HEAD_CHECKOUT=verified"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-capacity-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -d /home/zomorod2/Saeit-staging && test -d /home/zomorod2/mojplaywin.com' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -d /home/zomorod2/Saeit-staging && test -d /home/zomorod2/mojplaywin.com' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Aggregate VPS archive footprint and free space without archive-name exposure
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-capacity-inventory"
          code='from pathlib import Path;import shutil,stat,re;h=Path.home();p=h/".private-mojplaywin-offhost-backups";assert not p.is_symlink();dest=p if p.is_dir() else h;free=shutil.disk_usage(dest).free;size=count=partial=0;pattern=re.compile(r"^mojplaywin_[0-9]{8}T[0-9]{6}Z_[0-9a-f]{16}_(mysql|files)_gpgv2.gpg$");items=list(p.iterdir()) if p.is_dir() else [];assert len(items)<5000;[(None) for q in items if q.is_symlink() and (_ for _ in ()).throw(RuntimeError("unsafe backup link"))];complete=[q for q in items if pattern.fullmatch(q.name) and q.is_file() and not q.is_symlink()];size=sum(q.stat().st_size for q in complete);partial=sum(1 for q in items if q.name.endswith(".partial"));count=len(complete);print("VPS_BACKUP_FREE_MIB="+str(free//(1024**2)));print("VPS_PINNED_ARCHIVES_COUNT="+str(count));print("VPS_PINNED_ARCHIVES_MIB="+str(size//(1024**2)));print("VPS_PARTIAL_FILE_COUNT="+str(partial));print("VPS_10GIB_START_POLICY="+("PASS" if free>=10*1024**3 else "FAIL_NO_WRITE"))'
          timeout 70s ssh -T -F "$d/config" saeit-vps "python3 -c '$code'"
      - name: Calculate bounded source root footprint after strict alias validation
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/mpw-capacity-inventory"
          src64="$(base64 -w0 scripts/mojplaywin_backup_stream_cpanel.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 170s ssh -T -F "$d/config" "$COMMAND_HOST" "python3 -c '$call' '$src64' preflight-scoped-files" >/dev/null
          timeout 140s ssh -T -F "$d/config" "$COMMAND_HOST" 'set -eu; test "$(id -un)" = zomorod2; app=$(du -skL /home/zomorod2/Saeit-staging | cut -f1); web=$(du -skL /home/zomorod2/mojplaywin.com | cut -f1); case "$app:$web" in *[!0-9:]*|"") exit 1;; esac; echo "CPANEL_ROOTS_TOTAL_MIB=$(((app+web)/1024))"; echo "CPANEL_CONTENT_READ=NONE"; echo "CPANEL_SOURCE_MUTATION=NONE"'
          echo "CAPACITY_PLANNING=METADATA_ONLY"
      - name: Read-only inventory of regenerable VPS user cache footprint
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-capacity-inventory"
          code='from pathlib import Path;import subprocess;home=Path.home();entries=(("USER_CACHE_TOTAL","cache"),("PIP_CACHE","cache/pip"),("UV_CACHE","cache/uv"),("NPM_CACHE","npm/_cacache"),("NODE_CACHE","cache/node"),("RUST_CACHE","cargo/registry/cache"));[(lambda p,label:print(label+"_MIB="+str(int(subprocess.run(["du","-skx","--",str(p)],check=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=35).stdout.split()[0])//1024) if p.is_dir() and not p.is_symlink() else label+"_MIB=0"))(home/rel,label) for label,rel in entries]'
          timeout 95s ssh -T -F "$d/config" saeit-vps "python3 -c '$code'"
          echo "USER_CACHE_INSPECTION=READ_ONLY"
      - name: Remove temporary SSH keys
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-capacity-inventory"
          if [[ "$d" == "$RUNNER_TEMP/mpw-capacity-inventory" ]] && test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/cpanel.sock" "$d/direct.sock"
          fi
