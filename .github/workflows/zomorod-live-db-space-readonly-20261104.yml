name: Zomorod production database space diagnostics 2026-11-04
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-live-db-space-readonly-20261104.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-live-db-space-readonly-20261104
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read production database space without reading user records
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          raw=subprocess.check_output(['uapi','--output=json','Mysql','list_databases'],text=True,timeout=25)
          data=json.loads(raw)['result']['data']
          for item in data:
              size=int(item.get('disk_usage') or 0)
              print('CPANEL_DATABASE_SIZE_BYTES='+str(size))
          PY
          python=''
          for item in /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/Saeit/.venv/bin/python /home/zomorod2/virtualenv/Saeit/3.10/bin/python; do
            if test -x "$item"; then python="$item";break;fi
          done
          if test -z "$python";then echo DB_DJANGO_RUNTIME_UNAVAILABLE=1;exit 0;fi
          cd /home/zomorod2/Saeit
          "$python" - <<'PY'
          import os,json
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.db import connection
          print('DJANGO_DATABASE_ENGINE='+connection.vendor)
          if connection.vendor!='mysql':
              print('MAIN_DB_TABLE_DIAGNOSTICS_SKIPPED_NONMYSQL=1')
              raise SystemExit(0)
          with connection.cursor() as cursor:
              cursor.execute("""SELECT TABLE_NAME,DATA_LENGTH,INDEX_LENGTH,DATA_FREE,TABLE_ROWS
                                FROM information_schema.TABLES
                                WHERE TABLE_SCHEMA=DATABASE()
                                ORDER BY (DATA_LENGTH+INDEX_LENGTH) DESC LIMIT 20""")
              rows=cursor.fetchall()
          for name,data,index,free,estimated_rows in rows:
              print('TABLE_SPACE='+json.dumps({'table':name,'data_bytes':int(data or 0),'index_bytes':int(index or 0),'free_bytes':int(free or 0),'estimated_rows':int(estimated_rows or 0)},sort_keys=True))
          print('DB_METADATA_ONLY_AUDIT_COMPLETE=1')
          PY
          REMOTE
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -rf -- "$d"; fi
