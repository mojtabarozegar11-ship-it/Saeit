name: Zomorod R25 Digital Products release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zomorod-r25-digital-products-20261019.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-r25-digital-products
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[approved-zm-it-products-20261019]'))
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static lint and 21 product completeness test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zm_it_products_publish_20261019.py
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('content/zomorod-it-products-20261019/index.html').read_text()
          m=re.search(r'<script id="catalog" type="application/json">(.*?)</script>',html,re.S)
          assert m and '<main>' in html
          data=json.loads(m.group(1))
          assert len(data)==21 and len({x['slug'] for x in data})==21
          assert all(len(x['labels'])==3 and len(x['values'])==3 for x in data)
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          assert len(scripts)==1
          Path('/tmp/zm_it_products.js').write_text(scripts[0])
          print('IT_PRODUCT_CATALOG_21=PASS')
          PY
          node --check /tmp/zm_it_products.js
      - name: Preflight existing public pages and cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          base="https://zomorodmelal.ir"
          def get(path,limit=3500000):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"ZomorodR25ReleaseQA/1","Cache-Control":"no-cache"}),timeout=28) as resp:
                          assert resp.status==200
                          return resp.read(limit)
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          items=json.loads(get('/topics/topic-manifest.json',180000))
          cards=[c for c in items['topics'] if c['row']=='ZM-R25']
          source=Path('content/zomorod-it-products-20261019/index.html').read_text()
          catalog=json.loads(re.search(r'<script id="catalog" type="application/json">(.*?)</script>',source,re.S).group(1))
          assert {c['path'].split('/')[-2] for c in cards}=={c['slug'] for c in catalog}
          assert len(cards)==21
          home=get('/')
          m=re.search(rb'window\.ZOMOROD_ORBIT_DATA=(\{.*?\});</script>',home,re.S)
          assert m
          row=next(r for r in json.loads(m.group(1))['rows'] if r['id']=='ZM-R25')
          assert len(row['cards'])==22
          actual={c.get('canonicalUrl') for c in row['cards']}
          expected={c['path'] for c in cards}|{'/farm-wars/'}
          print('R25_URL_DIAGNOSTIC_ACTUAL='+repr(sorted(actual,key=str)),flush=True)
          print('R25_URL_DIAGNOSTIC_MISSING='+repr(sorted(expected-actual)),flush=True)
          print('R25_URL_DIAGNOSTIC_EXTRA='+repr(sorted(actual-expected,key=str)),flush=True)
          assert actual==expected, 'R25 URL mismatch; see diagnostic above'
          assert b'<html' in get('/farm-wars/',200000).lower()
          for c in cards:
              p=get(c['path'],90000)
              assert b'<h1' in p.lower() and b'</main>' in p.lower(),c['path']
          print('R25_22_EXISTING_CARDS_VALIDATED=PASS')
          PY
      - name: Open pinned VPS to hosting SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Stage and back up exactly 21 pages
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-it-products-$GITHUB_RUN_ID"
          timeout 45s ssh -T -F "$d/config" host "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          timeout 45s scp -q -F "$d/config" content/zomorod-it-products-20261019/index.html "host:$stage/index.html"
          timeout 45s scp -q -F "$d/config" scripts/zm_it_products_publish_20261019.py "host:$stage/installer.py"
          timeout 100s ssh -T -F "$d/config" host "python3 '$stage/installer.py' prepare '$GITHUB_RUN_ID'"
      - name: Atomic create new app and append existing card-page products
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-it-products-$GITHUB_RUN_ID"
          timeout 120s ssh -T -F "$d/config" host "python3 '$stage/installer.py' install '$GITHUB_RUN_ID'"
          timeout 65s ssh -T -F "$d/config" host "python3 '$stage/installer.py' verify '$GITHUB_RUN_ID'"
      - name: Public HTTP acceptance for all products and existing game
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          text=Path('content/zomorod-it-products-20261019/index.html').read_text()
          catalog=json.loads(re.search(r'<script id="catalog" type="application/json">(.*?)</script>',text,re.S).group(1))
          def get(route):
              for attempt in range(5):
                  try:
                      req=urllib.request.Request('https://zomorodmelal.ir'+route,headers={'User-Agent':'ZomorodR25LiveProductQA','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=35) as res:
                          assert res.status==200
                          return res.read(220000).decode('utf-8','replace')
                  except Exception:
                      if attempt==4:raise
                      time.sleep(3)
          app=get('/digital-lab/?tool=seo')
          assert 'ZOMOROD DIGITAL LAB' in app
          for c in catalog:
              slug=c['slug']
              page=get('/topics/zm-r25/'+slug+'/')
              assert 'ZM-IT-PRODUCT-20261019:'+slug+':BEGIN' in page
              assert '/digital-lab/?tool='+slug in page
              print('LIVE_PRODUCT=PASS '+slug,flush=True)
          assert 'FARM DOMINION' in get('/farm-wars/')
          print('PUBLIC_DIGITAL_PRODUCTS_21_AND_GAME_1=PASS')
          PY
      - name: Roll back only owned changes if failed
        if: failure() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-it-products-$GITHUB_RUN_ID"
          if test -f "$d/config"; then
            timeout 100s ssh -T -F "$d/config" host "test -f '$stage/state.json' && python3 '$stage/installer.py' rollback '$GITHUB_RUN_ID'" || true
          fi
      - name: Cleanup private backups after verified release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-it-products-$GITHUB_RUN_ID"
          timeout 75s ssh -T -F "$d/config" host "python3 '$stage/installer.py' cleanup '$GITHUB_RUN_ID'"
      - name: Clear ephemeral SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/farm-v4-ssh"
