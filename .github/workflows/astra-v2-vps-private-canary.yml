name: Astra V2 VPS Isolated Product Canary

on:
  push:
    branches: [feature/astra-factory-v2-architecture-20261014]
    paths: [.github/workflows/astra-v2-vps-private-canary.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-v2-vps-private-canary
  cancel-in-progress: false

jobs:
  isolated-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Run a bounded QA-only canary on VPS, without touching existing factory
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" || { echo "ASTRA_CANARY_KEY_MISSING"; exit 1; }
          temp="$RUNNER_TEMP/astra-v2-vps"
          install -d -m 700 "$temp"
          trap 'rm -rf -- "$temp"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$temp/key"
          chmod 600 "$temp/key"
          ssh-keygen -y -P '' -f "$temp/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$temp/known" 2>/dev/null
          test "$(ssh-keygen -lf "$temp/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          SSH=(ssh -i "$temp/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 githubops@178.239.147.150)
          tar -cf - scripts/astra_v2_private_pipeline.py tests/test_astra_orchard_decision_audit.py tests/test_astra_v2_private_pipeline.py product_prototypes/orchard_decision_audit | "${SSH[@]}" 'set -eu; umask 077; dest="$HOME/factory-runtime/operations/astra-v2-vps-canary-source"; mkdir -p "$dest"; tar -xf - -C "$dest"'
          "${SSH[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          stage="$HOME/factory-runtime/operations/astra-v2-vps-canary-source"
          private="$HOME/factory-runtime/private/astra-v2-canary-products"
          test -f "$HOME/factory-runtime/private/factory-fresh-isolated.sqlite3"
          test -f "$stage/scripts/astra_v2_private_pipeline.py"
          test -f "$stage/product_prototypes/orchard_decision_audit/serve_local.py"
          command -v python3 >/dev/null
          python3 --version
          cd "$stage"
          python3 -m unittest discover -s tests -p 'test_astra_orchard_decision_audit.py' -q
          python3 -m unittest discover -s tests -p 'test_astra_v2_private_pipeline.py' -q
          mkdir -p "$private"
          python3 - <<'PY'
          import json,pathlib,hashlib
          stage=pathlib.Path.home()/"factory-runtime/operations/astra-v2-vps-canary-source"
          product=stage/"product_prototypes/orchard_decision_audit"
          sources=("decision_audit.py","app.js","index.html","style.css","README.md","self_test.py","serve_local.py")
          sha=hashlib.sha256(b"".join((product/k).read_bytes() for k in sources)).hexdigest()[:16]
          p=stage/"brief-private-v1.json"
          obj={
           "brief_id":"vps_orchard_reference_"+sha,
           "builder":"orchard_decision_audit_v2",
           "development_scope":"private_reference_prototype",
           "publication_allowed":False,
           "market_demand_verified":False,
           "paid_api_budget":0,
           "problem":"Demonstrate a real locally auditable multi-year orchard investment comparison, without any external spending or market claims."
          }
          if not p.exists():
           p.write_text(json.dumps(obj,sort_keys=True)+"\n")
           p.chmod(0o600)
          else:
           assert json.loads(p.read_text())==obj
          PY
          python3 scripts/astra_v2_private_pipeline.py enqueue --root "$private" --brief "$stage/brief-private-v1.json"
          python3 scripts/astra_v2_private_pipeline.py tick --root "$private"
          python3 scripts/astra_v2_private_pipeline.py tick --root "$private"
          python3 scripts/astra_v2_private_pipeline.py status --root "$private"
          python3 - "$private" <<'PY'
          import pathlib,sqlite3,sys,json,zipfile
          p=pathlib.Path(sys.argv[1])
          assert p.resolve()==pathlib.Path.home()/"factory-runtime/private/astra-v2-canary-products"
          con=sqlite3.connect(p/"queue.sqlite3")
          states=dict(con.execute("SELECT stage,count(*) FROM jobs GROUP BY stage"))
          assert states.get("PRIVATE_QA_PASSED",0)>=1,states
          artifacts=list(p.glob("artifact-*.zip"))
          manifest=list(p.glob("qa-*.json"))
          assert len(artifacts)>=1 and len(manifest)>=1
          for filename in artifacts: assert zipfile.ZipFile(filename).testzip() is None
          audit=json.loads(manifest[0].read_text())
          assert audit["sale_ready"] is False and audit["owner_publication_approval"] is False
          assert audit["quality_score"] is None and audit["real_payment_allowed"] is False
          print("ASTRA_V2_VPS_ISOLATED_QA=PASS")
          print("ASTRA_V2_VPS_DISTINCT_PRIVATE_ARTIFACTS="+str(len(artifacts)))
          print("ASTRA_V2_VPS_PROTOTYPE_STATUS=PRIVATE_ONLY")
          print("ASTRA_V2_VPS_PUBLICATION=false")
          print("ASTRA_V2_VPS_OLD_FACTORY_LOOP_UNTOUCHED=true")
          print("ASTRA_V2_VPS_EXISTING_SITES_UNMODIFIED=true")
          print("ASTRA_V2_VPS_CONTINUOUS_SCHEDULER_NOT_INSTALLED=true")
          PY
          REMOTE
