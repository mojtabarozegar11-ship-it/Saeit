name: Provision dedicated empty MOJ Pay identity DB on cPanel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/banknew-create-private-identity-db-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banknew-dedicated-empty-db-create
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Create only absent isolated empty database through cPanel UAPI
        run: |
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,os,subprocess,shutil
          from pathlib import Path
          root=Path('/home/zomorod2/mojpay-bank-service-private')
          assert root.is_dir() and not root.is_symlink()
          py=root/'.venv'/'bin'/'python'
          assert py.is_file()
          check=subprocess.run([str(py),'-c','import django,MySQLdb;assert django.VERSION[:2]==(5,2)'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)
          assert check.returncode==0,'BANKNEW_RUNTIME_NOT_READY'
          target='zomorod2_mojpayid'
          assert target.startswith('zomorod2_') and len(target)<=35
          candidate=shutil.which('uapi') or '/usr/local/cpanel/bin/uapi'
          assert Path(candidate).is_file() and os.access(candidate,os.X_OK),'CPANEL_UAPI_NOT_FOUND'
          def api(function,*args):
              r=subprocess.run([candidate,'--output=json','Mysql',function,*args],capture_output=True,text=True,timeout=30)
              assert r.returncode==0,'CPANEL_UAPI_CALL_FAILURE_'+function
              doc=json.loads(r.stdout)
              assert isinstance(doc,dict) and isinstance(doc.get('result'),dict)
              return doc['result']
          before=api('list_databases')
          assert str(before.get('status'))=='1','CPANEL_DATABASE_ENUMERATION_DENIED'
          existing=json.dumps(before.get('data',[]),ensure_ascii=True)
          if target in existing:
              print('BANKNEW_DEDICATED_DATABASE=ALREADY_PRESENT_NO_CHANGE')
          else:
              created=api('create_database','name='+target)
              assert str(created.get('status'))=='1','CPANEL_DEDICATED_DB_CREATION_FAILED'
              print('BANKNEW_DEDICATED_EMPTY_DATABASE=CREATED')
          print('BANKNEW_OTHER_DATABASES_MODIFIED=NO')
          print('BANKNEW_DATABASE_USER_CREATED=NO')
          print('BANKNEW_EXISTING_SCHEMAS_CHANGED=NO')
          print('BANKNEW_SECRETS_EXPORTED=NO')
          print('BANKNEW_PUBLIC_API_CHANGED=NO')
          print('BANKNEW_PAYMENTS_ACTIVE=NO')
          PY
      - name: Clear transient SSH relay credentials
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/mpw-structure-ssh"; then
            find "$RUNNER_TEMP/mpw-structure-ssh" -type f -exec shred -u -- {} +
            rmdir "$RUNNER_TEMP/mpw-structure-ssh"
          fi
