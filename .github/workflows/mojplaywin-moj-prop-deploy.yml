name: Update Moj Prop commercial catalog on MojPlayWin

on:
  pull_request:
    paths:
      - ".github/workflows/mojplaywin-moj-prop-deploy.yml"
      - "scripts/update_mojplaywin_moj_prop_catalog.py"
      - "scripts/deploy_mojplaywin_moj_prop.py"
      - "templates/moj-prop-v4/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-moj-prop-deploy.yml"
      - "scripts/update_mojplaywin_moj_prop_catalog.py"
      - "scripts/deploy_mojplaywin_moj_prop.py"
      - "templates/moj-prop-v4/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojplaywin-moj-prop-catalog-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Moj Prop catalog update payload and installer
        run: |
          python3 -m py_compile scripts/update_mojplaywin_moj_prop_catalog.py
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path("templates/moj-prop-v4")
          pages = [root / "index.html", root / "catalog/index.html"]
          class Check(HTMLParser):
              pass
          for page in pages:
              html = page.read_text(encoding="utf-8")
              Check().feed(html)
          home = (root / "index.html").read_text(encoding="utf-8")
          catalog = (root / "catalog/index.html").read_text(encoding="utf-8")
          home_required = ["<title>Moj Prop", 'href="/moj-prop/catalog/"', '/api/moj-prop/intake/', "See service prices", "Send request for review"]
          catalog_required = ["<title>Moj Prop Catalog", "From US$149", "From US$249"]
          missing = [item for item in home_required + catalog_required if item not in home + catalog]
          if missing:
              raise SystemExit(f"Moj Prop catalog content missing: {missing}")
          assert 'href="/styles.css"' not in home + catalog and 'src="/app.js"' not in home + catalog
          print("Moj Prop catalog pages parse and contain the expected standalone content.")
          PY

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned cPanel SSH from factory runner
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$WORK/host.key"
          chmod 600 "$WORK/host.key"
          ssh-keygen -y -P "" -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$WORK/config" <<EOF
          Host saeit-host
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 20
            ServerAliveCountMax 3
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$WORK/config"
          echo "PINNED_FACTORY_CPanel_READY=yes"
      - name: Verify existing site and prepare isolated staging
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/)" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 45s ssh -F "$WORK/config" saeit-host \
            'test -d /home/zomorod2/mojplaywin.com && test ! -L /home/zomorod2/mojplaywin.com && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/mojplaywin.com/.htaccess && test -d /home/zomorod2/Saeit-staging && test ! -L /home/zomorod2/Saeit-staging && grep -Fq "Saeit-staging" /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/Saeit-staging/config/urls.py'
          timeout 20s ssh -F "$WORK/config" saeit-host "install -d -m 700 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID"
      - name: Confirm live Django request API before touching static sales page
        shell: bash
        run: |
          set -euo pipefail
          url="https://mojplaywin.com/api/moj-prop/intake/"
          curl --fail --silent --show-error --location --max-redirs 0 \
            --connect-timeout 10 --max-time 20 \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "$url" -o "$RUNNER_TEMP/moj-prop-api-preflight.json"
          python3 - "$RUNNER_TEMP/moj-prop-api-preflight.json" <<'PY'
          import json, sys
          from pathlib import Path
          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (response.get("ok") is not True
                  or response.get("service") != "moj-prop-intake"
                  or not isinstance(response.get("csrf_token"), str)
                  or len(response["csrf_token"]) < 32):
              raise SystemExit("MOJ_PROP_API_NOT_READY: source-only landing must not replace live sales page")
          print("MOJ_PROP_LIVE_INTAKE_API_PREFLIGHT=PASS")
          PY

      - name: Package only Moj Prop installer and page
        run: tar -cf "$RUNNER_TEMP/moj-prop-catalog.tar" scripts/update_mojplaywin_moj_prop_catalog.py templates/moj-prop-v4
      - name: Upload isolated Moj Prop package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          scp -F "$WORK/config" "$RUNNER_TEMP/moj-prop-catalog.tar" "saeit-host:/home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/bundle.tar"
          timeout 30s ssh -F "$WORK/config" saeit-host \
            "tar -xf /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/bundle.tar -C /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID && rm -f /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/bundle.tar"
      - name: Update only /moj-prop/ commercial catalog
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/scripts/update_mojplaywin_moj_prop_catalog.py deploy $GITHUB_RUN_ID $GITHUB_SHA"
      - name: Verify Moj Prop catalog and preserve root and admin
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          url='https://mojplaywin.com/moj-prop/?_moj-prop_catalog_deploy='"$GITHUB_RUN_ID"
          status="000"
          for attempt in {1..10}; do
            status="$(curl -sS -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/moj-prop-catalog-live.html" -w '%{http_code}' "$url" || true)"
            [[ "$status" == "200" ]] && break
            echo "Moj Prop index not ready (HTTP $status, attempt $attempt)."
            sleep 3
          done
          [[ "$status" == "200" ]]
          catalog_status="$(curl -sS -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/moj-prop-catalog-page.html" -w '%{http_code}' "https://mojplaywin.com/moj-prop/catalog/?_moj-prop_catalog_deploy=$GITHUB_RUN_ID" || true)"
          [[ "$catalog_status" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/)" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          python3 - "$RUNNER_TEMP/moj-prop-catalog-live.html" "$RUNNER_TEMP/moj-prop-catalog-page.html" <<'PY'
          from pathlib import Path
          import sys
          home = Path(sys.argv[1]).read_text(encoding="utf-8")
          catalog = Path(sys.argv[2]).read_text(encoding="utf-8")
          assert "<title>Moj Prop" in home
          assert 'href="/moj-prop/catalog/"' in home
          assert "See service prices" in home
          assert "/api/moj-prop/intake/" in home
          assert "Send request for review" in home
          assert "<title>Moj Prop Catalog" in catalog
          assert "From US$149" in catalog
          assert "From US$249" in catalog
          print("Moj Prop catalog is live; MojPlayWin home and admin login still return HTTP 200.")
          PY
      - name: Roll back only Moj Prop route if deployment verification fails
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/scripts/update_mojplaywin_moj_prop_catalog.py rollback $GITHUB_RUN_ID"
      - name: Remove remote staging bundle
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh/config" -o ConnectTimeout=10 saeit-host \
              "rm -rf /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID" || true
          fi
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh" "$RUNNER_TEMP/moj-prop-catalog.tar" "$RUNNER_TEMP/moj-prop-catalog-live.html"
