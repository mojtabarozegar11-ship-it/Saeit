name: Update Moj Prop commercial catalog on MojPlayWin

on:
  pull_request:
    paths:
      - ".github/workflows/mojplaywin-moj-prop-deploy.yml"
      - "scripts/update_mojplaywin_moj_prop_catalog.py"
      - "scripts/deploy_mojplaywin_moj_prop.py"
      - "templates/moj-prop-v4/**"
      - "config/urls.py"
      - "core/admin.py"
      - "core/models.py"
      - "core/mojprop_views.py"
      - "core/mojprop_receipts.py"
      - "core/mojprop_catalog_contract.py"
      - "core/mojprop_offer_draft.py"
      - "core/mojprop_workflow.py"
      - "tests/test_mojprop_backend_receipts_release_20261115.py"
      - "tests/test_mojprop_direct_support_fallback_c134_20261116.py"
      - "core/migrations/0041_mojprop_request.py"
      - "scripts/deploy_mojplaywin_moj_prop_backend.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-moj-prop-deploy.yml"
      - "scripts/update_mojplaywin_moj_prop_catalog.py"
      - "scripts/deploy_mojplaywin_moj_prop.py"
      - "templates/moj-prop-v4/**"
      - "config/urls.py"
      - "core/admin.py"
      - "core/models.py"
      - "core/mojprop_views.py"
      - "core/mojprop_receipts.py"
      - "core/mojprop_catalog_contract.py"
      - "core/mojprop_offer_draft.py"
      - "core/mojprop_workflow.py"
      - "tests/test_mojprop_backend_receipts_release_20261115.py"
      - "tests/test_mojprop_direct_support_fallback_c134_20261116.py"
      - "core/migrations/0041_mojprop_request.py"
      - "scripts/deploy_mojplaywin_moj_prop_backend.py"
  workflow_dispatch:
    inputs:
      owner_approved_static_release:
        description: 'Owner explicitly approved Moj Prop static-only release; no backend migration or payments'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mojplaywin-moj-prop-catalog-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Moj Prop catalog update payload and installer
        run: |
          python3 -m py_compile scripts/update_mojplaywin_moj_prop_catalog.py scripts/deploy_mojplaywin_moj_prop_backend.py core/mojprop_catalog_contract.py core/mojprop_offer_draft.py core/mojprop_workflow.py
          python3 -m unittest discover -s tests -p test_mojprop_commercial_samples_release.py -q
          python3 -m unittest discover -s tests -p test_mojprop_backend_receipts_release_20261115.py -v
          python3 -m unittest discover -s tests -p test_mojprop_direct_support_fallback_c134_20261116.py -q
          python3 scripts/deploy_mojplaywin_moj_prop_backend.py selftest .
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path("templates/moj-prop-v4")
          pages = [root / "index.html", root / "catalog/index.html"] + [root / "samples" / slug / "index.html" for slug in ("prop-blueprint", "gold-market-brief", "educational-signal", "commercial-gate-audit")]
          class Check(HTMLParser):
              pass
          for page in pages:
              html = page.read_text(encoding="utf-8")
              Check().feed(html)
          home = (root / "index.html").read_text(encoding="utf-8")
          catalog = (root / "catalog/index.html").read_text(encoding="utf-8")
          home_required = ["<title>Moj Prop", 'href="/moj-prop/catalog/"', '/moj-prop-intake/', "SOLE CURRENT PRODUCT", "MOJ-PROP-01", "Send request for review"]
          catalog_required = ["<title>Moj Prop Catalog", "From US$149", "From US$249"] + ["/moj-prop/samples/" + slug + "/" for slug in ("prop-blueprint", "gold-market-brief", "educational-signal", "commercial-gate-audit")]
          missing = [item for item in home_required + catalog_required if item not in home + catalog]
          if missing:
              raise SystemExit(f"Moj Prop catalog content missing: {missing}")
          assert 'href="/styles.css"' not in home + catalog and 'src="/app.js"' not in home + catalog
          print("Moj Prop catalog pages parse and contain the expected standalone content.")
          PY

  deploy:
    # New public sales pages need FULL independent DB+app+media restoration,
    # tenant separation, rollback evidence and owner approval of this exact main.
    # All repository vars default missing => DENY; source merge cannot deploy.
    if: github.event_name == 'workflow_dispatch' && inputs.owner_approved_static_release == true && github.ref == 'refs/heads/main' && vars.MOJPROP_FULL_DB_APP_MEDIA_RESTORE_VERIFIED == 'true' && vars.MOJPROP_PASSENGER_TENANT_ISOLATION_VERIFIED == 'true' && vars.MOJPROP_STATIC_ROLLBACK_VERIFIED == 'true' && vars.MOJPROP_STATIC_APPROVED_MAIN_SHA == github.sha
    needs: validate
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned cPanel SSH from factory runner
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$WORK/host.key"
          chmod 600 "$WORK/host.key"
          ssh-keygen -y -P "" -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$WORK/config" <<EOF
          Host saeit-host
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 20
            ServerAliveCountMax 3
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$WORK/config"
          echo "PINNED_FACTORY_CPanel_READY=yes"
      - name: Verify existing site and prepare isolated staging
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/)" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 45s ssh -F "$WORK/config" saeit-host \
            'test -d /home/zomorod2/mojplaywin.com && test ! -L /home/zomorod2/mojplaywin.com && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/mojplaywin.com/.htaccess && test -d /home/zomorod2/Saeit-staging && test ! -L /home/zomorod2/Saeit-staging && grep -Fq "Saeit-staging" /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/Saeit-staging/config/urls.py'
          timeout 20s ssh -F "$WORK/config" saeit-host "install -d -m 700 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID"
      - name: Package only static Moj Prop commercial deliverables
        run: tar -cf "$RUNNER_TEMP/moj-prop-catalog.tar" scripts/update_mojplaywin_moj_prop_catalog.py templates/moj-prop-v4
      - name: Upload isolated Moj Prop package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          scp -F "$WORK/config" "$RUNNER_TEMP/moj-prop-catalog.tar" "saeit-host:/home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/bundle.tar"
          timeout 30s ssh -F "$WORK/config" saeit-host \
            "tar -xf /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/bundle.tar -C /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID && rm -f /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/bundle.tar"
      - name: Pin live Signal Desk before any separate Starter30 release writes
        id: signal_before
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 50s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/scripts/update_mojplaywin_moj_prop_catalog.py preflight $GITHUB_RUN_ID"
          digest="$(timeout 25s ssh -F "$WORK/config" saeit-host \
            'test -f /home/zomorod2/mojplaywin.com/moj-prop/signals/index.html && test ! -L /home/zomorod2/mojplaywin.com/moj-prop/signals/index.html && sha256sum /home/zomorod2/mojplaywin.com/moj-prop/signals/index.html' | awk '{print $1}')"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo 'SIGNAL_DESK_PRESERVE_BEFORE_HASH_UNAVAILABLE'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "MOJ_PROP_LIVE_STATIC_COMPATIBILITY=CHECKED_READ_ONLY"
      - name: Verify live Django intake is ready BEFORE publishing form
        id: api_preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-redirs 0 --connect-timeout 10 --max-time 25 \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            'https://mojplaywin.com/moj-prop-intake/' -o "$RUNNER_TEMP/mojprop-api-preflight.json"
          python3 - "$RUNNER_TEMP/mojprop-api-preflight.json" <<'PY'
          import json,sys
          from pathlib import Path
          answer=json.loads(Path(sys.argv[1]).read_text('utf-8'))
          if answer.get('ok') is not True or answer.get('service') != 'moj-prop-intake' or not answer.get('csrf_token'):
              raise SystemExit('PUBLIC_INTAKE_UNAVAILABLE: DO NOT CHANGE STATIC SALES PAGES')
          print('MOJ_PROP_API_PREFLIGHT=PASS')
          PY
      - name: Verify private status receipt API exists before publishing tracking form
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-redirs 0 --connect-timeout 10 --max-time 20 \
            -H 'Accept: application/json' -o "$RUNNER_TEMP/mojprop-status-preflight.json" \
            -w '%{http_code}' 'https://mojplaywin.com/moj-prop-status/')"
          [[ "$code" == "404" ]] || { echo "MOJPROP_STATUS_API_NOT_READY=$code"; exit 1; }
          python3 - "$RUNNER_TEMP/mojprop-status-preflight.json" <<'PY'
          import json,sys
          from pathlib import Path
          response=json.loads(Path(sys.argv[1]).read_text("utf-8"))
          if (type(response) is not dict or response.get("ok") is not False
                  or response.get("detail") != "Check a private receipt using the secure POST status form."):
              raise SystemExit("Receipt API contract missing; abort static publication")
          print("MOJ_PROP_STATUS_API_PREFLIGHT=PASS")
          PY
      - name: Ensure Starter30 file release is isolated from unrelated Signal Desk signup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from scripts.update_mojplaywin_moj_prop_catalog import FILES, PRESERVED_LIVE_FILES, STARTER30_FILES
          assert PRESERVED_LIVE_FILES == (Path("signals/index.html"),)
          assert not any(path in FILES for path in PRESERVED_LIVE_FILES)
          assert all(path in FILES for path in STARTER30_FILES)
          print("STARTER30_WITHOUT_SIGNAL_DESK_WRITE=PASS")
          PY
      - name: Update only /moj-prop/ commercial catalog
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/scripts/update_mojplaywin_moj_prop_catalog.py deploy $GITHUB_RUN_ID $GITHUB_SHA"
      - name: Verify Moj Prop catalog and preserve root and admin
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          url='https://mojplaywin.com/moj-prop/?_moj-prop_catalog_deploy='"$GITHUB_RUN_ID"
          status="000"
          for attempt in {1..10}; do
            status="$(curl -sS -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/moj-prop-catalog-live.html" -w '%{http_code}' "$url" || true)"
            [[ "$status" == "200" ]] && break
            echo "Moj Prop index not ready (HTTP $status, attempt $attempt)."
            sleep 3
          done
          [[ "$status" == "200" ]]
          catalog_status="$(curl -sS -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/moj-prop-catalog-page.html" -w '%{http_code}' "https://mojplaywin.com/moj-prop/catalog/?_moj-prop_catalog_deploy=$GITHUB_RUN_ID" || true)"
          [[ "$catalog_status" == "200" ]]
          # A published service must have an actual publicly readable sample.
          for slug in prop-blueprint gold-market-brief educational-signal commercial-gate-audit; do
            status="$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/mojprop-$slug.html" -w '%{http_code}' "https://mojplaywin.com/moj-prop/samples/$slug/?v=$GITHUB_SHA" || true)"
            [[ "$status" == '200' ]] || { echo "PUBLIC_SAMPLE_MISSING=$slug HTTP=$status"; exit 1; }
            grep -qi '<title>.*Sample' "$RUNNER_TEMP/mojprop-$slug.html" || exit 1
          done
          echo 'MOJ_PROP_FOUR_SERVICE_SAMPLES_LIVE=PASS'
          # A 200 alone is not a published registration funnel.
          signal_status="$(curl --silent --show-error --max-redirs 0 --max-time 20 \
            -o "$RUNNER_TEMP/mojprop-signal-desk.html" -w '%{http_code}' \
            "https://mojplaywin.com/moj-prop/signals/?v=$GITHUB_SHA")"
          [[ "$signal_status" == '200' ]]
          # This release must NOT overwrite Signal Desk, regardless of its
          # independent email-signup state or owner-customized live content.
          digest_after="$(timeout 25s ssh -F "$WORK/config" saeit-host \
            'test -f /home/zomorod2/mojplaywin.com/moj-prop/signals/index.html && test ! -L /home/zomorod2/mojplaywin.com/moj-prop/signals/index.html && sha256sum /home/zomorod2/mojplaywin.com/moj-prop/signals/index.html' | awk '{print $1}')"
          [[ "$digest_after" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$digest_after" == "${{ steps.signal_before.outputs.digest }}" ]] || {
            echo 'SIGNAL_DESK_CHANGED_DURING_SEPARATE_STARTER30_RELEASE'; exit 1;
          }
          echo 'SIGNAL_DESK_OWNER_CONTENT_PRESERVED=PASS'
          for path in index.html journal-template.csv journal-guide.txt; do
            file="$RUNNER_TEMP/starter30-verified-$path"
            code="$(curl --silent --show-error --max-redirs 0 --max-time 25 -o "$file" -w '%{http_code}' \
              "https://mojplaywin.com/moj-prop/starter-30-trx/$path?v=$GITHUB_SHA" || true)"
            [[ "$code" == 200 ]] || { echo "STARTER30_DELIVERABLE_NOT_PUBLIC=$path HTTP=$code"; exit 1; }
            # HTTP 200 alone is NOT a deliverable; byte-for-byte match reviewed GitHub source.
            actual="$(sha256sum "$file" | awk '{print $1}')"
            reviewed="$(sha256sum "templates/moj-prop-v4/starter-30-trx/$path" | awk '{print $1}')"
            [[ "$actual" == "$reviewed" ]] || { echo "STARTER30_PUBLIC_SOURCE_DIGEST_MISMATCH=$path"; exit 1; }
          done
          echo 'STARTER30_THREE_FILES_PUBLIC_SHA256=PASS'
          intake_status="000"
          for intake_attempt in {1..10}; do
            intake_status="$(curl -L --max-redirs 3 -sS -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o "$RUNNER_TEMP/moj-prop-intake.json" -w '%{http_code}' "https://mojplaywin.com/moj-prop-intake/?_moj_prop_backend_deploy=$GITHUB_RUN_ID&attempt=$intake_attempt&ts=$(date +%s%N)" || true)"
            [[ "$intake_status" == "200" ]] && break
            echo "Moj Prop intake not ready (HTTP $intake_status, attempt $intake_attempt)."
            sleep 3
          done
          echo "MOJ_PROP_INTAKE_STATUS=$intake_status"
          if [[ "$intake_status" != "200" ]]; then
            echo "MOJ_PROP_INTAKE_BODY=$(head -c 300 "$RUNNER_TEMP/moj-prop-intake.json" | tr '\n' ' ')"
          fi
          [[ "$intake_status" == "200" ]]
          python3 - "$RUNNER_TEMP/moj-prop-intake.json" <<'PY'
          import json, sys
          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if payload.get("ok") is not True or not payload.get("csrf_token") or payload.get("service") != "moj-prop-intake":
            raise SystemExit("unexpected intake response shape: " + ",".join(sorted(payload.keys())))
          print("Moj Prop intake backend is live and returned a CSRF token without creating a request.")
          PY
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/)" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          python3 - "$RUNNER_TEMP/moj-prop-catalog-live.html" "$RUNNER_TEMP/moj-prop-catalog-page.html" <<'PY'
          from pathlib import Path
          import sys
          home = Path(sys.argv[1]).read_text(encoding="utf-8")
          catalog = Path(sys.argv[2]).read_text(encoding="utf-8")
          assert "<title>Moj Prop" in home
          assert 'href="/moj-prop/catalog/"' in home
          assert "See service prices" in home
          assert "/moj-prop-intake/" in home
          assert "Send request for review" in home
          assert "<title>Moj Prop Catalog" in catalog
          assert "From US$149" in catalog
          assert "From US$249" in catalog
          print("Moj Prop catalog is live; MojPlayWin home and admin login still return HTTP 200.")
          PY
      - name: Roll back only Moj Prop route if deployment verification fails
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID/scripts/update_mojplaywin_moj_prop_catalog.py rollback $GITHUB_RUN_ID"
      - name: Remove remote staging bundle
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh/config" -o ConnectTimeout=10 saeit-host \
              "rm -rf /home/zomorod2/.mojplaywin-moj-prop-catalog-$GITHUB_RUN_ID" || true
          fi
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-moj-prop-catalog-ssh" "$RUNNER_TEMP/moj-prop-catalog.tar" "$RUNNER_TEMP/moj-prop-catalog-live.html"