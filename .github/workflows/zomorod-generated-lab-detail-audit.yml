name: Obsolete lab source versus generated content inspection
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-generated-lab-detail-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-lab-detail-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Classify contents of generation lab and staging smoke snapshots without mutation
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import os,stat,subprocess,json,time
          h=Path.home()
          for name in ("Saeit/var/mother_robot/lab/upgrade-g28-1791077099027995723/project",
             "Saeit/var/mother_robot/lab/module-g20-1791049942432132970/project",
             "Saeit-staging/admin-smoke/9369c1a43fd4-38498401914",
             "Saeit-staging/var/factory/astra-backups/stage4-20261008T161948Z",
             "Saeit-staging/var/factory/astra-backups/validation100-20261008T120216Z"):
              base=h/name
              if not base.is_dir():continue
              print("TREE_ROOT="+name)
              paths=[c for c in base.iterdir() if not c.is_symlink()]
              for path in paths[:60]:
                  if path.is_dir():
                      r=subprocess.run(["du","-sk",str(path)],text=True,capture_output=True,timeout=35)
                      size=int(r.stdout.split()[0])*1024 if r.stdout.strip() else -1
                  else:size=path.stat().st_size
                  print("TREE_CHILD="+json.dumps({"root":name,"name":path.name,"bytes":size,"directory":path.is_dir()},ensure_ascii=False))
          smoke=h/"Saeit-staging/admin-smoke"
          if smoke.is_dir():
              dirs=[c for c in smoke.iterdir() if c.is_dir() and not c.is_symlink()]
              print("SMOKE_DAYS_COUNTS="+json.dumps({date:sum(1 for p in dirs if time.strftime("%Y-%m-%d",time.gmtime(p.stat().st_mtime))==date) for date in sorted({time.strftime("%Y-%m-%d",time.gmtime(p.stat().st_mtime)) for p in dirs})}))
              print("SMOKE_RECENT="+json.dumps([{"name":p.name,"mtime":p.stat().st_mtime} for p in sorted(dirs,key=lambda p:p.stat().st_mtime,reverse=True)[:3]]))
          print("LAB_DETAIL_AUDIT_DONE=yes")
          PY
          REMOTE
      - name: Delete runner SSH keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
