name: Zomorod main-site static pages and admin inventory
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-v7-readonly-inventory.yml"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Read only live HTML page and admin state inventory
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,sqlite3
          from pathlib import Path
          root=Path.home()/'public_html'
          print('SITE_HOME='+str(root))
          exclusions={'mohammad','ghanadi','amozeshgah','tala','education','site-heritage','business','__zm_premium_orbital_v6_20261018_448','__zm_orbital_v6_preview_20261018','mojtaba','farnaz'}
          allowed=[]
          for dp,dirs,files in os.walk(root,followlinks=False):
              path=Path(dp); rel=path.relative_to(root)
              dirs[:]=[z for z in dirs if not z.startswith('.') and z not in exclusions and not (path/z).is_symlink()]
              if len(rel.parts)>5:dirs[:]=[];continue
              for file in files:
                  if file.lower().endswith('.html') and not (path/file).is_symlink():
                      source=path/file
                      try:
                          content=source.read_text(errors='replace')
                          title=''
                          import re
                          m=re.search('<title[^>]*>(.*?)</title>',content,re.I|re.S)
                          if m:title=re.sub(r'\s+',' ',m.group(1)).strip()[:70]
                          print('MAIN_HTML',str(source.relative_to(root)), 'bytes',source.stat().st_size,'title',title,'nova',int('zm-nova-subpage-v1' in content),'v6',int('footer-grid' in content),'unified',int('zm-unified-v7' in content))
                          allowed.append(source)
                      except Exception as e:print('PAGE_ERROR',str(source.relative_to(root)),type(e).__name__)
          print('ELIGIBLE_HTML_COUNT='+str(len(allowed)))
          private=Path.home()/'.private/zomorod-business/management.sqlite3'
          if private.is_file():
              db_stat=private.stat()
              db_mode=db_stat.st_mode & 0o777
              dir_stat=private.parent.stat()
              print("BUSINESS_DB_MODE="+format(db_mode,"03o"))
              print("BUSINESS_DB_OWNED_BY_SSH_USER="+str(db_stat.st_uid==os.geteuid()))
              print("BUSINESS_PRIVATE_DIR_MODE="+format(dir_stat.st_mode & 0o777,"03o"))
              print("BUSINESS_PRIVATE_DIR_OWNED_BY_SSH_USER="+str(dir_stat.st_uid==os.geteuid()))
              print("BUSINESS_DB_PRIVATE_PERMISSIONS="+str((db_mode & 0o077)==0))
              print("BUSINESS_DB_SIZE_BYTES="+str(private.stat().st_size))
              try:
                  conn=sqlite3.connect('file:'+str(private)+'?mode=ro',uri=True)
                  print('BUSINESS_SQLITE_INTEGRITY='+str(conn.execute('PRAGMA quick_check').fetchone()[0]))
                  print('BUSINESS_USERS_COUNT='+str(conn.execute('SELECT count(*) FROM users').fetchone()[0]))
                  print('BUSINESS_ADMIN_COUNT='+str(conn.execute("SELECT count(*) FROM users WHERE role='admin' AND active=1").fetchone()[0]))
                  conn.close()
              except Exception as e:print('BUSINESS_DB_ERROR='+type(e).__name__)
          else:print('BUSINESS_DB_MISSING=yes')
          for p in (Path.home()/'Saeit/passenger_wsgi.py',Path.home()/'public_html/.htaccess',Path.home()/'Saeit/config/urls.py'):
              print('APP_FILE_EXISTS',p.name,p.exists())
          PY
          for route in /admin/ /staff/ /business/ /company/ /about/ /agriculture/ /industry/ /research/ /economy/ /market/ /blog/ /news/ /contact/; do
            code="$(curl -sS -L --max-time 9 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            printf 'ROUTE_STATUS %s %s\n' "$route" "$code"
          done
          REMOTE
      - name: Clean temporary runner keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-command-channel"
