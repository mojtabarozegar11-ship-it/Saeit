name: Two site master customer inbox no-API tests
on:
  push:
    branches: [agents/two-sites-inquiries-orders-20261024]
    paths:
      - scripts/site_master_customer_portal_20261024.php
      - scripts/site_master_customer_runtime_20261024.py
      - tests/test_site_master_customer_runtime_20261024.py
      - .github/workflows/two-site-master-customer-tests-20261024.yml
  pull_request:
    paths:
      - scripts/site_master_customer_portal_20261024.php
      - scripts/site_master_customer_runtime_20261024.py
      - tests/test_site_master_customer_runtime_20261024.py
permissions:
  contents: read
jobs:
  no_api_customer_inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring
      - name: Syntax and offline Python 6 regression tests
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/site_master_customer_portal_20261024.php
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_site_master_customer_runtime_20261024.py -v
      - name: Prove two separate PHP inboxes, validated inquiries and rate-limit
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=1 <<'PHP'
          <?php
          declare(strict_types=1);
          define('MASTER_CUSTOMER_TEST_MODE',true);
          require 'scripts/site_master_customer_portal_20261024.php';
          $one=sys_get_temp_dir().'/zm-master-inbox-'.bin2hex(random_bytes(7));
          $two=sys_get_temp_dir().'/mpw-master-inbox-'.bin2hex(random_bytes(7));
          mkdir($one,0700);mkdir($two,0700);
          $zm=masterOpenDb($one);$mpw=masterOpenDb($two);
          $z=masterSaveQuestion($zm,'zomorod','question','مشتری تست','user@example.com','قیمت با تخفیف؟','');
          $m=masterSaveQuestion($mpw,'mojplaywin','order_question','Demo User','test@example.com','Where is my order?','DEMO-123');
          if(!str_contains($z['reply'],'تخفیف')||!str_contains($m['reply'],'payment status'))exit(2);
          if($zm->query('SELECT COUNT(*) FROM customer_questions')->fetchColumn()!=1 ||
             $mpw->query('SELECT COUNT(*) FROM customer_questions')->fetchColumn()!=1)exit(3);
          if($zm->query('SELECT tenant FROM customer_questions')->fetchColumn()!=='zomorod' ||
             $mpw->query('SELECT tenant FROM customer_questions')->fetchColumn()!=='mojplaywin')exit(4);
          if(!masterCheckLimit($zm,'192.0.2.1') || !masterCheckLimit($zm,'192.0.2.1') ||
             !masterCheckLimit($zm,'192.0.2.1') || !masterCheckLimit($zm,'192.0.2.1') ||
             !masterCheckLimit($zm,'192.0.2.1') || masterCheckLimit($zm,'192.0.2.1'))exit(5);
          try{masterSaveQuestion($zm,'zomorod','order_question','Bad','bad@example.com','Where?','');exit(6);}
          catch(InvalidArgumentException $expected){}
          if((fileperms($one.'/master_customer_inbox.sqlite3')&0077)!==0)exit(7);
          echo "TWO_TENANT_PRIVATE_PHP_QUESTION_INBOXES=PASS\n";
          echo "NO_EXTERNAL_API_AND_NO_NETWORK=PASS\n";
          echo "ORDER_STATUS_NOT_TRUSTED_FROM_CLIENT=PASS\n";
          echo "FIVE_PER_TEN_MINUTES_RATE_LIMIT=PASS\n";
          echo "PHP_TEST_LIVE_SITES_UNTOUCHED=PASS\n";
          PHP
