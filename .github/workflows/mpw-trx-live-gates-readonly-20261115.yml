name: MPW TRON live gates read-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.actor == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Compile immutable diagnostic
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_trx_live_gates_readonly_20261115.py
      - name: Connect to cPanel with pinned host key
        id: link
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-trx-gates-ssh"
          install -d -m 700 "$d"
          trap 'rm -f "$d/host.key" "$d/known" "$d/config"; rmdir "$d"' EXIT
          test -n "$HOST_KEY"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read().replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10); sys.stdout.write(s)' > "$d/host.key"
          chmod 600 "$d/host.key"
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          printf '%s\\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          printf 'Host cpanel\\n HostName 178.239.147.125\\n User zomorod2\\n Port 1396\\n IdentityFile %s/host.key\\n UserKnownHostsFile %s/known\\n StrictHostKeyChecking yes\\n IdentitiesOnly yes\\n BatchMode yes\\n ConnectTimeout 20\\n ConnectionAttempts 1\\n ForwardAgent no\\n RequestTTY no\\n' "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 90s ssh -T -F "$d/config" cpanel 'test "$(id -un)" = "zomorod2" && test -d /home/zomorod2/Saeit-staging'
      - name: Read live flags without writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-trx-gates-ssh"
          test -s "$d/config"
          timeout 90s ssh -T -F "$d/config" cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' < scripts/mpw_trx_live_gates_readonly_20261115.py
      - name: Remove relay material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-trx-gates-ssh"
          if [ -d "$d" ]; then rm -f "$d/host.key" "$d/known" "$d/config"; rmdir "$d"; fi
