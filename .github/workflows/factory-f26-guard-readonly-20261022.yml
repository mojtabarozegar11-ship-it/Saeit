name: F26 guarded rice pilot independent read-only VPS proof
on:
  push:
    branches: [main]
    paths: [.github/workflows/factory-f26-guard-readonly-20261022.yml]
  workflow_run:
    workflows: ["F26 real rice training-only domain guard and VPS evidence"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing-guard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Reopen existing F26 private proof without changing any site, DB or files
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          scratch="$(mktemp -d)"
          chmod 700 "$scratch"
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.buffer.read().decode("utf8");s=s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n";sys.stdout.buffer.write(s.encode())' > "$scratch/key"
          chmod 600 "$scratch/key"
          ssh-keygen -y -P '' -f "$scratch/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$scratch/known" 2>/dev/null
          test "$(ssh-keygen -lf "$scratch/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          ssh -T -i "$scratch/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -B -' <<'PY'
          import hashlib,json,re
          from pathlib import Path
          def digest(p):
              assert not p.is_symlink() and p.is_file() and p.stat().st_size < 20_000_000
              return hashlib.sha256(p.read_bytes()).hexdigest()
          def read(p):
              assert not p.is_symlink() and p.is_file() and p.stat().st_size < 300_000
              return json.loads(p.read_text("utf8"))
          private=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          folder=private/"f26-real-data-research"
          assert folder.is_dir() and not folder.is_symlink()
          proofs=[]
          for p in folder.iterdir():
              if p.is_symlink() or not p.is_dir() or not re.fullmatch(r"guard-[0-9]{6,18}-[0-9]{1,3}",p.name):
                  continue
              if (p/"private-domain-guard-receipt.json").is_file():
                  proofs.append(p)
          assert proofs, "F26_PRIVATE_GUARD_NOT_DEPLOYED"
          latest=max(proofs,key=lambda p:tuple(map(int,p.name[6:].split("-"))))
          receipt=read(latest/"private-domain-guard-receipt.json")
          spec=read(latest/"guard-spec.json")
          real=read(latest/"private-real-rice-guard-proof.json")
          ood=read(latest/"private-unfamiliar-grain-guard-proof.json")
          assert receipt["schema"]=="saeit.factory.f26.rice-domain-abstention.v1.vps-admission"
          assert receipt["family"]=="F26" and receipt["quality_1000_certified"] is False
          assert receipt["commercial_release_authorized"] is False
          assert receipt["public_site_changes"]==0
          assert receipt["original_research_files_modified"] is False
          assert receipt["portable_runtime_files_modified"] is False
          assert receipt["previous_48_onnx_models_preserved"] is True
          assert receipt["guard_spec_sha256"]==digest(latest/"guard-spec.json")
          assert receipt["real_uci_proof_sha256"]==digest(latest/"private-real-rice-guard-proof.json")
          assert receipt["ood_proof_sha256"]==digest(latest/"private-unfamiliar-grain-guard-proof.json")
          assert spec["source_test_count"]==762 and spec["holdout"]["samples"]==762
          assert spec["domain_bounds_derived_from_training_only"] is True
          assert spec["heldout_test_not_used_to_tune_bounds"] is True
          assert spec["quality_1000_certified"] is False
          assert real["rows"]==12 and real["quality_1000_certified"] is False
          assert ood["rows"]==1 and ood["abstentions"]==1
          assert ood["predictions"][0]["research_prediction"] is None
          assert "outside_training_distribution" in ood["predictions"][0]["abstention_reasons"]
          source=folder/receipt["previous_research_run"]
          model=read(source/"model_card.json")
          assert model["onnx_model_sha256"]==receipt["previous_model_sha256"]
          assert model["dataset"]["download_archive_sha256"]==receipt["source_uci_archive_sha256"]
          assert digest(source/"rice_cultivar_real_pilot.onnx")==receipt["previous_model_sha256"]
          print("F26_INDEPENDENT_READONLY_REAL_DATA_SAMPLES="+str(receipt["real_uci_grains_trialled"]))
          print("F26_INDEPENDENT_READONLY_REAL_DATA_ABSTAINED="+str(receipt["real_uci_grains_abstained"]))
          print("F26_INDEPENDENT_READONLY_UNFAMILIAR_INPUT_ABSTAINS=PASS")
          print("F26_INDEPENDENT_READONLY_TRAIN_ONLY_HOLDOUT=762")
          print("F26_INDEPENDENT_READONLY_MODEL_SHA256="+receipt["previous_model_sha256"])
          print("F26_INDEPENDENT_READONLY_GUARD_RECEIPT_SHA256="+digest(latest/"private-domain-guard-receipt.json"))
          print("F26_INDEPENDENT_READONLY_QA1000=NOT_CERTIFIED")
          print("F26_INDEPENDENT_READONLY_PUBLIC_WEBSITES_UNCHANGED=PASS")
          PY
