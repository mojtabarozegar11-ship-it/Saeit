name: Publish Zomorod Tala subsite only
on:
  push:
    branches: [main]
    paths:
      - "public/tala/**"
      - ".github/workflows/zomorod-tala-static-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-tala-static
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Tala package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          root=Path('public/tala')
          page=root/'index.html'
          source=page.read_text(encoding='utf-8')
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=False; self.h1=False; self.rtl=False; self.forms=0
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='html': self.rtl=a.get('lang')=='fa' and a.get('dir')=='rtl'
                  if tag=='title': self.title=True
                  if tag=='h1': self.h1=True
                  if tag=='form': self.forms+=1
          check=Check(); check.feed(source)
          if not all((check.title,check.h1,check.rtl)) or len(source.encode())<10000:
              raise SystemExit('TALA_PAGE_VALIDATION=failed')
          if '<!-- tala-isolated-site-v1 -->' not in source:
              raise SystemExit('TALA_SCOPE_MARKER=missing')
          for rel in ('manifest.webmanifest','sw.js','assets/tala-mark.svg','admin/index.html','api/health.php','api/admin.php','api/.htaccess','api/.private/.htaccess'):
              if not (root/rel).is_file(): raise SystemExit(f'TALA_ASSET_MISSING={rel}')
          if 'در انتظار اتصال منبع' not in source or 'قیمت زنده هنوز متصل نشده' not in source:
              raise SystemExit('TALA_UNVERIFIED_PRICE_DISCLOSURE=missing')
          for p in root.rglob('*'):
              if p.is_file() and (p.is_symlink() or '..' in p.parts):
                  raise SystemExit(f'TALA_UNSAFE_PATH={p}')
          print('TALA_SCOPE=isolated')
          print('TALA_STATIC_PACKAGE=validated')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('public/tala/index.html').read_text(encoding='utf-8')
          match=re.search(r'<script>([\s\S]*?)</script>',source)
          if not match: raise SystemExit('TALA_INLINE_SCRIPT=missing')
          Path('/tmp/tala-inline.js').write_text(match.group(1),encoding='utf-8')
          admin=Path('public/tala/admin/index.html').read_text(encoding='utf-8')
          match=re.search(r'<script>([\s\S]*?)</script>',admin)
          if not match: raise SystemExit('TALA_ADMIN_SCRIPT=missing')
          Path('/tmp/tala-admin.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/tala-inline.js
          node --check /tmp/tala-admin.js
          tar -czf "$RUNNER_TEMP/tala-site.tgz" -C public/tala .
      - name: Prepare pinned VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/tala-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF2
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF2
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Back up and atomically replace Tala directory only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tala-ssh"
          sha="$GITHUB_SHA"
          scp -F "$d/config" "$RUNNER_TEMP/tala-site.tgz" "saeit-cpanel:.tala-site-$sha.tgz"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$sha" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          root="$HOME/public_html"
          target="$root/tala"
          backup_root="$HOME/.backups/zomorodmelal-tala"
          backup="$backup_root/$sha"
          stage="$root/.tala-stage-$sha"
          test -d "$root" && test ! -L "$root"
          test ! -e "$backup"
          test ! -L "$target"
          install -d -m 700 "$backup_root"
          mkdir "$backup"
          test ! -L "$target"
          if test -d "$target"; then
            printf 'yes\n' > "$backup/prior-existed"
          else
            printf 'no\n' > "$backup/prior-existed"
          fi
          active=0
          rollback_local() {
            rc=$?
            if test "$active" = 1; then
              rm -rf -- "$target"
              if test "$(cat "$backup/prior-existed")" = yes; then
                mv "$backup/prior" "$target"
                rm -f "$target/api/.tala-maintenance"
              fi
              rm -f "$backup/deployed.flag"
            elif test -f "$target/api/.tala-maintenance"; then
              rm -f "$target/api/.tala-maintenance"
            fi
            exit "$rc"
          }
          trap rollback_local EXIT
          rm -rf -- "$stage"
          mkdir "$stage"
          tar -xzf "$HOME/.tala-site-$sha.tgz" -C "$stage"
          test -f "$stage/index.html"
          grep -Fq '<!-- tala-isolated-site-v1 -->' "$stage/index.html"
          test -d "$stage/api/.private" && test ! -L "$stage/api/.private"
          chmod 700 "$stage/api/.private"
          if test -f "$target/api/.private/tala.sqlite3"; then
            test ! -L "$target/api/.private/tala.sqlite3"
            printf 'maintenance\n' > "$target/api/.tala-maintenance"
            sleep 3
          fi
          if test -d "$target"; then
            cp -a "$target" "$backup/prior"
            rm -f "$backup/prior/api/.tala-maintenance"
            if test -f "$target/api/.private/tala.sqlite3"; then
              for suffix in '' '-journal' '-wal' '-shm'; do
                source="$target/api/.private/tala.sqlite3$suffix"
                destination="$stage/api/.private/tala.sqlite3$suffix"
                if test -e "$source"; then
                  test -f "$source" && test ! -L "$source"
                  cp -p "$source" "$destination"
                  chmod 600 "$destination"
                fi
              done
            fi
          fi
          if test -e "$target"; then mv "$target" "$backup/live-before"; fi
          active=1
          mv "$stage" "$target"
          printf 'yes\n' > "$backup/deployed.flag"
          active=0
          trap - EXIT
          rm -f -- "$HOME/.tala-site-$sha.tgz"
          echo 'TALA_TARGET=/home/zomorod2/public_html/tala'
          echo 'TALA_ROOT_SITE_FILES=untouched'
          echo "TALA_BACKUP=$backup"
          REMOTE
      - name: Verify public Tala route and PWA assets
        shell: bash
        run: |
          set -euo pipefail
          base=https://zomorodmelal.ir/tala
          for path in / /admin/ /manifest.webmanifest /sw.js /assets/tala-mark.svg /api/health.php '/api/admin.php?action=status'; do
            if [[ "$path" == *\?* ]]; then
              route="${path%%\?*}"
              query="${path#*\?}"
              url="$base$route?$query&__tala_verify=$GITHUB_SHA"
            else
              url="$base$path?__tala_verify=$GITHUB_SHA"
            fi
            code="$(curl -sS --max-time 20 -D "$RUNNER_TEMP/tala-headers" -o "$RUNNER_TEMP/tala-response" -w '%{http_code}' -H 'Cache-Control: no-cache' "$url")"
            test "$code" = 200 || { echo "TALA_HTTP_FAILED path=$path code=$code" >&2; exit 1; }
            case "$path" in
              /) grep -Fq 'تَلا | طلا، جواهر و گوهرسنگ' "$RUNNER_TEMP/tala-response"; grep -Fq 'قیمت زنده هنوز متصل نشده' "$RUNNER_TEMP/tala-response" ;;
              /manifest.webmanifest) grep -Fq '"scope":"/tala/"' "$RUNNER_TEMP/tala-response" ;;
              /sw.js) grep -Fq "const CACHE='tala-shell-v3'" "$RUNNER_TEMP/tala-response" ;;
              /assets/tala-mark.svg) grep -Fq '<svg' "$RUNNER_TEMP/tala-response" ;;
              /admin/) grep -Fq 'میزکار کسب‌وکار' "$RUNNER_TEMP/tala-response" ;;
              /api/health.php) grep -iqE '^content-type:[[:space:]]*application/json(;|[[:space:]]*$)' "$RUNNER_TEMP/tala-headers"; grep -Fq '"scope":"tala"' "$RUNNER_TEMP/tala-response"; grep -Fq '"runtime":"php"' "$RUNNER_TEMP/tala-response"; grep -Fq '"pdo_sqlite":true' "$RUNNER_TEMP/tala-response"; grep -Fq '"private_store_writable":true' "$RUNNER_TEMP/tala-response" ;;
              /api/admin.php\?action=status) grep -iqE '^content-type:[[:space:]]*application/json(;|[[:space:]]*$)' "$RUNNER_TEMP/tala-headers"; grep -Fq '"scope":"tala"' "$RUNNER_TEMP/tala-response"; grep -Eq '"setup_required":(true|false)' "$RUNNER_TEMP/tala-response" ;;
            esac
            echo "TALA_PUBLIC_CHECK=$path passed"
          done
          hidden_code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/tala-private-response" -w '%{http_code}' -H 'Cache-Control: no-cache' "$base/api/.private/tala.sqlite3?__tala_verify=$GITHUB_SHA")"
          [[ ! "$hidden_code" =~ ^2[0-9][0-9]$ ]] || { echo "TALA_PRIVATE_DATABASE_EXPOSED code=$hidden_code" >&2; exit 1; }
          echo "TALA_PRIVATE_DATABASE=blocked code=$hidden_code"
          setup_code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/tala-setup-response" -w '%{http_code}' -X POST -H 'Origin: https://zomorodmelal.ir' -H 'X-Tala-Request: 1' -H 'Content-Type: application/json' --data '{"setup_token":"invalid-test-token","username":"invalidtest","password":"invalid-test-password-000"}' "$base/api/admin.php?action=setup")"
          test "$setup_code" = 403 || { echo "TALA_BOOTSTRAP_GATE_FAILED code=$setup_code" >&2; exit 1; }
          echo 'TALA_BOOTSTRAP_GATE=protected'
      - name: Restore prior Tala directory if verification failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tala-ssh"
          test -f "$d/config" || exit 0
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'ROLLBACK'
          set -euo pipefail
          sha="$1"
          root="$HOME/public_html"
          target="$root/tala"
          backup="$HOME/.backups/zomorodmelal-tala/$sha"
          if test ! -f "$backup/deployed.flag"; then
            echo 'TALA_ROLLBACK=not_needed'
            exit 0
          fi
          rm -rf -- "$target"
          if test "$(cat "$backup/prior-existed")" = yes; then
            mv "$backup/prior" "$target"
          fi
          rm -f "$backup/deployed.flag"
          echo 'TALA_ROLLBACK=complete'
          ROLLBACK
