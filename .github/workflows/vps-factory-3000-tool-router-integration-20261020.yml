name: Connect all 3000 factory support tools to active forty-family controller
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_tool_router.py"
      - "tests/test_factory_tool_router.py"
      - "deploy/install_factory_tool_router.sh"
      - ".github/workflows/vps-factory-3000-tool-router-integration-20261020.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-private-factory-3000-tool-router
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Real registry, 3000 tool-route invocations, 40 family callbacks, and safety tests
        run: |
          set -euo pipefail
          bash -n deploy/install_factory_tool_router.sh
          python3 -m py_compile scripts/factory_tool_router.py
          python3 -m unittest discover -s tests -p test_factory_tool_router.py -v
          python3 -m unittest discover -s tests -p test_factory_3000_workbench.py -v
          echo FACTORY_ROUTER_REAL_LOCAL_INTEGRATION_CI=PASS
  install:
    needs: verify
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install only private router via host-key-pinned VPS relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/route-3000";install -d -m 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_vps(){ ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 githubops@178.239.147.150 "$@"; }
          stage="/home/githubops/factory-runtime/operations/.router-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_vps "test ! -e '$stage' && mkdir -m 700 '$stage'"
          for path in scripts/factory_tool_router.py deploy/install_factory_tool_router.sh;do
            name="$(basename "$path")"
            cat "$path" | ssh_vps "umask 077; cat > '$stage/$name'; chmod 600 '$stage/$name'"
            sha="$(sha256sum "$path" | cut -d' ' -f1)"
            ssh_vps "test \"\$(sha256sum '$stage/$name' | cut -d' ' -f1)\" = '$sha'"
          done
          ssh_vps "timeout 180s bash '$stage/install_factory_tool_router.sh' '$stage'"
          ssh_vps 'python3 -' <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          home=Path.home()/'factory-runtime'
          ops=home/'operations';root=home/'private/autonomous-product-cycle'
          script=ops/'forty-execution/periodic-dispatch.sh'
          router=ops/'forty-execution/factory_tool_router.py'
          d=json.loads((root/'tool-router/dashboard.json').read_text())
          assert d['registered_tool_bindings']==3000 and d['families_connected']==40
          assert d['support_invocations_this_tick']==400 and len(d['family_readbacks'])==40
          assert d['payments_touched'] is False and d['sites_touched'] is False
          assert d['agent_workers_confirmed_online']==0
          assert script.read_text().count('factory_tool_router.py')==1
          cron=subprocess.check_output(['crontab','-l'],text=True)
          assert cron.count('SAEIT_FACTORY_FORTY_FAMILY_OPERATIONAL_DISPATCH_V1')==1
          assert str(script) in cron
          subprocess.run(['/bin/bash','-n',str(script)],check=True)
          print('VPS_3000_ROUTED_ALL_40_FAMILIES=PASS')
          print('VPS_ROUTER_400_REAL_FAMILY_SUPPORT_CALLS=PASS')
          print('VPS_WORKER_DISPATCH_REQUIRES_ACTUAL_QUEUE_REQUESTS=TRUE')
          print('VPS_NO_LIVE_SITE_OR_PAYMENT_CHANGES=PASS')
          PY
