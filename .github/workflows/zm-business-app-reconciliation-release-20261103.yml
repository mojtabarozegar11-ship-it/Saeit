name: ZM reconciled business app guarded promotion
on:
  push:
    branches: [feature/zm-bank-ledger-20261102]
    paths:
      - '.github/workflows/zm-business-app-reconciliation-release-20261103.yml'
      - 'content/zomorod-business/app.php'
      - 'content/zomorod-business/app.reconciled-candidate-20261103.php'
      - 'content/zomorod-business/app.production-20261103.php'
      - 'content/zomorod-business/project_governance.php'
      - 'scripts/zm_production_app_guard.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight = read only; publish requires approved hash secret'
        type: choice
        required: true
        default: preflight
        options: [preflight, publish]
permissions:
  contents: read
concurrency:
  group: zm-live-php-private-reports-only
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
      - name: Verify immutable candidate source and required integrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          candidate=content/zomorod-business/app.php
          mirror=content/zomorod-business/app.production-20261103.php
          test "$(sha256sum "$candidate" | awk '{print $1}')" = '2ed9274affa87f3e9c51f7dff0c72d7461118c7aca0ae0ab732b1c81cbfd6005'
          test "$(sha256sum "$mirror" | awk '{print $1}')" = '7a8b2ab1dde07317c084646e4005ac843011821903f65b12297d283ee69412bd'
          cmp -s "$candidate" content/zomorod-business/app.reconciled-candidate-20261103.php
          php -l "$candidate"
          php -l content/zomorod-business/project_governance.php
          for symbol in zmGovHandle zmPiRender zmOpsAssignmentsDesk zmPeriodGuard initializePrivateDb journal_reverse user_update; do
            grep -Fq "$symbol" "$candidate"
          done
          echo 'RECONCILED_SOURCE=hash_pinned_and_php_syntax_valid'
          echo 'REAL_FINANCIAL_EVENTS_CREATED=no'
      - name: Report private hash-approval readiness without exposing its value
        shell: bash
        env:
          APPROVED_SHA: ${{ secrets.ZM_APP_RELEASE_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          expected=2ed9274affa87f3e9c51f7dff0c72d7461118c7aca0ae0ab732b1c81cbfd6005
          if test -z "${APPROVED_SHA:-}"; then
            approval_state=missing
          elif test "$APPROVED_SHA" = "$expected"; then
            approval_state=hash_ready
          else
            approval_state=hash_mismatch
          fi
          echo "PUBLISH_APPROVAL_SECRET_STATE=$approval_state"
          if test "$approval_state" != hash_ready; then
            echo "::warning::This green read-only preflight is NOT publish-ready: private SHA approval is $approval_state."
          fi
          {
            echo '### Zomorod management desk publication readiness'
            echo '- Source and cPanel checks are separate from the private SHA publication decision.'
            echo "- Private SHA approval: $approval_state"
            echo '- Production publication in this preflight: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'PUBLISH_PERFORMED=no'
      - name: Configure pinned two-hop transport
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-app-reconciliation"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host zm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host zm-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump zm-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" zm-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.candidate" "$d/host.known"
      - name: Read-only attestation against current cPanel production
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-app-reconciliation"
          live_sha="$(ssh -F "$d/config" zm-cpanel "sha256sum /home/zomorod2/.private/zomorod-business/app.php" | awk '{print $1}')"
          # Read-only checks accept the already-promoted candidate; publishing
          # remains pinned to the original baseline and fails closed on replay.
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.mode }}" == publish ]]; then
            test "$live_sha" = 'ad9c80fc1bcff01c53cb58acabd088890e9f1dd0b7e3c38c95bd1ff4d67f27a7'
          else
            test "$live_sha" = '2ed9274affa87f3e9c51f7dff0c72d7461118c7aca0ae0ab732b1c81cbfd6005'
          fi
          ssh -F "$d/config" zm-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          root="$HOME/.private/zomorod-business"
          test -f "$root/app.php" && test ! -L "$root/app.php"
          test -f "$root/management.sqlite3" && test ! -L "$root/management.sqlite3"
          test "$(stat -c %a "$root/app.php")" = 600
          test "$(stat -c %a "$root/management.sqlite3")" = 600
          phpbin=/opt/cpanel/ea-php82/root/usr/bin/php
          test -x "$phpbin"
          for module in workflow_desk.php project_control.php project_integrations.php project_governance.php project_ops.php project_portfolio.php industry_operations.php finance_audit.php payroll_control.php payroll_ui.php period_controls.php site_agents.php site_store.php command_center.php insights.php; do
            file="$root/$module"
            test -f "$file" && test ! -L "$file"
            "$phpbin" -l "$file" >/dev/null
          done
          echo "PRODUCTION_REQUIRED_PHP_MODULES=15_present_and_lint_clean"
          # These are the reviewed live dependencies, NOT files to overwrite.
          # Seven modules are private-only; three other public-source modules
          # differ from the branch version. Never silently substitute either.
          while read -r module expected_blob; do
            file="$root/$module"
            test -f "$file" && test ! -L "$file"
            observed_blob="$(git hash-object "$file")"
            test "$observed_blob" = "$expected_blob"
          done <<'REVIEWED_LIVE_MODULES'
          workflow_desk.php 8eb08aace27c7f259cf6bd4ed7922b60dda1fb8c
          project_control.php 288ad642c737f43c9c605a472bbcec97940bdef7
          project_integrations.php 290ebef529145c91a53a2bed8d8465332c8e84e9
          project_governance.php 727cb86b21f94097591835b8249d37fa950f2b14
          project_ops.php cd39cfdc69a347891661eb2384be41d89207f1be
          project_portfolio.php f7d2969a37affbe95bfb59345f0df9cc4e01cee5
          industry_operations.php c0ea47deb93a981108eb7dcc6340533af1258b87
          finance_audit.php b248207cbd8988e8c6a318e7e9330dda42871841
          payroll_control.php 76ce2ed38588075cf9e5b257dd43c07d73295db7
          payroll_ui.php 47261ea0632a2e2d6b41f7fb64c71cfc207dd04a
          period_controls.php ef17c766336a9b4da00872588c239a05290a00a6
          site_agents.php e0e749703ba1f97f7879ecc65e32ad7ffcfcc54d
          site_store.php a7e85d081bec2c83982de5a80480125801e78fb1
          command_center.php 10287639b126aa811c1c9585767404923795d74e
          insights.php b113767f4564dc99a4703f2cfcbee37a58f03d06
          chatgpt_reports.php c668d5c12109f62c4b371823b1711860f63e4e30
          REVIEWED_LIVE_MODULES
          for contract in 'project_governance.php:zmGovHandle' 'project_integrations.php:zmPiRender' 'project_ops.php:zmOpsAssignmentsDesk' 'period_controls.php:zmPeriodGuard' 'site_agents.php:zmAgentHandle' 'command_center.php:zmCcRender' 'chatgpt_reports.php:zmBusinessChatgptReports'; do
            module="${contract%%:*}"
            symbol="${contract#*:}"
            grep -Eq "function[[:space:]]+${symbol}[[:space:]]*\\(" "$root/$module"
          done
          echo "PRODUCTION_DEPENDENCY_ABI=16_pinned_files_and_7_symbols"
          python3 - <<'PY'
          import sqlite3
          p="file:/home/zomorod2/.private/zomorod-business/management.sqlite3?mode=ro"
          conn=sqlite3.connect(p,uri=True)
          conn.execute("PRAGMA query_only=ON")
          required={"users","ledger_accounts","journal_entries","journal_lines","parties","invoices","invoice_payments","inventory","inventory_movements","employees","documents","projects","audit_events","zm_accounting_periods","zm_period_events","zm_project_approval_cases","zm_project_approval_events","zm_project_links"}
          present={r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= present, "missing required management schema"
          assert conn.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          assert not conn.execute("PRAGMA foreign_key_check").fetchall()
          print("PRODUCTION_SQLITE_READONLY_CONTRACT=pass")
          PY
          REMOTE
          echo "PRODUCTION_BASELINE=attested"
          echo "PRODUCTION_WRITES=none"
      - name: Require explicit private approval before publish
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        shell: bash
        env:
          APPROVED_SHA: ${{ secrets.ZM_APP_RELEASE_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$APPROVED_SHA"
          test "$APPROVED_SHA" = '2ed9274affa87f3e9c51f7dff0c72d7461118c7aca0ae0ab732b1c81cbfd6005'
          echo 'PUBLISH_APPROVAL=approved_candidate_hash'
      - name: Preserve an owner-only source backup and SQLite online backup
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-app-reconciliation"
          ssh -F "$d/config" zm-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          root="$HOME/.private/zomorod-business"
          stage="$root/.app-reconciled-$sha"
          backup="$HOME/.backups/zm-app-reconciled/$sha"
          test ! -e "$stage" && test ! -L "$stage"
          test ! -e "$backup" && test ! -L "$backup"
          test "$(sha256sum "$root/app.php" | awk '{print $1}')" = 'ad9c80fc1bcff01c53cb58acabd088890e9f1dd0b7e3c38c95bd1ff4d67f27a7'
          umask 077
          install -d -m 700 "$stage" "$backup"
          cp -p "$root/app.php" "$backup/app.before.php"
          python3 - "$root/management.sqlite3" "$backup/management.before.sqlite3" <<'PY'
          import sqlite3,sys
          source=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True)
          dest=sqlite3.connect(sys.argv[2])
          source.backup(dest)
          assert dest.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          assert not dest.execute("PRAGMA foreign_key_check").fetchall()
          dest.close();source.close()
          PY
          chmod 600 "$backup/management.before.sqlite3"
          test "$(sha256sum "$backup/app.before.php" | awk '{print $1}')" = 'ad9c80fc1bcff01c53cb58acabd088890e9f1dd0b7e3c38c95bd1ff4d67f27a7'
          echo "ROLLBACK_CODE_AND_CONSISTENT_SQLITE=preserved"
          REMOTE
      - name: Transfer reviewed code and guard to isolated private stage only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-app-reconciliation"
          stage="/home/zomorod2/.private/zomorod-business/.app-reconciled-$GITHUB_SHA"
          scp -F "$d/config" content/zomorod-business/app.php scripts/zm_production_app_guard.py content/zomorod-business/app.production-20261103.php "zm-cpanel:$stage/"
      - name: Publish reviewed candidate atomically and roll back on failure
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-app-reconciliation"
          ssh -F "$d/config" zm-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          root="$HOME/.private/zomorod-business"
          app="$root/app.php"
          stage="$root/.app-reconciled-$sha"
          backup="$HOME/.backups/zm-app-reconciled/$sha"
          before=ad9c80fc1bcff01c53cb58acabd088890e9f1dd0b7e3c38c95bd1ff4d67f27a7
          after=2ed9274affa87f3e9c51f7dff0c72d7461118c7aca0ae0ab732b1c81cbfd6005
          test -f "$stage/app.php" && test ! -L "$stage/app.php"
          test "$(sha256sum "$stage/app.php" | awk '{print $1}')" = "$after"
          test "$(sha256sum "$app" | awk '{print $1}')" = "$before"
          python3 "$stage/zm_production_app_guard.py" --live "$app" --reference "$stage/app.production-20261103.php" --expected-live-sha256 "$before"
          phpbin=/opt/cpanel/ea-php82/root/usr/bin/php
          "$phpbin" -l "$stage/app.php" >/dev/null
          test "$(sha256sum "$backup/app.before.php" | awk '{print $1}')" = "$before"
          test -s "$backup/management.before.sqlite3"
          install -m 600 "$stage/app.php" "$stage/app.next.php"
          published=0
          rollback() {
            set +e
            if test "$published" = 1; then
              cp -p "$backup/app.before.php" "$stage/app.rollback.php"
              if mv -f "$stage/app.rollback.php" "$app"; then echo 'APP_ROLLBACK=restored_original_source'; else echo 'APP_ROLLBACK=FAILED_BACKUP_PRESERVED' >&2; fi
            fi
          }
          trap 'rc=$?; trap - EXIT; rollback; exit "$rc"' EXIT
          test "$(sha256sum "$app" | awk '{print $1}')" = "$before"
          published=1
          mv -f "$stage/app.next.php" "$app"
          "$phpbin" -l "$app" >/dev/null
          test "$(sha256sum "$app" | awk '{print $1}')" = "$after"
          test "$(stat -c %a "$app")" = 600
          test "$(stat -c %a "$root/management.sqlite3")" = 600
          # Real, data-preserving post-publish acceptance: protected routes
          # must require authentication for all anonymous visitors.
          for page in dashboard project_links project_calendar project_portfolio project_governance project_finance project_assignments chatgpt_reports command_center accounts journal invoices payments users; do
            response="$stage/anonymous-$page.html"
            code="$(curl --silent --show-error --proto '=https' --max-redirs 0 --max-time 20 -o "$response" -w '%{http_code}' "https://zomorodmelal.ir/business/?page=$page")"
            test "$code" = 200
            grep -Fq 'ورود مدیر و حسابدار' "$response"
            grep -Fq 'name="password"' "$response"
            ! grep -Fq '<nav aria-label="پیمایش مدیریت">' "$response"
            ! grep -Fq '<table' "$response"
          done
          echo 'ANONYMOUS_PRIVATE_ROUTES=14_login_required'
          python3 - "$root/management.sqlite3" <<'PY'
          import sqlite3,sys
          db=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True)
          assert db.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          db.close()
          print("POST_PUBLISH_SQLITE_INTEGRITY=pass")
          PY
          published=0
          trap - EXIT
          echo 'RECONCILED_APP_LIVE=published_with_code_rollback'
          echo 'OWNER_AUTHENTICATED_ACCEPTANCE=still_required'
          echo 'NO_REAL_FINANCIAL_EVENT_CREATED_BY_WORKFLOW=yes'
          REMOTE
      - name: Remove CI relay credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/zm-app-reconciliation"
