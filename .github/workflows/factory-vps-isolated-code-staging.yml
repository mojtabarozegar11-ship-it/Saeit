name: Factory VPS Isolated Code Staging
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-isolated-code-staging.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Extract transferred source into private nonrunning workspace
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          base="$HOME/factory-runtime"
          mkdir -p "$base/source-isolated" "$base/astra-reference"
          "$base/python311/$(find "$base/python311" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)/bin/python3.11" --version || true
          for archive in "$HOME/factory-transfer-incoming/factory-only-modules.tar.gz" "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz"; do
            python3 - "$archive" <<'PY'
          import sys,tarfile,pathlib
          with tarfile.open(sys.argv[1],"r:gz") as t:
              for m in t.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and ".." not in p.parts
                  assert m.isfile() or m.isdir()
          print("SAFE_ARCHIVE_ENTRIES_OK")
          PY
          done
          tar -xzf "$HOME/factory-transfer-incoming/factory-only-modules.tar.gz" -C "$base/source-isolated" --no-same-owner --no-same-permissions
          tar -xzf "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" -C "$base/astra-reference" --no-same-owner --no-same-permissions
          test -f "$base/source-isolated/core/factory_stage4.py"
          test -f "$base/astra-reference/files/core/models.py"
          echo FACTORY_MODULES_STAGED $(find "$base/source-isolated" -type f | wc -l)
          echo ASTRA_REFERENCE_STAGED $(find "$base/astra-reference" -type f | wc -l)
          echo NOT_ACTIVATED_NO_SERVICES_CHANGED
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
