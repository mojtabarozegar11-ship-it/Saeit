name: Moj Play Win canonical render owners diagnostic
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-canonical-owner-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Discover Django render template sources without touching shared app
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path("/home/zomorod2/Saeit-staging")
          paths=["core/mojplaywin_views.py","core/brand_views.py","core/templates/base.html",
                 "core/templates/mojplaywin/section.html","core/templates/mojplaywin/store.html",
                 "core/templates/brands/mojplaywin/base.html","core/templates/brands/mojplaywin/page.html",
                 "core/templates/brands/mojplaywin/home.html","core/templates/mojplaywin/home.html"]
          result={}
          for path in paths:
              p=root/path
              if p.is_symlink() or not p.is_file():
                  result[path]={"exists":False};continue
              src=p.read_text(errors="replace")
              result[path]={"exists":True,"hash16":hashlib.sha256(p.read_bytes()).hexdigest()[:16],
                "first_180":src[:180],
                "inheritance":re.findall(r'\{%\s*extends\s+[^%]+%\}',src)[:2],
                "canonical_directive_count":src.lower().count('rel="canonical"'),
                "get_host_test":'request.get_host' in src,
                "template_marker_count":src.count('mojplaywin'),
                "section_header_lines":[line.strip()[:160] for line in src.splitlines()
                         if ('render(request' in line or 'path("",' in line or
                            'branded_page(' in line or 'template_name' in line)][:20]}
          print(json.dumps({"classification":"MOJ_PLAY_WIN_MAIN_RENDER_SOURCE_MAP",
                            "production_changed":False,"files":result},sort_keys=True))
          PY
      - name: Observe only HTML head and markup fingerprints on six live pages
        shell: bash
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,re
          from html.parser import HTMLParser
          base="https://mojplaywin.com"
          paths=["/store/","/research/","/company/","/knowledge/",
                 "/ventures/agriculture/","/ventures/jewelry-gold/",
                 "/games/","/ai/"]
          results=[]
          for path in paths:
              req=urllib.request.Request(base+path,headers={"User-Agent":"MojPlayWin-canonical-source-inspect"})
              with urllib.request.urlopen(req,timeout=16) as r:
                  html=r.read(2000000).decode("utf-8",errors="replace")
                  code=r.status
              canon=re.findall(r'<link\b[^>]*rel="canonical"[^>]*>',html,re.I)
              title=re.findall(r'<title>(.*?)</title>',html,re.I|re.S)
              body=re.findall(r'<body\b[^>]*>',html,re.I)
              result={
                 "path":path,"http":code,
                 "one_canonical":len(canon)==1,
                 "canonical":canon[0] if canon else "",
                 "title":title[0][:90] if title else "",
                 "body_class":body[0][:180] if body else "",
                 "origin_mojplaywin_own_theme":'mojplaywin-matte-gold-theme' in html,
                 "branded_template_marker":'mpw-atelier-v4' in html,
                 "site_standard_root_template_marker":'site-standard-v2' in html,
                 "uses_mw_page_hero":'mw-page-hero' in html,
                 "uses_mpw_page_hero":'mpw-page-hero' in html,
                 "uses_brand_footer":'mw-site-footer' in html,
                 "has_form":'<form' in html,
                 "has_csrf":'csrfmiddlewaretoken' in html,
                 "contains_dynamic_account":('my-account' in html.lower() or 'your account' in html.lower()),
                 "html_length":len(html),
              }
              results.append(result)
          print(json.dumps({"classification":"MOJ_PLAY_WIN_CANONICAL_PUBLIC_PAGE_FINGERPRINTS",
                            "results":results,"changed_anything":False},sort_keys=True))
          PY
