name: MojPlayWin live cPanel symlink dependency inventory read-only
on:
  pull_request:
    paths:
      - 'scripts/mojplaywin_live_link_dependencies_readonly_20261101.py'
      - 'tests/test_mojplaywin_live_link_dependencies_readonly_20261101.py'
      - 'scripts/mojplaywin_backup_stream_cpanel.py'
      - 'tests/test_mojplaywin_backup_link_guard_20261101.py'
      - '.github/workflows/mpw-live-link-dependencies-readonly-20261101.yml'
permissions: {contents: read}
concurrency:
  group: mpw-live-link-dependencies-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify aggregate-only dependency classifier
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mojplaywin_live_link_dependencies_readonly_20261101.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mojplaywin_backup_link_guard_20261101.py -v
          python3 -B -m py_compile scripts/mojplaywin_live_link_dependencies_readonly_20261101.py
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-invoice-diag-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect pinned cPanel primary roots and link status without changes
        shell: bash
        run: |
          set -euo pipefail
          script64="$(base64 -w0 scripts/mojplaywin_live_link_dependencies_readonly_20261101.py)"
          call='import base64,sys;exec(base64.b64decode(sys.argv[1]))'
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-invoice-diag-ssh/config" saeit-cpanel \
            "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$script64'"
      - name: Verify three public asset alias subtrees are within scoped backup limits (read only)
        shell: bash
        run: |
          set -euo pipefail
          script64="$(base64 -w0 scripts/mojplaywin_backup_stream_cpanel.py)"
          call='import base64,sys;decoded=base64.b64decode(sys.argv[1]);sys.argv=sys.argv[1:];exec(decoded)'
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-invoice-diag-ssh/config" saeit-cpanel "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$script64' preflight-scoped-files"
      - name: Delete runner-only SSH material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-invoice-diag-ssh"
          if [ -d "$d" ]; then
            rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"
            rmdir "$d"
          fi
