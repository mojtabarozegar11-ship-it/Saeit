name: VPS P0 stage-two autonomous source research
on:
  pull_request:
    paths:
      - scripts/factory_stage2_literature_scout.py
      - scripts/factory_enroll_openalex.py
      - scripts/factory_verify_openalex_activation.py
      - tests/test_factory_verify_openalex_activation.py
      - tests/test_factory_enroll_openalex.py
      - tests/test_factory_stage2_literature_scout.py
      - tests/test_agri200_targeted_scholarly_vocabulary_20261024.py
      - deploy/install_factory_stage2_literature_scout.sh
      - .github/workflows/vps-factory-stage2-literature-scout-20261022.yml
  push:
    branches: [main]
    paths:
      - scripts/factory_stage2_literature_scout.py
      - scripts/factory_enroll_openalex.py
      - scripts/factory_verify_openalex_activation.py
      - tests/test_factory_verify_openalex_activation.py
      - tests/test_factory_enroll_openalex.py
      - tests/test_factory_stage2_literature_scout.py
      - deploy/install_factory_stage2_literature_scout.sh
      - .github/workflows/vps-factory-stage2-literature-scout-20261022.yml
permissions:
  contents: read
concurrency:
  group: factory-stage2-autonomous-literature-scout
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify real abstract match, source diversity and fail-closed stage-two contracts
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_stage2_literature_scout.py -v
          python3 -B -m unittest discover -s tests -p test_agri200_targeted_scholarly_vocabulary_20261024.py -v
          python3 -B -m unittest discover -s tests -p test_factory_enroll_openalex.py -v
          python3 -B -m unittest discover -s tests -p test_factory_verify_openalex_activation.py -v
          python3 -B -m unittest discover -s tests -p test_factory_stage2_research.py -v
          python3 -B -m unittest discover -s tests -p test_factory_stage1_handoff.py -v
          python3 -B -m unittest discover -s tests -p test_factory_agri200_p0_intake.py -v
          bash -n deploy/install_factory_stage2_literature_scout.sh
          python3 -B -m py_compile scripts/factory_stage2_literature_scout.py scripts/factory_enroll_openalex.py scripts/factory_verify_openalex_activation.py
  private-vps-install:
    needs: validate
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-stage2-literature-scout-20261022]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Perform stage-two discovery on private VPS and verify source-claim dossiers
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          stage="$RUNNER_TEMP/stage2-research-scout"
          install -d -m 700 "$stage"
          trap 'rm -rf -- "$stage"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$stage/key"
          chmod 600 "$stage/key"
          ssh-keygen -y -P "" -f "$stage/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$stage/known" 2>/dev/null
          test "$(ssh-keygen -lf "$stage/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          ssh_vps() {
            ssh -i "$stage/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$stage/known" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectionAttempts=3 -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 githubops@178.239.147.150 "$@"
          }
          ssh_vps 'test "$(id -un)" = githubops && test "$(id -u)" -ne 0 && test -f "$HOME/factory-runtime/operations/production-instructions/stage2-research.py" && echo FACTORY_STAGE2_SCOUT_PREFLIGHT=PASS'
          remote_stage="/home/githubops/factory-runtime/operations/.stage2-scout-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_vps "umask 077; test ! -e '$remote_stage'; mkdir -m 700 '$remote_stage'"
          for src in scripts/factory_stage2_literature_scout.py deploy/install_factory_stage2_literature_scout.sh scripts/factory_enroll_openalex.py scripts/factory_verify_openalex_activation.py; do
            file="$(basename "$src")"
            cat "$src" | ssh_vps "umask 077; test ! -e '$remote_stage/$file'; cat > '$remote_stage/$file'; chmod 600 '$remote_stage/$file'"
            digest="$(sha256sum "$src" | awk '{print $1}')"
            ssh_vps "test \"\$(sha256sum '$remote_stage/$file' | awk '{print \$1}')\" = '$digest'"
          done
          ssh_vps "bash -n '$remote_stage/install_factory_stage2_literature_scout.sh' && bash '$remote_stage/install_factory_stage2_literature_scout.sh' '$remote_stage/factory_stage2_literature_scout.py'"
          # Owner-authorized signup happens ON the private VPS. The OpenAlex
          # credential never reaches the GitHub runner, repository or logs.
          ssh_vps "python3 '$remote_stage/factory_enroll_openalex.py' --email 'mojtaba.rozegar11@gmail.com' --credential-dir '/home/githubops/factory-runtime/operations/production-instructions'"
          # Confirm the owner's activation using a real authenticated request.
          # No key or provider response body leaves VPS. Only if HTTP 200 is
          # validated may stale keyed 403 cooldown be cleared and research retried.
          activation_report="$(ssh_vps "python3 '$remote_stage/factory_verify_openalex_activation.py' --credential-dir '/home/githubops/factory-runtime/operations/production-instructions' --factory-private '/home/githubops/factory-runtime/private/autonomous-product-cycle'")"
          printf '%s\n' "$activation_report"
          if printf '%s\n' "$activation_report" | grep -Fxq 'FACTORY_OPENALEX_IMMEDIATE_RESEARCH_ALLOWED=true'; then
            ssh_vps 'timeout 650s /home/githubops/factory-runtime/.venv/bin/python -B /home/githubops/factory-runtime/operations/production-instructions/stage2-literature-scout.py --factory-private /home/githubops/factory-runtime/private/autonomous-product-cycle --stage2-program /home/githubops/factory-runtime/operations/production-instructions/stage2-research.py --batch 50 --workers 2 --query-burst 3 --expedite-gap-research'
            ssh_vps 'timeout 120s /home/githubops/factory-runtime/.venv/bin/python -B /home/githubops/factory-runtime/operations/production-instructions/stage2-research.py --factory-private /home/githubops/factory-runtime/private/autonomous-product-cycle --batch 250'
          fi
          ssh_vps 'python3 -' <<'PY'
          import json
          from pathlib import Path
          area=Path.home()/"factory-runtime/private/autonomous-product-cycle/production-instructions"
          idx=json.loads((area/"owner-agri200-p0-index.json").read_text())
          assert len(idx["order_ids_ranked"])==200
          status=json.loads((area/"stage-02/literature-scout-status.json").read_text())
          assert status["sites_changed"] is False and status["human_specialist_reviews_completed"]==0
          print("FACTORY_STAGE2_SOURCE_DISCOVERY_WORKER_INSTALLED=true")
          print("FACTORY_STAGE2_AUTOMATED_ATTEMPTED="+str(status["attempted_this_run"]))
          print("FACTORY_STAGE2_EXPLICIT_RECOVERY_ATTEMPTED="+str(status.get("expedited_unresolved_evidence_gaps",0)))
          print("FACTORY_STAGE2_AUTOMATED_DOCS="+str(status["source_evidence_automatically_documented"]))
          print("FACTORY_STAGE2_AUTO_SOURCE_GAPS="+str(status["still_require_manual_or_external_research"]))
          print("FACTORY_STAGE2_REVIEWER_SIGNATURES_CREATED=0")
          print("FACTORY_WEBSITES_UNCHANGED=true")
          PY
          # Aggregate only non-sensitive source-candidate diagnostics on VPS.
          # These numbers distinguish provider access from evidence matching.
          ssh_vps 'python3 -' <<'PY'
          import collections,json
          from pathlib import Path
          area=Path.home()/"factory-runtime/private/autonomous-product-cycle/production-instructions"
          counts=collections.Counter()
          bins=collections.Counter()
          idx=json.loads((area/"owner-agri200-p0-index.json").read_text())
          for n,_ in enumerate(idx["order_ids_ranked"],1):
              key="AGRI-%03d"%n+"--r001.json"
              p=area/"stage-02/literature-candidates"/key
              if not p.is_file():
                  counts["no_workpaper"]+=1
                  continue
              packet=json.loads(p.read_text())
              counts[packet.get("status","unknown")]+=1
              size=packet.get("indexed_abstract_candidate_count")
              if type(size) is int:
                  bins[str(min(size,5)) if size<5 else "5+"]+=1
          for k,v in sorted(counts.items()):
              print("FACTORY_STAGE2_WORKPAPER_STATUS_"+k.upper()+"="+str(v))
          for k,v in sorted(bins.items()):
              print("FACTORY_STAGE2_VERIFIED_ABSTRACT_CANDIDATE_BIN_"+k.replace("+","PLUS")+"="+str(v))
          PY
