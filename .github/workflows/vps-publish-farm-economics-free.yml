name: Saeit Publish Farm Economics Free Toolkit
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-publish-farm-economics-free.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-store-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-store-preflight"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            key="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$key"
            chmod 600 "$key"
            ssh-keygen -y -P '' -f "$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Inspect factory product handoff source
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          echo VPS_USER="$(id -un)"
          test -s "$base/private/autonomous-product-cycle/production-state.json"
          test -s "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          echo VPS_MANUFACTURED_ZIP_PRESENT
          stat -c 'VPS_ZIP_BYTES=%s PERMISSIONS=%a' "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          python3 - "$base/private/autonomous-product-cycle/production-state.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          for k in ('mode','depends_on_orders','built_product_count','artifact_qa_passed','publishable_product_count','store_distribution_state'):
            print('VPS_FACTORY_'+k.upper()+'='+str(j.get(k)))
          PY
          REMOTE
      - name: Inspect cPanel private staging and storefront runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo CPANEL_USER="$(id -un)"
          echo CPANEL_HOME="$HOME"
          for path in /home/zomorod2/Saeit-staging /home/zomorod2/zomorodmelal.ir /home/zomorod2/mojplaywin.com /home/zomorod2/mojtabarozegar.ir /home/zomorod2/public_html; do
            if test -d "$path" && test ! -L "$path"; then
              echo CPANEL_DIR_PRESENT="$(basename "$path")"
              if test -f "$path/manage.py"; then echo CPANEL_DJANGO_SOURCE="$(basename "$path")"; fi
              if test -f "$path/passenger_wsgi.py"; then echo CPANEL_PASSENGER_SOURCE="$(basename "$path")"; fi
              if test -d "$path/.venv"; then echo CPANEL_LOCAL_VENV="$(basename "$path")"; fi
            else
              echo CPANEL_DIR_MISSING="$(basename "$path")"
            fi
          done
          test -d /home/zomorod2/Saeit-staging
          test -w /home/zomorod2/Saeit-staging
          echo CPANEL_STAGING_WRITABLE
          if test -f /home/zomorod2/Saeit-staging/core/models.py; then
            grep -q '^class Product(' /home/zomorod2/Saeit-staging/core/models.py && echo CPANEL_DJANGO_PRODUCT_MODEL_PRESENT
          fi
          command -v python3 >/dev/null && python3 --version
          df -h "$HOME" | tail -n 1 | awk '{print "CPANEL_DISK_FREE=" $4}'
          REMOTE
      - uses: actions/checkout@v4
      - name: Verify release tests and prevent unreviewed storefront activation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_factory_free_tool.py
          python3 -m unittest discover -s tests -p 'test_publish_factory_free_tool.py' -v
      - name: Install signed-off free product publisher into private cPanel operations
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-store-preflight"
          ssh -F "$d/config" saeit-cpanel 'test -d "$HOME/.saeit-factory-inbox/bin" && test ! -L "$HOME/.saeit-factory-inbox/bin"'
          scp -F "$d/config" scripts/publish_factory_free_tool.py saeit-cpanel:/home/zomorod2/.saeit-factory-inbox/bin/publish_factory_free_tool.py.tmp
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/.saeit-factory-inbox"
          staged="$root/bin/publish_factory_free_tool.py.tmp"
          executable="$root/bin/publish_factory_free_tool.py"
          test -s "$staged"
          test -f "$root/bin/store_receiver.py"
          python3 -m py_compile "$staged"
          chmod 600 "$staged"
          mv "$staged" "$executable"
          python3 "$executable" --inbox "$root" --webroot "$HOME/mojplaywin.com" --authorize-publication
          test -s "$HOME/mojplaywin.com/factory-releases/farm-enterprise-economics-v1/index.html"
          test -s "$HOME/mojplaywin.com/factory-releases/farm-enterprise-economics-v1/Farm_Enterprise_Economics_Toolkit_Free_v1.zip"
          echo FACTORY_PUBLIC_FREE_RELEASE_FILES_READY
          REMOTE
      - name: Verify live HTTPS landing page and exact public ZIP hash
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-store-preflight"
          root="https://mojplaywin.com/factory-releases/farm-enterprise-economics-v1"
          status="$(curl -sSL --max-time 18 -o "$d/landing.html" -w '%{http_code}' "$root/")"
          echo FREE_RELEASE_PAGE_HTTP="$status"
          test "$status" = 200
          grep -q 'Farm Enterprise Economics Toolkit' "$d/landing.html"
          grep -q 'Download the Free Toolkit' "$d/landing.html"
          record_status="$(curl -sSL --max-time 18 -o "$d/SHA256SUMS.txt" -w '%{http_code}' "$root/SHA256SUMS.txt")"
          test "$record_status" = 200
          digest="$(awk 'NF>=2 {print $1}' "$d/SHA256SUMS.txt")"
          test "\${#digest}" = 64
          archive_status="$(curl -sSL --max-time 30 -o "$d/product.zip" -w '%{http_code}' "$root/Farm_Enterprise_Economics_Toolkit_Free_v1.zip")"
          echo FREE_RELEASE_ZIP_HTTP="$archive_status"
          test "$archive_status" = 200
          test "$(sha256sum "$d/product.zip" | cut -d ' ' -f 1)" = "$digest"
          python3 - "$d/product.zip" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert "farm_enterprise_economics/calculator.py" in z.namelist()
              assert "farm_enterprise_economics/README.md" in z.namelist()
          print("PUBLIC_PRODUCT_DOWNLOAD_INTEGRITY_VERIFIED")
          PY
          for url in https://mojplaywin.com/ https://mojplaywin.com/store/ https://mojplaywin.com/mojtaba.roozegar/; do
            state="$(curl -sSL --max-time 18 -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "EXISTING_SITE_HEALTH_HTTP=$state"
            test "$state" = 200
          done
          echo FACTORY_PRODUCT_PUBLIC_FREE_RELEASE_SUCCESS
      - name: Clean temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/factory-store-preflight"
