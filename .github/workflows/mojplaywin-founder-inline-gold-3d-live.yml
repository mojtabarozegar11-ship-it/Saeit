name: MojPlayWin FIX inline 3D gold founder in footer on MAIN plus 22 previews
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-founder-inline-gold-3d-live.yml"]
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-only-root-deploy
  cancel-in-progress: false
jobs:
  fix-visible-footer-position:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and 3D visual placement using synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_mojplaywin_founder_inline_gold_3d_fix.py -v
          python3 -m py_compile scripts/mojplaywin_founder_inline_gold_3d_fix.py
          grep -Fq "caa94d5d998095bed802cd1bf6d48c7bed9f5d5ee6424139677e8557a74a4f4d" scripts/mojplaywin_founder_inline_gold_3d_fix.py
          grep -Fq "transform:translate(2px,3px)" scripts/mojplaywin_founder_inline_gold_3d_fix.py
          grep -Fq 'box-shadow:none!important' scripts/mojplaywin_founder_inline_gold_3d_fix.py
      - name: Configure pinned GitHub to VPS to cPanel private read-only relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-footer-inline3d"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
      - name: Record main and protected-site public baseline before any change
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          paths=("/", "/store/", "/research/", "/company/", "/games/",
                 "/mojtaba.roozegar/", "/mojtaba.roozegar/about/", "/picm/login/",
                 "/studio.Roham/", "/saman/", "/farnaz/", "/zahra%24%24/", "/taniya/")
          states={}
          for path in paths:
              req=urllib.request.Request("https://mojplaywin.com"+path,
                   headers={"User-Agent":"MojPlayWin-inline-gold-before/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=15) as res:
                  states[path]=res.status
                  assert res.status==200
              print("BEFORE_PROTECTED_HEALTH_OK "+path)
          filename=os.path.join(os.environ["RUNNER_TEMP"],"mpw-footer-before.json")
          with open(filename,"w") as f:json.dump(states,f,sort_keys=True)
          PY
      - name: Atomic install 3D gold text IN existing footer first column, remove old floating cards
        id: install
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-footer-inline3d"
          timeout 150s ssh -T -F "$d/config" saeit-cpanel "python3 - install '$GITHUB_RUN_ID'" < scripts/mojplaywin_founder_inline_gold_3d_fix.py
      - name: Check actual public root and all 22 preview footers, plus protected routes
        id: acceptance
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.request
          root="https://mojplaywin.com"
          names=("index","store","research","agents","restaurant","ai","blockchain","support","web_engineering","venture_fuel_station","venture_jewelry_gold","venture_carpets","venture_crypto","venture_ecommerce","venture_agriculture","venture_hospitality","industry","knowledge","economy","studio","market","company")
          pages=["/"]+["/design-preview-20261017/"+name+".html" for name in names]
          assert len(pages)==23
          for path in pages:
              req=urllib.request.Request(root+path+("?__footer3d=20261018" if path=="/" else "?__footer3d=20261018"),
                   headers={"User-Agent":"MojPlayWin-real-inline-3d-footer-acceptance","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  assert response.status==200
                  html=response.read(960000).decode("utf-8")
              footer=re.search(r'<footer\b[^>]*class="mw-site-footer"[^>]*>(.*?)</footer>',html,re.S|re.I)
              assert footer, path
              brand=footer.group(1).split("</div>",1)[0]
              assert brand.count('data-mpw-inline-gold-3d="true"')==1,path
              assert brand.count('class="mpw-gold-3d"')==1,path
              assert 'data-text="Mojtaba Roozegar"' in brand,path
              assert "Mojtaba Roozegar</strong>" in brand,path
              assert "Play. Build. Evolve." in brand,path
              assert 'class="mpw-root-founder"' not in html,path
              assert 'class="mpw-preview-founder"' not in html,path
              assert html.count('id="mpw-footer-gold-3d-inline-v2"')==1,path
              assert "transform:translate(2px,3px)" in html,path
              assert "linear-gradient(180deg" in html,path
              assert "box-shadow:none!important" in html,path
              if path=="/":
                  assert "MJWP_ROOT_CANDIDATE_ONLY_20261017" in html
                  assert 'noindex,nofollow,noarchive' not in html
                  assert html.count('class="mpo-orbit-card"')==18
              else:
                  assert 'noindex,nofollow,noarchive' in html
              print("IN_FOOTER_GOLD_3D_NO_SEPARATE_CARD_VERIFIED "+path)
          baseline_file=os.path.join(os.environ["RUNNER_TEMP"],"mpw-footer-before.json")
          previous=json.load(open(baseline_file))
          for path,old in previous.items():
              req=urllib.request.Request(root+path,
                   headers={"User-Agent":"MojPlayWin-real-inline-3d-protected-acceptance","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as res:
                  assert res.status==old==200
              print("PROTECTED_POST_HEALTH_UNCHANGED "+path)
          print("ROOT_PLUS_22_PREVIEW_FOOTERS_INTEGRATED_GOLD_THREED=true")
          print("NO_EXTERNAL_FOOTER_TILE=true")
          print("SHARED_PASSENGER_RESTARTED=false")
          print("PRODUCT_PAYMENTS_ORDERS_UNCHANGED=true")
          PY
      - name: Commit after independently confirmed public rendering
        id: commit
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-footer-inline3d"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "python3 - commit '$GITHUB_RUN_ID'" < scripts/mojplaywin_founder_inline_gold_3d_fix.py
          echo "PUBLIC_ROOT_PLUS_22_PREVIEW_IN_FOOTER_3D_GOLD_COMMITTED=true"
      - name: Rollback only the exact 23 static main-owned files on any failure
        if: failure()
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-footer-inline3d"
          if test -f "$d/config"; then
            if timeout 18s ssh -T -F "$d/config" saeit-cpanel "test -f '/home/zomorod2/.mpw-founder-inline3d-backups/run-$GITHUB_RUN_ID/state.json'"; then
              timeout 110s ssh -T -F "$d/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mojplaywin_founder_inline_gold_3d_fix.py
              echo "MAIN_STATIC_23_ROLLBACK_SUCCESS=true"
            fi
          fi
      - name: Scrub SSH credentials from runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-footer-inline3d"
