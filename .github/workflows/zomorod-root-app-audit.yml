name: Inspect Zomorod root app mapping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-root-app-audit.yml"

permissions:
  contents: read

concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false

jobs:
  inspect-root-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-audit"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Read the existing root app config without changing it
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-audit/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          raw="$(mktemp "$HOME/.root-app-audit.XXXXXX.json")"
          trap 'rm -f -- "$raw"' EXIT
          uapi --output=json PassengerApps list_applications > "$raw"
          python3 - "$raw" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          wanted=[]
          stack=[data]
          keys={"name","appname","domain","base_uri","app_root","application_root","enabled","python_version","startup_file","uri","path"}
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                      wanted.append({k:x[k] for k in keys if k in x})
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          if len(wanted)!=1:
              raise SystemExit(f"ROOT_APP_COUNT={len(wanted)}")
          print("ROOT_APP_CONFIG="+json.dumps(wanted[0],ensure_ascii=False,sort_keys=True))
          PY
          printf 'HTACCESS_PASSENGER_DIRECTIVES_BEGIN\n'
          if test -f /home/zomorod2/public_html/.htaccess; then
            grep -E '^[[:space:]]*(Passenger|RewriteEngine|RewriteCond|RewriteRule)' /home/zomorod2/public_html/.htaccess || true
          fi
          printf 'HTACCESS_PASSENGER_DIRECTIVES_END\n'
          printf 'UAPI_HELP_BEGIN\n'
          uapi --help 2>&1 | head -n 40 || true
          printf 'UAPI_HELP_END\n'
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-audit"
