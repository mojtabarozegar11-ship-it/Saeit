name: Restore Zomorodmelal Django root and verify pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-root-app-audit.yml"

permissions:
  contents: read

concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false

jobs:
  restore-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-restore"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Re-enable the existing root application
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-restore/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          commit_sha="$1"
          python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(["uapi","--output=json","PassengerApps","list_applications"], check=True, capture_output=True, text=True)
          data = json.loads(result.stdout)
          found=[]
          stack=[data]
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                      found.append(x)
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          if len(found)!=1:
              raise SystemExit(f"ROOT_APP_COUNT={len(found)}")
          app=found[0]
          if app.get("name")!="saeit-django" or app.get("path")!="/home/zomorod2/Saeit":
              raise SystemExit("ROOT_APP_MAPPING_CHANGED; refusing to enable")
          root="/home/zomorod2/public_html"
          import os
          live=root+"/.htaccess"
          htbackup=os.path.expanduser("~/.backups/zomorodmelal-amozeshgah/htaccess.20261014T235252Z")
          print("LIVE_HTACCESS_PRESENT="+str(os.path.isfile(live)).lower())
          print("HTACCESS_SNAPSHOT_PRESENT="+str(os.path.isfile(htbackup)).lower())
          if os.path.isfile(live):
              print("LIVE_HTACCESS_PASSENGER_DIRECTIVES_BEGIN")
              for line in open(live,encoding="utf-8",errors="replace"):
                  if line.lstrip().startswith(("Passenger","RewriteEngine","RewriteCond","RewriteRule")):
                      print(line.rstrip())
              print("LIVE_HTACCESS_PASSENGER_DIRECTIVES_END")
          for base in (os.path.expanduser("~/.backups/zomorodmelal-root-homepage"), os.path.expanduser("~/.backups/zomorodmelal-amozeshgah")):
              print("BACKUP_DIRECTORY="+base+" EXISTS="+str(os.path.isdir(base)).lower())
              if os.path.isdir(base):
                  for name in sorted(os.listdir(base)):
                      print("BACKUP_ENTRY="+name)
          print("ROOT_INDEX_PRESENT="+str(os.path.lexists(root+"/index.html")).lower())
          print("ROOT_APP_PRECHECK=passed")
          PY
          result="$(uapi --output=json PassengerApps enable_application name=saeit-django)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",{}); print("PASSENGER_ENABLE_STATUS="+str(r.get("status"))); print("PASSENGER_ENABLE_ERRORS="+str(r.get("errors") or [])); sys.exit(0 if r.get("status")==1 and not r.get("errors") else 1)' <<<"$result"
          app_json="$(mktemp "$HOME/.root-app-enabled.XXXXXX.json")"
          trap 'rm -f -- "$app_json"' EXIT
          uapi --output=json PassengerApps list_applications > "$app_json"
          python3 - "$app_json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          found=[]
          stack=[data]
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                      found.append(x)
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          if len(found)!=1 or found[0].get("enabled") not in (1,True,"1"):
              raise SystemExit("ROOT_APP_NOT_ENABLED")
          print("ROOT_APP_ENABLED=yes")
          PY
          cd /home/zomorod2/Saeit
          install -d -m 700 tmp
          printf 'APP_ENV_FILE_PRESENT='
          test -f .env && echo yes || echo no
          diag="$(mktemp "$HOME/.root-app-diag.XXXXXX")"
          trap 'rm -f -- "$app_json" "$diag"' EXIT
          htaccess=/home/zomorod2/public_html/.htaccess
          python_path="$(awk '$1 == "PassengerPython" { gsub(/"/, "", $2); print $2; exit }' "$htaccess")"
          echo "CONFIGURED_PASSENGER_PYTHON=$python_path"
          test -n "$python_path"
          test -x "$python_path"
          if ! "$python_path" -c 'import django' >/dev/null 2>&1; then
            backup="$HOME/.backups/zomorodmelal-root-homepage/pip-freeze-before-$commit_sha.txt"
            install -d -m 700 "$HOME/.backups/zomorodmelal-root-homepage"
            test ! -e "$backup"
            "$python_path" -m pip freeze >"$backup"
            echo "PREVIOUS_PYTHON_PACKAGES_BACKUP=$backup"
            "$python_path" -m pip install --disable-pip-version-check --no-input -r /home/zomorod2/Saeit/requirements.txt
            echo "DJANGO_DEPENDENCIES_INSTALLED=yes"
          fi
          if ! "$python_path" -c 'import PIL' >/dev/null 2>&1; then
            "$python_path" -m pip install --disable-pip-version-check --no-input "Pillow>=10,<12"
            echo "PILLOW_INSTALLED=yes"
          fi
          echo "PASSENGER_PYTHON_PATH=$python_path"
          "$python_path" -c 'import django; print("DJANGO_VERSION="+django.get_version())'
          touch tmp/restart.txt
          echo "PASSENGER_RESTART_TRIGGERED=yes"
          set +e
          "$python_path" manage.py check >"$diag" 2>&1
          check_status=$?
          echo "DJANGO_CHECK_EXIT=$check_status"
          tail -n 35 "$diag" | sed -E 's/(SECRET_KEY|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)([^=]*=)[^[:space:]]+/\1\2[redacted]/Ig'
          : >"$diag"
          "$python_path" -c 'import passenger_wsgi; print("PASSENGER_WSGI_IMPORT=passed")' >"$diag" 2>&1
          import_status=$?
          echo "PASSENGER_WSGI_IMPORT_EXIT=$import_status"
          tail -n 35 "$diag" | sed -E 's/(SECRET_KEY|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)([^=]*=)[^[:space:]]+/\1\2[redacted]/Ig'
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          roots=[Path("/home/zomorod2/logs"),Path("/home/zomorod2/Saeit"),Path("/home/zomorod2/public_html")]
          found=[]
          for root in roots:
              if not root.exists(): continue
              for base,dirs,files in os.walk(root):
                  depth=len(Path(base).relative_to(root).parts)
                  dirs[:]=[d for d in dirs if d not in {".git","venv","node_modules","staticfiles","media"}]
                  if depth>=3: dirs[:]=[]
                  for name in files:
                      if any(k in name.lower() for k in ("error_log","error.log","passenger.log","stderr")):
                          p=Path(base)/name
                          try: found.append((p.stat().st_mtime,p))
                          except OSError: pass
          found=sorted(found,reverse=True)[:8]
          print("RECENT_APP_ERROR_LOG_FILES_BEGIN")
          for _,path in found:
              print("APP_ERROR_LOG_BEGIN="+str(path))
              try:
                  lines=path.read_text(errors="replace").splitlines()[-180:]
                  selected=[x for x in lines if re.search(r"error|exception|traceback|passenger|spawn|killed|memory|limit|denied|failed",x,re.I)]
                  for line in selected[-30:]:
                      line=re.sub(r"(?i)(secret_key|password|token|api[_-]?key|private[_-]?key)(\\s*[:=]\\s*)[^\\s,;]+",r"\\1\\2[redacted]",line)
                      line=re.sub(r"(?i)(authorization:\\s*)[^\\r\\n]+",r"\\1[redacted]",line)
                      print(line[:600])
              except Exception as exc:
                  print("LOG_READ_ERROR="+type(exc).__name__)
              print("APP_ERROR_LOG_END="+str(path))
          print("RECENT_APP_ERROR_LOG_FILES_END")
          PY
          set -e
          export DJANGO_SETTINGS_MODULE=config.settings
          "$python_path" - <<'PY'
          from pathlib import Path
          import django,re
          django.setup()
          from django.test import RequestFactory
          from django.urls import resolve
          request=RequestFactory().get("/",HTTP_HOST="zomorodmelal.ir",secure=True)
          match=resolve("/")
          print("RESTORED_PRODUCTION_ROOT_VIEW="+match.func.__module__+"."+match.func.__name__)
          response=match.func(request,*match.args,**match.kwargs)
          if hasattr(response,"render") and not getattr(response,"is_rendered",True):
              response.render()
          if response.status_code!=200:
              raise SystemExit(f"PRODUCTION_ROOT_RENDER_STATUS={response.status_code}")
          content=response.content
          lowered=content.lower()
          if len(content)<500 or b"<html" not in lowered or b"index of /" in lowered or b"saeit-zomorod-root-homepage-v1" in content:
              raise SystemExit("PRODUCTION_ROOT_RENDER_CONTENT_CHECK_FAILED")
          title=re.search(br"<title[^>]*>(.*?)</title>",content,re.I|re.S)
          print("RESTORED_PRODUCTION_ROOT_TITLE="+(title.group(1).decode("utf-8","replace").strip() if title else "no-title"))
          root=Path("/home/zomorod2/public_html")
          target=root/"index.html"
          candidate=root/".zomorod-root-restore-candidate"
          if target.exists():
              if target.read_bytes()==content:
                  candidate.unlink(missing_ok=True)
                  print("PRODUCTION_ROOT_TEMPLATE_ALREADY_RESTORED=yes")
                  raise SystemExit(0)
              raise SystemExit("PUBLIC_ROOT_INDEX_EXISTS; refusing to overwrite")
          if candidate.exists():
              candidate.unlink()
          candidate.write_bytes(content)
          candidate.chmod(0o644)
          if candidate.read_bytes()!=content:
              raise SystemExit("ROOT_TEMPLATE_CANDIDATE_VERIFY_FAILED")
          candidate.replace(target)
          print("PRODUCTION_ROOT_TEMPLATE_RESTORED=yes")
          print("ROOT_TEMPLATE_BYTES="+str(len(content)))
          PY
          REMOTE
      - name: Diagnose cPanel resource saturation
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-restore/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se <<'REMOTE'
          set +e
          echo "CPANEL_DIAGNOSTICS_BEGIN"
          date -u
          uptime
          cat /proc/loadavg
          ps -u "$(id -u)" -o pid,ppid,stat,etime,comm,%cpu,%mem --sort=-%cpu | head -n 25
          for path in /home/zomorod2/public_html/index.html /home/zomorod2/public_html/amozeshgah/index.html /home/zomorod2/public_html/.htaccess; do
            if test -f "$path"; then stat -c 'FILE=%n SIZE=%s MODE=%a MTIME=%y' "$path"; else echo "FILE_MISSING=$path"; fi
          done
          uapi --output=json ResourceUsage get_usages 2>&1 | head -c 12000 || true
          echo
          command -v lveinfo >/dev/null 2>&1 && lveinfo --user zomorod2 --period 1h --by-fault all 2>&1 | head -n 35 || true
          echo "CPANEL_DIAGNOSTICS_END"
          REMOTE
      - name: Check live site routes
        shell: bash
        run: |
          set -euo pipefail
          token="codex-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          urls=(
            "https://zomorodmelal.ir/"
            "https://www.zomorodmelal.ir/"
            "https://zomorodmelal.ir/amozeshgah/"
          )
          failures=0
          n=0
          for original in "${urls[@]}"; do
            n=$((n+1))
            sep='?'
            [[ "$original" == *\?* ]] && sep='&'
            url="${original}${sep}healthcheck=${token}-${n}"
            out="$RUNNER_TEMP/route-${n}.body"
            status="$(curl --silent --show-error --location --max-time 35 --output "$out" --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$url")"
            echo "HTTP $status $original"
            if (( status < 200 || status >= 400 )); then
              failures=1
              echo "ROUTE_FAILED=$original" >&2
              head -c 1000 "$out" >&2 || true
              echo
              continue
            fi
            if [[ "$original" == "https://zomorodmelal.ir/" ]]; then
              grep -q 'زمرد ملل | پیوند پژوهش، تولید و بازار' "$out" || failures=1
              ! grep -qi 'Index of /' "$out" || failures=1
              ! grep -q 'saeit-zomorod-root-homepage-v1' "$out" || failures=1
            fi
            if [[ "$original" == "https://zomorodmelal.ir/amozeshgah/" ]]; then
              grep -q 'education-page' "$out" || failures=1
              grep -q 'آموزش؛ از اولین درس تا مهارت حرفه‌ای' "$out" || failures=1
            fi
          done
          if (( failures )); then
            echo "PUBLIC_ROUTE_SMOKE_TESTS=failed"
            exit 1
          fi
          echo "PUBLIC_ROUTE_SMOKE_TESTS=passed"
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-restore"
