name: Restore Zomorodmelal Django root and verify pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-root-app-audit.yml"

permissions:
  contents: read

concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false

jobs:
  restore-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-restore"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Re-enable the existing root application
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-restore/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(["uapi","--output=json","PassengerApps","list_applications"], check=True, capture_output=True, text=True)
          data = json.loads(result.stdout)
          found=[]
          stack=[data]
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                      found.append(x)
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          if len(found)!=1:
              raise SystemExit(f"ROOT_APP_COUNT={len(found)}")
          app=found[0]
          if app.get("name")!="saeit-django" or app.get("path")!="/home/zomorod2/Saeit":
              raise SystemExit("ROOT_APP_MAPPING_CHANGED; refusing to enable")
          root="/home/zomorod2/public_html"
          import os
          live=root+"/.htaccess"
          htbackup=os.path.expanduser("~/.backups/zomorodmelal-amozeshgah/htaccess.20261014T235252Z")
          print("LIVE_HTACCESS_PRESENT="+str(os.path.isfile(live)).lower())
          print("HTACCESS_SNAPSHOT_PRESENT="+str(os.path.isfile(htbackup)).lower())
          if os.path.isfile(live):
              print("LIVE_HTACCESS_PASSENGER_DIRECTIVES_BEGIN")
              for line in open(live,encoding="utf-8",errors="replace"):
                  if line.lstrip().startswith(("Passenger","RewriteEngine","RewriteCond","RewriteRule")):
                      print(line.rstrip())
              print("LIVE_HTACCESS_PASSENGER_DIRECTIVES_END")
          for base in (os.path.expanduser("~/.backups/zomorodmelal-root-homepage"), os.path.expanduser("~/.backups/zomorodmelal-amozeshgah")):
              print("BACKUP_DIRECTORY="+base+" EXISTS="+str(os.path.isdir(base)).lower())
              if os.path.isdir(base):
                  for name in sorted(os.listdir(base)):
                      print("BACKUP_ENTRY="+name)
          if os.path.lexists(root+"/index.html"):
              raise SystemExit("PUBLIC_ROOT_INDEX_PRESENT; refusing to overwrite")
          print("ROOT_APP_PRECHECK=passed")
          PY
          result="$(uapi --output=json PassengerApps enable_application name=saeit-django)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",{}); print("PASSENGER_ENABLE_STATUS="+str(r.get("status"))); print("PASSENGER_ENABLE_ERRORS="+str(r.get("errors") or [])); sys.exit(0 if r.get("status")==1 and not r.get("errors") else 1)' <<<"$result"
          app_json="$(mktemp "$HOME/.root-app-enabled.XXXXXX.json")"
          trap 'rm -f -- "$app_json"' EXIT
          uapi --output=json PassengerApps list_applications > "$app_json"
          python3 - "$app_json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          found=[]
          stack=[data]
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                      found.append(x)
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          if len(found)!=1 or found[0].get("enabled") not in (1,True,"1"):
              raise SystemExit("ROOT_APP_NOT_ENABLED")
          print("ROOT_APP_ENABLED=yes")
          PY
          cd /home/zomorod2/Saeit
          printf 'APP_ENV_FILE_PRESENT='
          test -f .env && echo yes || echo no
          diag="$(mktemp "$HOME/.root-app-diag.XXXXXX")"
          trap 'rm -f -- "$app_json" "$diag"' EXIT
          set +e
          /home/zomorod2/virtualenv/Saeit/3.11/bin/python manage.py check >"$diag" 2>&1
          check_status=$?
          echo "DJANGO_CHECK_EXIT=$check_status"
          tail -n 35 "$diag" | sed -E 's/(SECRET_KEY|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)([^=]*=)[^[:space:]]+/\1\2[redacted]/Ig'
          : >"$diag"
          /home/zomorod2/virtualenv/Saeit/3.11/bin/python -c 'import passenger_wsgi; print("PASSENGER_WSGI_IMPORT=passed")' >"$diag" 2>&1
          import_status=$?
          echo "PASSENGER_WSGI_IMPORT_EXIT=$import_status"
          tail -n 35 "$diag" | sed -E 's/(SECRET_KEY|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)([^=]*=)[^[:space:]]+/\1\2[redacted]/Ig'
          printf 'RECENT_APP_ERROR_LOG_FILES_BEGIN\n'
          find /home/zomorod2/logs /home/zomorod2/Saeit /home/zomorod2/public_html -maxdepth 3 -type f \\
            \( -iname '*error*log*' -o -iname '*passenger*log*' -o -iname '*stderr*' \) \\
            -printf '%T@ %s %p\\n' 2>/dev/null | sort -nr | head -n 25
          printf 'RECENT_APP_ERROR_LOG_FILES_END\n'
          while IFS= read -r logfile; do
            test -f "$logfile" || continue
            echo "APP_ERROR_LOG_BEGIN=$logfile"
            tail -n 100 "$logfile" | grep -Ei 'error|exception|traceback|passenger|spawn|killed|limit|denied|failed' | tail -n 35 | \\
              sed -E 's/(SECRET_KEY|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)([^=]*=)[^[:space:]]+/\\1\\2[redacted]/Ig; s/(Authorization: ).*/\\1[redacted]/Ig'
            echo "APP_ERROR_LOG_END=$logfile"
          done < <(find /home/zomorod2/logs /home/zomorod2/Saeit /home/zomorod2/public_html -maxdepth 3 -type f \\
            \( -iname '*error*log*' -o -iname '*passenger*log*' -o -iname '*stderr*' \) 2>/dev/null | head -n 8)
          set -e
          REMOTE
      - name: Check live site routes
        shell: bash
        run: |
          set -euo pipefail
          token="codex-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          urls=(
            "https://zomorodmelal.ir/"
            "https://www.zomorodmelal.ir/"
            "https://zomorodmelal.ir/amozeshgah/"
            "https://zomorodmelal.ir/education/"
            "https://zomorodmelal.ir/academy/"
            "https://zomorodmelal.ir/services/"
            "https://zomorodmelal.ir/agriculture/"
            "https://zomorodmelal.ir/industry/"
            "https://zomorodmelal.ir/knowledge/"
            "https://zomorodmelal.ir/market/"
            "https://zomorodmelal.ir/economy/"
            "https://zomorodmelal.ir/studio/"
            "https://zomorodmelal.ir/agents/"
            "https://zomorodmelal.ir/company/"
            "https://zomorodmelal.ir/weather/"
            "https://zomorodmelal.ir/store/"
            "https://zomorodmelal.ir/auctions/"
            "https://zomorodmelal.ir/search/"
            "https://zomorodmelal.ir/robots.txt"
            "https://zomorodmelal.ir/sitemap.xml"
          )
          n=0
          for original in "${urls[@]}"; do
            n=$((n+1))
            sep='?'
            [[ "$original" == *\?* ]] && sep='&'
            url="${original}${sep}healthcheck=${token}-${n}"
            out="$RUNNER_TEMP/route-${n}.body"
            status="$(curl --silent --show-error --location --max-time 35 --output "$out" --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$url")"
            echo "HTTP $status $original"
            if (( status < 200 || status >= 500 )); then
              echo "ROUTE_FAILED=$original" >&2
              head -c 1500 "$out" >&2 || true
              exit 1
            fi
            if [[ "$original" == "https://zomorodmelal.ir/" ]]; then
              grep -q 'services-page' "$out"
              grep -q 'یک درگاه برای' "$out"
              ! grep -qi 'Index of /' "$out"
              ! grep -q 'saeit-zomorod-root-homepage-v1' "$out"
            fi
            if [[ "$original" == "https://zomorodmelal.ir/amozeshgah/" ]]; then
              grep -q 'education-page' "$out"
              grep -q 'آموزش؛ از اولین درس تا مهارت حرفه‌ای' "$out"
            fi
          done
          echo "PUBLIC_ROUTE_SMOKE_TESTS=passed"
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-restore"
