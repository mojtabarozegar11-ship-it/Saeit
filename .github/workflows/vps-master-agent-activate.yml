name: VPS Activate and Repair Single Master Agent and Evolution
on:
  pull_request:
    paths: [.github/workflows/vps-master-agent-activate.yml, scripts/vps_master_evolution_cycle.py, tests/test_vps_master_evolution_cycle.py, tests/test_master_activation_workflow_gate.py, deploy/activate_vps_master_agent.sh, core/autonomous_brain.py, core/economic_tool_pack.py, core/economic_master_agent.py, core/self_funding_policy.py, core/task_runtime.py, core/recovery_scheduler.py, core/management/commands/recover_stale_tasks.py, core/management/commands/seed_online_income_agents.py, core/management/commands/run_economic_worker.py, core/management/commands/economic_worker.py, core/worker_runner.py, core/management/commands/autonomous_master_loop.py, core/management/commands/online_income_cycle.py]
  push:
    branches: [main]
    paths: [.github/workflows/vps-master-agent-activate.yml, scripts/vps_master_evolution_cycle.py, tests/test_vps_master_evolution_cycle.py, tests/test_master_activation_workflow_gate.py, deploy/activate_vps_master_agent.sh, core/autonomous_brain.py, core/economic_tool_pack.py, core/economic_master_agent.py, core/self_funding_policy.py, core/task_runtime.py, core/recovery_scheduler.py, core/management/commands/recover_stale_tasks.py, core/management/commands/seed_online_income_agents.py, core/management/commands/run_economic_worker.py, core/management/commands/economic_worker.py, core/worker_runner.py, core/management/commands/autonomous_master_loop.py, core/management/commands/online_income_cycle.py]
  workflow_dispatch:
    inputs:
      recovery_authorized:
        description: 'Confirm owner-approved recovery, verified off-host backup and rollback readiness before VPS writes'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: vps-single-master-activation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Master adaptive policy regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/activate_vps_master_agent.sh
          python3 -B -m unittest discover -s tests -p 'test_vps_master_evolution_cycle.py' -v
          python3 -B -m unittest discover -s tests -p 'test_master_activation_workflow_gate.py' -v
          python3 -m py_compile scripts/vps_master_evolution_cycle.py core/management/commands/seed_online_income_agents.py core/management/commands/run_economic_worker.py core/management/commands/economic_worker.py core/autonomous_brain.py core/economic_tool_pack.py core/economic_master_agent.py core/self_funding_policy.py core/task_runtime.py core/recovery_scheduler.py core/management/commands/recover_stale_tasks.py
  activate:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_authorized == true && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate private deployment sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/activate_vps_master_agent.sh
          python3 -m py_compile scripts/vps_master_evolution_cycle.py
          python3 -B -m unittest discover -s tests -p 'test_vps_master_evolution_cycle.py' -v
          python3 -B -m unittest discover -s tests -p 'test_master_activation_workflow_gate.py' -v
          python3 -m py_compile core/worker_runner.py core/management/commands/autonomous_master_loop.py core/management/commands/seed_online_income_agents.py core/management/commands/run_economic_worker.py core/management/commands/economic_worker.py core/master_agent_capability_pack.py core/autonomous_brain.py core/economic_tool_pack.py core/economic_master_agent.py core/self_funding_policy.py core/task_runtime.py core/recovery_scheduler.py core/management/commands/recover_stale_tasks.py
      - name: Backup, seed, activate and schedule bounded evolution on VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/vps-master-agent"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=24)
          tar -cf "$d/bundle.tar" deploy/activate_vps_master_agent.sh scripts/vps_master_evolution_cycle.py core/autonomous_brain.py core/economic_tool_pack.py core/economic_master_agent.py core/self_funding_policy.py core/task_runtime.py core/recovery_scheduler.py core/management/commands/recover_stale_tasks.py core/management/commands/seed_online_income_agents.py core/management/commands/run_economic_worker.py core/management/commands/economic_worker.py core/worker_runner.py core/management/commands/autonomous_master_loop.py core/management/commands/online_income_cycle.py
          digest="$(sha256sum "$d/bundle.tar" | awk '{print $1}')"
          # Read-only remote capacity gate before any SSH mkdir, SCP or tar extraction.
          # The activation script independently checks the full SQLite snapshot reserve.
          ssh "${opts[@]}" githubops@178.239.147.150 python3 - <<'PREFLIGHT'
          import shutil
          from pathlib import Path
          base=Path.home()/"factory-runtime"
          free=shutil.disk_usage(base).free
          required=5*1024**3+128*1024**2
          if free < required:
              print("MASTER_REMOTE_PREFLIGHT_ENOSPC_BLOCKED")
              raise SystemExit(75)
          print("MASTER_REMOTE_PREFLIGHT_CAPACITY_OK")
          PREFLIGHT
          ssh "${opts[@]}" githubops@178.239.147.150 'install -d -m 700 "$HOME/factory-runtime/operations/master-activation-source"'
          scp "${opts[@]}" "$d/bundle.tar" githubops@178.239.147.150:/home/githubops/factory-runtime/operations/master-activation-source/bundle.tar
          ssh "${opts[@]}" githubops@178.239.147.150 bash -se -- "$digest" <<'REMOTE'
          set -euo pipefail
          umask 077
          expected="$1"
          stage="$HOME/factory-runtime/operations/master-activation-source"
          printf '%s  %s\n' "$expected" "$stage/bundle.tar" | sha256sum -c --status
          python3 - "$stage" <<'PY'
          import sys,tarfile
          from pathlib import Path
          root=Path(sys.argv[1])
          expected={"deploy/activate_vps_master_agent.sh","scripts/vps_master_evolution_cycle.py",
                    "core/autonomous_brain.py","core/economic_tool_pack.py","core/economic_master_agent.py",
                    "core/self_funding_policy.py","core/task_runtime.py",
                    "core/management/commands/seed_online_income_agents.py",
                    "core/management/commands/run_economic_worker.py",
                    "core/management/commands/economic_worker.py","core/worker_runner.py",
                    "core/management/commands/autonomous_master_loop.py",
                    "core/management/commands/online_income_cycle.py","core/recovery_scheduler.py",
                    "core/management/commands/recover_stale_tasks.py"}
          with tarfile.open(root/"bundle.tar","r:") as archive:
              members=archive.getmembers()
              assert {m.name for m in members}==expected
              assert all(m.isfile() and not m.issym() and not m.islnk() for m in members)
              for item in members:
                  target=root/item.name
                  target.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                  target.write_bytes(archive.extractfile(item).read())
                  target.chmod(0o700 if item.name.endswith(".sh") else 0o600)
          print("MASTER_DEPLOY_SOURCE_INTEGRITY_VERIFIED")
          PY
          rm -f "$stage/bundle.tar"
          bash "$stage/deploy/activate_vps_master_agent.sh"
          REMOTE
