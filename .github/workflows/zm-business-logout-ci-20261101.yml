name: Zomorod PHP accounting session logout regression

on:
  push:
    branches:
      - fix/zm-logout-post-csrf-20261101
    paths:
      - content/zomorod-business/app.php
      - tests/test_zm_business_logout_http.py
      - .github/workflows/zm-business-logout-ci-20261101.yml
  pull_request:
    paths:
      - content/zomorod-business/app.php
      - tests/test_zm_business_logout_http.py
      - .github/workflows/zm-business-logout-ci-20261101.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-session-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install local PHP SQLite test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3
      - name: PHP syntax validation
        run: php -l content/zomorod-business/app.php
      - name: Real PHP HTTP logout and CSRF regression
        run: python3 tests/test_zm_business_logout_http.py -v
