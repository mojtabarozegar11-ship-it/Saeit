      - 'tests/test_mpw_subsite_continuity_security_20261028.py'

permissions:
  contents: read

concurrency:
  group: mpw-no-email-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-guest-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact reviewed source without service credentials
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mpw_guest_no_email_release.py \
            scripts/mpw_guest_checkout_live_release.py \
            services/mpw_trx_guest_commerce.py \
            scripts/mpw_recovery_guarded_release_20261105.py \
            tests/test_mpw_guest_no_email_release.py \
            tests/test_mpw_product_host_route.py \
            core/product_seo_views.py \
            core/mojplaywin_catalog.py \
            core/mojplaywin_views.py \
            scripts/mpw_dynamic_store_cutover_20261108.py \
            tests/test_mpw_dynamic_store_cutover_20261108.py \
            tests/test_mpw_verified_catalog.py \
            scripts/mpw_owner_attested_sku_metadata_20261029.py \
            tests/test_mpw_owner_catalog_hash_reconciliation.py \
            tests/test_mpw_trx_settings_contract.py \
            core/mpw_trx_checkout_bridge.py \
            core/tests/test_mpw_trx_checkout_bridge.py \
            core/mpw_trx_invoice_bridge.py \
            core/tests/test_mpw_trx_invoice_bridge.py \
            core/mpw_trx_purchases_bridge.py \
            core/tests/test_mpw_trx_purchases_bridge.py \
            core/mpw_trx_invoice_routes.py \
            core/tests/test_mpw_trx_invoice_routes.py \
            config/urls.py \
            tests/test_mpw_onefile_release_gate.py \
            tests/test_mpw_recovery_guarded_release_20261105.py \
            tests/test_mpw_guest_telemetry_isolation_20261108.py \
            tests/test_mpw_email_recovery_20261105.py \
            scripts/mpw_three_sku_preflight_20261029.py \
            tests/test_mpw_three_sku_preflight_20261029.py \
            scripts/mpw_three_sku_public_form_evidence_20261112.py \
            tests/test_mpw_three_sku_public_form_evidence_20261112.py \
            scripts/mpw_live_invoice_source_audit_readonly_20261112.py \
            tests/test_mpw_live_invoice_source_audit_readonly_20261112.py \
            scripts/mpw_subsite_continuity_guard_20261026.py \
            tests/test_mpw_subsite_continuity_security_20261028.py
      - name: Run read-only offline guest and rollback unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.test_mpw_guest_no_email_release \
            tests.test_mpw_product_host_route \
            tests.test_mpw_verified_catalog \
            tests.test_mpw_owner_catalog_hash_reconciliation \
            tests.test_mpw_trx_settings_contract \
            tests.test_mpw_dynamic_store_cutover_20261108 \
            tests.test_mpw_onefile_release_gate \
            tests.test_mpw_guest_telemetry_isolation_20261108 \
            tests.test_mpw_recovery_guarded_release_20261105 \
            tests.test_mpw_three_sku_preflight_20261029 \
            tests.test_mpw_three_sku_public_form_evidence_20261112 \
            tests.test_mpw_live_invoice_source_audit_readonly_20261112 \
            tests.test_mpw_subsite_continuity_security_20261028
          python3 -B scripts/test_mpw_guest_first_order_identity.py
          python3 -B scripts/test_mpw_guest_route_patching.py
      - name: Confirm no production actions run
        run: |
          echo 'MPW_NO_EMAIL_QA=PASS;LIVE_DEPLOY=NO;EMAIL_SENT=NO;INVOICE_CREATED=NO'
