name: MPW guest checkout without email - isolated QA

on:
  push:
    branches:
      - feature/mpw-recovery-01-20261105
    paths:
      - '.github/workflows/mpw-no-email-guest-checkout-qa-20261112.yml'
      - 'services/mpw_trx_guest_commerce.py'
      - 'scripts/mpw_guest_no_email_release.py'
      - 'scripts/mpw_guest_checkout_live_release.py'
      - 'tests/test_mpw_guest_no_email_release.py'
      - 'tests/test_mpw_onefile_release_gate.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mpw-no-email-guest-checkout-qa-20261112.yml'
      - 'services/mpw_trx_guest_commerce.py'
      - 'scripts/mpw_guest_no_email_release.py'
      - 'scripts/mpw_guest_checkout_live_release.py'
      - 'tests/test_mpw_guest_no_email_release.py'
      - 'tests/test_mpw_onefile_release_gate.py'

permissions:
  contents: read

concurrency:
  group: mpw-no-email-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-guest-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact reviewed source without service credentials
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mpw_guest_no_email_release.py \
            scripts/mpw_guest_checkout_live_release.py \
            services/mpw_trx_guest_commerce.py \
            tests/test_mpw_guest_no_email_release.py \
            tests/test_mpw_onefile_release_gate.py
      - name: Run read-only offline guest and rollback unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.test_mpw_guest_no_email_release \
            tests.test_mpw_onefile_release_gate
      - name: Confirm no production actions run
        run: |
          echo 'MPW_NO_EMAIL_QA=PASS;LIVE_DEPLOY=NO;EMAIL_SENT=NO;INVOICE_CREATED=NO'
