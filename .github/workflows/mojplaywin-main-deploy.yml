name: Deploy MojPlayWin main site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-main-deploy.yml"
      - "scripts/deploy_mojplaywin_branding.py"
      - "config/urls.py"
      - "core/services_views.py"
      - "core/commerce_views.py"
      - "core/views.py"
      - "core/mojplaywin_views.py"
      - "core/templates/base.html"
      - "core/templates/mojplaywin/**"
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-production
  cancel-in-progress: false
jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source and pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile config/urls.py core/services_views.py core/commerce_views.py core/views.py core/mojplaywin_views.py scripts/deploy_mojplaywin_branding.py
          python3 - <<'PY'
          from pathlib import Path
          required = {
              "core/templates/mojplaywin/home.html": ("Ideas become knowledge", "OUR PORTFOLIO", "CONNECTED VENTURES"),
              "core/templates/mojplaywin/store.html": ("INITIAL COLLECTION", "{{ product.title }}"),
              "core/templates/mojplaywin/section.html": ("{{ section_title }}", "mw-page-hero"),
              "core/templates/mojplaywin/theme.html": ("mw-site-nav", "mw-gold"),
          }
          for name, markers in required.items():
              source = Path(name).read_text(encoding="utf-8")
              missing = [marker for marker in markers if marker not in source]
              if missing:
                  raise SystemExit(f"{name} missing markers: {missing}")
          print("MOJPLAYWIN_SOURCE_CHECK=passed")
          PY
      - name: Configure pinned VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY_READY"
      - name: Roll back a prior MojPlayWin smoke failure
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          stage="/home/zomorod2/.mojplaywin-rollback-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat scripts/deploy_mojplaywin_branding.py | ssh -F "$d/config" saeit-cpanel "cat > '$stage/rollback.py'"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/rollback.py' rollback '38827723099' restore"
          ssh -F "$d/config" saeit-cpanel "rm -rf -- '$stage'"
      - name: Restore previous MojPlayWin live site
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38831290396')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          stage="/home/zomorod2/.mojplaywin-rollback-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat scripts/deploy_mojplaywin_branding.py | ssh -F "$d/config" saeit-cpanel "cat > '$stage/rollback.py'"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/rollback.py' rollback '38831290396' restore"
          ssh -F "$d/config" saeit-cpanel "rm -rf -- '$stage'"
          python3 - <<'PY'
          import re, time, urllib.error, urllib.request
          routes = ["https://mojplaywin.com/", "https://mojplaywin.com/store/"]
          for url in routes:
              for attempt in range(1, 11):
                  request = urllib.request.Request(url + "?__restore_check=" + str(attempt), headers={"Cache-Control":"no-cache"})
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          status, body = response.status, response.read(300000).decode("utf-8", "replace")
                  except urllib.error.HTTPError as error:
                      status, body = error.code, error.read(300000).decode("utf-8", "replace")
                  title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
                  restored = status == 200 and "Ideas become knowledge" not in body and "INITIAL COLLECTION" not in body
                  print(f"RESTORE_VERIFY url={url} status={status} title={(title.group(1).strip()[:140] if title else 'none')} old_site={restored} attempt={attempt}")
                  if restored:
                      break
                  if attempt < 10:
                      time.sleep(2)
              else:
                  raise SystemExit(f"Restored site check failed: {url}")
          PY
      - name: Read the restored legacy MojPlayWin source
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_READ_LEGACY_20261016')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          ssh -F "$d/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          from pathlib import Path
          root = Path("/home/zomorod2/Saeit-staging")
          candidates = []
          for path in root.rglob("*"):
              if not path.is_file() or path.is_symlink() or path.suffix.lower() not in {".py", ".html", ".css", ".js"}:
                  continue
              if any(part in {".git", "node_modules", "__pycache__", "venv", ".venv"} for part in path.parts):
                  continue
              try:
                  source = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              if any(token.lower() in source.lower() for token in ("Virtual Products, Games & Digital Innovation", "mojplaywin", "INITIAL COLLECTION")):
                  candidates.append((path, source))
          candidates.sort(key=lambda item: (0 if item[0].suffix == ".py" else 1, len(item[1]), str(item[0])))
          print(f"LEGACY_SOURCE_CANDIDATE_COUNT={len(candidates)}")
          for path, source in candidates[:24]:
              relative = path.relative_to(root)
              print(f"LEGACY_SOURCE_FILE_BEGIN {relative} chars={len(source)}")
              print(source[:18000])
              print(f"LEGACY_SOURCE_FILE_END {relative}")
          PY
      - name: Diagnose MojPlayWin public routes
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016')
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.error
          import urllib.request
          routes = [
              ("https://mojplaywin.com/", "Ideas become knowledge"),
              ("https://mojplaywin.com/store/", "INITIAL COLLECTION"),
              ("https://mojplaywin.com/agriculture/", "Agriculture"),
          ]
          for url, marker in routes:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      status, body = response.status, response.read(400000).decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  status, body = error.code, error.read(400000).decode("utf-8", "replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
              visible = re.sub(r"<(script|style)\\b[^>]*>.*?</\\1>", " ", body, flags=re.I | re.S)
              headings = re.findall(r"<h[1-3]\\b[^>]*>(.*?)</h[1-3]>", visible, re.I | re.S)
              plain = re.sub(r"<[^>]+>", " ", visible)
              plain = re.sub(r"\\s+", " ", plain).strip()
              print(f"PUBLIC_DIAG url={url} status={status} expected={marker in body} title={title.group(1)[:160] if title else 'none'}")
              print(f"PUBLIC_DIAG_HEADINGS {[re.sub(r'<[^>]+>', ' ', h).strip()[:100] for h in headings[:8]]}")
              print(f"PUBLIC_DIAG_TEXT {plain[:500]}")
          PY
      - name: Read recent MojPlayWin application errors
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          ssh -F "$d/config" saeit-cpanel 'uapi --output=json PassengerApps list_applications' | python3 -c 'import json,sys; data=json.load(sys.stdin); stack=[data]; keys=("domain","base_uri","path","app_root","app_uri","enabled","app_type"); found=0
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  if str(value.get("domain","")).lower() in {"mojplaywin.com","www.mojplaywin.com"}:
                      print("PASSENGER_MOJPLAYWIN_MAPPING="+json.dumps({key:value.get(key) for key in keys if key in value},ensure_ascii=False)); found+=1
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          print("PASSENGER_MOJPLAYWIN_MAPPING=not-found" if not found else "PASSENGER_MOJPLAYWIN_MAPPING_COUNT="+str(found))'
          ssh -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          for filename in ("/home/zomorod2/mojplaywin.com/passenger_wsgi.py", "/home/zomorod2/mojplaywin.com/.htaccess"):
              path = Path(filename)
              if not path.is_file() or path.is_symlink():
                  print(f"ROUTING_FILE {filename}=missing")
                  continue
              print(f"ROUTING_FILE {filename}")
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  if filename.endswith("passenger_wsgi.py") and not any(secret in line.lower() for secret in ("secret", "password", "api_key")):
                      print(line[:500])
                  elif any(word in line.lower() for word in ("passenger", "rewrite", "sys.path", "django_settings_module", "application", "app =", "sait-staging", "saeit-staging")) and not any(secret in line.lower() for secret in ("secret", "password", "api_key")):
                      print(line[:500])
          import re
          roots = [Path("/home/zomorod2/logs"), Path("/home/zomorod2/mojplaywin.com"), Path("/home/zomorod2/Saeit-staging")]
          names = {"error_log", "passenger.log", "stderr.log", "application.log"}
          seen = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.rglob("*"):
                  if seen >= 8:
                      break
                  if path.is_file() and path.name in names and not path.is_symlink():
                      try:
                          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()[-160:]
                      except OSError:
                          continue
                      relevant = [line[:500] for line in lines if re.search(r"Traceback|Exception|Error|error|Internal Server|TemplateDoesNotExist|SyntaxError|ImportError|mojplaywin", line, re.I)]
                      print(f"SERVER_LOG path={path} matching_lines={len(relevant)}")
                      for line in relevant[-60:]:
                          print(line)
                      seen += 1
          if not seen:
              print("SERVER_LOG no matching known log files")
          PY
      - name: Inspect live MojPlayWin route mappings
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          ssh -F "$d/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import runpy
          from pathlib import Path
          runpy.run_path("/home/zomorod2/mojplaywin.com/passenger_wsgi.py")
          from django.urls import resolve
          for url in ("/", "/store/", "/agriculture/", "/ventures/agriculture/", "/ventures/cafe-restaurant/", "/ventures/currency-crypto/"):
              try:
                  route = resolve(url)
                  print(f"LIVE_ROUTE {url}={route.func.__module__}.{route.func.__name__}")
              except Exception as exc:
                  print(f"LIVE_ROUTE {url}=ERROR:{type(exc).__name__}")
          path = Path("/home/zomorod2/Saeit-staging/config/urls.py")
          if path.is_file() and not path.is_symlink():
              for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  if any(token in line for token in ("branded_", 'path("store/', 'path("agriculture/', 'path("ventures/')):
                      print(f"LIVE_URLS_LINE {number}: {line[:300]}")
          PY
      - name: Package application changes with merge baselines
        if: ${{ !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38831290396') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_READ_LEGACY_20261016') }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="4087c9be367a443f9252c12348cdd65b624a51c7"
          baseline_ref="6abd8817b24e6484c880ce4f596027618775487d"
          source_root="$RUNNER_TEMP/mojplaywin-main"
          mkdir -p "$source_root/deploy_baseline"
          files=(scripts/deploy_mojplaywin_branding.py config/urls.py core/services_views.py core/commerce_views.py core/views.py core/mojplaywin_views.py core/templates/base.html core/templates/mojplaywin/home.html core/templates/mojplaywin/store.html core/templates/mojplaywin/section.html core/templates/mojplaywin/theme.html)
          merged=(config/urls.py core/services_views.py core/commerce_views.py core/views.py core/templates/base.html)
          for file in "${files[@]}"; do
            mkdir -p "$source_root/$(dirname "$file")"
            if [[ "$file" == "scripts/deploy_mojplaywin_branding.py" || "$file" == "core/mojplaywin_views.py" ]]; then
              git show "$GITHUB_SHA:$file" > "$source_root/$file"
            else
              git show "$source_ref:$file" > "$source_root/$file"
            fi
          done
          for file in "${merged[@]}"; do
            mkdir -p "$source_root/deploy_baseline/$(dirname "$file")"
            git show "$baseline_ref:$file" > "$source_root/deploy_baseline/$file"
          done
          python3 -m py_compile "$source_root/scripts/deploy_mojplaywin_branding.py" "$source_root/config/urls.py" "$source_root/core/services_views.py" "$source_root/core/commerce_views.py" "$source_root/core/views.py" "$source_root/core/mojplaywin_views.py"
          python3 - "$source_root" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          sys.path.insert(0, str(root / "scripts"))
          from deploy_mojplaywin_branding import apply_three_way
          for relative in ("config/urls.py", "core/services_views.py", "core/commerce_views.py", "core/views.py", "core/templates/base.html"):
              baseline = (root / "deploy_baseline" / relative).read_text(encoding="utf-8")
              desired = (root / relative).read_text(encoding="utf-8")
              assert apply_three_way(baseline, desired, baseline, relative) == desired, relative
          print("MOJPLAYWIN_SAFE_MERGE_CHECK=passed")
          PY
          tar -czf "$RUNNER_TEMP/mojplaywin-main.tar.gz" -C "$source_root" scripts/deploy_mojplaywin_branding.py config/urls.py core/services_views.py core/commerce_views.py core/views.py core/mojplaywin_views.py core/templates/base.html core/templates/mojplaywin/home.html core/templates/mojplaywin/store.html core/templates/mojplaywin/section.html core/templates/mojplaywin/theme.html deploy_baseline
      - name: Stage and install on the verified cPanel app
        if: ${{ !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38831290396') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_READ_LEGACY_20261016') }}
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          stage="/home/zomorod2/.mojplaywin-main-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat "$RUNNER_TEMP/mojplaywin-main.tar.gz" | ssh -F "$d/config" saeit-cpanel "cat > '$stage/source.tar.gz'"
          ssh -F "$d/config" saeit-cpanel "python3 - '$stage/source.tar.gz' '$stage' <<'PY'
          import sys, tarfile
          from pathlib import PurePosixPath
          archive, destination = sys.argv[1:]
          allowed = {
              'scripts/deploy_mojplaywin_branding.py','config/urls.py','core/services_views.py',
              'core/commerce_views.py','core/views.py','core/mojplaywin_views.py',
              'core/templates/base.html','core/templates/mojplaywin/home.html',
              'core/templates/mojplaywin/store.html','core/templates/mojplaywin/section.html',
              'core/templates/mojplaywin/theme.html',
              'deploy_baseline/config/urls.py','deploy_baseline/core/services_views.py',
              'deploy_baseline/core/commerce_views.py','deploy_baseline/core/views.py',
              'deploy_baseline/core/templates/base.html'
          }
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              files = {m.name for m in members if m.isfile()}
              if files != allowed or any(m.issym() or m.islnk() or PurePosixPath(m.name).is_absolute() or '..' in PurePosixPath(m.name).parts for m in members):
                  raise SystemExit('Unsafe or incomplete MojPlayWin archive')
              bundle.extractall(destination)
          PY
          python3 '$stage/scripts/deploy_mojplaywin_branding.py' deploy '$GITHUB_RUN_ID' '$GITHUB_SHA' '$stage'"
      - name: Smoke-test MojPlayWin pages
        if: ${{ !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38831290396') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_READ_LEGACY_20261016') }}
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"; marker="$2"; file="$RUNNER_TEMP/mojplaywin-smoke.html"; headers="$RUNNER_TEMP/mojplaywin-smoke.headers"
            request_url="$url?__mojplaywin_release=$GITHUB_RUN_ID"
            status=""
            for attempt in $(seq 1 10); do
              status="$(curl --silent --show-error --location --max-redirs 4 --connect-timeout 10 --max-time 35 -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -D "$headers" -o "$file" -w '%{http_code}' "$request_url")"
              if test "$status" = 200 && grep -Fq "$marker" "$file"; then
                echo "LIVE_ROUTE_OK $url attempt=$attempt"
                return 0
              fi
              if test "$attempt" -lt 10; then sleep 2; fi
            done
            if test "$status" != 200 || ! grep -Fq "$marker" "$file"; then
              python3 - "$url" "$status" "$marker" "$file" <<'PY'
          import re, sys
          url, status, marker, path = sys.argv[1:]
          body = open(path, encoding="utf-8", errors="replace").read()
          title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
          visible = re.sub(r"<(script|style)\\b[^>]*>.*?</\\1>", " ", body, flags=re.I | re.S)
          headings = re.findall(r"<h[1-3]\\b[^>]*>(.*?)</h[1-3]>", visible, re.I | re.S)
          plain = re.sub(r"<[^>]+>", " ", visible)
          plain = re.sub(r"\\s+", " ", plain).strip()
          print(f"SMOKE_DIAG url={url} status={status} expected={marker in body} title={title.group(1)[:160] if title else 'none'}")
          print(f"SMOKE_DIAG_HEADINGS {[re.sub(r'<[^>]+>', ' ', h).strip()[:100] for h in headings[:8]]}")
          print(f"SMOKE_DIAG_TEXT {plain[:500]}")
          PY
              grep -iE '^(HTTP/|age:|cache-control:|cf-cache-status:|x-cache:)' "$headers" | tail -8 || true
              exit 1
            fi
          }
          check https://mojplaywin.com/ "Ideas become knowledge"
          check https://mojplaywin.com/store/ "INITIAL COLLECTION"
          check https://mojplaywin.com/agriculture/ "Agriculture"
          check https://mojplaywin.com/ventures/cafe-restaurant/ "Cafes"
          check https://mojplaywin.com/ventures/currency-crypto/ "Currency"
          check https://mojplaywin.com/ventures/ecommerce/ "E-commerce"
      - name: Inspect installed source before rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          ssh -F "$d/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import hashlib, runpy, sys
          from pathlib import Path
          app = Path("/home/zomorod2/Saeit-staging")
          checks = {
              "config/urls.py": ("services", "mojplaywin_views"),
              "core/services_views.py": ("mojplaywin.com", "return home(request)"),
              "core/mojplaywin_views.py": ("def home(request)", "mojplaywin/home.html"),
              "core/templates/mojplaywin/home.html": ("Ideas become knowledge", "OUR PORTFOLIO"),
          }
          for name, markers in checks.items():
              path = app / name
              if not path.is_file() or path.is_symlink():
                  print(f"INSTALLED_FILE {name} present=False")
                  continue
              content = path.read_bytes()
              text = content.decode("utf-8", "replace")
              print(f"INSTALLED_FILE {name} sha256={hashlib.sha256(content).hexdigest()} markers={[marker in text for marker in markers]}")
          try:
              namespace = runpy.run_path("/home/zomorod2/mojplaywin.com/passenger_wsgi.py")
              app_obj = namespace.get("application")
