name: Deploy MojPlayWin main site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-main-deploy.yml"
      - "scripts/deploy_mojplaywin_branding.py"
      - "config/urls.py"
      - "core/services_views.py"
      - "core/commerce_views.py"
      - "core/views.py"
      - "core/mojplaywin_views.py"
      - "core/templates/base.html"
      - "core/templates/mojplaywin/**"
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-production
  cancel-in-progress: false
jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source and pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile config/urls.py core/services_views.py core/commerce_views.py core/views.py core/mojplaywin_views.py scripts/deploy_mojplaywin_branding.py
          python3 - <<'PY'
          from pathlib import Path
          required = {
              "core/templates/mojplaywin/home.html": ("Ideas become knowledge", "OUR PORTFOLIO", "CONNECTED VENTURES"),
              "core/templates/mojplaywin/store.html": ("INITIAL COLLECTION", "{{ product.title }}"),
              "core/templates/mojplaywin/section.html": ("{{ section_title }}", "mw-page-hero"),
              "core/templates/mojplaywin/theme.html": ("mw-site-nav", "mw-gold"),
          }
          for name, markers in required.items():
              source = Path(name).read_text(encoding="utf-8")
              missing = [marker for marker in markers if marker not in source]
              if missing:
                  raise SystemExit(f"{name} missing markers: {missing}")
          print("MOJPLAYWIN_SOURCE_CHECK=passed")
          PY
      - name: Configure pinned VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY_READY"
      - name: Roll back a prior MojPlayWin smoke failure
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          stage="/home/zomorod2/.mojplaywin-rollback-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat scripts/deploy_mojplaywin_branding.py | ssh -F "$d/config" saeit-cpanel "cat > '$stage/rollback.py'"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/rollback.py' rollback '38827723099' restore"
          ssh -F "$d/config" saeit-cpanel "rm -rf -- '$stage'"
      - name: Diagnose MojPlayWin public routes
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016')
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.error
          import urllib.request
          routes = [
              ("https://mojplaywin.com/", "Ideas become knowledge"),
              ("https://mojplaywin.com/store/", "INITIAL COLLECTION"),
              ("https://mojplaywin.com/agriculture/", "Agriculture"),
          ]
          for url, marker in routes:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      status, body = response.status, response.read(400000).decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  status, body = error.code, error.read(400000).decode("utf-8", "replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
              visible = re.sub(r"<(script|style)\\b[^>]*>.*?</\\1>", " ", body, flags=re.I | re.S)
              headings = re.findall(r"<h[1-3]\\b[^>]*>(.*?)</h[1-3]>", visible, re.I | re.S)
              plain = re.sub(r"<[^>]+>", " ", visible)
              plain = re.sub(r"\\s+", " ", plain).strip()
              print(f"PUBLIC_DIAG url={url} status={status} expected={marker in body} title={title.group(1)[:160] if title else 'none'}")
              print(f"PUBLIC_DIAG_HEADINGS {[re.sub(r'<[^>]+>', ' ', h).strip()[:100] for h in headings[:8]]}")
              print(f"PUBLIC_DIAG_TEXT {plain[:500]}")
          PY
      - name: Read recent MojPlayWin application errors
        if: contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016')
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          ssh -F "$d/config" saeit-cpanel 'python3 - <<'"'PY'"'
          from pathlib import Path
          import re
          roots = [Path("/home/zomorod2/logs"), Path("/home/zomorod2/mojplaywin.com"), Path("/home/zomorod2/Saeit-staging")]
          names = {"error_log", "passenger.log", "stderr.log", "application.log"}
          seen = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.rglob("*"):
                  if seen >= 8:
                      break
                  if path.is_file() and path.name in names and not path.is_symlink():
                      try:
                          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()[-160:]
                      except OSError:
                          continue
                      relevant = [line[:500] for line in lines if re.search(r"Traceback|Exception|Error|error|Internal Server|TemplateDoesNotExist|SyntaxError|ImportError|mojplaywin", line, re.I)]
                      print(f"SERVER_LOG path={path} matching_lines={len(relevant)}")
                      for line in relevant[-60:]:
                          print(line)
                      seen += 1
          if not seen:
              print("SERVER_LOG no matching known log files")
          PY'
      - name: Package application changes with merge baselines
        if: ${{ !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016') }}
        shell: bash
        run: |
          set -euo pipefail
          base="6abd8817b24e6484c880ce4f596027618775487d"
          mkdir -p "$RUNNER_TEMP/mojplaywin-main/deploy_baseline"
          files=(config/urls.py core/services_views.py core/commerce_views.py core/views.py core/templates/base.html)
          for file in "${files[@]}"; do
            mkdir -p "$RUNNER_TEMP/mojplaywin-main/deploy_baseline/$(dirname "$file")"
            git show "$base:$file" > "$RUNNER_TEMP/mojplaywin-main/deploy_baseline/$file"
          done
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from deploy_mojplaywin_branding import apply_three_way
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "mojplaywin-main"
          for relative in ("config/urls.py", "core/services_views.py", "core/commerce_views.py", "core/views.py", "core/templates/base.html"):
              baseline = (root / "deploy_baseline" / relative).read_text(encoding="utf-8")
              desired = Path(relative).read_text(encoding="utf-8")
              assert apply_three_way(baseline, desired, baseline, relative) == desired, relative
          print("MOJPLAYWIN_SAFE_MERGE_CHECK=passed")
          PY
          tar -czf "$RUNNER_TEMP/mojplaywin-main.tar.gz" scripts/deploy_mojplaywin_branding.py config/urls.py core/services_views.py core/commerce_views.py core/views.py core/mojplaywin_views.py core/templates/base.html core/templates/mojplaywin/home.html core/templates/mojplaywin/store.html core/templates/mojplaywin/section.html core/templates/mojplaywin/theme.html -C "$RUNNER_TEMP/mojplaywin-main" deploy_baseline
      - name: Stage and install on the verified cPanel app
        if: ${{ !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016') }}
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          stage="/home/zomorod2/.mojplaywin-main-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat "$RUNNER_TEMP/mojplaywin-main.tar.gz" | ssh -F "$d/config" saeit-cpanel "cat > '$stage/source.tar.gz'"
          ssh -F "$d/config" saeit-cpanel "python3 - '$stage/source.tar.gz' '$stage' <<'PY'
          import sys, tarfile
          from pathlib import PurePosixPath
          archive, destination = sys.argv[1:]
          allowed = {
              'scripts/deploy_mojplaywin_branding.py','config/urls.py','core/services_views.py',
              'core/commerce_views.py','core/views.py','core/mojplaywin_views.py',
              'core/templates/base.html','core/templates/mojplaywin/home.html',
              'core/templates/mojplaywin/store.html','core/templates/mojplaywin/section.html',
              'core/templates/mojplaywin/theme.html',
              'deploy_baseline/config/urls.py','deploy_baseline/core/services_views.py',
              'deploy_baseline/core/commerce_views.py','deploy_baseline/core/views.py',
              'deploy_baseline/core/templates/base.html'
          }
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              files = {m.name for m in members if m.isfile()}
              if files != allowed or any(m.issym() or m.islnk() or PurePosixPath(m.name).is_absolute() or '..' in PurePosixPath(m.name).parts for m in members):
                  raise SystemExit('Unsafe or incomplete MojPlayWin archive')
              bundle.extractall(destination)
          PY
          python3 '$stage/scripts/deploy_mojplaywin_branding.py' deploy '$GITHUB_RUN_ID' '$GITHUB_SHA' '$stage'"
      - name: Smoke-test MojPlayWin pages
        if: ${{ !contains(github.event.head_commit.message, 'MOJPLAYWIN_ROLLBACK_38827723099') && !contains(github.event.head_commit.message, 'MOJPLAYWIN_DIAG_20261016') }}
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"; marker="$2"; file="$RUNNER_TEMP/mojplaywin-smoke.html"
            status="$(curl --silent --show-error --location --max-redirs 4 --connect-timeout 10 --max-time 35 -o "$file" -w '%{http_code}' "$url")"
            if test "$status" != 200 || ! grep -Fq "$marker" "$file"; then
              python3 - "$url" "$status" "$marker" "$file" <<'PY'
          import re, sys
          url, status, marker, path = sys.argv[1:]
          body = open(path, encoding="utf-8", errors="replace").read()
          title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
          visible = re.sub(r"<(script|style)\\b[^>]*>.*?</\\1>", " ", body, flags=re.I | re.S)
          headings = re.findall(r"<h[1-3]\\b[^>]*>(.*?)</h[1-3]>", visible, re.I | re.S)
          plain = re.sub(r"<[^>]+>", " ", visible)
          plain = re.sub(r"\\s+", " ", plain).strip()
          print(f"SMOKE_DIAG url={url} status={status} expected={marker in body} title={title.group(1)[:160] if title else 'none'}")
          print(f"SMOKE_DIAG_HEADINGS {[re.sub(r'<[^>]+>', ' ', h).strip()[:100] for h in headings[:8]]}")
          print(f"SMOKE_DIAG_TEXT {plain[:500]}")
          PY
              exit 1
            fi
            echo "LIVE_ROUTE_OK $url"
          }
          check https://mojplaywin.com/ "Ideas become knowledge"
          check https://mojplaywin.com/store/ "INITIAL COLLECTION"
          check https://mojplaywin.com/agriculture/ "Agriculture"
          check https://mojplaywin.com/ventures/cafe-restaurant/ "Cafes"
          check https://mojplaywin.com/ventures/currency-crypto/ "Currency"
          check https://mojplaywin.com/ventures/ecommerce/ "E-commerce"
      - name: Roll back if smoke checks fail
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          ssh -F "$d/config" saeit-cpanel "python3 /home/zomorod2/.mojplaywin-main-$GITHUB_RUN_ID/scripts/deploy_mojplaywin_branding.py rollback '$GITHUB_RUN_ID' restore"
      - name: Remove temporary files and keys
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mojplaywin-main-ssh"
          if test -f "$d/config"; then ssh -F "$d/config" -o ConnectTimeout=10 saeit-cpanel "rm -rf -- /home/zomorod2/.mojplaywin-main-$GITHUB_RUN_ID" || true; fi
          rm -rf -- "$d" "$RUNNER_TEMP/mojplaywin-main.tar.gz" "$RUNNER_TEMP/mojplaywin-main" "$RUNNER_TEMP/mojplaywin-smoke.html"

# Recovery marker for failed smoke run 38827723099
