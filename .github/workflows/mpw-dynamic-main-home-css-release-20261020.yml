name: MojPlayWin native homepage theme for all main dynamic public routes
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-dynamic-main-home-css-release-20261020.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-php-home-css-public-only
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify PHP source-patch is safely bounded
        run: |
          python3 -m py_compile scripts/mpw_live_dynamic_home_css_20261020.py
          python3 scripts/mpw_live_dynamic_home_css_20261020.py selftest
      - name: Baseline business root and independent child routes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json
          paths=('/','/store/','/games/','/ai/','/research/','/services/','/contact/','/accounts/login/','/farnaz/','/saman/','/taniya/','/picm/')
          results={}
          for p in paths:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+p,timeout=18) as r:results[p]=r.status
              except urllib.error.HTTPError as e:results[p]=e.code
          if any(x!=200 for x in results.values()):raise RuntimeError('A protected main route failed before changes: '+str(results))
          open(os.environ['RUNNER_TEMP']+'/mpw-php-before.json','w').write(json.dumps(results))
          print('MPW_DYNAMIC_THEME_PRIOR_STATUS='+json.dumps(results))
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Atomic root-only PHP GET shell CSS insertion and lint
        id: publish
        run: timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_live_dynamic_home_css_20261020.py
      - name: Verify real live shared homepage CSS on all sampled dynamic public pages
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,time,json
          origin='https://mojplaywin.com'
          dynamic=('/store/','/games/','/ai/','/research/','/services/','/contact/')
          for path in dynamic:
              verified=False
              for trial in range(8):
                  req=urllib.request.Request(origin+path+'?mpw_css_version='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=19) as r:
                      body=r.read(1200000).decode('utf8','replace')
                      verified=(r.status==200 and '/mpw-editorial/revenue/assets/home-shared-v1.css' in body and 'mw-site-nav' in body and 'Mojtaba Roozegar' in body)
                  if verified:break
                  time.sleep(2)
              if not verified:raise RuntimeError('New unified CSS not live on '+path)
              print('MPW_DYNAMIC_HOMEPAGE_TEMPLATE_LIVE='+path)
          original=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-php-before.json'))
          for path,status in original.items():
              try:
                  with urllib.request.urlopen(origin+path,timeout=20) as r:now=r.status
              except urllib.error.HTTPError as e:now=e.code
              if now!=status:raise RuntimeError('Protected route changed '+path)
          print('MPW_DYNAMIC_MAIN_NATIVE_HOMEPAGE_CSS_AND_SIBLINGS=PASS')
          PY
      - name: Rollback one exact PHP file if smoke test fails
        if: failure() && steps.publish.outcome == 'success'
        run: timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_live_dynamic_home_css_20261020.py
      - name: Destroy session SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
