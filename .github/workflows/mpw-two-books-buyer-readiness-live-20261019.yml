name: MojPlayWin isolated two-book buyer details and commerce proof 2026-10-19
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-two-books-buyer-readiness-live-20261019.yml"]
permissions: {contents: read}
concurrency:
  group: mojplaywin-only-two-book-buyer-readiness-20261019
  cancel-in-progress: false
jobs:
  install_and_audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test source, reversible mutation and no checkout exposure
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_two_books_buyer_readiness_20261019.py
          python3 scripts/mpw_two_books_buyer_readiness_20261019.py selftest
      - name: Record main-store and protected subsite baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import json,os
          base="https://mojplaywin.com"
          states={}
          for path in ("/","/store/","/taniya/","/farnaz/","/saman/","/picm/","/zahra/"):
              req=Request(base+path,headers={"Cache-Control":"no-cache","User-Agent":"MPWBookReadinessPreflight/1.0"})
              try:
                  with urlopen(req,timeout=18) as r:states[path]=r.status
              except HTTPError as e:states[path]=e.code
          for p in ("/","/store/","/taniya/","/farnaz/","/saman/","/picm/"):
              if states[p]!=200:raise RuntimeError("Protected baseline unhealthy "+p)
          with open(os.environ["RUNNER_TEMP"]+"/book-readiness-baseline.json","w") as out:json.dump(states,out)
          print("MPW_BOOK_READINESS_BASELINE="+json.dumps(states))
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Install buyer information in original live store template only
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - publish '$GITHUB_RUN_ID'" < scripts/mpw_two_books_buyer_readiness_20261019.py
      - name: Recheck exact buyer details and protected child domains
        id: smoke
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import json,os,time
          base="https://mojplaywin.com"
          confirmed=False
          for attempt in range(5):
              req=Request(base+"/store/?book_buyer_readiness="+os.environ["GITHUB_RUN_ID"]+"-"+str(attempt),
                headers={"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"MPWBuyerReadinessSmoke/1.0"})
              with urlopen(req,timeout=24) as r: html=r.read(950000).decode("utf8","replace")
              confirmed=all(html.count(s)==1 for s in ('id="mpw-sale-book72"','id="mpw-sale-book225"','id="mpw-book-buyer-details"'))
              confirmed=confirmed and 'Payment is not open for these books yet.' in html and 'US $7.50' in html and 'US $4.00' in html
              if confirmed:break
              time.sleep(3)
          if not confirmed:raise RuntimeError("Live store buyer details not confirmed")
          with open(os.environ["RUNNER_TEMP"]+"/book-readiness-baseline.json") as inp: before=json.load(inp)
          after={}
          for path in before:
              req=Request(base+path,headers={"Cache-Control":"no-cache","User-Agent":"MPWBookReadinessSmoke/1.0"})
              try:
                  with urlopen(req,timeout=18) as r:after[path]=r.status
              except HTTPError as e:after[path]=e.code
          if before!=after:raise RuntimeError("A protected subsite response changed")
          print("MPW_TWO_BOOK_BUYER_DETAILS_LIVE=VERIFIED;PAYMENT_ACTIVATED=NO")
          PY
      - name: Read commerce readiness and payment gate status without writes
        id: audit
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - audit" < scripts/mpw_two_books_buyer_readiness_20261019.py
      - name: Restore original store template if any postinstall verification fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" < scripts/mpw_two_books_buyer_readiness_20261019.py
