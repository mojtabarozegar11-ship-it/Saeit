name: One-time VPS virtual block device versus filesystem capacity check
on:
  push:
    branches: [ops/factory-verify-upgraded-disk-readonly-20261029]
    paths: [.github/workflows/factory-vps-guest-disk-geometry-once-20261029.yml]
permissions: {contents: read}
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check actual VPS disk devices and mounted filesystem without modification
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/guest-readonly"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'set -eu; test "$(id -un)" = githubops; date -u "+OBSERVED_UTC=%Y-%m-%dT%H:%M:%SZ"; echo DEVICE_GEOMETRY_START; lsblk -b -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINT; echo DEVICE_GEOMETRY_END; findmnt -no SOURCE,FSTYPE,TARGET /; df -B1 -P /home/githubops/factory-runtime; awk "/MemTotal:/ {print \"MEM_TOTAL_KIB=\" \$2}" /proc/meminfo; echo CPU_CORES="$(nproc)"; echo READ_ONLY_GEOMETRY=PASS'
