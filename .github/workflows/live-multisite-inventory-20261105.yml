name: Read-only inventory of live sites and subsites
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - .github/workflows/live-multisite-inventory-20261105.yml
      - scripts/live_multisite_deep_diagnostics_20261105.py
      - scripts/live_primary_django_factory_diagnostic_20261105.py
permissions:
  contents: read
concurrency:
  group: live-multisite-audit-20261105
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check audit scripts locally
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_multisite_inventory_20261105.py scripts/live_multisite_http_audit_20261105.py scripts/live_primary_django_factory_diagnostic_20261105.py
      - name: Pinned read-only private relay to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/live-multisite-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -d /home/zomorod2/public_html' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
              break
            fi
            echo "RELAY_UNAVAILABLE_ATTEMPT=$attempt"
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -d /home/zomorod2/public_html' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_PINNED_DIRECT_FALLBACK'
            else
              echo 'NO_AUTHENTICATED_CPANEL_CHANNEL'
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Read cPanel domain and webroot inventory without changes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 110s ssh -T -F "$RUNNER_TEMP/live-multisite-ssh/config" "$COMMAND_HOST" 'python3 -' < scripts/live_multisite_inventory_20261105.py | tee "$RUNNER_TEMP/live-multisite-cpanel.jsonl"
      - name: Diagnose newsletter 500 and public subdomain roots without changes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 100s ssh -T -F "$RUNNER_TEMP/live-multisite-ssh/config" "$COMMAND_HOST" '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' < scripts/live_multisite_deep_diagnostics_20261105.py
      - name: Probe actual primary Zomorod Django runtime without changes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 90s ssh -T -F "$RUNNER_TEMP/live-multisite-ssh/config" "$COMMAND_HOST" 'if test -x /home/zomorod2/virtualenv/Saeit/3.11/bin/python; then exec /home/zomorod2/virtualenv/Saeit/3.11/bin/python -; else exec python3 -; fi' < scripts/live_primary_django_factory_diagnostic_20261105.py
      - name: Check primary application compatibility with existing staging Python interpreter
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 90s ssh -T -F "$RUNNER_TEMP/live-multisite-ssh/config" "$COMMAND_HOST" 'PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' < scripts/live_primary_django_factory_diagnostic_20261105.py
      - name: Audit public sites, subsites, and critical routes by HTTPS GET
        run: |
          set -euo pipefail
          python3 scripts/live_multisite_http_audit_20261105.py < "$RUNNER_TEMP/live-multisite-cpanel.jsonl" | tee "$RUNNER_TEMP/live-multisite-http.jsonl"
