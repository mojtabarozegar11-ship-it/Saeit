name: Zomorod root misplaced search read-only audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-gold-search-header-audit-20261018.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"

      - name: Read only active root header footer and source identity
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/zomorod-baseline-inventory/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,os,re,json
          root=Path('/home/zomorod2/public_html')
          page=root/'index.html'
          assert os.getuid()==1371 and root.is_dir() and not root.is_symlink()
          assert page.is_file() and not page.is_symlink()
          data=page.read_bytes()
          text=data.decode('utf8')
          print('ZM_ROOT_SHA256='+hashlib.sha256(data).hexdigest())
          print('ZM_ROOT_BYTES='+str(len(data)))
          for mark in ('<header class="topbar wrap"','<footer','</footer>','zm-v11-site-links','zm-full-topics-index-link','zm-v11-header','</head>','</body>','site-footer','top-actions','</header>','</main>'):
            found=[m.start() for m in re.finditer(re.escape(mark),text)]
            print('ZM_MARK='+repr(mark)+' NUM='+str(len(found))+' POS='+str(found[:8]))
            if found:
              idx=found[-1]
              snippet=re.sub(r'\s+',' ',text[max(idx-130,0):idx+500])
              print('ZM_SNIPPET='+mark+' '+snippet[:660])
          link=re.search(r'<nav\b[^>]*class="zm-v11-site-links".*?</nav>',text,re.S)
          if link:print('ZM_V11_NAV_HTML='+link.group(0)[:2000])
          for item in ('search/index.html','store/index.php','.htaccess'):
            p=root/item
            print('ZM_PROTECTED_FILE='+item+' EXISTS='+str(p.is_file())+' SHA='+hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else 'MISSING')
          PY
      - name: Check public content matching site-owned static root
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          import hashlib
          for route in ['/','/search/','/store/']:
            req=Request('https://zomorodmelal.ir'+route,headers={'Cache-Control':'no-cache','User-Agent':'ZMReadOnlySearchAudit/1.0'})
            with urlopen(req,timeout=20) as r:
              b=r.read()
              print('ZM_PUBLIC='+route+' STATUS='+str(r.status)+' SIZE='+str(len(b))+' SHA256='+hashlib.sha256(b).hexdigest(),flush=True)
              if route=='/':
                s=b.decode('utf8','replace')
                print('ZM_PUBLIC_NAV_POS='+str(s.find('zm-v11-site-links'))+' FOOTER_POS='+str(s.find('<footer'))+' CLOSE_POS='+str(s.rfind('</footer>')),flush=True)
          PY
      - name: Cleanup SSH identity
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-baseline-inventory"
