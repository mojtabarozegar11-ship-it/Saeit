name: Zomorod education slash 500 surgical 301 route release
on:
  push:
    branches: ['fix/zomorod-education-directory-500-20261031']
    paths: ['.github/workflows/zomorod-education-301-release-once-20261031.yml']
permissions:
  contents: read
concurrency:
  group: zomorod-education-301-exact-once-20261031
  cancel-in-progress: false
jobs:
  education-301:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm existing source redirect to canonical academy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/education/index.html').read_text()
          assert 'saeit-education-redirect' in s
          assert 'https://zomorodmelal.ir/amozeshgah/' in s
          print('STATIC_LEGACY_REDIRECT_SOURCE=PASS')
          PY
      - name: Prepare pinned cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Add only education legacy 301 ahead of static academy rule, with private backup
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          ssh -F "$d/config" "$COMMAND_HOST" python3 - "$GITHUB_RUN_ID" <<'PY'
          import hashlib,os,re,stat,sys
          from pathlib import Path
          run=sys.argv[1]
          if not re.fullmatch(r'[0-9]{8,20}',run):raise SystemExit('UNSAFE_RUN_ID')
          home=Path.home()
          target=home/'public_html/.htaccess'
          if not target.is_file() or target.is_symlink():raise SystemExit('ROOT_ROUTER_NOT_REGULAR')
          info=target.stat()
          if info.st_uid!=os.geteuid() or info.st_nlink!=1 or info.st_size>12000:
              raise SystemExit('ROOT_ROUTER_METADATA_BLOCKED')
          before=target.read_bytes()
          expected_sha='84b043a02de37c654aaab5005eb455947a3a4dab371b639bdcff69a177a47066'
          if hashlib.sha256(before).hexdigest()!=expected_sha:raise SystemExit('ROOT_ROUTER_CONCURRENT_DRIFT')
          anchor=b'RewriteRule ^amozeshgah/?$ amozeshgah/index.html [END]'
          rule=b'RewriteRule ^education/?$ /amozeshgah/ [R=301,L,NC]'
          if before.count(anchor)!=1 or b'RewriteEngine On' not in before or rule in before:
              raise SystemExit('ROUTER_EXPECTED_RULES_MISSING')
          eol=b'\r\n' if b'\r\n' in before else b'\n'
          after=before.replace(anchor,rule+eol+anchor,1)
          base=home/'.backups/zomorod-education-301-20261031'
          if base.exists() and (base.is_symlink() or base.stat().st_uid!=os.geteuid()):
              raise SystemExit('BACKUP_PARENT_UNSAFE')
          base.mkdir(mode=0o700,parents=True,exist_ok=True);os.chmod(base,0o700)
          bdir=base/run
          bdir.mkdir(mode=0o700)
          backup=bdir/'root-htaccess.before'
          with backup.open('xb') as stream:
              os.fchmod(stream.fileno(),0o600)
              stream.write(before);stream.flush();os.fsync(stream.fileno())
          if backup.read_bytes()!=before:raise SystemExit('BACKUP_NOT_VERIFIED')
          stage=target.parent/('.htaccess.education-'+run+'.stage')
          applied=False
          try:
              with stage.open('xb') as stream:
                  os.fchmod(stream.fileno(),stat.S_IMODE(info.st_mode))
                  stream.write(after);stream.flush();os.fsync(stream.fileno())
              if stage.read_bytes()!=after:raise RuntimeError('STAGE_FAILED')
              if target.read_bytes()!=before:raise RuntimeError('ROUTER_CHANGED')
              os.replace(stage,target);applied=True
              if target.read_bytes()!=after:raise RuntimeError('POSTCHECK_FAILED')
              print('EDUCATION_EXACT_ROUTE_301=APPLIED')
              print('BEFORE_SHA256='+hashlib.sha256(before).hexdigest())
              print('AFTER_SHA256='+hashlib.sha256(after).hexdigest())
              print('ALL_OTHER_ROUTER_BYTES_PRESERVED=TRUE')
              print('DATABASE_WORKER_CRON_MODIFICATIONS=NONE')
          except Exception:
              if applied and target.read_bytes()==after:
                  restore=target.parent/('.htaccess.education-restore-'+run+'.stage')
                  with restore.open('xb') as stream:
                      os.fchmod(stream.fileno(),stat.S_IMODE(info.st_mode))
                      stream.write(before);stream.flush();os.fsync(stream.fileno())
                  os.replace(restore,target)
                  print('ATOMIC_ROLLBACK=PREIMAGE')
              if stage.exists():stage.unlink()
              raise
          PY
      - name: Verify real public legacy 301 and canonical destination 200
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -fsS -o /dev/null -w '%{http_code}' -I --max-time 30 'https://zomorodmelal.ir/education/')"
          test "$status" = 301 || { echo "LEGACY_HTTP_STATUS=$status"; exit 1; }
          location="$(curl -fsS -I --max-time 30 'https://zomorodmelal.ir/education/' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -1)"
          case "$location" in /amozeshgah/|https://zomorodmelal.ir/amozeshgah/) ;; *) echo "LEGACY_LOCATION_UNEXPECTED"; exit 1;; esac
          canon="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 'https://zomorodmelal.ir/amozeshgah/')"
          test "$canon" = 200 || { echo "CANONICAL_HTTP_STATUS=$canon"; exit 1; }
          echo 'LEGACY_301_TO_CANONICAL_200=PASS'
      - name: Restore exact backed-up root router if a post-apply check failed
        if: failure()
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) echo 'NO_AUTHENTICATED_RELAY'; exit 0;; esac
          test -f "$d/config" || exit 0
          ssh -F "$d/config" "$COMMAND_HOST" python3 - "$GITHUB_RUN_ID" <<'PY'
          import hashlib,os,re,stat,sys
          from pathlib import Path
          run=sys.argv[1]
          if not re.fullmatch(r'[0-9]{8,20}',run):raise SystemExit('BAD_RUN')
          home=Path.home()
          target=home/'public_html/.htaccess'
          backup=home/'.backups/zomorod-education-301-20261031'/run/'root-htaccess.before'
          if not backup.is_file():
              print('NO_APPLIED_ROUTER_TO_RESTORE');sys.exit(0)
          before=backup.read_bytes()
          if hashlib.sha256(before).hexdigest()!='84b043a02de37c654aaab5005eb455947a3a4dab371b639bdcff69a177a47066':
              raise SystemExit('BACKUP_HASH_MISMATCH')
          current=target.read_bytes()
          rule=b'RewriteRule ^education/?$ /amozeshgah/ [R=301,L,NC]'
          if current==before:
              print('ROUTER_ALREADY_PREIMAGE');sys.exit(0)
          if current.count(rule)!=1 or current.replace(rule+b'\n',b'',1)!=before.replace(b'RewriteRule ^amozeshgah/?$ amozeshgah/index.html [END]',b'RewriteRule ^amozeshgah/?$ amozeshgah/index.html [END]',1):
              # Accept rollback only when current differs solely by the exact one-line rule.
              clean=current.replace(rule+b'\r\n',b'',1).replace(rule+b'\n',b'',1)
              if clean!=before:raise SystemExit('CONCURRENT_MODIFICATION_NO_ROLLBACK')
          st=target.stat()
          stage=target.parent/('.htaccess.education-rollback-'+run+'.stage')
          with stage.open('xb') as stream:
              os.fchmod(stream.fileno(),stat.S_IMODE(st.st_mode))
              stream.write(before);stream.flush();os.fsync(stream.fileno())
          os.replace(stage,target)
          print('LEGACY_ROUTE_ROLLBACK=RESTORED')
          PY
      - name: Clean temporary runner keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-command-channel"
