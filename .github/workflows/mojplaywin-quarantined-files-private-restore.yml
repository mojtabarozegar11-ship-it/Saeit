name: MojPlayWin quarantined encrypted files private restore test
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths:
      - ".github/workflows/mojplaywin-quarantined-files-private-restore.yml"
      - "scripts/mojplaywin_quarantine_vps_runner.py"
      - "scripts/mojplaywin_quarantined_files_test.py"
      - "tests/test_mojplaywin_quarantined_files.py"
permissions:
  contents: read
concurrency:
  group: mojplaywin-quarantine-private-restore
  cancel-in-progress: false
jobs:
  restore-private-content-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check fail-closed quarantine tests and syntax before SSH
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_mojplaywin_quarantined_files.py -v
          python3 -m py_compile scripts/mojplaywin_quarantined_files_test.py scripts/mojplaywin_quarantine_vps_runner.py scripts/mojplaywin_recovery_stream_vps.py
      - name: Authenticate pinned VPS only, no cPanel access
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-private-extract"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          chmod 600 "$d/vps.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
      - name: Extract exact original regular files in private VPS sandbox, quarantine three links
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-private-extract"
          wrapper64="$(base64 -w0 scripts/mojplaywin_quarantine_vps_runner.py)"
          test64="$(base64 -w0 scripts/mojplaywin_quarantined_files_test.py)"
          recovery64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          code='import sys,base64;d={"__name__":"temporary_private_quarantine"};exec(base64.b64decode(sys.argv[1]),d);d["main"](sys.argv[2:])'
          timeout 1150s ssh -T -i "$d/vps.key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/vps.known" -o ConnectTimeout=12 -o ServerAliveInterval=15 githubops@178.239.147.150 "python3 -c '$code' '$wrapper64' '$test64' '$recovery64'"
          echo "SOURCE_CONTENT_EXTRACTED_FOR_TEST_ONLY=true"
          echo "ABSOLUTE_LINKS_MATERIALIZED=false"
          echo "FULL_RESTORE_CERTIFIED=false"
          echo "PRODUCTION_CHANGED=false"
          echo "LIVE_DEPLOY_AUTHORIZED=false"
      - name: Remove SSH credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/mpw-private-extract"
