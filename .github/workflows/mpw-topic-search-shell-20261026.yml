name: MojPlayWin unify search and 340 topic page shells

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-topic-search-shell-20261026.yml
      - scripts/mpw_topic_search_shell_20261026.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpw-only-topic-search-shell
  cancel-in-progress: false

jobs:
  publish-php-navigation:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate guarded publisher and verify live PHP readers
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_topic_search_shell_20261026.py
          python3 scripts/mpw_topic_search_shell_20261026.py selftest
          python3 - <<'PY'
          import urllib.request
          for path in ('/search/', '/search/?q=chess', '/topics/?id=0001', '/topics/?id=0340'):
              req=urllib.request.Request('https://mojplaywin.com'+path,
                   headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  assert r.status==200,path
                  doc=r.read(30000).decode('utf-8','replace')
              assert '<nav class="nav"' in doc,path
              assert 'data-mpw-dynamic-shell="20261026"' not in doc,path
          print('PHP_READER_BASELINE_HEALTHY_AND_UNMODIFIED')
          PY
      - name: Establish pinned SSH relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-learning-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Publish precisely two PHP navigation shells and one shared header
        id: install
        run: |
          set -euo pipefail
          timeout 125s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_topic_search_shell_20261026.py
      - name: Smoke all key search and topic routes on real cPanel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time,urllib.request,urllib.error
          paths=[
              ('/search/',200,'Search MojPlayWin'),
              ('/search/?q=chess',200,'chess'),
              ('/search/?q=research',200,'research'),
              ('/topics/?id=0001',200,'Web Design'),
              ('/topics/?id=0170',200,'MojPlayWin'),
              ('/topics/?id=0340',200,'MojPlayWin'),
          ]
          def check(path,status,needle):
              req=urllib.request.Request('https://mojplaywin.com'+path,
                         headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  assert response.status==status,path
                  doc=response.read(50000).decode('utf-8','replace')
              assert doc.count('data-mpw-dynamic-shell="20261026"')==1,path
              assert doc.count('class="mw-site-nav mpw-unified-shell"')==1,path
              assert '<nav class="nav"' not in doc,path
              assert 'href="/services/"' in doc,path
              assert '/mpw-editorial/revenue/assets/mpw-one-shell-20261026.css' in doc,path
              assert needle.lower() in doc.lower(),path
              assert doc.count('rel="canonical"')==1,path
          for retry in range(8):
              try:
                  check(paths[0][0],*paths[0][1:])
                  break
              except AssertionError:
                  if retry==7:raise
                  time.sleep(2)
          for entry in paths:check(*entry)
          print('SEARCH_AND_TOPIC_PRIMARY_NAV_CANONICAL_PRESERVED')
          PY
      - name: Verify the 25 protected commerce, child and personal routes did not change
        run: |
          set -euo pipefail
          python3 scripts/mpw_subsite_continuity_guard_20261026.py
      - name: Roll back only scoped PHP shell changes if smoke or protections fail
        if: failure() && steps.install.outcome == 'success'
        run: |
          timeout 105s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_topic_search_shell_20261026.py
      - name: Remove temporary relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-learning-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
