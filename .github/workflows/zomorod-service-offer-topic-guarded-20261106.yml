name: Guarded Zomorod offer-specific service inquiry
on:
  push:
    branches: [audit/zm-service-offer-topic-20261106]
    paths:
      - scripts/zomorod_service_offer_topic_guarded_20261106.py
      - .github/workflows/zomorod-service-offer-topic-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-service-offer-topic-guarded-20261106
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate two-file whitelisted topic transform
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_service_offer_topic_guarded_20261106.py
          python3 scripts/zomorod_service_offer_topic_guarded_20261106.py selftest
      - name: Authenticate pinned direct cPanel with VPS relay fallback
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-offer-topic-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/ask-master/index.php' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/ask-master/index.php' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Exact-version and PHP-lint preflight, no writes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-offer-topic-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/zomorod_service_offer_topic_guarded_20261106.py
      - name: Backup then publish service cards and matching form, atomically
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-offer-topic-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_service_offer_topic_guarded_20261106.py
      - name: Verify source and public topic GET routes without creating inquiries
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-offer-topic-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_service_offer_topic_guarded_20261106.py
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          base='https://zomorodmelal.ir'
          service_targets={
            'economics':'ارزیابی اقتصادی واحد کشاورزی',
            'water':'مدیریت آب و منابع تولید',
            'feasibility':'امکان‌سنجی پروژهٔ تولیدی',
          }
          for attempt in range(6):
              try:
                  with urlopen(Request(base+'/services/?offer_topic='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt),headers={'Cache-Control':'no-cache'}),timeout=27) as r:
                      services=r.read(130000).decode('utf-8')
                      if r.status!=200:
                          raise RuntimeError('PUBLIC_SERVICE_PAGE_NOT_200')
                  for key, title in service_targets.items():
                      if services.count('href="/ask-master/index.php?service=1&amp;topic='+key+'"')!=1:
                          raise RuntimeError('OFFER_CARD_LINK_MISSING:'+key)
                      url=base+'/ask-master/index.php?service=1&topic='+key
                      with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=27) as r:
                          html=r.read(120000).decode('utf-8')
                          csp=r.headers.get('Content-Security-Policy','')
                          if r.status!=200 or "default-src 'none'" not in csp:
                              raise RuntimeError('FORM_OR_CSP_REGRESSION:'+key)
                      if ('name="service_topic" value="'+key+'"' not in html
                          or 'موضوع انتخابی: '+title not in html
                          or '<option value="service_question" selected>' not in html):
                          raise RuntimeError('PUBLIC_FORM_TOPIC_NOT_SELECTED:'+key)
                  with urlopen(Request(base+'/ask-master/index.php?service=1'),timeout=27) as r:
                      normal=r.read(120000).decode('utf-8')
                      if r.status!=200 or 'name="service_topic"' in normal:
                          raise RuntimeError('GENERIC_SERVICE_FORM_CHANGED')
                  print('PUBLIC_THREE_SERVICE_TOPICS_AND_CSP_VERIFIED=1')
                  break
              except Exception:
                  if attempt==5:
                      raise
                  time.sleep(4)
          PY
      - name: Restore precisely our files if post-publish verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-offer-topic-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_service_offer_topic_guarded_20261106.py
