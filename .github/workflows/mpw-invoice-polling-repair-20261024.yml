name: MojPlayWin TRX invoice polling exact repair
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-invoice-polling-repair-20261024.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-invoice-polling-repair
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish existing host-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-invoice-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Locate the live invoice polling source without reading secrets
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-invoice-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          app=Path('/home/zomorod2/Saeit-staging')
          site=Path('/home/zomorod2/mojplaywin.com')
          for p in (app,site,app/'mpw_commerce'):
              if p.is_symlink() or not p.is_dir():
                  raise SystemExit('ROOT_UNSAFE')
          needle=b'window.clearTimeout(timeout);'
          matches=[]
          for root in (app,):
              for p in root.rglob('*'):
                  if p.is_symlink() or not p.is_file() or p.suffix.lower() not in ('.html','.htm','.py','.js'):
                      continue
                  try:
                      if p.stat().st_size>2_000_000:continue
                      raw=p.read_bytes()
                  except OSError:continue
                  if needle in raw and b'async function check()' in raw and b'checking=false' in raw:
                      matches.append({'path':str(p),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'line_count':raw.count(needle)})
          print('MPW_TRX_INVOICE_POLLING_SOURCE='+json.dumps(matches))
          if len(matches)!=1 or matches[0]['line_count']!=1:
              raise SystemExit('EXPECTED_ONE_EXACT_INVOICE_POLLING_SOURCE')
          PY
      - name: Remove temporary relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-invoice-ssh"
