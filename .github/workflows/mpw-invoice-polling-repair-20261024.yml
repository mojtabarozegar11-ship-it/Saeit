name: MojPlayWin TRX invoice polling exact repair
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-invoice-polling-repair-20261024.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-invoice-polling-repair
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish existing host-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-invoice-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Locate the live invoice polling source without reading secrets
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-invoice-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          app=Path('/home/zomorod2/Saeit-staging')
          site=Path('/home/zomorod2/mojplaywin.com')
          for p in (app,site,app/'mpw_commerce'):
              if p.is_symlink() or not p.is_dir():
                  raise SystemExit('ROOT_UNSAFE')
          needle=b'window.clearTimeout(timeout);'
          matches=[]
          for root in (app,):
              for p in root.rglob('*'):
                  if p.is_symlink() or not p.is_file() or p.suffix.lower() not in ('.html','.htm','.py','.js'):
                      continue
                  try:
                      if p.stat().st_size>2_000_000:continue
                      raw=p.read_bytes()
                  except OSError:continue
                  if b'async function check()' in raw and b'checking=false' in raw:
                      matches.append({'path':str(p),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'line_count':raw.count(needle)})
          print('MPW_TRX_INVOICE_POLLING_SOURCE='+json.dumps(matches))
          if len(matches)!=1 or matches[0]['line_count']>1:
              raise SystemExit('EXPECTED_ONE_EXACT_INVOICE_POLLING_SOURCE')
          PY
      - name: Back up and remove only the undefined invoice timeout cleanup
        id: patch
        run: |
          set -euo pipefail
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-invoice-ssh/config" saeit-cpanel "GITHUB_RUN_ID=$GITHUB_RUN_ID python3 -" <<'PY'
          from pathlib import Path
          import hashlib,json,os,stat,tempfile
          app=Path('/home/zomorod2/Saeit-staging');site=Path('/home/zomorod2/mojplaywin.com')
          target=app/'services/mpw_trx_walletless_checkout_ui.py'
          for p in (app,site,app/'services',target):
              if p.is_symlink():raise SystemExit('UNSAFE_SYMLINK')
          if not app.is_dir() or not site.is_dir() or not target.is_file():raise SystemExit('APP_OR_SOURCE_MISSING')
          raw=target.read_bytes();needle=b'window.clearTimeout(timeout);'
          if b'async function check()' not in raw or b'checking=false;' not in raw or b'if(!stopped)schedule(delay);' not in raw:raise SystemExit('SOURCE_DRIFT_OR_PATCH_NOT_UNIQUE')
          if raw.count(needle)==0:
              print('MPW_INVOICE_POLLING_PATCH=ALREADY_PATCHED;NO_SOURCE_CHANGE')
              raise SystemExit(0)
          if raw.count(needle)!=1:raise SystemExit('SOURCE_DRIFT_OR_PATCH_NOT_UNIQUE')
          lines=raw.splitlines(keepends=True);indexes=[i for i,line in enumerate(lines) if line.strip()==needle]
          if len(indexes)!=1 or not lines[indexes[0]].endswith(b'\n'):raise SystemExit('POLLING_CLEANUP_NOT_UNIQUE')
          i=indexes[0];updated=b''.join(lines[:i]+lines[i+1:]);compile(updated.decode('utf8'),str(target),'exec')
          backup_dir=Path('/home/zomorod2/.private_mojplaywin_main_agents')
          if backup_dir.is_symlink() or not backup_dir.is_dir():raise SystemExit('PRIVATE_BACKUP_DIR_UNSAFE')
          run_id=os.environ.get('GITHUB_RUN_ID','')
          if not run_id.isdigit():raise SystemExit('INVALID_RUN_ID')
          backup=backup_dir/('mpw-invoice-polling-'+run_id+'.py')
          fd=os.open(str(backup),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          os.chmod(backup,0o600);mode=stat.S_IMODE(target.stat().st_mode)
          fd,tmp=tempfile.mkstemp(prefix='.mpw-invoice-polling-',dir=str(target.parent))
          try:
              with os.fdopen(fd,'wb') as f:f.write(updated);f.flush();os.fsync(f.fileno())
              os.chmod(tmp,mode);os.replace(tmp,target)
          finally:
              if os.path.exists(tmp):os.unlink(tmp)
          actual=target.read_bytes()
          if actual!=updated or needle in actual or hashlib.sha256(backup.read_bytes()).hexdigest()!=hashlib.sha256(raw).hexdigest():raise SystemExit('PATCH_POSTCONDITION_FAILED')
          print('MPW_INVOICE_POLLING_PATCH='+json.dumps({'status':'PATCHED','source':str(target),'removed_exact_lines':1,'before_sha256':hashlib.sha256(raw).hexdigest(),'after_sha256':hashlib.sha256(actual).hexdigest(),'backup':str(backup)}))
          PY
      - name: Compile and reload only the verified MojPlayWin main app
        id: reload
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mpw-invoice-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import hashlib,py_compile
          site=Path('/home/zomorod2/mojplaywin.com');app=Path('/home/zomorod2/Saeit-staging')
          wsgi=site/'passenger_wsgi.py';source=app/'services/mpw_trx_walletless_checkout_ui.py'
          if any(p.is_symlink() for p in (site,app,wsgi,source)):raise SystemExit('RELOAD_TARGET_UNSAFE')
          if not wsgi.is_file() or "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):raise SystemExit('WRONG_PASSENGER_APP')
          raw=source.read_bytes()
          if b'window.clearTimeout(timeout);' in raw or b'checking=false;' not in raw or b'if(!stopped)schedule(delay);' not in raw:raise SystemExit('POLLING_SOURCE_NOT_FIXED')
          py_compile.compile(str(source),doraise=True)
          tmp=site/'tmp'
          if tmp.is_symlink():raise SystemExit('PASSENGER_TMP_UNSAFE')
          tmp.mkdir(exist_ok=True);marker=tmp/'restart.txt'
          if marker.is_symlink():raise SystemExit('PASSENGER_MARKER_UNSAFE')
          marker.touch()
          print('MPW_INVOICE_POLLING_SOURCE_VERIFIED=PASS;SHA256='+hashlib.sha256(raw).hexdigest())
          PY
      - name: Read deployed invoice route wiring without changing application data
        run: |
          set -euo pipefail
          timeout 60s ssh -T -F "$RUNNER_TEMP/mpw-invoice-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import re,json,ast
          root=Path('/home/zomorod2/Saeit-staging')
          path_re=re.compile(r"""(?:path|re_path)\(\s*['"]([^'"]+)['"]\s*,\s*([A-Za-z0-9_.]+)""")
          routes=[];views=[]
          for p in root.rglob('urls.py'):
              if p.is_symlink() or not p.is_file():continue
              try: lines=p.read_text('utf8','replace').splitlines()
              except OSError:continue
              for n,line in enumerate(lines,1):
                  if re.search(r'trx|invoice|commerce',line,re.I):
                      for m in path_re.finditer(line):routes.append({'file':str(p.relative_to(root)),'line':n,'route':m.group(1),'view':m.group(2)})
          for base in (root/'services',root/'core'):
              if not base.is_dir() or base.is_symlink():continue
              for p in base.rglob('*.py'):
                  if p.is_symlink():continue
                  try:lines=p.read_text('utf8','replace').splitlines()
                  except OSError:continue
                  for n,line in enumerate(lines,1):
                      m=re.match(r'\s*def\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',line)
                      if m and re.search(r'trx|invoice|checkout|start',m.group(1),re.I):views.append({'file':str(p.relative_to(root)),'line':n,'function':m.group(1)})
          print('MPW_DEPLOYED_INVOICE_ROUTE_MAP='+json.dumps({'routes':routes[:80],'views':views[:80]}))
          policies=[]
          targets={root/'config/urls.py',root/'services/mpw_trx_public_pages.py',root/'services/mpw_trx_commercial_web.py'}
          wanted={'_mpw_trx_start','_trx_product','product_checkout','_start_order'}
          for p in targets:
              if p.is_symlink() or not p.is_file():continue
              try:source=p.read_text('utf8','replace');tree=ast.parse(source)
              except (OSError,SyntaxError):continue
              for node in ast.walk(tree):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) or node.name not in wanted:continue
                  body=ast.get_source_segment(source,node) or ''
                  names=set(re.findall(r'[A-Za-z_][A-Za-z0-9_]*',body))
                  policies.append({'file':str(p.relative_to(root)),'function':node.name,'line':node.lineno,'auth_gate':bool({'is_authenticated','login_required','login_url'}&names),'user_access':bool({'user','request'}&names),'not_found_branch':bool({'Http404','HttpResponseNotFound','NotFound'}&names),'login_redirect':('login' in names and bool({'redirect','RedirectView'}&names)),'invoice_or_order_calls':sorted(n for n in names if re.search(r'invoice|order|checkout|create',n,re.I))[:20]})
          print('MPW_INVOICE_START_POLICY='+json.dumps(policies))
          branch_audit=[]
          for p in targets:
              if p.is_symlink() or not p.is_file():continue
              try:tree=ast.parse(p.read_text('utf8','replace'))
              except (OSError,SyntaxError):continue
              for node in ast.walk(tree):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) or node.name not in wanted:continue
                  branches=[]
                  for child in ast.walk(node):
                      if isinstance(child,ast.If):
                          names=sorted({x.id for x in ast.walk(child.test) if isinstance(x,ast.Name)}|{x.attr for x in ast.walk(child.test) if isinstance(x,ast.Attribute)})
                          operators=sorted(type(x).__name__ for x in ast.walk(child.test) if isinstance(x,(ast.Eq,ast.NotEq,ast.Is,ast.IsNot,ast.In,ast.NotIn,ast.Gt,ast.GtE,ast.Lt,ast.LtE,ast.And,ast.Or,ast.Not)))
                          branches.append({'line':child.lineno,'names':names,'operators':operators,'literal_types':sorted({type(x.value).__name__ for x in ast.walk(child.test) if isinstance(x,ast.Constant)})})
                  terminals=[]
                  for child in ast.walk(node):
                      if isinstance(child,ast.Return):
                          value=child.value
                          terminals.append({'line':child.lineno,'kind':'return','call':getattr(getattr(value,'func',None),'id',None) or getattr(getattr(value,'func',None),'attr',None) or type(value).__name__})
                      elif isinstance(child,ast.Raise):
                          terminals.append({'line':child.lineno,'kind':'raise','call':getattr(getattr(child.exc,'func',None),'id',None) or getattr(child.exc,'id',None) or type(child.exc).__name__})
                  branch_audit.append({'file':str(p.relative_to(root)),'function':node.name,'branches':branches[:50],'terminals':terminals[:50]})
          print('MPW_INVOICE_START_BRANCH_AUDIT='+json.dumps(branch_audit))
          sanitized=[]
          for p in targets:
              if p.is_symlink() or not p.is_file():continue
              try:source=p.read_text('utf8','replace');tree=ast.parse(source)
              except (OSError,SyntaxError):continue
              for node in ast.walk(tree):
                  if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) or node.name not in wanted:continue
                  class RedactStrings(ast.NodeTransformer):
                      def visit_Constant(self,item):
                          if isinstance(item.value,str):return ast.copy_location(ast.Constant(value='<literal>'),item)
                          return item
                  clean=RedactStrings().visit(node);ast.fix_missing_locations(clean)
                  segment=ast.unparse(clean)
                  sanitized.append({'file':str(p.relative_to(root)),'function':node.name,'source_without_literals':segment[:5000]})
          print('MPW_INVOICE_START_SOURCE_SHAPE='+json.dumps(sanitized))
          if not routes:raise SystemExit('NO_INVOICE_ROUTE_DEFINITIONS_FOUND')
          PY
      - name: Smoke public store product and checkout routes without creating orders or payments
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          root='https://mojplaywin.com'
          routes=['/store/','/store/product/72/','/store/product/72/checkout/','/store/product/225/','/store/product/225/checkout/']
          for path in routes:
              req=urllib.request.Request(root+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MPWInvoicePollingSmoke/1.0'})
              with urllib.request.urlopen(req,timeout=22) as r:
                  body=r.read(400000)
                  if r.status!=200:raise SystemExit('HTTP_FAILURE '+path)
                  if path=='/store/' and b'Useful ideas, made to explore.' not in body:raise SystemExit('STORE_RENDER_FAILED')
                  if path.startswith('/store/product/') and not body:raise SystemExit('EMPTY_PRODUCT_OR_CHECKOUT '+path)
              print('MPW_INVOICE_POLLING_HTTP='+json.dumps({'path':path,'status':200,'bytes':len(body)}))
          print('MPW_INVOICE_POLLING_LIVE_SMOKE=PASS;NO_ORDER_OR_PAYMENT_CREATED_BY_SMOKE')
          PY
      - name: Restore exact private backup if a post-patch gate fails
        if: failure() && steps.patch.outcome == 'success'
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-invoice-ssh/config" saeit-cpanel "GITHUB_RUN_ID=$GITHUB_RUN_ID python3 -" <<'PY'
          from pathlib import Path
          import os,stat,tempfile
          run_id=os.environ.get('GITHUB_RUN_ID','')
          if not run_id.isdigit():raise SystemExit('INVALID_RUN_ID')
          app=Path('/home/zomorod2/Saeit-staging');site=Path('/home/zomorod2/mojplaywin.com')
          target=app/'services/mpw_trx_walletless_checkout_ui.py'
          backup=Path('/home/zomorod2/.private_mojplaywin_main_agents')/('mpw-invoice-polling-'+run_id+'.py')
          if any(p.is_symlink() for p in (app,site,target,backup)):raise SystemExit('ROLLBACK_SOURCE_UNSAFE')
          if not backup.is_file():
              print('MPW_INVOICE_POLLING_ROLLBACK=SKIPPED_NO_CHANGE_BY_THIS_RUN')
              raise SystemExit(0)
          raw=backup.read_bytes()
          if raw.count(b'window.clearTimeout(timeout);')!=1:raise SystemExit('ROLLBACK_CONTENT_INVALID')
          fd,tmp=tempfile.mkstemp(prefix='.mpw-invoice-rollback-',dir=str(target.parent));mode=stat.S_IMODE(target.stat().st_mode)
          try:
              with os.fdopen(fd,'wb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
              os.chmod(tmp,mode);os.replace(tmp,target)
          finally:
              if os.path.exists(tmp):os.unlink(tmp)
          marker=site/'tmp'/'restart.txt'
          if marker.is_symlink():raise SystemExit('ROLLBACK_RESTART_UNSAFE')
          marker.touch();print('MPW_INVOICE_POLLING_ROLLBACK=RESTORED')
          PY
      - name: Remove temporary relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-invoice-ssh"
