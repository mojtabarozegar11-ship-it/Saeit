name: Repair public MojPlayWin trial exposure with order preservation
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-repair-public-trial-exposure-20261107.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-repair-public-trial-exposure
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-repair-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Restore only public exposure code and preserve database orders
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-repair-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,pwd,stat,json
          from pathlib import Path
          APP=Path('/home/zomorod2/Saeit-staging'); WSGI=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          files={'view':APP/'core/brand_views.py','settings':APP/'config/settings.py','store':APP/'core/templates/mojplaywin/store.html','detail':APP/'core/templates/brands/mojplaywin/product.html'}
          if pwd.getpwuid(os.getuid()).pw_name!='zomorod2' or APP.is_symlink() or WSGI.is_symlink() or not WSGI.is_file() or "APP='/home/zomorod2/Saeit-staging'" not in WSGI.read_text(errors='replace'): raise RuntimeError('UNTRUSTED_LIVE_ROOT')
          old_view="    if product.pk in canary_ids or not _eligible(product): raise Http404"
          new_view=("    owner_approved_micro_trial = (\n"
          "        product.pk == 779 and product.currency == 'USD'\n"
          "        and str(product.price) == '0.03'\n"
          "        and isinstance(product.metadata, dict)\n"
          "        and product.metadata.get('mpw_micro_trial') == 'mpw-native-trx-micro-trial-20261020-v1'\n"
          "        and product.metadata.get('asset_verified') is True\n"
          "        and product.metadata.get('rights_cleared') is True\n"
          "        and product.metadata.get('checkout_enabled') is True\n"
          "    )\n"
          "    if (product.pk in canary_ids and not owner_approved_micro_trial) or not _eligible(product): raise Http404\n"
          "    if owner_approved_micro_trial:\n"
          "        product.metadata = dict(product.metadata)\n"
          "        product.metadata['summary'] = 'Original one-page educational PDF on the secure TRX checkout process.'\n"
          "        product.metadata['seo_description'] = 'Three-cent MojPlayWin TRX digital PDF trial: invoice, safe payment and private download.'")
          before={k:p.read_bytes() for k,p in files.items()}
          view=before['view'].decode(); settings=before['settings'].decode(); store=before['store'].decode(); detail=before['detail'].decode()
          if view.count(new_view)!=1 or settings.count('MPW_TRX_PUBLIC_PRODUCT_IDS = (72, 225, 879, 779)')!=1: raise RuntimeError('EXPECTED_PUBLIC_PATCH_NOT_FOUND')
          card_start=store.find('<section class="mpw-store-section" id="mpw-trx-micro-trial-779-20261026"')
          anchor=store.find('<!-- MPW_TWO_BOOKS_PUBLIC_CATALOG_V1_START -->')
          detail_start=detail.find('{% elif product.pk == 779 %}')
          detail_anchor=detail.find('{% elif product.pk == 72 or product.pk == 225 %}')
          if min(card_start,anchor,detail_start,detail_anchor)<0 or card_start>anchor or detail_start>detail_anchor: raise RuntimeError('EXPECTED_CATALOG_BLOCK_NOT_FOUND')
          new={'view':view.replace(new_view,old_view,1),'settings':settings.replace('MPW_TRX_PUBLIC_PRODUCT_IDS = (72, 225, 879, 779)','MPW_TRX_PUBLIC_PRODUCT_IDS = (72, 225, 879)',1),'store':store[:card_start]+store[anchor:],'detail':detail[:detail_start]+detail[detail_anchor:]}
          compile(new['view'],'brand_views.py','exec'); compile(new['settings'],'settings.py','exec')
          for k,p in files.items():
              tmp=p.with_name('.mpw-repair-'+k)
              fd=os.open(str(tmp),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,stat.S_IMODE(p.stat().st_mode))
              try:
                  with os.fdopen(fd,'wb') as f: f.write(new[k].encode() if isinstance(new[k],str) else new[k]); f.flush(); os.fsync(f.fileno())
                  os.replace(tmp,p)
              finally:
                  if tmp.exists(): tmp.unlink()
          for folder in (APP/'tmp',WSGI.parent/'tmp'):
              folder.mkdir(mode=0o700,exist_ok=True); flag=folder/'restart.txt'
              fd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600); os.close(fd); os.utime(flag,None)
          os.chdir(APP); sys.path.insert(0,str(APP)); os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django; django.setup()
          from core.models import Product,OrderItem
          p=Product.objects.get(pk=779); orders=OrderItem.objects.filter(product_id=779).count()
          print('MPW_779_PRESERVED='+json.dumps({'active':p.active,'orders':orders,'public_code_restored':True,'database_rows_changed':0}))
          if not p.active or orders<1: raise RuntimeError('PRESERVATION_CHECK_FAILED')
          PY
      - name: Verify live public catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request('https://mojplaywin.com/commerce/trx-easy/',headers={'Cache-Control':'no-cache, no-store, max-age=0','User-Agent':'MPW-Repair-779/1'})
          with urllib.request.urlopen(req,timeout=25) as r: body=r.read(240000).decode('utf-8','replace')
          if 'MojPlayWin Secure TRX Purchase' in body or '/store/product/779/' in body or '/commerce/book/779/' in body: raise RuntimeError('TRIAL_STILL_PUBLIC')
          for path in ('/store/','/store/product/72/','/store/product/225/','/store/product/879/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Repair-779/1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status!=200: raise RuntimeError(path+' HTTP '+str(r.status))
          print('MPW_PUBLIC_CATALOG=PASS'); print('MPW_ORIGINAL_PRODUCTS=HEALTHY')
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-repair-ssh"
