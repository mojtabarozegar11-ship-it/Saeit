name: Zomorod production app health diagnostic
on:
  push:
    branches: [codex/zomorod-backup-preflight]
    paths:
      - .github/workflows/zomorod-production-health-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: zomorod-production-health-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-health"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Run read-only app and selector diagnostics
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-health"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -u
          app=/home/zomorod2/Saeit
          web=/home/zomorod2/public_html
          echo "APPROOT_PRESENT=$(test -d "$app" && echo yes || echo no)"
          echo "PUBLIC_HTML_PRESENT=$(test -d "$web" && echo yes || echo no)"
          if test -f "$web/.htaccess"; then
            awk '$1=="PassengerAppRoot" || $1=="PassengerBaseURI" || $1=="PassengerPython" || $1=="PassengerStartupFile" {print "PASSENGER_DIRECTIVE="$0}' "$web/.htaccess"
          fi
          uapi --output=json PassengerApps list_applications 2>/dev/null | python3 -c 'import json,sys
          d=json.load(sys.stdin); stack=[d]; n=0
          while stack:
            x=stack.pop()
            if isinstance(x,dict):
              if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                n+=1
                for k in ("domain","base_uri","path","name","enabled","python_version"):
                  if k in x: print("PASSENGER_"+k.upper()+"="+str(x[k]))
              stack.extend(x.values())
            elif isinstance(x,list): stack.extend(x)
          print("PASSENGER_ROOT_MATCHES="+str(n))' || echo "PASSENGER_APP_LIST=unavailable"
          selector="$(command -v cloudlinux-selector 2>/dev/null || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          echo "CLOUDLINUX_SELECTOR=$([ -n "$selector" ] && echo available || echo unavailable)"
          python3 - "$HOME/.cl.selector/python-selector.json" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print("SELECTOR_CONFIG=missing")
          else:
              d=json.load(open(p,encoding="utf-8"))
              app=d.get("Saeit",{})
              print("SELECTOR_ROOT_DOMAIN="+str(app.get("domain","missing")))
              print("SELECTOR_ROOT_URI="+str(app.get("app_uri","missing")))
              print("SELECTOR_ROOT_PYTHON="+str(app.get("python_version","missing")))
          PY
          if test -n "$selector"; then
            run_selector() {
              label="$1"; shift
              output="$(mktemp "$HOME/.zomorod-health-$label.XXXXXX.json")"
              if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- "$@" > "$output"; then
                echo "SELECTOR_$label=execution_failed"
                rm -f -- "$output"
                return 0
              fi
              python3 - "$output" "$label" <<'PY'
          import base64,json,sys,re
          d=json.load(open(sys.argv[1],encoding="utf-8")); label=sys.argv[2]
          print("SELECTOR_"+label+"_RESULT="+str(d.get("result","missing")))
          payload=d.get("data")
          if isinstance(payload,str) and payload:
              try: output=base64.b64decode(payload,validate=True).decode("utf-8","replace")
              except Exception: output=""
              for line in output.splitlines()[-40:]:
                  line=re.sub(r"(?i)(secret|password|token|api[_-]?key)(\s*[:=]\s*)[^\s,;]+",r"\1\2[redacted]",line)
                  print("DJANGO_DIAGNOSTIC="+line[:240])
          if d.get("result")!="success": print("SELECTOR_"+label+"_DETAIL=failed")
          PY
              rm -f -- "$output"
            }
            (cd "$app" && run_selector CHECK check)
            (cd "$app" && run_selector MIGRATE_CHECK migrate --check)
          fi
          echo "LIVE_CODE_FILES:"
          for rel in manage.py config/urls.py config/settings.py core/models.py core/views.py core/api.py core/templates/core/home.html core/templates/core/services.html core/templates/core/platform_page.html core/templates/core/blog.html core/templates/core/academy.html; do
            if test -f "$app/$rel"; then sha256sum "$app/$rel" | awk -v f="$rel" '{print "FILE_SHA256_"f"="$1}'; else echo "FILE_MISSING=$rel"; fi
          done
          python3 - <<'PY'
          import pathlib,re,os
          roots=[pathlib.Path.home()/"logs",pathlib.Path.home()/"Saeit",pathlib.Path.home()/"public_html"]
          found=[]
          for root in roots:
            if not root.exists(): continue
            for base,dirs,files in os.walk(root):
              depth=len(pathlib.Path(base).relative_to(root).parts)
              dirs[:]=[d for d in dirs if d not in {".git","venv","node_modules","staticfiles","media","var"}]
              if depth>=3: dirs[:]=[]
              for name in files:
                if any(k in name.lower() for k in ("error_log","error.log","passenger.log","stderr")):
                  p=pathlib.Path(base)/name
                  try: found.append((p.stat().st_mtime,p))
                  except OSError: pass
          found=sorted(found,reverse=True)[:6]
          for _,p in found:
            print("ERROR_LOG="+str(p))
            try:
              lines=p.read_text(errors="replace").splitlines()[-200:]
              selected=[x for x in lines if re.search(r"error|exception|traceback|passenger|spawn|killed|memory|limit|denied|failed|module not found|no module",x,re.I)]
              for line in selected[-12:]:
                line=re.sub(r"(?i)(secret_key|password|token|api[_-]?key|private[_-]?key)(\s*[:=]\s*)[^\s,;]+",r"\1\2[redacted]",line)
                line=re.sub(r"(?i)(authorization:\s*)[^\r\n]+",r"\1[redacted]",line)
                print("ERROR_LOG_LINE="+line[:240])
            except Exception as e: print("ERROR_LOG_READ="+type(e).__name__)
          PY
          REMOTE
      - name: Verify public route response codes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /industry/ /agents/ /api/health/ /api/bridge/health/ /admin/login/ /amozeshgah/ /mohammad/ /ghanadi/ /agriculture/livestock/; do
            result="$(curl -sS -L --max-time 20 -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}|%{content_type}' "https://zomorodmelal.ir$route?health_probe=$GITHUB_SHA" || true)"
            echo "LIVE_ROUTE=$route RESULT=$result"
          done
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-health"
