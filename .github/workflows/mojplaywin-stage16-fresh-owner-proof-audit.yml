name: MojPlayWin fresh ETH TRX cryptographic ownership audit
on:
  push:
    branches: [qa/mpw-payment-release-preflight-20261015]
    paths: ['.github/workflows/mojplaywin-stage16-fresh-owner-proof-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Audit deployed sitewide commerce readiness via verified VPS relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-root-audit"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 100s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          cd "$HOME/Saeit-staging"
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection
          from django.urls import reverse
          from mpw_native_checkout.wallet_ownership import proven_assets
          from mpw_native_checkout.models import MerchantWalletProof, MerchantWalletChallenge
          from core.models import Product, Order, PaymentIntent
          assert connection.vendor == "mysql", "not live MySQL"
          result=proven_assets()
          print("MPW_FRESH_ETH_PROVEN="+str(result["ETH"]))
          print("MPW_FRESH_TRX_PROVEN="+str(result["TRX"]))
          for asset in ("ETH","TRX"):
              valid=MerchantWalletProof.objects.filter(asset=asset).exists()
              successful=MerchantWalletChallenge.objects.filter(
                  asset=asset, used_at__isnull=False, verified_at__isnull=False
              ).exists()
              print("MPW_FRESH_"+asset+"_PROOF_ROW_PRESENT="+str(valid))
              print("MPW_FRESH_"+asset+"_VALID_CHALLENGE_EXISTS="+str(successful))
          print("MPW_FRESH_PRIVATE_PROOF_PAGE_ROUTED="+str(
              reverse("mpw_wallet_proof:page")=="/merchant/wallet-proof/"
          ))
          print("MPW_FRESH_ACTIVE_PRODUCTS="+str(Product.objects.filter(active=True).count()))
          print("MPW_FRESH_ORDERS="+str(Order.objects.count()))
          print("MPW_FRESH_PAYMENT_INTENTS="+str(PaymentIntent.objects.count()))
          for flag in ("MPW_COMMERCE_RELEASE_READY","MPW_COMMERCE_INVOICING_ENABLED",
                       "MPW_COMMERCE_SETTLEMENT_ENABLED","MPW_COMMERCE_CUSTOMER_HTTP_ENABLED",
                       "MPW_COMMERCE_REAL_RPC_ENABLED"):
              print("MPW_FRESH_FLAG_"+flag+"="+str(getattr(settings,flag,False) is True))
          print("MPW_FRESH_READ_ONLY_NO_SIGNING_NO_PAYMENT_NO_DEPLOY=True")
          PY
          REMOTE
      - name: Remove transient keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-root-audit"
