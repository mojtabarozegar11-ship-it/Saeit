name: ComfyUI CPU Image Studio - Preset Runner
on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select a prepared demo scene
        type: choice
        required: true
        default: orchard
        options: [orchard, greenhouse, product, abstract]
      steps:
        description: Diffusion sampling steps (CPU; more steps require more time)
        type: choice
        required: true
        default: '8'
        options: ['4', '8', '12']
permissions:
  contents: read
concurrency:
  group: saeit-comfyui-public-preview-runner
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download verified official CPU renderer and public test model
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/saeit-image-proof"
          mkdir -p "$d"
          curl -fsSL --retry 2 --max-time 180 \
            https://github.com/leejet/stable-diffusion.cpp/releases/download/master-964-1d0a58a/sd-master-1d0a58a-bin-Linux-Ubuntu-24.04-x86_64.zip \
            -o "$d/engine.zip"
          echo '2c2e6d4c0ad6a183283bda586e6e42c946eebfd9019278405d31763920ac36fa  '"$d/engine.zip" | sha256sum -c
          unzip -q "$d/engine.zip" -d "$d/engine"
          exe="$(find "$d/engine" -type f -name sd-cli -print -quit)"
          test -n "$exe"
          chmod +x "$exe"
          echo "CPU_EXE=$exe" >> "$GITHUB_ENV"
          echo "CPU_LIB_DIR=$(dirname "$exe")" >> "$GITHUB_ENV"
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 500 \
            https://huggingface.co/turingevo/tiny-sd-safetensors/resolve/main/segmind_tiny-sd.safetensors \
            -o "$d/model.safetensors"
          echo '92e00b860c409f8cfc521a94f779009c6ebd28bf07670bf50e747682ab7b3b72  '"$d/model.safetensors" | sha256sum -c
          echo "CPU_MODEL=$d/model.safetensors" >> "$GITHUB_ENV"
          echo "CPU_RENDER_OUTPUT=$d/smoke.png" >> "$GITHUB_ENV"
          echo CPU_RUNNER_SOURCES_SHA256_VERIFIED
      - name: Generate a real 512px image on the isolated 7 GB runner
        shell: bash
        env:
          REQUESTED_PRESET: ${{ inputs.preset }}
          REQUESTED_STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          case "${REQUESTED_PRESET:-orchard}" in
            orchard) prompt="a peaceful almond orchard in warm afternoon sunshine, artistic landscape painting" ;;
            greenhouse) prompt="healthy green seedlings growing in a modern bright greenhouse, painterly illustration" ;;
            product) prompt="botanical green product package on a wooden table, soft studio lighting, illustrative art" ;;
            abstract) prompt="abstract botanical emerald green and warm golden leaves, textured artistic composition" ;;
            *) echo "INVALID_PRESET"; exit 2 ;;
          esac
          case "${REQUESTED_STEPS:-8}" in
            4|8|12) steps="${REQUESTED_STEPS:-8}" ;;
            *) echo "INVALID_STEPS"; exit 2 ;;
          esac
          export LD_LIBRARY_PATH="$CPU_LIB_DIR"
          export OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2
          timeout 540s nice -n 10 "$CPU_EXE" \
            -m "$CPU_MODEL" -p "$prompt" \
            -W 512 -H 512 --steps "$steps" --seed "${GITHUB_RUN_NUMBER:-42}" --cfg-scale 7 \
            --sampling-method euler_a --diffusion-fa -o "$CPU_RENDER_OUTPUT"
          python3 - "$CPU_RENDER_OUTPUT" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n") and len(data)>1000
          assert struct.unpack(">II", data[16:24]) == (512,512)
          print("ISOLATED_REAL_IMAGE_PNG_VERIFIED")
          print("ISOLATED_IMAGE_BYTES="+str(len(data)))
          print("ISOLATED_IMAGE_SHA256="+hashlib.sha256(data).hexdigest())
          PY
      - name: Verify output and create a non-commercial quality report
        shell: bash
        env:
          REQUESTED_PRESET: ${{ inputs.preset }}
          REQUESTED_STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 ops/comfyui-vps/image_quality_report.py "$CPU_RENDER_OUTPUT" \
            --engine github-runner-cpu \
            --preset "${REQUESTED_PRESET:-orchard}" \
            --steps "${REQUESTED_STEPS:-8}" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/saeit-image-proof/quality_report.json"
          python3 - "$RUNNER_TEMP/saeit-image-proof/quality_report.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding="utf-8"))
          assert obj["technical_png_valid"] is True
          assert obj["publish_allowed"] is False
          assert obj["commercial_ready"] is False
          assert obj["manual_review_required"] is True
          with open(sys.argv[1],encoding="utf-8") as f:
              assert json.load(f)["sha256"] == obj["sha256"]
          print("STUDIO_PROTOTYPE_DELIVERY_ALLOWED_STORE_RELEASE_BLOCKED")
          PY
          python3 ops/comfyui-vps/verify_artifact_pair.py \
            "$CPU_RENDER_OUTPUT" "$RUNNER_TEMP/saeit-image-proof/quality_report.json" \
            --engine github-runner-cpu
          echo "INTEGRITY_QA_BUNDLE_VERIFIED_AND_STORE_PUBLISH_DISABLED"
          echo "### Saeit CPU Studio result" >> "$GITHUB_STEP_SUMMARY"
          echo "PNG verified; experimental preview only; **not approved for sale**." >> "$GITHUB_STEP_SUMMARY"
          echo "Download image and quality_report.json from Artifacts." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: comfyui-cpu-companion-512px-proof
          path: |
            ${{ runner.temp }}/saeit-image-proof/smoke.png
            ${{ runner.temp }}/saeit-image-proof/quality_report.json
          retention-days: 7
          if-no-files-found: error
