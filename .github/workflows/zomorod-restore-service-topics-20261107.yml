name: Restore exact agricultural service intent links after logo overwrite
on:
  push:
    branches: [fix/zm-guard-logo-service-inquiry-20261107]
    paths:
      - scripts/zomorod_restore_service_topics_20261107.py
      - .github/workflows/zomorod-restore-service-topics-20261107.yml
permissions:
  contents: read
concurrency:
  group: zm-service-topic-recovery-single-writer
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate narrow one-file recovery and future logo guard
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_restore_service_topics_20261107.py scripts/deploy_zomorod_transparent_logo.py
          python3 scripts/zomorod_restore_service_topics_20261107.py selftest
          python3 -m unittest discover -s tests -p test_zomorod_logo_preserves_service_links.py -v
      - name: Authenticate pinned cPanel direct or pinned VPS relay
        id: link
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-service-recovery-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known','vps.known'), ('host.candidate','host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY','vps.key'), ('HOST_KEY','host.key')]:
              value = os.environ.get(env_key,'')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n','\n').replace('\r','').replace('\\n','\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/services/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/services/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Guarded read-only origin version check
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-service-recovery-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/zomorod_restore_service_topics_20261107.py
      - name: Back up and repair only three static offer URLs
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-service-recovery-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_restore_service_topics_20261107.py
      - name: Verify exact origin and three live form journeys, GET only
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-service-recovery-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_restore_service_topics_20261107.py
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          base='https://zomorodmelal.ir'
          with urlopen(Request(base+'/services/?recovery='+__import__('os').environ['GITHUB_RUN_ID'],headers={'Cache-Control':'no-cache'}),timeout=27) as response:
              html=response.read(130000).decode('utf-8')
              assert response.status==200
          names={'economics':'ارزیابی اقتصادی', 'water':'مدیریت آب', 'feasibility':'امکان‌سنجی'}
          for topic, name in names.items():
              assert html.count('href="/ask-master/index.php?service=1&amp;topic='+topic+'"')==1,topic
              with urlopen(Request(base+'/ask-master/index.php?service=1&topic='+topic),timeout=27) as response:
                  form=response.read(120000).decode('utf-8')
                  csp=response.headers.get('Content-Security-Policy','')
                  assert response.status==200 and "default-src 'none'" in csp
              assert 'name="service_topic" value="'+topic+'"' in form
              print('LIVE_SPECIALIST_GET_OK='+topic)
          print('PUBLIC_SERVICE_INTENT_RECOVERED=1')
          PY
      - name: Undo only our three-link change on failed verification
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-service-recovery-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_restore_service_topics_20261107.py
