name: MojPlayWin founder biography single-H1 exact release
on:
  pull_request:
    paths:
      - "scripts/mpw_founder_heading_atomic_20261019.py"
      - "tests/test_mpw_founder_heading_20261019.py"
      - ".github/workflows/mojplaywin-founder-heading-20261019.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mpw_founder_heading_atomic_20261019.py"
      - ".github/workflows/mojplaywin-founder-heading-20261019.yml"
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  preflight-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify founder headings with no live changes
        run: |
          python3 -m py_compile scripts/mpw_founder_heading_atomic_20261019.py
          python3 -m pip install -q pytest
          python3 -m pytest -q --noconftest tests/test_mpw_founder_heading_20261019.py
  publish-founder-heading:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[approved-mpw-founder-h1-20261019]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Ensure exact founder static route and validate source tests
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 -m pytest -q --noconftest tests/test_mpw_founder_heading_20261019.py
          python3 - <<'PY'
          import urllib.request,hashlib,time
          base='https://mojplaywin.com'
          def get(path):
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=19) as r:
                          if r.status!=200:raise RuntimeError("Public route not healthy")
                          return r.read(1600000)
                  except Exception:
                      if i==2:raise
                      time.sleep(2)
          live=get('/about/mojtaba-rozegar/')
          direct=get('/design-preview-20261017/mpw-ten-editorials-20261018/pages/about-mojtaba-rozegar.html')
          if hashlib.sha256(live).digest()!=hashlib.sha256(direct).digest():
              raise SystemExit('Founder route not served by exact permitted file')
          for p in ('/about/','/company/','/store/','/mojtaba.roozegar/'):get(p)
          print('FOUNDER_EXACT_STATIC_ROUTE=VERIFIED')
          PY
      - name: Open host-key-pinned relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Publish only founder static heading repair atomically
        id: publish
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 70s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID'" < scripts/mpw_founder_heading_atomic_20261019.py
      - name: Verify founder H1 first and original portrait and company pages
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import urllib.request,os,time
          class C(HTMLParser):
              def __init__(self):super().__init__();self.main=False;self.headings=[]
              def handle_starttag(self,t,a):
                  if t=='main':self.main=True
                  if self.main and t in ('h1','h2','h3','h4'):self.headings.append(t)
              def handle_endtag(self,t):
                  if t=='main':self.main=False
          success=False
          for attempt in range(4):
              try:
                  url='https://mojplaywin.com/about/mojtaba-rozegar/?profile_revision='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=18) as r:
                      body=r.read(1500000).decode('utf-8','replace')
                  parser=C();parser.feed(body)
                  success=(parser.headings[0]=='h1' and parser.headings.count('h1')==1 and
                           'MPW_FOUNDER_HEADING_A11Y_20261019' in body and
                           'official_profile_20261016' in body and
                           'mpw-research30-title-about-mojtaba-rozegar' in body)
                  if success:break
              except Exception as e:print('PROFILE_CHECK_RETRY',type(e).__name__)
              time.sleep(2)
          if not success:raise SystemExit('Founder semantic release not verified')
          print('FOUNDER_H1_FIRST_LIVE=VERIFIED')
          PY
      - name: Safe rollback if founder live verification fails
        if: failure() && steps.publish.outcome == 'success'
        run: |
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_founder_heading_atomic_20261019.py
