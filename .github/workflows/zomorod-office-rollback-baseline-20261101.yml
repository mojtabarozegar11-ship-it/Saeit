name: Encrypt off-host Zomorod office cutover-sensitive rollback baseline
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-rollback-baseline-20261101.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-private-office-rollback-baseline
  cancel-in-progress: false
jobs:
  baseline:
    if: github.event.action == 'opened' && github.head_ref == 'ops/zomorod-office-rollback-baseline-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "IMMUTABLE_HEAD_CHECKOUT=verified"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-office-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-company-office/office.sqlite3' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-company-office/office.sqlite3' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Capture seven exact cutover-sensitive files without host writes
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-office-ro"
          plain="$RUNNER_TEMP/zm-office-rollback-plain-$GITHUB_RUN_ID"
          mkdir -m 700 "$plain"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 120s ssh -F "$d/config" "$COMMAND_HOST" bash -se > "$plain/cutover-baseline.tar" <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import hashlib,io,json,os,pathlib,stat,sys,tarfile,time
          root=pathlib.Path("/home/zomorod2")
          rels=[
            "public_html/.htaccess",
            "public_html/company/.htaccess",
            "Saeit/passenger_wsgi.py",
            "Saeit/config/settings.py",
            "Saeit/config/urls.py",
            "Saeit/requirements.txt",
            ".private/zomorod-company-office/office.env",
          ]
          captured={}
          details={}
          for rel in rels:
              path=root/rel
              fd=os.open(path,os.O_RDONLY|getattr(os,"O_NOFOLLOW",0))
              try:
                  before=os.fstat(fd)
                  assert stat.S_ISREG(before.st_mode) and 0<before.st_size<10_000_000
                  with os.fdopen(os.dup(fd),"rb") as f:
                      data=f.read()
                  after=os.fstat(fd)
              finally:
                  os.close(fd)
              assert len(data)==before.st_size
              assert (before.st_size,before.st_mtime_ns,before.st_ino)==(after.st_size,after.st_mtime_ns,after.st_ino)
              captured[rel]=data
              details[rel]={"sha256":hashlib.sha256(data).hexdigest(),"size":len(data),"mode":stat.S_IMODE(before.st_mode),"mtime_ns":before.st_mtime_ns}
          with tarfile.open(fileobj=sys.stdout.buffer,mode="w|",format=tarfile.PAX_FORMAT) as archive:
              for rel,data in captured.items():
                  info=tarfile.TarInfo("site/"+rel)
                  info.size=len(data)
                  info.mode=details[rel]["mode"]
                  info.mtime=details[rel]["mtime_ns"]//1_000_000_000
                  info.uid=0
                  info.gid=0
                  info.uname=""
                  info.gname=""
                  archive.addfile(info,io.BytesIO(data))
              manifest=json.dumps({"schema":"zm-office-sensitive-rollback.v1","files":details},sort_keys=True,separators=(",",":")).encode()
              info=tarfile.TarInfo("manifest.json")
              info.size=len(manifest)
              info.mode=0o600
              info.mtime=int(time.time())
              archive.addfile(info,io.BytesIO(manifest))
          for rel in rels:
              path=root/rel
              current=path.stat(follow_symlinks=False)
              assert stat.S_ISREG(current.st_mode)
              assert current.st_size==details[rel]["size"] and current.st_mtime_ns==details[rel]["mtime_ns"]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==details[rel]["sha256"]
          PY
          REMOTE
          test -s "$plain/cutover-baseline.tar"
          echo "LIVE_FILES_CHANGED=false"
          echo "SENSITIVE_ROLLBACK_BASELINE_CAPTURE=completed"
      - name: Independently unpack and validate two isolated restore simulations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B - "$RUNNER_TEMP/zm-office-rollback-plain-$GITHUB_RUN_ID" <<'PY'
          import hashlib,json,os,pathlib,stat,sys,tarfile
          root=pathlib.Path(sys.argv[1])
          expected={
            "public_html/.htaccess",
            "public_html/company/.htaccess",
            "Saeit/passenger_wsgi.py",
            "Saeit/config/settings.py",
            "Saeit/config/urls.py",
            "Saeit/requirements.txt",
            ".private/zomorod-company-office/office.env",
          }
          with tarfile.open(root/"cutover-baseline.tar","r:") as archive:
              members=archive.getmembers()
              assert len(members)==8
              names={m.name for m in members}
              assert names=={"manifest.json"}|{"site/"+n for n in expected}
              assert all(m.isfile() and m.size<10_000_000 for m in members)
              manifest=json.load(archive.extractfile("manifest.json"))
              assert manifest["schema"]=="zm-office-sensitive-rollback.v1"
              assert set(manifest["files"])==expected
              for rel in sorted(expected):
                  name="site/"+rel
                  data=archive.extractfile(name).read()
                  item=manifest["files"][rel]
                  assert len(data)==item["size"]
                  assert hashlib.sha256(data).hexdigest()==item["sha256"]
                  assert stat.S_IMODE(item["mode"])==item["mode"]
                  for index in (1,2):
                      target=root/f"restore-{index}"/name
                      target.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                      with target.open("xb") as output:
                          output.write(data)
                      target.chmod(item["mode"])
                      os.utime(target,ns=(item["mtime_ns"],item["mtime_ns"]))
                      assert target.stat().st_size==item["size"]
                      assert stat.S_IMODE(target.stat().st_mode)==item["mode"]
                      assert target.stat().st_mtime_ns==item["mtime_ns"]
                      assert hashlib.sha256(target.read_bytes()).hexdigest()==item["sha256"]
          print("ROLLBACK_BASELINE_INDEPENDENT_RESTORE=passed")
          print("RESTORE_SIMULATION_COUNT=2")
          print("CUTOVER_SENSITIVE_FILE_COUNT=7")
          PY
      - name: Authenticated public-key encryption and cleartext removal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plain="$RUNNER_TEMP/zm-office-rollback-plain-$GITHUB_RUN_ID"
          dest="$RUNNER_TEMP/zm-office-rollback-encrypted-$GITHUB_RUN_ID"
          mkdir -m 700 "$dest"
          python3 -c 'import cryptography'
          expected="$(sha256sum "$plain/cutover-baseline.tar" | cut -d' ' -f1)"
          python3 scripts/f01_encrypted_stream_v1.py encrypt --input "$plain/cutover-baseline.tar" --output "$dest/cutover-baseline.tar.f01enc" --public-key security/factory_recovery_public_20261030.pem
          test -s "$dest/cutover-baseline.tar.f01enc"
          printf 'format=F01ENC-RSA3072-AES256GCM-V1\nbaseline_tar_sha256=%s\nfile_count=7\nrestore_simulations=2\n' "$expected" > "$dest/manifest.txt"
          rm -rf -- "$plain"
          echo "ROLLBACK_BASELINE_ENCRYPTED=verified"
          echo "ROLLBACK_BASELINE_CIPHERTEXT_SHA256=$(sha256sum "$dest/cutover-baseline.tar.f01enc" | cut -d' ' -f1)"
          echo "HOST_ROUTING_CHANGED=false"
      - name: Publish only encrypted rollback-sensitive baseline
        uses: actions/upload-artifact@v4
        with:
          name: zm-office-rollback-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zm-office-rollback-encrypted-${{ github.run_id }}/cutover-baseline.tar.f01enc
            ${{ runner.temp }}/zm-office-rollback-encrypted-${{ github.run_id }}/manifest.txt
          retention-days: 30
          if-no-files-found: error
      - name: Remove relay keys, plaintext and encrypted staging copies
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-office-ro"
          rm -rf -- "$RUNNER_TEMP/zm-office-rollback-plain-$GITHUB_RUN_ID"
          rm -rf -- "$RUNNER_TEMP/zm-office-rollback-encrypted-$GITHUB_RUN_ID"
