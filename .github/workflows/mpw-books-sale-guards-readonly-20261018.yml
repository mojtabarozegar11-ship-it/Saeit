name: MojPlayWin books final sales guards readonly
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-books-sale-guards-readonly-20261018.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify eligible books and existing checkout gates
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 130s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,pathlib
          h=pathlib.Path('/home/zomorod2');r=h/'Saeit-staging';sys.path.insert(0,str(r));os.chdir(r)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product
          from django.conf import settings
          from mpw_commerce import product_checkout_page
          for name in ('APPROVAL_FLAGS','FLAGS'):
           v=getattr(product_checkout_page,name,None)
           print('BOOKS_RELEASE_GATES='+json.dumps({'name':name,'value':sorted(v) if isinstance(v,(tuple,list,set)) else []}))
          for pk in (72,225):
           p=Product.objects.select_related('knowledge_article').get(pk=pk)
           m=p.metadata or {}; config=m.get('mpw_commerce',{})
           print('BOOKS_SALE_STATUS='+json.dumps({'id':pk,'knowledge_published':getattr(p.knowledge_article,'published',False),'knowledge_present':p.knowledge_article_id is not None,'owner_record':p.owner_id is not None,'active':p.active,'type':p.product_type,'commerce_enabled':config.get('enabled'),'private_file_configured':bool(config.get('private_file')),'main_pdf_file_prepared':m.get('mpw_private_file_prepared'),'quality_gate':m.get('quality_approved'),'rights_gate':m.get('license_verified')}))
          for flag in ('MPW_COMMERCE_RELEASE_READY','MPW_COMMERCE_INVOICING_ENABLED','MPW_COMMERCE_AUTORECONCILE_ENABLED','MPW_COMMERCE_SETTLEMENT_ENABLED','MPW_COMMERCE_REAL_RPC_ENABLED','MPW_COMMERCE_DOWNLOADS_ENABLED'):
           print('BOOKS_CHECKOUT_SWITCH='+json.dumps({'name':flag,'enabled':getattr(settings,flag,False) is True}))
          from mpw_commerce.models import CommerceInvoice,CommerceReceipt,CommerceFulfillment
          print('BOOKS_COMMERCE_COUNTS='+json.dumps({'invoices':CommerceInvoice.objects.count(),'receipts':CommerceReceipt.objects.count(),'fulfillment_grants':CommerceFulfillment.objects.count()}))

          PY
          BASH
