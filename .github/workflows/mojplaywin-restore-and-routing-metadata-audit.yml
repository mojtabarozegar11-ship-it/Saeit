name: MojPlayWin restoration absolute-link safety classification
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths:
      - ".github/workflows/mojplaywin-restore-and-routing-metadata-audit.yml"
permissions:
  contents: read
jobs:
  archive-and-routing-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Audit rewrite rule categories and possible independently served home
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 45s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import re,json
          root=Path("/home/zomorod2/mojplaywin.com")
          h=root/".htaccess"
          if root.is_symlink() or h.is_symlink() or not h.is_file():raise SystemExit(4)
          rows=[]
          for raw in h.read_text(errors="replace").splitlines():
              a=raw.strip().split()
              if not a or a[0].startswith("#"):continue
              name=a[0].lower()
              data={"directive":name}
              if name=="rewriterule":
                  expr=a[1] if len(a)>1 else ""
                  data.update({
                    "matches_exact_root":expr in ("^$","^/$"),
                    "matches_anything":expr in ("^.*$","^(.*)$",".*"),
                    "flags_are_last_only":len(a)>3 and "[L" in a[3].upper(),
                    "rewrites_to_php":len(a)>2 and a[2].endswith(".php"),
                    "rewrites_to_html":len(a)>2 and a[2].endswith(".html")
                  })
              if name=="rewritecond":
                  data.update({"checks_existing_file":len(a)>2 and "-f" in a[-1],
                               "checks_directory":len(a)>2 and "-d" in a[-1]})
              rows.append(data)
          print(json.dumps({"classification":"PUBLICATION_ROUTING_DIRECTIVE_AUDIT","directives":rows,
                            "production_changed":False,"release_permitted":False},sort_keys=True))
          PY
      - name: Verify actual encrypted backup archive member types and symlink safety without restoration
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          audit64="$(base64 -w0 scripts/mojplaywin_backup_restore_metadata_vps.py)"
          recover64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          invoke="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          echo "Auditing manifest-verified encrypted tar file from VPS without exposing bytes or filenames."
          timeout 1250s ssh -T -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -F "$d/config" saeit-vps "python3 -c '$invoke' '$audit64' '$recover64'"
