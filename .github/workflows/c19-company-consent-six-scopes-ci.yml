name: C19 company consent and six service scope source assurance
on:
  push:
    branches:
      - fix/c19-company-consented-django-service-conversion-20261114
    paths:
      - core/company_content_views.py
      - core/services_views.py
      - core/templates/core/platform_page.html
      - core/templates/core/services.html
      - tests/test_company_inquiry_validation_20261106.py
      - tests/test_company_consent_scopes_c19_20261114.py
      - .github/workflows/c19-company-consent-six-scopes-ci.yml
  pull_request:
    paths:
      - core/company_content_views.py
      - core/services_views.py
      - core/templates/core/platform_page.html
      - core/templates/core/services.html
      - tests/test_company_inquiry_validation_20261106.py
      - tests/test_company_consent_scopes_c19_20261114.py
      - .github/workflows/c19-company-consent-six-scopes-ci.yml
permissions:
  contents: read
jobs:
  consented-sales-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Django project requirements
        run: python -m pip install -r requirements.txt
      - name: Check schema changes not required
        env:
          SECRET_KEY: c19-local-ci-secret
          DEBUG: "False"
          ALLOWED_HOSTS: testserver,localhost,127.0.0.1,zomorodmelal.ir,mojplaywin.com
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Prepare static manifest as in authoritative Django CI
        env:
          SECRET_KEY: c19-local-ci-secret
          DEBUG: "False"
          ALLOWED_HOSTS: testserver,localhost,127.0.0.1,zomorodmelal.ir,mojplaywin.com
        run: python manage.py collectstatic --noinput
      - name: Existing plus new exact source-boundary tests
        env:
          SECRET_KEY: c19-local-ci-secret
          DEBUG: "False"
          ALLOWED_HOSTS: testserver,localhost,127.0.0.1,zomorodmelal.ir,mojplaywin.com
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_company_inquiry_validation_20261106.py tests/test_company_consent_scopes_c19_20261114.py
          echo "C19_CUSTOMER_MESSAGES_SENT=0"
          echo "C19_SITE_DEPLOYS=0"
          echo "C19_EXTERNAL_PAYMENTS=0"
