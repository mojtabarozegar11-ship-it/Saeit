name: MojPlayWin isolated twelve-offer revenue hub release 2026-10-20
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-revenue-hub-safe-release-20261020.yml"
      - "scripts/mpw_revenue_hub_release_20261020.py"
permissions: {contents: read}
concurrency:
  group: mpw-revenue-hub-main-only
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate twelve SEO-ready service pages and fail-closed payment copy
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_revenue_hub_release_20261020.py
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('mpw_revenue_20261020/earn')
          data=json.loads((root/'catalog.json').read_text())
          offers=data['offers']
          assert len(offers)==12 and len({p['slug'] for p in offers})==12
          for p in offers:
              file=root/p['slug']/'index.html'
              html=file.read_text()
              assert '<html lang="en">' in html and '<meta name="description"' in html
              assert '<link rel="canonical" href="https://mojplaywin.com/earn/'+p['slug']+'/"' in html
              assert 'No payment is collected on this page' in html and '/contact/' in html
          assert (root/'index.html').read_text().count('Details, terms &amp; next steps') == 12
          assert (root/'sitemap.xml').read_text().count('<url>')==13
          print('MPW_12_OFFERS_SEO_AND_NO_FAKE_CHECKOUT=PASS')
          PY
          tar -czf "$RUNNER_TEMP/mpw-revenue-hub.tgz" -C mpw_revenue_20261020 earn
      - name: Record original main and protected subsite HTTP states
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          protected=['/','/store/','/contact/','/farnaz/','/saman/','/taniya/','/picm/']
          out={}
          for path in protected:
              try:
                  r=urllib.request.urlopen(urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPWRevenuePreflight/1.0'}),timeout=18)
                  out[path]=r.status
              except urllib.error.HTTPError as e:out[path]=e.code
          assert out.get('/')==200 and out.get('/store/')==200, out
          open(os.environ['RUNNER_TEMP']+'/mpw-revenue-baseline.json','w').write(json.dumps(out))
          print('MPW_MAIN_AND_CHILD_BASELINE='+json.dumps(out))
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only live checkout flag audit without revealing credentials
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import json,os,sys
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          if not app.is_dir() or app.is_symlink():raise RuntimeError('App identity unverified')
          os.chdir(app);sys.path.insert(0,str(app));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.conf import settings
          flags=['MPW_COMMERCE_RELEASE_READY','MPW_COMMERCE_CUSTOMER_HTTP_ENABLED','MPW_COMMERCE_INVOICING_ENABLED','MPW_COMMERCE_SETTLEMENT_ENABLED','MPW_COMMERCE_REAL_RPC_ENABLED','MPW_COMMERCE_AUTORECONCILE_ENABLED','MPW_COMMERCE_DOWNLOADS_ENABLED']
          print('MPW_REAL_PAYMENT_RUNTIME_FLAGS='+json.dumps({k:getattr(settings,k,False) is True for k in flags}))
          print('MPW_FINANCIAL_TRANSACTIONS_CREATED=0')
          PY
      - name: Install only main-site static earn directory
        id: publish
        run: |
          set -euo pipefail
          script="$(base64 -w0 scripts/mpw_revenue_hub_release_20261020.py)"
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))' publish '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/mpw-revenue-hub.tgz"
      - name: Inspect published main-only static file permissions
        run: |
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel python3 - <<'PY'
          import os,json,stat
          from pathlib import Path
          root=Path('/home/zomorod2/mojplaywin.com')
          for rel in ('mpw-editorial/revenue','mpw-editorial/revenue/index.html','mpw-editorial/revenue/assets','mpw-editorial/revenue/assets/style.css','mpw-editorial/revenue/website-doctor','mpw-editorial/revenue/website-doctor/index.html'):
              p=root/rel
              if not p.exists() or p.is_symlink():raise RuntimeError('Missing or symlinked '+rel)
              st=p.stat()
              print('MPW_EARN_REAL_STAT='+json.dumps(dict(path=rel,mode=oct(stat.S_IMODE(st.st_mode)),uid=st.st_uid,gid=st.st_gid,readable_world=bool(st.st_mode & stat.S_IROTH))))
              if p.is_dir() and not (st.st_mode & stat.S_IXOTH):raise RuntimeError('Not traversable by webserver: '+rel)
          PY
      - name: Verify every revenue page, metadata and protected routes
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          data=json.load(open('mpw_revenue_20261020/earn/catalog.json'))
          paths=['/mpw-editorial/revenue/']+['/mpw-editorial/revenue/'+p['slug']+'/' for p in data['offers']]
          for path in paths:
              ok=False
              for trial in range(5):
                  try:
                      req=urllib.request.Request('https://mojplaywin.com'+path+'?release='+str(time.time_ns()),headers={'Cache-Control':'no-cache','User-Agent':'MPWRevenueSmoke/1.0'})
                      with urllib.request.urlopen(req,timeout=22) as response:
                          html=response.read(180000).decode('utf8','replace')
                          ok=response.status==200 and ('href="https://mojplaywin.com'+path+'"') in html and '</html>' in html and '<title>' in html
                          if not ok:print('MPW_PUBLIC_READBACK',path,response.status,response.geturl(),'canonical=',('href="https://mojplaywin.com'+path+'"') in html,'html_end=',('</html>' in html),'title=',('<title>' in html),'prefix=',repr(html[:135]))
                  except Exception as exc:
                      ok=False
                      print('MPW_PUBLIC_ERROR',path,type(exc).__name__,getattr(exc,'code',None),str(exc)[:160])
                  if ok:break
                  time.sleep(3)
              if not ok:raise RuntimeError('Public revenue page failed: '+path)
              print('MPW_REVENUE_LIVE='+path)
          expected=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-revenue-baseline.json'))
          for path,status in expected.items():
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+path,timeout=18) as r:new=r.status
              except urllib.error.HTTPError as e:new=e.code
              if new!=status:raise RuntimeError('Protected route changed: '+path)
          print('MPW_REVENUE_12_PAGES_LIVE_AND_CHILD_ROUTE_STATUS=PASS')
          PY
      - name: Rollback only earn directory on release failure
        if: failure() && steps.publish.outcome == 'success'
        run: |
          script="$(base64 -w0 scripts/mpw_revenue_hub_release_20261020.py)"
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))' rollback '$GITHUB_RUN_ID'"
      - name: Clean runner relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh" "$RUNNER_TEMP/mpw-revenue-hub.tgz"
