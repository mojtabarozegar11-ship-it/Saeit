name: Verified Tala private SQLite backup
on:
  pull_request:
    paths:
      - ".github/scripts/tala_daily_backup.py"
      - ".github/workflows/zomorod-tala-backup.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/tala_daily_backup.py"
      - ".github/workflows/zomorod-tala-backup.yml"
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-tala-verified-backup
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated Tala database snapshot, integrity and restore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/tala_daily_backup.py
          python3 .github/scripts/tala_daily_backup.py selftest
  backup:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Tala-only VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/tala-backup-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF2
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF2
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Create an online SQLite snapshot and verify independent restoration
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tala-backup-ssh"
          sha="$GITHUB_SHA"
          scp -F "$d/config" .github/scripts/tala_daily_backup.py "saeit-cpanel:.tala-daily-backup-$sha.py"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_RUN_ID" "$sha" <<'REMOTE'
          set -euo pipefail
          umask 077
          runid="$1"
          sha="$2"
          script="$HOME/.tala-daily-backup-$sha.py"
          test -f "$script" && test ! -L "$script"
          chmod 600 "$script"
          command -v python3 >/dev/null
          python3 "$script" backup "$runid"
          echo 'TALA_LIVE_DATABASE=untouched'
          echo 'TALA_PUBLIC_HTML=untouched'
          echo 'TALA_OTHER_SUBSITES=untouched'
          REMOTE
