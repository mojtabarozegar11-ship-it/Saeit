name: MojTrade read-only VPS observer activation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojtrade-readonly-vps-observer
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated read-only market observer after actual market data preflight
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/mojtrade-vps-activate"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" 2>/dev/null || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          remote=githubops@178.239.147.150
          ssh "${opts[@]}" "$remote" 'test -x "$HOME/factory-runtime/.venv/bin/python" && install -d -m 700 "$HOME/factory-runtime/operations/mojtrade"'
          scp "${opts[@]}" scripts/mojtrade_observe_market.py "$remote:/home/githubops/factory-runtime/operations/mojtrade/observer.py.staged"
          scp "${opts[@]}" deploy/install_mojtrade_observer_vps.sh "$remote:/home/githubops/factory-runtime/operations/mojtrade/install.sh"
          expected_sha="$(sha256sum scripts/mojtrade_observe_market.py | awk '{print $1}')"
          ssh "${opts[@]}" "$remote" "bash /home/githubops/factory-runtime/operations/mojtrade/install.sh '$expected_sha'"
