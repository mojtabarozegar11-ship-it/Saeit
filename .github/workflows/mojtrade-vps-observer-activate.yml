name: MojTrade read-only VPS observer activation

on:
  workflow_dispatch:
    inputs:
      relay_retirement_ack:
        description: "Type RELAY_DISABLED_AND_REVIEWED after independent relay retirement approval"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mojtrade-readonly-vps-observer
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fail closed while GitHub relay is enabled or running
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_ACK: ${{ inputs.relay_retirement_ack }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = mojtabarozegar11-ship-it
          test "$OWNER_ACK" = RELAY_DISABLED_AND_REVIEWED
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          root = "https://api.github.com/repos/mojtabarozegar11-ship-it/Saeit/actions/workflows/mojtrade-readonly-relay.yml"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def fetch(url):
              with urlopen(Request(url, headers=headers), timeout=15) as response:
                  data = response.read(1_000_001)
                  if len(data) > 1_000_000:
                      raise RuntimeError("relay_metadata_oversized")
                  return json.loads(data)

          workflow = fetch(root)
          if workflow.get("state") != "disabled_manually":
              raise SystemExit("MOJTRADE_RELAY_NOT_MANUALLY_DISABLED")
          runs = fetch(root + "/runs?per_page=100")
          rows = runs.get("workflow_runs")
          if not isinstance(rows, list) or any(row.get("status") != "completed" for row in rows):
              raise SystemExit("MOJTRADE_RELAY_IN_FLIGHT_OR_UNVERIFIABLE")
          print("MOJTRADE_RELAY_RETIREMENT_GATE_PASS")
          PY
      - uses: actions/checkout@v4
      - name: Install isolated read-only market observer after actual market data preflight
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/mojtrade-vps-activate"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" 2>/dev/null || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          remote=githubops@178.239.147.150
          # Capacity and path gates must precede all mkdir, SCP and installer writes.
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE_PREFLIGHT'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test "$(id -un)" = githubops
          test -d "$base" && test ! -L "$base"
          test -d "$base/operations" && test ! -L "$base/operations"
          test -d "$base/private" && test ! -L "$base/private"
          for path in "$base/operations" "$base/private"; do
            free_kib="$(df -Pk "$path" | awk 'NR==2 {print $4}')"
            free_inodes="$(df -Pi "$path" | awk 'NR==2 {print $4}')"
            [[ "$free_kib" =~ ^[0-9]+$ && "$free_inodes" =~ ^[0-9]+$ ]] || {
              echo MOJTRADE_PREUPLOAD_STORAGE_METRICS_INVALID; exit 2;
            }
            (( free_kib >= 2113536 )) || {
              echo MOJTRADE_PREUPLOAD_DISK_RESERVE_BLOCKED; exit 2;
            }
            (( free_inodes >= 16 )) || {
              echo MOJTRADE_PREUPLOAD_INODE_RESERVE_BLOCKED; exit 2;
            }
          done
          echo MOJTRADE_PREUPLOAD_CAPACITY_PASS
          REMOTE_PREFLIGHT
          ssh "${opts[@]}" "$remote" 'test -x "$HOME/factory-runtime/.venv/bin/python" && install -d -m 700 "$HOME/factory-runtime/operations/mojtrade"'
          scp "${opts[@]}" scripts/mojtrade_observe_market.py "$remote:/home/githubops/factory-runtime/operations/mojtrade/observer.py.staged"
          scp "${opts[@]}" deploy/install_mojtrade_observer_vps.sh "$remote:/home/githubops/factory-runtime/operations/mojtrade/install.sh"
          expected_sha="$(sha256sum scripts/mojtrade_observe_market.py | awk '{print $1}')"
          ssh "${opts[@]}" "$remote" "bash /home/githubops/factory-runtime/operations/mojtrade/install.sh '$expected_sha'"
