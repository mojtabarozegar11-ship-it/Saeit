name: One-time verify hosting and VPS resource upgrades (read only)
on:
  push:
    branches:
      - ops/cpanel-factory-scope-20261028
    paths:
      - .github/workflows/cpanel-vps-upgrade-verify-20261028.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: SSH relay with pinned host fingerprints
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-cpanel-scope"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"" ).replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Read VPS physical resources and free disk
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-cpanel-scope"
          timeout 55s ssh -T -F "$d/config" saeit-vps python3 - <<'PY'
          import json,os,shutil,subprocess
          mem={}
          for l in open('/proc/meminfo'):
              k,_,v=l.partition(':')
              if k in ('MemTotal','MemAvailable','SwapTotal'):
                  mem[k]=int(v.strip().split()[0])*1024
          usage=shutil.disk_usage('/')
          try:
              p=subprocess.run(['lsblk','-b','-J','-o','NAME,SIZE,TYPE,MOUNTPOINT'],capture_output=True,text=True,timeout=12)
              blocks=json.loads(p.stdout).get('blockdevices',[]) if p.returncode==0 else []
              summary=[{'name':x.get('name'),'bytes':x.get('size'),'type':x.get('type'),'mountpoint':x.get('mountpoint')} for x in blocks if x.get('type')=='disk'][:8]
          except Exception:summary=[]
          print('VPS_CAPACITY='+json.dumps({'ram_bytes':mem.get('MemTotal'),'available_ram_bytes':mem.get('MemAvailable'),'swap_bytes':mem.get('SwapTotal'),'cpu_count':os.cpu_count(),'root_fs_total_bytes':usage.total,'root_fs_used_bytes':usage.used,'root_fs_free_bytes':usage.free,'block_disks':summary},sort_keys=True))
          PY
      - name: Read actual cPanel quota and account root
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-cpanel-scope"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import subprocess,json,socket
          p=subprocess.run(['uapi','--output=json','Quota','get_local_quota_info'],capture_output=True,text=True,timeout=28,check=True)
          j=json.loads(p.stdout)
          r=j.get('result',{})
          x=r.get('data',{})
          print('HOSTING_CAPACITY='+json.dumps({'status':r.get('status'),'byte_limit':x.get('byte_limit'),'bytes_used':x.get('bytes_used'),'inodes_used':x.get('inodes_used'),'inode_limit':x.get('inode_limit'),'hostname':socket.gethostname()},sort_keys=True))
          PY
      - name: Public DNS and origin checks
        shell: bash
        run: |
          set -u
          for domain in zomorodmelal.ir mojplaywin.com; do
            echo "DNS_PUBLIC=$domain"
            timeout 7s dig @1.1.1.1 "$domain" A +time=3 +tries=1 +noall +comments +answer 2>&1 | tail -n 8 || true
            curl --connect-timeout 5 --max-time 10 -I -sS -o /dev/null -w "PUBLIC_HTTP=$domain code=%{http_code} ip=%{remote_ip}\n" "https://$domain/" || true
            curl --connect-timeout 5 --max-time 10 -k -I -sS -o /dev/null -w "DIRECT_IP=$domain code=%{http_code}\n" --resolve "$domain:443:178.239.147.125" "https://$domain/" || true
          done
      - name: Clear temporary SSH keys
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/factory-cpanel-scope"
          if [ -d "$d" ]; then rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d" || true; fi
