name: MojPlayWin cohesive content architecture release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-content-architecture-release-20261027.yml
      - scripts/mpw_content_architecture_release_20261027.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-main-content-architecture
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated transformation rules
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_content_architecture_release_20261027.py
          python3 scripts/mpw_content_architecture_release_20261027.py selftest
      - name: Snapshot protected sibling site and commerce statuses
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os
          protected=('/','/store/','/store/product/72/','/store/product/225/','/store/product/879/','/games/','/taniya/','/farnaz/','/saman/','/picm/','/mojtaba.roozegar/')
          data={}
          for route in protected:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=25) as resp:
                      data[route]=resp.status
              except urllib.error.HTTPError as exc:data[route]=exc.code
          if data['/']!=200 or data['/store/']!=200 or data['/games/']!=200:raise RuntimeError('Main commercial baseline not healthy')
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mpw-content-architecture-status.json'),'w') as fh:json.dump(data,fh)
          print('PROTECTED_BASELINE',json.dumps(data,sort_keys=True))
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Preflight exact cPanel source hashes and archive paths
        run: |
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 - preflight' < scripts/mpw_content_architecture_release_20261027.py
      - name: Publish only the 18 verified main-page collections
        id: release
        run: |
          timeout 130s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_content_architecture_release_20261027.py
      - name: Verify live archives, semantic order and protected routes
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import json,os,sys,urllib.request,urllib.error,re
          sys.path.insert(0,'scripts')
          from mpw_content_architecture_release_20261027 import BASELINES,public_route,archive_route
          def fetch(route):
              with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=28) as resp:
                  return (route,resp.status,resp.read(400000).decode('utf-8','replace'))
          routes=[x for slug in BASELINES for x in (public_route(slug),archive_route(slug))]
          results={}
          with ThreadPoolExecutor(max_workers=7) as pool:
              tasks={pool.submit(fetch,route):route for route in routes}
              for task in as_completed(tasks):
                  route,status,html=task.result()
                  if status!=200:raise RuntimeError('Archive/page HTTP error: '+route)
                  results[route]=html
          for slug in BASELINES:
              page,archive=results[public_route(slug)],results[archive_route(slug)]
              if page.count('data-mpw-content-architecture="20261027"')!=2:raise RuntimeError('Summary missing '+slug)
              if 'id="mpw-ten-illustrated-20261018"' in page or 'id="mpw-research-editorials-20261019-' in page:raise RuntimeError('Legacy long-form page content '+slug)
              if page.find('</main>')<0 or page.find('<footer')<page.find('</main>'):raise RuntimeError('Semantic footer order '+slug)
              if 'id="mpw-ten-illustrated-20261018"' not in archive or 'id="mpw-research-editorials-20261019-' not in archive:raise RuntimeError('Missing archive content '+slug)
              if archive.find('</main>')<0 or archive.find('<footer')<archive.find('</main>'):raise RuntimeError('Archive landmark order '+slug)
              if 'href="'+archive_route(slug) not in page:raise RuntimeError('Disconnected archive '+slug)
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mpw-content-architecture-status.json')) as fh:protected=json.load(fh)
          for route,expected in protected.items():
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=25) as resp:actual=resp.status
              except urllib.error.HTTPError as exc:actual=exc.code
              if actual!=expected:raise RuntimeError('Protected route changed '+route+' '+str(expected)+'->'+str(actual))
          print('MPW_ARCHITECTURE_LIVE_PASS',len(BASELINES),'pages',len(BASELINES),'archives',len(protected),'protected routes')
          PY
      - name: Roll back architecture files on failed live verification
        if: failure() && steps.release.outcome == 'success'
        run: |
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_content_architecture_release_20261027.py
      - name: Clear ephemeral relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-structure-ssh"
          if [ -d "$d" ]; then shred -u "$d/vps.key" "$d/host.key" 2>/dev/null || true; fi
