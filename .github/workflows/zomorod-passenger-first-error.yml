name: Zomorod Passenger first-error diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-passenger-first-error.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-passenger-first-error
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-first-error"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read first and last Passenger exceptions without site changes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-first-error"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections,re
          home=Path.home()
          app=home/"Saeit"
          for rel in ("passenger_wsgi.py","config/wsgi.py","config/settings.py","core/middleware.py","core/__init__.py"):
              print("PRODUCTION_FILE "+rel+" "+("present" if (app/rel).is_file() else "missing"))
          ht=home/"public_html"/".htaccess"
          if ht.is_file():
              for line in ht.read_text(encoding="utf-8",errors="replace").splitlines():
                  if re.match(r"^\s*Passenger(?:Python|AppRoot)\s+",line):
                      key,value=line.strip().split(None,1)
                      print("PASSENGER_CONFIG "+key+"="+("selector_lswsgi" if "lswsgi" in value else "other_python" if key=="PassengerPython" else "correct" if value.strip('"')==str(app) else "unexpected"))
          log=app/"stderr.log"
          if not log.is_file():
              print("PASSENGER_LOG=missing");raise SystemExit(0)
          size=log.stat().st_size
          print("PASSENGER_LOG_BYTES="+str(size))
          with log.open("rb") as fp:
              chunks=[("oldest",fp.read(524288))]
              if size>524288:
                  fp.seek(max(524288,size-262144))
                  chunks.append(("newest",fp.read(262144)))
          kinds=("ModuleNotFoundError","ImportError","RuntimeError","ImproperlyConfigured","OperationalError","AttributeError","TypeError","SyntaxError","SystemError")
          for segment,data in chunks:
              lines=data.decode("utf-8","replace").splitlines()
              found=[]; counts=collections.Counter()
              for i,line in enumerate(lines):
                  name=next((k for k in kinds if re.match(r"^\s*"+k+r":",line)),None)
                  if name:
                      counts[name]+=1
                      msg=line.split(":",1)[1].strip()
                      if name=="ModuleNotFoundError":
                          m=re.search(r"No module named ['\"]([a-zA-Z0-9_.-]+)['\"]",msg)
                          detail=m.group(1) if m else "unknown"
                      elif name=="RuntimeError":
                          detail="reentrant" if "reentrant" in msg else "other"
                      else:
                          detail="present"
                      found.append((i,name,detail))
              print("LOG_SEGMENT="+segment+" ERRORS="+str(len(found)))
              for kind,count in counts.items():
                  print("ERROR_COUNT "+segment+" "+kind+"="+str(count))
              selected=found[:8]+found[-5:]
              for i,name,detail in selected:
                  print("ERROR "+segment+" line="+str(i)+" kind="+name+" detail="+detail)
                  for context in lines[max(0,i-15):i]:
                      m=re.search(r'File "([^"]+\.py)", line ([0-9]+)',context)
                      if m: print("TRACE_LOCATION "+segment+" "+Path(m.group(1)).name+":"+m.group(2))
          PY
          REMOTE
      - name: Check public Django and protected subsite routes
        shell: bash
        run: |
          set -euo pipefail
          for domain in zomorodmelal.ir staging.zomorodmelal.ir; do
            for route in /agriculture/ /agriculture/genetics/ /agents/ /api/health/; do
              code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$domain$route" || true)"
              echo "PUBLIC_HEALTH $domain$route $code"
            done
          done
          for route in /mohammad/ /ghanadi/ /amozeshgah/; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "PROTECTED_HEALTH $route $code"
          done
      - name: Remove temporary SSH keys
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-first-error"
