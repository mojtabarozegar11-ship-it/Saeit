name: Factory VPS Python via GitHub Runner
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-python-runner-install.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Download portable Python on runner and transfer securely
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          curl -fsSL --connect-timeout 10 --max-time 60 https://astral.sh/uv/install.sh -o "$RUNNER_TEMP/install-uv.sh"
          UV_INSTALL_DIR="$RUNNER_TEMP/uv-bin" sh "$RUNNER_TEMP/install-uv.sh" >/dev/null
          "$RUNNER_TEMP/uv-bin/uv" python install 3.11 --install-dir "$RUNNER_TEMP/python-managed"
          find "$RUNNER_TEMP/python-managed" -maxdepth 4 -name python3.11 | head -3
          tar -C "$RUNNER_TEMP/python-managed" -czf "$RUNNER_TEMP/factory-python311.tar.gz" .
          sha256sum "$RUNNER_TEMP/factory-python311.tar.gz"
          ssh -o ConnectTimeout=15 -F "$d/config" saeit-vps 'mkdir -p "$HOME/factory-runtime/python311"'
          cat "$RUNNER_TEMP/factory-python311.tar.gz" | ssh -o ConnectTimeout=15 -F "$d/config" saeit-vps 'cat > "$HOME/factory-runtime/python311.tar.gz"'
          ssh -o ConnectTimeout=15 -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          tar -xzf "$HOME/factory-runtime/python311.tar.gz" -C "$HOME/factory-runtime/python311"
          p=$(find "$HOME/factory-runtime/python311" -type f -name python3.11 | head -1)
          test -n "$p"
          "$p" --version
          "$p" -c 'import sys; assert sys.version_info[:2]==(3,11)'
          echo PORTABLE_PYTHON311_INSTALLED
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay" "$RUNNER_TEMP/python-managed" "$RUNNER_TEMP/factory-python311.tar.gz"
