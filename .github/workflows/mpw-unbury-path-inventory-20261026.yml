name: Read-only inspect preexisting MojPlayWin field-guides paths
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-unbury-path-inventory-20261026.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-readonly-existing-guide-inventory
  cancel-in-progress: false
jobs:
  inventory-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Establish pinned SSH relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-learning-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only exact path inventory on cPanel
        run: |
          set -euo pipefail
          timeout 65s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 -" <<'PY'
          import json,os,stat
          from pathlib import Path
          root=Path('/home/zomorod2/mojplaywin.com/mpw-editorial')
          for name in ('field-guides','site-directory'):
              p=root/name
              info={'target':str(p),'exists':p.exists(),'is_symlink':p.is_symlink(),
                    'is_dir':p.is_dir() and not p.is_symlink()}
              if info['is_dir']:
                  children=[]
                  def visit(folder,level):
                      if level>3 or len(children)>65:return
                      for e in sorted(os.scandir(folder),key=lambda v:v.name):
                          st=e.stat(follow_symlinks=False)
                          rel=str(Path(e.path).relative_to(p))
                          children.append({'name':rel,'type':('symlink' if e.is_symlink() else
                            'directory' if e.is_dir(follow_symlinks=False) else
                            'file' if e.is_file(follow_symlinks=False) else 'other'),
                            'size':st.st_size,'mode':oct(stat.S_IMODE(st.st_mode))})
                          if e.is_dir(follow_symlinks=False):visit(e.path,level+1)
                  visit(p,0)
                  info['entries']=children
              print('MPW_EXISTING_LEGACY_GUIDE_TARGET='+json.dumps(info,sort_keys=True))
          PY
      - name: Remove temporary relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-learning-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
