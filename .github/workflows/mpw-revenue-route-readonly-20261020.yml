name: MojPlayWin revenue route and document-root read-only diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-revenue-route-readonly-20261020.yml"]
permissions: {contents: read}
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect only main-domain static routing and host pin
        run: |
          timeout 70s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import json,re,stat
          root=Path('/home/zomorod2/mojplaywin.com')
          result={}
          for path in (root,root/'.htaccess',root/'mpw-editorial/index.html',root/'mpw-editorial',root/'earn',root/'passenger_wsgi.py',root/'design-preview-20261017'):
              result[str(path.relative_to(root) if path!=root else '.')]=dict(exists=path.exists(),symlink=path.is_symlink(),dir=path.is_dir(),file=path.is_file())
          print('MPW_DOCUMENT_ROOT_PATH_INVENTORY='+json.dumps(result))
          for item in (root/'mpw-editorial',root/'mpw-editorial/index.html',root/'mpw-editorial/.htaccess',root/'design-preview-20261017',root/'.htaccess',root/'passenger_wsgi.py'):
              if item.exists() and not item.is_symlink():
                  st=item.stat()
                  print('MPW_STATIC_FILE_PERMS='+json.dumps(dict(name=item.relative_to(root).as_posix(),mode=oct(stat.S_IMODE(st.st_mode)),uid=st.st_uid,gid=st.st_gid,is_dir=item.is_dir())))
                  if item.name=='.htaccess' and item!=root/'.htaccess' and item.is_file():
                      print('MPW_EDITORIAL_STATIC_HTACCESS='+json.dumps(item.read_text('utf8','replace').splitlines()[:70]))
          for hidden in (root/'mpw-editorial/.user.ini',root/'mpw-editorial/.htaccess',root/'design-preview-20261017/.htaccess',root/'mpw-editorial/revenue'):
              print('MPW_ADDITIONAL_FILE='+json.dumps(dict(path=hidden.relative_to(root).as_posix(),exists=hidden.exists(),symlink=hidden.is_symlink())))

          ht=(root/'.htaccess')
          if ht.is_file() and not ht.is_symlink():
              lines=ht.read_text('utf8','replace').splitlines()
              output=[]
              for n,line in enumerate(lines,1):
                  s=line.strip()
                  if s.startswith(('#','<')) or not re.match(r'(?i)^(Rewrite|Passenger|DirectoryIndex|FallbackResource|Options|Redirect|Alias)',s):continue
                  if re.search('(?i)(secret|token|password|api.key|Authorization|private|session|cookie)',s):continue
                  output.append(str(n)+':'+s[:230])
              print('MPW_HTACCESS_DIRECTIVES='+json.dumps(output[:140]))
              print('MPW_HTACCESS_TOTAL_LINES='+str(len(lines)))
          PY
      - name: Public known static and new static route baseline
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          for route in ('/mpw-editorial/index.html','/earn/','/earn/index.html','/store/','/robots.txt','/sitemap.xml'):
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=20) as r:
                      print('MPW_PUBLIC_ROUTE='+json.dumps(dict(path=route,status=r.status,final=r.geturl(),content_type=r.headers.get('Content-Type'))))
              except urllib.error.HTTPError as e:
                  print('MPW_PUBLIC_ROUTE='+json.dumps(dict(path=route,status=e.code)))
          PY
      - name: Read exact twelve-revenue files and static route health without mutation
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import json,stat,hashlib
          root=Path('/home/zomorod2/mojplaywin.com/mpw-editorial/revenue')
          slugs=('website-doctor','landing-page-studio','ai-automation','business-spreadsheets','website-templates','social-media-kits','resume-builder','logo-studio','browser-games','marketing-ai','business-calculators','website-care')
          targets=[root,root/'index.html',root/'assets/tools-v1.js',root/'assets/tools-v1.css',root/'assets/style.css',*[root/s/'index.html' for s in slugs]]
          for path in targets:
            if path.exists() and not path.is_symlink():
              info={'path':str(path.relative_to(root.parent)),'exists':True,'dir':path.is_dir(),'mode':oct(stat.S_IMODE(path.stat().st_mode)),'size':path.stat().st_size}
              if path.is_file() and path.stat().st_size<400000:
                data=path.read_bytes();info['sha_prefix']=hashlib.sha256(data).hexdigest()[:16]
                if path.suffix=='.html':
                  info['tool_present']=b'id="mpw-functional-tool"' in data
                  info['contains_contact']=b'/contact/' in data
            else: info={'path':str(path.relative_to(root.parent)),'exists':False,'symlink':path.is_symlink()}
            print('MPW_REVENUE_FILE_EXACT='+json.dumps(info,sort_keys=True))
          PY
      - name: Check all 13 revenue page statuses from external runner
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          names=('','website-doctor/','landing-page-studio/','ai-automation/','business-spreadsheets/','website-templates/','social-media-kits/','resume-builder/','logo-studio/','browser-games/','marketing-ai/','business-calculators/','website-care/')
          for name in names:
            path='/mpw-editorial/revenue/'+name+'index.html'
            try:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'Revenue12Audit/1.0'})
              with urllib.request.urlopen(req,timeout=12) as r: status=r.status;final=r.geturl()
            except urllib.error.HTTPError as e:status=e.code;final='error'
            except Exception as e:status=0;final=type(e).__name__
            print('MPW_REVENUE_PUBLIC_EXACT='+json.dumps({'path':path,'http':status,'final':final}))
          PY
      - name: Delete ephemeral SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
