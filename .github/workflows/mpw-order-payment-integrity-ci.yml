name: MojPlayWin order + payment evidence integrity (offline only)

on:
  push:
    branches:
      - fix/mpw-order-payment-integrity-20261114
    paths:
      - core/api.py
      - core/commerce_integrity.py
      - core/tests/test_mpw_order_payment_integrity_20261114.py
      - tests/test_mpw_commerce_integrity_20261114.py
      - core/tests/test_payment_webhook.py
      - .github/workflows/mpw-order-payment-integrity-ci.yml
  pull_request:
    paths:
      - core/api.py
      - core/commerce_integrity.py
      - core/tests/test_mpw_order_payment_integrity_20261114.py
      - tests/test_mpw_commerce_integrity_20261114.py
      - core/tests/test_payment_webhook.py
      - .github/workflows/mpw-order-payment-integrity-ci.yml

permissions:
  contents: read

concurrency:
  group: mpw-order-payment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-order-payment-no-write:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DEBUG: "true"
      SECRET_KEY: "offline-only-financial-test-key"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1,mojplaywin.com"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TRADE_EMAIL_ENABLED: "false"
      PAYMENT_WEBHOOK_SECRET: "offline-test-provider-hmac-not-production"
      PAYMENT_WEBHOOK_ALLOWED_PROVIDERS: ""
      CROWN_STORE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Compile financial contracts
        run: |
          python -m py_compile \
            core/api.py core/commerce_integrity.py \
            core/tests/test_mpw_order_payment_integrity_20261114.py \
            core/tests/test_payment_webhook.py \
            tests/test_mpw_commerce_integrity_20261114.py
      - name: Install existing pinned Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Strict pure commercial money and provider contracts
        run: python -m unittest discover -s tests -p 'test_mpw_commerce_integrity_20261114.py' -v
      - name: Isolated DB/API and existing commerce regression suites
        run: |
          python -m pytest -q \
            core/tests/test_mpw_order_payment_integrity_20261114.py \
            core/tests/test_order_integrity.py \
            core/tests/test_payment_intent.py \
            core/tests/test_payment_webhook.py
