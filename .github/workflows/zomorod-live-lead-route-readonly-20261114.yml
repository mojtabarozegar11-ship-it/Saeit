name: Zomorod production lead route - GET only, no customer submission
on:
  pull_request:
    paths:
      - '.github/workflows/zomorod-live-lead-route-readonly-20261114.yml'
      - 'scripts/zomorod_live_lead_route_readonly_20261114.py'
      - 'tests/test_zomorod_live_lead_route_readonly_20261114.py'
      - 'content/zomorod-v11/store_index.php'
permissions:
  contents: read
concurrency:
  group: zm-lead-get-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  offline-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove no writes, redirects, POSTs, cookies or fabricated sales
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_zomorod_live_lead_route_readonly_20261114.py' -v
          python3 -B -m py_compile scripts/zomorod_live_lead_route_readonly_20261114.py
  public-get-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exactly three public pages without redirect or form submission
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/zomorod_live_lead_route_readonly_20261114.py |
            tee "$RUNNER_TEMP/zm-live-lead-route.jsonl"
          python3 - "$RUNNER_TEMP/zm-live-lead-route.jsonl" <<'PY'
          import json,sys
          line=open(sys.argv[1],encoding="utf8").read().strip()
          assert line.startswith("ZM_LIVE_LEAD_ROUTE=")
          r=json.loads(line.split("=",1)[1])
          ok=r["lead_get_route_qualified"] is True
          print("ZM_PUBLIC_LEAD_ROUTE_GATE=" + ("PASS" if ok else "BLOCKED_OR_UNVERIFIED"))
          sys.exit(0 if ok else 5)
          PY
      - name: Retain sanitized, expiring GET-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-live-lead-route-readonly-evidence
          path: ${{ runner.temp }}/zm-live-lead-route.jsonl
          retention-days: 7
          if-no-files-found: warn
