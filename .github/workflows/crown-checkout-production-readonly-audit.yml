name: Crown Defender payment source of truth - read only
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/crown-checkout-production-readonly-audit.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Public payment gate baseline (no buy attempt)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://mojplaywin.com/api/crown-defender/fleet/',headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=20) as res:
              assert res.status==200
              response=json.load(res)
          assert response['game']=='crown-defender'
          items=response['items']
          print('CROWN_PUBLIC_PRODUCTS='+str(len(items)))
          print('CROWN_PUBLIC_PAYABLE_ITEMS='+str(sum(row.get('available') is True for row in items)))
          print('CROWN_PUBLIC_PURCHASE_URLS='+str(sum(bool(row.get('checkout')) for row in items)))
          PY
      - name: Pinned existing GitHub to VPS to cPanel relay - read only
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/crown-pay-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
          echo 'CROWN_RELAY_IDENTITY_PINNED=YES'
      - name: Inspect only deployed app files, never secrets, DB, or wallets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/crown-pay-ro"
          timeout 45s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib
          home=Path('/home/zomorod2')
          site=home/'mojplaywin.com'
          wsgi=site/'passenger_wsgi.py'
          try:
              source=wsgi.read_text('utf-8','replace')
              print('CROWN_PASSENGER_WSGI_PRESENT=YES')
              print('CROWN_PASSENGER_POINTS_TO_STAGING='+str("APP='/home/zomorod2/Saeit-staging'" in source))
          except (OSError,ValueError):
              print('CROWN_PASSENGER_WSGI_PRESENT=NO')
          for label,root in [('STAGING',home/'Saeit-staging'),('PRODUCTION',home/'Saeit')]:
              for alias,path in [
                  ('CHECKOUT',root/'core/crown_checkout.py'),
                  ('FLEET',root/'core/crown_fleet.py'),
                  ('RECEIPTS',root/'core/crown_tron_receipts.py'),
                  ('ADAPTER',root/'services/mpw_crown_mainnet_checkout.py'),
                  ('URLS',root/'config/urls.py'),
              ]:
                  if path.is_symlink() or not path.is_file():
                      print('CROWN_'+label+'_'+alias+'_EXISTS=NO')
                  else:
                      print('CROWN_'+label+'_'+alias+'_EXISTS=YES')
                      if alias != 'ADAPTER':
                          print('CROWN_'+label+'_'+alias+'_SHA256='+hashlib.sha256(path.read_bytes()).hexdigest())
              if (root/'config/urls.py').is_file():
                  print('CROWN_'+label+'_ROUTE_DECLARED='+str('crown_cosmetic_checkout' in (root/'config/urls.py').read_text('utf-8','replace')))
          PY
