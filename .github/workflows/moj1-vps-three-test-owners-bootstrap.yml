name: MOJ1 provision three private Shasta-only governance TEST owners on VPS
on:
  push:
    branches: ['moj1/shasta-pilot-20261021']
    paths: ['.github/workflows/moj1-vps-three-test-owners-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moj1-vps-shasta-test-governance-owner-bootstrap
  cancel-in-progress: false
jobs:
  private-test-owners:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/moj1/shasta-pilot-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare VPS relay SSH, pin server identity, never read the wallet key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then echo 'MOJ1_VPS_RELAY=UNAVAILABLE'; exit 1; fi
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/moj1_governance_ssh"
          trap 'rm -f "$RUNNER_TEMP/moj1_governance_ssh"' EXIT
          ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null > "$RUNNER_TEMP/moj1_governance_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/moj1_governance_known_hosts" -E sha256 | grep -Fq 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 100s ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/moj1_governance_known_hosts" -i "$RUNNER_TEMP/moj1_governance_ssh" githubops@178.239.147.150 'python3 -' <<'PY_VPS'
          import hashlib
          import fcntl
          import json
          import os
          import secrets
          import stat
          import sys
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat

          root = Path.home() / '.local/share/moj1-shasta-test-20261021'
          if root.is_symlink() or not root.is_dir() or stat.S_IMODE(root.stat().st_mode) != 0o700:
              raise RuntimeError('MOJ1_TEST_WALLET_ROOT_UNSAFE')
          sys.path.insert(0, str(root / 'vendor'))
          from Crypto.Hash import keccak

          destination = root / 'governance-test-owners'
          destination.mkdir(mode=0o700, exist_ok=True)
          if destination.is_symlink() or stat.S_IMODE(destination.stat().st_mode) != 0o700:
              raise RuntimeError('MOJ1_GOVERNANCE_TEST_OWNER_DIR_UNSAFE')

          curve_order = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141
          alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          def address_from_private(private_key):
              v = int.from_bytes(private_key, 'big')
              if not 1 <= v < curve_order:
                  raise RuntimeError('INVALID_TEST_SIGNER_KEY')
              pub = ec.derive_private_key(v, ec.SECP256K1()).public_key().public_bytes(
                  Encoding.X962, PublicFormat.UncompressedPoint)
              raw = bytes([0x41]) + keccak.new(digest_bits=256, data=pub[1:]).digest()[-20:]
              checksum = hashlib.sha256(hashlib.sha256(raw).digest()).digest()[:4]
              n = int.from_bytes(raw + checksum, 'big')
              out = ''
              while n:
                  n, rem = divmod(n, 58)
                  out = alphabet[rem] + out
              return out, raw.hex()

          assert address_from_private(bytes.fromhex('00' * 31 + '01'))[1] == '417e5f4552091a69125d5dfcb7b8c2659029395bdf'

          fd_lock = os.open(destination / 'bootstrap.lock', os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)
          fcntl.flock(fd_lock, fcntl.LOCK_EX)
          meta_path = destination / 'owners-public.json'
          public = {'network': 'SHASTA_TEST_ONLY', 'production_approved': False, 'owners': []}
          original_wallet = json.loads((root / 'wallet-public.json').read_text())
          existing_address = original_wallet['address_base58']
          created_count = 0
          for i in range(1, 4):
              p = destination / ('owner-' + str(i) + '.key')
              if p.exists():
                  st = p.lstat()
                  if not stat.S_ISREG(st.st_mode) or stat.S_IMODE(st.st_mode) != 0o600:
                      raise RuntimeError('EXISTING_TEST_OWNER_KEY_UNSAFE')
                  f = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(f, 'rb') as input_file:
                      key = input_file.read()
              else:
                  while True:
                      key = secrets.token_bytes(32)
                      if 1 <= int.from_bytes(key, 'big') < curve_order:
                          address, raw = address_from_private(key)
                          if address != existing_address and address not in [x['address_base58'] for x in public['owners']]:
                              break
                  f = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(f, 'wb') as output_file:
                      output_file.write(key)
                      output_file.flush()
                      os.fsync(output_file.fileno())
                  created_count += 1
              if len(key) != 32:
                  raise RuntimeError('EXISTING_TEST_OWNER_KEY_INVALID')
              address, raw = address_from_private(key)
              if address == existing_address or address in [x['address_base58'] for x in public['owners']]:
                  raise RuntimeError('DUPLICATE_TEST_GOVERNANCE_OWNER')
              public['owners'].append({'slot': i, 'address_base58': address, 'address_hex': raw})
          if meta_path.exists():
              if meta_path.is_symlink() or json.loads(meta_path.read_text()) != public:
                  raise RuntimeError('TEST_GOVERNANCE_METADATA_MISMATCH_NO_OVERWRITE')
          else:
              f = os.open(meta_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(f, 'w') as output_file:
                  json.dump(public, output_file, sort_keys=True)
                  output_file.write('\n')
                  output_file.flush()
                  os.fsync(output_file.fileno())
          print('MOJ1_GOVERNANCE_TEST_OWNER_COUNT=3')
          print('MOJ1_GOVERNANCE_NEW_TEST_KEYS=' + str(created_count))
          print('MOJ1_GOVERNANCE_ALL_OWNER_KEYS_SEPARATE=YES')
          print('MOJ1_GOVERNANCE_TEST_OWNER_PUBLIC_ADDRESSES=' +
                ','.join(x['address_base58'] for x in public['owners']))
          print('MOJ1_GOVERNANCE_PRIVATE_KEYS_TRANSMITTED=NO')
          print('MOJ1_GOVERNANCE_TEST_OWNER_DIR_MODE=0700')
          print('MOJ1_GOVERNANCE_PRODUCTION_CUSTODY=NOT_APPROVED')
          print('MOJ1_GOVERNANCE_TESTNET_BROADCAST_COUNT=0')
          print('MOJ1_VPS_RELAY=CONNECTED')
          PY_VPS
