name: MojPlayWin factory release readiness without publication
on:
  push:
    branches: [audit/mpw-factory-private-inbox-20261014]
    paths:
      - .github/workflows/mpw-factory-release-readiness-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public free-tool digest, private QA manifests and publication gate read-only
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 110s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export PYTHONDONTWRITEBYTECODE=1
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import hashlib,importlib.util,json,zipfile
          from pathlib import Path
          import django
          django.setup()
          from core.models import Product,KnowledgeArticle
          root=Path.home()/".saeit-factory-inbox"
          spec=importlib.util.spec_from_file_location("read_only_receiver",root/"bin/store_receiver.py")
          r=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r)
          public=Path.home()/"mojplaywin.com/factory-releases/farm-enterprise-economics-v1/Farm_Enterprise_Economics_Toolkit_Free_v1.zip"
          for recipe in ("farm_enterprise_economics","water_budget_economics"):
              candidates=sorted((root/"receipts"/recipe).glob("*.json"))
              valid=[p.stem for p in candidates if not p.is_symlink() and r.status(root,recipe,p.stem)]
              print("MPW_RELEASE_VALID_PRIVATE_RECEIPTS_"+recipe.upper()+"="+str(len(valid)))
              assert len(valid)==1,"Unexpected release count"
              digest=valid[0]
              manifest=json.loads((root/"packages"/recipe/(digest+".json")).read_text())
              bundle=root/"packages"/recipe/(digest+".zip")
              assert bundle.is_file() and not bundle.is_symlink()
              with zipfile.ZipFile(bundle) as z:
                  entries=[i for i in z.infolist() if not i.is_dir()]
                  uncompressed=sum(i.file_size for i in entries)
              print("MPW_RELEASE_PRIVATE_ARCHIVE_BYTES_"+recipe.upper()+"="+str(bundle.stat().st_size))
              print("MPW_RELEASE_PRIVATE_FILES_"+recipe.upper()+"="+str(len(entries)))
              print("MPW_RELEASE_PRIVATE_UNCOMPRESSED_BYTES_"+recipe.upper()+"="+str(uncompressed))
              print("MPW_RELEASE_QA_PASS_"+recipe.upper()+"="+str(manifest.get("qa_status")=="passed"))
              print("MPW_RELEASE_COMMERCIAL_STATUS_"+recipe.upper()+"="+str(manifest.get("commercial_status","unknown"))[:75])
              print("MPW_RELEASE_OWNER_APPROVAL_"+recipe.upper()+"="+str(manifest.get("owner_publication_approval")))
              matches=Product.objects.filter(metadata__factory_bridge_sha256=digest)
              print("MPW_RELEASE_DJANGO_MATCHES_"+recipe.upper()+"="+str(matches.count()))
              for item in matches:
                  print("MPW_RELEASE_DJANGO_PRODUCT_ACTIVE_"+recipe.upper()+"="+str(item.active))
                  print("MPW_RELEASE_DJANGO_FACTORY_PERMISSION_"+recipe.upper()+"="+str((item.metadata or {}).get("factory_publication_permission")))
              if recipe=="farm_enterprise_economics":
                  if public.is_file() and not public.is_symlink():
                      h=hashlib.sha256(public.read_bytes()).hexdigest()
                      print("MPW_RELEASE_PUBLIC_FREE_ARCHIVE_MATCHES_PRIVATE="+str(h==digest))
                  else:
                      print("MPW_RELEASE_PUBLIC_FREE_ARCHIVE_MATCHES_PRIVATE=False")
          print("MPW_RELEASE_FREE_DJANGO_ARTICLE_EXISTS="+str(KnowledgeArticle.objects.filter(slug="farm-enterprise-economics-toolkit-free-v1").exists()))
          print("MPW_RELEASE_FREE_DJANGO_ARTICLE_PUBLISHED="+str(KnowledgeArticle.objects.filter(slug="farm-enterprise-economics-toolkit-free-v1",published=True).exists()))
          print("MPW_RELEASE_LIVE_DJANGO_AUDIT_READ_ONLY=True")
          PY
          for url in \
            https://mojplaywin.com/store/ \
            https://mojplaywin.com/factory-releases/farm-enterprise-economics-v1/ \
            https://mojplaywin.com/factory-releases/farm-enterprise-economics-v1/Farm_Enterprise_Economics_Toolkit_Free_v1.zip; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' --connect-timeout 7 --max-time 15 "$url" || true)
            case "$url" in
              */store/) echo "MPW_RELEASE_HTTP_STORE=$status";;
              */index.html|*/farm-enterprise-economics-v1/) echo "MPW_RELEASE_HTTP_FREE_INDEX=$status";;
              *.zip) echo "MPW_RELEASE_HTTP_FREE_DOWNLOAD=$status";;
            esac
          done
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
