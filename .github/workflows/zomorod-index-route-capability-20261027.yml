name: Zomorod domain-only index PHP route capability
on:
  pull_request:
    paths: [.github/workflows/zomorod-index-route-capability-20261027.yml]
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-index-route-capability-20261027.yml]
permissions:
  contents: read
concurrency:
  group: zomorod-index-route-capability-20261027
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated diagnostic scope
        run: |
          set -euo pipefail
          grep -Fq 'PROBE_CLEANUP=complete' .github/workflows/zomorod-index-route-capability-20261027.yml
          grep -Fq 'INDEX_PROBE_CLEANUP=complete' .github/workflows/zomorod-index-route-capability-20261027.yml
          echo SCOPED_INDEX_SOURCE=verified
  diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Open pinned and non-interactive VPS-to-cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-index-route-capability"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo PINNED_RELAY=verified
      - name: Probe PHP header and index precedence under a new domain-only temporary directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/zm-index-route-capability/config" saeit-cpanel bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          run="$1"
          case "$run" in ''|*[!0-9]*) echo INVALID_RUN_ID; exit 1;; esac
          web="/home/zomorod2/public_html"
          folder="$web/zm-index-route-$run"
          test -d "$web" && test ! -L "$web"
          test -s "$web/index.html" && test ! -L "$web/index.html"
          test ! -e "$web/index.php" && test ! -L "$web/index.php"
          test ! -e "$folder" && test ! -L "$folder"
          before="$(sha256sum "$web/index.html" "$web/.htaccess" "$web/store/index.php" "$web/search/index.json" "$web/about/index.html" "$web/topics/index.html")"
          install -d -m 755 "$folder"
          cleanup(){
            set +e
            test "$folder" = "/home/zomorod2/public_html/zm-index-route-$run" || return 1
            for f in index.html index.php;do
              if test -f "$folder/$f" && test ! -L "$folder/$f";then unlink "$folder/$f";fi
            done
            rmdir "$folder"
            if test ! -e "$folder" && test ! -L "$folder";then echo INDEX_PROBE_CLEANUP=complete;else echo INDEX_PROBE_CLEANUP=failed;return 1;fi
          }
          trap cleanup EXIT
          printf 'ZOMOROD_INDEX_HTML\n' > "$folder/index.html"
          printf "<?php\nheader('X-ZM-PHP-Probe: ok');\necho 'ZOMOROD_INDEX_PHP';\n" > "$folder/index.php"
          chmod 644 "$folder/index.html" "$folder/index.php"
          base="https://zomorodmelal.ir/zm-index-route-$run"
          php_body="$(curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$base/index.php?nocache=$run")"
          test "$php_body" = "ZOMOROD_INDEX_PHP" || { echo PHP_HANDLER=unavailable;exit 1; }
          echo PHP_HANDLER=works
          php_headers="$(curl -fsSIL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$base/index.php?nocache=$run")"
          if printf '%s\n' "$php_headers" | grep -iq '^x-zm-php-probe: ok';then echo PHP_HEADER=works;else echo PHP_HEADER=missing;fi
          root_body="$(curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$base/?nocache=$run")"
          case "$root_body" in
            ZOMOROD_INDEX_HTML) echo INDEX_PRIORITY=html;;
            ZOMOROD_INDEX_PHP) echo INDEX_PRIORITY=php;;
            *) echo INDEX_PRIORITY=unknown;exit 1;;
          esac
          after="$(sha256sum "$web/index.html" "$web/.htaccess" "$web/store/index.php" "$web/search/index.json" "$web/about/index.html" "$web/topics/index.html")"
          test "$before" = "$after"
          echo PROTECTED_LIVE_FILES=unchanged
          REMOTE
      - name: Remove ephemeral relay credentials
        if: always()
        run: |
          d="$RUNNER_TEMP/zm-index-route-capability"
          if test -d "$d"; then
            for f in vps.key host.key config vps.known host.known; do
              if test -f "$d/$f" && test ! -L "$d/$f"; then unlink "$d/$f"; fi
            done
            rmdir "$d"
          fi
