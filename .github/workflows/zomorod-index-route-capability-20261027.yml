name: Zomorod domain-only index PHP route capability
on:
  pull_request:
    paths: [.github/workflows/zomorod-index-route-capability-20261027.yml]
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-index-route-capability-20261027.yml]
permissions:
  contents: read
concurrency:
  group: zomorod-index-route-capability-20261027
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated diagnostic scope
        run: |
          set -euo pipefail
          grep -Fq 'ROOT_PHP_PROBE_CLEANUP=complete' .github/workflows/zomorod-index-route-capability-20261027.yml
          grep -Fq 'test ! -e "$web/index.php"' .github/workflows/zomorod-index-route-capability-20261027.yml
          echo SCOPED_INDEX_SOURCE=verified
  diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Open pinned and non-interactive VPS-to-cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-index-route-capability"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo PINNED_RELAY=verified
      - name: Reversible mirrored-homepage PHP priority probe with exact private backup
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/zm-index-route-capability/config" saeit-cpanel bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          run="$1"
          case "$run" in ''|*[!0-9]*) echo INVALID_RUN_ID; exit 1;; esac
          web=/home/zomorod2/public_html
          php="$web/index.php"
          original="$web/index.html"
          htaccess="$web/.htaccess"
          backup="/home/zomorod2/.backups/zomorod-index-mirror-20261027/$run"
          test -d "$web" && test ! -L "$web"
          test -s "$original" && test ! -L "$original"
          test -s "$htaccess" && test ! -L "$htaccess"
          test ! -e "$php" && test ! -L "$php"
          test ! -e "$backup" && test ! -L "$backup"
          before="$(sha256sum "$original" "$htaccess" "$web/store/index.php" "$web/search/index.json" "$web/about/index.html" "$web/topics/index.html")"
          install -d -m 700 "$backup"
          cp -p "$original" "$backup/index.html"
          cp -p "$htaccess" "$backup/.htaccess"
          cmp -s "$original" "$backup/index.html"
          cmp -s "$htaccess" "$backup/.htaccess"
          echo ROOT_PHP_PROBE_BACKUP=verified
          created=0
          cleanup(){
            set +e
            if test "$created" = 1;then
              if cmp -s "$php" "$backup/index.php.candidate" && test ! -L "$php";then unlink "$php";else echo ROOT_PHP_PROBE_CLEANUP=conflict;return 1;fi
            fi
            if test ! -e "$php" && test ! -L "$php";then echo ROOT_PHP_PROBE_CLEANUP=complete;else echo ROOT_PHP_PROBE_CLEANUP=failed;return 1;fi
          }
          trap cleanup EXIT
          printf '%s\n' '<?php' \
            "header('X-ZM-Root-PHP-Mirror: ok');" \
            "header('X-Frame-Options: SAMEORIGIN');" \
            "header(\"Content-Security-Policy: frame-ancestors 'self'\", false);" \
            "header('Content-Type: text/html; charset=UTF-8');" \
            '$bytes = file_get_contents(__DIR__ . "/index.html");' \
            'if ($bytes === false) { http_response_code(503); exit; }' \
            'echo $bytes;' > "$backup/index.php.candidate"
          chmod 644 "$backup/index.php.candidate"
          ln "$backup/index.php.candidate" "$php"
          created=1
          url="https://zomorodmelal.ir/?zm_php_mirror=$run"
          root_code="$(curl -sS --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' -D "$backup/root.headers" -o "$backup/root.body" -w '%{http_code}' "$url")"
          test "$root_code" = 200 || { echo ROOT_PHP_PROBE_HTTP="$root_code";exit 1; }
          cmp -s "$backup/root.body" "$original" || { echo ROOT_PHP_PROBE_CONTENT=mismatch;exit 1; }
          echo ROOT_PHP_PROBE_CONTENT=exact
          if grep -iq '^x-zm-root-php-mirror: ok' "$backup/root.headers";then echo ROOT_PHP_PRIORITY=works;else echo ROOT_PHP_PRIORITY=absent;fi
          if grep -iq '^x-frame-options: SAMEORIGIN' "$backup/root.headers";then echo ROOT_FRAME_HEADER=present;else echo ROOT_FRAME_HEADER=absent;fi
          direct_code="$(curl -sS --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' -D "$backup/direct.headers" -o "$backup/direct.body" -w '%{http_code}' "https://zomorodmelal.ir/index.php?zm_php_mirror=$run")"
          test "$direct_code" = 200 || { echo DIRECT_PHP_HTTP="$direct_code";exit 1; }
          cmp -s "$backup/direct.body" "$original"
          if grep -iq '^x-zm-root-php-mirror: ok' "$backup/direct.headers";then echo DIRECT_PHP_HEADER=works;else echo DIRECT_PHP_HEADER=absent;fi
          after="$(sha256sum "$original" "$htaccess" "$web/store/index.php" "$web/search/index.json" "$web/about/index.html" "$web/topics/index.html")"
          test "$before" = "$after"
          echo PROTECTED_LIVE_FILES=unchanged
          REMOTE
      - name: Remove ephemeral relay credentials
        if: always()
        run: |
          d="$RUNNER_TEMP/zm-index-route-capability"
          if test -d "$d"; then
            for f in vps.key host.key config vps.known host.known; do
              if test -f "$d/$f" && test ! -L "$d/$f"; then unlink "$d/$f"; fi
            done
            rmdir "$d"
          fi
