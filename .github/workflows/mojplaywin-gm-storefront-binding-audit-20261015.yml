name: MojPlayWin chess storefront binding evidence audit
on:
  push:
    branches: [audit/mpw-chess-file-readonly-20261015]
    paths: ['.github/workflows/mojplaywin-gm-storefront-binding-audit-20261015.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check chess ebook location and SHA256 on cPanel without changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-root-audit"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 85s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          cd "$HOME/Saeit-staging"
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import django,os,hashlib
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          django.setup()
          from django.conf import settings
          from django.contrib.auth import get_user_model
          from core.models import Product,KnowledgeArticle
          from mpw_commerce.downloads import _private_file
          p=Product.objects.get(pk=72)
          m=p.metadata if isinstance(p.metadata,dict) else {}
          cfg=m.get("mpw_commerce") or {}
          root_value=getattr(settings,"MPW_COMMERCE_PRIVATE_ASSET_ROOT",None)
          expected="3837fc3cb21ed1a2e7c33e0db8f8e10d158583309b02b97d4d674d25a147207a"
          path=Path.home()/"MojPlayWin_Private_Assets/store/chess-improvement/MojPlayWin_Chess_Grandmaster_Final_Covered_2026.pdf"
          approved=path.is_file() and not path.is_symlink() and path.stat().st_size==3631972 and hashlib.sha256(path.read_bytes()).hexdigest()==expected
          print("GM_CHECK_BOOK_APPROVED_HASH="+str(approved))
          print("GM_CHECK_OWNER_PRESENT="+str(p.owner_id is not None))
          print("GM_CHECK_ARTICLE_PRESENT="+str(p.knowledge_article_id is not None))
          print("GM_CHECK_SALE_FLAG="+str(cfg.get("enabled") is True))
          print("GM_CHECK_DELIVERY_KIND="+str(cfg.get("fulfillment","unset")))
          print("GM_CHECK_RELFILE_CONFIGURED="+str(bool(cfg.get("private_file"))))
          print("GM_CHECK_ARTICLE_PUBLISHED="+str(bool(p.knowledge_article and p.knowledge_article.published)))
          print("GM_CHECK_SUPERUSER_COUNT="+str(get_user_model().objects.filter(is_active=True,is_superuser=True).count()))
          print("GM_CHECK_RESEARCH_ARTICLES="+str(KnowledgeArticle.objects.filter(title__icontains="chess").count()))
          print("GM_CHECK_ROOT_CONFIGURED="+str(isinstance(root_value,str) and root_value.startswith("/")))
          if isinstance(root_value,str) and root_value.startswith("/"):
              root=Path(root_value)
              print("GM_CHECK_ROOT_SAFE="+str(root.is_dir() and not root.is_symlink()))
              try:
                  rel=path.resolve().relative_to(root.resolve())
                  print("GM_CHECK_PRIVATE_RELATIVE_FILE="+str(rel))
                  print("GM_CHECK_RELATIVE_FILENAME_ONLY="+str(rel.name==path.name))
              except ValueError:
                  print("GM_CHECK_FILE_OUTSIDE_PRIVATE_ROOT=True")
          print("GM_CHECK_QUALITY_APPROVED="+str(m.get("quality_approved") is True))
          print("GM_CHECK_LICENSE_VERIFIED="+str(m.get("license_verified") is True))
          print("GM_CHECK_PUBLICATION_PERMISSION="+str(m.get("factory_publication_permission") is True))
          print("GM_CHECK_PRODUCT_IS_ACTIVE="+str(p.active))
          print("GM_CHECK_PAYMENT_LIVE="+str(m.get("payment_live") is True))
          print("GM_READ_ONLY_BINDING_AUDIT_COMPLETE=True")
          PY
          REMOTE

      - name: Remove transient keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-root-audit"
