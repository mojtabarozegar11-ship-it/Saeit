name: Zomorod site-only eleven agent and master 100 scenario quality gates
on:
  pull_request:
    paths:
      - content/zomorod-v11/site_agents.php
      - content/zomorod-v11/tests/site_agents_generation_harness.php
      - .github/workflows/zomorod-site-agent-100-stage-qa.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-site-agent-100-stage-qa.yml
permissions:
  contents: read
jobs:
  agent-safe-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl
      - name: Strict PHP syntax and agent production contract
        shell: bash
        run: |
          set -euo pipefail
          php -l content/zomorod-v11/site_agents.php
          php -l content/zomorod-v11/tests/site_agents_generation_harness.php
          php -r 'require "content/zomorod-v11/site_agents.php";if(!function_exists("zmAgentRender")||!function_exists("zmAgentHandle")||!function_exists("zmAgentCycle"))exit(2);echo "AGENT_ADMIN_COMPATIBILITY=passed\n";'
          ! grep -qiE 'CURLOPT_SSL_VERIFYPEER.?=>.?false|CURLOPT_SSL_VERIFYHOST.?=>.?0' content/zomorod-v11/site_agents.php
      - name: Run exactly 100 different offline regression scenarios
        shell: bash
        run: |
          set -euo pipefail
          php content/zomorod-v11/tests/site_agents_generation_harness.php > "$RUNNER_TEMP/agent-gates.log"
          test "$(grep -c '^SITE_AGENT_GENERATION_GATE=' "$RUNNER_TEMP/agent-gates.log")" -eq 100
          tail -n 3 "$RUNNER_TEMP/agent-gates.log"
          printf '%s\n' 'SITE_AGENT_NOT_LIVE_PROMOTION=yes'
      - name: Save generation acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-only-agent-100-regression-gates
          path: ${{ runner.temp }}/agent-gates.log
          if-no-files-found: warn
          retention-days: 14
