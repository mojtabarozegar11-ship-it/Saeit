name: Factory offhost quota read-only one-time preflight
on:
  push:
    branches: [fix/factory-evidence-integrity-f28-metamorphic-20261028]
    paths: [".github/workflows/factory-offhost-quota-one-time-readonly-20261028.yml"]
permissions:
  contents: read
concurrency:
  group: factory-offhost-quota-once-20261028
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read account quota without exposing database or customer details
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          home=Path.home()
          if str(home)!="/home/zomorod2":
              raise SystemExit("CPANEL_ACCOUNT_IDENTITY_MISMATCH")
          result=subprocess.run(
              ["uapi","--output=json","Quota","get_quota_info"],
              capture_output=True,text=True,timeout=25)
          if result.returncode!=0:raise SystemExit("CPANEL_QUOTA_UAPI_COMMAND_FAILED")
          body=json.loads(result.stdout)
          payload=body.get("result",{})
          print("CPANEL_QUOTA_UAPI_SUCCESS="+str(payload.get("status")==1))
          data=payload.get("data")
          chosen={}
          def walk(obj,prefix="",depth=0):
              if depth>5 or len(chosen)>45:return
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{0,55}",str(k)):
                          walk(v,prefix+"."+str(k),depth+1)
              elif isinstance(obj,list):
                  for idx,item in enumerate(obj[:12]):walk(item,prefix+"."+str(idx),depth+1)
              elif isinstance(obj,(int,float)) or isinstance(obj,str):
                  label=prefix.lower()
                  if any(x in label for x in ("quota","disk","megabyte","used","available","limit","percent")):
                      value=str(obj)[:64]
                      if re.fullmatch(r"[0-9.]+(?: ?(?:bytes|MB|GB|TB|%))?",value,re.I):
                          chosen[prefix]=value
          walk(data)
          print("CPANEL_QUOTA_NUMERIC_FIELDS="+json.dumps(chosen,sort_keys=True))
          stat=os.statvfs(home)
          print("CPANEL_HOST_FILESYSTEM_AVAILABLE_BYTES="+str(stat.f_bavail*stat.f_frsize))
          print("CPANEL_HOST_FILESYSTEM_TOTAL_BYTES="+str(stat.f_blocks*stat.f_frsize))
          print("CPANEL_OFFHOST_BACKUP_RESTORE_VERIFIED=false")
          PY
      - name: Remove ephemeral SSH keys from runner
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -f -- "$d/vps.key" "$d/host.key" "$d/config" "$d/host.known" "$d/vps.known" "$d/host.candidate"; rmdir -- "$d" || true; fi
