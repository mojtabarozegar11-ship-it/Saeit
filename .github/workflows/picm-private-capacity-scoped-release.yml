name: PICM Owner Independent Capacity Scoped cPanel Release
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: picm-private-capacity-scope
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: deploy PICM private capacity 2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned relay and cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/picm-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P '' -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$WORK/config" <<EOF
          Host picm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" picm-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat >> "$WORK/config" <<EOF
          Host picm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump picm-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo PICM_RELAY_READY
      - name: Validate PICM-only candidate files without remote changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile core/picm_views.py scripts/picm_private_capacity_release.py
          node --check templates/picm/text_image.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/picm_views.py').read_text(encoding='utf-8')
          t=Path('templates/picm/index.html').read_text(encoding='utf-8')
          j=Path('templates/picm/text_image.js').read_text(encoding='utf-8')
          assert 'DAILY_QUOTA' not in p and 'MAX_JOBS' not in p
          assert 'def storage_ready(root):' in p
          assert 'picm_daily_limit' not in t and 'daily_limit_reached' not in j
          print('PICM_PRIVATE_CAPACITY_CANDIDATE_VALID')
          PY
      - name: Verify existing public login, private paths and homepage before scoped release
        shell: bash
        run: |
          set -Eeuo pipefail
          for entry in '200|/' '200|/picm/login/' '302|/picm/workspace/' '403|/picm/worker/health/'; do
            expected="$(printf '%s' "$entry" | cut -d '|' -f1)"
            path="$(printf '%s' "$entry" | cut -d '|' -f2)"
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            echo "PICM_BASELINE=$path:$code"
            test "$code" = "$expected"
          done
      - name: Stage only three PICM files and guarded cPanel release script
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/picm-ssh"
          stage="/home/zomorod2/.picm-independent-stage-$GITHUB_RUN_ID"
          timeout 25s ssh -F "$work/config" picm-host "test \"\$(id -un)\" = zomorod2 && test ! -e $stage && install -d -m 700 $stage"
          tar -cf "$RUNNER_TEMP/picm-capacity.tar" scripts/picm_private_capacity_release.py core/picm_views.py templates/picm/index.html templates/picm/text_image.js
          scp -q -F "$work/config" "$RUNNER_TEMP/picm-capacity.tar" "picm-host:$stage/source.tar"
          timeout 25s ssh -F "$work/config" picm-host "tar -xf $stage/source.tar -C $stage"
          echo PICM_PRIVATE_CAPACITY_STAGE_READY
      - name: Publish only three PICM files with live SHA pins and backup
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/picm-ssh"
          stage="/home/zomorod2/.picm-independent-stage-$GITHUB_RUN_ID"
          sha_view="$(sha256sum core/picm_views.py | cut -d ' ' -f1)"
          sha_html="$(sha256sum templates/picm/index.html | cut -d ' ' -f1)"
          sha_js="$(sha256sum templates/picm/text_image.js | cut -d ' ' -f1)"
          timeout 60s ssh -F "$work/config" picm-host \
            "python3 $stage/scripts/picm_private_capacity_release.py deploy $GITHUB_RUN_ID $sha_view $sha_html $sha_js"
      - name: Confirm PICM-only files and public/private health
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/picm-ssh"
          timeout 25s ssh -F "$work/config" picm-host 'python3 -' <<'PY'
          from pathlib import Path
          root=Path('/home/zomorod2/Saeit-staging')
          v=(root/'core/picm_views.py').read_text()
          t=(root/'templates/picm/index.html').read_text()
          j=(root/'templates/picm/text_image.js').read_text()
          assert 'def storage_ready(root):' in v and 'DAILY_QUOTA' not in v
          assert 'picm_daily_limit' not in t and 'daily_limit_reached' not in j
          print('PICM_PRIVATE_CAPACITY_LIVE_FILES_PRESENT')
          PY
          good=0
          for attempt in $(seq 1 12); do
            home="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' https://mojplaywin.com/ || true)"
            login="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' https://mojplaywin.com/picm/login/ || true)"
            workspace="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' https://mojplaywin.com/picm/workspace/ || true)"
            api="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' https://mojplaywin.com/picm/worker/health/ || true)"
            if [[ "$home" == 200 && "$login" == 200 && "$workspace" == 302 && "$api" == 403 ]]; then good=1; break; fi
            sleep 3
          done
          test "$good" = 1
          echo PICM_PRIVATE_CAPACITY_RELEASE_HTTP_HEALTH_OK
      - name: Roll back only three PICM files after failed health verification
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          work="$RUNNER_TEMP/picm-ssh"
          stage="/home/zomorod2/.picm-independent-stage-$GITHUB_RUN_ID"
          timeout 50s ssh -F "$work/config" picm-host "python3 $stage/scripts/picm_private_capacity_release.py rollback $GITHUB_RUN_ID" || echo PICM_PRIVATE_CAPACITY_ROLLBACK_UNCONFIRMED
      - name: Remove only PICM staged transfer files
        if: always()
        shell: bash
        run: |
          work="$RUNNER_TEMP/picm-ssh"
          if test -f "$work/config"; then
            ssh -F "$work/config" -o ConnectTimeout=8 picm-host \
              "test ! -L /home/zomorod2/.picm-independent-stage-$GITHUB_RUN_ID && rm -rf /home/zomorod2/.picm-independent-stage-$GITHUB_RUN_ID" || true
          fi
          rm -f -- "$RUNNER_TEMP/picm-capacity.tar"
      - name: Remove temporary SSH files from runner
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/picm-ssh"
