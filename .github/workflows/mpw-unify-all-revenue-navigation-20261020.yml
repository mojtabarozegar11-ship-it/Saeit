name: MojPlayWin unified twenty-page navigation with all twelve revenue tools
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-unify-all-revenue-navigation-20261020.yml"
permissions: {contents: read}
concurrency:
  group: mpw-menu-exact-static-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate bounded twenty-page navigation with twelve real destinations
        run: |
          python3 -m py_compile scripts/mpw_integrated_revenue_navigation_20261020.py
          python3 scripts/mpw_integrated_revenue_navigation_20261020.py selftest
      - name: Capture existing public main and child site status
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os
          routes=['/','/store/','/services/','/about/','/knowledge/','/farnaz/','/saman/','/taniya/','/picm/']
          before={}
          for route in routes:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=17) as r:before[route]=r.status
              except urllib.error.HTTPError as e:before[route]=e.code
          if any(v!=200 for v in before.values()):raise RuntimeError('Protected original site unhealthy '+str(before))
          open(os.environ['RUNNER_TEMP']+'/mpw-nav-before.json','w').write(json.dumps(before))
          print('MPW_MENU_PREVIOUS_HTTP='+json.dumps(before))
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Install only main home plus nineteen isolated HTML headers
        id: publish
        run: |
          set -euo pipefail
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_integrated_revenue_navigation_20261020.py
      - name: Verify menu on homepage and 19 representative main routes, child sites unchanged
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os,time
          domain='https://mojplaywin.com'
          slugs=('website-doctor','landing-page-studio','ai-automation','business-spreadsheets','website-templates','social-media-kits','resume-builder','logo-studio','browser-games','marketing-ai','business-calculators','website-care')
          checked_routes=('/','/store/','/services/','/about/','/knowledge/','/research/','/industry/','/economy/','/studio/','/agents/','/company/','/market/','/ventures/carpets/','/ventures/jewelry-gold/')
          for path in checked_routes:
              req=urllib.request.Request(domain+path+'?mpw_new_menu='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as resp:html=resp.read(600000).decode('utf8','replace')
              if resp.status!=200 or 'href="/mpw-editorial/revenue/index.html"' not in html or '12 Revenue Tools' not in html:raise RuntimeError('Main nav absent '+path)
              if path=='/':
                  for slug in slugs:
                      if '/mpw-editorial/revenue/'+slug+'/index.html' not in html:raise RuntimeError('Menu offer missing '+slug)
              print('MPW_MAIN_MENU_LIVE='+path)
          protected=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-nav-before.json'))
          for path,status in protected.items():
              try:
                  with urllib.request.urlopen(domain+path,timeout=20) as resp:now=resp.status
              except urllib.error.HTTPError as e:now=e.code
              if now!=status:raise RuntimeError('Protected status changed '+path)
          print('MPW_12_OFFERS_MENU_ON_CANONICAL_20_PAGES_AND_SUBSITES=PASS')
          PY
      - name: Restore original twenty pages if verification failed
        if: failure() && steps.publish.outcome == 'success'
        run: timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_integrated_revenue_navigation_20261020.py
      - name: Clean ephemeral SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
