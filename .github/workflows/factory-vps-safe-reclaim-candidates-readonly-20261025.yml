name: VPS reclaim candidates limited forensic inventory (read-only)
on:
  pull_request:
    paths:
      - .github/workflows/factory-vps-safe-reclaim-candidates-readonly-20261025.yml
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect only candidate old source copies and backup composition
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/vps-reclaim-investigate"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 180s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 python3 - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          ops=Path("/home/githubops/factory-runtime/operations")
          assert ops.is_dir() and not ops.is_symlink()
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=10).stdout
          processes=subprocess.run(["ps","-u","githubops","-o","args="],capture_output=True,text=True,check=True,timeout=10).stdout
          patterns=("astra-v2-*-copy-source-*","toolchain-source-*")
          candidates=[]
          for pattern in patterns:
            for p in sorted(ops.glob(pattern)):
              if not p.is_dir() or p.is_symlink():continue
              size=subprocess.check_output(["du","-sx","-B1",str(p)],text=True,timeout=30)
              files=[]
              for base,dirs,names in os.walk(p,followlinks=False):
                dirs[:]=[x for x in dirs if not (Path(base)/x).is_symlink()]
                for name in names:
                  f=Path(base)/name
                  if f.is_file() and not f.is_symlink() and f.stat().st_size>10_000_000:
                    files.append({"name":str(f.relative_to(p))[:100],"bytes":f.stat().st_size})
              candidates.append({"name":p.name,"bytes":int(size.split()[0]),
                "referenced_by_active_cron":any(p.name in x for x in cron.splitlines() if not x.lstrip().startswith("#")),
                "referenced_by_current_process":p.name in processes,
                "large_files":sorted(files,key=lambda x:x["bytes"],reverse=True)[:8]})
          backups=ops/"backups"
          snapshots=[]
          for p in sorted(backups.glob("*master-20261022*")):
            if not p.is_dir() or p.is_symlink():continue
            proc=subprocess.run(["du","-sx","-B1",str(p)],capture_output=True,text=True,check=True,timeout=30)
            listing=[]
            for f in p.iterdir():
              if f.is_symlink():continue
              if f.is_file():listing.append({"name":f.name,"bytes":f.stat().st_size,"type":"file"})
              elif f.is_dir():listing.append({"name":f.name,"type":"directory"})
            snapshots.append({"name":p.name,"bytes":int(proc.stdout.split()[0]),"children":listing[:16]})
          print("SAFE_RECLAIM_CANDIDATES_READONLY="+json.dumps({"candidates":candidates,"snapshots":snapshots[:14],"no_changes":True},sort_keys=True))
          PY
