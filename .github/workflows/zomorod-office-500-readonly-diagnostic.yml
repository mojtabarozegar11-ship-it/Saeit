name: Diagnose Zomorod private office live 500 safely (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-500-readonly-diagnostic.yml"
      - ".github/workflows/zomorod-messaging-private-staging.yml"
      - "tests/test_zm_release_preflight.py"
permissions:
  contents: read
concurrency:
  group: zomorod-office-500-readonly-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Diagnose recent Python exceptions without printing logs or private data
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          LAST_FAILED_RELEASE: fdd628d09813bc9c30e73fdbb25d19960cad9dc0
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$LAST_FAILED_RELEASE" <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export DIAG_RELEASE_SHA="$1"
          python3 -B - <<'PY'
          import os,re,time,sys,pathlib
          home=pathlib.Path.home()
          candidates=[
              home/"Saeit/stderr.log",
              home/"Saeit/passenger.log",
              home/"Saeit/error.log",
              home/"Saeit/error_log",
              home/"logs/error_log",
              home/"logs/passenger.log",
              home/"public_html/error_log",
              home/"public_html/stderr.log",
              home/"stderr.log",
              home/"passenger.log",
          ]
          recent=[]
          for p in candidates:
              try:
                  if p.is_file() and not p.is_symlink():
                      st=p.stat()
                      if st.st_size:
                          recent.append((p,st.st_size,int(time.time()-st.st_mtime)))
              except OSError:
                  pass
          print("LOG_CANDIDATE_COUNT="+str(len(recent)))
          for p,n,age in recent:
              print("LOG_CANDIDATE="+p.name+" bytes_band="+("large" if n>1000000 else "small")+" age_seconds="+str(max(age,0)))
              try:
                  with p.open("rb") as fh:
                      fh.seek(max(0,n-600000))
                      text=fh.read().decode("utf-8",errors="replace")
                  trace=text.rfind("Traceback (most recent call last):")
                  if trace>=0:
                      block=text[trace:]
                      classes=re.findall(r"(?m)^(?:django\.\w+(?:\.\w+)*\.)?(\w+(?:Error|Exception))\s*:",block)
                      print("RECENT_EXCEPTION_CLASS="+(classes[-1] if classes else "unknown"))
                      error_lines=[line for line in block.splitlines() if line.startswith("RuntimeError:")]
                      last_error=error_lines[-1] if error_lines else ""
                      for term,label in [
                          ("doesn't declare an explicit app_label","UNREGISTERED_DJANGO_MODEL"),
                          ("isn't in an application in INSTALLED_APPS","MODEL_NOT_IN_INSTALLED_APPS"),
                          ("Missing staticfiles manifest entry","STATIC_MANIFEST_MISSING"),
                          ("No module named","MODULE_IMPORT_MISSING"),
                          ("database is locked","DATABASE_LOCKED"),
                          ("no such table","DATABASE_TABLE_MISSING"),
                          ("Settings cannot be imported","SETTINGS_IMPORT"),
                      ]:
                          if term in last_error:
                              print("RECENT_EXCEPTION_REASON="+label)
                              break
                      else:
                          print("RECENT_EXCEPTION_REASON=other")
                      m=re.search(r"Model class ([A-Za-z0-9_.]+)",last_error)
                      if m:print("RECENT_EXCEPTION_MODEL="+m.group(1))
                      frames=re.findall(r'File "[^"]*/([^/"]+\.py)", line (\d+), in (\w+)',block)
                      for name,lineno,func in frames[-6:]:
                          print("RECENT_EXCEPTION_FRAME="+name+":"+lineno+":"+func)
              except OSError: pass
          root=home/".private/zomorod-office-live-releases"/os.environ["DIAG_RELEASE_SHA"]
          manifest=root/"manifest.json"
          if manifest.is_file() and not manifest.is_symlink():
              import json
              data=json.loads(manifest.read_text())
              print("ROLLBACK_MANIFEST_STATUS="+str(data.get("status","unknown")))
              print("ROLLBACK_QUARANTINE_EXISTS="+str((root/"failed_new_release").is_dir()).lower())
          else: print("ROLLBACK_MANIFEST_STATUS=missing")
          PY
          REMOTE
      - name: Reproduce staged login with production configuration and no writes
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$SOURCE_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          stage="/home/zomorod2/.private/zomorod-messaging-release-stages/$sha/code"
          # Staging and this read-only diagnostic can run concurrently.
          # Report missing exact-head stage without claiming production readiness.
          if test ! -f "$stage/config/settings.py" || test ! -s "$stage/isolation.sqlite3"; then
            echo "EXACT_HEAD_PRIVATE_STAGE=missing"
            echo "PRODUCTION_SIMULATOR=not_run"
            exit 0
          fi
          if ! grep -Fqx "release=$sha" "$stage/../manifest.txt"; then
            echo "EXACT_HEAD_PRIVATE_STAGE=manifest_mismatch"
            echo "PRODUCTION_SIMULATOR=not_run"
            exit 0
          fi
          echo "EXACT_HEAD_PRIVATE_STAGE=verified"
          for py in /home/zomorod2/virtualenv/Saeit/3.10/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python; do
            if test ! -x "$py"; then continue; fi
            STAGE="$stage" PYTHONDONTWRITEBYTECODE=1 "$py" - <<'PY'
          import os,pathlib,re,sys
          stage=pathlib.Path(os.environ["STAGE"])
          src=pathlib.Path("/home/zomorod2/Saeit/.env")
          if src.is_file():
              for line in src.read_text(errors="replace").splitlines():
                  if not line or line.lstrip().startswith("#") or "=" not in line: continue
                  key,value=line.split("=",1);key=key.strip();value=value.strip()
                  if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*",key):
                      os.environ.setdefault(key,value.strip(chr(34)+chr(39)))
          os.environ["COMPANY_MESSAGING_SEND_ENABLED"]="false"
          os.environ["COMPANY_MARKETING_PUBLISH_ENABLED"]="false"
          os.environ["ECOSYSTEM_SCHEDULED_ANALYSIS_ENABLED"]="false"
          os.environ["DATABASE_URL"]="sqlite:///"+str(stage/"isolation.sqlite3")
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          sys.path.insert(0,str(stage))
          sys.path.insert(1,"/home/zomorod2/Saeit")
          import django
          django.setup()
          from django.test import Client
          print("PRODUCTION_SIMULATOR_PYTHON="+str(sys.version_info.major)+"."+str(sys.version_info.minor))
          try:
              r=Client(raise_request_exception=True).get("/company/office/secure-login/",secure=True,HTTP_HOST="zomorodmelal.ir")
              print("PRODUCTION_SIMULATOR_LOGIN_HTTP="+str(r.status_code))
          except Exception as exc:
              import traceback
              print("PRODUCTION_SIMULATOR_EXCEPTION_CLASS="+type(exc).__name__)
              tb=traceback.extract_tb(exc.__traceback__)
              for f in tb[-7:]:
                  print("PRODUCTION_SIMULATOR_EXCEPTION_FRAME="+pathlib.Path(f.filename).name+":"+str(f.lineno)+":"+f.name)
          PY
          done
          REMOTE
      - name: Attest the root Passenger SQLite identity without opening a writable DB
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          app=/home/zomorod2/Saeit
          test -d "$app" && test ! -L "$app" && test -s "$app/passenger_wsgi.py"
          # Resolve the interpreter from the live cPanel Passenger configuration.
          # Guessing a virtualenv version cannot attest the executing application.
          configured_python="$(python3 -B - <<'CPANEL_CONFIG'
          import os
          import shlex
          from pathlib import Path

          app = Path("/home/zomorod2/Saeit")
          config = Path("/home/zomorod2/public_html/.htaccess")
          if not config.is_file() or config.is_symlink():
              raise SystemExit("PASSENGER_CONFIG_UNAVAILABLE")
          pythons = []
          roots = []
          for raw in config.read_text(encoding="utf-8").splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              key = stripped.split(None, 1)[0].lower()
              if key not in ("passengerpython", "passengerapproot"):
                  continue
              try:
                  fields = shlex.split(stripped, comments=True)
              except ValueError:
                  raise SystemExit("PASSENGER_CONFIG_DIRECTIVE_INVALID")
              if len(fields) != 2:
                  raise SystemExit("PASSENGER_CONFIG_DIRECTIVE_INVALID")
              if key == "passengerpython":
                  pythons.append(fields[1])
              else:
                  roots.append(fields[1])
          if len(pythons) != 1 or roots != [str(app)]:
              raise SystemExit("PASSENGER_CONFIG_UNATTESTED")
          interpreter = Path(pythons[0])
          if not interpreter.is_absolute() or not interpreter.is_file() or not os.access(interpreter, os.X_OK):
              raise SystemExit("PASSENGER_INTERPRETER_UNAVAILABLE")
          print(str(interpreter))
          CPANEL_CONFIG
          )"
          test -x "$configured_python"
          echo "PASSENGER_DB_PROBE_INTERPRETER_SOURCE=CPANEL_HTACCESS"
          # Prove the cPanel-selected executable actually runs Python code,
          # separately from app imports or the stdin-based database probe.
          cli_output="$(PYTHONDONTWRITEBYTECODE=1 "$configured_python" -B -c 'import sys; print("PASSENGER_DB_PROBE_CLI_READY="+str(sys.version_info.major)+"."+str(sys.version_info.minor))')"
          if ! printf '%s\n' "$cli_output" | grep -Eq '^PASSENGER_DB_PROBE_CLI_READY=[0-9]+[.][0-9]+$'; then
              echo "PASSENGER_DB_PROBE_CLI_UNAVAILABLE=true"
              exit 1
          fi
          printf '%s\n' "$cli_output"
          cd "$app"
          probe_output="$(PYTHONDONTWRITEBYTECODE=1 "$configured_python" -B - <<'PY'
          import os
          import pathlib
          import sqlite3
          import sys
          from urllib.parse import quote

          print("PASSENGER_DB_PROBE_SCRIPT_STARTED=true",flush=True)
          app=pathlib.Path("/home/zomorod2/Saeit")
          if pathlib.Path.cwd().resolve()!=app:
              raise SystemExit("PASSENGER_DB_PROBE_APP_ROOT_MISMATCH")
          sys.path.insert(0,str(app))
          print("PASSENGER_DB_PROBE_INTERPRETER_RUNNING=true",flush=True)
          try:
              import passenger_wsgi
              from django.conf import settings
              db=settings.DATABASES["default"]
          except Exception as exc:
              print("PASSENGER_DB_PROBE_IMPORT="+type(exc).__name__)
              print("PASSENGER_APP_DB_ATTESTED=false")
              print("PRODUCTION_PRIVATE_OFFICE_DEPLOY_ALLOWED=no")
              raise SystemExit(0)

          engine=str(db.get("ENGINE","")).rsplit(".",1)[-1]
          print("PASSENGER_DB_PROBE_ENGINE="+engine)
          print("PASSENGER_DB_PROBE_PYTHON="+str(sys.version_info.major)+"."+str(sys.version_info.minor))
          name=str(db.get("NAME",""))
          if engine!="sqlite3" or name in ("",":memory:"):
              print("PASSENGER_DB_PROBE_SQLITE=not_applicable")
              print("PASSENGER_APP_DB_ATTESTED=false")
              print("PRODUCTION_PRIVATE_OFFICE_DEPLOY_ALLOWED=no")
              raise SystemExit(0)

          path=pathlib.Path(name)
          if not path.is_absolute():
              path=app/path
          path=path.resolve()
          stat=None
          try:
              if path.is_file() and not path.is_symlink():
                  stat=path.stat()
          except OSError:
              pass
          print("PASSENGER_DB_PROBE_FILE_PRESENT="+str(stat is not None).lower())
          print("PASSENGER_DB_PROBE_SIZE_NONZERO="+str(bool(stat and stat.st_size>0)).lower())
          tables=None
          if stat and stat.st_size>0:
              try:
                  uri="file:"+quote(str(path),safe="/")+ "?mode=ro"
                  conn=sqlite3.connect(uri,uri=True,timeout=3)
                  conn.execute("PRAGMA query_only=ON")
                  tables=len(conn.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  ).fetchall())
                  conn.close()
              except (OSError,sqlite3.Error):
                  pass
          print("PASSENGER_DB_PROBE_READONLY_TABLE_COUNT="+(str(tables) if tables is not None else "unavailable"))

          # Process-file identity is only attested when an app-owned worker has
          # an open FD to this same database inode. A configured path alone is
          # insufficient; idle workers often leave no open SQLite descriptor.
          worker_count=0
          matching_fd=0
          for pid_dir in pathlib.Path("/proc").iterdir():
              if not pid_dir.name.isdigit():continue
              try:
                  if pid_dir.stat().st_uid!=os.getuid():continue
                  cwd=pathlib.Path(os.readlink(pid_dir/"cwd"))
                  if cwd.resolve()!=app:continue
                  worker_count+=1
                  if stat is None:continue
                  for fd in (pid_dir/"fd").iterdir():
                      try:
                          s=fd.stat()
                          if s.st_dev==stat.st_dev and s.st_ino==stat.st_ino:
                              matching_fd+=1
                      except (OSError,PermissionError):
                          continue
              except (OSError,PermissionError):
                  continue
          print("PASSENGER_DB_PROBE_APP_CWD_PROCESSES="+str(worker_count))
          print("PASSENGER_DB_PROBE_MATCHING_SQLITE_FD="+str(matching_fd))
          attested=bool(stat and stat.st_size>0 and tables is not None and matching_fd>0)
          print("PASSENGER_APP_DB_ATTESTED="+str(attested).lower())
          # DB identity is necessary, not sufficient: restore/MFA/provider gates
          # remain independent even if an active worker file match is observed.
          print("PRODUCTION_PRIVATE_OFFICE_DEPLOY_ALLOWED=no")
          PY
          )"
          # An interpreter may exit successfully before returning DB evidence.
          if ! printf '%s\n' "$probe_output" | grep -Eq '^PASSENGER_APP_DB_ATTESTED=(true|false)$'; then
              echo "PASSENGER_DB_PROBE_OUTPUT_INCOMPLETE=true"
              exit 1
          fi
          if ! printf '%s\n' "$probe_output" | grep -Fqx 'PRODUCTION_PRIVATE_OFFICE_DEPLOY_ALLOWED=no'; then
              echo "PASSENGER_DB_PROBE_RELEASE_GATE_MISSING=true"
              exit 1
          fi
          printf '%s\n' "$probe_output"
          REMOTE
      - name: Classify PHP ledger versus Django root DB without writes or row access
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import pathlib
          import sqlite3
          import stat
          from urllib.parse import quote

          candidates = (
              ("PHP_LEDGER", pathlib.Path("/home/zomorod2/.private/zomorod-business/management.sqlite3")),
              ("DJANGO_DEFAULT", pathlib.Path("/home/zomorod2/Saeit/db.sqlite3")),
          )
          for label, path in candidates:
              try:
                  meta = path.stat() if not path.is_symlink() else None
              except OSError:
                  meta = None
              regular = bool(meta and stat.S_ISREG(meta.st_mode))
              nonzero = bool(regular and meta.st_size >= 4096)
              print(label + "_REGULAR=" + str(regular).lower())
              print(label + "_NONEMPTY_SQLITE_SIZE=" + str(nonzero).lower())
              if not nonzero:
                  print(label + "_BASE_SCHEMA=unavailable")
                  continue
              try:
                  with path.open("rb") as handle:
                      if handle.read(16) != b"SQLite format 3\x00":
                          print(label + "_BASE_SCHEMA=invalid_header")
                          continue
                  uri = "file:" + quote(str(path.resolve(strict=True)), safe="/") + "?mode=ro&immutable=1"
                  with sqlite3.connect(uri, uri=True, timeout=3) as connection:
                      connection.execute("PRAGMA query_only=ON")
                      tables = {row[0] for row in connection.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )}
                  print(label + "_BASE_SCHEMA_TABLES=" + str(len(tables)))
                  print(label + "_HAS_DJANGO_SCHEMA=" + str(
                      {"django_migrations", "auth_user"}.issubset(tables)
                  ).lower())
              except (OSError, sqlite3.Error):
                  print(label + "_BASE_SCHEMA=read_only_unavailable")
          print("DB_CLASSIFICATION_READONLY=true")
          print("ACCOUNTING_SOURCE_OF_TRUTH_NOT_ATTESTED=true")
          PY
          REMOTE
      - name: Attest the staged read-only PHP ledger bridge against the live schema
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$SOURCE_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          stage="/home/zomorod2/.private/zomorod-messaging-release-stages/$sha"
          if test ! -f "$stage/code/enterprise_portal/php_ledger_bridge.py" || ! grep -Fqx "release=$sha" "$stage/manifest.txt"; then
            echo "PHP_LEDGER_BRIDGE_SCHEMA=not_run_stage_missing"
            exit 0
          fi
          py="/home/zomorod2/virtualenv/Saeit/3.10/bin/python"
          if test ! -x "$py"; then py="/home/zomorod2/virtualenv/Saeit/3.11/bin/python"; fi
          test -x "$py"
          STAGE="$stage/code" PYTHONDONTWRITEBYTECODE=1 "$py" -B - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.environ["STAGE"])
          from enterprise_portal.php_ledger_bridge import read_php_finance_snapshot
          result = read_php_finance_snapshot(
              "/home/zomorod2/.private/zomorod-business/management.sqlite3"
          )
          assert result["authority"] == "PHP V7 (read-only)"
          assert result["document_count"] >= 0 and result["invoice_count"] >= 0
          assert result["imbalance_count"] >= 0
          assert all(row["currency"] in {"IRR", "USD", "EUR", "AED"} for row in result["turnovers"])
          print("PHP_LEDGER_BRIDGE_SCHEMA=verified")
          print("PHP_LEDGER_BRIDGE_AGGREGATE_ONLY=true")
          print("FINANCIAL_VALUES_OR_PRIVATE_ROWS_LOGGED=false")
          PY
          REMOTE
      - name: Reject any anonymous live finance report exposure
        shell: bash
        run: |
          set -euo pipefail
          # No cookies, authorization headers, redirects, or response body.
          # A redirect to login or a 404 on the still-unpublished route is safe;
          # an unsolicited 200 must block the private-office release.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --proto '=https' --tlsv1.2 --max-time 25 --max-redirs 0 \
            --retry 2 --retry-delay 2 \
            'https://zomorodmelal.ir/company/office/finance/authoritative/')"
          case "$status" in
            301|302|303|307|308|401|403|404|503)
              echo "LIVE_ANONYMOUS_FINANCE_EXPOSURE=no"
              echo "LIVE_FINANCE_HTTP_CLASS=guarded_or_unpublished"
              ;;
            200)
              echo "::error title=Private finance access check::Anonymous HTTP 200 requires manual verification before release"
              echo "LIVE_ANONYMOUS_FINANCE_EXPOSURE=possible"
              exit 1
              ;;
            *)
              echo "::error title=Private finance access check::Unexpected HTTP status; unable to attest anonymous safety"
              echo "LIVE_ANONYMOUS_FINANCE_EXPOSURE=unattested"
              exit 1
              ;;
          esac
      - name: Erase transient private relay files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
