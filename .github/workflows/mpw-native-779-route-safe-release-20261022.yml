name: MojPlayWin native 779 checkout guarded single-file route fix 20261022
on:
  push:
    branches: [fix/mpw-native-gateway-20261022]
    paths:
      - .github/workflows/mpw-native-779-route-safe-release-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile the read-only probe
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_native_779_route_patch_20261022.py
          python3 scripts/mpw_native_779_route_patch_20261022.py selftest
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway100-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Check target is pinned and simulate all three signed-in product pages before any write
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-gateway100-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preview" < scripts/mpw_native_779_route_patch_20261022.py
      - name: Back up and repair ONLY existing 779 checkout route on cPanel
        id: install
        run: |
          set -euo pipefail
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-gateway100-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - publish '$GITHUB_RUN_ID'" < scripts/mpw_native_779_route_patch_20261022.py
      - name: Verify exact patch hash, other checkout pages and private backup
        run: |
          set -euo pipefail
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-gateway100-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify '$GITHUB_RUN_ID'" < scripts/mpw_native_779_route_patch_20261022.py
      - name: Reload ONLY MojPlayWin Passenger app (no shared service restart)
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/mpw-gateway100-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          site=Path('/home/zomorod2/mojplaywin.com')
          if site.is_symlink() or not site.is_dir():raise RuntimeError('Unexpected site root')
          wsgi=site/'passenger_wsgi.py'
          if wsgi.is_symlink() or "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):raise RuntimeError('Unexpected Passenger app')
          folder=site/'tmp'
          if folder.is_symlink():raise RuntimeError('Unsafe restart directory')
          folder.mkdir(exist_ok=True)
          (folder/'restart.txt').touch()
          print('MPW_779_PASSENGER_RELOAD=REQUESTED')
          PY
      - name: Verify public purchase and login GET endpoints are healthy without orders
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json
          checks={}
          for path in ['/store/','/accounts/login/','/commerce/book/779/','/store/product/779/checkout/']:
              url='https://mojplaywin.com'+path
              handler=urllib.request.build_opener(urllib.request.HTTPRedirectHandler)
              try:
                  with handler.open(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as resp:
                      status=resp.status
                      final=resp.geturl()
              except urllib.error.HTTPError as ex:
                  status=ex.code
                  final=url
              checks[path]={'http':status,'same_host':urllib.parse.urlparse(final).netloc in ('mojplaywin.com','www.mojplaywin.com')}
              if status!=200 or not checks[path]['same_host']:raise RuntimeError('Public endpoint not healthy: '+path)
          print('MPW_779_PUBLIC_GET_HEALTH='+json.dumps(checks,sort_keys=True))
          print('MPW_779_REAL_PAYMENT_ATTEMPTED=NO')
          PY
      - name: Restore original payment route if postinstall verification fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-gateway100-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" < scripts/mpw_native_779_route_patch_20261022.py
          ssh -T -F "$RUNNER_TEMP/mpw-gateway100-ssh/config" saeit-cpanel "touch /home/zomorod2/mojplaywin.com/tmp/restart.txt"
      - name: Remove private SSH relay material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-gateway100-ssh"
