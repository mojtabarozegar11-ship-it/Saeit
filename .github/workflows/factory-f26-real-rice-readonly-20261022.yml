name: F26 real UCI rice model — independent VPS read-only audit
on:
  push:
    branches: [audit/f26-real-rice-vps-readonly-20261022, main]
    paths:
      - scripts/factory_f26_real_rice_readonly_vps_proof.py
      - .github/workflows/factory-f26-real-rice-readonly-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: factory-f26-real-rice-readonly
  cancel-in-progress: false
jobs:
  verify-existing-private-vps-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate read-only auditor locally before any SSH
        shell: bash
        run: python3 -B -m py_compile scripts/factory_f26_real_rice_readonly_vps_proof.py
      - name: Independently inspect real F26 pilot and original 48 models using pinned SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          work="$(mktemp -d)"
          chmod 700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.buffer.read().decode("utf8");s=s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n";sys.stdout.buffer.write(s.encode("utf8"))' > "$work/key"
          chmod 600 "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > /dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$work/known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          ssh -T -i "$work/key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            githubops@178.239.147.150 \
            'test "$(id -un)" = githubops && python3 -B -' \
            < scripts/factory_f26_real_rice_readonly_vps_proof.py
          echo FACTORY_F26_READONLY_AUDIT_NO_VPS_WRITES=PASS
