name: MOJ1 observe existing Shasta pilot - read only
on:
  push:
    branches:
      - moj1/reward-eligibility-offline-20261024
    paths:
      - experiments/moj1-pilot/scripts/shasta-pilot-observe-readonly.mjs
      - experiments/moj1-pilot/tests/shasta-pilot-observe-readonly.test.mjs
      - experiments/moj1-pilot/shasta-v2-deployment.json
      - .github/workflows/moj1-shasta-observe-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shasta-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: experiments/moj1-pilot
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/moj1-pilot/package-lock.json
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline safety and mocked RPC regression
        run: node --test tests/shasta-pilot-observe-readonly.test.mjs
      - name: Compile exact pinned source for runtime attestation
        run: npm run compile
      - name: Attest V2 source and deployed bytecode with public read-only RPC
        run: node scripts/verify-v2-shasta-readonly.mjs
      - name: Observe V2 candidate runtime code on Shasta (no signing, no funds)
        run: node scripts/shasta-pilot-observe-readonly.mjs --read-only
      - name: Assert Mainnet and payout remain blocked
        run: node scripts/release-readiness-offline.mjs --assert-blocked
