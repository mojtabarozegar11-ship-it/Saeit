name: Factory VPS Discovery Postfix Tick
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-discovery-postfix-tick.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Verify independent factory runtime assets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -f "$base/django-app/manage.py"
          test -f "$base/django-app/core/models.py"
          test -f "$base/django-app/config/settings.py"
          test -x "$base/.venv/bin/python"
          test -f "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"
          "$base/.venv/bin/python" -c 'import django,sqlite3; print("DJANGO",django.get_version())'
          cd "$base/django-app"
          "$base/.venv/bin/python" manage.py migrate --check
          test -f "$base/private/factory-fresh-isolated.sqlite3"
          export MOJ_FACTORY_LOCAL_MODE=1 MOJ_PAID_LLM_ENABLED=0 MOJ_LLM_DAILY_CALL_BUDGET=0 MOJ_LLM_MAX_COST_MINOR=0
          echo "FACTORY_DIAGNOSTIC_START"
          "$base/.venv/bin/python" - <<'PY'
          import ast
          from pathlib import Path
          root = Path.home() / "factory-runtime/django-app/core"
          targets = [
              root / "factory_agent_runtime.py",
              root / "opportunity_discovery.py",
              root / "management/commands/opportunity_discovery_tick.py",
              root / "management/commands/factory_staging_tick.py",
          ]
          for path in targets:
              print("DIAG_FILE", path.relative_to(root), "exists", path.is_file())
              if not path.is_file():
                  continue
              source = path.read_text(encoding="utf-8")
              lines = source.splitlines()
              try:
                  tree = ast.parse(source)
              except SyntaxError as exc:
                  print("DIAG_SYNTAX_ERROR", type(exc).__name__, exc.lineno)
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Raise, ast.ExceptHandler, ast.Call)):
                      fragment = ast.get_source_segment(source, node) or ""
                      if "FactoryAgentBlocked" in fragment or "configured_research_provider" in fragment:
                          print("DIAG_SITE", path.name, getattr(node, "lineno", "?"), type(node).__name__)
                          if isinstance(node, (ast.Raise, ast.ExceptHandler)):
                              print("DIAG_CONTEXT", " ".join(lines[max(0,node.lineno-3):min(len(lines),node.lineno+2)])[:350].replace("\\n"," "))
          PY
          echo "FACTORY_DIAGNOSTIC_END"
          tick_log="$(mktemp)"
          set +e
          timeout 150 "$base/.venv/bin/python" manage.py factory_staging_tick --max-runs 1 --max-steps 2 > "$tick_log" 2>&1
          tick_status=$?
          set -e
          cat "$tick_log"
          if [ "$tick_status" -ne 0 ]; then
            echo "FACTORY_GATE_FAILED: command_exit=$tick_status" >&2
            rm -f "$tick_log"
            exit 1
          fi
          if grep -q 'FACTORY_DISCOVERY_ERROR' "$tick_log"; then
            echo "FACTORY_GATE_FAILED: discovery_error" >&2
            rm -f "$tick_log"
            exit 1
          fi
          if ! grep -Eq 'FACTORY_TICK_OK .*processed_runs=[1-9][0-9]*' "$tick_log"; then
            echo "FACTORY_GATE_FAILED: no_product_runs_processed" >&2
            rm -f "$tick_log"
            exit 1
          fi
          rm -f "$tick_log"
          "$base/.venv/bin/python" - <<'PY'
          import sqlite3
          from pathlib import Path
          db=Path.home()/"factory-runtime/private/factory-fresh-isolated.sqlite3"
          con=sqlite3.connect(db)
          print("INTEGRITY",con.execute("pragma integrity_check").fetchone()[0])
          for t in ("core_factoryrun","core_factoryevidence","core_agenttask"):
              print("COUNT",t,con.execute("select count(*) from "+t).fetchone()[0])
          con.close()
          PY
          echo ISOLATED_FACTORY_TICK_FINISHED
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
