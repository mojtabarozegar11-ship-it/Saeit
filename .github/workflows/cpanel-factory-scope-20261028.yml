name: One-time cPanel factory-only scope inventory (no writes)
on:
  push:
    branches:
      - ops/cpanel-factory-scope-20261028
    paths:
      - .github/workflows/cpanel-factory-scope-20261028.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SSH relay with pinned host fingerprints
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-cpanel-scope"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"" ).replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Read-only cPanel factory scope and backup readiness
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-cpanel-scope"
          timeout 210s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,re,json,subprocess,shutil,stat,hashlib,time
          h=Path('/home/zomorod2')
          assert Path.home()==h and h.is_dir() and not h.is_symlink()
          def run(cmd,seconds=15):
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=seconds)
                  return p.stdout if p.returncode==0 else ''
              except Exception:
                  return ''
          def info(p):
              if p.is_symlink(): return {'name':p.name,'type':'symlink','unsafe':True}
              if p.is_file():
                  st=p.stat()
                  return {'name':p.name,'type':'file','bytes':st.st_size,'age_days':round((time.time()-st.st_mtime)/86400,1)}
              if p.is_dir():
                  v=run(['du','-sxB1','--',str(p)],30).strip()
                  try: size=int(v.split()[0])
                  except Exception:size=None
                  return {'name':p.name,'type':'dir','du_bytes':size,'age_days':round((time.time()-p.stat().st_mtime)/86400,1)}
              return {'name':p.name,'type':'other'}
          roots=[
            (h,'.root',r'factory|agent|publisher|worker|research|book|stage|inbox'),
            (h/'.saeit-factory-inbox','factory-inbox',r'.*'),
            (h/'.saeit-factory-inbox'/'bin','factory-bin',r'.*'),
            (h/'Saeit-staging','django-staging',r'factory|agent|publisher|worker|research|book|stage|store|inbox'),
            (h/'.private','private',r'factory|agent|publisher|worker|research|book|stage|inbox'),
            (h/'mojplaywin.com','mojplaywin-root',r'factory|agent|publisher|worker|research|book|stage|inbox'),
            (h/'Saeit','zomorod-root',r'factory|agent|publisher|worker|research|book|stage|inbox')
          ]
          for root,label,pattern in roots:
              if root.is_symlink():raise SystemExit('UNSAFE_ROOT_'+label)
              if not root.is_dir():
                  print('FACTORY_SCOPE='+json.dumps({'root':label,'exists':False}))
                  continue
              children=[p for p in root.iterdir() if re.search(pattern,p.name,re.I)]
              if len(children)>150:raise SystemExit('TOO_MANY_CANDIDATES_'+label)
              rows=[info(p) for p in children]
              print('FACTORY_SCOPE='+json.dumps({'root':label,'exists':True,'count':len(rows),'entries':rows},sort_keys=True))
          cron=run(['crontab','-l'])
          active=[x for x in cron.splitlines() if x.strip() and not x.lstrip().startswith('#')]
          factory=[x for x in active if re.search(r'factory|publisher|research|work.?order|autonomous',x,re.I)]
          paths=sorted({m.group(0) for line in factory for m in re.finditer(r'/home/zomorod2/[A-Za-z0-9_./-]+',line)})
          print('FACTORY_CRON='+json.dumps({'active_total':len(active),'factory_candidate_count':len(factory),'paths':paths[:45]},sort_keys=True))
          for n,line in enumerate(active):
              if not re.search(r'factory|publisher|research|work.?order|autonomous',line,re.I):continue
              ps=sorted(set(m.group(0) for m in re.finditer(r'/home/zomorod2/[A-Za-z0-9_./-]+',line)))
              print('FACTORY_CRON_LINE='+json.dumps({'position':n,'sha256':hashlib.sha256(line.encode()).hexdigest(),'schedule':line.split()[:5],'paths':ps[:20]},sort_keys=True))
          for path in (
            h/'Saeit-staging/var/factory',
            h/'Saeit-staging/var/factory/operations',
            h/'Saeit-staging/factory-workspace',
            h/'.saeit-factory-inbox/private',
            h/'mojplaywin.com/factory-products',
            h/'mojplaywin.com/factory-releases',
            h/'mojplaywin.com/factory-previews'):
              if path.is_symlink():raise SystemExit('SYMLINK_FACTORY_PATH')
              items=[info(x) for x in path.iterdir()] if path.is_dir() else []
              if len(items)>180:items=items[:180]
              print('FACTORY_DEEP='+json.dumps({'path':str(path),'exists':path.is_dir(),'children':items},sort_keys=True))
          owner=os.geteuid()
          roots=[str(h/'Saeit-staging/var/factory'),str(h/'.saeit-factory-inbox/bin')]
          proc_count={k:0 for k in roots}
          for p in Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  if p.stat().st_uid!=owner:continue
                  cwd=os.readlink(p/'cwd')
                  for k in roots:
                      if cwd==k or cwd.startswith(k+'/'):proc_count[k]+=1
              except OSError:continue
          print('FACTORY_PROCESS_CWD='+json.dumps(proc_count,sort_keys=True))
          passenger=run(['uapi','--output=json','PassengerApps','list_applications'],25)
          apps=[]
          try:
              raw=json.loads(passenger)
              data=raw.get('result',{}).get('data',[])
              for x in data if isinstance(data,list) else []:
                  y={k:x.get(k) for k in ('app_root','app_uri','domain','name') if isinstance(x.get(k),str)}
                  apps.append(y)
          except Exception:pass
          print('PASSENGER_ROOTS='+json.dumps(apps[:30],sort_keys=True))
          free=shutil.disk_usage(h).free
          backup=h/'.backups'
          print('BACKUP_READINESS='+json.dumps({'free_bytes':free,'backup_dir_exists':backup.is_dir() and not backup.is_symlink(),'tar_available':bool(shutil.which('tar')),'sha256sum_available':bool(shutil.which('sha256sum')),'writes':0,'deleted':0},sort_keys=True))
          PY
      - name: Create and restore-test private cPanel factory-code and cron backup
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-cpanel-scope"
          timeout 190s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import os,io,json,time,tarfile,hashlib,subprocess,tempfile
          from pathlib import Path
          home=Path('/home/zomorod2')
          assert Path.home()==home and not home.is_symlink()
          bases=(
              'Saeit-staging/var/factory/operations',
              'Saeit-staging/var/factory/research',
              'Saeit-staging/var/factory/discovery',
              'Saeit-staging/var/factory/Saeit-Astra-Luna',
              'Saeit-staging/factory-workspace',
              '.saeit-factory-inbox/bin',
          )
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=12,check=True).stdout
          expected={
              '571df48dab391329f131630eca394704cf6896f6b8b34605416da203e4271e92',
              '265504abe1f68f14d103c6d30fe6cf6037dcf1d9487f6c605563cf82d586d001',
              '64740596493a32eb972a60a2bc32f8c698b10a74800b80f9ff2c0fbd097bd012',
          }
          actual={hashlib.sha256(l.encode()).hexdigest() for l in cron.splitlines()}
          if not expected.issubset(actual):raise SystemExit('FACTORY_CRON_CHANGED_ABORT')
          manifest=[]
          for base in bases:
              p=home/base
              if not p.is_dir() or p.is_symlink():raise SystemExit('SOURCE_ROOT_MISSING_OR_SYMLINK')
              for x in sorted(p.rglob('*')):
                  if x.is_symlink():raise SystemExit('SOURCE_SYMLINK_FOUND')
                  if x.is_file():
                      rel=x.relative_to(home).as_posix()
                      content=x.read_bytes()
                      manifest.append({'path':rel,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()})
          if len(manifest)>10000 or sum(x['bytes'] for x in manifest)>32*1024*1024:raise SystemExit('BACKUP_LIMIT_EXCEEDED')
          base=home/'.backups'
          if base.is_symlink() or not base.is_dir():raise SystemExit('BACKUP_PARENT_UNSAFE')
          dest=base/'cpanel-factory-decommission-20261028'
          if dest.is_symlink():raise SystemExit('BACKUP_DEST_SYMLINK')
          dest.mkdir(mode=0o700,exist_ok=True)
          os.chmod(dest,0o700)
          salt=hashlib.sha256(cron.encode()).hexdigest()[:12]
          stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
          archive=dest/('code-cron-'+stamp+'-'+salt+'.tar.gz')
          if archive.exists():raise SystemExit('BACKUP_COLLISION')
          fd,tmp=tempfile.mkstemp(prefix='.pending-',suffix='.tar.gz',dir=dest)
          os.fchmod(fd,0o600)
          os.close(fd)
          def add_bytes(tf,name,data):
              t=tarfile.TarInfo(name)
              t.size=len(data);t.mode=0o600
              tf.addfile(t,io.BytesIO(data))
          try:
              with tarfile.open(tmp,'w:gz') as tf:
                  for item in manifest:
                      tf.add(home/item['path'],arcname=item['path'],recursive=False)
                  add_bytes(tf,'__meta__/crontab.txt',cron.encode())
                  add_bytes(tf,'__meta__/manifest.json',json.dumps(manifest,sort_keys=True).encode())
              with tempfile.TemporaryDirectory(prefix='.restore-smoke-',dir=dest) as test:
                  with tarfile.open(tmp,'r:gz') as tf:
                      names=set(tf.getnames())
                      if len(names)!=len(manifest)+2:raise SystemExit('TAR_MEMBER_MISMATCH')
                      for m in tf.getmembers():
                          if not m.isfile() or m.name.startswith('/') or '..' in Path(m.name).parts:
                              raise SystemExit('TAR_UNSAFE_MEMBER')
                      tf.extractall(test,filter='data')
                  for item in manifest:
                      restored=(Path(test)/item['path']).read_bytes()
                      if hashlib.sha256(restored).hexdigest()!=item['sha256']:
                          raise SystemExit('RESTORE_HASH_MISMATCH')
                  if (Path(test)/'__meta__/crontab.txt').read_text()!=cron:
                      raise SystemExit('CRON_RESTORE_MISMATCH')
              os.replace(tmp,archive)
              manifest_out=dest/(archive.name+'.json')
              manifest_out.write_text(json.dumps({'archive':archive.name,'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'cron_sha256':hashlib.sha256(cron.encode()).hexdigest(),'file_count':len(manifest),'file_bytes':sum(x['bytes'] for x in manifest),'restore_test':'pass'},sort_keys=True))
              os.chmod(manifest_out,0o600)
              print('CPANEL_FACTORY_BACKUP_VERIFIED='+json.dumps({'archive':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':len(manifest),'bytes':sum(x['bytes'] for x in manifest),'restore_test':True,'deleted':0},sort_keys=True))
          finally:
              if os.path.exists(tmp):os.unlink(tmp)
          PY
      - name: Retire only cPanel factory cron and standalone executors with rollback
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-cpanel-scope"
          timeout 130s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,io,tarfile,hashlib,json,subprocess,signal,time
          h=Path('/home/zomorod2')
          assert Path.home()==h and not h.is_symlink()
          backup=h/'.backups/cpanel-factory-decommission-20261028'
          archive=backup/'code-cron-20261028T132408Z-4e397ca5fb22.tar.gz'
          expected_archive='511655736da3becff24c020010c6df0e806738890b7f5898a6efe7ab8d09a341'
          if backup.is_symlink() or archive.is_symlink() or not archive.is_file():raise SystemExit('BACKUP_UNSAFE')
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected_archive:raise SystemExit('BACKUP_SHA_INVALID')
          with tarfile.open(archive,'r:gz') as tf:
              old_cron=tf.extractfile('__meta__/crontab.txt').read().decode()
              manifest=json.loads(tf.extractfile('__meta__/manifest.json').read())
          files={
             'Saeit-staging/var/factory/operations/stage1_10s_loop.sh',
             'Saeit-staging/var/factory/operations/factory_tick_boot.py',
             '.saeit-factory-inbox/bin/import_factory_store_drafts.py',
             '.saeit-factory-inbox/bin/personal_factory_adapter.py',
          }
          known={x['path']:x['sha256'] for x in manifest}
          if not files.issubset(known):raise SystemExit('TARGET_NOT_IN_BACKUP')
          for rel in files:
              p=h/rel
              if not p.is_file() or p.is_symlink() or hashlib.sha256(p.read_bytes()).hexdigest()!=known[rel]:
                  raise SystemExit('TARGET_CHANGED_'+p.name)
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=12,check=True).stdout
          if cron!=old_cron:raise SystemExit('CRON_CHANGED_AFTER_BACKUP')
          hashes={
              '571df48dab391329f131630eca394704cf6896f6b8b34605416da203e4271e92',
              '265504abe1f68f14d103c6d30fe6cf6037dcf1d9487f6c605563cf82d586d001',
              '64740596493a32eb972a60a2bc32f8c698b10a74800b80f9ff2c0fbd097bd012',
          }
          lines=cron.splitlines(keepends=True)
          targets=[l for l in lines if hashlib.sha256(l.rstrip('\r\n').encode()).hexdigest() in hashes]
          if len(targets)!=3:raise SystemExit('CRON_LINE_SET_MISMATCH')
          clean=''.join(l for l in lines if l not in targets)
          if len(clean.splitlines())!=len(cron.splitlines())-3:raise SystemExit('CRON_PRESERVATION_CHECK')
          def set_cron(txt):
              p=subprocess.run(['crontab','-'],input=txt,text=True,capture_output=True,timeout=20)
              if p.returncode:raise RuntimeError('CRONTAB_INSTALL_FAILED')
          def active_pids():
              names=[str(h/x) for x in files if x.endswith(('.py','.sh'))]
              found=[]
              for p in Path('/proc').iterdir():
                  if not p.name.isdigit() or int(p.name)==os.getpid():continue
                  try:
                      if p.stat().st_uid!=os.geteuid():continue
                      cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                      if any(n in cmd for n in names):found.append(int(p.name))
                  except OSError:continue
              return sorted(set(found))
          removed=[]
          applied=False
          try:
              set_cron(clean)
              applied=True
              for pid in active_pids():
                  try:os.kill(pid,signal.SIGTERM)
                  except ProcessLookupError:pass
              time.sleep(3)
              if active_pids():raise RuntimeError('FACTORY_PROCESS_STILL_RUNNING')
              for rel in sorted(files):
                  p=h/rel
                  p.unlink()
                  removed.append(rel)
                  cache=p.parent/'__pycache__'
                  if cache.is_dir() and not cache.is_symlink():
                      for c in cache.glob(p.stem+'.*.pyc'):
                          if c.is_file() and not c.is_symlink() and c.relative_to(h).as_posix() in known:
                              c.unlink();removed.append(c.relative_to(h).as_posix())
              for rel in ['Saeit-staging/var/factory/operations/stage1_10s_supervisor.lock','.saeit-factory-inbox/bin/draft-import.lock','.saeit-factory-inbox/bin/personal-factory.lock']:
                  p=h/rel
                  if p.is_file() and not p.is_symlink() and p.stat().st_size==0:
                      p.unlink();removed.append(rel)
              now=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=12,check=True).stdout
              if now!=clean or any((h/rel).exists() for rel in files):raise RuntimeError('VERIFY_FAILED')
              print('CPANEL_FACTORY_RETIRE_PASS='+json.dumps({'cron_removed':3,'executors_removed':4,'files_unlinked':len(removed),'backup_verified':True,'vps_touched':False,'site_roots_touched':False,'databases_touched':False,'store_products_touched':False},sort_keys=True))
          except Exception as exc:
              try:
                  with tarfile.open(archive,'r:gz') as tf:
                      for rel in removed:
                          if rel not in known:continue
                          data=tf.extractfile(rel).read()
                          p=h/rel
                          p.parent.mkdir(parents=True,exist_ok=True)
                          with p.open('xb') as stream:stream.write(data)
                  if applied:set_cron(old_cron)
                  print('CPANEL_FACTORY_RETIRE_ROLLBACK=PASS')
              except Exception as rollback:
                  print('CPANEL_FACTORY_RETIRE_ROLLBACK=FAILED:'+type(rollback).__name__)
              raise SystemExit('FACTORY_RETIRE_ABORT_'+type(exc).__name__)
          PY
      - name: Erase temporary SSH keys from GitHub runner
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/factory-cpanel-scope"
          if [ -d "$d" ]; then rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d" || true; fi
