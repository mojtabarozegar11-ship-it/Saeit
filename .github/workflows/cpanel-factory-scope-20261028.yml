name: One-time cPanel factory-only scope inventory (no writes)
on:
  push:
    branches:
      - ops/cpanel-factory-scope-20261028
    paths:
      - .github/workflows/cpanel-factory-scope-20261028.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SSH relay with pinned host fingerprints
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-cpanel-scope"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"" ).replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Read-only cPanel factory scope and backup readiness
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-cpanel-scope"
          timeout 210s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,re,json,subprocess,shutil,stat,hashlib,time
          h=Path('/home/zomorod2')
          assert Path.home()==h and h.is_dir() and not h.is_symlink()
          def run(cmd,seconds=15):
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=seconds)
                  return p.stdout if p.returncode==0 else ''
              except Exception:
                  return ''
          def info(p):
              if p.is_symlink(): return {'name':p.name,'type':'symlink','unsafe':True}
              if p.is_file():
                  st=p.stat()
                  return {'name':p.name,'type':'file','bytes':st.st_size,'age_days':round((time.time()-st.st_mtime)/86400,1)}
              if p.is_dir():
                  v=run(['du','-sxB1','--',str(p)],30).strip()
                  try: size=int(v.split()[0])
                  except Exception:size=None
                  return {'name':p.name,'type':'dir','du_bytes':size,'age_days':round((time.time()-p.stat().st_mtime)/86400,1)}
              return {'name':p.name,'type':'other'}
          roots=[
            (h,'.root',r'factory|agent|publisher|worker|research|book|stage|inbox'),
            (h/'.saeit-factory-inbox','factory-inbox',r'.*'),
            (h/'.saeit-factory-inbox'/'bin','factory-bin',r'.*'),
            (h/'Saeit-staging','django-staging',r'factory|agent|publisher|worker|research|book|stage|store|inbox'),
            (h/'.private','private',r'factory|agent|publisher|worker|research|book|stage|inbox'),
            (h/'mojplaywin.com','mojplaywin-root',r'factory|agent|publisher|worker|research|book|stage|inbox'),
            (h/'Saeit','zomorod-root',r'factory|agent|publisher|worker|research|book|stage|inbox')
          ]
          for root,label,pattern in roots:
              if root.is_symlink():raise SystemExit('UNSAFE_ROOT_'+label)
              if not root.is_dir():
                  print('FACTORY_SCOPE='+json.dumps({'root':label,'exists':False}))
                  continue
              children=[p for p in root.iterdir() if re.search(pattern,p.name,re.I)]
              if len(children)>150:raise SystemExit('TOO_MANY_CANDIDATES_'+label)
              rows=[info(p) for p in children]
              print('FACTORY_SCOPE='+json.dumps({'root':label,'exists':True,'count':len(rows),'entries':rows},sort_keys=True))
          cron=run(['crontab','-l'])
          active=[x for x in cron.splitlines() if x.strip() and not x.lstrip().startswith('#')]
          factory=[x for x in active if re.search(r'factory|publisher|research|work.?order|autonomous',x,re.I)]
          paths=sorted({m.group(0) for line in factory for m in re.finditer(r'/home/zomorod2/[A-Za-z0-9_./-]+',line)})
          print('FACTORY_CRON='+json.dumps({'active_total':len(active),'factory_candidate_count':len(factory),'paths':paths[:45]},sort_keys=True))
          for n,line in enumerate(active):
              if not re.search(r'factory|publisher|research|work.?order|autonomous',line,re.I):continue
              ps=sorted(set(m.group(0) for m in re.finditer(r'/home/zomorod2/[A-Za-z0-9_./-]+',line)))
              print('FACTORY_CRON_LINE='+json.dumps({'position':n,'sha256':hashlib.sha256(line.encode()).hexdigest(),'schedule':line.split()[:5],'paths':ps[:20]},sort_keys=True))
          for path in (
            h/'Saeit-staging/var/factory',
            h/'Saeit-staging/var/factory/operations',
            h/'Saeit-staging/factory-workspace',
            h/'.saeit-factory-inbox/private',
            h/'mojplaywin.com/factory-products',
            h/'mojplaywin.com/factory-releases',
            h/'mojplaywin.com/factory-previews'):
              if path.is_symlink():raise SystemExit('SYMLINK_FACTORY_PATH')
              items=[info(x) for x in path.iterdir()] if path.is_dir() else []
              if len(items)>180:items=items[:180]
              print('FACTORY_DEEP='+json.dumps({'path':str(path),'exists':path.is_dir(),'children':items},sort_keys=True))
          owner=os.geteuid()
          roots=[str(h/'Saeit-staging/var/factory'),str(h/'.saeit-factory-inbox/bin')]
          proc_count={k:0 for k in roots}
          for p in Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  if p.stat().st_uid!=owner:continue
                  cwd=os.readlink(p/'cwd')
                  for k in roots:
                      if cwd==k or cwd.startswith(k+'/'):proc_count[k]+=1
              except OSError:continue
          print('FACTORY_PROCESS_CWD='+json.dumps(proc_count,sort_keys=True))
          passenger=run(['uapi','--output=json','PassengerApps','list_applications'],25)
          apps=[]
          try:
              raw=json.loads(passenger)
              data=raw.get('result',{}).get('data',[])
              for x in data if isinstance(data,list) else []:
                  y={k:x.get(k) for k in ('app_root','app_uri','domain','name') if isinstance(x.get(k),str)}
                  apps.append(y)
          except Exception:pass
          print('PASSENGER_ROOTS='+json.dumps(apps[:30],sort_keys=True))
          free=shutil.disk_usage(h).free
          backup=h/'.backups'
          print('BACKUP_READINESS='+json.dumps({'free_bytes':free,'backup_dir_exists':backup.is_dir() and not backup.is_symlink(),'tar_available':bool(shutil.which('tar')),'sha256sum_available':bool(shutil.which('sha256sum')),'writes':0,'deleted':0},sort_keys=True))
          PY
      - name: Erase temporary SSH keys from GitHub runner
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/factory-cpanel-scope"
          if [ -d "$d" ]; then rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d" || true; fi
