name: MojPlayWin store renderer precise owner read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-store-renderer-owner-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Locate actual MojPlayWin store renderer and reject Zomorod shared template
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 75s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          home=Path('/home/zomorod2')
          w=home/'mojplaywin.com/passenger_wsgi.py'
          for raw in w.read_text('utf8','replace').splitlines():
            if re.search(r'^\s*(APP|BASE|ROOT|PROJECT|DJANGO)\s*=',raw):
              print('MPW_PASSENGER_APP_TARGET='+json.dumps({'expression':raw[:230]}))
          ht=home/'mojplaywin.com/.htaccess'
          for number,line in enumerate(ht.read_text().splitlines(),1):
            if line.startswith(('RewriteEngine','RewriteRule','RewriteCond','PassengerAppRoot','PassengerBaseURI')):
              print('MPW_STORE_ROUTING_LINE='+json.dumps({'line':number,'directive':line[:210]}))
          bases=[home/'Saeit',home/'mojplaywin.com',home/'mojplaywin_main',home/'apps',home/'mojplaywin_django',home/'django_app',home/'projects']
          hits=[]
          count=0
          for base in bases:
            if not base.is_dir() or base.is_symlink():continue
            for dirpath,dirs,files in os.walk(base):
              current=Path(dirpath)
              depth=len(current.relative_to(base).parts)
              dirs[:]=[d for d in dirs if d not in ('.git','var','.venv','venv','node_modules','__pycache__','.backups','factory-releases','factory-previews') and depth<7]
              for name in files:
                if not name.endswith(('.html','.py')):continue
                target=current/name
                try:
                  if target.is_symlink() or target.stat().st_size>180000:continue
                  raw=target.read_bytes()
                  if b'Useful ideas, made to explore.' in raw or b'mojplaywin/store.html' in raw or b'mpw-store-ten-guides' in raw:
                    hits.append({'path':str(target),'sha':hashlib.sha256(raw).hexdigest(),
                      'useful_hero':b'Useful ideas, made to explore.' in raw,
                      'render_store':b'mojplaywin/store.html' in raw,
                      'has_ten_guides':b'mpw-store-ten-guides' in raw})
                except Exception:pass
                count+=1
              if len(hits)>70:break
          print('MPW_STORE_RENDERER_LOCATE='+json.dumps({'scanned':count,'matches':hits[:80]}))
          PY
