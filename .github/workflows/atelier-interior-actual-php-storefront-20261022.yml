name: Atelier 879 actual MojPlayWin PHP store route surgical publication
on:
  push:
    branches: [feature/atelier-sale-readiness-20261021]
    paths:
      - ".github/workflows/atelier-interior-actual-php-storefront-20261022.yml"
permissions: {contents: read}
concurrency:
  group: atelier-879-php-route-20261022
  cancel-in-progress: false
jobs:
  live_store_only:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/atelier-sale-readiness-20261021' &&
      startsWith(github.event.head_commit.message, '[owner-atelier-php-store-20261022]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Selftest exact PHP modification guard
        run: |
          set -euo pipefail
          python3 -B scripts/atelier_interior_actual_php_store_cta_20261022.py selftest
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Baseline MojPlayWin and protected sibling pages
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/atelier-php-before"
          for p in / /store/ /games/ /store/product/879/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            s="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$p" || true)"
            test "$s" != 000
            printf '%s=%s\n' "$p" "$s" >> "$RUNNER_TEMP/atelier-php-before"
          done
      - name: Add exact product 879 public card inside real store route PHP only
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_actual_php_store_cta_20261022.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel \
            "ATELIER_OWNER_PHP_STOREFRONT=20261022-owner-879 PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64' activate"
      - name: Check actual live store contains purchase CTA, original vector disclosure, protected checkout
        run: |
          set -euo pipefail
          good=0
          for attempt in $(seq 1 16); do
            s="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/atelier-php-store.html" -w '%{http_code}' "https://mojplaywin.com/store/?atelier_php_release_probe=$attempt" || true)"
            if test "$s" = 200 && \
               grep -Fq 'atelier-original-vector-879' "$RUNNER_TEMP/atelier-php-store.html" && \
               grep -Fq 'store/product/879/checkout/' "$RUNNER_TEMP/atelier-php-store.html" && \
               grep -Fq 'Demo photographs are NOT included' "$RUNNER_TEMP/atelier-php-store.html" && \
               grep -Fq 'US $6.80' "$RUNNER_TEMP/atelier-php-store.html"; then
              good=$((good+1))
              echo "ATELIER_PHP_PUBLIC_STORE_PROBE=PASS attempt=$attempt consecutive=$good"
            else
              good=0
              echo "ATELIER_PHP_PUBLIC_STORE_PROBE=WAIT attempt=$attempt http=$s"
            fi
            if test "$good" -ge 4; then break; fi
            sleep 6
          done
          test "$good" -ge 4
          : > "$RUNNER_TEMP/atelier-php-after"
          for p in / /store/ /games/ /store/product/879/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            s="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$p" || true)"
            printf '%s=%s\n' "$p" "$s" >> "$RUNNER_TEMP/atelier-php-after"
          done
          cmp "$RUNNER_TEMP/atelier-php-before" "$RUNNER_TEMP/atelier-php-after"
          checkout="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/store/product/879/checkout/)"
          case "$checkout" in 302|303) ;; *) echo "UNEXPECTED_GUEST_CHECKOUT_$checkout"; exit 1;; esac
          file="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/commerce/download/879/)"
          test "$file" != 200 && test "$file" != 000
          echo "ATELIER_ACTUAL_PUBLIC_SALE_CARD=PASS card=879 price_usd=6.80 direct_checkout=available customer_login_required=true guest_private_zip_denied=true real_paid_buyer_tested=false"
      - name: Restore exact PHP storefront source on failure without removing active Product
        if: failure()
        continue-on-error: true
        run: |
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_actual_php_store_cta_20261022.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 105s ssh -T -F "$d/config" saeit-cpanel \
            "ATELIER_OWNER_PHP_STOREFRONT_ROLLBACK=20261022-owner-879 PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64' rollback"
