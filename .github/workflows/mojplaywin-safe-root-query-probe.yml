name: MojPlayWin exact root rewrite query-only live probe
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-safe-root-query-probe.yml"]
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-only-root-deploy
  cancel-in-progress: false
jobs:
  guarded-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate constrained probe script
        run: |
          python3 -m py_compile scripts/mojplaywin_safe_root_rewrite.py
          grep -q '__mpw_root_probe_20261017=exact' scripts/mojplaywin_safe_root_rewrite.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Capture independently served subsite status baseline
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/guarded-route-before.txt"
          for path in / /saman/ /picm/login/ /farnaz/ /studio.Roham/ /mojtaba.roozegar/ /store/ /games/; do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 18 "https://mojplaywin.com$path")
            printf '%s %s\n' "$path" "$status" >> "$RUNNER_TEMP/guarded-route-before.txt"
          done
          echo "UNTOUCHED_ROUTE_BASELINE_OK"
      - name: Arm exact root-query-only rewrite, examine response, rollback unconditionally
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          armed=no
          cleanup(){
            if test "$armed" = yes; then
              timeout 35s ssh -T -F "$d/config" saeit-cpanel 'python3 - rollback' < scripts/mojplaywin_safe_root_rewrite.py ||
                echo "INDEPENDENT_120_SECOND_WATCHDOG_ARMED"
            fi
          }
          trap cleanup EXIT
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'python3 - probe-root' < scripts/mojplaywin_safe_root_rewrite.py
          armed=yes
          python3 - <<'PY'
          import urllib.request,json
          url="https://mojplaywin.com/?__mpw_root_probe_20261017=exact"
          req=urllib.request.Request(url,headers={"Cache-Control":"no-store","User-Agent":"MojPlayWin-exact-root-query-probe"})
          with urllib.request.urlopen(req,timeout=24) as resp:
              body=resp.read(1000).decode("utf-8",errors="replace")
              code=resp.status
          result={"classification":"PRODUCTION_EXACT_ROOT_QUERY_REWRITE_PROBE",
                  "response_status":code,
                  "exact_root_rewrite_works":body.strip()=="mpw-approved-artifact-39034323161",
                  "looks_like_passenger_original":("MojPlayWin" in body or len(body)>=900),
                  "release_authorized":False}
          print(json.dumps(result,sort_keys=True),flush=True)
          PY
          cleanup
          armed=no
      - name: Verify exact original .htaccess and protected routes stayed the same
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          current=$(timeout 25s ssh -T -F "$d/config" saeit-cpanel 'sha256sum /home/zomorod2/mojplaywin.com/.htaccess'| cut -d' ' -f1)
          test "$current" = 4f261f4563494f7ba8e9947e3ebcaa915815b5ffc451ad7348f3620300a695fd
          : > "$RUNNER_TEMP/guarded-route-after.txt"
          for path in / /saman/ /picm/login/ /farnaz/ /studio.Roham/ /mojtaba.roozegar/ /store/ /games/; do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 18 "https://mojplaywin.com$path")
            printf '%s %s\n' "$path" "$status" >> "$RUNNER_TEMP/guarded-route-after.txt"
          done
          cmp "$RUNNER_TEMP/guarded-route-before.txt" "$RUNNER_TEMP/guarded-route-after.txt"
          echo "EXACT_ROOT_QUERY_PROBE_REVERTED_NO_SITE_CHANGES"
