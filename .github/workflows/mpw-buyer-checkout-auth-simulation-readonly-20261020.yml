name: MojPlayWin two verified books authenticated buyer nonpayment path audit
# Fresh read-only production checkout and authenticated nonpayment inspection 2026-10-24.
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-buyer-checkout-auth-simulation-readonly-20261020.yml"]
permissions: {contents: read}
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate the existing audit performs no actual payment
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_two_books_checkout_effective_handler_audit_20261019.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/mpw_two_books_checkout_effective_handler_audit_20261019.py').read_text()
          assert 'RequestFactory' in s and 'MPW_BOOK_FAKE_SIGNED_IN_RENDER' in s
          assert 'read_only' in s and 'order_or_payment_created' in s
          print('MPW_AUTHENTICATED_NONPAYMENT_AUDIT_SOURCE=PASS')
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only simulated signed-in page render and exact checkout handler mapping
        run: |
          set -euo pipefail
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_two_books_checkout_effective_handler_audit_20261019.py
      - name: Confirm real public buyer registration and checkout login guards
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          origin='https://mojplaywin.com'
          for route in ('/accounts/login/','/accounts/register/','/store/product/72/','/store/product/225/','/store/product/72/checkout/','/store/product/225/checkout/'):
              with urllib.request.urlopen(origin+route,timeout=18) as resp:
                  page=resp.read(250000).decode('utf8','replace')
                  if resp.status!=200:raise RuntimeError('Unexpected buyer route status: '+route)
                  if route.startswith('/store/product/') and route.endswith('/checkout/') and 'login' not in resp.geturl().lower():
                      raise RuntimeError('Checkout anonymously accessible with no login: '+route)
                  print('MPW_BUYER_ACCOUNT_ROUTE='+route+' HTTP=200 LOGIN_REDIRECT='+str('login' in resp.geturl().lower()))
          print('MPW_REAL_PAYMENT_TRANSFER_NOT_ATTEMPTED=PASS')
          PY
      - name: Diagnose signed-in checkout rendering without orders or payments
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,traceback
          from pathlib import Path
          root=Path('/home/zomorod2/Saeit-staging')
          assert root.is_dir() and not root.is_symlink()
          os.chdir(root);sys.path.insert(0,str(root))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.test import RequestFactory
          from django.template.loader import get_template
          from django.template import TemplateDoesNotExist
          from mpw_commerce.product_checkout_page import product_checkout_page,approved_for_checkout
          from core.models import Product
          from types import SimpleNamespace
          try:
              tmpl=get_template('mpw_commerce/product_checkout.html')
              print('MPW_CHECKOUT_TEMPLATE='+json.dumps({'found':True,'origin_name':Path(tmpl.origin.name).name}))
          except TemplateDoesNotExist:
              print('MPW_CHECKOUT_TEMPLATE='+json.dumps({'found':False}))
          for pk in (72,225):
              req=RequestFactory().get(f'/store/product/{pk}/checkout/',secure=True,HTTP_HOST='mojplaywin.com')
              req.user=SimpleNamespace(is_authenticated=True,is_active=True,pk=-1000,username='read-only-checkout-audit')
              product=Product.objects.select_related('knowledge_article').get(pk=pk)
              print('MPW_CHECKOUT_GATE='+json.dumps({'product':pk,'eligible':approved_for_checkout(req,product) is True}))
              try:
                  response=product_checkout_page(req,pk)
                  print('MPW_CHECKOUT_RENDER='+json.dumps({'product':pk,'status':response.status_code,'size':len(response.content),'successful':response.status_code==200 and len(response.content)>1000}))
              except Exception as e:
                  stack=[{'file':Path(f.filename).name,'function':f.name,'line':f.lineno} for f in traceback.extract_tb(e.__traceback__)[-10:]]
                  print('MPW_CHECKOUT_RENDER='+json.dumps({'product':pk,'exception':type(e).__name__,'stack':stack,'read_only':True}))
          import ast,re
          source=(root/'mpw_commerce/product_checkout_page.py').read_text('utf8','replace')
          tree=ast.parse(source)
          fn=next((node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name=='_apply_two_book_strict_csp'),None)
          if fn is not None:
              snippet=ast.get_source_segment(source,fn) or ''
              safe=[]
              for line in snippet.splitlines()[:95]:
                  safe.append('[sensitive_line_redacted]' if re.search(r'password|private_key|api_key|mnemonic|secret|token|credential|wallet_address',line,re.I) else line[:210])
              print('MPW_CSP_FUNCTION_SOURCE='+json.dumps({'lines':safe,'start':fn.lineno,'end':fn.end_lineno},ensure_ascii=False))
          else:
              print('MPW_CSP_FUNCTION_SOURCE='+json.dumps({'missing':True}))
          from unittest.mock import patch
          import re
          for pk in (72,225):
              r=RequestFactory().get(f'/store/product/{pk}/checkout/',secure=True,HTTP_HOST='mojplaywin.com')
              r.user=SimpleNamespace(is_authenticated=True,is_active=True,pk=-1000,username='read-only-checkout-audit')
              with patch('mpw_commerce.product_checkout_page._apply_two_book_strict_csp',side_effect=lambda response:response):
                  response=product_checkout_page(r,pk)
              body=response.content
              scripts=re.findall(rb'<script(?:\s[^>]*)?>(.*?)</script\s*>',body,re.I|re.S)
              styles=re.findall(rb'<style(?:\s[^>]*)?>(.*?)</style\s*>',body,re.I|re.S)
              metas=re.findall(rb'<meta[^>]{0,220}charset[^>]{0,100}>',body,re.I)
              print('MPW_CSP_MARKUP_SHAPE='+json.dumps({'product':pk,'body_bytes':len(body),'scripts':len(scripts),'styles':len(styles),'strict_charset':b'<meta charset="utf-8">' in body,'charset_tags':[x.decode('utf8','replace')[:130] for x in metas[:3]],'script_tag_count':len(re.findall(rb'<script\b',body,re.I)),'style_tag_count':len(re.findall(rb'<style\b',body,re.I)),'simulation_only':True}))
          print('MPW_CHECKOUT_DIAG_READONLY=PASS')
          PY
      - name: Remove encrypted SSH relay temporary files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
