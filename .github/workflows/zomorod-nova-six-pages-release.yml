name: Publish six content-rich Zomorod Nova pages if paths are missing
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-nova-six-pages-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-nova-new-corporate-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Verify full topic-specific page content
        run: |
          set -euo pipefail
          test "$(stat -c %s content/zomorod-nova-pages/details.css)" -gt 6000
          for slug in company about services industry research knowledge; do
            test "$(stat -c %s content/zomorod-nova-pages/$slug.html)" -gt 7000
            grep -Fq 'zm-nova-subpage-v1' "content/zomorod-nova-pages/$slug.html"
          done
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Refuse replacing any existing page; preserve root and subsites
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; web="$HOME/public_html"; backup="$HOME/.backups/zomorod-nova-six-pages/$sha"
          pages=(company about services industry research knowledge)
          test -s "$web/index.html" && grep -Fq 'zm-nova-home-2026-v1' "$web/index.html"
          test -s "$web/site-heritage/home-before-redesign/index.html"
          test -s "$web/agriculture/index.html"
          test -f "$web/.htaccess" && test ! -L "$web/assets"
          test ! -e "$web/assets/zm-nova-detail-v1.css"
          for slug in "${pages[@]}"; do
            if test -e "$web/$slug" || test -L "$web/$slug"; then
              echo "NOVA_SIX_PATH_CONFLICT=$slug"; exit 4
            fi
          done
          for dir in mohammad ghanadi amozeshgah; do test -s "$web/$dir/index.html"; done
          mkdir -p "$(dirname "$backup")"; test ! -e "$backup"
          mkdir -m 700 "$backup"; mkdir -m 700 "$backup/staging"
          sha256sum "$web/index.html" "$web/.htaccess" "$web/agriculture/index.html" \
            "$web/site-heritage/home-before-redesign/index.html" \
            "$web/mohammad/index.html" "$web/ghanadi/index.html" "$web/amozeshgah/index.html" > "$backup/immutable.sha256"
          echo "NOVA_SIX_BASELINE=verified"
          REMOTE
      - name: Stage new pages privately outside the document root
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          tar -cf - -C content/zomorod-nova-pages \
            company.html about.html services.html industry.html research.html knowledge.html details.css |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C /home/zomorod2/.backups/zomorod-nova-six-pages/$GITHUB_SHA/staging"
          echo "NOVA_SIX_STAGING=verified"
      - name: Publish six pages only with full automatic rollback and public verification
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; web="$HOME/public_html"; backup="$HOME/.backups/zomorod-nova-six-pages/$sha"
          src="$backup/staging"; css="$web/assets/zm-nova-detail-v1.css"
          pages=(company about services industry research knowledge)
          rollback() {
            set +e
            for slug in "${pages[@]}"; do
              folder="$web/$slug"
              if test -f "$folder/index.html" && test -f "$src/$slug.html" && cmp -s "$folder/index.html" "$src/$slug.html"; then
                rm -f "$folder/index.html" "$folder/.htaccess"
                rmdir "$folder" 2>/dev/null || true
              fi
            done
            if test -f "$css" && cmp -s "$css" "$src/details.css"; then rm -f "$css"; fi
            echo "NOVA_SIX_ROLLBACK=complete"
          }
          active=1
          trap 'rc=$?; trap - EXIT; if test "$active" = 1; then rollback; fi; exit "$rc"' EXIT
          test -s "$src/details.css"
          for slug in "${pages[@]}"; do
            test -s "$src/$slug.html" && test ! -e "$web/$slug"
          done
          cp -p "$src/details.css" "$css.stage.$sha"
          chmod 644 "$css.stage.$sha"; mv -n "$css.stage.$sha" "$css"
          cmp -s "$src/details.css" "$css"
          for slug in "${pages[@]}"; do
            folder="$web/$slug"; mkdir -m 755 "$folder"
            cp -p "$src/$slug.html" "$folder/index.html"
            chmod 644 "$folder/index.html"
            printf 'PassengerEnabled off\nDirectoryIndex index.html\nOptions -Indexes\n' > "$folder/.htaccess"
            chmod 644 "$folder/.htaccess"
            cmp -s "$src/$slug.html" "$folder/index.html"
            echo "NOVA_SIX_PAGE_ADDED=$slug"
          done
          for slug in "${pages[@]}"; do
            response="$backup/$slug.public.html"
            code="$(curl -sS -L --max-time 22 -o "$response" -w '%{http_code}' "https://zomorodmelal.ir/$slug/?nova=$sha" || true)"
            echo "NOVA_SIX_PAGE_HTTP=$slug status=$code"
            test "$code" = 200
            grep -Fq 'zm-nova-subpage-v1' "$response"
          done
          css_status="$(curl -sS -L --max-time 22 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/assets/zm-nova-detail-v1.css?v=$sha" || true)"
          echo "NOVA_SIX_CSS_HTTP=$css_status"
          test "$css_status" = 200
          for route in / /agriculture/ /site-heritage/home-before-redesign/ /mohammad/ /ghanadi/ /amozeshgah/; do
            code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "NOVA_SIX_PROTECTED=$route code=$code"
            test "$code" = 200
          done
          sha256sum -c --status "$backup/immutable.sha256"
          active=0; trap - EXIT
          echo "NOVA_SIX_PUBLICATION=passed"
          REMOTE
      - name: Clear runner SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
