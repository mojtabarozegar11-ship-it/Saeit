name: Prepare authentic factory owner-review packets on VPS
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_owner_review_packets_20261020.py"
      - "tests/test_factory_owner_review_packets_20261020.py"
      - "scripts/factory_zip_transport_shards_20261020.py"
      - "tests/test_factory_zip_transport_shards_20261020.py"
      - ".github/workflows/vps-factory-owner-review-packets-20261020.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-private-owner-review-packets
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private evidence packet code and no commercial approvals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/factory_owner_review_packets_20261020.py
          python3 -m unittest discover -s tests -p test_factory_owner_review_packets_20261020.py -v
          python3 -m unittest discover -s tests -p test_factory_zip_transport_shards_20261020.py -v
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/factory_owner_review_packets_20261020.py').read_text()
          assert 'commercial_release": False' in source
          assert 'store_publication": False' in source
          for forbidden in ('urllib.request','requests.post(','subprocess.run(','FactoryReleaseGate.objects.create','human_attestation=True'):
              assert forbidden not in source,forbidden
          print('OWNER_REVIEW_NO_COMMERCIAL_AUTOMATION=PASS')
          PY
      - name: Stage hash-pinned owner-review packet utility on VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-review-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-private-factory
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/key
            UserKnownHostsFile $d/known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -T -F "$d/config" saeit-private-factory 'test "$(id -un)" = githubops && test -d "$HOME/factory-runtime/private/autonomous-product-cycle/production-instructions/orders"'
          stage="/home/githubops/factory-runtime/operations/.review-packet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -T -F "$d/config" saeit-private-factory "umask 077; test ! -e '$stage'; mkdir -m 700 '$stage'"
          scp -q -F "$d/config" scripts/factory_owner_review_packets_20261020.py "saeit-private-factory:$stage/review.py"
          scp -q -F "$d/config" scripts/factory_zip_transport_shards_20261020.py "saeit-private-factory:$stage/shards.py"
          sha="$(sha256sum scripts/factory_owner_review_packets_20261020.py | awk '{print $1}')"
          ssh -T -F "$d/config" saeit-private-factory "test ! -L '$stage/review.py' && test \"\$(sha256sum '$stage/review.py' | awk '{print \$1}')\" = '$sha'"
          timeout 100s ssh -T -F "$d/config" saeit-private-factory "python3 -B '$stage/review.py' --factory-private-root /home/githubops/factory-runtime/private/autonomous-product-cycle"
          shard_sha="$(sha256sum scripts/factory_zip_transport_shards_20261020.py | awk '{print $1}')"
          ssh -T -F "$d/config" saeit-private-factory "test ! -L '$stage/shards.py' && test \"\$(sha256sum '$stage/shards.py' | awk '{print \$1}')\" = '$shard_sha'"
          timeout 100s ssh -T -F "$d/config" saeit-private-factory "python3 -B '$stage/shards.py' --factory-private-root /home/githubops/factory-runtime/private/autonomous-product-cycle"
          echo OWNER_REVIEW_PACKET_STAGE=COMPLETED
      - name: Validate actual VPS packets, no modified production approvals
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-review-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-private-factory 'python3 -' <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/'factory-runtime/private/autonomous-product-cycle'
          folder=root/'product-lifecycle/owner-review-queue'
          data=json.loads((folder/'dashboard.json').read_text(encoding='utf8'))
          assert data['schema']=='saeit.factory.owner-review-queue.v1'
          assert data['counts'].get('manufacturing_orders',0)>=1
          technical=json.loads((root/'product-lifecycle/product-technical-readiness/dashboard.json').read_text())
          assert technical['schema']=='saeit.factory.technical-readiness-dashboard.v1'
          assert technical['commercial_approval_count']==0 and technical['publications']==0
          assert technical['counts'].get('goods_inspected',0)>=1
          for item in technical['items']:
              assert item['evidence_sha256']
              path=root/'product-lifecycle/product-technical-readiness'/item['recipe']/(item['evidence_sha256']+'.json')
              assert path.is_file() and not path.is_symlink()
              import hashlib
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['evidence_sha256']
          print('REAL_VPS_PRIVATE_GOODS_TECHNICAL_QA='+json.dumps(technical['counts'],sort_keys=True))
          defects=[{"recipe":item["recipe"],"blockers":item["blockers"]}
                   for item in technical["items"] if not item["technical_ok"]]
          print('REAL_VPS_PRIVATE_TECHNICAL_REWORK='+json.dumps(defects,sort_keys=True))

          # Aggregate ZIP structure only; do not display customer content, manifests or secrets.
          import zipfile
          for name in ("fieldwork_vector_illustration_suite","fieldwork_ui_48_icons"):
              product_dir=root/"digital-products"/name
              manifest=product_dir/"manufacturing_manifest.json"
              artifact=product_dir/(name+"-internal-qa.zip")
              m=json.loads(manifest.read_text()) if manifest.is_file() and not manifest.is_symlink() else {}
              if artifact.is_file() and not artifact.is_symlink():
                  with zipfile.ZipFile(artifact) as archive:
                      infos=archive.infolist()
                      stats={"recipe":name,"zip_files":len(infos),
                             "unpacked_bytes":sum(x.file_size for x in infos),
                             "compressed_bytes":artifact.stat().st_size,
                             "family_id":m.get("family_id"),
                             "manifest_files":len(m.get("files",[])) if isinstance(m.get("files"),list) else None,
                             "qa_policy":(m.get("qa_measurements") or {}).get("review_kind") if isinstance(m.get("qa_measurements"),dict) else None}
                      if name=="fieldwork_vector_illustration_suite":
                          from collections import Counter
                          from pathlib import PurePosixPath
                          ext=Counter(PurePosixPath(x.filename).suffix.lower() or "(none)" for x in infos)
                          stats["extension_counts"]=dict(sorted(ext.items()))
                          stats["has_qa_gates"]=isinstance(m.get("qa_measurements"),dict)
                          stats["is_approved_for_sale"]=m.get("owner_publication_approval")
                      print("REAL_VPS_DEFECT_ARCHIVE_STRUCTURE="+json.dumps(stats,sort_keys=True))

          assert len(defects)==technical["counts"].get("technical_rework_required",0)
          starters=data.get('passport_starters',[])
          assert len(starters)==data['counts'].get('manufacturing_orders',0)
          for entry in starters:
              candidate=root/'product-lifecycle/passport-starters'/entry['work_order']/(entry['source_sha256']+'-'+entry['starter_sha256']+'.json')
              assert candidate.is_file() and not candidate.is_symlink()
              import hashlib
              assert hashlib.sha256(candidate.read_bytes()).hexdigest()==entry['starter_sha256']
              doc=json.loads(candidate.read_text())
              assert doc['is_official_product_passport'] is False
              assert doc['commercial_release'] is False and doc['store_publication'] is False
              assert doc['human_review_signature_verified'] is False
          print('VPS_REAL_ORDER_PASSPORT_STARTERS='+str(len(starters)))
          assert data['approval_records_written']==0
          assert data['products_activated']==0 and data['payments_created']==0
          assert data['sites_contacted']==0
          assert (root/'product-lifecycle/dashboard.json').is_file()
          for item in data['packets']:
              file=folder/item['work_order']/(item['source_sha256']+'-'+item['packet_sha256']+'.json')
              assert file.is_file() and not file.is_symlink()
              import hashlib
              assert hashlib.sha256(file.read_bytes()).hexdigest()==item['packet_sha256']
              assert json.loads(file.read_text())['commercial_release'] is False
          print('REAL_VPS_MANUFACTURING_ORDERS_PREPARED='+str(len(data['packets'])))
          print('REAL_VPS_RESEARCH_AWAITING_EVIDENCE='+str(data['counts'].get('research_waiting_for_real_evidence',0)))
          shards_root=root/'product-lifecycle/private-transport-shards'
          verified_parts=0
          verified_files=0
          for name in (
              'fieldwork_arithmetic_assessment_packs',
              'fieldwork_arithmetic_mini_courses',
              'fieldwork_arithmetic_teacher_kits',
              'fieldwork_offline_operations_guides',
              'fieldwork_vector_illustration_suite',
          ):
              manufacture=root/'digital-products'/name/'manufacturing_manifest.json'
              record=json.loads(manufacture.read_text())
              digest=record['artifact_sha256']
              receipt=shards_root/name/digest/'receipt.json'
              assert receipt.is_file() and not receipt.is_symlink()
              doc=json.loads(receipt.read_text())
              assert doc['reconstruction_verified'] is True
              assert doc['public_distribution_allowed'] is False
              assert doc['commercial_review_complete'] is False
              assert all(s['members']<=80 for s in doc['parts'])
              verified_parts+=len(doc['parts'])
              verified_files+=len(doc['files'])
          print('REAL_VPS_PRIVATE_SHARD_PRODUCTS=5')
          print('REAL_VPS_PRIVATE_SHARD_PARTS='+str(verified_parts))
          print('REAL_VPS_PRIVATE_SHARD_FILES='+str(verified_files))
          print('REAL_VPS_REVIEW_PACKET_NO_FALSE_PUBLICATION=PASS')
          PY
      - name: Remove SSH key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/factory-review-ssh"
# Owner-requested next-stage private QA and release-gate verification, 2026-10-20; commercial permission unchanged.
