name: Factory VPS Factory Data Inventory
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-factory-data-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Verify independent factory runtime assets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -f "$base/django-app/manage.py"
          test -f "$base/django-app/core/models.py"
          test -f "$base/django-app/config/settings.py"
          test -x "$base/.venv/bin/python"
          test -f "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"
          "$base/.venv/bin/python" -c 'import django,sqlite3; print("DJANGO",django.get_version())'
          "$base/.venv/bin/python" - <<'PY'
          import os,sqlite3
          path=os.path.expanduser("~/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3")
          conn=sqlite3.connect("file:"+path+"?mode=ro",uri=True)
          tables=[r[0] for r in conn.execute("select name from sqlite_master where type='table' and name like 'core_factory%' order by name")]
          for name in tables:
              columns=[r[1] for r in conn.execute('pragma table_info("'+name+'")')]
              count=conn.execute('select count(*) from "'+name+'"').fetchone()[0]
              fks=[r[2] for r in conn.execute('pragma foreign_key_list("'+name+'")')]
              print("FACTORY_TABLE",name,"ROWS",count,"FK_TABLES",",".join(sorted(set(fks))) or "none")
          agents=conn.execute("select name from sqlite_master where type='table' and name='core_agent'").fetchone()
          if agents:
              print("AGENT_COLUMNS",",".join(r[1] for r in conn.execute('pragma table_info(core_agent)')))
          conn.close()
          PY
          echo FACTORY_DATA_INVENTORY_COMPLETE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
