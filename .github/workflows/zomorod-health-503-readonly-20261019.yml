name: Zomorod 503 read-only root health diagnosis
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-health-503-readonly-20261019.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-503-root-readonly
  cancel-in-progress: false
jobs:
  root-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Check active Django DB backend without writing or revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Saeit"
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit/3.10/bin/python" - <<'PY'
          import os,sys,sqlite3,urllib.parse,pathlib
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          from django.conf import settings
          cfg=settings.DATABASES["default"]
          backend=str(cfg["ENGINE"]).rsplit(".",1)[-1]
          print("ROOT_DB_BACKEND="+backend)
          print("ROOT_DATABASE_ENV_CONFIGURED="+str(bool(os.environ.get("DATABASE_URL"))))
          if backend=="sqlite3":
              p=pathlib.Path(str(cfg["NAME"]))
              if not p.is_absolute(): p=pathlib.Path.cwd()/p
              print("ROOT_DB_FILE_PRESENT="+str(p.is_file()))
              if not p.is_file():print("ROOT_DATABASE_HEALTH=failed_missing_file");sys.exit(0)
              try:
                  db=sqlite3.connect("file:"+urllib.parse.quote(str(p))+"?mode=ro",uri=True,timeout=3)
                  try:
                      db.execute("SELECT 1").fetchone()
                      print("ROOT_DATABASE_HEALTH=ok")
                  finally: db.close()
              except Exception as exc:
                  print("ROOT_DATABASE_HEALTH=failed_"+type(exc).__name__)
          else:
              try:
                  from django.db import connections
                  with connections["default"].cursor() as cursor:
                      cursor.execute("SELECT 1")
                      cursor.fetchone()
                  print("ROOT_DATABASE_HEALTH=ok")
              except Exception as exc:
                  print("ROOT_DATABASE_HEALTH=failed_"+type(exc).__name__)
          PY
          REMOTE
      - name: Probe exact public Django health route with sanitized response fields
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          url="https://zomorodmelal.ir/api/health/?__ro_503_audit=20261019"
          request=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"ZomorodReadOnlyAudit/2026"},method="GET")
          try:
              with urllib.request.urlopen(request,timeout=23) as response:
                  status=response.status
                  mime=response.headers.get("Content-Type","")
                  data=response.read(4096)
          except urllib.error.HTTPError as exc:
              status=exc.code;mime=exc.headers.get("Content-Type","");data=exc.read(4096)
          except Exception as exc:
              print("ROOT_HEALTH_HTTP=0")
              print("ROOT_HEALTH_FAILURE_CLASS="+type(exc).__name__)
              raise SystemExit(1)
          print("ROOT_HEALTH_HTTP="+str(status))
          print("ROOT_HEALTH_MEDIA_TYPE="+("json" if "json" in mime.lower() else "nonjson"))
          if "json" in mime.lower():
              try:
                  j=json.loads(data)
                  for key in ("status","service","database","error"):
                      if key in j and isinstance(j[key],str):
                          print("ROOT_HEALTH_"+key.upper()+"="+j[key][:65])
              except (ValueError,TypeError):print("ROOT_HEALTH_BODY_PARSE=invalid")
          if status!=200:raise SystemExit(1)
          PY
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
