name: Zomorod 503 read-only root health diagnosis
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-health-503-readonly-20261019.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-503-root-readonly
  cancel-in-progress: false
jobs:
  root-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Check active Django DB backend without writing or revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Saeit"
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit/3.10/bin/python" - <<'PY'
          import os,sys,sqlite3,urllib.parse,pathlib
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          from django.conf import settings
          cfg=settings.DATABASES["default"]
          backend=str(cfg["ENGINE"]).rsplit(".",1)[-1]
          print("ROOT_DB_BACKEND="+backend)
          print("ROOT_DATABASE_ENV_CONFIGURED="+str(bool(os.environ.get("DATABASE_URL"))))
          if backend=="sqlite3":
              p=pathlib.Path(str(cfg["NAME"]))
              if not p.is_absolute(): p=pathlib.Path.cwd()/p
              print("ROOT_DB_FILE_PRESENT="+str(p.is_file()))
              if not p.is_file():print("ROOT_DATABASE_HEALTH=failed_missing_file");sys.exit(0)
              try:
                  db=sqlite3.connect("file:"+urllib.parse.quote(str(p))+"?mode=ro",uri=True,timeout=3)
                  try:
                      db.execute("SELECT 1").fetchone()
                      print("ROOT_DATABASE_HEALTH=ok")
                  finally: db.close()
              except Exception as exc:
                  print("ROOT_DATABASE_HEALTH=failed_"+type(exc).__name__)
          else:
              try:
                  from django.db import connections
                  with connections["default"].cursor() as cursor:
                      cursor.execute("SELECT 1")
                      cursor.fetchone()
                  print("ROOT_DATABASE_HEALTH=ok")
              except Exception as exc:
                  print("ROOT_DATABASE_HEALTH=failed_"+type(exc).__name__)
          PY
          "$HOME/virtualenv/Saeit/3.10/bin/python" - <<'PY'
          import os,re
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.test import Client
          from django.conf import settings
          selector=Path.home()/"public_html"/".htaccess"
          if selector.is_file():
              t=selector.read_text(errors="replace")
              names=[line.split('"')[1] for line in t.splitlines() if line.strip().startswith("PassengerPython ") and line.count('"')>=2]
              print("ROOT_PASSENGER_MODE="+",".join("selector" if x.endswith("/lswsgi") else "virtualenv" if "/virtualenv/Saeit/" in x else "other" for x in names))
          try:
              response=Client(HTTP_HOST="zomorodmelal.ir").get("/api/health/",secure=True)
              print("ROOT_DJANGO_CLIENT_HEALTH_STATUS="+str(response.status_code))
          except Exception as exc:
              print("ROOT_DJANGO_CLIENT_HEALTH_ERROR="+type(exc).__name__)
          PY
          REMOTE
      - name: Diagnose three public 500 routes with read-only Django schema and GET
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Saeit"
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit/3.10/bin/python" - <<'PY'
          import contextlib, io, logging, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connections
          from django.test import Client
          from core.academy_views import EducationTrack, EducationCourse
          from core.company_content_views import CompanyGalleryMedia
          from core.newsletter_views import NewsletterStory, NewsletterSource, NewsletterPublication, NewsletterSchedule

          groups = {
              "academy": (EducationTrack, EducationCourse),
              "company_gallery": (CompanyGalleryMedia,),
              "newsletter": (NewsletterStory, NewsletterSource, NewsletterPublication, NewsletterSchedule),
          }
          try:
              tables = set(connections["default"].introspection.table_names())
              for group, models in groups.items():
                  missing = sum(model._meta.db_table not in tables for model in models)
                  print("PUBLIC500_SCHEMA_GROUP=" + group + " MISSING_TABLE_COUNT=" + str(missing))
          except Exception as exc:
              print("PUBLIC500_SCHEMA_ERROR_CLASS=" + type(exc).__name__)

          logging.disable(logging.CRITICAL)
          client = Client(raise_request_exception=True)
          for name, route in (
              ("academy", "/academy/"),
              ("company_gallery", "/company-gallery/"),
              ("newsletter", "/newsletter/"),
          ):
              try:
                  with contextlib.redirect_stderr(io.StringIO()):
                      response = client.get(route, secure=True, HTTP_HOST="zomorodmelal.ir")
                  print("PUBLIC500_ROUTE=" + name + " DJANGO_STATUS=" + str(response.status_code))
              except Exception as exc:
                  print("PUBLIC500_ROUTE=" + name + " ERROR_CLASS=" + type(exc).__name__)
          PY
          REMOTE

      - name: Inspect own cPanel Passenger processes, capacity and sanitized error counters
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,re
          from pathlib import Path
          h=Path.home()
          stat=os.statvfs(h)
          print("ROOT_HOME_FREE_MIB="+str(stat.f_bavail*stat.f_frsize//1048576))
          print("ROOT_HOME_INODES_AVAILABLE="+str(stat.f_favail))
          cmd=subprocess.run(["ps","-u",str(os.getuid()),"-o","comm="],
                             capture_output=True,text=True,timeout=8)
          # Some versions of ps accept user names but not numeric IDs.
          if cmd.returncode==0:
              names=cmd.stdout.splitlines()
              for key in ("lswsgi","passenger","python"):
                  print("ROOT_OWN_PROCESS_"+key.upper()+"="+str(sum(key in x.lower() for x in names)))
          roots=[h/"Saeit"/"stderr.log",h/"public_html"/"error_log"]
          if (h/"logs").is_dir():
              roots += list((h/"logs").glob("*zomorod*"))[:12]
              roots += list((h/"logs").glob("*error*"))[:6]
          patterns={"startup":r"(?i)passenger|lswsgi|spawn|application startup",
                    "resource":r"(?i)resource temporarily unavailable|memory|lve|quota|limit reached|killed",
                    "upstream":r"(?i)proxy|503|timeout|connection refused"}
          for path in roots:
              if not path.is_file() or path.is_symlink():continue
              try:
                  with path.open("rb") as stream:
                      stream.seek(max(0,path.stat().st_size-131072))
                      chunk=stream.read().decode("utf-8","replace")
                  label="app" if path.name=="stderr.log" else "host"
                  print("ROOT_ERRORLOG_"+label+"_PRESENT=yes")
                  for group,pattern in patterns.items():
                      print("ROOT_ERRORLOG_"+label+"_"+group.upper()+"_COUNT="+str(len(re.findall(pattern,chunk))))
              except (OSError,ValueError):
                  print("ROOT_ERRORLOG_READ=unavailable")
          PY
          REMOTE
      - name: Compare direct cPanel origin with public host using read-only HTTPS
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          origin="$(getent ahostsv4 zohal.pws-dns.net | awk 'NR==1{print $1}' || true)"
          case "$origin" in
            ''|*[!0-9.]*)
              echo "ROOT_ORIGIN_DNS=unavailable"
              exit 0
              ;;
          esac
          echo "ROOT_ORIGIN_DNS=resolved"
          for target in "$origin" 127.0.0.1; do
            if test "$target" = 127.0.0.1; then label=loopback; else label=cpanel_origin; fi
            for path in / /api/health/; do
              output="$(curl -sS --max-time 14 --resolve "zomorodmelal.ir:443:$target" -o /dev/null -w '%{http_code}|%{content_type}' "https://zomorodmelal.ir$path" 2>/dev/null || true)"
              echo "ROOT_DIRECT_HTTP source=$label path=$path result=$output"
            done
          done
          REMOTE
      - name: Fingerprint current web server and Passenger integration read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          checks={
             "LITESPEED_DIRECTORY":Path("/usr/local/lsws").is_dir(),
             "LITESPEED_SELECTOR_SCRIPT":Path("/usr/local/lsws/admin/misc/enable_ruby_python_selector.sh").is_file(),
             "PASSENGER_APACHE_MODULE":any(Path(p).exists() for p in (
                "/etc/apache2/modules/mod_passenger.so",
                "/opt/cpanel/ea-ruby27/root/usr/lib64/httpd/modules/mod_passenger.so",
                "/usr/lib64/httpd/modules/mod_passenger.so")),
             "CLOUDLINUX_SELECTOR":any(Path(p).exists() for p in ("/usr/bin/cloudlinux-selector","/usr/sbin/cloudlinux-selector"))
          }
          for key,val in checks.items():print("WEB_SERVER_"+key+"="+("present" if val else "not_visible"))
          cmd=subprocess.run(["ps","-eo","comm="],capture_output=True,text=True,timeout=8)
          if cmd.returncode==0:
              names=[p.strip().lower() for p in cmd.stdout.splitlines()]
              for keyword in ("lshttpd","litespeed","httpd","nginx","lswsgi"):
                  print("WEB_SERVER_PROCESS_"+keyword.upper()+"="+str(sum(keyword in p for p in names)))
          else:print("WEB_SERVER_PROCESS_LIST=unavailable")
          PY
          for path in / /api/health/; do
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 15 -D "$tmp" -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "WEB_SERVER_HTTP_PATH=$path code=$code"
            awk 'BEGIN{IGNORECASE=1} /^Server:/ {v=tolower($0);if(index(v,"litespeed"))print "WEB_SERVER_HEADER=LITESPEED";else if(index(v,"nginx"))print "WEB_SERVER_HEADER=NGINX";else if(index(v,"apache"))print "WEB_SERVER_HEADER=APACHE";else print "WEB_SERVER_HEADER=UNIDENTIFIED"} /^X-LiteSpeed/ {print "WEB_SERVER_LITESPEED_HEADER=present"}' "$tmp"
            rm -f "$tmp"
          done
          REMOTE
      - name: Probe exact public Django health route with sanitized response fields
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          url="https://zomorodmelal.ir/api/health/?__ro_503_audit=20261019"
          request=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"ZomorodReadOnlyAudit/2026"},method="GET")
          try:
              with urllib.request.urlopen(request,timeout=23) as response:
                  status=response.status
                  mime=response.headers.get("Content-Type","")
                  data=response.read(4096)
          except urllib.error.HTTPError as exc:
              status=exc.code;mime=exc.headers.get("Content-Type","");data=exc.read(4096)
          except Exception as exc:
              print("ROOT_HEALTH_HTTP=0")
              print("ROOT_HEALTH_FAILURE_CLASS="+type(exc).__name__)
              raise SystemExit(1)
          print("ROOT_HEALTH_HTTP="+str(status))
          print("ROOT_HEALTH_MEDIA_TYPE="+("json" if "json" in mime.lower() else "nonjson"))
          if "json" in mime.lower():
              try:
                  j=json.loads(data)
                  for key in ("status","service","database","error"):
                      if key in j and isinstance(j[key],str):
                          print("ROOT_HEALTH_"+key.upper()+"="+j[key][:65])
              except (ValueError,TypeError):print("ROOT_HEALTH_BODY_PARSE=invalid")
          if status!=200:raise SystemExit(1)
          PY
      - name: Isolate mobile author HTTP 500 via sanitized read-only probes
        shell: bash
        run: |
          set -euo pipefail
          for proto in -4 -6; do
            for suffix in "?utm_source=chatgpt.com" "?utm_source=chatgpt.com&diag=20261028"; do
              result="$(curl "$proto" -sS -L --max-time 17 -A "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" -H "Cache-Control: no-cache" -o /dev/null -w '%{http_code}|%{num_redirects}|%{content_type}' "https://zomorodmelal.ir/authors/mojtaba-rozegar/$suffix" 2>/dev/null || true)"
              echo "PROFILE_PUBLIC proto=$proto tracked=$([ "$suffix" = "?utm_source=chatgpt.com" ] && echo yes || echo cachebuster) status=$result"
            done
          done
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import re, collections
          from pathlib import Path
          home=Path.home()
          candidates=[home/"Saeit"/"stderr.log",home/"public_html"/"error_log"]
          for folder in (home/"logs",home/"access-logs"):
              if folder.is_dir():
                  candidates.extend(list(folder.glob("*zomorod*"))[:15])
                  candidates.extend(list(folder.glob("*error*"))[:5])
          allowed=("OperationalError","DatabaseError","ConnectionError","TimeoutError",
              "ImportError","ModuleNotFoundError","PermissionError","FileNotFoundError",
              "InternalServerError","DisallowedHost","RuntimeError","ValueError",
              "MemoryError","ImproperlyConfigured","InterfaceError","ProgrammingError")
          counts=collections.Counter()
          found=0
          for path in dict.fromkeys(candidates):
              if not path.is_file() or path.is_symlink():continue
              try:
                  with path.open("rb") as stream:
                      stream.seek(max(0,path.stat().st_size-524288))
                      data=stream.read().decode("utf-8","replace")
              except OSError:
                  continue
              found+=1
              counts["author_path_mentions"]+=data.lower().count("/authors/mojtaba-rozegar/")
              counts["traceback_markers"]+=data.count("Traceback (most recent call last)")
              counts["generic_server_500"]+=len(re.findall(r"(?i)\b(?:HTTP[/ ]\S+\s+500|status[=: ]+500|server error \(500\))\b",data))
              for key in allowed:
                  counts["exception_"+key]+=len(re.findall(r"(?m)^\s*(?:[A-Za-z_][\w.]*\.)?"+re.escape(key)+r"\s*:",data))
          print("PROFILE_LOG_FILES_SCANNED="+str(found))
          for key in ("author_path_mentions","traceback_markers","generic_server_500"):
              print("PROFILE_LOG_"+key.upper()+"="+str(counts[key]))
          for key in allowed:
              if counts["exception_"+key]:
                  print("PROFILE_EXCEPTION_"+key+"="+str(counts["exception_"+key]))
          PY
          REMOTE
      - name: Classify recent execution error signatures without revealing messages
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,collections
          h=Path.home()
          files=[h/"Saeit"/"stderr.log",h/"public_html"/"error_log"]
          for folder in (h/"logs",h/"access-logs"):
              if folder.is_dir():
                  files+=list(folder.glob("*zomorod*"))[:15]
                  files+=list(folder.glob("*error*"))[:5]
          words=set("""no not none a an the in on with for from to by and or of this that is are was were
          cannot can could failed failure unable invalid unknown missing found expected unexpected
          error exception runtime django python import module named available installed
          app application registry populate reentrant initialized startup start
          thread threads main event loop running already process fork spawned spawn
          process processes worker workers memory limit quota resource exhausted killed
          blocked refused connection connect timeout host dns ssl tls socket
          file directory permissions permission denied allowed read write path
          method attribute object callable type required configured configuration
          settings setting database db sqlite sql connection locked busy operational
          uwsgi wsgi passenger lswsgi cloudlinux litespeed request response handler
          static content internal server django config settings urls url route view
          can't get set open close create load reload threadpool maximum exceeded
          asyncio lock shared state allowed trust proxy""".split())
          sigcounts=collections.Counter()
          hits=collections.Counter()
          for path in dict.fromkeys(files):
              if not path.is_file() or path.is_symlink():continue
              try:
                  with path.open("rb") as f:
                      f.seek(max(0,path.stat().st_size-524288))
                      lines=f.read().decode("utf-8","replace").splitlines()
              except OSError:continue
              for line in lines:
                  low=line.lower()
                  is_author="/authors/mojtaba-rozegar" in low
                  if is_author:
                      hits["author_lines"]+=1
                      if re.search(r"\b500\b",line):hits["author_with_500"]+=1
                  if "28/oct/2026" in low or "2026-10-28" in low:
                      if "500" in line:hits["today_500_mentions"]+=1
                  match=re.search(r"(?:^|\s)((?:Runtime|ModuleNotFound|Operational|Database|Connection|Permission|FileNotFound|Timeout|Import|Value)Error)\s*:\s*(.*)$",line)
                  if not match:continue
                  kind,msg=match.groups()
                  tokens=re.findall(r"[a-z]{2,}",msg.lower())[:48]
                  safe=" ".join(w for w in tokens if w in words)[:160] or "(unclassified)"
                  sigcounts[(kind,safe)]+=1
          print("PROFILE_CORRELATION_AUTHOR_LINES="+str(hits["author_lines"]))
          print("PROFILE_CORRELATION_AUTHOR_LINES_WITH_500="+str(hits["author_with_500"]))
          print("PROFILE_CORRELATION_TODAY_500_MENTIONS="+str(hits["today_500_mentions"]))
          for index,((kind,signature),count) in enumerate(sigcounts.most_common(8),1):
              print("PROFILE_SIGNATURE_"+str(index)+"_TYPE="+kind)
              print("PROFILE_SIGNATURE_"+str(index)+"_COUNT="+str(count))
              print("PROFILE_SIGNATURE_"+str(index)+"_SAFE_WORDS="+signature)
          PY
          REMOTE
      - name: Correlate today's author 500 with WSGI runtime read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re,collections
          h=Path.home()
          app=h/"Saeit"
          wsgi=app/"passenger_wsgi.py"
          if wsgi.is_file():
              w=wsgi.read_text(errors="replace")
              print("PROFILE_WSGI_FILE_MTIME_UTC="+datetime.fromtimestamp(wsgi.stat().st_mtime,timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
              print("PROFILE_WSGI_USE_ADDSITEDIR="+str(bool(re.search(r"^\s*site\.addsitedir\s*\(",w,re.M))))
              print("PROFILE_WSGI_DIRECT_CONFIG_IMPORT="+str("from config.wsgi import application" in w))
              print("PROFILE_WSGI_GUARD_LIB64="+str("lib64" in w))
          stderr=app/"stderr.log"
          if stderr.is_file():
              print("PROFILE_STDERR_MTIME_UTC="+datetime.fromtimestamp(stderr.stat().st_mtime,timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          paths=[stderr,h/"public_html"/"error_log"]
          for folder in (h/"logs",h/"access-logs"):
              if folder.is_dir():
                  paths.extend(list(folder.glob("*zomorod*"))[:15])
                  paths.extend(list(folder.glob("*error*"))[:5])
          dates=collections.Counter()
          names=collections.Counter()
          today=collections.Counter()
          for path in dict.fromkeys(paths):
              if not path.is_file() or path.is_symlink():continue
              try:
                  with path.open("rb") as f:
                      f.seek(max(0,path.stat().st_size-1048576))
                      lines=f.read().decode("utf-8","replace").splitlines()
              except OSError:continue
              for line in lines:
                  low=line.lower()
                  author="/authors/mojtaba-rozegar" in low
                  is500=bool(re.search(r"(?<!\d)500(?!\d)",line))
                  is_today=("2026-10-28" in line or "28/Oct/2026" in line)
                  if author and is500:today["author_any_500"]+=1
                  if author and is_today:today["author_today_any"]+=1
                  if author and is_today and is500:today["author_today_500"]+=1
                  if is_today and is500:today["today_500"]+=1
                  m=re.search(r"ModuleNotFoundError:\s*No module named ['\"]([a-zA-Z_][\w.]{0,75})['\"]",line)
                  if m:names[m.group(1)]+=1
                  if is500 and is_today:
                      stamp=re.search(r"(2026-10-28(?:[T ][0-9:]+)?|28/Oct/2026(?::[0-9:]+)?)",line)
                      if stamp:dates[stamp.group(1)]+=1
          for key in ("author_any_500","author_today_any","author_today_500","today_500"):
              print("PROFILE_TODAY_"+key.upper()+"="+str(today[key]))
          for name,count in names.most_common(5):
              print("PROFILE_MISSING_MODULE="+name+" count="+str(count))
          for stamp,count in dates.most_common(5):
              print("PROFILE_TODAY_500_STAMP="+stamp+" count="+str(count))
          PY
          REMOTE
      - name: Read exact author HTTP status from access logs and directory routing
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,collections
          h=Path.home()
          web=h/"public_html"
          folder=web/"authors"/"mojtaba-rozegar"
          for label,path in (("directory",folder),("index",folder/"index.html"),("local_htaccess",folder/".htaccess")):
              print("PROFILE_ROUTING_"+label.upper()+"="+("present" if path.exists() else "absent"))
          ht=web/".htaccess"
          if ht.is_file():
              data=ht.read_text(errors="replace")
              print("PROFILE_ROUTING_HTACCESS_AUTHOR_RULE_COUNT="+str(data.lower().count("authors/mojtaba-rozegar")))
              print("PROFILE_ROUTING_DIRECTORYINDEX_ENABLED="+str(any("directoryindex" in x.lower() and "index.html" in x.lower() for x in data.splitlines())))
              print("PROFILE_ROUTING_REWRITE_ENGINE="+str(any(x.strip().lower()=="rewriteengine on" for x in data.splitlines())))
          counters=collections.Counter()
          folders=(h/"logs",h/"access-logs")
          for directory in folders:
              if not directory.is_dir():continue
              for path in list(directory.glob("*zomorod*"))[:22]:
                  if not path.is_file() or path.is_symlink():continue
                  try:
                      with path.open("rb") as f:
                          f.seek(max(0,path.stat().st_size-2097152))
                          lines=f.read().decode("utf-8","replace").splitlines()
                  except OSError:continue
                  for line in lines:
                      match=re.search(r'"(GET|HEAD|POST)\s+(\S+)\s+HTTP/[0-9.]+"\s+([1-5][0-9]{2})\b',line)
                      if not match:continue
                      method,url,status=match.groups()
                      if not url.split("?",1)[0].rstrip("/").endswith("/authors/mojtaba-rozegar") and not url.split("?",1)[0].endswith("/authors/mojtaba-rozegar/index.html"):
                          continue
                      today=("28/Oct/2026" in line or "2026-10-28" in line)
                      direct=url.split("?",1)[0].endswith("/index.html")
                      tracked=("utm_source=" in url)
                      category=("direct" if direct else "pretty")+"_"+("utm" if tracked else "plain")
                      counters["all_"+category+"_"+status]+=1
                      if today:counters["today_"+category+"_"+status]+=1
                      if today and status=="500":
                          counters["today_500_android" if "android" in line.lower() else "today_500_non_android"]+=1
          for key,value in sorted(counters.items()):
              print("PROFILE_ACCESS_"+key.upper()+"="+str(value))
          PY
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
