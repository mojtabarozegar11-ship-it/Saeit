name: MojPlayWin live end-to-end staff CMS and QA acceptance
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-five-live-acceptance-20261019.yml"]
permissions: {contents: read}
concurrency: {group: mpw-five-main-only-acceptance, cancel-in-progress: false}
jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify real staff panel, agents and reversible production DB workflow
        shell: bash
        run: |
          set -euo pipefail
          timeout 125s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'cd /home/zomorod2/Saeit-staging && /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' <<'PY'
          import os,json,uuid
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django;django.setup()
          from django.db import transaction
          from django.contrib.auth import get_user_model
          from django.test import Client,RequestFactory
          from command_center.models import MpwRecord,TENANT
          from command_center.mpw_workflow import create_record,change_record
          from command_center.mpw_public import public_context,feature_enabled
          from pathlib import Path
          assert feature_enabled("MPW_CONTROL_ENABLED"),"MAIN_CONTROLS_NOT_ENABLED"
          assert not feature_enabled("MPW_ENABLE_CHECKOUT"),"PAYMENT_NOT_VERIFIED"
          assert TENANT=="mojplaywin-main"
          user=get_user_model().objects.filter(is_superuser=True,is_active=True).order_by("pk").first()
          assert user is not None,"AUTHORIZED_STAFF_MISSING"
          key="mpw-live-smoke-"+uuid.uuid4().hex[:15]
          with transaction.atomic():
              client=Client(HTTP_HOST="mojplaywin.com")
              client.force_login(user)
              ops=client.get("/staff/command-center/mpw-operations/",secure=True)
              graph=client.get("/staff/command-center/mpw-agents/",secure=True)
              api=client.get("/staff/command-center/api/mpw-agents/",secure=True)
              assert ops.status_code==200, "ADMIN_DASHBOARD_NOT_RENDERED"
              assert graph.status_code==200, "PRIVATE_GRAPH_NOT_RENDERED"
              assert api.status_code==200, "AGENT_TELEMETRY_API_NOT_RENDERED"
              data=json.loads(api.content)
              assert data.get("tenant")==TENANT
              summary=data.get("summary") or {}
              assert summary.get("total",0)>=25,"AGENT_COMPONENT_INVENTORY_EMPTY"
              content={"title":"MPW acceptance content","body":"Main-only audited content",
                       "slot":"card","group":"e2e","url":"/knowledge/","image":"site/heroes/research.webp"}
              record=create_record(user,"content",key,"/",content)
              record=change_record(user,record.pk,"submit",revision=record.revision)
              record=change_record(user,record.pk,"reject",note="Test quality defect requires rework",revision=record.revision)
              assert record.state=="needs_revision" and record.quality_note
              record=change_record(user,record.pk,"edit",payload=content,revision=record.revision)
              record=change_record(user,record.pk,"submit",revision=record.revision)
              record=change_record(user,record.pk,"qa_pass",evidence="e2e/qa-verified",revision=record.revision)
              record=change_record(user,record.pk,"approve",evidence="e2e/owner-verified",revision=record.revision)
              record=change_record(user,record.pk,"publish",revision=record.revision)
              assert record.published_snapshot["title"]=="MPW acceptance content"
              host=RequestFactory().get("/",HTTP_HOST="mojplaywin.com")
              assert any(b["key"]==key for b in public_context(host)["mpw_managed_blocks"])
              offer={"title":"MPW acceptance preview","body":"No real payment",
                     "price":"2.00","currency":"USD","checkout_path":"",
                     "rights_verified":True,"payment_verified":False,
                     "delivery_verified":False,"payment_evidence":"","delivery_evidence":""}
              product=create_record(user,"offer",key+"-offer","/store/",offer)
              product=change_record(user,product.pk,"submit",revision=product.revision)
              product=change_record(user,product.pk,"qa_pass",evidence="e2e/quality",revision=product.revision)
              product=change_record(user,product.pk,"approve",evidence="e2e/owner",revision=product.revision)
              product=change_record(user,product.pk,"publish",revision=product.revision)
              store=client.get("/store/",secure=True)
              assert store.status_code==200
              assert b"MPW acceptance preview" in store.content
              preview=public_context(RequestFactory().get("/store/",HTTP_HOST="mojplaywin.com"))["mpw_managed_offers"]
              assert any(p["key"]==key+"-offer" and not p["payable"] for p in preview)
              transaction.set_rollback(True)
          assert not MpwRecord.objects.filter(key__startswith=key).exists(),"SMOKE_RECORD_NOT_ROLLED_BACK"
          print("MPW_MAIN_LIVE_ACCEPTANCE="+json.dumps({
            "admin_http":ops.status_code,
            "agent_chart_http":graph.status_code,
            "agent_api_http":api.status_code,
            "telemetry_items":summary["total"],
            "content_qa_rework_publish":"PASS",
            "store_preview_nonpayable":"PASS",
            "ephemeral_records_rolled_back":True,
            "payment_live":False},sort_keys=True))
          PY
      - name: Remove ephemeral SSH identities
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
