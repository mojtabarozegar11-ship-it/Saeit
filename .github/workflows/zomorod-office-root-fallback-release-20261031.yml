name: Zomorod office root fallback guarded release
on:
  pull_request:
    paths:
      - ".github/workflows/zomorod-office-root-fallback-release-20261031.yml"
      - "config/urls.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-root-fallback-release-20261031.yml"
permissions:
  contents: read
concurrency:
  # Serialize with the author-route publisher: both can atomically edit live config/urls.py.
  group: zomorod-persian-author-static-safe
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate both the protected staff login and the root-only fallback source
        run: |
          set -euo pipefail
          python3 -m py_compile config/urls.py
          grep -Fq 'path("company/office/login/", RedirectView.as_view(url="/admin/login/?next=/staff/command-center/", permanent=False), name="company_office_login")' config/urls.py
          grep -Fq 'from django.views.generic import RedirectView' config/urls.py
          grep -Fq 'path("company/office/", RedirectView.as_view(url="/business/", permanent=False), name="company_office_fallback")' config/urls.py
          echo "OFFICE_LOGIN_ROUTE_SOURCE=verified"
  release:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Establish fingerprint-pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-office-root-fallback"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 110s ssh -F "$d/config" saeit-cpanel "bash -se -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          python="/home/zomorod2/virtualenv/Saeit/3.11/bin/python"
          app="/home/zomorod2/Saeit"
          test "$(id -un)" = "zomorod2"
          test -x "$python"
          test -d "$app" && test ! -L "$app"
          test "$(cd "$app" && pwd -P)" = "$app"
          test -s "$app/manage.py" && test -s "$app/passenger_wsgi.py"
          cd "$app"
          "$python" manage.py check --deploy
          python3 - "$app" "$sha" <<'PY'
          import os, pwd, shutil, stat, subprocess, sys, tempfile, time
          from pathlib import Path
          import urllib.error
          import urllib.request
          
          app = Path(sys.argv[1])
          release_id = sys.argv[2]
          if not release_id.isascii() or not release_id.isalnum() or len(release_id) != 40:
              raise SystemExit("RELEASE_ID_REJECTED")
          if pwd.getpwuid(os.geteuid()).pw_name != "zomorod2":
              raise SystemExit("CPANEL_IDENTITY_REJECTED")
          urls = app / "config" / "urls.py"
          passenger = app / "passenger_wsgi.py"
          if urls.is_symlink() or not urls.is_file() or passenger.is_symlink() or not passenger.is_file():
              raise SystemExit("APPLICATION_PATH_REJECTED")
          if not str(urls.resolve()).startswith(str(app) + os.sep):
              raise SystemExit("URLS_PATH_OUTSIDE_APPLICATION")
          original = urls.read_bytes()
          source = original.decode("utf-8")
          newline = "\r\n" if b"\r\n" in original else "\n"
          login = '    path("company/office/login/", RedirectView.as_view(url="/admin/login/?next=/staff/command-center/", permanent=False), name="company_office_login"),'
          fallback = '    path("company/office/", RedirectView.as_view(url="/business/", permanent=False), name="company_office_fallback"),'
          if source.count(login) != 1 or 'from django.views.generic import RedirectView' not in source:
              raise SystemExit("PRODUCTION_ROUTE_PRECONDITION_FAILED")
          if source.count(fallback) > 1 or ('path("company/office/",' in source and fallback not in source):
              raise SystemExit("EXISTING_OFFICE_ROOT_ROUTE_CONFLICT")
          if source.count(fallback) == 0 and 'path("company/<slug:slug>/"' not in source:
              raise SystemExit("COMPANY_ROUTE_TOPOLOGY_UNEXPECTED")
          backup = None
          modified = False
          temp_name = None
          try:
              if fallback not in source:
                  backup_root = Path("/home/zomorod2/.backups/zomorod-office-root-fallback")
                  backup_root.mkdir(mode=0o700, parents=True, exist_ok=True)
                  os.chmod(backup_root, 0o700)
                  backup_dir = backup_root / release_id
                  backup_dir.mkdir(mode=0o700)
                  backup = backup_dir / "config.urls.py.before"
                  with backup.open("xb") as stream:
                      stream.write(original)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.chmod(backup, 0o600)
                  updated = source.replace(login, login + newline + fallback, 1).encode("utf-8")
                  fd, temp_name = tempfile.mkstemp(prefix=".urls-office-root-", dir=str(urls.parent))
                  with os.fdopen(fd, "wb") as stream:
                      stream.write(updated)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.chmod(temp_name, stat.S_IMODE(urls.stat().st_mode))
                  subprocess.run([sys.executable, "-m", "py_compile", temp_name], check=True, timeout=15)
                  os.replace(temp_name, urls)
                  temp_name = None
                  modified = True
                  passenger.touch()
              else:
                  print("OFFICE_ROOT_ROUTE=already_present_validate_live")
          
              subprocess.run(
                  ["/home/zomorod2/virtualenv/Saeit/3.11/bin/python", "manage.py", "check", "--deploy"],
                  cwd=app, check=True, timeout=90,
              )
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              checks = [
                  ("/company/office/", 302, "/business/"),
                  ("/company/office/login/", 302, "/admin/login/?next=/staff/command-center/"),
                  ("/business/", 200, None),
                  ("/", 200, None),
                  ("/api/health/", 200, None),
              ]
              for path, expected, expected_location in checks:
                  for attempt in range(6):
                      request = urllib.request.Request("https://zomorodmelal.ir" + path, method="GET")
                      try:
                          response = opener.open(request, timeout=12)
                          status = response.status
                          location = response.headers.get("Location", "")
                          response.close()
                      except urllib.error.HTTPError as error:
                          status = error.code
                          location = error.headers.get("Location", "")
                          error.close()
                      except Exception:
                          status, location = 0, ""
                      if status == expected and (expected_location is None or location == expected_location):
                          print("LIVE_ROUTE=" + path + " STATUS=" + str(status))
                          break
                      time.sleep(3)
                  else:
                      raise RuntimeError("LIVE_SMOKE_FAILED:" + path)
              print("ZOMOROD_OFFICE_ROOT_FALLBACK=verified")
          except Exception:
              if modified and backup is not None and backup.is_file():
                  rollback_temp = urls.with_name(".urls-office-root-rollback")
                  shutil.copy2(backup, rollback_temp)
                  os.replace(rollback_temp, urls)
                  passenger.touch()
                  print("ZOMOROD_OFFICE_ROOT_FALLBACK=rolled_back")
              raise
          finally:
              if temp_name is not None and os.path.exists(temp_name):
                  os.unlink(temp_name)
          PY
          REMOTE
          echo "ZOMOROD_OFFICE_ROOT_FALLBACK_RELEASE=verified"
