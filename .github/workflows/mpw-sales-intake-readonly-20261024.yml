name: MojPlayWin visitor and support inbox read-only audit
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mpw-sales-intake-readonly-20261024.yml"
      - "scripts/mpw_cpanel_direct_first_transport_readonly.py"
      - "scripts/mpw_cpanel_source_attestation_readonly.py"
      - "scripts/mpw_encrypted_inquiry_queue_readonly.py"
      - "tests/test_mpw_cpanel_direct_first_transport_readonly.py"
      - "tests/test_cpanel_source_attestation_readonly.py"
      - "tests/test_mpw_encrypted_inquiry_queue_readonly.py"
      - "scripts/mpw_runner_port_reachability_readonly.py"
      - "tests/test_mpw_runner_port_reachability_readonly.py"
      - "scripts/mpw_cpanel_uapi_https_revenue_readonly.py"
      - "tests/test_mpw_cpanel_uapi_https_revenue_readonly.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-sales-intake-readonly-20261024.yml"
      - "scripts/mpw_sales_intake_readonly_20261024.py"
      - "scripts/mpw_paid_provenance_readonly_20261105.py"
      - "scripts/mpw_live_email_recovery_capability_readonly_20261105.py"
      - "scripts/mpw_live_guest_email_linkage_readonly_20261105.py"
      - "scripts/mpw_cpanel_direct_first_transport_readonly.py"
      - "scripts/mpw_cpanel_source_attestation_readonly.py"
      - "scripts/mpw_encrypted_inquiry_queue_readonly.py"
      - "tests/test_mpw_encrypted_inquiry_queue_readonly.py"
      - "scripts/mpw_runner_port_reachability_readonly.py"
      - "tests/test_mpw_runner_port_reachability_readonly.py"
      - "scripts/mpw_cpanel_uapi_https_revenue_readonly.py"
      - "tests/test_mpw_cpanel_uapi_https_revenue_readonly.py"
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-intake-read-only-audit
  cancel-in-progress: false
jobs:
  audit-source-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check syntax of all three read-only tools
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in (
             'scripts/mpw_cpanel_direct_first_transport_readonly.py',
             'scripts/mpw_cpanel_source_attestation_readonly.py',
             'scripts/mpw_encrypted_inquiry_queue_readonly.py',
             'scripts/mpw_cpanel_uapi_https_revenue_readonly.py',
          ):
             ast.parse(Path(name).read_text(encoding='utf8'),filename=name)
          print('MPW_SAFE_READONLY_SOURCE_SYNTAX=PASS')
          PY
      - name: Observe runner-to-server TCP connectivity without SSH secrets
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_mpw_runner_port_reachability_readonly.py' -v
          python3 -B scripts/mpw_runner_port_reachability_readonly.py
      - name: Audit HTTPS UAPI fail-closed protocol and 30 nonmutating cases
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_mpw_cpanel_uapi_https_revenue_readonly.py' -v
          echo 'MPW_UAPI_30_SAFE_REGRESSIONS=PASS'
      - name: Execute 70 offline regressions without SSH or customer access
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_mpw_cpanel_direct_first_transport_readonly.py' -v
          python3 -B -m unittest discover -s tests -p 'test_cpanel_source_attestation_readonly.py' -v
          python3 -B -m unittest discover -s tests -p 'test_mpw_encrypted_inquiry_queue_readonly.py' -v
          echo 'MPW_70_OFFLINE_REGRESSIONS=PASS'
  audit-https-uapi-readonly:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent HTTPS cPanel summary when SSH ports are blocked
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B scripts/mpw_cpanel_uapi_https_revenue_readonly.py
  audit-live:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only audit source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          p=pathlib.Path("scripts/mpw_sales_intake_readonly_20261024.py")
          ast.parse(p.read_text("utf8"))
          source=p.read_text("utf8")
          assert "production_db_writes" in source
          assert "MPW_INTAKE_READONLY" in source
          print("MPW_INTAKE_AUDIT_SOURCE_VALID=true")
          PY
          python3 - <<'PY'
          from scripts.mpw_sales_intake_readonly_20261024 import route_bucket
          assert route_bucket("/mpw-editorial/revenue/index.html") == "revenue_hub"
          assert route_bucket("/mpw-editorial/revenue/business-calculators/index.html") == "revenue_offer"
          assert route_bucket("/earn/website-doctor/") == "revenue_offer"
          assert route_bucket("/contact/") == "support_contact"
          assert route_bucket("/store/product/72/checkout/") == "product_checkout"
          print("MPW_SALES_FUNNEL_ROUTE_CLASSIFICATION=PASS")
          PY
          echo "Running stdlib-only safe transport and source attestation regressions"
          python3 -B -m unittest discover -s tests -p 'test_mpw_cpanel_direct_first_transport_readonly.py' -v
          python3 -B -m unittest discover -s tests -p 'test_cpanel_source_attestation_readonly.py' -v
          python3 -B -m unittest discover -s tests -p 'test_mpw_encrypted_inquiry_queue_readonly.py' -v
          echo "MPW_READONLY_TRANSPORT_SOURCE_LEADS_REGRESSIONS=PASS"
      - name: Establish fail-closed fingerprint-pinned direct-first cPanel route
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B scripts/mpw_cpanel_direct_first_transport_readonly.py
      - name: Attest actual cPanel Passenger and TRX source without mutation
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_cpanel_source_attestation_readonly.py
      - name: Read encrypted service inquiry backlog counts, no customer contents
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_encrypted_inquiry_queue_readonly.py
      - name: Run read-only live sales and checkout audit
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 150s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_sales_intake_readonly_20261024.py
          echo MPW_INTAKE_AUDIT=PASS
      - name: Check payment reconciler heartbeat from live cPanel, read only
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_cron_heartbeat_readonly.py
      - name: Read live login CSRF and payment activation flags without mutation
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_100_live_baseline_readonly_20261021.py
      - name: Join paid flags to finalized receipts and fulfillment (read only)
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_paid_provenance_readonly_20261105.py").read_text("utf8"))
          print("MPW_PAID_PROVENANCE_SOURCE_VALID=PASS")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_paid_provenance_readonly_20261105.py
      - name: One-time support body triage inside cPanel, no message data logged
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'mpw-onetime-body-triage')
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_support_body_triage_onetime_readonly_20261105.py").read_text("utf8"))
          print("MPW_BODY_TRIAGE_SOURCE_VALID=true")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_support_body_triage_onetime_readonly_20261105.py
      - name: One-time live recovery metadata inventory, no customer data
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'mpw-recovery-capability-readonly')
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_live_email_recovery_capability_readonly_20261105.py").read_text("utf8"))
          print("MPW_RECOVERY_CAPABILITY_SOURCE_VALID=true")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_live_email_recovery_capability_readonly_20261105.py
      - name: One-time live guest email capture and aggregate linkage audit
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'mpw-guest-email-linkage')
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_live_guest_email_linkage_readonly_20261105.py").read_text("utf8"))
          print("MPW_GUEST_LINKAGE_SOURCE_VALID=true")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_live_guest_email_linkage_readonly_20261105.py
      - name: Remove local SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-sales-audit-ssh"
