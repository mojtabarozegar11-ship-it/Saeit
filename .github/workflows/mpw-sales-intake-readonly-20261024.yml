name: MojPlayWin visitor and support inbox read-only audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-sales-intake-readonly-20261024.yml"
      - "scripts/mpw_sales_intake_readonly_20261024.py"
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-intake-read-only-audit
  cancel-in-progress: false
jobs:
  audit-live:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only audit source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          p=pathlib.Path("scripts/mpw_sales_intake_readonly_20261024.py")
          ast.parse(p.read_text("utf8"))
          source=p.read_text("utf8")
          assert "production_db_writes" in source
          assert "MPW_INTAKE_READONLY" in source
          print("MPW_INTAKE_AUDIT_SOURCE_VALID=true")
          PY
          python3 - <<'PY'
          from scripts.mpw_sales_intake_readonly_20261024 import route_bucket
          assert route_bucket("/mpw-editorial/revenue/index.html") == "revenue_hub"
          assert route_bucket("/mpw-editorial/revenue/business-calculators/index.html") == "revenue_offer"
          assert route_bucket("/earn/website-doctor/") == "revenue_offer"
          assert route_bucket("/contact/") == "support_contact"
          assert route_bucket("/store/product/72/checkout/") == "product_checkout"
          print("MPW_SALES_FUNNEL_ROUTE_CLASSIFICATION=PASS")
          PY
      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Run read-only live sales and checkout audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 150s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_sales_intake_readonly_20261024.py
          echo MPW_INTAKE_AUDIT=PASS
      - name: Check payment reconciler heartbeat from live cPanel, read only
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_cron_heartbeat_readonly.py
      - name: Read live login CSRF and payment activation flags without mutation
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_100_live_baseline_readonly_20261021.py
      - name: Remove local SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-sales-audit-ssh"
