name: MojPlayWin visitor and support inbox read-only audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-sales-intake-readonly-20261024.yml"
      - "scripts/mpw_sales_intake_readonly_20261024.py"
      - "scripts/mpw_paid_provenance_readonly_20261105.py"
      - "scripts/mpw_live_email_recovery_capability_readonly_20261105.py"
      - "scripts/mpw_live_guest_email_linkage_readonly_20261105.py"
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
    inputs:
      audit_scope:
        description: "Read-only audit scope"
        required: true
        default: recovery
        type: choice
        options:
          - recovery
          - baseline
      release_operation:
        description: "Additive recovery release operation"
        required: true
        default: none
        type: choice
        options:
          - none
          - preflight
          - publish_additive
          - verify
permissions: {contents: read}
concurrency:
  group: mpw-intake-read-only-audit
  cancel-in-progress: false
jobs:
  audit-live:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/mpw-recovery-01-20261105' && inputs.audit_scope == 'recovery'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only audit source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          p=pathlib.Path("scripts/mpw_sales_intake_readonly_20261024.py")
          ast.parse(p.read_text("utf8"))
          source=p.read_text("utf8")
          assert "production_db_writes" in source
          assert "MPW_INTAKE_READONLY" in source
          print("MPW_INTAKE_AUDIT_SOURCE_VALID=true")
          PY
          python3 - <<'PY'
          from scripts.mpw_sales_intake_readonly_20261024 import route_bucket
          assert route_bucket("/mpw-editorial/revenue/index.html") == "revenue_hub"
          assert route_bucket("/mpw-editorial/revenue/business-calculators/index.html") == "revenue_offer"
          assert route_bucket("/earn/website-doctor/") == "revenue_offer"
          assert route_bucket("/contact/") == "support_contact"
          assert route_bucket("/store/product/72/checkout/") == "product_checkout"
          print("MPW_SALES_FUNNEL_ROUTE_CLASSIFICATION=PASS")
          PY
      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Run read-only live sales and checkout audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 150s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_sales_intake_readonly_20261024.py
          echo MPW_INTAKE_AUDIT=PASS
      - name: Check payment reconciler heartbeat from live cPanel, read only
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_cron_heartbeat_readonly.py
      - name: Read live login CSRF and payment activation flags without mutation
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_100_live_baseline_readonly_20261021.py
      - name: Join paid flags to finalized receipts and fulfillment (read only)
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_paid_provenance_readonly_20261105.py").read_text("utf8"))
          print("MPW_PAID_PROVENANCE_SOURCE_VALID=PASS")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_paid_provenance_readonly_20261105.py
      - name: Verify paid private assets and per-order email claims (read only)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_paid_private_assets_readonly_20261105.py").read_text("utf8"))
          print("MPW_PAID_PRIVATE_ASSET_AUDIT_SOURCE_VALID=PASS")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_paid_private_assets_readonly_20261105.py
      - name: One-time support body triage inside cPanel, no message data logged
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'mpw-onetime-body-triage')
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_support_body_triage_onetime_readonly_20261105.py").read_text("utf8"))
          print("MPW_BODY_TRIAGE_SOURCE_VALID=true")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_support_body_triage_onetime_readonly_20261105.py
      - name: One-time live recovery metadata inventory, no customer data
        if: (github.event_name == 'workflow_dispatch' && inputs.audit_scope == 'recovery') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'mpw-recovery-capability-readonly'))
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_live_email_recovery_capability_readonly_20261105.py").read_text("utf8"))
          print("MPW_RECOVERY_CAPABILITY_SOURCE_VALID=true")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_live_email_recovery_capability_readonly_20261105.py
      - name: One-time live guest email capture and aggregate linkage audit
        if: (github.event_name == 'workflow_dispatch' && inputs.audit_scope == 'recovery') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'mpw-guest-email-linkage'))
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path("scripts/mpw_live_guest_email_linkage_readonly_20261105.py").read_text("utf8"))
          print("MPW_GUEST_LINKAGE_SOURCE_VALID=true")
          PY
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          timeout 85s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_live_guest_email_linkage_readonly_20261105.py
      - name: Remove local SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-sales-audit-ssh"


  guarded-additive-release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/mpw-recovery-01-20261105' && inputs.release_operation != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate additive release source
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_recovery_guarded_release_20261105.py services/mpw_trx_email_recovery.py services/mpw_trx_guest_commerce.py core/guest_recovery_models.py core/migrations/0049_mpw_guest_email_recovery.py
          grep -q 'def publish_additive' scripts/mpw_recovery_guarded_release_20261105.py
          echo MPW_ADDITIVE_RELEASE_SOURCE_VALID=PASS
      - name: Establish pinned SSH relay for guarded release
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-additive-release-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Transfer reviewed release bundle to private temporary staging
        env:
          OPERATION: ${{ inputs.release_operation }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-additive-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "umask 077; rm -rf -- '$stage'; mkdir -p -- '$stage'"
          tar -C "$GITHUB_WORKSPACE" -czf - scripts/mpw_recovery_guarded_release_20261105.py services/mpw_trx_email_recovery.py services/mpw_trx_guest_commerce.py core/guest_recovery_models.py core/migrations/0049_mpw_guest_email_recovery.py core/management/commands/mpw_purge_recovery_ephemeral.py | timeout 45s ssh -T -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          case "$OPERATION" in
            preflight)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' preflight '$stage'"
              ;;
            publish_additive)
              timeout 180s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' publish_additive '$stage' '$GITHUB_RUN_ID'"
              ;;
            verify)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' verify"
              ;;
          esac
      - name: Remove temporary release bundle only
        if: always()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-additive-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "rm -rf -- '$stage'" || true
          rm -rf -- "$d"
