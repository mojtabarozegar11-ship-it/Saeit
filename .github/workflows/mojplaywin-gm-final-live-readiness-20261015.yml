name: MojPlayWin final live sales readiness verification
on:
  push:
    branches: [audit/mpw-chess-file-readonly-20261015]
    paths: ['.github/workflows/mojplaywin-gm-final-live-readiness-20261015.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check chess ebook location and SHA256 on cPanel without changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-root-audit"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 100s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          cd "$HOME/Saeit-staging"
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import django,os,hashlib
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          django.setup()
          from django.conf import settings
          from django.urls import resolve
          from core.models import Product,Order,PaymentIntent
          from mpw_native_checkout.wallet_ownership import proven_assets
          p=Product.objects.get(pk=72)
          m=p.metadata if isinstance(p.metadata,dict) else {}
          c=m.get("mpw_commerce") or {}
          sha="3837fc3cb21ed1a2e7c33e0db8f8e10d158583309b02b97d4d674d25a147207a"
          pdf=Path.home()/"MojPlayWin_Private_Assets/store/chess-improvement/MojPlayWin_Chess_Grandmaster_Final_Covered_2026.pdf"
          print("MPW_LIVE_PDF_VERIFIED="+str(pdf.is_file() and pdf.stat().st_size==3631972 and hashlib.sha256(pdf.read_bytes()).hexdigest()==sha))
          print("MPW_LIVE_PRODUCT_ACTIVE="+str(p.active))
          print("MPW_LIVE_OWNER_LINKED="+str(p.owner_id is not None))
          print("MPW_LIVE_ARTICLE_PUBLISHED="+str(bool(p.knowledge_article_id and p.knowledge_article.published)))
          print("MPW_LIVE_DIGITAL_CONFIG="+str(isinstance(c,dict) and c.get("fulfillment")=="digital" and bool(c.get("private_file"))))
          print("MPW_LIVE_COMMERCE_PRODUCT_ENABLED="+str(isinstance(c,dict) and c.get("enabled") is True))
          print("MPW_LIVE_PAYMENT_LIVE="+str(m.get("payment_live") is True))
          print("MPW_LIVE_RIGHTS_OWNER_ATTESTED="+str(m.get("rights_owner_attested") is True))
          print("MPW_LIVE_QUALITY_APPROVED="+str(m.get("quality_approved") is True))
          print("MPW_LIVE_LICENSE_APPROVED="+str(m.get("license_verified") is True))
          print("MPW_LIVE_PUBLICATION_APPROVED="+str(m.get("factory_publication_permission") is True))
          print("MPW_LIVE_WALLET_PROOFS="+str(proven_assets()=={"ETH":True,"TRX":True}))
          print("MPW_LIVE_CHECKOUT_PAGE_MODULE="+str(Path("mpw_commerce/product_checkout_page.py").is_file()))
          for name in ("MPW_COMMERCE_RELEASE_READY","MPW_COMMERCE_CUSTOMER_HTTP_ENABLED","MPW_COMMERCE_INVOICING_ENABLED","MPW_COMMERCE_SETTLEMENT_ENABLED","MPW_COMMERCE_REAL_RPC_ENABLED","MPW_COMMERCE_AUTORECONCILE_ENABLED","MPW_COMMERCE_DOWNLOADS_ENABLED"):
              print("MPW_LIVE_GATE_"+name+"="+str(getattr(settings,name,False) is True))
          for url in ("/commerce/book/72/","/commerce/checkout/order/","/store/product/72/"):
              try:
                  match=resolve(url)
                  print("MPW_LIVE_ROUTE_"+url+"="+match.view_name)
              except Exception as exc:
                  print("MPW_LIVE_ROUTE_"+url+"=MISSING:"+type(exc).__name__)
          print("MPW_LIVE_ALL_ORDERS="+str(Order.objects.count()))
          print("MPW_LIVE_ALL_PAYMENT_INTENTS="+str(PaymentIntent.objects.count()))
          print("MPW_LIVE_READ_ONLY_COMPLETE=True")
          PY
          REMOTE
          for path in / /store/ /store/product/72/ /commerce/book/72/ /commerce/checkout/order/; do
            code="$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            echo "MPW_PUBLIC_HTTP $path $code"
          done

      - name: Remove transient keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-root-audit"
