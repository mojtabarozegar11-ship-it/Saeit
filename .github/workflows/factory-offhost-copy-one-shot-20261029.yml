name: Factory offhost immutable snapshot backup 2026-10-29
on:
  push:
    branches: [ops/factory-offhost-backup-preflight-20261029]
    paths: [".github/workflows/factory-offhost-copy-one-shot-20261029.yml"]
permissions:
  contents: read
concurrency:
  group: factory-backup-copy-one-shot-20261029
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify pinned identities and inventory without remote writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-offhost-probe"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d" 2>/dev/null || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.candidate" "$d/host.known"
          echo SSH_PINNED_BOTH=PASS
          timeout 150s ssh -T -F "$d/config" saeit-vps 'set -eu; test "$(id -un)" = githubops; date -u "+UTC=%Y-%m-%dT%H:%M:%SZ"; df -B1 -P /home/githubops/factory-runtime; awk "/MemTotal:/ {print \"MEM_KIB=\" \$2}" /proc/meminfo; echo FACTORY_BACKUP_CANDIDATES; find /home/githubops/factory-runtime -xdev -type f \( -iname "*.sqlite*" -o -iname "*.db" -o -iname "*.db.*" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tar.zst" \) -size +100M -printf "%s %p\n" | sort -rn | head -n 30; echo FACTORY_SIZES; du -x -h --max-depth=2 /home/githubops/factory-runtime 2>/dev/null | sort -hr | head -n 35; echo READONLY=PASS'
          timeout 80s ssh -T -F "$d/config" saeit-cpanel 'set -eu; test "$(id -un)" = zomorod2; python3 -c '"'"'import json,subprocess; a=json.loads(subprocess.check_output(["uapi","--output=json","Quota","get_quota_info"],timeout=30))["result"]; assert a["status"]==1; d=a["data"]; print("HOST_ACCOUNT_QUOTA_DATA="+str({k:v for k,v in d.items() if k in ("megabyte_limit","megabytes_remain","megabytes_used")}))'"'"'; echo HOST_READONLY=PASS'
          echo PREFLIGHT_NO_REMOTE_WRITE=PASS

          python3 - <<'PY'
          import hashlib, json, os, shlex, subprocess, sys
          from pathlib import Path

          cfg=str(Path(os.environ["RUNNER_TEMP"])/"factory-offhost-probe"/"config")
          source="/home/githubops/factory-runtime/operations/backups/master-before-20261028T004026Z.sqlite3"
          dest="/home/zomorod2/private-factory-backups/master-before-20261028T004026Z.sqlite3"
          partial=dest+".partial-"+os.environ["GITHUB_RUN_ID"]
          def remote(host,*argv):
              cmd=" ".join(shlex.quote(x) for x in argv)
              return ["ssh","-T","-F",cfg,host,cmd]

          source_code="""
          import hashlib,json,os,sqlite3,stat,sys,urllib.parse
          p=sys.argv[1]
          s=os.lstat(p)
          if not stat.S_ISREG(s.st_mode) or s.st_size!=1396473856:
              raise SystemExit("SOURCE_SNAPSHOT_MISSING_OR_CHANGED")
          u="file:"+urllib.parse.quote(p)+"?mode=ro&immutable=1"
          c=sqlite3.connect(u,uri=True,timeout=15)
          try:
              outcome=c.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()
              if not outcome or outcome[0]<10:raise SystemExit("SOURCE_SQLITE_SCHEMA_READ_FAILED")
          finally:c.close()
          with open(p,"rb") as f:h=hashlib.file_digest(f,"sha256").hexdigest()
          s2=os.lstat(p)
          if s2.st_size!=s.st_size or s2.st_mtime_ns!=s.st_mtime_ns:
              raise SystemExit("SOURCE_CHANGED_DURING_HASH")
          print(json.dumps({"bytes":s.st_size,"sha256":h,"sqlite_schema_readable":"ok"}))
          """
          check=subprocess.run(remote("saeit-vps","python3","-B","-c",source_code,source),
                               capture_output=True,text=True,timeout=200,check=True)
          data=json.loads(check.stdout)
          count=int(data["bytes"])
          expected=data["sha256"]
          assert data["sqlite_schema_readable"]=="ok"
          print("SOURCE_SNAPSHOT_SQLITE_SCHEMA_READ=PASS",flush=True)
          print("SOURCE_SNAPSHOT_BYTES="+str(count),flush=True)

          quota_code="""
          import json,os,subprocess,sys
          assert os.path.expanduser("~")=="/home/zomorod2"
          result=json.loads(subprocess.check_output(["uapi","--output=json","Quota","get_quota_info"],timeout=30))["result"]
          assert result["status"]==1
          remain=float(result["data"]["megabytes_remain"])
          needed=float(sys.argv[1])/1048576+4096+128
          if remain<needed:raise SystemExit("QUOTA_RESERVE_GUARD_FAILED")
          print(json.dumps({"quota_remaining_mb":round(remain,2),"min_needed_mb":round(needed,2),"status":"PASS"}))
          """
          quota=subprocess.run(remote("saeit-cpanel","python3","-B","-c",quota_code,str(count)),
                               capture_output=True,text=True,timeout=80,check=True)
          print("DESTINATION_QUOTA_RESERVE="+json.loads(quota.stdout)["status"],flush=True)

          receiver_code="""
          import hashlib,json,os,sqlite3,stat,sys,urllib.parse
          partial,final,expected,required=sys.argv[1:]
          required=int(required)
          root="/home/zomorod2/private-factory-backups"
          if os.getuid()!=os.stat("/home/zomorod2").st_uid:
              raise SystemExit("CPANEL_OWNER_CHECK_FAILED")
          if os.path.lexists(root):
              st=os.lstat(root)
              if not stat.S_ISDIR(st.st_mode) or st.st_uid!=os.getuid():
                  raise SystemExit("PRIVATE_BACKUP_DIRECTORY_UNSAFE")
          else:os.mkdir(root,0o700)
          os.chmod(root,0o700)
          if not final.startswith(root+"/") or not partial.startswith(root+"/"):
              raise SystemExit("DESTINATION_SCOPE_INVALID")
          if os.path.lexists(final) or os.path.lexists(partial):
              raise SystemExit("DESTINATION_ALREADY_EXISTS")
          fd=os.open(partial,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          done=False
          try:
              h=hashlib.sha256()
              size=0
              with os.fdopen(fd,"wb") as outfile:
                  while True:
                      chunk=sys.stdin.buffer.read(1024*1024)
                      if not chunk:break
                      outfile.write(chunk)
                      h.update(chunk)
                      size+=len(chunk)
                      if size>required:raise SystemExit("TRANSFER_EXCEEDED_EXPECTED_BYTES")
                  outfile.flush()
                  os.fsync(outfile.fileno())
              if size!=required or h.hexdigest()!=expected:
                  raise SystemExit("TRANSFER_HASH_OR_SIZE_MISMATCH")
              uri="file:"+urllib.parse.quote(partial)+"?mode=ro&immutable=1"
              c=sqlite3.connect(uri,uri=True,timeout=30)
              try:
                  result=c.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()
                  if not result or result[0]<10:raise SystemExit("DESTINATION_SQLITE_SCHEMA_READ_FAILED")
              finally:c.close()
              os.replace(partial,final)
              os.chmod(final,0o600)
              done=True
              print(json.dumps({"status":"OFFHOST_BACKUP_VERIFIED","bytes":size,"sha256":expected,
                                "sqlite_schema_readable":"ok","destination":"private_non_web_directory"}))
          finally:
              if not done and os.path.isfile(partial):os.unlink(partial)
          """
          producer=subprocess.Popen(remote("saeit-vps","cat","--",source),
                                    stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          try:
              consumer=subprocess.Popen(remote("saeit-cpanel","python3","-B","-c",receiver_code,
                                                partial,dest,expected,str(count)),
                                        stdin=producer.stdout,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              producer.stdout.close()
              out,err=consumer.communicate(timeout=1500)
              p_err=producer.stderr.read()
              pcode=producer.wait(timeout=60)
              if pcode!=0 or consumer.returncode!=0:
                  print("PRODUCER_RC="+str(pcode)+" CONSUMER_RC="+str(consumer.returncode),file=sys.stderr)
                  print("RECEIVER_ERROR="+err.decode(errors="replace")[-1400:],file=sys.stderr)
                  print("SOURCE_ERROR="+p_err.decode(errors="replace")[-900:],file=sys.stderr)
                  raise SystemExit("OFFHOST_TRANSFER_FAILED")
              result=json.loads(out.decode())
              if result.get("status")!="OFFHOST_BACKUP_VERIFIED" or result.get("sha256")!=expected:
                  raise SystemExit("OFFHOST_RECEIPT_INVALID")
              print("OFFHOST_VERIFIED_BYTES="+str(result["bytes"]))
              print("OFFHOST_VERIFIED_SHA256="+expected)
              print("OFFHOST_SQLITE_SCHEMA_READ=PASS")
              print("OFFHOST_PRIVATE_NON_WEB=PASS")
              print("VPS_SOURCE_PRESERVED=YES")
          finally:
              if producer.poll() is None:producer.terminate()
          PY
