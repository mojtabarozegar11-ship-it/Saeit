name: ComfyUI VPS Native SSE2 Image Node Proof
on:
  push:
    branches: [feature/comfyui-vps-render-proof-20261015]
    paths: [.github/workflows/comfyui-vps-native-node-proof.yml]
  workflow_dispatch:
    inputs:
      preset:
        description: Small test scene, not commercial production
        required: true
        type: choice
        default: orchard
        options: [orchard, greenhouse, product, abstract]
      steps:
        description: CPU diffusion steps (1-3)
        required: true
        type: choice
        default: '2'
        options: ['1', '2', '3']
permissions:
  contents: read
concurrency:
  group: comfyui-vps-native-image-proof
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run private SSE2 node graph within bounded ComfyUI VPS session
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SELECTED_PRESET: ${{ inputs.preset }}
          SELECTED_STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          umask 077
          preset="${SELECTED_PRESET:-orchard}"
          steps="${SELECTED_STEPS:-2}"
          case "$preset" in orchard|greenhouse|product|abstract) ;; *) echo INVALID_PRESET; exit 2;; esac
          case "$steps" in 1|2|3) ;; *) echo INVALID_STEPS; exit 2;; esac
          test -n "$VPS_KEY" || { echo VPS_SSH_SECRET_MISSING; exit 1; }
          d="$RUNNER_TEMP/comfy-vps-native"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote=(ssh "${opts[@]}" githubops@178.239.147.150)
          cleanup() {
            "${remote[@]}" bash -s -- stop 10 < ops/comfyui-vps/control.sh || true
          }
          trap 'cleanup; rm -rf -- "$d"' EXIT
          "${remote[@]}" bash -s -- start 10 < ops/comfyui-vps/control.sh
          "${remote[@]}" python3 - < ops/comfyui-vps/verify_cpu_node.py
          timeout 445 "${remote[@]}" python3 - "$preset" "$steps" < ops/comfyui-vps/run_preset.py
          "${remote[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          pidfile="$HOME/factory-runtime/operations/vps-only-loop.pid"
          read -r pid < "$pidfile"
          [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid"
          echo COMFYUI_NATIVE_GRAPH_FACTORY_ALIVE
          REMOTE
          install -d -m 700 "$RUNNER_TEMP/comfy-vps-native-result"
          scp "${opts[@]}" githubops@178.239.147.150:/home/githubops/comfyui-isolated/.control/qa-render/preset_${preset}.png "$RUNNER_TEMP/comfy-vps-native-result/comfy_native.png"
          python3 - "$RUNNER_TEMP/comfy-vps-native-result/comfy_native.png" <<'PY'
          from pathlib import Path
          import hashlib,struct,sys
          raw=Path(sys.argv[1]).read_bytes()
          assert raw[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II",raw[16:24]) == (256,256)
          print("COMFYUI_NATIVE_IMAGE_GRAPH_PNG_VERIFIED")
          print("COMFYUI_NATIVE_IMAGE_BYTES="+str(len(raw)))
          print("COMFYUI_NATIVE_IMAGE_SHA256="+hashlib.sha256(raw).hexdigest())
          PY
      - name: Save provenance, measure image signals, block automatic storefront release
        shell: bash
        env:
          SELECTED_PRESET: ${{ inputs.preset }}
          SELECTED_STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 ops/comfyui-vps/image_quality_report.py \
            "$RUNNER_TEMP/comfy-vps-native-result/comfy_native.png" \
            --engine vps-comfyui-sse2 \
            --preset "${SELECTED_PRESET:-orchard}" \
            --steps "${SELECTED_STEPS:-2}" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/comfy-vps-native-result/quality_report.json"
          python3 - "$RUNNER_TEMP/comfy-vps-native-result/quality_report.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1],encoding="utf-8"))
          assert q["technical_png_valid"]
          assert q["publish_allowed"] is False
          assert q["commercial_ready"] is False
          print("VPS_IMAGE_GENERATED_GENUINELY_STORE_PUBLISH_DISABLED")
          PY
          echo "### ComfyUI VPS production evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Native custom node produced PNG on VPS; QA attached; **not authorized for sale**." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: comfyui-vps-actual-custom-node-png
          path: |
            ${{ runner.temp }}/comfy-vps-native-result/comfy_native.png
            ${{ runner.temp }}/comfy-vps-native-result/quality_report.json
          if-no-files-found: error
          retention-days: 7
