name: MojPlayWin factory and commerce source read-only reconnaissance
on:
  push:
    branches: [feature/mpw-command-center-evidence-metrics-20261014]
    paths:
      - .github/workflows/mojplaywin-commerce-factory-readonly-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory live commerce status codes and VPS factory service evidence safely
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 40s ssh -F "$d/config" relay 'bash -se' <<'PROBE'
          set -euo pipefail
          echo MPW_FACTORY_VPS_USER="$(id -un)"
          if command -v systemctl >/dev/null 2>&1; then
            echo MPW_FACTORY_SYSTEMD_ACTIVE="$(systemctl is-system-running 2>/dev/null || true)"
            for name in saeit-factory saeit-factory.service master-agent master-agent.service saeit-master-factory; do
              echo "MPW_FACTORY_SERVICE_STATE $name $(systemctl is-active "$name" 2>/dev/null || true)"
            done
          fi
          if command -v pm2 >/dev/null 2>&1; then
            echo MPW_FACTORY_PM2_INSTALLED=True
          else
            echo MPW_FACTORY_PM2_INSTALLED=False
          fi
          echo MPW_FACTORY_READ_ONLY_INVENTORY_COMPLETE=True
          PROBE
          timeout 90s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export PYTHONDONTWRITEBYTECODE=1
          export DJANGO_SETTINGS_MODULE=config.settings
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import django
          django.setup()
          from django.db.models import Count
          from core.models import Agent,AgentTask,ApprovalRequest,Product,Order,PaymentIntent,EducationEnrollment
          for model in (Agent,AgentTask,ApprovalRequest,Product,Order,PaymentIntent,EducationEnrollment):
              print("MPW_DB_MODEL_COUNT",model.__name__,model.objects.count())
          for model in (AgentTask,Order,PaymentIntent):
              codes=list(model.objects.values("status").annotate(n=Count("pk")).order_by("status")[:25])
              for row in codes:
                  print("MPW_DB_STATUS_DISTRIBUTION",model.__name__,repr(row["status"]),row["n"])
          from pathlib import Path
          root=Path.home()/"Saeit-staging"
          print("MPW_LIVE_COMMAND_CENTER_PRESENT",(root/"command_center/urls.py").is_file())
          print("MPW_DATABASE_AUDIT_READ_ONLY=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
