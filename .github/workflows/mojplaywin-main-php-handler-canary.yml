name: Moj Play Win isolated PHP handler execution canary
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-main-php-handler-canary.yml"]
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Test existing dynamic PHP handler strictly under new temporary main-site preview file
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          file=/home/zomorod2/mojplaywin.com/design-preview-20261017/_mpw_canonical_php_handler_canary_20261017.php
          body='<?php header("Content-Type: text/plain; charset=UTF-8"); header("Cache-Control: no-store"); echo "MOJ_PLAY_WIN_PHP_EXECUTION_PROVED_20261017"; ?>'
          cleanup(){
            timeout 40s ssh -T -F "$d/config" saeit-cpanel "python3 - '$file'" <<'PY'
          import sys,hashlib
          from pathlib import Path
          p=Path(sys.argv[1])
          expected='<?php header("Content-Type: text/plain; charset=UTF-8"); header("Cache-Control: no-store"); echo "MOJ_PLAY_WIN_PHP_EXECUTION_PROVED_20261017"; ?>'
          if p.is_symlink():raise SystemExit(1)
          if p.is_file() and p.read_text()!=expected:raise SystemExit(2)
          if p.is_file():p.unlink()
          print("EXACT_TEMPORARY_PHP_CANARY_REMOVED",flush=True)
          PY
          }
          trap cleanup EXIT
          timeout 40s ssh -T -F "$d/config" saeit-cpanel "python3 - '$file'" <<'PY'
          import sys,os
          from pathlib import Path
          p=Path(sys.argv[1])
          expected='<?php header("Content-Type: text/plain; charset=UTF-8"); header("Cache-Control: no-store"); echo "MOJ_PLAY_WIN_PHP_EXECUTION_PROVED_20261017"; ?>'
          if p.exists() or p.is_symlink():raise SystemExit("NO_GO_EXISTING_CANARY_PATH")
          if p.parent.is_symlink() or p.parent.name!="design-preview-20261017":raise SystemExit(3)
          fd=os.open(str(p),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,"w") as f:
              f.write(expected);f.flush();os.fsync(f.fileno())
          os.chmod(p,0o644)
          print("ISOLATED_PHP_HANDLER_CANARY_WRITTEN_ONLY_NEW_FILE")
          PY
          python3 - <<'PY'
          import urllib.request,json
          url="https://mojplaywin.com/design-preview-20261017/_mpw_canonical_php_handler_canary_20261017.php"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"Cache-Control":"no-store"}),timeout=22) as r:
              body=r.read(1000).decode("utf-8",errors="replace")
              status=r.status
              typ=r.headers.get("Content-Type","")
          info={"classification":"MOJ_PLAY_WIN_PHP_HANDLER_PUBLIC_CANARY",
                "status":status,"php_interpreted":body=="MOJ_PLAY_WIN_PHP_EXECUTION_PROVED_20261017",
                "php_source_served_as_text":body.startswith("<?php"),
                "content_type":typ,
                "existing_files_changed":False,"passenger_restart":False}
          print(json.dumps(info,sort_keys=True),flush=True)
          PY
      - name: Verify original main and independent sites untouched
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for path in / /saman/ /picm/login/ /farnaz/ /studio.Roham/ /mojtaba.roozegar/ /store/ /research/ /knowledge/ /ventures/agriculture/; do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 "https://mojplaywin.com$path")
            test "$status" = 200 || { echo "NO_GO_SITE_HEALTH_FAILED_AFTER_CANARY"; exit 42; }
          done
          echo "MAIN_AND_PROTECTED_SITE_HEALTH_VERIFIED_WITHOUT_SERVER_RESTART"
