name: Activate all 40 private factory intake lanes with real queued task receipts and sale-deny gate
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_all40_private_activation.py"
      - "tests/test_factory_all40_private_activation.py"
      - "deploy/install_factory_all40_private_activation.sh"
      - ".github/workflows/vps-factory-all40-private-operational-activation-20261020.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-factory-all40-private-intake-activation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test 40 operational intake lanes, real private queue receipts, bad requests and idempotency
        run: |
          set -euo pipefail
          bash -n deploy/install_factory_all40_private_activation.sh
          python3 -m py_compile scripts/factory_all40_private_activation.py
          python3 -m unittest discover -s tests -p test_factory_all40_private_activation.py -v
          echo FACTORY_40_PRIVATE_SERVICE_INTAKE_AND_DENY_GATE_TESTS=PASS
  release:
    needs: test
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install live 40-family intake with isolated 40-request real disk queue test
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/all40-ssh"
          install -d -m 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_vps(){ ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 githubops@178.239.147.150 "$@"; }
          stage="/home/githubops/factory-runtime/operations/.all40intake-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_vps "test ! -e '$stage' && mkdir -m 700 '$stage'"
          for source in scripts/factory_all40_private_activation.py deploy/install_factory_all40_private_activation.sh;do
            name="$(basename "$source")"
            cat "$source" | ssh_vps "umask 077; cat > '$stage/$name'; chmod 600 '$stage/$name'"
            wanted="$(sha256sum "$source" | cut -d' ' -f1)"
            ssh_vps "test \"\$(sha256sum '$stage/$name' | cut -d' ' -f1)\" = '$wanted'"
          done
          ssh_vps "timeout 500s bash '$stage/install_factory_all40_private_activation.sh' '$stage'"
          ssh_vps 'python3 -' <<'PY'
          from pathlib import Path
          import json,subprocess
          base=Path.home()/'factory-runtime'
          root=base/'private/autonomous-product-cycle'
          d=json.loads((root/'activation40/dashboard.json').read_text())
          assert d['families_available_for_private_intake']==40
          assert d['commercial_families_sellable']==0
          assert d['sales_and_payments_processed']==0
          assert len(d['families'])==40 and d['synthetic_local_route_probes_verified']==40
          cron=subprocess.check_output(['crontab','-l'],text=True)
          assert cron.count('SAEIT_FACTORY_FORTY_FAMILY_OPERATIONAL_DISPATCH_V1')==1
          print('VPS_ALL40_REAL_PRIVATE_QUEUE_READBACK=PASS')
          print('VPS_ALL40_FAMILIES_NEEDING_NATIVE_MAKER='+str(d['families_needing_a_native_maker']))
          print('VPS_ALL40_FULL_MANUFACTURING_NOT_INFERRED_FROM_INTAKE=TRUE')
          print('VPS_ALL40_TECHNICAL_FAMILIES='+str(d['technical_product_families']))
          print('VPS_ALL40_PUBLIC_PAYMENTS=NOT_ENABLED')
          PY
