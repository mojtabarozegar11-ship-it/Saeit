name: Factory one-pass 1000 production support tools
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-factory-1000-workbench-release-20261020.yml"
      - "scripts/factory_1000_workbench.py"
      - "tests/test_factory_1000_workbench.py"
      - "deploy/install_factory_1000_workbench.sh"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-onepass-1000-tool-workbench
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Execute 1000 distinct registered bindings and strict utility tests
        run: |
          set -euo pipefail
          bash -n deploy/install_factory_1000_workbench.sh
          python3 -m py_compile scripts/factory_1000_workbench.py
          python3 -m unittest discover -s tests -p test_factory_1000_workbench.py -v
          echo FACTORY_1000_TOOL_SUPPORT_CI=PASS

  deploy:
    needs: test
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install on the verified private factory VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/onepass-1000"
          install -d -m 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_vps() {
            ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 githubops@178.239.147.150 "$@"
          }
          stage="/home/githubops/factory-runtime/operations/.workbench-1000-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_vps "test -x /home/githubops/factory-runtime/.venv/bin/python && test -s /home/githubops/factory-runtime/operations/forty-family-master/forty_families.json && test ! -e '$stage' && mkdir -m 700 '$stage'"
          for source in scripts/factory_1000_workbench.py deploy/install_factory_1000_workbench.sh; do
            item="$(basename "$source")"
            cat "$source" | ssh_vps "umask 077; cat > '$stage/$item'; chmod 600 '$stage/$item'"
            expected="$(sha256sum "$source" | awk '{print $1}')"
            ssh_vps "test \"\$(sha256sum '$stage/$item' | awk '{print \$1}')\" = '$expected'"
          done
          ssh_vps "timeout 180s bash '$stage/install_factory_1000_workbench.sh' '$stage'"
          ssh_vps 'python3 -' <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path.home()/'factory-runtime'
          private=base/'private/autonomous-product-cycle/production-toolkit'
          runner=base/'operations/production-workbench-1000/runner.py'
          cat=private/'catalog.json'
          receipt=private/'verification.json'
          data=json.loads(cat.read_text())
          proof=json.loads(receipt.read_text())
          assert len(data['tools'])==1000
          assert len({x['id'] for x in data['tools']})==1000
          assert len({x['family_id'] for x in data['tools']})==40
          assert proof['synthetic_test_invocations_passed']==1000
          assert proof['runtime_sha256']==hashlib.sha256(runner.read_bytes()).hexdigest()
          assert proof['catalog_sha256']==hashlib.sha256(cat.read_bytes()).hexdigest()
          assert proof['sites_affected']==[] and proof['payment_operations']==0
          assert all(x['commercial_publication_allowed'] is False for x in data['tools'])
          print('VPS_ONEPASS_1000_TOOLS_VERIFIED=PASS')
          print('VPS_WORKBENCH_NATIVE_MANUFACTURING_ENGINES_ADDED=0')
          PY
