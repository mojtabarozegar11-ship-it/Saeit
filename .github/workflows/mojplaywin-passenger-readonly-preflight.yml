name: MojPlayWin production isolation preflight (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-passenger-readonly-preflight.yml"
      - "scripts/mojplaywin_passenger_readonly_preflight.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-isolation-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect-without-changing-any-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source is read-only and contains no deployment verbs
        run: |
          python3 -m py_compile scripts/mojplaywin_passenger_readonly_preflight.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path("scripts/mojplaywin_passenger_readonly_preflight.py").read_text(encoding="utf-8")
          for forbidden in ("restart_passenger(", "touch(", ".write_text(", ".unlink(", "subprocess.run("):
              if forbidden in s:
                  raise SystemExit("Unsafe preflight script operation: " + forbidden)
          PY
      - name: Establish pinned read-only SSH channel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect Passenger mapping without writes, restart or credentials disclosure
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-preflight-ssh"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_passenger_readonly_preflight.py
