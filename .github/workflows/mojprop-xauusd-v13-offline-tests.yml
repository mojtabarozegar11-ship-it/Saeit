name: MOJ PROP XAUUSD v1.3 offline risk tests

on:
  pull_request:
    paths:
      - 'prop_firm/xauusd_v13_*.py'
      - 'prop_firm/xauusd_v13_preflight.py'
      - 'prop_firm/xauusd_v13_contract_gate.py'
      - 'prop_firm/xauusd_v13_qualification_preview.py'
      - 'docs/mojprop/xauusd-v13-buyer-terms-draft-fa-en.md'
      - 'scripts/mojprop_xauusd_v13_full_review_suite.py'
      - 'tests/test_xauusd_v13_*.py'
      - 'tests/test_xauusd_v13_preflight.py'
      - 'prop_firm/xauusd_v13_broker_evidence.py'
      - 'tests/test_xauusd_v13_broker_evidence.py'
      - 'prop_firm/independent_attestation.py'
      - '.github/workflows/mojprop-xauusd-v13-offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-risk-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact full v1.3 contract, 50-trades, social, XAUUSD and legacy v1.2 regressions
        run: python -B scripts/mojprop_xauusd_v13_full_review_suite.py
