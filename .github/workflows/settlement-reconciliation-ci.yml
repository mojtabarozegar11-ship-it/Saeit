name: Settlement reconciliation evidence regressions

on:
  push:
    branches:
      - work/e-payment-reconciliation-20261113
    paths:
      - apps/management/settlement_reconciliation.py
      - tests/test_settlement_reconciliation.py
      - tests/test_settlement_reconciliation_hardening_20261114.py
      - .github/workflows/settlement-reconciliation-ci.yml
  pull_request:
    paths:
      - apps/management/settlement_reconciliation.py
      - tests/test_settlement_reconciliation.py
      - tests/test_settlement_reconciliation_hardening_20261114.py
      - .github/workflows/settlement-reconciliation-ci.yml

permissions:
  contents: read

concurrency:
  group: settlement-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-revenue-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python syntax
        run: python3 -m py_compile apps/management/settlement_reconciliation.py tests/test_settlement_reconciliation.py tests/test_settlement_reconciliation_hardening_20261114.py
      - name: Execute 34 targeted deterministic revenue-regression tests
        run: python3 -m unittest discover -s tests -p 'test_settlement_reconciliation*.py' -v
