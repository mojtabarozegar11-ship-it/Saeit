name: Zomorod public 10-card release acceptance — read only
on:
  pull_request:
    paths:
      - '.github/workflows/zomorod-live-10card-public-acceptance.yml'
permissions:
  contents: read
jobs:
  public-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect actual production HTML, ten photos, six topic routes, assets, and legacy routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse

          BASE = "https://zomorodmelal.ir"
          SLUGS = ("innovation", "laboratory", "greenhouse",
                   "livestock", "smart-tools", "games-simulation")
          LEGACY = ("/agriculture/", "/research/", "/industry/",
                    "/economy/", "/contact/")
          LEGACY_PHOTOS = ("farming", "genetics", "industry", "economy")
          results = []
          def record(path, ok, reason="", bytes_read=0):
              results.append({"path": path, "ok": bool(ok), "reason": reason,
                              "bytes_read": bytes_read})
              print("ZM_PUBLIC_RELEASE_CHECK " + json.dumps(results[-1], sort_keys=True), flush=True)

          def fetch(path, max_bytes=2_000_000):
              request = Request(BASE + path, headers={
                  "User-Agent": "ZomorodPublicReleaseAudit/1.0 (no-auth, read-only)",
                  "Accept": "*/*",
                  "Cache-Control": "no-cache",
              }, method="GET")
              with urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise ValueError("HTTP status " + str(response.status))
                  final_url = urlparse(response.url)
                  if final_url.scheme != "https" or final_url.hostname != "zomorodmelal.ir":
                      raise ValueError("redirected off the original HTTPS host")
                  payload = response.read(max_bytes + 1)
                  if len(payload) > max_bytes:
                      raise ValueError("response exceeded maximum safe read size")
                  return payload

          def check(path, verifier, description):
              try:
                  payload = fetch(path)
                  if not verifier(payload):
                      raise ValueError(description)
                  record(path, True, "content verified", len(payload))
              except Exception as error:
                  record(path, False, type(error).__name__ + ": " + str(error)[:180])
          def html(payload):
              lower = payload[:300].lower()
              return (b"<!doctype html" in lower or b"<html" in lower) and b"</html>" in payload[-500:]

          def root_valid(payload):
              if not html(payload):
                  return False
              segment = payload.split(b'<div id="fields-carousel"', 1)
              if len(segment) != 2:
                  return False
              cards = segment[1].split(
                  b'</div><button class="auto-rotator-toggle fields-rotator-toggle"', 1)
              if len(cards) != 2:
                  return False
              region = cards[0]
              if region.count(b'class="field-card neon-panel"') != 10:
                  return False
              paths = re.findall(rb'<a class="field-card neon-panel" href="([^"]+)"', region)
              images = re.findall(rb'<img\b[^>]*\bsrc="([^"]+)"', region)
              expected_paths = tuple(x.encode() for x in (
                  "/agriculture/", "/research/", "/industry/", "/economy/"
              )) + tuple(("/fields/" + slug + "/").encode() for slug in SLUGS)
              expected_images = tuple(("/assets/zm-v3-" + x + ".webp").encode()
                                      for x in LEGACY_PHOTOS) + tuple(
                  ("/assets/zm-field-" + x + ".webp").encode() for x in SLUGS)
              return (tuple(paths) == expected_paths and
                      tuple(images) == expected_images and
                      b'zm-reference-v3.js?v=20261113-fields1' in payload and
                      b'zm-reference-v3.css?v=20261113-fields1' in payload)

          check("/", root_valid, "not the approved ten-card carousel release")
          for slug in SLUGS:
              path = "/fields/" + slug + "/"
              image = ("/assets/zm-field-" + slug + ".webp").encode()
              canonical = ("https://zomorodmelal.ir" + path).encode()
              check(path,
                    lambda body, i=image, c=canonical:
                       html(body) and b'<h1 id="hero-title">' in body
                       and i in body and c in body and len(body) >= 1000,
                    "dedicated topic content/canonical/photo is not live")
          for slug in SLUGS:
              check("/assets/zm-field-" + slug + ".webp",
                    lambda body: len(body) > 100 and
                    body[:4] == b"RIFF" and body[8:12] == b"WEBP",
                    "first-party WebP not served correctly")
          for slug in LEGACY_PHOTOS:
              check("/assets/zm-v3-" + slug + ".webp",
                    lambda body: len(body) > 100 and
                    body[:4] == b"RIFF" and body[8:12] == b"WEBP",
                    "protected existing WebP is broken")
          for path in LEGACY:
              check(path, lambda body: html(body) and len(body) >= 500,
                    "preexisting business route is broken or non-HTML")
          check("/assets/zm-reference-v3.js?v=20261113-fields1",
                lambda body: b'prefers-reduced-motion' in body and
                b'document.querySelectorAll' in body,
                "new carousel behavior JS is not deployed")
          check("/assets/zm-reference-v3.css?v=20261113-fields1",
                lambda body: len(body) > 1000 and b'field-card' in body,
                "new carousel CSS is not deployed")
          passed = sum(row["ok"] for row in results)
          total = len(results)
          status = "LIVE_ACCEPTED" if passed == total else "NOT_LIVE_ACCEPTED"
          summary = {"status": status, "passed": passed, "failed": total - passed,
                     "total": total, "production_written": False}
          print("ZM_PUBLIC_RELEASE_SUMMARY " + json.dumps(summary, sort_keys=True), flush=True)
          dest = os.getenv("GITHUB_STEP_SUMMARY")
          if dest:
              with open(dest, "a", encoding="utf8") as stream:
                  stream.write("## Zomorod production content acceptance (read-only)\n\n")
                  stream.write("**" + status + "** — " + str(passed) + "/" + str(total) + " paths/assets verified.\n\n")
                  stream.write("| Public path | Result | Detail |\n|---|---|---|\n")
                  for row in results:
                      stream.write("| " + row["path"] + " | " +
                                   ("PASS" if row["ok"] else "FAIL") + " | " +
                                   row["reason"].replace("|", "/") + " |\n")
                  stream.write("\nNo site mutation, login, form submission, email, payment or deploy.\n")
          if passed != total:
              raise SystemExit("Production release not fully proven by read-only acceptance")
          PY
