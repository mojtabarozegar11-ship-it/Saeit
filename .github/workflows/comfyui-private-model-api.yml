name: ComfyUI Private Model API Integration
on:
  push:
    branches: [feature/comfyui-final-audit-20261015]
    paths: [.github/workflows/comfyui-private-model-api.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comfyui-private-model-api-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bounded start, verify real checkpoint selection, stop
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/comfyui-model-api"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          remote=(ssh "${ssh_opts[@]}" githubops@178.239.147.150)
          cleanup() {
            "${remote[@]}" bash -s -- stop 5 < ops/comfyui-vps/control.sh || true
          }
          trap 'cleanup; rm -rf -- "$d"' EXIT
          "${remote[@]}" bash -s -- start 5 < ops/comfyui-vps/control.sh
          "${remote[@]}" python3 - < ops/comfyui-vps/verify_api.py
          echo COMFYUI_INTEGRATION_RESULT_PASS

# Refresh bounded live ComfyUI API integration check 2026-10-15.
