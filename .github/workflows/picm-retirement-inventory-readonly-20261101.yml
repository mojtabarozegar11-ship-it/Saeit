          if queue.exists() or queue.is_symlink(): raise SystemExit("QUEUE_REAPPEARED")
          backup=home/".mojplaywin-backups"
          count=sum(1 for x in backup.iterdir() if x.name.startswith(("picm-","picm_")))
          print("PICM_OBSOLETE_RELEASE_BACKUPS_REMAINING="+str(count))
          if count: raise SystemExit("PICM_RELEASE_BACKUP_REAPPEARED")
          print("PICM_PRODUCTION_POST_RETIREMENT=VERIFIED",flush=True)
          
          PY
          )"
          call="import base64,sys;exec(base64.b64decode(sys.argv[1]))"
          timeout 150s ssh -T -F "$d/config" $COMMAND_HOST "python3 -c '$call' '$probe64'"
