name: Owner PICM retirement and legacy backup scope inventory - read only
on:
  pull_request:
    types: [opened, synchronize]
    branches: [diagnostic/mpw-pinned-direct-preflight-20261101]
    paths:
      - ".github/workflows/picm-retirement-inventory-readonly-20261101.yml"
permissions:
  contents: read
concurrency:
  group: picm-retirement-inventory-20261101
  cancel-in-progress: false
jobs:
  inventory:
    if: (github.event.action == 'opened' || github.event.action == 'synchronize') && github.actor == 'mojtabarozegar11-ship-it' && github.head_ref == 'ops/picm-private-retirement-inventory-20261101' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'diagnostic/mpw-pinned-direct-preflight-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "IMMUTABLE_HEAD_CHECKOUT=verified"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/picm-retirement-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -d /home/zomorod2/Saeit-staging && test -d /home/zomorod2/mojplaywin.com' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -d /home/zomorod2/Saeit-staging && test -d /home/zomorod2/mojplaywin.com' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Inventory VPS PICM exact roots and state
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/picm-retirement-inventory"
          probe64="$(base64 -w0 <<'PY'
          from pathlib import Path
          import os, subprocess, sys
          mode = sys.argv[1]
          home = Path.home()
          def bounded_mib(path):
              if path.is_symlink() or not path.exists():
                  return "0" if not path.is_symlink() else "UNSAFE_LINK"
              if path.stat().st_uid != os.geteuid():
                  return "OTHER_OWNER"
              try:
                  q = subprocess.run(["du", "-skx", "--", str(path)],
                      capture_output=True, timeout=65, check=True)
                  return str(int(q.stdout.split()[0]) // 1024)
              except Exception:
                  return "UNREADABLE"
          if mode == "vps":
              assert os.geteuid() != 0
              targets = (
                  ("PICM_VPS_WORKER", home / ".local/share/saeit-picm"),
                  ("PICM_VPS_COMFY", home / "comfyui-isolated"),
                  ("PICM_VPS_CACHE", home / ".cache/picm"),
              )
              for label, path in targets:
                  print(label + "_MIB=" + bounded_mib(path))
                  print(label + "_PRESENT=" + str(path.exists() or path.is_symlink()).lower())
              pidfile = home / ".local/share/saeit-picm/worker.pid"
              active = False
              if pidfile.is_file() and not pidfile.is_symlink():
                  try:
                      pid = int(pidfile.read_text(encoding="ascii").strip())
                      if 1 < pid < 2**22:
                          active = b"saeit-picm/worker.py" in (Path("/proc") / str(pid) / "cmdline").read_bytes().replace(b"\0", b" ")
                  except (OSError, ValueError):
                      active = False
              print("PICM_WORKER_ALIVE=" + str(active).lower())
          elif mode == "cpanel":
              if os.geteuid() == 0 or home.name != "zomorod2":
                  raise SystemExit("CPANEL_WRONG_USER")
              queue = home / ".picm-queue"
              print("PICM_CPANEL_QUEUE_MIB=" + bounded_mib(queue))
              print("PICM_CPANEL_QUEUE_PRESENT=" + str(queue.exists() or queue.is_symlink()).lower())
              root = home / "Saeit-staging"
              for label, rel in (
                  ("PICM_CORE_VIEW", "core/picm_views.py"),
                  ("PICM_SITE_TEMPLATE", "templates/picm"),
                  ("PICM_ADMIN_ROUTE", "core/urls.py"),
              ):
                  p = root / rel
                  print(label + "_PRESENT=" + str(p.exists() or p.is_symlink()).lower())
              backups = home / ".mojplaywin-backups"
              if backups.exists() and backups.is_dir() and not backups.is_symlink():
                  entries = list(backups.iterdir())
                  if len(entries) > 20000:
                      raise RuntimeError("BACKUP_ENTRY_LIMIT")
                  candidates = [p for p in entries if p.name.startswith("picm-") or p.name.startswith("picm_")]
                  print("PICM_CPANEL_RELEASE_BACKUP_COUNT=" + str(len(candidates)))
                  sizes = [bounded_mib(p) for p in candidates]
                  print("PICM_CPANEL_RELEASE_BACKUP_MIB=" + str(sum(int(v) for v in sizes if v.isdigit())))
              else:
                  print("PICM_CPANEL_RELEASE_BACKUP_COUNT=0")
          else:
              raise SystemExit("INVALID_INVENTORY_MODE")
          PY
          )"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 190s ssh -T -F "$d/config" saeit-vps "python3 -c '$call' '$probe64' vps"
      - name: Inventory CPANEL PICM exact roots and state
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/picm-retirement-inventory"
          probe64="$(base64 -w0 <<'PY'
          from pathlib import Path
          import os, subprocess, sys
          mode = sys.argv[1]
          home = Path.home()
          def bounded_mib(path):
              if path.is_symlink() or not path.exists():
                  return "0" if not path.is_symlink() else "UNSAFE_LINK"
              if path.stat().st_uid != os.geteuid():
                  return "OTHER_OWNER"
              try:
                  q = subprocess.run(["du", "-skx", "--", str(path)],
                      capture_output=True, timeout=65, check=True)
                  return str(int(q.stdout.split()[0]) // 1024)
              except Exception:
                  return "UNREADABLE"
          if mode == "vps":
              assert os.geteuid() != 0
              targets = (
                  ("PICM_VPS_WORKER", home / ".local/share/saeit-picm"),
                  ("PICM_VPS_COMFY", home / "comfyui-isolated"),
                  ("PICM_VPS_CACHE", home / ".cache/picm"),
              )
              for label, path in targets:
                  print(label + "_MIB=" + bounded_mib(path))
                  print(label + "_PRESENT=" + str(path.exists() or path.is_symlink()).lower())
              pidfile = home / ".local/share/saeit-picm/worker.pid"
              active = False
              if pidfile.is_file() and not pidfile.is_symlink():
                  try:
                      pid = int(pidfile.read_text(encoding="ascii").strip())
                      if 1 < pid < 2**22:
                          active = b"saeit-picm/worker.py" in (Path("/proc") / str(pid) / "cmdline").read_bytes().replace(b"\0", b" ")
                  except (OSError, ValueError):
                      active = False
              print("PICM_WORKER_ALIVE=" + str(active).lower())
          elif mode == "cpanel":
              if os.geteuid() == 0 or home.name != "zomorod2":
                  raise SystemExit("CPANEL_WRONG_USER")
              queue = home / ".picm-queue"
              print("PICM_CPANEL_QUEUE_MIB=" + bounded_mib(queue))
              print("PICM_CPANEL_QUEUE_PRESENT=" + str(queue.exists() or queue.is_symlink()).lower())
              root = home / "Saeit-staging"
              for label, rel in (
                  ("PICM_CORE_VIEW", "core/picm_views.py"),
                  ("PICM_SITE_TEMPLATE", "templates/picm"),
                  ("PICM_ADMIN_ROUTE", "core/urls.py"),
              ):
                  p = root / rel
                  print(label + "_PRESENT=" + str(p.exists() or p.is_symlink()).lower())
              backups = home / ".mojplaywin-backups"
              if backups.exists() and backups.is_dir() and not backups.is_symlink():
                  entries = list(backups.iterdir())
                  if len(entries) > 20000:
                      raise RuntimeError("BACKUP_ENTRY_LIMIT")
                  candidates = [p for p in entries if p.name.startswith("picm-") or p.name.startswith("picm_")]
                  print("PICM_CPANEL_RELEASE_BACKUP_COUNT=" + str(len(candidates)))
                  sizes = [bounded_mib(p) for p in candidates]
                  print("PICM_CPANEL_RELEASE_BACKUP_MIB=" + str(sum(int(v) for v in sizes if v.isdigit())))
              else:
                  print("PICM_CPANEL_RELEASE_BACKUP_COUNT=0")
          else:
              raise SystemExit("INVALID_INVENTORY_MODE")
          PY
          )"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 190s ssh -T -F "$d/config" $COMMAND_HOST "python3 -c '$call' '$probe64' cpanel"
      - name: Confirm no active PICM process or foreign-owned mounted children
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/picm-retirement-inventory"
          probe64="$(base64 -w0 <<'PY'
          from pathlib import Path
          import os, stat
          home=Path.home()
          targets=(home/"comfyui-isolated",home/".local/share/saeit-picm")
          active=0
          for item in Path("/proc").iterdir():
              if not item.name.isdecimal() or int(item.name)==os.getpid():
                  continue
              try:
                  p=(item/"cmdline")
                  if p.stat().st_uid != os.getuid():
                      continue
                  cmd=p.read_bytes().replace(b"\0",b" ")
                  if any(sig in cmd for sig in (b"comfyui-isolated",b"saeit-picm/worker.py",b"sd-cli")):
                      active+=1
              except (OSError,PermissionError):
                  continue
          print("PICM_REFERENCING_PROCESSES="+str(active))
          for idx,root in enumerate(targets):
              label="PICM_COMFY" if idx==0 else "PICM_WORKER"
              if root.is_symlink() or not root.is_dir() or root.resolve()!=root or root.stat().st_uid!=os.getuid():
                  print(label+"_ROOT_GUARD=FAIL")
                  continue
              primary_device=root.stat().st_dev
              scanned=symlinks=wrong_owner=other_devices=0
              for where,dirs,files in os.walk(root,followlinks=False):
                  for name in dirs+files:
                      scanned+=1
                      if scanned>100000:
                          raise RuntimeError("PICM_TREE_TOO_LARGE")
                      item=Path(where)/name
                      info=item.lstat()
                      symlinks+=stat.S_ISLNK(info.st_mode)
                      wrong_owner+=(info.st_uid!=os.getuid())
                      other_devices+=(info.st_dev!=primary_device)
              print(label+"_ROOT_GUARD=PASS")
              print(label+"_TREE_ENTRIES="+str(scanned))
              print(label+"_SYMLINK_COUNT="+str(symlinks))
              print(label+"_OTHER_OWNER_COUNT="+str(wrong_owner))
              print(label+"_OTHER_DEVICE_COUNT="+str(other_devices))
          PY
          )"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 180s ssh -T -F "$d/config" saeit-vps "python3 -c '$call' '$probe64'"
      - name: Classify PICM-only cPanel release backup entry types read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/picm-retirement-inventory"
          COMMAND_HOST="${{ steps.link.outputs.command_host }}"
          probe64="$(base64 -w0 <<'PY'
          from pathlib import Path
          import os, stat
          home=Path.home()
          if os.geteuid()==0 or home!=Path("/home/zomorod2"):
              raise SystemExit("WRONG_IDENTITY")
          root=home/".mojplaywin-backups"
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("UNSAFE_ROOT")
          files=sorted((x for x in root.iterdir() if x.name.startswith(("picm-","picm_"))),key=lambda x:x.name)
          print("PICM_BACKUP_CANDIDATES="+str(len(files)))
          for x in files:
              st=x.lstat()
              kind=("regular" if stat.S_ISREG(st.st_mode) else "directory" if stat.S_ISDIR(st.st_mode) else "symlink" if stat.S_ISLNK(st.st_mode) else "other")
              print("PICM_BACKUP_MEMBER="+x.name+"|"+kind+"|owned="+str(st.st_uid==os.geteuid()).lower()+"|size="+str(st.st_size))
          
          PY
          )"
          call="import base64,sys;exec(base64.b64decode(sys.argv[1]))"
          timeout 120s ssh -T -F "$d/config" $COMMAND_HOST "python3 -c '$call' '$probe64'"
      - name: Confirm zero remote modifications or backup deletions
        shell: bash
        run: |
          echo 'PICM_RETIREMENT_INVENTORY=READ_ONLY'
          echo 'BACKUP_DELETIONS=NONE'
          echo 'LIVE_PICM_REMOVAL=NONE'
          echo 'FACTORY_STATE=UNTOUCHED'
      - name: Remove temporary SSH identities
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/picm-retirement-inventory"
          if [[ "$d" == "$RUNNER_TEMP/picm-retirement-inventory" ]] && test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/cpanel.sock" "$d/direct.sock"
          fi
