name: Activate Zomorod-derived editorial quality reviewer privately for MojPlayWin
on:
  push:
    branches: ["feat/mpw-v91-agent-port-isolated-20261018"]
    paths: [".github/workflows/mpw-activate-zomorod-quality-private.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-zomorod-quality-agent-private-hourly
  cancel-in-progress: false
jobs:
  stage-test-enable:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feat/mpw-v91-agent-port-isolated-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify script syntax and exact source input
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_review_private_drafts_with_zomorod_quality.py scripts/mpw_stage_zomorod_quality_reviewer_private.py scripts/mpw_install_zomorod_quality_hourly.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage original-source-aware quality adapter privately with pinned SHA
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          review_sha="$(sha256sum scripts/mpw_review_private_drafts_with_zomorod_quality.py | cut -d ' ' -f 1)"
          receiver="$(base64 -w0 scripts/mpw_stage_zomorod_quality_reviewer_private.py)"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64; exec(base64.b64decode(\"$receiver\"))' '$review_sha'" < scripts/mpw_review_private_drafts_with_zomorod_quality.py
          echo "MPW_PRIVATE_REVIEWER_RECEIVED=yes"
      - name: Run real private scientific and newsroom quality review before scheduling
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel 'python3 -B /home/zomorod2/.private_mojplaywin_main_agents/quality_review_agent_20261018/review_private_drafts.py'
      - name: Add one quality reviewer cron at minute 49, preserve and backup all other cron jobs
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          review_sha="$(sha256sum scripts/mpw_review_private_drafts_with_zomorod_quality.py | cut -d ' ' -f 1)"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel "python3 - '$review_sha'" < scripts/mpw_install_zomorod_quality_hourly.py
      - name: Purge runner-only keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
