name: Direct cPanel command bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only operation to execute through the VPS-to-cPanel relay
        required: true
        type: choice
        options:
          - relay_preflight
          - cpanel_version
          - passenger_inventory
          - cpanel_preflight
          - django_check
          - django_migrations

  # Only an exact owner-authored command on the existing private-command issue
  # can invoke the self-hosted *read-only* operation from chat. No push trigger.
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: saeit-cpanel-direct-bridge
  cancel-in-progress: false

jobs:
  cpanel:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.actor == 'mojtabarozegar11-ship-it' &&
          github.event.issue.number == 1600 &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
          github.event.comment.author_association == 'OWNER' &&
          (
            github.event.comment.body == 'MPW-FACTORY-CPANEL-READONLY-20261115' ||
            github.event.comment.body == 'MPW-FACTORY-CPANEL-RUNTIME-READONLY-20261115'
          )
        )
      )
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 8
    steps:
      - name: Checkout pinned verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Execute selected read-only cPanel operation
        if: github.event_name == 'workflow_dispatch'
        env:
          FACTORY_VPS_RUNNER: "1"
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          bash deploy/cpanel_direct_command.sh "${{ inputs.operation }}"

      - name: Inspect existing cPanel over factory-VPS direct SSH without writes
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.comment.body == 'MPW-FACTORY-CPANEL-READONLY-20261115'
        shell: bash
        env:
          FACTORY_VPS_RUNNER: "1"
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          # The bridge and output sanitizer are already-reviewed main sources.
          test "$(git hash-object -- deploy/cpanel_direct_command.sh)" = "c2b4a7040815369841000b63996e3126a3cd8804"
          test "$(git hash-object -- scripts/mojplaywin_cpanel_readonly_inventory.py)" = "89a3ca61cf3919dd397b5cb2dd36194273f6ee98"
          # Read-only operations run *on* the authorized self-hosted VPS.
          # Never run a GitHub-hosted SSH hop to a possibly filtered VPS port.
          timeout 95s bash deploy/cpanel_direct_command.sh relay_preflight
          timeout 95s bash deploy/cpanel_direct_command.sh passenger_inventory

      - name: Audit current MojPlayWin Passenger and store source without cPanel writes
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.comment.body == 'MPW-FACTORY-CPANEL-RUNTIME-READONLY-20261115'
        shell: bash
        env:
          FACTORY_VPS_RUNNER: "1"
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          test "$(git hash-object -- deploy/cpanel_direct_command.sh)" = "c2b4a7040815369841000b63996e3126a3cd8804"
          test "$(git hash-object -- scripts/mpw_public_passenger_runtime_readonly_20261102.py)" = "0e4d22460ee62ebf9f89c94a6fecf6f9a14531c2"
          timeout 130s bash deploy/cpanel_direct_command.sh mpw_runtime_readonly
