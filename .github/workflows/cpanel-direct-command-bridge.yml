name: Direct cPanel command bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only cPanel check via pinned direct SSH; VPS relay only as fallback
        required: true
        type: choice
        options:
          - relay_preflight
          - cpanel_version
          - passenger_inventory
          - cpanel_preflight
          - django_check
          - django_migrations
          - https_preflight
          - https_domains
          - https_passenger
          - network_preflight

permissions:
  contents: read

concurrency:
  group: saeit-cpanel-direct-bridge
  cancel-in-progress: false

jobs:
  cpanel:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.actor == 'mojtabarozegar11-ship-it' ||
       github.actor == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout pinned verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Execute selected read-only cPanel SSH operation
        if: ${{ !startsWith(inputs.operation, 'https_') && inputs.operation != 'network_preflight' }}
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          CPANEL_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          bash deploy/cpanel_direct_command.sh "$CPANEL_OPERATION"

      - name: Inspect direct HTTPS cPanel route (no SSH)
        if: ${{ startsWith(inputs.operation, 'https_') }}
        env:
          SAEIT_CPANEL_HTTPS_API_TOKEN: ${{ secrets.SAEIT_CPANEL_HTTPS_API_TOKEN }}
          CPANEL_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$CPANEL_OPERATION" in
            https_preflight) python3 deploy/cpanel_https_api_readonly.py preflight ;;
            https_domains) python3 deploy/cpanel_https_api_readonly.py domains ;;
            https_passenger) python3 deploy/cpanel_https_api_readonly.py passenger ;;
            *) echo "CPANEL_HTTPS_OPERATION_DENIED" >&2; exit 64 ;;
          esac

      - name: Check fixed TCP routes without SSH credentials
        if: ${{ inputs.operation == 'network_preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import errno
          import socket

          targets = (
              ("VPS_PORT_22", "178.239.147.150", 22),
              ("CPANEL_PORT_1396", "zohal.pws-dns.net", 1396),
              ("CPANEL_PORT_22", "zohal.pws-dns.net", 22),
          )
          any_open = False
          for label, host, port in targets:
              try:
                  addresses = socket.getaddrinfo(
                      host, port, socket.AF_INET, socket.SOCK_STREAM
                  )
              except socket.gaierror:
                  print(f"{label}=DNS_UNAVAILABLE")
                  continue
              result = "UNREACHABLE"
              for address in addresses:
                  try:
                      with socket.socket(address[0], address[1], address[2]) as conn:
                          conn.settimeout(8)
                          conn.connect(address[4])
                          conn.settimeout(3)
                          try:
                              banner = conn.recv(64)
                              result = ("TCP_OPEN_SSH_BANNER" if
                                        banner.startswith(b"SSH-") else "TCP_OPEN_BANNER_UNVERIFIED")
                          except socket.timeout:
                              result = "TCP_OPEN_BANNER_TIMEOUT"
                          any_open = True
                          break
                  except socket.timeout:
                      result = "TIMEOUT"
                  except OSError as exc:
                      result = "CONNECTION_REFUSED" if exc.errno == errno.ECONNREFUSED else "UNREACHABLE"
              print(f"{label}={result}")
          if not any_open:
              print("SSH_TCP_ROUTE_STATUS=BLOCKED_ALL")
              raise SystemExit(1)
          print("SSH_TCP_ROUTE_STATUS=AT_LEAST_ONE_OPEN")
          PY
