name: Read-only Zomorod Python runtime diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-python-runtime-diagnostic.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-python-runtime-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare the pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-runtime-diag"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Inspect app selector metadata without modifying the site
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-runtime-diag"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app="$HOME/Saeit"
          htaccess="$HOME/public_html/.htaccess"
          test -f "$app/manage.py" && test -f "$htaccess"
          python_path="$(awk '$1 == "PassengerPython" { gsub(/"/, "", $2); print $2; exit }' "$htaccess")"
          awk '/^[[:space:]]*(Passenger(AppRoot|BaseURI|Python|StartupFile|ErrorLog|Enabled)|RewriteEngine|RewriteCond|RewriteRule|DirectoryIndex)[[:space:]]/ { print "ROOT_WEB_DIRECTIVE=" $0 }' "$htaccess"
          printf 'CONFIGURED_PASSENGER_PYTHON=%s\n' "${python_path:-missing}"
          for app in Saeit Saeit-staging; do
            app_dir="$HOME/$app"
            test -d "$app_dir" || continue
            for rel in passenger_wsgi.py config/wsgi.py; do
              file="$app_dir/$rel"
              if test -f "$file"; then
                echo "WSGI_SOURCE_BEGIN=$app/$rel"
                sed -n '1,30p' "$file"
                echo "WSGI_SOURCE_END=$app/$rel"
              fi
            done
          done
          find "$HOME" -maxdepth 5 -type f -iname .htaccess -ipath '*staging*' -print 2>/dev/null | while IFS= read -r staging_ht; do
            test -n "$staging_ht" || continue
            echo "STAGING_WEB_CONFIG_BEGIN=$staging_ht"
            awk '/^[[:space:]]*(Passenger(AppRoot|BaseURI|Python|StartupFile|ErrorLog|Enabled)|RewriteEngine|RewriteCond|RewriteRule|DirectoryIndex)[[:space:]]/ { print "STAGING_WEB_DIRECTIVE=" $0 }' "$staging_ht"
            echo "STAGING_WEB_CONFIG_END=$staging_ht"
          done
          if test -n "$python_path" && test -e "$python_path"; then
            printf 'PASSENGER_PATH_REAL=%s\n' "$(readlink -f "$python_path")"
            printf 'PASSENGER_PATH_FILE_TYPE=%s\n' "$(file -b "$python_path")"
          fi
          for base in "$HOME/Saeit" "$HOME/virtualenv" "$HOME/.cl.selector"; do
            if test -d "$base"; then
              echo "PYTHON_RUNTIME_PATHS_BEGIN=$base"
              find "$base" -maxdepth 6 -type f -path '*/bin/python*' -print | sort | head -n 80
              echo "PYTHON_RUNTIME_PATHS_END=$base"
            else
              echo "PYTHON_RUNTIME_DIRECTORY_MISSING=$base"
            fi
          done
          if test -d "$HOME/.cl.selector"; then
            find "$HOME/.cl.selector" -maxdepth 3 -type f -print | sort | head -n 80
          fi
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          if test -z "$selector"; then
            echo "CLOUDLINUX_SELECTOR=unavailable"
            exit 0
          fi
          echo "CLOUDLINUX_SELECTOR=available"
          selector_config="$HOME/.cl.selector/python-selector.json"
          if test -f "$selector_config"; then
            python3 - "$selector_config" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          allowed={"app_root","app-root","domain","app_uri","app-uri","version","python_version","virtualenv","virtualenv_path","python_path","path","app_mode","enabled","passenger_log_file","startup_file","entry_point","virtualenv"}
          print("SELECTOR_CONFIG_TOP_KEYS="+",".join(sorted(data.keys())) if isinstance(data,dict) else "SELECTOR_CONFIG_TOP_TYPE="+type(data).__name__)
          matches=[]; shapes=[]; stack=[data]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  keys=set(value)
                  if keys & {"app_root","app-root","app_uri","app-uri","domain","applications","apps"}:
                      shapes.append(",".join(sorted(map(str,keys))))
                  vals=[str(v) for k,v in value.items() if isinstance(v,(str,int,float,bool)) and k in allowed]
                  if any("saeit" in v.lower() or "zomorodmelal.ir" in v.lower() for v in vals):
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          print("SELECTOR_CONFIG_RECORD_SHAPES="+("|".join(sorted(set(shapes))[:20]) or "none"))
          print("SELECTOR_CONFIG_RELATED_RECORDS="+str(len(matches)))
          for i,record in enumerate(matches,1):
              for key in sorted(allowed):
                  value=record.get(key)
                  if isinstance(value,(str,int,float,bool)):
                      print(f"SELECTOR_CONFIG_{i}_{key.upper().replace('-','_')}={value}")
          PY
          fi
          raw="$(mktemp "$HOME/.zomorod-selector-readonly.XXXXXX.json")"
          trap 'rm -f -- "$raw"' EXIT
          if ! "$selector" get --json --interpreter python --user "$USER" > "$raw"; then
            echo "SELECTOR_QUERY=failed"
            exit 0
          fi
          python3 - "$raw" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          allowed={"app_root","app-root","domain","app_uri","app-uri","version","python_version","virtualenv","virtualenv_path","python_path","path","app_mode","enabled","result","selector_enabled","default_version","passenger_log_file","startup_file","entry_point","virtualenv"}
          print("SELECTOR_TOP_KEYS="+",".join(sorted(data.keys())) if isinstance(data,dict) else "SELECTOR_TOP_TYPE="+type(data).__name__)
          matches=[]; related=[]; keysets=[]; stack=[data]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  keys=set(value)
                  if keys & {"app_root","app-root","app_uri","app-uri","domain","applications","apps"}:
                      keysets.append(",".join(sorted(map(str,keys))))
                  vals=[str(v) for k,v in value.items() if isinstance(v,(str,int,float,bool)) and k in allowed]
                  if any("saeit" in v.lower() or "zomorodmelal.ir" in v.lower() for v in vals):
                      related.append(value)
                  root=value.get("app_root",value.get("app-root",""))
                  if str(root).rstrip("/").split("/")[-1].lower()=="saeit":
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          print("SELECTOR_RECORD_SHAPES="+("|".join(sorted(set(keysets))[:20]) or "none"))
          print("SELECTOR_RELATED_RECORDS="+str(len(related)))
          if not matches:
              print("SELECTOR_SAEIT_APP=not_found")
              records=related
          else:
              print(f"SELECTOR_SAEIT_APP_COUNT={len(matches)}")
              records=matches
          for i,record in enumerate(records,1):
              for key in sorted(allowed):
                  value=record.get(key)
                  if isinstance(value,(str,int,float,bool)):
                      print(f"SELECTOR_RECORD_{i}_{key.upper().replace('-','_')}={value}")
          PY
          check_raw="$(mktemp "$HOME/.zomorod-manage-check.XXXXXX.json")"
          migrate_raw="$(mktemp "$HOME/.zomorod-migrate-check.XXXXXX.json")"
          trap 'rm -f -- "$raw" "$check_raw" "$migrate_raw"' EXIT
          if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- check > "$check_raw"; then
            echo "SELECTOR_MANAGE_CHECK=not_verified"
            exit 1
          fi
          if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- migrate --check > "$migrate_raw"; then
            echo "SELECTOR_MIGRATE_CHECK=not_verified"
            exit 1
          fi
          python3 - "$check_raw" "$migrate_raw" <<'PY'
          import base64,json,re,sys
          def inspect(path,label,needles):
              result=json.load(open(path,encoding="utf-8"))
              payload=result.get("data","")
              try:
                  raw_output=base64.b64decode(payload).decode("utf-8","replace")
              except Exception:
                  raw_output=""
              output=raw_output.lower()
              ok=result.get("result")=="success" and any(needle in output for needle in needles)
              print(f"{label}={'passed' if ok else 'not_verified'}")
              if label=="SELECTOR_MIGRATE_CHECK" and not ok:
                  for line in raw_output.splitlines():
                      if re.search(r"migrat|operation|error|traceback|database",line,re.I):
                          line=re.sub(r"(?i)(password|secret|token|api[_-]?key|private[_-]?key)(\s*[:=]\s*)[^\s,;]+",r"\1\\2[redacted]",line)
                          line=re.sub(r"(?i)(://[^/\s:@]+:)[^/@\s]+@",r"\1[redacted]@",line)
                          print("MIGRATE_DIAGNOSTIC="+line[:220])
              return ok
          good=inspect(sys.argv[1],"SELECTOR_MANAGE_CHECK",("system check identified no issues",))
          migrate_ok=inspect(sys.argv[2],"SELECTOR_MIGRATE_CHECK",("no changes detected","no migrations to apply","no operations to perform"))
          good=migrate_ok and good
          if not good:
              print("SELECTOR_APP_RUNTIME=not_verified; continuing read-only log and route diagnostics")
          else:
              print("SELECTOR_APP_RUNTIME=verified")
          PY
          # Run the configured Passenger interpreter directly, with bytecode writes disabled.
          # This distinguishes a WSGI import failure from a Passenger-only startup failure.
          wsgi_python="$HOME/virtualenv/Saeit/3.10/bin/python"
          if test -x "$wsgi_python"; then
            wsgi_raw="$(mktemp "$HOME/.zomorod-wsgi-import.XXXXXX.log")"
            trap 'rm -f -- "$raw" "$check_raw" "$migrate_raw" "$wsgi_raw"' EXIT
            if (cd "$HOME/Saeit" && PYTHONDONTWRITEBYTECODE=1 "$wsgi_python" -c 'import passenger_wsgi; print("WSGI_IMPORT=success")') > "$wsgi_raw" 2>&1; then
              echo "WSGI_IMPORT=success"
            else
              echo "WSGI_IMPORT=failed"
              python3 - "$wsgi_raw" <<'PY'
          import re,sys
          for line in open(sys.argv[1],encoding="utf-8",errors="replace"):
              line=re.sub(r"(?i)(password|secret|token|api[_-]?key|private[_-]?key)(\\s*[:=]\\s*)[^\\s,;]+",r"\\1=[redacted]",line.rstrip())
              line=re.sub(r"(?i)(://[^/\\s:@]+:)[^/@\\s]+@",r"\\1[redacted]@",line)
              print("WSGI_IMPORT_DIAGNOSTIC="+line[:240])
          PY
            fi
          else
            echo "WSGI_IMPORT=interpreter_not_found"
          fi
          # Read-only comparison against the already-configured staging app.
          staging_root="$HOME/Saeit-staging"
          staging_python="$HOME/virtualenv/Saeit-staging/3.11/bin/python"
          if test -d "$staging_root" && test -x "$staging_python"; then
            for rel in passenger_wsgi.py config/wsgi.py config/settings.py core/middleware.py config/urls.py; do
              if test -f "$HOME/Saeit/$rel"; then printf 'APP_FILE_SHA Saeit/%s %s\n' "$rel" "$(sha256sum "$HOME/Saeit/$rel" | awk '{print $1}')"; fi
              if test -f "$staging_root/$rel"; then printf 'APP_FILE_SHA Saeit-staging/%s %s\n' "$rel" "$(sha256sum "$staging_root/$rel" | awk '{print $1}')"; fi
            done
            (cd "$staging_root" && PYTHONDONTWRITEBYTECODE=1 "$staging_python" - <<'PY'
          import django
          from django.test import Client
          print("STAGING_DJANGO_VERSION="+django.get_version())
          try:
              import passenger_wsgi
              print("STAGING_WSGI_IMPORT=success")
          except Exception as exc:
              print("STAGING_WSGI_IMPORT=failed:"+type(exc).__name__)
          client=Client(HTTP_HOST="staging.zomorodmelal.ir")
          for route in ("/agriculture/","/agents/","/api/health/","/api/bridge/health/"):
              try:
                  response=client.get(route,secure=True)
                  print("STAGING_DJANGO_CLIENT "+route+" "+str(response.status_code))
              except Exception as exc:
                  print("STAGING_DJANGO_CLIENT "+route+" failed:"+type(exc).__name__)
          PY
          )
          else
            echo "STAGING_APP_RUNTIME=not_found"
          fi
          python3 - "$raw" <<'PY'
          from pathlib import Path
          import json, os, re, sys, time
          # Re-read the primary app log after explicit Passenger restarts.
          home=Path.home()
          roots=[home]
          found=[]
          explicit_logs=[]
          try:
              selector_data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              stack=[selector_data]
              while stack:
                  value=stack.pop()
                  if isinstance(value,dict):
                      if str(value.get("domain","")).lower()=="zomorodmelal.ir":
                          log_value=value.get("passenger_log_file")
                          if isinstance(log_value,str) and log_value:
                              log_path=Path(log_value)
                              if not log_path.is_absolute():
                                  log_path=home/log_path
                              if log_path.is_relative_to(home):
                                  if log_path.is_file():
                                      explicit_logs.append(log_path)
                                  elif log_path.is_dir():
                                      roots.append(log_path)
                      stack.extend(value.values())
                  elif isinstance(value,list):
                      stack.extend(value)
          except (OSError,ValueError,TypeError):
              pass
          for base in roots:
              if not base.is_dir():
                  print("LOG_DIRECTORY=missing:"+str(base.relative_to(home)))
                  continue
              for current, dirs, names in os.walk(base):
                  depth=len(Path(current).relative_to(base).parts)
                  dirs[:]=[d for d in dirs if depth<5 and d not in {".git","static","media","node_modules","virtualenv",".cl.selector",".backups",".cache","__pycache__"}]
                  for name in names:
                      low=name.lower()
                      if low in {"error_log","error.log","stderr.log","passenger.log"} or ("error" in low and low.endswith(".log")) or "passenger" in low or low.endswith(".log"):
                          p=Path(current)/name
                          try:
                              st=p.stat()
                              found.append((st.st_mtime,p,st.st_size))
                          except OSError:
                              pass
          for p in explicit_logs:
              try:
                  st=p.stat()
                  found.append((st.st_mtime,p,st.st_size))
              except OSError:
                  pass
          found.sort(key=lambda row: (0 if home/"Saeit" in row[1].parents else 1, -row[0]))
          print("SELECTOR_EXPLICIT_LOG_FILES="+str(len(explicit_logs)))
          print("CANDIDATE_LOG_FILES="+str(len(found)))
          for _,p,size in found[:16]:
              try:
                  relative=str(p.relative_to(home))
              except ValueError:
                  relative=p.name
              print("LOG_FILE="+relative+" bytes="+str(size))
          cutoff=time.time()-6*60*60
          needles=re.compile(r"(ModuleNotFoundError|ImportError|RuntimeError|TemplateSyntaxError|OperationalError|Application initialization failed|reentrant|Passenger.*(?:error|fail)|Traceback)",re.I)
          redact=re.compile(r"(?i)(password|passwd|secret|token|api[_-]?key|authorization|cookie)(\s*[:=]\s*)[^\s,;]+")
          uri=re.compile(r"(://[^/\s:@]+:)[^/@\s]+@")
          emitted=0
          for modified,p,size in found:
              if modified<cutoff or emitted>=24:
                  continue
              try:
                  with p.open("rb") as stream:
                      if size>131072:
                          stream.seek(-131072,os.SEEK_END)
                      data=stream.read().decode("utf-8","replace")
              except OSError:
                  continue
              lines=data.splitlines()
              trace_indices=[i for i,line in enumerate(lines) if "populate() isn't reentrant" in line]
              for trace_index in trace_indices[-2:]:
                  for context_line in lines[max(0,trace_index-100):trace_index+1]:
                      safe=redact.sub(r"\1=[redacted]",context_line)
                      safe=uri.sub(r"\1[redacted]@",safe)
                      print("SANITIZED_POPULATE_TRACE "+str(p.relative_to(home))+": "+safe[:240])
              for line in lines:
                  if needles.search(line):
                      safe=redact.sub(r"\1=[redacted]",line)
                      safe=uri.sub(r"\1[redacted]@",safe)
                      try:
                          label=str(p.relative_to(home))
                      except ValueError:
                          label=p.name
                      print("SANITIZED_RUNTIME_ERROR "+label+": "+safe[:240])
                      emitted+=1
                      if emitted>=24: break
          print("SANITIZED_RUNTIME_ERROR_LINES="+str(emitted))
          PY
          REMOTE

      - name: Record public route status without changing the site
        shell: bash
        run: |
          set -euo pipefail
          for domain in zomorodmelal.ir staging.zomorodmelal.ir; do
            for route in / /about/ /company/ /agents/ /agriculture/ /agriculture/genetics/ /api/health/ /api/bridge/health/; do
              code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://$domain$route" || true)"
              printf 'PUBLIC_ROUTE_STATUS %s%s %s\n' "$domain" "$route" "$code"
            done
          done
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-runtime-diag"