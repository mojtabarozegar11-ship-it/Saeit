name: Read-only Zomorod Python runtime diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-python-runtime-diagnostic.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-python-runtime-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare the pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-runtime-diag"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Inspect app selector metadata without modifying the site
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-runtime-diag"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app="$HOME/Saeit"
          htaccess="$HOME/public_html/.htaccess"
          test -f "$app/manage.py" && test -f "$htaccess"
          python_path="$(awk '$1 == "PassengerPython" { gsub(/"/, "", $2); print $2; exit }' "$htaccess")"
          printf 'CONFIGURED_PASSENGER_PYTHON=%s\n' "${python_path:-missing}"
          if test -n "$python_path" && test -e "$python_path"; then
            printf 'PASSENGER_PATH_REAL=%s\n' "$(readlink -f "$python_path")"
            printf 'PASSENGER_PATH_FILE_TYPE=%s\n' "$(file -b "$python_path")"
          fi
          if test -d "$HOME/virtualenv/Saeit"; then
            echo "VIRTUALENV_CANDIDATES_BEGIN"
            find "$HOME/virtualenv/Saeit" -maxdepth 4 -type f -perm /111 -name 'python*' -print | sort
            echo "VIRTUALENV_CANDIDATES_END"
          else
            echo "VIRTUALENV_DIRECTORY=missing"
          fi
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          if test -z "$selector"; then
            echo "CLOUDLINUX_SELECTOR=unavailable"
            exit 0
          fi
          echo "CLOUDLINUX_SELECTOR=available"
          raw="$(mktemp "$HOME/.zomorod-selector-readonly.XXXXXX.json")"
          trap 'rm -f -- "$raw"' EXIT
          if ! "$selector" get --json --interpreter python --user "$USER" > "$raw"; then
            echo "SELECTOR_QUERY=failed"
            exit 0
          fi
          python3 - "$raw" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          allowed={"app_root","app-root","domain","app_uri","app-uri","version","python_version","virtualenv","virtualenv_path","python_path","path","app_mode","enabled"}
          matches=[]
          stack=[data]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  root=value.get("app_root",value.get("app-root",""))
                  if str(root).rstrip("/").split("/")[-1].lower()=="saeit":
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          if not matches:
              print("SELECTOR_SAEIT_APP=not_found")
              raise SystemExit(0)
          print(f"SELECTOR_SAEIT_APP_COUNT={len(matches)}")
          for i,record in enumerate(matches,1):
              for key in sorted(allowed):
                  value=record.get(key)
                  if isinstance(value,(str,int,float,bool)):
                      print(f"SELECTOR_APP_{i}_{key.upper().replace('-','_')}={value}")
          PY
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-runtime-diag"
