name: MojPlayWin expose 50 legacy guides and unbury ten original homepage guides

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-unbury-guides-20261026.yml
      - scripts/mpw_unbury_guides_20261026.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpw-only-expose-sixty-guides
  cancel-in-progress: false

jobs:
  publish-independent-guides:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate extraction logic and original folded public baseline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_unbury_guides_20261026.py
          python3 scripts/mpw_unbury_guides_20261026.py selftest
          python3 - <<'PY'
          import urllib.request,urllib.error
          with urllib.request.urlopen('https://mojplaywin.com/',timeout=35) as r:
              doc=r.read(850000).decode('utf-8','replace')
          assert doc.count('data-mpw-fold="mpw-home-ten-guides"')==1
          assert doc.count('data-mpw-fold="site-directory"')==1
          assert doc.count('id="home-guide-')==10
          assert 'data-mpw-unburied-guides="20261026"' not in doc
          for path in ('/mpw-editorial/field-guides/original-ten/',
                       '/mpw-editorial/site-directory/',
                       '/mpw-editorial/field-guides/original-ten/vertical-slice/'):
              try:
                  urllib.request.urlopen('https://mojplaywin.com'+path,timeout=25)
                  raise AssertionError('Standalone path already exists '+path)
              except urllib.error.HTTPError as e:
                  assert e.code==404,(path,e.code)
          with urllib.request.urlopen('https://mojplaywin.com/mpw-editorial/field-guides/20261023/index.html',timeout=35) as r:
              assert r.status==200
          print('TEN_HIDDEN_AND_FIFTY_PRESERVED_GUIDES_BASELINE_VERIFIED')
          PY
      - name: Establish pinned SSH relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-learning-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Publish twelve independent pages, expose 50 existing guides and visible home links
        id: install
        run: |
          set -euo pipefail
          timeout 150s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_unbury_guides_20261026.py
      - name: Validate ten new guides, 50 existing guides, directory, homepage and sitemap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,html.parser,urllib.request,time,xml.etree.ElementTree as ET
          origin='https://mojplaywin.com'
          slugs=('vertical-slice','accessible-play','ai-workflow-risk','ai-privacy',
              'demo-proof','product-readiness','web-discovery','support-library',
              'vancouver-pilot-plan','agro-scenario-dashboard')
          pages=['/mpw-editorial/field-guides/original-ten/','/mpw-editorial/site-directory/']+[
                 '/mpw-editorial/field-guides/original-ten/'+v+'/' for v in slugs]
          def get(path):
              req=urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  assert r.status==200,path
                  return r.read(900000).decode('utf-8','replace')
          for attempt in range(9):
              try:
                  initial=get(pages[0])
                  assert 'data-mpw-extracted-guides="20261026"' in initial
                  break
              except (AssertionError, OSError):
                  if attempt==8:raise
                  time.sleep(2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              docs=list(pool.map(get,pages))
          for i,(path,doc) in enumerate(zip(pages,docs)):
              assert doc.count('data-mpw-extracted-guides="20261026"')==1,path
              assert doc.count('<h1')==1,path
              assert doc.count('<main')==1 and doc.count('</main>')==1,path
              assert doc.count('rel="canonical"')==1,path
              assert 'href="'+origin+path+'"' in doc,path
              if i>=2:
                  assert doc.count('data-mpw-full-guide="20261026"')==1,path
                  assert '<details>' not in doc,path
              if i==0:assert doc.count('class="fg-card"')==10
              if i==1:assert doc.count('class="mw-card"')>=4
          home=get('/')
          assert home.count('data-mpw-unburied-guides="20261026"')==1
          assert home.count('id="home-guide-')==10
          assert 'data-mpw-fold="mpw-home-ten-guides"' not in home
          assert 'data-mpw-fold="site-directory"' not in home
          assert home.count('href="/mpw-editorial/field-guides/original-ten/')>=11
          assert 'href="/mpw-editorial/site-directory/"' in home
          assert 'href="/mpw-editorial/field-guides/20261023/index.html"' in home
          with urllib.request.urlopen(origin+'/sitemap.xml',timeout=35) as r:
              xml=ET.fromstring(r.read(2500000))
          locs=[a.text for a in xml.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(locs)>=133 and len(locs)==len(set(locs)),len(locs)
          for path in pages:assert locs.count(origin+path)==1,path
          import json,re
          old='/mpw-editorial/field-guides/20261023/'
          with urllib.request.urlopen(origin+old+'release.json',timeout=35) as r:
              release=json.load(r)
          keys=sorted(k for k in release['files_sha256'] if re.fullmatch(r'guides/[a-z0-9-]+/index\.html',k))
          assert len(keys)==release['guide_count']==50
          legacy=[old+'index.html',old+'prism-relay/index.html']+[old+k for k in keys]
          for path in legacy:
              assert locs.count(origin+path)==1,path
          oldshort=[old]+[old+k[:-len('index.html')] for k in keys]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              olddocs=list(pool.map(get,oldshort))
          assert len(olddocs)==51
          print('FIFTY_EXISTING_GUIDES_AND_ORIGINAL_HUB_SHORT_URLS_PASS')

          for path in ('/services/','/store/','/mpw-editorial/revenue/'):
              assert '<main' in get(path),path
          print('TEN_INDEPENDENT_GUIDES_AND_DIRECTORY_ALL_LIVE_AND_INDEXABLE')
          PY
      - name: Verify the 25 protected commerce, child and personal routes did not change
        run: |
          set -euo pipefail
          python3 scripts/mpw_subsite_continuity_guard_20261026.py
      - name: Roll back exactly the generated pages and restore original homepage on failure
        if: failure() && steps.install.outcome == 'success'
        run: |
          timeout 150s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_unbury_guides_20261026.py
      - name: Remove temporary relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-learning-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
