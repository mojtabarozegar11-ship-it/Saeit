name: Publish Living Cities original playable browser edition
on:
  push:
    branches: [main]
    paths: [.github/workflows/living-cities-browser-publication-20261101.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: zm-living-cities-browser-publication, cancel-in-progress: false}
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate scoped installer
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/living_cities_static_publish.py
          test -s scripts/living_cities_static_publish.py
          grep -Fq 'LIVING_CITIES_ACCOUNT_AND_MOJ1_STILL_DISABLED=TRUE' scripts/living_cities_static_publish.py
      - name: Connect via pinned VPS SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Preflight ownership and backup source
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 45s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          test ! -e "$HOME/public_html/living-cities" && test ! -L "$HOME/public_html/living-cities"
          game="$HOME/.private/living-cities-app/releases/b3fe1b772368f3f0874481ab88ad82862bd24de2"
          test -f "$game/LC_VALIDATED.json"
          test -s "$game/staticfiles/living_cities/app.mjs"
          test -s "$game/staticfiles/living_cities/tycoon-panel.mjs"
          test -f "$HOME/.private/living-cities-app/state/pre-publication.sqlite3"
          echo READY_BROWSER_PRIVATE_SOURCE_AND_BACKUP=PASS
          REMOTE
      - name: Publish isolated playable client route without enabling money features
        id: publish
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 85s ssh -T -F "$d/config" host 'python3 - publish' < scripts/living_cities_static_publish.py
      - name: Verify actual public origin game HTML, JS and existing pages
        id: smoke
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 170s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          ip="$(getent ahostsv4 zomorodmelal.ir | awk 'NR==1{print $1}')"
          test -n "$ip"
          for route in /living-cities/play/ /living-cities/static/living_cities/app.mjs /living-cities/static/living_cities/tycoon-panel.mjs /living-cities/static/living_cities/tycoon.mjs /living-cities/static/living_cities/style.css / /games/; do
            response="$(mktemp)"
            status="$(curl -skS -4 --connect-timeout 8 --max-time 22 --resolve "zomorodmelal.ir:443:$ip" -o "$response" -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "PUBLIC_BROWSER_ORIGIN=$route HTTP=$status"
            test "$status" = 200 || { rm -f "$response"; exit 1; }
            if [ "$route" = /living-cities/play/ ]; then
              grep -Fq '<h1>LIVING CITIES</h1>' "$response"
              grep -Fq 'Offline progress is saved on this device' "$response"
              grep -Fq '/living-cities/static/living_cities/app.mjs' "$response"
            fi
            if [ "$route" = /living-cities/static/living_cities/app.mjs ]; then
              grep -Fq 'tycoon-panel.mjs' "$response"
            fi
            rm -f "$response"
          done
          echo ORIGINAL_LIVING_CITIES_BROWSER_RELEASE_LIVE=PASS
          REMOTE
      - name: Roll back only newly managed static directory on failure
        if: failure() && steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          if test -f "$d/config"; then
            timeout 75s ssh -T -F "$d/config" host 'python3 - rollback' < scripts/living_cities_static_publish.py
          fi
      - name: Destroy temporary runner SSH secrets
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
