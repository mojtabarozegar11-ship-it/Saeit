name: MojPlayWin two books general commerce exact eligibility and checkout READ ONLY
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-two-books-commerce-policy-readonly-20261018.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect live policy to understand eligibility without modifying any data
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 160s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,ast,pathlib
          h=pathlib.Path('/home/zomorod2');r=h/'Saeit-staging';sys.path.insert(0,str(r));os.chdir(r)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product
          for id in (72,225):
           p=Product.objects.get(pk=id);m=p.metadata or {}
           for key in ('mpw_commerce','pricing','quality_approved','license_verified','asset_verified','private_file','sha256','factory_publication_permission','checkout_enabled'):
            val=m.get(key)
            if key in ('private_file','sha256'):
             val=('present' if val else 'missing')
            if key=='mpw_commerce' and isinstance(val,dict):
             val={k: ('redacted' if any(s in k.lower() for s in ('address','secret','key','wallet','token')) else v) for k,v in val.items()}
            print('BOOK_POLICY_META='+json.dumps({'id':id,'key':key,'value':val},default=str,ensure_ascii=False))
          for path,functions in {
           'mpw_commerce/product_checkout_page.py':('approved_for_checkout','product_checkout_page'),
           'mpw_commerce/policy.py':('order_snapshot','order_ready_for_invoice'),
           'mpw_commerce/buyer_orders.py':('create_digital_order',),
           'mpw_commerce/invoicing.py':('reserve_order_invoice',),
           'mpw_commerce/auto_reconcile.py':('reconcile_pending_orders',),
           'mpw_commerce/entitlements.py':('can_access_purchased_digital_item',),
           'mpw_commerce/downloads.py':('download_paid_item',),
           'mpw_commerce/checkout_views.py':('checkout_status',),
           'mpw_commerce/settlement.py':('settle_order_invoice',),
           }.items():
           file=r/path;source=file.read_text('utf8','replace');tree=ast.parse(source)
           for node in tree.body:
            if not isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) or node.name not in functions:continue
            raw=source.splitlines()[node.lineno-1:node.end_lineno]
            clean=[]
            for line in raw:
             if any(s in line.lower() for s in ('api_key','secret','private_key','password','mnemonic','recipient_address','sender_address','wallet_address','receiving_address')):
              clean.append('[credential/address line redacted]');continue
             clean.append(line[:210])
            print('GENERAL_COMMERCE_FUNCTION='+json.dumps({'file':path,'fn':node.name,'code':clean[:110]},ensure_ascii=False))

          PY
          BASH
