name: Publish isolated MOJ Pay presentation and read-only wallet
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/banknew-service-catalog-20261027.yml'
      - 'banknew/index.html'
      - 'banknew/app.js'
      - 'banknew/app.test.js'
permissions:
  contents: read
concurrency:
  group: banknew-isolated-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout version-controlled MOJ Pay page and script
        uses: actions/checkout@v4
      - name: Validate the release and exact fee calculation
        run: |
          set -euo pipefail
          node --check banknew/app.js
          node --test banknew/app.test.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          s=Path('banknew/index.html').read_text(encoding='utf-8')
          class Parser(HTMLParser):
              def error(self,message): raise AssertionError(message)
          Parser().feed(s)
          for required in ('<html lang="en">', 'id="wallet"', 'id="pricing"', 'id="access"', 'Connect a wallet to view balances.', 'operating authorization is pending', 'No customer funds or payments are accepted', '<script src="app.js">'):
              assert required in s, required
          assert "noindex,nofollow" in s
          assert 'Your wallet, connected.' not in s
          assert 'Website launch authorization:' not in s
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage only the version-controlled MOJ Pay page and read-only script
        run: |
          set -euo pipefail
          scp -q -F "$RUNNER_TEMP/mpw-structure-ssh/config" banknew/index.html saeit-cpanel:/home/zomorod2/mojplaywin.com/banknew/.index.html.candidate
          scp -q -F "$RUNNER_TEMP/mpw-structure-ssh/config" banknew/app.js saeit-cpanel:/home/zomorod2/mojplaywin.com/banknew/.app.js.candidate
      - name: Publish with both-file backup, external verification and rollback
        run: |
          timeout 180s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib, os, urllib.request
          root=Path('/home/zomorod2/mojplaywin.com')
          d=root/'banknew'
          assert root.is_dir() and not root.is_symlink() and d.is_dir() and not d.is_symlink()
          files=[('index.html','.index.html.candidate','.index.html.banknew-release-backup'),('app.js','.app.js.candidate','.app.js.banknew-release-backup')]
          items=[]
          for name,staging,backname in files:
              p,candidate,backup=d/name,d/staging,d/backname
              assert p.is_file() and not p.is_symlink()
              assert candidate.is_file() and not candidate.is_symlink()
              assert not backup.exists() and not backup.is_symlink()
              new=candidate.read_bytes()
              assert 0<len(new)<100000
              if name=='index.html':
                  assert b'<script src="app.js"></script>' in new
                  assert b'No customer funds or payments are accepted' in new
                  assert b'Connect a wallet to view balances.' in new
              else:
                  assert b'getTronState' in new and b'eth_requestAccounts' in new
                  assert b'privateKey' not in new
              items.append((name,p,candidate,backup,new,hashlib.sha256(new).hexdigest()))
          with urllib.request.urlopen('https://mojplaywin.com/',timeout=25) as response:
              assert response.status==200
          for _,p,_,backup,_,_ in items:
              backup.write_bytes(p.read_bytes())
              backup.chmod(0o600)
          try:
              for _,p,candidate,_,_,_ in items:
                  os.replace(candidate,p)
              for name,p,_,_,new,expected in items:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
                  url='https://mojplaywin.com/banknew/'+name+'?release='+expected[:20]
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
                  with urllib.request.urlopen(request,timeout=25) as response:
                      public=response.read(200000)
                      assert response.status==200
                  assert hashlib.sha256(public).hexdigest()==expected, 'Public '+name+' mismatch'
              with urllib.request.urlopen('https://mojplaywin.com/banknew/',timeout=25) as response:
                  assert response.status==200
              with urllib.request.urlopen('https://mojplaywin.com/',timeout=25) as response:
                  assert response.status==200
          except Exception:
              for _,p,_,backup,_,_ in items:
                  if backup.exists(): os.replace(backup,p)
              raise
          finally:
              for _,_,candidate,backup,_,_ in items:
                  if backup.exists(): backup.unlink()
                  if candidate.exists(): candidate.unlink()
          print('BANKNEW_HTML_AND_READONLY_SCRIPT_RELEASE_VERIFIED')
          PY
      - name: Remove temporary keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-structure-ssh"
