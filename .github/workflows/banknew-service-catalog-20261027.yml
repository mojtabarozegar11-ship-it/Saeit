name: Update banknew launch authorization and service catalog
on:
  push:
    branches: [main]
    paths: ['.github/workflows/banknew-service-catalog-20261027.yml']
permissions:
  contents: read
concurrency:
  group: banknew-isolated-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Update banknew only, verify fresh URL and restore on failure
        run: |
          timeout 180s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,base64,urllib.request,time
          root=Path('/home/zomorod2/mojplaywin.com'); d=root/'banknew'; p=d/'index.html'
          assert d.is_dir() and not d.is_symlink() and p.is_file() and not p.is_symlink()
          url='https://mojplaywin.com/banknew/?_release=04f4e6b5d5a4511a'
          with urllib.request.urlopen('https://mojplaywin.com/',timeout=25) as r: assert r.status==200
          old=p.read_bytes(); new=base64.b64decode(''); backup=d/'.index.html.banknew-release-backup'
          assert not backup.exists() and not backup.is_symlink()
          backup.write_bytes(old); backup.chmod(0o600)
          try:
           p.write_bytes(new)
           request=urllib.request.Request(url,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
           with urllib.request.urlopen(request,timeout=25) as r: body=r.read(2000000); assert r.status==200
           for marker in ('Website launch authorization','۳۴۵/۵۶۷۸۹۴/۸۷۶/۱۴۰۵/۰۲/۱۲','operating authorization is pending','Payment gateway & P2P','Multi-currency wallet','Currency exchange & bullion'):
            assert marker.encode() in body, 'Public response missing '+marker
           assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256(new).digest()
           with urllib.request.urlopen('https://mojplaywin.com/',timeout=25) as r: assert r.status==200
           backup.unlink()
          except Exception:
           p.write_bytes(old)
           if backup.exists():backup.unlink()
           raise
          print('BANKNEW_SERVICE_CATALOG_UPDATED_AND_SMOKED='+url)
          PY
      - name: Remove temporary keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-structure-ssh"
