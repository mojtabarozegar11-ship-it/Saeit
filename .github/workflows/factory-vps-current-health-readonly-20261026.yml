name: Factory VPS fresh read-only health
on:
  workflow_dispatch:
    inputs:
      archive_retired_log:
        description: 'Create capped verified gzip copy of retired factory log; retain original'
        required: false
        type: boolean
        default: false
      prune_retired_log:
        description: 'CAUTION: Delete exact retired original log ONLY after fresh SHA256 verification of retained gzip archive; requires separate owner confirmation'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/factory_vps_current_health_readonly_20261026.py'
      - 'scripts/factory_strict_serial_fullcycle_v1.py'
      - 'deploy/install_factory_strict_serial_fullcycle_v1.sh'
      - '.github/workflows/factory-vps-current-health-readonly-20261026.yml'
      - 'scripts/factory_private_json_hotfix_20261027.py'
permissions: {contents: read}
concurrency:
  group: factory-vps-current-health-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate source without contacting VPS
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/factory_vps_current_health_readonly_20261026.py
          python3 -B -m unittest discover -s tests -p test_factory_vps_current_health_readonly.py -v
      - name: Read factory aggregates through pinned SSH (no server writes)
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-fresh-health-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          known="$d/known"
          for keyscan_attempt in 1 2 3; do
            if ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$known" 2>/dev/null && test -s "$known"; then
              break
            fi
            sleep "$((keyscan_attempt * 3))"
          done
          test -s "$known"
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          for ssh_attempt in 1 2 3; do
            if timeout 65s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no githubops@178.239.147.150 'python3 -B -' < scripts/factory_vps_current_health_readonly_20261026.py; then
              echo 'FACTORY_VPS_FRESH_READONLY=PASS'
              exit 0
            fi
            echo "FACTORY_VPS_READONLY_SSH_ATTEMPT=$ssh_attempt failed; retrying"
            sleep "$((ssh_attempt * 5))"
          done
          echo 'FACTORY_VPS_FRESH_READONLY=FAILED_AFTER_RETRIES'
          exit 1

  archive_retired_log:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_retired_log == true }}
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate archive code without server writes
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/vps_retired_log_preserving_archive_20261106.py
      - name: Create verified bounded archive on VPS - do not delete source
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/retired-log-archive-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          known="$d/known"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$known" 2>/dev/null && test -s "$known"; then
              break
            fi
            sleep "$((attempt * 3))"
          done
          test -s "$known"
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 180s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no githubops@178.239.147.150 'python3 -B -' < scripts/vps_retired_log_preserving_archive_20261106.py
          echo "VPS_RETIRED_LOG_ARCHIVE_JOB=PASS"

  prune_retired_log:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prune_retired_log == true }}
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate guarded prune script syntax without server writes
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/vps_retired_log_verified_prune_20261106.py
      - name: Delete only explicitly approved, hash-verified retired original log
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/retired-log-prune-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          known="$d/known"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$known" 2>/dev/null && test -s "$known"; then
              break
            fi
            sleep "$((attempt * 3))"
          done
          test -s "$known"
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 180s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no githubops@178.239.147.150 'python3 -B -' < scripts/vps_retired_log_preserving_archive_20261106.py
          echo "VPS_RETIRED_LOG_PRUNE_JOB=PASS"
