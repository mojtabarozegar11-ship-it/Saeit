name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Conserve included CI minutes: only the latest commit of each PR/ref needs a review result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The real Linux namespace integration tests require unprivileged
    # user namespaces. Keep this supported runner explicit while the
    # Ubuntu 26.04 isolation compatibility is reviewed. No security
    # sysctls are changed and no isolated test is skipped.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install hash-pinned PDF parser in isolated target for shared tests
        run: |
          parser="$RUNNER_TEMP/mpw-pdf-parser"
          install -d -m 700 "$parser"
          python -m pip install --no-deps --require-hashes --target "$parser" -r .github/requirements/mpw-pdf-parser-ci.txt
      - name: Django deployment checks
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy
      - name: Build static manifest
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py collectstatic --noinput
      - name: Verify real namespace prerequisites
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
          test -x /usr/bin/bwrap
          /usr/bin/unshare -Urn /usr/bin/bwrap --share-net --unshare-pid --unshare-ipc --unshare-uts --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - name: Run tests
        env:
          PYTHONPATH: ${{ runner.temp }}/mpw-pdf-parser
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: pytest -q
      - name: Apply migrations to CI database
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py migrate --noinput
      - name: Verify production readiness
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py production_gate
