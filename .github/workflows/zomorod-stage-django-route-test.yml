name: Test Zomorod site Django routes against isolated recovered database
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-stage-django-route-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-stage-django-ro-test
  cancel-in-progress: false
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: HTTP smoke test against private recovered database without Passenger changes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Saeit"
          export PYTHONDONTWRITEBYTECODE=1
          export DATABASE_URL="sqlite:///$HOME/.backups/zomorodmelal-db-recovery-validation/4360521e0fd085b5c86f2bda1780f7cb1cf84073/validation.sqlite3"
          unset OPENAI_API_KEY || true
          "$HOME/virtualenv/Saeit/3.10/bin/python" - <<'PY'
          import os,pathlib
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.test import Client
          dbpath=pathlib.Path(str(settings.DATABASES["default"]["NAME"]))
          assert "/zomorodmelal-db-recovery-validation/" in str(dbpath)
          assert dbpath.is_file() and dbpath.stat().st_size>1000000
          client=Client(raise_request_exception=True)
          routes=(
              "/company/","/about/","/industry/","/research/",
              "/knowledge/","/agents/","/api/health/",
              "/api/bridge/health/","/admin/login/","/services/"
          )
          for path in routes:
              try:
                  result=client.get(path,HTTP_HOST="zomorodmelal.ir",secure=True)
                  print("STAGED_DJANGO_ROUTE="+path+" status="+str(result.status_code)+" length="+str(len(result.content) if not result.streaming else 0))
              except Exception as exc:
                  import traceback,re
                  short=re.sub(r"[^a-zA-Z0-9_./' +:\\-]", "_", str(exc))[:200]
                  frames=traceback.extract_tb(exc.__traceback__)
                  last=frames[-1] if frames else None
                  print("STAGED_DJANGO_ROUTE="+path+" exception_class="+type(exc).__name__+" error_classification="+short)
                  if last:
                      print("STAGED_DJANGO_EXCEPTION_LOCATION="+path+" module="+pathlib.Path(last.filename).name+" function="+last.name+" line="+str(last.lineno))
          print("STAGED_DJANGO_RUN=finished_on_private_database")
          PY
          REMOTE
      - name: Remove runner keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
