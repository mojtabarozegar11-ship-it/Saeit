name: MojPlayWin chess product readiness (read-only)
on:
  push:
    paths:
      - '.github/workflows/mojplaywin-chess-product-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check app root, product models, existing book and checkout safely
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          VPS_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          import pathlib,sys
          for f in sys.argv[1:]:
              p=pathlib.Path(f)
              x=p.read_text().replace("\r\n","\n").strip().replace("\\n","\n")
              p.write_text(x+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          echo "STAGE=prepare_vps_known_host"
          if [[ -n "$VPS_KNOWN" ]]; then
            printf "%s\n" "$VPS_KNOWN" > "$d/vps.known"
          else
            for attempt in 1 2 3; do
              ssh-keyscan -T 7 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null && [[ -s "$d/vps.known" ]] && break
              sleep 2
            done
          fi
          echo "VPS_HOST_KEY_ROWS=$(wc -l < "$d/vps.known")"
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          echo "STAGE=verify_host_key_through_vps"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "STAGE=check_mojplaywin_host_files"
          timeout 120s ssh -F "$d/config" saeit-host 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "REMOTE_USER=$(id -un)"
          test "$(id -un)" = zomorod2
          python3 - <<'PY'
          from pathlib import Path
          import re
          home=Path('/home/zomorod2')
          wrapper=home/'mojplaywin.com/passenger_wsgi.py'
          print('WRAPPER_PRESENT',wrapper.is_file())
          if wrapper.is_file():
              raw=wrapper.read_text(errors='replace')
              paths=sorted(set(re.findall(r'/home/zomorod2/[A-Za-z0-9._/-]+',raw)))
              print('WRAPPER_REFERENCED_PATHS',paths[:18])
          for root in [home/'mojplaywin.com', home/'Saeit-staging', home/'Saeit']:
              print('ROOT',str(root),'EXISTS',root.is_dir())
              candidates=[]
              if root.is_dir():
                  for p in root.glob('manage.py'):
                      candidates.append(str(p))
                  for p in root.glob('*/manage.py'):
                      candidates.append(str(p))
                  for p in root.glob('*/*/manage.py'):
                      candidates.append(str(p))
              print('MANAGE_CANDIDATES',sorted(set(candidates))[:20])
          for root in [home/'mojplaywin.com', home/'Saeit-staging']:
              matches=[]
              if root.is_dir():
                  for p in root.glob('**/*chess*'):
                      if p.is_file() and p.suffix.lower()=='.pdf':
                          matches.append((str(p),p.stat().st_size))
                          if len(matches)>=15: break
              print('CHESS_PDFS',str(root),matches)
          PY
          echo "MODEL_AND_PAYMENT_DISCOVERY_START"
          python3 - <<'PY'
          from pathlib import Path
          import ast
          root=Path('/home/zomorod2/Saeit-staging')
          for key in ['manage.py','config/settings.py','core/models.py','portal/models.py','core/views.py','core/urls.py','portal/views.py','portal/urls.py','command_center/models.py']:
              p=root/key
              print('APP_SOURCE',key,'present',p.is_file())
              if p.is_file() and p.suffix=='.py':
                  try:
                      tree=ast.parse(p.read_text(errors='replace'))
                      found=[]
                      for node in ast.walk(tree):
                          if isinstance(node,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef)) and any(w in node.name.lower() for w in ('product','store','order','payment','checkout','download','digital','webhook')):
                              found.append(node.name)
                      print('SYMBOLS',key,sorted(set(found))[:65])
                  except Exception as e:
                      print('PARSE_ISSUE',key,type(e).__name__)
          for base in [Path('/home/zomorod2/Saeit-staging'),Path('/home/zomorod2/mojplaywin.com')]:
              for name in ['media','private_media','protected_media','products','ebooks','downloads']:
                  p=base/name
                  print('MEDIA_LOCATION',str(p),p.is_dir())
                  if p.is_dir():
                      pdfs=[(x.name,x.stat().st_size) for x in p.rglob('*.pdf') if x.is_file()]
                      print('PDF_COUNT',len(pdfs),'POTENTIAL_BOOKS',[x for x in pdfs if 400000<=x[1]<=500000 or 'improvement' in x[0].lower()][:12])
          PY
          echo "MODEL_AND_PAYMENT_DISCOVERY_END"
          echo "DJANGO_PRODUCT_GATE_AUDIT_START"
          cd /home/zomorod2/Saeit-staging
          if test -x /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python; then
            PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python manage.py shell <<'PY' || true
          from django.apps import apps
          from django.conf import settings
          from pathlib import Path
          print('DJANGO_MEDIA_ROOT',str(getattr(settings,'MEDIA_ROOT', 'not_set')))
          print('DJANGO_MEDIA_URL',str(getattr(settings,'MEDIA_URL', 'not_set')))
          for m in apps.get_models():
              if any(k in m.__name__.lower() for k in ['product','payment','order','purchase','fulfill']):
                  print('DJANGO_MODEL',m._meta.label,'FIELDS',[f.name for f in m._meta.fields])
          product = next((m for m in apps.get_models() if m.__name__=='Product' and m._meta.app_label=='core'),None)
          if product:
              try:
                  print('PRODUCT_RECORD_COUNT',product.objects.count())
                  for p in product.objects.filter(title__icontains='chess').order_by('-pk')[:12]:
                      print('CHESS_PRODUCT_EXISTING',p.pk,p.title,getattr(p,'active','unknown'),str(getattr(p,'price','unknown')),str(getattr(p,'currency','unknown')))
              except Exception as exc:
                  print('PRODUCT_QUERY_ERROR',type(exc).__name__)
          print('PAYMENT_FLAGS_PRESENT',sorted([k for k in vars(settings) if k.isupper() and any(w in k for w in ['PAYMENT','NOWPAY','CRYPTO','BANKSHAHR']) and getattr(settings,k) is not None])[:45])
          PY
          else
            echo DJANGO_PYTHON_MISSING
          fi
          echo "DJANGO_PRODUCT_GATE_AUDIT_END"
          echo "LIVE_CRYPTO_INTEGRATION_AUDIT_START"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path('/home/zomorod2/Saeit-staging')
          terms=('crypto','payment','checkout','webhook','gateway','provider','invoice','wallet','confirm','fulfill','purchase')
          selected=[]
          for base in (root/'core',root/'config'):
              if not base.exists(): continue
              for p in base.rglob('*.py'):
                  if any(part in ('migrations','tests','__pycache__') for part in p.parts): continue
                  if len(selected)>50: break
                  try: text=p.read_text(errors='replace')
                  except OSError: continue
                  if any(t in text.lower() for t in ('CryptoPaymentIntent','CRYPTO_GATEWAY','CRYPTO_PAY','crypto_checkout','payment_webhook','crypto_checkout')):
                      selected.append(p)
          for path in selected[:50]:
              print('CANDIDATE',str(path.relative_to(root)))
              try: tree=ast.parse(path.read_text(errors='replace'))
              except SyntaxError: continue
              for node in ast.walk(tree):
                  if isinstance(node,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef)):
                      name=node.name.lower()
                      if any(t in name for t in terms): print('  DEFINITION',node.name,'LINE',node.lineno)
          settings=root/'config/settings.py'
          if settings.exists():
              lines=settings.read_text(errors='replace').splitlines()
              for i,s in enumerate(lines,1):
                  if any(t in s.upper() for t in ('PAYMENT_', 'CRYPTO_', 'NOWPAYMENTS', 'COINPAYMENTS', 'CRYPTOMUS', 'BTCPAY','TRON','USDT_')):
                      print('SETTING_KEY_ONLY',i,s.split('=',1)[0].strip()[:90] if '=' in s else '<expression>')
          for rel in ('config/urls.py','core/urls.py'):
              p=root/rel
              if not p.is_file(): continue
              for i,ln in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(t in ln.lower() for t in ('crypto','payment','checkout','store','order','webhook','invoice','download')):
                      print('URL_HINT',rel,i,ln[:170])
          print('LIVE_CRYPTO_INTEGRATION_AUDIT_END')
          PY
          echo "LIVE_CRYPTO_NATIVE_CHECKOUT_MAP_START"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('/home/zomorod2/Saeit-staging/core/cryptopay_checkout.py')
          print('CRYPTO_CHECKOUT_EXISTS',p.is_file())
          if p.is_file():
              src=p.read_text(errors='replace')
              tree=ast.parse(src)
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                      print('TOP_LEVEL_SYMBOL',node.name,'lines',node.lineno,node.end_lineno)
                      if node.name in ('checkout','crypto_order','private_download'):
                          callnames=set()
                          for x in ast.walk(node):
                              if isinstance(x,ast.Call):
                                  y=x.func
                                  if isinstance(y,ast.Name): callnames.add(y.id)
                                  elif isinstance(y,ast.Attribute): callnames.add(y.attr)
                          print('CHECKOUT_CALL_NAMES',node.name,sorted(callnames)[:80])
                          print('DECORATOR_NAMES',node.name,[ast.unparse(x)[:70] for x in node.decorator_list])
              for line in src.splitlines():
                  if line.strip().startswith(('def ','class ')):
                      continue
              print('MODULE_LINES',len(src.splitlines()))
          print('LIVE_CRYPTO_NATIVE_CHECKOUT_MAP_END')
          PY
          echo "CRYPTO_MODEL_FIELDS_AND_IMPORTS_START"
          python3 - <<'PY'
          from pathlib import Path
          import ast
          base=Path('/home/zomorod2/Saeit-staging/core')
          filename=base/'cryptopay_checkout.py'
          tree=ast.parse(filename.read_text(errors='replace'))
          for n in tree.body:
              if isinstance(n,ast.ImportFrom):
                  print('CHECKOUT_IMPORT',n.module,[x.name for x in n.names][:25])
          for filename in base.glob('*crypto*.py'):
              if filename.name=='cryptopay_checkout.py': continue
              root=ast.parse(filename.read_text(errors='replace'))
              names=[x.name for x in root.body if isinstance(x,(ast.FunctionDef,ast.ClassDef))]
              print('CRYPTO_MODULE',filename.name,names[:40])
          PY
          echo "CRYPTO_MODEL_FIELDS_AND_IMPORTS_END"
          REMOTE
          for url in https://mojplaywin.com/ https://mojplaywin.com/admin/login/ https://mojplaywin.com/store/ https://mojplaywin.com/shop/; do
            code="$(curl -sS -L --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)"
            printf 'HTTP_CHECK %s %s\n' "$url" "$code"
          done
          echo READ_ONLY_AUDIT_COMPLETE
      - name: Clean runner SSH keys
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/ssh"
