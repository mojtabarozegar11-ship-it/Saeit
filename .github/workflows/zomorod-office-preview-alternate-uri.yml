name: Probe independent office preview URI outside disabled company tree
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-preview-alternate-uri.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-office-preview-alternate-route
  cancel-in-progress: false
jobs:
  scoped-preview-test:
    if: github.event.pull_request.number == 1724 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == '8161c06e9be735081c66c565b1e48c6ea3d32ef5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Confirm public health before reversible Selector path change
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL --max-time 25 --output /dev/null --write-out '%{http_code}' https://zomorodmelal.ir/api/health/)" = 200
          echo "PUBLIC_HEALTH_BEFORE_ALTERNATE_URI=200"
      - name: Move only stopped preview to non-company temporary URI
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 120s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          rel="zomorod_office_preflight_2a8a0f4b9e17"
          old="company/office-preflight-2a8a0f4b9e17"
          new="office-preflight-2a8a0f4b9e17"
          root="/home/zomorod2/$rel"
          selector="/usr/sbin/cloudlinux-selector"
          test -d "$root" && test ! -L "$root"
          test -f "$root/.preview-registered" && test ! -L "$root/.preview-registered"
          test -f "$root/.preview-uri-htaccess.original"
          test -f "$root/office-preview.sqlite3"
          test -f "$root/.env" && test "$(stat -c '%a' "$root/.env")" = 600
          test -x "$selector"
          test ! -e "/home/zomorod2/public_html/$new"
          test ! -L "/home/zomorod2/public_html/$new"
          cmp -s -- "/home/zomorod2/public_html/.htaccess" "/home/zomorod2/.private/zomorod-company-office/preflight-public-html-htaccess-20261031.bak"
          cmp -s -- "/home/zomorod2/public_html/$old/.htaccess" "$root/.preview-uri-htaccess.original"
          echo "ORIGINAL_PREVIEW_ROUTE=restored"
          if "$selector" set --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" --new-app-uri "$new" > "$root/.selector-alternate-uri.json" 2> "$root/.selector-alternate-uri.stderr"; then
            python3 - "$root/.selector-alternate-uri.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])).get("result")=="success"
          print("ALTERNATE_SELECTOR_URI_SET=success")
          PY
          else
            echo "ALTERNATE_SELECTOR_URI_SET=failed_no_root_changes_requested"
            exit 1
          fi
          if "$selector" start --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" > "$root/.selector-alternate-start.json" 2> "$root/.selector-alternate-start.stderr"; then
            python3 - "$root/.selector-alternate-start.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])).get("result")=="success"
          print("ALTERNATE_SELECTOR_START=success")
          PY
          else
            "$selector" set --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" --new-app-uri "$old" >/dev/null 2>&1 || true
            echo "ALTERNATE_SELECTOR_START=failed_rollback_attempted"
            exit 1
          fi
          echo "ALTERNATE_URI_PREVIEW_ONLY=activated_for_smoke"
          echo "ROOT_SITE_CONFIGURATION_NOT_EDITED=true"
          REMOTE
      - name: Verify alternate preview HTTPS then return to safe stopped state
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          code=000
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' 'https://zomorodmelal.ir/office-preflight-2a8a0f4b9e17/secure-login/' || true)"
            if test "$code" = 200; then break; fi
            sleep 10
          done
          echo "ALTERNATE_URI_HTTPS_LOGIN_STATUS=$code"
          health="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' https://zomorodmelal.ir/api/health/ || true)"
          echo "PUBLIC_HEALTH_AFTER_ALTERNATE_URI=$health"
          d="$RUNNER_TEMP/zm-marketing-ro"
          if test "$code" = 200 && test "$health" = 200; then
            # Route works, but temporary settings still use the original script prefix.
            # Pause serving until a separately reviewed settings change aligns both.
            timeout 90s ssh -F "$d/config" "$COMMAND_HOST" '/usr/sbin/cloudlinux-selector stop --json --interpreter python --domain zomorodmelal.ir --app-root zomorod_office_preflight_2a8a0f4b9e17' >/dev/null
            echo "ALTERNATE_URI_ROUTING=verified_preview_paused"
            echo "PUBLIC_SITE_UNCHANGED=true"
          else
            timeout 120s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE' || true
          set -euo pipefail
          rel="zomorod_office_preflight_2a8a0f4b9e17"
          selector="/usr/sbin/cloudlinux-selector"
          "$selector" stop --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" >/dev/null 2>&1 || true
          if "$selector" set --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" --new-app-uri company/office-preflight-2a8a0f4b9e17 > /dev/null; then
            echo "ALTERNATE_URI_ROLLBACK=original_uri_restored"
          else
            echo "ALTERNATE_URI_ROLLBACK=requires_manual_review"
          fi
          REMOTE
            echo "ALTERNATE_URI_ROUTING=not_verified"
            exit 1
          fi
      - name: Remove runner transient relay credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
