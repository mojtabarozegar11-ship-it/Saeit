name: Retire MojPlayWin public micro trial safely
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-retire-public-trial-779-20261107.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-retire-public-trial-779
  cancel-in-progress: false
jobs:
  retire:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-retire-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Retire only the guarded 779 micro trial
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-retire-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback" < scripts/mpw_native_trx_micro_trial_release_20261020.py
      - name: Verify live catalog no longer exposes the trial
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          url='https://mojplaywin.com/commerce/trx-easy/'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache, no-store, max-age=0','User-Agent':'MPW-Retire-779/1'})
          with urllib.request.urlopen(req,timeout=25) as r:
              body=r.read(240000).decode('utf-8','replace')
              status=r.status
          if status != 200: raise RuntimeError('TRX catalog HTTP '+str(status))
          marker='MojPlayWin Secure TRX Purchase'
          if marker in body or '/store/product/779/' in body or '/commerce/book/779/' in body:
              raise RuntimeError('Retired trial still exposed in public catalog')
          print('MPW_PUBLIC_TRIAL_779=RETIRED')
          for path in ('/store/','/store/product/72/','/store/product/225/','/store/product/879/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Retire-779/1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status != 200: raise RuntimeError(path+' HTTP '+str(r.status))
          print('MPW_ORIGINAL_PRODUCTS=HEALTHY')
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-retire-ssh"
