name: Register two canonical Zomorod guides in live sitemap
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zm-20261025b-sitemap-live.yml"
      - "scripts/zm_20261025b_sitemap_add.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zm-20261025b-sitemap-live
  cancel-in-progress: false
jobs:
  register:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate script and two canonical public destinations
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zm_20261025b_sitemap_add.py
          python3 - <<'PY'
          import urllib.request
          base='https://zomorodmelal.ir/resources/20261025b/'
          for slug in ('cold-chain-acceptance/','supplier-technical-comparison/'):
              url=base+slug
              with urllib.request.urlopen(url,timeout=22) as r:
                  body=r.read(100000).decode('utf8','replace')
                  assert r.status==200 and '<link rel="canonical" href="'+url+'"' in body,url
              print('CANONICAL_TARGET_VALID',url)
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-b-route-ssh";install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Atomically add only missing canonical URLs with private rollback
        id: install
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-b-route-ssh/config" saeit-cpanel "python3 - apply '$GITHUB_RUN_ID'" < scripts/zm_20261025b_sitemap_add.py
      - name: Verify public XML and unchanged protected endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,xml.etree.ElementTree as ET,time
          url='https://zomorodmelal.ir/sitemap.xml'
          with urllib.request.urlopen(url+'?check='+str(time.time_ns()),timeout=25) as r:
              data=r.read(2000000)
              assert r.status==200
          root=ET.fromstring(data)
          assert root.tag.endswith('urlset')
          locs=[n.text for n in root.iter() if n.tag.endswith('loc')]
          assert len(locs)==len(set(locs))
          for suffix in ('cold-chain-acceptance/','supplier-technical-comparison/'):
              expected='https://zomorodmelal.ir/resources/20261025b/'+suffix
              assert locs.count(expected)==1,expected
              print('NEW_CANONICAL_IN_LIVE_SITEMAP',expected)
          for page in ('https://zomorodmelal.ir/','https://zomorodmelal.ir/contact/','https://mojplaywin.com/','https://mojplaywin.com/store/'):
              with urllib.request.urlopen(page,timeout=20) as r:assert r.status==200,page
          print('TWO_NEW_SITEMAP_URLS_AND_PROTECTED_SITES_VERIFIED')
          PY
      - name: Roll back only own unchanged sitemap patch on verification failure
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-b-route-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zm_20261025b_sitemap_add.py
      - name: Remove temporary SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zm-b-route-ssh"
