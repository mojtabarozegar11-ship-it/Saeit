name: MojPlayWin five dynamic footer exact-response release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-five-dynamic-footer-release-20261018.yml"
      - "scripts/mpw_five_dynamic_footer_filter_20261018.py"
permissions:
  contents: read
concurrency:
  group: mojplaywin-mainonly-footer-atomic
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-mpw-five-footer-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline code guards and baseline of five root and protected pages
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_five_dynamic_footer_filter_20261018.py
          python3 scripts/mpw_five_dynamic_footer_filter_20261018.py selftest
          python3 - <<'PY'
          import urllib.request,os,json,re
          routes=['/','/store/','/games/','/ai/','/contact/','/support/','/about/','/research/','/farnaz/','/saman/','/picm/']
          baseline={}
          for path in routes:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'User-Agent':'MPWFooterDynamicPreflight/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  body=resp.read(1800000).decode('utf8','replace')
                  baseline[path]={'status':resp.status,'founder':'Mojtaba Roozegar' in body,'length':len(body)}
                  if resp.status!=200:raise SystemExit('BASELINE_UNHEALTHY '+path)
                  if path in ('/store/','/games/','/ai/','/contact/','/support/') and '<body' not in body.lower():
                      raise SystemExit('NO_HTML_BODY '+path)
                  print('BASELINE '+path+' status='+str(resp.status),flush=True)
          with open(os.environ['RUNNER_TEMP']+'/mpw-five-footer-baseline.json','w') as f:json.dump(baseline,f)
          PY
      - name: Set up pinned VPS and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-footer-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: SHA and route preflight without host changes
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mpw-footer-inventory/config" saeit-cpanel python3 - audit < scripts/mpw_five_dynamic_footer_filter_20261018.py
      - name: Apply exact-route HTML response filter and static JS with backups
        run: |
          set -euo pipefail
          timeout 65s ssh -T -F "$RUNNER_TEMP/mpw-footer-inventory/config" saeit-cpanel python3 - install "$GITHUB_RUN_ID" < scripts/mpw_five_dynamic_footer_filter_20261018.py
      - name: Verify exact five HTML responses and protected child routes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,os
          from pathlib import Path
          old=json.loads(Path(os.environ['RUNNER_TEMP']+'/mpw-five-footer-baseline.json').read_text())
          routes=['/store/','/games/','/ai/','/contact/','/support/']
          name='/design-preview-20261017/static/site/mpw-founder-final-20261018.js'
          req=urllib.request.Request('https://mojplaywin.com'+name,headers={'User-Agent':'MPWFooterDynamicVerify/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              script=r.read(100000).decode('utf8','replace')
              if r.status!=200 or 'Mojtaba Roozegar' not in script or 'querySelectorAll("footer")' not in script:
                  raise SystemExit('SCOPED_SCRIPT_UNAVAILABLE')
          for path in routes:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'User-Agent':'MPWFooterDynamicVerify/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  html=r.read(1800000).decode('utf8','replace')
                  if r.status!=200 or html.count(name)!=1 or html.count("</body>")!=1:
                      raise SystemExit('FOOTER_FILTER_NOT_ACTIVE '+path)
                  if '<footer' not in html.lower():raise SystemExit('MISSING_EXISTING_FOOTER '+path)
              print('DYNAMIC_FOOTER_INJECTION_OK '+path,flush=True)
          for path in ('/farnaz/','/saman/','/picm/','/','/about/','/research/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  html=r.read(1800000).decode('utf8','replace')
                  if r.status!=old[path]['status'] or name in html:
                      raise SystemExit('PROTECTED_ROUTE_CHANGED '+path)
              print('PROTECTED_ROUTE_OK '+path,flush=True)
          print('FIVE_DYNAMIC_FOOTER_PATCH=VERIFIED',flush=True)
          PY
      - name: Atomic rollback on any post-install error
        if: failure()
        run: |
          d="$RUNNER_TEMP/mpw-footer-inventory/config"
          if test -s "$d" && test -f "$RUNNER_TEMP/mpw-five-footer-baseline.json"; then
            timeout 60s ssh -T -F "$d" saeit-cpanel python3 - rollback "$GITHUB_RUN_ID" < scripts/mpw_five_dynamic_footer_filter_20261018.py || true
          fi
      - name: Clear relay key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-footer-inventory"
