name: VPS private storage blocker inventory only (no changes)
on:
  pull_request:
    paths:
      - .github/workflows/factory-vps-disk-blocker-readonly-20261025.yml
permissions: {contents: read}
jobs:
  read-only-disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect confined VPS factory storage without changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/readonly-factory-disk"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 210s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 python3 - <<'PY'
          import os,subprocess,json,shutil
          from pathlib import Path
          root=Path("/home/githubops/factory-runtime")
          assert root.is_dir() and not root.is_symlink()
          readings={}
          for sub in ("private","operations",".venv"):
            base=root/sub
            if not base.is_dir() or base.is_symlink():continue
            proc=subprocess.run(["du","-x","-B1","--max-depth=2",str(base)],capture_output=True,text=True,timeout=95,check=True)
            parsed=[]
            for line in proc.stdout.splitlines():
              val,path=line.split("\t",1)
              parsed.append({"bytes":int(val),"directory":path.replace(str(root),"$FACTORY")})
            readings[sub]=sorted(parsed,key=lambda v:v["bytes"],reverse=True)[:28]
          operations=root/"operations"
          logs=[]
          for base,dirs,names in os.walk(operations,followlinks=False):
            dirs[:]=[x for x in dirs if not (Path(base)/x).is_symlink()]
            for name in names:
              p=Path(base)/name
              if not p.is_file() or p.is_symlink():continue
              st=p.stat()
              if st.st_size>=10_000_000 and p.suffix in (".log",".txt",".jsonl"):
                logs.append({"bytes":st.st_size,"file":str(p).replace(str(root),"$FACTORY")})
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=10).stdout
          active=[x for x in cron.splitlines() if x.strip() and not x.lstrip().startswith("#")]
          print("VPS_STORAGE_BLOCKER_READONLY="+json.dumps({"free_bytes":shutil.disk_usage(root).free,"disk_total":shutil.disk_usage(root).total,"ranked_directories":readings,"large_logs":sorted(logs,key=lambda x:x["bytes"],reverse=True)[:25],"active_cron_count":len(active),"english_single_active_count":sum("SAEIT_ENGLISH_FIRST_SINGLE_ACTIVE_20261025" in line for line in active),"legacy_bulk_active_count":sum("SAEIT_FACTORY_OWNER_DELEGATE_COORDINATION_V1" in line for line in active),"purely_readonly":True},sort_keys=True))
          PY
