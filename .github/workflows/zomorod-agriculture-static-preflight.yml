name: Inspect agriculture static-only isolation
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-agriculture-static-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Inspect only agriculture directory and Passenger inheritance
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,stat,hashlib
          h=pathlib.Path.home()
          base=h/"public_html"
          for rel in (".htaccess","agriculture/.htaccess","agriculture/index.html","agriculture/genetics/index.html","agriculture/assets/zomorod-olive-v1/genetics.webp"):
              f=base/rel
              if f.is_symlink():
                  print("STATIC_PRECHECK",rel,"symlink_REFUSE");continue
              if f.is_file():
                  data=f.read_bytes()
                  print("STATIC_PRECHECK",rel,"file bytes",len(data),"sha20",hashlib.sha256(data).hexdigest()[:20])
                  if f.name==".htaccess":
                      for line in data.decode("utf-8","replace").splitlines():
                          if line.strip().startswith(("PassengerEnabled","PassengerPython","PassengerAppRoot","DirectoryIndex","RewriteRule","RewriteCond","RewriteEngine")):
                              print("STATIC_DIRECTIVE",rel,line.strip()[:140])
              elif f.is_dir():
                  print("STATIC_PRECHECK",rel,"directory")
              else:
                  print("STATIC_PRECHECK",rel,"missing")
          a=base/"agriculture"
          print("STATIC_FOLDER_EXISTS",a.is_dir())
          if a.is_dir():
              for p in sorted(a.iterdir()):
                  print("STATIC_TOPLEVEL",p.name,"dir" if p.is_dir() else "file","symlink" if p.is_symlink() else "regular")
          PY
          REMOTE
      - name: Check public response for agriculture
        run: |
          set -euo pipefail
          for url in "https://zomorodmelal.ir/" "https://zomorodmelal.ir/agriculture/" "https://zomorodmelal.ir/agriculture/index.html" "https://zomorodmelal.ir/agriculture/genetics/"; do
            code="$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "PUBLIC_CHECK $url $code"
          done
      - name: Erase runner SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
