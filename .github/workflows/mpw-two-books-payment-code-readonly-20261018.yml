name: MojPlayWin two book payment linkage narrow code evidence READ ONLY
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-two-books-payment-code-readonly-20261018.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect only buy-to-settlement functions with wallet credentials redacted
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 140s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,ast,pathlib,importlib
          home=pathlib.Path('/home/zomorod2');root=home/'Saeit-staging'
          os.chdir(root);sys.path.insert(0,str(root));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.urls import get_resolver
          from django.conf import settings
          from core.models import Product
          for pk in (72,225):
           p=Product.objects.get(pk=pk);m=p.metadata or {}
           print('BOOK='+json.dumps({'id':pk,'price':str(p.price),'active':p.active,'owner':bool(p.owner_id),
           'file_ready':m.get('mpw_private_file_prepared'),'quality_approved':m.get('quality_approved'),
           'license_verified':m.get('license_verified'),'payment_live':m.get('payment_live'),
           'checkout_enabled':m.get('checkout_enabled'),'release_hold':m.get('mpw_book72_release_hold'),
           'commercial_keys':[k for k in sorted(m) if any(x in k for x in ('rights','approval','license','payment','sale','quality','publish'))]}))
          for name in ('mpw_native_checkout/autopay_worker.py','mpw_native_checkout/settlement.py','mpw_native_checkout/entitlements.py','core/cryptopay_checkout.py','core/cryptopay_tron_config.py','core/cryptopay_mainnet_config.py','core/cryptopay_order.py','mpw_native_checkout/merchant_wallet_views.py','mpw_native_checkout/crypto_subprocess_verify.py'):
           p=root/name
           if not p.is_file():continue
           src=p.read_text('utf8','replace')
           tree=ast.parse(src)
           wanted={'reconcile_once','_validate','settle_native_invoice','qualified_order','can_download_paid_native_order','checkout','product_delivery_ready','crypto_order','private_download','production_ready','fetch_confirmed_inbound'}
           funcs=[]
           for n in tree.body:
            if not isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) or n.name not in wanted:continue
            lines=src.splitlines()[n.lineno-1:n.end_lineno]
            clean=[]
            for l in lines:
             if any(x in l.lower() for x in ('secret','api_key','private_key','mnemonic','password','token','receiving_address','wallet_address','recipient_address','sender_address')):clean.append('[sensitive wallet credential line omitted]');continue
             clean.append(l[:220])
            funcs.append({'name':n.name,'lines':clean[:145]})
           print('PAYMENT_FUNCTION='+json.dumps({'source':name,'functions':funcs},ensure_ascii=False))
           for n in tree.body:
            if isinstance(n,ast.Assign):
             if any(t.id in ('MAINNET_ENABLED','NETWORK','REQUIRED_CONFIRMATIONS','MIN_CONFIRMATIONS') for t in n.targets if isinstance(t,ast.Name)):
              print('PAYMENT_CONSTANT='+json.dumps({'file':name,'vars':[t.id for t in n.targets if isinstance(t,ast.Name)],'value_type':type(n.value).__name__,'value':n.value.value if isinstance(n.value,ast.Constant) and isinstance(n.value.value,(bool,int,str)) else None}))
          print('STORE_PUBLIC_SERVER_ROOT='+json.dumps({'app_is_live':True,'mode':str(settings.DEBUG)}))

          PY
          BASH
