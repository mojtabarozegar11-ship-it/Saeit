name: MojPlayWin public buyer route diagnostics read only
on:
  push:
    branches: [audit/mpw-book72-go-live-gates-20261015]
    paths: [.github/workflows/mpw-public-auth-http-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH connections to authorized site host
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/astra-live-payment"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/$item.key"
            chmod 600 "$d/$item.key"
            ssh-keygen -y -P '' -f "$d/$item.key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Inspect HTTP and fresh Django routes without restarting any site
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/astra-live-payment/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/Saeit-staging"
          doc="$HOME/mojplaywin.com"
          test -f "$app/manage.py" && test -f "$doc/passenger_wsgi.py"
          echo ROUTE_HTTP_PASSENGER_ROOT_EXISTS=YES
          if test -f "$doc/tmp/restart.txt"; then echo ROUTE_HTTP_PASSENGER_RESTART_FILE_PRESENT=YES; else echo ROUTE_HTTP_PASSENGER_RESTART_FILE_PRESENT=NO; fi
          export DJANGO_SETTINGS_MODULE=config.settings PYTHONPATH="$app"
          cd "$app"
          for py in "$HOME/virtualenv/Saeit-staging/3.11/bin/python" "$app/.venv/bin/python" "$HOME/virtualenv/Saeit-staging/3.10/bin/python"; do
            if test -x "$py" && "$py" -c 'import django' >/dev/null 2>&1; then
              "$py" - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          from django.test import Client
          from django.urls import resolve,Resolver404
          from django.contrib.auth import get_user_model
          print("ROUTE_HTTP_DJANGO_LOGIN="+str(settings.LOGIN_URL))
          print("ROUTE_HTTP_DB_ACCESSIBLE="+str(get_user_model().objects.count()>=0))
          for path in ("/accounts/login/","/accounts/register/","/commerce/my-purchases/","/commerce/book/72/"):
              try: name=resolve(path).view_name
              except Resolver404:name="NOT_ROUTED"
              print("ROUTE_HTTP_FRESH_RESOLVE_"+path.replace("/","_")+"="+name)
              try:
                  r=Client().get(path,secure=True,HTTP_HOST="mojplaywin.com")
                  print("ROUTE_HTTP_FRESH_CLIENT_"+path.replace("/","_")+"="+str(r.status_code))
              except Exception as exc:
                  print("ROUTE_HTTP_FRESH_CLIENT_"+path.replace("/","_")+"=ERROR_"+type(exc).__name__)
          PY
              exit 0
            fi
          done
          exit 1
          REMOTE
      - name: Independently inspect public HTTP without changing content
        shell: bash
        run: |
          for path in /store/ /accounts/login/ /accounts/register/ /commerce/my-purchases/ /commerce/book/72/; do
            code="$(curl -sS -L --connect-timeout 8 --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            echo "ROUTE_HTTP_PUBLIC_${path//\//_}=$code"
          done
      - name: Clean temporary identities
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/astra-live-payment"
