name: Zomorod three research shelves and sixty independent pages
on:
  pull_request:
    paths:
      - "content/zomorod-three-research-shelves/**"
      - ".github/workflows/zomorod-three-research-shelves.yml"
  push:
    branches: [main]
    paths:
      - "content/zomorod-three-research-shelves/**"
      - ".github/workflows/zomorod-three-research-shelves.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-three-research-shelves-root-only
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and prepare a real V9 homepage fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile content/zomorod-three-research-shelves/zomorod_three_shelves.py
          test -s content/zomorod-v6-20261018/index.html
          python3 - <<'PY'
          from pathlib import Path
          x=Path('content/zomorod-v6-20261018/index.html').read_text(encoding='utf-8')
          assert 'window.ZOMOROD_ORBIT_DATA=' in x
          assert '<body>' in x
          logo='<a class="zm-v7-home-logo" href="/company/" aria-label="معرفی شرکت زمرد ملل"><img src="/static/site/zomorod-v7/company-logo.webp" alt="لوگو"></a>'
          x=x.replace('<body>','<body><!-- zm-unified-v7-20261018 -->'+logo,1)
          Path('/tmp/zomorod-three-base.html').write_text(x,encoding='utf-8')
          PY
          python3 content/zomorod-v8/zomorod_v8_rows_and_logo.py /tmp/zomorod-three-base.html --output /tmp/zomorod-three-v8.html
          python3 content/zomorod-v9/zomorod_v9_link_real_pages.py /tmp/zomorod-three-v8.html --output /tmp/zomorod-three-v9.html
          python3 content/zomorod-three-research-shelves/zomorod_three_shelves.py /tmp/zomorod-three-v9.html --output /tmp/zomorod-three-preview.html --pages-root /tmp/zomorod-three-pages
      - name: Verify every existing card and all sixty new documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          def load(path):
              s=Path(path).read_text(encoding='utf8')
              return json.loads(re.search(r'window\.ZOMOROD_ORBIT_DATA=(\{.*?\});</script>',s,re.S).group(1))['rows']
          old=load('/tmp/zomorod-three-v9.html')
          new=load('/tmp/zomorod-three-preview.html')
          assert len(old)==26 and len(new)==29
          assert [r for r in new if r['index']<=26]==old
          added=[r for r in new if r['index']>26]
          assert [r['title'] for r in added]==['واحدهای تخصصی','آزمایشگاه‌ها','مراکز تحقیقات']
          assert all(len(r['cards'])==20 for r in added)
          assert len({c['canonicalUrl'] for r in added for c in r['cards']})==60
          assert all(c.get('livePage') for r in added for c in r['cards'])
          for r in added:
              for c in r['cards']:
                  relative=c['canonicalUrl'].removeprefix('/research/directory/')
                  p=Path('/tmp/zomorod-three-pages')/relative/'index.html'
                  assert p.is_file() and c['title'] in p.read_text(encoding='utf8'), p
          assert len(list(Path('/tmp/zomorod-three-pages').rglob('index.html')))==60
          print('PROOF_EXISTING_ROWS_PRESERVED=yes')
          print('PROOF_THREE_NEW_SHELVES=20+20+20')
          print('PROOF_INDEPENDENT_PAGES=60')
          PY
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned, authenticated VPS-to-cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-three-shelves"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo RELAY_HOST_IDENTITIES=verified
      - name: Immutable homepage backup and protected-route snapshot
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-three-shelves"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; web="$HOME/public_html"
          backup="$HOME/.backups/zomorod-three-shelves/$sha"
          test -s "$web/index.html" && test ! -L "$web/index.html"
          test -f "$web/research/index.html" && test -f "$web/.htaccess"
          test ! -e "$web/research/directory"
          grep -Fq 'zm-v9-real-pages-unique-links-20261018' "$web/index.html"
          ! grep -Fq 'zm-research-three-shelves-20261018' "$web/index.html"
          test ! -e "$backup"
          mkdir -p "$(dirname "$backup")"
          mkdir -m 700 "$backup"
          cp -p "$web/index.html" "$backup/index.original.html"
          cmp -s "$web/index.html" "$backup/index.original.html"
          sha256sum "$web/index.html" > "$backup/root-original.sha256"
          (cd "$web"; for p in .htaccess research/index.html company/index.html about/index.html agriculture/index.html services/index.html industry/index.html tala/index.html mohammad/index.html ghanadi/index.html; do
            if test -f "$p"; then sha256sum "$p"; fi
          done) > "$backup/protected.sha256"
          echo ORIGINAL_HOME_BACKUP=verified
          REMOTE
          scp -F "$d/config" content/zomorod-three-research-shelves/zomorod_three_shelves.py \
            "saeit-cpanel:/home/zomorod2/.backups/zomorod-three-shelves/$GITHUB_SHA/zomorod_three_shelves.py"
      - name: Render and validate the entire candidate in private staging
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-three-shelves"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; web="$HOME/public_html"; backup="$HOME/.backups/zomorod-three-shelves/$sha"
          sha256sum -c --status "$backup/root-original.sha256"
          python3 -m py_compile "$backup/zomorod_three_shelves.py"
          python3 "$backup/zomorod_three_shelves.py" "$backup/index.original.html" \
            --output "$backup/index.candidate.html" --pages-root "$backup/pages"
          test "$(find "$backup/pages" -type f -name index.html | wc -l)" -eq 60
          test ! -e "$web/research/directory"
          (cd "$web"; sha256sum -c --status "$backup/protected.sha256")
          echo PRIVATE_STAGING=validated
          REMOTE
      - name: Atomic publication with rollback if any validation fails
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-three-shelves"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"; web="$HOME/public_html"; backup="$HOME/.backups/zomorod-three-shelves/$sha"
          catalog="$web/research/directory"
          sha256sum -c --status "$backup/root-original.sha256"
          test ! -e "$catalog"
          test -s "$backup/index.candidate.html"
          pages_moved=0; root_changed=0
          rollback() {
            set +e
            if test "$root_changed" = 1; then
              cp -p "$backup/index.original.html" "$web/index.html.zm-rollback.$sha"
              mv -f "$web/index.html.zm-rollback.$sha" "$web/index.html"
            fi
            if test "$pages_moved" = 1 && test -f "$catalog/units/molecular-genetics/index.html"; then
              grep -Fq 'zm-research-three-shelves-20261018:page' "$catalog/units/molecular-genetics/index.html" && rm -rf -- "$catalog"
            fi
            echo ZOMOROD_THREE_SHELVES_ROLLBACK=completed
          }
          trap 'rc=$?; trap - EXIT; rollback; exit "$rc"' EXIT
          pages_moved=1
          mv -T "$backup/pages" "$catalog"
          test -f "$catalog/centers/technology-development/index.html"
          cp -p "$backup/index.candidate.html" "$web/index.html.zm-next.$sha"
          chmod --reference="$web/index.html" "$web/index.html.zm-next.$sha"
          root_changed=1
          mv -f "$web/index.html.zm-next.$sha" "$web/index.html"
          code="$(curl -LsS --max-time 40 -H 'Cache-Control: no-cache' -o "$backup/home.live.html" -w '%{http_code}' "https://zomorodmelal.ir/?three_shelves=$sha" || true)"
          echo HOMEPAGE_HTTP="$code"
          test "$code" = 200
          grep -Fq 'zm-research-three-shelves-20261018' "$backup/home.live.html"
          for route in /research/directory/units/molecular-genetics/ /research/directory/laboratories/molecular-genetics/ /research/directory/centers/genetics/; do
            url="https://zomorodmelal.ir$route"
            status="$(curl -LsS --max-time 25 -H 'Cache-Control: no-cache' -o "$backup/route.live.html" -w '%{http_code}' "$url" || true)"
            echo NEW_RESEARCH_ROUTE="$route" STATUS="$status"
            test "$status" = 200
            grep -Fq 'zm-research-three-shelves-20261018:page' "$backup/route.live.html"
          done
          for route in /research/ /company/ /about/ /agriculture/ /tala/ /mohammad/ /ghanadi/; do
            status="$(curl -LsS --max-time 20 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo PRESERVED_ROUTE="$route" STATUS="$status"
            test "$status" = 200
          done
          (cd "$web"; sha256sum -c --status "$backup/protected.sha256")
          test "$(find "$catalog" -type f -name index.html | wc -l)" -eq 60
          trap - EXIT
          echo HOMEPAGE_ROWS=29
          echo NEW_SPECIALIST_CARDS=60
          echo NEW_INDEPENDENT_PAGES=60
          echo PROTECTED_PAGES_UNCHANGED=yes
          echo PUBLISHED_AND_VERIFIED=yes
          REMOTE
      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-three-shelves"
