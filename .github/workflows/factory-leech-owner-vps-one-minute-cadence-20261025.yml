name: Activate single-writer one-minute free leech manuscript cadence on owner VPS
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/factory-leech-owner-vps-one-minute-cadence-20261025.yml
      - scripts/factory_leech_vps_cadence_20261025.py
permissions: {contents: read}
concurrency:
  group: owner-vps-leech-one-minute-safe-cadence-20261025
  cancel-in-progress: false
jobs:
  preserve-unrelated-cron-and-schedule-private-manuscript-production:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && contains(github.event.head_commit.message, '[owner-leech-1min-cadence-20261025]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate cadence software, no hosted AI inference
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/factory_leech_vps_cadence_20261025.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("scripts/factory_leech_vps_cadence_20261025.py").read_text()
          for part in ('LEECH_OWNER_VPS_ONE_MINUTE_SINGLE_LOCKED_CADENCE',
                       'OWNED_SINGLE_CRON_ENTRY_MISMATCH', 'CRON_POSTWRITE_READBACK_MISMATCH',
                       'REFUSE_ROOT_CRONTAB', 'saeit-private-leech-vps-selfhosted-author-20261025'):
              assert part in s, part
          print("LEECH_ONE_MINUTE_CADENCE_SOFTWARE_QA=passed")
          PY
      - name: Activate only existing leech cron on authenticated owner VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/leech-cadence-ssh"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' < scripts/factory_leech_vps_cadence_20261025.py
