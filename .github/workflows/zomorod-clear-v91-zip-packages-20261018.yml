name: Clear obsolete V91 distribution ZIP packages
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-clear-v91-zip-packages-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-clear-v91-archives-20261018
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Remove only three listed obsolete build ZIP files in V91, no source code
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          h=Path.home()
          assert h==Path("/home/zomorod2")
          p=h/"saeit_v91"
          assert p.is_dir() and not p.is_symlink()
          assert (h/"Saeit/agent_imports/v91_genomes/site_master/vendor/master_gen64/controller.py").is_file()
          names={
            "SAEIT_V91_TWO_SITES_IMPLEMENTATION_FOR_SOL_2026-10-12.zip":59382731,
            "SAEIT_TWO_READY_TEMPLATES_V91.zip":17939445,
            "01_ZomorodMelal_V91_Host_Template.zip":17747207
          }
          for name,size in names.items():
              f=p/name
              assert f.is_file() and not f.is_symlink() and f.stat().st_size==size
          for name,size in names.items():
              f=p/name
              f.unlink()
              print("OBSOLETE_V91_BUILD_PACKAGE_REMOVED="+name+" bytes="+str(size))
          print("V91_BUILD_PACKAGE_BYTES_REMOVED="+str(sum(names.values())))
          print("V91_SOURCES_AND_RUNTIME_UNTOUCHED=yes")
          PY
          REMOTE
      - name: Website health after old ZIP cleanup
        shell: bash
        run: |
          for route in / /agents/; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "V91_ZIP_CLEAN_HEALTH=$route:$code"
            test "$code" = 200
          done
      - name: Clean runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
