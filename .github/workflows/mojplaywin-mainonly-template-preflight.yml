name: MojPlayWin main-only live template fingerprint preflight
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths:
      - ".github/workflows/mojplaywin-mainonly-template-preflight.yml"
      - "scripts/mojplaywin_mainonly_template_fingerprint.py"
permissions:
  contents: read
concurrency:
  group: mojplaywin-mainonly-template-preflight
  cancel-in-progress: false
jobs:
  compare-exact-templates-readonly:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate script without importing Django or executing site code
        run: |
          python3 -m py_compile scripts/mojplaywin_mainonly_template_fingerprint.py
      - name: Configure pinned GitHub to VPS to cPanel private read-only relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mainonly-preflight"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
      - name: Compare live fixed template fingerprints to repository main baseline
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mainonly-preflight"
          timeout 45s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mojplaywin_mainonly_template_fingerprint.py > "$d/live.json"
          git fetch --quiet origin main:refs/remotes/origin/main
          python3 - "$d/live.json" <<'PY'
          import hashlib,json,subprocess,sys
          d=json.load(open(sys.argv[1]))
          assert d["classification"]=="MAINONLY_TEMPLATE_READONLY_FINGERPRINT"
          assert d["production_modified"] is False
          paths=list(d["files"])
          allowed=[x for x in paths if x.startswith("core/templates/mojplaywin/")]
          protected=[x for x in paths if x not in allowed]
          assert len(allowed)==7 and len(protected)==4
          changed=[]
          for name in allowed:
              live=d["files"][name]
              result=subprocess.run(["git","show","origin/main:"+name],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              if result.returncode:
                  expected_state="missing"
                  match=(live["state"]=="missing")
              else:
                  expected_state="file"
                  digest=hashlib.sha256(result.stdout).hexdigest()
                  match=(live["state"]=="file" and live["sha256"]==digest)
              if not match:changed.append(name)
              print(f'MAIN_TEMPLATE_ORIGIN_BASELINE path={name} live_state={live["state"]} expected={expected_state} identical_to_main={match}')
          print(f'MAIN_TEMPLATE_MISMATCH_COUNT={len(changed)}')
          print(f'PROTECTED_SHARED_FILE_COUNT={len(protected)}')
          print('PROTECTED_SHARED_FILES_NOT_MODIFIED=true')
          print('TEMPLATE_SOURCE_OVERWRITE_READY='+str(not changed).lower())
          print('PASSENGER_RESTART=false')
          print('PRODUCTION_MODIFIED=false')
          print('LIVE_RELEASE_AUTHORIZED=false')
          PY
      - name: Remove private SSH credentials and fingerprints
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/mainonly-preflight"

# Post-rollback read-only verification: release run 39062704173 reverted six templates.
