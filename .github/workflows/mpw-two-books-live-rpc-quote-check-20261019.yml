name: MojPlayWin payment gateways and real-chain prerelease probe
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-two-books-live-rpc-quote-check-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect price feeds, blockchain verification and release gates without funds
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 130s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,pathlib,importlib,inspect,json,urllib.request
          root=pathlib.Path('/home/zomorod2/Saeit-staging')
          os.chdir(root);sys.path.insert(0,str(root))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.conf import settings
          modules=['mpw_commerce.rate_provider','mpw_commerce.buyer_wallets',
             'mpw_commerce.auto_reconcile','mpw_commerce.real_rpc',
             'mpw_commerce.chain_proof','scripts.mojplaywin_native_chain_verify']
          for mod in modules:
            try:
              obj=importlib.import_module(mod)
              functions=[]
              for key,item in vars(obj).items():
                if inspect.isfunction(item) and item.__module__==mod:
                  functions.append({'name':key,'args':str(inspect.signature(item))[:180]})
              print('MPW_CHAIN_MODULE='+json.dumps({'name':mod,'available':True,'functions':functions[:25]}))
            except Exception as exc:
              print('MPW_CHAIN_MODULE='+json.dumps({'name':mod,'available':False,'error':type(exc).__name__}))
          for asset in ('ETH','TRX'):
            try:
              from mpw_commerce.buyer_wallets import fetch_server_rate
              quote=fetch_server_rate(asset)
              print('MPW_LIVE_QUOTE='+json.dumps({'asset':asset,'success':bool(quote),'type':type(quote).__name__,
                   'source':getattr(quote,'source',None),'recent':bool(getattr(quote,'observed_at',None))}))
            except Exception as exc:
              print('MPW_LIVE_QUOTE='+json.dumps({'asset':asset,'success':False,'error':type(exc).__name__}))
          checks=[
            ('ethereum-public-rpc','https://ethereum-rpc.publicnode.com',b'{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'),
            ('tron-public-rpc','https://api.trongrid.io/wallet/getnowblock',b'{}'),
          ]
          for name,url,body in checks:
            try:
              req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json','User-Agent':'MojPlayWin-commerce-readiness/1.0'},method='POST')
              with urllib.request.urlopen(req,timeout=8) as response:
                data=json.load(response)
              ok=(data.get('result')=='0x1') if name.startswith('ethereum') else ('block_header' in data)
              print('MPW_PUBLIC_CHAIN_PROBE='+json.dumps({'name':name,'http_success':True,'expected_network':ok}))
            except Exception as exc:
              print('MPW_PUBLIC_CHAIN_PROBE='+json.dumps({'name':name,'http_success':False,'error':type(exc).__name__}))
          PY
          BASH
