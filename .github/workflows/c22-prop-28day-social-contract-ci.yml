name: C22 MOJ PROP 28-day single-post contract and human-review safety
on:
  push:
    branches: [fix/c22-moj-prop-28day-evidence-safety-20261115]
    paths:
      - 'prop_firm/social_policy.py'
      - 'prop_firm/models.py'
      - 'prop_firm/admin.py'
      - 'prop_firm/migrations/0005_alter_propsocialevidence_review_status.py'
      - 'tests/test_moj_prop_social_policy.py'
      - 'tests/test_moj_prop_social_review.py'
      - 'tests/test_moj_prop_social_admin_readonly_c22.py'
      - '.github/workflows/c22-prop-28day-social-contract-ci.yml'
  pull_request:
    paths:
      - 'prop_firm/social_policy.py'
      - 'prop_firm/models.py'
      - 'prop_firm/admin.py'
      - 'prop_firm/migrations/0005_alter_propsocialevidence_review_status.py'
      - 'tests/test_moj_prop_social_policy.py'
      - 'tests/test_moj_prop_social_review.py'
      - 'tests/test_moj_prop_social_admin_readonly_c22.py'
      - '.github/workflows/c22-prop-28day-social-contract-ci.yml'
permissions:
  contents: read
jobs:
  four-week-social-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Python requirements
        run: python -m pip install -r requirements.txt
      - name: Django configuration and migration consistency; no production SSH
        env:
          SECRET_KEY: c22-local-isolated-ci-only
          ALLOWED_HOSTS: testserver,localhost
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: One-post 28-day social policy and independent database review
        env:
          SECRET_KEY: c22-local-isolated-ci-only
          ALLOWED_HOSTS: testserver,localhost
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_moj_prop_social_policy.py tests/test_moj_prop_social_review.py tests/test_moj_prop_social_admin_readonly_c22.py
          python -m py_compile prop_firm/models.py prop_firm/social_policy.py prop_firm/social_review_service.py
          echo "C22_EXTERNAL_SOCIAL_POSTS=0"
          echo "C22_REAL_TRX_PAYMENTS=0"
          echo "C22_BROKER_TRADES=0"
          echo "C22_PRODUCTION_DEPLOYMENTS=0"
