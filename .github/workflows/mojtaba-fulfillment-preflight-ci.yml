name: Mojtaba bot buyer delivery preflight and Crown recovery (isolated)

on:
  pull_request:
    branches:
      - audit/mojtaba-revenue-evidence-20261114
    paths:
      - core/crown_fleet.py
      - core/fulfillment_preflight.py
      - core/economic_master_agent.py
      - command_center/fulfillment_preflight.py
      - command_center/urls.py
      - core/management/commands/mojtaba_fulfillment_preflight_readonly.py
      - core/tests/test_mojtaba_fulfillment_preflight_20261114.py
      - tests/test_crown_fleet.py
      - tests/test_crown_tron_receipts.py
      - .github/workflows/mojtaba-fulfillment-preflight-ci.yml

permissions:
  contents: read

jobs:
  buyer-delivery-no-write:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    env:
      DEBUG: "true"
      SECRET_KEY: "isolated-fulfillment-ci-key"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1,mojplaywin.com"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TRADE_EMAIL_ENABLED: "false"
      CROWN_STORE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Django model/system checks
        run: python manage.py check
      - name: Isolated buyer fulfillment, game ownership, TRX and financial checks
        run: |
          python -m pytest -q \
            core/tests/test_mojtaba_fulfillment_preflight_20261114.py \
            core/tests/test_mojtaba_revenue_evidence_20261114.py \
            tests/test_crown_fleet.py \
            tests/test_crown_tron_receipts.py
      - name: Compile source and tests
        run: |
          python -m compileall -q \
            core/crown_fleet.py core/fulfillment_preflight.py \
            command_center/fulfillment_preflight.py \
            core/management/commands/mojtaba_fulfillment_preflight_readonly.py \
            core/tests/test_mojtaba_fulfillment_preflight_20261114.py
