name: MojPlayWin mobile login CSRF cookie and inline JS public headers audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-mobile-login-cookie-and-csp-headers-20261020.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public HTTPS login form response headers without cookies or passwords
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json
          for host in ('mojplaywin.com','www.mojplaywin.com'):
              url='https://'+host+'/accounts/login/?public_probe=20261020'
              for agent in ('Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36','Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 ChatGPT WebView Mobile Safari/537.36'):
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':agent})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      html=r.read(120000).decode('utf8','replace')
                      csp=r.headers.get('Content-Security-Policy','')
                      cookie_headers=r.headers.get_all('Set-Cookie') or []
                      cookies=[{'name':h.split('=',1)[0], 'secure':'; secure' in h.lower(),
                                'samesite_lax':'samesite=lax' in h.lower(), 'path_root':'; path=/' in h.lower()}
                               for h in cookie_headers]
                      print('MPW_MOBILE_LOGIN_CSP_COOKIE_AUDIT='+json.dumps({
                        'host':host,'agent':'in_app' if 'ChatGPT' in agent else 'chrome',
                        'status':r.status,'redirected_host':urllib.parse.urlparse(r.geturl()).hostname,
                        'form_csrf':('csrfmiddlewaretoken' in html),
                        'client_guard':'mpw-csrf-fresh-submit-20261020' in html,
                        'cookies':cookies,
                        'csp_present':bool(csp),'csp':csp[:700],
                        'cache_control':r.headers.get('Cache-Control',''),
                        'vary':r.headers.get('Vary',''),
                        'inline_guard_allowed':not csp or ('unsafe-inline' in csp) or ('nonce-' in csp),
                        'frame_options':r.headers.get('X-Frame-Options',''),
                      },ensure_ascii=False))
          PY
