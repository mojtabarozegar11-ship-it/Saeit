name: Consolidate two old Saeit restore snapshots into verified tarballs
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-compact-two-legacy-saeit-backups.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-compact-old-saeit-backups
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Archive historical communication and phase19 backup snapshots preserving all unique files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,tarfile,subprocess,shutil
          from pathlib import Path
          H=Path.home()
          root=H/"Saeit/backups"
          assert H==Path("/home/zomorod2") and root.is_dir() and not root.is_symlink()
          assert (H/"Saeit/manage.py").is_file()
          names={"communication-core-20261005-051054":14,"pre_phase19_cleanup_20261004-124041":433}
          proc=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10)
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10)
          total=0
          for name,expected in names.items():
              source=root/name
              dest=root/(name+".tar.gz")
              temp=root/("."+name+".tar.gz.part")
              assert source.is_dir() and not source.is_symlink()
              assert not dest.exists() and not temp.exists()
              assert str(source) not in proc.stdout and str(source) not in cron.stdout
              hashes={}
              for directory,dirs,files in os.walk(source,followlinks=False):
                  for child in dirs+files:
                      if (Path(directory)/child).is_symlink():raise RuntimeError("HISTORIC_BACKUP_SYMLINK")
                  for file in files:
                      p=Path(directory)/file
                      digest=hashlib.sha256()
                      with p.open("rb") as inp:
                          for chunk in iter(lambda:inp.read(1024*1024),b""):digest.update(chunk)
                      hashes[str(p.relative_to(source))]=digest.hexdigest()
              assert len(hashes)==expected
              try:
                  with tarfile.open(temp,"w:gz",compresslevel=1) as tar:
                      tar.add(source,arcname=name,recursive=True)
                  with temp.open("rb") as f:os.fsync(f.fileno())
                  seen={}
                  with tarfile.open(temp,"r:gz") as tar:
                      for t in tar:
                          if not t.isfile():continue
                          reader=tar.extractfile(t)
                          assert reader is not None
                          dig=hashlib.sha256()
                          for part in iter(lambda:reader.read(1024*1024),b""):dig.update(part)
                          seen[str(Path(t.name).relative_to(name))]=dig.hexdigest()
                  assert seen==hashes
                  os.replace(temp,dest)
                  assert tarfile.is_tarfile(dest)
                  before=int(subprocess.run(["du","-sk",str(source)],capture_output=True,text=True,timeout=55,check=True).stdout.split()[0])*1024
                  packed=dest.stat().st_size
                  shutil.rmtree(source)
                  assert dest.is_file() and not source.exists()
                  total+=before-packed
                  print("LEGACY_BACKUP_TARBALL_VERIFIED="+name+" files="+str(expected)+" saved_bytes="+str(before-packed))
              finally:
                  if temp.exists():temp.unlink()
          print("SAEIT_OLD_BACKUP_SPACE_SAVED="+str(total))
          print("LIVE_SITE_CONTENT_AND_DATABASES_UNCHANGED=yes")
          PY
          REMOTE
      - name: Verify production website health
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://zomorodmelal.ir/" "https://zomorodmelal.ir/agents/" "https://mojplaywin.com/"; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "ARCHIVE_SAEIT_SITE=$url:$code"
            test "$code" = 200
          done
      - name: Remove runner SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
