name: Staging SSH diagnostics (manual, read-only)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target server
        type: choice
        required: true
        options: [host, vps]
      check:
        description: Read-only diagnostic
        type: choice
        required: true
        options: [identity, staging_directory, staging_processes]
permissions:
  contents: read
concurrency:
  group: staging-ssh-diagnostics
  cancel-in-progress: false
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Choose isolated credentials
        env:
          TARGET: ${{ inputs.target }}
          HOST_HOST: ${{ secrets.SAEIT_HOST_SSH_HOST }}
          HOST_USER: ${{ secrets.SAEIT_HOST_SSH_USER }}
          HOST_PORT: ${{ secrets.SAEIT_HOST_SSH_PORT }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
          VPS_HOST: 178.239.147.150
          VPS_USER: githubops
          VPS_PORT: "22"
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$TARGET" == host ]]; then
            h="$HOST_HOST"; u="$HOST_USER"; p="$HOST_PORT"; k="$HOST_KEY"; known="$HOST_KNOWN"
            [[ -n "$VPS_KEY" ]] || { echo "VPS relay credential is required for cPanel"; exit 1; }
          else
            h="$VPS_HOST"; u="$VPS_USER"; p="$VPS_PORT"; k="$VPS_KEY"; known="$VPS_KNOWN"
          fi
          [[ -n "$h" && -n "$u" && -n "$k" ]] || { echo "Missing SSH credentials for selected target"; exit 1; }
          [[ "$u" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ ]] || exit 1
          [[ "$h" =~ ^[a-zA-Z0-9.:-]+$ ]] || exit 1
          p="${p:-22}"
          [[ "$p" =~ ^[0-9]{1,5}$ ]] && ((p >= 1 && p <= 65535)) || exit 1

          # Both targets use the same pinned first-hop identity; never attempt
          # a direct GitHub-hosted-runner connection to allowlisted cPanel SSH.
          vps_known="$VPS_KNOWN"
          if [[ -z "$vps_known" ]]; then
            vps_known="$(ssh-keyscan -T 10 -p 22 -t rsa "$VPS_HOST" 2>/dev/null)"
          fi
          [[ -n "$vps_known" ]] || { echo "VPS first-hop SSH transport unavailable"; exit 1; }
          fingerprint="$(printf '%s\n' "$vps_known" | ssh-keygen -lf - -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$fingerprint" == "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" ]] || { echo "Unexpected VPS SSH host fingerprint"; exit 1; }

          if [[ "$TARGET" == vps ]]; then
            known="$vps_known"
          fi
          [[ -n "$known" ]] || { echo "Missing pinned cPanel host key"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$k" > "$HOME/.ssh/id_staging"
          printf '%s\n' "$known" > "$HOME/.ssh/known_hosts"
          if [[ "$TARGET" == host ]]; then
            printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/id_staging_vps"
            printf '%s\n' "$vps_known" >> "$HOME/.ssh/known_hosts"
            cat > "$HOME/.ssh/staging_config" <<EOF
          Host saeit-vps-relay
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile $HOME/.ssh/id_staging_vps
            UserKnownHostsFile $HOME/.ssh/known_hosts
          Host saeit-cpanel
            HostName $h
            User $u
            Port $p
            IdentityFile $HOME/.ssh/id_staging
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ProxyJump saeit-vps-relay
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
            alias=saeit-cpanel
          else
            cat > "$HOME/.ssh/staging_config" <<EOF
          Host saeit-vps
            HostName $h
            User $u
            Port $p
            IdentityFile $HOME/.ssh/id_staging
            UserKnownHostsFile $HOME/.ssh/known_hosts
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
            alias=saeit-vps
          fi
          chmod 600 "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts" "$HOME/.ssh/staging_config"
          [[ "$TARGET" != host ]] || chmod 600 "$HOME/.ssh/id_staging_vps"
          printf 'SSH_ALIAS=%s\n' "$alias" >> "$GITHUB_ENV"
      - name: Run one allowlisted diagnostic
        shell: bash
        env:
          CHECK: ${{ inputs.check }}
        run: |
          set -euo pipefail
          case "$CHECK" in
            identity) remote='id -un; hostname' ;;
            staging_directory) remote='test -d /home/zomorod2/Saeit-staging && echo STAGING_DIRECTORY_PRESENT || echo STAGING_DIRECTORY_MISSING' ;;
            staging_processes) remote='ps -eo pid,comm,args | grep -E "[f]actory_staging_tick|[s]tage1_10s_loop" | cut -c1-180 | head -20 || true' ;;
            *) exit 1 ;;
          esac
          ssh -F "$HOME/.ssh/staging_config" "$SSH_ALIAS" "$remote"
