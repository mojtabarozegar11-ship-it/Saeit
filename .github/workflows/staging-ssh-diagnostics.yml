name: Staging SSH relay diagnostics
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/staging-ssh-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-ssh-relay
  cancel-in-progress: false
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure pinned SSH identities
        env:
          VPS_HOST: "178.239.147.150"
          VPS_USER: "githubops"
          VPS_PORT: "22"
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN: "verify-pinned-rsa"
          HOST_HOST: "zohal.pws-dns.net"
          HOST_USER: "zomorod2"
          HOST_PORT: "1396"
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        shell: python
        run: |
          import os, pathlib, re, sys, subprocess
          missing = [f"{prefix}_{field}" for prefix in ("VPS","HOST")
                     for field in ("HOST","USER","KEY","KNOWN")
                     if not os.environ.get(f"{prefix}_{field}")]
          if missing:
              print("MISSING_CONFIGURATION: " + ", ".join(missing))
              sys.exit(2)
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "saeit-ssh"
          root.mkdir(mode=0o700)
          scan = subprocess.run(["ssh-keyscan", "-T", "10", "-t", "rsa", os.environ["VPS_HOST"]], capture_output=True, text=True, timeout=15)
          candidate = root / "vps.candidate"
          candidate.write_text(scan.stdout)
          fp = subprocess.run(["ssh-keygen", "-lf", str(candidate), "-E", "sha256"], capture_output=True, text=True, timeout=5)
          fingerprints = [line.split()[1] for line in fp.stdout.splitlines() if len(line.split()) > 1]
          if fp.returncode or not fingerprints or set(fingerprints) != {"SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"}:
              sys.exit("VPS host fingerprint mismatch or unavailable")
          os.environ["VPS_KNOWN"] = scan.stdout
          configs = []
          for prefix, alias in (("VPS","saeit-vps"), ("HOST","saeit-host")):
              host, user = (os.environ[f"{prefix}_{f}"] for f in ("HOST","USER"))
              port = os.environ.get(f"{prefix}_PORT") or "22"
              if not re.fullmatch(r"[A-Za-z0-9.:-]+", host) or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_.-]*", user):
                  sys.exit("Invalid SSH destination")
              if not port.isdigit() or not 1 <= int(port) <= 65535:
                  sys.exit("Invalid SSH port")
              if user == "root":
                  sys.exit("Use a dedicated restricted SSH account; root is not permitted")
              key, known = root / (alias + ".key"), root / (alias + ".known")
              for path, value in ((key, os.environ[f"{prefix}_KEY"]), (known, os.environ[f"{prefix}_KNOWN"])):
                  path.write_text(value.rstrip() + "\n")
                  path.chmod(0o600)
              configs.append(f"Host {alias}\n  HostName {host}\n  User {user}\n  Port {port}\n  IdentityFile {key}\n  UserKnownHostsFile {known}\n")
          configs.append("Host saeit-host\n  ProxyJump saeit-vps\n")
          configs.append("Host *\n  BatchMode yes\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ServerAliveInterval 10\n  ServerAliveCountMax 1\n  ForwardAgent no\n  RequestTTY no\n  LogLevel ERROR\n")
          config = root / "config"
          config.write_text("\n".join(configs))
          config.chmod(0o600)
      - name: Authenticated VPS read-only proof
        run: |
          set -euo pipefail
          timeout 35s ssh -F "$RUNNER_TEMP/saeit-ssh/config" saeit-vps 'id -un; hostname; date -u +%FT%TZ'
      - name: Verify hosting key against owner-confirmed fingerprint
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "saeit-ssh"
          expected = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          endpoint = "[zohal.pws-dns.net]:1396"
          old = root / "saeit-host.known"
          match = subprocess.run(["ssh-keygen", "-F", endpoint, "-f", str(old)], capture_output=True, text=True, timeout=5)
          entries = [line for line in match.stdout.splitlines() if line and not line.startswith("#")]
          print("OLD_ENDPOINT_MATCH=" + str(bool(entries)))
          for i, entry in enumerate(entries):
              parts = entry.split()
              tmp = root / ("old-entry-" + str(i))
              tmp.write_text(entry + "\n")
              fp = subprocess.run(["ssh-keygen", "-lf", str(tmp), "-E", "sha256"], capture_output=True, text=True, timeout=5)
              values = fp.stdout.split()
              print("OLD_MATCH_TYPE=" + (parts[1] if len(parts)>1 else "invalid"))
              print("OLD_MATCH_FINGERPRINT_VALID=" + str(len(values)>1 and values[1]==expected))
          scan = subprocess.run(["ssh", "-F", str(root/"config"), "saeit-vps",
              "timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net"],
              capture_output=True, text=True, timeout=30)
          lines = [line.split() for line in scan.stdout.splitlines() if line and not line.startswith("#")]
          if scan.returncode or not lines or any(len(p)!=3 or p[0]!=endpoint or p[1]!="ssh-ed25519" for p in lines):
              sys.exit("Hosting key scan failed validation")
          candidate = root / "host.candidate"
          candidate.write_text("\n".join(" ".join(p) for p in lines) + "\n")
          fp = subprocess.run(["ssh-keygen", "-lf", str(candidate), "-E", "sha256"], capture_output=True, text=True, timeout=5)
          fingerprints = [line.split()[1] for line in fp.stdout.splitlines() if len(line.split())>1]
          if fp.returncode or not fingerprints or set(fingerprints)!={expected}:
              sys.exit("Hosting fingerprint mismatch; no trust update")
          old.write_text(candidate.read_text())
          old.chmod(0o600)
          print("HOST_ED25519_PIN_VERIFIED=" + expected)
          keycheck = subprocess.run(["ssh-keygen", "-y", "-P", "", "-f", str(root/"saeit-host.key")], capture_output=True, timeout=5)
          if keycheck.returncode:
              sys.exit("Hosting authentication key invalid or encrypted; no secret output")
          print("HOST_AUTH_KEY_FORMAT_VALID")
      - name: Authenticated host proof through VPS
        run: |
          set -euo pipefail
          timeout 45s ssh -F "$RUNNER_TEMP/saeit-ssh/config" saeit-host 'set -eu; id -un; hostname; test -d /home/zomorod2/Saeit-staging; printf "STAGING_DIRECTORY_PRESENT\n"; date -u +%FT%TZ'
      - name: Remove runner credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/saeit-ssh"
