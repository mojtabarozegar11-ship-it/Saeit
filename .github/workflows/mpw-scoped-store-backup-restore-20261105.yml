name: MojPlayWin scoped store encrypted backup and isolated restore
on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      confirmation:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      operation:
        description: "Preflight metadata only, or owner-armed scoped export and isolated restore"
        type: choice
        required: true
        default: preflight_only
        options: [preflight_only, create_and_restore]
      confirmation:
        description: "Only for create_and_restore: type STORE_SCOPED_BACKUP_AND_RESTORE"
        required: false
        default: ""
        type: string
permissions: {contents: read}
concurrency:
  group: mpw-scoped-store-backup-restore
  cancel-in-progress: false
jobs:
  guarded-scoped-restore:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.ref == 'refs/heads/feature/mpw-recovery-01-20261105' &&
      (inputs.operation == 'preflight_only' ||
       (inputs.operation == 'create_and_restore' && inputs.confirmation == 'STORE_SCOPED_BACKUP_AND_RESTORE'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate source, encryption, restore and pure safety invariants
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mpw_scoped_store_backup_source_20261105.py \
            scripts/mpw_scoped_store_backup_vps_20261105.py \
            scripts/mpw_scoped_store_restore_verify_20261105.py
          python3 -m unittest discover -s tests -p 'test_mpw_scoped_store_backup_20261105.py'
          echo MPW_SCOPED_PIPELINE_SOURCE_CHECK=PASS
      - name: Establish pinned SSH two-hop relay to live cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-scoped-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only scope and VPS key/storage preflight (no SQL rows)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-scoped-ssh"
          source64="$(base64 -w0 scripts/mpw_scoped_store_backup_source_20261105.py)"
          call='import base64,sys;exec(base64.b64decode(sys.argv[1]))'
          timeout 95s ssh -T -F "$d/config" saeit-cpanel \
            "PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -c '$call' '$source64' plan"
          timeout 35s ssh -T -F "$d/config" saeit-vps \
            'python3 -B -c '\''import os,shutil;from pathlib import Path;p=Path.home()/".private-mojplaywin-offhost-backups";k=Path.home()/".config/mojplaywin-backup-recovery/recovery-key.bin";assert p.is_dir() and k.is_file() and shutil.which("gpg");f=os.statvfs(p);print("MPW_SCOPED_VPS_PREFLIGHT_FREE_BYTES="+str(f.f_bavail*f.f_frsize))'\'''
          echo MPW_SCOPED_PREFLIGHT=PASS
      - name: Prepare isolated MariaDB before any sensitive backup export
        if: inputs.operation == 'create_and_restore'
        run: |
          set -euo pipefail
          label="mpw-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$free" -ge 7500000000 || { echo ISOLATED_RUNNER_DISK_NO_GO; exit 1; }
          docker pull mariadb:11.8.9 >/dev/null
          docker run -d --rm --name "$label" --network none \
            --memory 2g --cpus 2 --pids-limit 200 --security-opt no-new-privileges \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 mariadb:11.8.9 >/dev/null
          ready=0
          for i in $(seq 1 80); do
            if docker exec "$label" mariadb --no-defaults -uroot -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo ISOLATED_MARIADB_NOT_READY; exit 1; }
          docker exec "$label" mariadb --no-defaults -uroot -e 'CREATE DATABASE mpw_isolated CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci' >/dev/null
          echo ISOLATED_MARIADB_READY=PASS
      - name: Create private encrypted store-scoped archive (production READ only)
        if: inputs.operation == 'create_and_restore'
        timeout-minutes: 22
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-scoped-ssh"
          scoped_id="mpw_store_$(date -u +%Y%m%dT%H%M%SZ)_$(openssl rand -hex 8)"
          echo "MPW_SCOPED_ARCHIVE_ID=$scoped_id" >> "$GITHUB_ENV"
          source64="$(base64 -w0 scripts/mpw_scoped_store_backup_source_20261105.py)"
          target64="$(base64 -w0 scripts/mpw_scoped_store_backup_vps_20261105.py)"
          call='import base64,sys;exec(base64.b64decode(sys.argv[1]))'
          timeout 1200s ssh -T -F "$d/config" saeit-cpanel \
            "PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -c '$call' '$source64' stream" |
            timeout 1200s ssh -T -F "$d/config" saeit-vps \
            "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$target64' store '$scoped_id'"
          echo MPW_SCOPED_ARCHIVE_TRANSFER=PASS
      - name: Independently restore encrypted scoped archive into isolated MariaDB
        if: inputs.operation == 'create_and_restore'
        timeout-minutes: 18
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-scoped-ssh"
          label="mpw-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target64="$(base64 -w0 scripts/mpw_scoped_store_backup_vps_20261105.py)"
          call='import base64,sys;exec(base64.b64decode(sys.argv[1]))'
          errors=$(mktemp "$RUNNER_TEMP/mpw-scoped-import-XXXXXXXX")
          echo "$errors" > "$RUNNER_TEMP/mpw-scoped-import-error-path"
          set +e
          timeout 1000s ssh -T -F "$d/config" saeit-vps \
            "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$target64' stream '$MPW_SCOPED_ARCHIVE_ID'" |
            timeout 1000s gzip -dc |
            timeout 1000s docker exec -i "$label" mariadb --no-defaults -uroot --binary-mode --database=mpw_isolated >/dev/null 2>"$errors"
          codes=("${PIPESTATUS[@]}")
          set -e
          if [ "${codes[0]}" -ne 0 ] || [ "${codes[1]}" -ne 0 ] || [ "${codes[2]}" -ne 0 ]; then
            echo "ISOLATED_SCOPED_IMPORT_FAILED stages=${codes[*]}" >&2
            exit 1
          fi
          python3 scripts/mpw_scoped_store_restore_verify_20261105.py "$label"
          echo MPW_SCOPED_ISOLATED_RESTORE=PASS
      - name: Destroy ephemeral MariaDB and local SSH material
        if: always()
        run: |
          set -euo pipefail
          docker rm -f "mpw-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
          d="$RUNNER_TEMP/mpw-scoped-ssh"
          if [ -d "$d" ]; then rm -rf -- "$d"; fi
          if [ -f "$RUNNER_TEMP/mpw-scoped-import-error-path" ]; then
            p=$(head -1 "$RUNNER_TEMP/mpw-scoped-import-error-path")
            case "$p" in "$RUNNER_TEMP"/mpw-scoped-import-*) rm -f -- "$p" ;; esac
            rm -f -- "$RUNNER_TEMP/mpw-scoped-import-error-path"
          fi
