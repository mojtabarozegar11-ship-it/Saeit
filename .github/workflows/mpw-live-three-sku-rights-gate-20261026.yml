name: MojPlayWin live paid SKU rights and private file safety gate
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-live-three-sku-rights-gate-20261026.yml"]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-live-three-sku-rights-audit-only
  cancel-in-progress: true
jobs:
  rights-and-deliverability-audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Search private factory evidence for exact live product hashes (read only)
        shell: bash
        run: |
          set -euo pipefail
          hashes="$(timeout 55s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import hashlib,os,sys
          from pathlib import Path
          from types import SimpleNamespace
          root=Path("/home/zomorod2/Saeit-staging")
          os.chdir(root);sys.path.insert(0,str(root))
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from core.models import Product
          from mpw_commerce.downloads import _private_file
          values=[]
          for sku in (72,225,879):
            product=Product.objects.get(pk=sku)
            asset=_private_file(SimpleNamespace(product=product))
            if asset.is_symlink() or not asset.is_file():raise RuntimeError("UNSAFE_PRODUCT_FILE")
            digest=hashlib.sha256()
            with asset.open("rb") as stream:
              for chunk in iter(lambda:stream.read(1048576),b""):digest.update(chunk)
            values.append(digest.hexdigest())
          print(" ".join(values))
          PY
          )"
          read -r sha72 sha225 sha879 <<< "$hashes"
          for value in "$sha72" "$sha225" "$sha879"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || exit 8
          done
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-vps python3 - "$sha72" "$sha225" "$sha879" <<'PY'
          import json,os,sys
          from pathlib import Path
          sha={72:sys.argv[1],225:sys.argv[2],879:sys.argv[3]}
          base=Path("/home/githubops/factory-runtime/private/autonomous-product-cycle")
          roots=[base/"quality-reviewer-console",base/"product-lifecycle",
                 base/"production-warehouse"]
          counts={sku:0 for sku in sha}
          eligible_files=0
          for root in roots:
            if not root.is_dir() or root.is_symlink():continue
            for directory,dirs,files in os.walk(str(root),followlinks=False):
              dirs[:]=[name for name in dirs if not (Path(directory)/name).is_symlink()]
              for name in files:
                path=Path(directory)/name
                if path.suffix.lower() not in (".json",".md",".txt"):continue
                try:
                  if path.is_symlink() or not path.is_file() or path.stat().st_size>2000000:continue
                  with path.open("rb") as stream:contents=stream.read(2000001).lower()
                except (OSError,PermissionError):continue
                eligible_files+=1
                for sku,digest in sha.items():
                  if digest.encode("ascii") in contents:counts[sku]+=1
                if eligible_files>12000:raise RuntimeError("PRIVATE_EVIDENCE_SCAN_LIMIT")
          print("MPW_PRIVATE_RIGHTS_PROVENANCE_SCAN="+json.dumps({
            "read_only":True,"scanned_eligible_documents":eligible_files,
            "exact_artifact_hash_reference_counts":counts,
            "matches_are_not_independent_legal_clearance":True
          },sort_keys=True))
          PY
      - name: Diagnose live TRX invoice routing and expiry without reading buyer details
        shell: bash
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json
          from pathlib import Path
          from collections import Counter
          root=Path("/home/zomorod2/Saeit-staging")
          os.chdir(root);sys.path.insert(0,str(root))
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.urls import resolve,Resolver404
          from django.utils import timezone
          from core.models import PaymentIntent
          from services.mpw_walletless_commercial_intent import PROVIDER,WAITING,_decode
          routes={}
          for route in ("/commerce/trx-easy/invoice/1/",
                        "/commerce/trx-easy/purchases/",
                        "/commerce/trx-easy/start/72/",
                        "/commerce/trx-easy/status/1/"):
            try:
              view=resolve(route).func
              routes[route]={"resolves":True,"module":view.__module__,
                             "function":getattr(view,"__name__","wrapped")}
            except Resolver404:
              routes[route]={"resolves":False}
          statuses=Counter()
          unexpired=0
          decode_failed=0
          for intent in PaymentIntent.objects.filter(provider=PROVIDER).order_by("-pk")[:100]:
            statuses[str(intent.status)]+=1
            if intent.status==WAITING:
              try:
                if _decode(intent).expires_at>timezone.now():unexpired+=1
              except Exception:decode_failed+=1
          print("MPW_LIVE_INVOICE_DIAG="+json.dumps({
            "read_only":True,"routes":routes,"recent_intent_status_counts":dict(statuses),
            "recent_pending_unexpired":unexpired,"recent_pending_decode_failed":decode_failed,
            "no_customer_identifiers_disclosed":True,"no_invoice_created":True},sort_keys=True))
          PY
      - name: Check all three publicly listed products without changing checkout or customer data
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,importlib,hashlib
          from pathlib import Path
          root=Path("/home/zomorod2/Saeit-staging")
          os.chdir(root)
          sys.path.insert(0,str(root))
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.conf import settings
          from core.models import Product
          from mpw_commerce.buyer_orders import _eligible
          from mpw_commerce.downloads import _private_file
          from types import SimpleNamespace
          try:
            from services.mpw_trx_commercial_context import rights_cleared_for_sale
          except (ImportError,AttributeError):
            rights_cleared_for_sale=None
          try:
            from services.mpw_walletless_commercial_intent import public_release_authorized
            release_authorized=public_release_authorized(settings) is True
          except (ImportError,AttributeError):
            release_authorized=False
          print("MPW_PUBLIC_TRX_FLAGS="+json.dumps({
            "public_enabled":getattr(settings,"MPW_WALLETLESS_TRX_PUBLIC_ENABLED",False) is True,
            "release_authorized":release_authorized,
            "merchant_canary":getattr(settings,"MPW_WALLETLESS_TRX_MERCHANT_CANARY_PASSED",False) is True,
            "rights_gate_installed":rights_cleared_for_sale is not None,
          },sort_keys=True))
          sale_ready=0
          blocked=[]
          for sku in (72,225,879):
            product=Product.objects.filter(pk=sku).first()
            if product is None:
              record={"id":sku,"exists":False,"is_sellable":False}
              blocked.append(sku)
            else:
              metadata=product.metadata
              fields=metadata if type(metadata) is dict else {}
              rights_keys=sorted(k for k in fields if type(k) is str and any(
                word in k.lower() for word in ("right","licen","author","source","approv","sha256","provenance")))
              rights_reference_keys=[k for k in rights_keys if type(fields.get(k)) is str and
                                    len(fields[k].strip())>0]
              stored_rights=fields.get("rights_cleared") is True
              rights=(rights_cleared_for_sale(product) is True) if rights_cleared_for_sale else False
              artifact_sha=None
              try:
                asset=_private_file(SimpleNamespace(product=product))
                file_ready=asset.is_file() and not asset.is_symlink() and asset.stat().st_size>0
                if file_ready:
                  digest=hashlib.sha256()
                  with asset.open("rb") as stream:
                    for chunk in iter(lambda:stream.read(1048576),b""):
                      digest.update(chunk)
                  artifact_sha=digest.hexdigest()
              except Exception:
                file_ready=False
              eligible=bool(_eligible(product))
              is_sellable=(eligible and rights and file_ready
                  and getattr(settings,"MPW_WALLETLESS_TRX_PUBLIC_ENABLED",False) is True
                  and release_authorized)
              record={"id":sku,"exists":True,"active":product.active is True,
                 "eligible":eligible,"stored_rights":stored_rights,"runtime_rights_gate_present":rights_cleared_for_sale is not None,"explicit_rights":rights,"private_file_ready":file_ready,
                 "is_sellable":is_sellable,
                 "rights_metadata_keys":rights_keys[:40],
                 "rights_reference_keys":rights_reference_keys[:40],
                 "asset_sha256_prefix":artifact_sha[:16] if artifact_sha else None,
                 "rights_hash_reference_matches_asset":bool(artifact_sha and
                    any(fields.get(key)==artifact_sha for key in
                    ("rights_asset_sha256","rights_artifact_sha256","rights_file_sha256","approved_artifact_sha256"))),
                 "existing_catalog_hash_matches_asset":[key for key in
                    ("asset_sha256","final_pdf_sha256","pdf_sha256","sha256")
                    if artifact_sha and type(fields.get(key)) is str
                    and fields[key].lower()==artifact_sha],
                 "existing_approval_flags":{key:fields.get(key) is True for key in
                    ("license_verified","quality_approved","publication_approved")},
                 "has_product_rights_review_status":bool(fields.get("rights_review_status")),
                 "has_owner_registration_approval":bool(fields.get("owner_approved_inactive_registration"))};
              if not is_sellable:blocked.append(sku)
              else:sale_ready+=1
            print("MPW_PUBLIC_SKU_RIGHTS="+json.dumps(record,sort_keys=True))
          print("MPW_PAID_SKUS_PASS="+str(sale_ready)+"/3")
          print("MPW_PAID_SKUS_BLOCKED="+json.dumps(blocked))
          print("CHECK_READONLY=TRUE; ORDERS_MODIFIED=0; LICENSE_APPROVALS_CHANGED=0")
          if blocked:sys.exit(3)
          PY
      - name: Delete runner-only SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
