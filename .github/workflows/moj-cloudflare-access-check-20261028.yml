name: Moj messaging Cloudflare access presence check
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths: [.github/workflows/moj-cloudflare-access-check-20261028.yml]
permissions:
  contents: read
jobs:
  cloudflare-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALIAS: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Print presence only, never secret values
        shell: bash
        run: |
          set +x
          if [ -n "$CF_TOKEN" ] || [ -n "$CF_TOKEN_ALIAS" ]; then
            echo "cloudflare_api_token_present=yes"
          else
            echo "cloudflare_api_token_present=no"
          fi
          if [ -n "$CF_ACCOUNT" ] || [ -n "$CF_ACCOUNT_VAR" ]; then
            echo "cloudflare_account_id_present=yes"
          else
            echo "cloudflare_account_id_present=no"
          fi
          echo "no_mutations_performed=true"
