name: ComfyUI Loopback and SSH Readonly Check
on:
  push:
    branches: [audit/vps-comfyui-hardware-20261014]
    paths: [.github/workflows/comfyui-loopback-ssh-audit.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify isolated API port and VPS factory status
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/probe"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 50s ssh -i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "COMFY_HOST=$(hostname)"
          if command -v ss >/dev/null 2>&1; then
            if ss -lntH '( sport = :18188 )' | grep -q .; then echo COMFY_PORT_18188_LISTENING; else echo COMFY_PORT_18188_CLOSED; fi
          else
            if curl -fsS --max-time 2 http://127.0.0.1:18188/system_stats >/dev/null 2>&1; then echo COMFY_ENDPOINT_REACHABLE; else echo COMFY_ENDPOINT_NOT_REACHABLE; fi
          fi
          if test -f "$HOME/factory-runtime/operations/vps-only-loop.pid"; then
            p="$(cat "$HOME/factory-runtime/operations/vps-only-loop.pid")"
            if [[ "$p" =~ ^[0-9]+$ ]] && kill -0 "$p" 2>/dev/null; then echo FACTORY_LOOP_ALIVE; else echo FACTORY_LOOP_NOT_VERIFIED; fi
          else echo FACTORY_PIDFILE_MISSING; fi
          test -x "$HOME/comfyui-isolated/env-cpu/bin/python" && echo COMFY_VENV_PRESENT
          command -v sshd >/dev/null && echo SSHD_BINARY_PRESENT || true
          free -m | awk '/^Mem:/{print "RAM_AVAILABLE_MB="$7}'
          echo COMFY_READONLY_AUDIT_COMPLETE
          REMOTE
