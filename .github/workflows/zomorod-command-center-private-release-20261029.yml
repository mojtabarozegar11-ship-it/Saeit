name: Zomorod owner command center guarded private release
on:
  push:
    branches: [feature/zomorod-business-command-center-v1-20261029]
    paths: [".github/workflows/zomorod-command-center-private-release-20261029.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-company-private-command-center-release
  cancel-in-progress: false
jobs:
  guarded-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring
      - name: Test control plane using isolated synthetic accounting data
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          php -l content/zomorod-business/command_center.php
          php -l content/zomorod-business/app.php
          php scripts/zomorod_command_center_synthetic_qa.php
      - name: Connect through pinned VPS to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_PRIVATE_RELAY=verified"

      - name: Preflight current private PHP and snapshot original before any update
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          p="$HOME/.private/zomorod-business"
          backup="$HOME/.backups/zomorod-business-command-center/$1-$2"
          fail(){ echo "COMMAND_CENTER_PREFLIGHT_BLOCK=$1";exit 30; }
          test -d "$p" && test ! -L "$p" || fail private_dir_missing
          test -f "$p/app.php" && test ! -L "$p/app.php" || fail app_missing
          test -f "$p/insights.php" && test ! -L "$p/insights.php" || fail insights_missing
          test -f "$p/management.sqlite3" && test ! -L "$p/management.sqlite3" || fail ledger_missing
          test ! -e "$p/command_center.php" || fail module_already_exists
          test ! -e "$p/command-center.sqlite3" || fail_control_database_already_exists
          test ! -e "$backup" || fail_duplicate_backup
          phpbin="$(command -v php || true)"
          if test -z "$phpbin"; then phpbin="/opt/cpanel/ea-php82/root/usr/bin/php"; fi
          "$phpbin" -l "$p/app.php" >/dev/null || fail current_php_bad
          python3 - "$p/app.php" <<'PY'
          import pathlib,sys
          code=pathlib.Path(sys.argv[1]).read_bytes()
          anchors=[
            "if(is_file($private.'/site_store.php')) require_once $private.'/site_store.php';",
            "'insights'=>'گزارش مدیریتی','accounts'",
            "        } elseif($action==='user'){",
            "    } elseif($page==='agent_center'){",
          ]
          if any(code.count(a.encode())!=1 for a in anchors) or b"command_center.php" in code:
              raise SystemExit("COMMAND_CENTER_PREFLIGHT=REFUSED_CHANGED_LIVE_CODE")
          print("COMMAND_CENTER_PREFLIGHT=PASS")
          PY
          mkdir -p "$(dirname "$backup")"
          mkdir -m 700 "$backup"
          cp -p "$p/app.php" "$backup/app.php.before"
          chmod 600 "$backup/app.php.before"
          sha256sum "$HOME/public_html/index.html" "$HOME/public_html/.htaccess" > "$backup/public-checksums.sha256"
          for site in company amozeshgah ghanadi about; do
            if test -f "$HOME/public_html/$site/index.html";then
              sha256sum "$HOME/public_html/$site/index.html" >> "$backup/public-checksums.sha256"
            fi
          done
          REMOTE
          backup="/home/zomorod2/.backups/zomorod-business-command-center/$GITHUB_SHA-$GITHUB_RUN_ID"
          tar -cf - -C content/zomorod-business command_center.php |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C '$backup'"
      - name: Surgical private app integration with rollback and unauthenticated guard
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          p="$HOME/.private/zomorod-business"
          backup="$HOME/.backups/zomorod-business-command-center/$1-$2"
          phpbin="$(command -v php || true)"
          if test -z "$phpbin";then phpbin="/opt/cpanel/ea-php82/root/usr/bin/php";fi
          test -f "$backup/app.php.before" && test -f "$backup/command_center.php"
          "$phpbin" -l "$backup/command_center.php"
          python3 - "$backup/app.php.before" "$backup/app.php.candidate" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_bytes()
          patches=[
            ("if(is_file($private.'/site_store.php')) require_once $private.'/site_store.php';",
             "if(is_file($private.'/site_store.php')) require_once $private.'/site_store.php';\n"
             "if(is_file($private.'/command_center.php')) require_once $private.'/command_center.php';"),
            ("'insights'=>'گزارش مدیریتی','accounts'",
             "'insights'=>'گزارش مدیریتی','command_center'=>'مرکز فرمان هوشمند','accounts'"),
            ("        } elseif($action==='user'){",
             "        } elseif(in_array($action,['cc_create','cc_scan','cc_transition'],true)){\n"
             "            if(!function_exists('zmCcHandle')) bail('مرکز فرمان در دسترس نیست.',503);\n"
             "            zmCcHandle($db,zmCcDb($private),$action);\n"
             "        } elseif($action==='user'){"),
            ("    } elseif($page==='agent_center'){",
             "    } elseif($page==='command_center'){\n"
             "        authorize('users');\n"
             "        if(!function_exists('zmCcRender')) bail('مرکز فرمان در دسترس نیست.',503);\n"
             "        zmCcRender(zmCcDb($private));\n"
             "    } elseif($page==='agent_center'){"),
          ]
          if b"command_center.php" in src: raise SystemExit("COMMAND_CENTER_PATCH=ALREADY_INSTALLED")
          for old,new in patches:
              start=old.encode();change=new.encode()
              if src.count(start)!=1:raise SystemExit("COMMAND_CENTER_PATCH=ANCHOR_CHANGED")
              src=src.replace(start,change)
              if src.count(change)!=1:raise SystemExit("COMMAND_CENTER_PATCH=INCORRECT")
          pathlib.Path(sys.argv[2]).write_bytes(src)
          PY
          chmod 600 "$backup/app.php.candidate"
          "$phpbin" -l "$backup/app.php.candidate"
          install -m 600 "$backup/command_center.php" "$p/command_center.php.next-$sha"
          install -m 600 "$backup/app.php.candidate" "$p/app.php.next-$sha"
          module=0;swapped=0
          rollback(){
            if test "$swapped" = 1; then
              cp -p "$backup/app.php.before" "$p/app.php.rollback-$sha"
              mv -f "$p/app.php.rollback-$sha" "$p/app.php"
            fi
            if test "$module" = 1; then rm -f "$p/command_center.php";fi
            rm -f "$p/command_center.php.next-$sha" "$p/app.php.next-$sha"
            echo "COMMAND_CENTER_ROLLBACK=APPLIED"
          }
          finish(){ rc=$?;trap - EXIT;if test "$rc" -ne 0;then rollback;fi;exit "$rc"; }
          trap finish EXIT
          mv -f "$p/command_center.php.next-$sha" "$p/command_center.php";module=1
          mv -f "$p/app.php.next-$sha" "$p/app.php";swapped=1
          "$phpbin" -l "$p/app.php"
          "$phpbin" -l "$p/command_center.php"
          cmp -s "$p/command_center.php" "$backup/command_center.php"
          status="$(curl -sS -L --max-time 30 -o "$backup/unauthenticated.html" -w '%{http_code}' "https://zomorodmelal.ir/business/?page=command_center&check=$sha")"
          test "$status" = 200
          grep -Fq "ورود مدیر و حسابدار" "$backup/unauthenticated.html"
          ! grep -Fq "صف وظایف ماندگار" "$backup/unauthenticated.html"
          sha256sum -c --status "$backup/public-checksums.sha256"
          trap - EXIT
          echo "OWNER_COMMAND_CENTER=DEPLOY_SUCCESS"
          echo "PUBLIC_WEBSITE=UNCHANGED"
          echo "LEDGER_DATABASE=UNCHANGED"
          echo "EXTERNAL_EXECUTION=DISABLED"
          echo "RECURRING_SCHEDULE=NOT_CREATED"
          REMOTE
      - name: Clear runner relay material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-business-tokenless"
