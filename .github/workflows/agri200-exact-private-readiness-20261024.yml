name: AGRI200 exact private marketplace lineage and no fake sale
on:
  pull_request:
    paths:
      - scripts/agri200_exact_private_readiness_20261024.py
      - tests/test_agri200_exact_private_readiness_20261024.py
      - .github/workflows/agri200-exact-private-readiness-20261024.yml
      - docs/agri200_p0_catalog.tsv
      - scripts/agri200_fair_pricing_owner_only_20261024.py
      - scripts/agri200_customer_store_allocation_20261024.py
      - scripts/factory_agri200_p0_intake.py
  push:
    branches: [main]
    paths:
      - scripts/agri200_exact_private_readiness_20261024.py
      - tests/test_agri200_exact_private_readiness_20261024.py
      - .github/workflows/agri200-exact-private-readiness-20261024.yml
      - docs/agri200_p0_catalog.tsv
permissions: {contents: read}
jobs:
  fail-closed-private-sku-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify all 200 exact catalog/order mappings and block fabricated sales
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_agri200_exact_private_readiness_20261024.py -v
          python3 -B -m unittest discover -s tests -p test_agri200_fair_price_policy_20261024.py -v
          python3 -B -m unittest discover -s tests -p test_agri200_customer_store_allocation_20261024.py -v
      - name: Validate standalone CLI syntax
        run: python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("scripts/agri200_exact_private_readiness_20261024.py").read_text(encoding="utf-8"))'
