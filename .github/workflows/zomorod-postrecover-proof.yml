name: Zomorod Django stable recovery proof
on:
  push:
    branches: [diagnostic/zomorod-503-readonly-20261015]
    paths: [.github/workflows/zomorod-postrecover-proof.yml]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-restore"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Check Passenger registered state without editing
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-restore/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          uapi --output=json PassengerApps list_applications | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          a=(d.get("result",{}).get("data") or {}).get("saeit-django") or {}
          print("PASSENGER_ENABLED="+str(a.get("enabled")))
          print("PASSENGER_DOMAIN="+str(a.get("domain")))
          print("PASSENGER_PYTHON="+str(a.get("python")))
          if str(a.get("enabled")) not in ("1","True"): raise SystemExit("PASSENGER_NOT_RESTORED")
          '
          REMOTE
      - name: Identify the short 200 response without credentials (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for p in /admin/login/ /admin/ /services/ /agriculture/; do
            f="$(mktemp)"
            h="$(mktemp)"
            code=$(curl -L --silent --show-error --max-time 18 -D "$h" -o "$f" -w '%{http_code}' "https://zomorodmelal.ir$p?diag_content=20261015" || true)
            printf 'ROUTE=%s HTTP=%s BYTES=%s\n' "$p" "$code" "$(wc -c < "$f")"
            grep -Ei '^(HTTP/|content-type:|content-length:|server:|x-powered-by:)' "$h" | tail -n 8 || true
            python3 - "$f" <<'PY'
          import sys
          b=open(sys.argv[1],'rb').read(160)
          print("BODY_PREFIX_REPR="+repr(b.decode('utf-8','replace')))
          PY
            rm -f "$f" "$h"
          done
      - name: Recheck Django login, root and academy repeatedly
        shell: bash
        run: |
          set -euo pipefail
          testdir="$(mktemp -d)"
          trap 'rm -rf "$testdir"' EXIT
          for n in 1 2 3; do
            for p in / /amozeshgah/ /admin/login/; do
              name=$(printf '%s' "$p" | tr '/' '_')
              output="$testdir/${n}${name}.html"
              code=$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -o "$output" -w '%{http_code}' "https://zomorodmelal.ir$p?recover_proof=$n" || true)
              size=$(wc -c < "$output")
              printf 'PROBE=%s PATH=%s HTTP=%s BYTES=%s\n' "$n" "$p" "$code" "$size"
              test "$code" = 200 || exit 1
              test "$size" -ge 200 || exit 1
              if [ "$p" = /admin/login/ ]; then
                if grep -Eqi '(csrfmiddlewaretoken|name="username"|name=.username.|login-form)' "$output" && ! grep -iq '503 Service Unavailable' "$output"; then
                  echo "DJANGO_ADMIN_LOGIN_FORM_CONFIRMED=$n"
                else
                  echo "DJANGO_ADMIN_LOGIN_FORM_NOT_CONFIRMED=$n"
                  exit 1
                fi
              fi
            done
            sleep 4
          done
          echo "ALL_PRODUCTION_ROUTE_PROOFS=passed"
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-restore"
