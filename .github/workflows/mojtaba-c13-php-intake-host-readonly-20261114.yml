name: C13-C15 PHP intake and DB provenance audit, no customer data
on:
  push:
    branches:
      - feature/mojtaba-bot-lead-source-of-truth-c04-20261114
    paths:
      - deploy/company_live_intake_readonly.py
      - deploy/company_c14_php_flow_readonly.py
      - deploy/company_c14_php_db_metadata_readonly.py
      - deploy/company_c15_form_data_lineage_readonly.py
      - deploy/company_c15_public_ticket_tracking_readonly.py
      - deploy/company_static_service_preflight.py
      - deploy/company_services_public_index_readonly.py
      - scripts/build_company_service_static_c13.py
      - deploy/company_public_service_live_check.py
      - tests/test_company_public_service_live_check_c13_20261114.py
      - .github/workflows/mojtaba-c13-php-intake-host-readonly-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojtaba-c13-cpanel-intake-audit
  cancel-in-progress: false
jobs:
  inspect:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojtaba-bot-lead-source-of-truth-c04-20261114' }}"
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Checkout exact source without git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and confirm read-only host auditor
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("deploy/company_live_intake_readonly.py").read_text(encoding="utf-8")); print("AUDITOR_PARSE=PASS")'
          if grep -Eq '(^|[^a-zA-Z])(unlink|subprocess|os.system|requests.post|urlopen|sqlite3.connect|open\(.*[wa])' deploy/company_live_intake_readonly.py; then
            echo "AUDITOR_ALLOWLIST_REVIEW_REQUIRED"
            exit 2
          fi
      - name: Verify public service page check logic without network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_company_public_service_live_check_c13_20261114.py' -q
      - name: Build six canonical static buyer pages from the existing single source catalogue
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/build_company_service_static_c13.py
          test "$(find build/company-scope-static -name index.html -type f | wc -l)" -eq 6
          test ! -L build/company-scope-static
          echo "STATIC_SIX_BUYER_PAGES_BUILT=true"
      - name: Independent GET visibility of all six commercial URLs
        shell: bash
        timeout-minutes: 2
        continue-on-error: true
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/company_public_service_live_check.py
      - name: Real public GET distinction between inquiry and status tracking
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("deploy/company_c15_public_ticket_tracking_readonly.py").read_text("utf-8"))'
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/company_c15_public_ticket_tracking_readonly.py
      - name: Verify pinned cPanel host and stream read-only inspection via stdin
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$HOST_KEY"
          d="${RUNNER_TEMP}/c13-php-origin-${GITHUB_RUN_ID}"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 178.239.147.125 > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          echo "CPANEL_FINGERPRINT=verified"
          expected_scope="$(sha256sum core/service_scope_pages.py | awk '{print $1}')"
          if [[ ! "$expected_scope" =~ ^[0-9a-f]{64}$ ]]; then exit 66; fi
          timeout 75s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 "ZM_EXPECTED_SERVICE_SCOPE_SHA256=$expected_scope PYTHONDONTWRITEBYTECODE=1 python3 -B -" < deploy/company_live_intake_readonly.py
          timeout 25s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 'if php -l "$HOME/public_html/ask-master/index.php" >/dev/null 2>&1; then echo "ZM_PHP_ENTRY_LINT=pass"; else echo "ZM_PHP_ENTRY_LINT=fail"; fi'
          echo "PHP_ORIGIN_READONLY_AUDIT=completed"
          echo "ZM_PHP_PRODUCTION_SOURCE_AUDIT=done"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("deploy/company_c14_php_flow_readonly.py").read_text("utf-8"))'
          timeout 75s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' < deploy/company_c14_php_flow_readonly.py
          echo "ZM_C14_PHP_FLOW_AUDIT_READ_ONLY=complete"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("deploy/company_c14_php_db_metadata_readonly.py").read_text("utf-8"))'
          timeout 75s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' < deploy/company_c14_php_db_metadata_readonly.py
          echo "ZM_C14_PHP_SQLITE_METADATA_AUDIT=complete"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -c 'import ast,pathlib;ast.parse(pathlib.Path("deploy/company_c15_form_data_lineage_readonly.py").read_text("utf-8"))'
          timeout 75s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' < deploy/company_c15_form_data_lineage_readonly.py
          echo "ZM_C15_PHP_DB_LINEAGE_READONLY=complete"
      - name: Read-only actual services-index source after six-page publication
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$HOST_KEY"
          d="${RUNNER_TEMP}/c13-static-preflight-${GITHUB_RUN_ID}"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 178.239.147.125 > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 60s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' < deploy/company_services_public_index_readonly.py

