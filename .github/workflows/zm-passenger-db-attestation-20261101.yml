name: Zomorod Passenger DB read-only identity attestation
on:
  push:
    branches: [audit/zm-passenger-db-attestation-20261101]
    paths: [.github/workflows/zm-passenger-db-attestation-20261101.yml]
permissions:
  contents: read
concurrency:
  group: zm-passenger-db-readonly-20261101
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Inspect replayed Passenger DB and real workers without reading private values
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 105s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export PYTHONDONTWRITEBYTECODE=1
          /home/zomorod2/virtualenv/Saeit/3.10/bin/python -B - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import os,sys,sqlite3
          home=Path.home()
          assert home==Path("/home/zomorod2")
          app=home/"Saeit"
          assert app.is_dir() and not app.is_symlink()
          assert (app/"passenger_wsgi.py").is_file()
          os.chdir(app)
          sys.path.insert(0,str(app))
          env_file=app/".env"
          assert not env_file.is_symlink()
          env_lines=env_file.read_text(errors="replace").splitlines() if env_file.is_file() else []
          has_env_db=any(s.strip().startswith("DATABASE_URL=") for s in env_lines if not s.lstrip().startswith("#"))
          print("ZM_ROOT_DOTENV_DB_URL_PRESENT="+str(has_env_db).lower())
          print("ZM_INSPECTION_SHELL_DB_URL_PRESENT="+str("DATABASE_URL" in os.environ).lower())
          import passenger_wsgi
          from django.conf import settings
          db=settings.DATABASES["default"]
          engine=str(db.get("ENGINE","")).rsplit(".",1)[-1]
          print("ZM_REPLAYED_DJANGO_DB_ENGINE="+engine)
          print("ZM_REPLAYED_DB_URL_PRESENT="+str(bool(os.environ.get("DATABASE_URL"))).lower())
          if engine=="sqlite3":
              name=str(db.get("NAME",""))
              assert name and name!=":memory:"
              p=Path(name)
              if not p.is_absolute():p=app/p
              within=p.resolve().is_relative_to(app.resolve())
              print("ZM_REPLAYED_DB_WITHIN_APP="+str(within).lower())
              if within and p.is_file() and not p.is_symlink():
                  before=p.stat()
                  print("ZM_REPLAYED_DB_PRESENT=true")
                  print("ZM_REPLAYED_DB_NONEMPTY="+str(before.st_size>0).lower())
                  if before.st_size:
                      try:
                          uri="file:"+quote(str(p),safe="/")+"?mode=ro&immutable=1"
                          with sqlite3.connect(uri,uri=True,timeout=4) as conn:
                              conn.execute("PRAGMA query_only=ON")
                              check=conn.execute("PRAGMA quick_check").fetchone()[0]
                              n=conn.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
                          print("ZM_REPLAYED_DB_INTEGRITY="+("ok" if check=="ok" else "bad"))
                          print("ZM_REPLAYED_DB_HAS_TABLES="+str(n>0).lower())
                      except sqlite3.Error:
                          print("ZM_REPLAYED_DB_INTEGRITY=unavailable")
                  else: print("ZM_REPLAYED_DB_INTEGRITY=empty")
                  after=p.stat()
                  assert before.st_size==after.st_size and before.st_mtime_ns==after.st_mtime_ns
              else: print("ZM_REPLAYED_DB_PRESENT=false")
          private=home/".private/zomorod-business/management.sqlite3"
          if private.is_file() and not private.is_symlink():
              before=private.stat()
              print("ZM_PRIVATE_BUSINESS_DB_PRESENT=true")
              print("ZM_PRIVATE_BUSINESS_DB_NONEMPTY="+str(before.st_size>0).lower())
              if 80000<=before.st_size<200000000:
                  uri="file:"+quote(str(private),safe="/")+"?mode=ro&immutable=1"
                  try:
                      with sqlite3.connect(uri,uri=True,timeout=5) as conn:
                          conn.execute("PRAGMA query_only=ON")
                          check=conn.execute("PRAGMA quick_check").fetchone()[0]
                          names={x[0] for x in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      print("ZM_PRIVATE_BUSINESS_DB_INTEGRITY="+("ok" if check=="ok" else "bad"))
                      print("ZM_PRIVATE_BUSINESS_DB_SCHEMA="+str({"users","journal_entries","journal_lines","invoices"}<=names).lower())
                  except sqlite3.Error:
                      print("ZM_PRIVATE_BUSINESS_DB_INTEGRITY=unavailable")
              after=private.stat()
              assert before.st_size==after.st_size and before.st_mtime_ns==after.st_mtime_ns
          else: print("ZM_PRIVATE_BUSINESS_DB_PRESENT=false")
          # Process metadata only: never print PIDs, environment values or secrets.
          worker_count=0
          env_count=0
          app_uid=app.stat().st_uid
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():continue
              try:
                  if proc.stat().st_uid!=app_uid:continue
                  if os.readlink(proc/"cwd").rstrip("/")!=str(app):continue
                  worker_count+=1
                  if any(x.startswith(b"DATABASE_URL=") for x in (proc/"environ").read_bytes().split(b"\0")):
                      env_count+=1
              except (PermissionError,FileNotFoundError,ProcessLookupError,OSError):
                  pass
          print("ZM_LIVE_CWD_WORKERS="+str(worker_count))
          print("ZM_LIVE_WORKERS_WITH_DATABASE_URL="+str(env_count))
          print("ZM_EFFECTIVE_WORKER_DATABASE=not_proven_by_replay")
          print("ZM_PASSENGER_PROBE_READONLY=complete")
          PY
          REMOTE
      - name: Verify Zomorod public routes through the already pinned hosting endpoint
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          for p in "/" "/agents/"; do
            # CI's public DNS resolver may be unavailable. Pin the verified
            # cPanel IP while retaining hostname/SNI and normal TLS checks.
            code="$(curl -sS --connect-timeout 8 --max-time 16 --resolve zomorodmelal.ir:443:178.239.147.125 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$p" || true)"
            if test "$code" != 200; then
              code="$(timeout 32s ssh -F "$d/config" "$COMMAND_HOST" "curl -sS --connect-timeout 8 --max-time 16 -o /dev/null -w '%{http_code}' 'https://zomorodmelal.ir$p'" || true)"
            fi
            echo "ZM_PINNED_PUBLIC_HEALTH=$p:$code"
            test "$code" = 200
          done
      - name: Clear temporary credentials on GitHub runner only
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
