name: Publish personal enterprise collaboration brief
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: personal-v17-enterprise-collaboration-brief-20261016
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: Publish Mojtaba enterprise collaboration briefing and inquiry 2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate six smart-web collaboration offers and zero form changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_enterprise_collaboration_inquiry.py
          python3 -m unittest discover -s tests -p test_mojtaba_enterprise_collaboration_inquiry.py -v
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Transfer only existing article manifests and one scoped personal template installer
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-collab-brief-$GITHUB_RUN_ID"
          tar -czf "$RUNNER_TEMP/collab-brief.tgz" scripts/mojtaba_enterprise_collaboration_inquiry.py scripts/mojtaba_twenty_photo_essays_safe_publish.py content/mojtaba_twenty_photo_essays_*.json content/mojtaba_seven_full_independent_journal_20261016.json content/mojtaba_six_advanced_journal_articles_20261016.json content/mojtaba_ten_advanced_website_engineering_20261016.json content/mojtaba_vancouver_collab_part_*.json content/mojtaba_vancouver_enterprise_web_part_*.json content/mojtaba_vancouver_enterprise_web_series2_part_*.json
          timeout 30s ssh -F "$SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 120s scp -F "$SSH_CONFIG" "$RUNNER_TEMP/collab-brief.tgz" "saeit-host:$stage/source.tgz"
      - name: Back up and publish six offers then verify live contact, 93 articles and image archive
        shell: bash
        run: |
          set -euo pipefail
          timeout 760s ssh -F "$SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          umask 077
          id="$1"
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          stage="/home/zomorod2/.mpw-collab-brief-$id"
          script="$stage/scripts/mojtaba_enterprise_collaboration_inquiry.py"
          python="$app/../.venv_personal_test/bin/python"
          backup="$HOME/.backups/mojtaba-collaboration-inquiry/$id"
          installed=0
          finished=0
          guard() {
            exit_code=$?
            trap - EXIT
            if test "$installed" = 1 && test "$finished" = 0 && test -f "$backup/manifest.json"; then
              "$python" "$script" rollback --app "$app" --backup "$backup" && echo "COLLAB_INQUIRY_AUTO_ROLLBACK=success" || echo "COLLAB_INQUIRY_AUTO_ROLLBACK=manual_review_required"
            fi
            exit "$exit_code"
          }
          trap guard EXIT
          test ! -L "$app" && test -f "$app/manage.py" && test -x "$python"
          tar -tzf "$stage/source.tgz" > "$stage/archive-list.txt"
          grep -Fxq 'scripts/mojtaba_enterprise_collaboration_inquiry.py' "$stage/archive-list.txt"
          cd "$stage"
          tar -xzf source.tgz --no-same-owner
          "$python" "$script" check --app "$app" --content "$stage/content"
          cd "$app"
          "$python" "$script" install --app "$app" --content "$stage/content" --backup "$backup"
          installed=1
          "$python" manage.py check --deploy
          test ! -d "$app/tmp" || touch "$app/tmp/restart.txt"
          "$python" - "$stage" <<'PY_VERIFY'
          import importlib.util,os,sys,time
          from pathlib import Path
          from html import unescape
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django;django.setup()
          from core.models import Post
          stage=Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location("brief",stage/"scripts/mojtaba_enterprise_collaboration_inquiry.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          rows,old=mod.photo_rows(stage/"content")
          assert Post.objects.filter(slug__in=old,published=True).count()==73
          assert Post.objects.filter(slug__in=[r["slug"] for r in rows],published=True).count()==20
          print("COLLAB_INQUIRY_ALL_93_POSTS_DATABASE_INTACT=yes",flush=True)
          base="https://mojplaywin.com/mojtaba.roozegar/"
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__();self.src=[];self.a=[];self.b=[];self.forms=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="img":
                      src=d.get("src","")
                      if src:self.src.append(src)
                      if "owner_gallery_20261015_b/" in src:self.b.append(src)
                      elif "owner_gallery_20261015/" in src:self.a.append(src)
                  if tag in ("input","textarea","form"):
                      self.forms.append((tag,d))
          def verify(route,check):
              last=""
              for n in range(7):
                  try:
                      with urlopen(Request(base+route+"?collab_proof="+str(time.time_ns()),headers={"User-Agent":"MojtabaVerifiedCollaborationBrief/1"}),timeout=25) as res:
                          if res.status!=200:raise ValueError("Non-200 "+str(res.status))
                          body=res.read(5000000).decode("utf-8","replace")
                      check(body);return
                  except Exception as e:
                      last=str(e)
                      time.sleep(2)
              raise RuntimeError("PUBLIC_CHECK_FAILURE "+route+" "+last)
          for path in ("","blog/"):
              def index_ok(body):
                  if mod.MARK not in body:raise ValueError("Collaboration brief not rendered")
                  for word in ("Enterprise Web Discovery and Systems Architecture","Read-Only Industrial Information Dashboard","Website Modernization, CI/CD and Resilience"):
                      if word not in unescape(body):raise ValueError("Missing scoped offer "+word)
                  if mod.CONTACT not in body:raise ValueError("Contact link absent")
                  if 'id="mpw-photoessay-reading-guides-20261016"' not in body:raise ValueError("Older reading map changed")
                  p=Images();p.feed(body)
                  if sum("mojtaba_personal_image_essays_20261016/" in src for src in p.src)<20:
                      raise ValueError("Previous 20 picture cards missing")
              verify(path,index_ok)
              print("COLLAB_INQUIRY_LIVE_BRIEF="+(path or "home"),flush=True)
          def form_ok(body):
              p=Images();p.feed(body)
              names={d.get("name") for t,d in p.forms}
              if not {"name","email","subject","message","csrfmiddlewaretoken"}<=names:
                  raise ValueError("Original contact form fields or CSRF missing "+repr(names))
              if not any(t=="form" for t,d in p.forms):
                  raise ValueError("Existing contact form tag missing")
              for word in ("Your Name","Email Address","Subject","Your Message"):
                  if word not in unescape(body):raise ValueError("Previously checked English form labels missing")
          verify("contact/",form_ok)
          print("COLLAB_INQUIRY_EXISTING_CONTACT_FORM_AND_CSRF_PUBLIC_200=yes",flush=True)
          for row in rows:
              def new_ok(body,row=row):
                  if row["title"] not in unescape(body) or mod.DETAIL_MARK not in body or mod.CONTACT not in body:
                      raise ValueError("Article, relevant contact CTA or title missing")
                  p=Images();p.feed(body)
                  if not any(row["slug"] in x and "mojtaba_personal_image_essays_20261016/" in x for x in p.src):
                      raise ValueError("Original picture missing")
              verify("blog/"+row["slug"]+"/",new_ok)
              print("COLLAB_INQUIRY_PHOTO_ARTICLE_OK="+row["slug"],flush=True)
          for slug in old:
              def old_ok(body):
                  p=Images();p.feed(body)
                  if not p.src:raise ValueError("Old post image missing")
              verify("blog/"+slug+"/",old_ok)
          print("COLLAB_INQUIRY_ALL_73_OLDER_ARTICLES_STILL_PUBLIC=yes",flush=True)
          def gallery_ok(body):
              p=Images();p.feed(body)
              if len(p.a)!=10 or len(p.b)!=10:
                  raise ValueError("Existing owner gallery changed")
          verify("gallery/",gallery_ok)
          print("COLLAB_INQUIRY_ORIGINAL_20_GALLERY_IMAGES_PRESERVED=yes",flush=True)
          PY_VERIFY
          for site in "https://mojplaywin.com/" "https://zomorodmelal.ir/"; do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 24 "$site")"
            test "$code" = 200
            echo "COLLAB_INQUIRY_UNRELATED_SITE_HEALTHY=$site HTTP_200"
          done
          finished=1
          trap - EXIT
          echo "COLLAB_INQUIRY_PUBLIC_RELEASE_VERIFIED=yes"
          echo "COLLAB_INQUIRY_BACKUP_PATH=$backup"
          rm -rf "$stage"
          REMOTE
      - name: Remove short-lived SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/photo-relay"
