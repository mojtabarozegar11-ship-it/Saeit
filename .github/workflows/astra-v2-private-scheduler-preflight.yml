name: Astra V2 Private Scheduler Preflight

on:
  push:
    branches: [feature/astra-factory-v2-architecture-20261014]
    paths: [.github/workflows/astra-v2-private-scheduler-preflight.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only check of isolated VPS scheduler support
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          temp="$RUNNER_TEMP/astra-v2-timer-inspect"
          install -d -m 700 "$temp"
          trap 'rm -rf -- "$temp"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$temp/key"
          chmod 600 "$temp/key"
          ssh-keygen -y -P '' -f "$temp/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$temp/known" 2>/dev/null
          test "$(ssh-keygen -lf "$temp/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$temp/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          printf 'ASTRA_V2_SCHEDULER_USER=%s\n' "$(id -un)"
          if command -v crontab >/dev/null; then
            echo ASTRA_V2_CRON_COMMAND_AVAILABLE=true
            if crontab -l >/dev/null 2>&1; then
              echo ASTRA_V2_EXISTING_CRONTAB_READABLE=true
            else
              echo ASTRA_V2_EXISTING_CRONTAB_READABLE=false
            fi
          else
            echo ASTRA_V2_CRON_COMMAND_AVAILABLE=false
          fi
          test -f "$HOME/factory-runtime/operations/astra-v2-vps-canary-source/scripts/astra_v2_private_pipeline.py" && echo ASTRA_V2_PRIVATE_SOURCE_PRESENT=true
          test -f "$HOME/factory-runtime/private/astra-v2-canary-products/queue.sqlite3" && echo ASTRA_V2_PRIVATE_QUEUE_PRESENT=true
          command -v timeout >/dev/null && echo ASTRA_V2_TIMEOUT_AVAILABLE=true
          command -v flock >/dev/null && echo ASTRA_V2_FLOCK_AVAILABLE=true
          echo ASTRA_V2_PREFLIGHT_READ_ONLY=true
          REMOTE
