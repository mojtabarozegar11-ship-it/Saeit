name: Audit Zomorod live card structure read only 20261018
on:
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-glass-card-readonly-20261018.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read only live homepage card and row CSS analysis
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from html.parser import HTMLParser
          from urllib.request import urlopen,Request
          url='https://zomorodmelal.ir/?glass_cards_readonly=20261018'
          with urlopen(Request(url,headers={'User-Agent':'ZomorodGlassCardReadOnly/1','Cache-Control':'no-cache,no-store'}),timeout=30) as resp:
              raw=resp.read(5000000)
              assert resp.status==200 and len(raw)>1500000
              s=raw.decode('utf-8','replace')
          print('HTML_LENGTH=',len(s))
          print('FIXED_BG_STYLE=',s.count('id="zm-fixed-scientific-background-20261018"'))
          print('ORBIT_CARD_CONTAINERS=',s.count('id="orbital-cards"'))
          class P(HTMLParser):
              def __init__(self):
                  super().__init__();self.stack=[];self.cards=[];self.rows=[];self.class_names={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs);cl=a.get('class','')
                  if any(x in cl for x in ('card','row','rail','strip','orbital','carousel')):
                      if len(self.cards)<12 and ('card' in cl):
                          self.cards.append((tag,cl,a.get('id',''),'/'.join(self.stack[-5:])))
                      if len(self.rows)<30 and any(x in cl for x in ('row','rail','strip','carousel')):
                          self.rows.append((tag,cl,a.get('id',''),'/'.join(self.stack[-5:])))
                  for c in cl.split():self.class_names[c]=self.class_names.get(c,0)+1
                  if tag not in ('img','br','hr','meta','link','input','source','path','circle','rect','use'):
                      self.stack.append(tag+'.'+cl[:80])
              def handle_endtag(self,tag):
                  if self.stack:self.stack.pop()
          p=P();p.feed(s)
          print('CARD_SAMPLES=',p.cards)
          print('ROW_SAMPLES=',p.rows)
          print('CLASS_COUNTS_RELEVANT=',sorted(((k,v) for k,v in p.class_names.items() if any(q in k for q in ('card','row','rail','carousel','orbital','topic','detail','track'))),key=lambda x:-x[1])[:50])
          for css in ('topic-card','detail-card','orbital-cards','orbit-row','card-row','orbital-row','content .topic-card','solar-stage'):
              matches=re.findall(r'[^{}]{0,110}'+re.escape(css)+r'[^{}]{0,120}\{[^{}]{0,1200}\}',s,flags=re.I)
              print('CSS_'+css.replace(' ','_')+'_MATCHES=',len(matches))
              for m in matches[:8]:print('CSS_RULE=',re.sub(r'\s+',' ',m)[:850])
          print('ROOT_HIERARCHY_VALID=',all(k in s for k in ('id="solar-stage"','id="orbital-cards"','id="site-footer"','ZOMOROD_ORBIT_DATA')))
          print('CSS_ROW_OR_TRACK=',[
              re.sub(r'\\s+',' ',x)[:550] for x in re.findall(r'[^{}]{0,110}(?:\\.row|\\.track|\\.rail|\\.marquee|\\.lane|\\.belt|\\.strip|\\.topic-card::after)[^{}]{0,130}\\{[^{}]{0,700}\\}',s,flags=re.I)[:30]
          ])
          print('DYNAMIC_TOPIC_CARD_CONTEXT=',[
              re.sub(r'\\s+',' ',s[max(0,m.start()-300):m.end()+450])[:950] for m in list(re.finditer('topic-card',s))[-12:]
          ])
          print('DYNAMIC_ROW_CONTEXT=',[
              re.sub(r'\\s+',' ',s[max(0,m.start()-120):m.end()+380])[:650] for m in list(re.finditer('createElement.*row|row.*createElement|appendChild\\(.*row',s,flags=re.I))[-6:]
          ])
          PY
