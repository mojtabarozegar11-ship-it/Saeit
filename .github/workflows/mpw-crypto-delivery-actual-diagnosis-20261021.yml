name: MojPlayWin crypto automatic-delivery production diagnosis (read only)
on:
  push:
    branches: [main]
    paths:
      - scripts/mpw_delivery_runtime_evidence_readonly_20261021.py
      - scripts/mpw_crypto_prepurchase_engineering_audit_20261021.py
      - scripts/mpw_registration_csrf_readonly_audit_20261021.py
      - scripts/mpw_registration_csrf_public_probe_20261021.py
      - scripts/mpw_simulated_crypto_purchase_delivery_20261021.py
      - .github/workflows/mpw-crypto-delivery-actual-diagnosis-20261021.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile nonmutating automatic-delivery investigator
        run: python3 -m py_compile scripts/mpw_delivery_runtime_evidence_readonly_20261021.py
      - name: Reproduce empty mobile registration POST with secure and missing cookies on public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_registration_csrf_public_probe_20261021.py
          python3 scripts/mpw_registration_csrf_public_probe_20261021.py
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-delivery-evidence-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read real reconciliation schedule, paid entitlement and download code
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-delivery-evidence-ssh/config" saeit-cpanel             "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_delivery_runtime_evidence_readonly_20261021.py
      - name: Independently inspect crypto payments, cron and download gates before real funds
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_crypto_prepurchase_engineering_audit_20261021.py
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-delivery-evidence-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" \
            < scripts/mpw_crypto_prepurchase_engineering_audit_20261021.py
      - name: Simulate forged chain proofs and missing paid-entitlement records, no actual payments
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_simulated_crypto_purchase_delivery_20261021.py
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-delivery-evidence-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" \
            < scripts/mpw_simulated_crypto_purchase_delivery_20261021.py
      - name: Diagnose registration CSRF and exposed Django DEBUG safely, no DB writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_registration_csrf_readonly_audit_20261021.py
          timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-delivery-evidence-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" \
            < scripts/mpw_registration_csrf_readonly_audit_20261021.py
      - name: Read current signup handler and existing mobile form JavaScript without writing
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-delivery-evidence-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" \
            < scripts/mpw_customer_mobile_csrf_rootcause_details_readonly_20261020.py
      - name: Remove temporary relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-delivery-evidence-ssh"
