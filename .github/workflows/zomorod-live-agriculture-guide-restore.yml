name: Restore thirteen Zomorod agriculture guides at their original paths
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-live-agriculture-guide-restore.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 13 published specialist guides with their existing original canonical URLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import shutil
          src=Path("public/agriculture")
          dest=Path("zm-agriculture-guides")
          slugs=("livestock","horticulture","greenhouse","poultry","aquaculture","inputs","seeds","fertilizers","pesticides","offices","water-soil","machinery","market")
          class Check(HTMLParser):
              def __init__(self):super().__init__();self.images=0;self.has_title=False;self.has_h1=False
              def handle_starttag(self,t,a):
                  if t=="img":self.images+=1
                  if t=="title":self.has_title=True
                  if t=="h1":self.has_h1=True
          for slug in slugs:
              source=src/slug/"index.html"
              content=source.read_text(encoding="utf-8")
              parser=Check();parser.feed(content)
              assert len(content)>3500 and parser.images>0 and parser.has_title and parser.has_h1
              assert "saeit-zomorod-agriculture-v1" in content
              assert "https://zomorodmelal.ir/agriculture/"+slug+"/" in content
              output=dest/slug/"index.html"
              output.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,output)
          assert len(list(dest.rglob("index.html")))==13
          print("AGRICULTURAL_SPECIALIST_GUIDES_VALIDATED=13")
          PY
      - name: Prepare the confirmed pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-root"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"


      - name: Stage thirteen guides outside any active production URL
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          stage="/home/zomorod2/.zm-ag-guides-stage-$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && mkdir -m 700 '$stage'"
          tar -czf - zm-agriculture-guides | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
      - name: Backup exact root routing file and map only thirteen presently broken routes
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel python3 - "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import os,sys
          sha=sys.argv[1]
          home=Path.home()
          root=home/"public_html"
          ht=root/".htaccess"
          published=root/"zm-agriculture-guides"
          stage=home/(".zm-ag-guides-stage-"+sha)/"zm-agriculture-guides"
          backup=home/".backups"/"zomorod-agri-guides"/sha
          slugs=("livestock","horticulture","greenhouse","poultry","aquaculture","inputs","seeds","fertilizers","pesticides","offices","water-soil","machinery","market")
          assert root.is_dir() and ht.is_file() and not ht.is_symlink() and ht.stat().st_uid==os.getuid()
          before=ht.read_bytes()
          assert b'PassengerAppRoot "/home/zomorod2/Saeit"' in before
          assert b'PassengerBaseURI "/"' in before
          assert b"RewriteEngine On" in before
          assert b"ZM_AGRI_GUIDE_RULE_20261016" not in before
          assert not published.exists() and not published.is_symlink()
          assert stage.is_dir() and all((stage/s/"index.html").is_file() for s in slugs)
          assert len(list(stage.rglob("index.html")))==13
          assert not backup.exists()
          backup.mkdir(parents=True)
          (backup/"original.htaccess").write_bytes(before)
          assert (backup/"original.htaccess").read_bytes()==before
          for p in stage.rglob("*"):
              os.chmod(p,0o755 if p.is_dir() else 0o644)
          stage.rename(published)
          rule=(b"\n# ZM_AGRI_GUIDE_RULE_20261016: exact only, no other page routes\n"
                b"RewriteEngine On\n"
                b"RewriteRule ^agriculture/(livestock|horticulture|greenhouse|poultry|aquaculture|inputs|seeds|fertilizers|pesticides|offices|water-soil|machinery|market)/?$ zm-agriculture-guides/$1/index.html [END]\n")
          changed=rule+before
          temp=ht.with_name(".htaccess.zm-"+sha+".tmp")
          temp.write_bytes(changed)
          os.chmod(temp,ht.stat().st_mode & 0o777)
          os.replace(temp,ht)
          print("ONLY_THIRTEEN_BROKEN_ROUTES_ADDED=yes")
          print("ORIGINAL_ROOT_ROUTING_BACKUP=verified")
          PY
      - name: Verify all thirteen corrected URLs plus original site and academy
        run: |
          set -euo pipefail
          for slug in livestock horticulture greenhouse poultry aquaculture inputs seeds fertilizers pesticides offices water-soil machinery market; do
            url="https://zomorodmelal.ir/agriculture/$slug/?guide_release=$GITHUB_SHA"
            html="$RUNNER_TEMP/zm-$slug-guide.html"
            status="$(curl -L -sS --max-time 30 -H 'Cache-Control: no-cache' -o "$html" -w '%{http_code}' "$url" || true)"
            echo "AGRICULTURE_GUIDE=$slug HTTP=$status"
            test "$status" = 200
            grep -Fq "saeit-zomorod-agriculture-v1" "$html"
            test "$(wc -c < "$html")" -gt 3500
          done
          for route in "" agriculture/ amozeshgah/ industry/ research/ knowledge/ company/ blog/ weather/ store/; do
            status="$(curl -L -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/$route" || true)"
            echo "PRESERVED_ORIGINAL_ROUTE=/$route HTTP=$status"
            test "$status" = 200
          done
          echo "ALL_13_GUIDE_ROUTES_PUBLISHED=verified"
      - name: Restore previous routing and unpublish added pages if any verification fails
        if: failure() && steps.install.outcome != 'skipped'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel python3 - "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import os,sys
          sha=sys.argv[1]
          home=Path.home()
          root=home/"public_html"
          ht=root/".htaccess"
          backup=home/".backups"/"zomorod-agri-guides"/sha/"original.htaccess"
          published=root/"zm-agriculture-guides"
          if backup.is_file() and ht.is_file() and b"ZM_AGRI_GUIDE_RULE_20261016" in ht.read_bytes():
              temp=ht.with_name(".htaccess.zm-rollback-"+sha+".tmp")
              temp.write_bytes(backup.read_bytes())
              os.chmod(temp,ht.stat().st_mode & 0o777)
              os.replace(temp,ht)
              print("ROOT_HTACCESS_RESTORED=verified")
          if published.is_dir() and (published/"livestock/index.html").is_file() and b"saeit-zomorod-agriculture-v1" in (published/"livestock/index.html").read_bytes():
              archived=home/".backups"/"zomorod-agri-unpublished"/sha
              archived.parent.mkdir(parents=True,exist_ok=True)
              published.rename(archived)
              print("UNVERIFIED_ADDED_GUIDES_ARCHIVED=yes")
          PY
      - name: Clean session credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-root"
