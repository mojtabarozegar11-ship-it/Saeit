name: Repair canonical slash routes for Zomorod 20261025b guides
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zm-resource-20261025b-canonical-repair.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zm-20261025b-canonical-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate the two public guide files before touching hosting
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          base='https://zomorodmelal.ir/resources/20261025b/'
          for slug in ('cold-chain-acceptance','supplier-technical-comparison'):
              url=base+slug+'/index.html'
              with urllib.request.urlopen(url,timeout=22) as r:
                  body=r.read(100000).decode('utf-8','replace')
                  assert r.status==200 and '<link rel="canonical" href="'+base+slug+'/"' in body,url
              print('SOURCE_GUIDE_AND_CANONICAL_PRESENT',url)
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-b-route-ssh";install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Install isolated configuration only if absent
        id: install
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-b-route-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path('/home/zomorod2/public_html')
          release=root/'resources/20261025b'
          if root.is_symlink() or release.is_symlink() or not release.is_dir():
              raise RuntimeError('UNTRUSTED_RELEASE_PATH')
          for name in ('cold-chain-acceptance','supplier-technical-comparison'):
              page=release/name/'index.html'
              if page.is_symlink() or not page.is_file():
                  raise RuntimeError('REQUIRED_GUIDE_MISSING:'+name)
          target=release/'.htaccess'
          expected=b'PassengerEnabled off\nDirectoryIndex index.html\nOptions -Indexes\n'
          if target.exists() or target.is_symlink():
              if target.is_symlink() or not target.is_file() or target.read_bytes()!=expected:
                  raise RuntimeError('EXISTING_CONFIG_NOT_OWNED_DO_NOT_OVERWRITE')
              print('ISOLATED_CONFIG_ALREADY_PRESENT_NO_CHANGE')
          else:
              fd=os.open(str(target),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o644)
              with os.fdopen(fd,'wb') as f:
                  f.write(expected);f.flush();os.fsync(f.fileno())
              print('ISOLATED_CONFIG_NEWLY_INSTALLED')
          PY
      - name: Verify canonical URLs and protected site endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,time
          base='https://zomorodmelal.ir/resources/20261025b/'
          for slug in ('','cold-chain-acceptance/','supplier-technical-comparison/'):
              url=base+slug
              ok=False
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(url+'?route_check='+str(time.time_ns()),timeout=20) as r:
                          body=r.read(100000).decode('utf-8','replace')
                          if r.status==200 and '<link rel="canonical" href="'+url+'"' in body:
                              ok=True;break
                  except Exception as e:
                      print('RETRY',url,type(e).__name__,str(e)[:120])
                  time.sleep(3)
              if not ok: raise RuntimeError('CANONICAL_NOT_RESOLVED:'+url)
              print('CANONICAL_ROUTE_VERIFIED',url)
          for url in ('https://zomorodmelal.ir/','https://mojplaywin.com/','https://mojplaywin.com/store/'):
              with urllib.request.urlopen(url,timeout=20) as r: assert r.status==200,url
          print('ISOLATED_CANONICAL_REPAIR_VERIFIED_NO_OTHER_SITE_CHANGES')
          PY
      - name: Clean temporary SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zm-b-route-ssh"
