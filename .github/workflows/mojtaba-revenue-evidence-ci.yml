name: Mojtaba bot revenue evidence and reconciliation (read only)

on:
  pull_request:
    branches:
      - audit/mojtaba-outbox-consent-20261114
    paths:
      - core/revenue_evidence_gate.py
      - command_center/revenue_evidence.py
      - command_center/urls.py
      - core/management/commands/mojtaba_revenue_evidence_readonly.py
      - core/economic_master_agent.py
      - core/tests/test_mojtaba_revenue_evidence_20261114.py
      - core/tests/test_commerce_funnel.py
      - tests/test_crown_tron_receipts.py
      - .github/workflows/mojtaba-revenue-evidence-ci.yml

permissions:
  contents: read

jobs:
  isolated-revenue-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DEBUG: "true"
      SECRET_KEY: "isolated-ci-only-key"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TRADE_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Isolated cash evidence and entitlement regressions
        run: |
          python -m pytest -q \
            core/tests/test_mojtaba_revenue_evidence_20261114.py \
            tests/test_crown_tron_receipts.py \
            core/tests/test_commerce_funnel.py
      - name: Verify Python syntax
        run: |
          python -m compileall -q \
            core/revenue_evidence_gate.py \
            command_center/revenue_evidence.py \
            core/management/commands/mojtaba_revenue_evidence_readonly.py \
            core/economic_master_agent.py \
            core/tests/test_mojtaba_revenue_evidence_20261114.py
