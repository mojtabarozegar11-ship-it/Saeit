name: Amuzeshgah cPanel target preflight
# Read-only state refresh after isolated Passenger rollback on 2026-10-15.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amozeshgah-cpanel-preflight.yml"
permissions:
  contents: read
concurrency:
  group: amozeshgah-cpanel-preflight
  cancel-in-progress: false
jobs:
  inspect-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure pinned VPS relay and cPanel connection
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/amozeshgah-preflight"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          actual="$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Inspect documented production cPanel account
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -F "$RUNNER_TEMP/amozeshgah-preflight/config" -o User=zomorodm saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo PRODUCTION_ACCOUNT_AUTHENTICATED_USER="$(id -un)"
          for p in /home/zomorodm/repositories/Saeit /home/zomorodm/zomorodmelal-app/django_project; do
            if test -d "$p"; then
              echo "PRODUCTION_PATH_PRESENT=$p"
              if test -f "$p/.git/HEAD"; then
                echo "PRODUCTION_REPO_HEAD=$(cat "$p/.git/HEAD")"
              fi
              if test -f "$p/manage.py"; then
                echo "PRODUCTION_DJANGO_PROJECT=$p"
                if test -f "$p/config/urls.py" && grep -q 'amozeshgah' "$p/config/urls.py"; then echo "PRODUCTION_ROUTE_PRESENT=$p"; fi
              fi
            else
              echo "PRODUCTION_PATH_ABSENT=$p"
            fi
          done
          REMOTE
          rc=$?
          set -e
          echo "PRODUCTION_ACCOUNT_SSH_EXIT=$rc"
      - name: Inspect currently available cPanel account
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/amozeshgah-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo CPANEL_AUTHENTICATED_USER="$(id -un)"
          echo CPANEL_HOST="$(hostname)"
          for p in /home/zomorod2/Saeit-staging; do
            if test -d "$p"; then
              echo "PATH_PRESENT=$p"
              if test -f "$p/manage.py"; then echo "DJANGO_PROJECT_PRESENT=$p"; fi
              if test -f "$p/config/urls.py"; then
                echo "EDUCATION_ROUTE_LINES_BEGIN"
                grep -n 'amozeshgah\|education/' "$p/config/urls.py" || true
                echo "EDUCATION_ROUTE_LINES_END"
              fi
            else
              echo "PATH_ABSENT=$p"
            fi
          done
          REMOTE
      - name: Resolve company domain root in this cPanel account
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-preflight"
          timeout 45s ssh -F "$work/config" saeit-cpanel 'uapi --output=json DomainInfo domains_data' > "$work/domain-info.json"
          python3 - "$work/domain-info.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          target={"zomorodmelal.ir","www.zomorodmelal.ir"}
          found=[]
          def visit(x):
              if isinstance(x,dict):
                  domain=x.get("domain") or x.get("servername")
                  root=x.get("documentroot") or x.get("document_root") or x.get("docroot")
                  if isinstance(domain,str) and domain.rstrip(".").lower() in target and isinstance(root,str):
                      found.append((domain,root))
                  for value in x.values(): visit(value)
              elif isinstance(x,list):
                  for value in x: visit(value)
          visit(data)
          if found:
              for domain,root in found: print(f"CPANEL_DOMAIN_ROOT {domain}={root}")
          else:
              print("CPANEL_COMPANY_DOMAIN_NOT_ASSIGNED_TO_AUTHENTICATED_ACCOUNT")
          PY
      - name: Inspect the public document root without changes
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/amozeshgah-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/zomorod2/public_html
          echo CPANEL_PUBLIC_ROOT_OWNER="$(stat -c %U "$root")"
          test -d "$root" && test -w "$root"
          echo CPANEL_PUBLIC_ROOT_WRITABLE=yes
          if test -e "$root/amozeshgah" || test -L "$root/amozeshgah"; then
            echo EDUCATION_TARGET_PATH=ALREADY_PRESENT
            ls -ld "$root/amozeshgah"
          else echo EDUCATION_TARGET_PATH=AVAILABLE
          fi
          if test -e "$root/education" || test -L "$root/education"; then
            echo LEGACY_EDUCATION_PATH=PRESENT
            ls -ld "$root/education"
          else echo LEGACY_EDUCATION_PATH=ABSENT
          fi
          echo PUBLIC_ROOT_TOP_LEVEL
          find "$root" -mindepth 1 -maxdepth 1 -printf '%f %y\n' 2>/dev/null | sort | head -40
          if test -f "$root/.htaccess"; then
            echo ROOT_HTACCESS_TARGET_DIRECTIVES
            grep -E '^[[:space:]]*(PassengerAppRoot|PassengerStartupFile|PassengerBaseURI|RewriteRule|RewriteCond)' "$root/.htaccess" | head -40 || true
          else echo ROOT_HTACCESS=ABSENT
          fi
          backup="$HOME/.backups/zomorodmelal-amozeshgah/htaccess.20261014T235252Z"
          if test -f "$root/.htaccess" && test -f "$backup"; then
            echo ROOT_HTACCESS_HASHES
            sha256sum "$root/.htaccess" "$backup"
            if cmp -s "$root/.htaccess" "$backup"; then echo ROOT_HTACCESS_MATCHES_PRE_ALIAS_BACKUP=yes; else echo ROOT_HTACCESS_MATCHES_PRE_ALIAS_BACKUP=no; fi
          else echo ROOT_HTACCESS_BACKUP_PRESENT=no
          fi
          REMOTE
      - name: Inspect active Passenger app and release state
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/amozeshgah-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          test -d "$app" && test -f "$app/manage.py" && test -f "$app/passenger_wsgi.py"
          echo ACTIVE_PASSENGER_APP=$app
          if git -C "$app" rev-parse --git-dir >/dev/null 2>&1; then
            echo ACTIVE_APP_GIT_HEAD="$(git -C "$app" rev-parse HEAD)"
            echo ACTIVE_APP_BRANCH="$(git -C "$app" branch --show-current)"
            echo ACTIVE_APP_WORKTREE_CHANGE_COUNT="$(git -C "$app" status --porcelain | wc -l | tr -d ' ')"
            echo ACTIVE_APP_REMOTE_NAMES="$(git -C "$app" remote | tr '\n' ' ')"
          else echo ACTIVE_APP_GIT_REPO=NO
          fi
          if grep -q 'amozeshgah' "$app/config/urls.py"; then
            echo ACTIVE_APP_CANONICAL_ROUTE=YES
            grep -n 'amozeshgah' "$app/config/urls.py"
          else echo ACTIVE_APP_CANONICAL_ROUTE=NO
          fi
          for p in "$app/.venv/bin/python" "$app/venv/bin/python" "$HOME/virtualenv/Saeit/3.11/bin/python" "$HOME/virtualenv/Saeit/3.10/bin/python" "$HOME/virtualenv/Saeit/3.9/bin/python"; do
            if test -x "$p"; then echo ACTIVE_APP_PYTHON_CANDIDATE="$p"; fi
          done
          if test -f "$app/.env"; then echo ACTIVE_APP_ENV_FILE_PRESENT=yes; else echo ACTIVE_APP_ENV_FILE_PRESENT=no; fi
          if test -f "$app/deploy/cpanel_deploy.sh"; then echo CPANEL_DEPLOY_SCRIPT_PRESENT=yes; else echo CPANEL_DEPLOY_SCRIPT_PRESENT=no; fi
          REMOTE
      - name: Inspect live education route without changing files
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/amozeshgah-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          echo LIVE_URLS_FILE_TRACKED_CHANGE_COUNT="$(git -C "$app" status --porcelain -- config/urls.py | wc -l | tr -d ' ')"
          echo LIVE_URLS_DIFF_LINE_COUNT="$(git -C "$app" diff --numstat -- config/urls.py | awk '{a+=$1; d+=$2} END {print a+d}')"
          echo LIVE_EDUCATION_URL_LINES_BEGIN
          grep -n 'education/' "$app/config/urls.py" | head -30 || true
          echo LIVE_EDUCATION_URL_LINES_END
          echo LIVE_EDUCATION_VIEW_SYMBOLS_BEGIN
          grep -n '^def education\|^class Education' "$app/education/views.py" "$app/core/views.py" 2>/dev/null | head -30 || true
          echo LIVE_EDUCATION_VIEW_SYMBOLS_END
          REMOTE
      - name: Inspect registered Passenger apps and education staging
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-preflight"
          timeout 45s ssh -F "$work/config" saeit-cpanel 'uapi --output=json PassengerApps list_applications' > "$work/passenger-apps.json"
          python3 - "$work/passenger-apps.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding="utf-8"))
          data=(obj.get("result") or {}).get("data")
          allowed={"name","app_name","application_name","domain","base_uri","base_url","application_path","path","enabled","status"}
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  row={k:v for k,v in x.items() if k in allowed and isinstance(v,(str,int,bool))}
                  if row: rows.append(row)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          if rows:
              for row in rows: print("PASSENGER_APP="+json.dumps(row,sort_keys=True))
          else: print("PASSENGER_APP_LIST_EMPTY_OR_SCHEMA_UNRECOGNIZED")
          PY
          ssh -F "$work/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit-staging
          if test -d "$app" && test -f "$app/manage.py" && test -f "$app/passenger_wsgi.py"; then
            echo EDUCATION_STAGING_APP_PRESENT=yes
            if git -C "$app" rev-parse --git-dir >/dev/null 2>&1; then
              echo EDUCATION_STAGING_HEAD="$(git -C "$app" rev-parse HEAD)"
              echo EDUCATION_STAGING_BRANCH="$(git -C "$app" branch --show-current)"
              echo EDUCATION_STAGING_CHANGE_COUNT="$(git -C "$app" status --porcelain | wc -l | tr -d ' ')"
            fi
            if grep -q 'amozeshgah' "$app/config/urls.py"; then echo EDUCATION_STAGING_CANONICAL_ROUTE=yes; else echo EDUCATION_STAGING_CANONICAL_ROUTE=no; fi
            if test -f "$app/.env"; then echo EDUCATION_STAGING_ENV_PRESENT=yes; else echo EDUCATION_STAGING_ENV_PRESENT=no; fi
            if test -x "$app/.venv/bin/python"; then echo EDUCATION_STAGING_VENV_PRESENT=yes; else echo EDUCATION_STAGING_VENV_PRESENT=no; fi
          else echo EDUCATION_STAGING_APP_PRESENT=no
          fi
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/amozeshgah-preflight"
