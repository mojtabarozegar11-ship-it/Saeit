name: Zomorod footer Aban 1398 rights one-field safeguarded release
on:
  pull_request:
    paths:
      - 'content/zomorod-vision-v3/index.html'
      - 'scripts/zomorod_footer_rights_aban1398_guard_20261113.py'
      - '.github/workflows/zomorod-footer-rights-aban1398-20261113.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/zomorod_footer_rights_aban1398_guard_20261113.py'
      - '.github/workflows/zomorod-footer-rights-aban1398-20261113.yml'
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove one and only one footer text span differs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_footer_rights_aban1398_guard_20261113.py
          python3 scripts/zomorod_footer_rights_aban1398_guard_20261113.py selftest
          git show 'e11e51ef606e2e50fa44a1ba309524418b94cff6:content/zomorod-vision-v3/index.html' > "$RUNNER_TEMP/old.html"
          python3 - <<'PY'
          from pathlib import Path
          old=Path('/proc/self/environ')
          import os
          original=(Path(os.environ['RUNNER_TEMP'])/'old.html').read_bytes()
          new=Path('content/zomorod-vision-v3/index.html').read_bytes()
          before='© ۲۰۲۶ شرکت کشت و صنعت زمرد ملل · حقوق محفوظ است.'.encode()
          after='© شرکت کشت و صنعت زمرد ملل | آبان ۱۳۹۸ | کلیه حقوق مادی و معنوی محفوظ است.'.encode()
          assert original.count(before)==1 and new.count(after)==1
          assert original.replace(before,after,1)==new,'Any non-footer change is prohibited'
          assert new.count(b'<h1')==1 and b'zm-reference-v3.css?v=20261113-ux1' in new
          print('ZOMOROD_RIGHTS_ONE_FIELD_DIFF_ONLY=PASS')
          print('ZOMOROD_APPROVED_VISUAL_MARKUP_UNCHANGED=PASS')
          PY
  publish:
    needs: validate
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare old and new exact HTML with tiny atomic release guard
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-rights-package"
          install -d -m 700 "$d"
          git show 'e11e51ef606e2e50fa44a1ba309524418b94cff6:content/zomorod-vision-v3/index.html' > "$d/old.html"
          cp content/zomorod-vision-v3/index.html "$d/new.html"
          cp scripts/zomorod_footer_rights_aban1398_guard_20261113.py "$d/guard.py"
          test -s "$d/old.html" && test -s "$d/new.html" && test -s "$d/guard.py"
      - name: Direct trusted factory-vps to cPanel (host key pinned)
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-rights-ssh"
          install -d -m 700 "$d"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          good=0
          for attempt in 1 2 3; do
            if timeout 14s ssh-keyscan -T 9 -p 1396 -t ed25519 178.239.147.125 > "$d/candidate" 2>/dev/null && test -s "$d/candidate"; then
              observed="$(ssh-keygen -lf "$d/candidate" -E sha256 | awk '{print $2}' | sort -u)"
              test "$observed" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04' || { echo 'PIN_CHANGED_STOP' >&2; exit 1; }
              mv "$d/candidate" "$d/known";good=1;break
            fi
            sleep "$attempt"
          done
          test "$good" = 1 || { echo 'CPANEL_HOST_UNREACHABLE_STOP' >&2; exit 1; }
          cat > "$d/config" <<EOF
          Host zm-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/key
            UserKnownHostsFile $d/known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config" "$d/known"
          timeout 36s ssh -T -F "$d/config" zm-cpanel 'id -un' | grep -Fxq zomorod2
          echo ZOMOROD_RIGHTS_HOST_IDENTITY=VERIFIED
      - name: Stage package privately and inspect live baseline before ANY public write
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-rights-ssh"
          dest="/home/zomorod2/.zm-rights-stage-$GITHUB_RUN_ID"
          timeout 40s ssh -T -F "$d/config" zm-cpanel "test ! -e '$dest' && test ! -L '$dest' && install -d -m 700 '$dest'"
          tar -C "$RUNNER_TEMP/zomorod-rights-package" -cf - . | timeout 80s ssh -T -F "$d/config" zm-cpanel "tar -C '$dest' -xf -"
          timeout 55s ssh -T -F "$d/config" zm-cpanel "python3 '$dest/guard.py' inspect" | tail -n 1 > "$RUNNER_TEMP/zomorod-rights-inspection.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'zomorod-rights-inspection.json').read_text())
          assert len(result['protected'])>=10 and len(result['old'])==64
          print('ZOMOROD_RIGHTS_OLD_PAGE_AND_INNER_HASHES=VERIFIED')
          PY
      - name: Update one text span only with byte-verified private backup
        id: installed
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-rights-ssh"
          dest="/home/zomorod2/.zm-rights-stage-$GITHUB_RUN_ID"
          timeout 70s ssh -T -F "$d/config" zm-cpanel "python3 '$dest/guard.py' apply 'rights-$GITHUB_RUN_ID'"
      - name: Verify public rights text, CSS unchanged and protected inner paths
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-rights-ssh"
          dest="/home/zomorod2/.zm-rights-stage-$GITHUB_RUN_ID"
          timeout 50s ssh -T -F "$d/config" zm-cpanel "python3 '$dest/guard.py' verify 'rights-$GITHUB_RUN_ID'"
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import time
          base='https://zomorodmelal.ir'
          expected='© شرکت کشت و صنعت زمرد ملل | آبان ۱۳۹۸ | کلیه حقوق مادی و معنوی محفوظ است.'.encode()
          old='© ۲۰۲۶ شرکت کشت و صنعت زمرد ملل · حقوق محفوظ است.'.encode()
          good=False
          for n in range(6):
              with urlopen(Request(base+'/?rights_aban1398='+str(n),headers={'Cache-Control':'no-cache'}),timeout=23) as response:
                  page=response.read(200000)
                  assert response.status==200
              if page.count(expected)==1 and old not in page and b'zm-reference-v3.css?v=20261113-ux1' in page:
                  good=True;break
              time.sleep(2)
          assert good,'Corrected public copyright has not appeared'
          for path in ('/research/','/industry/','/agriculture/','/services/','/store/','/contact/','/assets/zm-reference-v3.js?v=20261113-ux1'):
              with urlopen(base+path,timeout=22) as response:
                  assert response.status==200 and len(response.read(1200))>100,path
          print('ZOMOROD_RIGHTS_PUBLIC_FOOTER=VERIFIED')
          print('ZOMOROD_RIGHTS_UNRELATED_ROUTES=UNCHANGED')
          PY
      - name: Revert only footer if install/public verification failed
        if: failure() && steps.installed.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-rights-ssh"
          dest="/home/zomorod2/.zm-rights-stage-$GITHUB_RUN_ID"
          timeout 70s ssh -T -F "$d/config" zm-cpanel "python3 '$dest/guard.py' rollback 'rights-$GITHUB_RUN_ID'"
      - name: Remove runner SSH secret file
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-rights-ssh"
          test -d "$d" && rm -rf -- "$d" || true
  public-browser:
    needs: publish
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Independently inspect live footer and all tested viewports (no screenshots generated)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0
          npx playwright install chromium
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const width of [360,390,768,1024,1440]){
              const p=await b.newPage({viewport:{width,height:900}});
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.goto('https://zomorodmelal.ir/?footer_1398='+width,{waitUntil:'load',timeout:45000});
              const proof=await p.evaluate(()=>({
                scroll:document.documentElement.scrollWidth,v:innerWidth,h1:document.querySelectorAll('h1').length,
                correct:document.querySelector('.footer-bottom span')?.textContent?.includes('آبان ۱۳۹۸')&&document.querySelector('.footer-bottom span')?.textContent?.includes('کلیه حقوق مادی و معنوی محفوظ است'),
                css:[...document.styleSheets].some(s=>s.href?.includes('ux1')),logo:!!document.querySelector('.footer-company img'),
                unmodifiedJs:!!document.querySelector('script[src*="ux1"]')
              }));
              if(proof.scroll>width+3||proof.h1!==1||!proof.correct||!proof.css||!proof.logo||!proof.unmodifiedJs||errors.length)throw Error('FOOTER_BROWSER_QA_FAIL '+JSON.stringify({width,proof,errors}));
              console.log('ZOMOROD_RIGHTS_BROWSER_PASS='+width);
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
  rollback-after-browser-failure:
    needs: [publish,public-browser]
    if: ${{ always() && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && needs.publish.result == 'success' && needs.public-browser.result != 'success' }}
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Revert original footer only on independently failed public browser checks
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-rights-rollback"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          timeout 16s ssh-keyscan -T 9 -p 1396 -t ed25519 178.239.147.125 > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          dest="/home/zomorod2/.zm-rights-stage-$GITHUB_RUN_ID"
          timeout 65s ssh -T -i "$d/key" -p 1396 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 zomorod2@178.239.147.125 "python3 '$dest/guard.py' rollback 'rights-$GITHUB_RUN_ID'"
          echo ZOMOROD_RIGHTS_BROWSER_ROLLBACK=COMPLETE
