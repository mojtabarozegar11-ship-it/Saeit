name: Zomorod private accounting DB initialization safety

on:
  push:
    branches:
      - fix/zm-explicit-private-db-init-20261101
    paths:
      - content/zomorod-business/app.php
      - tests/test_zm_business_private_db_bootstrap_http.py
      - .github/workflows/zm-private-db-bootstrap-ci-20261101.yml
  pull_request:
    paths:
      - content/zomorod-business/app.php
      - tests/test_zm_business_private_db_bootstrap_http.py
      - .github/workflows/zm-private-db-bootstrap-ci-20261101.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-db-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PHP SQLite runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3
      - name: PHP source syntax check
        run: php -l content/zomorod-business/app.php
      - name: Real PHP HTTP and private DB initialization regression
        run: python3 tests/test_zm_business_private_db_bootstrap_http.py -v
