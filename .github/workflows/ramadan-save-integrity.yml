name: Ramadan War save integrity (read-only)
on:
  pull_request:
    paths:
      - 'games/ramadan-war/index.html'
      - 'games/ramadan-war/game.js'
      - 'games/ramadan-war/input-guard.mjs'
      - 'games/ramadan-war/missile-targets.mjs'
      - 'games/ramadan-war/enemy-action-policy.mjs'
      - 'games/ramadan-war/deploy.py'
      - 'games/ramadan-war/save-validation.mjs'
      - 'games/ramadan-war/upgrade-policy.mjs'
      - 'games/ramadan-war/moj1-commerce-policy.mjs'
      - 'tests/game/ramadan-save-validation.test.mjs'
      - 'tests/game/ramadan-upgrade-moj1-policy.test.mjs'
      - 'tests/game/ramadan-input-guard.test.mjs'
      - 'tests/game/ramadan-missile-targets.test.mjs'
      - 'tests/game/ramadan-enemy-lifecycle.test.mjs'
      - 'tests/game/ramadan-special-resource.test.mjs'
      - 'tests/game/ramadan-save-feedback.test.mjs'
      - 'tests/game/ramadan-seo.test.mjs'
      - '.github/workflows/ramadan-save-integrity.yml'
permissions:
  contents: read
jobs:
  save-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check campaign save integrity regressions
        run: node --test tests/game/ramadan-save-validation.test.mjs
      - name: Check game canonical and social sharing metadata
        run: node --test tests/game/ramadan-seo.test.mjs
      - name: Check keyboard focus and finite-resource regressions
        run: node --test tests/game/ramadan-input-guard.test.mjs
      - name: Check missile homing after enemy removal
        run: node --test tests/game/ramadan-missile-targets.test.mjs
      - name: Check defeated enemy lifecycle and legacy restore safety
        run: node --test tests/game/ramadan-enemy-lifecycle.test.mjs
      - name: Check persistence failure feedback
        run: node --test tests/game/ramadan-save-feedback.test.mjs
      - name: Check support skill resource consumption and save persistence
        run: node --test tests/game/ramadan-special-resource.test.mjs
      - name: Check earned upgrade caps and disabled MOJ1 checkout
        run: node --test tests/game/ramadan-upgrade-moj1-policy.test.mjs
      - name: Check reversible deployment script syntax
        run: python -m py_compile games/ramadan-war/deploy.py
      - name: Check browser module syntax
        run: node --check games/ramadan-war/game.js && node --check games/ramadan-war/upgrade-policy.mjs && node --check games/ramadan-war/moj1-commerce-policy.mjs && node --check games/ramadan-war/save-validation.mjs && node --check games/ramadan-war/input-guard.mjs && node --check games/ramadan-war/missile-targets.mjs && node --check games/ramadan-war/enemy-action-policy.mjs
