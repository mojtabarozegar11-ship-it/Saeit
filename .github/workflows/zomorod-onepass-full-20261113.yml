name: Zomorod homepage 4-card carousel — PR validation only
on:
  pull_request:
    paths:
      - 'content/zomorod-vision-v3/**'
      - 'scripts/zomorod_onepass_guarded_20261113.py'
      - 'scripts/test_zomorod_onepass_20261113.py'
      - 'scripts/zomorod_fields_guard_20261113.py'
      - 'tests/test_zomorod_fields_release_guard.py'
      - '.github/workflows/zomorod-onepass-full-20261113.yml'
  # Validation only. Publishing requires separate, explicitly approved manual execution.
  # Never re-enable the obsolete one-pass production publisher.
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  validate-and-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare immutable baseline and full corrected package
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/zm-onepass-stage"
          mkdir -p "$stage/old/assets" "$stage/new/assets"
          for rel in index.html assets/zm-reference-v3.css assets/zm-reference-v3.js; do
            git show "6b4e460f65b556dcdb95fda8f9beaeaab996b3a8:content/zomorod-vision-v3/$rel" > "$stage/old/$rel"
            cp "content/zomorod-vision-v3/$rel" "$stage/new/$rel"
            test -s "$stage/old/$rel" && test -s "$stage/new/$rel"
          done
          cp content/zomorod-vision-v3/assets/zm-logo-transparent-v1.webp "$stage/new/assets/"
          cp content/zomorod-vision-v3/ar/index.html "$stage/new/assets/zm-ar-v1.html"
          cp scripts/zomorod_onepass_guarded_20261113.py "$stage/guard.py"
          echo "ZOMOROD_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Verify code syntax, release rollback and full feature contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_onepass_guarded_20261113.py scripts/test_zomorod_onepass_20261113.py
          node --check content/zomorod-vision-v3/assets/zm-reference-v3.js
          python3 scripts/test_zomorod_onepass_20261113.py "$ZOMOROD_STAGE"
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          h=Path('content/zomorod-vision-v3/index.html').read_text()
          js=Path('content/zomorod-vision-v3/assets/zm-reference-v3.js').read_text()
          css=Path('content/zomorod-vision-v3/assets/zm-reference-v3.css').read_text()
          ar=Path('content/zomorod-vision-v3/ar/index.html').read_text()
          for s in ('آبان ۱۳۹۸','کلیه حقوق مادی و معنوی محفوظ است','action="/search/"','hreflang="en"','hreflang="ar"','zm-logo-transparent-v1.webp'):
              assert s in h,s
          assert h.count('data-auto-strip=')==3
          assert h.count('data-rotator-toggle=')==4
          assert h.count('data-field-carousel=')==1
          assert h.count('fetchpriority="high"')<=2
          assert h.count('<h1')==1
          assert '/en/' in h and '/assets/zm-ar-v1.html' in h and '<html lang="ar" dir="rtl">' in ar
          assert 'setInterval' in js and 'prefers-reduced-motion' in js
          assert "const strips=Array.from(document.querySelectorAll(" in js, 'Selecting a single strip breaks all carousel initialization'
          assert 'auto-scroll-row' in css and 'auto-rotator-toggle' in css
          assert all(n not in h for n in ('Vancouver','ونکوور','ISO 9001','ISO 14001'))
          print('ZM_ONEPASS_EXACT_FOOTER_LANG_SEARCH_LOGO_THREE_ROWS=PASS')
          PY
      - name: Build local faithful page (reuse existing reference art; do not generate images)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/zm-onepass-preview"
          mkdir -p "$root/assets"
          cp "$ZOMOROD_STAGE/new/index.html" "$root/index.html"
          cp "$ZOMOROD_STAGE/new/assets/"* "$root/assets/"
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile
          root=Path(os.environ['RUNNER_TEMP'])/'zm-onepass-preview'
          with zipfile.ZipFile('content/zomorod-vision-v3/artwork.zip') as arc:
              for entry in arc.namelist():
                  if entry.startswith('art/') and entry.endswith('.webp'):
                      (root/'assets'/('zm-v3-'+entry.split('/')[-1])).write_bytes(arc.read(entry))
          assert len(list((root/'assets').glob('zm-v3-*.webp')))==17
          img=(root/'assets/zm-logo-transparent-v1.webp').read_bytes()
          assert img[:4]==b'RIFF' and img[8:12]==b'WEBP' and len(img)>25000
          print('ZM_ONEPASS_FIRST_PARTY_APPROVED_MEDIA=PASS')
          PY
      - name: Test real continuous motion, pause/play, RTL, search, logo and accessibility in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 8099 --directory "$RUNNER_TEMP/zm-onepass-preview" > "$RUNNER_TEMP/zv-onepass-local-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const width of [360,390,768,1024,1440]){
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
              const errors=[],failed=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('requestfailed',r=>failed.push(r.url()));
              await page.goto('http://127.0.0.1:8099/?width='+width,{waitUntil:'load',timeout:45000});
              try{
                await page.waitForFunction(()=>document.documentElement.dataset.rotatingRows==='3',null,{timeout:12000});
              }catch(error){
                const info=await page.evaluate(()=>({
                  rotatingRows:document.documentElement.dataset.rotatingRows,
                  fieldCarouselReady:document.documentElement.dataset.fieldCarouselReady,
                  autoStrips:document.querySelectorAll('[data-auto-strip]').length,
                  fieldCarouselCount:document.querySelectorAll('[data-field-carousel]').length,
                  scriptSrc:document.querySelector('script[src*="zm-reference-v3.js"]')?.src,
                  readyState:document.readyState
                }));
                console.error('ZM_CAROUSEL_INIT_DIAGNOSTICS='+JSON.stringify(info));
                console.error('ZM_CAROUSEL_PAGE_ERRORS='+JSON.stringify(errors));
                console.error('ZM_CAROUSEL_FAILED_REQUESTS='+JSON.stringify(failed));
                throw error;
              }
              const evidence=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth,
                h1:document.querySelectorAll('h1').length,rows:document.querySelectorAll('[data-auto-strip]').length,
                controls:document.querySelectorAll('[data-rotator-toggle]').length,
                footer:document.querySelector('.footer-bottom')?.textContent.includes('آبان ۱۳۹۸'),
                logo:document.querySelector('.identity img')?.naturalWidth,
                ar:document.querySelector('.lang-switch a[href="/assets/zm-ar-v1.html"]')!==null,
                search:document.querySelector('.search-form')?.getAttribute('action')}));
              if(evidence.scroll>width+3||evidence.h1!==1||evidence.rows!==3||evidence.controls!==4||!evidence.footer||evidence.logo!==512||!evidence.ar||evidence.search!=='/search/'||errors.length)throw Error('ZM_LAYOUT_BASE_FAIL '+JSON.stringify({width,evidence,errors,failed}));
              const transparent=await page.evaluate(async()=>{
                const img=new Image();img.src='/assets/zm-logo-transparent-v1.webp';await img.decode();
                const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
                canvas.getContext('2d').drawImage(img,0,0);
                return canvas.getContext('2d').getImageData(0,0,1,1).data[3]===0;
              });
              if(!transparent)throw Error('LOGO_NOT_TRULY_TRANSPARENT');
              if(width===390){
                await page.locator('.mobile-menu-btn').click();if(!await page.locator('#mobile-nav').isVisible())throw Error('MOBILE_MENU_NOT_OPEN');
                await page.locator('.mobile-menu-btn').click();if(await page.locator('#mobile-nav').isVisible())throw Error('MOBILE_MENU_NOT_CLOSED');
                await page.locator('.search-toggle').click();
                const form=page.locator('.search-form');if(await form.getAttribute('method')!=='get'||await form.getAttribute('action')!=='/search/')throw Error('SEARCH_NOT_NATIVE');
                await page.locator('.search-toggle').click();
              }
              for(const id of ['services-strip','products-strip','projects-strip','fields-carousel']){
                const row=page.locator('#'+id);
                await row.scrollIntoViewIfNeeded();await page.waitForTimeout(450);
                const from=await row.evaluate(x=>x.scrollLeft);
                await page.waitForTimeout(1400);
                const to=await row.evaluate(x=>x.scrollLeft);
                if(!(to<from-8))throw Error('ROTATION_NOT_MOVING '+JSON.stringify({width,id,from,to}));
                const control=page.locator('[data-rotator-toggle="'+id+'"]');
                await control.click();
                if(await control.getAttribute('aria-pressed')!=='false')throw Error('ROTATION_NOT_PAUSED '+id);
                const stopped=await row.evaluate(x=>x.scrollLeft);await page.waitForTimeout(450);
                const after=await row.evaluate(x=>x.scrollLeft);
                if(Math.abs(after-stopped)>2)throw Error('ROTATION_PAUSE_NOT_REAL '+id);
                await control.click();
                if(await control.getAttribute('aria-pressed')!=='true')throw Error('ROTATION_NOT_RESUMED '+id);
              }
              // Inspect all HTML images and major cards on the actual rendered page.
              for(let y=0;y<await page.evaluate(()=>document.body.scrollHeight);y+=900){
                await page.evaluate(y=>window.scrollTo(0,y),y);await page.waitForTimeout(18);
              }
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.screenshot({path:'zomorod-onepass-preview-'+width+'.png',fullPage:true,animations:'disabled'});
              console.log('ZM_ONEPASS_PREVIEW_BROWSER_PASS='+width);
              await page.close();
            }
            const reduced=await browser.newPage({viewport:{width:390,height:800},reducedMotion:'reduce'});
            await reduced.goto('http://127.0.0.1:8099/',{waitUntil:'load'});
            for(const id of ['services-strip','products-strip','projects-strip','fields-carousel']){
              const button=reduced.locator('[data-rotator-toggle="'+id+'"]');
              if(await button.getAttribute('aria-pressed')!=='false')throw Error('REDUCED_MOTION_NOT_PAUSED_'+id);
            }
            const photoResume=reduced.locator('[data-rotator-toggle="fields-carousel"]');
            await photoResume.click();
            if(await photoResume.getAttribute('aria-pressed')!=='true')throw Error('REDUCED_MOTION_MANUAL_RESUME_MISSING');
            await reduced.close();

            // Actual touch device emulation: hover must never latch the carousel motion.
            const phone=await browser.newPage({viewport:{width:390,height:820},isMobile:true,hasTouch:true,reducedMotion:'no-preference'});
            await phone.goto('http://127.0.0.1:8099/?touch=1',{waitUntil:'load'});
            await phone.waitForFunction(()=>document.documentElement.dataset.fieldCarouselReady==='1');
            const photo=phone.locator('#fields-carousel');
            await photo.scrollIntoViewIfNeeded();
            await photo.evaluate(el=>el.dispatchEvent(new MouseEvent('mouseenter')));
            await phone.waitForTimeout(500);
            const phoneDiag=await phone.evaluate(()=>window.__zmRotatorDiagnostics().find(x=>x.id==='fields-carousel'));
            if(phoneDiag.hovered||phoneDiag.paused||!phoneDiag.visible)throw Error('TOUCH_HOVER_LATCH_FAILURE '+JSON.stringify(phoneDiag));
            const phoneStart=await photo.evaluate(el=>el.scrollLeft);
            await phone.waitForTimeout(900);
            const phoneEnd=await photo.evaluate(el=>el.scrollLeft);
            if(!(phoneEnd<phoneStart-3))throw Error('TOUCH_CAROUSEL_STATIC '+JSON.stringify({phoneStart,phoneEnd}));
            await phone.close();
            const ar=await browser.newPage();await ar.goto('http://127.0.0.1:8099/assets/zm-ar-v1.html',{waitUntil:'load'});
            if(!await ar.locator('html[lang="ar"][dir="rtl"] h1').count())throw Error('ARABIC_LANDING_NOT_FUNCTIONAL');
            await ar.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Cross-browser RTL motion safety in Firefox and WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npx playwright install firefox
          npx playwright install --with-deps webkit
          python3 -m http.server 8101 --directory "$RUNNER_TEMP/zm-onepass-preview" > "$RUNNER_TEMP/zm-crossbrowser.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node - <<'JS'
          const {firefox,webkit}=require('playwright');
          (async()=>{
            for(const [name,engine] of [['firefox',firefox],['webkit',webkit]]){
              const browser=await engine.launch({headless:true});
              for(const width of [390,1024]){
                const page=await browser.newPage({viewport:{width,height:850},reducedMotion:'no-preference'});
                await page.bringToFront();
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8101/',{waitUntil:'load',timeout:45000});
                await page.waitForFunction(()=>document.documentElement.dataset.rotatingRows==='3');
                for(const id of ['services-strip','products-strip','projects-strip','fields-carousel']){
                  const row=page.locator('#'+id);
                  await row.scrollIntoViewIfNeeded();await page.mouse.move(0,0);await page.waitForTimeout(500);
                  const before=await row.evaluate(x=>x.scrollLeft);await page.waitForTimeout(850);
                  const after=await row.evaluate(x=>x.scrollLeft);
                  if(!(after<before-3))throw Error(name+' '+id+' motion not confirmed: '+before+' -> '+after+' '+JSON.stringify(await page.evaluate(()=>window.__zmRotatorDiagnostics?.())));
                  const pause=page.locator('[data-rotator-toggle="'+id+'"]');
                  await pause.click();
                  if(await pause.getAttribute('aria-pressed')!=='false')throw Error(name+' '+id+' pause');
                }
                if(errors.length)throw Error(name+' js errors: '+JSON.stringify(errors));
                console.log('ZM_ONEPASS_CROSS_BROWSER_RTL_PASS='+name+'-'+width);
                await page.close();
              }
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Preserve browser screenshots as inspection evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zomorod-onepass-three-rotating-rows-preview
          path: ${{ runner.temp }}/zomorod-onepass-preview-*.png
          retention-days: 7
          if-no-files-found: ignore
