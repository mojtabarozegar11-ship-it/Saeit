name: cPanel single Node download archive reclaim
on:
  workflow_dispatch:
    inputs:
      cleanup_action:
        description: "Read-only preview or delete exactly one verified Node download archive"
        type: choice
        required: true
        default: preview
        options: [preview, apply]
      confirm_archive_only:
        description: "I confirm deleting ONLY /home/zomorod2/.cache/dc-node-setup/node.tar.gz (about 58 MB)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cpanel-single-node-download-archive-reclaim
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify public production site before any action
        shell: bash
        run: |
          set -euo pipefail
          for page in / /agents/; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$page" || true)"
            echo "ARCHIVE_BEFORE_HEALTH=$page:$code"
            test "$code" = 200
          done
      - name: Inspect or explicitly remove exactly one unused download tarball
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.cleanup_action }}
          CONFIRM_ARCHIVE_ONLY: ${{ inputs.confirm_archive_only }}
        run: |
          set -euo pipefail
          mode=preview
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_ACTION" == apply ]]; then
            test "$CONFIRM_ARCHIVE_ONLY" = true || { echo "ARCHIVE_EXPLICIT_CONFIRMATION_REQUIRED"; exit 8; }
            mode=apply
          fi
          echo "ARCHIVE_OPERATION_MODE=$mode"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel "ARCHIVE_OPERATION_MODE=$mode PYTHONDONTWRITEBYTECODE=1 python3 -" <<'PY'
          import os,stat,subprocess
          from pathlib import Path
          user=Path("/home/zomorod2")
          cache=user/".cache/dc-node-setup"
          archive=cache/"node.tar.gz"
          checksum=cache/"SHASUMS256.txt"
          assert Path.home()==user,"WRONG_REMOTE_USER_HOME"
          uid=os.geteuid()
          for parent in (user,user/".cache",cache):
              st=parent.lstat()
              assert stat.S_ISDIR(st.st_mode) and st.st_uid==uid,"ARCHIVE_PARENT_UNSAFE"
          st=archive.lstat()
          assert stat.S_ISREG(st.st_mode) and st.st_uid==uid and st.st_nlink==1,"ARCHIVE_TARGET_UNSAFE"
          assert 40_000_000 <= st.st_size <= 80_000_000,"ARCHIVE_UNEXPECTED_SIZE"
          check=checksum.lstat()
          assert stat.S_ISREG(check.st_mode) and check.st_uid==uid,"CHECKSUM_FILE_MISSING"
          du=subprocess.run(["du","-sk",str(archive)],capture_output=True,text=True,check=True,timeout=15)
          before=int(du.stdout.split()[0])*1024
          print("ARCHIVE_EXACT_TARGET=node.tar.gz",flush=True)
          print("ARCHIVE_ALLOCATED_BYTES="+str(before),flush=True)
          print("ARCHIVE_CONTENT_LENGTH_BYTES="+str(st.st_size),flush=True)
          references=0
          incomplete=0
          target=str(archive)
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  if proc.stat().st_uid!=uid:
                      continue
              except FileNotFoundError:
                  continue
              except OSError:
                  incomplete+=1;continue
              for link in ("exe","cwd"):
                  try:
                      references+=int(os.readlink(proc/link)==target)
                  except FileNotFoundError:
                      pass
                  except OSError:
                      incomplete+=1
              try:
                  for fd in (proc/"fd").iterdir():
                      try:
                          references+=int(os.readlink(fd)==target)
                      except FileNotFoundError:
                          pass
                      except OSError:
                          incomplete+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  incomplete+=1
              try:
                  references+=int(any(target in line for line in (proc/"maps").read_text().splitlines()))
              except FileNotFoundError:
                  pass
              except OSError:
                  incomplete+=1
          print("ARCHIVE_PROCESS_REFERENCES="+str(references),flush=True)
          print("ARCHIVE_PROC_INSPECTION_INCOMPLETE="+str(incomplete),flush=True)
          assert references==0 and incomplete==0,"ARCHIVE_STILL_IN_USE_OR_UNKNOWN"
          apply=os.environ.get("ARCHIVE_OPERATION_MODE")=="apply"
          print("ARCHIVE_APPLY_REQUESTED="+str(apply),flush=True)
          if apply:
              assert archive.stat().st_ino==st.st_ino,"ARCHIVE_CHANGED_DURING_PREFLIGHT"
              archive.unlink()
              assert not archive.exists(),"ARCHIVE_REMOVE_FAILED"
              assert checksum.is_file(),"CHECKSUM_MUST_REMAIN"
              print("ARCHIVE_REMOVED=true",flush=True)
              print("ARCHIVE_FREED_DU_BYTES="+str(before),flush=True)
          else:
              print("ARCHIVE_REMOVED=false",flush=True)
          PY
      - name: Verify public production site after action
        shell: bash
        run: |
          set -euo pipefail
          for page in / /agents/; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$page" || true)"
            echo "ARCHIVE_AFTER_HEALTH=$page:$code"
            test "$code" = 200
          done
      - name: Erase temporary runner-only SSH identity
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
