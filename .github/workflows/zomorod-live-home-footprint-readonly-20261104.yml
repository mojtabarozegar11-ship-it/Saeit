name: Zomorod production home disk footprint and no-delete audit 2026-11-04
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-live-home-footprint-readonly-20261104.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-live-home-footprint-readonly-20261104
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Record home usage and large file metadata without changing anything
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path("/home/zomorod2")
          assert root.is_dir() and not root.is_symlink()
          quota=json.loads(subprocess.check_output(["uapi","--output=json","Quota","get_quota_info"],text=True,timeout=30))
          data=quota.get("result",{}).get("data",{})
          for key in ("megabytes_used","megabytes_remain","megabyte_limit"):
              print("QUOTA_"+key.upper()+"="+str(data.get(key,"unknown")))
          p=subprocess.run(["timeout","210s","du","-x","-k","--max-depth=1",str(root)],capture_output=True,text=True,timeout=225)
          if p.returncode:print("HOME_DU_WARN="+str(p.returncode))
          entries=[]
          for line in p.stdout.splitlines():
              cells=line.split(None,1)
              if len(cells)!=2:continue
              try:size=int(cells[0])
              except ValueError:continue
              path=Path(cells[1])
              if path==root:continue
              if path.parent!=root:continue
              entries.append((size,path.name))
          for size,name in sorted(entries,reverse=True)[:28]:
              print("HOME_TOP_KIB="+str(size)+" name="+name)
          bases=["Saeit","Saeit-staging","public_html","mail","tmp","logs","backups","backup","softaculous_backups",".trash"]
          files=[]
          for base in bases:
              target=root/base
              if not target.is_dir() or target.is_symlink():continue
              cmd=["timeout","35s","find",str(target),"-xdev","-type","f","-size","+150M","-printf","%s\\t%p\\n"]
              proc=subprocess.run(cmd,capture_output=True,text=True,timeout=42)
              for line in proc.stdout.splitlines():
                  try: size_str,path=line.split(None,1);size=int(size_str)
                  except ValueError:continue
                  if Path(path).is_relative_to(target):files.append((size,str(Path(path).relative_to(root))))
              if proc.returncode:print("LARGE_FILE_SCAN_INCOMPLETE="+base)
          for size,path in sorted(files,reverse=True)[:30]:
              print("LARGE_FILE_BYTES="+str(size)+" path="+path)
          print("PRODUCTION_HOME_READONLY_AUDIT_COMPLETE=yes")
          PY
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -rf -- "$d"; fi
