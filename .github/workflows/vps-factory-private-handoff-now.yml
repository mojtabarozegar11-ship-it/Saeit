name: VPS Factory Safe Private Product Handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-factory-private-handoff-now.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-private-handoff
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send verified products from VPS to the existing private cPanel inbox
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/private-factory-handoff"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          ops="$HOME/factory-runtime/operations"
          root="$HOME/factory-runtime/private/autonomous-product-cycle/digital-products"
          key="$HOME/.ssh/saeit_factory_store_ed25519"
          known="$HOME/.ssh/saeit_factory_store_hosts"
          sender="$ops/factory_store_sender.py"
          test -s "$sender" && test -f "$key" && test -f "$known"
          test -s "$root/farm_enterprise_economics/manufacturing_manifest.json"
          test -s "$root/water_budget_economics/manufacturing_manifest.json"
          flock -w 30 "$ops/factory-store-sync.lock" python3 "$sender" --products "$root" --ssh-key "$key" --known-hosts "$known" --max-products 3
          test "$(crontab -l | grep -c SAEIT_FACTORY_STORE_SYNC)" -eq 1
          echo VPS_INDEPENDENT_PRIVATE_STORE_SCHEDULE_VERIFIED
          REMOTE
