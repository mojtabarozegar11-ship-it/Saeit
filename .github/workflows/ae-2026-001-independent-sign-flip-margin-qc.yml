name: AE-2026-001 independent original-artifact sign-margin sensitivity
on:
  push:
    branches: [research/mr-2026-001-novelty-audit]
    paths:
      - .github/workflows/ae-2026-001-independent-sign-flip-margin-qc.yml
      - research/manuscripts/AE-2026-001/analysis/audit_three_vintage_sign_flip_thresholds.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-artifact-threshold-qc:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve immutable original source-backed three-vintage artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ae_original"
          gh run download 40241769129 --repo "$GITHUB_REPOSITORY" --name AE-2026-001-2024-2025-2026-fixed-cohort-real-WDI-audit --dir "$RUNNER_TEMP/ae_original"
          test -s "$RUNNER_TEMP/ae_original/AE-2026-001_THREE_VINTAGE_FIXED_COHORT_AUDIT_2026-10-26.json"
      - name: Independently recompute margins and reject invented or inconsistent results
        shell: bash
        run: |
          set -euo pipefail
          python research/manuscripts/AE-2026-001/analysis/audit_three_vintage_sign_flip_thresholds.py \
            --input "$RUNNER_TEMP/ae_original/AE-2026-001_THREE_VINTAGE_FIXED_COHORT_AUDIT_2026-10-26.json" \
            --output "$RUNNER_TEMP/ae_original/AE-2026-001_SIGN_MARGIN_SENSITIVITY_2026-10-26.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"ae_original"/"AE-2026-001_SIGN_MARGIN_SENSITIVITY_2026-10-26.json"
          x=json.loads(p.read_text())
          assert x["fixed_2000_2019_cohort_n"]==155
          expected={"2024_to_2025":3,"2025_to_2026":2,"2024_to_2026":3}
          for pair,n in expected.items():
              assert x["pairs"][pair]["robust_sign_flips_both_endpoints_exceed_margin"]["0.005"]["count"]==n
          assert x["publication_novelty"]=="NOT_ESTABLISHED"
          print("SOURCE-BACKED INDEPENDENT THRESHOLD AUDIT PASS; NOT A PUBLICATION NOVELTY CLAIM")
          PY
      - name: Retain source hashes and independent sensitivity output
        uses: actions/upload-artifact@v4
        with:
          name: AE-2026-001-original-artifact-sign-margin-independent-QC
          path: ${{ runner.temp }}/ae_original/AE-2026-001_SIGN_MARGIN_SENSITIVITY_2026-10-26.json
          retention-days: 14
          if-no-files-found: error
