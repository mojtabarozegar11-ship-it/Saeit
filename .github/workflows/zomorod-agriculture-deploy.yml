name: Validate Zomorod agriculture guides
on:
  pull_request:
    paths:
      - "public/agriculture/**"
      - ".github/workflows/zomorod-agriculture-deploy.yml"
  push:
    branches: [main]
    paths:
      - "public/agriculture/**"
      - ".github/workflows/zomorod-agriculture-deploy.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate page structure and theme
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          pages=sorted(Path("public/agriculture").rglob("index.html"))
          if len(pages)!=14: raise SystemExit(f"Expected 14 pages, found {len(pages)}")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rtl=False; self.title=False; self.h1=False; self.canonical=False; self.images=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="html": self.rtl=a.get("lang")=="fa" and a.get("dir")=="rtl"
                  if tag=="title": self.title=True
                  if tag=="h1": self.h1=True
                  if tag=="link" and a.get("rel")=="canonical": self.canonical=a.get("href","").startswith("https://zomorodmelal.ir/agriculture/")
                  if tag=="img": self.images+=1
          for page in pages:
              source=page.read_text(encoding="utf-8"); check=Check(); check.feed(source)
              if not all((check.rtl,check.title,check.h1,check.canonical,check.images)) or "<!-- saeit-zomorod-agriculture-v1 -->" not in source:
                  raise SystemExit(f"Invalid guide page: {page}")
              if "border:7px double var(--gold)" not in source or "background:#252b19" not in source or len(source.encode())<3000:
                  raise SystemExit(f"Olive background, thick gold frame, or content issue: {page}")
          print("AGRICULTURE_GUIDES_VALIDATED=14")
          PY
