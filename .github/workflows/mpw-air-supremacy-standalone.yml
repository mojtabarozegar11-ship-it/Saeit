name: MojPlayWin standalone Air Supremacy game-only release
on:
  pull_request:
    branches: [main]
    paths:
      - games/air-supremacy/index.html
      - scripts/mpw_air_supremacy_standalone_publish.py
      - scripts/mpw_air_supremacy_exact_route.py
      - .github/workflows/mpw-air-supremacy-standalone.yml
  push:
    branches: [main]
    paths:
      - games/air-supremacy/index.html
      - scripts/mpw_air_supremacy_standalone_publish.py
      - scripts/mpw_air_supremacy_exact_route.py
      - .github/workflows/mpw-air-supremacy-standalone.yml
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact independent game artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_air_supremacy_standalone_publish.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('games/air-supremacy/index.html').read_bytes()
          expected='f86480f92a2dfdea76b26b369f1ec517f60065c0db05984de5e33afb33054c95'
          assert hashlib.sha256(raw).hexdigest()==expected
          assert 15000<len(raw)<120000
          assert b'Air Supremacy' in raw and b'<canvas' in raw
          assert b'window.__' in raw and b'100' in raw and b'requestAnimationFrame' in raw
          text=raw.decode('utf-8')
          js=text.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/air-supremacy-standalone.js').write_text(js,encoding='utf-8')
          print('AIR_SUPREMACY_ORIGINAL_ARTIFACT_HASH='+expected)
          PY
          node --check /tmp/air-supremacy-standalone.js
          echo AIR_SUPREMACY_STANDALONE_PREFLIGHT=PASS
  publish:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      contains(github.event.head_commit.message, '[approved-mpw-standalone-air-20261023]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record original Crown and protected page baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          import hashlib,json,os
          root='https://mojplaywin.com'
          paths=('/', '/games/', '/games/crown-defender/', '/store/', '/studio/', '/farnaz/')
          before={}
          for p in paths:
            with urlopen(Request(root+p,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Air-Standalone-Preflight'}),timeout=25) as response:
              code=response.status
              body=response.read(200000) if p=='/games/crown-defender/' else None
            if code!=200:raise SystemExit('PROTECTED_PAGE_UNAVAILABLE: '+p+' '+str(code))
            before[p]={'status':code,'sha':hashlib.sha256(body).hexdigest() if body else None}
            print('PROTECTED_BEFORE '+p+' '+str(code))
          Path(os.environ['RUNNER_TEMP']+'/air-game-baseline.json').write_text(json.dumps(before))
          PY
      - name: Pinned GitHub SSH to VPS to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
          echo 'AIR_SUPREMACY_PINNED_RELAY=PASS'
      - name: Verify new public directory does not exist
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel \
            'test -d /home/zomorod2/mojplaywin.com && test ! -e /home/zomorod2/mojplaywin.com/design-preview-20261017/air-supremacy && test ! -L /home/zomorod2/mojplaywin.com/design-preview-20261017/air-supremacy'
          echo AIR_NEW_PATH_UNOCCUPIED=YES
      - name: Stage exact game HTML outside web root
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          timeout 50s scp -q -F "$d/config" games/air-supremacy/index.html \
            "saeit-cpanel:/home/zomorod2/.mpw-air-supremacy-stage-$GITHUB_RUN_ID.html"
      - name: Install only new standalone HTML directory
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          sha=$(sha256sum games/air-supremacy/index.html | awk '{print $1}')
          timeout 65s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID' '$sha'" < scripts/mpw_air_supremacy_standalone_publish.py
      - name: Install one exact GET rewrite for new game after snapshot
        id: route
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          sha=$(sha256sum games/air-supremacy/index.html | awk '{print $1}')
          timeout 55s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID' '$sha'" < scripts/mpw_air_supremacy_exact_route.py
      - name: Verify Air Supremacy public exact HTML and original Crown bytes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,os,time
          root='https://mojplaywin.com'
          new=root+'/air-supremacy/'
          expected=hashlib.sha256(Path('games/air-supremacy/index.html').read_bytes()).hexdigest()
          before=json.loads(Path(os.environ['RUNNER_TEMP']+'/air-game-baseline.json').read_text())
          ok=False
          for i in range(5):
            try:
              url=new+'?mpw_air_release='+os.environ['GITHUB_RUN_ID']+'-'+str(i)
              with urlopen(Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Air-Supremacy-Safe-Smoke'}),timeout=25) as response:
                code=response.status
                typ=response.headers.get('Content-Type','')
                actual=response.read(150000)
              ok=code==200 and 'text/html' in typ and hashlib.sha256(actual).hexdigest()==expected
              print('AIR_PUBLIC_ATTEMPT='+str(i)+' ok='+str(ok)+' sha='+hashlib.sha256(actual).hexdigest())
              if ok:break
            except Exception as e:print('AIR_SMOKE_RETRY='+type(e).__name__)
            time.sleep(3)
          if not ok:raise SystemExit('NEW_AIR_SUPREMACY_URL_NOT_VERIFIED')
          print('AIR_SUPREMACY_PUBLIC_SEPARATE_GAME=PASS')
          for path,entry in before.items():
            with urlopen(Request(root+path,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Air-Protected-Recheck'}),timeout=25) as response:
              assert response.status==entry['status'],path
              body=response.read(200000) if entry['sha'] else None
            if entry['sha']:
              assert hashlib.sha256(body).hexdigest()==entry['sha'],'ORIGINAL_CROWN_GAME_CHANGED'
            print('AIR_PROTECTED_UNCHANGED '+path)
          PY
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          sha=$(sha256sum games/air-supremacy/index.html | awk '{print $1}')
          timeout 30s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - status '$GITHUB_RUN_ID' '$sha'" < scripts/mpw_air_supremacy_standalone_publish.py
          timeout 30s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - status '$GITHUB_RUN_ID' '$sha'" < scripts/mpw_air_supremacy_exact_route.py
      - name: Roll back ONLY newly-created game directory on smoke failure
        if: failure() && steps.install.outcome == 'success'
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          sha=$(sha256sum games/air-supremacy/index.html | awk '{print $1}')
          timeout 50s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID' '$sha'" < scripts/mpw_air_supremacy_exact_route.py
          timeout 50s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID' '$sha'" < scripts/mpw_air_supremacy_standalone_publish.py
      - name: Remove only private staged file
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-air-standalone-ssh"
          if test -f "$d/config"; then
            timeout 30s ssh -T -F "$d/config" saeit-cpanel \
              "test ! -L /home/zomorod2/.mpw-air-supremacy-stage-$GITHUB_RUN_ID.html && rm -f -- /home/zomorod2/.mpw-air-supremacy-stage-$GITHUB_RUN_ID.html" || true
          fi
