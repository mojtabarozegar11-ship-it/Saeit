name: ComfyUI NumPy CPU Import Repair Final
on:
  push:
    branches: [audit/vps-comfyui-hardware-20261014]
    paths: [.github/workflows/comfyui-numpy-import-final.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Reinstall compatible NumPy inside isolated ComfyUI venv
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/ssh"; install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 260s ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          root="$HOME/comfyui-isolated"
          python="$root/env-cpu/bin/python"
          test -x "$python" && test ! -L "$root"
          f=( "$root"/numpy-1.26.4-*.whl )
          test "${#f[@]}" -eq 1 && test -f "${f[0]}"
          test "$(stat -c %s "${f[0]}")" -gt 5000000
          free_kib="$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)"
          (( free_kib > 2000000 )) || { echo FACTORY_MEMORY_GUARD; exit 1; }
          export PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_INDEX=1 PIP_NO_CACHE_DIR=1
          export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          echo COMFY_NUMPY_COMPAT_INSTALL_START
          nice -n 15 timeout 75s "$python" -m pip install --no-index --no-deps --force-reinstall "${f[0]}"
          nice -n 15 timeout 30s "$python" -I -c 'import numpy as np;print("COMFY_NUMPY_OK="+np.__version__)'
          nice -n 15 timeout 75s "$python" -I -c 'import torch;print("COMFY_TORCH_OK="+torch.__version__);print("CUDA_AVAILABLE="+str(torch.cuda.is_available()))'
          echo COMFY_CPU_IMPORT_VERIFIED
          pidfile="$HOME/factory-runtime/operations/vps-only-loop.pid"
          if test -f "$pidfile"; then
            pid="$(cat "$pidfile")"
            if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then echo FACTORY_LOOP_ALIVE_AFTER; else echo FACTORY_LOOP_NOT_VERIFIED_AFTER; fi
          fi
          REMOTE
