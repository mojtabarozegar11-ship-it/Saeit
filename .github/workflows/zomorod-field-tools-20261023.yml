name: Zomorod field tools — guarded two tools two guides two WebPs
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-field-tools-20261023.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build and verify 2 calculators 2 guides 2 optimized WebPs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pillow
          python3 -m py_compile scripts/zomorod_field_tools_build_20261023.py scripts/zomorod_field_tools_install_20261023.py
          python3 scripts/zomorod_field_tools_build_20261023.py "$RUNNER_TEMP/zm-field-stage"
          python3 - "$RUNNER_TEMP/zm-field-stage" <<'PY'
          from pathlib import Path
          import hashlib,json,re,sys
          p=Path(sys.argv[1]);m=json.loads((p/'source-manifest.json').read_text())
          assert len(m)==6 and sum(x.endswith('.webp') for x in m)==2
          for rel,meta in m.items():
              data=(p/rel).read_bytes()
              assert hashlib.sha256(data).hexdigest()==meta['sha256']
              if rel.endswith('.html'):
                  s=data.decode()
                  assert '<html lang="fa" dir="rtl">' in s and s.count('<h1>')==1
                  assert s.count('rel="canonical"')==1 and 'alt="' in s
          for name,rel in [('irrigation','agriculture/water-soil/emitter-uniformity/index.html'),
                           ('greenhouse','agriculture/greenhouse/dewpoint-vpd/index.html')]:
              s=(p/rel).read_text()
              script=re.search(r'<script>([\s\S]*?)</script>',s)
              assert script
              (p/(name+'.js')).write_text(script.group(1))
          print('SIX_SOURCE_SHA_AND_SEO_RTL_QA_PASS')
          PY
          node --check "$RUNNER_TEMP/zm-field-stage/irrigation.js"
          node --check "$RUNNER_TEMP/zm-field-stage/greenhouse.js"
      - name: Real Chromium mobile and desktop valid and invalid interactive calculations
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || exit 1
          python3 - "$RUNNER_TEMP/zm-field-stage" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          tests={
          'irrigation':'''const g=window.fieldTool.calc([80,100,100,120],10);
            let bad=0;for(const [v,t] of [[[0,0,0,0],10],[[-1,2,3,4],10],[[1,2,3],10],[[1,2,3,4],0]]){try{window.fieldTool.calc(v,t)}catch(e){bad++}}
            document.querySelector('form').requestSubmit();
            const form=document.getElementById('result').textContent.includes('۹۰');
            document.getElementById('volumes').value='-1 2 3 4';document.querySelector('form').requestSubmit();
            const invalid=document.getElementById('result').classList.contains('error');
            const ok=Math.abs(g.du-80)<.001&&Math.abs(g.cu-90)<.001&&Math.abs(g.flow-.6)<.001&&bad===4&&form&&invalid;
            document.body.setAttribute('data-qa',ok?'pass':'fail');''',
          'greenhouse':'''const g=window.fieldTool.calculate(25,60,16),dry=window.fieldTool.calculate(25,60,20);
            let bad=0;for(const args of [[25,0,16],[25,101,16],[100,60,16],[25,60,-20]]){try{window.fieldTool.calculate(...args)}catch(e){bad++}}
            document.querySelector('form').requestSubmit();
            const form=document.getElementById('result').textContent.includes('VPD');
            document.getElementById('rh').value='0';document.querySelector('form').requestSubmit();
            const invalid=document.getElementById('result').classList.contains('error');
            const ok=Math.abs(g.dew-16.7)<.4&&Math.abs(g.vpd-1.27)<.05&&g.risk&&!dry.risk&&bad===4&&form&&invalid;
            document.body.setAttribute('data-qa',ok?'pass':'fail');'''
          }
          for name,rel in [('irrigation','agriculture/water-soil/emitter-uniformity/index.html'),
                           ('greenhouse','agriculture/greenhouse/dewpoint-vpd/index.html')]:
              s=(p/rel).read_text()
              injection='<script>setTimeout(()=>{try{'+tests[name]+'}catch(e){document.body.setAttribute("data-qa","error");document.body.setAttribute("data-qa-error",e.message)}},40);</script>'
              (p/(name+'-qa.html')).write_text(s.replace('</body>',injection+'</body>'))
          PY
          for type in irrigation greenhouse; do
            for size in 420,900 1200,900; do
              timeout 40s "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
                --no-first-run --disable-background-networking --touch-events=enabled \
                --window-size="$size" --virtual-time-budget=1500 \
                --user-data-dir="$RUNNER_TEMP/profile-$type-$size" \
                --dump-dom "file://$RUNNER_TEMP/zm-field-stage/$type-qa.html" \
                > "$RUNNER_TEMP/qa-$type-$size.html" 2> "$RUNNER_TEMP/qa-$type-$size.err"
              if ! grep -Fq 'data-qa="pass"' "$RUNNER_TEMP/qa-$type-$size.html"; then
                echo "REAL_BROWSER_FAILED=$type $size"
                grep -o 'data-qa-error="[^"]*"' "$RUNNER_TEMP/qa-$type-$size.html" | tail -n 1 || true
                tail -n 10 "$RUNNER_TEMP/qa-$type-$size.err" || true
                exit 1
              fi
              echo "REAL_CHROME_VALID_INVALID_FORM_PASS $type $size"
            done
          done
      - name: Fingerprint-pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Acquire cPanel shared lock and versioned backup of all affected pages
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          target="/home/zomorod2/.zm-field-release-$GITHUB_RUN_ID.py"
          timeout 65s scp -q -F "$d/config" scripts/zomorod_field_tools_install_20261023.py "host:$target"
          timeout 75s ssh -T -F "$d/config" host "RELEASE_COMMIT='$GITHUB_SHA' python3 '$target' prepare '$GITHUB_RUN_ID'"
      - name: Stage six files privately and rehearse rollback
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          b="/home/zomorod2/.backups/zomorod-field-tools-20261023/$GITHUB_RUN_ID"
          tar -cf - -C "$RUNNER_TEMP/zm-field-stage" agriculture source-manifest.json |
            timeout 110s ssh -T -F "$d/config" host "tar -xf - -C '$b/stage'"
          target="/home/zomorod2/.zm-field-release-$GITHUB_RUN_ID.py"
          timeout 75s ssh -T -F "$d/config" host "python3 '$target' stage '$GITHUB_RUN_ID'"
      - name: Install six new files and two category cards with SHA protection
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          target="/home/zomorod2/.zm-field-release-$GITHUB_RUN_ID.py"
          timeout 100s ssh -T -F "$d/config" host "python3 '$target' apply '$GITHUB_RUN_ID'"
          timeout 65s ssh -T -F "$d/config" host "python3 '$target' verify '$GITHUB_RUN_ID'"
      - name: External no-cache HTTP 200 SHA256 of all files and legacy routes
        id: public
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/zm-field-stage" "$GITHUB_RUN_ID" <<'PY'
          import hashlib,json,sys,urllib.request
          from pathlib import Path
          p=Path(sys.argv[1]);rid=sys.argv[2]
          m=json.loads((p/'source-manifest.json').read_text())
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ZomorodExternalQA/2'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert r.status==200,(url,r.status)
                  return r.read(300000)
          for rel,meta in m.items():
              u=meta['url']+'?release='+rid
              assert hashlib.sha256(get(u)).hexdigest()==meta['sha256'],u
              print('EXTERNAL_PUBLIC_200_SHA256_PASS',u)
          for cat,needles in {
              'agriculture/water-soil/':['emitter-uniformity/','emitter-uniformity-guide/','irrigation-uniformity.webp'],
              'agriculture/greenhouse/':['dewpoint-vpd/','dewpoint-vpd-guide/','greenhouse-dewpoint.webp']
          }.items():
              s=get('https://zomorodmelal.ir/'+cat+'?release='+rid).decode('utf-8')
              assert 'ZM-AGRICULTURE-TOOLS-20261023-B' in s
              for n in needles:assert n in s,(cat,n)
              print('EXTERNAL_CARD_IMAGE_LINK_PASS',cat)
          for rel in ('','agriculture/','games/','games/water-path/','games/air-supremacy/',
              'games/seed-guardian/','agriculture/water-soil/irrigation-planner/',
              'agriculture/greenhouse/ventilation-estimator/',
              'agriculture/water-soil/research-lab-20261023/',
              'agriculture/water-soil/irrigation-need.html',
              'agriculture/seeds/seeding-rate.html',
              'agriculture/greenhouse/planting-planner/',
              'agriculture/livestock/feed-dry-matter/','agriculture/digital-lab/'):
              get('https://zomorodmelal.ir/'+rel+'?protected='+rid)
              print('PRESERVED_PUBLIC_200',rel or '/')
          print('SIX_PUBLIC_HASHES_TWO_CARDS_FOURTEEN_PROTECTED_ROUTES_PASS')
          PY
      - name: Persist live-verified private receipt and release lock
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          target="/home/zomorod2/.zm-field-release-$GITHUB_RUN_ID.py"
          timeout 70s ssh -T -F "$d/config" host "python3 '$target' finalize '$GITHUB_RUN_ID'"
      - name: Exact SHA guarded rollback on failure
        if: failure() && steps.prepare.outcome == 'success' && steps.finalize.outcome != 'success'
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          target="/home/zomorod2/.zm-field-release-$GITHUB_RUN_ID.py"
          if test -f "$d/config";then timeout 130s ssh -T -F "$d/config" host "python3 '$target' rollback '$GITHUB_RUN_ID'";fi
      - name: Scrub credentials and temporary installer, retain versioned backup
        if: always()
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          target="/home/zomorod2/.zm-field-release-$GITHUB_RUN_ID.py"
          if test -f "$d/config";then timeout 35s ssh -T -F "$d/config" host "rm -f -- '$target'" || true;fi
          rm -rf "$d" "$RUNNER_TEMP/zm-field-stage"
