name: One-time production redirects for three legacy Zomorod routes
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - .github/workflows/live-zm-legacy-redirect-release-20261105.yml
      - scripts/live_zm_legacy_routes_release_20261105.py
permissions:
  contents: read
concurrency:
  group: zm-legacy-redirect-release-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile bounded release script
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_zm_legacy_routes_release_20261105.py
      - name: Connect to pinned cPanel using the existing VPS relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-legacy-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_PINNED_CPANEL_VIA_VPS'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_PINNED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Preview exact SHA and Apache rewrite anchors
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-legacy-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/live_zm_legacy_routes_release_20261105.py
      - name: Atomically publish scoped 301 routes with private rollback copy
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 85s ssh -T -F "$RUNNER_TEMP/zm-legacy-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/live_zm_legacy_routes_release_20261105.py
      - name: Verify all three old paths permanently redirect to healthy live pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          pairs = [('/auction/', '/auctions/'),
                   ('/economic-reports/', '/economy/'),
                   ('/ai/', '/agents/')]
          opener = build_opener(NoRedirect())
          for old, new in pairs:
              src = 'https://zomorodmelal.ir' + old
              try:
                  response = opener.open(Request(src), timeout=20)
              except HTTPError as error:
                  response = error
              if response.code != 301:
                  raise RuntimeError('LEGACY_NOT_301:' + old + ':' + str(response.code))
              location = response.headers.get('Location', '')
              if location not in (new, 'https://zomorodmelal.ir' + new):
                  raise RuntimeError('LEGACY_TARGET_CHANGED:' + old)
              with urlopen('https://zomorodmelal.ir' + new, timeout=20) as target:
                  if target.status != 200:
                      raise RuntimeError('DESTINATION_NOT_200:' + new)
              print('VERIFIED_301=' + old + '=>' + new)
          PY
      - name: Roll back route rewrite if the public verification failed
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 85s ssh -T -F "$RUNNER_TEMP/zm-legacy-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/live_zm_legacy_routes_release_20261105.py
