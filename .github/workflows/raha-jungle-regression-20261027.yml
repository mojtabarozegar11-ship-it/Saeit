name: Super Jungle Run progress regression (non-deploy)
on:
  pull_request:
    branches: [games/hourly-20261026-focus-safety]
    paths:
      - 'templates/studio_raha/index.html'
      - 'templates/taniya_studio/index.html'
      - 'tests/game/studio-active-game-regressions.cjs'
      - '.github/workflows/raha-jungle-regression-20261027.yml'
permissions:
  contents: read
jobs:
  jungle-and-cake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse active studio games without deploying
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name,path in [('raha','templates/studio_raha/index.html'),('taniya','templates/taniya_studio/index.html')]:
              source=Path(path).read_text('utf-8')
              assert source.count('<script>') == 1
              Path('/tmp/'+name+'-studio.js').write_text(source.split('<script>',1)[1].split('</script>',1)[0], 'utf-8')
          PY
          node --check /tmp/raha-studio.js
          node --check /tmp/taniya-studio.js
      - name: Execute real Jungle Run and Cake Maker regressions
        run: node tests/game/studio-active-game-regressions.cjs
