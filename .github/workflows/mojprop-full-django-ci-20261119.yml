name: MOJ PROP full Django CI

on:
  push:
    branches:
      - feature/mojprop-simulation-policy-v2-20261119
  pull_request:
    branches:
      - feature/mojprop-demo-reconciliation-20261119
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojprop-full-django-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-django:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install hash-pinned PDF parser in isolated target
        run: |
          parser="$RUNNER_TEMP/mpw-pdf-parser"
          install -d -m 700 "$parser"
          python -m pip install --no-deps --require-hashes --target "$parser" -r .github/requirements/mpw-pdf-parser-ci.txt
      - name: Django deployment checks
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy
      - name: Build static manifest
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py collectstatic --noinput
      - name: Pin C136 reviewed source refs
        run: |
          main_sha="$(git rev-parse origin/main)"
          prop_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "${#main_sha}" -eq 40
          test "${#prop_sha}" -eq 40
          echo "C136_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          echo "C136_PROP_SHA=$prop_sha" >> "$GITHUB_ENV"
      - name: Run full Django tests
        env:
          PYTHONPATH: ${{ github.workspace }}/tests:${{ runner.temp }}/mpw-pdf-parser
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: pytest -q
      - name: Apply migrations to CI database
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py migrate --noinput
      - name: Verify production readiness
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py production_gate
