name: Read-only independent six master agent task proof
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/master-six-native-readonly-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-master-six-independent-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Verify existing private factory master without modifying files or DB
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          folder="$RUNNER_TEMP/master-six-readonly"
          install -d -m 700 "$folder"
          trap 'rm -rf -- "$folder"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.buffer.read().decode("utf8");s=s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n";sys.stdout.buffer.write(s.encode())' > "$folder/key"
          chmod 600 "$folder/key"
          ssh-keygen -y -P "" -f "$folder/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$folder/known" 2>/dev/null
          test "$(ssh-keygen -lf "$folder/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -T -i "$folder/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$folder/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -x "$base/.venv/bin/python"
          test -f "$base/django-app/manage.py"
          test -s "$base/operations/master-agent/run-native-qa.sh"
          mastercount="$(crontab -l | grep -c SAEIT_MASTER_AGENT_V1)"
          nativecount="$(crontab -l | grep -c SAEIT_MASTER_NATIVE_QA_BRIDGE_V1)"
          reviewcount="$(crontab -l | grep -c SAEIT_SIX_NATIVE_INDEPENDENT_REVIEW_V1)"
          test "$mastercount" -eq 2 && test "$nativecount" -eq 1 && test "$reviewcount" -eq 1
          echo NATIVE_INDEPENDENT_MASTER_ORIGINAL_CRON=2
          echo NATIVE_INDEPENDENT_MASTER_BRIDGE_CRON=1
          echo NATIVE_INDEPENDENT_REVIEWER_CRON=1
          cd "$base/django-app"
          export DJANGO_SETTINGS_MODULE=config.settings SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          "$base/.venv/bin/python" -B - <<'PY'
          import django
          django.setup()
          from pathlib import Path
          from core.factory_native_review_gateway import latest_snapshot,snapshot,digest
          from core.models import Agent,AgentTask,AuditLog
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          source=latest_snapshot(root)
          print("MASTER_NATIVE_READONLY_CURRENT_SOURCE_RUN="+source)
          review=snapshot(root,source)
          assert review["reviewed_families"]==6 and review["verified_native_candidate_files"]==56
          assert review["completed_professional_quality_1000_certifications"]==0
          agent=Agent.objects.get(code="moj_1ro_1",active=True)
          economic=Agent.objects.get(code="economic-master-agent",active=True)
          assert not economic.capabilities.filter(code="factory_native_review",active=True).exists()
          assert set(agent.capabilities.filter(active=True).values_list("code",flat=True))=={"factory_native_review"}
          assert agent.capabilities.filter(code="factory_native_review",active=True,risk_level="low").count()==1
          tasks=list(AgentTask.objects.filter(agent=agent,action_type="factory_native_review",input_data__source_run=source).order_by("pk"))
          assert len(tasks)==6
          assert {t.input_data["family"] for t in tasks}=={"F12","F13","F14","F16","F17","F26"}
          assert all(t.status=="completed" and t.execution_id and t.output_data.get("verified_effect") is True
              and t.output_data.get("quality_1000_certified") is False and
              t.output_data.get("commercial_release") is False and t.output_data.get("website_mutations")==0
              for t in tasks)
          count=AuditLog.objects.filter(actor_type="agent",actor_id=str(agent.pk),target_type="AgentTask",action="tool_invocation_completed",
              target_id__in=[str(t.pk) for t in tasks]).count()
          assert count>=6
          digest_proof=digest(root/"quality-excellence/six-native-rework"/source/"review.json")
          assert all(t.input_data["review_sha256"]==digest_proof for t in tasks)
          assert all(t.output_data["source_review_sha256"]==digest_proof for t in tasks)
          print("MASTER_NATIVE_READONLY_PERSISTED_TASKS=6")
          print("MASTER_NATIVE_READONLY_INDEPENDENT_AUDITS="+str(count))
          print("MASTER_NATIVE_READONLY_NATIVE_FILES=56")
          print("MASTER_NATIVE_READONLY_REVIEW_SHA256="+digest_proof)
          print("MASTER_NATIVE_READONLY_PROFESSIONAL_CERTIFICATIONS=0")
          print("MASTER_NATIVE_READONLY_PUBLIC_RELEASES=0")
          print("MASTER_NATIVE_READONLY_REAL_AGENT_ID="+agent.code)
          print("MASTER_NATIVE_MOJ1RO1_INDEPENDENT_REGISTERED_ACTOR=PASS")
          PY
          echo MASTER_NATIVE_READONLY_NO_SERVER_CHANGES=PASS
          REMOTE
