name: C03 VPS private factory read-only inventory (no tests, no writes)
on:
  push:
    branches:
      - ops/c03-vps-readonly-20261102-2305
    paths:
      - .github/workflows/c03-vps-readonly-inventory-20261102.yml
permissions:
  contents: read
concurrency:
  group: c03-vps-readonly-20261102
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect private VPS only (no checkout, test, deployment, backup or mutation)
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/c03-private-inventory"
          mkdir -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          test -n "$VPS_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          actual="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          echo "C03_PINNED_HOST_KEY=VERIFIED"
          opts=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          timeout 160s ssh -T "${opts[@]}" githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "C03_SNAPSHOT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "C03_REMOTE_USER=$(id -un)"
          echo "C03_REMOTE_HOST=$(hostname)"
          echo "C03_DISK_KB"; df -Pk /home
          echo "C03_INODES"; df -Pi /home
          echo "C03_MEMORY_MB"; free -m | head -2
          echo "C03_LOAD"; cat /proc/loadavg
          base="$HOME/factory-runtime"
          for path in "$base" "$base/operations" "$base/private/autonomous-product-cycle" "$base/private/autonomous-product-cycle/generated-product-recipes"; do
            if [ -d "$path" ] && [ ! -L "$path" ]; then
              echo "C03_DIRECTORY_PRESENT=${path#"$HOME"/}"
            else
              echo "C03_DIRECTORY_MISSING_OR_LINK=${path#"$HOME"/}"
            fi
          done
          echo "C03_FACTORY_PROCESS_NAMES_AND_COUNTS"
          ps -eo comm= | sort | uniq -c | grep -Ei 'python|cron|supervisor|celery|factory|worker' || true
          echo "C03_USER_CRON_FACTORY_ENTRY_COUNT"
          (crontab -l 2>/dev/null || true) | grep -Eic 'factory|autonomous-product|ten-generation' || true
          echo "C03_CRON_ACTIVE_AND_QUEUE_CANDIDATES"
          python3 - <<'PY'
          import hashlib,re,subprocess
          from pathlib import Path
          p=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=8)
          matches=[s.strip() for s in p.stdout.splitlines() if re.search(r"factory|autonomous-product|ten-generation",s,re.I)]
          active=[s for s in matches if s and not s.startswith("#")]
          print("C03_CRON_MATCHED_ALL="+str(len(matches)))
          print("C03_CRON_ACTIVE_FACTORY="+str(len(active)))
          print("C03_CRON_COMMENTED_FACTORY="+str(len(matches)-len(active)))
          for s in active[:30]:
              digest=hashlib.sha256(s.encode()).hexdigest()[:16]
              names=re.findall(r"(?:factory|autonomous)[A-Za-z0-9_.-]*[.](?:py|sh|service)",s,re.I)
              print("C03_CRON_ENTRY="+digest+":"+(",".join(names[:3]) or "UNCLASSIFIED")+":LIMIT2="+str(bool(re.search(r"--limit[ ]+2(?:[ ]|$)",s))))
          base=Path.home()/"factory-runtime"
          for folder in (base/"operations",base/"private"/"autonomous-product-cycle"):
              try:
                  for x in sorted(folder.iterdir()):
                      if x.is_symlink(): continue
                      if re.search(r"queue|state|status|receipt|hold|stop|lock|checkpoint",x.name,re.I):
                          print("C03_STATE_CANDIDATE="+x.name+":"+("directory" if x.is_dir() else "file"))
              except OSError as e:
                  print("C03_STATE_LIST_ERROR="+type(e).__name__)
          PY
          echo "C03_STATE_JSON_METADATA_ONLY"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path.home()/"factory-runtime"/"private"/"autonomous-product-cycle"
          for name in ("production-state.json","designer-state.json","build-50-status.json"):
              p=base/name
              if not p.is_file() or p.is_symlink():
                  print("C03_STATE_FILE_ABSENT="+name)
                  continue
              try:
                  raw=p.read_bytes()
                  if len(raw)>4000000: raise ValueError("oversized")
                  d=json.loads(raw)
                  print("C03_STATE_JSON_FILE="+name+":sha256="+hashlib.sha256(raw).hexdigest()+":bytes="+str(len(raw)))
                  if not isinstance(d,dict):
                      print("C03_STATE_JSON_NONOBJECT="+name)
                      continue
                  print("C03_STATE_JSON_KEYS="+name+":"+(",".join(sorted(d)[:35])))
                  for k in ("active_product_count","active_count","in_progress_count","current_product","active_product","active_products","queue","queue_items","status","state","hold","stop"):
                      if k not in d: continue
                      v=d[k]
                      if isinstance(v,(list,dict)): print("C03_STATE_FIELD="+name+":"+k+":type="+type(v).__name__+":length="+str(len(v)))
                      elif isinstance(v,(int,float,bool)): print("C03_STATE_FIELD="+name+":"+k+":value="+str(v))
                      else: print("C03_STATE_FIELD="+name+":"+k+":type="+type(v).__name__)
              except (OSError,ValueError) as e:
                  print("C03_STATE_READ_FAILED="+name+":"+type(e).__name__)
          for dirname in ("global-premium-quality-receipts",):
              p=base/dirname
              if p.is_dir() and not p.is_symlink():
                  print("C03_RECEIPT_DIRECTORY_ENTRY_COUNT="+dirname+":"+str(sum(1 for _ in p.iterdir())))
          holds=Path.home()/"factory-runtime"/"operations"/"holds"
          if holds.is_dir() and not holds.is_symlink():
              print("C03_HOLDS_DIRECTORY_ENTRY_COUNT="+str(sum(1 for _ in holds.iterdir())))
              for p in sorted(holds.iterdir())[:25]:
                  if not p.is_symlink(): print("C03_HOLD_ENTRY="+p.name)
          PY
          echo "C03_SYSTEM_TIMER_FACTORY_ENTRY_COUNT"
          (systemctl list-timers --all --no-pager --no-legend 2>/dev/null || true) | grep -Eic 'factory|autonomous|generation' || true
          echo "C03_LOCK_OBSERVATIONS"
          (lslocks -n -o PATH,PID,COMMAND 2>/dev/null || true) | grep -Ei 'factory-runtime|autonomous-product' | head -25 || true
          echo "C03_LOCK_FILES_PRESENT"
          for p in "$base/operations/autonomous-product-cycle.lock" "$base/private/autonomous-product-cycle/.production-cycle.lock"; do
            if [ -f "$p" ] && [ ! -L "$p" ]; then echo "PRESENT:${p#"$HOME"/}"; else echo "ABSENT:${p#"$HOME"/}"; fi
          done
          echo "C03_HOLD_MARKER_NAMES"
          if [ -d "$base/operations" ]; then
            find "$base/operations" -maxdepth 2 -type f \( -iname '*hold*' -o -iname '*stop*' \) -printf '%f\n' 2>/dev/null | head -20
          fi
          echo "C03_ACTIVE_PRODUCT_COUNT=UNVERIFIED_WITHOUT_AUTHORITATIVE_QUEUE_RECEIPT"
          echo "C03_LATEST_QC_VERIFIED=UNVERIFIED_WITHOUT_AUTHORITATIVE_RECEIPT"
          echo "C03_LATEST_DELIVERY=UNVERIFIED_WITHOUT_AUTHORITATIVE_RECEIPT"
          echo "C03_INDEPENDENT_RESTORE=UNVERIFIED_WITHOUT_OFFHOST_RESTORE_EVIDENCE"
          echo "C03_FACTORY_START_PERFORMED=NO"
          REMOTE
