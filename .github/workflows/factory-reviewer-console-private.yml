name: Private independent expert reviewer console - verify and install
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/factory-reviewer-console-private.yml"
      - "scripts/factory_quality_reviewer_console_v1.py"
      - "scripts/factory_quality_signed_approval_v1.py"
      - "tests/test_factory_quality_reviewer_console_v1.py"
      - "tests/test_factory_quality_signed_approval_v1.py"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: factory-private-reviewer-console-v1
  cancel-in-progress: false
jobs:
  test-enrollment-and-deploy-private-console:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test reviewer enrollment and signed owner trust
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_quality_reviewer_console_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_quality_signed_approval_v1.py -v
          python3 -B -m py_compile scripts/factory_quality_reviewer_console_v1.py scripts/factory_quality_signed_approval_v1.py
          echo FACTORY_VERIFIED_REVIEWER_ONBOARDING_TESTS=PASS
      - name: Pinned VPS private console install; no keys, no public release
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/reviewer-console"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          stage="/home/githubops/factory-runtime/operations/.reviewer-console-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -T "${opts[@]}" githubops@178.239.147.150 "set -eu; test \"\$(id -un)\" = githubops; umask 077; test ! -e '$stage'; mkdir -m 700 '$stage'"
          scp -q "${opts[@]}" scripts/factory_quality_reviewer_console_v1.py githubops@178.239.147.150:"$stage/console.py"
          scp -q "${opts[@]}" scripts/factory_quality_signed_approval_v1.py githubops@178.239.147.150:"$stage/checker.py"
          console_sha="$(sha256sum scripts/factory_quality_reviewer_console_v1.py | awk '{print $1}')"
          checker_sha="$(sha256sum scripts/factory_quality_signed_approval_v1.py | awk '{print $1}')"
          timeout 90s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B - "$stage" "$console_sha" "$checker_sha" <<'PY'
          import hashlib,os,sys,fcntl,subprocess,json
          from pathlib import Path
          stage,console_hash,checker_hash=sys.argv[1:]
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          assert root.is_dir() and not root.is_symlink()
          workspace=root/"quality-reviewer-console"
          assert not workspace.is_symlink()
          workspace.mkdir(mode=0o700,exist_ok=True)
          os.chmod(workspace,0o700)
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          with (workspace/".deployment-lock").open("a+b") as lock:
              fcntl.flock(lock.fileno(),fcntl.LOCK_EX)
              for filename,expected,target in (
                  ("console.py",console_hash,"factory_quality_reviewer_console_v1.py"),
                  ("checker.py",checker_hash,"factory_quality_signed_approval_v1.py")):
                  source=Path(stage)/filename
                  dest=workspace/target
                  assert source.is_file() and not source.is_symlink()
                  assert sha(source)==expected and not dest.is_symlink()
                  if dest.exists():
                      assert dest.is_file(),"EXISTING_CONSOLE_FILE_INVALID"
                      old_hash=sha(dest)
                      if old_hash!=expected:
                          # Immutable, private backup of the previous reviewed executable.
                          archives=workspace/"versioned-backups"/old_hash
                          assert not archives.is_symlink()
                          archives.mkdir(parents=True,mode=0o700,exist_ok=True)
                          os.chmod(archives,0o700)
                          backup=archives/target
                          if not backup.exists():
                              with backup.open("xb") as f:
                                  f.write(dest.read_bytes());f.flush();os.fsync(f.fileno())
                              os.chmod(backup,0o600)
                          assert backup.is_file() and not backup.is_symlink() and sha(backup)==old_hash
                  if not dest.exists() or sha(dest)!=expected:
                      # Verify exact uploaded bytes before an atomic code-only replacement.
                      staged=workspace/(".next-"+target+"-"+expected[:16])
                      assert not staged.exists() and not staged.is_symlink()
                      with staged.open("xb") as f:
                          f.write(source.read_bytes());f.flush();os.fsync(f.fileno())
                      os.chmod(staged,0o600)
                      assert sha(staged)==expected
                      os.replace(staged,dest)
                  assert sha(dest)==expected
          print("VPS_PRIVATE_REVIEWER_CONSOLE_INSTALLED=PASS")
          print("VPS_REVIEWER_CONSOLE_INSTALL_SHA256="+console_hash)
          proc=subprocess.run([sys.executable,"-B",str(workspace/"factory_quality_reviewer_console_v1.py"),
                                "status","--workspace",str(workspace)],
                              capture_output=True,text=True,timeout=20,check=True)
          info=json.loads(proc.stdout)
          assert info["commercial_release_allowed_by_console"] is False
          print("VPS_REVIEWER_CONSOLE_ACTUAL_REGISTERED="+str(info["trusted_reviewer_count"]))
          print("VPS_GENUINE_EXPERT_SIGNATURES_CREATED=0")
          print("VPS_REVIEWER_CONSOLE_PUBLIC_INTERNET_EXPOSURE=NONE")
          PY
          ssh -T "${opts[@]}" githubops@178.239.147.150 "set -eu; rm -f -- '$stage/console.py' '$stage/checker.py'; rmdir -- '$stage'"
