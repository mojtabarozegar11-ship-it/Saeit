name: Verify active paid-purchase event listener on cPanel

on:
  push:
    branches: [feature/evidence-led-business-os-20261022]
    paths:
      - '.github/workflows/business-os-paid-release.yml'
      - 'scripts/business_os_purchase_cpanel_release.sh'
      - 'scripts/business_os_patch_app_config.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-os-paid-release
  cancel-in-progress: false

jobs:
  guarded-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package only payment event subscriber modules
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/business_os_purchase_cpanel_release.sh
          tar -czf "$RUNNER_TEMP/paid-purchase.tgz" \
            scripts/business_os_purchase_cpanel_release.sh \
            scripts/business_os_patch_app_config.py \
            core/business_management.py \
            core/business_scientist.py \
            core/management/commands/business_operating_review.py \
            core/purchase_event.py \
            core/purchase_signals.py
          echo PURCHASE_RELEASE_PACKAGE_READY

      - name: Verify public sites before production change
        shell: bash
        run: |
          set -euo pipefail
          for site in https://mojplaywin.com/ https://zomorodmelal.ir/; do
            curl -fLsS --max-time 20 --retry 2 --retry-delay 2 -o /dev/null "$site"
          done
          echo PURCHASE_RELEASE_BASELINE_SITES_HEALTHY

      - name: Verify active Django signal subscription, read-only
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          stage_name="business-os-paid-$(git rev-parse --short=12 HEAD)"
          stage_root="$RUNNER_TEMP/paid-purchase-ssh"
          mkdir -p "$stage_root"
          printf '%s\n' "$VPS_KEY" > "$stage_root/vps.key"
          printf '%s\n' "$HOST_KEY" > "$stage_root/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$stage_root/host.known"
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"paid-purchase-ssh/host.key"; s=p.read_text().replace(chr(13)+chr(10),chr(10)).strip(); p.write_text(s.replace(chr(92)+"n",chr(10))+chr(10))'
          chmod 600 "$stage_root/"*
          ssh-keygen -y -P "" -f "$stage_root/vps.key" > /dev/null
          ssh-keygen -y -P "" -f "$stage_root/host.key" > /dev/null
          cat > "$stage_root/config" <<EOF
          Host business-os-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $stage_root/vps.key
            StrictHostKeyChecking yes
            UserKnownHostsFile $stage_root/vps.known
          Host business-os-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $stage_root/host.key
            UserKnownHostsFile $stage_root/host.known
            ProxyJump business-os-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$stage_root/vps.known"
          test "$(ssh-keygen -lf "$stage_root/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          timeout 30s ssh -F "$stage_root/config" business-os-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$stage_root/host.candidate"
          test "$(ssh-keygen -lf "$stage_root/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$stage_root/host.candidate" "$stage_root/host.known"
          archive="$RUNNER_TEMP/paid-purchase.tgz"
          stage_host="/home/zomorod2/Saeit-staging/releases/$stage_name"
          local_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
          timeout 35s ssh -F "$stage_root/config" business-os-cpanel \
            "test -d /home/zomorod2/Saeit-staging && mkdir -p '$stage_host'"
          timeout 60s ssh -F "$stage_root/config" business-os-cpanel \
            "cat > '$stage_host/bundle.tgz'" < "$archive"
          remote_sha="$(timeout 30s ssh -F "$stage_root/config" business-os-cpanel \
            "sha256sum '$stage_host/bundle.tgz'" | cut -d ' ' -f1)"
          test "$local_sha" = "$remote_sha"
          timeout 45s ssh -F "$stage_root/config" business-os-cpanel \
            "cd '$stage_host' && tar -tzf bundle.tgz > /dev/null && ! tar -tzf bundle.tgz | grep -Eq '(^/|(^|/)\.\.(/|$))' && tar -xzf bundle.tgz && bash -n scripts/business_os_purchase_cpanel_release.sh"
          echo PURCHASE_RELEASE_PRIVATE_STAGE_CHECKSUM_VERIFIED
          timeout 90s ssh -F "$stage_root/config" business-os-cpanel \
            "cd '$stage_host' && bash scripts/business_os_purchase_cpanel_release.sh --probe"
          timeout 60s ssh -F "$stage_root/config" business-os-cpanel \
            "cd '$stage_host' && bash scripts/business_os_purchase_cpanel_release.sh --verify-active"
          echo PURCHASE_ACTIVE_VERIFICATION_READ_ONLY
      - name: Clear runner-only SSH key copies
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/paid-purchase-ssh"; then
            find "$RUNNER_TEMP/paid-purchase-ssh" -maxdepth 1 -type f -exec shred -u {} +
          fi
