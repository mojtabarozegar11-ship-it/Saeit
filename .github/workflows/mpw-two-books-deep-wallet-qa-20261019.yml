name: MojPlayWin two-book live guarded payments and dashboard diagnostic
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-two-books-deep-wallet-qa-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Diagnose crypto RPC, ebook validation and admin wiring without transactions
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 180s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json,pathlib,ast,re,hashlib
          r=pathlib.Path('/home/zomorod2/Saeit-staging');sys.path.insert(0,str(r));os.chdir(r)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django;django.setup()
          from django.conf import settings
          from core.models import Product
          report={}
          for sub in ('config/settings.py','mpw_commerce/models.py','mpw_commerce/product_checkout_page.py',
             'mpw_commerce/checkout_views.py','mpw_commerce/invoicing.py',
             'mpw_commerce/auto_reconcile.py','mpw_commerce/settlement.py',
             'mpw_commerce/price_oracle.py','mpw_commerce/buyer_wallets.py',
             'mpw_commerce/downloads.py','mpw_native_checkout/wallet_ownership.py',
             'command_center/views.py','command_center/urls.py'):
            path=r/sub
            if not path.is_file() or path.is_symlink():
              report[sub]={'present':False};continue
            txt=path.read_text('utf8','replace');node=ast.parse(txt)
            funcs=[n.name for n in node.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))]
            refs=sorted(set(re.findall(r'(?:MPW_COMMERCE_|MPW_NATIVE_|MPW_CRYPTO_|ETH_|TRON_|TRX_|USDT_|RPC_|PAYMENT_)[A-Z_0-9]+',txt)))
            report[sub]={'present':True,'bytes':len(txt),'functions':funcs[:45],'setting_refs':refs[:100],
                         'has_merchant_proof_validation':'proven_assets' in txt or 'MerchantWalletProof' in txt,
                         'has_asset_check':'private_file' in txt or 'quality_approved' in txt}
          vals=[]
          for k in sorted(dir(settings)):
            if re.search(r'(MPW_COMMERCE|MPW_NATIVE|TRON|TRX|ETHEREUM|RPC|ORACLE|PAYMENT)',k,re.I) and not k.startswith('_'):
              v=getattr(settings,k,None)
              vals.append({'key':k,'type':type(v).__name__,'set':v not in ('',None,False,{},[]),'boolean_true':v is True if isinstance(v,bool) else None})
          report['setting_inventory']=vals[:140]
          from mpw_commerce.downloads import _private_file
          from types import SimpleNamespace
          books=[]
          for pk in (72,225):
            p=Product.objects.get(pk=pk)
            row={'id':pk,'meta_keys':sorted((p.metadata or {}).keys())}
            try:
              f=_private_file(SimpleNamespace(product=p))
              row['private_file_readable']=True;row['bytes']=f.stat().st_size
              row['pdf_header']=f.open('rb').read(5)==b'%PDF-'
              row['filename_matches_id']=f.name==str(pk)+'.pdf'
              try:
                from pypdf import PdfReader
                doc=PdfReader(str(f),strict=True)
                row['page_count']=len(doc.pages)
                row['encrypted']=doc.is_encrypted
              except ImportError:
                try:
                  from PyPDF2 import PdfReader
                  doc=PdfReader(str(f),strict=True)
                  row['page_count']=len(doc.pages)
                  row['encrypted']=doc.is_encrypted
                except Exception as ex:row['pdf_parse_error']=type(ex).__name__
              except Exception as ex:row['pdf_parse_error']=type(ex).__name__
            except Exception as ex:row['private_file_readable']=False;row['error']=type(ex).__name__
            books.append(row)
          report['file_integrity']=books
          print('MPW_DEEP_PAYMENT_REPORT='+json.dumps(report,ensure_ascii=False,default=str,sort_keys=True))
          PY
          BASH
