name: Publish Zomorod Django agriculture pages safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-app-pages-deploy.yml"
      - "config/urls.py"
      - "config/settings.py"
      - "passenger_wsgi.py"
      - "core/middleware.py"
      - "core/models.py"
      - "core/newsletter_models.py"
      - "core/blog_models.py"
      - "core/company_inquiry_models.py"
      - "core/company_activity_models.py"
      - "core/economic_trade_models.py"
      - "core/views.py"
      - "core/*.py"
      - "config/*.py"
      - "command_center/*.py"
      - "core/company_content_models.py"
      - "core/zomorod_public_views.py"
      - "core/services_views.py"
      - "core/seo_views.py"
      - "core/templates/base.html"
      - "core/templates/core/services.html"
      - "core/templates/core/platform_page.html"
      - "core/management/commands/knowledge_agent_generate.py"
      - "core/tests/test_zomorod_public_pages.py"
      - "core/tests/test_seo_sitemap.py"
      - "public/agriculture/**"
      - "core/static/site/heroes/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-django-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate managed agriculture pages and app source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          pages=sorted(Path("public/agriculture").rglob("index.html"))
          if len(pages) != 15:
              raise SystemExit(f"Expected 15 agriculture pages, found {len(pages)}")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=False; self.h1=False; self.rtl=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="html": self.rtl=a.get("lang")=="fa" and a.get("dir")=="rtl"
                  if tag=="title": self.title=True
                  if tag=="h1": self.h1=True
          for page in pages:
              source=page.read_text(encoding="utf-8"); check=Check(); check.feed(source)
              if "<!-- saeit-zomorod-agriculture-v1 -->" not in source or not all((check.title,check.h1,check.rtl)):
                  raise SystemExit(f"Invalid page: {page}")
          print("AGRICULTURE_PAGES=15")
          PY
          python -m compileall -q passenger_wsgi.py config core command_center
      - name: Prepare pinned VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-app"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Verify root mapping and recover prior unverified generation
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-app"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'PREFLIGHT'
          set -euo pipefail
          sha="$1"
          htaccess="$HOME/public_html/.htaccess"
          app="$HOME/Saeit"
          root="$HOME/public_html"
          test -f "$htaccess" && test -f "$app/manage.py"
          audit="$(mktemp "$HOME/.zomorod-preflight-app.XXXXXX.json")"
          trap 'rm -f -- "$audit"' EXIT
          uapi --output=json PassengerApps list_applications > "$audit"
          python3 - "$audit" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          stack=[data]; matches=[]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  if str(value.get("domain","")).lower()=="zomorodmelal.ir" and value.get("base_uri")=="/" and value.get("path")=="/home/zomorod2/Saeit":
                      matches.append(value)
                  stack.extend(value.values())
              elif isinstance(value,list): stack.extend(value)
          if len(matches)!=1:
              raise SystemExit("PASSENGER_ROOT_MAPPING=not_verified")
          print("PASSENGER_ROOT_MAPPING=verified")
          PY
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          test -n "$selector" || { echo "CLOUDLINUX_SELECTOR=unavailable" >&2; exit 1; }
          python3 - "$HOME/.cl.selector/python-selector.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          app=data.get("Saeit",{})
          if str(app.get("domain","")).lower()!="zomorodmelal.ir" or app.get("app_uri") not in ("",None) or str(app.get("python_version"))!="3.10":
              raise SystemExit("SELECTOR_ROOT_APP_MAPPING=not_verified")
          print("SELECTOR_ROOT_APP_MAPPING=verified")
          print("SELECTOR_PYTHON_VERSION=3.10")
          PY
          # Passenger imports with this virtualenv. Reconcile its production packages with
          # the project's declared versions, keeping already compatible versions.
          passenger_python="$HOME/virtualenv/Saeit/3.10/bin/python"
          test -x "$passenger_python" || { echo "PASSENGER_PYTHON=missing" >&2; exit 1; }
          if ! "$passenger_python" -c 'import environ, rest_framework, whitenoise.middleware, openai, psycopg, PIL, pydantic_core' >/dev/null 2>&1; then
            "$passenger_python" -m pip --disable-pip-version-check install --upgrade-strategy only-if-needed 'Django>=5.2,<6.0' 'django-environ>=0.12,<1.0' 'djangorestframework>=3.16,<4.0' 'psycopg[binary]>=3.2,<4.0' 'openai>=1.100,<2.0' 'pydantic>=2.0,<3.0' 'whitenoise>=6.9,<7.0' 'Pillow>=10,<12'
          fi
          "$passenger_python" -c 'import django, environ, rest_framework, whitenoise, openai, psycopg, PIL, pydantic_core; print("PASSENGER_RUNTIME_DEPENDENCIES=verified")'
          recovery="$HOME/.backups/zomorodmelal-app/b78498ecccc3b99784a0cb060ea2c59bec65c505"
          if test -f "$recovery/deployed.flag" && test ! -f "$recovery/recovered.flag"; then
            echo "RECOVERING_PREVIOUS_UNVERIFIED_GENERATION=b78498ecccc3b99784a0cb060ea2c59bec65c505"
            paths=(passenger_wsgi.py config/urls.py config/settings.py config/env_compat.py core/middleware.py core/models.py core/newsletter_models.py core/blog_models.py core/company_inquiry_models.py core/company_activity_models.py core/economic_trade_models.py core/views.py core/company_content_models.py core/zomorod_public_views.py core/services_views.py core/seo_views.py core/templates/base.html core/templates/core/services.html core/templates/core/platform_page.html core/management/commands/knowledge_agent_generate.py core/tests/test_zomorod_public_pages.py core/tests/test_seo_sitemap.py public/agriculture/index.html public/agriculture/livestock/index.html public/agriculture/horticulture/index.html public/agriculture/greenhouse/index.html public/agriculture/poultry/index.html public/agriculture/aquaculture/index.html public/agriculture/inputs/index.html public/agriculture/seeds/index.html public/agriculture/fertilizers/index.html public/agriculture/pesticides/index.html public/agriculture/offices/index.html public/agriculture/water-soil/index.html public/agriculture/machinery/index.html public/agriculture/market/index.html public/agriculture/genetics/index.html core/static/site/heroes/platform-home.webp core/static/site/heroes/agriculture.webp core/static/site/heroes/smart-agriculture.webp core/static/site/heroes/industry.webp core/static/site/heroes/economy.webp core/static/site/heroes/research.webp core/static/site/heroes/knowledge.webp core/static/site/heroes/genetics.webp core/static/site/heroes/laboratory.webp core/static/site/heroes/academy.webp core/static/site/heroes/education-detail.webp core/static/site/heroes/ai.webp)
            for rel in "${paths[@]}"; do
              target="$app/$rel"
              if grep -Fxq "$rel" "$recovery/existing.txt"; then
                test -f "$recovery/$rel"
                mkdir -p "$(dirname "$target")"
                cp -p "$recovery/$rel" "$target.recovery"
                mv -f "$target.recovery" "$target"
              else
                rm -f -- "$target"
              fi
            done
            assets=(agriculture/assets/zomorod-olive-v1/platform-home.webp agriculture/assets/zomorod-olive-v1/agriculture.webp agriculture/assets/zomorod-olive-v1/smart-agriculture.webp agriculture/assets/zomorod-olive-v1/industry.webp agriculture/assets/zomorod-olive-v1/economy.webp agriculture/assets/zomorod-olive-v1/research.webp agriculture/assets/zomorod-olive-v1/knowledge.webp agriculture/assets/zomorod-olive-v1/genetics.webp agriculture/assets/zomorod-olive-v1/laboratory.webp)
            for rel in "${assets[@]}"; do
              target="$root/$rel"
              if grep -Fxq "$rel" "$recovery/assets-existing.txt"; then
                test -f "$recovery/assets/$rel"
                mkdir -p "$(dirname "$target")"
                cp -p "$recovery/assets/$rel" "$target.recovery"
                mv -f "$target.recovery" "$target"
              else
                rm -f -- "$target"
              fi
            done
            page_target="$root/agriculture/index.html"
            if grep -Fxq yes "$recovery/public-page-existing"; then
              test -f "$recovery/public_html/agriculture/index.html"
              mkdir -p "$(dirname "$page_target")"
              cp -p "$recovery/public_html/agriculture/index.html" "$page_target.recovery"
              mv -f "$page_target.recovery" "$page_target"
            else
              rm -f -- "$page_target"
            fi
            touch "$app/passenger_wsgi.py"
            "$selector" restart --json --interpreter python --user "$USER" --app-root Saeit >/dev/null
            mkdir -p "$app/tmp"
            touch "$app/tmp/restart.txt"
            : > "$recovery/recovered.flag"
            echo "PREVIOUS_GENERATION_RECOVERY=complete"
          else
            echo "PREVIOUS_GENERATION_RECOVERY=not_needed"
          fi
          PREFLIGHT
      - name: Stage only scoped Django and guide files
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-app"
          app=/home/zomorod2/Saeit
          stage="$app/.zomorod-stage-$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel "test -d '$app' && test ! -e '$stage' && mkdir -m 700 '$stage'"
          tar -czf - passenger_wsgi.py config/*.py core/*.py command_center/*.py core/templates/base.html core/templates/core/services.html core/templates/core/platform_page.html core/management/commands/knowledge_agent_generate.py core/tests/test_zomorod_public_pages.py core/tests/test_seo_sitemap.py public/agriculture core/static/site/heroes/platform-home.webp core/static/site/heroes/agriculture.webp core/static/site/heroes/smart-agriculture.webp core/static/site/heroes/industry.webp core/static/site/heroes/economy.webp core/static/site/heroes/research.webp core/static/site/heroes/knowledge.webp core/static/site/heroes/genetics.webp core/static/site/heroes/laboratory.webp core/static/site/heroes/academy.webp core/static/site/heroes/education-detail.webp core/static/site/heroes/ai.webp | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
      - name: Install Django app files
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-app"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          app=/home/zomorod2/Saeit
          public_root=/home/zomorod2/public_html
          passenger_python="$HOME/virtualenv/Saeit/3.10/bin/python"
          test -x "$passenger_python"
          test -d "$public_root" && test "$(stat -c %U "$public_root")" = "zomorod2" && test -w "$public_root"
          stage="$app/.zomorod-stage-$sha"
          backup="$HOME/.backups/zomorodmelal-app/$sha"
          test -d "$stage" && test -d "$app" && test "$(stat -c %U "$app")" = "zomorod2" && test -w "$app"
          audit="$HOME/.zomorod-passenger-audit-$sha.json"
          trap 'rm -f -- "$audit"' EXIT
          uapi --output=json PassengerApps list_applications > "$audit"
          python3 - "$audit" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          stack=[data]; matches=[]
          while stack:
              v=stack.pop()
              if isinstance(v,dict):
                  if str(v.get("domain","")).lower()=="zomorodmelal.ir" and v.get("base_uri")=="/" and v.get("path")=="/home/zomorod2/Saeit":
                      matches.append(v)
                  stack.extend(v.values())
              elif isinstance(v,list): stack.extend(v)
          if not matches: raise SystemExit("Expected root Passenger app mapping was not found")
          print("PASSENGER_ROOT_MAPPING=verified")
          PY
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          test -n "$selector" || { echo "CLOUDLINUX_SELECTOR=unavailable" >&2; exit 1; }
          python3 - "$HOME/.cl.selector/python-selector.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          app=data.get("Saeit",{})
          if str(app.get("domain","")).lower()!="zomorodmelal.ir" or app.get("app_uri") not in ("",None) or str(app.get("python_version"))!="3.10":
              raise SystemExit("SELECTOR_ROOT_APP_MAPPING_CHANGED")
          print("SELECTOR_ROOT_APP_MAPPING=verified")
          PY
          rm -rf -- "$backup"
          mkdir -p "$backup"
          : > "$backup/existing.txt"
          asset_existing="$backup/assets-existing.txt"
          : > "$asset_existing"
          paths=(passenger_wsgi.py config/urls.py config/settings.py config/env_compat.py core/middleware.py core/models.py core/newsletter_models.py core/blog_models.py core/company_inquiry_models.py core/company_activity_models.py core/economic_trade_models.py core/views.py core/company_content_models.py core/zomorod_public_views.py core/services_views.py core/seo_views.py core/templates/base.html core/templates/core/services.html core/templates/core/platform_page.html core/management/commands/knowledge_agent_generate.py core/tests/test_zomorod_public_pages.py core/tests/test_seo_sitemap.py public/agriculture/index.html public/agriculture/livestock/index.html public/agriculture/horticulture/index.html public/agriculture/greenhouse/index.html public/agriculture/poultry/index.html public/agriculture/aquaculture/index.html public/agriculture/inputs/index.html public/agriculture/seeds/index.html public/agriculture/fertilizers/index.html public/agriculture/pesticides/index.html public/agriculture/offices/index.html public/agriculture/water-soil/index.html public/agriculture/machinery/index.html public/agriculture/market/index.html public/agriculture/genetics/index.html core/static/site/heroes/platform-home.webp core/static/site/heroes/agriculture.webp core/static/site/heroes/smart-agriculture.webp core/static/site/heroes/industry.webp core/static/site/heroes/economy.webp core/static/site/heroes/research.webp core/static/site/heroes/knowledge.webp core/static/site/heroes/genetics.webp core/static/site/heroes/laboratory.webp core/static/site/heroes/academy.webp core/static/site/heroes/education-detail.webp core/static/site/heroes/ai.webp)
          path_list="$backup/.source-paths.tmp"
          : > "$path_list"
          for source_dir in config core command_center; do
            find "$stage/$source_dir" -maxdepth 1 -type f -name '*.py' -print0 >> "$path_list"
          done
          while IFS= read -r -d '' staged_file; do
            rel="${staged_file#"$stage/"}"
            case " ${paths[*]} " in
              *" $rel "*) ;;
              *) paths+=("$rel") ;;
            esac
          done < "$path_list"
          rm -f -- "$path_list"
          printf '%s\n' "${paths[@]}" > "$backup/deployed-paths.txt"
          asset_paths=(agriculture/assets/zomorod-olive-v1/platform-home.webp agriculture/assets/zomorod-olive-v1/agriculture.webp agriculture/assets/zomorod-olive-v1/smart-agriculture.webp agriculture/assets/zomorod-olive-v1/industry.webp agriculture/assets/zomorod-olive-v1/economy.webp agriculture/assets/zomorod-olive-v1/research.webp agriculture/assets/zomorod-olive-v1/knowledge.webp agriculture/assets/zomorod-olive-v1/genetics.webp agriculture/assets/zomorod-olive-v1/laboratory.webp)
          asset_sources=(platform-home.webp agriculture.webp smart-agriculture.webp industry.webp economy.webp research.webp knowledge.webp genetics.webp laboratory.webp)
          page_rel=agriculture/index.html
          page_source="$stage/public/$page_rel"
          page_target="$public_root/$page_rel"
          page_backup="$backup/public_html/$page_rel"
          page_existed="$backup/public-page-existing"
          : > "$page_existed"
          test -f "$page_source" || { echo "Missing staged public page: $page_source"; exit 1; }
          test ! -L "$page_target"
          if test -f "$page_target"; then
            mkdir -p "$(dirname "$page_backup")"
            cp -p "$page_target" "$page_backup"
            printf 'yes\n' > "$page_existed"
          fi
          for i in "${!asset_paths[@]}"; do
            rel="${asset_paths[$i]}"
            source="$stage/core/static/site/heroes/${asset_sources[$i]}"
            target="$public_root/$rel"
            test -f "$source" || { echo "Missing staged image source: $source"; exit 1; }
            test ! -L "$target"
            if test -f "$target"; then
              mkdir -p "$backup/assets/$(dirname "$rel")"
              cp -p "$target" "$backup/assets/$rel"
              printf '%s\n' "$rel" >> "$asset_existing"
            fi
          done
          for rel in "${paths[@]}"; do
            test -f "$stage/$rel" || { echo "Missing staged file: $rel"; exit 1; }
            target="$app/$rel"
            test ! -L "$target"
            if test -f "$target"; then
              mkdir -p "$backup/$(dirname "$rel")"
              cp -p "$target" "$backup/$rel"
              printf '%s\n' "$rel" >> "$backup/existing.txt"
            fi
          done
          check_result=""
          rollback() {
            set +e
            if test -n "$check_result"; then rm -f -- "$check_result"; fi
            for rel in "${paths[@]}"; do
              target="$app/$rel"
              if grep -Fxq "$rel" "$backup/existing.txt"; then
                mkdir -p "$(dirname "$target")"
                cp -p "$backup/$rel" "$target.rollback"
                mv -f "$target.rollback" "$target"
              else
                rm -f -- "$target"
              fi
            done
            for i in "${!asset_paths[@]}"; do
              rel="${asset_paths[$i]}"
              target="$public_root/$rel"
              if grep -Fxq "$rel" "$asset_existing"; then
                mkdir -p "$(dirname "$target")"
                cp -p "$backup/assets/$rel" "$target.rollback"
                mv -f "$target.rollback" "$target"
              else
                rm -f -- "$target"
              fi
            done
            page_target="$public_root/agriculture/index.html"
            if grep -Fxq yes "$backup/public-page-existing"; then
              mkdir -p "$(dirname "$page_target")"
              cp -p "$backup/public_html/agriculture/index.html" "$page_target.rollback"
              mv -f "$page_target.rollback" "$page_target"
            else
              rm -f -- "$page_target"
            fi
            touch "$app/passenger_wsgi.py"
            if test -n "${selector:-}"; then
              "$selector" restart --json --interpreter python --user "$USER" --app-root Saeit >/dev/null 2>&1
              mkdir -p "$app/tmp"
              touch "$app/tmp/restart.txt"
            fi
            echo "DEPLOYMENT_ROLLED_BACK=yes"
          }
          active=1
          trap 'rc=$?; if test "$active" = 1; then rollback; fi; exit "$rc"' EXIT
          for rel in "${paths[@]}"; do
            target="$app/$rel"
            mkdir -p "$(dirname "$target")"
            cp -p "$stage/$rel" "$target.new"
            mv -f "$target.new" "$target"
          done
          for i in "${!asset_paths[@]}"; do
            rel="${asset_paths[$i]}"
            source="$stage/core/static/site/heroes/${asset_sources[$i]}"
            target="$public_root/$rel"
            mkdir -p "$(dirname "$target")"
            cp -p "$source" "$target.new"
            mv -f "$target.new" "$target"
          done
          page_target="$public_root/agriculture/index.html"
          mkdir -p "$(dirname "$page_target")"
          cp -p "$page_source" "$page_target.new"
          mv -f "$page_target.new" "$page_target"
          if test -f "$app/stderr.log"; then
            stat -c %s "$app/stderr.log" > "$backup/passenger-log-offset.txt"
          else
            printf '0\n' > "$backup/passenger-log-offset.txt"
          fi
          echo "PASSENGER_STARTUP_ENTRYPOINT_BEGIN"
          sed -n '1,20p' "$app/passenger_wsgi.py"
          echo "PASSENGER_STARTUP_ENTRYPOINT_END"
          touch "$app/passenger_wsgi.py"
          restart_result="$(mktemp "$HOME/.zomorod-passenger-restart-$sha.XXXXXX.json")"
          if ! "$selector" restart --json --interpreter python --user "$USER" --app-root Saeit > "$restart_result"; then
            rm -f -- "$restart_result"
            echo "PASSENGER_APP_RESTART=failed" >&2
            exit 1
          fi
          python3 - "$restart_result" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          result=data.get("result")
          print("PASSENGER_APP_RESTART="+str(result))
          if result!="success":
              raise SystemExit(1)
          PY
          rm -f -- "$restart_result"
          mkdir -p "$app/tmp"
          touch "$app/tmp/restart.txt"
          cd "$app"
          if ! "$passenger_python" - <<'PY'
          import traceback
          from django.apps.registry import Apps
          original_populate = Apps.populate
          def trace_reentrant(self, installed_apps):
              if self.loading:
                  print("PASSENGER_WSGI_REENTRANT_SETUP_CALLER_BEGIN")
                  traceback.print_stack()
                  print("PASSENGER_WSGI_REENTRANT_SETUP_CALLER_END")
              return original_populate(self, installed_apps)
          Apps.populate = trace_reentrant
          try:
              import passenger_wsgi
              print("PASSENGER_WSGI_IMPORT=passed")
              from django.test import Client
              response = Client(HTTP_HOST="zomorodmelal.ir").get("/agriculture/", secure=True)
              print("DJANGO_CLIENT_AGRICULTURE_STATUS="+str(response.status_code))
              if response.status_code != 200:
                  raise SystemExit("DJANGO_CLIENT_AGRICULTURE=failed")
          except Exception:
              traceback.print_exc()
              raise
          PY
          then
            echo "PASSENGER_WSGI_IMPORT=failed" >&2
            exit 1
          fi
          check_result="$(mktemp "$HOME/.zomorod-django-check-$sha.XXXXXX.json")"
          if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- check --deploy > "$check_result"; then
            echo "DJANGO_APP_CHECK=failed" >&2
            exit 1
          fi
          python3 - "$check_result" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          print("DJANGO_APP_CHECK="+str(data.get("result")))
          if data.get("result")!="success":
              raise SystemExit(1)
          PY
          rm -f -- "$check_result"
          rm -f -- "$check_result"
          check_result="$(mktemp "$HOME/.zomorod-migrate-check-$sha.XXXXXX.json")"
          if ! "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- migrate --check > "$check_result"; then
            echo "DJANGO_MIGRATE_CHECK=failed" >&2
            exit 1
          fi
          python3 - "$check_result" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          print("DJANGO_MIGRATE_CHECK="+str(data.get("result")))
          if data.get("result")!="success":
              raise SystemExit(1)
          PY
          rm -f -- "$check_result"
          check_result=""
          echo "PASSENGER_STARTUP_ALREADY_RESTARTED=yes"
          rm -rf -- "$stage"
          printf 'ready\n' > "$backup/deployed.flag"
          active=0
          trap - EXIT
          echo "APP_FILES_INSTALLED=yes"
          echo "DEPLOYMENT_ROLLBACK=available:$backup"
          REMOTE
      - name: Verify public agriculture pages and images
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/zomorod-live-page.html"
          headers="$RUNNER_TEMP/zomorod-live-headers.txt"
          fetch() {
            local url="$1" output="$2"
            if ! curl -fsS -H "Cache-Control: no-cache" -H "Pragma: no-cache" --retry 5 --retry-connrefused --retry-delay 3 --max-time 25 "$url" -o "$output"; then
              echo "LIVE_HTTP_CHECK_FAILED=$url" >&2
              return 1
            fi
          }
          fetch "https://zomorodmelal.ir/?__zomorod_verify=$GITHUB_SHA" "$tmp"
          grep -Eq 'کشاورزی|دامپروری' "$tmp"
          echo "LIVE_ROUTE_CHECK=home passed"
          for route in agriculture agriculture/livestock agriculture/horticulture agriculture/greenhouse agriculture/poultry agriculture/aquaculture agriculture/inputs agriculture/seeds agriculture/fertilizers agriculture/pesticides agriculture/offices agriculture/water-soil agriculture/machinery agriculture/market agriculture/genetics; do
            fetch "https://zomorodmelal.ir/$route/?__zomorod_verify=$GITHUB_SHA" "$tmp"
            case "$route" in
              agriculture) expected='راهنمای جامع کشاورزی' ;;
              agriculture/livestock) expected='دامپروری' ;;
              agriculture/horticulture) expected='باغبانی و باغداری' ;;
              agriculture/greenhouse) expected='گلخانه' ;;
              agriculture/poultry) expected='پرورش طیور' ;;
              agriculture/aquaculture) expected='آبزی‌پروری' ;;
              agriculture/inputs) expected='نهاده‌های کشاورزی' ;;
              agriculture/seeds) expected='بذر و نشا' ;;
              agriculture/fertilizers) expected='کود و تغذیهٔ گیاه' ;;
              agriculture/pesticides) expected='حفاظت گیاه و سموم' ;;
              agriculture/offices) expected='ادارات و خدمات کشاورزی' ;;
              agriculture/water-soil) expected='آب، خاک و منابع مزرعه' ;;
              agriculture/machinery) expected='ماشین‌آلات و فناوری مزرعه' ;;
              agriculture/market) expected='بازار و زنجیرهٔ ارزش' ;;
              agriculture/genetics) expected='ژنتیک و اصلاح نژاد' ;;
            esac
            grep -Fq "$expected" "$tmp" || { echo "LIVE_ROUTE_CONTENT_CHECK_FAILED=$route expected=$expected" >&2; exit 1; }
            echo "LIVE_ROUTE_CHECK=$route passed"
          done
          check_webp() {
            local url="$1" file="$2" result code type
            result="$(curl -fsS -H "Cache-Control: no-cache" -H "Pragma: no-cache" --retry 5 --retry-connrefused --retry-delay 3 --max-time 25 -o "$file" -w '%{http_code}|%{content_type}' "$url?__zomorod_verify=$GITHUB_SHA")"
            code="${result%%|*}"
            type="${result#*|}"
            if python3 - "$file" <<'PY'
          import pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()[:12]
          raise SystemExit(0 if len(data)==12 and data[:4]==b"RIFF" and data[8:12]==b"WEBP" else 1)
          PY
            then magic=webp; else magic=invalid; fi
            printf 'LIVE_IMAGE_CHECK %s result=%s|%s magic=%s\n' "$url" "$code" "$type" "$magic"
            test "$code" = "200" && test "$magic" = "webp"
          }
          for image in platform-home agriculture smart-agriculture industry economy research knowledge genetics laboratory; do
            url="https://zomorodmelal.ir/agriculture/assets/zomorod-olive-v1/$image.webp"
            check_webp "$url" "$RUNNER_TEMP/zomorod-agriculture-$image.webp"
          done
          rm -f -- "$tmp" "$headers"
          echo "LIVE_AGRICULTURE_PAGES=15"
          echo "LIVE_IMAGE_ROUTES=9"
      - name: Capture sanitized Passenger exception before rollback
        if: failure() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-app"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'DIAGNOSTIC'
          set -euo pipefail
          sha="$1"
          python3 - "$sha" <<'PY'
          from pathlib import Path
          import re,sys
          path=Path.home()/"Saeit"/"stderr.log"
          if not path.is_file():
              print("PASSENGER_ERROR_LOG=missing")
              raise SystemExit(0)
          offset_path=Path.home()/".backups"/"zomorodmelal-app"/sys.argv[1]/"passenger-log-offset.txt"
          try: offset=int(offset_path.read_text(encoding="utf-8").strip())
          except (OSError,ValueError): offset=0
          raw=path.read_bytes()
          if offset>len(raw): offset=0
          lines=raw[offset:].decode("utf-8","replace").splitlines()
          print("PASSENGER_FRESH_LOG_LINES="+str(len(lines)))
          secret=re.compile(r"(?i)(password|passwd|secret|token|api[_-]?key|authorization|cookie)(\s*[:=]\s*)[^\s,;]+")
          uri=re.compile(r"(://[^/\s:@]+:)[^/@\s]+@")
          for trace_index in [i for i,line in enumerate(lines) if "populate() isn't reentrant" in line][-2:]:
              for context_line in lines[max(0,trace_index-18):trace_index+1]:
                  safe=secret.sub(r"\1=[redacted]",context_line)
                  safe=uri.sub(r"\1[redacted]@",safe)
                  print("PASSENGER_TRACE_CONTEXT="+safe[:280])
          pattern=re.compile(r"Traceback|ModuleNotFoundError|ImportError|RuntimeError|TemplateSyntaxError|TemplateDoesNotExist|OperationalError|DatabaseError|Exception|Error:",re.I)
          secret=re.compile(r"(?i)(password|passwd|secret|token|api[_-]?key|authorization|cookie)(\s*[:=]\s*)[^\s,;]+")
          uri=re.compile(r"(://[^/\s:@]+:)[^/@\s]+@")
          emitted=0
          for marker_index in [i for i,line in enumerate(lines) if "PASSENGER_REENTRANT_CALL_STACK_BEGIN" in line][-2:]:
              end=next((j for j in range(marker_index+1,len(lines)) if "PASSENGER_REENTRANT_CALL_STACK_END" in lines[j]),min(len(lines),marker_index+35))
              for line in lines[marker_index:end+1]:
                  safe=secret.sub(r"\1=[redacted]",line)
                  safe=uri.sub(r"\1[redacted]@",safe)
                  print("PASSENGER_REENTRANT_TRACE="+safe[:280])
          for error_index in [i for i,line in enumerate(lines) if re.search(r"ModuleNotFoundError|ImportError|RuntimeError|TemplateSyntaxError|TemplateDoesNotExist|OperationalError|DatabaseError|Exception",line)][:12]:
              starts=[i for i in range(error_index+1) if "Traceback (most recent call last):" in lines[i]]
              start=starts[-1] if starts else max(0,error_index-24)
              for line in lines[start:error_index+1]:
                  safe=secret.sub(r"\1=[redacted]",line)
                  safe=uri.sub(r"\1[redacted]@",safe)
                  print("PASSENGER_LATEST_TRACE="+safe[:280])
                  emitted+=1
          print("PASSENGER_LATEST_TRACE_LINES="+str(emitted))
          PY
          DIAGNOSTIC
      - name: Roll back if public verification failed
        if: failure() && steps.install.outcome == 'success'
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-app"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'ROLLBACK'
          set -euo pipefail
          sha="$1"
          app=/home/zomorod2/Saeit
          root=/home/zomorod2/public_html
          backup="$HOME/.backups/zomorodmelal-app/$sha"
          selector="$(command -v cloudlinux-selector || true)"
          if test -z "$selector" && test -x /usr/sbin/cloudlinux-selector; then selector=/usr/sbin/cloudlinux-selector; fi
          test -n "$selector" || { echo "CLOUDLINUX_SELECTOR=unavailable" >&2; exit 1; }
          if test ! -f "$backup/deployed.flag"; then
            echo "ROLLBACK_SKIPPED=no completed app publish"
            exit 0
          fi
          paths=(passenger_wsgi.py config/urls.py config/settings.py config/env_compat.py core/middleware.py core/models.py core/newsletter_models.py core/blog_models.py core/company_inquiry_models.py core/company_activity_models.py core/economic_trade_models.py core/views.py core/company_content_models.py core/zomorod_public_views.py core/services_views.py core/seo_views.py core/templates/base.html core/templates/core/services.html core/templates/core/platform_page.html core/management/commands/knowledge_agent_generate.py core/tests/test_zomorod_public_pages.py core/tests/test_seo_sitemap.py public/agriculture/index.html public/agriculture/livestock/index.html public/agriculture/horticulture/index.html public/agriculture/greenhouse/index.html public/agriculture/poultry/index.html public/agriculture/aquaculture/index.html public/agriculture/inputs/index.html public/agriculture/seeds/index.html public/agriculture/fertilizers/index.html public/agriculture/pesticides/index.html public/agriculture/offices/index.html public/agriculture/water-soil/index.html public/agriculture/machinery/index.html public/agriculture/market/index.html public/agriculture/genetics/index.html core/static/site/heroes/platform-home.webp core/static/site/heroes/agriculture.webp core/static/site/heroes/smart-agriculture.webp core/static/site/heroes/industry.webp core/static/site/heroes/economy.webp core/static/site/heroes/research.webp core/static/site/heroes/knowledge.webp core/static/site/heroes/genetics.webp core/static/site/heroes/laboratory.webp core/static/site/heroes/academy.webp core/static/site/heroes/education-detail.webp core/static/site/heroes/ai.webp)
          if test -f "$backup/deployed-paths.txt"; then
            mapfile -t paths < "$backup/deployed-paths.txt"
          fi
          asset_paths=(agriculture/assets/zomorod-olive-v1/platform-home.webp agriculture/assets/zomorod-olive-v1/agriculture.webp agriculture/assets/zomorod-olive-v1/smart-agriculture.webp agriculture/assets/zomorod-olive-v1/industry.webp agriculture/assets/zomorod-olive-v1/economy.webp agriculture/assets/zomorod-olive-v1/research.webp agriculture/assets/zomorod-olive-v1/knowledge.webp)
          for rel in "${paths[@]}"; do
            target="$app/$rel"
            if grep -Fxq "$rel" "$backup/existing.txt"; then
              cp -p "$backup/$rel" "$target.rollback"
              mv -f "$target.rollback" "$target"
            else
              rm -f -- "$target"
            fi
          done
          for rel in "${asset_paths[@]}"; do
            target="$root/$rel"
            if grep -Fxq "$rel" "$backup/assets-existing.txt"; then
              mkdir -p "$(dirname "$target")"
              cp -p "$backup/assets/$rel" "$target.rollback"
              mv -f "$target.rollback" "$target"
            else
              rm -f -- "$target"
            fi
          done
          page_target="$root/agriculture/index.html"
          if grep -Fxq yes "$backup/public-page-existing"; then
            mkdir -p "$(dirname "$page_target")"
            cp -p "$backup/public_html/agriculture/index.html" "$page_target.rollback"
            mv -f "$page_target.rollback" "$page_target"
          else
            rm -f -- "$page_target"
          fi
          touch "$app/passenger_wsgi.py"
          "$selector" restart --json --interpreter python --user "$USER" --app-root Saeit >/dev/null
          mkdir -p "$app/tmp"
          touch "$app/tmp/restart.txt"
          rm -f "$backup/deployed.flag"
          echo "PUBLIC_VERIFICATION_ROLLBACK=complete"
          ROLLBACK