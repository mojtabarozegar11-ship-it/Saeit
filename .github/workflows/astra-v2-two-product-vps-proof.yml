name: Astra V2 Two Distinct Products VPS Proof

on:
  push:
    branches: [feature/astra-factory-v2-architecture-20261014]
    paths: [.github/workflows/astra-v2-two-product-vps-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-v2-two-distinct-products-proof
  cancel-in-progress: false

jobs:
  independent-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate distinct buyers' applications and production pipeline locally
        run: |
          python -m unittest discover -s tests -p test_astra_farm_procurement_audit.py -q
          python -m unittest discover -s tests -p test_astra_orchard_decision_audit.py -q
          python -m unittest discover -s tests -p test_astra_v2_private_pipeline.py -q
          python product_prototypes/farm_procurement_audit/self_test.py
      - name: Build and inspect both distinct products on isolated VPS staging
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          tmp="$RUNNER_TEMP/astra-two-builder"
          install -d -m 700 "$tmp"
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$tmp/key"
          chmod 600 "$tmp/key"
          ssh-keygen -y -P '' -f "$tmp/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$tmp/known" 2>/dev/null
          test "$(ssh-keygen -lf "$tmp/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          SSH=(ssh -i "$tmp/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 githubops@178.239.147.150)
          tar -cf - scripts/astra_v2_private_pipeline.py tests/test_astra_orchard_decision_audit.py tests/test_astra_farm_procurement_audit.py tests/test_astra_v2_private_pipeline.py product_prototypes/orchard_decision_audit product_prototypes/farm_procurement_audit | "${SSH[@]}" 'set -eu; umask 077; dest="$HOME/factory-runtime/operations/astra-v2-two-builder-proof"; mkdir -p "$dest"; tar -xf - -C "$dest"'
          "${SSH[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = githubops
          stage="$HOME/factory-runtime/operations/astra-v2-two-builder-proof"
          root="$HOME/factory-runtime/private/astra-v2-two-builder-proof"
          test -d "$stage/product_prototypes/farm_procurement_audit"
          test -d "$stage/product_prototypes/orchard_decision_audit"
          test -d "$HOME/factory-runtime/private/astra-v2-canary-products"
          cd "$stage"
          python3 -m unittest discover -s tests -p test_astra_farm_procurement_audit.py -q
          python3 -m unittest discover -s tests -p test_astra_orchard_decision_audit.py -q
          python3 -m unittest discover -s tests -p test_astra_v2_private_pipeline.py -q
          python3 product_prototypes/farm_procurement_audit/self_test.py
          python3 product_prototypes/orchard_decision_audit/self_test.py
          python3 - <<'PY'
          import json, pathlib
          stage=pathlib.Path.home()/"factory-runtime/operations/astra-v2-two-builder-proof"
          cases=[
           ("orchard_spec.json","orchard_two_builder_staging_reference",
            "orchard_decision_audit_v2",
            "Compare annual orchard replacement versus maintenance alternatives, showing stress and discounted cash-flow trace."),
           ("procurement_spec.json","procurement_two_builder_staging_reference",
            "farm_procurement_audit_v1",
            "Compare alternative agricultural input quotes, capacity, delivery date and real landed cost including material loss.")
          ]
          for name, ident, builder, problem in cases:
           data={"brief_id":ident,"builder":builder,"development_scope":"private_reference_prototype",
                 "publication_allowed":False,"market_demand_verified":False,
                 "paid_api_budget":0,"problem":problem}
           file=stage/name
           file.write_text(json.dumps(data,sort_keys=True)+chr(10),encoding="utf-8")
           file.chmod(0o600)
          PY
          python3 scripts/astra_v2_private_pipeline.py enqueue --root "$root" --brief "$stage/orchard_spec.json"
          python3 scripts/astra_v2_private_pipeline.py enqueue --root "$root" --brief "$stage/procurement_spec.json"
          python3 scripts/astra_v2_private_pipeline.py tick --root "$root"
          python3 scripts/astra_v2_private_pipeline.py tick --root "$root"
          python3 scripts/astra_v2_private_pipeline.py tick --root "$root"
          python3 scripts/astra_v2_private_pipeline.py status --root "$root"
          python3 - "$root" <<'PY'
          import json, pathlib, sqlite3, sys, zipfile, tempfile, subprocess, hashlib
          root=pathlib.Path(sys.argv[1])
          con=sqlite3.connect(str(root/"queue.sqlite3"))
          rows=con.execute("SELECT builder,stage,artifact_sha FROM jobs").fetchall()
          by={r[0]:(r[1],r[2]) for r in rows}
          expected={"orchard_decision_audit_v2","farm_procurement_audit_v1"}
          assert expected.issubset(by.keys()),by
          assert all(by[k][0]=="PRIVATE_QA_PASSED" for k in expected),by
          artifact_shas={by[k][1] for k in expected}
          assert len(artifact_shas)==2,artifact_shas
          manifests=[json.loads(f.read_text()) for f in root.glob("qa-*.json")]
          for m in manifests:
           assert m["quality_score"] is None and m["sale_ready"] is False
           assert not m["owner_publication_approval"] and not m["real_payment_allowed"]
           assert m["technical_regression"]=="PASSED"
          files=list(root.glob("artifact-*.zip"))
          assert len(files)>=2
          assert all(zipfile.ZipFile(f).testzip() is None for f in files)
          with tempfile.TemporaryDirectory() as t:
           for f in files:
            with zipfile.ZipFile(f) as z:z.extractall(t)
           for p in ("orchard_decision_audit","farm_procurement_audit"):
            script=pathlib.Path(t)/p/"self_test.py"
            assert script.exists()
            proc=subprocess.run([sys.executable,str(script)],
                                capture_output=True,text=True,timeout=15)
            assert proc.returncode==0,(p,proc.stderr)
          print("ASTRA_V2_VPS_INDEPENDENT_PRODUCT_FAMILIES=2")
          print("ASTRA_V2_VPS_DISTINCT_PRIVATE_PRODUCT_VERSIONS=2")
          print("ASTRA_V2_VPS_TWO_PRODUCT_SELFTESTS=PASS")
          print("ASTRA_V2_VPS_UNCHANGED_REBUILD_NOT_COUNTED=true")
          print("ASTRA_V2_VPS_COMMERCIAL_QUALITY_CERTIFIED=false")
          print("ASTRA_V2_VPS_PUBLIC_PRODUCTS_RELEASED=0")
          print("ASTRA_V2_VPS_FACTORY_CRON_UNTOUCHED=true")
          REMOTE
