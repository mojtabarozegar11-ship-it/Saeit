name: MojPlayWin synthetic cPanel to VPS stream path probe (no site writes)
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-pinned-stream-synthetic-probe-20261021.yml"]
permissions: {contents: read}
concurrency:
  group: mojplaywin-synthetic-stream-diagnostic-20261021
  cancel-in-progress: false
jobs:
  isolated-synthetic-stream:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify synthetic bytes on each SSH leg and combined relay
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          source_py='import sys;sys.stdout.buffer.write(b"MPW-RELAY-PROBE-"*4096);sys.stdout.buffer.flush()'
          sink_py='import sys;b=sys.stdin.buffer.read();assert b==b"MPW-RELAY-PROBE-"*4096;print("SYNTHETIC_BYTES_VERIFIED="+str(len(b)))'
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "python3 -c '$source_py'" | python3 -c "$sink_py"
          echo "LEG_CPANEL_TO_RUNNER=PASS"
          python3 -c "$source_py" | timeout 35s ssh -T -F "$d/config" saeit-vps "python3 -c '$sink_py'"
          echo "LEG_RUNNER_TO_VPS=PASS"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "python3 -c '$source_py'" | timeout 35s ssh -T -F "$d/config" saeit-vps "python3 -c '$sink_py'"
          echo "LEG_CPANEL_VIA_RUNNER_TO_VPS=PASS"
          echo "NO_PRODUCTION_DATA_READ_OR_WRITTEN=TRUE"
          echo "BACKUP_RESTORED_OR_DEPLOY_PERMITTED=FALSE"
