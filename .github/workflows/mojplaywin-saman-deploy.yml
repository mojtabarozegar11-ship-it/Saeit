name: Deploy SAMAN to MojPlayWin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-saman-deploy.yml"
      - "scripts/deploy_mojplaywin_saman.py"
      - "scripts/saman_patch.py"
      - "templates/saman/index.html"

permissions:
  contents: read

concurrency:
  group: mojplaywin-saman-production
  cancel-in-progress: false

jobs:
  deploy-saman:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate SAMAN page and installer
        run: |
          python3 -m py_compile scripts/deploy_mojplaywin_saman.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path("templates/saman/index.html").read_text(encoding="utf-8")
          required = ['<html lang="en">', '<title>SAMAN', 'SAMAN collection', 'Explore MojPlayWin']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"SAMAN page missing required content: {missing}")
          print("SAMAN English page checks passed.")
          PY

      - name: Configure pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          HOST_HOST="zohal.pws-dns.net"
          HOST_USER="zomorod2"
          HOST_PORT=1396
          [[ -n "$VPS_KEY" && -n "$HOST_KEY" ]] || { echo "Missing SSH key secret"; exit 1; }
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          install -d -m 700 "$WORK"
          python3 - <<'PY'
          import os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "mojplaywin-ssh"
          for name, filename in (("VPS_KEY", "vps.key"), ("HOST_KEY", "host.key")):
              value = os.environ[name]
              if "\\n" in value:
                  value = value.replace("\\n", "\n")
              path = work / filename
              path.write_text(value.rstrip("\n") + "\n", encoding="utf-8")
              path.chmod(0o600)
          PY
          ssh-keygen -y -P "" -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$WORK/host.key" >/dev/null

          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          [[ -s "$WORK/vps.known" ]]
          VPS_FP="$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$VPS_FP" == "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" ]] || { echo "VPS host key pin mismatch"; exit 1; }

          cat > "$WORK/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"

          timeout 30s ssh -F "$WORK/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          [[ -s "$WORK/host.known" ]]
          HOST_FP="$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$HOST_FP" == "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" ]] || { echo "cPanel host key pin mismatch"; exit 1; }

          cat >> "$WORK/config" <<EOF
          Host saeit-host
            HostName $HOST_HOST
            User $HOST_USER
            Port $HOST_PORT
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo "Pinned SSH relay is ready."

      - name: Check MojPlayWin document root and create staging
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          timeout 45s ssh -F "$WORK/config" saeit-host \
            'test -d /home/zomorod2/mojplaywin.com && test ! -L /home/zomorod2/mojplaywin.com && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/mojplaywin.com/.htaccess && grep -Fq "Saeit-staging" /home/zomorod2/mojplaywin.com/passenger_wsgi.py'
          timeout 20s ssh -F "$WORK/config" saeit-host "install -d -m 700 /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID"
          timeout 20s ssh -F "$WORK/config" saeit-host 'for path in saman/sections; do target="/home/zomorod2/mojplaywin.com/$path"; if [[ -e "$target" ]]; then echo "DOCROOT_PATH_EXISTS=$target"; ls -ld "$target"; else echo "DOCROOT_PATH_CLEAR=$target"; fi; done'

      - name: Package SAMAN deployment files
        run: tar -cf "$RUNNER_TEMP/saman.tar" scripts/deploy_mojplaywin_saman.py scripts/saman_patch.py templates/saman/index.html

      - name: Upload and unpack deployment package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          scp -F "$WORK/config" "$RUNNER_TEMP/saman.tar" "saeit-host:/home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID/bundle.tar"
          timeout 30s ssh -F "$WORK/config" saeit-host \
            "tar -xf /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID/bundle.tar -C /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID && rm -f /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID/bundle.tar"

      - name: Install SAMAN Django route
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID/scripts/deploy_mojplaywin_saman.py deploy $GITHUB_RUN_ID $GITHUB_SHA"

      - name: Verify Django runtime route
        id: route_check
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          timeout 90s ssh -F "$WORK/config" saeit-host 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/home/zomorod2/Saeit-staging
          candidates=(
            "$APP/.venv/bin/python"
            "$APP/venv/bin/python"
            /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python
            /home/zomorod2/virtualenv/Saeit-staging/3.10/bin/python
            /home/zomorod2/virtualenv/Saeit/3.11/bin/python
            /home/zomorod2/virtualenv/Saeit/3.10/bin/python
            /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python
            /home/zomorod2/virtualenv/mojplaywin.com/3.10/bin/python
          )
          for python in "${candidates[@]}"; do
            if [[ -x "$python" ]] && "$python" -c 'import django' >/dev/null 2>&1; then
              cd "$APP"
              DJANGO_SETTINGS_MODULE=config.settings "$python" - <<'PY'
          import django
          django.setup()
          from django.urls import resolve
          routes = {
              "/saman/": "saman_page",
              "/saman/sections/learn/": "saman_section_page",
              "/saman/sections/play/": "saman_section_page",
              "/saman/sections/products/": "saman_section_page",
              "/saman/sections/membership/": "saman_section_page",
              "/saman/sections/partners/": "saman_section_page",
              "/saman/sections/about/": "saman_section_page",
          }
          for path, expected in routes.items():
              match = resolve(path)
              print("SAMAN_RUNTIME_ROUTE=" + path + " -> " + match.func.__name__)
              assert match.func.__name__ == expected, path
          PY
              exit 0
            fi
          done
          echo "No Passenger virtualenv with Django found in the verified app paths."
          exit 1
          REMOTE
      - name: Verify live SAMAN page
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          status="000"
          for attempt in {1..10}; do
            status="$(curl -sS -o "$RUNNER_TEMP/saman-live.html" -w '%{http_code}' https://mojplaywin.com/saman/ || true)"
            if [[ "$status" == "200" ]]; then break; fi
            echo "SAMAN route not ready (HTTP $status, attempt $attempt)."
            sleep 3
          done
          [[ "$status" == "200" ]] || { echo "Live SAMAN route returned HTTP $status"; exit 1; }
          routes=(
            "/saman/:The SAMAN collection"
            "/saman/sections/learn/:Learning that moves with you."
            "/saman/sections/play/:More than one way to play."
            "/saman/sections/products/:Useful resources, made to keep."
            "/saman/sections/membership/:More depth for committed learners."
            "/saman/sections/partners/:Good work grows through collaboration."
            "/saman/sections/about/:A broader home for curiosity."
          )
          for entry in "${routes[@]}"; do
            route="${entry%%:*}"
            marker="${entry#*:}"
            status="000"
            ready=false
            for attempt in {1..8}; do
              status="$(curl -sS -o "$RUNNER_TEMP/saman-live.html" -w '%{http_code}' "https://mojplaywin.com$route" || true)"
              if [[ "$status" == "200" ]] && grep -Fq "$marker" "$RUNNER_TEMP/saman-live.html"; then
                ready=true
                break
              fi
              echo "Waiting for SAMAN content at $route (HTTP $status, attempt $attempt)."
              sleep 2
            done
            if [[ "$ready" != "true" ]]; then
              echo "SAMAN page $route did not return the expected content (HTTP $status)"
              python3 - "$RUNNER_TEMP/saman-live.html" <<'PY'
          from pathlib import Path
          import sys
          print(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")[:1200])
          PY
              exit 1
            fi
            python3 - "$RUNNER_TEMP/saman-live.html" "$marker" <<'PY'
          from pathlib import Path
          import sys
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          marker = sys.argv[2]
          if "<title>SAMAN" not in html or marker not in html:
              raise SystemExit(f"Live SAMAN content verification failed: {marker}")
          PY
            echo "Verified https://mojplaywin.com$route"
          done

      - name: Roll back failed live check
        if: failure() && steps.deploy.outcome == 'success' && (steps.route_check.outcome == 'failure' || steps.smoke.outcome == 'failure')
        shell: bash
        run: |
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID/scripts/deploy_mojplaywin_saman.py rollback $GITHUB_RUN_ID"

      - name: Remove remote staging and temporary credentials
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mojplaywin-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/mojplaywin-ssh/config" -o ConnectTimeout=10 saeit-host \
              "rm -rf /home/zomorod2/.mojplaywin-saman-$GITHUB_RUN_ID" || true
          fi
          rm -rf -- "$RUNNER_TEMP/mojplaywin-ssh" "$RUNNER_TEMP/saman.tar" "$RUNNER_TEMP/saman-live.html"
