name: Complete MojPlayWin product template repair
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-complete-product-template-repair-20261107.yml"]
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Establish relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; umask 077; d="$RUNNER_TEMP/r"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/v"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/h"
          chmod 600 "$d/"*; ssh-keygen -y -P "" -f "$d/v" >/dev/null; ssh-keygen -y -P "" -f "$d/h" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vk" 2>/dev/null; test "$(ssh-keygen -lf "$d/vk" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/c" <<EOF
          Host v
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/v
            UserKnownHostsFile $d/vk
          Host h
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/h
            UserKnownHostsFile $d/hk
            ProxyJump v
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            RequestTTY no
          EOF
          timeout 30s ssh -F "$d/c" v 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/hc" 2>/dev/null; test "$(ssh-keygen -lf "$d/hc" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; mv "$d/hc" "$d/hk"
      - name: Remove only invalid endblock and verify
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/r/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,hashlib,stat
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging');W=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py');T=A/'core/templates/brands/mojplaywin/product.html'
          if A.is_symlink() or W.is_symlink() or not W.is_file() or T.is_symlink() or not T.is_file() or "APP='/home/zomorod2/Saeit-staging'" not in W.read_text(errors='replace'): raise RuntimeError('UNTRUSTED_TARGET')
          raw=T.read_text('utf8')
          if not raw.startswith('{% if product.pk == 779 %}') or not raw.rstrip().endswith('{% endblock %}'): raise RuntimeError('EXPECTED_INVALID_END_BLOCK_NOT_FOUND')
          new=raw.rstrip()[:-len('{% endblock %}')].rstrip()+'\n'
          tmp=T.with_name('.mpw-complete-template-repair');fd=os.open(str(tmp),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,stat.S_IMODE(T.stat().st_mode))
          try:
              with os.fdopen(fd,'w',encoding='utf8') as f:f.write(new);f.flush();os.fsync(f.fileno())
              os.replace(tmp,T)
          finally:
              if tmp.exists():tmp.unlink()
          for folder in (A/'tmp',W.parent/'tmp'):
              folder.mkdir(mode=0o700,exist_ok=True);flag=folder/'restart.txt';fd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600);os.close(fd);os.utime(flag,None)
          os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.template.loader import get_template
          get_template('brands/mojplaywin/product.html')
          print('MPW_TEMPLATE_VALID=PASS')
          PY
      - name: Verify live commercial routes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          paths=('/store/','/store/product/72/','/store/product/225/','/store/product/879/','/commerce/trx-easy/','/commerce/book/72/','/commerce/book/225/','/commerce/book/879/')
          out={}
          for p in paths:
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://mojplaywin.com'+p,headers={'Cache-Control':'no-cache, no-store, max-age=0','User-Agent':'MPW-Final-Repair/1'}),timeout=30) as r:out[p]=r.status
              except urllib.error.HTTPError as e:out[p]=e.code
          print('MPW_FINAL_PATHS='+json.dumps(out,sort_keys=True))
          if any(v!=200 for v in out.values()):raise RuntimeError('FINAL_COMMERCIAL_PATH_FAILED')
          PY
      - name: Verify orders preserved
        run: |
          timeout 90s ssh -T -F "$RUNNER_TEMP/r/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging');os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,OrderItem
          p=Product.objects.get(pk=779);n=OrderItem.objects.filter(product_id=779).count()
          print('MPW_PRESERVED='+json.dumps({'active':p.active,'orders':n,'deleted':0}))
          if not p.active or n<1:raise RuntimeError('ORDER_PRESERVATION_FAILED')
          PY
      - name: Clean relay
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/r"
