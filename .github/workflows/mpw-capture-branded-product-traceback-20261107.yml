name: Capture MojPlayWin branded product traceback
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-capture-branded-product-traceback-20261107.yml"]
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Establish relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; umask 077; d="$RUNNER_TEMP/r"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/v"; printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/h"; chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/v" >/dev/null; ssh-keygen -y -P "" -f "$d/h" >/dev/null; ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vk" 2>/dev/null; test "$(ssh-keygen -lf "$d/vk" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/c" <<EOF
          Host v
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/v
            UserKnownHostsFile $d/vk
          Host h
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/h
            UserKnownHostsFile $d/hk
            ProxyJump v
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            RequestTTY no
          EOF
          timeout 30s ssh -F "$d/c" v 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/hc" 2>/dev/null; test "$(ssh-keygen -lf "$d/hc" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; mv "$d/hc" "$d/hk"
      - name: Capture view and template traceback without writes
        run: |
          timeout 90s ssh -T -F "$RUNNER_TEMP/r/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,traceback,inspect
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging');os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          import core.brand_views as m
          print('MPW_BRANDED_VIEW_SOURCE_BEGIN');print(inspect.getsource(m.branded_product));print('MPW_BRANDED_VIEW_SOURCE_END')
          from django.test import RequestFactory
          from core.models import Product
          for pk in (72,225,879):
              print('MPW_DIRECT_VIEW',pk)
              try:
                  request=RequestFactory().get('/store/product/%s/'%pk,secure=True,HTTP_HOST='mojplaywin.com')
                  response=m.branded_product(request,pk)
                  print('MPW_DIRECT_RESPONSE',pk,getattr(response,'status_code',None),len(getattr(response,'content',b'')))
              except BaseException:
                  traceback.print_exc()
          from django.template.loader import get_template
          for t in ('brands/mojplaywin/product.html','brands/mojplaywin/base.html'):
              print('MPW_TEMPLATE',t)
              try:
                  x=get_template(t);print('MPW_TEMPLATE_OK',x.origin.name)
              except BaseException:traceback.print_exc()
          PY
      - name: Clean relay
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/r"
