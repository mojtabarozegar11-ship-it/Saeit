name: MojPlayWin all main pages one-line legal footer
on:
  pull_request:
    paths:
      - "scripts/mpw_footer_singleline_atomic_20261019.py"
      - "tests/test_mpw_footer_singleline_20261019.py"
      - "core/templates/mojplaywin/footer.html"
      - ".github/workflows/mpw-footer-singleline-20261019.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mpw_footer_singleline_atomic_20261019.py"
      - ".github/workflows/mpw-footer-singleline-20261019.yml"
permissions: {contents: read}
concurrency:
  group: mojplaywin-all-main-footer-only-20261019
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify all footer formats and one line contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_footer_singleline_atomic_20261019.py
          python3 -m pip install -q pytest
          python3 -m pytest -q --noconftest tests/test_mpw_footer_singleline_20261019.py
          python3 scripts/mpw_footer_singleline_atomic_20261019.py selftest
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[approved-mpw-footer-singleline-20261019]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source unit tests and documented copyright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_footer_singleline_atomic_20261019.py
          python3 -m pip install -q pytest
          python3 -m pytest -q --noconftest tests/test_mpw_footer_singleline_20261019.py
          python3 scripts/mpw_footer_singleline_atomic_20261019.py selftest
      - name: Snapshot public baseline statuses and existing copyright locations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json,time,re
          static=['/about/','/about/mojtaba-rozegar/','/agents/','/company/',
              '/economy/','/industry/','/knowledge/','/market/','/research/',
              '/services/','/studio/','/ventures/agriculture/',
              '/ventures/cafe-restaurant/','/ventures/carpets/',
              '/ventures/currency-crypto/','/ventures/ecommerce/',
              '/ventures/fuel-station/','/ventures/hospitality/',
              '/ventures/jewelry-gold/']
          dynamic=['/'+p+'/' for p in ('store games ai contact support privacy terms cookies products blockchain commerce crypto-payments global-business research-lab canada-vision agro-industry agriculture education weather'.split())]
          protected=['/farnaz/','/saman/','/picm/','/taniya/','/zahra/']
          routes=list(dict.fromkeys(['/']+static+dynamic+protected))
          result={}
          def get(path):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPWMainLegalFooter/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as res:
                          return res.status,res.read(2200000).decode('utf-8','replace')
                  except urllib.error.HTTPError as e:
                      return e.code,e.read(1000).decode('utf-8','replace')
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          for path in routes:
              status,body=get(path)
              result[path]=status
              print('BEFORE_MAIN_FOOTER',path,status,flush=True)
              if path not in protected and status!=200:raise SystemExit('Unhealthy main route '+path)
              if path in static:
                  foot=re.findall(r'<footer\b[^>]*>[\s\S]*?</footer\s*>',body,re.I)
                  if len(foot)!=1 or 'MojPlayWin' not in foot[0]:
                      raise SystemExit('Main static branded footer missing '+path)
          with open(os.environ['RUNNER_TEMP']+'/mpw-legal-before.json','w') as f:json.dump(result,f)
          print('FOOTER_BASELINE='+str(len(routes))+' VERIFIED')
          PY
      - name: Open host-key-pinned relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Preflight actual 20 source files without modifying live site
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 70s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - audit" < scripts/mpw_footer_singleline_atomic_20261019.py
      - name: Atomic installation with exact private backups and rollback
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID'" < scripts/mpw_footer_singleline_atomic_20261019.py
      - name: Verify every known main-domain page and unchanged protected paths
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,os,re,json,time
          baseline=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-legal-before.json'))
          excluded={'/farnaz/','/saman/','/picm/','/taniya/','/zahra/'}
          expected='☆ All Rights Reserved. ☆ 2022. ☆ Mojtaba roozegar ☆'
          def get(path):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MPWFooterReleaseProof/1.0'})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=16) as r:
                          return r.status,r.read(2200000).decode('utf-8','replace')
                  except urllib.error.HTTPError as e:
                      if e.code>=500 and attempt<4:
                          time.sleep(3);continue
                      return e.code,e.read(1000).decode('utf-8','replace')
                  except Exception:
                      if attempt==4:raise
                      time.sleep(3)
          verified=0
          for path,prior in baseline.items():
              final,body=get(path)
              if final!=prior:raise SystemExit('Protected or main HTTP status changed '+path)
              if path in excluded:
                  print('CHILD_ROUTE_UNCHANGED',path,final,flush=True)
                  continue
              # The 19 main static pages and exact real homepage are directly changed; the other
              # routes inherit the updated shared template or research footer.
              got=False
              for attempt in range(5):
                  if attempt:
                      time.sleep(3)
                      _,body=get(path+'?_footer_fix='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  foot=re.findall(r'<footer\b[^>]*>[\s\S]*?</footer\s*>',body,re.I)
                  if len(foot)==1 and foot[0].count(expected)==1 and foot[0].count('class="mpw-legal-one-line"')==1:
                      got=True;break
              if not got:
                  raise SystemExit('Footer not yet consistent on '+path)
              print('ONE_LINE_MAIN_FOOTER',path,'OK',flush=True)
              verified+=1
          print('MPW_ALL_MAIN_ROUTES_FOOTER_VERIFIED='+str(verified))
          PY
      - name: Roll back all twenty-one exact files if any verification fails
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-consolidated-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_footer_singleline_atomic_20261019.py
