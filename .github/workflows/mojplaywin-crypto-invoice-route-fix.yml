name: MojPlayWin repair standalone payment invoice link (DISABLED)
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths:
      - .github/workflows/mojplaywin-crypto-invoice-route-fix.yml
permissions:
  contents: read
concurrency:
  group: mojplaywin-crypto-isolated-route-upgrade
  cancel-in-progress: false
jobs:
  payment-only-repair:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify reviewed old and new standalone PHP only
        shell: bash
        run: |
          set -euo pipefail
          php -l isolated_crypto_gateway/index.php
          python3 -m py_compile scripts/mojplaywin_crypto_upgrade_standalone.py
          git show d118204875428005a7252e2a05934cdbc86f4615:isolated_crypto_gateway/index.php > "$RUNNER_TEMP/payment-old.php"
          test "$(grep -c "const ROOT='https://mojplaywin.com/checkout/crypto/';" "$RUNNER_TEMP/payment-old.php")" = 1
          test "$(grep -c "const ROOT='https://mojplaywin.com/checkout/crypto/index.php';" isolated_crypto_gateway/index.php)" = 1
          diff -u <(sed "s@const ROOT='https://mojplaywin.com/checkout/crypto/';@const ROOT='https://mojplaywin.com/checkout/crypto/index.php';@" "$RUNNER_TEMP/payment-old.php") isolated_crypto_gateway/index.php
          echo "ONLY_PAYMENT_ROUTE_STRING_CHANGED=true"
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"


      - name: Upgrade only previously installed and inactive PHP handler
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          stage="/home/zomorod2/.mojpay-routefix-$GITHUB_RUN_ID"
          old="$(sha256sum "$RUNNER_TEMP/payment-old.php" | cut -d' ' -f1)"
          new="$(sha256sum isolated_crypto_gateway/index.php | cut -d' ' -f1)"
          curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/checkout/crypto/index.php | grep -qx 503
          timeout 25s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cleanup() {
            ssh -T -F "$d/config" saeit-cpanel "test -d '$stage' && rm -f -- '$stage/index.php' '$stage/upgrade.py' && rmdir -- '$stage'" || true
          }
          trap cleanup EXIT
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/index.php'" < isolated_crypto_gateway/index.php
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/upgrade.py'" < scripts/mojplaywin_crypto_upgrade_standalone.py
          timeout 45s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/upgrade.py' '$stage/index.php' '$old' '$new'"
          timeout 25s ssh -T -F "$d/config" saeit-cpanel "php -l /home/zomorod2/mojplaywin.com/checkout/crypto/index.php && php /home/zomorod2/mojplaywin.com/checkout/crypto/bootstrap.php status"
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/checkout/crypto/index.php)" = 503
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/store/)" = 200
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/farnaz/)" = 200
          echo "MAIN_STORE_AND_PROTECTED_CHILD_SMOKE=passed"
          echo "CANONICAL_PAYMENT_LINK=/checkout/crypto/index.php"
          echo "ACTUAL_MERCHANT_PAYMENTS_ENABLED=false"
