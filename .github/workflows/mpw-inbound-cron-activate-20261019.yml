name: MojPlayWin start verified incoming crypto settlement cron with delivery guards
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-inbound-cron-activate-20261019.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-main-site-incoming-settlement-only
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check noncustodial files compile and scoped execution paths
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_commerce_live_inbound_reconciler.py scripts/mpw_commerce_inbound_cron_installer.py
          python3 - <<'PY'
          from pathlib import Path
          a=Path('scripts/mpw_commerce_live_inbound_reconciler.py').read_text()
          b=Path('scripts/mpw_commerce_inbound_cron_installer.py').read_text()
          assert "mpw_commerce_reconcile" in a
          assert "mpw_commerce_inbound.lock" in b
          assert "APP='/home/zomorod2/Saeit-staging'" in a and "APP='/home/zomorod2/Saeit-staging'" in b
          assert "*/" not in b.split('CRON=(')[1].split(')\ndef')[0]
          print("MPW_INBOUND_SOURCE_GATES=PASS")
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Prove both live chain indexers respond before scheduling money reconciliation
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 105s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_payment_chain_probes_readonly.py > "$RUNNER_TEMP/mpw-inbound-provider-test.txt"
          python3 - "$RUNNER_TEMP/mpw-inbound-provider-test.txt" <<'PY'
          import json,sys
          text=open(sys.argv[1],encoding="utf8").read()
          found={}
          for line in text.splitlines():
              if line.startswith('MPW_CHAIN_PROVIDER='):
                  row=json.loads(line.split('=',1)[1]);found[row['asset']]=row['status']
          print('MPW_CHAIN_PROVIDER_GATES='+json.dumps(found))
          if found!={'ETH':'success','TRX':'success'}:
              raise SystemExit('Incoming chain observation is not safe to activate')
          print('MPW_CHAIN_PROVIDER_GATES=PASS')
          PY
      - name: Install private worker without replacing any Django code
        id: stage
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -d "$HOME/Saeit-staging" && test -d "$HOME/.private_mojplaywin_main_agents" && test ! -L "$HOME/.private_mojplaywin_main_agents"'
          scp -F "$d/config" scripts/mpw_commerce_live_inbound_reconciler.py saeit-cpanel:/home/zomorod2/.private_mojplaywin_main_agents/mpw_commerce_live_inbound_reconciler.py
          scp -F "$d/config" scripts/mpw_commerce_inbound_cron_installer.py saeit-cpanel:/home/zomorod2/.private_mojplaywin_main_agents/mpw_commerce_inbound_cron_installer.py
          cat > "$RUNNER_TEMP/mpw-check-sha.txt" <<EOF
          $(sha256sum scripts/mpw_commerce_live_inbound_reconciler.py | cut -d' ' -f1)
          $(sha256sum scripts/mpw_commerce_inbound_cron_installer.py | cut -d' ' -f1)
          EOF
          timeout 35s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/home/zomorod2/.private_mojplaywin_main_agents')
          for name in ('mpw_commerce_live_inbound_reconciler.py','mpw_commerce_inbound_cron_installer.py'):
              q=p/name
              if q.is_symlink() or not q.is_file():raise SystemExit('Invalid worker staging file')
              q.chmod(0o600)
          print('MPW_INBOUND_WORKER_FILES=STAGED')
          PY
      - name: Run actual commerce reconciler once before installing cron
        id: once
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/.private_mojplaywin_main_agents/mpw_commerce_live_inbound_reconciler.py --once'
          echo MPW_INCOMING_COMMERCE_ONCE=PASS
      - name: Append only one every-minute no-withdrawal commerce cron with backup
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/.private_mojplaywin_main_agents/mpw_commerce_inbound_cron_installer.py install '$GITHUB_RUN_ID'"
      - name: Verify main host and protected sibling HTTP responses
        id: smoke
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          result={}
          for path in ('/','/store/','/store/product/72/','/store/product/225/','/taniya/','/farnaz/','/saman/','/picm/'):
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+path,timeout=18) as r:result[path]=r.status
              except urllib.error.HTTPError as e:result[path]=e.code
          print('MPW_INBOUND_AFTER_HEALTH='+json.dumps(result))
          if any(v!=200 for v in result.values()):raise SystemExit('Protected site regression')
          PY
      - name: Roll back only new cron entry if any postinstall verification fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/.private_mojplaywin_main_agents/mpw_commerce_inbound_cron_installer.py rollback '$GITHUB_RUN_ID'"
