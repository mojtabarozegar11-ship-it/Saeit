name: Signal merchant-host locale boundary C35
on:
  push:
    branches:
      - fix/signal-host-locale-boundary-c35-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SECRET_KEY: signal-local-ci-only-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and exact tests
        run: python -m py_compile core/financial_brand_pages.py tests/test_financial_host_locale.py
      - name: Django system check
        run: python manage.py check
      - name: Static manifest
        run: python manage.py collectstatic --noinput
      - name: Finance signal identity and merchant isolation regressions
        run: pytest -q tests/test_financial_host_locale.py tests/test_signal_commercial_catalog.py
