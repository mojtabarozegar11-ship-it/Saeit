name: Zomorod site agent runtime audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-site-agent-runtime-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zomorod-site-agent-runtime-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-site-audit"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"

      - name: Read site agent runtime state without modifying the host
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-site-audit/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app="$HOME/Saeit"
          test -d "$app" || { echo "SITE_APP_DIRECTORY=missing"; exit 0; }
          echo "SITE_APP_DIRECTORY=present"

          python3 - <<'PY'
          import json, subprocess
          p=subprocess.run(["uapi","--output=json","PassengerApps","list_applications"],capture_output=True,text=True)
          if p.returncode:
              print("PASSENGER_APP_QUERY=failed")
              raise SystemExit(0)
          data=json.loads(p.stdout)
          stack=[data]; matches=[]
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/":
                      matches.append(x)
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          print("PASSENGER_ROOT_APP_COUNT="+str(len(matches)))
          for x in matches:
              print("PASSENGER_ROOT_PATH_MATCH="+str(x.get("path")=="/home/zomorod2/Saeit").lower())
              version=x.get("python_version") or x.get("python_version_name")
              if isinstance(version,str) and len(version)<10 and version[0].isdigit(): print("PASSENGER_PYTHON_VERSION="+version)
          PY

          selected=""
          candidate_list="$(mktemp)"
          trap 'rm -f -- "$candidate_list"' EXIT
          if test -d "$HOME/virtualenv"; then
            find "$HOME/virtualenv" -path '*/Saeit/*/bin/python*' -executable -print 2>/dev/null | sort -u > "$candidate_list"
          fi
          while IFS= read -r candidate; do
            if test -x "$candidate" && "$candidate" -c 'import django, environ, rest_framework, whitenoise' >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done < "$candidate_list"
          rm -f -- "$candidate_list"
          trap - EXIT
          if test -n "$selected"; then
            echo "DJANGO_RUNTIME=ready"
            echo "DJANGO_RUNTIME_PATH=$selected"
            cd "$app"
            check_log="$(mktemp)"
            if "$selected" manage.py check --deploy >"$check_log" 2>&1; then echo "DJANGO_DEPLOY_CHECK=passed"; else echo "DJANGO_DEPLOY_CHECK=failed"; fi
            if "$selected" manage.py production_gate >"$check_log" 2>&1; then echo "PRODUCTION_GATE=passed"; else echo "PRODUCTION_GATE=failed"; fi
            rm -f "$check_log"
          else
            echo "DJANGO_RUNTIME=not_ready"
          fi

          python3 - "$app/.env" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          found=False
          if p.is_file():
              for line in p.read_text(errors="ignore").splitlines():
                  if line.strip().startswith("OPENAI_API_KEY=") and line.split("=",1)[1].strip().strip("'\""):
                      found=True
                      break
          print("MODEL_KEY_IN_DOTENV="+str(found).lower())
          PY

          cron="$(crontab -l 2>/dev/null || true)"
          echo "CPANEL_CRONTAB_PRESENT=$([ -n "$cron" ] && echo yes || echo no)"
          if printf '%s' "$cron" | grep -Eq 'knowledge_agent_(cycle|generate)|company_activity_agent_cycle|publish_scheduled_news'; then
            echo "SITE_AGENT_CRON=present"
          else
            echo "SITE_AGENT_CRON=not_found"
          fi
          REMOTE
