name: cPanel historical Astra SQLite RAM-only protected rows audit
on:
  pull_request:
    paths:
      - .github/workflows/cpanel-astra-backup-memfd-sqlite-protected-row-census-20261025.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read gzip SQLite historical snapshots from RAM without any host disk writes
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-incomplete-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          timeout 330s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,json,gzip,sqlite3,subprocess,time,re
          h=Path('/home/zomorod2')
          root=h/'Saeit-staging/var/factory/astra-backups'
          if os.geteuid()==0 or Path.home()!=h or root.is_symlink() or not root.is_dir():
              raise SystemExit('UNSAFE_ACCOUNT_ROOT')
          if not hasattr(os,'memfd_create'):raise SystemExit('MEMFD_NOT_AVAILABLE')
          gzs=sorted(p for p in root.glob('*/mojplaywin.sqlite3.gz') if p.is_file() and not p.is_symlink())
          out=[]
          pattern=re.compile('order|payment|buyer|customer|client|invoice|contact|inquiry|trade|email|subscriber|enroll|purchase|sales|wallet|ledger|chat|message|lead',re.I)
          for p in gzs:
              entry={'rel':str(p.relative_to(root))[:120],'bytes':p.stat().st_size}
              fd=-1
              try:
                  with gzip.open(str(p),'rb') as stream:raw=stream.read(128*1024*1024+1)
                  if len(raw)>128*1024*1024:raise ValueError('exceeds_memory_cap')
                  if not raw.startswith(b'SQLite format 3'):raise ValueError('unexpected_header')
                  fd=os.memfd_create('readonly-sqlite-audit',os.MFD_CLOEXEC if hasattr(os,'MFD_CLOEXEC') else 0)
                  view=memoryview(raw)
                  done=0
                  while done<len(view):
                      done+=os.write(fd,view[done:done+1048576])
                  del view,raw
                  uri='file:/proc/self/fd/'+str(fd)+'?mode=ro&immutable=1'
                  db=sqlite3.connect(uri,uri=True,timeout=8)
                  try:
                      tbl=[x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")]
                      flagged={}
                      for t in tbl:
                          if pattern.search(t):
                              quoted='"'+t.replace('"','""')+'"'
                              flagged[t]=int(db.execute('SELECT COUNT(*) FROM '+quoted).fetchone()[0])
                      entry['flagged_counts']=flagged
                      entry['product_count']=int(db.execute('SELECT COUNT(*) FROM core_product').fetchone()[0]) if 'core_product' in tbl else None
                      entry['table_count']=len(tbl)
                      entry['read_ok']=True
                  finally:db.close()
              except Exception as e:entry['read_ok']=False;entry['error_type']=type(e).__name__
              finally:
                  if fd>=0:os.close(fd)
              out.append(entry)
          print('CPANEL_RAM_SQLITE_OLD_ASTRA='+json.dumps({'archives':out,'total_archive_count':len(out),'all_records_safely_read':all(x.get('read_ok') for x in out),
          'read_only':True,'host_disk_writes':0},sort_keys=True),flush=True)

          PY
          echo CPANEL_SQLITE_RAM_AUDIT=PASS
