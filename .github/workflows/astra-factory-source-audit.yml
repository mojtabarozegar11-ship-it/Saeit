name: Astra Factory Architecture Source Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/astra-factory-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-astra-source-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read original Astra archive and existing factory state without modifying VPS
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/astra-source-audit"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo ASTRA_HOST="$(hostname)"
          for p in "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" "$HOME/factory-runtime/operations" "$HOME/factory-runtime/django-app"; do
            if test -e "$p"; then echo "ASTRA_PATH_PRESENT=$(basename "$p")"; else echo "ASTRA_PATH_MISSING=$(basename "$p")"; fi
          done
          p="$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz"
          if test -f "$p" && test ! -L "$p"; then
            sha256sum "$p" | awk '{print "ASTRA_ARCHIVE_SHA256=" $1}'
            stat -c 'ASTRA_ARCHIVE_BYTES=%s' "$p"
            python3 - "$p" <<'PY'
          import sys,tarfile,re
          f=sys.argv[1]
          with tarfile.open(f,"r:gz") as tar:
              members=tar.getmembers()
              print("ASTRA_ARCHIVE_ENTRIES="+str(len(members)))
              for m in members[:160]:
                  name=m.name
                  if re.fullmatch(r"[A-Za-z0-9_./+@ -]{1,180}",name):
                      print("ASTRA_MEMBER="+m.name+" TYPE="+("file" if m.isfile() else "directory" if m.isdir() else "other")+" SIZE="+str(m.size))
              for m in members:
                  name=m.name
                  if not m.isfile() or m.size>200000 or not name.lower().endswith((".md",".txt",".rst")):
                      continue
                  if not re.search(r"arch|plan|stage|phase|migration|readme|factory|astra|implementation",name,re.I):
                      continue
                  source=tar.extractfile(m)
                  if source is None: continue
                  lines=source.read(200000).decode("utf-8","replace").splitlines()
                  selected=[]
                  for line in lines:
                      line=line.strip()
                      if (re.match(r"^#{1,5}\s+[A-Za-z0-9]",line) or re.match(r"^(stage|phase|step|milestone|architecture|objective|security|migration|rollout|rollback|risk|prerequisite)[ :0-9-]",line,re.I)) and len(line)<160:
                          selected.append(re.sub(r"(?i)(token|secret|password|key|credential)\s*[=:].*","[REDACTED]",line))
                  print("ASTRA_DOCUMENT="+name+" LINES="+str(len(lines)))
                  for line in selected[:40]: print("ASTRA_SECTION="+line)
          PY
          fi
          echo ASTRA_DESIGN_COMPARISON_BEGIN
          python3 - "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" "$HOME/factory-runtime/django-app" <<'PY'
          from pathlib import Path
          import sys, tarfile, hashlib, re, json
          archive=Path(sys.argv[1]); deployed=Path(sys.argv[2])
          with tarfile.open(archive,"r:gz") as tf:
              source_files=[m for m in tf.getmembers() if m.isfile() and m.name.startswith("files/")]
              same, different, absent=[],[],[]
              for m in source_files:
                  rel=m.name[6:]
                  if not re.fullmatch(r"[A-Za-z0-9_./-]{1,200}",rel) or ".." in Path(rel).parts: continue
                  current=deployed / rel
                  if not current.is_file() or current.is_symlink():
                      absent.append(rel)
                      continue
                  original=tf.extractfile(m).read()
                  (same if hashlib.sha256(original).digest()==hashlib.sha256(current.read_bytes()).digest() else different).append(rel)
              print("ASTRA_DEPLOYED_SAME="+str(len(same)))
              print("ASTRA_DEPLOYED_DIFFERENT="+str(len(different)))
              print("ASTRA_DEPLOYED_ABSENT="+str(len(absent)))
              for k,paths in (("DIFFERENT",different),("ABSENT",absent)):
                  for item in paths[:50]: print("ASTRA_DEPLOYED_"+k+"_PATH="+item)
              m=tf.getmember("files/docs/ASTRA_LUNA_HANDOFF.md")
              source=tf.extractfile(m).read().decode("utf-8","replace").splitlines()
              print("ASTRA_HANDOFF_LINECOUNT="+str(len(source)))
              for n,line in enumerate(source,1):
                  row=line.strip()
                  if not row or len(row)>220: continue
                  if re.search(r"(private.key|ssh-rsa|BEGIN .* PRIVATE|PASSWORD\s*[:=]|SECRET\s*[:=]|TOKEN\s*[:=]|API_KEY\s*[:=])",row,re.I):continue
                  if re.match(r"^#{1,6}\s|^\d+[.)]\s|^\s*[-*]\s",row):
                      row=re.sub(r"(?:\d{1,3}\.){3}\d{1,3}","[HOST]",row)
                      row=re.sub(r"https?://[^\s)]+","[LINK]",row)
                      print("ASTRA_PLAN_LINE_"+str(n)+"="+row[:220])
          PY
          python3 - "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" "$HOME/factory-runtime/django-app" <<'PY'
          import tarfile,sys,re,pathlib
          f,base=sys.argv[1:]
          with tarfile.open(f,"r:gz") as tf:
              lines=tf.extractfile("files/docs/ASTRA_LUNA_HANDOFF.md").read().decode("utf-8","replace").splitlines()
              for n,line in enumerate(lines,1):
                  if not (14<=n<=137):continue
                  line=line.strip()
                  if not line:continue
                  if re.search(r"(PRIVATE KEY|SECRET_KEY\s*[=:]|PASSWORD\s*[=:]|TOKEN\s*[=:]|API[_-]?KEY\s*[=:])",line,re.I): continue
                  line=re.sub(r"(?:\d{1,3}\.){3}\d{1,3}","[HOST]",line)
                  line=re.sub(r"https?://[^\s)]+","[LINK]",line)
                  print("ASTRA_DOC_%03d=%s"%(n,line[:250]))
              for file in ("core/migrations/0049_factory_durable_queues.py","core/management/commands/factory_health.py","core/management/commands/factory_recover.py"):
                  body=tf.extractfile("files/"+file).read().decode("utf-8","replace")
                  print("ASTRA_SOURCE_FILE="+file)
                  for n,line in enumerate(body.splitlines(),1):
                      if len(line)>200:continue
                      if re.search(r"dependencies|class Command|class Migration|class Factory|def handle|def add_arguments|^\s*\(|^\s*\)|migrations\.|^\s*name=|^\s*options=",line):
                          print("ASTRA_CODE_%d=%s"%(n,line.strip()[:200]))
              migration=pathlib.Path(base)/"core/migrations"
              print("ASTRA_CURRENT_MIGRATION_MAX="+max((x.name for x in migration.glob("[0-9][0-9][0-9][0-9]*.py")),default="none"))
          PY
          python3 - "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" "$HOME/factory-runtime/django-app" <<'PY'
          import tarfile,sys,ast,re,os
          archive,site=sys.argv[1:]
          with tarfile.open(archive,"r:gz") as tf:
              for name in ("files/config/factory_local_settings.py","files/core/management/commands/factory_staging_tick.py","files/core/factory_queue.py"):
                  body=tf.extractfile(name).read().decode("utf-8","replace")
                  print("ASTRA_COMPAT_FILE="+name)
                  if name.endswith("settings.py"):
                      for i,line in enumerate(body.splitlines(),1):
                          if re.search(r"(SECRET|PASSWORD|KEY|TOKEN|CREDENTIAL)",line,re.I):
                              print("ASTRA_COMPAT_SETTING_REDACTED_LINE="+str(i))
                          else:
                              print("ASTRA_COMPAT_SETTING_LINE_%d=%s"%(i,line[:180]))
                  else:
                      tree=ast.parse(body)
                      for node in ast.walk(tree):
                          if isinstance(node,(ast.FunctionDef,ast.ClassDef)):
                              print("ASTRA_COMPAT_SYMBOL="+node.name)
              current=os.path.join(site,"config","settings.py")
              if os.path.isfile(current):
                  body=open(current,encoding="utf-8").read()
                  for word in ("DJANGO_SECRET_KEY","SECRET_KEY","DATABASE_URL","SAEIT_ENV","MOJ_FACTORY_LOCAL_MODE"):
                      print("ASTRA_DEPLOYED_CONFIG_HAS_"+word+"="+str(word in body))
          PY
          python3 - "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" "$HOME/factory-runtime/django-app" <<'PY'
          import tarfile,sys,re,pathlib
          with tarfile.open(sys.argv[1],"r:gz") as tf:
              for name in ("files/core/management/commands/factory_seed_hypotheses.py","files/core/factory_queue.py"):
                  data=tf.extractfile(name).read().decode("utf-8","replace").splitlines()
                  print("ASTRA_INPUT_SOURCE="+name)
                  for n,line in enumerate(data,1):
                      if name.endswith("factory_seed_hypotheses.py") or re.search("hypothes|seed_hypotheses|factory_hypotheses",line,re.I):
                          if re.search("PASSWORD|SECRET|PRIVATE KEY|TOKEN|CREDENTIAL",line,re.I):continue
                          print("ASTRA_INPUT_CODE_%d=%s"%(n,line[:170]))
              for p in (pathlib.Path(sys.argv[2])/"var/factory/hypotheses.json",
                        pathlib.Path(sys.argv[2])/"var/factory/discovery/hypotheses.json"):
                  print("ASTRA_INPUT_EXISTING="+str(p.relative_to(sys.argv[2]))+" IS_FILE="+str(p.is_file()))
          PY
          python3 - "$HOME/factory-transfer-incoming/astra-factory-full-architecture.tar.gz" <<'PY'
          import tarfile,sys,re
          with tarfile.open(sys.argv[1],"r:gz") as tf:
              lines=tf.extractfile("files/core/factory_queue.py").read().decode("utf-8","replace").splitlines()
              for n,line in enumerate(lines,1):
                  if 1<=n<=115:
                      if re.search(r"PASSWORD|SECRET_KEY\s*=|API_KEY|PRIVATE KEY|CREDENTIAL",line,re.I):continue
                      print("ASTRA_SEED_IMPL_%03d=%s"%(n,line[:170]))
          PY
          echo ASTRA_DESIGN_COMPARISON_DONE
          echo ASTRA_AUDIT_READ_ONLY_COMPLETE
          REMOTE
