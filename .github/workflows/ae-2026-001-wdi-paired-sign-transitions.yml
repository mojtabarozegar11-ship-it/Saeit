name: AE-2026-001 independent archived WDI paired sign transitions
on:
  push:
    branches:
      - research/mr-2026-001-novelty-audit
    paths:
      - .github/workflows/ae-2026-001-wdi-paired-sign-transitions.yml
      - research/manuscripts/AE-2026-001/analysis/wdi_archived_panel_sign_transition.py
      - research/manuscripts/AE-2026-001/AE-2026-001_OFFICIAL_WDI_OBSERVED_COUNTRY_PANEL_2026-10-25.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce-from-original-archived-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute actual source-backed paired transition matrix
        run: |
          python research/manuscripts/AE-2026-001/analysis/wdi_archived_panel_sign_transition.py --out /tmp/wdi-paired-transitions
      - name: Retain independently computed CSV, JSON and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: AE-2026-001-REAL-WDI-PAIRED-SIGN-TRANSITIONS-NO-CAUSALITY
          path: /tmp/wdi-paired-transitions/
          if-no-files-found: error
          retention-days: 14
