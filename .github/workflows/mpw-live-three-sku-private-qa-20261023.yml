name: Private QA copies of three existing MojPlayWin store products
# Owner-directed 2026-10-26: preserve all three live listings, copy existing
# immutable bytes to the private VPS factory, and require proof before any replacement.
on:
  pull_request:
    paths:
      - scripts/mpw_live_three_sku_qa_copy_20261023.py
      - scripts/mpw_three_sku_factory_quality1000_20261026.py
      - tests/test_mpw_three_sku_factory_quality1000_20261026.py
      - tests/test_mpw_live_three_sku_qa_copy_20261023.py
      - .github/requirements/mpw-pdf-parser.txt
      - .github/requirements/mpw-pdf-renderer.txt
      - scripts/mpw_three_sku_private_content_audit_20261026.py
      - tests/test_mpw_three_sku_private_content_audit_20261026.py
      - .github/workflows/mpw-live-three-sku-private-qa-20261023.yml
  push:
    branches: [main]
    paths:
      - scripts/mpw_three_sku_private_content_audit_20261026.py
      - tests/test_mpw_three_sku_private_content_audit_20261026.py
      - scripts/mpw_live_three_sku_qa_copy_20261023.py
      - scripts/mpw_three_sku_factory_quality1000_20261026.py
      - tests/test_mpw_three_sku_factory_quality1000_20261026.py
      - tests/test_mpw_live_three_sku_qa_copy_20261023.py
      - .github/requirements/mpw-pdf-parser.txt
      - .github/requirements/mpw-pdf-renderer.txt
      - .github/workflows/mpw-live-three-sku-private-qa-20261023.yml
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {contents: read}
concurrency:
  group: mpw-existing-three-private-factory-quality-copy
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Install hash-pinned PDF parser for real PDF validation
        shell: bash
        run: |
          set -euo pipefail
          parser="$RUNNER_TEMP/mpw-pdf-parser"
          install -d -m 700 "$parser"
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes --target "$parser" -r .github/requirements/mpw-pdf-parser.txt
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: --platform manylinux_2_17_x86_64 --implementation py --python-version 311 --abi none --target "$parser" -r .github/requirements/mpw-pdf-renderer.txt
          PYTHONPATH="$parser" python3 -c 'import PyPDF2,importlib.metadata; assert PyPDF2.__version__ == "3.0.1"; assert importlib.metadata.version("pypdfium2") == "5.14.0"'
      - name: Verify exact live SKU selection, hash receipts and no storefront replacement
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$RUNNER_TEMP/mpw-pdf-parser" python3 -B -m unittest discover -s tests -p test_mpw_live_three_sku_qa_copy_20261023.py -v
          PYTHONPATH="$RUNNER_TEMP/mpw-pdf-parser" python3 -B -m unittest discover -s tests -p test_mpw_three_sku_factory_quality1000_20261026.py -v
          PYTHONPATH="$RUNNER_TEMP/mpw-pdf-parser" python3 -B -m unittest discover -s tests -p test_mpw_three_sku_private_content_audit_20261026.py -v
          python3 -B -m py_compile scripts/mpw_live_three_sku_qa_copy_20261023.py scripts/mpw_three_sku_factory_quality1000_20261026.py scripts/mpw_three_sku_private_content_audit_20261026.py

  private-copy:
    needs: tests
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Build hash-pinned PDF parser bundle for private factory only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          install -d -m 700 "$d" "$d/parser"
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes --target "$d/parser" -r .github/requirements/mpw-pdf-parser.txt
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: --platform manylinux_2_17_x86_64 --implementation py --python-version 311 --abi none --target "$d/parser" -r .github/requirements/mpw-pdf-renderer.txt
          PYTHONPATH="$d/parser" python3 -c 'import PyPDF2,importlib.metadata; assert PyPDF2.__version__ == "3.0.1"; assert importlib.metadata.version("pypdfium2") == "5.14.0"'
          tar -C "$d/parser" -czf "$d/PyPDF2-3.0.1.tar.gz" PyPDF2 pypdf2-3.0.1.dist-info typing_extensions.py typing_extensions-4.13.2.dist-info pypdfium2 pypdfium2_raw pypdfium2-5.14.0.dist-info
          sha256sum "$d/PyPDF2-3.0.1.tar.gz" > "$d/PyPDF2-3.0.1.tar.gz.sha256"
      - name: Establish pinned no-agent-forwarding GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          install -d -m 700 "$d"
          for variable in VPS_KEY HOST_KEY; do
            file="$d/$variable.key"
            printf '%s' "${!variable}" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$file"
            chmod 600 "$file"
            ssh-keygen -y -P '' -f "$file" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Provision verified parser in a private versioned VPS dependency directory
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          archive="/home/githubops/factory-runtime/private/dependencies/.PyPDF2-3.0.1-$GITHUB_RUN_ID.tar.gz"
          expected="$(cut -d' ' -f1 "$d/PyPDF2-3.0.1.tar.gz.sha256")"
          timeout 45s ssh -T -F "$d/config" saeit-vps "install -d -m 700 /home/githubops/factory-runtime/private/dependencies && test ! -e '$archive'"
          scp -F "$d/config" "$d/PyPDF2-3.0.1.tar.gz" "saeit-vps:$archive"
          timeout 20s ssh -T -F "$d/config" saeit-vps "chmod 600 '$archive'"
          installer="$(cat <<'PY'
          import hashlib, os, pathlib, shutil, subprocess, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          run_id = sys.argv[3]
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("PARSER_BUNDLE_HASH_MISMATCH")
          dest = pathlib.Path("/home/githubops/factory-runtime/private/dependencies/PyPDF2-3.0.1")
          stale = dest.parent / ".PyPDF2-3.0.1-40251823204"
          if stale.exists():
              if stale.is_symlink():
                  raise SystemExit("PARSER_STALE_TEMP_PATH_UNSAFE")
              shutil.rmtree(stale)
          if dest.exists():
              check = subprocess.run(["python3", "-c", "import PyPDF2;assert PyPDF2.__version__=='3.0.1'"],
                  env={**os.environ, "PYTHONPATH": str(dest)}, check=False)
              if check.returncode:
                  raise SystemExit("EXISTING_PARSER_VERSION_INVALID")
              archive.unlink()
              print("PINNED_PDF_PARSER_REUSED=true")
              raise SystemExit(0)
          temp = dest.parent / (".PyPDF2-3.0.1-" + run_id)
          if temp.exists():
              if temp.is_symlink():
                  raise SystemExit("PARSER_TEMP_PATH_UNSAFE")
              shutil.rmtree(temp)
          temp.mkdir(mode=0o700)
          total = 0
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              if not members or len(members) > 2000:
                  raise SystemExit("PARSER_ARCHIVE_MEMBER_LIMIT")
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or ".." in p.parts or not p.parts or p.parts[0] not in {"PyPDF2", "pypdf2-3.0.1.dist-info", "typing_extensions.py", "typing_extensions-4.13.2.dist-info", "pypdfium2", "pypdfium2_raw", "pypdfium2-5.14.0.dist-info"}:
                      raise SystemExit("PARSER_ARCHIVE_PATH_INVALID")
                  if not (member.isdir() or member.isfile()) or member.issym() or member.islnk():
                      raise SystemExit("PARSER_ARCHIVE_TYPE_INVALID")
                  total += member.size
                  if total > 100000000:
                      raise SystemExit("PARSER_ARCHIVE_SIZE_LIMIT")
                  target = temp.joinpath(*p.parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True, mode=0o700)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                      source = bundle.extractfile(member)
                      if source is None:
                          raise SystemExit("PARSER_ARCHIVE_MEMBER_EMPTY")
                      with source, target.open("xb") as output:
                          shutil.copyfileobj(source, output)
                      os.chmod(target, 0o600)
          for directory, subdirs, _ in os.walk(temp):
              os.chmod(directory, 0o700)
          check = subprocess.run(["python3", "-c", "import PyPDF2;assert PyPDF2.__version__=='3.0.1'"],
              env={**os.environ, "PYTHONPATH": str(temp)}, check=False)
          if check.returncode:
              raise SystemExit("INSTALLED_PARSER_VERSION_INVALID")
          os.rename(temp, dest)
          os.chmod(dest, 0o700)
          archive.unlink()
          print("PINNED_PDF_PARSER_INSTALLED=true")
          PY
          )"
          installer_b64="$(printf '%s' "$installer" | base64 -w0)"
          timeout 60s ssh -T -F "$d/config" saeit-vps "python3 -c 'import base64;exec(base64.b64decode(\"$installer_b64\"))' '$archive' '$expected' '$GITHUB_RUN_ID'"
      - name: Stream exactly three read-only live retail files into private factory QA
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          source="$(base64 -w0 scripts/mpw_live_three_sku_qa_copy_20261023.py)"
          test -n "$source"
          timeout 650s ssh -T -F "$d/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c 'import base64;exec(base64.b64decode(\"$source\"))' site-export" \
            | timeout 650s ssh -T -F "$d/config" saeit-vps \
            "python3 -c 'import base64;exec(base64.b64decode(\"$source\"))' vps-ingest"
          echo 'MPW_THREE_EXISTING_STORE_PRODUCTS_PRIVATE_COPY_TRANSFER=PASS'
          echo 'MPW_THREE_LIVE_STORE_PRODUCTS_MODIFIED=false'
          echo 'MPW_THREE_STORE_PRICES_CHECKOUT_MODIFIED=false'
      - name: Admit three exact hash-bound factory copies into 100-criterion, no-fake-1000 rework lane
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          script="$(base64 -w0 scripts/mpw_three_sku_factory_quality1000_20261026.py)"
          test -n "$script"
          timeout 155s ssh -T -F "$d/config" saeit-vps \
            "PYTHONPATH=\"\$HOME/factory-runtime/private/dependencies/PyPDF2-3.0.1\" python3 -c 'import base64;exec(base64.b64decode(\"$script\"))'"
          echo 'MPW_THREE_EXISTING_STORE_SKUS_FACTORY_QUALITY1000_REWORK_ADMITTED=PASS'
          echo 'MPW_PROFESSIONAL_QUALITY_1000_PENDING_EXTERNAL_EVIDENCE=true'
      - name: Execute private content audit over all pages and packaged assets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          script="$(base64 -w0 scripts/mpw_three_sku_private_content_audit_20261026.py)"
          test -n "$script"
          timeout 210s ssh -T -F "$d/config" saeit-vps \
            "PYTHONPATH=\"\$HOME/factory-runtime/private/dependencies/PyPDF2-3.0.1\" python3 -c 'import base64;exec(base64.b64decode(\"$script\"))'"
          echo 'MPW_PRIVATE_CONTENT_BYTES_EMITTED=0'
          echo 'MPW_PRIVATE_CONTENT_AUDIT_REPORTS=3'
          echo 'MPW_QUALITY1000_CERTIFIED=0'
      - name: Confirm public storefront routes remain reachable
        shell: bash
        run: |
          for id in 72 225 879; do
            status="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com/store/product/$id/")" || status=000
            echo "MPW_STORE_PRODUCT_${id}_HTTPS=$status"
          done
      - name: Remove only this run's transient SSH identity
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/mpw-live-three-private-qa"; then
            rm -rf -- "$RUNNER_TEMP/mpw-live-three-private-qa"
          fi
