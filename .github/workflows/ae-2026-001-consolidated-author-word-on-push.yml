name: AE-2026-001 consolidated author-review Word (staging only)
on:
  push:
    branches:
      - research/mr-2026-001-novelty-audit
    paths:
      - research/manuscripts/AE-2026-001/AE-2026-001_CONSOLIDATED_AUTHOR_REVIEW_MANUSCRIPT_2026-10-27.md
      - .github/workflows/ae-2026-001-consolidated-author-word-on-push.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ae-2026-001-consolidated-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  author-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and research restrictions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/mr-2026-001-novelty-audit"
          mkdir -p /tmp/ae-consolidated
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('research/manuscripts/AE-2026-001/AE-2026-001_CONSOLIDATED_AUTHOR_REVIEW_MANUSCRIPT_2026-10-27.md')
          s=p.read_text(encoding='utf-8')
          for marker in ['155 economies','153','NV.AGR.EMPL.KD','ILOSTAT','countryatlas','### 2.6','### 3.4','| 0.5 | 42 | 3 |','MAJOR REVISION / NO SUBMISSION']:
              assert marker in s, f'Missing required scientific marker: {marker}'
          assert s.count('## 3. Results')==1 and s.count('## 4. Discussion')==1
          info={'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                'source_bytes':p.stat().st_size,
                'source_path':str(p),
                'status':'INTERNAL AUTHOR REVIEW ONLY; NOT SUBMITTED; NOT APPROVED'}
          Path('/tmp/ae-consolidated/SOURCE_MANIFEST.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(info))
          PY
      - name: Build consolidated DOCX and inspect content
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pandoc
          fi
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          pandoc --from=gfm --to=docx --standalone \
            research/manuscripts/AE-2026-001/AE-2026-001_CONSOLIDATED_AUTHOR_REVIEW_MANUSCRIPT_2026-10-27.md \
            -o /tmp/ae-consolidated/AE-2026-001_CONSOLIDATED_AUTHOR_REVIEW_NOT_SUBMITTED.docx
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          p=Path('/tmp/ae-consolidated/AE-2026-001_CONSOLIDATED_AUTHOR_REVIEW_NOT_SUBMITTED.docx')
          d=Document(p)
          t='\n'.join([x.text for x in d.paragraphs]+[c.text for tab in d.tables for row in tab.rows for c in row.cells])
          for marker in ['155','153','NV.AGR.EMPL.KD','ILOSTAT','countryatlas','2.6','3.4','MAJOR REVISION / NO SUBMISSION']:
              assert marker in t, f'Word missing marker: {marker}'
          assert len(d.tables)>=3, f'Unexpected table count: {len(d.tables)}'
          assert p.stat().st_size>15000
          print('Source-aligned author Word PASS:',p.stat().st_size,'bytes',len(d.tables),'tables')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AE-2026-001-consolidated-author-review-NOT-SUBMITTED
          path: /tmp/ae-consolidated/
          retention-days: 30
          if-no-files-found: error
