name: MojPlayWin isolated expired invoice recovery hotfix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-invoice-expiry-guarded-release-20261026.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-invoice-expiry-guarded-one-file
  cancel-in-progress: false
jobs:
  guarded-invoice-ux:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-only transactional patch self-test
        run: |
          set -euo pipefail
          python3 -B scripts/mpw_invoice_expired_safe_hotfix_20261026.py --selftest
          python3 -B -m py_compile scripts/mpw_invoice_expired_safe_hotfix_20261026.py
      - name: Baseline protected public route status
        id: baseline
        run: |
          set -euo pipefail
          mpw="$(curl -L --silent --output /dev/null --max-time 20 --write-out '%{http_code}' https://mojplaywin.com/store/)"
          zm="$(curl -L --silent --output /dev/null --max-time 20 --write-out '%{http_code}' https://zomorodmelal.ir/)"
          [[ "$mpw" = 200 ]] || exit 10
          [[ "$zm" =~ ^[23][0-9][0-9]$ ]] || exit 11
          echo "mpw=$mpw" >> "$GITHUB_OUTPUT"
          echo "zm=$zm" >> "$GITHUB_OUTPUT"
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Apply single-module expired-invoice repair with immutable original backup
        id: patch
        run: |
          set -euo pipefail
          timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B - apply "$GITHUB_RUN_ID" < scripts/mpw_invoice_expired_safe_hotfix_20261026.py
      - name: Compare protected routes and invoice login path after Passenger restart
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            mpw="$(curl -L --silent --output /dev/null --max-time 15 --write-out '%{http_code}' https://mojplaywin.com/store/ || true)"
            zm="$(curl -L --silent --output /dev/null --max-time 15 --write-out '%{http_code}' https://zomorodmelal.ir/ || true)"
            if [[ "$mpw" = "${{ steps.baseline.outputs.mpw }}" && "$zm" = "${{ steps.baseline.outputs.zm }}" ]]; then
              break
            fi
            sleep 2
          done
          test "$mpw" = "${{ steps.baseline.outputs.mpw }}"
          test "$zm" = "${{ steps.baseline.outputs.zm }}"
          echo "MPW_INVOICE_HOST_REPAIR_PUBLIC_SMOKE=PASS"
      - name: Roll back only this run if public health regresses
        if: failure() && steps.patch.outcome == 'success'
        run: |
          timeout 85s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B - rollback "$GITHUB_RUN_ID" < scripts/mpw_invoice_expired_safe_hotfix_20261026.py
      - name: Delete runner-only SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
