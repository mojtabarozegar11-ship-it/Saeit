name: Resolve Zomorod evergreen resource canonical routes
on:
  push:
    branches: [main]
    paths: [".github/workflows/zm-evergreen-directory-route-fix-20261025.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zm-evergreen-directory-route-20261025
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Establish authorized pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-evergreen-route-ssh";install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),chr(10)).replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only audit of live service request handlers
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-evergreen-route-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('/home/zomorod2/public_html/ask-master')
          for name in ('index.php','status.php'):
              p=root/name
              if p.is_symlink() or not p.is_file():
                  print('INQUIRY_HANDLER_MISSING_OR_UNSAFE='+name)
                  continue
              data=p.read_bytes()
              low=data.lower()
              checks={
                  'csrf_field_or_check':b'csrf' in low,
                  'session_or_token_compare':b'session' in low or b'hash_equals' in low,
                  'email_validation':b'filter_var' in low or b'filter_validate_email' in low,
                  'database_or_durable_storage':b'insert' in low or b'execute(' in low or b'prepare(' in low,
                  'email_or_notification_path':b'mail(' in low or b'smtp' in low or b'notification' in low,
                  'honeypot_or_anti_bot':b'website' in low or b'honeypot' in low,
              }
              print('HANDLER_AUDIT='+name+' bytes='+str(len(data))+' sha256='+hashlib.sha256(data).hexdigest())
              print('HANDLER_CHECKS='+name+' '+','.join(k+':'+('yes' if v else 'no') for k,v in checks.items()))
              includes=sorted(set(re.findall(rb'(?:require|include)(?:_once)?\\s*\\(?\\s*[\\\'\"]([^\\\'\"]+\\.php)[\\\'\"]',data,re.I)))
              print('HANDLER_INCLUDES='+name+' '+','.join(v.decode('utf8','replace') for v in includes))
              tables=sorted(set(v.decode('ascii','ignore') for v in re.findall(rb'\\b(?:INSERT\\s+INTO|UPDATE)\\s+[`\\\'\"]?([A-Za-z_][A-Za-z0-9_]*)',data,re.I)))
              print('HANDLER_WRITE_TABLES='+name+' '+','.join(tables))
          PY
      - name: Add only release-local Passenger-off and DirectoryIndex configuration
        id: install
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-evergreen-route-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path('/home/zomorod2/public_html')
          release=root/'resources/20261025'
          if root.is_symlink() or release.is_symlink() or not release.is_dir():
              raise RuntimeError('UNTRUSTED_ZOMOROD_RESOURCE_DIRECTORY')
          names=('trade-rfq','farm-risk')
          if not (release/'index.html').is_file() or any(not (release/name/'index.html').is_file() for name in names):
              raise RuntimeError('RELEASE_FILES_MISSING')
          target=release/'.htaccess'
          data=b'DirectoryIndex index.html\nOptions -Indexes\n'
          if target.is_symlink(): raise RuntimeError('UNTRUSTED_RELEASE_HTACCESS')
          if target.exists():
              if not target.is_file() or target.read_bytes()!=data:
                  raise RuntimeError('RELEASE_HTACCESS_UNEXPECTED_CONTENT')
              print('ISOLATED_ZOMOROD_DIRECTORY_INDEX_CONFIG_ALREADY_VERIFIED')
          else:
              fd=os.open(str(target),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o644)
              try:
                  with os.fdopen(fd,'wb') as f:
                      f.write(data);f.flush();os.fsync(f.fileno())
              except BaseException:
                  target.unlink(missing_ok=True)
                  raise
              assert target.read_bytes()==data
              print('ISOLATED_ZOMOROD_DIRECTORY_INDEX_CONFIG_INSTALLED')
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:out.write('created=true\n')
          PY
      - name: Repair only four broken links in two isolated indexes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-evergreen-route-ssh/config" saeit-cpanel python3 - "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import hashlib,json,os,stat,sys,tempfile
          run=sys.argv[1]
          root=Path('/home/zomorod2/public_html').resolve(strict=True)
          specs={
            'agriculture/free-tools/20261025/index.html':{
              b'href="/farm-break-even/"':b'href="/agriculture/free-tools/20261025/farm-break-even/"',
              b'href="/import-landed-cost/"':b'href="/agriculture/free-tools/20261025/import-landed-cost/"',
            },
            'resources/20261025/index.html':{
              b'href="/trade-rfq/"':b'href="/resources/20261025/trade-rfq/"',
              b'href="/farm-risk/"':b'href="/resources/20261025/farm-risk/"',
            },
          }
          backup=Path.home()/'.backups'/'zm-evergreen-link-repair'/run
          backup.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
          if backup.parent.is_symlink() or backup.exists(): raise RuntimeError('BACKUP_PATH_UNSAFE_OR_EXISTS')
          originals={}; patched={}; manifest={}
          for rel,subs in specs.items():
              p=root/rel
              if p.is_symlink() or not p.is_file(): raise RuntimeError('UNSAFE_OR_MISSING_PAGE:'+rel)
              resolved=p.resolve(strict=True)
              if root not in resolved.parents: raise RuntimeError('PAGE_ESCAPES_DOCUMENT_ROOT:'+rel)
              old=p.read_bytes();new=old
              for bad,good in subs.items():
                  n=new.count(bad);m=new.count(good)
                  relative=b'href="./'+bad.split(b'/')[-2]+b'/"'
                  if n>=1:new=new.replace(bad,good)
                  elif m>=1 or new.count(relative)>=1:pass
                  else:raise RuntimeError('LINK_STATE_NOT_UNIQUE:'+rel+':'+bad.decode())
              if old!=new:
                  originals[rel]=old;patched[rel]=new
                  manifest[rel]={'backup':str(len(manifest))+'.original','before':hashlib.sha256(old).hexdigest(),'after':hashlib.sha256(new).hexdigest()}
          backup.mkdir(mode=0o700)
          for rel,old in originals.items():
              name=manifest[rel]['backup'];q=backup/name
              fd=os.open(str(q),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as f:f.write(old);f.flush();os.fsync(f.fileno())
          meta={'pages':manifest,'run':run}
          (backup/'manifest.json').write_text(json.dumps(meta,sort_keys=True),encoding='utf8')
          (backup/'manifest.json').chmod(0o600)
          if not patched:
              print('NO_LINK_CHANGES_NEEDED')
          else:
              done=[]
              try:
                  for rel,new in patched.items():
                      p=root/rel;mode=stat.S_IMODE(p.stat().st_mode)
                      fd,tmp=tempfile.mkstemp(prefix='.zm-link-fix-',dir=str(p.parent))
                      try:
                          with os.fdopen(fd,'wb') as f:f.write(new);f.flush();os.fsync(f.fileno())
                          os.chmod(tmp,mode);os.replace(tmp,p)
                          done.append(rel)
                      finally:
                          if os.path.exists(tmp):os.unlink(tmp)
                      if p.read_bytes()!=new:raise RuntimeError('PATCH_READBACK_MISMATCH:'+rel)
              except BaseException:
                  for rel in reversed(done):
                      p=root/rel;q=backup/manifest[rel]['backup']
                      if hashlib.sha256(p.read_bytes()).hexdigest()!=manifest[rel]['after']:
                          raise RuntimeError('ROLLBACK_REFUSED_PAGE_DRIFT:'+rel)
                      p.write_bytes(q.read_bytes())
                  raise
              print('FOUR_BROKEN_LINKS_PATCHED=4')
              print('BACKUP_MANIFEST='+str(backup/'manifest.json'))
          PY
      - name: Verify seven canonical slash URLs and unchanged protected pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,time
          base='https://zomorodmelal.ir/resources/20261025/'
          for slug in ('','trade-rfq/','farm-risk/'):
              url=base+slug
              ok=False
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(url+'?canonical_check='+str(time.time_ns()),timeout=18) as r:
                          s=r.read(25000).decode('utf8','replace')
                          if r.status==200 and '<link rel="canonical" href="'+url+'"' in s:
                              ok=True;break
                  except Exception as e:
                      print('DIRECTORY_INDEX_RETRY',url,type(e).__name__,str(e)[:90])
                  time.sleep(3)
              if not ok:raise RuntimeError('DIRECTORY_CANONICAL_UNRESOLVED:'+url)
              print('ZOMOROD_RESOURCE_CANONICAL_SLASH_ROUTE_LIVE',url)
          for url in ('https://mojplaywin.com/','https://mojplaywin.com/store/',
                      'https://mojplaywin.com/store/product/72/','https://mojplaywin.com/store/product/225/',
                      'https://mojplaywin.com/store/product/879/','https://zomorodmelal.ir/'):
              with urllib.request.urlopen(url,timeout=20) as r:assert r.status==200,url
          # Confirm corrected anchors in public index pages and all four destinations resolve.
          checks={
              'https://zomorodmelal.ir/agriculture/free-tools/20261025/':(
                  '/agriculture/free-tools/20261025/farm-break-even/',
                  '/agriculture/free-tools/20261025/import-landed-cost/',
                  '/farm-break-even/','/import-landed-cost/'),
              'https://zomorodmelal.ir/resources/20261025/':(
                  '/resources/20261025/trade-rfq/',
                  '/resources/20261025/farm-risk/',
                  '/trade-rfq/','/farm-risk/'),
          }
          for page,vals in checks.items():
              with urllib.request.urlopen(page+'?commercial_link_check='+str(time.time_ns()),timeout=18) as r:
                  body=r.read(100000).decode('utf8','replace')
                  if r.status!=200:raise RuntimeError('INDEX_HTTP:'+page)
                  for good in vals[:2]:
                      slug=good.rstrip('/').split('/')[-1]
                      if 'href="'+good+'"' not in body and 'href="./'+slug+'/"' not in body:
                          raise RuntimeError('CANONICAL_LINK_MISSING:'+good)
                  for bad in vals[2:]:
                      if 'href="'+bad+'"' in body:raise RuntimeError('BROKEN_ROOT_LINK_REMAINS:'+bad)
          for path in ('/agriculture/free-tools/20261025/farm-break-even/','/agriculture/free-tools/20261025/import-landed-cost/','/resources/20261025/trade-rfq/','/resources/20261025/farm-risk/'):
              with urllib.request.urlopen('https://zomorodmelal.ir'+path,timeout=18) as r:assert r.status==200,path
          print('ZOMOROD_INTERNAL_COMMERCIAL_RESOURCE_LINKS_VERIFIED=4')
          print('ZOMOROD_EVERGREEN_CANONICAL_AND_PROTECTED_SITES_VERIFIED')
          PY
      - name: Remove only own new htaccess if public verification failed
        if: failure() && steps.install.outputs.created == 'true'
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/zm-evergreen-route-ssh/config";then
            ssh -T -F "$RUNNER_TEMP/zm-evergreen-route-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/zomorod2/public_html/resources/20261025/.htaccess')
          expected=b'DirectoryIndex index.html\nOptions -Indexes\n'
          if p.is_symlink() or not p.is_file() or p.read_bytes()!=expected:
              raise RuntimeError('MANUAL_RECOVERY_REQUIRED_CHANGED_HTACCESS')
          p.unlink()
          print('ONLY_NEW_RELEASE_HTACCESS_ROLLED_BACK')
          PY
          fi
      - name: Roll back the two index pages if public verification fails
        if: failure() && steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-evergreen-route-ssh/config" saeit-cpanel python3 - "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import hashlib,json,os,stat,tempfile,sys
          run=sys.argv[1]
          root=Path('/home/zomorod2/public_html').resolve(strict=True)
          backup=Path.home()/'.backups'/'zm-evergreen-link-repair'/run
          meta=json.loads((backup/'manifest.json').read_text(encoding='utf8'))
          for rel,info in meta['pages'].items():
              p=root/rel;q=backup/info['backup']
              if p.is_symlink() or not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=info['after']:
                  raise RuntimeError('ROLLBACK_REFUSED_PAGE_DRIFT:'+rel)
              old=q.read_bytes()
              if hashlib.sha256(old).hexdigest()!=info['before']:raise RuntimeError('BACKUP_HASH_MISMATCH:'+rel)
              fd,tmp=tempfile.mkstemp(prefix='.zm-link-rollback-',dir=str(p.parent))
              try:
                  with os.fdopen(fd,'wb') as f:f.write(old);f.flush();os.fsync(f.fileno())
                  os.chmod(tmp,stat.S_IMODE(p.stat().st_mode));os.replace(tmp,p)
              finally:
                  if os.path.exists(tmp):os.unlink(tmp)
              if hashlib.sha256(p.read_bytes()).hexdigest()!=info['before']:raise RuntimeError('ROLLBACK_READBACK_MISMATCH:'+rel)
          print('ONLY_INDEX_LINK_CHANGES_ROLLED_BACK')
          PY
      - name: Remove temporary SSH keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zm-evergreen-route-ssh"
