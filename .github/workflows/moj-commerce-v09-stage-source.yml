name: MOJ Commerce v0.9 isolated staging source snapshot (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/moj-commerce-v09-stage-source.yml'
      - 'moj_commerce/STAGING_V09.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moj-commerce-v09-stage-source
  cancel-in-progress: false
jobs:
  stage-source:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'mojtabarozegar11-ship-it') }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build allowlisted source-only, no-key archive
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -s moj_commerce | awk '$1 != "100644" { bad=1 } END { exit bad }'
          git archive --format=tar HEAD moj_commerce | gzip -n > "$RUNNER_TEMP/moj-commerce-v09-source.tar.gz"
          test -s "$RUNNER_TEMP/moj-commerce-v09-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/moj-commerce-v09-source.tar.gz" > "$RUNNER_TEMP/moj-commerce-v09-archive.list"
          grep -Fqx 'moj_commerce/apps.py' "$RUNNER_TEMP/moj-commerce-v09-archive.list"
          if grep -Fq '../' "$RUNNER_TEMP/moj-commerce-v09-archive.list"; then exit 1; fi
          if grep -Eq '^/' "$RUNNER_TEMP/moj-commerce-v09-archive.list"; then exit 1; fi
      - name: Transfer ONLY to new private versioned staging folder and verify hash
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$VPS_KEY" && -n "$HOST_KEY" ]] || { echo 'PREFLIGHT_BLOCKED_MISSING_KEY'; exit 1; }
          sshdir="$RUNNER_TEMP/moj-commerce-v09-ssh"
          mkdir -p "$sshdir"
          trap 'rm -f "$sshdir/vps.key" "$sshdir/host.key" "$sshdir/config" "$sshdir/vps.known" "$sshdir/host.known" "$sshdir/host.candidate"; rmdir "$sshdir" 2>/dev/null || true' EXIT
          printf '%s\n' "$VPS_KEY" > "$sshdir/vps.key"
          printf '%s\n' "$HOST_KEY" > "$sshdir/host.key"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text().replace(chr(13)+chr(10),chr(10)).strip(); p.write_text(t.replace(chr(92)+"n",chr(10))+chr(10))' "$sshdir/vps.key"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text().replace(chr(13)+chr(10),chr(10)).strip(); p.write_text(t.replace(chr(92)+"n",chr(10))+chr(10))' "$sshdir/host.key"
          chmod 600 "$sshdir"/*
          ssh-keygen -y -P '' -f "$sshdir/vps.key" > /dev/null
          ssh-keygen -y -P '' -f "$sshdir/host.key" > /dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$sshdir/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$sshdir/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          {
            echo "Host saeit-vps"
            echo "  HostName 178.239.147.150"
            echo "  User githubops"
            echo "  Port 22"
            echo "  IdentityFile $sshdir/vps.key"
            echo "  UserKnownHostsFile $sshdir/vps.known"
            echo "  StrictHostKeyChecking yes"
            echo "Host saeit-host"
            echo "  HostName zohal.pws-dns.net"
            echo "  User zomorod2"
            echo "  Port 1396"
            echo "  IdentityFile $sshdir/host.key"
            echo "  UserKnownHostsFile $sshdir/host.known"
            echo "  ProxyJump saeit-vps"
            echo "  StrictHostKeyChecking yes"
            echo "Host *"
            echo "  BatchMode yes"
            echo "  IdentitiesOnly yes"
            echo "  ForwardAgent no"
            echo "  RequestTTY no"
            echo "  ConnectTimeout 10"
            echo "  ConnectionAttempts 1"
          } > "$sshdir/config"
          chmod 600 "$sshdir/config"
          timeout 30s ssh -F "$sshdir/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net 2>/dev/null' > "$sshdir/host.candidate"
          test "$(ssh-keygen -lf "$sshdir/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$sshdir/host.candidate" "$sshdir/host.known"
          timeout 35s ssh -F "$sshdir/config" saeit-vps 'test "$(id -un)" = githubops && echo VPS_RELAY_AUTH_OK; test -d "$HOME/factory-runtime" && echo VPS_FACTORY_RUNTIME_PRESENT || echo VPS_FACTORY_RUNTIME_UNKNOWN'
          timeout 45s ssh -F "$sshdir/config" saeit-host 'set -eu; test "$(id -un)" = zomorod2; echo CPANEL_PROXYJUMP_AUTH_OK; test -d /home/zomorod2/Saeit-staging; echo STAGING_ROOT_PRESENT; if test -f /home/zomorod2/Saeit-staging/manage.py; then echo STAGING_DJANGO_SOURCE_PRESENT; else echo STAGING_DJANGO_SOURCE_NOT_AT_ROOT; fi; if test -x /home/zomorod2/Saeit-staging/.venv/bin/python; then echo STAGING_VENV_PRESENT; else echo STAGING_VENV_NOT_AT_ROOT; fi; test -d /home/zomorod2/Saeit && echo PRODUCTION_PATH_PRESENT_READ_ONLY || echo PRODUCTION_PATH_UNKNOWN'
          echo 'PROXYJUMP_PREFLIGHT_PASS'
          archive="$RUNNER_TEMP/moj-commerce-v09-source.tar.gz"
          test -s "$archive"
          release="mc09-$(git rev-parse --short=12 HEAD)"
          [[ "$release" =~ ^mc09-[0-9a-f]{12}$ ]] || exit 1
          staging="/home/zomorod2/Saeit-staging/moj-commerce-v09-source"
          destination="$staging/$release"
          timeout 45s ssh -F "$sshdir/config" saeit-host "set -eu; test -d /home/zomorod2/Saeit-staging; umask 077; mkdir -p -m 700 '$staging'; test ! -e '$destination'; mkdir -m 700 '$destination'"
          timeout 90s ssh -F "$sshdir/config" saeit-host "umask 077; cat > '$destination/source.tar.gz'" < "$archive"
          local_digest="$(sha256sum "$archive" | awk '{print $1}')"
          remote_digest="$(timeout 45s ssh -F "$sshdir/config" saeit-host "sha256sum '$destination/source.tar.gz'" | awk '{print $1}')"
          test "$local_digest" = "$remote_digest"
          timeout 75s ssh -F "$sshdir/config" saeit-host "set -eu; cd '$destination'; tar -tzf source.tar.gz > archive.list; grep -Eq '^moj_commerce/' archive.list; tar --no-same-owner -xzf source.tar.gz; test -f moj_commerce/apps.py; test -f moj_commerce/self_repair.py; python3 -m compileall -q moj_commerce"
          echo "STAGED_SOURCE_ONLY_NAME=$release"
          echo "STAGED_SHA256=$local_digest"
          echo 'STAGING_CODE_SYNTAX_OK_NO_SERVICE_ENABLED_NO_PRODUCTION_WRITE_NO_PAYMENT'
 "$RUNNER_TEMP/moj-commerce-v09-archive.list"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/moj-commerce-v09-archive.list"; then exit 1; fi
