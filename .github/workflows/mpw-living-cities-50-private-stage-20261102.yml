name: MPW Living Cities 50/250 encrypted private VPS and cPanel staging
on:
  pull_request:
    branches: [main]
    paths:
      - 'secure-artifacts/mpw-living-cities-50-57f8de80-encrypted.b64'
      - 'scripts/mpw_living_cities_50_private_stage.py'
      - '.github/workflows/mpw-living-cities-50-private-stage-20261102.yml'
permissions: {contents: read}
concurrency:
  group: mpw-living-cities-private-50-stage
  cancel-in-progress: false
jobs:
  verified-private-stage:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate fixed encrypted source and stage-only script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_living_cities_50_private_stage.py
          grep -Fq 'SOURCE_SHA="57f8de80f45cbc8bec52c687bd6141d5cefc2d03"' scripts/mpw_living_cities_50_private_stage.py
          ! grep -Fq 'def publish():' scripts/mpw_living_cities_50_private_stage.py
          ! grep -Fq 'def rollback():' scripts/mpw_living_cities_50_private_stage.py
          test -s secure-artifacts/mpw-living-cities-50-57f8de80-encrypted.b64
          echo SOURCE_STAGE_ONLY_GATE=PASS
      - name: Open verified existing VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Transfer only ciphertext to private VPS release store
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          p='secure-artifacts/mpw-living-cities-50-57f8de80-encrypted.b64'
          timeout 45s ssh -T -F "$d/config" vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          dir="$HOME/.private/living-cities-transport"
          test -d "$dir" && test ! -L "$dir"
          test ! -L "$dir/mpw-50-57f8de80.b64"
          REMOTE
          timeout 90s scp -q -F "$d/config" "$p" vps:.private/living-cities-transport/mpw-50-57f8de80.b64
          timeout 45s ssh -T -F "$d/config" vps 'chmod 600 "$HOME/.private/living-cities-transport/mpw-50-57f8de80.b64"'
          echo MPW_50_VPS_ENCRYPTED_ONLY_TRANSPORT=PASS
      - name: Authenticate-decrypt exact source on VPS; retain immutable private archive
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          output="$(timeout 100s ssh -T -F "$d/config" vps 'python3 -' <<'PY'
          import base64,hashlib,io,json,os,tarfile
          from pathlib import Path
          from cryptography.hazmat.backends import default_backend
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          sha="57f8de80f45cbc8bec52c687bd6141d5cefc2d03"
          root=Path.home()/".private/living-cities-transport"
          enc=root/"mpw-50-57f8de80.b64"
          private=root/"private.pem"
          assert enc.is_file() and not enc.is_symlink()
          assert private.is_file() and not private.is_symlink()
          obj=json.loads(base64.b64decode(enc.read_bytes().strip(),validate=True))
          assert obj["schema"]==1 and obj["algorithm"]=="RSA3072-OAEP-SHA256+A256GCM"
          assert obj["source_commit"]==sha
          key=serialization.load_pem_private_key(private.read_bytes(),password=None,backend=default_backend()).decrypt(
              base64.b64decode(obj["key"]),
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),
                           algorithm=hashes.SHA256(),label=None))
          aad=b"living-cities-20261101:"+bytes.fromhex(sha)
          assert base64.b64decode(obj["aad"])==aad
          raw=AESGCM(key).decrypt(base64.b64decode(obj["nonce"]),base64.b64decode(obj["ciphertext"]),aad)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==obj["payload_sha256"] and 10000<len(raw)<4194304
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:gz") as tar:
              entries=tar.getmembers()
              names={entry.name for entry in entries}
              assert 100<len(entries)<2500
              assert all(not m.name.startswith("/") and ".." not in Path(m.name).parts
                         and (m.isfile() or m.isdir()) for m in entries)
              assert {"apps/living_cities/static/living_cities/career-catalog.mjs",
                      "apps/living_cities/static/living_cities/customer-orders-i18n.mjs",
                      "apps/living_cities/static/living_cities/tycoon-panel.mjs",
                      "apps/living_cities/templates/living_cities/play.html"}.issubset(names)
          target=root/("mpw-50-"+sha+".tgz")
          if target.exists():
              assert target.is_file() and not target.is_symlink()
              assert hashlib.sha256(target.read_bytes()).hexdigest()==digest
          else:
              pending=root/("mpw-50-"+sha+".pending")
              assert not pending.exists()
              with pending.open("xb") as f:
                  f.write(raw);f.flush();os.fsync(f.fileno())
              pending.chmod(0o600);pending.replace(target)
          print("MPW_50_PRIVATE_SOURCE_DECRYPTED=PASS")
          print("MPW_50_PRIVATE_SOURCE_SHA="+sha)
          print("MPW_50_ARCHIVE_DIGEST="+digest)
          PY
          )"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | sed -n 's/^MPW_50_ARCHIVE_DIGEST=//p' | tail -1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
      - name: Copy authenticated source only into scoped private cPanel staging
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          digest="${{ steps.decrypt.outputs.sha }}"
          timeout 45s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          test ! -L "$HOME/.private" && test ! -L "$HOME/mojplaywin.com/living-cities"
          test "$(cat "$HOME/mojplaywin.com/living-cities/LC-OWNER.txt")" = 'MPW-LIVING-CITIES-GLOBAL-20-LANG-eca666cbb730a6fcf70d284328893a78ad966881'
          root="$HOME/.private/mpw-living-cities-50-20261102"
          test ! -L "$root"
          install -d -m 700 "$root/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03"
          REMOTE
          if timeout 45s ssh -T -F "$d/config" host 'test -f "$HOME/.private/mpw-living-cities-50-20261102/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03/source.tgz"'; then
            timeout 45s ssh -T -F "$d/config" host "test \"\$(sha256sum \"\$HOME/.private/mpw-living-cities-50-20261102/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03/source.tgz\" | awk '{print \$1}')\" = '$digest'"
            echo MPW_50_PRIVATE_SOURCE_ALREADY_VERIFIED=PASS
          else
            timeout 100s ssh -T -F "$d/config" vps 'cat "$HOME/.private/living-cities-transport/mpw-50-57f8de80f45cbc8bec52c687bd6141d5cefc2d03.tgz"' |
              timeout 100s ssh -T -F "$d/config" host 'umask 077; cat > "$HOME/.private/mpw-living-cities-50-20261102/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03/source.pending"'
            timeout 45s ssh -T -F "$d/config" host "test \"\$(sha256sum \"\$HOME/.private/mpw-living-cities-50-20261102/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03/source.pending\" | awk '{print \$1}')\" = '$digest'"
            timeout 45s ssh -T -F "$d/config" host 'mv -T "$HOME/.private/mpw-living-cities-50-20261102/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03/source.pending" "$HOME/.private/mpw-living-cities-50-20261102/releases/57f8de80f45cbc8bec52c687bd6141d5cefc2d03/source.tgz"'
            echo MPW_50_PRIVATE_CPANEL_TRANSFER=PASS
          fi
      - name: Prepare and verify offline browser files only, without publishing
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          digest="${{ steps.decrypt.outputs.sha }}"
          timeout 120s ssh -T -F "$d/config" host "env LC_GAME_ARCHIVE_SHA256=$digest python3 - prepare" < scripts/mpw_living_cities_50_private_stage.py
          timeout 50s ssh -T -F "$d/config" host 'python3 - verify' < scripts/mpw_living_cities_50_private_stage.py
          echo MPW_50_LIVE_GAME_FILES_UNMODIFIED=PASS
          echo MPW_50_LIVE_ACCOUNT_DB_UNMODIFIED=PASS
          echo MPW_50_MOJ1_CHECKOUT_UNMODIFIED=PASS
      - name: Erase temporary SSH materials from runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
