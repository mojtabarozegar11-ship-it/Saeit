name: Correct public factory link to public industry page
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - .github/workflows/live-factory-public-link-fix-20261105.yml
permissions:
  contents: read
concurrency:
  group: zm-factory-public-link-fix-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile factory public web restoration guard
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_factory_public_route_release_20261105.py
          test -s scripts/assets/zm_factory_public_hub_20261105.html
      - name: Authenticate through pinned VPS to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-factory-public-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/factory.zomorodmelal.ir/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_VPS_CPANEL_RELAY'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/factory.zomorodmelal.ir/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Preview factory public link correction without writing
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          HTML_B64="$(base64 -w0 scripts/assets/zm_factory_public_hub_20261105.html)"
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-factory-public-ssh/config" "$COMMAND_HOST" "FACTORY_HTML_B64='$HTML_B64' python3 - relink-preview" < scripts/live_factory_public_route_release_20261105.py
      - name: Publish corrected factory public link with private backup
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          HTML_B64="$(base64 -w0 scripts/assets/zm_factory_public_hub_20261105.html)"
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-factory-public-ssh/config" "$COMMAND_HOST" "FACTORY_HTML_B64='$HTML_B64' python3 - relink-publish '$GITHUB_RUN_ID'" < scripts/live_factory_public_route_release_20261105.py
      - name: Verify factory no longer links to private management page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          with urlopen(Request('https://factory.zomorodmelal.ir/', headers={'Cache-Control':'no-cache'}), timeout=35) as response:
              status, robots, html = response.status, response.headers.get('X-Robots-Tag', ''), response.read(200000)
          if status != 200 or 'noindex' not in robots.lower():
              raise RuntimeError('FACTORY_PUBLIC_PAGE_UNHEALTHY')
          if b'href="https://zomorodmelal.ir/industry/"' not in html or b'href="https://zomorodmelal.ir/business/"' in html:
              raise RuntimeError('FACTORY_PUBLIC_LINK_NOT_CORRECTED')
          with urlopen('https://zomorodmelal.ir/industry/', timeout=35) as response:
              if response.status != 200:
                  raise RuntimeError('PUBLIC_INDUSTRY_DESTINATION_UNAVAILABLE')
          print('FACTORY_PUBLIC_LINK_TO_INDUSTRY_VERIFIED=1 PRIVATE_LOGIN_NOT_LINKED=1')
          PY
      - name: Rollback factory public link if verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-factory-public-ssh/config" "$COMMAND_HOST" "python3 - relink-rollback '$GITHUB_RUN_ID'" < scripts/live_factory_public_route_release_20261105.py
