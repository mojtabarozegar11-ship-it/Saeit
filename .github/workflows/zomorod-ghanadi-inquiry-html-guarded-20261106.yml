name: Guarded single-page Ghanadi inquiry release
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - public/ghanadi/index.html
      - scripts/zomorod_ghanadi_inquiry_html_guarded_20261106.py
      - .github/workflows/zomorod-ghanadi-inquiry-html-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-ghanadi-html-guarded-20261106
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pack and validate the reviewed single-page payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, py_compile, re
          from pathlib import Path
          content=Path('public/ghanadi/index.html').read_bytes()
          page=content.decode('utf-8')
          matches=re.findall(r'<script>([\s\S]*?)</script>', page)
          if len(matches)!=1: raise SystemExit('UNEXPECTED_SCRIPT_STRUCTURE')
          js=Path(os.environ['RUNNER_TEMP'])/'zm-ghanadi-script.js'
          js.write_text(matches[0])
          source=Path('scripts/zomorod_ghanadi_inquiry_html_guarded_20261106.py').read_text()
          marker='HTML_BASE64 = None  # Packed with the exact reviewed HTML by GitHub Actions.'
          if source.count(marker)!=1: raise SystemExit('PACKAGING_MARKER_CHANGED')
          encoded=base64.b64encode(content).decode('ascii')
          destination=Path(os.environ['RUNNER_TEMP'])/'zm-ghanadi-release.py'
          destination.write_text(source.replace(marker,'HTML_BASE64 = '+repr(encoded)))
          py_compile.compile(str(destination),doraise=True)
          PY
          node --check "$RUNNER_TEMP/zm-ghanadi-script.js"
          python3 "$RUNNER_TEMP/zm-ghanadi-release.py" selftest "$GITHUB_RUN_ID"
      - name: Authenticate pinned existing VPS and cPanel access
        id: link
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-ghanadi-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          directory=Path(os.environ['SSH_DIR'])
          for source_name,dest_name in [('vps.known','vps.known'),('host.candidate','host.known')]:
              suffix=f'> "$d/{source_name}"'
              lines=[line.strip() for line in source.splitlines() if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(lines)!=1: raise SystemExit('PINNED_HOST_KEY_MISSING:'+source_name)
              value=lines[0].split("printf '%s\\n' '",1)[1].rsplit("' >",1)[0]
              (directory/dest_name).write_text(value+'\n')
          for key,dest in [('VPS_KEY','vps.key'),('HOST_KEY','host.key')]:
              value=os.environ.get(key,'')
              if not value: raise SystemExit('SSH_IDENTITY_MISSING:'+key)
              path=directory/dest
              path.write_text(value.replace('\r\n','\n').replace('\r','').replace('\\n','\n').rstrip()+'\n')
              path.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/ghanadi/index.html' >/dev/null 2>&1; then
            host=saeit-cpanel-direct
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/ghanadi/index.html' >/dev/null 2>&1; then
            host=saeit-cpanel
          else
            echo 'EXISTING_PINNED_CPANEL_ROUTE_UNAVAILABLE' >&2
            exit 1
          fi
          echo "command_host=$host" >> "$GITHUB_OUTPUT"
          echo 'GHANADI_CPANEL_AUTHENTICATED=yes'
      - name: Require unchanged live baseline before replacement
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-ghanadi-ssh/config" "$COMMAND_HOST" "python3 - preview '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/zm-ghanadi-release.py"
      - name: Back up and atomically replace only Ghanadi index.html
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-ghanadi-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/zm-ghanadi-release.py"
      - name: Verify origin and public HTML hash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          timeout 85s ssh -T -F "$RUNNER_TEMP/zm-ghanadi-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/zm-ghanadi-release.py"
          expected="$(sha256sum public/ghanadi/index.html | cut -d ' ' -f1)"
          served="$(curl -sSL --fail --max-time 18 -H 'Cache-Control: no-cache' "https://zomorodmelal.ir/ghanadi/?zm_release=$GITHUB_RUN_ID" | sha256sum | cut -d ' ' -f1)"
          test "$served" = "$expected"
          echo 'GHANADI_PUBLIC_HTML_VERIFIED=yes'
      - name: Roll back if post-publication verification fails
        if: failure() && steps.link.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-ghanadi-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/zm-ghanadi-release.py"
