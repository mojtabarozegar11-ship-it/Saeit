name: Zomorod site-only quarantine of last two unreferenced legacy variants
on:
  push:
    branches: [cleanup/zm-last-two-legacy-variants-20261101]
    paths: [".github/workflows/zm-last-two-variants-quarantine-20261101.yml"]
permissions:
  contents: read
concurrency:
  group: zm-last-two-legacy-variants-20261101
  cancel-in-progress: false
jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify current public health before touching old variants
        run: |
          set -euo pipefail
          for url in https://zomorodmelal.ir/ https://zomorodmelal.ir/agents/; do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "BEFORE_HTTP=$code"
            test "$code" = 200
          done
      - name: Move two exact unreferenced public variant directories to a private recoverable location
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import hashlib, json, os, stat, time
          from pathlib import Path
          h=Path.home()
          assert h==Path("/home/zomorod2")
          web=h/"public_html"
          parent=h/".backups"
          dest=parent/"zomorod-quarantined-last-two-variants-20261101"
          expected={
              "__zm_orbital_v8_sphere_20261018":(21,"472b64859c884f83fc5d"),
              "__zm_premium_orbital_v6_20261018_448":(2,"4347b3445d3206d2548a"),
          }
          assert web.is_dir() and parent.is_dir()
          assert not web.is_symlink() and not parent.is_symlink()
          assert not dest.exists() and not dest.is_symlink()
          active=web/"index.html"
          assert active.is_file() and not active.is_symlink()
          main_sha=hashlib.sha256(active.read_bytes()).hexdigest()
          def files_under(root):
              found=[]
              for directory,dirs,files in os.walk(root,followlinks=False):
                  d=Path(directory)
                  assert all(not (d/x).is_symlink() for x in dirs)
                  for filename in files:
                      p=d/filename
                      assert p.is_file() and not p.is_symlink()
                      found.append(p)
              return found
          manifest=[]
          for name,(count,hash_prefix) in expected.items():
              src=web/name
              assert src.is_dir() and not src.is_symlink(),name
              files=files_under(src)
              assert len(files)==count,(name,"count changed")
              index=src/"index.html"
              assert index.is_file() and not index.is_symlink()
              digest=hashlib.sha256(index.read_bytes()).hexdigest()
              assert digest.startswith(hash_prefix),(name,"content changed")
              manifest.append({"name":name,"files":count,
                               "total_bytes":sum(x.stat().st_size for x in files),
                               "index_sha256":digest})
          # Reject relocation if any active public document refers to either exact name.
          seen=0
          for directory,dirs,files in os.walk(web,followlinks=False):
              d=Path(directory)
              depth=len(d.relative_to(web).parts)
              dirs[:]=[x for x in sorted(dirs) if not x.startswith("__zm_") and
                       not (d/x).is_symlink()] if depth<4 else []
              for filename in files:
                  p=d/filename
                  if p.is_symlink():
                      continue
                  if p.suffix.lower() not in (".html",".htm",".js",".css",".xml",".json") and filename!=".htaccess":
                      continue
                  if p.stat().st_size>4*1048576:
                      continue
                  seen+=1
                  assert seen<=9000,"reference scan cap"
                  data=p.read_bytes()
                  assert all(name.encode("utf-8") not in data for name in expected),p.name
          moved=[]
          try:
              dest.mkdir(mode=0o700)
              for name in expected:
                  os.rename(web/name,dest/name)
                  moved.append(name)
              record={"when_utc":int(time.time()),"reason":"old unreferenced visual variants",
                      "homepage_sha256":main_sha,"previews":manifest}
              m=dest/"manifest.json"
              m.write_text(json.dumps(record,sort_keys=True,indent=2))
              os.chmod(m,0o600)
              assert hashlib.sha256(active.read_bytes()).hexdigest()==main_sha
              for name,(count,_) in expected.items():
                  assert not (web/name).exists()
                  assert len(files_under(dest/name))==count
              print("QUARANTINED_VARIANTS="+str(len(expected)))
              print("RECOVERABLE_BYTES="+str(sum(p["total_bytes"] for p in manifest)))
              print("QUARANTINE_PATH="+str(dest))
              print("ACTIVE_HOMEPAGE_UNCHANGED=yes")
          except BaseException:
              for name in reversed(moved):
                  if (dest/name).exists() and not (web/name).exists():
                      os.rename(dest/name,web/name)
              raise
          PY
          REMOTE
      - name: Check live site and restore old paths on regression
        shell: bash
        run: |
          set -euo pipefail
          healthy=1
          for url in https://zomorodmelal.ir/ https://zomorodmelal.ir/agents/; do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "AFTER_HTTP=$code"
            if test "$code" != 200; then healthy=0; fi
          done
          if test "$healthy" = 1; then
            echo "PUBLIC_HEALTH=preserved"
            exit 0
          fi
          ssh -F "$RUNNER_TEMP/zomorod-baseline-inventory/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          h=Path.home()
          assert h==Path("/home/zomorod2")
          web=h/"public_html"
          root=h/".backups/zomorod-quarantined-last-two-variants-20261101"
          assert root.is_dir() and not root.is_symlink()
          data=json.loads((root/"manifest.json").read_text())
          allowed={"__zm_orbital_v8_sphere_20261018",
                   "__zm_premium_orbital_v6_20261018_448"}
          assert {p["name"] for p in data["previews"]}==allowed
          for name in allowed:
              assert not (web/name).exists()
              os.rename(root/name,web/name)
          print("ROLLBACK_TWO_VARIANTS=restored")
          PY
          REMOTE
          exit 1
      - name: Clear SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"

# User-authorized exact two-path Zomorod-only public preview quarantine; no unrelated paths.
