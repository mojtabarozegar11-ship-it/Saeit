name: Zomorod final WCAG secure release verified navigation fixture
on:
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-final-hardening-live-20261019.yml]
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  apply-test:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Selftest safe exact-target patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_final_hardening_safe_20261019.py
          python3 scripts/zomorod_final_hardening_safe_20261019.py selftest
      - name: Snapshot public URLs and preflight secure management
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          for path in ('/','/research/','/agriculture/','/about/','/store/','/tala/','/business/','/company/','/search/','/topics/','/amozeshgah/','/tala/api/health.php'):
           with urlopen(Request('https://zomorodmelal.ir'+path,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
            assert r.status==200 and len(r.read(100000))>(2 if path=='/tala/api/health.php' else 200),path
            if path=='/business/':
             csp=r.headers.get('Content-Security-Policy','')
             assert "default-src 'none'" in csp and "frame-ancestors 'none'" in csp,'Management CSP already not protected'
            print('BEFORE_HARDENING_OK='+path,flush=True)
          PY
      - name: Prepare verified VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo PINNED_HOST_AND_RELAY_VERIFIED=yes
      - name: Stage private installer, validate all existing files
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-security-20261019-$GITHUB_RUN_ID"
          timeout 45s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && install -d -m 700 '$stage'"
          cat scripts/zomorod_final_hardening_safe_20261019.py | timeout 65s ssh -T -F "$d/config" saeit-cpanel "cat > '$stage/installer.py'"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' selftest"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' plan"
      - name: Protect unrelated live files by checksum before deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-glass-headers-ssh/config" saeit-cpanel 'python3 -' <<'PY' > "$RUNNER_TEMP/unmodified-before.txt"
          import hashlib
          from pathlib import Path
          r=Path('/home/zomorod2/public_html')
          for name in ('index.html','company/index.html','about/index.html','tala/index.html','store/index.php','business/index.php','search/index.html','knowledge/index.html','topics/index.html','tala/api/health.php'):
           f=r/name
           if f.is_file() and not f.is_symlink():print(name+' '+hashlib.sha256(f.read_bytes()).hexdigest())
          PY
          test -s "$RUNNER_TEMP/unmodified-before.txt"
      - name: Apply all three exact targets atomically after backup
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-security-20261019-$GITHUB_RUN_ID"
          timeout 100s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' apply '$GITHUB_RUN_ID'"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' verify '$GITHUB_RUN_ID'"
      - name: Confirm HTTP policies and protected management CSP are intact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time
          from urllib.request import urlopen,Request
          b='https://zomorodmelal.ir'
          for path in ('/','/research/','/agriculture/','/about/','/store/','/tala/','/business/','/company/','/search/','/topics/','/amozeshgah/','/tala/api/health.php','/en/market/'):
           good=False
           for n in range(6):
            with urlopen(Request(b+path+'?__zm_hardening='+os.environ['GITHUB_RUN_ID']+'-'+str(n),headers={'Cache-Control':'no-cache'}),timeout=40) as r:
             body=r.read(120000)
             assert r.status==200 and len(body)>(2 if path=='/tala/api/health.php' else 200),path
             h=r.headers.get('Strict-Transport-Security','')
             c=r.headers.get('Content-Security-Policy','')
             ref=r.headers.get('Referrer-Policy','')
             if 'max-age=86400' not in h or "object-src 'none'" not in c or "base-uri 'self'" not in c or not ref:
              time.sleep(2);continue
             if path=='/business/':
              assert "default-src 'none'" in c and "frame-ancestors 'none'" in c,'Business restrictive CSP lost'
              assert r.headers.get('X-Frame-Options')=='DENY','Business clickjacking rule lost'
             if path in ('/research/','/agriculture/'):
              assert 'aria-label="هویت و ناوبری زمرد ملل"'.encode() in body,'Landmark update not visible'
             good=True
             break
           assert good,'Policy/public template not visible '+path
           print('HARDENING_HTTPS_POLICY_AND_PAGE_OK='+path,flush=True)
          PY
      - name: Playwright mobile desktop all remaining WCAG landmark and navigation tests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-final-browser";mkdir -p "$d";cd "$d"
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install chromium
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright'),Axe=require('@axe-core/playwright').default;
          (async()=>{
           const b=await chromium.launch({headless:true,args:['--no-sandbox']});
           for(const width of [390,768,1440]){
            const ctx=await b.newContext({viewport:{width,height:900}});
            for(const path of ['/research/','/agriculture/','/about/','/','/store/','/tala/','/business/','/company/','/search/']){
             const p=await ctx.newPage(),errors=[];
             p.on('pageerror',x=>errors.push(x.message));
             const r=await p.goto('https://zomorodmelal.ir'+path+'?__hardening_browser='+width,{waitUntil:'domcontentloaded',timeout:55000});
             await p.waitForTimeout(250);
             const data=await p.evaluate(()=>({overflow:Math.max(document.body.scrollWidth,document.documentElement.scrollWidth)-innerWidth,headerRole:document.querySelector('.zm-v7-top')?.getAttribute('role'),cards:document.querySelectorAll('.topic-card').length,rows:document.querySelectorAll('.orbit-shelf').length,companyCards:document.querySelectorAll('.zm-history-card').length}));
             let issues=[];
             if(['/research/','/agriculture/','/about/','/business/','/store/'].includes(path)){
               const axe=await new Axe({page:p}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','best-practice']).analyze();
               issues=axe.violations.map(x=>({id:x.id,impact:x.impact,count:x.nodes.length}));
               if((path==='/research/'||path==='/agriculture/')&&issues.length)throw Error('Outstanding landmark/a11y issue: '+path+' '+width+' '+JSON.stringify(issues));
               if(issues.some(x=>x.impact==='serious'||x.impact==='critical'))throw Error('Serious WCAG problem '+path+' '+width+' '+JSON.stringify(issues));
             }
             console.log('FINAL_HARDENING_BROWSER='+JSON.stringify({path,width,status:r.status(),...data,issues,errors}));
             if(r.status()!==200||data.overflow>3||errors.length)throw Error('HTTP/JS/overflow regression '+path);
             if(path==='/'&&(data.cards!==605||data.rows!==29))throw Error('Homepage data changed');
             if(path==='/company/'&&data.companyCards!==162)throw Error('Company cards changed');
             if((path==='/research/'||path==='/agriculture/')&&data.headerRole!=='navigation')throw Error('Accessible header not activated');
             await p.close();
            }
            await ctx.close();
           }
           await b.close();console.log('FINAL_SITE_HARDENING_BROWSER_27_TESTS=passed');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node audit.cjs
      - name: Confirm all unrelated site files remained byte identical
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/zm-glass-headers-ssh/config" saeit-cpanel 'python3 -' <<'PY' > "$RUNNER_TEMP/unmodified-after.txt"
          import hashlib
          from pathlib import Path
          r=Path('/home/zomorod2/public_html')
          for name in ('index.html','company/index.html','about/index.html','tala/index.html','store/index.php','business/index.php','search/index.html','knowledge/index.html','topics/index.html','tala/api/health.php'):
           f=r/name
           if f.is_file() and not f.is_symlink():print(name+' '+hashlib.sha256(f.read_bytes()).hexdigest())
          PY
          diff -u "$RUNNER_TEMP/unmodified-before.txt" "$RUNNER_TEMP/unmodified-after.txt"
          echo FINAL_ALL_UNRELATED_FILES_BYTE_IDENTICAL=yes
      - name: Restore each changed file if any check fails
        if: failure() && steps.stage.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-security-20261019-$GITHUB_RUN_ID"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' rollback '$GITHUB_RUN_ID'"
      - name: Remove staged credentials and script, keep verified private backup
        if: always()
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/zm-glass-headers-ssh"
          stage="/home/zomorod2/.zm-security-20261019-$GITHUB_RUN_ID"
          if test -f "$d/config";then timeout 40s ssh -T -F "$d/config" saeit-cpanel "rm -f '$stage/installer.py';rmdir '$stage'";fi
          rm -rf "$d"
