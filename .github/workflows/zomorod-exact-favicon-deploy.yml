name: Publish truly round transparent Zomorod Mell favicon
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-exact-favicon-deploy.yml"
      - "content/zomorod-seo-brand/deploy_exact_favicon.py"
permissions:
  contents: read
concurrency:
  group: zomorod-exact-root-favicon-only
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Render true round favicon from official transparent company logo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zomorod-favicon-venv"
          "$RUNNER_TEMP/zomorod-favicon-venv/bin/pip" -q install 'Pillow==11.3.0'
          "$RUNNER_TEMP/zomorod-favicon-venv/bin/python" - <<'PY'
          import base64, io, math
          from pathlib import Path
          from PIL import Image, ImageDraw
          source=Path('content/zomorod-brand/logo-transparent-128.png')
          d=Path('content/zomorod-seo-brand')
          img=Image.open(source).convert('RGBA')
          assert img.size == (128,128)
          # Earlier site asset has gray/white checkerboard pixels baked into RGB.
          # Extract the official mark, eliminating only near-neutral background tiles.
          src_px=list(img.getdata())
          cleared=[]
          for red,green,blue,alpha in src_px:
              neutral=(max(red,green,blue)-min(red,green,blue) <= 16)
              checker=(min(red,green,blue) >= 170 and neutral)
              cleared.append((red,green,blue,0 if checker else alpha))
          img.putdata(cleared)
          assert img.getpixel((0,0))[3] == 0 and img.getpixel((127,127))[3] == 0, 'Checker removal did not clear the corners'
          # Clip to exact circle; no square/white/checkerboard around the company mark.
          a=img.getchannel('A')
          circle=Image.new('L',img.size,0)
          drawer=ImageDraw.Draw(circle)
          drawer.ellipse((1,1,126,126),fill=255)
          from PIL import ImageChops
          img.putalpha(ImageChops.multiply(a,circle))
          assert img.getpixel((0,0))[3]==0 and img.getpixel((127,0))[3]==0
          ico=io.BytesIO()
          img.save(ico,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])
          files={'favicon.ico':ico.getvalue()}
          for size in (180,192):
              buffer=io.BytesIO()
              img.resize((size,size),Image.Resampling.LANCZOS).save(buffer,format='PNG',optimize=True)
              files[f'icon-{size}.png']=buffer.getvalue()
          for name,raw in files.items():
              (d/(name+'.b64')).write_text(base64.b64encode(raw).decode('ascii'),encoding='ascii')
              print('TRUE_ROUND_ICON',name,len(raw))
          assert files['favicon.ico'][:4]==b'\x00\x00\x01\x00'
          assert files['icon-192.png'].startswith(b'\x89PNG\r\n\x1a\n')
          PY
          python3 -m py_compile content/zomorod-seo-brand/deploy_exact_favicon.py
          grep -q 'ZOMOROD_ROUND_FAVICON_ROLLBACK=restored' content/zomorod-seo-brand/deploy_exact_favicon.py
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Transfer favicon files only to a private server backup staging directory
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          root="$HOME/.backups/zomorod-brand-exact/$1"
          test ! -e "$root"
          mkdir -p "$(dirname "$root")"
          mkdir -m 700 "$root"
          mkdir -m 700 "$root/staging"
          test -s "$HOME/public_html/index.html"
          test -s "$HOME/public_html/favicon.ico"
          echo FAVICON_BACKUP_STAGING=ready
          REMOTE
          tar -cf - -C content/zomorod-seo-brand deploy_exact_favicon.py favicon.ico.b64 icon-180.png.b64 icon-192.png.b64 |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C /home/zomorod2/.backups/zomorod-brand-exact/$GITHUB_SHA/staging"
      - name: Publish only root favicon and icon metadata; preserve all other files
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          stage="$HOME/.backups/zomorod-brand-exact/$1/staging"
          test -s "$stage/deploy_exact_favicon.py"
          python3 "$stage/deploy_exact_favicon.py" "$stage"
          REMOTE
      - name: Remove temporary runner SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory" "$RUNNER_TEMP/zomorod-favicon-venv"
