name: Factory VPS live read-only resource and intake preflight 20261029
on:
  push:
    branches:
      - ops/factory-live-readonly-20261029-0320
    paths:
      - .github/workflows/factory-live-readonly-20261029-0320.yml
permissions:
  contents: read
concurrency:
  group: factory-live-readonly-20261029-0320
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read mounted capacity, cron and work order integrity with pinned SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-readonly-key"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          printf 'OBSERVED_UTC='
          date -u +%Y-%m-%dT%H:%M:%SZ
          df -B1 -P /home/githubops/factory-runtime | awk 'NR==2{printf "FS_BYTES_TOTAL=%s\nFS_BYTES_USED=%s\nFS_BYTES_FREE=%s\nFS_MOUNT=%s\n", $2,$3,$4,$6}'
          df -Pi /home/githubops/factory-runtime | awk 'NR==2{printf "FS_INODES_FREE=%s\n",$4}'
          printf 'CRON_MASTER_TAGS='
          (crontab -l 2>/dev/null || true) | grep -Ec 'FACTORY_MASTER|MASTER_AGENT|factory-master|factory_master' || true
          printf 'CRON_LEECH_TAGS='
          (crontab -l 2>/dev/null || true) | grep -Ec 'leech|LEECH' || true
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          import re
          root=Path('/home/githubops/factory-runtime/private/autonomous-product-cycle/production-instructions')
          idx=root/'owner-agri200-p0-index.json'
          if idx.is_symlink() or not idx.is_file():
              print('AGRI200_INDEX_STATE=missing_or_unsafe')
          else:
              try:
                  data=json.loads(idx.read_text(encoding='utf8'))
                  ids=data.get('order_ids_ranked',[])
                  safe=isinstance(ids,list) and len(ids)==200 and len(set(ids))==200 and all(isinstance(x,str) and re.fullmatch(r'WO-[0-9]{8}',x) for x in ids)
                  if not safe: 
                      print('AGRI200_INDEX_STATE=invalid')
                  else:
                      valid=missing=invalid=0
                      for ident in ids:
                          p=root/'orders'/(ident+'.json')
                          if not p.exists() and not p.is_symlink():
                              missing+=1
                              continue
                          if p.is_symlink() or not p.is_file() or p.stat().st_size>250000:
                              invalid+=1
                              continue
                          try:
                              o=json.loads(p.read_text(encoding='utf8'))
                              if o.get('id')!=ident or not re.fullmatch(r'[0-9a-f]{64}',str(o.get('fingerprint',''))):
                                  invalid+=1
                              else: valid+=1
                          except (OSError,ValueError,TypeError,AttributeError):
                              invalid+=1
                      print(f'AGRI200_CURRENT_VALID={valid}')
                      print(f'AGRI200_CURRENT_MISSING={missing}')
                      print(f'AGRI200_CURRENT_INVALID={invalid}')
              except (OSError,ValueError,TypeError) as exc:
                  print('AGRI200_INDEX_STATE=unreadable_'+type(exc).__name__)
          PY
          echo READ_ONLY_NO_VPS_MUTATION=PASS
          REMOTE
