name: MojPlayWin scoped Passenger refresh for new buyer routes
on:
  push:
    branches: [audit/mpw-book72-go-live-gates-20261015]
    paths: [.github/workflows/mpw-scoped-customer-app-refresh.yml]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH connections to authorized site host
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/astra-live-payment"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/$item.key"
            chmod 600 "$d/$item.key"
            ssh-keygen -y -P '' -f "$d/$item.key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Restart only MojPlayWin Python app with strict path guard
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/astra-live-payment/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          site="$HOME/mojplaywin.com"
          test -d "$site" && test ! -L "$site"
          test -f "$site/passenger_wsgi.py" && test ! -L "$site/passenger_wsgi.py"
          grep -Fq Saeit-staging "$site/passenger_wsgi.py"
          test -f "$HOME/Saeit-staging/manage.py"
          for other in "$HOME/zomorodmelal.ir" "$HOME/public_html"; do
            if test -d "$other" && test "$(readlink -f "$other")" = "$(readlink -f "$site")"; then
              echo MPW_REFRESH_REFUSED_SHARED_ROOT
              exit 1
            fi
          done
          restart="$site/tmp/restart.txt"
          test -f "$restart" && test ! -L "$restart"
          touch "$restart"
          echo MPW_SCOPED_PASSENGER_REFRESH_SIGNAL_SENT=YES
          echo MPW_ZOMOROD_FILES_UNTOUCHED=YES
          echo MPW_PAYMENT_SWITCHES_UNTOUCHED=YES
          REMOTE
      - name: Verify new buyer authentication over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            code="$(curl -L -o /dev/null -sS --connect-timeout 7 --max-time 18 -w '%{http_code}' https://mojplaywin.com/accounts/login/ || true)"
            echo "MPW_PUBLIC_LOGIN_ATTEMPT_${attempt}=$code"
            if test "$code" = 200; then break; fi
            sleep 3
          done
          for path in /accounts/login/ /accounts/register/ /store/; do
            code="$(curl -L -o /dev/null -sS --connect-timeout 7 --max-time 18 -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            echo "MPW_FINAL_${path//\//_}=$code"
          done
      - name: Clean temporary identities
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/astra-live-payment"
