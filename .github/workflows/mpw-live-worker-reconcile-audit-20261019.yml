name: MojPlayWin settlement worker and payment chain current audit
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-live-worker-reconcile-audit-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify runtime job, actual worker self-check, and ETH TRX infrastructure
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 155s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,pathlib,json,subprocess,time,signal,inspect
          r=pathlib.Path('/home/zomorod2/Saeit-staging')
          os.chdir(r);sys.path.insert(0,str(r));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from mpw_commerce.buyer_wallets import fetch_server_rate
          from scripts.mojplaywin_direct_wallet_discovery import discover_eth,discover_trx
          from scripts.mojplaywin_native_rpc_clients import ethereum_rpc,tron_solidity_rpc,TRX_PATHS
          result={}
          for coin in ('ETH','TRX'):
            try:
              quote=fetch_server_rate(coin)
              result[coin+'_quote']={'ok':True,'source':quote.source,'has_timestamp':bool(quote.observed_at)}
            except Exception as e:
              result[coin+'_quote']={'ok':False,'error':type(e).__name__}
          for coin,scanner in (('ETH',discover_eth),('TRX',discover_trx)):
            try:
              x=scanner(now_ms=int(time.time()*1000),lookback_s=600,max_pages=4)
              result[coin+'_discovery']={'ok':True,'transactions_in_lookback':len(x)}
            except Exception as e:
              result[coin+'_discovery']={'ok':False,'error':type(e).__name__}
          try:result['eth_mainnet_rpc']=ethereum_rpc('eth_chainId',[])=='0x1'
          except Exception as e:result['eth_mainnet_rpc']=type(e).__name__
          trx_results=[]
          for path in sorted(TRX_PATHS):
            try:
              v=tron_solidity_rpc(path,{'value':'0'*64})
              trx_results.append({'method':path.rsplit('/',1)[-1],'ok':isinstance(v,dict)})
            except Exception as e:
              trx_results.append({'method':path.rsplit('/',1)[-1],'ok':False,'error':type(e).__name__})
          result['trx_finality_rpc']=trx_results
          worker=pathlib.Path('/home/zomorod2/.mpw-commerce-two-books/reconcile_worker.py')
          if worker.is_file():
            try:
              check=subprocess.run([sys.executable,str(worker),'--self-check'],capture_output=True,text=True,timeout=30)
              result['worker_self_check']={'return_code':check.returncode,
                'result_lines':[v[:150] for v in check.stdout.splitlines() if v.startswith('MPW_WORKER_RESULT=')],
                'error_lines':[v[:75] for v in check.stdout.splitlines() if v.startswith('MPW_WORKER_ERROR=')]}
            except Exception as e:result['worker_self_check']={'error':type(e).__name__}
          cr=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=8)
          schedules=[x for x in cr.stdout.splitlines() if 'MPW_TWO_BOOKS_RECONCILE_MINUTE_V1' in x]
          result['cron']={'readable':cr.returncode==0,'schedules_count':len(schedules),
            'runs_each_minute':all(x.startswith('* * * * * ') for x in schedules)}
          print('MPW_RUNTIME_RECONCILE_AUDIT='+json.dumps(result,sort_keys=True))
          PY
          BASH
