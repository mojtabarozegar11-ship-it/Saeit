name: MPW staging growth metadata — read only
on:
  pull_request:
    paths:
      - ".github/workflows/mpw-staging-growth-readonly.yml"
      - "scripts/mpw_staging_growth_metadata_20261119.py"
      - "tests/test_mpw_staging_growth_metadata_20261119.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify fixed sources and run pure unit regressions
        shell: bash
        run: |
          set -euo pipefail
          test ! -L scripts/mpw_staging_growth_metadata_20261119.py
          test ! -L tests/test_mpw_staging_growth_metadata_20261119.py
          test "$(git hash-object -- scripts/mpw_staging_growth_metadata_20261119.py)" = "248e16843393287e3ef798bdb372dc9a8cab2315"
          test "$(git hash-object -- tests/test_mpw_staging_growth_metadata_20261119.py)" = "691fc0fc378cd40374801301139187e5e3396430"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest tests.test_mpw_staging_growth_metadata_20261119 -v
      - name: Connect only through pinned factory runner to the existing cPanel
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${HOST_KEY:?}"
          umask 077
          work="$RUNNER_TEMP/mpw-staging-growth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$work"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); sys.stdout.write(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n")' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P '' -f "$work/host.key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$work/known"
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          printf 'Host cpanel\n HostName 178.239.147.125\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/known\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 1\n ForwardAgent no\n RequestTTY no\n' "$work" "$work" > "$work/config"
          chmod 600 "$work/config"
          timeout 40s ssh -T -F "$work/config" cpanel 'test "$(id -un)" = "zomorod2" && test -d /home/zomorod2/Saeit-staging'
      - name: Classify owner staging growth by file metadata only
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mpw-staging-growth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timeout 90s ssh -T -F "$work/config" cpanel 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' < scripts/mpw_staging_growth_metadata_20261119.py | python3 -c 'import json,sys; p="MPW_STAGING_GROWTH_READONLY="; raw=sys.stdin.read(24001); assert len(raw)<=24000; rows=[x for x in raw.splitlines() if x.startswith(p)]; assert len(rows)==1; d=json.loads(rows[0][len(p):]); assert d["schema"]=="mpw.staging_growth.metadata.readonly.v1" and d["read_only"] is True and d["contents_read"] is False and d["files_deleted"] is False and d["safe_to_delete"] is False and d["release_authorized"] is False; print(rows[0])'
      - name: Remove ephemeral relay authentication material
        if: always()
        shell: bash
        run: |
          work="$RUNNER_TEMP/mpw-staging-growth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test -d "$work"; then rm -f "$work/host.key" "$work/known" "$work/config"; rmdir "$work"; fi
