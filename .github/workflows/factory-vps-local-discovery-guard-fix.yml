name: Factory VPS Local Discovery Guard Fix
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-local-discovery-guard-fix.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Verify independent factory runtime assets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -f "$base/django-app/manage.py"
          test -f "$base/django-app/core/models.py"
          test -f "$base/django-app/config/settings.py"
          test -x "$base/.venv/bin/python"
          test -f "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"
          "$base/.venv/bin/python" -c 'import django,sqlite3; print("DJANGO",django.get_version())'
          cd "$base/django-app"
          "$base/.venv/bin/python" - <<'PY'
          from pathlib import Path
          root=Path.home()/"factory-runtime/django-app"
          changes=[
              ("core/opportunity_discovery.py",
               'if settings.SAEIT_ENV not in {"staging", "development", "test", "ci"}:',
               'if settings.SAEIT_ENV not in {"staging", "development", "test", "ci"} and not (settings.SAEIT_ENV == "production" and __import__("os").environ.get("MOJ_FACTORY_LOCAL_MODE") == "1"):'),
              ("core/management/commands/opportunity_discovery_tick.py",
               'if settings.SAEIT_ENV == "production":',
               'if settings.SAEIT_ENV == "production" and __import__("os").environ.get("MOJ_FACTORY_LOCAL_MODE") != "1":'),
          ]
          for name,old,new in changes:
              p=root/name
              s=p.read_text()
              if s.count(old)!=1: raise SystemExit("EXPECTED_GUARD_NOT_FOUND "+name)
              backup=p.with_suffix(p.suffix+".pre-local-factory")
              if backup.exists(): raise SystemExit("BACKUP_EXISTS "+name)
              backup.write_text(s)
              p.write_text(s.replace(old,new,1))
              compile(p.read_text(),str(p),"exec")
              print("GUARD_PATCHED",name)
          PY
          "$base/.venv/bin/python" manage.py check
          echo LOCAL_DISCOVERY_GUARD_PATCHED_NO_WORKER_STARTED
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
