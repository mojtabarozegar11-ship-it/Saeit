name: Factory OFF VPS Nov5 historical originals full SQLite integrity READ ONLY
on:
  pull_request:
    paths:
      - '.github/workflows/factory-off-vps-nov5-integrity-readonly.yml'
      - 'scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py'
permissions:
  contents: read
concurrency:
  group: factory-off-vps-nov5-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  vps-original-integrity:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Full SHA and SQLite integrity of ONLY two historical VPS originals
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0 || { echo OWNER_RUNNER_MUST_BE_NONROOT; exit 78; }
          test -n "$VPS_KEY" || { echo VPS_AUTH_NOT_PRESENT; exit 78; }
          test "$(git hash-object scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py)" = '141227923255a3735dc8e20f109cdd195b8f5c15'
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/key"
          chmod 600 "$work/key"
          ssh-keygen -y -P "" -f "$work/key" >/dev/null
          ssh-keyscan -T 8 -t rsa 127.0.0.1 > "$work/known" 2>/dev/null
          test -s "$work/known"
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 780s ssh -T -i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known"             -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15             -o ServerAliveInterval=15 -o ServerAliveCountMax=3             -o ForwardAgent=no githubops@127.0.0.1             'exec python3 -B -' < scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py
          echo FACTORY_VPS_HISTORICAL_NOV5_BOTH_FULL_INTEGRITY_VERIFIED=true
          echo FACTORY_VPS_HISTORICAL_BACKUPS_DELETED=0
          echo FACTORY_ACTIVE_SERVICE_STARTED=0
          echo FACTORY_CLOUD_BACKUP_BYTES_WRITTEN=0
          echo FACTORY_CPANEL_BYTES_RECLAIMED=0
