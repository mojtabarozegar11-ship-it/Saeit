name: MojPlayWin staging database live dependency and quota audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-staging-db-dependency-and-quota.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-staging-db-safe-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Inspect DB references, operating paths and actual cPanel usage (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,json,stat,re,sqlite3
          from pathlib import Path
          H=Path.home()
          db=H/"Saeit-staging/mojplaywin.sqlite3"
          assert db.is_file() and db.stat().st_size>1_000_000_000
          hits=[]
          for root in [H/"Saeit-staging",H/"Saeit",H/"mojplaywin_site",H/"public_html"]:
              if not root.is_dir():continue
              for dirname,dirs,files in os.walk(root,followlinks=False):
                  dep=len(Path(dirname).relative_to(root).parts)
                  dirs[:]=[d for d in dirs if dep<6 and d not in {"backups","var","staticfiles","media",".git",".venv","node_modules","__pycache__","admin-smoke","v91_personnel_isolated","agent_imports","releases"} and not (Path(dirname)/d).is_symlink()]
                  for name in files:
                      p=Path(dirname)/name
                      if p.is_symlink() or not p.is_file() or p.stat().st_size>1000000:continue
                      if p.suffix.lower() not in {".py",".php",".sh",".yml",".yaml",".ini",".json",".conf"} and name not in {".htaccess","passenger_wsgi.py"}:continue
                      try:
                          txt=p.read_text(errors="ignore")
                          if "mojplaywin.sqlite3" in txt or "Saeit-staging/mojplaywin" in txt:
                              hits.append(str(p.relative_to(H)))
                      except OSError:pass
          print("STAGING_DB_CODE_REFERENCES="+json.dumps(sorted(set(hits))[:80]))
          proc=subprocess.run(["ps","-u","zomorod2","-o","pid=,args="],text=True,capture_output=True,timeout=15)
          print("STAGING_DB_PROCESS_LITERAL_COUNT="+str(sum(str(db) in row for row in proc.stdout.splitlines())))
          cron=subprocess.run(["crontab","-l"],text=True,capture_output=True,timeout=15)
          print("STAGING_DB_CRON_LITERAL_COUNT="+str(sum("mojplaywin.sqlite3" in row for row in cron.stdout.splitlines())))
          fd_refs=0
          for line in proc.stdout.splitlines():
              try:pid=int(line.strip().split()[0])
              except Exception:continue
              fdroot=Path("/proc")/str(pid)/"fd"
              if not fdroot.is_dir():continue
              try:
                  for fd in fdroot.iterdir():
                      try:
                          if str(db) in os.readlink(fd):fd_refs+=1
                      except OSError:pass
              except OSError:pass
          print("STAGING_DB_OPEN_FD_COUNT="+str(fd_refs))
          try:
              c=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True,timeout=8)
              q=c.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()
              print("STAGING_DB_TABLE_TOTAL="+str(len(q)))
              try:
                  sizes=c.execute("SELECT name, sum(pgsize) AS b FROM dbstat GROUP BY name ORDER BY b DESC LIMIT 16").fetchall()
                  print("STAGING_DB_LARGEST_TABLES="+json.dumps(sizes))
              except sqlite3.Error: print("DBSTAT_UNAVAILABLE=yes")
              c.close()
          except Exception as e:print("STAGING_DB_READ_ERROR="+type(e).__name__)
          r=subprocess.run(["du","-sk",str(H)],capture_output=True,text=True,timeout=100)
          if r.returncode==0:print("CURRENT_ACCOUNT_DU_BYTES="+str(int(r.stdout.split()[0])*1024))
          try:
              r=subprocess.run(["uapi","--output=json","Quota","get_quota_info"],capture_output=True,text=True,timeout=16)
              d=json.loads(r.stdout)["result"]["data"]
              print("CURRENT_QUOTA_USED_MB="+str(d.get("megabytes_used")))
              print("CURRENT_QUOTA_LIMIT_MB="+str(d.get("megabyte_limit")))
          except Exception:print("QUOTA_NOT_AVAILABLE=yes")
          print("STAGING_DB_DEPENDENCY_COMPLETE=yes")
          PY
          REMOTE
      - name: Clear credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
