name: Add verified Django OTP dependency to cPanel 3.10 (no app deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-cpanel-otp-dependency-20261031.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-cpanel-otp-dependency
  cancel-in-progress: false
jobs:
  otp-dependency:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable authorized PR source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "OTP_RELEASE_SOURCE_SHA_PINNED=true"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Attest active Python runtime and install only exact hashed OTP wheel
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 170s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -eEuo pipefail
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          unset PYTHONPATH
          test "$(id -un)" = "zomorod2"
          py="/home/zomorod2/virtualenv/Saeit/3.10/bin/python"
          test -x "$py"
          # Do not assume LiteSpeed's lswsgi executable is a Python CLI.
          # Verify the real cPanel 3.10 interpreter using a negative-control exit code.
          set +e
          "$py" -B -c 'import sys;sys.exit(37)' >/dev/null 2>&1
          control=$?
          set -e
          test "$control" = 37
          echo "CPANEL_PYTHON_310_CLI=verified"
          python3 -B - <<'PY'
          import os,pathlib,re,sys
          root=pathlib.Path("/home/zomorod2/Saeit").resolve()
          owner=os.getuid()
          workers=0
          py310=0
          other=0
          unreadable=0
          for pp in pathlib.Path("/proc").iterdir():
              if not pp.name.isdecimal():continue
              try:
                  if pp.stat().st_uid!=owner:continue
                  cmd=(pp/"cmdline").read_bytes()[:4096].lower()
                  if not (b"passenger" in cmd or b"lswsgi" in cmd or (b"python" in cmd and b"saeit" in cmd)):continue
                  if pathlib.Path(os.readlink(pp/"cwd")).resolve()!=root:continue
                  workers+=1
                  maps=(pp/"maps").read_text(encoding="utf8",errors="replace")
                  if re.search(r"libpython3\.10|python3\.10|/3\.10/",maps):py310+=1
                  if re.search(r"libpython3\.(?:9|11|12|13)|python3\.(?:9|11|12|13)",maps):other+=1
              except (OSError,UnicodeError):
                  unreadable+=1
          print("CPANEL_LIVE_WORKER_COUNT="+str(workers))
          print("CPANEL_LIVE_WORKER_PY310_MAPS="+str(py310))
          print("CPANEL_LIVE_WORKER_OTHER_PYTHON_MAPS="+str(other))
          print("CPANEL_LIVE_WORKER_UNREADABLE="+str(unreadable))
          if workers<1 or py310!=workers or other or unreadable:
              print("OTP_DEPENDENCY_RELEASE=blocked_unattested_runtime")
              sys.exit(12)
          print("CPANEL_LIVE_WORKER_PYTHON_310=attested")
          PY
          # Exact locally archived wheel, downloaded and SHA-verified in prior private staging.
          stage="/home/zomorod2/.private/zomorod-messaging-release-stages/627090763100af89cc80c79eb8f6fab2ac74f02f"
          manifest="$stage/manifest.txt"
          wheel="$stage/code/zm-msg-deps/django_otp-1.7.5-py3-none-any.whl"
          test -f "$manifest" && test ! -L "$manifest"
          grep -Fxq 'release=627090763100af89cc80c79eb8f6fab2ac74f02f' "$manifest"
          grep -Fxq 'mode=PRIVATE_STAGE_NO_DEPLOY' "$manifest"
          test -f "$wheel" && test ! -L "$wheel"
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "475d4111e07d61616996f098d08d29884da6397273a11f53c1b8e8c75d27e1dc"
          echo "OTP_WHEEL_SHA256=verified"
          sitepackages="$("$py" -B -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          case "$sitepackages" in /home/zomorod2/virtualenv/Saeit/3.10/*/site-packages) ;; *) echo "OTP_SITEPACKAGES=unsafe"; exit 13;; esac
          test -d "$sitepackages" && test ! -L "$sitepackages"
          if "$py" -B -c 'import django_otp,importlib.metadata;assert importlib.metadata.version("django-otp")=="1.7.5"' >/dev/null 2>&1; then
            echo "PRODUCTION_VENV_DJANGO_OTP=already_pinned"
            echo "PRODUCTION_APP_CODE_CHANGED=false"
            echo "PRODUCTION_DB_CHANGED=false"
            exit 0
          fi
          if "$py" -B -c 'import importlib.util,sys;sys.exit(0 if importlib.util.find_spec("django_otp") else 44)' >/dev/null 2>&1; then
            echo "OTP_DEPENDENCY_RELEASE=blocked_conflicting_existing_version"
            exit 14
          fi
          test ! -e "$sitepackages/django_otp" && test ! -L "$sitepackages/django_otp"
          test ! -e "$sitepackages/django_otp-1.7.5.dist-info" && test ! -L "$sitepackages/django_otp-1.7.5.dist-info"
          base="/home/zomorod2/.private/zomorod-messaging-release-stages"
          preparation="$base/.otp-dependency-prep-20261031"
          test ! -e "$preparation" && test ! -L "$preparation"
          install -d -m 700 "$preparation"
          "$py" -B -m pip install --no-index --no-deps --disable-pip-version-check \
            --target "$preparation" "$wheel"
          test -d "$preparation/django_otp" && test -d "$preparation/django_otp-1.7.5.dist-info"
          test -z "$(find "$preparation" -type l -print -quit)"
          test "$(find "$preparation" -mindepth 1 -maxdepth 1 | wc -l)" = 2
          moving=0
          recover() {
            rc=$?
            if test "$moving" = 1; then
              if test -d "$sitepackages/django_otp"; then
                mv -T -- "$sitepackages/django_otp" "$preparation/rollback_django_otp" || true
              fi
              if test -d "$sitepackages/django_otp-1.7.5.dist-info"; then
                mv -T -- "$sitepackages/django_otp-1.7.5.dist-info" "$preparation/rollback_distinfo" || true
              fi
              echo "OTP_DEPENDENCY_ROLLBACK=attempted_private_recovery"
            fi
            exit "$rc"
          }
          trap recover ERR
          moving=1
          mv -T -- "$preparation/django_otp" "$sitepackages/django_otp"
          mv -T -- "$preparation/django_otp-1.7.5.dist-info" "$sitepackages/django_otp-1.7.5.dist-info"
          "$py" -B -c 'import django_otp,importlib.metadata,pathlib,sysconfig;assert importlib.metadata.version("django-otp")=="1.7.5";assert pathlib.Path(django_otp.__file__).resolve().is_relative_to(pathlib.Path(sysconfig.get_path("purelib")).resolve())'
          trap - ERR
          echo "PRODUCTION_VENV_DJANGO_OTP=installed_pinned_1_7_5"
          echo "PRODUCTION_APP_CODE_CHANGED=false"
          echo "PRODUCTION_DB_CHANGED=false"
          echo "PASSENGER_RESTARTED=false"
          echo "OUTBOUND_MESSAGE_SEND_ENABLED=false"
          REMOTE
      - name: Remove runner transient relay credentials
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/zm-marketing-ro"; then
            rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
          fi
