name: Finance102 owner-manual cPanel HTTPS API read-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-readonly:
    if: github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify UAPI fail-closed and no network in tests
        run: python3 -B -m unittest discover -s tests -p 'test_finance102_cpanel_uapi_readonly.py' -v
      - name: Read-only cPanel app mapping via TLS 2083 only
        env:
          FINANCE102_CPANEL_API_TOKEN: ${{ secrets.FINANCE102_CPANEL_API_TOKEN }}
        run: python3 -B scripts/finance102_cpanel_uapi_readonly.py
