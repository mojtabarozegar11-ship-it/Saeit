name: MOJ PROP — actual cPanel isolated Django :memory: rehearsal (NO PRODUCTION DATA)
on:
  push:
    branches: [audit/mojprop-isolated-django-host-rehearsal-20261118]
permissions:
  contents: read
concurrency:
  group: mojprop-cpanel-isolated-memory-20261118
  cancel-in-progress: false
jobs:
  private-stage-django-rehearsal:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run static source check
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path
          f=Path("scripts/mojprop_v141_isolated_inmemory_release_rehearsal_20261118.py")
          compile(f.read_text("utf8"),str(f),"exec")
          print("PRIVATE_STAGE_REHEARSAL_SCRIPT_SYNTAX=OK")
          PY
      - name: Test private staged app with isolated in-memory DB via pinned factory-to-cPanel SSH
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${HOST_KEY:?OWNER_CPANEL_SSH_CREDENTIAL_UNAVAILABLE}"
          umask 077
          dir="$RUNNER_TEMP/mojprop-cpanel-inmem"
          install -d -m 700 "$dir"
          trap 'rm -f -- "$dir/key" "$dir/known"; rmdir "$dir" 2>/dev/null || true' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();sys.stdout.write(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n")' > "$dir/key"
          chmod 600 "$dir/key"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$dir/known"
          test "$(ssh-keygen -lf "$dir/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 180s ssh -T -i "$dir/key" -p 1396 \
            -o UserKnownHostsFile="$dir/known" -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no \
            -o RequestTTY=no -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            zomorod2@178.239.147.125 \
            'test "$(id -un)" = zomorod2; test -x /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python; PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/mojprop_v141_isolated_inmemory_release_rehearsal_20261118.py \
            | python3 -B -c 'import json,sys;raw=sys.stdin.read(12000);rows=[x for x in raw.splitlines() if x.startswith("MOJPROP_CPANEL_MEMORY_REHEARSAL=")];assert len(rows)==1,raw[-1000:];d=json.loads(rows[0].split("=",1)[1]);print(rows[0]);checks=("django_setup_ok","model_check_ok","in_memory_migrations_ok","native_payment_disabled","models_present");assert all(d.get(k) is True for k in checks),d'
          echo "NO_LIVE_DB_OR_SITE_CHANGE_OR_PAYMENT=true"
