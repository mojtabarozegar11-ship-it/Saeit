name: VPS factory backup candidate audit (read only)

on:
  pull_request:
    paths:
      - scripts/factory_vps_backup_retention_audit_20261101.py
      - tests/test_factory_vps_backup_retention_audit_20261101.py
      - .github/workflows/vps-factory-backup-candidates-readonly-20261101.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saeit-vps-backup-readonly-candidates
  cancel-in-progress: false

jobs:
  synthetic-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only backup audit on synthetic SQLite fixtures
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_factory_vps_backup_retention_audit_20261101.py -v

  vps-audit:
    # New workflow must be reviewed and merged, then explicitly dispatched.
    # PR runs never receive VPS credentials. No delete/apply mode exists.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    needs: synthetic-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory stopped VPS factory backups over fingerprint-pinned SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/vps-factory-backup-readonly"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test -s "$d/known"
          actual="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 580s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ForwardAgent=no githubops@178.239.147.150 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' < scripts/factory_vps_backup_retention_audit_20261101.py
          echo FACTORY_VPS_BACKUP_AUDIT_ONLY=true
          echo FACTORY_BACKUP_DELETION_PERFORMED=false
