name: PICM Private Text-to-Image Browser and Django Contract
on:
  push:
    branches:
      - feature/picm-text-to-image-owner-ui-20261020
    paths:
      - templates/picm/index.html
      - templates/picm/text_image.js
      - tests/test_picm_text_image_ui.py
      - scripts/picm_text_image_browser_proof.py
      - .github/workflows/picm-text-image-ci.yml
  pull_request:
    paths:
      - templates/picm/index.html
      - templates/picm/text_image.js
      - tests/test_picm_text_image_ui.py
      - scripts/picm_text_image_browser_proof.py
      - .github/workflows/picm-text-image-ci.yml
permissions:
  contents: read
jobs:
  text-image:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile real implementation and test browser JavaScript
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/picm_text_image_browser_proof.py tests/test_picm_text_image_ui.py
          node --check templates/picm/text_image.js
          python - <<'PY'
          from pathlib import Path
          t=Path('templates/picm/index.html').read_text()
          assert "{% include 'picm/text_image.js' %}" in t
          assert 'id="mode-text_image"' in t
          assert 'id="text-image-options"' in t
          assert 'id="photo"' in t
          assert '{{ picm_daily_limit }}' in t
          print('PICM_TEXT_IMAGE_TEMPLATE_CONTRACT_VALID')
          PY
      - name: Install Django project and browser test packages
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'playwright>=1.51,<2'
      - name: Verify real Django owner-only workbench and queue
        env:
          SECRET_KEY: picm-temporary-text-image-ui-test
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python -m pytest -q tests/test_picm_text_image_ui.py tests/test_picm_views.py tests/test_picm_auth.py
          python manage.py check
      - name: Verify Chrome can POST without photo, poll, preview and download private PNG
        run: python scripts/picm_text_image_browser_proof.py
