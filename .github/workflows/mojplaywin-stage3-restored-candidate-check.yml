name: MojPlayWin stage 3 exact candidate restored DB check
on:
  push:
    branches: [qa/mpw-payment-release-preflight-20261015]
    paths:
      - .github/workflows/mojplaywin-stage3-restored-candidate-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-stage3-full-staged-candidate-migration
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify commerce migrations against disposable restored MySQL DB without live writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 560s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import datetime, gzip, hashlib, json, os, pathlib, secrets, shutil, subprocess, tempfile
          from pathlib import Path
          import django
          os.environ["DJANGO_SETTINGS_MODULE"] = "config.settings"
          django.setup()
          from django.db import connections
          from django.conf import settings
          live = settings.DATABASES["default"]
          assert live["ENGINE"] == "django.db.backends.mysql"
          root = Path.home() / ".mpw-private-db-backups"
          assert root.is_dir() and not root.is_symlink()
          manifests = sorted(root.glob("*/manifest.json"), key=lambda p:p.stat().st_mtime, reverse=True)
          assert manifests, "No private backup available"
          manifest = json.loads(manifests[0].read_text())
          archive = manifests[0].parent / "mysql-full.sql.gz"
          assert archive.is_file() and not archive.is_symlink() and archive.stat().st_size > 512
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == manifest["archive_sha256"], "Backup digest differs"
          assert 1 <= int(manifest["tables"]) <= 20000
          age = (datetime.datetime.now(datetime.timezone.utc) -
                 datetime.datetime.fromisoformat(manifest["timestamp_utc"])).total_seconds()
          assert 0 <= age < 7200, "Refuse stale or future backup"
          code_entries = manifest.get("code_rollback_checksums")
          assert isinstance(code_entries,dict) and len(code_entries)>=5
          for rel,sha in code_entries.items():
              src = manifests[0].parent / "source-rollback" / rel
              assert src.is_file() and not src.is_symlink()
              assert hashlib.sha256(src.read_bytes()).hexdigest()==sha
          print("MPW_STAGE2_MIGRATION_SOURCE_IS_NEW_VERIFIED_BACKUP=True")
          sql_client = shutil.which("mysql") or shutil.which("mariadb")
          uapi = shutil.which("uapi") or "/usr/local/cpanel/bin/uapi"
          assert sql_client and Path(uapi).is_file(), "Missing supported MySQL or cPanel client"
          token=secrets.token_hex(3)
          dbname="zomorod2_mpwr"+token
          username="zomorod2_mpwu"+token
          assert dbname != live["NAME"], "Refuse production database"
          passwd=secrets.token_urlsafe(30)
          def api(op, *args):
              p=subprocess.run([uapi, "--output=json", "Mysql", op, *args],
                  capture_output=True, text=True, timeout=65, check=False)
              assert p.returncode == 0, "UAPI subprocess failed"
              payload=json.loads(p.stdout)
              assert payload.get("result",{}).get("status") == 1, "UAPI operation denied"
              return payload.get("result",{}).get("data")
          # cPanel must manage the database mapping; never CREATE/DROP DATABASE via SQL.
          dbs = api("list_databases")
          existing={str(x.get("database","")) for x in (dbs or []) if isinstance(x,dict)}
          assert dbname not in existing, "Staging database name already exists"
          made_db=False
          made_user=False
          tested=False
          cleanup_ok=True
          try:
              api("create_database", "name="+dbname)
              made_db=True
              api("create_user", "name="+username, "password="+passwd)
              made_user=True
              api("set_privileges_on_database", "user="+username, "database="+dbname, "privileges=ALL%20PRIVILEGES")
              env=os.environ.copy()
              env["MYSQL_PWD"]=passwd
              cmd=[sql_client,"--user="+username, "--host=localhost", "--default-character-set=utf8mb4", dbname]
              with gzip.open(archive,"rb") as dump:
                  with subprocess.Popen(cmd,stdin=subprocess.PIPE,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,env=env) as proc:
                      try:
                          shutil.copyfileobj(dump, proc.stdin, length=1048576)
                          proc.stdin.close()
                          errors=proc.stderr.read(16384)
                          exit_code=proc.wait(timeout=200)
                      except Exception:
                          proc.kill()
                          proc.wait()
                          raise
              assert exit_code == 0, "MySQL restore failed"
              def query(sql):
                  call=subprocess.run([sql_client,"--user="+username,"--host=localhost","--batch","--skip-column-names",dbname,"-e",sql],
                      capture_output=True,text=True,timeout=40,env=env,check=False)
                  assert call.returncode == 0, "Unable to verify restored schema"
                  return call.stdout.strip()
              table_count = int(query("SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE'"))
              assert table_count == int(manifest["tables"]), "Restored table count differs"
              count = int(query("SELECT COUNT(*) FROM django_migrations"))
              assert count > 0, "Missing restored migration history"
              print("MPW_ISOLATED_FULL_BACKUP_RESTORE_PASSED=True")
              print("MPW_RESTORED_TABLE_COUNT="+str(table_count))
              print("MPW_RESTORED_DJANGO_MIGRATION_ROWS_POSITIVE=True")
              print("MPW_RESTORE_USED_EXISTING_PRIVATE_BACKUP=True")
              baseline_counts = {
                  table: int(query("SELECT COUNT(*) FROM " + table))
                  for table in ("core_order", "core_orderitem", "core_educationenrollment")
              }
              shadow = Path.home() / ".mpw-commerce-stage3-20261015" / "code"
              assert shadow.is_dir() and not shadow.is_symlink(), "Isolated commerce package missing"
              for name in ("mpw_commerce/models.py", "mpw_commerce/migrations/0001_initial.py",
                           "mpw_commerce/migrations/0002_buyerwalletchallenge.py"):
                  assert (shadow / name).is_file(), "Commerce candidate missing"
              site = (Path.home() / "Saeit-staging").resolve(strict=True)
              venv = Path.home() / "virtualenv/Saeit-staging/3.11/bin/python"
              assert venv.is_file() and site == Path.home()/"Saeit-staging"
              with tempfile.TemporaryDirectory(prefix="mpw-commerce-qa-") as confdir:
                  conf = Path(confdir)
                  (conf / "mpw_restored_qa_settings.py").write_text(
                      "import os\n"
                      "from config.settings import *\n"
                      "assert DATABASES['default']['ENGINE'] == 'django.db.backends.mysql'\n"
                      "assert DATABASES['default']['NAME'] != os.environ['MPW_STAGING_NAME']\n"
                      "INSTALLED_APPS = list(INSTALLED_APPS) + ['mpw_commerce']\n"
                      "DATABASES = {'default': dict(DATABASES['default'], "
                      "NAME=os.environ['MPW_STAGING_NAME'], "
                      "USER=os.environ['MPW_STAGING_USER'], "
                      "PASSWORD=os.environ['MPW_STAGING_PASSWORD'], "
                      "HOST='localhost', PORT='', OPTIONS={'charset': 'utf8mb4'})}\n"
                      "MPW_COMMERCE_RELEASE_READY = False\n"
                      "MPW_COMMERCE_CUSTOMER_HTTP_ENABLED = False\n"
                      "MPW_COMMERCE_INVOICING_ENABLED = False\n"
                      "MPW_COMMERCE_SETTLEMENT_ENABLED = False\n"
                      "MPW_COMMERCE_DOWNLOADS_ENABLED = False\n"
                      "MPW_COMMERCE_REAL_RPC_ENABLED = False\n"
                      "MPW_COMMERCE_AUTORECONCILE_ENABLED = False\n"
                      "MPW_COMMERCE_COURSE_AUTO_ENROLL_ENABLED = False\n"
                  )
                  tmp_env = os.environ.copy()
                  tmp_env.update({
                      "DJANGO_SETTINGS_MODULE": "mpw_restored_qa_settings",
                      "PYTHONPATH": os.pathsep.join([str(conf), str(shadow), str(site)]),
                      "PYTHONDONTWRITEBYTECODE": "1",
                      "MPW_STAGING_NAME": dbname,
                      "MPW_STAGING_USER": username,
                      "MPW_STAGING_PASSWORD": passwd,
                  })
                  check_code = __import__("textwrap").dedent("""
                  import django
                  django.setup()
                  from django.db import connection
                  from django.db.migrations.executor import MigrationExecutor
                  from django.db.migrations.recorder import MigrationRecorder
                  from django.core.management import call_command
                  assert connection.vendor == 'mysql'
                  target = ('mpw_commerce','0002_buyerwalletchallenge')
                  plan = MigrationExecutor(connection).migration_plan([target])
                  assert len(plan) == 2 and all(m.app_label == 'mpw_commerce' and not reverse for m,reverse in plan), 'Unexpected dependencies or migration drift'
                  call_command('migrate','mpw_commerce',verbosity=0,interactive=False)
                  tables = set(connection.introspection.table_names())
                  expected = {'mpw_commerce_commerceinvoice','mpw_commerce_commercereceipt','mpw_commerce_commercefulfillment','mpw_commerce_buyerwalletchallenge'}
                  assert expected <= tables, 'Commerce schema incomplete'
                  applied = MigrationRecorder(connection).applied_migrations()
                  assert target in applied and ('mpw_commerce','0001_initial') in applied
                  from mpw_commerce.models import CommerceInvoice,CommerceReceipt,CommerceFulfillment,BuyerWalletChallenge
                  assert CommerceInvoice._meta.get_field('order').remote_field.model._meta.db_table == 'core_order'
                  assert CommerceFulfillment._meta.get_field('item').remote_field.model._meta.db_table == 'core_orderitem'
                  print('MPW_RESTORED_COMMERCE_0001_0002_APPLIED=True')
                  print('MPW_RESTORED_ORDER_RELATIONS_COMPATIBLE=True')
                  """)
                  check = subprocess.run(
                      [str(venv), "-c", check_code],
                      cwd=site, env=tmp_env, stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE, text=True, timeout=135, check=False,
                  )
                  if check.returncode != 0:
                      raise RuntimeError("Restored-commerce migration compatibility check failed")
                  for line in check.stdout.splitlines():
                      if line.startswith("MPW_RESTORED_"):
                          print(line)
              for table, original_count in baseline_counts.items():
                  assert int(query("SELECT COUNT(*) FROM " + table)) == original_count, "Restored order or enrollment row count changed"
              final_table_count = int(query("SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE'"))
              assert final_table_count == table_count + 4, "Commerce migration created unexpected table count"
              print("MPW_RESTORED_BASE_ORDER_AND_ENROLLMENT_COUNTS_UNCHANGED=True")
              print("MPW_RESTORED_COMMERCE_FOUR_NEW_TABLES_VERIFIED=True")
              print("MPW_STAGE3_STAGED_CANDIDATE_MIGRATIONS_COMPATIBLE=True")
              print("MPW_PRODUCTION_SCHEMA_MIGRATION_PERFORMED=False")
              tested=True
          finally:
              # Only delete random resources successfully created in this very run.
              if made_db:
                  try:
                      api("delete_database", "name="+dbname)
                      print("MPW_TEMPORARY_RESTORE_DATABASE_DELETED=True")
                  except Exception:
                      cleanup_ok=False
                      print("MPW_TEMPORARY_RESTORE_DATABASE_DELETED=False")
              if made_user:
                  try:
                      api("delete_user", "name="+username)
                      print("MPW_TEMPORARY_RESTORE_USER_DELETED=True")
                  except Exception:
                      cleanup_ok=False
                      print("MPW_TEMPORARY_RESTORE_USER_DELETED=False")
          assert cleanup_ok, "Staging resource cleanup needs review"
          assert tested, "Restoration was not verified"
          print("MPW_PRODUCTION_DB_NEVER_WRITTEN=True")
          print("MPW_PUBLIC_CHECKOUT_STILL_NOT_ENABLED=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
