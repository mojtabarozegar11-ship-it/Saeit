name: MPW live error log readonly
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read Passenger logs through pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-log-read"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("/home/zomorod2/logs"), Path("/home/zomorod2/mojplaywin.com"), Path("/home/zomorod2/Saeit-staging"), Path("/home/zomorod2/.private_mojplaywin_main_agents")]
          names = {"error_log","passenger.log","stderr.log","application.log"}
          seen = set()
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.rglob("*"):
                  if path in seen or len(seen) >= 20:
                      continue
                  if path.is_file() and not path.is_symlink() and path.name in names:
                      seen.add(path)
                      try:
                          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()[-300:]
                      except OSError:
                          continue
                      relevant = [line[:1000] for line in lines if re.search(r"Traceback|Exception|Error|Internal Server|record_invoice|guest|commerce|PaymentIntent|IntegrityError|OperationalError|DoesNotExist", line, re.I)]
                      print("MPW_SERVER_LOG path=%s matching=%d" % (path, len(relevant)))
                      for line in relevant[-120:]:
                          print(line)
          if not seen:
              print("MPW_SERVER_LOG no_known_files")
          PY
          rm -rf -- "$d"
