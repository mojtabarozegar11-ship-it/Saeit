name: Zomorod Water Path game quality
on:
  pull_request:
    paths:
      - 'content/zomorod-hourly-20261023/water-path-game/index.html'
      - 'tests/game/water-path-best-20261026.cjs'
      - '.github/workflows/zomorod-water-path-quality-20261026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  water-path-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify water puzzle syntax and earned best-move records
        run: node tests/game/water-path-best-20261026.cjs
