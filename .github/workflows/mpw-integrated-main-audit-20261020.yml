name: MojPlayWin integrated main menu template revenue and checkout audit 20261020
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-integrated-main-audit-20261020.yml"]
permissions: {contents: read}
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read main-only navigation and payment gates without exposing secrets
        run: |
          timeout 115s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          from pathlib import Path
          import json,re,hashlib,os,ast,sys
          root=Path('/home/zomorod2/mojplaywin.com')
          app=Path('/home/zomorod2/Saeit-staging')
          home=root/'design-preview-20261017/production-home-20261017.html'
          if home.is_file() and not home.is_symlink():
              raw=home.read_text('utf8','replace')
              from html.parser import HTMLParser
              pos=raw.find('<header')
              print('MPW_HOME_HEADER='+json.dumps({'length':len(raw),'sha':hashlib.sha256(raw.encode()).hexdigest(),'position':pos,'segment':raw[pos:pos+7200],'revenue_link':raw.count('/mpw-editorial/revenue/index.html')},ensure_ascii=False))
          directory=root/'design-preview-20261017/mpw-ten-editorials-20261018/pages'
          sample={}
          for p in sorted(directory.glob('*.html')):
              doc=p.read_text('utf8','replace')
              sample[p.name]={'bytes':len(doc),'revenue_links':doc.count('mpw-editorial/revenue'),'nav_marker':('data-mpw-nav-harmonized-20261019' in doc),'header':('<header' in doc),'legacy':('mpw-design-unified-v1' not in doc)}
          print('MPW_STATIC_19_PAGE_NAV_AUDIT='+json.dumps(sample))
          php=root/'design-preview-20261017/_mpw_dynamic_main_shell_20261019.php'
          if php.exists():
              p=php.read_text('utf8','replace')
              for term in ('function layoutParts','function transformMain','canonical homepage navigation','mw-all-pages-menu'):
                  i=p.find(term)
                  print('MPW_DYNAMIC_PHP_SECTION='+json.dumps({'term':term,'i':i,'snippet':p[max(0,i-300):i+1600]}))
          # Prove active commerce settings without revealing addresses/API tokens.
          os.chdir(app);sys.path.insert(0,str(app));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.conf import settings
          from core.models import Product
          from mpw_commerce.models import CommerceInvoice,CommerceReceipt
          flags=('MPW_COMMERCE_RELEASE_READY','MPW_COMMERCE_REAL_RPC_ENABLED','MPW_COMMERCE_AUTORECONCILE_ENABLED','MPW_COMMERCE_INVOICING_ENABLED','MPW_COMMERCE_SETTLEMENT_ENABLED','MPW_COMMERCE_DOWNLOADS_ENABLED','MPW_COMMERCE_CUSTOMER_HTTP_ENABLED')
          print('MPW_COMMERCE_EVIDENCE='+json.dumps({'flags':{k:getattr(settings,k,None) is True for k in flags},'invoices':CommerceInvoice.objects.count(),'receipts':CommerceReceipt.objects.count(),'books':[{ 'id':i,'title':Product.objects.get(pk=i).title,'sale':str(Product.objects.get(pk=i).price),'active':Product.objects.get(pk=i).active} for i in (72,225)]}))
          from django.urls import resolve
          for route in ('/accounts/login/','/accounts/register/','/store/product/72/checkout/'):
              res=resolve(route)
              print('MPW_COMMERCE_ROUTE='+json.dumps({'route':route,'fn':str(res.func.__module__)+'.'+str(getattr(res.func,'__name__','view'))}))
          PY
      - name: Destroy temporary host credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
