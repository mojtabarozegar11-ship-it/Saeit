name: Zomorod owner credentials private rotation offline security CI
on:
  push:
    branches: [feature/zomorod-owner-credential-rotation-20261029]
    paths:
      - "scripts/zomorod_owner_password_rotate.php"
      - "scripts/test_zomorod_owner_password_rotate.py"
      - "content/zomorod-business/app.php"
      - ".github/workflows/zomorod-owner-credential-rotation-qa.yml"
  pull_request:
    paths:
      - "scripts/zomorod_owner_password_rotate.php"
      - "scripts/test_zomorod_owner_password_rotate.py"
      - "content/zomorod-business/app.php"
permissions:
  contents: read
jobs:
  credential-security:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2","8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
      - name: Verify strong-password rotation, audit, permissions and login session revocation
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/zomorod_owner_password_rotate.php
          php -l content/zomorod-business/app.php
          python3 scripts/test_zomorod_owner_password_rotate.py
          python3 scripts/zomorod_workflow_web_synthetic_qa.py
          php scripts/zomorod_payroll_control_synthetic_qa.php
          echo "COMPANY_LIVE_PASSWORD=UNTOUCHED"
          echo "USER_CREDENTIALS_IN_REPOSITORY=NONE"
          echo "NEW_HOURLY_TASK=NOT_CREATED"
