name: ZM private ChatGPT text reports CI
on:
  push:
    branches:
      - feature/zm-chatgpt-text-reports-20261101
  pull_request:
    branches:
      - integration/zm-unified-business-command-center-20261101
    paths:
      - "enterprise_portal/**"
      - ".github/workflows/zm-chatgpt-text-reports-ci-20261101.yml"
permissions:
  contents: read
concurrency:
  group: zm-chatgpt-text-reports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  text-report-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-not-for-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django model and migration consistency
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test route, data integrity and confidentiality
        run: python manage.py test enterprise_portal.test_chatgpt_reports -v 2
      - name: Verify release boundary
        run: |
          echo "EXACT_HEAD_CI=1"
          echo "NO_HOST_CONTACT=1"
          echo "NO_MERGE_DEPLOY_DB_CHANGE=1"
