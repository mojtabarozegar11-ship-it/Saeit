name: Tala source-verified international live market data
on:
  pull_request:
    paths:
      - ".github/scripts/tala_live_market.py"
      - ".github/workflows/zomorod-tala-live.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/tala_live_market.py"
      - ".github/workflows/zomorod-tala-live.yml"
      - "public/tala/api/live.php"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-tala-live-feed
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test international market collector, schema and timestamps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/tala_live_market.py
          python3 .github/scripts/tala_live_market.py --selftest
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public provider quotes, reject bad and fabricated data
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tala_live_market.py --output "$RUNNER_TEMP/tala-global-market.json"
          python3 -m json.tool "$RUNNER_TEMP/tala-global-market.json" > /dev/null
      - name: Prepare pinned Tala-only VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/tala-market-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF2
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF2
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Atomically publish only global market snapshot outside public_html
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tala-market-ssh"
          file=".tala-market-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          scp -F "$d/config" "$RUNNER_TEMP/tala-global-market.json" "saeit-cpanel:$file"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$file" <<'REMOTE'
          set -euo pipefail
          umask 077
          name="$1"
          case "$name" in
            .tala-market-[0-9]*.json) ;;
            *) echo 'TALA_MARKET_UPLOAD_NAME=invalid' >&2; exit 1 ;;
          esac
          root="$HOME/.tala-secure"
          test -d "$root" && test ! -L "$root"
          tmp="$HOME/$name"
          target="$root/tala-live-market.json"
          test -f "$tmp" && test ! -L "$tmp"
          test ! -L "$target"
          chmod 600 "$tmp"
          python3 - "$tmp" <<'PY'
          import json,sys
          p=sys.argv[1]
          with open(p,'r',encoding='utf-8') as f:
              d=json.load(f)
          assert d['scope']=='tala' and d['schema']==1 and d['market']=='international_reference'
          assert isinstance(d['quotes'],dict) and len(d['quotes'])>0 and len(d['quotes'])<24
          print('TALA_REMOTE_VERIFIED_SYMBOLS='+str(len(d['quotes'])))
          PY
          mv -f -- "$tmp" "$target"
          chmod 600 "$target"
          echo 'TALA_GLOBAL_FEED=updated_private_snapshot'
          echo 'TALA_WEBROOT=untouched'
          echo 'TALA_SQLITE_DATABASE=untouched'
          echo 'TALA_OTHER_SUBSITES=untouched'
          REMOTE
      - name: Check live read-only Tala endpoint (when deployed)
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/tala-market-public.json" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://zomorodmelal.ir/tala/api/live.php')"
          if test "$status" = 200; then
            python3 - "$RUNNER_TEMP/tala-market-public.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: x=json.load(f)
          assert x.get('scope')=='tala' and x.get('ok') is True
          print('TALA_LIVE_READ_ENDPOINT=healthy')
          PY
          else
            echo "TALA_READ_ENDPOINT=not_ready status=$status"
          fi
