name: Moj Prop Starter30 cPanel evidence - strictly read only

on:
  pull_request:
    paths:
      - "scripts/mojprop_starter30_live_readonly.py"
      - "scripts/mojprop_starter30_baseline_compare.py"
      - "tests/test_mojprop_starter30_baseline_compare.py"
      - "tests/test_mojprop_starter30_live_readonly.py"
      - ".github/workflows/mojprop-starter30-cpanel-readonly.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: mojprop-starter30-cpanel-evidence
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate no-effect audited inventory contract
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_mojprop_starter30_live_readonly tests.test_mojprop_starter30_baseline_compare -v
          python3 -B -m py_compile scripts/mojprop_starter30_live_readonly.py scripts/mojprop_starter30_baseline_compare.py

  inventory:
    # Explicit trusted owner comment only; no push, merge, or PR can reach cPanel.
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.issue.number == 1600 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'MOJPROP-STARTER30-READONLY-20261115'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable read-only probe source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object -- scripts/mojprop_starter30_live_readonly.py)" = "af03022a550d75bbe5cf6e13221fe526e159e65d"
          test "$(git hash-object -- scripts/mojprop_starter30_baseline_compare.py)" = "9c85c5fefcd42b997e52dcf87ff22f270253a5e5"
          python3 -B -m unittest tests.test_mojprop_starter30_live_readonly tests.test_mojprop_starter30_baseline_compare -q
      - name: Inspect current exact cPanel Starter30 public asset tree
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          work="$RUNNER_TEMP/mojprop-starter30-inspect"
          install -d -m 700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n"; sys.stdout.write(s)' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P "" -f "$work/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$work/known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$work/config" <<EOF
          Host owner-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $work/host.key
            UserKnownHostsFile $work/known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          timeout 90s ssh -T -F "$work/config" owner-cpanel \
            'for p in /home/zomorod2/virtualenv/Saeit/3.11/bin/python /opt/alt/python311/bin/python3.11 python3.11 python3; do if command -v "$p" >/dev/null 2>&1 && "$p" -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)" >/dev/null 2>&1; then exec "$p" -B -; fi; done; echo CPANEL_PYTHON_UNAVAILABLE >&2; exit 72' \
            < scripts/mojprop_starter30_live_readonly.py \
            | python3 -c 'import json,sys; from pathlib import Path; from scripts.mojprop_starter30_baseline_compare import classify; doc=json.load(sys.stdin); report=classify(doc,Path("templates/moj-prop-v4")); print("LIVE_READONLY_INVENTORY="+json.dumps(doc,sort_keys=True)); print("LIVE_STATIC_BASELINE_CLASSIFICATION="+json.dumps(report,sort_keys=True))'
          echo 'CPANEL_STARTER30_READONLY_CHECK_COMPLETED=true; NO_RELEASE_NO_PAYMENT=true'
