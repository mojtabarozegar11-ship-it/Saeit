name: MPW guest purchase recovery read-only QA
on:
  pull_request:
    paths:
      - 'services/mpw_trx_guest_commerce.py'
      - 'scripts/test_mpw_guest_purchases_safe_recovery_20261031.py'
      - '.github/workflows/mpw-guest-recovery-readonly-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install 'Django>=5.2,<5.3'
      - name: Run no-DB, no-payment guest recovery regressions
        run: python -m unittest scripts.test_mpw_guest_purchases_safe_recovery_20261031 -v
