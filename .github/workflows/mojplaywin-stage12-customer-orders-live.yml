name: MojPlayWin stage 12 guarded buyer order API live installation
on:
  push:
    branches: [qa/mpw-payment-release-preflight-20261015]
    paths: ['.github/workflows/mojplaywin-stage12-customer-orders-live.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-stage12-single-buyer-cart-deploy
  cancel-in-progress: false
jobs:
  guarded-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare exact candidate and install only isolated customer cart module with all payment switches off
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-stage12-buyer-cart"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          tar -czf "$RUNNER_TEMP/mpw-stage12-cart.tgz" \
            mpw_commerce/models.py \
            mpw_commerce/urls.py \
            mpw_commerce/buyer_orders.py \
            mpw_commerce/migrations/0003_commerceorderrequest.py \
            scripts/mpw_stage12_guarded_install.py
          expected="$(sha256sum "$RUNNER_TEMP/mpw-stage12-cart.tgz" | cut -d' ' -f1)"
          timeout 75s ssh -F "$d/config" host \
            'set -e; umask 077; test ! -L "$HOME/.mpw-cart-stage12"; mkdir -p "$HOME/.mpw-cart-stage12"; chmod 700 "$HOME/.mpw-cart-stage12"; cat > "$HOME/.mpw-cart-stage12/source.tgz"' \
            < "$RUNNER_TEMP/mpw-stage12-cart.tgz"
          observed="$(timeout 45s ssh -F "$d/config" host 'sha256sum "$HOME/.mpw-cart-stage12/source.tgz"' | cut -d' ' -f1)"
          test "$expected" = "$observed"
          timeout 240s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          umask 077
          cd "$HOME/.mpw-cart-stage12"
          if test -d source && test ! -L source && test -f source/scripts/mpw_stage12_guarded_install.py; then
            rm -rf -- source
          fi
          test ! -e source
          mkdir -m 700 source
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import tarfile
          from pathlib import Path
          root=Path.home()/".mpw-cart-stage12"
          archive=root/"source.tgz"
          allowed={
              "mpw_commerce/models.py",
              "mpw_commerce/urls.py",
              "mpw_commerce/buyer_orders.py",
              "mpw_commerce/migrations/0003_commerceorderrequest.py",
              "scripts/mpw_stage12_guarded_install.py",
          }
          with tarfile.open(archive,"r:gz") as t:
              members=t.getmembers()
              assert {m.name for m in members}==allowed
              assert all(m.isfile() and not m.issym() and not m.islnk()
                         and m.size<150000 for m in members)
              for m in members:
                  destination=root/"source"/m.name
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(t.extractfile(m).read())
                  destination.chmod(0o600)
          print("MPW_STAGE12_PRIVATE_SOURCE_CHECKSUM_AND_MEMBERS_VERIFIED=True")
          PY
          cd "$HOME/Saeit-staging"
          PYTHONPATH="$HOME/Saeit-staging" "$HOME/virtualenv/Saeit-staging/3.11/bin/python" \
            "$HOME/.mpw-cart-stage12/source/scripts/mpw_stage12_guarded_install.py"
          REMOTE

      - name: Inspect live site without creating customer orders
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/ || true)"
          store="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/store/ || true)"
          old="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://mojplaywin.com/checkout/ || true)"
          echo "MPW_STAGE12_HOME_HTTP=$home"
          echo "MPW_STAGE12_STORE_HTTP=$store"
          echo "MPW_STAGE12_OLD_CHECKOUT_HTTP=$old"
          test "$home" = 200
          test "$store" = 200
          test "$old" = 404
          echo MPW_STAGE12_PUBLIC_SITE_HEALTHY=True
          echo MPW_STAGE12_NO_PAYMENT_COLLECTION=True
      - name: Erase runner-only SSH keys and source archive
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/mpw-stage12-buyer-cart"
          rm -f -- "$RUNNER_TEMP/mpw-stage12-cart.tgz"
