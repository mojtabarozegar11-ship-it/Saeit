name: Moj messaging isolated CI and VPS read-only preflight
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths:
      - '.github/workflows/moj-messaging-vps-preflight-20261028.yml'
      - 'ops/messaging-bridge/**'
  pull_request:
    paths:
      - '.github/workflows/moj-messaging-vps-preflight-20261028.yml'
      - 'ops/messaging-bridge/**'
permissions:
  contents: read
  statuses: write
concurrency:
  group: moj-messaging-preflight-20261028
  cancel-in-progress: false
jobs:
  offline-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test isolated source and deny sensitive artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd ops/messaging-bridge
          python3 -B -m unittest discover -s tests -v
          python3 -B -m py_compile telegram.py
          node --check whatsapp.mjs
          bash -n install.sh control.sh
          if find . -type f \( -name '*.session' -o -name '*.session-journal' -o -name 'creds.json' -o -name 'bridge.env' -o -name '.env' \) | grep -q .; then
            echo 'PRIVATE_CREDENTIALS_FOUND_IN_CHECKOUT'; exit 1
          fi
          echo 'MMSG_ISOLATED_SOURCE_TESTS=PASS'
  vps-preflight:
    needs: offline-qa
    if: >-
      github.event_name == 'push' &&
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only VPS runtime admission over pinned SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" || { echo 'MMSG_PREFLIGHT_NO_SSH_CREDENTIALS'; exit 1; }
          d="$(mktemp -d "$RUNNER_TEMP/mmsg-ssh.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          set +e
          timeout 40s ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10 githubops@178.239.147.150 'bash -s' > "$RUNNER_TEMP/mmsg-runtime-probe.txt" <<'REMOTE'
          set -eu
          test "$(id -un)" = githubops
          test -d /home/githubops/factory-runtime
          test "$(uname -s)" = Linux
          echo 'MMSG_VPS_IDENTITY=PASS'
          echo 'MMSG_FACTORY_PATH_PRESENT=PASS'
          available_kib="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          case "$available_kib" in ''|*[!0-9]*) echo MMSG_DISK_CHECK=ERROR; exit 1;; esac
          echo "MMSG_FREE_DISK_MIB=$((available_kib/1024))"
          admit=PASS
          if [ "$available_kib" -ge 524288 ]; then echo 'MMSG_DISK_GATE=PASS'; else echo 'MMSG_DISK_GATE=NO_GO'; admit=NO_GO; fi
          memory_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          case "$memory_kib" in ''|*[!0-9]*) memory_kib=0;; esac
          if [ "$memory_kib" -ge 524288 ]; then echo 'MMSG_MEMORY_GATE=PASS'; else echo 'MMSG_MEMORY_GATE=NO_GO'; admit=NO_GO; fi
          if command -v node >/dev/null 2>&1; then
            node_major="$(node -p 'process.versions.node.split(".")[0]')"
            echo "MMSG_NODE_MAJOR=$node_major"
            if [ "$node_major" -ge 20 ]; then echo 'MMSG_NODE_GATE=PASS'; else echo 'MMSG_NODE_GATE=NO_GO'; admit=NO_GO; fi
          else
            echo 'MMSG_NODE_GATE=NO_GO'; admit=NO_GO
          fi
          if command -v npm >/dev/null 2>&1; then echo 'MMSG_NPM_GATE=PASS'; else echo 'MMSG_NPM_GATE=NO_GO'; admit=NO_GO; fi
          if command -v python3 >/dev/null 2>&1 && python3 -c 'import venv' >/dev/null 2>&1; then echo 'MMSG_PYTHON_VENV_GATE=PASS'; else echo 'MMSG_PYTHON_VENV_GATE=NO_GO'; admit=NO_GO; fi
          if command -v systemctl >/dev/null 2>&1; then echo 'MMSG_SYSTEMD_TOOL=YES'; else echo 'MMSG_SYSTEMD_TOOL=NO'; admit=NO_GO; fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then echo 'MMSG_NONINTERACTIVE_SUDO=YES'; else echo 'MMSG_NONINTERACTIVE_SUDO=UNCONFIRMED'; admit=NO_GO; fi
          echo "MMSG_RUNTIME_ADMISSION=$admit"
          test "$admit" = PASS
          echo 'MMSG_VPS_READONLY_PREFLIGHT_FINISHED_NO_INSTALL_NO_ACCOUNT_LOGIN'
          REMOTE
          result=$?
          set -e
          if test -f "$RUNNER_TEMP/mmsg-runtime-probe.txt"; then
            grep -E '^MMSG_' "$RUNNER_TEMP/mmsg-runtime-probe.txt" || true
          fi
          test "$result" -eq 0

      - name: Publish runtime admission result to commit (PASS)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=moj-messaging-vps-runtime-admission \
            -f description='Runtime gates passed; no installation or account login'
      - name: Publish runtime admission result to commit (BLOCKED)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blockers="$(grep -E '^MMSG_(DISK_GATE|MEMORY_GATE|NODE_GATE|NPM_GATE|PYTHON_VENV_GATE|SYSTEMD_TOOL|NONINTERACTIVE_SUDO)=(NO_GO|NO|UNCONFIRMED)
 "$RUNNER_TEMP/mmsg-runtime-probe.txt" 2>/dev/null | sed -E 's/^MMSG_//;s/=.*$//' | paste -sd ',' - || true)"
          test -n "$blockers" || blockers=SSH_OR_AUTH_OR_CHECK
          description="Blocked: $blockers; no installation"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=moj-messaging-vps-runtime-admission \
            -f description="$description"
