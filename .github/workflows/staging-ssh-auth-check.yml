name: Staging SSH Authentication Check
on:
  workflow_dispatch:
  push:
    branches: [factory/integration-control-bridge-20261005]
    paths: [.github/workflows/staging-ssh-auth-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check staging SSH configuration and authentication without host changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          test -n "$VPS_KEY" || { echo "VPS_KEY=missing"; exit 1; }
          printf '%s\n' "$VPS_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 8 -t rsa 178.239.147.150 2>/dev/null > ~/.ssh/vps_hosts
          test "$(ssh-keygen -lf ~/.ssh/vps_hosts -E sha256 | awk 'NR==1{print $2}')" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          chmod 600 ~/.ssh/vps_hosts
          if [ -z "$HOST_KEY" ]; then echo "HOST_AUTH_KEY=missing"; else echo "HOST_AUTH_KEY=configured"; fi
          if [ -z "$HOST_KNOWN" ]; then echo "HOST_KNOWN_HOSTS_SECRET=missing"; else echo "HOST_KNOWN_HOSTS_SECRET=configured"; fi
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/vps_hosts -o IdentitiesOnly=yes githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net 2>/dev/null > "$tmp"
          test -s "$tmp" || { echo "HOST_NETWORK=failed"; exit 1; }
          test "$(ssh-keygen -lf "$tmp" -E sha256 | awk 'NR==1{print $2}')" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "HOST_NETWORK_AND_KEY_CONSISTENCY=ok"
          echo "HOST_AUTHENTICATION=not_attempted_without_approved_host_key_and_dedicated_host_credentials"
          REMOTE
      - name: Inspect staging via verified VPS relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          printf '%s\n' "$VPS_KEY" > "$d/vps"
          printf '%s\n' "$HOST_KEY" > "$d/host"
          ssh-keygen -y -P '' -f "$d/vps" >/dev/null
          ssh-keygen -y -P '' -f "$d/host" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null > "$d/vps_known"
          test "$(ssh-keygen -lf "$d/vps_known" -E sha256 | awk 'NR==1{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/vps" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps_known" githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net 2>/dev/null' > "$d/host_known"
          test "$(ssh-keygen -lf "$d/host_known" -E sha256 | awk 'NR==1{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat "$d/vps_known" "$d/host_known" > "$d/known"
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps
            IdentitiesOnly yes
            UserKnownHostsFile $d/known
            StrictHostKeyChecking yes
            BatchMode yes
          Host staging-host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host
            IdentitiesOnly yes
            UserKnownHostsFile $d/known
            StrictHostKeyChecking yes
            BatchMode yes
            ProxyJump relay
          EOF
          chmod 600 "$d/config"
          timeout 90s ssh -F "$d/config" staging-host 'bash -s' <<'REMOTE'
          set -eu
          cd /home/zomorod2/Saeit-staging
          for candidate in /home/zomorod2/virtualenv/Saeit-staging/*/bin/python .venv/bin/python venv/bin/python python3; do
            if "$candidate" -c 'import django' >/dev/null 2>&1; then task_python="$candidate"; break; fi
          done
          test -n "${task_python:-}" || { echo PYTHON_DJANGO=missing; exit 2; }
          "$task_python" - <<'PYDIAG'
          import os, json, hashlib, re
          from pathlib import Path
          for name in ["core/self_hosted_research_provider.py", "core/factory_agent_runtime.py"]:
           p=Path(name)
           if p.exists():
            s=p.read_text()
            print("CODE",name,hashlib.sha256(s.encode()).hexdigest())
            for line in s.splitlines():
             if any(t in line for t in ["search_endpoint =", "economic_factors\": {}", "max_results=6"]): print("CODE_SETTING",line.strip())
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          try:
           import django
           django.setup()
           from django.conf import settings
           print("ENV",settings.SAEIT_ENV)
           if settings.SAEIT_ENV!="staging": raise RuntimeError("not_staging")
           from django.db import connection
           if connection.vendor=="postgresql":
            with connection.cursor() as cur: cur.execute("SET default_transaction_read_only = on")
           from core.models import FactoryRun, AgentTask, Evidence, ResearchSource
           from django.db.models import Count
           print("PROVIDER",getattr(settings,"FACTORY_RESEARCH_PROVIDER","unset"))
           print("RUN_COUNTS",list(FactoryRun.objects.values("status").annotate(n=Count("id"))))
           print("TASK_COUNTS",list(AgentTask.objects.filter(action_type="product_research").values("status").annotate(n=Count("id"))))
           print("EVIDENCE_COUNT",Evidence.objects.count(),"SOURCE_COUNT",ResearchSource.objects.count())
           for t in AgentTask.objects.filter(action_type="product_research").order_by("-pk")[:5]:
            out=t.output_data or {}
            print("TASK",t.pk,"RUN",t.factory_run_id,"PRODUCT",t.product_id,"STATUS",t.status,"ATTEMPTS",t.attempt_count,"OUTPUT_KEYS",list(out) if isinstance(out,dict) else [])
            if isinstance(out,dict):
             for k in ["error","reason","message","blocked_reason"]:
              val=str(out.get(k,""))
              val=re.sub(r"https?://\\S+","[url]",val)
              val=re.sub(r"(?i)(password|token|secret|key)\\s*[=:]\\s*\\S+",r"\\1=[redacted]",val)
              if val: print("TASK_REASON",k,val[:500])
          except Exception as e:
           print("DIAGNOSTIC_ERROR_TYPE",type(e).__name__)
          PYDIAG
          echo READONLY_FACTORY_DIAGNOSTIC=completed
          REMOTE
