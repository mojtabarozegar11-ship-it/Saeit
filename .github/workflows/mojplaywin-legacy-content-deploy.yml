name: Deploy MojPlayWin legacy content only

on:
  push:
    branches: [main]
    paths:
      - "core/templates/brands/mojplaywin/base.html"
      - "core/templates/brands/mojplaywin/home.html"
      - "core/templates/brands/mojplaywin/page.html"
      - "core/static/site/mojplaywin.css"
      - "scripts/deploy_mojplaywin_legacy_content.py"

permissions:
  contents: read

concurrency:
  group: mojplaywin-legacy-content
  cancel-in-progress: false

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate only MojPlayWin files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy_mojplaywin_legacy_content.py
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "core/templates/brands/mojplaywin/base.html": ("site/mojplaywin.css", "?v=20261016"),
              "core/templates/brands/mojplaywin/home.html": ("PORTFOLIO MIX", "80% digital momentum", "20% real-world ventures"),
              "core/templates/brands/mojplaywin/page.html": ("Seven practical fields", "page_key == 'agro-industry'"),
              "core/static/site/mojplaywin.css": ("--bg:#050505", "--mpw-gold:#d4af37", "border:3px solid var(--mpw-gold)"),
          }
          for name, markers in checks.items():
              text = Path(name).read_text(encoding="utf-8")
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f"{name}: missing {missing}")
          print("MOJPLAYWIN_LEGACY_CONTENT_CHECK=passed")
          PY
      - name: Verify current MojPlayWin pages before update
        shell: bash
        run: |
          set -euo pipefail
          for url in https://mojplaywin.com/ https://mojplaywin.com/agro-industry/ https://mojplaywin.com/store/; do
            status="$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 25 -o /dev/null -w '%{http_code}' "$url")"
            test "$status" = "200"
            echo "MOJPLAYWIN_PRECHECK $url status=$status"
          done
      - name: Configure the confirmed pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-legacy-content-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "MOJPLAYWIN_CPanel_PINNED_RELAY_READY"
      - name: Prepare the exact MojPlayWin content payload
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-legacy-content-ssh"
          stage="/home/zomorod2/.mojplaywin-content-$GITHUB_RUN_ID"
          tar -czf "$RUNNER_TEMP/mojplaywin-content.tar.gz" \
            core/templates/brands/mojplaywin/base.html \
            core/templates/brands/mojplaywin/home.html \
            core/templates/brands/mojplaywin/page.html \
            core/static/site/mojplaywin.css
          mkdir -p "$RUNNER_TEMP/mpw-payload/scripts"
          cp scripts/deploy_mojplaywin_legacy_content.py "$RUNNER_TEMP/mpw-payload/deploy.py"
          cp "$RUNNER_TEMP/mojplaywin-content.tar.gz" "$RUNNER_TEMP/mpw-payload/content.tar.gz"
          tar -czf "$RUNNER_TEMP/mojplaywin-stage.tar.gz" -C "$RUNNER_TEMP/mpw-payload" deploy.py content.tar.gz
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat "$RUNNER_TEMP/mojplaywin-stage.tar.gz" | ssh -F "$d/config" saeit-cpanel "cat > '$stage/stage.tar.gz'"
          ssh -F "$d/config" saeit-cpanel "tar -xzf '$stage/stage.tar.gz' -C '$stage' && rm '$stage/stage.tar.gz' && mv '$stage/deploy.py' '$stage/deploy_mojplaywin_legacy_content.py'"
      - name: Deploy with backup and atomic file replacement
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-legacy-content-ssh"
          stage="/home/zomorod2/.mojplaywin-content-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/deploy_mojplaywin_legacy_content.py' deploy '$GITHUB_RUN_ID' '$stage'"
      - name: Verify updated MojPlayWin content
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen
          checks = {
              "https://mojplaywin.com/": ("80% digital momentum", "20% real-world ventures", 'id="mpw-insight-title"', 'id="insight-games"'),
              "https://mojplaywin.com/ai/": ('id="guide-ai"', "A reliable AI assistant needs evaluation"),
              "https://mojplaywin.com/agro-industry/": ("Seven practical fields", "Currency and digital-asset literacy", 'id="guide-agro-industry"'),
              "https://mojplaywin.com/store/": ("No public products yet",),
          }
          run_id = os.environ.get("GITHUB_RUN_ID", "manual")
          for url, markers in checks.items():
              passed = False
              for attempt in range(1, 13):
                  check_url = url + f"?__mpw_release={run_id}-{attempt}"
                  request = Request(check_url, headers={"Cache-Control":"no-cache, no-store", "Pragma":"no-cache"})
                  try:
                      with urlopen(request, timeout=20) as response:
                          body = response.read().decode("utf-8", "replace")
                          status = response.status
                      missing = [marker for marker in markers if marker not in body]
                      passed = status == 200 and not missing
                      print(f"MOJPLAYWIN_POSTCHECK {url} attempt={attempt} status={status} missing={missing}", flush=True)
                  except Exception as exc:
                      print(f"MOJPLAYWIN_POSTCHECK {url} attempt={attempt} error={type(exc).__name__}", flush=True)
                  if passed:
                      break
                  if attempt < 12:
                      time.sleep(3)
              if not passed:
                  raise SystemExit(f"Current content never appeared after restart: {url}")
          print("MOJPLAYWIN_UPDATED_CONTENT_PUBLICLY_VERIFIED")
          PY
      - name: Roll back if the public smoke check failed
        if: failure() && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-legacy-content-ssh"
          stage="/home/zomorod2/.mojplaywin-content-$GITHUB_RUN_ID"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/deploy_mojplaywin_legacy_content.py' rollback '$GITHUB_RUN_ID'"
      - name: Remove temporary transfer files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-legacy-content-ssh"
          if test -f "$d/config"; then
            stage="/home/zomorod2/.mojplaywin-content-$GITHUB_RUN_ID"
            ssh -F "$d/config" saeit-cpanel "rm -rf -- '$stage'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/mojplaywin-legacy-content-ssh" "$RUNNER_TEMP/mpw-payload" "$RUNNER_TEMP/mojplaywin-content.tar.gz" "$RUNNER_TEMP/mojplaywin-stage.tar.gz"
