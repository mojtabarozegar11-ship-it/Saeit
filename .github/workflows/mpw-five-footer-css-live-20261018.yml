name: MojPlayWin 5 dynamic footer exact static stylesheet release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-five-footer-css-live-20261018.yml"
      - "scripts/mpw_five_footer_css_atomic_20261018.py"
permissions:
  contents: read
concurrency:
  group: mojplaywin-mainonly-footer-atomic
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-mpw-css-footer-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Selftest CSS and record protected endpoints baseline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_five_footer_css_atomic_20261018.py
          python3 scripts/mpw_five_footer_css_atomic_20261018.py selftest
          python3 - <<'PY'
          import urllib.request,json,os,re
          paths=['/','/about/','/research/','/store/','/games/','/ai/','/contact/','/support/','/farnaz/','/saman/','/picm/']
          baseline={}
          for path in paths:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'User-Agent':'MPWScopedCSSPreflight','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=22) as resp:
                  text=resp.read(1800000).decode('utf8','replace')
                  baseline[path]=resp.status
                  if resp.status!=200:raise SystemExit('HEALTH_CHECK_FAILED '+path)
                  if path in ('/games/','/ai/','/contact/','/support/') and 'mojplaywin.0044ba34e437.css' not in text:
                      raise SystemExit('DIFFERENT_4PAGE_STYLESHEET '+path)
                  if path=='/store/' and 'site-standard-v2.69714b9b949e.css' not in text:
                      raise SystemExit('DIFFERENT_STORE_STYLESHEET')
                  if path in ('/farnaz/','/saman/','/picm/') and ('mojplaywin.0044ba34e437.css' in text or 'mojplaywin-store' in text):
                      raise SystemExit('PROTECTED_STYLESHEET_CONFLICT '+path)
                  print('BASELINE '+path+' '+str(resp.status),flush=True)
          with open(os.environ['RUNNER_TEMP']+'/mpw-css-footer-baseline.json','w') as f:json.dump(baseline,f)
          PY
      - name: Set up pinned VPS and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-footer-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify both exact existing CSS and compressed SHA fingerprints
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-footer-inventory/config" saeit-cpanel python3 - audit < scripts/mpw_five_footer_css_atomic_20261018.py
      - name: Atomically append scoped CSS rules and rebuild .gz only
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/mpw-footer-inventory/config" saeit-cpanel python3 - install "$GITHUB_RUN_ID" < scripts/mpw_five_footer_css_atomic_20261018.py
      - name: Validate live CSS bytes and all 11 main/protected routes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,os,re
          from pathlib import Path
          before=json.loads(Path(os.environ['RUNNER_TEMP']+'/mpw-css-footer-baseline.json').read_text())
          pairs=[
           ('/static/site/mojplaywin.0044ba34e437.css?v=20261016','body > header.mpw-header ~ footer.mpw-footer::after'),
           ('/static/site/site-standard-v2.69714b9b949e.css','body.mojplaywin-store footer.mw-site-footer::after')]
          for path,selector in pairs:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPWFooterCSSVerify/1.0','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  raw=resp.read(300000).decode('utf8','replace')
                  if resp.status!=200 or 'MPW_FOOTER_FIVE_PAGES_20261018' not in raw or selector not in raw or 'Mojtaba Roozegar' not in raw:
                      raise SystemExit('FOOTER_CSS_NOT_SERVING '+path)
              print('CSS_SERVING '+path,flush=True)
          for path in before:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  if resp.status!=before[path]:raise SystemExit('PUBLIC_PATH_UNHEALTHY '+path)
              print('PAGE_OK '+path,flush=True)
          print('FOOTER_CSS_DYNAMIC_MAIN_5=VERIFIED',flush=True)
          PY
      - name: Rollback four CSS files if verification fails
        if: failure()
        run: |
          d="$RUNNER_TEMP/mpw-footer-inventory/config"
          if test -s "$d" && test -f "$RUNNER_TEMP/mpw-css-footer-baseline.json"; then
            timeout 60s ssh -T -F "$d" saeit-cpanel python3 - rollback "$GITHUB_RUN_ID" < scripts/mpw_five_footer_css_atomic_20261018.py || true
          fi
      - name: Clear relay credentials, keep private CSS rollback originals
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-footer-inventory"
