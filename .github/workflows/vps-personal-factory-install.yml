name: Saeit Personal V17 Private Factory Delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-personal-factory-install.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-store-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-store-preflight"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            key="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$key"
            chmod 600 "$key"
            ssh-keygen -y -P '' -f "$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Inspect factory product handoff source
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          echo VPS_USER="$(id -un)"
          test -s "$base/private/autonomous-product-cycle/production-state.json"
          test -s "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          echo VPS_MANUFACTURED_ZIP_PRESENT
          stat -c 'VPS_ZIP_BYTES=%s PERMISSIONS=%a' "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          python3 - "$base/private/autonomous-product-cycle/production-state.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          for k in ('mode','depends_on_orders','built_product_count','artifact_qa_passed','publishable_product_count','store_distribution_state'):
            print('VPS_FACTORY_'+k.upper()+'='+str(j.get(k)))
          PY
          REMOTE
      - name: Inspect cPanel private staging and storefront runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo CPANEL_USER="$(id -un)"
          echo CPANEL_HOME="$HOME"
          for path in /home/zomorod2/Saeit-staging /home/zomorod2/zomorodmelal.ir /home/zomorod2/mojplaywin.com /home/zomorod2/mojtabarozegar.ir /home/zomorod2/public_html; do
            if test -d "$path" && test ! -L "$path"; then
              echo CPANEL_DIR_PRESENT="$(basename "$path")"
              if test -f "$path/manage.py"; then echo CPANEL_DJANGO_SOURCE="$(basename "$path")"; fi
              if test -f "$path/passenger_wsgi.py"; then echo CPANEL_PASSENGER_SOURCE="$(basename "$path")"; fi
              if test -d "$path/.venv"; then echo CPANEL_LOCAL_VENV="$(basename "$path")"; fi
            else
              echo CPANEL_DIR_MISSING="$(basename "$path")"
            fi
          done
          test -d /home/zomorod2/Saeit-staging
          test -w /home/zomorod2/Saeit-staging
          echo CPANEL_STAGING_WRITABLE
          if test -f /home/zomorod2/Saeit-staging/core/models.py; then
            grep -q '^class Product(' /home/zomorod2/Saeit-staging/core/models.py && echo CPANEL_DJANGO_PRODUCT_MODEL_PRESENT
          fi
          command -v python3 >/dev/null && python3 --version
          df -h "$HOME" | tail -n 1 | awk '{print "CPANEL_DISK_FREE=" $4}'
          REMOTE
      - uses: actions/checkout@v4
      - name: Test isolated personal product receiver and strict path controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_personal_factory_adapter.py -v
          python3 -m py_compile scripts/personal_factory_adapter.py
      - name: Install and verify personal V17 private product receipt adapter
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-store-preflight"
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/.saeit-factory-inbox"
          app="$HOME/mojtaba_personal/mojtaba_roozegar_personal_v17"
          public="$HOME/mojplaywin.com/mojtaba.roozegar"
          test "$(id -un)" = zomorod2
          test -f "$root/bin/store_receiver.py"
          test -f "$app/manage.py"
          test -f "$app/passenger_wsgi.py"
          test -f "$public/.htaccess"
          test ! -L "$root/bin"
          echo PERSONAL_BRIDGE_PREFLIGHT_OK
          REMOTE
          scp -F "$d/config" scripts/personal_factory_adapter.py saeit-cpanel:/home/zomorod2/.saeit-factory-inbox/bin/personal_factory_adapter.py.tmp
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/.saeit-factory-inbox"
          script="$root/bin/personal_factory_adapter.py"
          temp="$script.tmp"
          app="$HOME/mojtaba_personal/mojtaba_roozegar_personal_v17"
          public="$HOME/mojplaywin.com/mojtaba.roozegar"
          inbox="$app/var/factory_imports"
          test -s "$temp"
          python3 -m py_compile "$temp"
          chmod 600 "$temp"
          mv -f "$temp" "$script"
          python3 "$script" --source "$root" --app "$app" --public-base "$public" --out "$inbox" --max-products 20
          test -s "$inbox/private_catalog.json"
          python3 - "$inbox/private_catalog.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["public_products"]==0
          assert m["target"]=="mojtaba_roozegar_personal_v17"
          assert all(x["publication_authorized"] is False for x in m["items"])
          assert len(m["items"])>=1
          print("PERSONAL_V17_PRIVATE_IMPORT_COUNT="+str(len(m["items"])))
          PY
          command -v crontab >/dev/null
          command -v flock >/dev/null
          mkdir -p "$root/bin/backups"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          previous="$root/bin/backups/cron-before-personal-factory-$stamp.txt"
          crontab -l > "$previous" 2>/dev/null || : > "$previous"
          chmod 600 "$previous"
          grep -v 'SAEIT_PERSONAL_FACTORY_PRIVATE_INBOX' "$previous" > "$root/bin/personal-cron.tmp" || true
          printf '%s\n' "57 * * * * /usr/bin/flock -n $root/bin/personal-factory.lock /usr/bin/python3 $script --source $root --app $app --public-base $public --out $inbox --max-products 20 >> $root/bin/personal-factory-sync.log 2>&1 # SAEIT_PERSONAL_FACTORY_PRIVATE_INBOX" >> "$root/bin/personal-cron.tmp"
          chmod 600 "$root/bin/personal-cron.tmp"
          crontab "$root/bin/personal-cron.tmp"
          rm -f "$root/bin/personal-cron.tmp"
          test "$(crontab -l | grep -c 'SAEIT_PERSONAL_FACTORY_PRIVATE_INBOX')" = 1
          echo PERSONAL_V17_PRIVATE_SYNC_HOURLY_VERIFIED
          echo PERSONAL_V17_DJANGO_APP_UNMODIFIED
          echo PERSONAL_V17_PUBLIC_STORE_NOT_ENABLED
          REMOTE
      - name: Read-only verify existing public site responses
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in https://mojplaywin.com/mojtaba.roozegar/ https://mojplaywin.com/mojtaba.roozegar/manage/login/; do
            response="$(curl -sS -L --max-time 16 -o /dev/null -w '%{http_code}' "$endpoint" 2>/dev/null || true)"
            echo "PERSONAL_PUBLIC_SITE_STATUS=$response"
            test "$response" = 200
          done
      - name: Clean temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/factory-store-preflight"
