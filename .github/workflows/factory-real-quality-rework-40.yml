name: Real factory quality triage for active line 41 product
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_global_quality_triage_v2.py"
      - "scripts/factory_quality_signed_approval_v1.py"
      - "tests/test_factory_quality_signed_approval_v1.py"
      - "scripts/factory_quality_production_workorders_v1.py"
      - "scripts/factory_qa_native_rebuild_bridge_20261021.py"
      - "scripts/factory_autonomous_jump_repair_v1.py"
      - "scripts/factory_recover_missing_original_recipes_20261021.py"
      - "tests/test_factory_recover_missing_original_recipes_20261021.py"
      - "tests/test_factory_qa_native_rebuild_bridge_20261021.py"
      - "tests/test_factory_autonomous_jump_repair_v1.py"
      - "tests/test_factory_quality_production_workorders_v1.py"
      - "scripts/factory_commercial_quality_release_guard_v1.py"
      - "tests/test_factory_commercial_quality_release_guard_v1.py"
      - "scripts/factory_product_maker.py"
      - "scripts/publish_factory_free_tool.py"
      - "scripts/publish_verified_factory_store_listing.py"
      - "scripts/factory_quality_1000_v2.py"
      - "factory_config/quality_100_criteria.json"
      - "factory_config/active_quality_1000_policy.json"
      - "factory_config/forty_families.json"
      - "tests/test_factory_quality_100_criteria.py"
      - "tests/test_factory_global_quality_triage_v2.py"
      - ".github/workflows/factory-real-quality-rework-40.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/factory_autonomous_jump_repair_v1.py"
      - "tests/test_factory_autonomous_jump_repair_v1.py"
      - "scripts/factory_quality_production_workorders_v1.py"
      - "tests/test_factory_quality_production_workorders_v1.py"
      - ".github/workflows/factory-real-quality-rework-40.yml"
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"
permissions: {contents: read}
concurrency:
  group: saeit-factory-real-quality-rework-40
  cancel-in-progress: false
jobs:
  verify-autonomous-repair-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prove authentic repairs and no false QA approvals
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/factory_autonomous_jump_repair_v1.py
          python3 -B -m unittest discover -s tests -p test_factory_autonomous_jump_repair_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_quality_production_workorders_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_qa_native_rebuild_bridge_20261021.py -v
  review-active-line-product:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test 40 policies and seven concrete pass/rework/quarantine behaviors
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_global_quality_triage_v2.py -v
          python3 -B -m unittest discover -s tests -p test_factory_quality_100_criteria.py -v
          python3 -B -m unittest discover -s tests -p test_factory_quality_signed_approval_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_commercial_quality_release_guard_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_quality_production_workorders_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_qa_native_rebuild_bridge_20261021.py -v
          python3 -B -m unittest discover -s tests -p test_factory_autonomous_jump_repair_v1.py -v
          python3 -B -m unittest discover -s tests -p test_factory_recover_missing_original_recipes_20261021.py -v
          python3 -B -m unittest discover -s tests -p test_factory_global_premium_quality_gate.py -v
          python3 -m py_compile scripts/factory_global_quality_triage_v2.py
          echo REAL_FACTORY_QUALITY_REWORK_REGRESSION=PASS
      - name: Pinned SSH private warehouse -> run quality triage -> immutable rework receipts
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/rework-ssh"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          factory_root="/home/githubops/factory-runtime/private/autonomous-product-cycle"
          slots="$factory_root/quality-excellence/product-flow/active-slots/current.json"
          timeout 30s ssh -T "${opts[@]}" githubops@178.239.147.150 python3 -B - "$slots" <<'PY'
          import json,re,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if path.is_symlink() or any(parent.is_symlink() for parent in path.parents):
              raise SystemExit("ACTIVE_PRODUCT_SLOT_PATH_UNSAFE")
          state=json.loads(path.read_text(encoding="utf8"))
          active=state.get("active") if isinstance(state,dict) else None
          if (state.get("schema")!="saeit.factory.product-slots.v1"
              or state.get("line_id")!=41 or state.get("capacity")!=1
              or not isinstance(active,list) or len(active)!=1
              or not isinstance(active[0],dict)
              or not isinstance(active[0].get("recipe"),str)
              or not re.fullmatch(r"[a-z][a-z0-9_]{1,65}",active[0]["recipe"])):
              raise SystemExit("ACTIVE_LINE_41_MUST_HAVE_EXACTLY_ONE_REAL_PRODUCT")
          print("FACTORY_ACTIVE_LINE_41_SINGLE_PRODUCT_SLOT=PASS")
          PY
          stage="/home/githubops/factory-runtime/operations/.premium-rework-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -T "${opts[@]}" githubops@178.239.147.150 "set -eu; test \"\$(id -un)\" = githubops; umask 077; test ! -e '$stage'; mkdir -m 700 '$stage'"
          scp -q "${opts[@]}" scripts/factory_global_quality_triage_v2.py githubops@178.239.147.150:"$stage/rework.py"
          scp -q "${opts[@]}" scripts/factory_quality_1000_v2.py githubops@178.239.147.150:"$stage/score1000.py"
          scp -q "${opts[@]}" scripts/factory_quality_production_workorders_v1.py githubops@178.239.147.150:"$stage/workorders.py"
          scp -q "${opts[@]}" scripts/factory_qa_native_rebuild_bridge_20261021.py githubops@178.239.147.150:"$stage/native-rebuild.py"
          scp -q "${opts[@]}" scripts/factory_autonomous_jump_repair_v1.py githubops@178.239.147.150:"$stage/jump-repair.py"
          scp -q "${opts[@]}" scripts/factory_recover_missing_original_recipes_20261021.py githubops@178.239.147.150:"$stage/source-recovery.py"
          scp -q "${opts[@]}" scripts/factory_product_maker.py githubops@178.239.147.150:"$stage/factory_product_maker.py"
          scp -q "${opts[@]}" scripts/factory_personal_owner_passport_policy_20261020.py githubops@178.239.147.150:"$stage/factory_personal_owner_passport_policy_20261020.py"
          scp -q "${opts[@]}" factory_config/quality_100_criteria.json githubops@178.239.147.150:"$stage/quality_100_criteria.json"
          scp -q "${opts[@]}" scripts/factory_global_premium_quality_gate.py githubops@178.239.147.150:"$stage/quality.py"
          scp -q "${opts[@]}" factory_config/forty_families.json githubops@178.239.147.150:"$stage/families.json"
          echo FACTORY_POLICY_SHA256="$(sha256sum scripts/factory_global_premium_quality_gate.py | awk '{print $1}')"
          timeout 125s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B "$stage/rework.py" \
            --private-root /home/githubops/factory-runtime/private/autonomous-product-cycle \
            --policy "$stage/quality.py" --registry "$stage/families.json" \
            --scorecard "$stage/score1000.py" \
            --products-file "$slots" \
            --run-reference "$GITHUB_RUN_ID"
          echo FACTORY_GLOBAL_QUALITY_TRIAGE_PRIVATE_VPS=COMPLETED
          timeout 100s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B "$stage/workorders.py" \
            --private-root /home/githubops/factory-runtime/private/autonomous-product-cycle \
            --quality-module "$stage/score1000.py" \
            --catalog "$stage/quality_100_criteria.json" \
            --products-file "$slots" \
            --run-id "$GITHUB_RUN_ID"
          echo FACTORY_PRODUCT_PROFESSIONAL_REWORK_QUEUE=OPERATIONAL
          # Recover original bytes only when source, ZIP and QA hashes agree.
          timeout 130s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B "$stage/source-recovery.py" \
            --private-root /home/githubops/factory-runtime/private/autonomous-product-cycle \
            --other-source-root /home/githubops/factory-runtime/private/autonomous-product-cycle/generated-product-recipes \
            --other-source-root /home/githubops/factory-runtime/operations/autonomous-product-runtime/product_recipes \
            --products-file "$slots" \
            --limit 3
          echo FACTORY_ORIGINAL_SOURCE_RECOVERY_HASH_BOUND=COMPLETED
          # Only source-backed, genuinely executed offline technical QA rebuilds;
          # original factory stock and public release state remain unchanged.
          # One bounded, provenance-checked sweep for the active line 41 product only.
          for pair in "scripts/factory_autonomous_jump_repair_v1.py:jump-repair.py" "scripts/factory_qa_native_rebuild_bridge_20261021.py:native-rebuild.py" "factory_config/forty_families.json:families.json"; do
            local_file="${pair%%:*}"
            remote_file="${pair#*:}"
            test "$(sha256sum "$local_file" | cut -d' ' -f1)" = "$(timeout 35s ssh -T "${opts[@]}" githubops@178.239.147.150 "sha256sum '$stage/$remote_file' | cut -d' ' -f1")"
          done
          echo FACTORY_JUMP_REPAIR_SOURCE_PINNING=PASS
          timeout 900s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B "$stage/jump-repair.py" \
            --private-root /home/githubops/factory-runtime/private/autonomous-product-cycle \
            --families "$stage/families.json" \
            --source-root /home/githubops/factory-runtime/private/autonomous-product-cycle/generated-product-recipes \
            --maker "$stage/factory_product_maker.py" --bridge "$stage/native-rebuild.py" \
            --additional-source-root /home/githubops/factory-runtime/operations/autonomous-product-runtime/product_recipes \
            --additional-source-root /home/githubops/factory-runtime/private/autonomous-product-cycle/recovered-original-product-recipes \
            --products-file "$slots" \
            --rounds 1 --limit 1
          echo FACTORY_NATIVE_TECHNICAL_REBUILD_CANDIDATES_INSPECTED=YES
          # Return every changed factory artifact to quality control in this same run.
          timeout 125s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B "$stage/rework.py" \
            --private-root /home/githubops/factory-runtime/private/autonomous-product-cycle \
            --policy "$stage/quality.py" --registry "$stage/families.json" \
            --scorecard "$stage/score1000.py" \
            --products-file "$slots" \
            --run-reference "$GITHUB_RUN_ID-post-rework"
          echo FACTORY_POST_REWORK_QUALITY_REINSPECTION=COMPLETED
          timeout 100s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B "$stage/workorders.py" \
            --private-root /home/githubops/factory-runtime/private/autonomous-product-cycle \
            --quality-module "$stage/score1000.py" \
            --catalog "$stage/quality_100_criteria.json" \
            --products-file "$slots" \
            --run-id "$GITHUB_RUN_ID-post-rework"
          echo FACTORY_POST_REWORK_WORKORDER_REFRESH=COMPLETED
          echo FACTORY_QUALITY_RELEASE_THRESHOLD=1000/1000
          echo FACTORY_PUBLIC_PRODUCT_UPLOAD=NONE
          echo FACTORY_PAYMENT_CHANGE=NONE
          ssh -T "${opts[@]}" githubops@178.239.147.150 "set -eu; rm -f -- '$stage/rework.py' '$stage/quality.py' '$stage/families.json' '$stage/score1000.py' '$stage/quality_100_criteria.json' '$stage/workorders.py' '$stage/native-rebuild.py' '$stage/jump-repair.py' '$stage/source-recovery.py' '$stage/factory_product_maker.py' '$stage/factory_personal_owner_passport_policy_20261020.py'; rmdir -- '$stage'"
