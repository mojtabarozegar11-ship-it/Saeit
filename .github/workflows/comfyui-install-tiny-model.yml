name: ComfyUI Install Verified Tiny CPU Model
on:
  push:
    branches: [feature/comfyui-final-audit-20261015]
    paths: [.github/workflows/comfyui-install-tiny-model.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comfyui-cpu-model-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Install hash-verified lightweight model on VPS (factory-preserving)
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          bash -n ops/comfyui-vps/install_tiny_model.sh
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/comfy-model"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 1010s ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            githubops@178.239.147.150 bash -s < ops/comfyui-vps/install_tiny_model.sh
