name: Moj messaging - private pairing state probe
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths:
      - '.github/workflows/moj-messaging-pairing-state-probe-20261028.yml'
permissions:
  contents: read
jobs:
  private-pairing-state:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read only sanitized status and node process presence
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$(mktemp -d "$RUNNER_TEMP/mmsg-pairing-check.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          timeout 45s ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10 githubops@178.239.147.150 'python3 -' <<'PY'
          import json, os, pathlib, time
          root=pathlib.Path('/home/githubops/private-messaging-bridge/state')
          p=root/'whatsapp-primary-status.json'
          safe={'NOT_STARTED','CONNECTING','CONNECTED','AUTHORIZED','LOGIN_REQUIRED','DISCONNECTED','DEGRADED','SESSION_CONFLICT','CREDENTIAL_SAVE_FAILED','PAIRING_RESTART','PAIRING_RETRIES_EXCEEDED','PAIRING_CODE_FAILED'}
          if not p.is_file() or p.is_symlink():
              print('MMSG_WHATSAPP_PRIMARY_STATE=NOT_STARTED')
          else:
              try:
                  d=json.loads(p.read_text())
                  v=d.get('status','UNKNOWN')
                  if v not in safe: v='UNKNOWN'
                  age=time.time()-float(d.get('timestamp',0))
                  freshness='FRESH' if 0<=age<=120 else 'STALE'
                  print('MMSG_WHATSAPP_PRIMARY_STATE='+v)
                  print('MMSG_WHATSAPP_PRIMARY_STATUS_FRESHNESS='+freshness)
              except Exception:
                  print('MMSG_WHATSAPP_PRIMARY_STATE=UNKNOWN')
          # Check exact matching process cmdline without printing arguments or phone numbers.
          matches=0
          for entry in pathlib.Path('/proc').iterdir():
              if not entry.name.isdigit(): continue
              try:
                  raw=(entry/'cmdline').read_bytes()
                  args=raw.split(b'\0')
                  if b'/app/whatsapp.mjs' in raw and b'login' in args and b'--pairing-code' in args:
                      matches+=1
              except (OSError,PermissionError):
                  pass
          print('MMSG_WHATSAPP_PAIRING_PROCESS='+('RUNNING' if matches else 'NOT_RUNNING'))
          print('MMSG_PAIRING_SECRETS_EXPOSED=NO')
          PY
