name: Real isolated browser QA of existing MojPlayWin SKU 879
# Hash-bound private website-kit QA; no public content artifact or commercial release.
on:
  pull_request:
    paths:
      - scripts/mpw_sku879_private_browser_qa_20261026.py
      - tests/test_mpw_sku879_private_browser_qa_20261026.py
      - .github/workflows/mpw-sku879-private-browser-qa-20261026.yml
  push:
    branches: [main]
    paths:
      - scripts/mpw_sku879_private_browser_qa_20261026.py
      - tests/test_mpw_sku879_private_browser_qa_20261026.py
      - .github/workflows/mpw-sku879-private-browser-qa-20261026.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-sku879-private-browser-qa
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify real Chromium/ChromeDriver and private browser QA safety gates
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          command -v chromedriver
          python3 -B -m py_compile scripts/mpw_sku879_private_browser_qa_20261026.py
          python3 -B -m unittest discover -s tests -p test_mpw_sku879_private_browser_qa_20261026.py -v
  private-browser:
    needs: tests
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned no-agent-forwarding GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          install -d -m 700 "$d"
          for variable in VPS_KEY HOST_KEY; do
            file="$d/$variable.key"
            printf '%s' "${!variable}" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$file"
            chmod 600 "$file"
            ssh-keygen -y -P '' -f "$file" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Read only exact-SHA private website kit into transient locked-down runner directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          src='/home/githubops/factory-runtime/private/autonomous-product-cycle/design-intake/mpw-live-three-sku-qa/copies/879/20894f2de0228318c0e96ba407c2bd4aa98b62ba2f3f2f2fbca53987c9276783.bin'
          timeout 90s ssh -T -F "$d/config" saeit-vps "test -f '$src' && cat '$src'" > "$d/sku879-private.zip"
          test "$(sha256sum "$d/sku879-private.zip" | awk '{print $1}')" = '20894f2de0228318c0e96ba407c2bd4aa98b62ba2f3f2f2fbca53987c9276783'
          chmod 600 "$d/sku879-private.zip"
          echo 'MPW_SKU879_PRIVATE_ARCHIVE_HASH_VERIFIED=true'
      - name: Execute two real browser viewports and save immutable private factory QA receipt
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          expected='20894f2de0228318c0e96ba407c2bd4aa98b62ba2f3f2f2fbca53987c9276783'
          qa_status=0
          python3 -B scripts/mpw_sku879_private_browser_qa_20261026.py audit "$d/sku879-private.zip" "$expected" "$d/browser-receipt.json" || qa_status=$?
          test -s "$d/browser-receipt.json"
          source_b64="$(base64 -w0 scripts/mpw_sku879_private_browser_qa_20261026.py)"
          test -n "$source_b64"
          timeout 90s ssh -T -F "$d/config" saeit-vps "python3 -c 'import base64;exec(base64.b64decode(\"$source_b64\"))' ingest" < "$d/browser-receipt.json"
          test "$qa_status" -eq 0
      - name: Remove only this run's transient SSH identity
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/mpw-live-three-private-qa"; then
            rm -rf -- "$RUNNER_TEMP/mpw-live-three-private-qa"
          fi
