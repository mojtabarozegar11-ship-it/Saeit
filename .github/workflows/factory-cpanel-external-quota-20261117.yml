name: Factory cPanel database UAPI accounting — owner or one-time reviewed push
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: factory-cpanel-external-quota-20261117
  cancel-in-progress: false
jobs:
  external-quota:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1600 &&
      !github.event.issue.pull_request &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'MOJ-FACTORY-CPANEL-EXTERNAL-QUOTA-20261117'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare pinned VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-external-quota"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 127.0.0.1 > "$d/vps.known" 2>/dev/null
          test -s "$d/vps.known"
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 127.0.0.1
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo CPANEL_PINNED_RELAY=verified
      - name: Read cPanel outside-home database/mail accounting (no file reads)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/cpanel-external-quota"
          timeout 450s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && exec python3 -B -' < scripts/factory_cpanel_external_quota_readonly_20261117.py \
            | tee "$RUNNER_TEMP/factory-cpanel-external-quota-$GITHUB_RUN_ID.log"
          grep -q '^MOJ_CPANEL_EXTERNAL_QUOTA=' "$RUNNER_TEMP/factory-cpanel-external-quota-$GITHUB_RUN_ID.log"
          echo CPANEL_EXTERNAL_QUOTA_PASS=true
      - name: Keep only tiny sanitized numeric evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factory-cpanel-external-quota-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-cpanel-external-quota-${{ github.run_id }}.log
          retention-days: 2
          if-no-files-found: error
      - name: Remove runner temporary keys and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/cpanel-external-quota"
          rm -f -- "$RUNNER_TEMP/factory-cpanel-external-quota-$GITHUB_RUN_ID.log"
