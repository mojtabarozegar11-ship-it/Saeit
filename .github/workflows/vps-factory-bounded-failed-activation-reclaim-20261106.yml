name: VPS deep disk and factory residue inventory (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-factory-bounded-failed-activation-reclaim-20261106.yml
permissions:
  contents: read
concurrency:
  group: saeit-vps-factory-bounded-space-reclaim
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inventory old reclaim candidates without deletion or cron changes
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/factory-reclaim-readonly"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=12 githubops@178.239.147.150 'python3 -B -' <<'PY'
          import os, re, stat, subprocess, time
          from pathlib import Path

          root = Path("/home/githubops/factory-runtime")
          backups = root / "operations" / "backups"
          if root.is_symlink() or not root.is_dir() or backups.is_symlink() or not backups.is_dir():
              raise SystemExit("FACTORY_INVENTORY_UNSAFE_OR_MISSING_ROOT")
          if root.stat().st_uid != os.geteuid() or backups.stat().st_uid != os.geteuid():
              raise SystemExit("FACTORY_INVENTORY_OWNERSHIP_MISMATCH")
          fs = os.statvfs(root)
          before = fs.f_bavail * fs.f_frsize
          pattern = re.compile(r"master-before-[0-9]{8}T[0-9]{6}Z\.sqlite3\Z")
          count = total = recent = 0
          now = time.time()
          for path in backups.iterdir():
              item = path.lstat()
              if not stat.S_ISREG(item.st_mode) or item.st_uid != os.geteuid():
                  continue
              if not pattern.fullmatch(path.name):
                  continue
              count += 1
              total += item.st_size
              if now - item.st_mtime <= 3600:
                  recent += 1
          cron = subprocess.run(["crontab", "-l"], capture_output=True, text=True, timeout=8)
          if cron.returncode not in (0, 1):
              raise SystemExit("FACTORY_CRON_READ_FAILED")
          tagged = sum("SAEIT_MASTER_AGENT_V1" in line for line in cron.stdout.splitlines())
          after_fs = os.statvfs(root)
          after = after_fs.f_bavail * after_fs.f_frsize
          print("FACTORY_LEGACY_RECLAIM_MODE=READ_ONLY", flush=True)
          print("FACTORY_BACKUP_SNAPSHOT_COUNT=" + str(count), flush=True)
          print("FACTORY_BACKUP_SNAPSHOT_BYTES=" + str(total), flush=True)
          print("FACTORY_BACKUP_RECENT_COUNT=" + str(recent), flush=True)
          print("FACTORY_CRON_MASTER_TAGGED_COUNT=" + str(tagged), flush=True)
          print("FACTORY_DISK_FREE_BEFORE_BYTES=" + str(before), flush=True)
          print("FACTORY_DISK_FREE_AFTER_BYTES=" + str(after), flush=True)
          print("FACTORY_DELETION_ATTEMPTED=false", flush=True)
          print("FACTORY_CRONTAB_MODIFIED=false", flush=True)
          print("FACTORY_BACKUP_RESTORE_EVIDENCE_VERIFIED=false", flush=True)

          # Inventory major reachable directories. Every command is read-only,
          # bounded by a timeout, and may report partial permission-limited data.
          import hashlib, json
          allowed_names = {"factory-runtime", "operations", "backups", "django-app",
                           ".cache", ".local", ".npm", ".venv", "python311",
                           "private", "master-agent", "downloads", "tmp",
                           "log", "lib", "cache", "opt", "usr", "home"}
          checks = [
              ("githubops-home", "/home/githubops", 115),
              ("system-var", "/var", 60),
              ("system-opt", "/opt", 35),
              ("system-tmp", "/tmp", 30),
              ("usr-local", "/usr/local", 45),
          ]
          inventory = []
          for label, location, budget in checks:
              target = Path(location)
              if target.is_symlink() or not target.is_dir():
                  inventory.append({"scope": label, "state": "skipped_unsafe_or_missing"})
                  continue
              try:
                  proc = subprocess.run(["du", "-x", "-B1", "-d2", str(target)],
                                        capture_output=True, text=True, timeout=budget)
              except subprocess.TimeoutExpired:
                  inventory.append({"scope": label, "state": "timed_out", "budget_sec": budget})
                  continue
              rows = []
              for line in proc.stdout.splitlines():
                  parts = line.split("\t", 1)
                  if len(parts) != 2 or not parts[0].isdigit():
                      continue
                  relative = os.path.relpath(parts[1], str(target))
                  names = relative.split(os.sep)
                  labels = []
                  for name in names:
                      if name in (".", ""):
                          continue
                      if name in allowed_names:
                          labels.append(name)
                      else:
                          labels.append("sha256_" + hashlib.sha256(name.encode()).hexdigest()[:10])
                  rows.append({"area": "/".join(labels) if labels else ".", "bytes": int(parts[0])})
              rows.sort(key=lambda item: -item["bytes"])
              inventory.append({"scope": label, "state": "complete" if proc.returncode == 0 else "partial",
                                "rows": rows[:24], "reported_dirs": len(rows)})
          disk = os.statvfs(root)
          print("VPS_DEEP_STORAGE_MAP=" + json.dumps({
              "schema": "vps.deep.storage.readonly.v1", "observed_utc_epoch": int(time.time()),
              "root_free_bytes": disk.f_bavail * disk.f_frsize,
              "root_total_bytes": disk.f_blocks * disk.f_frsize,
              "map": inventory, "deletion_performed": False,
              "cron_modified": False}, sort_keys=True), flush=True)

          # Second-stage metadata-only probe of large unknown home directories.
          # No names, file contents or user data are emitted.
          targets = {"9824c5f31b", "c3ecb80208", "98da9d80b7",
                     "9e7b2a0270", "78d56a99bd", "03c268f48a",
                     "a252595d47", "69be648c02"}
          def hash_name(name):
              return hashlib.sha256(name.encode()).hexdigest()[:10]
          def suffix_label(name):
              tail = name.rsplit(".", 1)
              if len(tail) == 2 and 1 <= len(tail[1]) <= 8 and tail[1].isalnum():
                  return "." + tail[1].lower()
              return "(none)"
          def header_kind(path):
              try:
                  with path.open("rb") as stream:
                      first = stream.read(512)
                  if first.startswith(b"SQLite format 3"):
                      return "sqlite3"
                  if first.startswith(b"PK" + bytes([3, 4])):
                      return "zip"
                  if first.startswith(bytes([31, 139])):
                      return "gzip"
                  if first.startswith(b"%PDF"):
                      return "pdf"
                  if first.startswith(bytes([127]) + b"ELF"):
                      return "executable"
                  if len(first) > 262 and first[257:262] == b"ustar":
                      return "tar"
                  if first and sum(32 <= b <= 126 or b in (9, 10, 13) for b in first) / len(first) > 0.90:
                      return "text"
                  return "other"
              except (OSError, ValueError):
                  return "unreadable"
          process_dirs = []
          for process in Path("/proc").iterdir():
              if not process.name.isdigit():
                  continue
              try:
                  cwd = os.readlink(process / "cwd")
                  process_dirs.append(cwd)
              except OSError:
                  continue
          probe = []
          for candidate in Path("/home/githubops").iterdir():
              name_hash = hash_name(candidate.name)
              if name_hash not in targets or candidate.is_symlink() or not candidate.is_dir():
                  continue
              if candidate.stat().st_uid != os.geteuid():
                  continue
              items, file_count, dir_count, sample_truncated = [], 0, 0, False
              for index, entry in enumerate(candidate.iterdir()):
                  if index >= 4000:
                      sample_truncated = True
                      break
                  try:
                      info = entry.lstat()
                  except OSError:
                      continue
                  if stat.S_ISREG(info.st_mode):
                      file_count += 1
                      items.append((info.st_size, entry, info))
                  elif stat.S_ISDIR(info.st_mode):
                      dir_count += 1
              items.sort(key=lambda item: -item[0])
              largest = []
              now_probe = time.time()
              for size, entry, info in items[:14]:
                  largest.append({"name_hash": hash_name(entry.name),
                                  "suffix": suffix_label(entry.name),
                                  "bytes": size, "links": info.st_nlink,
                                  "age_days": round(max(0, now_probe-info.st_mtime)/86400, 2),
                                  "header": header_kind(entry)})
              suffix_sizes = {}
              for size, entry, _ in items:
                  key = suffix_label(entry.name)
                  record = suffix_sizes.setdefault(key, {"count": 0, "bytes": 0})
                  record["count"] += 1
                  record["bytes"] += size
              root_value = str(candidate)
              probe.append({"area_hash": name_hash,
                            "root_mtime_age_days": round(max(0, now_probe-candidate.stat().st_mtime)/86400, 2),
                            "direct_file_count": file_count, "direct_directory_count": dir_count,
                            "sample_truncated": sample_truncated,
                            "git_checkout": (candidate / ".git").exists(),
                            "cron_referenced": root_value in cron.stdout,
                            "process_cwd_inside": any(p == root_value or p.startswith(root_value + "/") for p in process_dirs),
                            "file_suffix_totals": suffix_sizes,
                            "largest_direct_files": largest})
          print("VPS_UNCLASSIFIED_DIRECTORY_PROBE=" +
                json.dumps({"schema": "vps.unclassified.metadata.v1",
                            "read_only": True, "deletion_performed": False,
                            "areas": probe}, sort_keys=True), flush=True)
          operation_target = root / "operations"
          if operation_target.is_dir() and not operation_target.is_symlink():
              try:
                  op = subprocess.run(["du", "-x", "-B1", "-d2", str(operation_target)],
                                      capture_output=True, text=True, timeout=70)
                  op_rows = []
                  for line in op.stdout.splitlines():
                      parts = line.split("\t", 1)
                      if len(parts) != 2 or not parts[0].isdigit():
                          continue
                      relative = os.path.relpath(parts[1], str(operation_target))
                      components = []
                      for segment in relative.split(os.sep):
                          if segment in (".", ""):
                              continue
                          components.append(segment if segment in allowed_names else "sha256_" + hash_name(segment))
                      op_rows.append({"area": "/".join(components) if components else ".", "bytes": int(parts[0])})
                  op_rows.sort(key=lambda item: -item["bytes"])
                  print("VPS_OPERATIONS_SUBTREE=" + json.dumps({
                      "state": "complete" if op.returncode == 0 else "partial",
                      "rows": op_rows[:28], "deletion_performed": False}, sort_keys=True), flush=True)
              except subprocess.TimeoutExpired:
                  print("VPS_OPERATIONS_SUBTREE=timed_out", flush=True)

          # Resolve only two stale temporary artifacts, without exposing names
          # or interpreting backup contents. This step never deletes.
          temporary_targets = {
              "9824c5f31b": ("c4e1ebe02f", ".partial", 1673216872),
              "9e7b2a0270": ("4491021f0d", ".part", 84672512),
          }
          temp_checks = []
          for directory in Path("/home/githubops").iterdir():
              tag = hash_name(directory.name)
              if tag not in temporary_targets or directory.is_symlink() or not directory.is_dir():
                  continue
              expected_name_hash, expected_ext, expected_size = temporary_targets[tag]
              for item in directory.iterdir():
                  if hash_name(item.name) != expected_name_hash:
                      continue
                  status = {"directory_hash": tag, "name_hash": expected_name_hash}
                  info = item.lstat()
                  status["regular_owner_link1"] = (stat.S_ISREG(info.st_mode) and
                      info.st_uid == os.geteuid() and info.st_nlink == 1)
                  status["exact_size"] = info.st_size == expected_size
                  status["suffix_ok"] = item.name.endswith(expected_ext)
                  status["age_days"] = round(max(0, time.time()-info.st_mtime)/86400, 2)
                  counterpart = item.with_name(item.name[:-len(expected_ext)])
                  if counterpart.is_file() and not counterpart.is_symlink():
                      full = counterpart.stat()
                      status["complete_sibling_exists"] = True
                      status["complete_sibling_bytes"] = full.st_size
                      status["complete_sibling_older"] = full.st_mtime < info.st_mtime
                      status["complete_sibling_header"] = header_kind(counterpart)
                  else:
                      status["complete_sibling_exists"] = False
                  references = 0
                  for manifest in directory.glob("*.json"):
                      if manifest.is_file() and not manifest.is_symlink() and manifest.stat().st_size < 1048576:
                          try:
                              data = manifest.read_text(encoding="utf-8")
                              if item.name in data:
                                  references += 1
                          except (OSError, UnicodeError):
                              references += 1
                  status["manifest_references"] = references
                  status["cron_referenced"] = str(item) in cron.stdout
                  opened = False
                  uncertain_processes = 0
                  for proc in Path("/proc").iterdir():
                      if not proc.name.isdigit():
                          continue
                      try:
                          for fd in (proc / "fd").iterdir():
                              try:
                                  if os.readlink(fd) == str(item):
                                      opened = True
                              except OSError:
                                  continue
                      except (OSError, PermissionError):
                          uncertain_processes += 1
                  status["open_file_descriptor_seen"] = opened
                  status["process_scan_partial"] = uncertain_processes > 0
                  temp_checks.append(status)
          print("VPS_STALE_TEMP_PREDELETE_GATES=" +
                json.dumps({"schema": "vps.temp.predelete.readonly.v1", "deletion_performed": False,
                            "targets": temp_checks}, sort_keys=True), flush=True)

          # Compare old local archives by file metadata, then by exact content
          # hash only for plausible duplicate sizes. Never modify any archive.
          archive_parents = {"98da9d80b7", "03c268f48a"}
          archive_areas = []
          archive_files = {}
          for parent in Path("/home/githubops").iterdir():
              tag = hash_name(parent.name)
              if tag not in archive_parents or parent.is_symlink() or not parent.is_dir():
                  continue
              ar = parent / "archive"
              if ar.is_symlink() or not ar.is_dir() or ar.stat().st_uid != os.geteuid():
                  archive_areas.append({"parent_hash": tag, "state": "unsafe_or_missing_archive"})
                  continue
              items, by_ext, directories, truncated = [], {}, 0, False
              for idx, entry in enumerate(ar.iterdir()):
                  if idx >= 4500:
                      truncated = True
                      break
                  try:
                      info = entry.lstat()
                  except OSError:
                      continue
                  if stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid():
                      items.append((info.st_size, entry, info))
                      name = suffix_label(entry.name)
                      slot = by_ext.setdefault(name, {"count": 0, "bytes": 0})
                      slot["count"] += 1
                      slot["bytes"] += info.st_size
                  elif stat.S_ISDIR(info.st_mode):
                      directories += 1
              items.sort(key=lambda row: -row[0])
              archive_files[tag] = items
              archive_areas.append({"parent_hash": tag, "state": "scanned",
                                    "direct_files": len(items), "direct_directories": directories,
                                    "truncated": truncated, "types": by_ext,
                                    "largest": [{"name_hash": hash_name(entry.name), "bytes": size,
                                                 "age_days": round(max(0, time.time()-info.st_mtime)/86400, 2),
                                                 "type": header_kind(entry), "links": info.st_nlink}
                                                for size, entry, info in items[:15]]})
          duplicates = []
          left = archive_files.get("98da9d80b7", [])
          right = archive_files.get("03c268f48a", [])
          byte_budget = 8 * 1024**3
          for ls, lp, li in left:
              for rs, rp, ri in right:
                  if ls != rs or ls < 1024 * 1024 or ls * 2 > byte_budget:
                      continue
                  def digest(path):
                      h = hashlib.sha256()
                      with path.open("rb") as stream:
                          while True:
                              chunk = stream.read(4 * 1024**2)
                              if not chunk:
                                  break
                              h.update(chunk)
                      return h.digest()
                  left_hash, right_hash = digest(lp), digest(rp)
                  byte_budget -= ls * 2
                  if left_hash == right_hash:
                      duplicates.append({"bytes": ls, "left_hash": hash_name(lp.name),
                                         "right_hash": hash_name(rp.name),
                                         "link_counts": [li.st_nlink, ri.st_nlink]})
          print("VPS_ARCHIVE_DUPLICATE_AUDIT=" + json.dumps({
              "schema": "vps.archive.duplicate.readonly.v1", "areas": archive_areas,
              "cross_area_exact_duplicates": duplicates,
              "hash_bytes_budget_remaining": byte_budget,
              "deletion_performed": False}, sort_keys=True), flush=True)

          # Bounded recursive walk for nested archive contents; no writes.
          recursive_areas, recursive_files = [], {}
          for parent in Path("/home/githubops").iterdir():
              tag = hash_name(parent.name)
              if tag not in archive_parents or parent.is_symlink() or not parent.is_dir():
                  continue
              ar = parent / "archive"
              if ar.is_symlink() or not ar.is_dir():
                  continue
              walked, files, dirs, kinds, truncated = 0, [], 0, {}, False
              for entry in ar.rglob("*"):
                  walked += 1
                  if walked > 8000:
                      truncated = True
                      break
                  try:
                      info = entry.lstat()
                  except OSError:
                      continue
                  if stat.S_ISDIR(info.st_mode):
                      dirs += 1
                  elif stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid():
                      files.append((info.st_size, entry, info))
                      k = suffix_label(entry.name)
                      slot = kinds.setdefault(k, {"count": 0, "bytes": 0})
                      slot["count"] += 1
                      slot["bytes"] += info.st_size
              files.sort(key=lambda item: -item[0])
              recursive_files[tag] = files
              recursive_areas.append({
                  "parent_hash": tag, "walked": walked, "files": len(files),
                  "dirs": dirs, "truncated": truncated, "suffix_totals": kinds,
                  "largest": [{"relative_path_hash": hashlib.sha256(str(entry.relative_to(ar)).encode()).hexdigest()[:12],
                               "bytes": size, "age_days": round(max(0,time.time()-info.st_mtime)/86400,2),
                               "kind": header_kind(entry), "links": info.st_nlink}
                              for size, entry, info in files[:18]]})
          exact_matches, compare_budget = [], 8 * 1024**3
          left = recursive_files.get("98da9d80b7", [])
          right = recursive_files.get("03c268f48a", [])
          right_by_size = {}
          for size, path, info in right:
              right_by_size.setdefault(size, []).append((path, info))
          def read_digest(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for block in iter(lambda: source.read(4*1024**2), b""):
                      digest.update(block)
              return digest.digest()
          for size, source, source_stat in left:
              if size < 1048576 or size*2 > compare_budget:
                  continue
              for candidate, target_stat in right_by_size.get(size, []):
                  if size*2 > compare_budget:
                      break
                  compare_budget -= size*2
                  if read_digest(source) == read_digest(candidate):
                      exact_matches.append({
                          "bytes": size,
                          "left_relative_hash": hashlib.sha256(str(source).encode()).hexdigest()[:12],
                          "right_relative_hash": hashlib.sha256(str(candidate).encode()).hexdigest()[:12],
                          "links": [source_stat.st_nlink,target_stat.st_nlink]})
          print("VPS_ARCHIVE_RECURSIVE_DUPLICATE_AUDIT=" +
                json.dumps({"schema": "vps.archive.recursive.readonly.v1",
                            "areas": recursive_areas,
                            "exact_matches": exact_matches,
                            "comparison_budget_remaining": compare_budget,
                            "deletion_performed": False}, sort_keys=True), flush=True)
          PY
