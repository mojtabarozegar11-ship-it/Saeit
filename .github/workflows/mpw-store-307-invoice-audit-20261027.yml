name: MojPlayWin store 307 and invoice source read-only diagnosis
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-store-307-invoice-audit-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Distinguish GET and HEAD redirects without cookies
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kw):return None
          opener=urllib.request.build_opener(NoRedirect)
          for method in ("GET","HEAD"):
              for path in ("/store/","/store/?__mpw_canon_passthru=1",
                           "/store/product/72/","/store/product/72/checkout/",
                           "/commerce/trx-easy/invoice/14/"):
                  url="https://mojplaywin.com"+path
                  try:
                      with opener.open(urllib.request.Request(url,method=method),timeout=25) as r:
                          code=r.status;loc=r.headers.get("Location");server=r.headers.get("Server")
                  except urllib.error.HTTPError as e:
                      code=e.code;loc=e.headers.get("Location");server=e.headers.get("Server")
                  except Exception as e:
                      print("MPW_SALES_PUBLIC_NETWORK_ERROR",method,path,type(e).__name__);continue
                  print("MPW_SALES_PUBLIC",json.dumps({"method":method,"path":path,
                       "status":code,"location":loc,"server":server}))
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-sales-route-audit-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read scoped Apache store rules and Django invoice guards
        run: |
          timeout 55s ssh -T -F "$RUNNER_TEMP/mpw-sales-route-audit-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,re,os
          site=Path("/home/zomorod2/mojplaywin.com")
          app=Path("/home/zomorod2/Saeit-staging")
          p=site/".htaccess"
          if p.is_symlink() or not p.is_file():raise RuntimeError("HTACCESS_IDENTITY_INVALID")
          lines=p.read_text("utf8","replace").splitlines()
          print("MPW_APACHE_AUDIT",len(lines),"sha256",hashlib.sha256(p.read_bytes()).hexdigest())
          wanted={i for i,line in enumerate(lines) if re.search(r"store|canon|passthru|307",line,re.I)}
          indices=set()
          for i in wanted:
              for j in range(max(0,i-4),min(len(lines),i+3)):
                  if (j in wanted or lines[j].lstrip().startswith(("RewriteCond","RewriteRule","RewriteEngine"))):
                      indices.add(j)
          for j in sorted(indices):
              line=lines[j]
              if re.search(r"secret|password|api.?key|bearer|token",line,re.I):
                  print("MPW_APACHE_REDACTED_RULE",j+1)
              else:
                  print("MPW_APACHE_RELEVANT_RULE",j+1,line[:250])
          files={
              "auth":app/"mpw_commerce/customer_auth.py",
              "invoice":app/"services/mpw_trx_commercial_web.py",
              "wsgi":site/"passenger_wsgi.py",
          }
          for name,path in files.items():
              if not path.is_file() or path.is_symlink():
                  print("MPW_RUNTIME_SOURCE_MISSING",name);continue
              raw=path.read_bytes()
              labels={
                  "safe_login_next":b"Honor Django's same-host validated return target",
                  "closed_invoice_owner":b"Closed invoices are still accessible to their verified owner",
                  "old_closed_invoice_404":b'This invoice is no longer payable',
                  "passthru":b"__mpw_canon_passthru",
              }
              print("MPW_RUNTIME_SOURCE",name,"sha256",hashlib.sha256(raw).hexdigest(),
                    "markers",{key:raw.count(value) for key,value in labels.items()})
          for folder in (site/"design-preview-20261017",app/"core",app/"mpw_commerce",app/"services"):
              if not folder.is_dir() or folder.is_symlink():continue
              found=[];files_seen=0
              for current,dirs,files in os.walk(folder,followlinks=False):
                  dirs[:]=[x for x in dirs if x not in (".git","node_modules","vendor","static","__pycache__","assets","media")]
                  for name in files:
                      if not name.endswith((".py",".php",".htaccess")):continue
                      path=Path(current)/name
                      try:
                          if path.is_symlink() or path.stat().st_size>1000000:continue
                          body=path.read_bytes();files_seen+=1
                          if b"__mpw_canon_passthru" in body:found.append(str(path))
                      except OSError:pass
                      if len(found)>=20:break
                  if len(found)>=20:break
              print("MPW_PASSTHRU_SOURCES",str(folder),"files_scanned",files_seen,
                    "matches",found[:20])
          PY
      - name: Check Django route resolution read-only, without customer logins
        run: |
          timeout 55s ssh -T -F "$RUNNER_TEMP/mpw-sales-route-audit-ssh/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' <<'PY'
          import os,sys
          os.chdir("/home/zomorod2/Saeit-staging")
          sys.path.insert(0,os.getcwd())
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.urls import resolve
          for path in ("/store/","/store/product/72/","/store/product/72/checkout/",
                       "/commerce/trx-easy/invoice/14/","/commerce/my-purchases/"):
              try:
                  match=resolve(path)
                  fn=match.func
                  print("MPW_RESOLVED",path,"name",match.url_name,
                        "module",getattr(fn,"__module__",None),
                        "function",getattr(fn,"__name__",None))
              except Exception as exc:
                  print("MPW_RESOLUTION_ERROR",path,type(exc).__name__)
          PY
      - name: Remove temporary SSH material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-sales-route-audit-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
