name: F26 real-world rice research model — reproducible holdout
on:
  push:
    branches: [feature/f26-real-rice-uci-qa-20261022, fix/f26-basic-ci-no-ml-20261022, feature/f26-rice-real-inference-cli-20261022, main]
    paths:
      - scripts/factory_f26_real_rice_research_pilot.py
      - scripts/factory_f26_real_rice_cli.py
      - tests/test_factory_f26_real_rice_cli.py
      - tests/test_factory_f26_real_rice_research_pilot.py
      - tests/test_factory_f26_real_rice_private_install.py
      - deploy/factory_f26_real_rice_private_relay.sh
      - deploy/factory_f26_real_rice_private_install.py
      - .github/workflows/factory-f26-real-rice-pilot-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: factory-f26-real-rice-uci-pilot
  cancel-in-progress: false
jobs:
  train-real-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      F26_UCI_EXPECTED_SHA256: "fe94e42046b829de21b92b0ffb6a22774fde021328cae799faa802a14e8dbed9"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install fixed CPU-only ML and ONNX interpreters
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==2.1.3 scikit-learn==1.5.2 onnx==1.17.0 onnxruntime==1.20.1
      - name: Execute offline adversarial dataset integrity and leakage tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_f26_real_rice_research_pilot.py -v
          python3 -B -m unittest discover -s tests -p test_factory_f26_real_rice_private_install.py -v
          bash -n deploy/factory_f26_real_rice_private_relay.sh
          python3 -B -m py_compile scripts/factory_f26_real_rice_research_pilot.py
      - name: Fetch explicitly licensed UCI rice morphology dataset over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --location --max-time 90 --retry 2 --fail --silent --show-error \
            'https://archive.ics.uci.edu/static/public/545/rice%2Bcammeo%2Band%2Bosmancik.zip' \
            -o "$RUNNER_TEMP/uci-rice-545.zip"
          test -s "$RUNNER_TEMP/uci-rice-545.zip"
          sha256sum "$RUNNER_TEMP/uci-rice-545.zip"
          echo F26_UCI_RICE_SOURCE_REQUIRES_PINNED_DIGEST_AND_3810_REAL_ROWS=true
      - name: Train real-data split without leakage and test actual ONNX CPU inference
        shell: bash
        run: |
          set -euo pipefail
          source_digest="$(sha256sum "$RUNNER_TEMP/uci-rice-545.zip" | cut -d' ' -f1)"
          test "$source_digest" = "$F26_UCI_EXPECTED_SHA256"
          echo F26_PUBLIC_SOURCE_UCI_ZIP_PIN_VERIFIED=PASS
          python3 -B scripts/factory_f26_real_rice_research_pilot.py \
            --archive "$RUNNER_TEMP/uci-rice-545.zip" \
            --expected-archive-sha256 "$source_digest" \
            --out "$RUNNER_TEMP/f26-real-rice"
          python3 -B scripts/factory_f26_real_rice_research_pilot.py --verify "$RUNNER_TEMP/f26-real-rice"
          echo F26_REAL_RICE_HOLDOUT_ONNX=PASS
      - name: Exercise SHA-pinned offline inference CLI on twelve real UCI grains
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_f26_real_rice_cli.py -v
          python3 -B - "$RUNNER_TEMP/uci-rice-545.zip" "$RUNNER_TEMP/rice-inference.csv" <<'PY'
          import csv,hashlib,importlib.util,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('rice','scripts/factory_f26_real_rice_research_pilot.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          raw=Path(sys.argv[1]).read_bytes()
          text,_=module.read_archive(sys.argv[1],hashlib.sha256(raw).hexdigest())
          rows,_=module.parse_arff(text)
          with open(sys.argv[2],'w',encoding='utf8',newline='') as file:
              writer=csv.writer(file)
              writer.writerow(module.FIELDS)
              writer.writerows(rows[:12])
          PY
          python3 -B scripts/factory_f26_real_rice_cli.py --model-dir "$RUNNER_TEMP/f26-real-rice" --csv "$RUNNER_TEMP/rice-inference.csv" --out "$RUNNER_TEMP/rice-inference-result.json"
          python3 -B - "$RUNNER_TEMP/rice-inference-result.json" "$RUNNER_TEMP/f26-real-rice/model_card.json" <<'PY'
          import json,sys
          from pathlib import Path
          results=json.loads(Path(sys.argv[1]).read_text())
          card=json.loads(Path(sys.argv[2]).read_text())
          assert results['count']==12 and len(results['predictions'])==12
          assert results['model_sha256']==card['onnx_model_sha256']
          assert all(x['predicted_cultivar'] in ('Cammeo','Osmancik') for x in results['predictions'])
          assert all(not x['independent_field_validation'] for x in results['predictions'])
          assert results['no_external_service_called'] is True
          assert results['commercial_release_authorized'] is False
          assert results['human_expert_quality_1000_certified'] is False
          print('F26_RICE_REAL_DATA_OFFLINE_CLI_INFERENCE=PASS')
          PY
      - name: Privately admit SHA-bound real-data pilot into existing VPS F26 research evidence
        if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash -n deploy/factory_f26_real_rice_private_relay.sh
          python3 -B -m py_compile deploy/factory_f26_real_rice_private_install.py
          bash deploy/factory_f26_real_rice_private_relay.sh "$RUNNER_TEMP/f26-real-rice"
