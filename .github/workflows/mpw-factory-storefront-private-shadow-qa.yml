name: MojPlayWin private shadow storefront compatibility check
on:
  push:
    branches: [qa/mpw-factory-safe-storefront-20261014]
    paths:
      - .github/workflows/mpw-factory-storefront-private-shadow-qa.yml
      - core/templates/core/mojplaywin_store_base.html
      - core/templates/core/mojplaywin_factory_store.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test storefront preview with live Django settings and private templates, without site writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 55s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          umask 077
          staging="$HOME/.mpw-factory-store-shadow-20261014"
          test ! -L "$staging"
          if test ! -d "$staging"; then mkdir -m 700 "$staging"; fi
          test -d "$staging" && chmod 700 "$staging"
          REMOTE
          tar -C "$GITHUB_WORKSPACE" -cf - \
            core/factory_storefront.py \
            core/templates/core/mojplaywin_factory_store.html \
            core/templates/core/mojplaywin_store_base.html \
            | timeout 95s ssh -F "$d/config" host \
              'tar -xf - -C "$HOME/.mpw-factory-store-shadow-20261014"'
          timeout 130s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export DJANGO_SETTINGS_MODULE=config.settings
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          from pathlib import Path
          import importlib.util, types, django
          django.setup()
          from django.template import Engine, Context
          from core.models import Product,Order,PaymentIntent
          from django.conf import settings
          site=Path.home()/"Saeit-staging"
          stage=Path.home()/".mpw-factory-store-shadow-20261014"
          new=stage/"core/templates/core/mojplaywin_factory_store.html"
          script=stage/"core/factory_storefront.py"
          assert script.is_file() and new.is_file()
          assert not (site/"core/factory_storefront.py").exists(), "Unexpected active factory storefront module"
          spec=importlib.util.spec_from_file_location("mpw_private_store_render_probe",script)
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          farm=Product.objects.get(pk=131)
          water=Product.objects.get(pk=147)
          assert farm.active is False and water.active is False
          assert farm.price==0 and str(water.price)=="0.99"
          before=(Product.objects.count(),Order.objects.count(),PaymentIntent.objects.count())
          assert helper.factory_card(farm) is None
          assert helper.factory_card(water) is None
          fakefarm=types.SimpleNamespace(active=True,title=farm.title,price=farm.price,currency=farm.currency,
             metadata=dict(farm.metadata, factory_publication_permission=True,
                 factory_commercial_status="published_free_download_no_checkout",
                 factory_public_download_url="/factory-releases/farm-enterprise-economics-v1/Farm_Enterprise_Economics_Toolkit_Free_v1.zip"))
          free=helper.factory_card(fakefarm)
          assert free and free["kind"]=="free" and free["url"].startswith("/factory-releases/")
          fakewater=types.SimpleNamespace(active=True,title=water.title,price=water.price,currency=water.currency,
             metadata=dict(water.metadata, factory_publication_permission=True))
          assert helper.factory_card(fakewater) is None
          engine=Engine(dirs=[str(stage/"core/templates"),str(site/"core/templates")],app_dirs=True)
          template=engine.get_template("core/mojplaywin_factory_store.html")
          html=template.render(Context({"factory_cards":[free],"other_products":[]}))
          assert "Smart tools. Clear value." in html
          assert "Free download" in html
          assert "Proceed to secure checkout" not in html
          assert "Water Budget Economics" not in html
          assert before==(Product.objects.count(),Order.objects.count(),PaymentIntent.objects.count())
          print("MPW_FACTORY_STORE_PRIVATE_TEMPLATE_RENDER_OK=True")
          print("MPW_FACTORY_STORE_APPROVED_FREE_SAMPLE_VISIBLE=True")
          print("MPW_FACTORY_STORE_UNVERIFIED_PAID_SAMPLE_HIDDEN=True")
          print("MPW_FACTORY_STORE_REAL_DJANGO_DB_UNCHANGED=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
