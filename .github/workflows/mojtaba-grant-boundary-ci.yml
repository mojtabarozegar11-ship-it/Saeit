name: Mojtaba bot grant replay and owner binding (scoped)

on:
  pull_request:
    branches:
      - audit/mojtaba-command-intent-20261114
    paths:
      - core/grant_scope_policy.py
      - core/approval.py
      - core/tests/test_approval_grants.py
      - core/tests/test_knowledge_agent_generate.py
      - core/tests/test_grant_binding_20261114.py
      - tests/test_mojtaba_grant_policy_20261114.py
      - .github/workflows/mojtaba-grant-boundary-ci.yml

permissions:
  contents: read

jobs:
  grants-scoped-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Scoped offline/isolated test DB regressions
        run: |
          python -m pytest -q \
            tests/test_mojtaba_grant_policy_20261114.py \
            core/tests/test_approval_grants.py \
            core/tests/test_grant_binding_20261114.py \
            core/tests/test_knowledge_agent_generate.py
      - name: Python syntax checks
        run: |
          python -m compileall -q \
            core/grant_scope_policy.py core/approval.py \
            core/tests/test_grant_binding_20261114.py \
            tests/test_mojtaba_grant_policy_20261114.py
