name: ComfyUI NumPy Torch Isolated Import Diagnostics
on:
  push:
    branches: [audit/vps-comfyui-hardware-20261014]
    paths: [.github/workflows/comfyui-numpy-torch-readonly-diagnose.yml]
permissions:
  contents: read
concurrency:
  group: comfyui-numpy-torch-import-diagnose
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose ComfyUI NumPy and PyTorch without changing the factory
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/comfy-import"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          timeout 205s ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          root="$HOME/comfyui-isolated"
          py="$root/env-cpu/bin/python"
          test -x "$py" && test -f "$root/source-v0.40.0/main.py"
          echo COMFY_IMPORT_AUDIT_BEGIN
          pidfile="$HOME/factory-runtime/operations/vps-only-loop.pid"
          factory_alive () {
            if test -f "$pidfile"; then
              pid="$(cat "$pidfile")"
              if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then echo "FACTORY_LOOP_ALIVE=$1"; else echo "FACTORY_LOOP_NOT_VERIFIED=$1"; fi
            else echo "FACTORY_PIDFILE_MISSING=$1"; fi
          }
          factory_alive BEFORE
          free -m | awk '/^Mem:/{print "RAM_AVAILABLE_MB="$7}'
          df -Pm "$HOME" | awk 'NR==2{print "DISK_FREE_MB="$4}'
          "$py" -V
          "$py" -m pip show numpy torch | grep -E '^(Name|Version):' | head -n 4 || true
          echo NUMPY_IMPORT_TEST_BEGIN
          if timeout 45s nice -n 15 "$py" -I -c 'import numpy as np;print("NUMPY_IMPORT_OK="+np.__version__,flush=True);print("NUMPY_ARRAY="+str(np.arange(3).sum()),flush=True)'; then
            echo NUMPY_IMPORT_SUCCEEDED
          else echo "NUMPY_IMPORT_FAILED=$?"; fi
          echo TORCH_IMPORT_TEST_BEGIN
          if timeout 110s nice -n 15 "$py" -I -c 'import torch;print("TORCH_IMPORT_OK="+torch.__version__,flush=True);print("TORCH_CPU="+str(torch.cuda.is_available()),flush=True)'; then
            echo TORCH_IMPORT_SUCCEEDED
          else echo "TORCH_IMPORT_FAILED=$?"; fi
          factory_alive AFTER
          echo COMFY_IMPORT_AUDIT_END
          REMOTE
