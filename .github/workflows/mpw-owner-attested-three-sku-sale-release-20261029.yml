name: MojPlayWin owner-attested three-SKU sale release
on:
  pull_request:
    paths:
      - ".github/workflows/mpw-owner-attested-three-sku-sale-release-20261029.yml"
      - "scripts/mpw_owner_attested_sku_metadata_20261029.py"
      - "scripts/mpw_trx_rights_live_guard_20261028.py"
      - "scripts/mpw_checkout_csp_zero_script_guard_20261029.py"
  workflow_dispatch:
    inputs:
      operation:
        description: "check is read-only; apply records owner declaration and installs reviewed guards"
        required: true
        default: check
        type: choice
        options: [check, apply]
permissions: {contents: read}
concurrency:
  group: mpw-owner-attested-three-sku-sale-release
  cancel-in-progress: false
jobs:
  contract:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate release scripts without production access
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_owner_attested_sku_metadata_20261029.py scripts/mpw_trx_rights_live_guard_20261028.py scripts/mpw_checkout_csp_zero_script_guard_20261029.py
          python3 scripts/mpw_checkout_csp_zero_script_guard_20261029.py selftest
  live:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-owner-release"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage reviewed release tools privately
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-owner-release"
          remote="/home/zomorod2/.mpw-owner-release-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$remote' && install -d -m 700 '$remote'"
          timeout 50s scp -q -F "$d/config" scripts/mpw_owner_attested_sku_metadata_20261029.py scripts/mpw_trx_rights_live_guard_20261028.py scripts/mpw_checkout_csp_zero_script_guard_20261029.py "saeit-cpanel:$remote/"
      - name: Run read-only data, rights-gate and checkout preflights
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-owner-release"
          remote="/home/zomorod2/.mpw-owner-release-$GITHUB_RUN_ID"
          py="/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_owner_attested_sku_metadata_20261029.py' check"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel "$py - check" < scripts/mpw_trx_rights_live_guard_20261028.py
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_checkout_csp_zero_script_guard_20261029.py' preview"
      - name: Apply owner declaration, checkout repair and rights gate with rollback
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-owner-release"
          remote="/home/zomorod2/.mpw-owner-release-$GITHUB_RUN_ID"
          py="/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python"
          owner_applied=0
          csp_applied=0
          rights_apply_armed=0
          rollback() {
            trap - ERR
            if [ "$rights_apply_armed" = 1 ]; then
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_trx_rights_live_guard_20261028.py' recover '$GITHUB_RUN_ID'" || true
            fi
            if [ "$csp_applied" = 1 ]; then
              timeout 75s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_checkout_csp_zero_script_guard_20261029.py' rollback '$GITHUB_RUN_ID'" || true
            fi
            if [ "$owner_applied" = 1 ]; then
              timeout 75s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_owner_attested_sku_metadata_20261029.py' rollback '$GITHUB_RUN_ID'" || true
            fi
          }
          trap rollback ERR
          timeout 75s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_owner_attested_sku_metadata_20261029.py' apply '$GITHUB_RUN_ID'"
          owner_applied=1
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "MPW_CSP_RELEASE_APPROVED=YES $py '$remote/mpw_checkout_csp_zero_script_guard_20261029.py' publish '$GITHUB_RUN_ID'"
          csp_applied=1
          rights_apply_armed=1
          timeout 110s ssh -T -F "$d/config" saeit-cpanel "$py - apply '$GITHUB_RUN_ID'" < scripts/mpw_trx_rights_live_guard_20261028.py
          timeout 75s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_owner_attested_sku_metadata_20261029.py' verify '$GITHUB_RUN_ID'"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "$py '$remote/mpw_checkout_csp_zero_script_guard_20261029.py' verify '$GITHUB_RUN_ID'"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "$py - verify '$GITHUB_RUN_ID'" < scripts/mpw_trx_rights_live_guard_20261028.py
          rights_apply_armed=0
          csp_applied=0
          owner_applied=0
          trap - ERR
          echo 'MPW_OWNER_ATTESTED_SALE_RELEASE=VERIFIED; ORDERS=0; PAYMENTS=0'
      - name: Delete temporary release tools and runner SSH material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-owner-release"
          if test -f "$d/config"; then
            remote="/home/zomorod2/.mpw-owner-release-$GITHUB_RUN_ID"
            ssh -T -F "$d/config" saeit-cpanel "test -d '$remote' && test ! -L '$remote' && rm -f '$remote/'*.py && rmdir '$remote'" || true
          fi
          rm -rf -- "$d"
