name: Factory Source and VPS Placement Audit
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-source-placement-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare verified SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
      - name: Read-only source and destination audit
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          timeout 65 ssh -F "$d/config" saeit-host 'echo HOST_FACTORY_SOURCE; du -sh /home/zomorod2/Saeit-staging/var/factory /home/zomorod2/Saeit-staging/core 2>/dev/null; echo FACTORY_MODULES; find /home/zomorod2/Saeit-staging/core -maxdepth 1 -type f -name "factory*.py" -printf "%f\n" | sort; echo AGENT_PATHS; find /home/zomorod2/Saeit-staging -maxdepth 3 -type d \( -iname "*agent*" -o -iname "*factory*" \) 2>/dev/null | head -45; echo STAGING_DB_KIND; grep -E "^ENGINE|^NAME" /dev/null || true'
          timeout 35 ssh -F "$d/config" saeit-vps 'echo VPS_DEPENDENCIES; command -v python3 || true; python3 --version; command -v psql || true; command -v docker || true; echo VPS_PATH_PERMISSIONS; ls -ld /srv /opt /home/githubops 2>/dev/null || true; echo VPS_PORTS; ss -H -ltn | head -12'
      - name: Cleanup relay credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
