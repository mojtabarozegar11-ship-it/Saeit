name: MojPlayWin private guest gateway staging validation (payments OFF)
on:
  push:
    branches: [main]
    paths:
      - "mpw_fiat_to_trx_20261020/**"
      - "tests/test_mpw_fiat_guest_order_vault_20261021.py"
      - "tests/test_mpw_fiat_to_trx_provider_20261020.py"
      - ".github/workflows/mpw-guest-gateway-private-stage-20261021.yml"
permissions: {contents: read}
concurrency:
  group: mpw-safe-guest-gateway-private-staging
  cancel-in-progress: false
jobs:
  stage_test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate controlled offline source bundle, never any live keys
        run: |
          set -euo pipefail
          python3 -m py_compile mpw_fiat_to_trx_20261020/guest_order_vault.py mpw_fiat_to_trx_20261020/provider_adapter.py
          python3 -m unittest discover -s tests -p test_mpw_fiat_guest_order_vault_20261021.py -q
          python3 -m unittest discover -s tests -p test_mpw_fiat_to_trx_provider_20261020.py -q
          tar -cf "$RUNNER_TEMP/mpw-guest-stage.tar" \
            mpw_fiat_to_trx_20261020/guest_order_vault.py \
            mpw_fiat_to_trx_20261020/provider_adapter.py \
            tests/test_mpw_fiat_guest_order_vault_20261021.py \
            tests/test_mpw_fiat_to_trx_provider_20261020.py
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gueststage-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage exact reviewed Python sources in private isolated directory only
        shell: bash
        run: |
          set -euo pipefail
          remote="/home/zomorod2/.private_mojplaywin_main_agents/mpw-guest-stage-$GITHUB_RUN_ID"
          test -n "$GITHUB_RUN_ID"
          ssh -T -F "$RUNNER_TEMP/mpw-gueststage-ssh/config" saeit-cpanel \
            "set -e; umask 077; test ! -e '$remote'; install -d -m 700 '$remote'; tar -xf - -C '$remote' --no-same-owner --no-same-permissions" \
            < "$RUNNER_TEMP/mpw-guest-stage.tar"
          echo "MPW_GUEST_MODULE_STAGED_PRIVATE_ONLY=PASS"
      - name: Run 100-percent fail-closed order and provider tests with cPanel Python
        shell: bash
        run: |
          set -euo pipefail
          remote="/home/zomorod2/.private_mojplaywin_main_agents/mpw-guest-stage-$GITHUB_RUN_ID"
          ssh -T -F "$RUNNER_TEMP/mpw-gueststage-ssh/config" saeit-cpanel \
            "set -e; cd '$remote'; PYTHONPATH='$remote' /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -m unittest discover -s tests -p test_mpw_fiat_guest_order_vault_20261021.py -v; PYTHONPATH='$remote' /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -m unittest discover -s tests -p test_mpw_fiat_to_trx_provider_20261020.py -v"
          echo "MPW_GUEST_STAGE_CPNANEL_TESTS=PASS"
          echo "MPW_LIVE_FIAT_PROCESSOR_ACTIVATION=NOT_ATTEMPTED"
          echo "MPW_REAL_FUNDS_CHARGED=0"
      - name: Remove private SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-gueststage-ssh"
