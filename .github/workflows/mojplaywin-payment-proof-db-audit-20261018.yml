name: MojPlayWin checkout wallet ownership and catalog eligibility database audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-payment-proof-db-audit-20261018.yml"
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Ask live venv Django for anonymous payment readiness counts only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 95s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          cd /home/zomorod2/Saeit-staging
          py=/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python
          "$py" - <<'PY'
          import os,json
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          result={}
          try:
              import django
              django.setup()
              from django.urls import resolve,Resolver404
              from django.conf import settings
              result['django_setup']='ok'
              result['config_db_engine']=settings.DATABASES['default']['ENGINE']
              result['production_debug']=bool(settings.DEBUG)
              for path in ['/store/','/store/product/72/checkout/','/store/product/72/','/merchant-wallet/','/api/payments/']:
                  try:
                      match=resolve(path)
                      result['route_'+path]={'name':match.url_name,'module':match.func.__module__}
                  except Exception as exc:result['route_'+path]={'status':type(exc).__name__}
              from django.db import connection
              connection.ensure_connection()
              result['db_connection']='ok'
              from core.models import Product, Order, PaymentIntent
              result['products_total']=Product.objects.count()
              result['products_active']=Product.objects.filter(active=True).count()
              result['products_active_usd']=Product.objects.filter(active=True,currency='USD').count()
              result['products_active_verified_delivery']=Product.objects.filter(active=True,metadata__payment_live=True).count()
              result['products_active_id72']=Product.objects.filter(active=True,pk=72).exists()
              result['pending_orders']=Order.objects.filter(status='pending').count()
              result['paid_orders']=Order.objects.filter(status='paid').count()
              result['intents']=PaymentIntent.objects.count()
              from mpw_native_checkout.models import MerchantWalletProof,NativeInvoice,NativeChainTransfer
              result['wallet_proof_record_count']=MerchantWalletProof.objects.count()
              result['wallet_proof_verified_count']=MerchantWalletProof.objects.filter(verified_at__isnull=False).count()
              result['native_invoices']=NativeInvoice.objects.count()
              result['verified_chain_transfers']=NativeChainTransfer.objects.count()
              from mpw_native_checkout.wallet_ownership import proven_assets
              proof=proven_assets()
              result['verified_assets_type']=type(proof).__name__
              result['verified_assets_count']=len(proof)
              result['verified_assets_identifiers']=list(proof.keys()) if isinstance(proof,dict) else sorted([str(v) for v in proof])
              result['wallet_ids_and_private_details']='never_exposed'
          except Exception as exc:
              result['failure_type']=type(exc).__name__
              result['failure_short_message']=str(exc)[:160] if isinstance(exc,ImportError) else ''
          print('MPW_LIVE_PAYMENT_DB_READINESS='+json.dumps(result,default=str,sort_keys=True))
          PY
          BASH
