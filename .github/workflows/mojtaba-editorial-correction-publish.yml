name: Personal profile content correction release
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: personal-v17-editorial-text-cleanup
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: Remove unwanted Mojtaba photo disclaimers 2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify personal profile and article content safety
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_remove_unwanted_profile_disclaimers.py
          python3 -m unittest discover -s tests -p test_mojtaba_profile_editorial_cleanup.py -v
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"

      - name: Confirm release documentation
        run: echo editorial validation complete

      - name: Prepare personal editorial release archive
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/editorial-fix.tar.gz" scripts/mojtaba_remove_unwanted_profile_disclaimers.py scripts/mojtaba_twenty_photo_essays_safe_publish.py content/mojtaba_*.json
      - name: Transfer temporary archive to independent personal hosting
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-text-cleanup-$GITHUB_RUN_ID"
          timeout 35s ssh -F "$SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 120s scp -F "$SSH_CONFIG" "$RUNNER_TEMP/editorial-fix.tar.gz" "saeit-host:$stage/source.tgz"
      - name: Publish only the approved editorial language changes and verify safety
        shell: bash
        run: |
          set -euo pipefail
          timeout 880s ssh -F "$SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          umask 077
          id="$1"
          stage="/home/zomorod2/.mpw-text-cleanup-$id"
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          python="$app/../.venv_personal_test/bin/python"
          cleaner="$stage/scripts/mojtaba_remove_unwanted_profile_disclaimers.py"
          backup="$HOME/.backups/mojtaba-photo-disclaimer-correction/$id"
          installed=0
          verified=0
          restore_guard() {
            status=$?
            trap - EXIT
            if test "$installed" = 1 && test "$verified" = 0; then
              "$python" "$cleaner" rollback --app "$app" --backup "$backup" && echo "EDITORIAL_AUTO_ROLLBACK=success" || echo "EDITORIAL_AUTO_ROLLBACK=manual_review"
            fi
            exit "$status"
          }
          trap restore_guard EXIT
          test -f "$app/manage.py" && test -x "$python" && test ! -L "$app"
          test -f "$stage/source.tgz"
          tar -tzf "$stage/source.tgz" > "$stage/archive-list.txt"
          grep -Fxq 'scripts/mojtaba_remove_unwanted_profile_disclaimers.py' "$stage/archive-list.txt"
          cd "$stage"
          tar -xzf source.tgz --no-same-owner
          "$python" "$cleaner" check --app "$app" --content "$stage/content"
          cd "$app"
          "$python" "$cleaner" install --app "$app" --content "$stage/content" --backup "$backup"
          installed=1
          "$python" manage.py check --deploy
          test ! -d "$app/tmp" || touch "$app/tmp/restart.txt"
          base="https://mojplaywin.com/mojtaba.roozegar"
          curl -fsSL --max-time 28 "$base/" -o "$stage/public-home.html"
          curl -fsSL --max-time 28 "$base/about/" -o "$stage/public-about.html"
          curl -fsSL --max-time 28 "$base/blog/" -o "$stage/public-blog.html"
          for page in "$stage/public-home.html" "$stage/public-about.html"; do
            grep -Fq 'mpw-primary-personal-profile-20261016' "$page"
            grep -Fq 'official_profile_20261016/' "$page"
            if grep -Fiq 'It is not presented as evidence of a Vancouver office' "$page"; then exit 22; fi
            echo "EDITORIAL_LIVE_PROFILE_PHOTO_PRESERVED_AND_PHRASE_GONE=yes"
          done
          grep -Fq 'mpw-mojtaba-twenty-image-essays-20261016' "$stage/public-blog.html"
          echo "EDITORIAL_JOURNAL_SECTIONS_PRESERVED=yes"
          "$python" - "$stage" <<'PY_ARTICLES'
          import importlib.util,os,sys,time
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request,urlopen
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django;django.setup()
          from core.models import Post
          stage=Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location("cleanup",stage/"scripts/mojtaba_remove_unwanted_profile_disclaimers.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          slugs=mod.article_rows(stage/"content")
          assert len(slugs)==93 and Post.objects.filter(slug__in=slugs,published=True).count()==93
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__();self.count=0
              def handle_starttag(self,tag,attrs):
                  if tag=="img":self.count+=1
          for slug in slugs:
              url="https://mojplaywin.com/mojtaba.roozegar/blog/"+slug+"/?audit="+str(time.time_ns())
              with urlopen(Request(url,headers={"User-Agent":"PersonalJournalEditorialCheck/1"}),timeout=24) as res:
                  assert res.status==200
                  body=res.read(5000000).decode("utf-8","replace")
              p=Images();p.feed(body)
              if p.count<1:raise ValueError("Original article image missing: "+slug)
          print("EDITORIAL_93_ARTICLE_PAGES_AND_IMAGES_VERIFIED=yes",flush=True)
          PY_ARTICLES
