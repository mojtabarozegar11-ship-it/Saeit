name: MojPlayWin main-site structure and sitemap repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-site-structure-safe-20261026.yml
      - scripts/mpw_structure_safe_release_20261026.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-main-site-structure-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test structure patch with no host changes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_structure_safe_release_20261026.py
          python3 scripts/mpw_structure_safe_release_20261026.py selftest
      - name: Snapshot public main routes and protected siblings
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,xml.etree.ElementTree as ET
          origin='https://mojplaywin.com'
          paths=('/','/store/','/store/product/72/','/store/product/225/',
                 '/store/product/879/','/games/','/knowledge/','/research/',
                 '/company/','/taniya/','/farnaz/','/saman/','/picm/')
          results={}
          for path in paths:
              with urllib.request.urlopen(origin+path,timeout=25) as response:
                  if response.status!=200:raise RuntimeError('Unhealthy baseline '+path)
                  results[path]=response.status
          with urllib.request.urlopen(origin+'/',timeout=25) as response:
              homepage=response.read(900000)
          from scripts.mpw_structure_safe_release_20261026 import patch_home
          patched=patch_home(homepage)
          if not patched.count(b'data-mpw-structure-v1="20261026"')==1:
              raise RuntimeError('Unexpected public homepage; refuse release')
          with urllib.request.urlopen(origin+'/sitemap.xml',timeout=25) as response:
              urls=[node.text for node in ET.fromstring(response.read(2000000)).iter() if node.tag.endswith('loc')]
          if len(urls)!=len(set(urls)) or len(urls)<60:
              raise RuntimeError('Public sitemap baseline invalid')
          outfile=os.path.join(os.environ['RUNNER_TEMP'],'mpw-structure-baseline.json')
          with open(outfile,'w') as stream:json.dump({'status':results,'sitemap_count':len(urls)},stream)
          print('MAIN_SITE_READONLY_PREFLIGHT_OK',len(results),len(urls))
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Publish only verified home source and sitemap include
        id: install
        run: |
          set -euo pipefail
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_structure_safe_release_20261026.py
      - name: Confirm public layout, sitemap and protected commerce unchanged
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,xml.etree.ElementTree as ET
          origin='https://mojplaywin.com'
          baseline=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'mpw-structure-baseline.json')))
          for trial in range(8):
              req=urllib.request.Request(origin+'/?structure_release='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:homepage=r.read(900000).decode('utf8','replace')
              ready=(homepage.count('data-mpw-structure-v1="20261026"')==1
                     and homepage.count('class="mpw-content-fold"')==2
                     and homepage.count('MPW_FOOTER_ORDER_FIXED_20261027')==1
                     and homepage.index('</main>')<homepage.index('<footer')
                     and 'id="mw-all-pages-menu"' in homepage
                     and 'id="site-directory"' in homepage)
              if ready:break
              time.sleep(2)
          if not ready:raise RuntimeError('Live homepage structure not verified')
          with urllib.request.urlopen(origin+'/sitemap.xml?structure_release='+str(time.time_ns()),timeout=25) as r:
              urls=[x.text for x in ET.fromstring(r.read(2000000)).iter() if x.tag.endswith('loc')]
          if len(urls)!=len(set(urls)) or len(urls)<baseline['sitemap_count']:
              raise RuntimeError('Sitemap lost URLs or gained duplicates')
          for path in ('/knowledge/','/research/','/company/','/taniya/','/ventures/agriculture/'):
              if urls.count(origin+path)!=1:raise RuntimeError('Required sitemap route missing '+path)
          for path in ('/services/','/games/'):
              with urllib.request.urlopen(origin+path+'?structure_links='+str(time.time_ns()),timeout=25) as r:
                  document=r.read(250000).decode('utf8','replace')
              for obsolete in ('href="/#mpw-insight-title"', 'href="/#field-library-round2"', 'href="/#field-library-advanced"'):
                  if obsolete in document:raise RuntimeError('Broken legacy anchor remains '+path)
              for canonical in ('/mpw-editorial/field-guides/original-ten/', '/mpw-editorial/field-guides/20261023/index.html'):
                  if canonical not in document:raise RuntimeError('Consolidated guide link missing '+path)
          for path,prior in baseline['status'].items():
              with urllib.request.urlopen(origin+path,timeout=25) as r:
                  if r.status!=prior:raise RuntimeError('Protected route changed '+path)
          # Anonymous invoice URLs must retain the pre-existing login guard.
          for pk in ('72','225','879'):
              with urllib.request.urlopen(origin+'/store/product/'+pk+'/checkout/',timeout=25) as r:
                  if '/accounts/login/' not in r.url:raise RuntimeError('Checkout authentication changed '+pk)
          print('MPW_STRUCTURE_AND_SITEMAP_VERIFIED;STORE_AND_CHILD_SITES_UNCHANGED')
          PY
      - name: Revert only matching structure files on smoke failure
        if: failure() && steps.install.outcome == 'success'
        run: |
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_structure_safe_release_20261026.py
      - name: Remove ephemeral relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-structure-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
