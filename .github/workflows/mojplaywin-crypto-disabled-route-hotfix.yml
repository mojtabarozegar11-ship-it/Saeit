name: MojPlayWin isolated crypto gateway disabled-route hotfix
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths: [.github/workflows/mojplaywin-crypto-disabled-route-hotfix.yml]
permissions:
  contents: read
concurrency:
  group: mojplaywin-crypto-isolated-route-publish
  cancel-in-progress: false
jobs:
  hotfix-while-disabled:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing source history and local PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_crypto_disabled_hotfix.py
          php -l isolated_crypto_gateway/index.php
          php -l isolated_crypto_gateway/bootstrap.php
          git show d00f0b5763cbca9f8983d3014f1182307a16d197:isolated_crypto_gateway/index.php > "$RUNNER_TEMP/old-index.php"
          git show d00f0b5763cbca9f8983d3014f1182307a16d197:isolated_crypto_gateway/bootstrap.php > "$RUNNER_TEMP/old-bootstrap.php"
          python3 - <<'PY'
          from pathlib import Path
          old=Path(__import__("os").environ["RUNNER_TEMP"])
          current=Path("isolated_crypto_gateway/index.php").read_text()
          prior=(old/"old-index.php").read_text()
          assert prior.replace("const ROOT='https://mojplaywin.com/checkout/crypto/';","const ROOT='https://mojplaywin.com/checkout/crypto/index.php';")==current, "Unexpected changes to deployed index, refuse hotfix"
          current_boot=Path("isolated_crypto_gateway/bootstrap.php").read_text()
          old_boot=(old/"old-bootstrap.php").read_text()
          assert old_boot!=current_boot and "PHP_SAPI !== 'cli'" in current_boot
          assert "http_response_code(404)" in current_boot
          print("REVIEWED_GATEWAY_ROUTE_DIFF=passed")
          PY
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"


      - name: Update only disabled gateway PHP files and verify site health
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          stage="/home/zomorod2/.mojplaywin-crypto-hotfix-$GITHUB_RUN_ID"
          ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cleanup() {
            ssh -T -F "$d/config" saeit-cpanel "test -d '$stage' && rm -f -- '$stage/index.php' '$stage/bootstrap.php' '$stage/old_index.php' '$stage/old_bootstrap.php' '$stage/hotfix.py' && rmdir -- '$stage'" || true
          }
          trap cleanup EXIT
          files=(isolated_crypto_gateway/index.php isolated_crypto_gateway/bootstrap.php)
          for file in "${files[@]}"; do
            name="${file##*/}"
            ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/$name'" < "$file"
            ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/old_$name'" < "$RUNNER_TEMP/old-$name"
          done
          ssh -T -F "$d/config" saeit-cpanel "umask 077; cat > '$stage/hotfix.py'" < scripts/mojplaywin_crypto_disabled_hotfix.py
          paths=(/ /store/ /farnaz/ /taniya/ /mojtaba.roozegar/ /saman/)
          for path in "${paths[@]}"; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            echo "${path//[^[:alnum:]]/_}=$code" >> "$RUNNER_TEMP/before.txt"
          done
          timeout 40s ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/hotfix.py' '$stage' '$GITHUB_RUN_ID'"
          timeout 20s ssh -T -F "$d/config" saeit-cpanel "php -l '/home/zomorod2/mojplaywin.com/checkout/crypto/index.php' && php -l '/home/zomorod2/mojplaywin.com/checkout/crypto/bootstrap.php' && php '/home/zomorod2/mojplaywin.com/checkout/crypto/bootstrap.php' status"
          code="$(curl -sS -o "$RUNNER_TEMP/disabled-page" -w '%{http_code}' --max-time 20 https://mojplaywin.com/checkout/crypto/index.php)"
          echo "ISOLATED_PAYMENT_ROUTE_WHILE_DISABLED=$code"
          test "$code" = 503
          code="$(curl -sS -o "$RUNNER_TEMP/bootstrap-denied" -w '%{http_code}' --max-time 20 https://mojplaywin.com/checkout/crypto/bootstrap.php)"
          echo "PRIVATE_BOOTSTRAP_NOT_PUBLIC_HTTP=$code"
          test "$code" = 404
          for path in "${paths[@]}"; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            echo "${path//[^[:alnum:]]/_}=$code" >> "$RUNNER_TEMP/after.txt"
          done
          diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          echo "MAIN_AND_PROTECTED_SITE_SMOKE_UNCHANGED=true"
          echo "CUSTOMER_FUNDS_COLLECTED=false"
          echo "PAYMENTS_ENABLED=false"
