name: Zomorod controlled npm cache cleanup
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-safe-npm-cache-cleanup-20261107.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-safe-npm-cache-cleanup-20261107
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-npm-cleanup"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "PINNED_RELAY=verified"
      - name: Stop forbidden desktop commander and clean only npm caches
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-npm-cleanup"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,signal,stat,subprocess,time
          from pathlib import Path
          exact_tokens=("npm exec @wonderwhy-er/desktop-commander@0.2.51 remote","/desktop-commander/dist/index.js","lsnode:/home/zomorod2/desktop-commander/")
          def matches():
              out=[]
              for ent in Path("/proc").glob("[0-9]*"):
                  try:
                      pid=int(ent.name)
                      if pid==os.getpid(): continue
                      raw=(ent/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace").strip()
                      if any(tok in raw for tok in exact_tokens): out.append((pid,raw))
                  except (OSError,ValueError): pass
              return out
          before=matches()
          print("COMMANDER_BEFORE="+str(len(before)),flush=True)
          for pid,cmd in before:
              try: os.kill(pid,signal.SIGTERM)
              except ProcessLookupError: pass
          time.sleep(5)
          left=matches()
          for pid,cmd in left:
              try: os.kill(pid,signal.SIGKILL)
              except ProcessLookupError: pass
          time.sleep(1)
          if matches(): raise SystemExit("forbidden desktop commander process still active")
          print("COMMANDER_AFTER=0",flush=True)
          targets=[Path("/home/zomorod2/.npm/_npx"),Path("/home/zomorod2/.npm/_cacache")]
          for target in targets:
              if target.is_symlink(): raise SystemExit("unexpected symlink cache target: "+str(target))
          for target in targets:
              if target.is_dir(): subprocess.run(["rm","-rf","--",str(target)],check=True)
          logs=Path("/home/zomorod2/.npm/_logs")
          removed=0
          if logs.is_dir() and not logs.is_symlink():
              for p in logs.iterdir():
                  try:
                      s=p.lstat()
                      if stat.S_ISREG(s.st_mode) and s.st_uid==os.geteuid() and s.st_mtime < time.time()-7*86400:
                          p.unlink(); removed+=s.st_size
                  except (OSError,FileNotFoundError): pass
          print("NPM_CACHE_CLEANED=1",flush=True)
          print("NPM_OLD_LOG_BYTES_REMOVED="+str(removed),flush=True)
          for target in (Path("/home/zomorod2/.npm"),):
              du=subprocess.run(["du","-x","-s","-k",str(target)],capture_output=True,text=True,check=True)
              print("NPM_AFTER_KIB="+du.stdout.split()[0],flush=True)
          PY
      - name: Verify public site and forbidden process absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsS --max-time 20 -o /dev/null -w '%{http_code}' https://zomorodmelal.ir/)" = "200"
          d="$RUNNER_TEMP/zomorod-npm-cleanup"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os
          from pathlib import Path
          for ent in Path("/proc").glob("[0-9]*"):
              try:
                  raw=(ent/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace")
                  if "desktop-commander" in raw: raise SystemExit("desktop commander remains: "+raw)
              except (OSError,ValueError): pass
          print("POSTCHECK_COMMANDER=absent",flush=True)
          PY
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/zomorod-npm-cleanup"
          if test -d "$d"; then rm -rf -- "$d"; fi
