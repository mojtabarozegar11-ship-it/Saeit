          -----END CERTIFICATE-----
          CERT
          cat <<'PY' | timeout 80s ssh -T -F "$d/config" company python3 - > "$d/private-replies.json"
          from pathlib import Path
          from email import policy
          from email.parser import BytesParser
          from email.utils import parseaddr
          from html import unescape
          from datetime import datetime,timezone
          import re, json, os
          root=Path.home()/"mail"/"zomorodmelal.ir"/"moj_1ro_1"
          cutoff=datetime(2026,10,20,tzinfo=timezone.utc).timestamp()
          out=[]
          def visible_text(msg):
              candidates=[]
              for part in msg.walk():
                  if part.is_multipart():continue
                  if part.get_content_disposition()=="attachment":continue
                  typ=part.get_content_type()
                  if typ not in ("text/plain","text/html"):continue
                  try:s=part.get_content()
                  except Exception:continue
                  if not isinstance(s,str):continue
                  if typ=="text/html":
                      s=re.sub(r"(?is)<(style|script)[^>]*>.*?</\\1>"," ",s)
                      s=re.sub(r"(?is)<[^>]*>"," ",s)
                      s=unescape(s)
                  s=re.sub(r"\\s+"," ",s).strip()
                  if s:candidates.append((0 if typ=="text/plain" else 1,len(s),s))
              candidates.sort(key=lambda item:(item[0],-item[1]))
              return candidates[0][2][:7000] if candidates else ""
          for folder in ("new","cur"):
              p=root/folder
              if not p.is_dir():continue
              for mail in p.iterdir():
                  if not mail.is_file() or mail.stat().st_mtime<cutoff:continue
                  try:
                      with mail.open("rb") as f:raw=f.read(3_500_000)
                      msg=BytesParser(policy=policy.default).parsebytes(raw)
                      addr=parseaddr(str(msg.get("From","")))[1].lower()
                      sub=str(msg.get("Subject","")).lower()
                      auto=str(msg.get("Auto-Submitted","")).lower()
                      if not addr or addr.endswith("@zomorodmelal.ir"):continue
                      if "mailer-daemon" in addr or "postmaster" in addr or "delivery status" in sub or "undeliver" in sub or "failure notice" in sub:continue
                      if auto and auto!="no":continue
                      attachments=[{"filename":str(x.get_filename() or "(unnamed)")[:150],"content_type":str(x.get_content_type()),"size":len(x.get_payload(decode=True) or b"")} for x in msg.walk() if x.get_content_disposition()=="attachment"]
                      body=visible_text(msg)
                      out.append({"from":str(msg.get("From",""))[:300],"subject":str(msg.get("Subject",""))[:300],"date":str(msg.get("Date",""))[:120],"reply_headers":bool(msg.get("In-Reply-To") or msg.get("References")),"text":body,"attachments":attachments,"message_bytes":len(raw),"message_id":str(msg.get("Message-ID",""))[:200]})
                  except Exception as e:out.append({"processing_error_type":type(e).__name__})
          print(json.dumps({"scope":"company_mailbox_2026-10-20_onward","candidates":len(out),"messages":out},ensure_ascii=False))
          PY
          python3 -m json.tool "$d/private-replies.json" > /dev/null
          openssl cms -encrypt -binary -aes256 -in "$d/private-replies.json" -outform DER -out "$d/private-replies.cms" "$d/transfer-cert.pem"
          shred -u "$d/private-replies.json"
          echo 'ENCRYPTED_SUPPLIER_REPORT_BEGIN'
          base64 -w76 "$d/private-replies.cms"
          echo 'ENCRYPTED_SUPPLIER_REPORT_END'
          echo 'CONTENT_EXPOSED_IN_LOGS=NO'
      - name: Secure cleanup of report, cert, and SSH keys
        if: always()
        run: |
          d="$RUNNER_TEMP/company-mail-inspect"
          test ! -d "$d" || find "$d" -maxdepth 1 -type f -exec shred -u {} +
