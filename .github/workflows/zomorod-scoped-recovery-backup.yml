name: Zomorod private scoped recovery snapshot
on:
  push:
    branches: [codex/zomorod-backup-preflight]
    paths:
      - .github/workflows/zomorod-scoped-recovery-backup.yml
permissions:
  contents: read
concurrency:
  group: zomorod-scoped-recovery-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-scoped-backup"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Create private site, code, and database snapshot
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-scoped-backup"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          sha="$1"
          home=/home/zomorod2
          web="$home/public_html"
          app="$home/Saeit"
          target="$home/.backups/zomorodmelal-complete/$sha"
          test -d "$web" && test -d "$app" && test -f "$web/.htaccess"
          test "$(stat -c %U "$web")" = zomorod2
          test "$(stat -c %U "$app")" = zomorod2
          test ! -e "$target"
          mkdir -p "$target"/{database,verify}
          printf 'SNAPSHOT_SHA=%s\n' "$sha" > "$target/README.restore.txt"
          printf 'SNAPSHOT_CREATED_UTC=%s\n' "$(date -u +%FT%TZ)" >> "$target/README.restore.txt"
          printf 'WEBROOT=%s\nAPPROOT=%s\n' "$web" "$app" >> "$target/README.restore.txt"
          tar -C "$home" -czf "$target/public_html.tar.gz" public_html
          tar -C "$app" --exclude='./.git' --exclude='./var' --exclude='./venv' --exclude='./.venv' --exclude='./node_modules' --exclude='./__pycache__' --exclude='./staticfiles' --exclude='./.cache' --exclude='./tmp' --exclude='./logs' --exclude='./backups' -czf "$target/application-source.tar.gz" .
          if test -f "$app/.env"; then cp -p "$app/.env" "$target/application.env"; chmod 600 "$target/application.env"; fi
          cp -p "$web/.htaccess" "$target/root.htaccess"
          python3 - "$app" "$target/database" "$target/database-manifest.json" <<'PY'
          import hashlib,json,pathlib,sqlite3,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); manifest=pathlib.Path(sys.argv[3])
          candidates=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".sqlite3",".sqlite",".db"}: continue
              parts={x.lower() for x in p.parts}
              if ".git" in parts or "backups" in parts or "staticfiles" in parts: continue
              candidates.append(p)
          rows=[]
          for src in sorted(candidates):
              rel=src.relative_to(root)
              dst=out/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              try:
                  with sqlite3.connect(f"file:{src}?mode=ro",uri=True,timeout=30) as source:
                      with sqlite3.connect(dst) as target:
                          source.backup(target,pages=2048,sleep=0.05)
                          check=target.execute("PRAGMA quick_check").fetchone()[0]
                          if check!="ok": raise RuntimeError(f"SQLite quick_check failed: {rel}")
              except Exception as e:
                  raise SystemExit(f"SQLITE_SNAPSHOT_FAILED {rel}: {type(e).__name__}")
              digest=hashlib.sha256(dst.read_bytes()).hexdigest()
              rows.append({"path":str(rel),"snapshot":str(dst.relative_to(out)),"bytes":dst.stat().st_size,"sha256":digest,"quick_check":"ok"})
          manifest.write_text(json.dumps({"count":len(rows),"databases":rows},ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"SQLITE_SNAPSHOT_COUNT={len(rows)}")
          print("SQLITE_SNAPSHOTS_QUICK_CHECK=passed")
          PY
          test -s "$target/public_html.tar.gz"
          test -s "$target/application-source.tar.gz"
          gzip -t "$target/public_html.tar.gz"
          gzip -t "$target/application-source.tar.gz"
          python3 - "$target/public_html.tar.gz" "$target/application-source.tar.gz" "$target" <<'PY'
          import pathlib,sys,tarfile
          for archive in map(pathlib.Path,sys.argv[1:3]):
              with tarfile.open(archive,"r:gz") as tf:
                  names=0
                  for member in tf:
                      parts=pathlib.PurePosixPath(member.name).parts
                      if pathlib.PurePosixPath(member.name).is_absolute() or ".." in parts:
                          raise SystemExit("BACKUP_ARCHIVE_PATH=unsafe")
                      names+=1
                  if names==0: raise SystemExit("BACKUP_ARCHIVE_EMPTY")
                  print(f"ARCHIVE_VALID={archive.name} MEMBERS={names} BYTES={archive.stat().st_size}")
          root=pathlib.Path(sys.argv[3])
          for name in ("root.htaccess","README.restore.txt","database-manifest.json"):
              if not (root/name).is_file(): raise SystemExit(f"SNAPSHOT_COMPONENT_MISSING={name}")
          PY
          mkdir -p "$target/verify/webroot"
          tar -xzf "$target/public_html.tar.gz" -C "$target/verify/webroot" public_html/index.html public_html/.htaccess
          cmp -s "$web/index.html" "$target/verify/webroot/public_html/index.html"
          cmp -s "$web/.htaccess" "$target/verify/webroot/public_html/.htaccess"
          python3 - "$target/database-manifest.json" "$target/database" <<'PY'
          import hashlib,json,pathlib,sqlite3,sys
          data=json.load(open(sys.argv[1],encoding="utf-8")); root=pathlib.Path(sys.argv[2])
          for item in data["databases"]:
              p=root/item["snapshot"]
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=item["sha256"]:
                  raise SystemExit("DATABASE_SNAPSHOT_HASH=failed")
              with sqlite3.connect(f"file:{p}?mode=ro",uri=True) as db:
                  if db.execute("PRAGMA quick_check").fetchone()[0]!="ok":
                      raise SystemExit("DATABASE_RESTORE_TEST=failed")
          print("DATABASE_RESTORE_TEST=passed")
          print("DATABASE_FILES_VERIFIED="+str(data["count"]))
          PY
          rm -rf -- "$target/verify"
          printf 'PUBLIC_HTML_BYTES=%s\n' "$(stat -c %s "$target/public_html.tar.gz")"
          printf 'APP_SOURCE_BYTES=%s\n' "$(stat -c %s "$target/application-source.tar.gz")"
          printf 'PUBLIC_HTML_SHA256=%s\n' "$(sha256sum "$target/public_html.tar.gz" | awk '{print $1}')"
          printf 'APP_SOURCE_SHA256=%s\n' "$(sha256sum "$target/application-source.tar.gz" | awk '{print $1}')"
          printf 'SNAPSHOT_PATH=%s\n' "$target"
          echo "SCOPED_RESTORE_TEST=passed"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-scoped-backup"
