name: Publish Zomorod Melal homepage safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-root-publish.yml"
      - "public/index.html"
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  publish-root-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Persian homepage source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          source=Path("public/index.html").read_text(encoding="utf-8")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rtl=False; self.title=False; self.canonical=False; self.h1=False
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="html": self.rtl=a.get("lang")=="fa" and a.get("dir")=="rtl"
                  if tag=="title": self.title=True
                  if tag=="h1": self.h1=True
                  if tag=="link" and a.get("rel")=="canonical":
                      self.canonical=a.get("href")=="https://zomorodmelal.ir/"
                  if tag=="a": self.links.append(a.get("href",""))
          check=Check(); check.feed(source)
          required=("https://zomorodmelal.ir/amozeshgah/","https://mojplaywin.com/")
          if not all((check.rtl,check.title,check.canonical,check.h1)) or not all(x in check.links for x in required):
              raise SystemExit("Homepage metadata, RTL structure, heading, or live links are missing")
          if len(source.encode("utf-8")) < 6000:
              raise SystemExit("Homepage source is unexpectedly small")
          print("ROOT_HOMEPAGE_SOURCE=valid")
          print(f"ROOT_HOMEPAGE_BYTES={len(source.encode('utf-8'))}")
          PY
      - name: Prepare the confirmed pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-root"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Preflight root ownership and preserve the production app
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/zomorod2/public_html
          test -d "$root" && test "$(stat -c %U "$root")" = "zomorod2" && test -w "$root"
          test -f "$root/.htaccess"
          backup="$HOME/.backups/zomorodmelal-amozeshgah/htaccess.20261014T235252Z"
          test -f "$backup" && cmp -s "$root/.htaccess" "$backup"
          test ! -e "$root/index.html" && test ! -L "$root/index.html"
          raw="$(uapi --output=json PassengerApps list_applications)"
          printf '%s' "$raw" | python3 -c 'import json,sys; d=json.load(sys.stdin); stack=[d]; found=[]
while stack:
 x=stack.pop()
 if isinstance(x,dict):
  if str(x.get("domain","")).lower()=="zomorodmelal.ir" and x.get("base_uri")=="/": found.append(x.get("enabled"))
  stack.extend(x.values())
 elif isinstance(x,list): stack.extend(x)
if not found or any(str(v).lower() not in ("0","false") for v in found): raise SystemExit("Root Passenger app is missing or enabled; refusing static publication")
print("ROOT_PASSENGER_APP_DISABLED=yes")'
          echo ROOT_DIRECTORY_OWNER=zomorod2
          echo ROOT_HTACCESS_UNCHANGED=yes
          echo ROOT_INDEX_AVAILABLE=yes
          REMOTE
      - name: Stage and atomically publish root index only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          root=/home/zomorod2/public_html
          stage="$root/.zomorod-root-stage-$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel "set -eu; test ! -e '$root/index.html' && test ! -L '$root/index.html'; test ! -e '$stage'; mkdir -m 700 '$stage'"
          tar -C public -czf - index.html | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          sha="$(sha256sum public/index.html | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel "set -eu; test -s '$stage/index.html'; test \"$(sha256sum '$stage/index.html' | awk '{print \\\$1}')\" = '$sha'; chmod 644 '$stage/index.html'; mv -T '$stage/index.html' '$root/index.html'; rmdir '$stage'; test -s '$root/index.html'; echo ROOT_INDEX_INSTALLED=yes"
      - name: Verify apex and www, roll back if either fails
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          failed=0
          for url in https://zomorodmelal.ir/ https://www.zomorodmelal.ir/; do
            file="$d/$(printf '%s' "$url" | sed 's#https://##; s#/#_#g; s#\\.#_#g').html"
            result="$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}|%{content_type}|%{url_effective}' "$url" || true)"
            code="${result%%|*}"
            type="$(printf '%s' "$result" | cut -d '|' -f2)"
            printf 'PUBLIC_ROOT_CHECK %s result=%s\n' "$url" "$result"
            if [ "$code" != "200" ] || [[ "$type" != text/html* ]] || ! grep -Fq 'شرکت کشت و صنعت زمرد ملل | دانش، تولید و آینده' "$file" || ! grep -Fq 'https://zomorodmelal.ir/amozeshgah/' "$file"; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/zomorod2/public_html
          backup="$HOME/.backups/zomorodmelal-root-homepage/index-failed-$GITHUB_SHA"
          if test -f "$root/index.html" && grep -Fq '<!-- saeit-zomorod-root-homepage-v1 -->' "$root/index.html"; then
            install -d -m 700 "$HOME/.backups/zomorodmelal-root-homepage"
            test ! -e "$backup"
            mv -T "$root/index.html" "$backup"
          fi
          echo ROOT_PUBLICATION_ROLLED_BACK=yes
          REMOTE
            exit 1
          fi
          echo ROOT_APEX_AND_WWW_VALIDATION=passed
          grep -F '<title>' "$d/zomorodmelal.ir_.html" | head -1
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-root"
