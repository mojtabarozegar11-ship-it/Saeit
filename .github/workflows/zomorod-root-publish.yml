name: Publish Zomorod Melal homepage safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-root-publish.yml"
      - "public/index.html"
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  publish-root-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Persian homepage source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          source=Path("public/index.html").read_text(encoding="utf-8")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rtl=False; self.title=False; self.canonical=False; self.h1=False
                  self.products=False; self.image_count=0; self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="html": self.rtl=a.get("lang")=="fa" and a.get("dir")=="rtl"
                  if tag=="title": self.title=True
                  if tag=="h1": self.h1=True
                  if tag=="section" and a.get("id")=="products": self.products=True
                  if tag=="img": self.image_count+=1
                  if tag=="link" and a.get("rel")=="canonical":
                      self.canonical=a.get("href")=="https://zomorodmelal.ir/"
                  if tag=="a": self.links.append(a.get("href",""))
          check=Check(); check.feed(source)
          required=("https://zomorodmelal.ir/amozeshgah/","https://mojplaywin.com/")
          if not all((check.rtl,check.title,check.canonical,check.h1,check.products)) or check.image_count < 4 or not all(x in check.links for x in required):
              raise SystemExit("Homepage metadata, products, images, RTL structure, heading, or live links are missing")
          if "border:6px double var(--gold)" not in source:
              raise SystemExit("The approved thick gold frame is missing")
          if "<!-- saeit-zomorod-root-homepage-v1 -->" not in source or len(source.encode("utf-8")) < 6000:
              raise SystemExit("Managed homepage marker is missing or the source is unexpectedly small")
          print("ROOT_HOMEPAGE_SOURCE=valid")
          print(f"ROOT_HOMEPAGE_BYTES={len(source.encode('utf-8'))}")
          PY
      - name: Prepare the confirmed pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-root"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Preflight root ownership and preserve the production app
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/zomorod2/public_html
          test -d "$root" && test "$(stat -c %U "$root")" = "zomorod2" && test -w "$root"
          backup="$HOME/.backups/zomorodmelal-amozeshgah/htaccess.20261014T235252Z"
          test -f "$root/.htaccess" && test -f "$backup" && cmp -s "$root/.htaccess" "$backup"
          if test -e "$root/index.html" || test -L "$root/index.html"; then
            test -f "$root/index.html" && test ! -L "$root/index.html"
            grep -Fq '<!-- saeit-zomorod-root-homepage-v1 -->' "$root/index.html"
            echo ROOT_INDEX=MANAGED_VERSION_PRESENT
          else
            echo ROOT_INDEX=AVAILABLE
          fi
          raw="$HOME/.root-app-audit-$$.json"
          trap 'rm -f -- "$raw"' EXIT
          uapi --output=json PassengerApps list_applications > "$raw"
          python3 - "$raw" <<'PY'
          import json
          import sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          stack=[data]; states=[]
          while stack:
              value=stack.pop()
              if isinstance(value,dict):
                  if str(value.get("domain","")).lower()=="zomorodmelal.ir" and value.get("base_uri")=="/":
                      states.append(value.get("enabled"))
                  stack.extend(value.values())
              elif isinstance(value,list):
                  stack.extend(value)
          if not states or any(str(value).lower() not in ("0","false") for value in states):
              raise SystemExit("Root Passenger app is missing or enabled; refusing static publication")
          print("ROOT_PASSENGER_APP_DISABLED=yes")
          PY
          echo ROOT_DIRECTORY_OWNER=zomorod2
          echo ROOT_HTACCESS_UNCHANGED=yes
          REMOTE
      - name: Stage and atomically publish the managed homepage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          root=/home/zomorod2/public_html
          stage="$root/.zomorod-root-stage-$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel "set -eu; test ! -e '$stage'; mkdir -m 700 '$stage'"
          tar -C public -czf - index.html | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          expected_sha="$(sha256sum public/index.html | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel bash -s -- "$expected_sha" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          commit_sha="$2"
          root=/home/zomorod2/public_html
          stage="$root/.zomorod-root-stage-$commit_sha"
          target="$root/index.html"
          backup="$HOME/.backups/zomorodmelal-root-homepage/index-previous-$commit_sha"
          actual_sha="$(sha256sum "$stage/index.html" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          if test -f "$target"; then
            grep -Fq '<!-- saeit-zomorod-root-homepage-v1 -->' "$target"
            current_sha="$(sha256sum "$target" | awk '{print $1}')"
            if test "$current_sha" = "$expected_sha"; then
              rm -f -- "$stage/index.html"
              rmdir "$stage"
              echo ROOT_INDEX_ALREADY_CURRENT=yes
              exit 0
            fi
            install -d -m 700 "$HOME/.backups/zomorodmelal-root-homepage"
            test ! -e "$backup"
            cp -p "$target" "$backup"
          fi
          chmod 644 "$stage/index.html"
          mv -T "$stage/index.html" "$target"
          rmdir "$stage"
          test -s "$target"
          echo ROOT_INDEX_INSTALLED=yes
          REMOTE
      - name: Verify root and education routes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          failed=0
          for url in https://zomorodmelal.ir/ https://www.zomorodmelal.ir/; do
            name="$(printf '%s' "$url" | sed 's#https://##; s#/#_#g; s#\.#_#g')"
            file="$d/$name.html"
            result="$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}|%{content_type}|%{url_effective}' "$url" || true)"
            code="${result%%|*}"
            type="$(printf '%s' "$result" | cut -d '|' -f2)"
            printf 'PUBLIC_ROOT_CHECK %s result=%s\n' "$url" "$result"
            if [ "$code" != "200" ] || [[ "$type" != text/html* ]] || ! grep -Fq '<!-- saeit-zomorod-root-homepage-v1 -->' "$file" || ! grep -Fq 'https://zomorodmelal.ir/amozeshgah/' "$file"; then failed=1; fi
          done
          for image in platform-home agriculture smart-agriculture industry; do
            image_result="$(curl --silent --show-error --location --retry 1 --max-time 30 -o /dev/null -w '%{http_code}|%{content_type}' "https://zomorodmelal.ir/static/site/heroes/$image.webp" || true)"
            image_code="${image_result%%|*}"
            image_type="${image_result#*|}"
            printf 'ROOT_IMAGE_CHECK %s result=%s\\n' "$image" "$image_result"
            if [ "$image_code" != "200" ] || [[ "$image_type" != image/* ]]; then failed=1; fi
          done
          for url in https://zomorodmelal.ir/amozeshgah/ https://zomorodmelal.ir/education/; do
            name="$(printf '%s' "$url" | sed 's#https://##; s#/#_#g; s#\.#_#g')"
            file="$d/$name.html"
            result="$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}|%{content_type}|%{url_effective}' "$url" || true)"
            code="${result%%|*}"
            printf 'PUBLIC_EDUCATION_CHECK %s result=%s\n' "$url" "$result"
            if [ "$code" != "200" ] || ! grep -Fq 'آموزشگاه زمرد ملل' "$file"; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            ssh -F "$d/config" saeit-cpanel bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          commit_sha="$1"
          root=/home/zomorod2/public_html
          target="$root/index.html"
          backup="$HOME/.backups/zomorodmelal-root-homepage/index-previous-$commit_sha"
          if test -f "$backup"; then
            if test -f "$target" && grep -Fq '<!-- saeit-zomorod-root-homepage-v1 -->' "$target"; then
              failed="$HOME/.backups/zomorodmelal-root-homepage/index-failed-$commit_sha"
              test ! -e "$failed"
              mv -T "$target" "$failed"
            fi
            mv -T "$backup" "$target"
            echo ROOT_PUBLICATION_ROLLED_BACK=yes
          else
            echo ROOT_PUBLICATION_RETAINED_PREVIOUSLY_VERIFIED_VERSION=yes
          fi
          REMOTE
            exit 1
          fi
          echo ROOT_APEX_AND_WWW_VALIDATION=passed
          echo EDUCATION_AND_LEGACY_URL_VALIDATION=passed
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-root"
