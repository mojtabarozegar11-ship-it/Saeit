name: Zomorod origin listener and hosting diagnosis — read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-origin-listeners-20261023.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  origin:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pinned VPS/cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Read-only socket, service ownership, host health and public network matrix
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          for node in host vps; do
            echo "CHECK_NODE=$node"
            timeout 70s ssh -T -F "$d/config" "$node" 'python3 -' <<'PY'
          import os,sys,shutil,socket,subprocess,platform,stat,time
          from pathlib import Path
          host="zomorodmelal.ir"
          print("USER_CAN_RESTART_SYSTEM_SERVICES",os.geteuid()==0)
          print("PLATFORM",platform.system())
          for name in ("ss","netstat","ps","systemctl","curl","uapi","whmapi1","apachectl","httpd","nginx","litespeed","lshttpd"):
              print("CMD_EXISTS",name,bool(shutil.which(name)))
          try:
              for proto in ("tcp","tcp6"):
                  f=Path("/proc/net/"+proto)
                  if not f.is_file():continue
                  listen=set()
                  for row in f.read_text().splitlines()[1:]:
                      a=row.split()
                      if a[3]!="0A":continue
                      listen.add(int(a[1].rsplit(":",1)[1],16))
                  for port in (80,443,2083,2087,8080,8443):
                      print("PROC_LISTEN",proto,port,port in listen)
          except Exception as e:print("PROC_NET_READ_ERROR",type(e).__name__)
          try:
              p=subprocess.run(["ps","-eo","comm="],capture_output=True,text=True,timeout=7)
              names=p.stdout.lower().splitlines()
              for service in ("httpd","apache2","nginx","litespeed","lshttpd","cpsrvd","php-fpm","lsphp","passenger","varnish"):
                  print("SERVICE_PROCESS",service,any(service in n for n in names))
          except Exception as e:print("PROCESS_LIST_ERROR",type(e).__name__)
          try:
              dns=socket.getaddrinfo(host,None,type=socket.SOCK_STREAM)
              addrs=sorted({x[4][0] for x in dns})
              machine=sorted({x[4][0] for x in socket.getaddrinfo(socket.gethostname(),None,type=socket.SOCK_STREAM)})
              print("DNS_ADDRESS_COUNT",len(addrs),"DNS_EQUALS_HOST_ADDRESS",bool(set(addrs)&set(machine)))
              for port in (80,443,2083):
                  for label,target in (("loopback","127.0.0.1"),("public-dns",addrs[0] if addrs else "127.0.0.1")):
                      try:
                          s=socket.create_connection((target,port),timeout=3);s.close();print("TCP_PROBE",label,port,"open")
                      except OSError as e:print("TCP_PROBE",label,port,type(e).__name__)
          except Exception as e:print("NETWORK_MATRIX_ERROR",type(e).__name__)
          try:
              v=os.statvfs(str(Path.home()))
              print("HOME_AVAILABLE_GB",round(v.f_bavail*v.f_frsize/1e9,2))
          except Exception as e:print("DISK_ERROR",type(e).__name__)
          if Path.home().joinpath("public_html").is_dir():
              print("CPANEL_PUBLIC_HTML_EXISTS",True)
              p=Path.home()/"public_html"/"index.html"
              print("CPANEL_ROOT_INDEX_EXISTS",p.is_file())
          PY
          done
      - name: Separate runner external HTTP check without cache
        shell: bash
        run: |
          set -euo pipefail
          for protocol in http https; do
            status="$(curl -kLsS --connect-timeout 5 --max-time 12 -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code} %{remote_ip}' "$protocol://zomorodmelal.ir/" 2>/dev/null || true)"
            echo "EXTERNAL_PROTOCOL_RESULT $protocol ${status%% *}"
          done

      - name: Diagnose 503 server-vs-proxy from cPanel, VPS and external runner without changing files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          for node in host vps; do
            echo "HTTP_TRIAGE_NODE=$node"
            timeout 100s ssh -T -F "$d/config" "$node" 'python3 -' <<'PY'
          import subprocess,re,sys
          urls=[
          ("public_home","https://zomorodmelal.ir/"),
          ("public_old_static","https://zomorodmelal.ir/games/water-path/"),
          ("public_water","https://zomorodmelal.ir/agriculture/water-soil/"),
          ("loopback_http","http://127.0.0.1/"),
          ("loopback_https","https://zomorodmelal.ir/")
          ]
          for label,url in urls:
              args=["curl","-k","-sS","--connect-timeout","5","--max-time","10",
                    "-H","Cache-Control: no-cache","-H","Host: zomorodmelal.ir",
                    "-D","-","-o","/dev/null","-w","HTTP_STATUS:%{http_code}"]
              if label=="loopback_https":args+=["--resolve","zomorodmelal.ir:443:127.0.0.1"]
              result=subprocess.run(args+[url],capture_output=True,text=True,timeout=13)
              status=re.search(r"HTTP_STATUS:(\d+)",result.stdout)
              headers=[line.strip() for line in result.stdout.splitlines()
                 if re.match(r"(?i)^(http/|server:|via:|content-type:|retry-after:|cache-control:|x-cache:|cf-cache-status:|location:)",line)]
              print("HTTP_PROBE",label,"status",status.group(1) if status else "NA","curl_rc",result.returncode,
                    "headers",";".join(headers[:7])[:270],
                    "error_type",("timeout" if result.returncode==28 else "connection" if result.returncode==7 else "tls" if result.returncode in (35,60) else "none" if result.returncode==0 else "other"))
          PY
          done
          echo "HTTP_TRIAGE_NODE=runner"
          for target in https://zomorodmelal.ir/ https://zomorodmelal.ir/games/water-path/; do
            headers="$(curl -sS --connect-timeout 6 --max-time 12 -H 'Cache-Control: no-cache' -D - -o /dev/null -w 'CODE:%{http_code}' "$target" 2>/dev/null || true)"
            printf '%s\n' "$headers" | grep -Eai '^(HTTP/|server:|retry-after:|via:|content-type:|CODE:)' | head -n 12 || true
          done

      - name: Pinpoint public 503 response source and domain-host IP mapping read only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          for node in host vps; do
            echo "DOMAIN_ROUTING_NODE=$node"
            timeout 80s ssh -T -F "$d/config" "$node" 'python3 -' <<'PY'
          import socket,subprocess,re,hashlib
          from pathlib import Path
          a="zomorodmelal.ir"
          for label,name in (("domain",a),("cpanel_hostname","zohal.pws-dns.net")):
              try:
                  x={z[4][0] for z in socket.getaddrinfo(name,443,type=socket.SOCK_STREAM)}
                  print("DNS_SET",label,"ipv4_count",len([i for i in x if ":" not in i]),"ipv6_count",len([i for i in x if ":" in i]))
                  if label=="domain":domainips=x
                  if label=="cpanel_hostname":hostips=x
              except Exception as e:print("DNS_ERROR",label,type(e).__name__)
          try:print("DOMAIN_AND_CPANEL_DNS_INTERSECT",bool(domainips&hostips))
          except NameError:pass
          probes=[
              ("public_default",["https://"+a+"/"]),
              ("public_html_file",["https://"+a+"/games/seed-guardian/"]),
              ("origin_local",["--resolve",a+":443:127.0.0.1","https://"+a+"/"]),
          ]
          if 'hostips' in locals():
              for ip in sorted(hostips):
                  if ":" not in ip:probes.append(("hostname_resolved_as_origin",["--resolve",a+":443:"+ip,"https://"+a+"/"]))
          for label,extra in probes:
              args=["curl","-k","-sS","-L","--connect-timeout","5","--max-time","10","-H","Cache-Control: no-cache",
                    "-D","-","-w","\nRESULT_STATUS=%{http_code}\n"]
              p=subprocess.run(args+extra,capture_output=True,text=True,timeout=13)
              data=p.stdout
              status=re.search(r"RESULT_STATUS=(\d+)",data)
              body=data.split("\r\n\r\n")[-1].split("\nRESULT_STATUS=")[0]
              body=re.sub(r"<[^>]*>"," ",body)
              body=re.sub(r"\s+"," ",body)[:220]
              body=re.sub(r"(?i)([a-z0-9._%-]+@[a-z0-9.-]+\.[a-z]{2,})","[email-redacted]",body)
              print("RESPONSE_SIGNATURE",label,"code",status.group(1) if status else "NA",
                 "curl_rc",p.returncode,"body_hint",body[:180],
                 "server_mention",bool(re.search(r"(?i)cloudflare|litespeed|imunify|resource limit|maintenance|proxy|server unavailable",data)))
          PY
          done
      - name: Remove temporary pinned relay credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/farm-v4-ssh"
