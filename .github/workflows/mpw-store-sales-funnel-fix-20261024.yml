name: MojPlayWin store purchase path cleanup
# Exact production template SHA verified by the store-only preflight.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-store-sales-funnel-fix-20261024.yml"
      - "core/templates/mojplaywin/store.html"
      - "core/templates/mojplaywin/site_base.html"
      - "scripts/mpw_store_sales_funnel_fix_20261024.py"
permissions: {contents: read}
concurrency:
  group: mojplaywin-store-sales-funnel-onefile
  cancel-in-progress: false
jobs:
  publish-store-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[MPW_STORE_SALES_FIX_20261024]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact reviewed source
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_store_sales_funnel_fix_20261024.py
          actual_sha="$(python3 -c 'import hashlib,pathlib; data=pathlib.Path("core/templates/mojplaywin/store.html").read_bytes().replace(bytes([13,10]),bytes([10])); print(hashlib.sha256(data).hexdigest())')"
          echo "MPW_STORE_SOURCE_SHA=$actual_sha"
          echo "MPW_STORE_MARKERS=$(grep -cE 'mpw-store-ten-guides|Explore this collection' core/templates/mojplaywin/store.html || true)"
          test "$actual_sha" = "8ca116ae7ba02ee12441fd865b48fbc17e187c981709cff0ceec5015d414eef3"
          test "$(grep -cE 'mpw-store-ten-guides|Explore this collection' core/templates/mojplaywin/store.html || true)" = "0"
          echo MPW_STORE_SOURCE_VALID=true
      - name: Capture baseline storefront and protected-route health
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          urls=[
            "https://mojplaywin.com/",
            "https://mojplaywin.com/store/",
            "https://mojplaywin.com/store/product/72/",
            "https://mojplaywin.com/store/product/225/",
            "https://mojplaywin.com/store/product/879/",
            "https://mojplaywin.com/taniya/",
            "https://mojplaywin.com/farnaz/",
            "https://mojplaywin.com/saman/",
            "https://zomorodmelal.ir/",
          ]
          status={}
          for url in urls:
            req=urllib.request.Request(url,headers={"User-Agent":"MPWStoreSalesFix/1.0","Cache-Control":"no-cache"})
            try:
              with urllib.request.urlopen(req,timeout=20) as response:
                code=response.status
                body=response.read(400000).decode("utf8","replace") if url.endswith("/store/") else ""
            except urllib.error.HTTPError as exc:
              code=exc.code;body=""
            print("MPW_STORE_BEFORE="+json.dumps({"url":url,"status":code}))
            if code!=200:raise SystemExit("PROTECTED_ROUTE_NOT_HEALTHY: "+url)
            if url.endswith("/store/"):
              print("MPW_STORE_BASELINE_CONTENT="+json.dumps({"bytes":len(body),"has_catalog_id":'id="catalog"' in body,"has_guide_id":'id="mpw-store-ten-guides"' in body,"has_old_heading":"INITIAL COLLECTION" in body}))
            status[url]=code
          with open(os.environ["RUNNER_TEMP"]+"/mpw-store-sales-before.json","w") as stream:
            json.dump(status,stream)
          PY
      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only audit of live store template and page shell
        id: audit
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          audit="$(timeout 35s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/home/zomorod2/Saeit-staging/core/templates/mojplaywin')
          p=root/'store.html'; base=root/'site_base.html'
          if p.is_symlink() or not p.is_file(): raise SystemExit('LIVE_TEMPLATE_NOT_REGULAR')
          if base.is_symlink() or not base.is_file(): raise SystemExit('LIVE_PAGE_SHELL_NOT_REGULAR')
          raw=p.read_bytes(); data=raw.replace(bytes([13,10]),bytes([10]))
          shell=base.read_bytes().replace(bytes([13,10]),bytes([10]))
          print('MPW_LIVE_TEMPLATE_AUDIT='+json.dumps({'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(raw)}))
          base_sha=hashlib.sha256(shell).hexdigest()
          print('MPW_SITE_BASE_SHA='+base_sha)
          if b'{% block og_title %}' in shell or b'{% block twitter_title %}' in shell:
            raise SystemExit('LIVE_SEO_BLOCKS_ALREADY_PRESENT')
          for phrase in ('account required','Sign in or create an account','Secure purchase: sign in','DIGITAL PRODUCTS','FEATURED PICKS','Shop available books'):
            needle=phrase.encode()
            print('MPW_LIVE_TEMPLATE_MARKER='+json.dumps({'phrase':phrase,'count':data.count(needle)}))
            start=0
            for _ in range(min(3,data.count(needle))):
              i=data.find(needle,start); start=i+len(needle)
              snippet=data[max(0,i-160):min(len(data),i+240)].decode('utf8','replace').replace(chr(10),' ')
              print('MPW_LIVE_TEMPLATE_CONTEXT='+json.dumps({'phrase':phrase,'snippet':snippet}))
          PY
          )"
          printf '%s\n' "$audit"
          base_sha="$(printf '%s\n' "$audit" | sed -n 's/^MPW_SITE_BASE_SHA=//p')"
          test "${#base_sha}" = 64
          echo "site_base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Stage only the reviewed store template
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          remote="/home/zomorod2/.mpw-store-sales-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$remote' && install -d -m 700 '$remote'"
          timeout 50s scp -q -F "$d/config" core/templates/mojplaywin/store.html "saeit-cpanel:$remote/store.html"
          timeout 50s scp -q -F "$d/config" scripts/mpw_store_sales_funnel_fix_20261024.py "saeit-cpanel:$remote/install.py"
      - name: Atomically install and test the isolated store template
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          timeout 75s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - install '$GITHUB_RUN_ID' '${{ steps.audit.outputs.site_base_sha }}'" < scripts/mpw_store_sales_funnel_fix_20261024.py
      - name: Gracefully refresh the isolated store template cache
        id: refresh
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          from pathlib import Path
          import hashlib
          H=Path('/home/zomorod2')
          app=H/'Saeit-staging'
          wsgi=H/'mojplaywin.com/passenger_wsgi.py'
          store=app/'core/templates/mojplaywin/store.html'
          site_base=app/'core/templates/mojplaywin/site_base.html'
          ht=H/'mojplaywin.com/.htaccess'
          if not app.is_dir() or app.is_symlink() or not wsgi.is_file() or wsgi.is_symlink():
              raise SystemExit('SHARED_PASSENGER_ROOT_NOT_VERIFIED')
          if "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):
              raise SystemExit('WSGI_APP_ROOT_NOT_PINNED')
          if store.is_symlink() or not store.is_file():
              raise SystemExit('STORE_TEMPLATE_NOT_REGULAR')
          digest=hashlib.sha256(store.read_bytes().replace(bytes([13,10]),bytes([10]))).hexdigest()
          if digest!='8ca116ae7ba02ee12441fd865b48fbc17e187c981709cff0ceec5015d414eef3':
              raise SystemExit('STORE_TEMPLATE_HASH_NOT_PINNED')
          if site_base.is_symlink() or not site_base.is_file():
              raise SystemExit('MOJPLAYWIN_PAGE_SHELL_NOT_REGULAR')
          shell=site_base.read_text('utf8','replace')
          if any(shell.count(marker)!=1 for marker in ('{% block og_title %}','{% block og_description %}','{% block twitter_card %}','{% block twitter_title %}','{% block twitter_description %}')):
              raise SystemExit('STORE_SEO_PAGE_SHELL_BLOCKS_NOT_VERIFIED')
          if ht.is_symlink() or not ht.is_file():
              raise SystemExit('HTACCESS_NOT_REGULAR')
          config=ht.read_bytes()
          if config.count(b'RewriteCond %{REQUEST_URI} ^/(games|ai|')!=1 or b'RewriteCond %{REQUEST_URI} ^/(store|games|ai|' in config:
              raise SystemExit('STORE_APACHE_ROUTE_NOT_VERIFIED')
          public=H/'mojplaywin.com'
          for root in (app,public):
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit('UNSAFE_PASSENGER_ROOT')
              directory=root/'tmp'
              if directory.is_symlink():
                  raise SystemExit('UNSAFE_RESTART_DIRECTORY')
              directory.mkdir(exist_ok=True)
              marker=directory/'restart.txt'
              if marker.is_symlink() or (marker.exists() and not marker.is_file()):
                  raise SystemExit('UNSAFE_RESTART_MARKER')
              marker.touch()
          print('MPW_STORE_TEMPLATE_CACHE_REFRESH_REQUESTED=1;APP_AND_PASSENGER_RESTART_MARKERS_TOUCHED=1;STORE_TEMPLATE_HASH_VERIFIED=1;STORE_APACHE_ROUTE_VERIFIED=1')
          PY
      - name: Verify live checkout links and unchanged protected routes
        id: smoke
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          url="https://mojplaywin.com/store/"
          body=""
          for attempt in range(1,13):
            req=urllib.request.Request(url+"?__store_sales_fix="+os.environ["GITHUB_RUN_ID"]+"-"+str(attempt),
              headers={"User-Agent":"MPWStoreSalesFixVerify/1.0","Cache-Control":"no-cache"})
            try:
              with urllib.request.urlopen(req,timeout=22) as response:
                code=response.status
                body=response.read(400000).decode("utf8","replace")
            except urllib.error.HTTPError as exc:
              code=exc.code;body=exc.read(100000).decode("utf8","replace")
            expected=("Chess Books, Children’s Story &amp; Website Kit | MojPlayWin", "Chess books, illustrated stories &amp; website kits", "The Science and Practice of Chess Improvement",
              "Taniya and the Little Baker Worms", "Atelier Interior — Client-Ready Website Kit",
              "US $7.50", "US $4.00", "US $6.80", "84-day training plan",
              "English illustrated PDF · 40 pages", "five original SVG illustrations",
              "/store/product/72/", "/store/product/225/", "/store/product/879/",
              "Open the live demo", "order-specific TRX invoice", "Sign-in is required",
              'name="description" content="Shop a 415-page chess training guide',
              'property="og:description" content="Shop a 415-page chess training guide',
              'name="twitter:card" content="summary"', '"@type": "CollectionPage"',
              '"numberOfItems": 3')
            stale=("Farm Enterprise Economics Toolkit", "Applied AI Learning Path",
              "Original Browser Games", "Research & Digital Project Services",
              "Explore our books, learning, games & tools", "INITIAL COLLECTION",
              "FEATURED PICKS", "mpw-store-ten-guides", "mpw-original-books")
            okay=(code==200 and all(token in body for token in expected)
              and not any(token in body for token in stale)
              and body.count('class="mpw-product ') == 3
              and "Never send funds" in body
              and "<html lang=\"en\" dir=\"ltr\">" in body
              and "mpw-shop-catalog" in body)
            print("MPW_STORE_PUBLIC_ATTEMPT="+json.dumps({"attempt":attempt,"status":code,"fixed":okay,
          "product_cards":body.count('class="mpw-product '),"has_three_products":all(x in body for x in ('/store/product/72/','/store/product/225/','/store/product/879/')),
          "has_legacy_catalog":any(x in body for x in stale),
          "english_shell":"<html lang=\\\"en\\\" dir=\\\"ltr\\\">" in body}))
            if okay:break
            time.sleep(5)
          else:raise SystemExit("Live store conversion patch not visible")
          before=json.load(open(os.environ["RUNNER_TEMP"]+"/mpw-store-sales-before.json"))
          for url,old_status in before.items():
            req=urllib.request.Request(url,headers={"User-Agent":"MPWStoreSalesFixVerify/1.0","Cache-Control":"no-cache"})
            try:
              with urllib.request.urlopen(req,timeout=20) as response: code=response.status
            except urllib.error.HTTPError as exc: code=exc.code
            print("MPW_STORE_PROTECTED_ROUTE="+json.dumps({"url":url,"status":code}))
            if code!=old_status:raise SystemExit("Protected route status changed: "+url)
          print("MPW_STORE_SALES_FIX_LIVE=PASS")
          PY
      - name: Roll back store template if post-install verification fails
        id: rollback
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" < scripts/mpw_store_sales_funnel_fix_20261024.py
      - name: Refresh app template cache after exact store rollback
        if: failure() && steps.install.outcome == 'success' && steps.rollback.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          from pathlib import Path
          import hashlib
          H=Path('/home/zomorod2')
          app=H/'Saeit-staging'
          wsgi=H/'mojplaywin.com/passenger_wsgi.py'
          store=app/'core/templates/mojplaywin/store.html'
          site_base=app/'core/templates/mojplaywin/site_base.html'
          ht=H/'mojplaywin.com/.htaccess'
          if not wsgi.is_file() or wsgi.is_symlink() or "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):
              raise SystemExit('WSGI_PIN_NOT_VERIFIED')
          if store.is_symlink() or not store.is_file():
              raise SystemExit('STORE_TEMPLATE_NOT_REGULAR')
          digest=hashlib.sha256(store.read_bytes().replace(bytes([13,10]),bytes([10]))).hexdigest()
          if digest!='704d7d338caa51d89addaf14934886005b359a9016b37ebb443c396c4f315cc0':
              raise SystemExit('ROLLBACK_HASH_NOT_VERIFIED')
          if ht.is_symlink() or not ht.is_file():
              raise SystemExit('HTACCESS_NOT_REGULAR')
          config=ht.read_bytes()
          if site_base.is_symlink() or not site_base.is_file():
              raise SystemExit('ROLLBACK_PAGE_SHELL_NOT_REGULAR')
          if config.count(b'RewriteCond %{REQUEST_URI} ^/(games|ai|')!=1:
              raise SystemExit('ROLLBACK_APACHE_ROUTE_NOT_VERIFIED')
          public=H/'mojplaywin.com'
          for root in (app,public):
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit('UNSAFE_PASSENGER_ROOT')
              directory=root/'tmp'
              if directory.is_symlink():
                  raise SystemExit('UNSAFE_MARKER_DIRECTORY')
              directory.mkdir(exist_ok=True)
              marker=directory/'restart.txt'
              if marker.is_symlink() or (marker.exists() and not marker.is_file()):
                  raise SystemExit('UNSAFE_MARKER')
              marker.touch()
          print('MPW_POST_ROLLBACK_TEMPLATE_CACHE_REFRESH_REQUESTED=1;APP_AND_PASSENGER_RESTART_MARKERS_TOUCHED=1')
          PY
      - name: Remove temporary stage and SSH material, keep private backup
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-store-sales-ssh"
          remote="/home/zomorod2/.mpw-store-sales-stage-$GITHUB_RUN_ID"
          if test -f "$d/config"; then
            ssh -T -F "$d/config" saeit-cpanel "test -d '$remote' && test ! -L '$remote' && rm -f '$remote/store.html' '$remote/site_base.html' '$remote/install.py' && rmdir '$remote'" || true
          fi
          rm -rf -- "$d"
