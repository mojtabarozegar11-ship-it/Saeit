name: MojPlayWin read-only exact-GET route precedence diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-editorial-rewrite-diagnostic.yml"
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Report sanitized rewrite precedence with context only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,re
          root=Path("/home/zomorod2/mojplaywin.com")
          ht=root/".htaccess"
          if not root.is_dir() or root.is_symlink() or not ht.is_file() or ht.is_symlink():
              raise SystemExit("DOCROOT_INVALID")
          lines=ht.read_text(errors="replace").splitlines()
          allowed=("RewriteEngine","RewriteRule","RewriteCond","RewriteBase","DirectoryIndex","PassengerAppRoot","PassengerBaseURI","PassengerStartupFile","Options")
          visible=[]
          for num,line in enumerate(lines,1):
              t=line.strip()
              if t and any(t.startswith(p+" ") for p in allowed):
                  # Show routing shape only, not credentials or secrets.
                  if len(t)>240:t=t[:240]
                  t=re.sub(r"[A-Za-z0-9_\-]{32,}", "[long-token]", t)
                  visible.append({"line":num,"directive":t})
          print("MPW_RULE_ORDER_READONLY="+json.dumps({"sha256":hashlib.sha256(ht.read_bytes()).hexdigest(),
             "directives":visible,"line_count":len(lines),"new_190_marker_present":any("MPW_ILLUSTRATED_TEN" in x for x in lines),
             "legacy_about_marker_present":any("MPW_EXACT_ABOUT" in x for x in lines)}))
          PY
      - name: Trace unauthenticated content and direct static index route
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          urls=["https://mojplaywin.com/company/?__editorial_readonly_probe=1",
                "https://mojplaywin.com/about/?__editorial_readonly_probe=1",
                "https://mojplaywin.com/design-preview-20261017/company.html"]
          for url in urls:
              req=urllib.request.Request(url,headers={"User-Agent":"MPWRewriteReadonlyDiagnostic/1.0","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      raw=r.read(200000).decode('utf-8','replace')
                      info={"url":url,"status":r.status,"bytes":len(raw),
                        "content_type":r.headers.get('Content-Type',''),
                        "contains_extra_190":"mpw-ten-illustrated-20261018" in raw}
              except urllib.error.HTTPError as e:
                  info={"url":url,"status":e.code}
              print("MPW_PUBLIC_REWRITE_PROBE="+json.dumps(info))
          PY
