name: MojPlayWin actual branded store callback and template read-only audit
on:
  push:
    branches: [qa/mpw-factory-safe-storefront-20261014]
    paths:
      - .github/workflows/mpw-branded-store-callback-readonly.yml
      - core/templates/core/mojplaywin_store_base.html
      - core/templates/core/mojplaywin_factory_store.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare active Django route code with reviewed storefront patch and free product gate without writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 110s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          export PYTHONDONTWRITEBYTECODE=1
          export DJANGO_SETTINGS_MODULE=config.settings
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import inspect,hashlib
          from pathlib import Path
          import django
          django.setup()
          from django.test import RequestFactory
          import config.urls as urls
          for name in ("brand_for_request","branded_store","store_home"):
              target=getattr(urls,name,None)
              print("MPW_BRANDED_CALLBACK",name,"MODULE",getattr(target,"__module__","none"),"QUALNAME",getattr(target,"__qualname__","none"))
              if target is not None:
                  try:
                      source=inspect.getsource(target)
                      print("MPW_BRANDED_FUNCTION_SOURCE",name," ".join(source[:2000].split()))
                      p=Path(inspect.getfile(target))
                      print("MPW_BRANDED_FUNCTION_FILE",name,str(p.relative_to(Path.home()/"Saeit-staging")) if p.is_relative_to(Path.home()/"Saeit-staging") else "outside-site")
                  except (OSError,TypeError,ValueError) as exc:
                      print("MPW_BRANDED_SOURCE_UNAVAILABLE",name,type(exc).__name__)
          for host in ("mojplaywin.com","www.mojplaywin.com","zomorodmelal.ir","mojtabarozegar.ir"):
              req=RequestFactory().get("/store/",HTTP_HOST=host)
              try:
                  brand=urls.brand_for_request(req)
                  print("MPW_BRANDED_HOST_MATCH",host,bool(brand))
                  if brand is not None:
                      print("MPW_BRANDED_HOST_TYPE",host,str(type(brand).__name__))
              except Exception as e:
                  print("MPW_BRANDED_HOST_FAIL",host,type(e).__name__)
          print("MPW_BRANDED_LIVE_CALLBACK_AUDIT_READ_ONLY=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
