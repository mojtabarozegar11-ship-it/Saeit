name: Remove two exact duplicate historic theme archives
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-remove-exact-duplicate-theme-archives.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remove-exact-theme-dupes-20261018
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify public site before cleanup
        shell: bash
        run: |
          set -euo pipefail
          for path in / /agents/; do
            status="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "CLEAN_BEFORE=$path:$status"
            test "$status" = 200
          done
      - name: Confirm SHA-256 identity and discard two redundant ZIP copies
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h=Path.home()
          assert str(h)=="/home/zomorod2"
          old=h/"Saeit-staging/zomorod_json_admin_stage/backups"
          safe=h/"Saeit/backups"
          assert old.is_dir() and safe.is_dir() and not old.is_symlink() and not safe.is_symlink()
          names=["zomorodmelal-live-theme-20261011T015315Z.zip","zomorodmelal-current-original-theme-20261011.zip"]
          def sha(p):
              z=hashlib.sha256()
              with p.open("rb") as fp:
                  for part in iter(lambda:fp.read(1024*1024),b""):z.update(part)
              return z.hexdigest()
          for name in names:
              a=old/name;b=safe/name
              assert a.is_file() and b.is_file() and not a.is_symlink() and not b.is_symlink()
              assert a.stat().st_size==b.stat().st_size and sha(a)==sha(b),name
          saved=0
          for name in names:
              a=old/name
              saved+=a.stat().st_size
              a.unlink()
              print("REDUNDANT_THEME_ARCHIVE_REMOVED="+name)
          print("THEME_DUPLICATE_FILE_BYTES_FREED="+str(saved))
          print("PROTECTED_CANONICAL_ARCHIVES_UNMODIFIED=yes")
          PY
          REMOTE
      - name: Website status after redundant file removal
        shell: bash
        run: |
          for path in / /agents/; do
            status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "CLEAN_AFTER=$path:$status"
            test "$status" = 200
          done
      - name: Remove transient ssh credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
# Owner-authorized exact-byte duplicate archive cleanup; canonical copies remain in Saeit/backups.
