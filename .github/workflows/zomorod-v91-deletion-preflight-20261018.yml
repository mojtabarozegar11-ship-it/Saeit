name: V91 deletion preflight dependency and storage review
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-v91-deletion-preflight-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-v91-pre-delete-20261018
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: V91 standalone genome verification and live dependencies
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          h=Path.home()
          v=h/"saeit_v91"
          p=h/"Saeit"
          assert h==Path("/home/zomorod2") and v.is_dir() and not v.is_symlink()
          m=json.loads((p/"agent_imports/v91_genomes/generation64_dependency_manifest.json").read_text())
          entries=m["sha256_by_relative_path"]
          assert len(entries)==73
          for path,sha in entries.items():
              t=p/"agent_imports/v91_genomes/site_master"/path
              assert t.is_file() and not t.is_symlink() and hashlib.sha256(t.read_bytes()).hexdigest()==sha
          print("V91_GENOMES_INDEPENDENT_VERIFIED=73")
          r=subprocess.run(["du","-sk","--",str(v)],text=True,capture_output=True,timeout=80,check=True)
          print("V91_SOURCE_SIZE_KB="+r.stdout.split()[0])
          r=subprocess.run(["ps","-u","zomorod2","-o","args="],text=True,capture_output=True,timeout=12)
          live=[line for line in r.stdout.splitlines() if re.search(r"/saeit_v91(?:/|\s|$)",line) and "python3 - " not in line and "bash -se" not in line]
          print("V91_ACTIVE_PROCESS_MATCHES="+str(len(live)))
          try:
              r=subprocess.run(["crontab","-l"],text=True,capture_output=True,timeout=10)
              print("V91_CRON_REFERENCES="+str(sum(bool(re.search(r"saeit_v91",line)) for line in r.stdout.splitlines())))
          except Exception: print("V91_CRON_REFERENCES=unknown")
          roots=[h/"public_html",p,h/"Saeit-staging",h/".private",h/"mojplaywin.com"]
          look=[]
          for root in roots:
              if not root.is_dir() or root.is_symlink():continue
              for dirpath,dirs,files in os.walk(root,followlinks=False):
                  depth=len(Path(dirpath).relative_to(root).parts)
                  dirs[:]=[x for x in dirs if x not in {"backups",".git",".venv","node_modules","media","staticfiles","var","agent_imports"} and depth < 5 and not (Path(dirpath)/x).is_symlink()]
                  for file in files:
                      fp=Path(dirpath)/file
                      if fp.is_symlink() and "saeit_v91" in str(fp.resolve(strict=False)):look.append(str(fp))
                      if fp.is_file() and fp.stat().st_size<120000 and (file.endswith((".yml",".yaml",".ini",".conf",".sh",".service",".py",".php")) or file in {".htaccess",".env","passenger_wsgi.py"}):
                          try:
                              if "saeit_v91" in fp.read_text(errors="ignore"):
                                  look.append(str(fp.relative_to(h)))
                          except OSError:pass
          print("V91_CONFIG_REFERENCES="+json.dumps(sorted(set(look))[:35]))
          print("V91_PREFLIGHT_DONE=yes")
          PY
          REMOTE
      - name: Remove temp SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
