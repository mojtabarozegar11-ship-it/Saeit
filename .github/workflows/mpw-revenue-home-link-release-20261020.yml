name: MojPlayWin main home twelve-offer entry isolated safe release
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-revenue-home-link-release-20261020.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-main-home-revenue-link
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify deterministic isolated homepage markup insertion
        run: python3 scripts/mpw_main_revenue_home_link_20261020.py selftest
      - name: Read protected URL status before homepage release
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json
          paths=('/','/store/','/farnaz/','/saman/','/taniya/','/picm/')
          states={}
          for path in paths:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+path,timeout=16) as response:states[path]=response.status
              except urllib.error.HTTPError as err:states[path]=err.code
          if states['/']!=200 or states['/store/']!=200:raise RuntimeError('Original main pages unavailable')
          open(os.environ['RUNNER_TEMP']+'/mpw-main-baseline.json','w').write(json.dumps(states))
          print('MPW_REVENUE_HOME_PROTECTED_BASELINE='+json.dumps(states))
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Insert only one approved revenue link into original main static home
        id: install
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - install '$GITHUB_RUN_ID'" < scripts/mpw_main_revenue_home_link_20261020.py
      - name: Prove revenue entry public and protected child sites unchanged
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json,time
          url='https://mojplaywin.com/'
          valid=False
          for trial in range(8):
              req=urllib.request.Request(url+'?mpw_revenue_home='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as response:
                  html=response.read(3500000).decode('utf8','replace')
                  valid=(response.status==200 and html.count('id="mpw-revenue-offers-20261020"')==1 and html.count('href="/mpw-editorial/revenue/index.html"')==1)
              if valid:break
              time.sleep(2)
          if not valid:raise RuntimeError('Public original main home revenue link not verified')
          base=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-main-baseline.json'))
          for path,status in base.items():
              try:
                  with urllib.request.urlopen(url.rstrip('/')+path,timeout=18) as r:now=r.status
              except urllib.error.HTTPError as e:now=e.code
              if now!=status:raise RuntimeError('Protected route changed: '+path)
          with urllib.request.urlopen('https://mojplaywin.com/mpw-editorial/revenue/index.html',timeout=18) as r:
              if r.status!=200 or 'TWELVE' not in r.read(60000).decode('utf8','replace').upper():raise RuntimeError('Revenue hub not available')
          print('MPW_HOME_REVENUE_LINK_PUBLIC_AND_PROTECTED_ROUTES=PASS')
          PY
      - name: Restore only original main home if public smoke failed
        if: failure() && steps.install.outcome == 'success'
        run: timeout 65s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_main_revenue_home_link_20261020.py
      - name: Destroy temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
