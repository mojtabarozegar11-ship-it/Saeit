name: Guarded Zomorod public apps sitemap discovery
on:
  push:
    branches: [audit/zm-apps-sitemap-20261106]
    paths:
      - scripts/zomorod_apps_sitemap_guarded_20261106.py
      - .github/workflows/zomorod-apps-sitemap-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-apps-sitemap-guarded-20261106
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated sitemap transformation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_apps_sitemap_guarded_20261106.py
          python3 scripts/zomorod_apps_sitemap_guarded_20261106.py selftest 0
      - name: Authenticate pinned cPanel, direct or through VPS
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-apps-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/sitemap.xml' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
            echo 'AUTHENTICATED_CPANEL_DIRECT'
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/sitemap.xml' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
            echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
          else
            exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Confirm the exact live sitemap before any write
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-apps-ssh/config" "$COMMAND_HOST" "python3 - preview '$GITHUB_RUN_ID'" < scripts/zomorod_apps_sitemap_guarded_20261106.py
      - name: Back up and atomically add the indexable apps page
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-apps-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_apps_sitemap_guarded_20261106.py
      - name: Verify origin SHA and public XML with no-cache request
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 110s ssh -T -F "$RUNNER_TEMP/zm-apps-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_apps_sitemap_guarded_20261106.py
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET
          with urlopen(Request('https://zomorodmelal.ir/sitemap.xml?zm_apps_verify=1',
                               headers={'Cache-Control': 'no-cache'}), timeout=27) as r:
              if r.status != 200:
                  raise RuntimeError('SITEMAP_PUBLIC_NOT_200')
              root = ET.fromstring(r.read(300_001))
          locs = [e.text for e in root.iter() if e.tag.endswith('loc')]
          if len(locs) != 153 or locs.count('https://zomorodmelal.ir/apps/') != 1:
              raise RuntimeError('SITEMAP_INDEXABLE_APPS_NOT_INCLUDED')
          with urlopen('https://zomorodmelal.ir/apps/', timeout=27) as r:
              if r.status != 200:
                  raise RuntimeError('APPS_DESTINATION_NOT_200')
          print('PUBLIC_APPS_SITEMAP_AND_DESTINATION_VERIFIED=1')
          PY
      - name: Restore the byte-exact original only if our update failed verification
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zm-apps-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_apps_sitemap_guarded_20261106.py
