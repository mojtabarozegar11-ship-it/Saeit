name: VPS factory bounded disk recovery inventory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-factory-disk-recovery-inventory-20261024.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-disk-recovery-inventory
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Measure only fixed VPS factory storage roots
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-disk-inventory"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 150s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time

          root = Path.home() / "factory-runtime"
          ops = root / "operations"
          private = root / "private" / "autonomous-product-cycle"
          if root.is_symlink() or not root.is_dir() or ops.is_symlink() or not ops.is_dir():
              raise SystemExit("FACTORY_STORAGE_ROOT_UNSAFE")
          disk = shutil.disk_usage(root)
          allowed = {
              "runtime_operations": ops,
              "runtime_backups": ops / "backups",
              "factory_private": private,
              "private_warehouse": private / "production-warehouse",
              "private_research": private / "research",
              "runtime_python": root / ".venv",
              "runtime_django": root / "django-app",
              "pip_download_cache": Path.home() / ".cache" / "pip",
              "user_cache": Path.home() / ".cache",
          }
          def usage(path):
              if path.is_symlink() or not path.exists():
                  return None
              try:
                  result = subprocess.run(["du", "-s", "-B1", "--", str(path)],
                                          check=True, capture_output=True, text=True,
                                          timeout=22)
                  return int(result.stdout.split()[0])
              except (OSError, ValueError, subprocess.SubprocessError):
                  return None
          groups = {name: usage(path) for name,path in allowed.items()}
          # Candidate directories are *only* classified here, never removed.
          prefixes = (".qa1000-supply-", ".stage4-due-", ".primary-acquisition-",
                      ".stage4-readonly-", ".factory-audit-")
          cutoff = time.time() - 48 * 3600
          transient = {"count": 0, "bytes": 0, "older_48h_count": 0,
                       "older_48h_bytes": 0}
          for item in ops.iterdir():
              if not item.name.startswith(prefixes) or item.is_symlink() or not item.is_dir():
                  continue
              size = usage(item)
              if size is None:
                  continue
              transient["count"] += 1
              transient["bytes"] += size
              if item.stat().st_mtime < cutoff:
                  transient["older_48h_count"] += 1
                  transient["older_48h_bytes"] += size
          logs = {"count": 0, "bytes": 0, "older_7d_bytes": 0}
          for item in ops.iterdir():
              if item.is_symlink() or not item.is_file() or not item.name.endswith(".log"):
                  continue
              if item.stat().st_size > 10**11:
                  raise SystemExit("FACTORY_LOG_UNEXPECTED_SIZE")
              logs["count"] += 1
              logs["bytes"] += item.stat().st_size
              if item.stat().st_mtime < time.time()-7*86400:
                  logs["older_7d_bytes"] += item.stat().st_size
          # Inventory backup types without printing private paths or file contents.
          import collections
          import zlib
          backup_root = ops / "backups"
          backup_types = collections.defaultdict(lambda: {"count":0,"bytes":0})
          backup_files = []
          inspected = 0
          truncated = False
          if backup_root.is_dir() and not backup_root.is_symlink():
              for base, dirs, names in os.walk(backup_root, followlinks=False):
                  dirs[:] = [name for name in dirs if not (Path(base)/name).is_symlink()]
                  for name in names:
                      inspected += 1
                      if inspected > 30000:
                          truncated = True
                          break
                      path = Path(base)/name
                      if path.is_symlink() or not path.is_file():
                          continue
                      info = path.stat()
                      suffix = path.suffix.lower()[:14] or "(none)"
                      kind = backup_types[suffix]
                      kind["count"] += 1
                      kind["bytes"] += info.st_size
                      if info.st_size >= 32*1024*1024:
                          backup_files.append((info.st_size, path, info.st_mtime, info.st_nlink, suffix))
                  if truncated:
                      break
          largest = []
          for size, path, modified, links, suffix in sorted(backup_files,reverse=True)[:12]:
              try:
                  with path.open("rb") as f:
                      block = f.read(min(size,262144))
                      if size > 524288:
                          f.seek(max(0,size//2-131072))
                          block += f.read(262144)
                  ratio = round(len(zlib.compress(block,1))/len(block),3) if block else None
              except OSError:
                  ratio = None
              zero_blocks = 0
              sampled_blocks = 0
              try:
                  with path.open("rb") as f:
                      for index in range(12):
                          offset = ((max(0,size-262144))*index)//11
                          f.seek(offset)
                          chunk = f.read(262144)
                          for pos in range(0,len(chunk)//4096*4096,4096):
                              sampled_blocks += 1
                              zero_blocks += (chunk[pos:pos+4096] == bytes(4096))
              except OSError:
                  sampled_blocks = 0
              largest.append({"sample_zero_4k_fraction":round(zero_blocks/sampled_blocks,3) if sampled_blocks else None,
                              "suffix":suffix,"bytes":size,
                              "age_days":round((time.time()-modified)/86400,1),
                              "hardlinks":links,
                              "sample_zlib_size_ratio":ratio})
          # Same-length files are *not* proven identical. Never hash multi-GB
          # snapshots in the live service health probe (bounded I/O budget).
          sizes = collections.Counter(size for size,_,_,_,_ in backup_files)
          dedupe_summary = {
              "same_size_candidate_paths":sum(count for count in sizes.values() if count>1),
              "exact_duplicate_groups":None,
              "potential_reclaimable_bytes_proven":0,
              "content_identity_not_established":True,
              "backup_files_modified":0,
          }
          try:
              fs_kind = subprocess.run(["stat","-f","-c","%T",str(backup_root)],check=True,capture_output=True,text=True,timeout=5).stdout.strip()
          except (OSError,subprocess.SubprocessError):
              fs_kind = "unknown"
          backup_breakdown = {
              "files_inspected":inspected,
              "inventory_truncated":truncated,
              "large_files_count":len(backup_files),
              "by_suffix":dict(sorted(backup_types.items())),
              "top_twelve_without_names":largest,
              "exact_duplicate_analysis":dedupe_summary,
              "filesystem_type":fs_kind,
              "samples_read_only":True,
          }
          status = {
              "schema": "saeit.factory.disk-pressure-inventory.v1",
              "observed_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "read_only": True,
              "mount_free_bytes": disk.free,
              "mount_used_bytes": disk.used,
              "reserve_2048_mib_met": disk.free >= 2048*1024*1024,
              "fixed_groups_bytes": groups,
              "backup_composition": backup_breakdown,
              "known_transient_staging": transient,
              "operation_logs": logs,
              "products_or_backups_deleted": 0,
              "factory_services_restarted": False,
          }
          print("FACTORY_STORAGE_INVENTORY="+json.dumps(status, sort_keys=True))
          PY

# Read-only storage and preservation recheck authorized 2026-10-28.
