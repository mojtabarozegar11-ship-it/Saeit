name: Attest staged Zomorod office DB config and Passenger mapping read-only
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-passenger-db-readonly-20261101.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-private-office-passenger-db-readonly
  cancel-in-progress: false
jobs:
  attest:
    if: github.event.action == 'opened' && github.head_ref == 'ops/zomorod-office-passenger-db-readonly-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "IMMUTABLE_HEAD_CHECKOUT=verified"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-office-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-company-office/office.sqlite3' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-company-office/office.sqlite3' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Prove sidecar-intended database and protected root mapping without any writes
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-office-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 140s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONNOUSERSITE=1
          test "$(id -un)" = "zomorod2"
          source="/home/zomorod2/.private/zomorod-messaging-release-stages/d7342c0fef977aa67b570bebf86b297c93220f23/code"
          private="/home/zomorod2/.private/zomorod-company-office"
          py="/home/zomorod2/virtualenv/Saeit/3.10/bin/python"
          test -x "$py"
          test -f "$source/office_runtime/settings.py"
          test -f "$source/office_runtime/urls.py"
          test -f "$source/enterprise_portal/security.py"
          test -d "$source/.stage-deps"
          test -f "$private/office.env" && test -f "$private/office.sqlite3"
          test ! -L "$private/office.env" && test ! -L "$private/office.sqlite3"
          test "$(stat -c '%a' "$private/office.env")" = 600
          test "$(stat -c '%a' "$private/office.sqlite3")" = 600
          export PYTHONPATH="$source/.stage-deps:$source"
          export DJANGO_SETTINGS_MODULE=office_runtime.settings
          export DEBUG=False
          export ALLOWED_HOSTS="zomorodmelal.ir,www.zomorodmelal.ir,localhost"
          export SECURE_SSL_REDIRECT=False
          export COMPANY_MESSAGING_SEND_ENABLED=false
          export COMPANY_MARKETING_PUBLISH_ENABLED=false
          export ECOSYSTEM_SCHEDULED_ANALYSIS_ENABLED=false
          cd "$source"
          "$py" -B - "$private/office.env" "$private/office.sqlite3" <<'PY'
          import hashlib,os,pathlib,sqlite3,stat,sys,urllib.parse
          conf=pathlib.Path(sys.argv[1])
          dbfile=pathlib.Path(sys.argv[2])
          permitted={"SECRET_KEY","DATABASE_URL","COMPANY_MESSAGING_SEND_ENABLED","COMPANY_MARKETING_PUBLISH_ENABLED","ECOSYSTEM_SCHEDULED_ANALYSIS_ENABLED"}
          content=conf.read_text(encoding="utf-8")
          assert content and "\x00" not in content
          for line in content.splitlines():
              if not line.strip(): continue
              key,sep,value=line.partition("=")
              assert sep and key in permitted and value
              os.environ.setdefault(key,value)
          assert os.environ.get("DATABASE_URL")=="sqlite:////home/zomorod2/.private/zomorod-company-office/office.sqlite3"
          before=dbfile.stat()
          before_hash=hashlib.sha256(dbfile.read_bytes()).hexdigest()
          import django
          django.setup()
          from django.conf import settings
          from django.urls import resolve,reverse
          db=settings.DATABASES["default"]
          assert db["ENGINE"]=="django.db.backends.sqlite3"
          assert pathlib.Path(str(db["NAME"])).resolve()==dbfile.resolve()
          assert settings.ROOT_URLCONF=="office_runtime.urls"
          assert settings.FORCE_SCRIPT_NAME=="/company/office"
          assert settings.COMPANY_OFFICE_REQUIRE_MFA is True
          assert settings.SESSION_COOKIE_NAME=="zm_office_sessionid"
          assert settings.SESSION_COOKIE_PATH=="/company/office/"
          assert settings.CSRF_COOKIE_PATH=="/company/office/"
          assert settings.SESSION_COOKIE_SECURE and settings.CSRF_COOKIE_SECURE
          assert not settings.DEBUG
          assert not settings.COMPANY_MESSAGING_SEND_ENABLED
          assert not settings.COMPANY_MARKETING_PUBLISH_ENABLED
          assert resolve("/secure-login/").view_name=="enterprise_portal:login"
          assert resolve("/messages/").view_name=="company_messaging:inbox"
          assert resolve("/marketing/").view_name=="company_marketing:dashboard"
          assert reverse("enterprise_portal:login").endswith("/secure-login/")
          uri="file:"+urllib.parse.quote(str(dbfile))+"?mode=ro"
          with sqlite3.connect(uri,uri=True,timeout=5) as conn:
              conn.execute("PRAGMA query_only=ON")
              assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              tables={name for (name,) in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert len(tables)==123
              assert {"auth_user","django_migrations","company_messaging_message","enterprise_portal_businessunit"}<=tables
              assert conn.execute("SELECT COUNT(*) FROM auth_user").fetchone()[0]==0
          after=dbfile.stat()
          assert (before.st_size,before.st_mtime_ns)==(after.st_size,after.st_mtime_ns)
          assert hashlib.sha256(dbfile.read_bytes()).hexdigest()==before_hash
          print("OFFICE_SIDECAR_INTENDED_DB_BINDING=verified")
          print("OFFICE_PRIVATE_SCHEMA_AND_INTEGRITY=123_tables_ok")
          print("OFFICE_MFA_CONFIGURATION=fail_closed")
          print("OFFICE_OUTBOUND_DISPATCH=disabled")
          print("OFFICE_DB_CONTENT_AND_MTIME_UNCHANGED=true")
          print("LIVE_PASSENGER_WORKER_EFFECTIVE_DB=not_attested")
          PY
          "$py" -B - <<'PY'
          from pathlib import Path
          import hashlib,shlex
          home=Path("/home/zomorod2")
          root=home/"public_html/.htaccess"
          company=home/"public_html/company/.htaccess"
          assert root.is_file() and not root.is_symlink()
          assert company.is_file() and not company.is_symlink()
          a=root.read_bytes()
          b=company.read_bytes()
          txt=a.decode("utf-8",errors="replace")
          sub=b.decode("utf-8",errors="replace")
          def values(text,name):
              matches=[]
              for line in text.splitlines():
                  try: parts=shlex.split(line,comments=True)
                  except ValueError: continue
                  if len(parts)>=2 and parts[0].lower()==name.lower():
                      matches.append(parts[1])
              return matches
          assert "/" in values(txt,"PassengerBaseURI")
          assert "/home/zomorod2/Saeit" in values(txt,"PassengerAppRoot")
          assert "off" in [x.lower() for x in values(sub,"PassengerEnabled")]
          assert hashlib.sha256(root.read_bytes()).digest()==hashlib.sha256(a).digest()
          assert hashlib.sha256(company.read_bytes()).digest()==hashlib.sha256(b).digest()
          print("ROOT_PASSENGER_OWNERSHIP=verified_at_root")
          print("COMPANY_PHP_PASSENGER_DISABLED=verified")
          print("ROOT_HTACCESS_READONLY=verified")
          print("LIVE_ROUTING_CUTOVER_PERFORMED=false")
          print("PRODUCTION_DEPLOY_ALLOWED=no")
          PY
          REMOTE
      - name: Remove temporary relay credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-office-ro"

