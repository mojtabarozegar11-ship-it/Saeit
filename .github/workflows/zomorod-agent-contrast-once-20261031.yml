name: Zomorod private agent text contrast only (one-time, isolated)
on:
  push:
    branches: ['fix/zomorod-agent-readable-dark-text-20261031']
    paths: ['.github/workflows/zomorod-agent-contrast-once-20261031.yml']
permissions:
  contents: read
concurrency:
  group: zomorod-private-agent-text-contrast-20261031
  cancel-in-progress: false
jobs:
  contrast-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-only intended markup (no worker or factory change)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('content/zomorod-v11/site_agents.php').read_text()
          assert s.count('<p style="color:#e9e7d9">') == 2
          assert '<h2>مستر ایجنت و ایجنت‌های زمرد ملل</h2><p style="color:#e9e7d9">' in s
          assert '</h3><p style="color:#e9e7d9">\'.esc($a[\'mission\'])' in s
          print('CONTRAST_SOURCE_EXACT=PASS')
          PY
      - name: Prepare pinned cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Apply exact two-span change only to private PHP with private backup and rollback
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) echo "UNTRUSTED_COMMAND_HOST"; exit 1 ;; esac
          ssh -F "$d/config" "$COMMAND_HOST" python3 - "$GITHUB_RUN_ID" <<'PY'
          import hashlib,os,re,stat,sys,shutil,subprocess
          from pathlib import Path
          run=sys.argv[1]
          if not re.fullmatch(r'[0-9]{8,20}',run):raise SystemExit('UNSAFE_RUN_ID')
          home=Path.home()
          private=home/'.private/zomorod-business'
          target=private/'site_agents.php'
          if not target.is_file() or target.is_symlink():raise SystemExit('TARGET_MISSING_OR_LINKED')
          info=target.stat()
          if info.st_uid!=os.geteuid() or info.st_nlink!=1 or info.st_size>500000:
              raise SystemExit('TARGET_METADATA_BLOCKED')
          before=target.read_bytes()
          old1='<h2>مستر ایجنت و ایجنت‌های زمرد ملل</h2><p>'.encode()
          new1='<h2>مستر ایجنت و ایجنت‌های زمرد ملل</h2><p style="color:#e9e7d9">'.encode()
          old2=b"</h3><p>'.esc($a['mission'])"
          new2=b"</h3><p style=\"color:#e9e7d9\">'.esc($a['mission'])"
          if before.count(old1)!=1 or before.count(old2)!=1 or new1 in before or new2 in before:
              raise SystemExit('EXACT_SOURCE_DRIFT_OR_ALREADY_PATCHED')
          after=before.replace(old1,new1,1).replace(old2,new2,1)
          if after==before:raise SystemExit('NO_SOURCE_CHANGE')
          base=home/'.backups/zomorod-agent-contrast-20261031'
          if base.exists() and (base.is_symlink() or base.stat().st_uid!=os.geteuid()):
              raise SystemExit('BACKUP_PARENT_UNSAFE')
          base.mkdir(mode=0o700,parents=True,exist_ok=True)
          os.chmod(base,0o700)
          bdir=base/run
          bdir.mkdir(mode=0o700)
          backup=bdir/'site_agents.before.php'
          with backup.open('xb') as stream:
              os.fchmod(stream.fileno(),0o600)
              stream.write(before);stream.flush();os.fsync(stream.fileno())
          if backup.read_bytes()!=before:raise SystemExit('BACKUP_UNVERIFIED')
          stage=private/('.site_agents.contrast-'+run+'.php')
          php=shutil.which('php') or '/opt/cpanel/ea-php82/root/usr/bin/php'
          applied=False
          try:
              with stage.open('xb') as stream:
                  os.fchmod(stream.fileno(),stat.S_IMODE(info.st_mode))
                  stream.write(after);stream.flush();os.fsync(stream.fileno())
              check=subprocess.run([php,'-l',str(stage)],capture_output=True,text=True,timeout=20)
              if check.returncode!=0:raise RuntimeError('STAGED_PHP_LINT_FAILED')
              if stage.read_bytes()!=after:raise RuntimeError('STAGING_NOT_EXACT')
              if target.read_bytes()!=before:raise RuntimeError('CONCURRENT_SOURCE_CHANGED')
              os.replace(stage,target);applied=True
              check=subprocess.run([php,'-l',str(target)],capture_output=True,text=True,timeout=20)
              if check.returncode!=0 or target.read_bytes()!=after:
                  raise RuntimeError('POSTCHECK_FAILED')
              print('CONTRAST_ONLY_PRIVATE_PHP=APPLIED')
              print('BEFORE_SHA256='+hashlib.sha256(before).hexdigest())
              print('AFTER_SHA256='+hashlib.sha256(after).hexdigest())
              print('DB_CRON_WORKER_PAYMENT_MODIFICATIONS=NONE')
              print('AUTHENTICATED_MOBILE_RENDER=AWAIT_OWNER_VISUAL_CHECK')
          except Exception:
              if applied:
                  if target.read_bytes()==after:
                      restore=private/('.site_agents.restore-'+run+'.php')
                      with restore.open('xb') as stream:
                          os.fchmod(stream.fileno(),stat.S_IMODE(info.st_mode))
                          stream.write(before);stream.flush();os.fsync(stream.fileno())
                      os.replace(restore,target)
                      print('CONTRAST_ROLLBACK=RESTORED_PREIMAGE')
                  else:
                      print('CONTRAST_ROLLBACK=MANUAL_REVIEW_DUE_TO_CONCURRENT_MODIFICATION')
              if stage.exists():stage.unlink()
              raise
          PY
      - name: Clean temporary runner keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-command-channel"
