name: PICM Ephemeral Encrypted Account Provisioning
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: mojplaywin-picm-credential-setup
  cancel-in-progress: false
jobs:
  credential:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: generate PICM one-time public key 2026-10-15'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify decrypt-only provisioning script syntax
        run: python3 -m py_compile scripts/picm_provision_user.py
      - name: Configure pinned relay and cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/picm-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P '' -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$WORK/config" <<EOF
          Host picm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" picm-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat >> "$WORK/config" <<EOF
          Host picm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump picm-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo PICM_RELAY_READY
      - name: Generate RSA-OAEP one-time key ONLY inside private cPanel home
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 80s ssh -F "$WORK/config" picm-host 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          test "$(id -un)" = zomorod2
          install -d -m 700 "$HOME/.picm-queue"
          key="$HOME/.picm-queue/login-provision-rsa-private.pem"
          test ! -L "$key"
          if [[ ! -f "$key" ]]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$key" 2>/dev/null
            chmod 600 "$key"
          fi
          echo PICM_ONE_TIME_PUBLIC_KEY_DER_BASE64_BEGIN
          openssl pkey -in "$key" -pubout -outform DER 2>/dev/null | base64 -w0
          echo
          echo PICM_ONE_TIME_PUBLIC_KEY_DER_BASE64_END
          echo PICM_PRIVATE_KEY_NEVER_EXPOSED
          REMOTE
      - name: Clean temporary auth script and runner SSH material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/picm-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/picm-ssh/config" picm-host "rm -rf /home/zomorod2/.picm-credential-$GITHUB_RUN_ID" || true
          fi
          rm -rf -- "$RUNNER_TEMP/picm-ssh"
