name: VPS Factory Stage 4 Relay Diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-factory-stage4-relay-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-factory-stage4-relay
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure pinned VPS and cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/saeit-ssh"; mkdir -m 700 -p "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          scan="$(ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null)"
          test -n "$scan"
          actual="$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf '%s\n' "$scan" > "$d/vps.known"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ServerAliveInterval 10
            ServerAliveCountMax 1
            ForwardAgent no
            RequestTTY no
            LogLevel ERROR
          EOF
          chmod 600 "$d/config"
      - name: Verify authenticated VPS relay
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s ssh -F "$RUNNER_TEMP/saeit-ssh/config" saeit-vps 'set -eu; id -un; hostname; echo VPS_RELAY_OK'
      - name: Refresh cPanel host pin only after confirmed fingerprint check
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "saeit-ssh"
          expected = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          endpoint = "[zohal.pws-dns.net]:1396"
          result = subprocess.run(
              ["ssh", "-F", str(root / "config"), "saeit-vps",
               "timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net"],
              capture_output=True, text=True, timeout=30)
          lines = [line.split() for line in result.stdout.splitlines()
                   if line and not line.startswith("#")]
          if result.returncode or not lines or any(
              len(parts) != 3 or parts[0] != endpoint or parts[1] != "ssh-ed25519"
              for parts in lines):
              sys.exit("CPANEL_HOST_KEY_SCAN_VALIDATION_FAILED")
          candidate = root / "host.candidate"
          candidate.write_text("\n".join(" ".join(parts) for parts in lines) + "\n")
          checked = subprocess.run(
              ["ssh-keygen", "-lf", str(candidate), "-E", "sha256"],
              capture_output=True, text=True, timeout=5)
          fingerprints = [line.split()[1] for line in checked.stdout.splitlines()
                          if len(line.split()) > 1]
          if checked.returncode or set(fingerprints) != {expected}:
              sys.exit("CPANEL_HOST_FINGERPRINT_MISMATCH; TRUST_PIN_NOT_CHANGED")
          (root / "host.known").write_text(candidate.read_text())
          (root / "host.known").chmod(0o600)
          print("CPANEL_HOST_FINGERPRINT_VERIFIED=" + expected)
      - name: Verify cPanel access through VPS relay
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s ssh -F "$RUNNER_TEMP/saeit-ssh/config" saeit-host 'set -eu; id -un; hostname; test -d /home/zomorod2/Saeit-staging; echo CPANEL_HOP_OK'
      - name: Inspect VPS factory Stage 4 configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/saeit-ssh/config" saeit-vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          ops="$base/operations"
          app="$base/django-app"
          log="$ops/vps-only-factory.log"
          test -d "$base"
          echo FACTORY_RUNTIME_PRESENT
          if test -f "$ops/vps-only-loop.pid"; then
            pid="$(cat "$ops/vps-only-loop.pid")"
            echo "FACTORY_PID=$pid"
            ps -p "$pid" -o args= || true
          fi
          if test -f "$log"; then
            echo FACTORY_LOG_TAIL
            tail -n 30 "$log"
          fi
          echo STAGE4_REFERENCES
          grep -RInE 'stage.?4|stage_four|stage4|step.?4|STAGE_4|FACTORY_STAGE' "$ops" "$app/core" --include='*.sh' --include='*.py' 2>/dev/null | cut -d: -f1-2 | head -80 || true
          echo STAGE4_SOURCE_SNIPPETS
          if test -f "$app/core/factory_stage4.py"; then sed -n '1,130p' "$app/core/factory_stage4.py" | sed -E 's/(SECRET|TOKEN|PASSWORD|API_KEY|PRIVATE_KEY|DATABASE_URL)[^=]*=.*/[REDACTED_CONFIG_LINE]/I'; fi
          if test -f "$app/core/factory_agent_runtime.py"; then sed -n '235,275p;475,520p' "$app/core/factory_agent_runtime.py" | sed -E 's/(SECRET|TOKEN|PASSWORD|API_KEY|PRIVATE_KEY|DATABASE_URL)[^=]*=.*/[REDACTED_CONFIG_LINE]/I'; fi
          echo FACTORY_OWNER_CODE
          sed -n '90,112p' "$app/core/factory_stage4.py" 2>/dev/null || true
          sed -n '210,240p' "$app/core/factory_agent_runtime.py" 2>/dev/null || true
          "$base/.venv/bin/python" - "$app/core/models.py" <<'PY'
          import sys
          lines=open(sys.argv[1],encoding="utf-8").read().splitlines()
          start=next((i for i,line in enumerate(lines) if line.startswith("class ResearchProject")),None)
          if start is None:
              print("RESEARCH_PROJECT_MODEL_NOT_FOUND")
          else:
              for line in lines[start:min(start+60,len(lines))]:
                  if line.startswith("class ") and line != lines[start]:
                      break
                  print(line)
          PY
          echo FACTORY_OWNER_READ_ONLY_COUNTS
          cd "$app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          "$base/.venv/bin/python" - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          from django.apps import apps
          User=get_user_model()
          from django.conf import settings
          print("AUTH_USER_MODEL="+str(settings.AUTH_USER_MODEL))
          print("USER_MODEL_LABEL="+str(User._meta.label))
          print("USER_USERNAME_FIELD="+str(User.USERNAME_FIELD))
          print("USER_REQUIRED_FIELDS="+",".join(User.REQUIRED_FIELDS))
          print("USER_MODEL_FIELDS="+",".join(field.name for field in User._meta.fields))
          qs=User.objects.filter(is_active=True,is_superuser=True)
          print("USER_TOTAL_COUNT="+str(User.objects.count()))
          print("USER_ACTIVE_COUNT="+str(User.objects.filter(is_active=True).count()))
          print("USER_ACTIVE_STAFF_COUNT="+str(User.objects.filter(is_active=True,is_staff=True).count()))
          print("ACTIVE_SUPERUSER_COUNT="+str(qs.count()))
          print("ACTIVE_SUPERUSER_IDS="+",".join(map(str,qs.values_list("pk",flat=True)[:20])))
          print("FACTORY_OWNER_SETTING_NAMES="+",".join(sorted(k for k in dir(settings) if "OWNER" in k.upper() and "FACTORY" in k.upper())))
          for model in apps.get_app_config("core").get_models():
              if model.__name__ in ("ResearchProject","FactoryTask","FactoryRun","AgentTask"):
                  print("MODEL="+model._meta.label+" COUNT="+str(model.objects.count()))
                  names={field.name for field in model._meta.get_fields()}
                  if "owner" in names:
                      print("OWNER_NULL_COUNT="+str(model.objects.filter(owner__isnull=True).count()))
          PY
          if test -f "$app/var/factory/discovery/latest.json"; then
            "$base/.venv/bin/python" - "$app/var/factory/discovery/latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          print("DISCOVERY_KEYS="+",".join(sorted(k for k in data if isinstance(k,str))[:40]))
          for key in ("status","stage","opportunity_count","evidence_count","pending_evidence_count","waiting_for_evidence"):
              value=data.get(key)
              if isinstance(value,(str,int,float,bool)) or value is None:
                  print(f"DISCOVERY_{key.upper()}={value}")
          PY
          else
            echo FACTORY_DISCOVERY_FILE_MISSING
          fi
          REMOTE
      - name: Remove runner SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/saeit-ssh"
