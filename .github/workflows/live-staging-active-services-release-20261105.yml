name: Recover backed-up staging service cards after failed restart
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/live-staging-active-services-release-20261105.yml
permissions:
  contents: read
concurrency:
  group: zm-staging-active-services-release-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact-hash guarded staging services template repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_staging_services_dedupe_release_20261105.py
      - name: Authenticate through pinned VPS to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-staging-dedupe-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_VPS_CPANEL_RELAY'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Reconfirm original backup without a new publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" "python3 - rollback '41974618315'" < scripts/live_staging_services_dedupe_release_20261105.py
      - name: Read-only verify restored staging templates and visible main website
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" 'python3 -' <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import urlopen

          home = Path('/home/zomorod2')
          expected = '195994985017c1cbc0247969f9215fbcb34d4cc3bd4f8aeeac92ff270d7350bc'
          conf = (home / 'Saeit-staging-web/.htaccess').read_text()
          match = re.search(r'(?m)^PassengerAppRoot\s+([^\s]+)\s*$', conf)
          if not match:
              raise SystemExit('STAGING_ROOT_MISSING')
          root = Path(match.group(1).strip('"'))
          if (root.is_symlink() or (home / 'Saeit-staging/admin-smoke') not in root.parents):
              raise SystemExit('STAGING_ROOT_UNSAFE')
          paths = (home / 'Saeit-staging/core/templates/core/services.html',
                   root / 'core/templates/core/services.html')
          result = {}
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('STAGING_TEMPLATE_PATH_UNSAFE')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              result[str(path)] = {'sha256': digest, 'restored': digest == expected}
              if digest != expected:
                  raise SystemExit('STAGING_ROLLBACK_NOT_CONFIRMED:' + str(path))
          backup = home / '.private/staging-services-backups/run-41974618315/original.html'
          if backup.is_symlink() or not backup.is_file():
              raise SystemExit('STAGING_ORIGINAL_BACKUP_MISSING')
          backup_sha = hashlib.sha256(backup.read_bytes()).hexdigest()
          if backup_sha != expected:
              raise SystemExit('STAGING_ORIGINAL_BACKUP_MISMATCH')
          print('STAGING_ROLLBACK_READONLY_VERIFIED=' + json.dumps(
              {'targets_restored': len(result), 'backup_sha256': backup_sha, 'paths': result},
              sort_keys=True), flush=True)
          for address in ('https://staging.zomorodmelal.ir/',
                          'https://zomorodmelal.ir/'):
              with urlopen(address, timeout=12) as response:
                  if response.status != 200:
                      raise SystemExit('HTTP_REGRESSION:' + address)
                  print('PUBLIC_HTTP_200=' + address, flush=True)
          PY
