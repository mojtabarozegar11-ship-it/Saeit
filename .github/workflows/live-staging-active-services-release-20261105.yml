name: Repair staging duplicate services with targeted LiteSpeed WSGI refresh
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - .github/workflows/live-staging-active-services-release-20261105.yml
permissions:
  contents: read
concurrency:
  group: zm-staging-active-services-release-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact-hash guarded staging services template repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_staging_services_dedupe_release_20261105.py
      - name: Authenticate through pinned VPS to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-staging-dedupe-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_VPS_CPANEL_RELAY'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Preview guarded staging service card replacements
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/live_staging_services_dedupe_release_20261105.py
      - name: Publish isolated staging services template with private backup
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/live_staging_services_dedupe_release_20261105.py
      - name: Activate the staging Passenger app at cPanel origin and verify it
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          timeout 155s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" "python3 - verify-origin '$GITHUB_RUN_ID'" < scripts/live_staging_services_dedupe_release_20261105.py
      - name: Verify restarted Passenger output and unique public staging cards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.request import Request, urlopen

          release_id = os.environ.get('GITHUB_RUN_ID', '')
          if not release_id.isdecimal():
              raise SystemExit('INVALID_RELEASE_RUN_ID')
          required = ('پژوهش‌های کاربردی', 'ابزارهای کاربردی', 'خبرنامهٔ شرکت', 'ارتباط و همکاری')
          retained = ('هوش مصنوعی', 'آموزش', 'دانشنامه')
          last_error = 'NOT_ATTEMPTED'

          def check(url):
              request = Request(url, headers={
                  'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache',
                  'User-Agent': 'ZM-Staging-Revised-Cards-Verification/1.0'})
              with urlopen(request, timeout=15) as response:
                  status = response.status
                  robots = response.headers.get('X-Robots-Tag', '')
                  html = response.read(220000).decode('utf-8', 'replace')
              titles = [re.sub(r'<[^>]+>', '', heading).strip()
                        for heading in re.findall(r'<h2[^>]*>(.*?)</h2>', html, re.I | re.S)]
              if status != 200 or 'noindex' not in robots.lower():
                  raise RuntimeError('STAGING_HTTP_OR_NOINDEX_REGRESSION')
              if any(titles.count(title) != 1 for title in required + retained):
                  raise RuntimeError('STAGING_CARD_UNIQUENESS_NOT_VISIBLE')
              if len(titles) != len(set(titles)):
                  raise RuntimeError('DUPLICATE_STAGING_H2_CARDS_REMAIN')
              return len(titles)

          for attempt in range(25):
              try:
                  # The active Passenger pool can recycle >60 seconds after restart.txt changes.
                  fresh_url = f'https://staging.zomorodmelal.ir/?zm_card_release={release_id}-{attempt}'
                  fresh_count = check(fresh_url)
                  root_count = check('https://staging.zomorodmelal.ir/')
                  with urlopen('https://zomorodmelal.ir/', timeout=15) as main:
                      if main.status != 200 or 'noindex' in main.headers.get('X-Robots-Tag', '').lower():
                          raise RuntimeError('PRODUCTION_MAIN_REGRESSION')
                  print(f'STAGING_UNIQUE_CARDS_VERIFIED=1 headings={root_count} fresh={fresh_count}')
                  break
              except Exception as exc:
                  last_error = type(exc).__name__ + ':' + str(exc)[:100]
                  if attempt == 24:
                      raise RuntimeError('PUBLIC_STAGING_TEMPLATE_VERIFICATION_FAILED ' + last_error)
                  if attempt % 5 == 0:
                      print('WAITING_FOR_PASSENGER_RENDER attempt=' + str(attempt + 1) +
                            ' latest=' + last_error)
                  time.sleep(9)
          PY
      - name: Rollback staging service card template if verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/live_staging_services_dedupe_release_20261105.py
