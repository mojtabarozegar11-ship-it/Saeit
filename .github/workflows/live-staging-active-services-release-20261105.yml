name: Audit staging worker ancestry and public consistency after restore
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/live-staging-active-services-release-20261105.yml
permissions:
  contents: read
concurrency:
  group: zm-staging-active-services-release-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact-hash guarded staging services template repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_staging_services_dedupe_release_20261105.py
      - name: Authenticate through pinned VPS to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-staging-dedupe-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_VPS_CPANEL_RELAY'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Read-only staging process parentage, restart behavior and 20-response consistency audit
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 100s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" 'python3 -' <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.request import Request,urlopen

          home=Path('/home/zomorod2')
          docroot=home/'Saeit-staging-web'
          conf=(docroot/'.htaccess').read_text('utf-8','replace')
          m=re.search(r'(?m)^PassengerAppRoot\s+([^\s]+)\s*$',conf)
          if not m:
              raise SystemExit('PASSENGER_APP_ROOT_NOT_FOUND')
          active=Path(m.group(1).strip('"'))
          if active.is_symlink() or (home/'Saeit-staging/admin-smoke') not in active.parents:
              raise SystemExit('ACTIVE_STAGING_ROOT_UNSAFE')
          paths=[home/'Saeit-staging/core/templates/core/services.html',
                 active/'core/templates/core/services.html']
          hashes=[]
          for p in paths:
              if p.is_symlink() or not p.is_file():
                  raise SystemExit('TEMPLATE_UNSAFE')
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          expected='195994985017c1cbc0247969f9215fbcb34d4cc3bd4f8aeeac92ff270d7350bc'
          if any(v!=expected for v in hashes):
              raise SystemExit('STAGING_BACKUP_NOT_RESTORED')

          known={str(active):'active_stage',str(home/'Saeit-staging'):'canonical_stage',
                 str(home/'Saeit'):'main'}
          def parent_node(pid):
              p=Path('/proc')/str(pid)
              try:
                  status=(p/'status').read_text(errors='replace')
                  parent=re.search(r'(?m)^PPid:\s+(\d+)',status)
                  uid=re.search(r'(?m)^Uid:\s+(\d+)',status)
                  if not parent or not uid:
                      return None
                  try:
                      cwd=os.readlink(str(p/'cwd'))
                  except OSError:
                      cwd='NOT_READABLE'
                  try:
                      exe=(p/'exe').resolve().name
                  except OSError:
                      exe='NOT_READABLE'
                  return {'pid':pid,'ppid':int(parent.group(1)),
                          'same_user':int(uid.group(1))==os.geteuid(),
                          'exe':exe,'cwd_group':known.get(cwd,
                              'other_or_unreadable')}
              except (OSError,PermissionError,ValueError):
                  return None

          workers=[]
          ancestry={}
          for p in Path('/proc').iterdir():
              if not p.name.isdecimal():
                  continue
              try:
                  cwd=os.readlink(str(p/'cwd'))
                  if cwd not in (str(active),str(home/'Saeit-staging')):
                      continue
                  node=parent_node(int(p.name))
                  if not node or not node['same_user'] or node['exe']!='lswsgi':
                      continue
                  cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode('utf-8','replace')
                  if 'passenger' not in cmd.lower():
                      continue
                  workers.append(node)
                  current=node
                  chain=[]
                  for _ in range(5):
                      parent_id=current.get('ppid',0)
                      if parent_id<=1:
                          break
                      parent=parent_node(parent_id)
                      if parent is None or parent['pid']==current['pid']:
                          break
                      chain.append(parent)
                      current=parent
                  ancestry[node['pid']]=chain
              except (OSError,PermissionError,ValueError,FileNotFoundError):
                  continue
          variants={}
          entries=[]
          for i in range(20):
              stamp=str(int(time.time()*1000000))+'-'+str(i)
              req=Request('https://staging.zomorodmelal.ir/?zm_after_rollback_diag='+stamp,
                  headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache',
                  'User-Agent':'ZM-Restore-ReadOnly-Consistency/1.0'})
              with urlopen(req,timeout=10) as response:
                  content=response.read(220000)
                  status=response.status
              h2=[re.sub('<[^>]+>','',t).strip() for t in re.findall(
                  r'<h2[^>]*>(.*?)</h2>',content.decode('utf-8','replace'),re.I|re.S)]
              duplicates=sorted(set(v for v in h2 if h2.count(v)>1))
              key=str(len(content))+'_'+('DUP' if duplicates else 'UNIQUE')
              variants[key]=variants.get(key,0)+1
              entries.append({'n':i+1,'http':status,'bytes':len(content),
                              'duplicate_h2':duplicates})
          print('STAGING_READONLY_AFTER_RESTORE='+json.dumps({
              'changed_files':0,'templates_restored':len(hashes),
              'processes':workers,'parent_chains':ancestry,
              'response_variant_counts':variants,'samples':entries},
              ensure_ascii=False,sort_keys=True),flush=True)
          PY
