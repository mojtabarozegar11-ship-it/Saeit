name: Attribute old and new staging responses to exact LiteSpeed workers
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/live-staging-active-services-release-20261105.yml
permissions:
  contents: read
concurrency:
  group: zm-staging-active-services-release-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact-hash guarded staging services template repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_staging_services_dedupe_release_20261105.py
      - name: Authenticate through pinned VPS to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-staging-dedupe-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_VPS_CPANEL_RELAY'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Per-request read-only LiteSpeed worker and cached-template attribution
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 110s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" 'python3 -' <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.request import Request,urlopen

          home=Path('/home/zomorod2')
          conf=(home/'Saeit-staging-web/.htaccess').read_text('utf-8','replace')
          root_match=re.search(r'(?m)^PassengerAppRoot\s+([^\s]+)\s*$',conf)
          if not root_match:
              raise SystemExit('ACTIVE_APP_ROOT_NOT_FOUND')
          active=Path(root_match.group(1).strip('"'))
          allowed={str(active):'active_stage',str(home/'Saeit-staging'):'canonical_stage'}
          if active.is_symlink() or (home/'Saeit-staging/admin-smoke') not in active.parents:
              raise SystemExit('ACTIVE_APP_ROOT_INVALID')
          def proc_workers():
              found={}
              for p in Path('/proc').iterdir():
                  if not p.name.isdecimal():
                      continue
                  try:
                      cwd=os.readlink(str(p/'cwd'))
                      category=allowed.get(cwd)
                      if category is None:
                          continue
                      status=(p/'status').read_text(errors='replace')
                      uid=re.search(r'(?m)^Uid:\s+(\d+)',status)
                      if not uid or int(uid.group(1))!=os.geteuid():
                          continue
                      name=(p/'exe').resolve().name
                      cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode('utf-8','replace')
                      if name!='lswsgi' or 'passenger' not in cmd.lower():
                          continue
                      io={}
                      for line in (p/'io').read_text().splitlines():
                          parts=line.split(':',1)
                          if len(parts)==2 and parts[0] in ('syscr','rchar','syscw'):
                              io[parts[0]]=int(parts[1].strip())
                      age=None
                      stat=(p/'stat').read_text()
                      tail=stat.rsplit(')',1)[1].split()
                      if len(tail)>19:
                          ticks=os.sysconf('SC_CLK_TCK')
                          uptime=float(Path('/proc/uptime').read_text().split()[0])
                          age=round(uptime-int(tail[19])/ticks)
                      found[int(p.name)]={'category':category,'io':io,'age_sec':age}
                  except (FileNotFoundError,OSError,PermissionError,ValueError):
                      continue
              return found

          details=[]
          observations=[]
          for index in range(16):
              before=proc_workers()
              timestamp=str(int(time.time()*1000000))
              url='https://staging.zomorodmelal.ir/?zm_worker_mix_diag='+timestamp+'-'+str(index)
              request=Request(url,headers={'Cache-Control':'no-cache, no-store',
                                'Pragma':'no-cache','User-Agent':'ZM-Worker-ReadOnly-Attribution/1.0'})
              with urlopen(request,timeout=12) as response:
                  content=response.read(220000)
                  status=response.status
              after=proc_workers()
              workers=[]
              for pid,a in after.items():
                  b=before.get(pid)
                  if b is None:
                      continue
                  reads=a['io'].get('syscr',0)-b['io'].get('syscr',0)
                  chars=a['io'].get('rchar',0)-b['io'].get('rchar',0)
                  if reads>0 or chars>0:
                      workers.append({'pid':pid,'group':a['category'],'reads':reads,
                                      'rchar':chars,'age_sec':a['age_sec']})
              workers.sort(key=lambda x:x['reads'],reverse=True)
              bodylen=len(content)
              variant=('new_cards_in_memory' if bodylen==11849 else
                       'old_cards_in_memory' if bodylen==11624 else 'other')
              heads=[re.sub('<[^>]+>','',x).strip() for x in
                     re.findall(r'<h2[^>]*>(.*?)</h2>',content.decode('utf-8','replace'),re.I|re.S)]
              observations.append({'n':index+1,'http':status,'bytes':bodylen,
                                   'variant':variant,'duplicates':sorted(set(
                                      h for h in heads if heads.count(h)>1)),
                                   'active_reads':workers[:5]})
              if index==0:
                  details=[{'pid':pid,'group':v['category'],'age_sec':v['age_sec']} for pid,v in before.items()]
          totals={}
          for obs in observations:
              label=obs['variant']
              totals[label]=totals.get(label,0)+1
          print('STAGING_TEMPLATE_WORKER_ATTRIBUTION='+json.dumps({
              'no_writes':True,'worker_inventory_initial':details,
              'response_variant_counts':totals,'per_request':observations},
              ensure_ascii=False,sort_keys=True),flush=True)
          PY
