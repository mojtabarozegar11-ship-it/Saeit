name: Trace live staging worker requests without changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/live-staging-active-services-release-20261105.yml
permissions:
  contents: read
concurrency:
  group: zm-staging-active-services-release-20261105
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact-hash guarded staging services template repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_staging_services_dedupe_release_20261105.py
      - name: Authenticate through pinned VPS to cPanel
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-staging-dedupe-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_VPS_CPANEL_RELAY'
              break
            fi
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging-web/.htaccess' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_CPANEL_DIRECT'
            else
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Read-only trace of staging worker activity, page headers and exact template sources
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 85s ssh -T -F "$RUNNER_TEMP/zm-staging-dedupe-ssh/config" "$COMMAND_HOST" 'python3 -' <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          home = Path('/home/zomorod2')
          allowed_roots = {
              str(home / 'Saeit'): 'main',
              str(home / 'Saeit-staging'): 'canonical_stage',
          }
          conf = (home / 'Saeit-staging-web/.htaccess').read_text('utf-8','replace')
          match = re.search(r'(?m)^PassengerAppRoot\s+([^\s]+)\s*$', conf)
          if not match:
              raise SystemExit('STAGE_HTACCESS_ROOT_NOT_FOUND')
          active = Path(match.group(1).strip('"'))
          if active.is_symlink() or (home / 'Saeit-staging/admin-smoke') not in active.parents:
              raise SystemExit('STAGE_HTACCESS_ROOT_OUT_OF_SCOPE')
          allowed_roots[str(active)] = 'configured_stage'
          wanted = ('rchar','wchar','syscr','syscw','read_bytes','write_bytes')

          def workers():
              seen = {}
              for p in Path('/proc').iterdir():
                  if not p.name.isdecimal():
                      continue
                  try:
                      cwd = os.readlink(str(p / 'cwd'))
                      category = allowed_roots.get(cwd)
                      if not category:
                          continue
                      st = (p / 'status').read_text(errors='replace')
                      uid = re.search(r'(?m)^Uid:\s+(\d+)', st)
                      if not uid or int(uid.group(1)) != os.geteuid():
                          continue
                      cmd = (p / 'cmdline').read_bytes().replace(b'\0',b' ').decode('utf-8','replace')
                      exe = (p / 'exe').resolve().name
                      if exe != 'lswsgi' or 'passenger' not in cmd.lower():
                          continue
                      io = {}
                      try:
                          txt=(p / 'io').read_text()
                          for k in wanted:
                              m=re.search(r'(?m)^'+k+r':\s+(\d+)$',txt)
                              if m:
                                  io[k]=int(m.group(1))
                      except (OSError,PermissionError):
                          io={'unavailable':1}
                      seen[int(p.name)]={'category':category,'io':io}
                  except (OSError,ValueError,PermissionError,FileNotFoundError):
                      continue
              return seen

          before=workers()
          responses=[]
          for i in range(5):
              stamp=str(int(time.time()*1000))+'-'+str(i)
              url='https://staging.zomorodmelal.ir/?zm_readonly_worker_trace='+stamp
              req=Request(url,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache',
                  'User-Agent':'ZM-Stage-ReadOnly-Worker-Trace/1.0'})
              with urlopen(req,timeout=10) as response:
                  data=response.read(220000)
                  headers={key:response.headers.get(key) for key in
                      ('Cache-Control','Age','ETag','X-LiteSpeed-Cache',
                       'X-Cache','Vary','Server','X-Robots-Tag')
                      if response.headers.get(key) is not None}
                  responses.append({'status':response.status,
                                    'bytes':len(data),
                                    'body_sha256':hashlib.sha256(data).hexdigest(),
                                    'headers':headers})
          after=workers()
          counts={}
          for entry in after.values():
              cat=entry['category']
              counts[cat]=counts.get(cat,0)+1
          deltas={}
          stable={}
          for pid,a in after.items():
              b=before.get(pid)
              if b is None or b['category']!=a['category']:
                  continue
              cat=a['category']
              stable[cat]=stable.get(cat,0)+1
              for key in wanted:
                  av=a['io'].get(key)
                  bv=b['io'].get(key)
                  if isinstance(av,int) and isinstance(bv,int):
                      deltas.setdefault(cat,{}).setdefault(key,0)
                      deltas[cat][key]+=max(0,av-bv)
          inventory={}
          candidates=[home/'Saeit/core/templates/core/services.html',
                      home/'Saeit-staging/core/templates/core/services.html',
                      active/'core/templates/core/services.html']
          candidates.extend((home/'Saeit-staging/admin-smoke').glob('*/core/templates/core/services.html'))
          for file in candidates[:150]:
              if file.is_symlink() or not file.is_file():
                  continue
              item={'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),
                    'relative':str(file).replace(str(home)+'/','')}
              inventory[item['relative']]=item['sha256']
          markers={}
          for root_label,root in (('canonical',home/'Saeit-staging'),
                                  ('configured',active)):
              marker=root/'tmp/restart.txt'
              if marker.is_file() and not marker.is_symlink():
                  markers[root_label]=round(time.time()-marker.stat().st_mtime)
          print('STAGING_READONLY_REQUEST_TRACE='+json.dumps({
              'changes':0, 'current_configured_root':str(active).replace(str(home)+'/',''),
              'before_processes':len(before),'after_processes':len(after),
              'stable_owned_workers':stable,'worker_counts':counts,
              'five_request_io_deltas':deltas,'response_samples':responses,
              'service_template_hashes':inventory,'restart_marker_ages_seconds':markers},
              ensure_ascii=False,sort_keys=True),flush=True)
          PY
