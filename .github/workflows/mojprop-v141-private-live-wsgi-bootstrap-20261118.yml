name: "MOJ PROP — boot independent real cPanel WSGI privately, NO CUSTOMER COLLECTION"
on:
  push:
    branches: [ops/mojprop-private-wsgi-cpanel-readiness-20261118]
permissions:
  contents: read
concurrency:
  group: mojprop-v141-private-real-cpanel-wsgi-20261118
  cancel-in-progress: false
jobs:
  pinned-cpanel-private-wsgi:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private-host-only WSGI smoke source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path
          p=Path("scripts/mojprop_private_live_wsgi_bootstrap_readonly_20261118.py")
          compile(p.read_text("utf-8"),str(p),"exec")
          print("CPANEL_PRIVATE_WSGI_SCRIPT_SYNTAX=OK")
          PY
      - name: On owner cPanel boot isolated WSGI from pinned staged code, ZERO live payments
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${HOST_KEY:?OWNER_CPANEL_SSH_KEY_UNAVAILABLE}"
          umask 077
          dir="$RUNNER_TEMP/mojprop-standalone-wsgi-secure-ssh"
          install -d -m 700 "$dir"
          trap 'rm -f -- "$dir/key" "$dir/known"; rmdir "$dir" 2>/dev/null || true' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();sys.stdout.write(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n")' > "$dir/key"
          chmod 600 "$dir/key"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$dir/known"
          test "$(ssh-keygen -lf "$dir/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 120s ssh -T -i "$dir/key" -p 1396 \
            -o UserKnownHostsFile="$dir/known" -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no \
            -o RequestTTY=no -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            zomorod2@178.239.147.125 \
            'test "$(id -un)" = zomorod2; PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/mojprop_private_live_wsgi_bootstrap_readonly_20261118.py \
            | python3 -B -c 'import json,sys;raw=sys.stdin.read(14000);lines=[x for x in raw.splitlines() if x.startswith("MOJPROP_PRIVATE_CPANEl_WSGI_READINESS=")];assert len(lines)==1,raw[-1800:];r=json.loads(lines[0].split("=",1)[1]);print(lines[0]);required=("staged_app_verified","private_merchant_db_verified","django_secret_on_private_host","wsgi_callable_booted","effective_serializable_sqlite","models_match_migrated_schema","login_http_200","csrf_present","anonymous_invoice_requires_auth","unknown_invoice_not_found");assert all(r.get(x) is True for x in required),r;assert r["paid_invoices_found"]==0 and r["live_payment_activated"] is False and r["public_files_modified"] is False'
          echo "PRIVATE_CPANEl_WSGI_READY_WITH_NO_PUBLIC_ROUTE_OR_PAYMENT=true"
