name: MojPlayWin backup pair compare v4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-compare:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 12
    env:
      HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned cPanel relay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          work="$RUNNER_TEMP/mpw-pair-v4"
          install -d -m 700 "$work"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P '' -f "$work/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$work/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$work/config" <<EOF
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $work/host.key
            UserKnownHostsFile $work/host.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 20
            ServerAliveCountMax 3
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          printf '%s\n' "$work" > "$RUNNER_TEMP/mpw-pair-v4-path"
      - name: Compare raw and gzip streams without extraction
        shell: bash
        run: |
          set -euo pipefail
          work="$(cat "$RUNNER_TEMP/mpw-pair-v4-path")"
          timeout 600s ssh -T -F "$work/config" saeit-cpanel 'python3 -B -' < scripts/mpw_backup_pair_compare_readonly_20261119_v4.py > "$RUNNER_TEMP/mpw-pair-v4-output"
          python3 - "$RUNNER_TEMP/mpw-pair-v4-output" <<'PY'
          import json,sys
          rows=[line for line in open(sys.argv[1],encoding="utf-8") if line.startswith("MPW_BACKUP_PAIR_COMPARE_READONLY=")]
          assert len(rows)==1
          d=json.loads(rows[0].split("=",1)[1])
          assert d["read_only"] is True and d["files_deleted"] is False and d["safe_to_delete"] is False
          print(rows[0],end="")
          PY
      - name: Confirm no mutation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'READ_ONLY=1' 'EXTRACTION=0' 'DELETION=0' 'DEPLOYMENT=0' 'EXTERNAL_TRANSFER=0'
