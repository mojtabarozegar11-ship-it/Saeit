name: Crown Defender isolated PR gameplay regression
on:
  pull_request:
    paths:
      - 'games/crown-defender/**'
      - 'tests/game/crown-v120.cjs'
      - '.github/workflows/crown-defender-pr-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crown-defender-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gameplay-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise actual Crown Defender game and safe MOJ1-disabled commerce
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node tests/game/crown-v120.cjs
