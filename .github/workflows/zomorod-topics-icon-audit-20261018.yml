name: Zomorod current topics link identity read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-topics-icon-audit-20261018.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"

      - name: Inspect current root homepage's exact topics marker
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/zomorod-baseline-inventory/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('/home/zomorod2/public_html/index.html')
          assert p.is_file() and not p.is_symlink()
          s=p.read_text('utf8')
          print('ZM_ROOT_SHA='+hashlib.sha256(s.encode()).hexdigest())
          print('ZM_ROOT_SIZE='+str(len(s)))
          for key in ('zm-full-topics-index-link','zm-gold-search-toolbar-20261018','zm-gold-toolbar-controls','</footer>','</head>','/topics/','/search/','/store/'):
            print('KEY='+key+' COUNT='+str(s.count(key))+' FIRST='+str(s.find(key)))
          for pat in ('<p class="zm-full-topics-index-link"','<nav class="zm-gold-toolbar-controls"','<footer class="footer"'):
            idx=s.find(pat)
            if idx>=0: print('FRAGMENT='+pat+' '+re.sub(r'\s+',' ',s[idx:idx+1100])[:1100])
          PY
      - name: Verify /topics/ route anonymously
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          u='https://zomorodmelal.ir/topics/'
          with urlopen(Request(u,headers={'User-Agent':'ZomorodTopicsLinkAudit/1.0','Cache-Control':'no-cache'}),timeout=20) as r:
            print('TOPICS_STATUS='+str(r.status))
            print('TOPICS_BODY_BYTES='+str(len(r.read(1500000))))
          PY
      - name: Clear key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-baseline-inventory"
