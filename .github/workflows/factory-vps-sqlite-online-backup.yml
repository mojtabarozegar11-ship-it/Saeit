name: Factory SQLite Online Backup To VPS
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-sqlite-online-backup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Create SQLite consistent online backup in isolated private path
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-host 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/zomorod2/Saeit-staging
          umask 077
          mkdir -p var/factory/operations/private-db-transfer
          SAEIT_ENV=production /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python manage.py shell -c '
          import sqlite3
          from django.conf import settings
          from pathlib import Path
          source=Path(settings.DATABASES["default"]["NAME"]).resolve()
          target=Path("var/factory/operations/private-db-transfer/factory-migration-snapshot.sqlite3").resolve()
          assert source.is_file() and source != target
          with sqlite3.connect("file:"+str(source)+"?mode=ro",uri=True) as s, sqlite3.connect(str(target)) as t:
              s.backup(t,pages=200,sleep=0.1)
              assert t.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              names={x[0] for x in t.execute("SELECT name FROM sqlite_master WHERE type=\"table\"")}
              assert "core_factoryrun" in names and "core_agent" in names
              print("SQLITE_ONLINE_BACKUP_OK",target.stat().st_size,"bytes",len(names),"tables")
          '
          REMOTE
          ssh -F "$d/config" saeit-host 'base64 /home/zomorod2/Saeit-staging/var/factory/operations/private-db-transfer/factory-migration-snapshot.sqlite3' | base64 -d > "$RUNNER_TEMP/factory-migration-snapshot.sqlite3"
          ssh -F "$d/config" saeit-host 'rm -f /home/zomorod2/Saeit-staging/var/factory/operations/private-db-transfer/factory-migration-snapshot.sqlite3'
          test -s "$RUNNER_TEMP/factory-migration-snapshot.sqlite3"
          python - "$RUNNER_TEMP/factory-migration-snapshot.sqlite3" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1])
          assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert c.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name LIKE 'core_factory%'").fetchone()[0]>=6
          print("RUNNER_SNAPSHOT_INTEGRITY_OK")
          PY
          echo SOURCE_SHA256
          sha256sum "$RUNNER_TEMP/factory-migration-snapshot.sqlite3"
          ssh -F "$d/config" saeit-vps 'mkdir -p "$HOME/factory-transfer-incoming/private-db" && chmod 700 "$HOME/factory-transfer-incoming/private-db"'
          cat "$RUNNER_TEMP/factory-migration-snapshot.sqlite3" | ssh -F "$d/config" saeit-vps 'umask 077; cat > "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3" && chmod 600 "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"'
          ssh -F "$d/config" saeit-vps 'echo DESTINATION_SHA256; sha256sum "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"; python3 -c '\''import sqlite3,os; p=os.path.expanduser("~/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"); c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; print("VPS_SNAPSHOT_INTEGRITY_OK")'\'''
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay" "$RUNNER_TEMP/factory-migration-snapshot.sqlite3"
