name: Inspect live MojPlayWin trial exposure anchors
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-inspect-trial-exposure-20261107.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Establish pinned relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; umask 077; d="$RUNNER_TEMP/i"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/v"; printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/h"; chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vk" 2>/dev/null; test "$(ssh-keygen -lf "$d/vk" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/c" <<EOF
          Host v
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/v
            UserKnownHostsFile $d/vk
          Host h
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/h
            UserKnownHostsFile $d/hk
            ProxyJump v
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            RequestTTY no
          EOF
          timeout 30s ssh -F "$d/c" v 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/hc" 2>/dev/null; test "$(ssh-keygen -lf "$d/hc" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; mv "$d/hc" "$d/hk"
      - name: Print exact live anchors without writes
        run: |
          timeout 90s ssh -T -F "$RUNNER_TEMP/i/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          from pathlib import Path
          root=Path('/home/zomorod2/Saeit-staging')
          for name in ('core/brand_views.py','config/settings.py','core/templates/mojplaywin/store.html','core/templates/brands/mojplaywin/product.html','services/mpw_trx_public_pages.py','services/mpw_trx_commercial_web.py'):
              p=root/name
              if not p.is_file(): print('MISSING',name); continue
              s=p.read_text(errors='replace')
              hits=[(i+1,line[:500]) for i,line in enumerate(s.splitlines()) if any(x in line for x in ('779','779-20261026','MPW_TRX_PUBLIC_PRODUCT_IDS','MojPlayWin Secure TRX Purchase','MPW_TWO_BOOKS_PUBLIC_CATALOG_V1_START'))]
              print('FILE',name,'HITS',hits[:80])
          PY
      - name: Remove temporary relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/i"
