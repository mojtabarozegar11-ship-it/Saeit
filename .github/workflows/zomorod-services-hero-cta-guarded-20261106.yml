name: Guarded live Zomorod services hero conversion CTAs
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - scripts/zomorod_services_hero_cta_guarded_20261106.py
      - .github/workflows/zomorod-services-hero-cta-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-service-hero-cta-20261106
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate one exact static HTML edit
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_services_hero_cta_guarded_20261106.py
          python3 scripts/zomorod_services_hero_cta_guarded_20261106.py selftest
      - name: Authenticate pinned cPanel identity through direct or existing VPS path
        id: link
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-hero-cta-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          directory=Path(os.environ['SSH_DIR'])
          for source_name,filename in [('vps.known','vps.known'),('host.candidate','host.known')]:
              suffix=f'> "$d/{source_name}"'
              matches=[line.strip() for line in source.splitlines() if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches)!=1:raise SystemExit('HERO_PINNED_IDENTITY_MISSING:'+source_name)
              (directory/filename).write_text(matches[0].split("printf '%s\\n' '",1)[1].rsplit("' >",1)[0]+'\n')
          for name,filename in [('VPS_KEY','vps.key'),('HOST_KEY','host.key')]:
              raw=os.environ.get(name,'')
              if not raw:raise SystemExit('HERO_KEY_NOT_CONFIGURED:'+name)
              target=directory/filename
              target.write_text(raw.replace('\r\n','\n').replace('\r','').replace('\\n','\n').rstrip()+'\n')
              target.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            host=saeit-cpanel-direct
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            host=saeit-cpanel
          else
            exit 1
          fi
          echo "command_host=$host" >> "$GITHUB_OUTPUT"
          echo 'HERO_SSH_AUTHENTICATED=1'
      - name: Verify exact untouched predecessor at live origin
        env:
          HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-hero-cta-ssh/config" "$HOST" 'python3 - preview' < scripts/zomorod_services_hero_cta_guarded_20261106.py
      - name: Privately back up and connect top-page conversion links
        id: publish
        env:
          HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-hero-cta-ssh/config" "$HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_services_hero_cta_guarded_20261106.py
      - name: Verify original bytes and public page and specialist form with GET only
        env:
          HOST: ${{ steps.link.outputs.command_host }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-hero-cta-ssh/config" "$HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_services_hero_cta_guarded_20261106.py
          python3 - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          base='https://zomorodmelal.ir'
          runid=os.environ['RUN_ID']
          for attempt in range(6):
              try:
                  req=Request(base+'/services/?zm_hero_cta='+runid+'-'+str(attempt),headers={'Cache-Control':'no-cache','User-Agent':'Zomorod-Service-Hero-Verify/1.0'})
                  with urlopen(req,timeout=27) as response:
                      html=response.read(130000).decode('utf-8','replace')
                      if response.status!=200:raise RuntimeError('PUBLIC_SERVICE_NOT_200')
                  for marker in ['data-zm-hero-cta="zm-service-hero-cta-20261106"',
                      '<a class="zm-link" href="/ask-master/index.php?service=1">',
                      'href="#zm-farm-margin-calculator-20261106"',
                      'id="zm-farm-margin-calculator-20261106"','zm-service-deliverables-20261106']:
                      if marker not in html:raise RuntimeError('HERO_PUBLIC_LINK_MISSING:'+marker)
                  print('PUBLIC_HERO_FUNNEL_LINKS_VERIFIED=1')
                  break
              except Exception:
                  if attempt==5:raise
                  time.sleep(4)
          req=Request(base+'/ask-master/index.php?service=1&zm_hero_check='+runid,headers={'Cache-Control':'no-cache'})
          with urlopen(req,timeout=25) as response:
              body=response.read(100000).decode('utf-8','replace')
              if response.status!=200 or '<option value="service_question" selected>' not in body:
                  raise RuntimeError('HERO_SERVICE_INQUIRY_FORM_NOT_SELECTED')
          print('PUBLIC_HERO_SPECIALIST_INQUIRY_VERIFIED=1')
          PY
      - name: Roll back only this exact edit if public checks fail
        if: failure() && steps.publish.outcome == 'success'
        env:
          HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-hero-cta-ssh/config" "$HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_services_hero_cta_guarded_20261106.py
