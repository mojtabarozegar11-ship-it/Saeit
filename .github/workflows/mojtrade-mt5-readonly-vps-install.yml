name: MojTrade MT5 read-only VPS installation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mojtrade-mt5-readonly-vps-install.yml

permissions:
  contents: read

concurrency:
  group: mojtrade-mt5-readonly-vps-install
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify MT5 without enabling trading
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/mojtrade-mt5"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          ssh "${opts[@]}" githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -euo pipefail
          report="$HOME/factory-runtime/private/mojtrade/mt5-readonly-install-report.txt"
          install -d -m 700 "$(dirname "$report")"
          exec > >(tee "$report") 2>&1
          echo "MOJTRADE_MT5_READONLY_INSTALL_START"
          echo "UTC=$(date -u +%FT%TZ)"
          echo "USER=$(id -un)"
          echo "OS=$(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "ARCH=$(dpkg --print-architecture 2>/dev/null || uname -m)"
          free_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          echo "HOME_FREE_KB=$free_kb"
          test "$free_kb" -ge 3145728 || { echo "BLOCKED_INSUFFICIENT_DISK_NEED_AT_LEAST_3_GIB_FREE"; exit 20; }
          sudo -n true || { echo "BLOCKED_NONINTERACTIVE_SUDO_REQUIRED"; exit 21; }
          command -v curl >/dev/null || { echo "BLOCKED_CURL_MISSING"; exit 22; }
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine64 xvfb cabextract
          export WINEPREFIX="$HOME/.wine-mojtrade-mt5"
          export WINEARCH=win64
          mkdir -p "$WINEPREFIX"
          xvfb-run -a wineboot -u
          mkdir -p "$HOME/.local/share/mojtrade/mt5"
          curl --fail --location --retry 2 --max-time 120 'https://litefinance.org/uploads/download_mt/litefinance5setup.exe?v=dc32bc17' -o "$HOME/.local/share/mojtrade/litefinance5setup.exe"
          xvfb-run -a wine "$HOME/.local/share/mojtrade/litefinance5setup.exe" /silent /dir="$HOME/.local/share/mojtrade/mt5"
          test -f "$HOME/.local/share/mojtrade/mt5/terminal64.exe"
          echo "MOJTRADE_MT5_TERMINAL_INSTALLED"
          echo "MOJTRADE_REAL_ORDERS_ZERO"
          echo "MOJTRADE_ACCOUNT_LOGIN_NOT_CONFIGURED"
          echo "MOJTRADE_READONLY_CONNECTION_PENDING_INVESTOR_PASSWORD"
          echo "MOJTRADE_PUBLICATION_DISABLED"
          REMOTE
