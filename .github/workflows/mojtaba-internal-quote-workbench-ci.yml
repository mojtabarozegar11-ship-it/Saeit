name: Mojtaba owner-only CRM review and internal quote workbench

on:
  pull_request:
    branches:
      - feature/mojtaba-native-b2b-inquiry-20261114
    paths:
      - core/company_quote_workflow.py
      - core/company_sales_pipeline.py
      - core/tests/test_mojtaba_internal_quote_workbench_20261114.py
      - command_center/company_quote_desk.py
      - command_center/urls.py
      - command_center/templates/command_center/sales_cases.html
      - command_center/templates/command_center/sales_case_detail.html
      - command_center/templates/command_center/dashboard.html
      - .github/workflows/mojtaba-internal-quote-workbench-ci.yml

permissions:
  contents: read

jobs:
  private-quote-no-send:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEBUG: "true"
      SECRET_KEY: "isolated-owner-internal-quote-ci-secret"
      ALLOWED_HOSTS: "testserver,zomorodmelal.ir,mojplaywin.com"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TRADE_EMAIL_ENABLED: "false"
      CROWN_STORE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks
        run: python manage.py check
      - name: Lead to quote, owner access, exact-price and existing revenue regressions
        run: |
          python -m pytest -q \
            core/tests/test_mojtaba_internal_quote_workbench_20261114.py \
            core/tests/test_native_company_sales_intake_20261114.py \
            tests/test_company_inquiry_validation_20261106.py \
            core/tests/test_mojtaba_revenue_evidence_20261114.py \
            core/tests/test_commerce_funnel.py
      - name: Compile strict price and owner surfaces
        run: |
          python -m compileall -q \
            core/company_quote_workflow.py \
            core/company_sales_pipeline.py \
            command_center/company_quote_desk.py \
            core/tests/test_mojtaba_internal_quote_workbench_20261114.py
