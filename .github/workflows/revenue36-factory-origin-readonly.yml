name: Revenue36 VPS factory runner to cPanel read-only proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/revenue36-factory-origin-readonly.yml"

permissions:
  contents: read

jobs:
  factory-origin-readonly:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 6
    steps:
      - name: Inspect read-only cPanel runtime over pinned existing private SSH
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$HOST_KEY" ]]; then
            echo "::error::cPanel SSH key absent; no remote access attempted"
            exit 1
          fi
          d="$RUNNER_TEMP/revenue36-factory-origin-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          if ! timeout 14s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net > "$d/known" 2>/dev/null; then
            echo "::error::cPanel port 1396 unreachable from VPS runner"
            exit 1
          fi
          known_fingerprint="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"
          if [[ "$known_fingerprint" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" ]]; then
            echo "::error::cPanel SSH host fingerprint mismatch"
            exit 1
          fi
          timeout 45s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ForwardAgent=no \
            -p 1396 zomorod2@zohal.pws-dns.net '
              set -eu
              BASE=/home/zomorod2/Saeit-staging
              APP=/home/zomorod2/mojplaywin.com
              echo "CPANEL_AUTH_AND_PIN_OK=yes"
              echo "STAGING_PATH_EXISTS=$(test -d "$BASE" && echo yes || echo no)"
              echo "WSGI_EXISTS=$(test -f "$APP/passenger_wsgi.py" && echo yes || echo no)"
              echo "WSGI_TARGETS_STAGING=$(test -f "$APP/passenger_wsgi.py" && grep -Fq Saeit-staging "$APP/passenger_wsgi.py" && echo yes || echo no)"
              echo "MOJ_PROP_ROUTE_PRESENT=$(test -f "$BASE/config/urls.py" && grep -Fq moj-prop/ "$BASE/config/urls.py" && echo yes || echo no)"
              echo "SIGNAL_INTAKE_ROUTE_PRESENT=$(test -f "$BASE/config/urls.py" && grep -Fq market-signals/interest/ "$BASE/config/urls.py" && echo yes || echo no)"
              echo "PROP_PUBLIC_MODULE_PRESENT=$(test -f "$BASE/core/moj_prop_public.py" && echo yes || echo no)"
              echo "CORE_0041_MIGRATION_FILE=$(test -f "$BASE/core/migrations/0041_signalinterest.py" && echo yes || echo no)"
              echo "DISK_KILOBYTES"
              df -Pk /home/zomorod2
              echo "STAGING_GIT_REPOSITORY=$(test -d "$BASE/.git" && echo yes || echo no)"
              if test -d "$BASE/.git"; then
                printf "STAGING_GIT_SHA="
                git -C "$BASE" rev-parse --short HEAD || true
                printf "STAGING_WORKTREE_CHANGE_COUNT="
                git -C "$BASE" status --porcelain --untracked-files=no | wc -l
              fi
              for f in config/urls.py core/models.py core/admin.py core/financial_brand_pages.py core/templates/core/financial_brand_page.html; do
                if test -f "$BASE/$f"; then
                  printf "STAGING_FILE_SHA256 %s " "$f"
                  git hash-object "$BASE/$f"
                else
                  printf "STAGING_FILE_MISSING %s\n" "$f"
                fi
              done
              echo "DJANGO_RUNTIME_PYTHON=$(test -x /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python && echo yes || echo no)"
            '
