name: CI

on:
  push:
    branches: [main, "completion/**"]
  pull_request:
    branches: [main]

# Keep the latest push CI result; never cancel an in-progress PR review check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    # Namespace-backed, fail-closed self-improvement regression tests require
    # unprivileged user namespaces; Ubuntu 24.04 hosted images restrict these.
    # Keep the namespace tests mandatory; never execute proposed code unsandboxed.
    runs-on: ubuntu-22.04
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install hash-pinned PDF parser in isolated target for shared tests
        run: |
          parser="$RUNNER_TEMP/mpw-pdf-parser"
          install -d -m 700 "$parser"
          python -m pip install --no-deps --require-hashes --target "$parser" -r .github/requirements/mpw-pdf-parser-ci.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Build static manifest
        run: python manage.py collectstatic --noinput
      - name: Verify Linux namespace isolation prerequisites
        run: |
          set -eu
          test -x /usr/bin/unshare
          test -x /usr/bin/bwrap
          test -x /usr/bin/python3
          unshare -Urn /usr/bin/true
      - name: Run tests
        env:
          PYTHONPATH: ${{ runner.temp }}/mpw-pdf-parser
        run: pytest -q
