name: ComfyUI cPanel Reverse Tunnel Readiness (Read Only)
on:
  push:
    branches: [ops/comfyui-headscale-readiness-20261015]
    paths:
      - ".github/workflows/comfyui-cpanel-reverse-tunnel-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comfyui-cpanel-reverse-tunnel-readiness
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          d="$RUNNER_TEMP/cpanel-tunnel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Test loopback-only reverse SSH forwarding into cPanel
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cpanel-tunnel"
          cat > "$d/probe.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  body=b"CPANEL_REVERSE_TUNNEL_OK"
                  self.send_response(200); self.end_headers(); self.wfile.write(body)
              def log_message(self,*a): pass
          HTTPServer(("127.0.0.1",18081),H).serve_forever()
          PY
          python3 "$d/probe.py" >"$d/probe.log" 2>&1 &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true; rm -rf -- "$d"' EXIT
          for i in {1..20}; do
            if python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:18081",timeout=1)' >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          ssh -F "$d/config" -o ExitOnForwardFailure=yes -R 127.0.0.1:28818:127.0.0.1:18081 saeit-cpanel 'python3 -c '"'"'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:28818",timeout=3); b=r.read().decode(); print(b); raise SystemExit(0 if b=="CPANEL_REVERSE_TUNNEL_OK" else 1)'"'"''
      - name: Identify authoritative DNS and current public front door
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v dig >/dev/null 2>&1; then dig +short NS mojplaywin.com | sed 's/^/MOJPLAYWIN_NS=/'; fi
          for host in mojplaywin.com www.mojplaywin.com comfyui.mojplaywin.com; do
            if getent ahostsv4 "$host" >/dev/null; then echo "DNS_${host//./_}_RESOLVES"; else echo "DNS_${host//./_}_MISSING"; fi
          done
      - name: Clean temporary SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/cpanel-tunnel"
