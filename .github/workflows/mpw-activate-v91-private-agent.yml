name: Activate MojPlayWin-main V91 agents privately (no public site writes)
on:
  push:
    branches: ["feat/mpw-v91-agent-port-isolated-20261018"]
    paths: [".github/workflows/mpw-activate-v91-private-agent.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-v91-main-private-activation-once
  cancel-in-progress: false
jobs:
  activate-private-main-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feat/mpw-v91-agent-port-isolated-20261018' && !contains(github.event.head_commit.message, 'MPW_EVOLUTION_ACTIVATION')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private worker source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile mpw_v91_port/worker.py scripts/mpw_v91_activate_private_worker_cpanel.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Install worker ONLY inside already verified private MojPlayWin cPanel stage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          base=/home/zomorod2/.private_mojplaywin_main_agents/v91_verified_main_port_20261018
          dest="$base/mpw_v91_port/worker.py"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel "test -d '$base' && test ! -L '$base' && test -f '$base/mpw_v91_port/ORIGIN.json' && test ! -e '$dest' && test ! -L '$dest'"
          timeout 40s scp -F "$d/config" mpw_v91_port/worker.py "saeit-cpanel:$dest"
          sha="$(sha256sum mpw_v91_port/worker.py | cut -d ' ' -f 1)"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "chmod 600 '$dest' && test \"\$(sha256sum '$dest' | cut -d ' ' -f 1)\" = '$sha'"
      - name: Activate one isolated private Gen64 and queue heartbeat
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel python3 - < scripts/mpw_v91_activate_private_worker_cpanel.py
      - name: Remove temporary runner identities
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
  activate-evolution:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feat/mpw-v91-agent-port-isolated-20261018' && contains(github.event.head_commit.message, 'MPW_EVOLUTION_ACTIVATION')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test bounded evidence-driven evolution and package SHA-verified code
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_v91_evolution.py -v
          python3 -m py_compile mpw_v91_port/evolution.py scripts/mpw_activate_private_evolution_cpanel.py
          python3 - <<'PY'
          import hashlib,io,json,tarfile
          from pathlib import Path
          source=Path("mpw_v91_port/evolution.py").read_bytes()
          assert 2000<=len(source)<25000
          target=Path("/tmp/mpw-evolution-main-activation.tar.gz")
          with tarfile.open(target,"w:gz") as archive:
              for name,raw in (
                  ("evolution.py",source),
                  ("manifest.json",json.dumps({
                      "tenant":"mojplaywin-main",
                      "deployment_scope":"private-only",
                      "sha256":hashlib.sha256(source).hexdigest()
                  },sort_keys=True).encode())
              ):
                  item=tarfile.TarInfo(name)
                  item.mode=0o600
                  item.size=len(raw)
                  item.mtime=0
                  archive.addfile(item,io.BytesIO(raw))
          assert 0<target.stat().st_size<250000
          print("MPW_EVOLUTION_TESTS_AND_PACKAGE_OK=true")
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Activate only private worker module and independent hourly cron
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          controller="$(base64 -w0 scripts/mpw_activate_private_evolution_cpanel.py)"
          timeout 105s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$controller\"))'" < /tmp/mpw-evolution-main-activation.tar.gz
      - name: Read back private evolution proof without altering any site
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          assert root.is_dir() and not root.is_symlink() and not root.stat().st_mode&0o077
          path=root/"last_report.json"
          assert path.is_file() and not path.is_symlink()
          data=json.loads(path.read_text())
          assert data["tenant"]=="mojplaywin-main"
          assert data["status"]=="active_private_learning"
          assert data["master_generation"]==64
          assert data["auto_published"] is False and data["executed_financial_actions"]==0
          assert data["self_modified_code"] is False and data["shared_runtime_modified"] is False
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10,check=True)
          marker="MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018"
          assert sum(marker in line for line in cron.stdout.splitlines())==1
          print("PRIVATE_EVOLUTION_READBACK_VERIFIED=true")
          print("PRIVATE_EVOLUTION_EPOCH="+str(data["epoch"]))
          print("PRIVATE_EVOLUTION_POLICY="+data["active_policy"])
          print("PRIVATE_EVOLUTION_VERIFIED_OUTCOMES="+str(data["verified_outcome_count"]))
          print("NO_PUBLIC_SITE_OR_PAYMENT_MODIFICATION=true")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
          rm -f -- /tmp/mpw-evolution-main-activation.tar.gz
