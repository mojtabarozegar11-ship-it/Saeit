name: Factory one-time live storefront runtime identity (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/factory-store-runtime-readonly-onepass-20261106.yml
  push:
    branches: [audit/factory-runtime-readonly-20261106]
    paths:
      - .github/workflows/factory-store-runtime-readonly-onepass-20261106.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live_cpanel_identity:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'mojtabarozegar11-ship-it/Saeit')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin both SSH identities and inspect current Passenger routing only
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-store-runtime-onepass"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -T -i "$d/vps.key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125' > "$d/cpanel.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/cpanel.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host factory-cpanel-via-vps
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/cpanel.known
            ProxyJump factory-vps
          Host factory-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 80s ssh -T -F "$d/config" factory-cpanel-via-vps 'python3 -B -' < scripts/factory_store_runtime_readonly_probe.py
          echo FACTORY_LIVE_RUNTIME_PROBE_NO_SITE_OR_DATABASE_MUTATION
