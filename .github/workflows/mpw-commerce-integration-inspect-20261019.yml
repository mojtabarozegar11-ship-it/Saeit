name: MojPlayWin merchant checkout secure integration inspect
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-commerce-integration-inspect-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect live integration methods, never show wallet values or secrets
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 135s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import pathlib,os,sys,json,ast,re
          r=pathlib.Path('/home/zomorod2/Saeit-staging')
          sys.path.insert(0,str(r));os.chdir(r);os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          targets={
            'core/cryptopay_checkout.py':['checkout','crypto_order','private_download'],
            'mpw_commerce/product_checkout_page.py':['approved_for_checkout','product_checkout_page'],
            'mpw_commerce/checkout_views.py':['checkout_challenge','checkout_invoice','checkout_status'],
            'mpw_commerce/buyer_orders.py':['_eligible','create_digital_order'],
            'mpw_commerce/invoicing.py':['reserve_order_invoice'],
            'mpw_commerce/urls.py':None,
            'command_center/mpw_operations.py':['mpw_operations'],
            'command_center/urls.py':None,
          }
          for rel,names in targets.items():
            p=r/rel
            if not p.is_file():continue
            src=p.read_text('utf-8','replace');t=ast.parse(src)
            if names is None:
              selected=src.splitlines()[:105]
            else:
              nodes=[x for x in t.body if isinstance(x,(ast.FunctionDef,ast.ClassDef,ast.AsyncFunctionDef)) and x.name in names]
              selected=[]
              for n in nodes:
                selected.append('# '+n.name)
                selected.extend(src.splitlines()[n.lineno-1:min(n.end_lineno,n.lineno+105)])
            clean=[]
            for line in selected:
              v=line.strip()
              if re.search(r'(address|wallet|secret|password|mnemonic|private_key|api_key|token|rpc_url)',v,re.I) and not (v.startswith('def ') or v.startswith('from ') or v.startswith('class ')):
                clean.append('  [SENSITIVE_CONFIG_LINE_REDACTED]');continue
              v=re.sub(r'(0x[0-9a-fA-F]{30,}|T[1-9A-HJ-NP-Za-km-z]{33})','[wallet-masked]',line)
              clean.append(v[:210])
            print('MPW_SOURCE_INSPECT='+json.dumps({'file':rel,'lines':clean[:180]},ensure_ascii=False))
          from django.conf import settings
          for k in ('MPW_COMMERCE_BUYER_CRYPTO_PYTHON','MPW_COMMERCE_PRIVATE_ASSET_ROOT','MPW_NATIVE_CRYPTO_HELPER_PYTHON'):
            v=getattr(settings,k,None)
            print('MPW_RUNTIME_SETTING='+json.dumps({'key':k,'has_value':bool(v),'path_exists':bool(v and pathlib.Path(v).exists())}))
          PY
          BASH
