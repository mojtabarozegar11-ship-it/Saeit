name: Moj messaging - prior-session presence audit (read only)
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths:
      - '.github/workflows/moj-messaging-legacy-session-presence-audit-20261028.yml'
permissions:
  contents: read
jobs:
  scan-private-home:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Find reusable session candidates by filename and metadata only
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$VPS_KEY" ]] || { echo 'MMSG_NO_RELAY_KEY'; exit 3; }
          d="$(mktemp -d "$RUNNER_TEMP/legacy-sessions.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 0600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 0600 "$d/known"
          timeout 65s ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10 githubops@178.239.147.150 'python3 -' <<'PY'
          import os, pathlib, stat
          base=pathlib.Path('/home/githubops')
          assert pathlib.Path.home()==base
          skip={'.git','node_modules','__pycache__','.venv','venv','.cache','backups','snapshots','releases','tmp','logs','.npm','site-packages','data'}
          counts={'PRIOR_TELEGRAM_MTPROTO':0,'PRIOR_WHATSAPP_LINKED':0,'PRIOR_TELEGRAM_TDATA':0,'NEW_BRIDGE_TELEGRAM':0,'NEW_BRIDGE_WHATSAPP':0}
          scanned=0
          for root,dirs,files in os.walk(base, topdown=True, followlinks=False):
              rp=pathlib.Path(root)
              try: relative=rp.relative_to(base).parts
              except ValueError: dirs[:]=[]; continue
              if len(relative)>5:
                  dirs[:]=[]; continue
              dirs[:]=[d for d in dirs if d not in skip and not (rp/d).is_symlink()]
              if 'tdata' in dirs:
                  group='NEW_BRIDGE' if relative and relative[0]=='private-messaging-bridge' else 'PRIOR'
                  if group=='PRIOR': counts['PRIOR_TELEGRAM_TDATA']+=1
              group='NEW_BRIDGE' if relative and relative[0]=='private-messaging-bridge' else 'PRIOR'
              for name in files:
                  scanned+=1
                  if scanned>50000:
                      print('MMSG_SCAN_LIMIT_REACHED=YES'); dirs[:]=[]; break
                  p=rp/name
                  if p.is_symlink(): continue
                  try:
                      st=p.stat()
                  except OSError: continue
                  if not stat.S_ISREG(st.st_mode) or st.st_size==0: continue
                  n=name.lower()
                  if n.endswith('.session') and not n.endswith('.session-journal'):
                      counts[group+'_TELEGRAM_MTPROTO' if group=='PRIOR' else 'NEW_BRIDGE_TELEGRAM']+=1
                  elif n=='creds.json' and ('whatsapp' in '/'.join(relative).lower() or 'auth' in '/'.join(relative).lower()):
                      counts[group+'_WHATSAPP_LINKED' if group=='PRIOR' else 'NEW_BRIDGE_WHATSAPP']+=1
          for label,number in counts.items(): print('MMSG_'+label+'_COUNT='+str(number))
          print('MMSG_FILENAME_ONLY_SCAN=PASS')
          print('MMSG_SECRET_CONTENTS_READ=NO')
          print('MMSG_FACTORY_OR_WEBSITES_CHANGED=NO')
          PY