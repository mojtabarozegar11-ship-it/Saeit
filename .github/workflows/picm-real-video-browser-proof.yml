name: PICM Real Browser Video Output Proof
on:
  push:
    branches: [main]
    paths:
      - templates/picm/free_motion.js
      - scripts/picm_browser_video_proof.py
      - .github/workflows/picm-real-video-browser-proof.yml
permissions:
  contents: read
concurrency:
  group: picm-real-video-browser-test
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify browser JavaScript syntax
        run: node --check templates/picm/free_motion.js
      - name: Prepare headless Chrome browser driver
        run: python -m pip install 'playwright>=1.51,<2'
      - name: Produce real ten-second video from synthetic photo
        run: python scripts/picm_browser_video_proof.py
