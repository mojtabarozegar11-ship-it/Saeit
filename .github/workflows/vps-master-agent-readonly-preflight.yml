name: VPS Master Agent Read-only Preflight - live verification 2026-10-20
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-master-agent-readonly-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-master-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect private VPS master agent, existing tasks, evolution code and schedule
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/master-preflight"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=9 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          app="$base/django-app"
          test -f "$app/manage.py" && test -x "$base/.venv/bin/python"
          cd "$app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1 DJANGO_SETTINGS_MODULE=config.settings
          export MOJ_PAID_LLM_ENABLED=0 MOJ_LLM_DAILY_CALL_BUDGET=0 MOJ_LLM_MAX_COST_MINOR=0
          "$base/.venv/bin/python" - <<'PY'
          import os,importlib
          import django
          django.setup()
          from django.conf import settings
          from django.core.management import get_commands
          from core.models import Agent,AgentTask
          commands=get_commands()
          for name in ('seed_online_income_agents','online_income_cycle','autonomous_master_loop','economic_autorun'):
              print('MASTER_COMMAND_'+name.upper()+'='+str(name in commands))
          for name in ('core.autonomous_brain','core.master_agent_capability_pack','core.economic_tool_pack',
                       'core.economic_master_agent','core.self_funding_policy','core.task_runtime'):
              try: importlib.import_module(name); result=True
              except Exception: result=False
              print('MASTER_MODULE_'+name.split('.')[-1].upper()+'='+str(result))
          agent=Agent.objects.filter(code='economic-master-agent').first()
          print('MASTER_AGENT_EXISTS='+str(bool(agent)))
          print('MASTER_AGENT_ACTIVE='+str(bool(agent and agent.active)))
          if agent:
              print('MASTER_AGENT_CAPABILITIES='+str(agent.capabilities.filter(active=True).count()))
              for status in ('queued','running','blocked','failed','completed'):
                  print('MASTER_TASK_'+status.upper()+'='+str(AgentTask.objects.filter(agent=agent,status=status).count()))
              for status in ('queued','running','failed','completed'):
                  print('MASTER_SELF_IMPROVEMENT_'+status.upper()+'='+str(AgentTask.objects.filter(
                      agent=agent,capability_code='master_self_improvement',status=status).count()))
          from django.utils import timezone
          from core.models import Product
          running=AgentTask.objects.filter(agent__code='economic-master-agent',status='running').order_by('updated_at')
          for task in running[:5]:
              age=int((timezone.now()-task.updated_at).total_seconds())
              print(f'MASTER_RUNNING_TASK id={task.pk} action={task.action_type} capability={task.capability_code} attempts={task.attempt_count}/{task.max_attempts} age_seconds={age}')
          for product in Product.objects.order_by('-updated_at')[:8]:
              md=product.metadata or {}
              artifact=md.get('artifact') or {}
              path=artifact.get('relative_path','')
              exists=bool(path and Path(path).is_file())
              digest_ok=False
              if exists:
                  import hashlib
                  digest_ok=hashlib.sha256(Path(path).read_bytes()).hexdigest()==artifact.get('sha256')
              print(f'MASTER_PRODUCT id={product.pk} title={product.title[:80]!r} active={product.active} status={md.get("commercial_status","")} price={product.price} artifact={path or "none"} exists={exists} sha256_ok={digest_ok} qc={artifact.get("quality_gate","none")}')
          db=settings.DATABASES['default']
          print('MASTER_DATABASE_SQLITE='+str('sqlite3' in db['ENGINE']))
          if 'sqlite3' in db['ENGINE']:
              from pathlib import Path
              try: print('MASTER_DATABASE_BYTES='+str(Path(db['NAME']).stat().st_size))
              except OSError: print('MASTER_DATABASE_BYTES=unavailable')
          print('MASTER_VPS_LOCAL_MODE='+str(os.getenv('MOJ_FACTORY_LOCAL_MODE')=='1'))
          PY
          current="$(crontab -l 2>/dev/null || true)"
          count="$(printf '%s\n' "$current" | grep -c 'SAEIT_MASTER_AGENT_V1' || true)"
          echo "MASTER_SCHEDULE_ENTRIES=$count"
          backup_count="$(find "$base/operations/backups" -maxdepth 1 -type d -name 'master-source-before-*' 2>/dev/null | wc -l | tr -d ' ')"
          echo "MASTER_SOURCE_BACKUP_SETS=$backup_count"
          echo MASTER_DB_BACKUP_FILES
          find "$base/operations/backups" -maxdepth 1 -type f -name 'master-before-*.sqlite3' -printf '%f bytes=%s\n' 2>/dev/null | tail -5
          "$base/.venv/bin/python" - "$app" "$base/operations/backups" <<'PY'
          import sys,sqlite3
          from pathlib import Path
          import os
          app,backup_dir=map(Path,sys.argv[1:])
          os.environ['SAEIT_ENV']='production'
          os.environ['MOJ_FACTORY_LOCAL_MODE']='1'
          os.environ['DJANGO_SETTINGS_MODULE']='config.settings'
          import django
          django.setup()
          from django.conf import settings
          paths=[('SOURCE',Path(settings.DATABASES['default']['NAME']))]
          for suffix in ('','-wal','-shm'):
              path=Path(str(paths[0][1])+suffix)
              try:
                  stat=path.stat()
                  print(f'MASTER_SQLITE_FILE_{suffix or "DB"}_BYTES={stat.st_size} MTIME={int(stat.st_mtime)}')
              except OSError: print(f'MASTER_SQLITE_FILE_{suffix or "DB"}_BYTES=absent')
          backups=sorted(backup_dir.glob('master-before-*.sqlite3'),key=lambda p:p.stat().st_mtime)
          for index,path in enumerate(backups): paths.append((f'BACKUP_{index}',path))
          for label,path in paths:
              try:
                  conn=sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=3)
                  page_count=conn.execute('PRAGMA page_count').fetchone()[0]
                  page_size=conn.execute('PRAGMA page_size').fetchone()[0]
                  freelist=conn.execute('PRAGMA freelist_count').fetchone()[0]
                  print(f'MASTER_SQLITE_{label}_PAGES={page_count} PAGE_SIZE={page_size} FREELIST={freelist}')
                  conn.close()
              except Exception as exc: print(f'MASTER_SQLITE_{label}_PAGES=unavailable {type(exc).__name__}')
          PY
          echo MASTER_BACKUP_FILESYSTEM_SPACE
          df -PB1 "$base/operations/backups" | tail -1
          echo "MASTER_PREFLIGHT_SNAPSHOT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "MASTER_PREFLIGHT_RUNNER_PID=$"
          echo MASTER_ACTIVATION_PROCESSES
          ps -eo pid=,etime=,comm=,args= | grep -E '[a]ctivate_vps_master_agent\.sh|[a]utonomous_master_loop|[v]ps_master_evolution_cycle\.py' | cut -c1-220 | tail -10 || true
          echo MASTER_FACTORY_WORKER_PROCESSES
          ps -eo pid=,ppid=,etime=,stat=,comm=,args= | grep -E '[m]anage.py (autonomous_master_loop|economic_autorun|online_income_cycle|run_economic_worker)|[e]conomic_worker|[a]utonomous_master_loop' | cut -c1-220 | tail -20 || true
          echo MASTER_DB_OPENERS
          db_path="$("$base/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          print(settings.DATABASES['default']['NAME'])
          PY
          )"
          if command -v fuser >/dev/null 2>&1; then
            pids="$(fuser "$db_path" 2>/dev/null || true)"
            echo "MASTER_DB_OPENER_PIDS=${pids:-none}"
            for pid in $pids; do
              comm="$(cat "/proc/$pid/comm" 2>/dev/null || echo unknown)"
              exe="$(basename "$(readlink "/proc/$pid/exe" 2>/dev/null || echo unknown)")"
              ppid="$(awk '/^PPid:/ {print $2}' "/proc/$pid/status" 2>/dev/null || echo unknown)"
              parent_comm="$(cat "/proc/$ppid/comm" 2>/dev/null || echo unknown)"
              echo "MASTER_DB_OPENER pid=$pid comm=$comm exe=$exe parent=$parent_comm"
            done
          else
            echo MASTER_DB_OPENER_PIDS=fuser_unavailable
          fi
          echo MASTER_FACTORY_CRON
          crontab -l 2>/dev/null | grep 'SAEIT_MASTER_AGENT_V1' | cut -c1-220 || true
          activation_pid="$(ps -eo pid=,args= | awk '/bash .*activate_vps_master_agent\.sh/ && !/awk/ {print $1; exit}')"
          if test -n "$activation_pid"; then
            pids="$(python3 - "$activation_pid" <<'PY'
          import sys
          from pathlib import Path
          root=int(sys.argv[1]); parents={}
          for item in Path('/proc').iterdir():
              if not item.name.isdigit(): continue
              try:
                  status=(item/'status').read_text()
                  parent=int(next(line.split()[1] for line in status.splitlines() if line.startswith('PPid:')))
                  parents[int(item.name)]=parent
              except (OSError,StopIteration,ValueError): pass
          result={root}; changed=True
          while changed:
              changed=False
              for pid,parent in parents.items():
                  if parent in result and pid not in result:
                      result.add(pid); changed=True
          print(','.join(map(str,sorted(result))))
          PY
          )"
            echo MASTER_ACTIVATION_PROCESS_TREE
            ps -o pid=,ppid=,etime=,stat=,wchan:24=,comm= -p "$pids" || true
            for process_id in ${pids//,/ }; do
              if test -r "/proc/$process_id/io"; then
              io="$(awk '$1 == "read_bytes:" || $1 == "write_bytes:" {print $1 $2}' "/proc/$process_id/io")"
                echo "MASTER_PROCESS_IO pid=$process_id $io"
              fi
            done
          fi
          if command -v fuser >/dev/null 2>&1 && test -e "$base/operations/master-agent/activation.lock"; then
            fuser "$base/operations/master-agent/activation.lock" 2>/dev/null || true
          fi
          test -x "$base/operations/vps-only-loop.sh" && echo FACTORY_LOOP_SCRIPT_PRESENT
          echo MASTER_CYCLE_LOG_TAIL
          tail -n 80 "$base/operations/master-agent/cycle.log" 2>/dev/null || true
          REMOTE
# Post-activation independent owner verification 2026-10-16.
# Independent read-only master agent recheck requested 2026-10-18; no state mutation.
# Read-only follow-up after runtime module alignment deployment 2026-10-28.
# Read-only progress check for the active master-agent snapshot 2026-10-28.
