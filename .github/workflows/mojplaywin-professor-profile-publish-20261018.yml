name: MojPlayWin professor profile CV and official photo isolated publication
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-professor-profile-publish-20261018.yml"
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  publish-professor-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-mpw-professor-profile-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate profile prose, builder and exact-route source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_professor_profile_builder_20261018.py scripts/mojplaywin_professor_profile_exact_route_20261018.py
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          import mojplaywin_professor_profile_exact_route_20261018 as r
          src=Path('core/templates/mojplaywin/leadership_executive_cv_20261018.html').read_text()
          for keyword in ('Universiti Putra Malaysia','Production Economics and Farm Management',
                          'official_profile_20261016/portrait.2935ce8cb70d.webp',
                          'self-reported academic credentials','formal professorial appointment',
                          'Mojtaba Roozegar','Zomorod Melal','MojPlayWin'):
            assert keyword in src,keyword
          assert '^/about/mojtaba-rozegar/$' in r.RULE
          assert '^about/mojtaba-rozegar/$' in r.RULE
          assert '[END,QSD]' in r.RULE
          for forbidden in ('^/about/$','^/farnaz/$','^/store/$','^/picm/$'):
            assert forbidden not in r.RULE
          print('PROFESSOR_PROFILE_SOURCE_TEST=PASS')
          PY
      - name: Baseline critical domains and sister sites (read only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os
          links=[
            "https://mojplaywin.com/","https://mojplaywin.com/store/",
            "https://mojplaywin.com/about/",
            "https://mojplaywin.com/mojtaba.roozegar/",
            "https://mojplaywin.com/mojtaba.roozegar/about/",
            "https://mojplaywin.com/mojtaba.roozegar/resume/",
            "https://mojplaywin.com/farnaz/",
            "https://mojplaywin.com/saman/",
            "https://mojplaywin.com/picm/",
            "https://zomorodmelal.ir/"]
          result={}
          for url in links:
            req=urllib.request.Request(url,headers={'User-Agent':'MojPlayWinProfessorBefore/1.0','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=16) as response:status=response.status
            except urllib.error.HTTPError as e:status=e.code
            except Exception as e:raise SystemExit('PROTECTED_BASELINE_UNAVAILABLE '+url+' '+type(e).__name__)
            result[url]=status
            print('PROTECTED_BASELINE='+url+' '+str(status))
            if status!=200:raise SystemExit('NO_GO_OLD_PROTECTED_PATH '+url)
          with open(os.environ['RUNNER_TEMP']+'/mpw-professor-baseline.json','w') as f:
            json.dump(result,f)
          PY
      - name: Build fully static professor CV with personal official photograph
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mojplaywin_professor_profile_builder_20261018.py \
            --source core/templates/mojplaywin/leadership_executive_cv_20261018.html \
            --output "$RUNNER_TEMP/professor-mojtaba-roozegar-20261018.html"
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage only profile HTML in a private temporary location
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          scp -q -F "$d/config" "$RUNNER_TEMP/professor-mojtaba-roozegar-20261018.html" \
            "saeit-cpanel:/home/zomorod2/.mpw-professor-stage-$GITHUB_RUN_ID.html"
      - name: Install exact GET leadership route and private rollback copy
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          digest=$(sha256sum "$RUNNER_TEMP/professor-mojtaba-roozegar-20261018.html" | awk '{print $1}')
          timeout 65s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID' '$digest'" \
            < scripts/mojplaywin_professor_profile_exact_route_20261018.py
      - name: Verify public original portrait, eight CV sections and protected routes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import os,time,json,re
          url="https://mojplaywin.com/about/mojtaba-rozegar/"
          must=[
            "MOJPLAYWIN_PROFESSOR_MOJTabA_ROOZEGAR_PROFILE_20261018",
            "Professor Mojtaba Roozegar","Universiti Putra Malaysia",
            "Production Economics and Farm Management",
            "official_profile_20261016/portrait.2935ce8cb70d.webp",
            "mpw-education","mpw-science","mpw-enterprise","mpw-practice",
            "mpw-digital","mpw-publishing","mpw-vision","mpw-credentials"
          ]
          success=False
          for i in range(1,5):
            try:
              req=Request(url+"?__mpw_professor_verify="+os.environ['GITHUB_RUN_ID']+"-"+str(i),
                        headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MojPlayWinProfessorHealth/1.0'})
              with urlopen(req,timeout=20) as r:
                body=r.read(150000).decode('utf-8','replace')
                status=r.status
              found=[key for key in must if key in body]
              success=(status==200 and len(found)==len(must)
                       and len(re.findall(r'<h1\b',body,re.I))==1
                       and 'Mojtaba Rozegar' not in body)
              print('PROFESSOR_LIVE_ATTEMPT='+str(i)+' status='+str(status)+' matched='+str(len(found))+' verified='+str(success))
              if success:break
            except Exception as e: print('PROFESSOR_LIVE_WAIT='+type(e).__name__)
            time.sleep(3)
          if not success:raise SystemExit('PROFESSOR_NOT_VISIBLE_OR_INVALID_ROLLBACK')
          baseline=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-professor-baseline.json'))
          for url,expected in baseline.items():
            req=Request(url,headers={'User-Agent':'MojPlayWinProfessorBefore/1.0','Cache-Control':'no-cache'})
            try:
              with urlopen(req,timeout=18) as r:current=r.status
            except HTTPError as e:current=e.code
            except Exception as e:raise SystemExit('PROTECTED_PATH_UNAVAILABLE '+url+' '+type(e).__name__)
            print('PROFESSOR_PROTECTED_AFTER='+url+' '+str(current)+' baseline='+str(expected))
            if current!=expected:raise SystemExit('PROTECTED_ROUTE_REGRESSION '+url)
          print('PROFESSOR_CV_PUBLICATION_VERIFIED=yes')
          PY
      - name: Restore old leadership profile if release or protected-path test fails
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID'" \
            < scripts/mojplaywin_professor_profile_exact_route_20261018.py
      - name: Delete only a leftover staged HTML copy
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          if test -f "$d/config"; then
            ssh -T -F "$d/config" -o ConnectTimeout=10 saeit-cpanel \
              "test ! -L /home/zomorod2/.mpw-professor-stage-$GITHUB_RUN_ID.html && rm -f -- /home/zomorod2/.mpw-professor-stage-$GITHUB_RUN_ID.html" || true
          fi
