name: MojPlayWin SSH relay connection (read-only)
on:
  push:
    paths:
      - '.github/workflows/mojplaywin-ssh-relay-connect.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-ssh-relay-connect
  cancel-in-progress: false
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify authenticated VPS-to-cPanel SSH and MojPlayWin app
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mojplaywin-ssh"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" "$d/vps.key" <<'PY'
          import pathlib, sys
          for path in sys.argv[1:]:
              p = pathlib.Path(path)
              key = p.read_text().replace("\r\n", "\n").strip()
              p.write_text(key.replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 60s ssh -F "$d/config" saeit-host 'set -eu; test "$(id -un)" = zomorod2; echo CPANEL_SSH_AUTHENTICATED; test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py; echo MOJPLAYWIN_PASSENGER_PRESENT; test -f /home/zomorod2/mojplaywin.com/.htaccess; echo MOJPLAYWIN_VHOST_CONFIG_PRESENT; test -d /home/zomorod2/Saeit-staging; echo SAEIT_STAGING_PRESENT'
          status="$(curl -sSL --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)"
          printf 'MOJPLAYWIN_ADMIN_HTTP=%s\n' "$status"
          test "$status" = 200
          echo MOJPLAYWIN_RELAY_CONNECTION_VERIFIED
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-ssh"
