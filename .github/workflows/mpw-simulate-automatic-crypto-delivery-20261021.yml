name: MojPlayWin simulated TRX purchase and automatic private delivery
on:
  push:
    branches: [main]
    paths:
      - scripts/mpw_simulated_crypto_purchase_delivery_20261021.py
      - scripts/mpw_autodelivery_status_poll_release_20261021.py
      - tests/mpw_autodelivery_browser_mock_20261021.cjs
      - .github/workflows/mpw-simulate-automatic-crypto-delivery-20261021.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  simulated_buyer:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile isolated simulated purchase contract, no external money
        run: python3 -m py_compile scripts/mpw_simulated_crypto_purchase_delivery_20261021.py
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-delivery-simulator-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Validate candidate automatic-status UI (read only; no production changes)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_autodelivery_status_poll_release_20261021.py
          python3 scripts/mpw_autodelivery_status_poll_release_20261021.py selftest
          ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preview" \
            < scripts/mpw_autodelivery_status_poll_release_20261021.py
          ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - extractjs" \
            < scripts/mpw_autodelivery_status_poll_release_20261021.py \
            > "$RUNNER_TEMP/mpw-autodelivery-browser.js"
          node --check "$RUNNER_TEMP/mpw-autodelivery-browser.js"
          node tests/mpw_autodelivery_browser_mock_20261021.cjs "$RUNNER_TEMP/mpw-autodelivery-browser.js"
      - name: Install audited payment status auto-check with private backup
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - install '$GITHUB_RUN_ID'" \
            < scripts/mpw_autodelivery_status_poll_release_20261021.py
      - name: Validate real Django checkout, authorization and CSP after install
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify '$GITHUB_RUN_ID'" \
            < scripts/mpw_autodelivery_status_poll_release_20261021.py
      - name: Refresh main MojPlayWin templates only, not shared tenants
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          site=Path('/home/zomorod2/mojplaywin.com')
          page=Path('/home/zomorod2/Saeit-staging/mpw_commerce/templates/mpw_commerce/product_checkout.html')
          if site.is_symlink() or page.is_symlink() or not site.is_dir():
              raise RuntimeError('Unsafe Mojo site path')
          if "APP='/home/zomorod2/Saeit-staging'" not in (site/'passenger_wsgi.py').read_text('utf8'):
              raise RuntimeError('Unexpected Passenger app')
          if 'MPW_CRYPTO_AUTODELIVERY_POLL_V1' not in page.read_text('utf8'):
              raise RuntimeError('Payment UI auto-check missing')
          tmp=site/'tmp'
          if tmp.is_symlink():raise RuntimeError('Unsafe passenger directory')
          tmp.mkdir(exist_ok=True)
          marker=tmp/'restart.txt'
          if marker.is_symlink():raise RuntimeError('Unsafe restart marker')
          marker.touch()
          print('MPW_AUTODELIVERY_SITE_RELOAD=REQUESTED')
          PY
      - name: Execute real Django modules with fake chain proof and in-memory ORM only
        run: |
          set -euo pipefail
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel             "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_simulated_crypto_purchase_delivery_20261021.py
      - name: Check storefront after template activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          for path in ('/','/store/','/store/product/72/','/store/product/779/'):
            with urllib.request.urlopen('https://mojplaywin.com'+path,timeout=18) as r:
              if r.status!=200:raise RuntimeError('Public buyer storefront unavailable')
          print('MPW_AUTODELIVERY_PUBLIC_STORE=PASS')
          PY
      - name: Restore checkout after failed postpublication acceptance
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" \
            < scripts/mpw_autodelivery_status_poll_release_20261021.py
          ssh -T -F "$RUNNER_TEMP/mpw-delivery-simulator-ssh/config" saeit-cpanel \
            'touch /home/zomorod2/mojplaywin.com/tmp/restart.txt'
      - name: Delete relay credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-delivery-simulator-ssh"
