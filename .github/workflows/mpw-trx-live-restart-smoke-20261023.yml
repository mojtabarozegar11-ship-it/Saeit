name: MojPlayWin guarded TRX Passenger reload and public smoke
on:
  push:
    branches: [fix/mpw-tron-provider-auth-20261022]
    paths:
      - .github/workflows/mpw-trx-live-restart-smoke-20261023.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  protected-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 3\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 50s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Trigger guarded Passenger reload after verifying routes installed and public payment OFF
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel '
            set -eu
            root=/home/zomorod2/Saeit-staging
            grep -q "MPW_GATED_NATIVE_TRX_ROUTE_20261023" "$root/config/urls.py"
            grep -q "MPW_GATED_NATIVE_TRX_SETTINGS_20261023" "$root/config/settings.py"
            test -r "$root/services/mpw_trx_commercial_web.py"
            mkdir -p "$root/tmp"
            test ! -L "$root/tmp"
            touch "$root/tmp/restart.txt"
            echo PASSENGER_APP_RELOAD_REQUESTED_WITH_PAYMENT_FLAG_DEFAULT_OFF=TRUE
          '
      - name: Verify existing storefront healthy and gated URL present
        run: |
          set -euo pipefail
          for retry in $(seq 1 12); do
            home="$(curl --silent --max-time 12 -o /dev/null -w '%{http_code}' https://mojplaywin.com/store/ || true)"
            gate="$(curl --silent --max-time 12 -o /dev/null -w '%{http_code}' https://mojplaywin.com/commerce/trx-easy/status/987654321/ || true)"
            if [ "$home" = "200" ] && [ "$gate" = "302" ]; then
              echo "LIVE_STOREFRONT=200; GATED_TRX_ROUTE=302_LOGIN_REQUIRED; PUBLIC_PAYMENT_NOT_ENABLED=TRUE"
              exit 0
            fi
            sleep 3
          done
          echo "PUBLIC_ROUTE_SMOKE_INCONCLUSIVE_OR_UNHEALTHY"
          exit 2
      - name: Cleanup ephemeral relay credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-gateway-contract-ssh"
