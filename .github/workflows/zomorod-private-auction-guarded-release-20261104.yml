name: Guarded private auction release to existing Zomorod management desk
on:
  push:
    branches:
      - feature/zomorod-private-auction-live-20261104
    paths:
      - ".github/workflows/zomorod-private-auction-guarded-release-20261104.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zm-business-auction-release-20261104
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact module and patch source existence
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/zomorod-private-auction-20261104/private_auction.php
          test -s ops/zomorod-private-auction-20261104/guarded_auction_patch.py
          python3 -m py_compile ops/zomorod-private-auction-20261104/guarded_auction_patch.py
          echo "RELEASE_POLICY=AUTHORiSED_INTERNAL_AUCTION_ONLY_NO_EXTERNAL_COMMUNICATION_NO_FINANCIAL_COMMITMENTS"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Upload two guarded source files only into private staging
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/zm-marketing-ro"
          target="/home/zomorod2/.private/zomorod-business"
          scp -F "$d/config" -q -o ConnectTimeout=25 ops/zomorod-private-auction-20261104/private_auction.php "$COMMAND_HOST:$target/.private_auction_module_stage_20261104.php"
          scp -F "$d/config" -q -o ConnectTimeout=25 ops/zomorod-private-auction-20261104/guarded_auction_patch.py "$COMMAND_HOST:$target/.guarded_auction_patch_20261104.py"
          echo "PRIVATE_STAGING_UPLOAD=SUCCESS"
      - name: Exact live hash and backup verified; prepare patched current live app and PHP lint
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/zm-marketing-ro"
          sha="$(sha256sum ops/zomorod-private-auction-20261104/private_auction.php | awk '{print $1}')"
          timeout 100s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$sha" <<'REMOTE'
          set -euo pipefail
          umask 077
          expected_sha="$1"
          base="/home/zomorod2/.private/zomorod-business"
          phpbin="$(command -v php || true)"
          if test -z "$phpbin"; then phpbin=/opt/cpanel/ea-php82/root/usr/bin/php; fi
          test -x "$phpbin"
          python3 -B "$base/.guarded_auction_patch_20261104.py" prepare "$expected_sha"
          "$phpbin" -l "$base/.private_auction_module_stage_20261104.php" >/dev/null
          "$phpbin" -l "$base/.private_auction_app_stage_20261104.php" >/dev/null
          echo "STAGED_MODULE_PHP_LINT=PASS"
          echo "STAGED_LIVE_APP_PHP_LINT=PASS"
          REMOTE
      - name: Activate private auction and validate production SQLite schema; auto-rollback app on failure
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/zm-marketing-ro"
          sha="$(sha256sum ops/zomorod-private-auction-20261104/private_auction.php | awk '{print $1}')"
          timeout 120s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$sha" <<'REMOTE'
          set -euo pipefail
          umask 077
          expected_sha="$1"
          base="/home/zomorod2/.private/zomorod-business"
          phpbin="$(command -v php || true)"
          if test -z "$phpbin"; then phpbin=/opt/cpanel/ea-php82/root/usr/bin/php; fi
          test -x "$phpbin"
          python3 -B "$base/.guarded_auction_patch_20261104.py" activate "$expected_sha"
          rollback() {
            python3 -B "$base/.guarded_auction_patch_20261104.py" rollback
            echo "RELEASE_AUTO_ROLLBACK=APPLIED"
          }
          if ! "$phpbin" -l "$base/app.php" >/dev/null; then
            rollback
            exit 2
          fi
          if ! "$phpbin" -r '
            declare(strict_types=1);
            $p = "/home/zomorod2/.private/zomorod-business/";
            $db = new PDO("sqlite:" . $p . "management.sqlite3", null, null,
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 15]);
            $db->exec("PRAGMA foreign_keys=ON; PRAGMA busy_timeout=15000;");
            require $p . "private_auction.php";
            zmAuctionSchema($db);
          '; then
            rollback
            exit 2
          fi
          if ! python3 -B - <<'PY'
          import sqlite3,urllib.parse
          path='/home/zomorod2/.private/zomorod-business/management.sqlite3'
          cx=sqlite3.connect('file:'+urllib.parse.quote(path)+'?mode=ro',uri=True,timeout=8)
          cx.execute('PRAGMA query_only=ON')
          ok=cx.execute('PRAGMA quick_check(1)').fetchone()[0]=='ok'
          names={x[0] for x in cx.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required={'zm_private_auctions','zm_private_auction_offers','zm_private_auction_events'}
          assert ok and required.issubset(names),'Schema or integrity check failed'
          for table in sorted(required):
              print('LIVE_PRIVATE_TABLE_READY='+table)
          print('LIVE_SQLITE_QUICK_CHECK=PASS')
          cx.close()
          PY
          then
            rollback
            exit 2
          fi
          test "$(sha256sum "$base/private_auction.php" | awk '{print $1}')" = "$expected_sha"
          "$phpbin" -l "$base/app.php" >/dev/null
          echo "LIVE_PRIVATE_AUCTION_RELEASE=SUCCESS"
          echo "AUTOMATIC_EXTERNAL_COMMUNICATIONS=NONE"
          echo "FINANCIAL_AWARD_FUNCTION=NOT_IMPLEMENTED"
          REMOTE
          status="$(curl --max-time 25 --silent --location --output /dev/null --write-out '%{http_code}' 'https://zomorodmelal.ir/business/?page=private_auction' || true)"
          echo "PUBLIC_UNAUTHENTICATED_ENTRY_HTTP=$status"
      - name: Erase temporary relay credentials on runner
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/zm-marketing-ro"; then
            rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
          fi
