name: One-time guarded Zomorod homepage performance release
on:
  push:
    branches: [fix/zomorod-homepage-defer-runtime-20261107]
    paths:
      - .github/workflows/zomorod-homepage-performance-guarded-20261107.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-homepage-performance-single-release-20261107
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact public source and staged candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_homepage_defer_20261107.py
          curl --fail --location --silent --show-error --max-time 35 \
            'https://zomorodmelal.ir/?zm_perf_preflight=20261107' \
            --output "$RUNNER_TEMP/zomorod-approved-home.html"
          test "$(sha256sum "$RUNNER_TEMP/zomorod-approved-home.html" | cut -d' ' -f1)" = \
            '0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585'
          python3 scripts/zomorod_homepage_defer_20261107.py \
            --source "$RUNNER_TEMP/zomorod-approved-home.html" \
            --stage "$RUNNER_TEMP/zomorod-candidate"
          test "$(sha256sum "$RUNNER_TEMP/zomorod-candidate/index.html" | cut -d' ' -f1)" = \
            '99e9c38cd20aaf400a3c68c2064211dc48d4ff0e518ee4815061ea0ca2626edc'
          node --check "$RUNNER_TEMP/zomorod-candidate/zomorod-home-runtime-e0455f2cafacaee34b5c.js"
      - name: Authenticate direct cPanel or pinned VPS relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-perf-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct \
              'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel-direct
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel \
              'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/index.html' >/dev/null 2>&1; then
            ssh_host=saeit-cpanel
          else
            echo 'Authenticated cPanel path unavailable'; exit 1
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Read-only cPanel hash and free-space gate
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 60s ssh -T -F "$RUNNER_TEMP/zomorod-perf-ssh/config" "$COMMAND_HOST" \
            'python3 -c '\''import os,hashlib; from pathlib import Path; p=Path("/home/zomorod2/public_html/index.html"); assert hashlib.sha256(p.read_bytes()).hexdigest()=="0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585"; s=os.statvfs(str(p.parent)); assert s.f_bavail*s.f_frsize>100_000_000; print("CPANEL_EXACT_HASH_AND_DISK_GATE=PASS")'\'''
      - name: Publish candidate with private backup and self-rollback
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 140s ssh -T -F "$RUNNER_TEMP/zomorod-perf-ssh/config" "$COMMAND_HOST" \
            'python3 - --source /home/zomorod2/public_html/index.html --publish' \
            < scripts/zomorod_homepage_defer_20261107.py | tee "$RUNNER_TEMP/zomorod-publish.json"
          backup="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["backup"])' < "$RUNNER_TEMP/zomorod-publish.json")"
          case "$backup" in /home/zomorod2/.private/zomorod-home-speed/index-*-0c8a0a267806.html) ;; *) exit 1 ;; esac
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
      - name: Independently verify public homepage and runtime bytes
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 35 \
            "https://zomorodmelal.ir/?zm_perf_release=$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/zomorod-after.html"
          test "$(sha256sum "$RUNNER_TEMP/zomorod-after.html" | cut -d' ' -f1)" = \
            '99e9c38cd20aaf400a3c68c2064211dc48d4ff0e518ee4815061ea0ca2626edc'
          curl --fail --location --silent --show-error --max-time 35 \
            'https://zomorodmelal.ir/static/site/zomorod-perf/zomorod-home-runtime-e0455f2cafacaee34b5c.js' \
            --output "$RUNNER_TEMP/zomorod-after.js"
          test "$(sha256sum "$RUNNER_TEMP/zomorod-after.js" | cut -d' ' -f1)" = \
            'e0455f2cafacaee34b5c6cfba8157af575caeda1df6c8f64e92b6575c944ca07'
          node --check "$RUNNER_TEMP/zomorod-after.js"
          for route in services agriculture industry company; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://zomorodmelal.ir/$route/")" = '200'
          done
          echo 'ZOMOROD_PUBLIC_PERFORMANCE_RELEASE=VERIFIED'
      - name: Restore exact approved homepage if independent verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          BACKUP: ${{ steps.publish.outputs.backup }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          case "$BACKUP" in /home/zomorod2/.private/zomorod-home-speed/index-*-0c8a0a267806.html) ;; *) exit 1 ;; esac
          timeout 70s ssh -T -F "$RUNNER_TEMP/zomorod-perf-ssh/config" "$COMMAND_HOST" \
            "python3 - --source /home/zomorod2/public_html/index.html --rollback --backup '$BACKUP'" \
            < scripts/zomorod_homepage_defer_20261107.py
