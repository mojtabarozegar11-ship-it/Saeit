name: Provision isolated MOJ Pay Python runtime privately on cPanel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/banknew-private-runtime-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banknew-private-python-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Python 3.11 only for offline dependency packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and hash bounded official dependency wheels
        run: |
          set -euo pipefail
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --dest wheels 'Django>=5.2,<6.0' 'google-auth>=2.30,<3.0'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          folder=Path('wheels')
          items=sorted(folder.glob('*.whl'))
          assert 3<=len(items)<=25
          assert not any(p.is_symlink() for p in items)
          assert sum(p.stat().st_size for p in items)<16000000
          (folder/'CHECKSUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in items),encoding='utf-8')
          print('BANKNEW_WHEELHOUSE_BOUNDED_AND_HASHED=YES')
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Reserve only new files in the existing private bank folder
        run: |
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import os
          root=Path('/home/zomorod2/mojpay-bank-service-private')
          assert root.is_dir() and not root.is_symlink(), 'PRIVATE_BANK_SOURCE_NOT_STAGED'
          assert (root/'banknew'/'isolated_settings.py').is_file(), 'BANK_SOURCE_MISSING'
          assert not (root/'.venv').exists() and not (root/'.venv').is_symlink(), 'RUNTIME_ALREADY_EXISTS_REFUSING_OVERWRITE'
          assert not (root/'.wheelhouse').exists() and not (root/'.wheelhouse').is_symlink(), 'WHEELHOUSE_ALREADY_EXISTS_REFUSING_OVERWRITE'
          assert not (root/'.runtime-new-marker').exists(), 'RUNTIME_MARKER_ALREADY_EXISTS'
          stat=os.statvfs(str(root))
          assert stat.f_bavail*stat.f_frsize>=400*1024*1024, 'HOST_FREE_SPACE_BELOW_SAFE_THRESHOLD'
          root.joinpath('.wheelhouse').mkdir(mode=0o700)
          root.joinpath('.runtime-new-marker').write_text('mojpay-runtime-20261029',encoding='utf-8')
          print('BANKNEW_RUNTIME_PRIVATE_SPACE_GUARD=PASS')
          PY
      - name: Transfer only bounded wheels and their manifest
        run: |
          timeout 90s scp -q -F "$RUNNER_TEMP/mpw-structure-ssh/config" wheels/*.whl wheels/CHECKSUMS saeit-cpanel:/home/zomorod2/mojpay-bank-service-private/.wheelhouse/
      - name: Verify wheels, create Python 3.11 venv and install offline
        run: |
          timeout 240s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess, sys
          root=Path('/home/zomorod2/mojpay-bank-service-private')
          marker=root/'.runtime-new-marker'
          assert root.is_dir() and not root.is_symlink()
          assert marker.is_file() and marker.read_text(encoding='utf-8')=='mojpay-runtime-20261029'
          wheelhouse=root/'.wheelhouse'
          assert wheelhouse.is_dir() and not wheelhouse.is_symlink()
          lines=(wheelhouse/'CHECKSUMS').read_text(encoding='utf-8').splitlines()
          assert 3<=len(lines)<=25
          for line in lines:
              sha,filename=line.split('  ',1)
              assert filename.endswith('.whl') and '/' not in filename and '\\' not in filename
              target=wheelhouse/filename
              assert target.is_file() and not target.is_symlink()
              assert hashlib.sha256(target.read_bytes()).hexdigest()==sha
          runner='/opt/alt/python311/bin/python3.11'
          assert Path(runner).is_file(), 'HOST_PYTHON311_MISSING'
          venv=root/'.venv'
          assert not venv.exists() and not venv.is_symlink()
          subprocess.run((runner,'-m','venv',str(venv)),check=True,timeout=70,stdout=subprocess.DEVNULL)
          pip=venv/'bin'/'python'
          assert pip.is_file(), 'VENV_PYTHON_MISSING'
          subprocess.run((str(pip),'-m','pip','install','--disable-pip-version-check','--no-input','--no-cache-dir','--no-index','--find-links='+str(wheelhouse),'Django>=5.2,<6.0','google-auth>=2.30,<3.0'),check=True,timeout=100,stdout=subprocess.DEVNULL)
          subprocess.run((str(pip),'-m','pip','check'),check=True,timeout=30,stdout=subprocess.DEVNULL)
          subprocess.run((str(pip),'-c','import django; from google.oauth2 import id_token; assert django.VERSION[:2]==(5,2)'),check=True,timeout=30,stdout=subprocess.DEVNULL)
          imports=subprocess.run((str(pip),'-c','import importlib.util;print(importlib.util.find_spec("MySQLdb") is not None)'),check=True,capture_output=True,text=True,timeout=10)
          freeze=subprocess.run((str(pip),'-m','pip','freeze','--disable-pip-version-check'),check=True,capture_output=True,text=True,timeout=15)
          lock=root/'banknew-installed-dependencies.txt'
          assert not lock.exists() and not lock.is_symlink()
          lock.write_text(freeze.stdout,encoding='utf-8')
          lock.chmod(0o600)
          size=sum(p.stat().st_size for p in venv.rglob('*') if p.is_file())
          assert size<120000000, 'BANKNEW_RUNTIME_SIZE_EXCEEDED'
          print('BANKNEW_PRIVATE_VENV_READY=YES')
          print('BANKNEW_DJANGO_5_2_READY=YES')
          print('BANKNEW_GOOGLE_VERIFIER_READY=YES')
          print('BANKNEW_MYSQLCLIENT_READY='+imports.stdout.strip())
          print('BANKNEW_RUNTIME_BYTES='+str(size))
          print('BANKNEW_PUBLIC_ROUTES_CHANGED=NO')
          print('BANKNEW_PAYMENTS_ACTIVE=NO')
          PY
      - name: Clean only temporary offline wheels after successful install
        run: |
          timeout 45s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/home/zomorod2/mojpay-bank-service-private')
          marker=root/'.runtime-new-marker'
          if marker.is_file() and not marker.is_symlink() and marker.read_text(encoding='utf-8')=='mojpay-runtime-20261029':
              wheelhouse=root/'.wheelhouse'
              if wheelhouse.is_dir() and not wheelhouse.is_symlink():
                  shutil.rmtree(wheelhouse)
              marker.unlink()
              print('BANKNEW_TEMPORARY_WHEELS_CLEANED=YES')
          PY
      - name: Clean only newly-created incomplete private runtime on failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/mpw-structure-ssh/config"; then
            timeout 45s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY' || true
          from pathlib import Path
          import shutil
          root=Path('/home/zomorod2/mojpay-bank-service-private')
          marker=root/'.runtime-new-marker'
          if marker.is_file() and not marker.is_symlink() and marker.read_text(encoding='utf-8')=='mojpay-runtime-20261029':
              for name in ('.wheelhouse','.venv'):
                  item=root/name
                  if item.is_dir() and not item.is_symlink():
                      shutil.rmtree(item)
              marker.unlink()
              print('BANKNEW_ONLY_NEW_FAILED_RUNTIME_REMOVED=YES')
          PY
          fi
      - name: Clear transient SSH relay credentials
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/mpw-structure-ssh"; then
            find "$RUNNER_TEMP/mpw-structure-ssh" -type f -exec shred -u -- {} +
            rmdir "$RUNNER_TEMP/mpw-structure-ssh"
          fi
