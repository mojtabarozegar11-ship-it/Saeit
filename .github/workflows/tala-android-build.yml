name: Tala Android APK

on:
  pull_request:
    paths:
      - "android-tala/**"
      - ".github/workflows/tala-android-build.yml"
  push:
    paths:
      - "android-tala/**"
      - ".github/workflows/tala-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Install and launch on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ir.zomorodmelal.tala.mobile/ir.zomorodmelal.tala.MainActivity
      - name: Upload Tala APK
        uses: actions/upload-artifact@v4
        with:
          name: tala-android-debug
          path: android-tala/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
