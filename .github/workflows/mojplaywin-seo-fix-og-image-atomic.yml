name: Moj Play Win publish fixed social sharing image with rollback
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-seo-fix-og-image-atomic.yml"]
permissions:
  contents: read
concurrency:
  group: mojplaywin-main-only-root-deploy
  cancel-in-progress: false
jobs:
  social-share-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate safe exact home-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_og_image_exact_home_fix.py
          grep -Fq 'EXPECTED="3e7ad6d898809c267db127287dca54c136d53e422086c5e8a372a45f6b6b2557"' scripts/mojplaywin_og_image_exact_home_fix.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify OG asset is public and previous image is genuinely missing
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          new=https://mojplaywin.com/design-preview-20261017/static/site/heroes/platform-home.4dd3ab6a401d.webp
          old=https://mojplaywin.com/design-preview-20261017/static/site/mojplaywin-brand.jpg
          test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$new")" = 200
          test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$old")" = 404
          test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 https://mojplaywin.com/)" = 200
          echo "BRANDED_SHARE_IMAGE_REPLACEMENT_APPROVED"
      - name: Baseline protected page status codes
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          paths=("/" "/saman/" "/picm/login/" "/farnaz/" "/studio.Roham/" "/mojtaba.roozegar/" "/zahra%24%24/"
                 "/store/" "/games/" "/ai/" "/blockchain/" "/research/" "/company/" "/services/" "/knowledge/")
          : > "$RUNNER_TEMP/og-before.txt"
          for path in "${paths[@]}";do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 17 "https://mojplaywin.com$path")
            printf '%s %s\n' "$path" "$status" >> "$RUNNER_TEMP/og-before.txt"
            test "$status" = 200 || exit 71
          done
          echo "ORIGINAL_HOME_AND_14_ROUTES_HEALTHY"
      - name: Atomically update only existing homepage OG tags with independent rollback
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          armed=no
          undo(){
            if test "$armed" = yes;then
              timeout 35s ssh -T -F "$d/config" saeit-cpanel 'python3 - rollback' < scripts/mojplaywin_og_image_exact_home_fix.py ||
                 echo "FAIL_SAFE_180_SECOND_WATCHDOG_WILL_ROLLBACK"
            fi
          }
          trap undo EXIT
          timeout 40s ssh -T -F "$d/config" saeit-cpanel 'python3 - deploy' < scripts/mojplaywin_og_image_exact_home_fix.py
          armed=yes
          python3 - <<'PY'
          import urllib.request,re,json
          url="https://mojplaywin.com/"
          image="https://mojplaywin.com/design-preview-20261017/static/site/heroes/platform-home.4dd3ab6a401d.webp"
          results=[]
          for i in (1,2,3):
              req=urllib.request.Request(url+"?mpw_og_check="+str(i),
                   headers={"Cache-Control":"no-store","User-Agent":"MojPlayWin-independent-OG-release"})
              with urllib.request.urlopen(req,timeout=18) as resp:
                  if resp.status!=200:raise RuntimeError("root page unavailable")
                  html=resp.read(280000).decode("utf-8")
              flags={
                  "og_image":'<meta property="og:image" content="'+image+'">' in html,
                  "twitter_image":'<meta name="twitter:image" content="'+image+'">' in html,
                  "image_description":'<meta property="og:image:alt" content="Moj Play Win' in html,
                  "correct_main_title":"<title>Moj Play Win | Games, AI, Research & Digital Products</title>" in html,
                  "canonical_unchanged":'<link rel="canonical" href="https://mojplaywin.com/">' in html,
                  "one_h1":html.count('<h1')==1,
                  "18_cards":html.count('class="mpo-orbit-card"')==18,
                  "3_orbits":html.count('class="mpo-ring"')==3,
                  "10_guides":html.count('id="home-guide-')==10,
                  "animation_active":'data-globe-orbit="continuous"' in html
              }
              if not all(flags.values()):
                  print(json.dumps({"RELEASE_ACCEPTANCE_FAILED":flags},sort_keys=True))
                  raise RuntimeError("OG image release acceptance failed")
              results.append(flags)
          with urllib.request.urlopen(image,timeout=18) as r:
              if r.status!=200 or r.headers.get("Content-Type","").split(";")[0]!="image/webp":
                  raise RuntimeError("public share image cannot be loaded")
          print("MAIN_SITE_OG_IMAGE_BOTH_PLATFORMS_WORK_3_OF_3_PASSED")
          PY
          paths=("/" "/saman/" "/picm/login/" "/farnaz/" "/studio.Roham/" "/mojtaba.roozegar/" "/zahra%24%24/"
                 "/store/" "/games/" "/ai/" "/blockchain/" "/research/" "/company/" "/services/" "/knowledge/")
          : > "$RUNNER_TEMP/og-after.txt"
          for path in "${paths[@]}";do
            status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 17 "https://mojplaywin.com$path")
            printf '%s %s\n' "$path" "$status" >> "$RUNNER_TEMP/og-after.txt"
          done
          cmp "$RUNNER_TEMP/og-before.txt" "$RUNNER_TEMP/og-after.txt" || {
            echo "NO_GO_PROTECTED_ROUTE_DRIFT_OG_IMAGE_REVERTING";exit 76;
          }
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'python3 - commit' < scripts/mojplaywin_og_image_exact_home_fix.py
          armed=no
          echo "MAIN_SITE_OG_IMAGE_LIVE_FIXED_ORIGINAL_BACKUP_RETAINED"
          {
            echo "## Moj Play Win OG share image is now healthy"
            echo "- The original broken share image was replaced by existing verified WebP image."
            echo "- Exactly one main homepage HTML file patched. Twitter image and OG alt also added."
            echo "- Canonical, visible title/H1, 18 cards and 14 other deep and protected routes intact."
          } >> "$GITHUB_STEP_SUMMARY"
