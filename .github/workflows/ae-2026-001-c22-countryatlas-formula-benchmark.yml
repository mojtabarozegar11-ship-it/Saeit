name: AE C22 source-locked countryatlas CAGR convention numerical benchmark
on:
  push:
    branches:
      - research/mr-2026-001-novelty-audit
    paths:
      - .github/workflows/ae-2026-001-c22-countryatlas-formula-benchmark.yml
      - analysis/ae_2026_001_c22_countryatlas_cagr_vs_log_benchmark.py
      - research/manuscripts/AE-2026-001/AE-2026-001_OFFICIAL_WDI_OBSERVED_COUNTRY_PANEL_2026-10-25.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-cagr-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute matched-country CAGR vs log growth, fail closed on SHA
        run: python analysis/ae_2026_001_c22_countryatlas_cagr_vs_log_benchmark.py
      - name: Verify source-linked numerical identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_outputs/AE-2026-001/c22_countryatlas_cagr_vs_log_benchmark.json')
          d=json.loads(p.read_text())
          a,b=d['periods']
          assert (a['n'],b['n'])==(157,169)
          assert (a['sign_agreement_count'],b['sign_agreement_count'])==(157,169)
          assert a['rank_order_identical'] and b['rank_order_identical']
          assert (a['count_abs_difference_over_0_1_pp'],b['count_abs_difference_over_0_1_pp'])==(32,55)
          assert (a['count_abs_difference_over_0_5_pp'],b['count_abs_difference_over_0_5_pp'])==(0,10)
          assert (a['max_abs_difference_case']['iso3c'],b['max_abs_difference_case']['iso3c'])==('SVK','MLT')
          print('PASS: exact cohort, sign, rank, threshold and influential-economy gates')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AE-2026-001-C22-countryatlas-formula-not-package-run
          path: research_outputs/AE-2026-001/c22_countryatlas_cagr_vs_log_benchmark.json
          retention-days: 30
          if-no-files-found: error
