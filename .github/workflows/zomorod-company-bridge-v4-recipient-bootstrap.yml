name: Zomorod private command channel recipient-key enrollment
on:
  push:
    branches: [feature/zomorod-command-bridge-private-v4-20261029]
    paths: [".github/workflows/zomorod-company-bridge-v4-recipient-bootstrap.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-private-command-channel-enrollment
  cancel-in-progress: false
jobs:
  enroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify ingress implementation and existing bridge
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_company_private_ingress_v1.py scripts/zomorod_company_private_bridge_v4.py
          python3 -B -m unittest -v scripts/test_zomorod_company_private_ingress_v1.py scripts/test_zomorod_company_private_bridge_v4.py
      - name: Establish pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_PRIVATE_RELAY=verified"
      - name: Install isolated ingress code and generate one-use recipient key on cPanel
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-command-channel"
          expected="$(sha256sum scripts/zomorod_company_private_ingress_v1.py | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$GITHUB_RUN_ID" "$expected" <<'REMOTE'
          set -euo pipefail
          umask 077
          p="$HOME/.private/zomorod-business"
          fail(){ echo "PRIVATE_CHANNEL_ENROLLMENT_BLOCKED=$1"; exit 51; }
          test -d "$p" && test ! -L "$p" || fail private_directory
          test "$(stat -c %a "$p")" = 700 || fail private_directory_permissions
          for f in company_bridge.py .company-bridge.key command-center.sqlite3; do
            test -f "$p/$f" && test ! -L "$p/$f" || fail "missing_$f"
          done
          test "$(stat -c %a "$p/.company-bridge.key")" = 600 || fail hmac_key_permissions
          test "$(stat -c %a "$p/command-center.sqlite3")" = 600 || fail command_db_permissions
          test "$(python3 --version 2>&1 | awk '{print $2}' | cut -d. -f1)" = 3 || fail python3_missing
          command -v openssl >/dev/null || fail openssl_missing
          stage="$HOME/.backups/zomorod-business-command-bridge/ingress-$1-$2"
          test ! -e "$stage" && test ! -L "$stage" || fail duplicate_stage
          mkdir -m 700 -p "$(dirname "$stage")"
          mkdir -m 700 "$stage"
          sha256sum "$HOME/public_html/index.html" "$HOME/public_html/.htaccess" > "$stage/public-checksums.sha256"
          echo "PRIVATE_CHANNEL_PREFLIGHT=PASS"
          REMOTE
          target="/home/zomorod2/.backups/zomorod-business-command-bridge/ingress-$GITHUB_SHA-$GITHUB_RUN_ID"
          tar -cf - -C scripts zomorod_company_private_ingress_v1.py |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C '$target'"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" "$GITHUB_RUN_ID" "$expected" <<'REMOTE'
          set -euo pipefail
          umask 077
          p="$HOME/.private/zomorod-business"
          stage="$HOME/.backups/zomorod-business-command-bridge/ingress-$1-$2"
          script="$p/company_ingress.py"
          test -s "$stage/zomorod_company_private_ingress_v1.py"
          test "$(sha256sum "$stage/zomorod_company_private_ingress_v1.py" | awk '{print $1}')" = "$3"
          install -m 600 "$stage/zomorod_company_private_ingress_v1.py" "$script.next-$1"
          python3 -m py_compile "$script.next-$1"
          mv -f "$script.next-$1" "$script"
          chmod 600 "$script"
          python3 -B "$script" init-recipient --db "$p/command-center.sqlite3" \
            --hmac-key "$p/.company-bridge.key" --recipient-key "$p/.chat-command-rsa.key"
          test -f "$p/.chat-command-rsa.key" && test ! -L "$p/.chat-command-rsa.key"
          test "$(stat -c %a "$p/.chat-command-rsa.key")" = 600
          cmp -s "$script" "$stage/zomorod_company_private_ingress_v1.py"
          sha256sum -c --status "$stage/public-checksums.sha256"
          echo "PRIVATE_CHATGPT_COMMAND_CHANNEL=ENCRYPTED_INGRESS_READY"
          echo "COMPANY_WORK_EXECUTION=DISABLED"
          echo "ACCOUNTING_DATABASE=UNCHANGED"
          echo "PUBLIC_SITE_FILES=UNCHANGED"
          echo "COMMAND_PUBLIC_KEY_BEGIN"
          python3 -B "$script" show-public-key --db "$p/command-center.sqlite3" \
            --hmac-key "$p/.company-bridge.key" --recipient-key "$p/.chat-command-rsa.key"
          echo "COMMAND_PUBLIC_KEY_END"
          REMOTE
      - name: Remove temporary relay credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-command-channel"
