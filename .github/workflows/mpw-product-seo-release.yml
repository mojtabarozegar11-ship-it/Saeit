name: MojPlayWin three product SEO release
on:
  push:
    branches: [release/mpw-public-trx-20261023]
    paths: [.github/workflows/mpw-product-seo-release.yml, scripts/mpw_product_seo_release_20261023.py]
permissions: {contents: read}
concurrency:
  group: mpw-product-seo-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check bounded release script
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_product_seo_release_20261023.py
          python3 -B scripts/mpw_product_seo_release_20261023.py selftest
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-seo-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 3\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 50s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Publish descriptions and verified Product offers
        run: |
          set -euo pipefail
          timeout 240s ssh -T -F "$RUNNER_TEMP/mpw-seo-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - $GITHUB_RUN_ID" < scripts/mpw_product_seo_release_20261023.py
      - name: Verify public product pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://mojplaywin.com/store/product/72/ | grep -q 'An 84-day chess improvement guide'
          curl --fail --silent --show-error --max-time 30 https://mojplaywin.com/store/product/225/ | grep -q 'Taniya and the Little Baker Worms'
          curl --fail --silent --show-error --max-time 30 https://mojplaywin.com/store/product/879/ | grep -q 'Atelier Interior'
          echo 'PUBLIC_SEO_METADATA_AND_PRODUCT_SCHEMA_VERIFIED'
      - name: Cleanup credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-seo-ssh"
