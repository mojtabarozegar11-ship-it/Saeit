name: VPS Autonomous Factory Product Install
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_build50_workbook.py"
      - "tests/test_factory_build50_workbook.py"
      - "scripts/factory_build_50.py"
      - "tests/test_factory_build_50.py"
      - "scripts/factory_design_intake.py"
      - "scripts/factory_customer_packager.py"
      - "tests/test_factory_customer_packager.py"
      - "scripts/factory_continuous_invention.py"
      - "tests/test_factory_continuous_invention.py"
      - "tests/test_factory_design_intake.py"
      - "factory_config/internal_design_supply.json"
      - "scripts/factory_recipe_designer.py"
      - "factory_config/design_opportunities.json"
      - "tests/test_factory_recipe_designer.py"
      - "scripts/factory_production_warehouse.py"
      - "tests/test_factory_measured_qa.py"
      - "scripts/factory_product_maker.py"
      - "scripts/factory_verified_customer_cycle_20261021.py"
      - "scripts/factory_personal_owner_passport_policy_20261020.py"
      - "scripts/factory_vps_product_cycle.py"
      - "scripts/factory_specialist_pilots.py"
      - "scripts/factory_specialist_formats.py"
      - "scripts/factory_research_triage.py"
      - "tests/test_factory_research_triage.py"
      - "tests/test_factory_specialist_pilots.py"
      - "product_recipes/**"
      - "deploy/install_autonomous_factory_products.sh"
      - "tests/test_factory_product_maker.py"
      - "tests/test_factory_product_rework.py"
      - "tests/test_factory_production_warehouse.py"
      - "tests/test_factory_quality_module_upgrade.py"
      - "tests/test_factory_vps_product_cycle.py"
      - "tests/test_factory_vps_installer_syntax.py"
      - "tests/test_factory_private_passport_20261020.py"
      - ".github/workflows/vps-autonomous-product-install.yml"
  pull_request:
    paths:
      - "scripts/factory_build50_workbook.py"
      - "tests/test_factory_build50_workbook.py"
      - "scripts/factory_build_50.py"
      - "tests/test_factory_build_50.py"
      - "scripts/factory_design_intake.py"
      - "scripts/factory_customer_packager.py"
      - "tests/test_factory_customer_packager.py"
      - "scripts/factory_continuous_invention.py"
      - "tests/test_factory_continuous_invention.py"
      - "tests/test_factory_design_intake.py"
      - "factory_config/internal_design_supply.json"
      - "scripts/factory_recipe_designer.py"
      - "factory_config/design_opportunities.json"
      - "tests/test_factory_recipe_designer.py"
      - "scripts/factory_product_maker.py"
      - "scripts/factory_verified_customer_cycle_20261021.py"
      - "scripts/factory_personal_owner_passport_policy_20261020.py"
      - "tests/test_factory_vps_installer_syntax.py"
      - "tests/test_factory_private_passport_20261020.py"
      - "scripts/factory_vps_product_cycle.py"
      - "scripts/factory_specialist_pilots.py"
      - "scripts/factory_specialist_formats.py"
      - "scripts/factory_research_triage.py"
      - "tests/test_factory_research_triage.py"
      - "tests/test_factory_specialist_pilots.py"
      - "scripts/factory_production_warehouse.py"
      - "deploy/install_autonomous_factory_products.sh"
      - "tests/test_factory_measured_qa.py"
      - ".github/workflows/vps-autonomous-product-install.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-product-vps-install
  cancel-in-progress: false
jobs:
  measured-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install openpyxl==3.1.5
          python -B -m unittest discover -s tests -p 'test_factory_recipe_designer.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_design_intake.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_continuous_invention.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_customer_packager.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_measured_qa.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_product_maker.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_vps_installer_syntax.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_private_passport_20261020.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_production_warehouse.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_vps_product_cycle.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_specialist_pilots.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_research_triage.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_build_50.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_build50_workbook.py' -v
  deploy:
    needs: measured-qa
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'mojtabarozegar11-ship-it/Saeit' && contains(github.event.head_commit.message, '[approved-factory-unlimited-builds-20261019]'))
    runs-on: ubuntu-latest
    # Measured VPS regressions and private manufacturing already consumed the
    # old 12-minute budget before the final signed-off integrity readbacks.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate product and installer
        run: |
          set -euo pipefail
          python3 -m pip install openpyxl==3.1.5
          bash -n deploy/install_autonomous_factory_products.sh
          python3 scripts/factory_product_maker.py --recipes product_recipes --out "$RUNNER_TEMP/factory-products"
          python3 -m unittest discover -s tests -p 'test_factory_product_maker.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_private_passport_20261020.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_product_rework.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_production_warehouse.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_quality_module_upgrade.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_vps_product_cycle.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_continuous_invention.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_customer_packager.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_specialist_pilots.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_research_triage.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build_50.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build50_workbook.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_evidence_quality.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_vps_installer_syntax.py' -v
      - name: Install private VPS factory product cycle
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/saeit-vps-product"
          mkdir -m 700 -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          SSH=(ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes githubops@178.239.147.150)
          tar -cf - scripts/factory_customer_packager.py tests/test_factory_customer_packager.py scripts/factory_continuous_invention.py tests/test_factory_continuous_invention.py scripts/factory_design_intake.py tests/test_factory_design_intake.py factory_config/internal_design_supply.json scripts/factory_build50_workbook.py tests/test_factory_build50_workbook.py scripts/factory_build_50.py tests/test_factory_build_50.py tests/test_factory_vps_product_cycle.py tests/test_factory_source_evolution.py tests/test_factory_specialist_pilots.py tests/test_factory_research_triage.py scripts/factory_specialist_pilots.py scripts/factory_specialist_formats.py scripts/factory_research_triage.py scripts/factory_recipe_designer.py factory_config/design_opportunities.json scripts/factory_first_product_pilot.py scripts/factory_autonomous_portfolio.py scripts/factory_evidence_quality.py scripts/factory_product_maker.py scripts/factory_verified_customer_cycle_20261021.py scripts/factory_personal_owner_passport_policy_20261020.py scripts/factory_product_rework.py scripts/factory_vps_product_cycle.py scripts/factory_master_agent_genetics_v1.py scripts/factory_production_warehouse.py product_recipes/ deploy/install_production_warehouse.sh deploy/install_autonomous_factory_products.sh | "${SSH[@]}" 'mkdir -p "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}"; tar -xf - -C "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}"'
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/scripts/factory_verified_customer_cycle_20261021.py" && echo VPS_FACTORY_REQUIRED_CUSTOMER_MODULE_STAGED=PASS'
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/scripts/factory_master_agent_genetics_v1.py" && echo VPS_FACTORY_MASTER_GENETICS_MODULE_STAGED=PASS'
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/tests/test_factory_source_evolution.py" && echo VPS_FACTORY_LEGACY_SOURCE_EVOLUTION_FIXTURE_STAGED=PASS'
          # VPS regression: GitHub hosted QA had openpyxl but the actual VPS
          # service venv did not; F27 designs were silently blocked (6 of 15).
          # Provision the exact reviewed version before staging QA. No elevated
          # privileges, background processes, publishing or payment integration.
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 1 "openpyxl==3.1.5"'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -c "import openpyxl; assert openpyxl.__version__ == '\''3.1.5'\''; print('\''FACTORY_F27_OPENPYXL_READY=3.1.5'\'')"'
          "${SSH[@]}" 'cd "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}" && "$HOME/factory-runtime/.venv/bin/python" -B -m unittest discover -s tests -p test_factory_vps_product_cycle.py -v'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -B -m unittest discover -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/tests" -p test_factory_build_50.py -v'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -B -m unittest discover -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/tests" -p test_factory_design_intake.py -v'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -B -m unittest discover -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/tests" -p test_factory_customer_packager.py -v'
          echo VPS_FACTORY_ISOLATED_FAULT_INJECTION=PASS
          "${SSH[@]}" 'python3 -' <<'PYBEFORE'
          import json
          from pathlib import Path
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          before=[]
          for path in (root/"generated-product-recipes").glob("*/design_receipt.json"):
              data=json.loads(path.read_text())
              before.append(data.get("functional_sha256"))
          (root/"engineering-before-${{ github.sha }}.json").write_text(json.dumps(before))
          PYBEFORE
          # The passport v3 module must be identical in GitHub's reviewed staging
          # and the installed runtime; a missing dependency is a hard install failure.
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/scripts/factory_personal_owner_passport_policy_20261020.py"'
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/deploy/install_autonomous_factory_products.sh"'
          "${SSH[@]}" 'cmp "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/scripts/factory_personal_owner_passport_policy_20261020.py" "$HOME/factory-runtime/operations/autonomous-product-runtime/scripts/factory_personal_owner_passport_policy_20261020.py" && echo FACTORY_PASSPORT_POLICY_INSTALLED_BYTE_FOR_BYTE=PASS'
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/deploy/install_production_warehouse.sh"'
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/autonomous-product-runtime/run-local-cycle.sh" && bash "$HOME/factory-runtime/operations/production-warehouse/run-warehouse.sh"'
          "${SSH[@]}" 'python3 -c "import json,pathlib; p=pathlib.Path.home()/\"factory-runtime/private/autonomous-product-cycle/family-pilots/status.json\"; print(\"FACTORY_SPECIALIST_PILOT_PROOF=\"+json.dumps(json.loads(p.read_text()),sort_keys=True))"'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -' <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          state=json.loads((root/"production-state.json").read_text())
          recipes=list((root/"generated-product-recipes").glob("synth_*"))
          assert recipes
          for recipe in recipes:
              receipt=json.loads((recipe/"design_receipt.json").read_text())
              manifest=json.loads((root/"digital-products"/recipe.name/"manufacturing_manifest.json").read_text())
              assert receipt["heldout_examples_passed"] >= 3
              assert manifest["qa_measurements"]["successful_tests"] >= 3
              assert receipt["commercial_release"] is False
          print("VPS_FACTORY_SYNTHESIZED_RECIPE_COUNT="+str(len(recipes)))
          print("VPS_FACTORY_TOTAL_RECIPE_COUNT="+str(state["registered_recipe_count"]))
          print("VPS_FACTORY_GENERATIVE_ADAPTER_FAMILIES=F27,F28")
          print("VPS_FACTORY_GENERAL_AI_INVENTION=false")
          print("VPS_FACTORY_DESIGNER_TECHNICAL_PILOT=PASS")
          import importlib.util, shutil, os
          capabilities={"cpu_cores":os.cpu_count(),"gpu_device_present":Path("/dev/nvidia0").exists(),
                        "tools":{name:bool(shutil.which(name)) for name in ("ffmpeg","blender","libreoffice","ollama","llama-server","docker")},
                        "python_packages":{name:bool(importlib.util.find_spec(name)) for name in ("torch","transformers","numpy","PIL","docx","pptx","reportlab")}}
          memory={}
          for line in Path("/proc/meminfo").read_text().splitlines():
              if line.split(":")[0] in ("MemTotal","MemAvailable"):
                  key,value=line.split(":",1); memory[key]=int(value.split()[0])//1024
          capabilities["memory_mb"]=memory
          print("VPS_FACTORY_REAL_BUILD_CAPABILITIES="+json.dumps(capabilities,sort_keys=True))
          PY
          # Build and independently hash-check every new private technical pilot.
          # Existing minute cron may continue; repeated artifacts remain idempotent.
                    "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -' <<'PYFAMILY'
          import importlib.util,json,subprocess
          from pathlib import Path
          root=Path.home()/"factory-runtime"
          private=root/"private/autonomous-product-cycle"
          script=root/"operations/autonomous-product-runtime/scripts/factory_specialist_pilots.py"
          spec=importlib.util.spec_from_file_location("specialist_proof",str(script))
          producer=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(producer)
          manifest=root/"operations/build-toolchain/toolchain-manifest.json"
          for attempt in range(len(producer.FAMILIES)+1):
              result=subprocess.run([str(root/".venv/bin/python"),str(script),
                 "--out",str(private),"--manifest",str(manifest)],
                 capture_output=True,text=True,timeout=95)
              if result.returncode:
                  raise RuntimeError("PILOT_LOOP_ERROR:"+result.stderr[-250:])
          passed=[]
          blocked=[]
          for family in producer.FAMILIES:
              versions=private/"family-pilots"/family
              valid=False
              for receipt in versions.glob("*/technical-receipt.json"):
                  evidence=json.loads(receipt.read_text(encoding="utf8"))
                  if producer.verified_receipt(receipt.parent,family,evidence["source_key"]):
                      valid=True
              (passed if valid else blocked).append(family)
          q=json.loads((private/"research-triage/triage-status.json").read_text(encoding="utf8"))
          print("FACTORY_SPECIALIST_PROVEN_FAMILIES="+json.dumps(sorted(passed)))
          print("FACTORY_SPECIALIST_MISSING_FAMILIES="+json.dumps(sorted(blocked)))
          print("FACTORY_RESEARCH_REMEDIATION_PLAN_COUNT="+str(q["research_ledgers_found"]))
          print("FACTORY_RESEARCH_GENUINE_FIXED_COUNT="+str(q["genuine_research_repairs_verified_this_run"]))
          print("FACTORY_COMMERCIAL_RELEASE=false")
          assert not blocked, "SPECIALIST_PILOT_TECHNICAL_QA_BLOCKED"
          PYFAMILY
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/private/autonomous-product-cycle/production-state.json" && test "$(find "$HOME/factory-runtime/private/autonomous-product-cycle/digital-products" -type f -name "*-internal-qa.zip" -print -quit)" != "" && crontab -l | grep SAEIT_AUTONOMOUS_PRODUCTS_V2 && echo AUTONOMOUS_PRODUCT_VPS_VERIFIED'

          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -' <<'PYQUALITY50'
          import json
          from pathlib import Path
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          quality=json.loads((root/"build-50-status.json").read_text())
          register=json.loads((root/"production-warehouse/stock-register.json").read_text())
          assert register["strict_build50_enabled"] is True
          assert quality["inspected"]>=5
          assert quality["commercial_release"] is False
          workbook=json.loads((root/"build-50/capacity_planning_workbook/state.json").read_text())
          print("FACTORY_WORKBOOK_BUILD50_STATUS="+workbook["status"])
          print("FACTORY_WORKBOOK_BUILD50_COMPLETED="+str(workbook["completed_stages"]))
          assert workbook["completed_stages"]==50, workbook.get("defects")
          product=json.loads((root/"digital-products/capacity_planning_workbook/manufacturing_manifest.json").read_text())
          assert any(item["product_id"]=="capacity_planning_workbook" and item["version"]==product["source_sha256"] and item.get("family_id")=="F27" for item in register["records"]), register["needs_rework_or_review"]
          print("FACTORY_WORKBOOK_BUILD50_CURRENT_VERSION_STOCKED=PASS")
          print("FACTORY_BUILD50_PRODUCTS_INSPECTED="+str(quality["inspected"]))
          print("FACTORY_BUILD50_PROVEN_COMPLETED="+str(quality["verified_50_stage_builds"]))
          print("FACTORY_BUILD50_RETURNED_TO_PLANNING="+str(quality["requiring_replanning"]))
          print("FACTORY_QUALITY_MULTIPLIER_MEASURED="+str(quality["quality_multiplier_measured"]))
          print("FACTORY_BUILD50_STRICT_WAREHOUSE_GATE=PASS")
          PYQUALITY50

          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -' <<'PYHEALTH'
          import json,time
          from datetime import datetime
          from pathlib import Path
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          health=json.loads((root/"production-health.json").read_text())
          state=json.loads((root/"production-state.json").read_text())
          assert health["schema"]=="saeit.factory.production-health.v1"
          assert health["completed_cycles"]>=2
          age=time.time()-datetime.fromisoformat(health["last_cycle_finished_at_utc"]).timestamp()
          assert 0<=age<600, "FACTORY_PRODUCTION_HEALTH_STALE"
          assert health["new_or_updated_artifacts_this_cycle"]==state["new_or_updated_product_count"]
          assert state["built_product_count"]>=1
          print("FACTORY_CONTINUITY_HEALTH="+json.dumps(health,sort_keys=True))
          print("FACTORY_RESEARCH_FAILURES="+json.dumps(state.get("research_failures",[])))
          print("FACTORY_PRODUCTION_ACTIVITY_MEASURED=PASS")
          PYHEALTH

          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -' <<'PYENGINEERING'
          import hashlib,importlib.util,json,subprocess
          from pathlib import Path
          base=Path.home()/"factory-runtime"
          root=base/"private/autonomous-product-cycle"
          runtime=base/"operations/autonomous-product-runtime"
          py=base/".venv/bin/python"
          # Always execute at least one real tick, but do not spend ten long
          # full manufacturing cycles when source-bound technical candidates
          # already satisfy the later, stricter readback assertions.
          def engineering_targets_exist():
              accepted=[]
              for ticket in (root/"engineering-intake").glob("*.json"):
                  if len(ticket.stem)!=64:continue
                  try:
                      row=json.loads(ticket.read_text())
                  except (OSError,ValueError):continue
                  if row.get("schema")=="saeit.factory.engineering-intake.v1" and row.get("status")=="technical_prototype_built":
                      accepted.append(row)
              return (len({row.get("functional_sha256") for row in accepted})>=6
                      and any(row.get("family_id")=="F27" for row in accepted)
                      and len({row.get("functional_sha256") for row in accepted
                               if str(row.get("source_id","")).startswith("auto_need_")})>=2)
          for tick in range(10):
              subprocess.run([str(py),str(runtime/"scripts/factory_vps_product_cycle.py"),
                  "--db",str(base/"private/factory-fresh-isolated.sqlite3"),
                  "--out",str(root),"--recipes",str(runtime/"product_recipes"),
                  "--enable-designer","--enable-design-intake","--enable-invention-supply"],check=True,timeout=90,
                  stdout=subprocess.DEVNULL)
              if engineering_targets_exist():
                  print("FACTORY_ENGINEERING_TICKS_RUN="+str(tick+1))
                  break
          status=json.loads((root/"engineering-intake/production-results.json").read_text())
          records=[]
          for path in (root/"engineering-intake").glob("*.json"):
              row=json.loads(path.read_text())
              if row.get("schema")=="saeit.factory.engineering-intake.v1" and row.get("status")=="technical_prototype_built":
                  artifact=root/"digital-products"/row["recipe"]/(row["recipe"]+"-internal-qa.zip")
                  assert hashlib.sha256(artifact.read_bytes()).hexdigest()==row["artifact_sha256"]
                  assert row["measured_successful_tests"]>=3
                  assert row["build50_verified"] is False and row["commercial_release"] is False
                  records.append(row)
          assert len({r["functional_sha256"] for r in records})>=6, records
          assert any(r["family_id"]=="F27" for r in records)
          before=set(json.loads((root/"engineering-before-${{ github.sha }}.json").read_text()))
          novel={r["functional_sha256"] for r in records}-before
          # VPS integration proof: two distinct internally invented, actually
          # manufactured ZIPs; design tickets or orders alone never count.
          auto=[r for r in records if str(r.get("source_id","")).startswith("auto_need_")]
          auto_ids={r["functional_sha256"] for r in auto}
          assert len(auto_ids)>=2, "FACTORY_AUTONOMOUS_INVENTION_NO_REAL_PRODUCTS"
          for row in auto:
              proposal=root/"engineering-briefs"/(row["source_id"]+".json")
              assert proposal.is_file() and not proposal.is_symlink()
              data=json.loads(proposal.read_text())
              assert data["origin"]=="factory_invention"
              assert data["commercial_release"] is False
          print("FACTORY_AUTONOMOUS_NEW_TECHNICAL_FUNCTIONS="+str(len(auto_ids)))
          print("FACTORY_AUTONOMOUS_SALE_READY_PRODUCTS=0")
          print("FACTORY_ENGINEERING_FUNCTIONAL_PRODUCTS="+str(status["functional_products"]))
          print("FACTORY_ENGINEERING_REAL_FORMAT_PROTOTYPES="+str(status["technical_prototypes"]))
          print("FACTORY_ENGINEERING_NOVEL_FUNCTIONS_SINCE_DEPLOY="+str(len(novel)))
          print("FACTORY_ENGINEERING_50_STAGE_NEW_PROTOTYPES_VERIFIED=0")

          # Real consumer bundle audit: checked byte hashes, held-out examples,
          # onboarding, draft sales metadata and explicit legal approval hold.
          from zipfile import ZipFile
          packages=list((root/"customer-packs").glob("*/**/candidate_manifest.json"))
          verified=[]
          for path in packages:
              item=json.loads(path.read_text())
              if item.get("schema")!="saeit.factory.consumer-package.v1":continue
              z=path.parent/"customer-package.zip"
              assert z.is_file() and not z.is_symlink()
              assert hashlib.sha256(z.read_bytes()).hexdigest()==item["package_sha256"]
              with ZipFile(z) as a:
                  assert a.testzip() is None
                  assert "product/calculator.py" in a.namelist()
                  assert "guide/START_HERE.md" in a.namelist()
                  assert "license/REVIEW_REQUIRED.txt" in a.namelist()
                  assert "qa/SHA256SUMS.txt" in a.namelist()
              assert item["technical_buyer_package_verified"] is True
              assert item["consumer_cli_smoke_examples_passed"]==2
              assert item["commercial_release"] is False
              assert item["eligible_for_commercial_listing"] is False
              verified.append(item)
          assert len({x["functional_sha256"] for x in verified})>=2, "FACTORY_CONSUMER_USABLE_PACKAGES_MISSING"
          print("FACTORY_REAL_CUSTOMER_PACKAGE_REVIEW_CANDIDATES="+str(len(verified)))
          print("FACTORY_REAL_CUSTOMER_PACKAGE_COMMERCIAL_SALE_READY=0")
          print("FACTORY_NEW_DESIGN_TO_REAL_PROTOTYPE=PASS")
          PYENGINEERING
