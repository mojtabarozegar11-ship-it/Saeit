name: VPS Autonomous Factory Product Install
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_recipe_designer.py"
      - "factory_config/design_opportunities.json"
      - "tests/test_factory_recipe_designer.py"
      - "scripts/factory_production_warehouse.py"
      - "tests/test_factory_measured_qa.py"
      - "scripts/factory_product_maker.py"
      - "scripts/factory_vps_product_cycle.py"
      - "product_recipes/**"
      - "deploy/install_autonomous_factory_products.sh"
      - "tests/test_factory_product_maker.py"
      - "tests/test_factory_product_rework.py"
      - "tests/test_factory_production_warehouse.py"
      - "tests/test_factory_quality_module_upgrade.py"
      - "tests/test_factory_vps_product_cycle.py"
      - "tests/test_factory_vps_installer_syntax.py"
      - ".github/workflows/vps-autonomous-product-install.yml"
  pull_request:
    paths:
      - "scripts/factory_recipe_designer.py"
      - "factory_config/design_opportunities.json"
      - "tests/test_factory_recipe_designer.py"
      - "scripts/factory_product_maker.py"
      - "scripts/factory_vps_product_cycle.py"
      - "scripts/factory_production_warehouse.py"
      - "deploy/install_autonomous_factory_products.sh"
      - "tests/test_factory_measured_qa.py"
      - ".github/workflows/vps-autonomous-product-install.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-product-vps-install
  cancel-in-progress: false
jobs:
  measured-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -B -m unittest discover -s tests -p 'test_factory_recipe_designer.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_measured_qa.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_product_maker.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_production_warehouse.py' -v
          python -B -m unittest discover -s tests -p 'test_factory_vps_product_cycle.py' -v
  deploy:
    needs: measured-qa
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'mojtabarozegar11-ship-it/Saeit' && contains(github.event.head_commit.message, '[approved-factory-unlimited-builds-20261019]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate product and installer
        run: |
          set -euo pipefail
          bash -n deploy/install_autonomous_factory_products.sh
          python3 scripts/factory_product_maker.py --recipes product_recipes --out "$RUNNER_TEMP/factory-products"
          python3 -m unittest discover -s tests -p 'test_factory_product_maker.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_product_rework.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_production_warehouse.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_quality_module_upgrade.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_vps_product_cycle.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_evidence_quality.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_vps_installer_syntax.py' -v
      - name: Install private VPS factory product cycle
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/saeit-vps-product"
          mkdir -m 700 -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          SSH=(ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes githubops@178.239.147.150)
          tar -cf - tests/test_factory_vps_product_cycle.py scripts/factory_recipe_designer.py factory_config/design_opportunities.json scripts/factory_first_product_pilot.py scripts/factory_autonomous_portfolio.py scripts/factory_evidence_quality.py scripts/factory_product_maker.py scripts/factory_product_rework.py scripts/factory_vps_product_cycle.py scripts/factory_production_warehouse.py product_recipes/ deploy/install_production_warehouse.sh deploy/install_autonomous_factory_products.sh | "${SSH[@]}" 'mkdir -p "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}"; tar -xf - -C "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}"'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -B -m unittest discover -s "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/tests" -p test_factory_vps_product_cycle.py -v'
          echo VPS_FACTORY_ISOLATED_FAULT_INJECTION=PASS
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/deploy/install_autonomous_factory_products.sh"'
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/product-deploy-${{ github.sha }}/deploy/install_production_warehouse.sh"'
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/autonomous-product-runtime/run-local-cycle.sh" && bash "$HOME/factory-runtime/operations/production-warehouse/run-warehouse.sh"'
          "${SSH[@]}" '"$HOME/factory-runtime/.venv/bin/python" -' <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          state=json.loads((root/"production-state.json").read_text())
          recipes=list((root/"generated-product-recipes").glob("synth_*"))
          assert recipes
          for recipe in recipes:
              receipt=json.loads((recipe/"design_receipt.json").read_text())
              manifest=json.loads((root/"digital-products"/recipe.name/"manufacturing_manifest.json").read_text())
              assert receipt["heldout_examples_passed"] >= 3
              assert manifest["qa_measurements"]["successful_tests"] >= 3
              assert receipt["commercial_release"] is False
          print("VPS_FACTORY_SYNTHESIZED_RECIPE_COUNT="+str(len(recipes)))
          print("VPS_FACTORY_TOTAL_RECIPE_COUNT="+str(state["registered_recipe_count"]))
          print("VPS_FACTORY_GENERATIVE_ADAPTER_FAMILIES=F28")
          print("VPS_FACTORY_GENERAL_AI_INVENTION=false")
          print("VPS_FACTORY_DESIGNER_TECHNICAL_PILOT=PASS")
          import importlib.util, shutil, os
          capabilities={"cpu_cores":os.cpu_count(),"gpu_device_present":Path("/dev/nvidia0").exists(),
                        "tools":{name:bool(shutil.which(name)) for name in ("ffmpeg","blender","libreoffice","ollama","llama-server","docker")},
                        "python_packages":{name:bool(importlib.util.find_spec(name)) for name in ("torch","transformers","numpy","PIL","docx","pptx","reportlab")}}
          memory={}
          for line in Path("/proc/meminfo").read_text().splitlines():
              if line.split(":")[0] in ("MemTotal","MemAvailable"):
                  key,value=line.split(":",1); memory[key]=int(value.split()[0])//1024
          capabilities["memory_mb"]=memory
          print("VPS_FACTORY_REAL_BUILD_CAPABILITIES="+json.dumps(capabilities,sort_keys=True))
          PY
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/private/autonomous-product-cycle/production-state.json" && test "$(find "$HOME/factory-runtime/private/autonomous-product-cycle/digital-products" -type f -name "*-internal-qa.zip" -print -quit)" != "" && crontab -l | grep SAEIT_AUTONOMOUS_PRODUCTS_V2 && echo AUTONOMOUS_PRODUCT_VPS_VERIFIED'
