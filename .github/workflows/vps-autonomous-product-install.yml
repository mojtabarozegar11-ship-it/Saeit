name: VPS Autonomous Factory Product Install
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-autonomous-product-install.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-product-vps-install
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate product and installer
        run: |
          set -euo pipefail
          bash -n deploy/install_autonomous_factory_products.sh
          python3 -m unittest discover -s product_recipes/farm_enterprise_economics -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_product_maker.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_vps_product_cycle.py' -v
      - name: Install private VPS factory product cycle
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/saeit-vps-product"
          mkdir -m 700 -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          SSH=(ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes githubops@178.239.147.150)
          tar -cf - scripts/factory_first_product_pilot.py scripts/factory_autonomous_portfolio.py scripts/factory_product_maker.py scripts/factory_vps_product_cycle.py product_recipes/farm_enterprise_economics deploy/install_autonomous_factory_products.sh | "${SSH[@]}" 'mkdir -p "$HOME/factory-runtime/operations/product-deploy-source"; tar -xf - -C "$HOME/factory-runtime/operations/product-deploy-source"'
          "${SSH[@]}" 'bash "$HOME/factory-runtime/operations/product-deploy-source/deploy/install_autonomous_factory_products.sh"'
          "${SSH[@]}" 'test -s "$HOME/factory-runtime/private/autonomous-product-cycle/production-state.json" && crontab -l | grep SAEIT_AUTONOMOUS_PRODUCTS_V2 && echo AUTONOMOUS_PRODUCT_VPS_VERIFIED'
