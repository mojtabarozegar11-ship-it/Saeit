name: Mojtaba revenue P0 offline arithmetic QA
on:
  push:
    branches:
      - feature/mojtaba-bot-revenue-operations-20261114
    paths:
      - .github/workflows/mojtaba-revenue-ops-offline-ci-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Setup free Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact source and tests
        run: |
          python -m py_compile core/revenue_unit_economics.py core/tests/test_revenue_unit_economics_20261114.py
          python -m py_compile command_center/revenue_operations.py command_center/commerce_funnel.py command_center/urls.py
          python -m py_compile core/management/commands/mojtaba_revenue_ops_readonly.py core/management/commands/mojtaba_quote_scenario_readonly.py
          python -m py_compile command_center/tests/test_revenue_operations_20261114.py
      - name: Run no-I-O pricing regressions
        run: python -m unittest discover -s core/tests -p 'test_revenue_unit_economics_20261114.py' -v
