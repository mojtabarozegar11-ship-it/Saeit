name: Publish free-only isolated MojPlayWin Arena
on:
  pull_request:
    paths:
      - "site_releases/mojplaywin/arena/**"
      - "scripts/deploy_mpw_arena_static.py"
      - "tests/test_mpw_arena_owned_release.py"
      - ".github/workflows/mojplaywin-arena-static-deploy.yml"
  push:
    branches: [main]
    paths:
      - "site_releases/mojplaywin/arena/**"
      - "scripts/deploy_mpw_arena_static.py"
      - "tests/test_mpw_arena_owned_release.py"
      - ".github/workflows/mojplaywin-arena-static-deploy.yml"
permissions:
  contents: read
concurrency:
  group: isolated-mojplaywin-arena-free-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify guarded self-contained static payload
        run: |
          python -m py_compile scripts/deploy_mpw_arena_static.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('arena_guard','scripts/deploy_mpw_arena_static.py')
          guard=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          source=Path('site_releases/mojplaywin/arena')
          assert {p.name for p in source.iterdir()} == {'index.html','README.md'}
          print('ARENA_SOURCE_SHA256='+guard.payload_preflight(source/'index.html'))
          PY
      - name: Verify owned upgrade, rollback and tamper rejection
        run: python3 -m unittest discover -s tests -p 'test_mpw_arena_owned_release.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/arena-browser-test" playwright-core@1.62.1
      - name: Exercise 62 free experiences, Spain/UEFA, multisport schedules and world horse calendars in six languages
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/arena-browser-test/node_modules
        run: |
          set -euo pipefail
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const {pathToFileURL}=require('node:url'),{chromium}=require('playwright-core');
          (async()=>{
            const exe=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            assert.ok(exe,'Runner Chromium missing');
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});

              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const future=new Date(Date.now()+36*3600*1000).toISOString();
              const past=new Date(Date.now()-48*3600*1000).toISOString();
              const fixture=(id,league,utc,finished=false,h=null,a=null)=>({
                matchID:id,leagueShortcut:league,matchDateTimeUTC:utc,matchIsFinished:finished,
                group:{groupOrderID:9},
                team1:{teamName:league==='bl1'?'Berlin Actual':'Hamburg Actual'},
                team2:{teamName:league==='bl1'?'Munich Actual':'Bremen Actual'},
                matchResults:finished?[{resultTypeKind:'After90Minutes',resultTypeID:2,pointsTeam1:h,pointsTeam2:a}]:[]
              });
              let liveMock={
                bl1:[fixture(900001,'bl1',future),fixture(900002,'bl1',past,true,1,1)],
                bl2:[fixture(910001,'bl2',future)],
                la1:[fixture(920001,'la1',future),fixture(920002,'la1',past,true,2,1)],
                ucl:[fixture(930001,'ucl',future)],
                uel2026:[fixture(940001,'uel2026',future)],
                uecl2026:[fixture(950001,'uecl2026',future)],
                pl:[fixture(960001,'pl',future)],
                del:[fixture(970001,'del',future)]
              },feedBroken=false,feedCalls=0,sportCalls=0;
              await page.route('https://api.openligadb.de/**',async route=>{
                feedCalls++;
                if(feedBroken){await route.fulfill({status:503,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{}'});return}
                const league=new URL(route.request().url()).pathname.split('/')[2];
                await route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(liveMock[league])});
              });
              await page.route('https://www.thesportsdb.com/**',async route=>{
                sportCalls++;
                const id=new URL(route.request().url()).searchParams.get('id');
                const events=id==='4387'?[{idEvent:'123456',strEvent:'Sample NBA — Indiana vs Philadelphia',dateEvent:'2026-11-05',strTime:'20:00:00'}]:
                  id==='4370'?[{idEvent:'234567',strEvent:'Sample Mexico F1 GP',dateEvent:'2026-11-07',strTime:'13:00:00'}]:null;
                await route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify({events})});
              });
              await page.goto(pathToFileURL(path.resolve('site_releases/mojplaywin/arena/index.html')).href);
              assert.equal(await page.evaluate(()=>document.activeElement.id),'age-confirm');
              await page.keyboard.press('Tab');
              assert.equal(await page.evaluate(()=>document.activeElement.textContent.trim()),'Leave');
              await page.keyboard.press('Shift+Tab');
              assert.equal(await page.evaluate(()=>document.activeElement.id),'age-confirm');

              assert.equal(feedCalls,0,'No football feed call before age self-declaration');
              assert.equal(sportCalls,0,'No secondary feed call before age self-declaration');
              await page.locator('#age-confirm').click();
              await page.locator('#real-match-920001').waitFor({state:'visible'});
              assert.equal(await page.locator('#live-league').inputValue(),'la1','Spain is the default');
              assert.equal(await page.locator('#real-match-920001 form').count(),1,'Spain has free picks');
              await page.locator('#spotlight-card h3').waitFor({state:'visible'});
              assert.match(await page.locator('#spotlight-card h3').innerText(),/Indiana vs Philadelphia/);
              await page.locator('#spotlight-select').selectOption('4370');
              await page.waitForFunction(()=>document.querySelector('#spotlight-card h3')?.textContent.includes('Mexico F1 GP'));
              await page.locator('#spotlight-select').selectOption('4464');
              await page.waitForFunction(()=>document.querySelector('#spotlight-status')?.textContent.includes('no next event'));
              assert.equal(await page.locator('#horse-grid .horse-card').count(),17);
              await page.locator('#horse-country').selectOption('Spain');
              assert.equal(await page.locator('#horse-grid .horse-card').count(),2);
              await page.locator('#horse-kind').selectOption('equestrian');
              assert.equal(await page.locator('#horse-grid .horse-card').count(),1);
              assert.match(await page.locator('#horse-grid .horse-card').innerText(),/SICAB/);
              await page.locator('#horse-country').selectOption('all');
              await page.locator('#horse-kind').selectOption('all');
              await page.locator('#live-league').selectOption('ucl');
              await page.locator('#real-match-930001').waitFor({state:'visible'});
              await page.locator('#live-league').selectOption('uel2026');
              await page.locator('#real-match-940001').waitFor({state:'visible'});
              await page.locator('#live-league').selectOption('del');
              await page.locator('#real-match-970001').waitFor({state:'visible'});
              assert.equal(await page.locator('#real-match-970001 form').count(),0,'Hockey does not use soccer picks');
              await page.locator('#live-league').selectOption('bl1');
              await page.locator('#real-match-900001').waitFor({state:'visible'});
              assert.equal(await page.locator('#real-match-900002 .live-pill').innerText(),'Final');
              assert.ok(feedCalls>=1,'Public feed was requested after age confirmation');
              assert.equal(await page.locator('#mcd-balance').innerText(),'1,000.00 MCD');
              await page.locator('#real-match-900001 input[value="h"]').check();
              await page.locator('#real-match-900001 button[type=submit]').click();
              assert.match(await page.locator('#live-history-list').innerText(),/Awaiting final score/);
              assert.equal(await page.locator('#mcd-rounds').innerText(),'0');
              await page.locator('#live-league').selectOption('bl2');
              await page.locator('#real-match-910001').waitFor({state:'visible'});
              await page.locator('#live-league').selectOption('bl1');
              await page.locator('#real-match-900001').waitFor({state:'visible'});
              liveMock.bl1[0]=fixture(900001,'bl1',future,true,2,0);
              await page.locator('#live-refresh').click();
              await page.waitForFunction(()=>document.querySelector('#live-history-list')?.textContent.includes('Correct'));
              assert.match(await page.locator('#live-history-list').innerText(),/Correct/);
              assert.equal(await page.locator('#mcd-balance').innerText(),'1,000.00 MCD');
              feedBroken=true;
              await page.locator('#live-refresh').click();
              await page.waitForFunction(()=>document.querySelector('#live-status')?.textContent.includes('Data delayed/unavailable'));
              assert.match(await page.locator('#live-status').innerText(),/Data delayed\/unavailable/);
              assert.equal(await page.locator('#real-match-900001 form').count(),0);
              feedBroken=false;
              assert.equal(await page.locator('#game-grid article').count(),16);
              assert.equal(await page.locator('#dice-game-grid article').count(),15);
              assert.equal(await page.locator('#classic-game-grid article').count(),6);
              assert.equal(await page.locator('#oracle-grid article').count(),12);
              assert.equal(await page.locator('#wager-grid article').count(),7);
              assert.equal(await page.locator('#prediction-grid article').count(),6);
              assert.equal(await page.locator('.arena-categories a').count(),6);
              assert.equal(await page.locator('#arena-count').innerText(),'62 experiences found');
              await page.locator('#arena-search').fill('chess');
              assert.equal(await page.locator('#classic-game-grid article:not([hidden])').count(),1);
              assert.equal(await page.locator('#dice-festival').isVisible(),false);
              assert.equal(await page.locator('#fortune-oracles').isVisible(),false);
              await page.locator('#arena-search').fill('no-such-game-xyz');
              assert.equal(await page.locator('#arena-empty').isVisible(),true);
              await page.locator('#arena-search').fill('tarot');
              assert.equal(await page.locator('#oracle-grid article:not([hidden])').count(),2);
              assert.equal(await page.locator('#game-grid article:not([hidden])').count(),0);
              await page.locator('#arena-search').fill('basketball');
              assert.equal(await page.locator('#prediction-grid article:not([hidden])').count(),1);
              await page.locator('#arena-search').fill('');
              assert.equal(await page.locator('#arena-count').innerText(),'62 experiences found');
              assert.equal(await page.locator('#mcd-balance').innerText(),'1,000.00 MCD');

              await page.locator('#prediction-ft1 select').selectOption('goals');
              assert.equal(await page.locator('#prediction-ft1 input[type=radio]').count(),2);
              await page.locator('#prediction-ft1 input[value=over]').check();
              await page.locator('#prediction-ft1 button[type=submit]').click();
              await page.locator('#prediction-bb1 select').selectOption('handicap');
              await page.locator('#prediction-bb1 button[type=submit]').click();
              await page.locator('#prediction-tn1 select').selectOption('series');
              await page.locator('#prediction-tn1 input[value="2-1"]').check();
              await page.locator('#prediction-tn1 button[type=submit]').click();
              assert.equal(await page.locator('#prediction-slip-legs li').count(),3);
              await page.locator('#prediction-ft2 button[type=submit]').click();
              assert.match(await page.locator('#prediction-message').innerText(),/Maximum three/);
              assert.equal(await page.locator('#prediction-slip-legs li').count(),3);
              assert.match(await page.locator('#prediction-slip-odds').innerText(),/[0-9]/);
              await page.locator('#prediction-submit').click();
              assert.equal(await page.locator('#mcd-rounds').innerText(),'1');
              assert.equal(await page.locator('#prediction-slip-legs li').count(),1);
              assert.equal(await page.locator('#prediction-submit').isDisabled(),true);
              assert.match(await page.locator('#prediction-message').innerText(),/Virtual result/);
              await page.locator('#mcd-reset').click();
              assert.equal(await page.locator('#mcd-balance').innerText(),'1,000.00 MCD');
              await page.locator('#mcd-roulette-spin').click();
              await page.locator('[data-mcd-baccarat="player"]').click();
              await page.locator('#mcd-slots-spin').click();
              await page.locator('#mcd-sports-play').click();
              await page.locator('#mcd-bj-deal').click();
              if(await page.locator('#mcd-bj-stand').isEnabled())await page.locator('#mcd-bj-stand').click();
              await page.locator('#mcd-poker-deal').click();
              await page.locator('#mcd-poker-cards button').first().click();
              await page.locator('#mcd-poker-draw').click();
              for(let attempts=0;attempts<100&&Number(await page.locator('#mcd-rounds').innerText())<7;attempts++)
                await page.locator('#mcd-craps-roll').click();
              assert.equal(await page.locator('#mcd-rounds').innerText(),'7');
              assert.equal(await page.locator('#mcd-history li').count(),7);
              assert.equal(await page.locator('#mcd-reset').isEnabled(),true);
              await page.locator('#mcd-reset').click();
              assert.equal(await page.locator('#mcd-balance').innerText(),'1,000.00 MCD');
              await page.locator('#oracle-zodiac select').selectOption('8');
              await page.locator('#oracle-zodiac button').click();
              const horoscope=await page.locator('#oracle-zodiac .oracle-answer').innerText();
              assert.ok(horoscope.includes('Sagittarius'));
              await page.locator('#oracle-zodiac button').click();
              assert.equal(await page.locator('#oracle-zodiac .oracle-answer').innerText(),horoscope,'same sign on same day must be stable');
              await page.locator('#oracle-chinese input').fill('2024');
              await page.locator('#oracle-chinese button').click();
              assert.match(await page.locator('#oracle-chinese .oracle-answer').innerText(),/Dragon/);
              await page.locator('#oracle-numerology input').fill('1984-05-22');
              await page.locator('#oracle-numerology button').click();
              assert.match(await page.locator('#oracle-numerology .oracle-answer').innerText(),/Life path/);
              for(const id of ['tarot','tarot3','coffee','runes','iching','dream','poetry','yesno','lucky']){
                await page.locator('#oracle-'+id+' button').click();
                const answer=await page.locator('#oracle-'+id+' .oracle-answer').innerText();
                assert.ok(answer.length>35,id+' must generate a meaningful reading');
              }
              assert.equal((await page.locator('#oracle-tarot3 .oracle-answer').innerText()).split('🃏').length-1,3);
              assert.equal((await page.locator('#oracle-iching .oracle-answer').innerText()).split('━━').length>5,true);
              await page.locator('#oracle-numerology input').fill('1890-01-01');
              await page.locator('#oracle-numerology button').click();
              assert.equal(await page.locator('#oracle-numerology .oracle-answer').innerText(),'Choose a birth date.');
              await page.locator('#language').selectOption('fa');
              assert.equal(await page.locator('#nav-predictions').innerText(),'پیش‌بینی زنده');
              await page.locator('#arena-search').fill('شطرنج');
              assert.equal(await page.locator('#classic-game-grid article:not([hidden])').count(),1);
              await page.locator('#arena-search').fill('فال');
              assert.ok((await page.locator('#oracle-grid article:not([hidden])').count())>=1);
              for(const lang of ['ar','de','fr','es','en']){
                await page.locator('#language').selectOption(lang);
                assert.equal(await page.locator('html').getAttribute('lang'),lang);
              }
              assert.deepEqual(errors,[]);
              assert.ok((await page.locator('#wager-heading').innerText()).length>15);
              console.log('ARENA_MOBILE_62_ACTIVITIES_SPAIN_UEFA_MULTISPORT_HORSE_OFFICIAL_CALENDARS_NO_MONEY_PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Confirm only isolated free-play deployment is permitted
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PassengerEnabled off' scripts/deploy_mpw_arena_static.py
          grep -Fq 'Arena target contains unowned additions' scripts/deploy_mpw_arena_static.py
          test -f site_releases/mojplaywin/arena/index.html
  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned GitHub Actions to VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VPS_KEY:-}" && -n "${HOST_KEY:-}" ]] || { echo 'SSH credentials missing'; exit 1; }
          VPS_KEY="${VPS_KEY//\\n/$'\n'}"
          HOST_KEY="${HOST_KEY//\\n/$'\n'}"
          WORK="$RUNNER_TEMP/mpw-arena-ssh"
          install -d -m 700 "$WORK"
          printf '%s\n' "$VPS_KEY" > "$WORK/vps.key"
          printf '%s\n' "$HOST_KEY" > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P "" -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null > "$WORK/vps.known"
          test -s "$WORK/vps.known"
          VPS_FP="$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$VPS_FP" == "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" ]] || { echo 'VPS host pin mismatch'; exit 1; }
          cat > "$WORK/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          HOST_SCAN="$(timeout 30s ssh -F "$WORK/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          [[ -n "$HOST_SCAN" ]] || { echo 'cPanel host key unavailable'; exit 1; }
          printf '%s\n' "$HOST_SCAN" > "$WORK/host.known"
          HOST_FP="$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$HOST_FP" == "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" ]] || { echo 'cPanel host pin mismatch'; exit 1; }
          cat >> "$WORK/config" <<EOF
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
      - name: Confirm protected routes and only vacant or owner-marked Arena path
        shell: bash
        run: |
          set -euo pipefail
          for path in / /games/ /store/ /game-releases/20261020/index.html; do
            [[ "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")" == "200" ]]
          done
          arena_status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' 'https://mojplaywin.com/arena/')"
          [[ "$arena_status" == '404' || "$arena_status" == '200' ]] || { echo 'Unexpected Arena route response'; exit 1; }
          ssh -F "$RUNNER_TEMP/mpw-arena-ssh/config" saeit-host 'test -d /home/zomorod2/mojplaywin.com && test ! -L /home/zomorod2/mojplaywin.com && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/mojplaywin.com/.htaccess && test -f /home/zomorod2/mojplaywin.com/game-releases/20261020/index.html && test ! -L /home/zomorod2/mojplaywin.com/arena && ( test ! -e /home/zomorod2/mojplaywin.com/arena || ( test -d /home/zomorod2/mojplaywin.com/arena && test -f /home/zomorod2/mojplaywin.com/arena/.mojplaywin-arena-owner.json ) )'
      - name: Package only the Arena static page and isolated installer
        shell: bash
        run: |
          tar -cf "$RUNNER_TEMP/mpw-arena.tar" scripts/deploy_mpw_arena_static.py site_releases/mojplaywin/arena
      - name: Transfer to temporary cPanel staging using verified relay
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mpw-arena-ssh"
          ssh -F "$WORK/config" saeit-host "install -d -m 700 /home/zomorod2/.mpw-arena-$GITHUB_RUN_ID"
          scp -F "$WORK/config" "$RUNNER_TEMP/mpw-arena.tar" "saeit-host:/home/zomorod2/.mpw-arena-$GITHUB_RUN_ID/package.tar"
          ssh -F "$WORK/config" saeit-host "tar -xf /home/zomorod2/.mpw-arena-$GITHUB_RUN_ID/package.tar -C /home/zomorod2/.mpw-arena-$GITHUB_RUN_ID"
      - name: Install or upgrade only the owned Arena static namespace
        id: install
        shell: bash
        run: |
          ssh -F "$RUNNER_TEMP/mpw-arena-ssh/config" saeit-host "python3 /home/zomorod2/.mpw-arena-$GITHUB_RUN_ID/scripts/deploy_mpw_arena_static.py deploy $GITHUB_RUN_ID $GITHUB_SHA"
      - name: Verify published Arena checksum and protected sibling routes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..6}; do
            if curl -fsSL --max-time 20 'https://mojplaywin.com/arena/index.html' -o "$RUNNER_TEMP/arena-live.html"; then break; fi
            sleep 2
          done
          python3 - "$RUNNER_TEMP/arena-live.html" <<'PY'
          from pathlib import Path
          import hashlib,sys
          released=Path(sys.argv[1]).read_bytes()
          source=Path('site_releases/mojplaywin/arena/index.html').read_bytes()
          if hashlib.sha256(released).digest()!=hashlib.sha256(source).digest():
              raise SystemExit('Published Arena checksum mismatch')
          print('ARENA_62_ACTIVITIES_REAL_FIXTURES_LIVE_SHA256_MATCH')
          PY
          for path in / /games/ /store/ /game-releases/20261020/index.html; do
            [[ "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")" == "200" ]]
          done
          echo 'ARENA_LIVE_AND_SIBLINGS_UNCHANGED'
      - name: Restore previous owned Arena on failed public smoke
        if: failure() && steps.install.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          ssh -F "$RUNNER_TEMP/mpw-arena-ssh/config" saeit-host "python3 /home/zomorod2/.mpw-arena-$GITHUB_RUN_ID/scripts/deploy_mpw_arena_static.py rollback $GITHUB_RUN_ID $GITHUB_SHA"
      - name: Remove owned temporary deployment files
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mpw-arena-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/mpw-arena-ssh/config" -o ConnectTimeout=10 saeit-host "rm -rf /home/zomorod2/.mpw-arena-$GITHUB_RUN_ID" || true
          fi
          rm -rf -- "$RUNNER_TEMP/mpw-arena-ssh" "$RUNNER_TEMP/mpw-arena.tar"
