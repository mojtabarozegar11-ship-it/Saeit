name: MojPlayWin book research article publishing scope check readonly
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-books-knowledge-scope-readonly-20261018.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Identify existing product knowledge records before editing
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 120s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,sys,json
          h='/home/zomorod2/Saeit-staging';sys.path.insert(0,h);os.chdir(h);os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,KnowledgeArticle
          for pk in (72,225):
           p=Product.objects.get(pk=pk)
           print('MPW_BOOK_ARTICLE='+json.dumps({'id':pk,'knowledge_article_id':p.knowledge_article_id,'description_length':len((p.metadata or {}).get('long_description') or ''),'short_description':str((p.metadata or {}).get('short_description',''))[:180]}))
          for a in KnowledgeArticle.objects.order_by('pk')[:30]:
           print('MPW_KNOWLEDGE_EXISTING='+json.dumps({'id':a.pk,'title':a.title[:125],'published':a.published,'version':a.version,'length':len(a.content or ''),'book_ids':list(Product.objects.filter(knowledge_article_id=a.pk).values_list('pk',flat=True)[:12])}))

          PY
          BASH
