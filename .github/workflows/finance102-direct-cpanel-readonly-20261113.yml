name: Finance 102 cPanel direct pinned fallback READ ONLY
on:
  pull_request:
    paths:
      - .github/workflows/finance102-direct-cpanel-readonly-20261113.yml
permissions:
  contents: read
jobs:
  direct-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify 30GB Pars-host direct pinned SSH route without writes
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/finance102-direct"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          [[ -n "$HOST_KEY" ]] || { echo "CPANEL_DIRECT=KEY_UNAVAILABLE"; exit 3; }
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/known"
          observed="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$observed" == "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" ]] || {
            echo "CPANEL_DIRECT=FINGERPRINT_PIN_FAILED"; exit 3
          }
          echo "CPANEL_DIRECT=PINNED_KEY_VERIFIED"
          if ! timeout 35s ssh -T -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=12 -o ConnectionAttempts=1 -o ServerAliveCountMax=1 \
            -o ForwardAgent=no -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$d/known" -i "$d/key" -p 1396 \
            zomorod2@178.239.147.125 'python3 -B -' <<'PY'
          import os, pwd, ast
          from pathlib import Path
          assert pwd.getpwuid(os.geteuid()).pw_name == 'zomorod2'
          print("CPANEL_DIRECT=AUTHENTICATED_READ_ONLY")
          for label, root in (("ZM",Path("/home/zomorod2/Saeit")),("MPW",Path("/home/zomorod2/Saeit-staging"))):
              for kind, file in (("VIEW",root/"core/financial_brand_pages.py"),
                                 ("TEMPLATE",root/"core/templates/core/financial_brand_page.html")):
                  try:
                      assert not file.is_symlink() and file.is_file() and file.stat().st_size < 100000
                      content=file.read_text("utf-8")
                      if kind=="VIEW":
                          ast.parse(content)
                          valid=("financial_brand_page" in content and "BRANDS" in content)
                      else:
                          valid=("{{ page_title }}" in content and "MojPlayWin / Zomorod Melal" in content)
                      print("CPANEL_FINANCE102_"+label+"_"+kind+"="+("EXPECTED_SHAPE" if valid else "DRIFT"))
                  except (OSError, UnicodeError, AssertionError, SyntaxError):
                      print("CPANEL_FINANCE102_"+label+"_"+kind+"=UNVERIFIED")
          print("CPANEL_DIRECT_WRITES=0")
          PY
          then
            echo "CPANEL_DIRECT=UNAVAILABLE_OR_UNAUTHENTICATED"
            exit 3
          fi
