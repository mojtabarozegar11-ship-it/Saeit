name: Move SAMAN book into private product storage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-move-book-private.yml"

permissions:
  contents: read

jobs:
  move-private-book:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_KEY" && -n "$HOST_KEY" ]] || { echo "Missing SSH key secret"; exit 1; }
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          install -d -m 700 "$WORK"
          python3 - <<'PY'
          import os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "mojplaywin-ssh"
          for name, filename in (("VPS_KEY", "vps.key"), ("HOST_KEY", "host.key")):
              value = os.environ[name].replace("\\n", "\n")
              path = work / filename
              path.write_text(value.rstrip("\n") + "\n", encoding="utf-8")
              path.chmod(0o600)
          PY
          ssh-keygen -y -P "" -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          VPS_FP="$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$VPS_FP" == "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" ]] || { echo "VPS host key pin mismatch"; exit 1; }
          cat > "$WORK/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          HOST_FP="$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)"
          [[ "$HOST_FP" == "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" ]] || { echo "cPanel host key pin mismatch"; exit 1; }
          cat >> "$WORK/config" <<EOF
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo "Pinned cPanel relay is ready."

      - name: Move and verify the PDF in private product storage
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-ssh"
          timeout 90s ssh -F "$WORK/config" saeit-host 'bash -s' <<'REMOTE'
          set -euo pipefail
          SRC="/home/zomorod2/MojPlayWin_Private_Assets/chess-improvement-2026/MojPlayWin_Science_and_Practice_of_Chess_Improvement.pdf"
          DEST_DIR="/home/zomorod2/MojPlayWin_Private_Assets/store/chess-improvement"
          DEST="$DEST_DIR/Science-and-Practice-of-Chess-Improvement.pdf"
          [[ -f "$SRC" && ! -L "$SRC" ]] || { echo "Expected source PDF is missing or symlinked"; exit 1; }
          [[ "$(stat -c %s "$SRC")" == "432386" ]] || { echo "Source size does not match the approved book asset"; exit 1; }
          if [[ -e "$DEST" ]]; then
            [[ -f "$DEST" && ! -L "$DEST" ]] || { echo "Destination is not a regular file"; exit 1; }
            [[ "$(sha256sum "$SRC" | awk '{print $1}')" == "$(sha256sum "$DEST" | awk '{print $1}')" ]] || { echo "Destination already has different content"; exit 1; }
            rm -- "$SRC"
          else
            install -d -m 700 "$DEST_DIR"
            chmod 700 "$DEST_DIR"
            source_sha="$(sha256sum "$SRC" | awk '{print $1}')"
            mv -- "$SRC" "$DEST"
            chmod 600 "$DEST"
            dest_sha="$(sha256sum "$DEST" | awk '{print $1}')"
            if [[ "$source_sha" != "$dest_sha" ]]; then
              mv -- "$DEST" "$SRC"
              echo "Hash check failed; restored the original file"
              exit 1
            fi
          fi
          echo "PRIVATE_BOOK_PATH=$DEST"
          echo "PRIVATE_BOOK_SIZE=$(stat -c %s "$DEST")"
          stat -c 'PRIVATE_BOOK_MODE=%a' "$DEST"
          REMOTE

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-ssh"
