name: C28 Moj Prop real static file isolated restore (NO LIVE RELEASE)
on:
  pull_request:
    paths:
      - "scripts/mojprop_starter30_file_restore_c28.py"
      - "tests/test_mojprop_starter30_file_restore_c28.py"
      - ".github/workflows/mojprop-starter30-isolated-file-restore-c28.yml"
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: mojprop-c28-private-static-restore
  cancel-in-progress: false
jobs:
  source-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline threat-model checks (no cPanel or DB)
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_mojprop_starter30_file_restore_c28 -v
          python3 -B -m py_compile scripts/mojprop_starter30_file_restore_c28.py

  isolated-private-copy:
    # OWNER AUTHORIZATION: only an exact owner-authored issue #1600 command.
    # No push, merge, scheduled job or PR can write on the cPanel host.
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.issue.number == 1600 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'MOJPROP-C28-PRIVATE-RESTORE-20261115'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify pinned source and twelve fail-closed tests
        run: |
          set -euo pipefail
          test "$(git hash-object -- scripts/mojprop_starter30_file_restore_c28.py)" = "0b1a4909647cb59cf7366ae9674b973200a48820"
          python3 -B -m unittest tests.test_mojprop_starter30_file_restore_c28 -q
      - name: Back up two public Moj Prop files and verify isolated private restoration
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          run_id="${{ github.run_id }}"
          [[ "$run_id" =~ ^[1-9][0-9]{0,18}$ ]]
          d="$RUNNER_TEMP/mojprop-c28-secret"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; x=sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n";sys.stdout.write(x)' > "$d/host.key"
          chmod 600 "$d/host.key"
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$d/config" <<EOF
          Host owner-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # Never use a GitHub-hosted SSH hop or expose live content in job log.
          # Two public-file private copies+isolated copies. No DB/web writes.
          timeout 115s ssh -T -F "$d/config" owner-cpanel \
            'for p in /home/zomorod2/virtualenv/Saeit/3.11/bin/python /opt/alt/python311/bin/python3.11 python3.11 python3; do if command -v "$p" >/dev/null 2>&1 && "$p" -c "import sys;sys.exit(0 if sys.version_info >= (3,9) else 1)" >/dev/null 2>&1; then exec "$p" -B - '"$run_id"'; fi; done; exit 72' \
            < scripts/mojprop_starter30_file_restore_c28.py \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema"]=="mojprop.static.restore.evidence.v1" and d["private_file_backup_count"]==2 and d["verified_isolated_restore"] is True and d["live_files_modified"] is False and d["database_backup_or_restore"] is False and d["subsite_isolation_proven"] is False and d["release_permitted"] is False and d["payment_permitted"] is False;print(json.dumps(d,sort_keys=True))'
          echo "C28_PUBLIC_FILES_ISOLATED_RESTORE_VERIFIED=true"
          echo "C28_SITE_RELEASE_AUTHORIZED=false"
          echo "C28_TRX_COLLECTION_AUTHORIZED=false"
