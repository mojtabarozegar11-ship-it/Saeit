name: MojPlayWin branded product secure checkout and English login exact template fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-product-buyer-template-fix-20261020.yml", "scripts/mpw_product_buyer_template_fix_20261020.py"]
permissions: {contents: read}
concurrency:
  group: mpw-buyer-only-template-fix
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate safe static templates and rollback implementation
        run: |
          python3 -m py_compile scripts/mpw_product_buyer_template_fix_20261020.py
          python3 scripts/mpw_product_buyer_template_fix_20261020.py selftest
      - name: Record original branded product and subsite HTTP status
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          paths=['/','/store/','/store/product/72/','/store/product/225/','/accounts/login/','/accounts/register/','/farnaz/','/saman/','/taniya/','/picm/']
          result={}
          for p in paths:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+p,timeout=17) as r:result[p]=r.status
              except urllib.error.HTTPError as err:result[p]=err.code
          assert all(v==200 for v in result.values()),result
          open(os.environ['RUNNER_TEMP']+'/mpw-branded-template-baseline.json','w').write(json.dumps(result))
          print('MPW_PRODUCT_AND_SIBLING_BASELINE='+json.dumps(result))
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Atomically update three isolated MojPlayWin-specific presentation templates only
        id: install
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - publish '$GITHUB_RUN_ID'" < scripts/mpw_product_buyer_template_fix_20261020.py
      - name: Reload only pinned MojPlayWin main Passenger app to invalidate cached templates
        id: reload
        run: |
          timeout 45s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/zomorod2/mojplaywin.com')
          wsgi=root/'passenger_wsgi.py'
          app=Path('/home/zomorod2/Saeit-staging')
          p=app/'core/templates/brands/mojplaywin/product.html'
          if root.is_symlink() or wsgi.is_symlink() or not wsgi.is_file() or not p.is_file() or p.is_symlink():raise RuntimeError('Main app identity invalid')
          if "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):raise RuntimeError('App root changed')
          if 'Secure checkout for this book' not in p.read_text('utf8','replace'):raise RuntimeError('Patch not installed')
          dest=root/'tmp'
          if dest.is_symlink():raise RuntimeError('Unsafe app tmp directory')
          dest.mkdir(exist_ok=True)
          marker=dest/'restart.txt'
          if marker.is_symlink():raise RuntimeError('Unsafe app restart marker')
          marker.touch()
          print('MPW_MAIN_PASSENGER_CACHED_TEMPLATES_RELOAD=REQUESTED')
          PY
      - name: Verify public purchase CTAs, product metadata and translated login
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json,time,re
          origin='https://mojplaywin.com'
          for product_id,product_title in ((72,'The Science and Practice of Chess Improvement'),(225,'Taniya and the Little Baker Worms')):
              path=f'/store/product/{product_id}/'
              req=urllib.request.Request(origin+path+'?verify_buyer='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  content=r.read(350000).decode('utf8','replace')
                  assert r.status==200
              if f'href="/store/product/{product_id}/checkout/"' not in content:raise RuntimeError('No real checkout CTA for '+str(product_id))
              if 'New customer? Create an account' not in content:raise RuntimeError('No sign-up path on branded product')
              if ('property="og:title" content="'+product_title+' | MojPlayWin"') not in content:raise RuntimeError('Generic product OG title not fixed')
              if 'Live payment methods appear only after provider' in content:raise RuntimeError('Old incorrect payment message remains')
              print('MPW_PRODUCT_BUYER_REAL_CTA_PUBLIC='+str(product_id))
          with urllib.request.urlopen(origin+'/accounts/login/?buyer_template='+str(time.time_ns()),timeout=20) as r:
              page=r.read(200000).decode('utf8','replace')
              assert r.status==200 and '<label for=' in page and '>Username</label>' in page and '>Password</label>' in page and 'csrfmiddlewaretoken' in page
          baseline=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-branded-template-baseline.json'))
          for path,status in baseline.items():
              try:
                  with urllib.request.urlopen(origin+path,timeout=18) as r:actual=r.status
              except urllib.error.HTTPError as e:actual=e.code
              if actual!=status:raise RuntimeError('Sibling route status changed: '+path)
          print('MPW_BRANDED_CHECKOUT_SEO_LOGIN_AND_SIBLINGS=PASS')
          PY
      - name: Restore only three MojPlayWin presentation templates if public smoke fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_product_buyer_template_fix_20261020.py
          timeout 30s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/zomorod2/mojplaywin.com/tmp/restart.txt')
          if not p.parent.is_symlink() and not p.is_symlink() and p.parent.is_dir():p.touch()
          print('MPW_MAIN_ONLY_REVERTED_TEMPLATE_CACHE_RELOAD=REQUESTED')
          PY
      - name: Erase ephemeral SSH relay credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
