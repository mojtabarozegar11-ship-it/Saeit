name: AE 2026 001 source locked regional cohort decomposition
on:
  push:
    branches:
      - research/mr-2026-001-novelty-audit
    paths:
      - analysis/ae_2026_001_regional_cohort_mean_decomposition.py
      - research/manuscripts/AE-2026-001/AE-2026-001_OFFICIAL_WDI_OBSERVED_COUNTRY_PANEL_2026-10-25.csv
      - .github/workflows/ae-2026-001-regional-cohort-decomposition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_locked_decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute exact 153-to-169 regional decomposition
        run: |
          python analysis/ae_2026_001_regional_cohort_mean_decomposition.py \
            --input research/manuscripts/AE-2026-001/AE-2026-001_OFFICIAL_WDI_OBSERVED_COUNTRY_PANEL_2026-10-25.csv \
            --output research_outputs/AE-2026-001/regional_cohort_decomposition.json
      - uses: actions/upload-artifact@v4
        with:
          name: ae-2026-001-regional-cohort-decomposition
          path: research_outputs/AE-2026-001/regional_cohort_decomposition.json
          if-no-files-found: error
          retention-days: 30
