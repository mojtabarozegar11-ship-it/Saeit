name: Transfer Astra Factory Expansion and Repair Plan
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/transfer-astra-factory-plan.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Transfer Astra handoff documents and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          mkdir -p "$RUNNER_TEMP/astra-plan"
          umask 077
          for file in README_FA.md manifest.json SHA256SUMS.json changes.patch; do
            case "$file" in *..*|/*) exit 2;; esac
            mkdir -p "$RUNNER_TEMP/astra-plan/$(dirname "$file")"
            ssh -F "$d/config" saeit-host "test -f /home/zomorod2/Saeit-staging/var/factory/Saeit-Astra-Luna/$file && base64 /home/zomorod2/Saeit-staging/var/factory/Saeit-Astra-Luna/$file" | base64 -d > "$RUNNER_TEMP/astra-plan/$file"
            test -s "$RUNNER_TEMP/astra-plan/$file"
          done
          tar -C "$RUNNER_TEMP/astra-plan" -czf "$RUNNER_TEMP/astra-plan.tar.gz" README_FA.md manifest.json SHA256SUMS.json changes.patch
          echo ASTRA_PLAN_SOURCE_SHA256
          sha256sum "$RUNNER_TEMP/astra-plan.tar.gz"
          ssh -F "$d/config" saeit-vps 'mkdir -p "$HOME/factory-transfer-incoming" && chmod 700 "$HOME/factory-transfer-incoming"'
          cat "$RUNNER_TEMP/astra-plan.tar.gz" | ssh -F "$d/config" saeit-vps 'cat > "$HOME/factory-transfer-incoming/astra-factory-expansion-repair-plan.tar.gz" && chmod 600 "$HOME/factory-transfer-incoming/astra-factory-expansion-repair-plan.tar.gz"'
          ssh -F "$d/config" saeit-vps 'echo ASTRA_PLAN_VPS_SHA256; sha256sum "$HOME/factory-transfer-incoming/astra-factory-expansion-repair-plan.tar.gz"; echo ASTRA_PLAN_DOCUMENT_COUNT; tar -tzf "$HOME/factory-transfer-incoming/astra-factory-expansion-repair-plan.tar.gz" | wc -l'
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay" "$RUNNER_TEMP/astra-plan" "$RUNNER_TEMP/astra-plan.tar.gz"
