name: Reschedule MojPlayWin private Gen64 evolution to each minute (no web deployment)
# Activation is scoped to an existing private cPanel tenant only; never the website.
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/mpw-main-only-private-evolution-bootstrap.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-evolution-private-activation-only
  cancel-in-progress: false
jobs:
  activate-private:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Exact isolated feature source; do not deploy default-branch Django code.
          ref: 6949cbd7caa396c053cb88ff418b34af489fd96c
      - name: Verify private evolution source and one-minute cron surgical change
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_evolution_one_minute_cron.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_v91_evolution.py -v
          python3 -m py_compile scripts/mpw_evolution_reschedule_one_minute_cpanel.py
          test -f mpw_v91_port/evolution.py
          echo MPW_MINUTELY_CRON_SURGERY_TESTS_OK=true
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Update only existing PRIVATE evolution Cron to every minute
        id: reschedule
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          controller="$(base64 -w0 scripts/mpw_evolution_reschedule_one_minute_cpanel.py)"
          result="$(timeout 70s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$controller\"))'")"
          printf '%s\n' "$result"
          before_epoch="$(printf '%s\n' "$result" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["status"]=="MPW_PRIVATE_EVOLUTION_EVERY_MINUTE_ACTIVE" and x["schedule"]=="* * * * *" and x["prior_cron_entries_preserved_exactly"] is True and x["no_public_site_or_payment_change"] is True and x["shared_passenger_restarted"] is False;print(int(x["evolution_epoch_before_next_cron"]))')"
          printf '%s\n' "before_epoch=$before_epoch" >> "$GITHUB_OUTPUT"
      - name: Verify that real one-minute cPanel Cron runs next cycle
        env:
          BEFORE_EPOCH: ${{ steps.reschedule.outputs.before_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 72
          before_epoch="$BEFORE_EPOCH"
          timeout 45s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel "python3 - '$before_epoch'" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          report=root/"last_report.json"
          assert root.is_dir() and not root.is_symlink() and not root.stat().st_mode&0o077
          assert report.is_file() and not report.is_symlink()
          row=json.loads(report.read_text())
          assert row["tenant"]=="mojplaywin-main" and row["status"]=="active_private_learning"
          assert row["master_generation"]==64
          assert row["auto_published"] is False and row["self_modified_code"] is False
          assert row["executed_financial_actions"]==0 and row["shared_runtime_modified"] is False
          old=int(sys.argv[1]); current=int(row["epoch"])
          assert current>old,(old,current)
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10,check=True)
          marked=[x for x in cron.stdout.splitlines() if "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018" in x]
          assert len(marked)==1
          assert marked[0].startswith("* * * * * ")
          print("MPW_PRIVATE_EVOLUTION_EVERY_MINUTE_CRON_FIRED=true")
          print("GENERATION=64")
          print("EPOCH_BEFORE="+str(old))
          print("EPOCH_AFTER="+str(current))
          print("VERIFIED_OUTCOMES="+str(row["verified_outcome_count"]))
          print("ACTIVE_POLICY="+str(row["active_policy"]))
          print("NO_PUBLIC_SITE_OR_FINANCIAL_CHANGES=true")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
          rm -f -- /tmp/mpw-evolution-main-activation.tar.gz
