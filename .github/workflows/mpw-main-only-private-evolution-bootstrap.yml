name: Generate MojPlayWin Gen65 Python candidate privately (no web deployment)
# Activation is scoped to an existing private cPanel tenant only; never the website.
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/mpw-main-only-private-evolution-bootstrap.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-evolution-private-activation-only
  cancel-in-progress: false
jobs:
  activate-private:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Exact isolated feature source; do not deploy default-branch Django code.
          ref: c45cb37fd2ea221e53f1383023c0627e27e84d17
      - name: Test Gen65 code factory, existing evolution and create exact SHA source package
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_generation_factory.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_v91_evolution.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_evolution_one_minute_cron.py -v
          python3 -m py_compile mpw_v91_port/generation_factory.py mpw_v91_port/evolution.py scripts/mpw_install_gen65_private_factory_cpanel.py
          python3 - <<'PY'
          import hashlib,io,json,tarfile
          from pathlib import Path
          files=["generation_factory.py","evolution.py"]
          src={k:(Path("mpw_v91_port")/k).read_bytes() for k in files}
          assert all(2000<=len(b)<=26000 for b in src.values())
          manifest=json.dumps({
              "tenant":"mojplaywin-main","target":"isolated_generation_factory_only",
              "sha256":{k:hashlib.sha256(v).hexdigest() for k,v in src.items()}},
              sort_keys=True).encode()
          assert len(manifest)<4500
          with tarfile.open("/tmp/mpw-generation65-private.tgz","w:gz") as package:
              for name,raw in (*src.items(),("MANIFEST.json",manifest)):
                  item=tarfile.TarInfo(name)
                  item.size=len(raw);item.mode=0o600;item.mtime=0
                  package.addfile(item,io.BytesIO(raw))
          assert Path("/tmp/mpw-generation65-private.tgz").stat().st_size<160000
          print("GEN65_EXACT_SHA_SOURCE_PACKAGE_READY=true")
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Generate and verify Gen65 source only inside private cPanel quarantine
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          controller="$(base64 -w0 scripts/mpw_install_gen65_private_factory_cpanel.py)"
          timeout 115s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$controller\"))'" < /tmp/mpw-generation65-private.tgz
      - name: Server-side Gen65 source and minute-Cron persistence readback
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          manifest=json.loads((root/"generations/generation65.json").read_text())
          code=(root/"generations/generation65.py").read_bytes()
          report=json.loads((root/"last_generation_report.json").read_text())
          state=json.loads((root/"last_report.json").read_text())
          assert manifest["tenant"]=="mojplaywin-main"
          assert manifest["generation"]==65 and manifest["parent_generation"]==64
          assert manifest["code_sha256"]==hashlib.sha256(code).hexdigest()
          assert manifest["promotion_authorized"] is False
          assert manifest["executed_in_production"] is False
          assert report["generation"]>=65 and report["experimental_only"] is True
          assert state["master_generation"]==64
          assert state["auto_published"] is False and state["shared_runtime_modified"] is False
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=12)
          jobs=[l for l in cron.stdout.splitlines() if "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018" in l]
          assert len(jobs)==1 and jobs[0].startswith("* * * * * ")
          compile(code, "generated_65_verified.py","exec")
          print("GEN65_ACTUAL_PYTHON_CODE_GENERATED_AND_SHA256_VERIFIED=true")
          print("GEN65_EXPERIMENTAL_NOT_PRODUCTION=true")
          print("GEN65_NEW_GENE="+manifest["capability_gene"])
          print("CURRENT_MASTER_GENERATION="+str(state["master_generation"]))
          print("NEXT_GENERATION="+str(report["generation"]))
          print("PRIVATE_AUTONOMOUS_FACTORY_CRON_EVERY_MINUTE=true")
          print("PUBLIC_SITE_UNMODIFIED=true")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
          rm -f -- /tmp/mpw-generation65-private.tgz
