name: Activate MojPlayWin Gen65 as private operational evaluator (no website writes)
# Activation is scoped to an existing private cPanel tenant only; never the website.
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/mpw-main-only-private-evolution-bootstrap.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-evolution-private-activation-only
  cancel-in-progress: false
jobs:
  activate-private:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Exact isolated feature source; do not deploy default-branch Django code.
          ref: 848ea504e4f07b3690045dfbf6e73317b7d87f85
      - name: Test operational Gen65 and package exact SHA sources
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_gen65_operational.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_generation_factory.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_v91_evolution.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_evolution_one_minute_cron.py -v
          python3 -m py_compile mpw_v91_port/gen65_runtime.py mpw_v91_port/evolution.py scripts/mpw_enable_gen65_operational_private_cpanel.py
          python3 - <<'PY'
          import hashlib,io,json,tarfile
          from pathlib import Path
          files=["gen65_runtime.py","evolution.py"]
          sources={k:(Path("mpw_v91_port")/k).read_bytes() for k in files}
          assert all(2500<len(b)<23000 for b in sources.values())
          manifest=json.dumps({"tenant":"mojplaywin-main",
            "scope":"private_operational_gen65_only",
            "sha256":{k:hashlib.sha256(v).hexdigest() for k,v in sources.items()}},
            sort_keys=True).encode()
          with tarfile.open("/tmp/mpw-gen65-operational.tgz","w:gz") as package:
              for name,raw in (*sources.items(),("manifest.json",manifest)):
                  item=tarfile.TarInfo(name);item.size=len(raw);item.mode=0o600;item.mtime=0
                  package.addfile(item,io.BytesIO(raw))
          assert Path("/tmp/mpw-gen65-operational.tgz").stat().st_size<120000
          print("GEN65_PRIVATE_RUNTIME_TESTS_AND_PACKAGE_READY=true")
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Activate SHA-attested generated Gen65 in private cPanel minute Cron
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          controller="$(base64 -w0 scripts/mpw_enable_gen65_operational_private_cpanel.py)"
          timeout 105s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$controller\"))'" < /tmp/mpw-gen65-operational.tgz
      - name: Independently read Gen65 operational state and unchanged crontab
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          generated=(root/"generations/generation65.py").read_bytes()
          manifest=json.loads((root/"generations/generation65.json").read_text())
          active=json.loads((root/"gen65_operation_enabled.json").read_text())
          report=json.loads((root/"gen65_operational_report.json").read_text())
          old=json.loads((root/"last_report.json").read_text())
          assert manifest["code_sha256"]==hashlib.sha256(generated).hexdigest()
          assert active["controller_sha256"]==manifest["code_sha256"]
          assert active["enabled"] is True and active["tenant"]=="mojplaywin-main"
          assert report["status"]=="gen65_operational_private"
          assert report["active_private_generation"]==65
          assert report["existing_public_master_generation"]==64
          assert report["controller_sha256"]==manifest["code_sha256"]
          assert report["auto_published"] is False and report["financial_actions"]==0
          assert old["master_generation"]==64 and old["shared_runtime_modified"] is False
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=10)
          marked=[x for x in cron.stdout.splitlines() if "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018" in x]
          assert len(marked)==1 and marked[0].startswith("* * * * * ")
          print("GEN65_RUNNING_AS_REAL_PRIVATE_EVALUATOR=true")
          print("GEN65_PRIVATE_EPOCH="+str(report["cycle_epoch"]))
          print("GEN65_VERIFIED_OBSERVATIONS="+str(report["verified_observations"]))
          print("GEN65_PRODUCTION_MASTER_GENERATION=64")
          print("GEN65_PRIVATE_CRON_EVERY_MINUTE=true")
          print("NO_PUBLIC_SITE_OR_PAYMENTS_CHANGED=true")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
          rm -f -- /tmp/mpw-gen65-operational.tgz
