name: Activate MojPlayWin Gen65 English page-content drafts in private Cron
# Activation is scoped to an existing private cPanel tenant only; never the website.
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/mpw-main-only-private-evolution-bootstrap.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-evolution-private-activation-only
  cancel-in-progress: false
jobs:
  activate-private:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Exact isolated feature source; do not deploy default-branch Django code.
          ref: bdce31ab97af0f1597fdbfdc694b3c0ea2ef89e5
      - name: Test unique English main-page guide production and package pinned sources
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_page_content_factory.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_gen65_operational.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_generation_factory.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_v91_evolution.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_evolution_one_minute_cron.py -v
          python3 -m py_compile mpw_v91_port/page_content_factory.py mpw_v91_port/evolution.py scripts/mpw_activate_private_page_content_cpanel.py
          python3 - <<'PY'
          import hashlib,io,json,tarfile
          from pathlib import Path
          files=["page_content_factory.py","evolution.py"]
          sources={k:(Path("mpw_v91_port")/k).read_bytes() for k in files}
          assert all(3000<len(raw)<30000 for raw in sources.values())
          manifest=json.dumps({"tenant":"mojplaywin-main",
            "scope":"main_only_private_content_drafts",
            "sha256":{k:hashlib.sha256(v).hexdigest() for k,v in sources.items()}},
            sort_keys=True).encode()
          with tarfile.open("/tmp/mpw-main-private-content.tgz","w:gz") as package:
              for name,raw in (*sources.items(),("manifest.json",manifest)):
                  item=tarfile.TarInfo(name);item.size=len(raw);item.mode=0o600;item.mtime=0
                  package.addfile(item,io.BytesIO(raw))
          assert Path("/tmp/mpw-main-private-content.tgz").stat().st_size<150000
          print("MPW_MAIN_PAGE_CONTENT_TESTS_AND_SOURCE_PROVENANCE_OK=true")
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Start private main-page content line via existing minute Cron only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          controller="$(base64 -w0 scripts/mpw_activate_private_page_content_cpanel.py)"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$controller\"))'" < /tmp/mpw-main-private-content.tgz
      - name: Independently verify Gen65-reviewed English drafts on private cPanel
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          pipeline=root/"page_content_20261018"
          assert pipeline.is_dir() and not pipeline.is_symlink() and not pipeline.stat().st_mode&0o077
          report=json.loads((pipeline/"last_report.json").read_text())
          drafts=list((pipeline/"drafts").glob("*.json"))
          assert report["tenant"]=="mojplaywin-main"
          assert report["status"]=="active_private_page_content_pipeline"
          assert report["language"]=="en" and report["total_drafts"]>=2
          assert report["auto_publish"] is False and report["public_site_modified"] is False
          assert len(drafts)>=2
          for path in drafts:
              row=json.loads(path.read_text())
              assert row["page_path"] in ["/agents/","/knowledge/","/studio/","/research/"]
              assert row["site"]=="mojplaywin.com" and row["language"]=="en"
              assert row["word_count"]>=220 and len(row["source_urls"])==2
              assert row["gen65_private_review_recommendation"]=="candidate_ready_for_human_review"
              assert row["gen65_factual_verification_completed"] is False
              assert row["published"] is False and row["approved_for_publication"] is False
          gen65=json.loads((root/"gen65_operational_report.json").read_text())
          assert gen65["status"]=="gen65_operational_private"
          assert gen65["active_private_generation"]==65
          cron=subprocess.run(["crontab","-l"],text=True,capture_output=True,timeout=12,check=True)
          marks=[x for x in cron.stdout.splitlines() if "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018" in x]
          assert len(marks)==1 and marks[0].startswith("* * * * * ")
          print("MPW_PRIVATE_PAGE_CONTENT_GENERATION_AND_GEN65_REVIEW_ACTIVE=true")
          print("ENGLISH_PAGE_DRAFTS="+str(len(drafts)))
          print("NEW_DRAFTS="+str(report["new_drafts"]))
          print("REMAINING_VERIFIED_BRIEFS="+str(report["remaining_curated_briefs"]))
          print("PRIVATE_GEN65_ACTIVE=true")
          print("PUBLIC_PAGES_OR_PAYMENTS_CHANGED=false")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
          rm -f -- /tmp/mpw-main-private-content.tgz
