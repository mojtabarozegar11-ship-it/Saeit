name: Zomorod historic backup candidate list
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-oct14-backup-inventory.yml"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Locate historical company/about snapshots without changing data
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          echo SERVER_TIME=$(date -Is)
          for root in "$HOME/Saeit/backups" "$HOME/.backups"; do
            if test -d "$root"; then
              echo "BACKUP_ROOT=$root"
              find "$root" -maxdepth 5 -type f \( -iname "*about*" -o -iname "*company*" -o -iname "*homepage*" -o -iname "*.sqlite3" -o -iname "*.tar*" -o -iname "*.zip" -o -iname "*restore*" \) -printf "%TY-%Tm-%TdT%TH:%TM:%TS bytes=%s %P\n" | grep -E '2026-10-1[0-6]|zomorod|company|about|db-before' | head -100 || true
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          f=Path.home()/'Saeit/backups/zomorod_gallery_20261014/db-before-first-publish.sqlite3'
          if not f.is_file():print("OCT14_GALLERY_DB=absent")
          else:
            conn=sqlite3.connect('file:'+str(f)+'?mode=ro&immutable=1',uri=True)
            names=[r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")]
            print("OCT14_GALLERY_DB=readable")
            print("OCT14_DB_TABLES="+','.join(names[:90]))
            for n in names:
              if any(x in n.lower() for x in ('company','content','article','page','gallery')):
                try: print("HISTORICAL_TABLE="+n+" ROWS="+str(conn.execute('SELECT COUNT(*) FROM "'+n+'"').fetchone()[0]))
                except Exception: pass
            conn.close()
          PY
          REMOTE
      - name: Clean keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
