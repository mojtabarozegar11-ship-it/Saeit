name: MojPlayWin V3 owner-only private compressed backup - manual
on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: "Unique, unused YYYYMMDD archive version (private scoped backups only)"
        type: string
        required: true
      approval:
        description: "Type APPROVE-PRIVATE-BACKUP-NO-PUBLISH to authorize the backup"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: mpw-v3-exclusive-private-owner-backup
  cancel-in-progress: false
jobs:
  owner-only-encrypted-scoped-backup:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      inputs.approval == 'APPROVE-PRIVATE-BACKUP-NO-PUBLISH'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate owner date and archive fixture controls without private access
        shell: bash
        env:
          BACKUP_DAY: ${{ inputs.backup_date }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_DAY" =~ ^20[0-9]{6}$ ]]
          python3 -m py_compile scripts/mojplaywin_backup_gzip_runner_v3.py scripts/mojplaywin_backup_gzip_source_v3.py scripts/mojplaywin_backup_gzip_destination_preflight_v3.py scripts/mojplaywin_backup_gzip_recovery_v3.py
          python3 scripts/mojplaywin_backup_gzip_runner_v3.py --date "$BACKUP_DAY" --ssh-config /dev/null --fixture
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Execute strictly scoped, versioned GPG backup and encrypted-pair verification
        timeout-minutes: 275
        shell: bash
        env:
          BACKUP_DAY: ${{ inputs.backup_date }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/mojplaywin_backup_gzip_runner_v3.py \
            --ssh-config "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" \
            --date "$BACKUP_DAY" \
            --owner-approved
          echo 'V3_PRIVATE_BACKUP_PAIR_AUTHENTICATED=true'
          echo 'V3_REAL_ISOLATED_RESTORE_COMPLETED=false'
          echo 'V3_PUBLIC_RELEASE_AUTHORIZED=false'
      - name: Purge runner SSH material, regardless of success
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
