name: Full home quota sources and browser cache usage audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-home-full-space-and-browser-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-home-space-browser
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Identify remaining large real directory consumers and browser profile cache
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          H=Path.home()
          def du(q):
              try:
                  a=subprocess.run(["du","-sk","--",str(q)],text=True,capture_output=True,timeout=90,check=True)
                  return int(a.stdout.split()[0])*1024
              except Exception:return -1
          entries=[x for x in H.iterdir() if x.is_dir() and not x.is_symlink()]
          sizes={str(p):du(p) for p in entries}
          for p in sorted(entries,key=lambda x:sizes[str(x)],reverse=True)[:55]:
              print("ROOT_USAGE="+json.dumps({"name":p.name,"bytes":sizes[str(p)]}))
          for name in ("browser",".cagefs","mojtaba_personal","Saeit-staging/admin-smoke","Saeit-staging/releases"):
              p=H/name
              if not p.is_dir():continue
              kids=[]
              for child in p.iterdir():
                  if child.is_symlink():continue
                  sz=du(child) if child.is_dir() else child.stat().st_size
                  kids.append({"name":child.name,"bytes":sz,"directory":child.is_dir()})
              for row in sorted(kids,key=lambda x:x["bytes"],reverse=True)[:18]:
                  print("ROOT_DETAIL="+json.dumps({"root":name,**row}))
          print("ROOT_DISK_AUDIT_DONE=yes")
          PY
          REMOTE
      - name: Wipe credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
