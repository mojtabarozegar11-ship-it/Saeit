name: MOJ PROP — self-hosted factory VPS to pinned cPanel read-only inventory (NO DEPLOY)
on:
  push:
    branches:
      - audit/mojprop-v141-selfhosted-relay-live-inventory-20261117
permissions:
  contents: read
concurrency:
  group: mojprop-selfhosted-readonly-20261117
  cancel-in-progress: false
jobs:
  private-vps-local-observation:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/audit/mojprop-v141-selfhosted-relay-live-inventory-20261117'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - name: Verify authorized local factory runner identity without checkout or remote network
        shell: bash
        run: |
          set -euo pipefail
          echo "FACTORY_RUNNER_ACCOUNT_NAME=$(id -un)"
          echo "FACTORY_RUNNER_EFFECTIVE_UID=$(id -u)"
          if [[ -d "$HOME/factory-runtime" && ! -L "$HOME/factory-runtime" ]]; then
            echo "FACTORY_RUNNER_HOME_HAS_FACTORY_RUNTIME=true"
          else
            echo "FACTORY_RUNNER_HOME_HAS_FACTORY_RUNTIME=false"
          fi
          if [[ -d "/home/githubops/factory-runtime" && ! -L "/home/githubops/factory-runtime" ]]; then
            echo "FACTORY_KNOWN_GITHUBOPS_RUNTIME_EXISTS=true"
          else
            echo "FACTORY_KNOWN_GITHUBOPS_RUNTIME_EXISTS=false"
          fi
          if [[ "$(id -un)" != "githubops" ]]; then
            echo "FACTORY_LOCAL_READONLY=BLOCKED_UNEXPECTED_USER"
            exit 1
          fi
          if [[ ! -d "$HOME/factory-runtime" || -L "$HOME/factory-runtime" ]]; then
            echo "FACTORY_LOCAL_READONLY=BLOCKED_UNVERIFIED_ROOT"
            exit 1
          fi
          echo "FACTORY_SELFHOSTED_RUNNER_IDENTITY=verified"
          echo "FACTORY_LOCAL_CHECKOUT_CREATED=false"
          echo "FACTORY_SQL_MODIFIED=false"
      - name: Measure VPS off-host backup and recovery-key metadata in place (no secrets, no write)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path
          import os,stat,re,json
          h=Path.home()
          d=h/'.private-mojplaywin-offhost-backups'
          k=h/'.config'/'mojplaywin-backup-recovery'/'recovery-key.bin'
          def safe_private_file(p):
              try:
                  s=p.lstat()
                  return stat.S_ISREG(s.st_mode) and not s.st_mode & 0o177 and s.st_uid == os.geteuid()
              except OSError:
                  return False
          def owner_private_directory(p):
              try:
                  s=p.lstat()
                  return stat.S_ISDIR(s.st_mode) and not s.st_mode & 0o077 and s.st_uid == os.geteuid()
              except OSError:
                  return False
          rows={}
          partials=0
          complete=False
          count=0
          if owner_private_directory(d):
              try:
                  with os.scandir(d) as stream:
                      for ent in stream:
                          count+=1
                          if count>3000: raise RuntimeError("too many directory entries")
                          if ent.name.endswith('.partial'): partials+=1
                          m=re.fullmatch(r'(mojplaywin_[0-9]{8}T[0-9]{6}Z_[0-9a-f]{16})_(mysql|files)_gpgv2\.(gpg|manifest\.json)',ent.name)
                          if m and safe_private_file(Path(ent.path)):
                              rows.setdefault(m.group(1),set()).add((m.group(2),m.group(3)))
              except (OSError,RuntimeError):
                  rows={}
                  complete=False
              else:
                  complete=True
          expected={('mysql','gpg'),('mysql','manifest.json'),('files','gpg'),('files','manifest.json')}
          candidates=sum(1 for s in rows.values() if expected.issubset(s))
          try:
              key_is_valid=safe_private_file(k) and k.stat().st_size==32 and owner_private_directory(k.parent)
          except OSError: key_is_valid=False
          free=os.statvfs(h)
          print('VPS_LOCAL_PUBLIC_FIELDS='+json.dumps({
              'private_backup_directory_verified':owner_private_directory(d),
              'inventory_complete':complete,
              'regular_pair_with_four_files_count':candidates,
              'partial_file_names_count':partials,
              'candidate_set_ids_count':len(rows),
              'offhost_free_bytes':free.f_bavail*free.f_frsize,
              'existing_recovery_key_metadata_32_private':key_is_valid,
              'ciphertext_or_key_bytes_read':False,
              'isolated_restore_proven':False,
              'release_permitted':False,
          },sort_keys=True))
          PY
      - name: Authenticate SSH cPanel from VPS using existing pinned host key (read-only, no bypass)
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${HOST_KEY:-}" ]]; then echo "LOCAL_TO_CPANEL=BLOCKED_SECRET_UNSET"; exit 1; fi
          tmp="$RUNNER_TEMP/mojprop-cpanel-local-readonly-${GITHUB_RUN_ID}"
          install -d -m 700 "$tmp"
          trap 'rm -f "$tmp"/key "$tmp"/known; rmdir "$tmp" 2>/dev/null || true' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$tmp/key"
          chmod 600 "$tmp/key"
          ssh-keygen -y -P '' -f "$tmp/key" >/dev/null 2>&1 || { echo "LOCAL_TO_CPANEL=BLOCKED_INVALID_CLIENT_KEY"; exit 1; }
          timeout 14s ssh-keyscan -T 9 -p 1396 -t ed25519 zohal.pws-dns.net > "$tmp/known" 2>/dev/null || true
          fingerprint="$(ssh-keygen -lf "$tmp/known" -E sha256 2>/dev/null | awk '{print $2}' | sort -u || true)"
          if [[ "$fingerprint" != 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04' ]]; then
            echo "LOCAL_TO_CPANEL=BLOCKED_UNREACHABLE_OR_KEY_MISMATCH"
            exit 1
          fi
          echo "LOCAL_TO_CPANEL_HOST_KEY=verified"
          sshcmd=(ssh -T -p 1396 -i "$tmp/key" -o UserKnownHostsFile="$tmp/known" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 zomorod2@zohal.pws-dns.net)
          if ! timeout 25s "${sshcmd[@]}" 'test "$(id -un)" = zomorod2' >/dev/null 2>&1; then
            echo "LOCAL_TO_CPANEL=BLOCKED_AUTH"
            exit 1
          fi
          echo "LOCAL_TO_CPANEL_AUTH=verified"
          timeout 35s "${sshcmd[@]}" 'PYTHONDONTWRITEBYTECODE=1 python3 -B -' <<'REMOTE_PY'
          from pathlib import Path
          import os,stat,json
          home=Path('/home/zomorod2')
          src=home/'Saeit-staging'
          public=home/'mojplaywin.com'
          paths={
              'passenger_entry':public/'passenger_wsgi.py',
              'new_private_statement_source':src/'core'/'mojprop_v141_private_statement_view.py',
              'new_public_info_source':src/'core'/'mojprop_v141_info_view.py',
              'core_intake_mainline_source':src/'core'/'mojprop_views.py',
              'new_template_private_statement':src/'templates'/'mojprop'/'v141-private-demo-statement.html',
              'new_migration_0010':src/'prop_firm'/'migrations'/'0010_v141_virtual_tenant_books.py',
          }
          def regular(p):
              try:
                  x=p.lstat()
                  return stat.S_ISREG(x.st_mode) and x.st_uid==os.geteuid() and not x.st_mode & 0o002
              except OSError:
                  return False
          try:
              s=os.statvfs(home)
              free=s.f_bavail*s.f_frsize
          except OSError: free=None
          print('CPANEL_LOCAL_PATH_METADATA='+json.dumps({
              'source_tree_exists':src.is_dir() and not src.is_symlink(),
              'public_docroot_exists':public.is_dir() and not public.is_symlink(),
              'expected_candidate_regular_files':{name:regular(p) for name,p in paths.items()},
              'account_free_bytes':free,
              'effective_wsgi_source_verified':False,
              'database_config_or_customer_rows_read':False,
              'production_file_modified':False,
              'release_authorized':False,
          },sort_keys=True))
          REMOTE_PY
          echo "LOCAL_TO_CPANEL_READONLY_COMPLETED=true"
      - name: Verify source remains operational NO-GO
        if: always()
        shell: bash
        run: |
          echo "FACTORY_SERVICES_RESTARTED=false"
          echo "CPANEL_PASSENGER_RESTARTED=false"
          echo "CPANEL_FILES_MODIFIED=false"
          echo "BROKER_ORDERS_SUBMITTED=false"
          echo "TRX_PAYMENTS_COLLECTED=false"
          echo "BACKUP_CREATED=false"
          echo "PRODUCTION_SQL_MIGRATED=false"
          echo "RELEASE_APPROVED=false"
