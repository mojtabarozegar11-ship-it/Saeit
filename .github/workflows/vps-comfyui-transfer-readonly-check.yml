name: ComfyUI VPS Transferred Files Read-only Check
on:
  push:
    branches: [audit/vps-comfyui-hardware-20261014]
    paths: [.github/workflows/vps-comfyui-transfer-readonly-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only inspect transferred ComfyUI files and factory loop
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/comfy-check"; install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test -s "$d/known"
          actual="$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 55s ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          dir="$HOME/comfyui-isolated"
          test -d "$dir" && test ! -L "$dir"
          for artifact in comfy-source.tar.gz comfy-wheelhouse.tar; do
            p="$dir/$artifact"
            if test -f "$p" && test ! -L "$p"; then
              printf 'COMFY_ARCHIVE_PRESENT=%s SIZE_BYTES=%s\n' "$artifact" "$(stat -c %s "$p")"
            else
              printf 'COMFY_ARCHIVE_MISSING=%s\n' "$artifact"
              exit 1
            fi
          done
          test "$(stat -c %s "$dir/comfy-source.tar.gz")" -gt 1000000
          test "$(stat -c %s "$dir/comfy-wheelhouse.tar")" -gt 700000000
          echo COMFY_TRANSFER_SIZE_CHECK_OK
          test -f "$HOME/factory-runtime/operations/vps-only-loop.pid"
          pid="$(cat "$HOME/factory-runtime/operations/vps-only-loop.pid")"
          if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then echo FACTORY_PROCESS_ALIVE; else echo FACTORY_PROCESS_NOT_VERIFIED; exit 1; fi
          free -m | awk '/^Mem:/ {print "VPS_MEM_AVAILABLE_MB="$7}'
          df -h "$HOME" | awk 'NR==2 {print "VPS_DISK_FREE="$4}'
          echo READONLY_CHECK_COMPLETE
          REMOTE
