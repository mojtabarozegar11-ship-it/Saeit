name: MojPlayWin private agent dashboard history collector
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-agent-dashboard-private-collector.yml
      - command_center/mpw_private_telemetry.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-agent-dashboard-private-collector-only
  cancel-in-progress: false
jobs:
  isolated-private-collector:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test private collector without touching sites
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest command_center.tests.test_mpw_private_telemetry -v
          python3 -m py_compile command_center/mpw_private_telemetry.py scripts/mpw_install_private_agent_dashboard_cpanel.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Install and prove isolated cPanel telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          installer="$(base64 -w0 scripts/mpw_install_private_agent_dashboard_cpanel.py)"
          expected="$(sha256sum command_center/mpw_private_telemetry.py | cut -d' ' -f1)"
          timeout 110s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel \
            "python3 -c 'import base64;exec(base64.b64decode(\"$installer\"))' '$expected'" \
            < command_center/mpw_private_telemetry.py
      - name: Independently verify private histories and unchanged Cron jobs
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,subprocess
          evo=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          history=evo/"agent_dashboard_telemetry.json"
          assert history.is_file() and not history.is_symlink()
          record=json.loads(history.read_text("utf8"))
          assert record["tenant"]=="mojplaywin-main"
          assert len(record["points"])>=25
          assert all(len(x)<=96 for x in record["points"].values())
          stamp=datetime.fromisoformat(record["collected_at"].replace("Z","+00:00"))
          assert 0 <= (datetime.now(timezone.utc)-stamp).total_seconds() < 600
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=15).stdout
          tags=("MPW_V91_MAIN_ONLY_20261018","MPW_V11_MAIN_ONLY_SITE_HEALTH_20261018",
                "MPW_ZOMOROD_QUALITY_REVIEW_MAIN_ONLY_20261018",
                "MPW_ZOMOROD_MANAGEMENT_INTELLIGENCE_MAIN_ONLY_20261018",
                "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018",
                "MPW_77_MODULES_MAIN_ONLY_20261018",
                "MPW_MAIN_PRIVATE_EXECUTION_ROBOTS_20261018",
                "MPW_MAIN_EXTENDED_ROBOTS_20261018",
                "MPW_MAIN_AGENT_DASHBOARD_COLLECTOR_20261018")
          for tag in tags:
              assert sum(tag in line for line in cron.splitlines() if not line.startswith("#")) == 1,tag
          print("ALL_MAIN_ONLY_GEN64_GEN65_77_MODULES_11_ROBOTS_MONITORED=true")
          print("TELEMETRY_HISTORY_EVERY_15_MINUTES=true")
          print("PUBLIC_SITE_UNMODIFIED=true")
          PY
      - name: Remove ephemeral SSH identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
