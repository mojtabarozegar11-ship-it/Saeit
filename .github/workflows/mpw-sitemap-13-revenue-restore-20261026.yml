name: MojPlayWin restore 13 verified revenue SEO sitemap entries
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-sitemap-13-revenue-restore-20261026.yml"
permissions: {contents: read}
concurrency:
  group: mpw-main-sitemap-revenue-restoration
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm all 13 revenue pages live and sitemap currently omits them
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_sitemap_restore_13_revenue_urls_20261026.py
          python3 - <<'PY'
          import json,os,urllib.request,xml.etree.ElementTree as ET
          data=json.load(open('mpw_revenue_20261020/earn/catalog.json'))
          urls=['https://mojplaywin.com/mpw-editorial/revenue/index.html']+[
            'https://mojplaywin.com/mpw-editorial/revenue/'+x['slug']+'/index.html' for x in data['offers']]
          assert len(urls)==13 and len(set(urls))==13
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'MPWVerifiedRevenueSitemap/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as resp:
              body=resp.read(180000).decode('utf-8','replace')
              assert resp.status==200 and 'href="'+url+'"' in body,(url,resp.status)
          with urllib.request.urlopen('https://mojplaywin.com/sitemap.xml',timeout=25) as resp:
            xml=resp.read(400000)
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.fromstring(xml)
          before=[e.text for e in root.findall('.//s:loc',ns)]
          assert before and not any(u in before for u in urls),(len(before),sum(u in before for u in urls))
          json.dump({'before':before,'expected':urls},open(os.environ['RUNNER_TEMP']+'/mpw-revenue-seo-before.json','w'))
          print('MPW_13_LIVE_REVENUE_PAGES_200_AND_SITEMAP_GAP=VERIFIED')
          PY
      - name: Configure pinned VPS and cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-sitemap-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY_VERIFIED"
      - name: Add only previously excluded 13 revenue URLs with checksum-preserved backup
        id: patch
        run: |
          set -euo pipefail
          source="$(base64 -w0 scripts/mpw_sitemap_restore_13_revenue_urls_20261026.py)"
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-sitemap-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$source\"))' apply '$GITHUB_RUN_ID'"
      - name: Prove 13 live SEO links added, all previous links preserved and core storefront intact
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,xml.etree.ElementTree as ET
          old=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-revenue-seo-before.json'))
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          req=urllib.request.Request('https://mojplaywin.com/sitemap.xml?revenue_repair='+os.environ['GITHUB_RUN_ID'],headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as resp:raw=resp.read(400000)
          now=[e.text for e in ET.fromstring(raw).findall('.//s:loc',ns)]
          before=set(old['before']);expected=set(old['expected']);actual=set(now)
          assert len(now)==len(actual),'Duplicate URLs in sitemap'
          assert actual-before==expected,(sorted(actual-before),sorted(expected))
          assert before-actual==set(),'Original sitemap URLs disappeared'
          print('MPW_REVENUE_SITEMAP_13_VERIFIED=PASS;UNCHANGED_OLD_URLS='+str(len(before)))
          for url in ('https://mojplaywin.com/','https://mojplaywin.com/store/','https://mojplaywin.com/contact/'):
            with urllib.request.urlopen(url,timeout=20) as resp:assert resp.status==200
          PY
      - name: Roll back exactly one sitemap PHP line on failed validation
        if: failure() && steps.patch.outcome == 'success'
        run: |
          source="$(base64 -w0 scripts/mpw_sitemap_restore_13_revenue_urls_20261026.py)"
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-sitemap-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$source\"))' rollback '$GITHUB_RUN_ID'"
      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-sitemap-ssh"
