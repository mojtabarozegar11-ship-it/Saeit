name: Business OS event-ready staging and retirement of diagnostic cron

on:
  push:
    branches: [feature/evidence-led-business-os-20261022]
    paths:
      - '.github/workflows/business-os-private-stage.yml'
      - 'scripts/business_os_cpanel_private_metrics.py'
      - 'scripts/business_os_cpanel_private_run.sh'
      - 'scripts/business_os_vps_private_factory_metrics.py'
      - 'scripts/business_os_private_control.py'
      - 'scripts/business_os_private_cron_verify.py'
      - 'tests/test_business_os_private_cron_verify.py'
      - 'scripts/business_os_private_cron.sh'
      - 'scripts/business_os_vps_private_master_probe.py'
      - 'tests/test_business_os_private_control.py'
      - 'scripts/business_os_private_stage_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-os-private-staging
  cancel-in-progress: false

jobs:
  stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package fixed management sources (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          tar -czf "$RUNNER_TEMP/business-os-stage.tgz" \
            core/business_management.py \
            core/autonomous_brain.py \
            core/management/commands/business_operating_review.py \
            core/management/commands/online_income_cycle.py \
            core/tests/test_business_operating_review_command.py \
            core/tests/test_economic_brain.py \
            command_center/business_review_views.py \
            command_center/urls.py \
            command_center/tests/test_business_review_api.py \
            tests/test_business_management_review.py \
            scripts/business_os_private_stage_smoke.py \
            scripts/business_os_cpanel_private_metrics.py \
            scripts/business_os_cpanel_private_run.sh \
            scripts/business_os_vps_private_factory_metrics.py \
            scripts/business_os_private_control.py \
            scripts/business_os_private_cron_verify.py \
            scripts/business_os_private_cron.sh \
            scripts/business_os_vps_private_master_probe.py \
            tests/test_business_os_private_control.py \
            tests/test_business_os_private_cron_verify.py \
            tests/test_business_os_vps_factory_source.py \
            docs/business-operating-system-20261022.md
          sha256sum "$RUNNER_TEMP/business-os-stage.tgz"

      - name: Stage exclusively in VPS and cPanel private release directories
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          stage_name="business-os-$(git rev-parse --short=12 HEAD)"
          stage_root="$RUNNER_TEMP/business-os-ssh"
          mkdir -p "$stage_root"
          printf '%s\n' "$VPS_KEY" > "$stage_root/vps.key"
          printf '%s\n' "$HOST_KEY" > "$stage_root/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$stage_root/host.known"
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"business-os-ssh/host.key"; s=p.read_text().replace(chr(13)+chr(10),chr(10)).strip(); p.write_text(s.replace(chr(92)+"n",chr(10))+chr(10))'
          chmod 600 "$stage_root/"*
          ssh-keygen -y -P "" -f "$stage_root/vps.key" > /dev/null
          ssh-keygen -y -P "" -f "$stage_root/host.key" > /dev/null
          cat > "$stage_root/config" <<EOF
          Host business-os-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $stage_root/vps.key
            StrictHostKeyChecking yes
            UserKnownHostsFile $stage_root/vps.known
          Host business-os-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $stage_root/host.key
            UserKnownHostsFile $stage_root/host.known
            ProxyJump business-os-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$stage_root/vps.known"
          test "$(ssh-keygen -lf "$stage_root/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          timeout 30s ssh -F "$stage_root/config" business-os-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$stage_root/host.candidate"
          test "$(ssh-keygen -lf "$stage_root/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$stage_root/host.candidate" "$stage_root/host.known"

          archive="$RUNNER_TEMP/business-os-stage.tgz"
          local_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
          stage_vps="saeit-business-os-staging/releases/$stage_name"
          timeout 30s ssh -F "$stage_root/config" business-os-vps "mkdir -p '$stage_vps'"
          timeout 60s ssh -F "$stage_root/config" business-os-vps "cat > '$stage_vps/bundle.tgz'" < "$archive"
          vps_sha="$(timeout 30s ssh -F "$stage_root/config" business-os-vps "sha256sum '$stage_vps/bundle.tgz'" | cut -d ' ' -f1)"
          test "$local_sha" = "$vps_sha"
          timeout 60s ssh -F "$stage_root/config" business-os-vps "cd '$stage_vps' && tar -tzf bundle.tgz > /dev/null && ! tar -tzf bundle.tgz | grep -Eq '(^/|(^|/)\.\.(/|$))' && tar -xzf bundle.tgz && python3 -B scripts/business_os_private_stage_smoke.py"
          # Factory truth remains on the VPS. SSH/Actions sees only a fixed
          # success/failure marker, never private report contents or counts.
          if timeout 90s ssh -F "$stage_root/config" business-os-vps \
            "cd '$stage_vps' && python3 -B scripts/business_os_vps_private_factory_metrics.py" > /dev/null 2>&1; then
            echo "BUSINESS_OS_VPS_PRIVATE_FACTORY_REPORT_CREATED"
            timeout 30s ssh -F "$stage_root/config" business-os-vps \
              "cd '$stage_vps' && python3 -B scripts/business_os_private_control.py --node vps" > /dev/null 2>&1
            echo "BUSINESS_OS_VPS_PRIVATE_DECISION_CREATED"
            timeout 45s ssh -F "$stage_root/config" business-os-vps \
              "cd '$stage_vps' && export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1 DJANGO_SETTINGS_MODULE=config.settings && /home/githubops/factory-runtime/.venv/bin/python -B scripts/business_os_vps_private_master_probe.py" > /dev/null 2>&1
            echo "BUSINESS_OS_MOJ1RO1_ACTIVE_IDENTITY_CONFIRMED"
          else
            echo "BUSINESS_OS_VPS_PRIVATE_FACTORY_SOURCE_UNAVAILABLE"
            exit 1
          fi

          stage_host="/home/zomorod2/Saeit-staging/releases/$stage_name"
          timeout 40s ssh -F "$stage_root/config" business-os-cpanel 'test -d /home/zomorod2/Saeit-staging'
          timeout 40s ssh -F "$stage_root/config" business-os-cpanel "mkdir -p '$stage_host'"
          timeout 60s ssh -F "$stage_root/config" business-os-cpanel "cat > '$stage_host/bundle.tgz'" < "$archive"
          host_sha="$(timeout 30s ssh -F "$stage_root/config" business-os-cpanel "sha256sum '$stage_host/bundle.tgz'" | cut -d ' ' -f1)"
          test "$local_sha" = "$host_sha"
          timeout 60s ssh -F "$stage_root/config" business-os-cpanel "cd '$stage_host' && tar -tzf bundle.tgz > /dev/null && ! tar -tzf bundle.tgz | grep -Eq '(^/|(^|/)\.\.(/|$))' && tar -xzf bundle.tgz && python3 -B scripts/business_os_private_stage_smoke.py"
          # Interpreter discovery is local to cPanel. Only fixed diagnostic
          # markers cross SSH, never financial counts, findings, or exceptions.
          timeout 90s ssh -F "$stage_root/config" business-os-cpanel \
            "cd '$stage_host' && bash scripts/business_os_cpanel_private_run.sh"
          timeout 45s ssh -F "$stage_root/config" business-os-cpanel \
            "cd '$stage_host' && python3 -B scripts/business_os_private_control.py --node cpanel" > /dev/null 2>&1
          echo "BUSINESS_OS_CPANEL_PRIVATE_DECISION_CREATED"
          # User opted for confirmed-payment events, not polling. Remove only
          # our marked cPanel diagnostic cron, preserving unrelated schedules.
          timeout 40s ssh -F "$stage_root/config" business-os-cpanel \
            "cd '$stage_host' && bash scripts/business_os_private_cron.sh --uninstall cpanel" > /dev/null 2>&1
          if timeout 30s ssh -F "$stage_root/config" business-os-cpanel \
            "crontab -l 2>/dev/null | grep -Fq '# SAEIT_BUSINESS_OS_PRIVATE_V1'"; then
            echo "BUSINESS_OS_CPANEL_CRON_RETIREMENT_UNVERIFIED"
            exit 1
          fi
          echo "BUSINESS_OS_CPANEL_15MIN_CRON_REMOVED"
          # VPS crontab installation was previously denied (exit 74). Verify
          # read-only that no obsolete marked schedule is present; never force.
          if timeout 30s ssh -F "$stage_root/config" business-os-vps \
            "crontab -l 2>/dev/null | grep -Fq '# SAEIT_BUSINESS_OS_PRIVATE_V1'"; then
            echo "BUSINESS_OS_VPS_SCHEDULE_REQUIRES_ADMIN_REMOVAL"
            exit 1
          fi
          echo "BUSINESS_OS_VPS_MARKED_CRON_ABSENT"
          echo "BUSINESS_OS_DIAGNOSTICS_ON_DEMAND_ONLY"
          # Read-only release preflight: inspect only fixed code-presence markers.
          # No customer rows, environment variables, credentials or file bodies
          # are returned by either server.
          if timeout 25s ssh -F "$stage_root/config" business-os-cpanel \
            "test -f /home/zomorod2/Saeit/core/api.py"; then
            echo "BUSINESS_OS_LIVE_DJANGO_API_PRESENT"
          else
            echo "BUSINESS_OS_LIVE_DJANGO_API_NOT_OBSERVED"
          fi
          if timeout 25s ssh -F "$stage_root/config" business-os-cpanel \
            "grep -Fq 'schedule_paid_purchase_review' /home/zomorod2/Saeit/core/api.py"; then
            echo "BUSINESS_OS_LIVE_PAID_PURCHASE_HOOK_PRESENT"
          else
            echo "BUSINESS_OS_LIVE_PAID_PURCHASE_HOOK_ABSENT"
          fi
          if timeout 25s ssh -F "$stage_root/config" business-os-cpanel \
            "test -f /home/zomorod2/Saeit/core/business_scientist.py"; then
            echo "BUSINESS_OS_LIVE_ECONOMIST_MODULE_PRESENT"
          else
            echo "BUSINESS_OS_LIVE_ECONOMIST_MODULE_ABSENT"
          fi
          if timeout 25s ssh -F "$stage_root/config" business-os-cpanel \
            "test -f /home/zomorod2/Saeit/services/mpw_walletless_existing_intent_pilot.py"; then
            echo "BUSINESS_OS_LIVE_TRON_PILOT_FILE_PRESENT"
          else
            echo "BUSINESS_OS_LIVE_TRON_PILOT_FILE_ABSENT"
          fi
          if timeout 25s ssh -F "$stage_root/config" business-os-vps \
            "test -f /home/githubops/factory-runtime/django-app/core/purchase_event.py"; then
            echo "BUSINESS_OS_VPS_PURCHASE_RECEIVER_MODULE_PRESENT"
          else
            echo "BUSINESS_OS_VPS_PURCHASE_RECEIVER_MODULE_ABSENT"
          fi
          echo "PRIVATE_RELEASE=$stage_name"
          echo "No website app code, database schema, transaction, service, or public route modified."

      - name: Clear runner-only SSH key copies
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/business-os-ssh"; then
            find "$RUNNER_TEMP/business-os-ssh" -maxdepth 1 -type f -exec shred -u {} +
          fi
