name: MojPlayWin standalone ETH TRX payment sandbox (NO FUNDS)
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths:
      - isolated_crypto_gateway/**
      - .github/workflows/mojplaywin-crypto-php-sandbox.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-private-sandbox:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare offline private payment sandbox on runner only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-sqlite3 php8.3-curl >/dev/null
          php -l isolated_crypto_gateway/index.php
          php -l isolated_crypto_gateway/bootstrap.php
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /home/zomorod2
          php isolated_crypto_gateway/bootstrap.php init
          test -f /home/zomorod2/.mojplaywin-crypto-payments-v1/payments.sqlite3
          test ! -f /home/zomorod2/.mojplaywin-crypto-payments-v1/enabled.flag
          echo "PAYMENT_CONFIG_IS_FAIL_CLOSED=true"
      - name: Test disabled-on-arrival HTTP and fake local invoice flow
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/payment_test_https.php" <<'PHP'
          <?php $_SERVER['HTTPS']='on';
          PHP
          php -d auto_prepend_file="$RUNNER_TEMP/payment_test_https.php" -S 127.0.0.1:8585 -t isolated_crypto_gateway > "$RUNNER_TEMP/test-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 12); do
            probe="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8585/ -H 'Host: mojplaywin.com' || true)"
            if [ "$probe" != 000 ]; then break; fi
            sleep 1
          done
          echo "INITIAL_HTTP_STATUS=$probe"
          code=$(curl -sS -o "$RUNNER_TEMP/disabled" -w '%{http_code}' http://127.0.0.1:8585/ -H 'Host: mojplaywin.com')
          echo "DISABLED_GATEWAY_HTTP_STATUS=$code"
          test "$code" = 503
          touch /home/zomorod2/.mojplaywin-crypto-payments-v1/enabled.flag
          code=$(curl -sS -D "$RUNNER_TEMP/get.headers" -o "$RUNNER_TEMP/home" -w '%{http_code}' http://127.0.0.1:8585/ -H 'Host: mojplaywin.com')
          echo "ENABLED_SANDBOX_GATEWAY_HTTP_STATUS=$code"
          test "$code" = 200
          grep -q 'MojPlayWin secure payments' "$RUNNER_TEMP/home"
          python3 - "$RUNNER_TEMP" <<'PY'
          import re, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          html=(p/'home').read_text()
          headers=(p/'get.headers').read_text()
          csrf=re.search(r'name="csrf" value="([a-f0-9]{48})"',html)
          cookie=re.search(r'Set-Cookie: (MOJCRYPTO=[^;]+)',headers,re.I)
          assert csrf and cookie, "Sandbox session and CSRF token missing"
          (p/'csrf').write_text(csrf.group(1))
          (p/'cookie').write_text(cookie.group(1))
          PY
          csrf="$(cat "$RUNNER_TEMP/csrf")"; cookie="$(cat "$RUNNER_TEMP/cookie")"
          code=$(curl -sS -D "$RUNNER_TEMP/create.headers" -o "$RUNNER_TEMP/create.html" -w '%{http_code}' http://127.0.0.1:8585/ -H 'Host: mojplaywin.com' -H "Cookie: $cookie" --data-urlencode "csrf=$csrf" --data-urlencode action=create --data-urlencode asset=TRX --data-urlencode amount=10 --data-urlencode reference=Consulting)
          echo "CREATED_INVOICE_HTTP_STATUS=$code"
          test "$code" = 303
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib,re,sys,sqlite3
          p=pathlib.Path(sys.argv[1])
          headers=(p/'create.headers').read_text()
          token=re.search(r'Location: https://mojplaywin.com/checkout/crypto/index\.php\?id=([a-f0-9]{48})',headers,re.I)
          assert token, 'No unique private payment invoice issued'
          (p/'token').write_text(token.group(1))
          db=sqlite3.connect('/home/zomorod2/.mojplaywin-crypto-payments-v1/payments.sqlite3')
          row=db.execute('SELECT asset,base,quote,status FROM invoices WHERE token=?',(token.group(1),)).fetchone()
          assert row and row[0]=='TRX' and row[1]==10000000 and row[2]>row[1] and row[2]<=row[1]+9999 and row[3]=='awaiting_payment',row
          PY
          token="$(cat "$RUNNER_TEMP/token")"
          code=$(curl -sS -o "$RUNNER_TEMP/invoice" -w '%{http_code}' "http://127.0.0.1:8585/?id=$token" -H 'Host: mojplaywin.com')
          test "$code" = 200
          grep -q 'THFNU1iEXHd71WjEgjqUksd2UnMg2pUi73' "$RUNNER_TEMP/invoice"
          code=$(curl -sS -o "$RUNNER_TEMP/host-denied" -w '%{http_code}' "http://127.0.0.1:8585/?id=$token" -H 'Host: other.example')
          test "$code" = 404
          code=$(curl -sS -o "$RUNNER_TEMP/unknown" -w '%{http_code}' "http://127.0.0.1:8585/?id=incorrect" -H 'Host: mojplaywin.com')
          test "$code" = 404
          python3 - "$RUNNER_TEMP/token" <<'PY'
          import sqlite3,sys
          db=sqlite3.connect('/home/zomorod2/.mojplaywin-crypto-payments-v1/payments.sqlite3')
          token=open(sys.argv[1]).read().strip()
          assert db.execute('SELECT status,tx_hash FROM invoices WHERE token=?',(token,)).fetchone()==('awaiting_payment',None)
          print('MOJPLAYWIN_OFFLINE_PAYMENT_INVOICE_TEST=passed')
          PY
          echo "REAL_PAYMENTS_SENT=false"
          echo "LIVE_SERVER_CHANGED=false"
          echo "WALLET_PRIVATE_KEYS_READ=false"
