name: MojPlayWin 741-page chess private PDF handoff
on:
  push:
    branches: [feature/mpw-chess-741-secure-handoff-20261015]
    paths:
      - scripts/mpw_chess_master741_install.py
      - tests/test_mpw_chess_master741_install.py
      - .github/workflows/mpw-chess-741-private-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Standalone strict SHA and private storage tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_mpw_chess_master741_install -v
          python -m py_compile scripts/mpw_chess_master741_install.py
          echo MPW_741_PRIVATE_HANDOFF_LOCAL_TESTS_OK
      - name: Create pinned private relay credentials
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-741-ssh"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/$item.key"
            chmod 600 "$d/$item.key"
            ssh-keygen -y -P '' -f "$d/$item.key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Stage private installer only; install PDF only if exact source already uploaded
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-741-ssh"
          local_sha="$(sha256sum scripts/mpw_chess_master741_install.py | cut -d ' ' -f1)"
          remote_path="Saeit-staging/scripts/mpw_chess_master741_install.py"
          ssh -F "$d/config" saeit-cpanel 'test -d Saeit-staging/scripts && test -f Saeit-staging/manage.py'
          ssh -F "$d/config" saeit-cpanel "if test -f '$remote_path'; then sha256sum '$remote_path' | cut -d ' ' -f1; else echo NOT_PRESENT; fi" > "$RUNNER_TEMP/prior-book-script.sha"
          prior="$(cat "$RUNNER_TEMP/prior-book-script.sha")"
          if test "$prior" = NOT_PRESENT; then
            scp -F "$d/config" scripts/mpw_chess_master741_install.py "saeit-cpanel:$remote_path"
          else
            test "$prior" = "$local_sha"
          fi
          got="$(ssh -F "$d/config" saeit-cpanel "sha256sum '$remote_path' | cut -d ' ' -f1")"
          test "$got" = "$local_sha"
          ssh -F "$d/config" saeit-cpanel "chmod 600 '$remote_path'; python3 '$remote_path' --status"
          if ssh -F "$d/config" saeit-cpanel 'test -f MojPlayWin_Private_Uploads/MojPlayWin_Chess_Master_Editorial_Working.pdf && test ! -L MojPlayWin_Private_Uploads/MojPlayWin_Chess_Master_Editorial_Working.pdf'; then
            ssh -F "$d/config" saeit-cpanel 'cd Saeit-staging && export PYTHONPATH="$PWD" DJANGO_SETTINGS_MODULE=config.settings && for py in "$HOME/virtualenv/Saeit-staging/3.11/bin/python" "$PWD/.venv/bin/python" "$HOME/virtualenv/Saeit-staging/3.10/bin/python"; do if test -x "$py" && "$py" -c "import django" >/dev/null 2>&1; then "$py" scripts/mpw_chess_master741_install.py --install; exit $?; fi; done; exit 1'
          else
            echo MPW_741_PRIVATE_SOURCE_NOT_YET_UPLOADED
            echo MPW_741_WALLET_AND_PAID_CHECKOUT_STILL_OFF
          fi
          echo MPW_741_INSTALLER_STAGED_AND_VERIFIED
      - name: Erase ephemeral credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mpw-741-ssh" "$RUNNER_TEMP/prior-book-script.sha"
