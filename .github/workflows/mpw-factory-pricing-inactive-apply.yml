name: MojPlayWin controlled inactive factory draft price update
on:
  push:
    branches: [feature/factory-fair-90pct-pricing-20261014]
    paths:
      - .github/workflows/mpw-factory-pricing-inactive-apply.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-factory-inactive-pricing-release
  cancel-in-progress: false
jobs:
  price-inactive-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact verified draft prices with row preimage and DB transaction; never activate sales
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 120s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONPATH="$HOME/Saeit-staging"
          export PYTHONDONTWRITEBYTECODE=1
          cd "$HOME/Saeit-staging"
          folder="$HOME/.mpw-factory-fair-pricing-qa"
          test -d "$folder" && test ! -L "$folder"
          test -f "$folder/pricing/factory_2026-10-14_valuation.json"
          test -f "$folder/scripts/factory_apply_verified_pricing.py"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" "$folder/scripts/factory_apply_verified_pricing.py" --apply
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import django
          django.setup()
          from core.models import Product
          from decimal import Decimal
          expected=(("farm_enterprise_economics",Decimal("0.00")),("water_budget_economics",Decimal("0.99")))
          for recipe,price in expected:
              obj=Product.objects.filter(metadata__factory_recipe=recipe,metadata__factory_origin="saeit_vps").get()
              assert obj.price==price and not obj.active
              assert obj.metadata.get("factory_paid_checkout_ready") is False
              assert obj.metadata.get("factory_marketing_can_claim_former_price") is False
              print("MPW_FACTORY_DRAFT_PRICE_PERSISTED_"+recipe.upper()+"="+str(obj.price))
          print("MPW_FACTORY_ALL_PRICE_DRAFTS_INACTIVE=True")
          print("MPW_FACTORY_PAID_CHECKOUT_NOT_ACTIVATED=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
