name: Restore existing private factory self-edit hourly schedule
on:
  pull_request:
    paths:
      - deploy/repair_factory_self_edit_schedule.sh
      - .github/workflows/vps-factory-self-edit-schedule-repair.yml
  push:
    branches: [main]
    paths:
      - deploy/repair_factory_self_edit_schedule.sh
      - .github/workflows/vps-factory-self-edit-schedule-repair.yml
permissions:
  contents: read
concurrency:
  group: isolated-factory-self-edit-schedule-repair
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the bounded VPS repair script
        run: bash -n deploy/repair_factory_self_edit_schedule.sh
  repair:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore only missing hourly schedule using the installed isolated runner
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/private-self-edit-cron"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" githubops@178.239.147.150 'bash -se' < deploy/repair_factory_self_edit_schedule.sh
