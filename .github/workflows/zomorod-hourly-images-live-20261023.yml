name: Generate and publish three original lightweight Zomorod WebP cards safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-hourly-images-live-20261023.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  images:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Connect to cPanel with existing pinned SSH relay, GitHub acting only as bridge
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Copy confined image renderer to cPanel and create private backup and WebP staging
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          dst="/home/zomorod2/.zm-water-images-$GITHUB_RUN_ID.py"
          timeout 55s scp -q -F "$d/config" scripts/zomorod_hourly_images_additive.py "host:$dst"
          timeout 90s ssh -T -F "$d/config" host "python3 -m py_compile '$dst' && python3 '$dst' prepare '$GITHUB_RUN_ID'"
      - name: Add only three scoped image assets and image tags with rollback manifest
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          dst="/home/zomorod2/.zm-water-images-$GITHUB_RUN_ID.py"
          timeout 90s ssh -T -F "$d/config" host "python3 '$dst' apply '$GITHUB_RUN_ID'"
      - name: Verify real remote WebP bytes, full SHA and page image links
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          dst="/home/zomorod2/.zm-water-images-$GITHUB_RUN_ID.py"
          timeout 240s ssh -T -F "$d/config" host "python3 '$dst' verify '$GITHUB_RUN_ID'"
      - name: Roll back only image additions on any failure
        if: failure() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          dst="/home/zomorod2/.zm-water-images-$GITHUB_RUN_ID.py"
          if test -f "$d/config"; then timeout 95s ssh -T -F "$d/config" host "python3 '$dst' rollback '$GITHUB_RUN_ID'"; fi
      - name: Remove ephemeral relay material
        if: always()
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          dst="/home/zomorod2/.zm-water-images-$GITHUB_RUN_ID.py"
          if test -f "$d/config"; then timeout 40s ssh -T -F "$d/config" host "rm -f -- '$dst'" || true; fi
          rm -rf "$d"
