name: Private VPS zero-extra-cost leech inference capacity audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/factory-leech-vps-inference-capacity-20261025.yml
      - scripts/factory_leech_vps_capacity_probe_20261025.py
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect-own-vps-without-model-load:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[owner-leech-vps-capacity-20261025]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read only VPS memory, swap, disk and toolchain capacity
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/leech-remote-capacity"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' < scripts/factory_leech_vps_capacity_probe_20261025.py
