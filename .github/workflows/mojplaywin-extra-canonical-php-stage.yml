name: Moj Play Win stage isolated market industry economy canonical bridge
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-extra-canonical-php-stage.yml"]
permissions:
  contents: read
jobs:
  stage-verify-independent-PHP:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Upload only a NEW isolated PHP file and verify source SHA and php syntax
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          source=scripts/mojplaywin_canonical_php_three_extra.php
          destination=/home/zomorod2/mojplaywin.com/design-preview-20261017/_mpw_three_extra_canonical_20261017.php
          expected=$(sha256sum "$source"|cut -d' ' -f1)
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$destination' && test ! -L '$destination'"
          timeout 40s scp -q -F "$d/config" "$source" "saeit-cpanel:$destination"
          actual=$(timeout 40s ssh -T -F "$d/config" saeit-cpanel "chmod 644 '$destination'; php -l '$destination' >&2; sha256sum '$destination' |cut -d' ' -f1")
          test "$actual" = "$expected"
          echo "THREE_SEO_ONLY_NEW_PHP_FILE_STAGED_NO_OLD_BRIDGE_OR_PASSENGER_CHANGED"
      - name: Compare 3 direct CGI responses byte-for-byte against existing Django pages
        shell: bash
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import urllib.request,json
          from urllib.parse import urlencode
          origin="https://mojplaywin.com"
          bridge="/design-preview-20261017/_mpw_three_extra_canonical_20261017.php"
          routes={"market":"/market/","industry":"/industry/","economy":"/economy/"}
          def download(url,cookie=""):
              h={"User-Agent":"MojPlayWin-three-extra-canonical-isolation-QA",
                 "Cache-Control":"no-store,no-cache"}
              if cookie:h["Cookie"]=cookie
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=22) as r:
                  return r.status,r.headers.get("X-MPW-Canonical-Edge",""),r.read(600000)
          checked=0
          for name,path in routes.items():
              for variant,cookie in (("anonymous",""),("anonymous_with_cookie","mpw_three_qa=1")):
                  old=download(origin+path+"?__mpw_canon_passthru=1",cookie)
                  new=download(origin+bridge+"?__mpw_canon_route="+name,cookie)
                  wrong=('<link rel="canonical" href="https://zomorodmelal.ir'+path+'">').encode()
                  right=('<link rel="canonical" href="https://mojplaywin.com'+path+'">').encode()
                  if old[0]!=200 or new[0]!=200 or new[1]!="main-only":
                      raise RuntimeError("wrong CGI status "+name+" "+variant)
                  if old[2].count(wrong)!=1 or new[2].count(right)!=1 or old[2].replace(wrong,right)!=new[2]:
                      raise RuntimeError("HTML changed other than canonical "+name+" "+variant)
                  checked+=1
          print(json.dumps({"classification":"MOJ_PLAY_WIN_THREE_EXTRA_CGI_SOURCE_QUALIFIED",
                            "all_six_cases_exact":checked,"original_urls_untouched":True,
                            "existing_six_routes_still_served_by_old_bridge":True,
                            "passenger_restarted":False},sort_keys=True))
          PY
      - name: Verify current six fixes and main and protected routes retain 200 after new file staging
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for p in / /store/ /research/ /company/ /knowledge/ /ventures/agriculture/ /ventures/jewelry-gold/ /market/ /economy/ /industry/ /saman/ /picm/login/ /farnaz/ /mojtaba.roozegar/;do
            test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 16 "https://mojplaywin.com$p")" = 200 || exit 91
          done
          echo "ORIGINAL_SIX_FIXED_AND_SIX_OTHER_ROUTES_HEALTHY_STAGING_ONLY"
