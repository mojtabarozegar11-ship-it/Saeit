              raise SystemExit("PRIVATE_BRIDGE_SOURCE_REJECTED")
          bridge_text = bridge_path.read_text(encoding="utf-8")
          bridge_tree = ast.parse(bridge_text)
          bridge_functions = []
          bridge_selected = {}
          for node in ast.walk(bridge_tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              bridge_functions.append(node.name)
              if any(token in node.name.lower() for token in
                     ("task", "schema", "canonical", "event", "state",
                      "receipt", "verify", "hmac", "migrate", "init_db",
                      "auth", "open_control_db")):
                  segment = ast.get_source_segment(bridge_text, node)
                  if isinstance(segment, str) and len(segment) <= 50000:
                      bridge_selected[node.name] = segment
          bridge_protocol_assignments = []
          permitted_bridge_constants = {
              "TASK_FIELDS", "WORKSTREAMS", "PRIORITIES", "RISKS",
          }
          for node in bridge_tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  if any(isinstance(target, ast.Name)
                         and target.id in permitted_bridge_constants for target in targets):
                      segment = ast.get_source_segment(bridge_text, node)
                      if isinstance(segment, str) and len(segment) <= 3000:
                          bridge_protocol_assignments.append(segment)
          tables = []
          with sqlite3.connect("file:" + str(database) + "?mode=ro&immutable=1", uri=True, timeout=5) as db:
              for (name,) in db.execute(
                      "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").fetchmany(150):
                  if not isinstance(name, str) or len(name) > 128:
                      continue
                  quoted = name.replace('"', '""')
                  fields = [
                      {"name": row[1], "type": row[2], "notnull": row[3], "pk": row[5]}
                      for row in db.execute(
                          'PRAGMA table_info("' + quoted + '")').fetchmany(150)
                  ]
                  tables.append({"table": name, "fields": fields})
          report = {
              "schema": "ZMR-OWNER-SEALED-QUEUE-CONTRACT-V1",
              "ingress_source_sha256": hashlib.sha256(source.encode("utf-8")).hexdigest(),
              "functions": defs,
              "selected_function_source": selected_functions,
              "protocol_assignments": protocol_assignments,
              "bridge_contract": {
                  "source_sha256": hashlib.sha256(bridge_text.encode("utf-8")).hexdigest(),
                  "functions": bridge_functions[:150],
                  "selected_function_source": bridge_selected,
                  "protocol_assignments": bridge_protocol_assignments,
              },
              "sql_literals": sql_literals,
              "tables": tables,
          }
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          ZMR_PRIVATE_SCHEMA
          python3 - "$d/private-queue-schema.json" "$d/ephemeral-owner-public.pem" <<'ZMR_ENCRYPT_SCHEMA'
          import base64
          from pathlib import Path
          import subprocess
          import sys
          import zlib
          
          report = Path(sys.argv[1])
          recipient = Path(sys.argv[2])
          if (report.is_symlink() or not report.is_file()
                  or report.stat().st_size > 150000
                  or recipient.is_symlink() or not recipient.is_file()):
              raise SystemExit("ZMR_SCHEMA_REPORT_UNSAFE")
          compressed = zlib.compress(report.read_bytes(), 9)
          if len(compressed) > 18000:
              raise SystemExit("ZMR_SCHEMA_COMPRESSED_TOO_LARGE")
          pieces = [compressed[n:n + 300] for n in range(0, len(compressed), 300)]
          if not pieces or len(pieces) > 60:
              raise SystemExit("ZMR_SCHEMA_PART_COUNT_REJECTED")
          for index, payload in enumerate(pieces, start=1):
              command = [
                  "openssl", "pkeyutl", "-encrypt", "-pubin",
                  "-inkey", str(recipient), "-pkeyopt", "rsa_padding_mode:oaep",
                  "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256",
              ]
              outcome = subprocess.run(
                  command, input=payload, capture_output=True, timeout=15, check=False)
              if outcome.returncode != 0 or len(outcome.stdout) != 512:
                  raise SystemExit("ZMR_SCHEMA_ENCRYPTION_FAILED")
              print("ZMR_SEALED_SCHEMA_PART_%03d=%s" % (
                  index, base64.b64encode(outcome.stdout).decode("ascii")))
          print("ZMR_SEALED_SCHEMA_PARTS=" + str(len(pieces)))
          print("ZMR_SEALED_SCHEMA=ENCRYPTED_ONLY")
          ZMR_ENCRYPT_SCHEMA
      - name: Record private owner cutover decision and verify durable write
        if: steps.gate.outputs.operation == 'cutover_record'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          ssh -T -F "$RUNNER_TEMP/zomorod-command-channel/config" "$COMMAND_HOST" 'python3 -B -' <<'CUTOVER_WRITE_PY'
          import hashlib
          import json
          import os
          import pwd
          import stat
          from pathlib import Path
          if pwd.getpwuid(os.geteuid()).pw_name != "zomorod2":
              raise SystemExit("CUTOVER_WRONG_ACCOUNT")
          root = Path("/home/zomorod2/.private/zomorod-business")
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("CUTOVER_PRIVATE_ROOT_INVALID")
          target = root / "chat-relay-cutover-20261103.json"
          document = {
              "schema_version": 1,
              "owner_decision": "retire_remote_desktop_commander_after_verified_chat_execution",
              "primary_route": "ChatGPT-GitHub-Actions-pinned-VPS-cPanel",
              "chat_readonly_evidence_run": 41547325620,
              "scheduled_private_db_write_evidence_run": 41546326289,
              "chat_cutover_record": "written_on_cpanel",
              "generic_sealed_queue_execution": "not_verified",
              "remote_desktop_commander": "not_disabled",
              "recorded_date": "2026-11-03",
          }
          raw = (json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          try:
              fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0), 0o600)
          except FileExistsError:
              if target.is_symlink() or not target.is_file() or target.read_bytes() != raw:
                  raise SystemExit("CUTOVER_EXISTING_RECORD_UNSAFE_OR_DIFFERENT")
              print("CUTOVER_PRIVATE_WRITE=ALREADY_RECORDED")
          else:
              with os.fdopen(fd, "wb") as handle:
                  handle.write(raw)
                  handle.flush()
                  os.fsync(handle.fileno())
              print("CUTOVER_PRIVATE_WRITE=COMMITTED")
          if not stat.S_ISREG(target.stat().st_mode) or target.stat().st_mode & 0o077:
              raise SystemExit("CUTOVER_RECEIPT_PERMISSIONS_INVALID")
          print("CUTOVER_RECEIPT_SHA256=" + hashlib.sha256(raw).hexdigest())
          CUTOVER_WRITE_PY
          ssh -T -F "$RUNNER_TEMP/zomorod-command-channel/config" "$COMMAND_HOST" 'python3 -B -' <<'CUTOVER_VERIFY_PY'
          import json
          import os
          import pwd
          from pathlib import Path
          if pwd.getpwuid(os.geteuid()).pw_name != "zomorod2":
              raise SystemExit("CUTOVER_VERIFY_WRONG_ACCOUNT")
          target = Path("/home/zomorod2/.private/zomorod-business/chat-relay-cutover-20261103.json")
          if target.is_symlink() or not target.is_file() or target.stat().st_mode & 0o077:
              raise SystemExit("CUTOVER_VERIFY_UNSAFE_RECORD")
          document = json.loads(target.read_bytes())
          if (document.get("chat_cutover_record") != "written_on_cpanel"
                  or document.get("remote_desktop_commander") != "not_disabled"
                  or document.get("chat_readonly_evidence_run") != 41547325620):
              raise SystemExit("CUTOVER_VERIFY_CONTENT_MISMATCH")
          print("CHAT_MUTATING_COMMAND_EXECUTED=YES")
          print("PRIVATE_RECEIPT_VERIFIED=YES")
          print("REMOTE_DISABLED=NO")
          CUTOVER_VERIFY_PY
      - name: Read the current recipient public key
        if: steps.gate.outputs.operation == 'show_public_key'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          p="/home/zomorod2/.private/zomorod-business"
          ssh -F "$RUNNER_TEMP/zomorod-command-channel/config" "$COMMAND_HOST" "python3 -B '$p/company_ingress.py' show-public-key --db '$p/command-center.sqlite3' --hmac-key '$p/.company-bridge.key' --recipient-key '$p/.chat-command-rsa.key'" > "$RUNNER_TEMP/recipient-key.txt"
          grep -Fq -- "-----BEGIN PUBLIC KEY-----" "$RUNNER_TEMP/recipient-key.txt"
          grep -Fq -- "-----END PUBLIC KEY-----" "$RUNNER_TEMP/recipient-key.txt"
          echo "CURRENT_RECIPIENT_PUBLIC_KEY_BEGIN"
          sed -n '/^-----BEGIN PUBLIC KEY-----$/,/^-----END PUBLIC KEY-----$/p' "$RUNNER_TEMP/recipient-key.txt"
          echo "CURRENT_RECIPIENT_PUBLIC_KEY_END"
      - name: Decrypt, authenticate, sign and queue the command privately
        if: steps.gate.outputs.operation == 'accept'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/zomorod-command-channel"
          p="/home/zomorod2/.private/zomorod-business"
          # An adapter runs on the pinned private cPanel host. Only ciphertext
          # crosses SSH stdin, while the accepted ID stays in runner temp.
          adapter_b64="$(base64 -w0 scripts/zomorod_private_accept_with_id.py)"
          ssh -T -F "$d/config" "$COMMAND_HOST" "python3 -B -c 'import base64;exec(base64.b64decode(\"$adapter_b64\"))'" < "$RUNNER_TEMP/zomorod-sealed-command.txt" > "$d/receipt.txt"
          grep -Fq "COMMAND_RECEIPT=ACCEPTED" "$d/receipt.txt"
          grep -Fq "COMMAND_QUEUE=UPDATED" "$d/receipt.txt"
          echo "PRIVATE_COMMAND_RECEIPT=ACCEPTED"
          echo "PRIVATE_TASK_QUEUE=UPDATED"
          ssh -F "$d/config" "$COMMAND_HOST" "python3 -B '$p/company_ingress.py' show-public-key --db '$p/command-center.sqlite3' --hmac-key '$p/.company-bridge.key' --recipient-key '$p/.chat-command-rsa.key'" > "$d/recipient-key.txt"
          grep -Fq -- "-----BEGIN PUBLIC KEY-----" "$d/recipient-key.txt"
          grep -Fq -- "-----END PUBLIC KEY-----" "$d/recipient-key.txt"
          echo "ROTATED_RECIPIENT_PUBLIC_KEY_BEGIN"
          sed -n '/^-----BEGIN PUBLIC KEY-----$/,/^-----END PUBLIC KEY-----$/p' "$d/recipient-key.txt"
          echo "ROTATED_RECIPIENT_PUBLIC_KEY_END"
      - name: Apply allowlisted factory policy and independently verify private receipt
        if: steps.gate.outputs.operation == 'accept'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          d="$RUNNER_TEMP/zomorod-command-channel"
          command_id="$(sed -n 's/^PRIVATE_COMMAND_ID=//p' "$d/receipt.txt")"
          [[ "$command_id" =~ ^[0-9a-f]{32}$ ]]
          ssh -T -F "$d/config" "$COMMAND_HOST" "python3 -B - apply '$command_id'" < scripts/zomorod_allowlisted_policy_worker.py > "$d/policy-apply.txt"
          if grep -Fxq "POLICY_APPLIED=NOT_APPLICABLE" "$d/policy-apply.txt"; then
            echo "COMPANY_WORK_EXECUTION=NOT_PERFORMED"
          else
            grep -Fxq "POLICY_APPLIED=YES" "$d/policy-apply.txt"
            applied_id="$(sed -n 's/^POLICY_COMMAND_ID=//p' "$d/policy-apply.txt")"
            test "$applied_id" = "$command_id"
            ssh -T -F "$d/config" "$COMMAND_HOST" "python3 -B - verify '$command_id'" < scripts/zomorod_allowlisted_policy_worker.py > "$d/policy-verify.txt"
            grep -Fxq "PRIVATE_POLICY_READBACK=VERIFIED" "$d/policy-verify.txt"
            grep -Fxq "PRIVATE_EXECUTION_RECEIPT=VERIFIED" "$d/policy-verify.txt"
            echo "COMPANY_WORK_EXECUTION=ALLOWLISTED_POLICY_APPLIED"
            echo "PRIVATE_POLICY_DURABILITY=INDEPENDENTLY_VERIFIED"
          fi
      - name: Remove temporary relay credentials and receipts
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-command-channel" "$RUNNER_TEMP/recipient-key.txt" "$RUNNER_TEMP/zomorod-sealed-command.txt"
