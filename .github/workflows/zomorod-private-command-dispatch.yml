name: Zomorod authenticated private command relay
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: Read the current recipient public key or accept one encrypted command
        required: true
        type: choice
        options:
          - show_public_key
          - accept
      sealed_envelope:
        description: Encrypted one-use command envelope (required for accept)
        required: false
        type: string
permissions:
  contents: read
jobs:
  receive:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit'
      && github.ref == 'refs/heads/main'
      && (
        (
          github.event_name == 'workflow_dispatch'
          && github.actor == 'mojtabarozegar11-ship-it'
        )
        || (
          github.event_name == 'issue_comment'
          && (
            github.actor == 'mojtabarozegar11-ship-it'
            || github.actor == 'chatgpt-codex-connector[bot]'
          )
          && github.event.issue.number == 1600
          && !github.event.issue.pull_request
          && github.event.comment.user.login == 'mojtabarozegar11-ship-it'
          && github.event.comment.author_association == 'OWNER'
          && (
            github.event.comment.body == 'ZMR-PUBLIC-KEY-V1'
            || startsWith(github.event.comment.body, 'ZMR-SEALED-COMMAND-V1')
            || github.event.comment.body == 'ZMR-CPANEL-READONLY-V1'
          )
        )
      )
    concurrency:
      group: zomorod-private-chat-command-inbox
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Authenticate owner and validate encrypted input
        id: gate
        shell: bash
        env:
          EXPECTED_ACTOR: mojtabarozegar11-ship-it
          EXPECTED_APP_ACTOR: chatgpt-codex-connector[bot]
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
          elif test "$GITHUB_EVENT_NAME" = "issue_comment"; then
            test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR" || test "$GITHUB_ACTOR" = "$EXPECTED_APP_ACTOR"
          else
            exit 1
          fi
          umask 077
          python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          event = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          event_name = os.environ.get("GITHUB_EVENT_NAME")
          actor = os.environ.get("GITHUB_ACTOR")
          if event_name == "workflow_dispatch":
              if actor != "mojtabarozegar11-ship-it":
                  raise SystemExit("MANUAL_OWNER_REJECTED")
              inputs = event.get("inputs") or {}
              operation = inputs.get("operation")
              raw = inputs.get("sealed_envelope")
          elif event_name == "issue_comment":
              issue = event.get("issue") or {}
              comment = event.get("comment") or {}
              user = comment.get("user") or {}
              if (event.get("action") != "created"
                      or actor not in ("mojtabarozegar11-ship-it", "chatgpt-codex-connector[bot]")
                      or issue.get("number") != 1600
                      or issue.get("pull_request")
                      or user.get("login") != "mojtabarozegar11-ship-it"
                      or comment.get("author_association") != "OWNER"):
                  raise SystemExit("COMMENT_OWNER_REJECTED")
              if actor == "chatgpt-codex-connector[bot]":
                  app = comment.get("performed_via_github_app")
                  if app is not None and (
                          not isinstance(app, dict)
                          or app.get("slug") != "chatgpt-codex-connector"):
                      raise SystemExit("COMMENT_APP_REJECTED")
              body = comment.get("body")
              if body == "ZMR-PUBLIC-KEY-V1":
                  operation, raw = "show_public_key", None
              elif body == "ZMR-CPANEL-READONLY-V1":
                  operation, raw = "cpanel_readonly", None
              elif isinstance(body, str) and body.startswith("ZMR-SEALED-COMMAND-V1\n"):
                  operation, raw = "accept", body.split("\n", 1)[1]
              else:
                  raise SystemExit("COMMENT_FORMAT_REJECTED")
          else:
              raise SystemExit("EVENT_REJECTED")

          if operation not in ("show_public_key", "accept", "cpanel_readonly"):
              raise SystemExit("OPERATION_REJECTED")
          if operation == "accept":
              try:
                  if not isinstance(raw, str) or not 2 <= len(raw.encode("utf-8")) <= 24000:
                      raise ValueError("SEALED_COMMAND_SIZE_REJECTED")
                  envelope = json.loads(raw)
                  valid = (isinstance(envelope, dict)
                           and set(envelope) == {"v", "alg", "ek", "iv", "ct", "mac"}
                           and envelope.get("v") == 1
                           and envelope.get("alg") == "RSA-OAEP-256+A256CBC-HS256")
              except (ValueError, TypeError):
                  valid = False
              if not valid:
                  raise SystemExit("SEALED_COMMAND_REJECTED")
              encrypted_path = Path(os.environ["RUNNER_TEMP"]) / "zomorod-sealed-command.txt"
              fd = os.open(encrypted_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(raw)
              print("SEALED_COMMAND_ENVELOPE=VALID")
          else:
              print("PUBLIC_KEY_REQUEST=AUTHORIZED")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"operation={operation}\n")
          PY
      - name: Establish pinned private SSH relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Read only cPanel inventory for the authenticated chat owner
        if: steps.gate.outputs.operation == 'cpanel_readonly'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 100s ssh -T -F "$RUNNER_TEMP/zomorod-command-channel/config" "$COMMAND_HOST" 'python3 -B -' <<'CPANEL_READONLY_PY'
          import json
          import os
          import pwd
          import shutil
          import subprocess
          import sys

          if pwd.getpwuid(os.geteuid()).pw_name != "zomorod2":
              raise SystemExit("CPANEL_IDENTITY_REJECTED")
          print("CPANEL_AUTHENTICATED_USER=VERIFIED")
          print("CPANEL_OPERATION=READ_ONLY_AUDIT")
          command = shutil.which("uapi")
          if not command:
              print("CPANEL_UAPI=UNAVAILABLE")
              raise SystemExit(1)
          print("CPANEL_UAPI=FOUND")
          operations = (
              ("DOMAINS", "DomainInfo", "list_domains"),
              ("PASSENGER", "PassengerApps", "list_applications"),
              ("QUOTA", "Quota", "get_local_quota_info"),
              ("BACKUPS", "Backup", "list_backups"),
          )
          for label, module, operation in operations:
              quota_result = None
              try:
                  process = subprocess.run(
                      [command, "--output=json", module, operation],
                      capture_output=True, timeout=15, check=False,
                  )
                  if process.returncode != 0 or len(process.stdout) > 1000000:
                      status = "UNAVAILABLE"
                  else:
                      document = json.loads(process.stdout)
                      result = document.get("result") if isinstance(document, dict) else None
                      if isinstance(result, dict):
                          verified = result.get("status") in (1, True, "1")
                      else:
                          verified = (document.get("status") in (1, True, "1")
                                      if isinstance(document, dict) else False)
                      status = "OK" if verified else "UNAVAILABLE"
                      if label == "QUOTA" and verified and isinstance(result, dict):
                          quota_result = result.get("data")
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  status = "UNAVAILABLE"
              print("CPANEL_" + label + "_READONLY=" + status)
              if label == "QUOTA":
                  # Only bounded numeric local-node data; never log raw UAPI response.
                  def safe_bytes(raw):
                      if type(raw) is int:
                          return raw if 0 <= raw <= 10**15 else None
                      if isinstance(raw, str) and raw.isascii() and raw.isdigit():
                          parsed = int(raw)
                          return parsed if 0 <= parsed <= 10**15 else None
                      return None

                  detail = quota_result if isinstance(quota_result, dict) else {}
                  limit = safe_bytes(detail.get("byte_limit"))
                  used = safe_bytes(detail.get("bytes_used"))
                  if limit is not None and limit > 0 and used is not None:
                      print("CPANEL_LOCAL_QUOTA_DATA=VERIFIED")
                      print("CPANEL_LOCAL_QUOTA_LIMIT_GIB_FLOOR=" + str(limit // 1073741824))
                      print("CPANEL_LOCAL_QUOTA_USED_GIB_FLOOR=" + str(used // 1073741824))
                      print("CPANEL_LOCAL_QUOTA_HEADROOM_GIB_FLOOR=" + str(max(0, limit - used) // 1073741824))
                  else:
                      print("CPANEL_LOCAL_QUOTA_DATA=UNVERIFIED")
          # Targeted, bounded source-only MojPlayWin readiness evidence.
          # No imports of the live Django app, DB queries, plaintext secrets or writes.
          from pathlib import Path
          import hashlib

          app = Path("/home/zomorod2/Saeit-staging")
          public = Path("/home/zomorod2/mojplaywin.com")
          marker = "# MPW_GUEST_CHECKOUT_LIVE_V1"

          def small_regular(path, ceiling=300000):
              try:
                  if path.is_symlink() or not path.is_file():
                      return None
                  size = path.stat().st_size
                  if size <= 0 or size > ceiling:
                      return None
                  return path.read_bytes()
              except OSError:
                  return None

          if app.is_symlink() or public.is_symlink() or not app.is_dir() or not public.is_dir():
              print("MPW_PRODUCTION_ROOTS=UNVERIFIED")
          else:
              print("MPW_PRODUCTION_ROOTS=REGULAR_DIRECTORIES")
              wsgi = small_regular(public / "passenger_wsgi.py", 100000)
              wsgi_match = (wsgi is not None
                            and b"APP='/home/zomorod2/Saeit-staging'" in wsgi)
              print("MPW_PASSENGER_WSGI_APP_LINK=" +
                    ("EXPECTED_STATIC_PATH" if wsgi_match else "UNVERIFIED"))
              guest = small_regular(app / "services/mpw_trx_guest_commerce.py")
              pages = small_regular(app / "services/mpw_trx_public_pages.py")
              commerce = small_regular(app / "services/mpw_trx_commercial_web.py")
              old_sha = "7693254e4ed72141b6de7fc283c5a3214159ea49d838318337e47e86953f5f2f"
              if guest is None:
                  guest_status = "MISSING_OR_UNREADABLE"
              elif hashlib.sha256(guest).hexdigest() == old_sha:
                  guest_status = "EXPECTED_PRE_RECOVERY_BASE"
              elif (b"No active purchase session was found" in guest
                    and b"def patch_public(namespace):" in guest
                    and b"def patch_commercial(namespace):" in guest):
                  guest_status = "RECOVERY_SOURCE_ON_DISK_UNVERIFIED_RUNTIME"
              else:
                  guest_status = "UNRECOGNIZED_SOURCE"
              print("MPW_GUEST_ADAPTER_SOURCE=" + guest_status)
              def hook_status(payload, method):
                  if payload is None:
                      return "MISSING_OR_UNREADABLE"
                  text = payload.decode("utf-8", "replace")
                  hook = ("from services.mpw_trx_guest_commerce import patch_" + method)
                  if text.count(marker) == 1 and hook in text:
                      return "INSTALLED_ON_DISK"
                  if marker not in text and hook not in text:
                      return "NOT_INSTALLED"
                  return "UNRECOGNIZED_OR_PARTIAL"
              print("MPW_PUBLIC_PAGES_GUEST_HOOK=" + hook_status(pages, "public"))
              print("MPW_COMMERCIAL_WEB_GUEST_HOOK=" + hook_status(commerce, "commercial"))
              print("MPW_EFFECTIVE_PASSENGER_DB_IDENTITY=NOT_VERIFIED_BY_STATIC_SOURCE")
              print("MPW_RUNNING_WORKER_RESTART_STATE=NOT_VERIFIED_BY_STATIC_SOURCE")
          # Bounded, redacted diagnostics for Passenger's registered application root.
          # These do not read application secrets or execute the live Django app.
          import re
          import time
          def root_category(value):
              if not isinstance(value, str):
                  return "UNSET"
              value = value.strip().strip(chr(39)).strip(chr(34)).rstrip("/")
              if value in ("/home/zomorod2/Saeit-staging", "Saeit-staging"):
                  return "STAGING"
              if value in ("/home/zomorod2/mojplaywin.com", "mojplaywin.com"):
                  return "PUBLIC"
              if "Saeit-staging" in value:
                  return "REFERS_TO_STAGING"
              if "mojplaywin.com" in value:
                  return "REFERS_TO_PUBLIC"
              return "OTHER"

          for label, root in (("PUBLIC", public), ("STAGING", app)):
              htaccess = small_regular(root / ".htaccess", 100000)
              if htaccess is None:
                  print("MPW_" + label + "_HTACCESS=ABSENT_OR_UNREADABLE")
              else:
                  text = htaccess.decode("utf8", "replace")
                  roots = re.findall(r"(?im)^\s*PassengerAppRoot\s+([^\s#]+)", text)
                  enabled = re.findall(r"(?im)^\s*PassengerEnabled\s+(on|off)\b", text)
                  print("MPW_" + label + "_HTACCESS=READABLE")
                  print("MPW_" + label + "_PASSENGER_APP_ROOT=" +
                        (root_category(roots[-1]) if roots else "NOT_DECLARED"))
                  print("MPW_" + label + "_PASSENGER_ENABLED=" +
                        (enabled[-1].upper() if enabled else "NOT_DECLARED"))
              restart_path = root / "tmp" / "restart.txt"
              if restart_path.is_symlink() or not restart_path.is_file():
                  state = "MISSING"
              else:
                  age = time.time() - restart_path.stat().st_mtime
                  state = "RECENT_15M" if -120 <= age <= 900 else "OLDER"
              print("MPW_" + label + "_PASSENGER_RESTART_MARKER=" + state)

          try:
              response = subprocess.run(
                  [command, "--output=json", "PassengerApps", "list_applications"],
                  capture_output=True, timeout=15, check=False,
              )
              if response.returncode or len(response.stdout) > 1000000:
                  raise ValueError("UAPI_UNAVAILABLE")
              record = json.loads(response.stdout)
              result = record.get("result", {}) if isinstance(record, dict) else {}
              if not isinstance(result, dict) or result.get("status") not in (1, True, "1"):
                  raise ValueError("UAPI_INVALID")
              data = result.get("data")
              print("MPW_PASSENGER_UAPI_DATA_TYPE=" + type(data).__name__.upper())
              pending = [data]
              checks = 0
              seen = set()
              while pending and checks < 500:
                  item = pending.pop()
                  checks += 1
                  if isinstance(item, list):
                      pending.extend(item[:100])
                  elif isinstance(item, dict):
                      for field in ("app_root", "application_root", "app_path",
                                    "path", "document_root", "startup_file"):
                          if field in item:
                              seen.add(field.upper() + "_" + root_category(item[field]))
                      pending.extend(list(item.values())[:100])
              relevant = sorted(x for x in seen if
                                "STAGING" in x or "PUBLIC" in x)
              print("MPW_PASSENGER_UAPI_ROOT_SIGNALS=" +
                    (",".join(relevant) if relevant else "NO_RECOGNIZED_PATH"))
          except (OSError, ValueError, subprocess.TimeoutExpired):
              print("MPW_PASSENGER_UAPI_ROOT_SIGNALS=UNAVAILABLE")
          # Read-only worker metadata: never print PIDs, commands, paths or environment.
          # Compare process age with the now-confirmed PUBLIC restart marker.
          try:
              proc = subprocess.run(
                  ["ps", "-u", "zomorod2", "-o", "etimes=,comm=,args="],
                  capture_output=True, timeout=10, check=False, text=True,
              )
              if proc.returncode or len(proc.stdout) > 250000:
                  raise ValueError("PS_UNAVAILABLE")
              ages = []
              app_ages = []
              for line in proc.stdout.splitlines()[:500]:
                  match = re.match(r"^\s*(\d+)\s+(\S+)\s+(.*)$", line)
                  if not match:
                      continue
                  age = int(match.group(1))
                  name = match.group(2).lower()
                  args = match.group(3).lower()
                  if ("passenger" in name or "passenger" in args
                          or "wsgi" in args or
                          ("python" in name and
                           ("mojplaywin" in args or "saeit-staging" in args))):
                      ages.append(age)
                      if "mojplaywin" in args or "saeit-staging" in args:
                          app_ages.append(age)
              print("MPW_PROCESS_PASSENGER_LIKE_COUNT=" + str(len(ages)))
              print("MPW_PROCESS_MOJPLAYWIN_LIKE_COUNT=" + str(len(app_ages)))
              marker_age = time.time() - (public / "tmp/restart.txt").stat().st_mtime
              if ages and marker_age >= 0:
                  old_count = sum(age > marker_age + 10 for age in ages)
                  print("MPW_PASSENGER_LIKE_OLDER_THAN_RESTART_COUNT=" + str(old_count))
              else:
                  print("MPW_PASSENGER_LIKE_OLDER_THAN_RESTART_COUNT=UNKNOWN")
          except (OSError, ValueError, subprocess.TimeoutExpired):
              print("MPW_PASSENGER_PROCESS_METADATA=UNAVAILABLE")

          # Honor PassengerRestartDir if a public app-specific override exists.
          htaccess = small_regular(public / ".htaccess", 100000)
          if htaccess is not None:
              config_text = htaccess.decode("utf8", "replace")
              dirs = re.findall(r"(?im)^\s*PassengerRestartDir\s+([^\r\n#]+)",
                                config_text)
              if not dirs:
                  restart_dir = "DEFAULT_TMP"
              else:
                  configured = dirs[-1].strip().strip(chr(39)).strip(chr(34)).rstrip("/")
                  if configured == "tmp":
                      restart_dir = "DEFAULT_TMP"
                  elif configured in (str(public / "tmp"), "mojplaywin.com/tmp"):
                      restart_dir = "PUBLIC_TMP"
                  elif configured in (str(app / "tmp"), "Saeit-staging/tmp"):
                      restart_dir = "STAGING_TMP"
                  else:
                      restart_dir = "OTHER"
              print("MPW_PUBLIC_PASSENGER_RESTART_DIR=" + restart_dir)
          else:
              print("MPW_PUBLIC_PASSENGER_RESTART_DIR=UNVERIFIED")
          print("MPW_PRODUCTION_FILE_WRITES=NONE")
          print("MPW_ORDERS_CREATED=0;PAYMENTS_CREATED=0")
          print("CPANEL_SITE_MUTATIONS=NONE")
          print("CPANEL_FACTORY_OPERATIONS=NONE")
          CPANEL_READONLY_PY
      - name: Read the current recipient public key
        if: steps.gate.outputs.operation == 'show_public_key'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          p="/home/zomorod2/.private/zomorod-business"
          ssh -F "$RUNNER_TEMP/zomorod-command-channel/config" "$COMMAND_HOST" "python3 -B '$p/company_ingress.py' show-public-key --db '$p/command-center.sqlite3' --hmac-key '$p/.company-bridge.key' --recipient-key '$p/.chat-command-rsa.key'" > "$RUNNER_TEMP/recipient-key.txt"
          grep -Fq -- "-----BEGIN PUBLIC KEY-----" "$RUNNER_TEMP/recipient-key.txt"
          grep -Fq -- "-----END PUBLIC KEY-----" "$RUNNER_TEMP/recipient-key.txt"
          echo "CURRENT_RECIPIENT_PUBLIC_KEY_BEGIN"
