          import os
          import sys
          from pathlib import Path
          encrypted_path = Path(os.environ["RUNNER_TEMP"]) / "zomorod-sealed-command.txt"
          sys.stdout.write(encrypted_path.read_text(encoding="utf-8"))
          PY
          grep -Fq "COMMAND_RECEIPT=ACCEPTED" "$d/receipt.txt"
          grep -Fq "COMMAND_QUEUE=UPDATED" "$d/receipt.txt"
          echo "PRIVATE_COMMAND_RECEIPT=ACCEPTED"
          echo "PRIVATE_TASK_QUEUE=UPDATED"
