name: Zomorod B2B cPanel physical paths — read only
on:
  pull_request:
    paths:
      - ".github/workflows/zomorod-b2b-readonly-preflight-20261118.yml"
      - "scripts/zomorod_b2b_readonly_preflight_20261118.py"
      - "tests/test_zomorod_b2b_readonly_preflight_20261118.py"
permissions:
  contents: read
jobs:
  source_inventory:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fixed-path regression checks, no writes
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest tests.test_zomorod_b2b_readonly_preflight_20261118 -q
      - name: Connect pinned verified cPanel owner
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          umask 077
          work="$RUNNER_TEMP/zomorod-b2b-inventory"
          install -d -m 700 "$work"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); sys.stdout.write(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n")' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P '' -f "$work/host.key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$work/known"
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          printf 'Host cpanel\n HostName 178.239.147.125\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/known\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 1\n ForwardAgent no\n RequestTTY no\n' "$work" "$work" > "$work/config"
          chmod 600 "$work/config"
          timeout 35s ssh -T -F "$work/config" cpanel 'test "$(id -un)" = "zomorod2"'
      - name: Read-only metadata inventory via stdin, no DB, no content
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zomorod-b2b-inventory"
          timeout 60s ssh -T -F "$work/config" cpanel \
            'PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/zomorod_b2b_readonly_preflight_20261118.py \
          | python3 -c 'import json,sys; raw=sys.stdin.read(9000); p="ZOMOROD_B2B_READONLY="; x=[line for line in raw.splitlines() if line.startswith(p)]; assert len(x)==1; d=json.loads(x[0][len(p):]); assert d["schema"]=="zomorod.b2b.readonly_source_inventory.v1" and d["read_only"] and d["owner_verified"]; assert all(d[k] is False for k in ("database_read","customer_data_read","file_content_read","site_changed","backup_verified","release_performed")); print(x[0])'
          echo 'ZOMOROD_B2B_FIXED_INVENTORY=COMPLETE_NOT_DEPLOY_PROOF' >> "$GITHUB_STEP_SUMMARY"
      - name: Securely remove ephemeral auth files
        if: always()
        shell: bash
        run: |
          work="$RUNNER_TEMP/zomorod-b2b-inventory"
          if test -d "$work"; then rm -f "$work/host.key" "$work/known" "$work/config"; rmdir "$work"; fi
