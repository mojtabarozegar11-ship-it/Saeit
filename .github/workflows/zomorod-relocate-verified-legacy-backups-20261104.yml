name: Relocate two verified legacy backup archives from live cPanel to VPS
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-relocate-verified-legacy-backups-20261104.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-relocate-verified-legacy-backups-20261104
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Move exact historical backup files only after verifying VPS copies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          dest=/home/githubops/.db-backups/relocated-cpanel-legacy-20261104
          ssh -F "$d/config" saeit-vps "mkdir -p '$dest'"
          free_kib="$(ssh -F "$d/config" saeit-vps "df -Pk '$dest' | tail -n 1" | awk '{print $4}')"
          test "$free_kib" -gt 1500000
          sources=(
            "/home/zomorod2/.backups/mojplaywin-staging-sqlite-20261018.gz"
            "/home/zomorod2/Saeit/backups/communication-core-20261005-051054.tar.gz"
          )
          sizes=(263292209 275702261)
          for i in 0 1; do
            src="${sources[$i]}"
            expected_size="${sizes[$i]}"
            name="${src##*/}"
            local_file="$d/$name"
            target="$dest/$name"
            test ! -e "$local_file"
            ssh -F "$d/config" saeit-cpanel "test -f '$src' && test ! -L '$src'"
            current_size="$(ssh -F "$d/config" saeit-cpanel "stat -c %s -- '$src'")"
            test "$current_size" = "$expected_size"
            original_sha="$(ssh -F "$d/config" saeit-cpanel "sha256sum -- '$src' | cut -d ' ' -f1")"
            test "${#original_sha}" -eq 64
            scp -F "$d/config" "saeit-cpanel:$src" "$local_file"
            test "$(stat -c %s "$local_file")" = "$expected_size"
            test "$(sha256sum "$local_file" | cut -d ' ' -f1)" = "$original_sha"
            gzip -t "$local_file"
            ssh -F "$d/config" saeit-vps "test ! -e '$target' && test ! -e '$target.upload'"
            scp -F "$d/config" "$local_file" "saeit-vps:$target.upload"
            ssh -F "$d/config" saeit-vps "EXPECTED='$original_sha' TARGET='$target' SIZE='$expected_size' bash -s" <<'VERIFY'
          set -euo pipefail
          test ! -e "$TARGET"
          test "$(stat -c %s "$TARGET.upload")" = "$SIZE"
          test "$(sha256sum "$TARGET.upload" | cut -d ' ' -f1)" = "$EXPECTED"
          gzip -t "$TARGET.upload"
          mv "$TARGET.upload" "$TARGET"
          test "$(sha256sum "$TARGET" | cut -d ' ' -f1)" = "$EXPECTED"
          echo VPS_HISTORICAL_BACKUP_COPY_VERIFIED=yes
          VERIFY
            ssh -F "$d/config" saeit-cpanel "SRC='$src' EXPECTED='$original_sha' SIZE='$expected_size' python3 -" <<'DELETE_SOURCE'
          import hashlib,os,stat
          from pathlib import Path
          src=Path(os.environ["SRC"])
          allowed={
              "/home/zomorod2/.backups/mojplaywin-staging-sqlite-20261018.gz",
              "/home/zomorod2/Saeit/backups/communication-core-20261005-051054.tar.gz",
          }
          assert str(src) in allowed,"SOURCE_NOT_ALLOWLISTED"
          st=src.lstat()
          assert stat.S_ISREG(st.st_mode) and st.st_uid==os.geteuid(),"SOURCE_NOT_REGULAR_OWNED"
          assert st.st_size==int(os.environ["SIZE"]),"SOURCE_SIZE_CHANGED"
          h=hashlib.sha256()
          with src.open("rb") as f:
              for part in iter(lambda:f.read(1048576),b""):h.update(part)
          assert h.hexdigest()==os.environ["EXPECTED"],"SOURCE_CHANGED_DURING_TRANSFER"
          src.unlink()
          print("CPANEL_LEGACY_BACKUP_SOURCE_REMOVED_AFTER_VPS_VERIFICATION=yes")
          DELETE_SOURCE
            rm -f -- "$local_file"
            echo "RELOCATED_VERIFIED_ARCHIVE=$name bytes=$expected_size"
          done
          ssh -F "$d/config" saeit-cpanel 'uapi --output=json Quota get_quota_info' | python3 -c 'import json,sys;d=json.load(sys.stdin)["result"]["data"];print("POST_RELOCATION_QUOTA_MB_REMAIN="+str(d.get("megabytes_remain","unknown")))'
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -rf -- "$d"; fi
