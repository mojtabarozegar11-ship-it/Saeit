name: Mojtaba.bot.ai read-only factory-runner dual-host inventory

# Reusable and manually dispatchable. The main-only, exact-subject push
# trigger below is for a single reviewed observation; remove it immediately
# after that execution attempt. No PR secrets or periodic schedule.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojtaba-live-topology-readonly.yml"

permissions:
  contents: read

concurrency:
  group: mojtaba-factory-runner-readonly-inventory
  cancel-in-progress: false

jobs:
  observe:
    if: "${{ github.event_name != 'push' || (github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'audit: run one-time selfhosted read-only cPanel and VPS inventory')) }}"
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate observer and source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/mojtaba_live_topology_readonly.py deploy/mojtaba_live_disposition_readonly.py
          python3 -m json.tool runtime/mojtaba_bot_disposition_sources_v1.json >/dev/null
      - name: Observe local VPS without SSH and cPanel via pinned direct SSH
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojtaba-factory-selfhost-readonly-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT

          # Each host is independent: an unreachable cPanel does not erase a
          # successfully collected local VPS snapshot, or vice versa.
          vps_ok=0
          if python3 deploy/mojtaba_live_topology_readonly.py --role vps > "$d/vps.jsonline" 2>"$d/vps.err"; then
            vps_ok=1
          else
            echo "MOJTABA_VPS_OBSERVATION=failed_local_user_or_host_inventory"
          fi

          cpanel_ok=0
          if [[ -z "${HOST_KEY:-}" ]]; then
            echo "MOJTABA_CPANEL_OBSERVATION=blocked_missing_existing_key"
          else
            printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/cpanel.key"
            chmod 600 "$d/cpanel.key"
            if ssh-keygen -y -P "" -f "$d/cpanel.key" >/dev/null 2>&1; then
              if timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 178.239.147.125 > "$d/cpanel.known" 2>"$d/keyscan.err"; then
                if [[ "$(ssh-keygen -lf "$d/cpanel.known" -E sha256 | awk '{print $2}' | sort -u)" == "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" ]]; then
                  echo "MOJTABA_CPANEL_HOST_KEY=existing_pin_verified"
                  if timeout 55s ssh -T -i "$d/cpanel.key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/cpanel.known" -o ConnectTimeout=12 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no -p 1396 zomorod2@178.239.147.125 'exec "$HOME/Saeit/.venv/bin/python" - --role cpanel' < deploy/mojtaba_live_topology_readonly.py > "$d/cpanel.jsonline" 2>"$d/cpanel.err"; then
                    cpanel_ok=1
                  else
                    echo "MOJTABA_CPANEL_OBSERVATION=ssh_or_interpreter_failed"
                  fi
                else
                  echo "MOJTABA_CPANEL_OBSERVATION=host_fingerprint_mismatch_stop"
                fi
              else
                echo "MOJTABA_CPANEL_OBSERVATION=host_key_unreachable"
              fi
            else
              echo "MOJTABA_CPANEL_OBSERVATION=invalid_existing_key"
            fi
          fi

          # Per-host output is safely checked before printing. Never emit
          # process args, cron command text, private DB contents or stderr.
          python3 - "$d" "$vps_ok" "$cpanel_ok" <<'SUMMARY'
          import json
          from pathlib import Path
          import sys
          base = Path(sys.argv[1])
          expected = {"vps": sys.argv[2] == "1", "cpanel": sys.argv[3] == "1"}
          for role, possible in expected.items():
              if not possible:
                  print("MOJTABA_READONLY_" + role.upper() + "=unknown_no_snapshot")
                  continue
              try:
                  lines = (base / (role + ".jsonline")).read_text(encoding="utf-8").splitlines()
                  if len(lines) != 1 or not lines[0].startswith("MOJTABA_LIVE_TOPOLOGY="):
                      raise ValueError("incorrect output format")
                  row = json.loads(lines[0].split("=", 1)[1])
                  if (
                      row.get("schema") != "mojtaba.bot.ai.live-topology-observation.v1"
                      or row.get("host_role") != role
                      or row.get("read_only") is not True
                      or row.get("expected_user_verified") is not True
                      or row.get("attestation", {}).get("automatic_deactivation_authorized") is not False
                  ):
                      raise ValueError("incorrect audit contract")
                  php = row.get("private_php_site_registry", {})
                  result = {
                      "host": role,
                      "cron_state": row["cron"]["state"],
                      "cron_entries": row["cron"]["enumerated_entries"],
                      "process_state": row["processes"]["state"],
                      "known_route_indicators_not_live_bots": row["processes"]["route_match_counts"],
                      "user_services_state": row["user_services"]["state"],
                      "system_services_state": row["system_services"]["state"],
                      "php_registry_state": php.get("state", "not_applicable"),
                      "php_known_role_records": php.get("known_roles_found"),
                      "php_enabled_records_not_running_bots": php.get("enabled_count"),
                      "installed_source_file_count_not_execution": sum(
                          x.get("state") == "file_observed_not_runtime_executed"
                          for x in row["installed_source_digests"].values()
                      ),
                      "agent_live_count": None,
                      "retirement_authorized": False,
                  }
                  print("MOJTABA_READONLY_" + role.upper() + "="
                        + json.dumps(result, ensure_ascii=False, sort_keys=True))
              except (OSError, ValueError, KeyError, TypeError, json.JSONDecodeError):
                  print("MOJTABA_READONLY_" + role.upper() + "=invalid_snapshot")
          SUMMARY

          if [[ "$vps_ok" == "1" && "$cpanel_ok" == "1" ]]; then
            python3 deploy/mojtaba_live_disposition_readonly.py \
              --vps "$d/vps.jsonline" \
              --cpanel "$d/cpanel.jsonline" \
              --manifest runtime/mojtaba_bot_disposition_sources_v1.json
          else
            echo "MOJTABA_DISPOSITION_PREVIEW=partial_host_observation_not_retirement_proof"
          fi
