name: Mojtaba.bot.ai two-host read-only topology evidence

# Manual-only because this workflow uses SSH credentials. Never execute
# unreviewed pull-request code with production secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojtaba-live-topology-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse and validate the observer without touching hosts
        run: python3 -m py_compile deploy/mojtaba_live_topology_readonly.py
      - name: Build pinned SSH relay from existing trusted host keys
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${VPS_KEY:-}" || -z "${HOST_KEY:-}" ]]; then
            echo "MOJTABA_LIVE_OBSERVATION=unknown_missing_ssh_credentials"
            exit 2
          fi
          d="$RUNNER_TEMP/mojtaba-live-observation"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          cat > "$d/vps.known" <<'PINNED_RSA'
          178.239.147.150 ssh-rsa 
          PINNED_RSA
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          echo "MOJTABA_TOPOLOGY_VPS_HOST_KEY=existing_pin_verified"
          # cPanel host-key fingerprint must be verified, not learned by trust-on-first-use.
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "MOJTABA_TOPOLOGY_CPANEL_HOST_KEY=existing_pin_verified"
      - name: Execute read-only host probes and sanitize output
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojtaba-live-observation"
          test -f "$d/config"
          # Host receives the observer over stdin; no file written to either
          # VPS or cPanel and no server cron/process/service is modified.
          ssh -F "$d/config" saeit-vps 'python3 - --role vps' \
            < deploy/mojtaba_live_topology_readonly.py > "$d/vps.jsonline"
          ssh -F "$d/config" saeit-cpanel '/home/zomorod2/Saeit/.venv/bin/python - --role cpanel' \
            < deploy/mojtaba_live_topology_readonly.py > "$d/cpanel.jsonline"
          python3 - "$d/vps.jsonline" "$d/cpanel.jsonline" <<'VERIFY'
          import json
          import sys

          seen = {}
          for role, path in zip(("vps", "cpanel"), sys.argv[1:]):
              lines = open(path, encoding="utf-8").read().splitlines()
              if len(lines) != 1 or not lines[0].startswith("MOJTABA_LIVE_TOPOLOGY="):
                  raise SystemExit("MOJTABA_TOPOLOGY_UNTRUSTED_OUTPUT")
              value = json.loads(lines[0].split("=", 1)[1])
              assert value["schema"] == "mojtaba.bot.ai.live-topology-observation.v1"
              assert value["host_role"] == role
              assert value["read_only"] is True
              assert value["attestation"]["automatic_deactivation_authorized"] is False
              assert value["attestation"]["handoff_verified"] is False
              # Render only a controlled summary, not raw host data.
              php = value.get("private_php_site_registry", {})
              if not isinstance(php, dict):
                  raise SystemExit("MOJTABA_TOPOLOGY_PHP_REGISTRY_INVALID")
              seen[role] = {
                  "cron_state": value["cron"]["state"],
                  "cron_entries_observed": value["cron"]["enumerated_entries"],
                  "process_state": value["processes"]["state"],
                  "process_flags": value["processes"]["route_match_counts"],
                  "user_service_state": value["user_services"]["state"],
                  "user_service_candidates": len(
                      value["user_services"]["candidate_units"]
                  ),
                  "system_service_state": value["system_services"]["state"],
                  "system_service_candidates": len(
                      value["system_services"]["candidate_units"]
                  ),
                  "source_files_observed": sum(
                      row["state"] == "file_observed_not_runtime_executed"
                      for row in value["installed_source_digests"].values()
                  ),
                  "live_handoff_attested": False,
                  "php_registry_state": php.get("state", "unknown_not_observed"),
                  "php_registry_rows": php.get("records"),
                  "php_known_roles_found": php.get("known_roles_found"),
                  "php_enabled_rows": php.get("enabled_count"),
                  "php_run_status_counts": php.get("run_status_counts", {}),
                  "php_worker_output_status_counts": php.get(
                      "recent_worker_output_status_counts", {}
                  ),
                  "php_registry_proves_live_process": False,
              }
          print("MOJTABA_TWO_HOST_OBSERVATION=" + json.dumps(
              seen, sort_keys=True, separators=(",", ":"),
          ))
          VERIFY
      - name: Remove ephemeral CI SSH files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojtaba-live-observation"
