name: Finance102 one-shot unauthenticated TLS identity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls-diagnostic:
    if: github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mock-only TLS identity and no-authentication tests
        run: python3 -B -m unittest discover -s tests -p 'test_finance102_cpanel_tls_preflight.py' -v
      - name: One fixed target DNS and verified TLS handshake (no HTTP or token)
        run: python3 -B scripts/finance102_cpanel_tls_preflight.py
