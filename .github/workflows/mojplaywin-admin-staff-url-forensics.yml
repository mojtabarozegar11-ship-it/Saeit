name: MojPlayWin read-only admin and staff URL collision forensic check
on:
  push:
    branches: [audit/mpw-live-staff-url-20261014]
    paths:
      - .github/workflows/mojplaywin-admin-staff-url-forensics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Describe active staff/admin URL patterns and collision without site writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 110s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          export PYTHONDONTWRITEBYTECODE=1
          export DJANGO_SETTINGS_MODULE=config.settings
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import ast
          from pathlib import Path
          import django
          django.setup()
          from django.urls import get_resolver, reverse, resolve, URLResolver, URLPattern
          from django.contrib import admin
          source = Path("config/urls.py").read_text()
          tree = ast.parse(source)
          for n in ast.walk(tree):
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id in {"path","re_path"} and n.args:
                  route=n.args[0]
                  if isinstance(route, ast.Constant) and isinstance(route.value, str) and (route.value.startswith("staff/") or route.value.startswith("admin/")):
                      stmt=ast.get_source_segment(source,n) or ""
                      print("MPW_LIVE_PATTERN_CODE", " ".join(stmt[:350].split()))
          for p in get_resolver().url_patterns:
              route=str(p.pattern)
              if route.startswith("staff/") or route.startswith("admin/"):
                  print("MPW_LIVE_ROUTE",route,"TYPE",type(p).__name__)
                  print("MPW_LIVE_ROUTE_NAMESPACE",getattr(p,"namespace",None))
                  print("MPW_LIVE_ROUTE_APPNAME",getattr(p,"app_name",None))
                  if isinstance(p,URLResolver):
                      print("MPW_LIVE_ROUTE_CHILD_NAMES_COUNT",len(p.url_patterns))
                  if isinstance(p,URLPattern):
                      print("MPW_LIVE_ROUTE_CALLBACK",getattr(p.callback,"__module__","unknown"),getattr(p.callback,"__name__","unknown"))
          for url in ("/admin/","/admin/login/","/staff/","/staff/login/","/staff/command-center/"):
              try:
                  m=resolve(url)
                  print("MPW_RESOLVES",url,"NAMESPACE",":".join(m.namespaces),"VIEW",m.view_name)
              except Exception as ex:
                  print("MPW_RESOLVE_FAILED",url,type(ex).__name__)
          for name in ("admin:index","admin:login","staff_admin:index","staff_management"):
              try:
                  print("MPW_REVERSE",name,reverse(name))
              except Exception as ex:
                  print("MPW_REVERSE_FAILED",name,type(ex).__name__)
          print("MPW_LIVE_ADMIN_SITE_REGISTRY_NONEMPTY",len(admin.site._registry)>0)
          print("MPW_LIVE_STAFF_URL_READONLY_INSPECTION_COMPLETE=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
