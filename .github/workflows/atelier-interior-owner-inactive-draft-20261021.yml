name: Atelier Interior exact inactive native record owner-scoped 20261021
on:
  push:
    branches: [feature/atelier-sale-readiness-20261021]
    paths:
      - ".github/workflows/atelier-interior-owner-inactive-draft-20261021.yml"
      - "scripts/atelier_interior_register_inactive_owner_20261021.py"
permissions: {contents: read}
concurrency:
  group: atelier-interior-owner-inactive-registration
  cancel-in-progress: false
jobs:
  inactive_single_record_only:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/atelier-sale-readiness-20261021' &&
      startsWith(github.event.head_commit.message, '[owner-atelier-inactive-draft-20261021]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate inactive-only guards before remote execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/atelier_interior_register_inactive_owner_20261021.py selftest
          python3 -m py_compile scripts/atelier_interior_register_inactive_owner_20261021.py
          python3 -B scripts/atelier_interior_release_probe_20261021.py selftest
          echo "OWNER_SCOPE=CREATE_AT_MOST_ONE_INACTIVE_PRODUCT_RECORD"
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Capture live site baseline before limited data write
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/atelier-site-baseline"
          for path in / /store/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            test "$status" = 200
            printf '%s=%s\n' "$path" "$status" >> "$RUNNER_TEMP/atelier-site-baseline"
          done
      - name: Register only the exact-owner exact-hash inactive native product
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_register_inactive_owner_20261021.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel \
            "ATELIER_INACTIVE_OWNER_APPROVAL=2026-10-21 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64'"
      - name: Prove single inactive product with exact price and private asset
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/atelier_interior_release_probe_20261021.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          result="$(timeout 80s ssh -T -F "$d/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c '$call' '$src64'")"
          echo "$result"
          printf '%s' "$result" | python3 -c '
          import json,sys
          line=next((x for x in sys.stdin if x.startswith("ATELIER_INTERIOR_REAL_READONLY_EVIDENCE=")),None)
          if not line:raise SystemExit("MISSING_PROBE")
          report=json.loads(line.split("=",1)[1]);c=report["checks"]
          must=("main_app_wiring","private_exact_sha_zip","zip_complete_and_safe","one_native_product","owner_selected_sale_price")
          assert all(c.get(k) for k in must),c
          assert not c["native_paid_delivery_flags"] and not report["release_ready"]
          assert not report["customer_payment_and_download_tested"]
          print("ATELIER_NATIVE_INACTIVE_RECORD_VERIFIED=PASS; LIVE_SALES=NO")
          '
      - name: Check no protected public route status changed
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/atelier-site-after"
          for path in / /store/ /mojtaba.roozegar/ /picm/ /saman/ /farnaz/; do
            status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path" || true)"
            printf '%s=%s\n' "$path" "$status" >> "$RUNNER_TEMP/atelier-site-after"
          done
          cmp "$RUNNER_TEMP/atelier-site-baseline" "$RUNNER_TEMP/atelier-site-after"
          echo "ATELIER_MAIN_AND_SUBSITES_UNCHANGED_HTTP=PASS"
