name: MojPlayWin preview footer structure read-only diagnostic
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-preview-footer-diagnostic.yml"]
permissions:
  contents: read
concurrency:
  group: mojplaywin-preview-footer-structure-readonly-20261018
  cancel-in-progress: false
jobs:
  preview-inspect-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate narrow preview-only script and verify original public pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_preview_founder_isolated.py
          for path in / /store/ /saman/ /farnaz/ /studio.Roham/ /mojtaba.roozegar/ /taniya/ /picm/login/; do
            status="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 "https://mojplaywin.com$path")"
            test "$status" = 200 || { echo "NO_GO_SITE_UNHEALTHY path=$path"; exit 1; }
          done
          code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 'https://mojplaywin.com/design-preview-20261017/index.html')"
          test "$code" = 200
          echo "PREVIEW_ALREADY_PUBLIC=true"
          echo "ROOT_AND_SEVEN_PROTECTED_STATUS_OK=true"
      - name: Establish host-pinned secure read-only relay before preview-only writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-preview-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
      - name: Diagnose existing preview HTML structure without listing file contents
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-preview-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          from collections import Counter
          import json,re
          root=Path("/home/zomorod2/mojplaywin.com/design-preview-20261017")
          assert root.is_dir() and not root.is_symlink()
          pages=sorted(x for x in root.iterdir() if x.name.endswith(".html"))
          tally=Counter()
          for p in pages:
              if p.is_symlink():tally["symlink"]+=1;continue
              s=p.read_text("utf-8")
              if s.lower().count("</head>")==1:tally["valid_head"]+=1
              if s.lower().count("</footer>")==1:tally["valid_footer"]+=1
              if "noindex" in s.lower():tally["noindex"]+=1
              if "data-mpw-preview-founder-20261018" in s:tally["already_patched"]+=1
              if "<footer" in s.lower():tally["has_footer_open"]+=1
              if "<head" in s.lower():tally["has_head_open"]+=1
              if "Mojtaba Roozegar" in s:tally["has_founder_name"]+=1
          print(json.dumps({"classification":"PREVIEW_STRUCTURE_READ_ONLY","html_count":len(pages),"tally":dict(sorted(tally.items())),"production_files_modified":False,"protected_subsite_files_modified":False},sort_keys=True))
          PY
      - name: Scrub temporary private credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-preview-ssh"
