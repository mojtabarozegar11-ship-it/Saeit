name: Mojtaba inner pages syntax read-only diagnosis
on:
  push:
    branches: ['fix/mojtaba-inner-stories-runtime-20261015']
    paths: ['.github/workflows/mojtaba-inner-syntax-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Run Django template compile in-memory (no production edits)
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.inner-diagnostic-$GITHUB_RUN_ID"
          timeout 20s ssh -F "$SSH_CONFIG" saeit-host "install -d -m 700 '$stage'"
          timeout 50s scp -F "$SSH_CONFIG" scripts/mojtaba_personal_inner_content.py "saeit-host:$stage/installer.py"
          timeout 140s ssh -F "$SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17
          script="/home/zomorod2/.inner-diagnostic-$1/installer.py"
          py="$app/../.venv_personal_test/bin/python"
          cd "$app"
          "$py" - "$script" <<'PY'
          import importlib.util,sys,os
          spec=importlib.util.spec_from_file_location('inner',sys.argv[1])
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.template import engines,Context,RequestContext
          from django.test import RequestFactory
          template_engine=engines['django'].engine
          sources=m.read_state(m.APP)
          for name,text in sources.items():
              print('DIAGNOSTIC='+name,flush=True)
              try:
                  rendered=m.patch(name,text)
                  template=template_engine.from_string(rendered)
                  print('PARSE_OK='+name,flush=True)
                  req=RequestFactory().get('/mojtaba.roozegar/'+name+'/')
                  from django.conf import settings
                  context=RequestContext(req, {'stories':[],'items':[], 'profile':None})
                  template.render(context)
                  print('RENDER_OK='+name,flush=True)
              except Exception as e:
                  print('ERROR_CLASS='+name+' '+type(e).__name__,flush=True)
                  print('ERROR_MESSAGE='+name+' '+str(e)[:1400],flush=True)
                  raise
          PY
          rm -rf "/home/zomorod2/.inner-diagnostic-$1"
          REMOTE
      - name: Remove temp SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/photo-relay"
