name: MPW Tron head stream size only read-only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-tron-head-stream-size-readonly-20261025.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Test first 4096 bytes of fresh finalized heads without inspecting payments
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,time,urllib.request
          targets=(
              ('publicnode-solidity','https://tron-solidity-rpc.publicnode.com/walletsolidity/getnowblock'),
              ('publicnode-full','https://tron-rpc.publicnode.com/walletsolidity/getnowblock'),
              ('trongrid','https://api.trongrid.io/walletsolidity/getnowblock'),
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          for label,url in targets:
              item={'operator':label,'method':'GET','read_only':True,'first_chunk_received':False}
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','User-Agent':'MojPlayWin-Readonly-Diagnostic/1.0'})
                  with opener.open(req,timeout=9) as h:
                      item['http_status']=h.status
                      declared=h.headers.get('Content-Length')
                      item['declared_length']=int(declared) if declared and declared.isdecimal() else None
                      item['chunked']=h.headers.get('Transfer-Encoding','').lower()=='chunked'
                      chunk=h.read(4096)
                  item['first_chunk_received']=len(chunk)>0
                  item['bytes_read']=len(chunk)
                  item['header_visible_early']=b'block_header' in chunk
              except Exception as exc:
                  item['error_type']=type(exc).__name__
                  if hasattr(exc,'code') and type(exc.code) is int:item['http_status']=exc.code
              item['elapsed']=round(time.monotonic()-t,2)
              print('MPW_TRON_HEAD_STREAM='+json.dumps(item,sort_keys=True))
          PY
      - name: Validate bounded JSON header extraction from both independent operators
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,re,time,hashlib,urllib.request,sys,os
          from datetime import datetime,timezone
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          if app.is_symlink() or not app.is_dir():raise SystemExit('UNSAFE_APP_ROOT')
          os.chdir(app);sys.path.insert(0,str(app))
          from scripts.mpw_tron_public_dual_probe_readonly_20261023 import NODES
          from scripts.mpw_tron_public_dual_probe_readonly_20261023 import head_height_and_age
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          for label,url in NODES:
              item={'operator':label,'valid_bounded_head':False,'read_only':True}
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url+'/walletsolidity/getnowblock',method='GET',
                      headers={'Accept':'application/json','User-Agent':'MojPlayWin-Readonly-Diagnostic/1.0'})
                  with urllib.request.build_opener(NoRedirect()).open(req,timeout=9) as h:
                      if h.status!=200 or h.headers.get_content_type()!='application/json':raise ValueError('Bad provider HTTP response')
                      sample=b''
                      for _ in range(8):
                          sample+=h.read(4096)
                          preview=sample.decode('utf8','ignore')
                          match=re.search(r'"block_header"\s*:\s*',preview)
                          if not match:continue
                          try:header,offset=json.JSONDecoder().raw_decode(preview[match.end():])
                          except json.JSONDecodeError:continue
                          if type(header) is not dict:raise ValueError('Invalid header object')
                          head_height_and_age({'block_header':header},datetime.now(timezone.utc))
                          item['valid_bounded_head']=True
                          item['bytes_for_header']=len(sample)
                          break
                      else:raise ValueError('Bounded header unavailable')
              except Exception as exc:item['error_type']=type(exc).__name__
              item['seconds']=round(time.monotonic()-t,2)
              print('MPW_TRON_BOUNDED_HEAD='+json.dumps(item,sort_keys=True))
          live=app/'services/mpw_trx_commercial_chain.py'
          if live.is_file() and not live.is_symlink():
              print('MPW_TRON_LIVE_CHAIN_SOURCE_SHA256='+hashlib.sha256(live.read_bytes()).hexdigest())
          PY
      - name: Verify one recent public native TRX transfer at both solidified operators
        run: |
          set -euo pipefail
          timeout 105s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,os,sys,hashlib
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          if not app.is_dir() or app.is_symlink():raise SystemExit('UNSAFE_APP_ROOT')
          os.chdir(app);sys.path.insert(0,str(app))
          from scripts.mpw_tron_public_dual_probe_readonly_20261023 import NODES,get,select_native_candidate
          from services.mpw_trx_commercial_chain import read_only_independent_pair
          result={'scope':'public-native-trx-two-source-finality','financial_writes':0,'proof_verified':False}
          try:
              block=get(NODES[1],'head')
              tx=select_native_candidate(block)
              pair=read_only_independent_pair()
              left,right=pair.prove_a(tx),pair.prove_b(tx)
              fields=('tx_hash','sender','recipient','amount_sun','block_time','network')
              if not all(getattr(left,f)==getattr(right,f) for f in fields):
                  raise ValueError('Independent native proofs disagree')
              if not all((left.solidified,right.solidified,left.execution_success,right.execution_success,
                          left.transfer_contract,right.transfer_contract)):
                  raise ValueError('Native finality execution not confirmed')
              if pair.identifier_a==pair.identifier_b or left.source_id!=pair.identifier_a or right.source_id!=pair.identifier_b:
                  raise ValueError('Operator identity mismatch')
              result['proof_verified']=True
          except Exception as exc:
              result['blocked_class']=type(exc).__name__
          print('MPW_TRON_PUBLIC_TWO_OPERATOR_CANARY='+json.dumps(result,sort_keys=True))
          PY
      - name: Verify live walletless reconciliation cron heartbeat and safe results
        run: |
          set -euo pipefail
          timeout 55s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path
          home=Path('/home/zomorod2')
          app=home/'Saeit-staging'
          if app.is_symlink() or not app.is_dir():raise SystemExit('BAD_RUNTIME_ROOT')
          p=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=10,check=False)
          entries=[x for x in p.stdout.splitlines() if x.strip() and not x.lstrip().startswith('#')]
          target=[x for x in entries if 'mpw_trx_commercial_reconcile_cron.py' in x]
          result={'cron_readable':p.returncode==0,'walletless_script_entries':len(target),
                  'recent_heartbeat':False,'last_mode':'UNOBSERVED','read_only':True}
          files=[]
          for entry in target:
              for raw in re.findall(r'[^\s<>"|&;]+\.log',entry):
                  candidate=Path(raw)
                  if candidate.is_absolute() and str(candidate).startswith(str(home)+'/'):
                      files.append(candidate)
          private=home/'.private_mojplaywin_main_agents'
          if private.is_dir() and not private.is_symlink():
              files.extend(x for x in private.glob('*tron*reconcil*.log'))
              files.extend(x for x in private.glob('*trx*reconcil*.log'))
          now=time.time()
          for path in files[:16]:
              if path.is_symlink() or not path.is_file() or path.stat().st_size>8_000_000:continue
              age=now-path.stat().st_mtime
              if age>=-30 and age<=300:
                  result['recent_heartbeat']=True
              for line in path.read_text('utf8','replace').splitlines()[-80:]:
                  marker='MPW_TRX_AUTORECONCILE='
                  if marker not in line:continue
                  try:
                      v=json.JSONDecoder().raw_decode(line.split(marker,1)[1])[0]
                  except Exception:continue
                  if isinstance(v,dict):
                      result['last_mode']=str(v.get('mode','UNKNOWN'))[:70]
                      result['last_examined']=v.get('examined') if type(v.get('examined')) is int else None
                      result['last_held']=v.get('held') if type(v.get('held')) is int else None
                      result['last_settled']=v.get('settled') if type(v.get('settled')) is int else None
          print('MPW_TRX_LIVE_CRON_HEARTBEAT='+json.dumps(result,sort_keys=True))
          PY
      - name: Classify nine pending invoice lookup holds without touching settlement
        run: |
          set -euo pipefail
          timeout 105s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,os,sys,collections
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          if app.is_symlink() or not app.is_dir():raise SystemExit('BAD_APP_ROOT')
          os.chdir(app);sys.path.insert(0,str(app))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from core.models import PaymentIntent
          from services.mpw_walletless_commercial_intent import _decode,PROVIDER,WAITING
          from services.mpw_tron_readonly_deposit_candidates import find_candidate_hashes
          from services.mpw_trx_walletless_core import PaymentHold
          reasons=set(('Invalid server-owned TRX recipient','Invalid atomic amount',
              'Expected aware invoice times','Invalid invoice interval','Invalid invoice issue time',
              'Read-only indexer unavailable','Unexpected incoming transfer index response',
              'Indexer JSON overflow','Unreadable indexer response','Malformed incoming transaction page',
              'Untrusted candidate listing','Unbounded candidate listing','Ambiguous matching incoming transfers',
              'Unsafe indexer pagination','Read-only indexer page limit reached'))
          counts=collections.Counter()
          intents=list(PaymentIntent.objects.filter(provider=PROVIDER,status=WAITING).order_by('pk')[:30])
          for intent in intents:
              try:invoice=_decode(intent)
              except PaymentHold:
                  counts['invoice_contract_held']+=1
                  continue
              try:
                  txs=find_candidate_hashes(invoice.recipient,invoice.amount_sun,
                                            invoice.issued_at,invoice.expires_at)
              except PaymentHold as exc:
                  key=str(exc)
                  counts[key if key in reasons else 'unclassified_payment_hold']+=1
              except Exception as exc:
                  counts['technical_'+type(exc).__name__]+=1
              else:
                  counts['zero_candidates' if not txs else ('one_candidate' if len(set(txs))==1 else 'multiple_candidates')]+=1
          print('MPW_TRX_PENDING_LOOKUP_CLASSIFICATION='+json.dumps({
              'read_only':True,'financial_writes':0,'scanned':len(intents),
              'categories':dict(counts)},sort_keys=True))
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
