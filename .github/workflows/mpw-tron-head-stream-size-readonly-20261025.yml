name: MPW Tron head stream size only read-only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-tron-head-stream-size-readonly-20261025.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Test first 4096 bytes of fresh finalized heads without inspecting payments
        run: |
          set -euo pipefail
          timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import json,time,urllib.request
          targets=(
              ('publicnode-solidity','https://tron-solidity-rpc.publicnode.com/walletsolidity/getnowblock'),
              ('publicnode-full','https://tron-rpc.publicnode.com/walletsolidity/getnowblock'),
              ('trongrid','https://api.trongrid.io/walletsolidity/getnowblock'),
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          for label,url in targets:
              item={'operator':label,'method':'GET','read_only':True,'first_chunk_received':False}
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','User-Agent':'MojPlayWin-Readonly-Diagnostic/1.0'})
                  with opener.open(req,timeout=9) as h:
                      item['http_status']=h.status
                      declared=h.headers.get('Content-Length')
                      item['declared_length']=int(declared) if declared and declared.isdecimal() else None
                      item['chunked']=h.headers.get('Transfer-Encoding','').lower()=='chunked'
                      chunk=h.read(4096)
                  item['first_chunk_received']=len(chunk)>0
                  item['bytes_read']=len(chunk)
                  item['header_visible_early']=b'block_header' in chunk
              except Exception as exc:
                  item['error_type']=type(exc).__name__
                  if hasattr(exc,'code') and type(exc.code) is int:item['http_status']=exc.code
              item['elapsed']=round(time.monotonic()-t,2)
              print('MPW_TRON_HEAD_STREAM='+json.dumps(item,sort_keys=True))
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
