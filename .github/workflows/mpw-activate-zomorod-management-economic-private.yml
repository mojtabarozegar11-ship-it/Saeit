name: Activate MojPlayWin Zomorod-derived private management and economics agents hourly
on:
  push:
    branches: ["feat/mpw-v91-agent-port-isolated-20261018"]
    paths: [".github/workflows/mpw-activate-zomorod-management-economic-private.yml"]
permissions:
  contents: read
concurrency:
  group: mpw-zomorod-management-and-economic-private-cron
  cancel-in-progress: false
jobs:
  stage-verify-start:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feat/mpw-v91-agent-port-isolated-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private policy adapter and exact source SHA
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_reuse_zomorod_reporting_and_economic_policies.py scripts/mpw_stage_zomorod_management_economic_worker.py scripts/mpw_install_zomorod_management_economic_hourly.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage SHA-256-verified private runner in its independent destination
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          source_sha="$(sha256sum scripts/mpw_reuse_zomorod_reporting_and_economic_policies.py | cut -d ' ' -f 1)"
          receiver="$(base64 -w0 scripts/mpw_stage_zomorod_management_economic_worker.py)"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import base64; exec(base64.b64decode(\"$receiver\"))' '$source_sha'" < scripts/mpw_reuse_zomorod_reporting_and_economic_policies.py
      - name: Re-run two distinct source-verified private agents and verify outputs
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel 'python3 -B /home/zomorod2/.private_mojplaywin_main_agents/management_intelligence_20261018/worker.py'
      - name: Schedule reporting and economic policy for hourly execution while preserving cron
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          source_sha="$(sha256sum scripts/mpw_reuse_zomorod_reporting_and_economic_policies.py | cut -d ' ' -f 1)"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel "python3 - '$source_sha'" < scripts/mpw_install_zomorod_management_economic_hourly.py
      - name: Purge runner credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
