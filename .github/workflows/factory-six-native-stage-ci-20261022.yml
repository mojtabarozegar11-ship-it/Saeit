name: Real native candidates for six blocked factory lines
on:
  push:
    branches: [feature/six-native-candidate-builds-20261022, feature/factory-six-independent-rework-20261022, feature/six-device-and-independent-qa-evidence-20261022, feature/six-windows-acceptance-safe-main-20261022, main]
    paths:
      - scripts/factory_six_native_candidates.py
      - scripts/factory_f14_browser_real_smoke.py
      - scripts/factory_android_emulator_runtime_check.py
      - scripts/factory_windows_native_playthrough.py
      - tests/test_factory_android_emulator_evidence.py
      - scripts/factory_six_native_candidate_bundle.py
      - scripts/factory_specialist_formats.py
      - scripts/factory_six_native_independent_rework.py
      - scripts/factory_f14_browser_real_smoke.py
      - tests/test_factory_six_native_independent_rework.py
      - deploy/factory_six_native_review_relay.sh
      - deploy/install_factory_six_native_rework.sh
      - deploy/factory_six_native_private_relay.sh
      - .github/workflows/factory-six-native-stage-ci-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-six-native-candidate-ci
  cancel-in-progress: false
jobs:
  f26-real-onnx:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate private proof scripts safely
        run: |
          bash -n deploy/factory_six_native_private_relay.sh
          bash -n deploy/factory_six_native_private_verify.sh
          bash -n deploy/install_factory_six_native_rework.sh
          bash -n deploy/factory_six_native_review_relay.sh
          python3 -B -m py_compile scripts/factory_six_native_candidate_bundle.py scripts/factory_six_native_independent_rework.py
          python3 -B -m unittest discover -s tests -p 'test_factory_android_emulator_evidence.py' -v
          python3 -B -m unittest discover -s tests -p 'test_factory_six_native_independent_rework.py' -v
      - name: Generate and recheck all original source candidates
        run: |
          mkdir -p "$RUNNER_TEMP/private-six"
          python3 -B scripts/factory_six_specialist_executors.py --factory-private "$RUNNER_TEMP/private-six" --all
          python3 -B scripts/factory_six_native_candidates.py --factory-private "$RUNNER_TEMP/private-six" --family F26 --output "$RUNNER_TEMP/real-f26"
      - name: Install pinned CPU ONNX checker and runtime
        run: python3 -m pip install --disable-pip-version-check numpy==2.1.3 onnx==1.17.0 onnxruntime==1.20.1
      - name: Serialize and run all 48 real ONNX models against holdouts
        run: |
          python3 -B scripts/factory_six_native_candidates.py --factory-private "$RUNNER_TEMP/private-six" --family F26 --output "$RUNNER_TEMP/real-f26" --onnx
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"real-f26"
          d=json.loads((p/"native-proof.json").read_text())
          assert d["actual_onnxruntime_models_checked"]==48
          assert d["holdout_predictions_checked"]==192
          assert len(list((p/"native").glob("*.onnx")))==48
          assert not d["independent_quality_1000_certified"] and not d["commercial_release"]
          print("F26_REAL_ONNX_FORMAT_AND_INFERENCE=PASS")
          PY
      - name: Package and hash-check 48 executable ONNX model artifacts
        run: |
          set -euo pipefail
          files=()
          for f in "$RUNNER_TEMP/real-f26/native/"*.onnx; do files+=(--file "$f"); done
          python3 -B scripts/factory_six_native_candidate_bundle.py --family F26 --out "$RUNNER_TEMP/bundle-F26" --checks "48 CPU ONNXRuntime sessions 192 holdout predictions" --file "$RUNNER_TEMP/real-f26/native-proof.json" --file "$RUNNER_TEMP/real-f26/preparation-receipt.json" "${files[@]}"
          python3 -B scripts/factory_six_native_candidate_bundle.py --family F26 --out "$RUNNER_TEMP/bundle-F26" --verify
      - name: Privately stage F26 ONNX candidate evidence on VPS
        if: github.ref == 'refs/heads/main'
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: bash deploy/factory_six_native_private_relay.sh F26 "$RUNNER_TEMP/bundle-F26"
  f14-real-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Create verified F14 private game
        run: |
          mkdir -p "$RUNNER_TEMP/private-six"
          python3 -B scripts/factory_six_specialist_executors.py --factory-private "$RUNNER_TEMP/private-six" --all
          python3 -B scripts/factory_six_native_candidates.py --factory-private "$RUNNER_TEMP/private-six" --family F14 --output "$RUNNER_TEMP/real-f14"
      - name: Install pinned real Chromium automation
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install chromium
      - name: Actually play the browser game in desktop and mobile viewports
        run: |
          python3 -B scripts/factory_f14_browser_real_smoke.py --source "$RUNNER_TEMP/real-f14/source" --proof "$RUNNER_TEMP/real-f14/browser-proof.json"
          echo F14_REAL_INTERACTIVE_BROWSER_QA=PASS
      - name: Make SHA-bound private F14 browser candidate and verify integrity
        run: |
          python3 -B scripts/factory_six_native_candidate_bundle.py --family F14 --out "$RUNNER_TEMP/bundle-F14" --checks "Chromium actual keyboard tap mobile desktop restart" --file "$RUNNER_TEMP/real-f14/source/mini_game.html" --file "$RUNNER_TEMP/real-f14/source/game.js" --file "$RUNNER_TEMP/real-f14/browser-proof.json" --file "$RUNNER_TEMP/real-f14/preparation-receipt.json"
          python3 -B scripts/factory_six_native_candidate_bundle.py --family F14 --out "$RUNNER_TEMP/bundle-F14" --verify
      - name: Keep only privately stored native candidates on VPS
        if: github.ref == 'refs/heads/main'
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: bash deploy/factory_six_native_private_relay.sh F14 "$RUNNER_TEMP/bundle-F14"
  f13-f17-real-windows-exe:
    runs-on: windows-2022
    timeout-minutes: 18
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build original verified sources
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/private-six" | Out-Null
          python scripts/factory_seven_missing_builders.py --factory-private "$env:RUNNER_TEMP/private-six" --family F13
          if ($LASTEXITCODE -ne 0) { throw "F13_SOURCE_BUILD_FAILED" }
          python scripts/factory_seven_missing_builders.py --factory-private "$env:RUNNER_TEMP/private-six" --family F17
          if ($LASTEXITCODE -ne 0) { throw "F17_SOURCE_BUILD_FAILED" }
          python scripts/factory_six_native_candidates.py --factory-private "$env:RUNNER_TEMP/private-six" --family F13 --output "$env:RUNNER_TEMP/real-f13"
          python scripts/factory_six_native_candidates.py --factory-private "$env:RUNNER_TEMP/private-six" --family F17 --output "$env:RUNNER_TEMP/real-f17"
      - name: Install pinned Windows native-packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build two authentic Windows PE executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name GemRoutePilot --add-data "$env:RUNNER_TEMP/real-f13/source/levels.json;." --distpath "$env:RUNNER_TEMP/native-f13" --workpath "$env:RUNNER_TEMP/work-f13" --specpath "$env:RUNNER_TEMP/spec-f13" "$env:RUNNER_TEMP/real-f13/source/game.py"
          python -m PyInstaller --noconfirm --clean --onefile --name FieldLedgerPilot --distpath "$env:RUNNER_TEMP/native-f17" --workpath "$env:RUNNER_TEMP/work-f17" --specpath "$env:RUNNER_TEMP/spec-f17" "$env:RUNNER_TEMP/real-f17/source/desktop.py"
          & "$env:RUNNER_TEMP/native-f13/GemRoutePilot.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "F13_REAL_EXE_TEST_FAILED" }
          & "$env:RUNNER_TEMP/native-f17/FieldLedgerPilot.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "F17_REAL_EXE_TEST_FAILED" }
          & "$env:RUNNER_TEMP/native-f17/FieldLedgerPilot.exe" --csv "$env:RUNNER_TEMP/real-f17/source/sample.csv"
          if ($LASTEXITCODE -ne 0) { throw "F17_NATIVE_SAMPLE_FAILED" }
          foreach ($f in @("$env:RUNNER_TEMP/native-f13/GemRoutePilot.exe","$env:RUNNER_TEMP/native-f17/FieldLedgerPilot.exe")) {
            $bytes=[System.IO.File]::ReadAllBytes($f)
            if ($bytes.Length -lt 30000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "NATIVE_WINDOWS_PE_INVALID" }
            Write-Host ("WINDOWS_REAL_PE_SHA256=" + (Get-FileHash $f -Algorithm SHA256).Hash)
          }
          Write-Host "F13_F17_NATIVE_WINDOWS_EXE_EXECUTION=PASS"
      - name: Play all 48 desktop game levels and test 15 real inventory scenarios
        run: |
          python scripts/factory_windows_native_playthrough.py --f13 "$env:RUNNER_TEMP/native-f13/GemRoutePilot.exe" --f17 "$env:RUNNER_TEMP/native-f17/FieldLedgerPilot.exe" --levels "$env:RUNNER_TEMP/real-f13/source/levels.json" --out "$env:RUNNER_TEMP/windows-native-proof.json"
          if ($LASTEXITCODE -ne 0) { throw "FACTORY_DESKTOP_RUNTIME_ACCEPTANCE_FAILED" }
      - name: Package and validate two private native Windows candidates
        run: |
          python scripts/factory_six_native_candidate_bundle.py --family F13 --out "$env:RUNNER_TEMP/bundle-F13" --checks "Real Windows PE and 48-level executable self-test" --file "$env:RUNNER_TEMP/native-f13/GemRoutePilot.exe" --file "$env:RUNNER_TEMP/real-f13/preparation-receipt.json" --file "$env:RUNNER_TEMP/windows-native-proof.json"
          if ($LASTEXITCODE -ne 0) { throw "F13_BUNDLE_FAILED" }
          python scripts/factory_six_native_candidate_bundle.py --family F17 --out "$env:RUNNER_TEMP/bundle-F17" --checks "Real Windows PE executable CSV and invalid-input self-tests" --file "$env:RUNNER_TEMP/native-f17/FieldLedgerPilot.exe" --file "$env:RUNNER_TEMP/real-f17/preparation-receipt.json" --file "$env:RUNNER_TEMP/windows-native-proof.json"
          if ($LASTEXITCODE -ne 0) { throw "F17_BUNDLE_FAILED" }
          python scripts/factory_six_native_candidate_bundle.py --family F13 --out "$env:RUNNER_TEMP/bundle-F13" --verify
          if ($LASTEXITCODE -ne 0) { throw "F13_BUNDLE_VERIFICATION_FAILED" }
          python scripts/factory_six_native_candidate_bundle.py --family F17 --out "$env:RUNNER_TEMP/bundle-F17" --verify
          if ($LASTEXITCODE -ne 0) { throw "F17_BUNDLE_VERIFICATION_FAILED" }
      - name: Privately stage Windows binaries on existing pinned VPS
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          bash deploy/factory_six_native_private_relay.sh F13 "$RUNNER_TEMP/bundle-F13"
          bash deploy/factory_six_native_private_relay.sh F17 "$RUNNER_TEMP/bundle-F17"
  f12-f16-real-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify original F12/F16 source and prepare offline Android projects
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-six"
          python3 -B scripts/factory_six_specialist_executors.py --factory-private "$RUNNER_TEMP/private-six" --all
          python3 -B scripts/factory_six_native_candidates.py --factory-private "$RUNNER_TEMP/private-six" --family F12 --output "$RUNNER_TEMP/real-f12"
          python3 -B scripts/factory_six_native_candidates.py --factory-private "$RUNNER_TEMP/private-six" --family F16 --output "$RUNNER_TEMP/real-f16"
      - name: Install pinned Android platform tools
        run: |
          set -euo pipefail
          echo "SDK=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build and independently validate actual Android debug APK and AAB
        run: |
          set -euo pipefail
          for family in F12 F16; do
            project="$RUNNER_TEMP/real-$(echo "$family" | tr '[:upper:]' '[:lower:]')/android"
            gradle --no-daemon -p "$project" :app:assembleDebug :app:bundleDebug
            apk="$project/app/build/outputs/apk/debug/app-debug.apk"
            aab="$project/app/build/outputs/bundle/debug/app-debug.aab"
            test -s "$apk" && test -s "$aab"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 4
            unzip -l "$apk" | grep -q 'assets/index.html'
            unzip -l "$apk" | grep -q 'assets/'
            unzip -t "$aab" >/dev/null
            sha256sum "$apk" "$aab"
            echo "ANDROID_NATIVE_DEBUG_APK_AAB_VERIFIED=$family"
          done
          echo F12_F16_NATIVE_ANDROID_BINARY_BUILDS=PASS
      - name: Enable accelerated KVM for real Android 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          python3 -B -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Install, launch, interact, and screenshot both REAL APKs on Android API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            python3 -B scripts/factory_android_emulator_runtime_check.py --family F12 --apk "$RUNNER_TEMP/real-f12/android/app/build/outputs/apk/debug/app-debug.apk" --out "$RUNNER_TEMP/real-f12/emulator-check"
            python3 -B scripts/factory_android_emulator_runtime_check.py --family F16 --apk "$RUNNER_TEMP/real-f16/android/app/build/outputs/apk/debug/app-debug.apk" --out "$RUNNER_TEMP/real-f16/emulator-check"
      - name: Package and independently verify Android debug binaries
        run: |
          set -euo pipefail
          for id in 12 16; do
            family="F$id"
            root="$RUNNER_TEMP/real-f$id"
            project="$root/android"
            python3 -B scripts/factory_six_native_candidate_bundle.py --family "$family" --out "$RUNNER_TEMP/bundle-$family" --checks "Real Gradle APK AAB; API35 emulator app installation, launch, touch, swipe, alive, screenshot and no fatal crash" --file "$project/app/build/outputs/apk/debug/app-debug.apk" --file "$project/app/build/outputs/bundle/debug/app-debug.aab" --file "$root/preparation-receipt.json" --file "$root/emulator-check/emulator-proof.json" --file "$root/emulator-check/emulator-screen.png"
            python3 -B scripts/factory_six_native_candidate_bundle.py --family "$family" --out "$RUNNER_TEMP/bundle-$family" --verify
          done
      - name: Privately stage two Android debug builds on pinned VPS
        if: github.ref == 'refs/heads/main'
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          bash deploy/factory_six_native_private_relay.sh F12 "$RUNNER_TEMP/bundle-F12"
          bash deploy/factory_six_native_private_relay.sh F16 "$RUNNER_TEMP/bundle-F16"

  verify-all-six-on-private-vps:
    needs: [f26-real-onnx, f14-real-chromium, f13-f17-real-windows-exe, f12-f16-real-android-apk]
    if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reopen exact six private native ZIPs and record aggregate SHA on VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: bash deploy/factory_six_native_private_verify.sh

  review-and-queue-six-native-families:
    needs: verify-all-six-on-private-vps
    if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Independently recheck actual native VPS bytes and install private rework intake
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: bash deploy/factory_six_native_review_relay.sh
