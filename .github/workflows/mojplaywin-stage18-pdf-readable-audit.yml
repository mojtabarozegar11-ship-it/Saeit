name: MojPlayWin isolated PDF reader capability inventory
on:
  push:
    branches: [qa/mpw-payment-release-preflight-20261015]
    paths: ['.github/workflows/mojplaywin-stage18-pdf-readable-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Audit deployed sitewide commerce readiness via verified VPS relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-root-audit"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 110s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          cd "$HOME/Saeit-staging"
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONDONTWRITEBYTECODE=1
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          from pathlib import Path
          import os, subprocess, re, shutil, json, hashlib
          import django
          django.setup()
          from core.models import Product,Order
          from mpw_native_checkout.wallet_ownership import proven_assets
          home=Path.home()
          print("MPW_CANDIDATE_WALLET_PROOFS="+str(proven_assets()))
          print("MPW_CANDIDATE_ACTIVE_COUNT="+str(Product.objects.filter(active=True).count()))
          print("MPW_CANDIDATE_ORDER_COUNT="+str(Order.objects.count()))
          for product in Product.objects.filter(id__in=(72,147)).order_by("id"):
              md=product.metadata if isinstance(product.metadata,dict) else {}
              print("MPW_CANDIDATE_ID="+str(product.id))
              print("MPW_CANDIDATE_TITLE="+str(product.title)[:110].replace("\\n"," "))
              print("MPW_CANDIDATE_TYPE="+str(product.product_type))
              print("MPW_CANDIDATE_PRICE="+str(product.price)+" "+str(product.currency))
              print("MPW_CANDIDATE_ACTIVE="+str(product.active))
              print("MPW_CANDIDATE_OWNER_ASSIGNED="+str(product.owner_id is not None))
              print("MPW_CANDIDATE_RESEARCH_LINKED="+str(product.knowledge_article_id is not None))
              print("MPW_CANDIDATE_METADATA_KEYS="+",".join(sorted(k for k in md if k in (
                  "factory_publication_permission","asset_verified",
                  "quality_approved","license_verified","mpw_commerce",
                  "author","source","license","file_path","page_count"
              ))))
              print("MPW_CANDIDATE_PUBLICATION_APPROVED="+str(md.get("factory_publication_permission") is True))
              print("MPW_CANDIDATE_QUALITY_APPROVED="+str(md.get("quality_approved") is True))
              print("MPW_CANDIDATE_LICENSE_VERIFIED="+str(md.get("license_verified") is True))
              print("MPW_CANDIDATE_ASSET_VERIFIED="+str(md.get("asset_verified") is True))
              policy=md.get("mpw_commerce")
              print("MPW_CANDIDATE_SALE_POLICY_ENABLED="+str(type(policy) is dict and policy.get("enabled") is True))
          root=home/"MojPlayWin_Private_Assets"/"chess-improvement-2026"
          file=root/"MojPlayWin_Science_and_Practice_of_Chess_Improvement.pdf"
          print("MPW_BOOK_PRIVATE_PDF_EXISTS="+str(file.is_file()))
          print("MPW_BOOK_PRIVATE_PDF_NOT_SYMLINK="+str(not file.is_symlink()))
          if file.is_file() and not file.is_symlink():
              stat=file.stat()
              print("MPW_BOOK_SIZE_BYTES="+str(stat.st_size))
              with file.open("rb") as fh:
                  print("MPW_BOOK_PDF_HEADER_VALID="+str(fh.read(8).startswith(b"%PDF-")))
              print("MPW_BOOK_PDF_TRAILER_PRESENT="+str(b"%%EOF" in file.read_bytes()[-4096:]))
              print("MPW_BOOK_WORLD_READABLE="+str(bool(stat.st_mode & 0o004)))
              if shutil.which("pdfinfo"):
                  r=subprocess.run(["pdfinfo",str(file)],capture_output=True,text=True,
                                   timeout=35,check=False)
                  info=dict(line.split(":",1) for line in r.stdout.splitlines() if ":" in line)
                  print("MPW_BOOK_PDFINFO_RETURN="+str(r.returncode))
                  print("MPW_BOOK_PAGES="+info.get("Pages","unknown").strip())
                  print("MPW_BOOK_ENCRYPTED="+info.get("Encrypted","unknown").strip())
                  print("MPW_BOOK_PDF_TITLE_META_PRESENT="+str(bool(info.get("Title","").strip())))
                  print("MPW_BOOK_PDF_AUTHOR_META_PRESENT="+str(bool(info.get("Author","").strip())))
              else:
                  print("MPW_BOOK_PDFINFO_AVAILABLE=False")
              if shutil.which("pdftotext") and 10000<stat.st_size<100000000:
                  result=subprocess.run(["pdftotext","-enc","UTF-8",str(file),"-"],
                             capture_output=True,timeout=70,check=False)
                  if result.returncode==0 and len(result.stdout)<25000000:
                      text=result.stdout.decode("utf-8","replace")
                      tokens=re.findall(r"[A-Za-z]+(?:[-'][A-Za-z]+)*",text)
                      pagechunks=text.split("\\f")
                      print("MPW_BOOK_ENGLISH_WORD_TOKENS="+str(len(tokens)))
                      print("MPW_BOOK_DISTINCT_ENGLISH_WORDS="+str(len(set(w.lower() for w in tokens))))
                      print("MPW_BOOK_TEXT_PAGES_WITH_150_WORDS="+str(sum(
                          len(re.findall(r"[A-Za-z]+",x))>=150 for x in pagechunks)))
                      print("MPW_BOOK_TEXT_EXTRACT_OK=True")
                  else:
                      print("MPW_BOOK_TEXT_EXTRACT_OK=False")
              else:
                  print("MPW_BOOK_TEXT_EXTRACTION_AVAILABLE=False")
          # Prefer existing isolated PDF readers; do not install into
          # the live Django environment or print private document text.
          import importlib.util
          for name in ("fitz","pypdf","PyPDF2","pdfplumber","pdfminer","reportlab"):
              try:
                  present=importlib.util.find_spec(name) is not None
              except (ImportError, ValueError):
                  present=False
              print("MPW_PDF_MODULE_"+name.upper()+"="+str(present))
          if file.is_file() and not file.is_symlink():
              data=file.read_bytes()
              raw_count=len(re.findall(rb"/Type\\s*/Page\\b",data))
              print("MPW_BOOK_RAW_PAGE_OBJECTS_ESTIMATE="+str(raw_count))
              text=""
              pages=None
              try:
                  import fitz
                  doc=fitz.open(stream=data,filetype="pdf")
                  pages=len(doc)
                  text="\\f".join(page.get_text() for page in doc)
              except (ImportError,RuntimeError,ValueError):
                  try:
                      from pypdf import PdfReader
                      import io
                      doc=PdfReader(io.BytesIO(data))
                      pages=len(doc.pages)
                      text="\\f".join(page.extract_text() or "" for page in doc.pages)
                  except (ImportError,ValueError,TypeError,Exception):
                      try:
                          from PyPDF2 import PdfReader
                          import io
                          doc=PdfReader(io.BytesIO(data))
                          pages=len(doc.pages)
                          text="\\f".join(page.extract_text() or "" for page in doc.pages)
                      except Exception:
                          pass
              if pages is not None:
                  tokens=re.findall(r"[A-Za-z]+(?:[-'][A-Za-z]+)*",text)
                  parts=text.split("\\f")
                  print("MPW_BOOK_READABLE_PAGES="+str(pages))
                  print("MPW_BOOK_READABLE_ENGLISH_WORDS="+str(len(tokens)))
                  print("MPW_BOOK_READABLE_PAGES_OVER_150_WORDS="+str(sum(
                      len(re.findall(r"[A-Za-z]+",part))>=150 for part in parts)))
                  print("MPW_BOOK_TEXT_EXTRACTION_READER_SUCCEEDED=True")
              else:
                  print("MPW_BOOK_TEXT_EXTRACTION_READER_SUCCEEDED=False")
          print("MPW_BOOK_RIGHTS_NOT_VERIFIED_BY_TECHNICAL_SCAN=True")
          print("MPW_BOOK_NOT_AUTO_PUBLISHED_OR_SOLD=True")
          print("MPW_BOOK_AUDIT_READ_ONLY=True")
          PY
          REMOTE
      - name: Remove transient keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-root-audit"
