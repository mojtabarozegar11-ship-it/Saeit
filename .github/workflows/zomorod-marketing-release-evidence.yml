      - name: Classify actual Passenger Python version without paths or secrets
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 50s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          python3 -B - <<'PY'
          import os,pathlib,re
          home=pathlib.Path.home()
          ht=home/"public_html"/".htaccess"
          version="not_found"
          resolved_version="not_proven"
          configured_executable="not_proven"
          if ht.is_file() and not ht.is_symlink():
              for line in ht.read_text(errors="replace").splitlines():
                  match=re.match(r"^\s*PassengerPython\s+(\S+)",line,re.I)
                  if not match:continue
                  value=match.group(1).strip(chr(34)+chr(39))
                  found=re.findall(r"(?<!\d)(3\.\d+)(?!\d)",value)
                  if found: version=found[-1]
                  elif value.endswith("/python3"):version="3.unspecified"
                  else:version="path_without_version"
                  candidate=pathlib.Path(value)
                  if candidate.is_file() and os.access(candidate,os.X_OK):
                      configured_executable="present_and_executable"
                      resolved=os.path.realpath(str(candidate))
                      matches=re.findall(r"(?<!\d)(3\.\d+)(?!\d)",resolved)
                      if matches:resolved_version=matches[-1]
                      else:resolved_version="unknown_version"
                  else:configured_executable="not_found_or_not_executable"
                  break
          print("PASSENGER_CONFIGURED_PYTHON_VERSION="+version)
          print("PASSENGER_CONFIGURED_EXE_STATUS="+configured_executable)
          print("PASSENGER_CONFIGURED_PYTHON_REALPATH_VERSION="+resolved_version)
          seen=set()
          site_versions=set()
          site_workers=0
          for proc in pathlib.Path("/proc").iterdir():
              if not proc.name.isdecimal():continue
              try:
                  if proc.stat().st_uid!=os.getuid():continue
                  cmd=(proc/"cmdline").read_bytes()[:5000].lower()
                  if not (b"passenger" in cmd or (b"python" in cmd and b"saeit" in cmd)):continue
                  path=os.readlink(proc/"exe")
                  known=re.findall(r"(?<!\d)(3\.\d+)(?!\d)",path)
                  if known:seen.add(known[-1])
                  try:
                      cwd=os.path.realpath(os.readlink(proc/"cwd"))
                      if cwd==str(home/"Saeit"):
                          site_workers+=1
                          if known:site_versions.add(known[-1])
                  except OSError:pass
              except (OSError,ValueError):continue
          print("PASSENGER_SITE_WORKER_COUNT="+str(site_workers))
          print("PASSENGER_SITE_WORKER_EXE_VERSIONS="+(",".join(sorted(site_versions)) if site_versions else "not_identified"))
          print("PASSENGER_OWNED_PROCESS_EXEC_VERSION_CATEGORIES="+(",".join(sorted(seen)) if seen else "unavailable"))
          print("PASSENGER_PYTHON_VERSION_AUDIT=readonly")
          PY
          REMOTE
      - name: Attest actual Passenger interpreter and process-bound DB without secrets
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 65s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import os,pathlib,re,sqlite3,subprocess,urllib.parse
          root=pathlib.Path("/home/zomorod2/Saeit").resolve()
          ht=pathlib.Path("/home/zomorod2/public_html/.htaccess")
          interpreter=None
          if ht.is_file() and not ht.is_symlink():
              for line in ht.read_text(errors="replace").splitlines():
                  match=re.match(r'^\s*PassengerPython\s+(".*?"|\'.*?\'|\S+)',line,re.I)
                  if match:
                      interpreter=pathlib.Path(match.group(1).strip(chr(34)+chr(39)))
                      break
          if interpreter and interpreter.is_file() and os.access(interpreter,os.X_OK):
              try:
                  with interpreter.open("rb") as exe:
                      header=exe.read(72)
                  kind=("ELF" if header.startswith(bytes((127,69,76,70))) else
                        "script" if header.startswith(b"#!") else
                        "empty" if not header else "other")
              except OSError:
                  kind="unreadable"
              print("PASSENGER_CONFIGURED_EXECUTABLE_CLASS="+kind)
              print("PASSENGER_CONFIGURED_EXECUTABLE_BASENAME="+
                    (interpreter.name if re.fullmatch(r"[A-Za-z0-9._-]{1,40}",interpreter.name) else "redacted"))
              for version in ("3.10","3.11"):
                  alternative=pathlib.Path("/home/zomorod2/virtualenv/Saeit")/version/"bin/python"
                  tag=version.replace(".","_")
                  if not alternative.is_file() or not os.access(alternative,os.X_OK):
                      print("AVAILABLE_CPANEL_PYTHON_"+tag+"=absent")
                      continue
                  print("AVAILABLE_CPANEL_PYTHON_"+tag+"=present")
                  print("CONFIGURED_PYTHON_SAMEFILE_"+tag+"="+
                        str(os.path.samefile(interpreter,alternative)).lower())
                  check=subprocess.run([str(alternative),"-B","-c","import sys;sys.exit(37)"],
                      capture_output=True,text=True,timeout=8,check=False)
                  print("AVAILABLE_CPANEL_PYTHON_"+tag+"_CLI="+
                        ("verified" if check.returncode==37 else "not_verified"))
                  if check.returncode==37:
                      otp=subprocess.run([str(alternative),"-B","-c",
                          "import importlib.util,sys;sys.exit(0 if importlib.util.find_spec('django_otp') else 44)"],
                          capture_output=True,text=True,timeout=8,check=False)
                      print("AVAILABLE_CPANEL_PYTHON_"+tag+"_OTP="+
                            ("installed" if otp.returncode==0 else
                             "missing" if otp.returncode==44 else "unknown"))
              probe=(
                  "import importlib.util,sys;"
                  "print('PASSENGER_EXEC_PYTHON_MINOR='+str(sys.version_info.major)+'.'+str(sys.version_info.minor));"
                  "print('PASSENGER_EXEC_DJANGO_PRESENT='+str(importlib.util.find_spec('django') is not None).lower());"
                  "print('PASSENGER_EXEC_DJANGO_OTP_PRESENT='+str(importlib.util.find_spec('django_otp') is not None).lower());"
                  "print('PASSENGER_EXEC_REST_FRAMEWORK_PRESENT='+str(importlib.util.find_spec('rest_framework') is not None).lower())"
              )
              try:
                  # Negative control: a real Python -c invocation MUST exit with 37.
                  # This detects executables/wrappers that silently ignore Python flags.
                  control=subprocess.run([str(interpreter),"-B","-c","import sys;sys.exit(37)"],
                                         capture_output=True,text=True,timeout=10,check=False)
                  valid_cli=(control.returncode==37)
                  print("PASSENGER_EXEC_PYTHON_CLI_CONTROL="+("passed" if valid_cli else "failed"))
                  if valid_cli:
                      otpcheck=subprocess.run([str(interpreter),"-B","-c",
                          "import importlib.util,sys;sys.exit(0 if importlib.util.find_spec('django_otp') else 44)"],
                          capture_output=True,text=True,timeout=10,check=False)
                      otp_state=("installed" if otpcheck.returncode==0 else
                                 "missing" if otpcheck.returncode==44 else "unverified")
                      print("PASSENGER_EXEC_OTP_MODULE="+otp_state)
                  result=subprocess.run([str(interpreter),"-B","-c",probe],capture_output=True,text=True,timeout=10,check=False)
                  print('PASSENGER_EXEC_PROBE_STDOUT_BYTES='+str(len(result.stdout.encode('utf8'))))
                  print('PASSENGER_EXEC_PROBE_STDERR_BYTES='+str(len(result.stderr.encode('utf8'))))
                  print('PASSENGER_EXEC_PROBE_EXIT_CATEGORY='+('zero' if result.returncode==0 else 'nonzero'))
                  lines=result.stdout.splitlines()
                  required=("PASSENGER_EXEC_PYTHON_MINOR=","PASSENGER_EXEC_DJANGO_PRESENT=",
                            "PASSENGER_EXEC_DJANGO_OTP_PRESENT=","PASSENGER_EXEC_REST_FRAMEWORK_PRESENT=")
                  if valid_cli and result.returncode==0 and len(lines)==len(required) and all(
                      line.startswith(prefix) for line,prefix in zip(lines,required)
                  ):
                      for line in lines:print(line)
                      print("PASSENGER_EXEC_IMPORT_PROBE=passed")
                  elif not valid_cli:
                      print("PASSENGER_EXEC_IMPORT_PROBE=python_cli_unverified")
                  elif result.returncode==0 and not lines:
                      print("PASSENGER_EXEC_IMPORT_PROBE=empty_output_not_verified")
                  else:print("PASSENGER_EXEC_IMPORT_PROBE=failed")
              except (OSError,subprocess.TimeoutExpired):
                  print("PASSENGER_EXEC_IMPORT_PROBE=unavailable")
          else:
              print("PASSENGER_EXEC_IMPORT_PROBE=not_configured")
          counts={"site_workers":0,"database_url_present":0,"sqlite_url":0,"other_url":0,"url_schema_verified":0}
          fds=set()
          validated=set()
          for pp in pathlib.Path("/proc").iterdir():
              if not pp.name.isdecimal():continue
              try:
                  if pp.stat().st_uid!=os.getuid():continue
                  cmd=(pp/"cmdline").read_bytes()[:4096].lower()
                  if not (b"python" in cmd or b"passenger" in cmd):continue
                  if pathlib.Path(os.readlink(pp/"cwd")).resolve()!=root:continue
                  counts["site_workers"]+=1
                  raw=(pp/"environ").read_bytes()[:128000]
                  env=dict(piece.split(b"=",1) for piece in raw.split(b"\x00") if b"=" in piece)
                  url=env.get(b"DATABASE_URL",b"")
                  if url:
                      counts["database_url_present"]+=1
                      if url.startswith(b"sqlite:////"):
                          counts["sqlite_url"]+=1
                          path=pathlib.Path(urllib.parse.unquote(url.decode("utf8","strict").split("?",1)[0][len("sqlite:///"):]))
                          if (path.is_absolute() and str(path).startswith("/home/zomorod2/")
                              and path.is_file() and not path.is_symlink()):
                              uri="file:"+urllib.parse.quote(str(path),safe="/")+"?mode=ro"
                              with sqlite3.connect(uri,uri=True,timeout=2) as db:
                                  n=db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
                                  integrity=db.execute("PRAGMA quick_check").fetchone()[0]
                              if n>=10 and integrity=="ok":
                                  validated.add(str(path.resolve()))
                                  counts["url_schema_verified"]+=1
                      else:counts["other_url"]+=1
                  try:
                      for fd in list((pp/"fd").iterdir())[:512]:
                          try: link=os.readlink(fd)
                          except OSError:continue
                          if link.endswith((" (deleted)",)):continue
                          if link.endswith((".sqlite3",".sqlite",".db")) and link.startswith("/home/zomorod2/"):
                              fds.add(os.path.realpath(link))
                  except OSError:pass
              except (OSError,ValueError,UnicodeError,sqlite3.Error):
                  continue
          for key in sorted(counts):
              print("PASSENGER_LIVE_"+key.upper()+"="+str(counts[key]))
          print("PASSENGER_LIVE_OPEN_SQLITE_FILES="+str(len(fds)))
          print("PASSENGER_LIVE_DISTINCT_VERIFIED_URL_DATABASES="+str(len(validated)))
          print("PASSENGER_LIVE_DB_LINKAGE="+("process_url_verified" if len(validated)==1 else "not_attested"))
          print("PASSENGER_RUNTIME_AUDIT=read_only")
          print("PRODUCTION_DEPLOY_ALLOWED=no")
          PY
          REMOTE
      - name: Inventory cPanel Passenger application mappings without changes
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 65s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import json,pathlib,subprocess
          candidates=(pathlib.Path("/usr/local/cpanel/bin/uapi"),pathlib.Path("/usr/bin/uapi"))
          binary=next((c for c in candidates if c.is_file()),None)
          if binary is None:
              print("CPANEL_PASSENGER_UAPI=unavailable")
              raise SystemExit(0)
          try:
              r=subprocess.run([str(binary),"--output=json","PassengerApps","list_applications"],
                  capture_output=True,text=True,timeout=35,check=False)
              obj=json.loads(r.stdout)
          except (OSError,ValueError,subprocess.TimeoutExpired):
              print("CPANEL_PASSENGER_UAPI=unparseable")
              raise SystemExit(0)
          print("CPANEL_PASSENGER_UAPI_COMMAND="+("success" if r.returncode==0 else "nonzero"))
          print("CPANEL_PASSENGER_UAPI_RESPONSE_KEYS="+
                ",".join(sorted(obj.keys())) if isinstance(obj,dict) else "nonobject")
          data=obj.get("data",[]) if isinstance(obj,dict) else []
          if isinstance(data,dict):
              print("CPANEL_PASSENGER_UAPI_DATA_KEYS="+",".join(sorted(data.keys())))
              data=next((v for v in data.values() if isinstance(v,list)),[])
          if not isinstance(data,list):
              print("CPANEL_PASSENGER_UAPI_SCHEMA=unexpected")
              raise SystemExit(0)
          print("CPANEL_REGISTERED_APPLICATIONS="+str(len(data)))
          for item in data[:25]:
              if not isinstance(item,dict):continue
              domain=str(item.get("domain") or item.get("deployment_domain") or "")
              uri=str(item.get("base_uri") or item.get("base_url") or item.get("url") or "")
              path=str(item.get("path") or item.get("app_path") or item.get("application_path") or "")
              print("CPANEL_APPLICATION_FIELDS="+",".join(sorted(item.keys())))
              print("CPANEL_APPLICATION_ZOMOROD_DOMAIN="+str("zomorodmelal.ir" in domain).lower())
              print("CPANEL_APPLICATION_ROOT_BASE_URI="+str(uri in ("","/")).lower())
              print("CPANEL_APPLICATION_OFFICE_BASE_URI="+str(uri.rstrip("/") in ("/company/office","/business/office")).lower())
              print("CPANEL_APPLICATION_LIVE_SAEIT_PATH="+str(path.rstrip("/").endswith("/Saeit")).lower())
          print("CPANEL_PASSENGER_UAPI_AUDIT=read_only")
          PY
          REMOTE
