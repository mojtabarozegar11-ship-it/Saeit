name: Publish Zomorod Melal education path
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amozeshgah-alias-deploy.yml"
permissions:
  contents: read
concurrency:
  group: amozeshgah-publication
  cancel-in-progress: false
jobs:
  publish-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/amozeshgah-publish"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Verify current home and education page before deployment
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-publish"
          home_code="$(curl -sS --max-time 25 -o "$work/home-before.html" -w '%{http_code}' https://zomorodmelal.ir/)"
          education_code="$(curl -sS --max-time 25 -o "$work/education-before.html" -w '%{http_code}' https://zomorodmelal.ir/education/)"
          test "$home_code" = "200"
          test "$education_code" = "200"
          grep -Eiq '<title>[^<]*آموزش' "$work/education-before.html"
          echo "PRE_DEPLOY_HOME_HTTP=$home_code"
          echo "PRE_DEPLOY_EDUCATION_HTTP=$education_code"
      - name: Add reversible canonical-path rewrite
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          result="$(ssh -F "$RUNNER_TEMP/amozeshgah-publish/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/zomorod2/public_html
          file="$root/.htaccess"
          marker="# BEGIN ZM AMOZESHGHAH PATH"
          test -d "$root" && test -w "$root" && test -f "$file" && ! test -L "$file"
          if grep -Fq "$marker" "$file"; then
            echo "ALIAS_ALREADY_PRESENT"
            exit 0
          fi
          backup_dir="$HOME/.backups/zomorodmelal-amozeshgah"
          install -d -m 700 "$backup_dir"
          backup="$backup_dir/htaccess.$(date -u +%Y%m%dT%H%M%SZ)"
          cp -p "$file" "$backup"
          chmod 600 "$backup"
          cat >> "$file" <<'RULES'

          # BEGIN ZM AMOZESHGHAH PATH
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule ^amozeshgah/?$ /education/ [L]
          </IfModule>
          # END ZM AMOZESHGHAH PATH
          RULES
          echo "BACKUP_FILE=$backup"
          echo "ALIAS_RULE_WRITTEN=yes"
          REMOTE
          )"
          printf '%s\n' "$result"
          backup="$(printf '%s\n' "$result" | sed -n 's/^BACKUP_FILE=//p')"
          if ! printf '%s\n' "$result" | grep -q '^ALIAS_RULE_WRITTEN=yes$' && ! printf '%s\n' "$result" | grep -q '^ALIAS_ALREADY_PRESENT$'; then
            exit 1
          fi
          printf 'backup=%s\n' "$backup" >> "$GITHUB_OUTPUT"
      - name: Verify canonical URL and existing site health
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-publish"
          set +e
          alias_code="$(curl -sS --max-time 25 -o "$work/amozeshgah-after.html" -w '%{http_code}' https://zomorodmelal.ir/amozeshgah/)"
          education_code="$(curl -sS --max-time 25 -o "$work/education-after.html" -w '%{http_code}' https://zomorodmelal.ir/education/)"
          home_code="$(curl -sS --max-time 25 -o "$work/home-after.html" -w '%{http_code}' https://zomorodmelal.ir/)"
          set -e
          if [ "$alias_code" != "200" ] || [ "$education_code" != "200" ] || [ "$home_code" != "200" ] || ! grep -Eiq '<title>[^<]*آموزش' "$work/amozeshgah-after.html"; then
            echo "POST_DEPLOY_CHECK_FAILED alias=$alias_code education=$education_code home=$home_code"
            backup="${{ steps.publish.outputs.backup }}"
            if [ -n "$backup" ]; then
              ssh -F "$work/config" saeit-cpanel "set -euo pipefail; cp -p '$backup' /home/zomorod2/public_html/.htaccess; echo ROLLBACK_COMPLETED=yes"
            fi
            exit 1
          fi
          echo "AMOZESHGHAH_HTTP=$alias_code"
          echo "EDUCATION_HTTP=$education_code"
          echo "HOME_HTTP=$home_code"
          grep -Eio '<title>[^<]*</title>' "$work/amozeshgah-after.html" | head -1
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/amozeshgah-publish"
