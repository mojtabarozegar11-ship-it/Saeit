name: Publish Zomorod Melal education path
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amozeshgah-alias-deploy.yml"
permissions:
  contents: read
concurrency:
  group: amozeshgah-publication
  cancel-in-progress: false
jobs:
  publish-education-page:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/amozeshgah-publish"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
      - name: Prepare a canonical copy of the live education page
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-publish"
          home_code="$(curl -sS --max-time 25 -o "$work/home-before.html" -w '%{http_code}' https://zomorodmelal.ir/)"
          education_code="$(curl -sS --max-time 25 -o "$work/education-before.html" -w '%{http_code}' https://zomorodmelal.ir/education/)"
          test "$home_code" = "200"
          test "$education_code" = "200"
          python3 - "$work/education-before.html" "$work/index.html" <<'PY'
          import re,sys
          source=open(sys.argv[1],encoding="utf-8").read()
          html=source.replace("https://zomorodmelal.ir/education/","https://zomorodmelal.ir/amozeshgah/")
          html=html.replace("http://zomorodmelal.ir/education/","https://zomorodmelal.ir/amozeshgah/")
          html=html.replace("/education/","/amozeshgah/")
          if not re.search(r"<title>[^<]*آموزش",html,re.I):
              raise SystemExit("Education page title was not found")
          if 'rel="canonical"' not in html and "rel='canonical'" not in html:
              html=re.sub(r"(<head\\b[^>]*>)",r'\\1\n<link rel="canonical" href="https://zomorodmelal.ir/amozeshgah/">',html,count=1,flags=re.I)
          if "https://zomorodmelal.ir/amozeshgah/" not in html:
              raise SystemExit("Canonical education URL was not set")
          open(sys.argv[2],"w",encoding="utf-8").write(html)
          print(f"EDUCATION_SNAPSHOT_BYTES={len(html.encode('utf-8'))}")
          print("EDUCATION_SNAPSHOT_TITLE=verified")
          PY
          echo "PRE_DEPLOY_HOME_HTTP=$home_code"
          echo "PRE_DEPLOY_EDUCATION_HTTP=$education_code"
      - name: Publish the snapshot into the empty public path
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-publish"
          target="/home/zomorod2/public_html/amozeshgah"
          stage="/home/zomorod2/public_html/.amozeshgah-stage-$GITHUB_SHA"
          ssh -F "$work/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/zomorod2/public_html
          target="$root/amozeshgah"
          test -d "$root" && test -w "$root"
          if test -e "$target" || test -L "$target"; then
            test -f "$target/index.html"
            grep -Fq 'https://zomorodmelal.ir/amozeshgah/' "$target/index.html"
            echo ALREADY_PUBLISHED=yes
          fi
          REMOTE
          if ssh -F "$work/config" saeit-cpanel "test -e '$target' || test -L '$target'"; then
            echo "PUBLISH_STATE=already-present"
            exit 0
          fi
          ssh -F "$work/config" saeit-cpanel "set -euo pipefail; test ! -e '$stage'; mkdir -m 700 '$stage'"
          if ! ssh -F "$work/config" saeit-cpanel "cat > '$stage/index.html' && chmod 644 '$stage/index.html' && chmod 755 '$stage'" < "$work/index.html"; then
            ssh -F "$work/config" saeit-cpanel "rm -rf '$stage'"
            exit 1
          fi
          sha="$(sha256sum "$work/index.html" | awk '{print $1}')"
          remote_sha="$(ssh -F "$work/config" saeit-cpanel "sha256sum '$stage/index.html' | awk '{print \\$1}')"
          test "$sha" = "$remote_sha"
          ssh -F "$work/config" saeit-cpanel "set -euo pipefail; test ! -e '$target' && mv '$stage' '$target'; echo PUBLISH_STATE=created"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Verify public URL and preserve existing site health
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amozeshgah-publish"
          set +e
          alias_code="$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$work/amozeshgah-after.html" -w '%{http_code}' https://zomorodmelal.ir/amozeshgah/)"
          education_code="$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o "$work/education-after.html" -w '%{http_code}' https://zomorodmelal.ir/education/)"
          home_code="$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o "$work/home-after.html" -w '%{http_code}' https://zomorodmelal.ir/)"
          set -e
          if [ "$alias_code" != "200" ] || [ "$education_code" != "200" ] || [ "$home_code" != "200" ] || ! grep -Eiq '<title>[^<]*آموزش' "$work/amozeshgah-after.html" || ! grep -Fq 'https://zomorodmelal.ir/amozeshgah/' "$work/amozeshgah-after.html"; then
            echo "POST_DEPLOY_CHECK_FAILED alias=$alias_code education=$education_code home=$home_code"
            backup="/home/zomorod2/.backups/zomorodmelal-amozeshgah/failed-$GITHUB_SHA"
            ssh -F "$work/config" saeit-cpanel "if test -d /home/zomorod2/public_html/amozeshgah; then install -d -m 700 /home/zomorod2/.backups/zomorodmelal-amozeshgah; mv /home/zomorod2/public_html/amozeshgah '$backup'; fi; echo ROLLBACK_COMPLETED=yes"
            exit 1
          fi
          echo "AMOZESHGHAH_HTTP=$alias_code"
          echo "EDUCATION_HTTP=$education_code"
          echo "HOME_HTTP=$home_code"
          grep -Eio '<title>[^<]*</title>' "$work/amozeshgah-after.html" | head -1
          grep -Eio '<link rel="canonical"[^>]*>' "$work/amozeshgah-after.html" | head -1
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/amozeshgah-publish"
