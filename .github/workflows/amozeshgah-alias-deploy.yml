name: Publish Zomorod Melal education path
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amozeshgah-alias-deploy.yml"
      - "public/amozeshgah/index.html"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amozeshgah-publication
  cancel-in-progress: false
jobs:
  publish-education-page:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the reviewed page source
        uses: actions/checkout@v4

      - name: Validate page source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          path = Path("public/amozeshgah/index.html")
          source = path.read_text(encoding="utf-8")
          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.canonical = False
                  self.rtl = False
                  self.h1 = False
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "html":
                      self.rtl = values.get("lang") == "fa" and values.get("dir") == "rtl"
                  if tag == "title":
                      self.title = True
                  if tag == "link" and values.get("rel") == "canonical":
                      self.canonical = values.get("href") == "https://zomorodmelal.ir/amozeshgah/"
                  if tag == "h1":
                      self.h1 = True
          check = PageCheck()
          check.feed(source)
          if not all((check.title, check.canonical, check.rtl, check.h1)):
              raise SystemExit("Page is missing title, canonical URL, Persian RTL metadata, or main heading")
          if len(source.encode("utf-8")) < 12000:
              raise SystemExit("Education page source is unexpectedly small")
          if "<style>" not in source or "prefers-reduced-motion" not in source:
              raise SystemExit("Self-contained responsive styles are missing")
          if "saeit-zomorod-education-managed-v2" not in source or source.count('<img class="') < 13:
              raise SystemExit("Managed page marker or subject photographs are missing")
          if source.count('class="offer-cta"') != 4 or "border:6px double var(--gold)" not in source:
              raise SystemExit("Product inquiry links or the thick gold frame are missing")
          print("PAGE_SOURCE_VALIDATION=passed")
          print(f"PAGE_BYTES={len(source.encode('utf-8'))}")
          PY

      - name: Prepare pinned VPS relay and cPanel SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/amozeshgah-publish"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"

      - name: Back up and atomically replace only the academy page
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/amozeshgah-publish"
          expected_sha="$(sha256sum public/amozeshgah/index.html | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$expected_sha" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          commit_sha="$2"
          root=/home/zomorod2/public_html
          target="$root/amozeshgah"
          stage="$root/.amozeshgah-stage-$commit_sha"
          backup="$HOME/.backups/zomorodmelal-amozeshgah/index-$commit_sha"
          test -d "$root" && test "$(stat -c %U "$root")" = "zomorod2" && test -w "$root"
          test -d "$target" && test ! -L "$target"
          test -f "$target/index.html" && test ! -L "$target/index.html"
          grep -Fq '<title>آموزشگاه زمرد ملل | از یادگیری تا مهارت</title>' "$target/index.html"
          grep -Fq 'https://zomorodmelal.ir/amozeshgah/' "$target/index.html"
          install -d -m 700 "$HOME/.backups/zomorodmelal-amozeshgah"
          test ! -e "$backup"
          test ! -e "$stage" && mkdir -m 700 "$stage" && mkdir -m 700 "$stage/assets"
          cp -p "$target/index.html" "$backup"
          cmp -s "$target/index.html" "$backup"
          echo ACADEMY_PREVIOUS_VERSION_BACKED_UP=yes
          REMOTE
          tar -C public/amozeshgah -czf - index.html | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C /home/zomorod2/public_html/.amozeshgah-stage-$GITHUB_SHA"
          assets="$d/assets"
          install -d -m 700 "$assets"
          for image in academy education-detail research knowledge agriculture industry ai economy; do cp "core/static/site/heroes/$image.webp" "$assets/$image.webp"; done
          printf "%s\n" "zomorod-education-assetset-v1" > "$assets/.managed-marker"
          tar -C "$assets" -czf - . | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C /home/zomorod2/public_html/.amozeshgah-stage-$GITHUB_SHA/assets"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$expected_sha" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          commit_sha="$2"
          root=/home/zomorod2/public_html
          target="$root/amozeshgah"
          stage="$root/.amozeshgah-stage-$commit_sha"
          test "$(sha256sum "$stage/index.html" | awk '{print $1}')" = "$expected_sha"
          asset_target="$target/assets/zomorod-education-v1"
          if test -e "$asset_target"; then
            test -d "$asset_target" && test ! -L "$asset_target"
            grep -Fqx "zomorod-education-assetset-v1" "$asset_target/.managed-marker"
            for image in academy education-detail research knowledge agriculture industry ai economy; do cmp -s "$stage/assets/$image.webp" "$asset_target/$image.webp"; done
          else
            mkdir -p "$target/assets"
            test ! -L "$target/assets"
            mv -T "$stage/assets" "$asset_target"
          fi
          chmod 644 "$stage/index.html"
          mv -T "$stage/index.html" "$target/index.html"
          rmdir "$stage"
          test "$(sha256sum "$target/index.html" | awk '{print $1}')" = "$expected_sha"
          echo ACADEMY_INDEX_ATOMICALLY_REPLACED=yes
          REMOTE

      - name: Verify academy page and images, rolling back on failure
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/amozeshgah-publish"
          expected_sha="$(sha256sum public/amozeshgah/index.html | awk '{print $1}')"
          html="$d/amozeshgah-after.html"
          result="$(curl --silent --show-error --location --retry 2 --retry-delay 1 --max-time 40 -H 'Cache-Control: no-cache' -o "$html" -w '%{http_code}|%{content_type}' https://zomorodmelal.ir/amozeshgah/ || true)"
          code="${result%%|*}"
          content_type="${result#*|}"
          valid=1
          if [ "$code" != "200" ] || [[ "$content_type" != text/html* ]]; then valid=0; fi
          if ! grep -Fq 'saeit-zomorod-education-managed-v2' "$html" || ! grep -Fq 'id="tracks"' "$html" || ! grep -Fq 'id="catalog"' "$html"; then valid=0; fi
          for image in academy education-detail research knowledge agriculture industry ai economy; do
            image_result="$(curl --silent --show-error --location --retry 1 --max-time 30 -o /dev/null -w '%{http_code}|%{content_type}' "https://zomorodmelal.ir/amozeshgah/assets/zomorod-education-v1/$image.webp" || true)"
            image_code="${image_result%%|*}"
            image_type="${image_result#*|}"
            printf 'ACADEMY_IMAGE_CHECK %s result=%s\n' "$image" "$image_result"
            if [ "$image_code" != "200" ] || [[ "$image_type" != image/* ]]; then valid=0; fi
          done
          if [ "$valid" -ne 1 ]; then
            echo "PUBLIC_CHECK_FAILED status=$code content_type=$content_type"
            ssh -F "$d/config" saeit-cpanel bash -se -- "$expected_sha" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          commit_sha="$2"
          target=/home/zomorod2/public_html/amozeshgah/index.html
          backup="$HOME/.backups/zomorodmelal-amozeshgah/index-$commit_sha"
          if test -f "$target" && test "$(sha256sum "$target" | awk '{print $1}')" = "$expected_sha" && test -s "$backup"; then
            mv -T "$backup" "$target"
            test -s "$target"
            echo ACADEMY_UPDATE_ROLLED_BACK=yes
          else
            echo ACADEMY_ROLLBACK_SKIPPED_TARGET_CHANGED=yes
          fi
          stage="/home/zomorod2/public_html/.amozeshgah-stage-$commit_sha"
          test ! -d "$stage" || rm -rf -- "$stage"
          REMOTE
            exit 1
          fi
          echo "AMOZESHGHAH_HTTP=$code"
          echo "CONTENT_TYPE=$content_type"
          echo "ACADEMY_IMAGES_VALIDATION=passed"
          echo "PUBLIC_HTML_VALIDATION=passed"
          grep -Eio '<title>[^<]*</title>' "$html" | head -1
          grep -Eio '<link rel="canonical"[^>]*>' "$html" | head -1

      - name: Remove temporary SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/amozeshgah-publish"
