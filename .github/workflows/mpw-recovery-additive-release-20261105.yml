name: MPW recovery additive release (guarded)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Guarded operation"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - publish_additive
          - verify
          - chain_audit
          - capture_preflight
          - capture_publish
          - capture_verify
          - capture_copy_audit
          - capture_copy_clarify
          - capture_runtime_probe
          - capture_activate_passenger
          - capture_traffic_audit
          - capture_funnel_preflight
          - capture_funnel_publish
          - capture_funnel_verify
          - capture_funnel_report
          - capture_store_demo_publish
          - capture_atelier_visual_publish
          - capture_product879_details_publish
          - capture_checkout_truth_copy_publish
          - capture_email_gate_preflight
          - capture_email_gate_publish
          - capture_email_gate_verify
          - capture_catalog_truth_audit
          - capture_catalog_truth_publish
          - capture_catalog_truth_verify

permissions:
  contents: read

concurrency:
  group: mpw-recovery-additive-release
  cancel-in-progress: false

jobs:
  guarded-release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mpw-recovery-01-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release source locally
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mpw_recovery_guarded_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            core/guest_recovery_models.py \
            core/migrations/0049_mpw_guest_email_recovery.py \
            scripts/mpw_paid_chain_recheck_readonly_20261105.py \
            scripts/f41_tron_mainnet_check.py \
            scripts/f41_merchant_audit_cli.py
          grep -q 'def publish_additive' scripts/mpw_recovery_guarded_release_20261105.py
          grep -q 'EMAIL_ENABLED=FALSE' scripts/mpw_recovery_guarded_release_20261105.py
          echo MPW_ADDITIVE_RELEASE_SOURCE_VALID=PASS

      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"

      - name: Transfer reviewed release bundle to private temporary staging
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "umask 077; rm -rf -- '$stage'; mkdir -p -- '$stage'"
          tar -C "$GITHUB_WORKSPACE" -czf - \
            scripts/mpw_recovery_guarded_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            core/guest_recovery_models.py \
            core/migrations/0049_mpw_guest_email_recovery.py \
            core/management/commands/mpw_purge_recovery_ephemeral.py \
            scripts/mpw_paid_chain_recheck_readonly_20261105.py \
            scripts/f41_tron_mainnet_check.py \
            scripts/f41_merchant_audit_cli.py \
          | timeout 45s ssh -T -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          case "$OPERATION" in
            preflight)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' preflight '$stage'"
              ;;
            publish_additive)
              timeout 180s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' publish_additive '$stage' '$GITHUB_RUN_ID'"
              ;;
            verify)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' verify"
              ;;
            chain_audit)
              timeout 85s ssh -T -F "$d/config" saeit-cpanel "MPW_READONLY_CHAIN_ACK=mpw-existing-paid-trx-readonly-20261105 PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_paid_chain_recheck_readonly_20261105.py'"
              ;;
          esac

      - name: Remove temporary release bundle only
        if: always()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "rm -rf -- '$stage'" || true
          rm -rf -- "$d"

  capture-only-release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/fix/mpw-guest-order-claim-only-20261105' && startsWith(inputs.operation, 'capture_')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate guarded capture-only source and rollback behavior locally
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mpw_guest_order_email_claim_scope_20261105.py' -v
          python3 -m unittest discover -s tests -p 'test_mpw_capture_guarded_release_20261105.py' -v
          python3 -m unittest discover -s tests -p 'test_mpw_required_email_checkout_20261106.py' -v
          case "${{ inputs.operation }}" in
            capture_email_gate_*|capture_catalog_truth_*) echo MPW_LEGACY_FUNNEL_RELEASE_GATE=SKIPPED_FOR_NEW_EMAIL_ONLY_RELEASE ;;
            *) python3 -m unittest discover -s tests -p 'test_mpw_private_funnel_*.py' -v ;;
          esac
          python3 -m py_compile scripts/mpw_guest_email_claim_capture_release_20261105.py services/mpw_trx_guest_commerce.py services/mpw_trx_email_recovery.py scripts/mpw_checkout_copy_clarity_release_20261106.py scripts/mpw_runtime_copy_probe_20261106.py scripts/mpw_live_passenger_refresh_20261106.py scripts/mpw_store_access_funnel_readonly_20261106.py services/mpw_checkout_funnel.py scripts/mpw_private_funnel_guarded_release_20261106.py scripts/mpw_checkout_funnel_report_readonly_20261106.py scripts/mpw_store_demo_guarded_release_20261106.py scripts/mpw_store_atelier_visual_guarded_release_20261106.py scripts/mpw_store_product879_details_guarded_release_20261106.py scripts/mpw_checkout_truth_copy_guarded_release_20261106.py scripts/mpw_required_email_guarded_release_20261106.py scripts/mpw_catalog_truth_guarded_release_20261106.py
          python3 scripts/mpw_store_demo_guarded_release_20261106.py selftest
          python3 scripts/mpw_store_atelier_visual_guarded_release_20261106.py selftest
          python3 scripts/mpw_store_product879_details_guarded_release_20261106.py selftest
          python3 scripts/mpw_checkout_truth_copy_guarded_release_20261106.py selftest
          python3 scripts/mpw_store_access_funnel_readonly_20261106.py selftest
          echo MPW_CAPTURE_ONLY_CODE_AND_ROLLBACK_CHECKS=PASS

      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"


      - name: Execute guarded capture-only cPanel operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-claim-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "umask 077; mkdir -m 700 -- '$stage'"
          tar -C "$GITHUB_WORKSPACE" -czf - \
            scripts/mpw_guest_email_claim_capture_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            scripts/mpw_checkout_email_copy_readonly_20261105.py \
            scripts/mpw_checkout_copy_clarity_release_20261106.py \
            scripts/mpw_runtime_copy_probe_20261106.py \
            scripts/mpw_live_passenger_refresh_20261106.py \
            scripts/mpw_store_access_funnel_readonly_20261106.py \
            scripts/mpw_private_funnel_guarded_release_20261106.py \
            scripts/mpw_checkout_funnel_report_readonly_20261106.py \
            scripts/mpw_store_demo_guarded_release_20261106.py \
            scripts/mpw_store_atelier_visual_guarded_release_20261106.py \
            scripts/mpw_store_product879_details_guarded_release_20261106.py \
            scripts/mpw_checkout_truth_copy_guarded_release_20261106.py \
            scripts/mpw_required_email_guarded_release_20261106.py \
            scripts/mpw_catalog_truth_guarded_release_20261106.py \
            services/mpw_checkout_funnel.py \
          | timeout 45s ssh -T -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          case "$OPERATION" in
            capture_preflight)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_guest_email_claim_capture_release_20261105.py' preflight '$stage'"
              ;;
            capture_publish)
              timeout 180s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_guest_email_claim_capture_release_20261105.py' publish '$stage' '$GITHUB_RUN_ID'"
              ;;
            capture_verify)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_guest_email_claim_capture_release_20261105.py' verify '$stage'"
              ;;
            capture_copy_audit)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_checkout_email_copy_readonly_20261105.py'"
              ;;
            capture_copy_clarify)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_checkout_copy_clarity_release_20261106.py' publish '$GITHUB_RUN_ID'"
              ;;
            capture_runtime_probe)
              timeout 80s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_runtime_copy_probe_20261106.py'"
              ;;
            capture_activate_passenger)
              timeout 115s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_live_passenger_refresh_20261106.py' activate"
              ;;
            capture_traffic_audit)
              timeout 100s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_access_funnel_readonly_20261106.py'"
              ;;
            capture_funnel_preflight)
              timeout 100s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_private_funnel_guarded_release_20261106.py' preflight '$stage'"
              ;;
            capture_funnel_publish)
              timeout 150s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_private_funnel_guarded_release_20261106.py' publish '$stage' '$GITHUB_RUN_ID'"
              ;;
            capture_funnel_verify)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_private_funnel_guarded_release_20261106.py' verify"
              ;;
            capture_funnel_report)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_checkout_funnel_report_readonly_20261106.py'"
              ;;
            capture_store_demo_publish)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_demo_guarded_release_20261106.py' preflight"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_demo_guarded_release_20261106.py' publish '$GITHUB_RUN_ID'"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_demo_guarded_release_20261106.py' verify '$GITHUB_RUN_ID'"
              ;;
            capture_atelier_visual_publish)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_atelier_visual_guarded_release_20261106.py' preflight"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_atelier_visual_guarded_release_20261106.py' publish '$GITHUB_RUN_ID'"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_atelier_visual_guarded_release_20261106.py' verify '$GITHUB_RUN_ID'"
              ;;
            capture_product879_details_publish)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_product879_details_guarded_release_20261106.py' preflight"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_product879_details_guarded_release_20261106.py' publish '$GITHUB_RUN_ID'"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_store_product879_details_guarded_release_20261106.py' verify '$GITHUB_RUN_ID'"
              ;;
            capture_checkout_truth_copy_publish)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_checkout_truth_copy_guarded_release_20261106.py' preflight"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_checkout_truth_copy_guarded_release_20261106.py' publish '$GITHUB_RUN_ID'"
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_checkout_truth_copy_guarded_release_20261106.py' verify"
              ;;
            capture_email_gate_preflight)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_required_email_guarded_release_20261106.py' preflight '$stage'"
              ;;
            capture_email_gate_publish)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_required_email_guarded_release_20261106.py' publish '$stage' '$GITHUB_RUN_ID'"
              ;;
            capture_email_gate_verify)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_required_email_guarded_release_20261106.py' verify"
              ;;
            capture_catalog_truth_audit)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_catalog_truth_guarded_release_20261106.py' audit"
              ;;
            capture_catalog_truth_publish)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_catalog_truth_guarded_release_20261106.py' publish '$GITHUB_RUN_ID'"
              ;;
            capture_catalog_truth_verify)
              timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_catalog_truth_guarded_release_20261106.py' verify"
              ;;
            *)
              exit 9
              ;;
          esac

      - name: Remove capture-only temporary stage
        if: always()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-claim-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if test -f "$d/config"; then
            timeout 30s ssh -T -F "$d/config" saeit-cpanel "test -d '$stage' && rm -r -- '$stage' || true" || true
            rm -r -- "$d" || true
          fi
