name: MPW recovery additive release (guarded)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Guarded operation"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - publish_additive
          - verify
          - chain_audit
          - activate

permissions:
  contents: read

concurrency:
  group: mpw-recovery-additive-release
  cancel-in-progress: false

jobs:
  guarded-release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mpw-recovery-01-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release source locally
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mpw_recovery_guarded_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            core/guest_recovery_models.py \
            core/migrations/0049_mpw_guest_email_recovery.py \
            scripts/mpw_paid_chain_recheck_readonly_20261105.py \
            scripts/f41_tron_mainnet_check.py \
            scripts/f41_merchant_audit_cli.py
          grep -q 'def publish_additive' scripts/mpw_recovery_guarded_release_20261105.py
          grep -q 'EMAIL_ENABLED=FALSE' scripts/mpw_recovery_guarded_release_20261105.py
          echo MPW_ADDITIVE_RELEASE_SOURCE_VALID=PASS

      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"

      - name: Transfer reviewed release bundle to private temporary staging
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "umask 077; rm -rf -- '$stage'; mkdir -p -- '$stage'"
          tar -C "$GITHUB_WORKSPACE" -czf - \
            scripts/mpw_recovery_guarded_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            core/guest_recovery_models.py \
            core/migrations/0049_mpw_guest_email_recovery.py \
            core/management/commands/mpw_purge_recovery_ephemeral.py \
            scripts/mpw_paid_chain_recheck_readonly_20261105.py \
            scripts/f41_tron_mainnet_check.py \
            scripts/f41_merchant_audit_cli.py \
          | timeout 45s ssh -T -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          case "$OPERATION" in
            preflight)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' preflight '$stage'"
              ;;
            publish_additive)
              timeout 180s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' publish_additive '$stage' '$GITHUB_RUN_ID'"
              ;;
            verify)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' verify"
              ;;
            chain_audit)
              timeout 85s ssh -T -F "$d/config" saeit-cpanel "MPW_READONLY_CHAIN_ACK=mpw-existing-paid-trx-readonly-20261105 PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_paid_chain_recheck_readonly_20261105.py'"
              ;;
            activate)
              timeout 180s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' activate '$GITHUB_RUN_ID'"
              ;;
          esac

      - name: Remove temporary release bundle only
        if: always()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "rm -rf -- '$stage'" || true
          rm -rf -- "$d"
