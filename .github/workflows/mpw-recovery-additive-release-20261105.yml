name: MPW recovery additive release (guarded)

on:
  pull_request:
    branches: [integration/mpw-recovery-main-20261107]
    paths:
      - .github/workflows/mpw-recovery-additive-release-20261105.yml
      - scripts/mpw_recovery_guarded_release_20261105.py
      - tests/test_mpw_recovery_guarded_release_20261105.py
      - services/mpw_trx_email_recovery.py
      - services/mpw_trx_guest_commerce.py
      - core/guest_recovery_models.py
      - core/migrations/0049_mpw_guest_email_recovery.py
      - core/management/commands/mpw_purge_recovery_ephemeral.py
  workflow_dispatch:
    inputs:
      operation:
        description: "Guarded operation"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - publish_additive
          - verify

permissions:
  contents: read

concurrency:
  group: mpw-recovery-additive-release
  cancel-in-progress: false

jobs:
  integrated-source-contract:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'pull_request' && github.base_ref == 'integration/mpw-recovery-main-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate exact integrated recovery source, no secrets or production access
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_recovery_guarded_release_20261105.py services/mpw_trx_email_recovery.py services/mpw_trx_guest_commerce.py core/guest_recovery_models.py core/migrations/0049_mpw_guest_email_recovery.py
          python3 - <<'PY'
          import hashlib, importlib.util, pathlib
          release_path = pathlib.Path('scripts/mpw_recovery_guarded_release_20261105.py')
          spec = importlib.util.spec_from_file_location('mpw_recovery_release_contract', release_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for key, expected in module.SOURCE_DIGESTS.items():
              source = pathlib.Path(module.FILES[key]).read_bytes()
              assert hashlib.sha256(source).hexdigest() == expected, 'UNREVIEWED_SOURCE:' + key
          recovery_source = pathlib.Path('services/mpw_trx_email_recovery.py').read_text('utf-8')
          assert 'def _recovery_enabled():' in recovery_source
          assert 'MPW_GUEST_RECOVERY_EMAIL_APPROVED' in recovery_source
          assert 'MPW_GUEST_RECOVERY_ENABLED' in recovery_source
          print('MPW_INTEGRATED_RECOVERY_PINS=5/5')
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_mpw_recovery_guarded_release_20261105.py' -v
          echo MPW_INTEGRATED_RECOVERY_CONTRACT=PASS
  guarded-release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/integration/mpw-recovery-main-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release source locally
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/mpw_recovery_guarded_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            core/guest_recovery_models.py \
            core/migrations/0049_mpw_guest_email_recovery.py
          grep -q 'def publish_additive' scripts/mpw_recovery_guarded_release_20261105.py
          grep -q 'EMAIL_ENABLED=FALSE' scripts/mpw_recovery_guarded_release_20261105.py
          grep -q 'def _recovery_enabled' services/mpw_trx_email_recovery.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_mpw_recovery_guarded_release_20261105.py' -v
          echo MPW_ADDITIVE_RELEASE_SOURCE_VALID=PASS

      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"

      - name: Transfer reviewed release bundle to private temporary staging
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "umask 077; rm -rf -- '$stage'; mkdir -p -- '$stage'"
          tar -C "$GITHUB_WORKSPACE" -czf - \
            scripts/mpw_recovery_guarded_release_20261105.py \
            services/mpw_trx_email_recovery.py \
            services/mpw_trx_guest_commerce.py \
            core/guest_recovery_models.py \
            core/migrations/0049_mpw_guest_email_recovery.py \
            core/management/commands/mpw_purge_recovery_ephemeral.py \
          | timeout 45s ssh -T -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'"
          case "$OPERATION" in
            preflight)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' preflight '$stage'"
              ;;
            publish_additive)
              timeout 180s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' publish_additive '$stage' '$GITHUB_RUN_ID'"
              ;;
            verify)
              timeout 120s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_recovery_guarded_release_20261105.py' verify"
              ;;
          esac

      - name: Remove temporary release bundle only
        if: always()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-recovery-release-ssh"
          stage="/home/zomorod2/.local/share/mpw-recovery-01-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel "rm -rf -- '$stage'" || true
          rm -rf -- "$d"
