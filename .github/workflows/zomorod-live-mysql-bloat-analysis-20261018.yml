name: Read-only live MySQL table bloat analysis
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-live-mysql-bloat-analysis-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-mysql-bloat-analysis
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read MySQL table sizes using temporary local client config with no leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess,tempfile,os,re,json,urllib.parse
          home=Path.home()
          assert str(home)=="/home/zomorod2"
          envfile=home/"Saeit-staging/.env"
          assert envfile.is_file()
          raw=next((line.split("=",1)[1].strip().strip("'\"") for line in envfile.read_text().splitlines() if line.startswith("DATABASE_URL=")),None)
          assert raw and "mysql" in raw
          parsed=urllib.parse.urlsplit(raw)
          db=parsed.path.strip("/")
          assert db=="zomorod2_sites_main"
          opts={"user":urllib.parse.unquote(parsed.username or ""), "password":urllib.parse.unquote(parsed.password or ""), "host":parsed.hostname or "localhost", "port":str(parsed.port or 3306)}
          assert opts["user"] and opts["password"]
          with tempfile.TemporaryDirectory(prefix=".mysql-readonly-",dir=str(home/".cagefs/tmp")) as tmp:
              optfile=Path(tmp)/"client.cnf"
              def esc(v):return '"'+str(v).replace("\\","\\\\").replace('"','\\"')+'"'
              optfile.write_text("[client]\n"+"".join(f"{k}={esc(v)}\n" for k,v in opts.items()))
              optfile.chmod(0o600)
              q="""SELECT TABLE_NAME,ENGINE,COALESCE(TABLE_ROWS,0),COALESCE(DATA_LENGTH,0),COALESCE(INDEX_LENGTH,0),COALESCE(DATA_FREE,0) FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_TYPE='BASE TABLE' ORDER BY DATA_LENGTH+INDEX_LENGTH DESC LIMIT 80"""
              cmd=["mysql","--defaults-extra-file="+str(optfile),"--batch","--skip-column-names","--raw",db,"--execute",q]
              result=subprocess.run(cmd,capture_output=True,text=True,timeout=45)
              if result.returncode!=0:
                  print("MYSQL_METADATA_ERROR="+str(result.returncode))
                  print("MYSQL_METADATA_CATEGORY="+("permission_denied" if "denied" in result.stderr.lower() else "connection_failed"))
              else:
                  allrows=[]
                  for line in result.stdout.splitlines():
                      cells=line.split("\t")
                      if len(cells)==6:
                          name,engine,count,data,idx,free=cells
                          allrows.append({"table":name,"engine":engine,"rows_estimate":int(count),"data_bytes":int(data),"index_bytes":int(idx),"data_free_bytes":int(free)})
                  print("LIVE_MYSQL_TABLES_RETRIEVED="+str(len(allrows)))
                  print("LIVE_MYSQL_TOP_50="+json.dumps(allrows[:50]))
                  print("MYSQL_TOTAL_DATA="+str(sum(x["data_bytes"] for x in allrows)))
                  print("MYSQL_TOTAL_INDEX="+str(sum(x["index_bytes"] for x in allrows)))
                  print("MYSQL_TOTAL_RECLAIMABLE_FREE="+str(sum(x["data_free_bytes"] for x in allrows)))
          print("MYSQL_METADATA_AUDIT_COMPLETE=yes")
          PY
          REMOTE
      - name: Read-only age and retention signals for dominant live tables
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess,tempfile,urllib.parse,json
          home=Path.home()
          envfile=home/"Saeit-staging/.env"
          raw=next((line.split("=",1)[1].strip().strip("'") for line in envfile.read_text().splitlines() if line.startswith("DATABASE_URL=")),None)
          parsed=urllib.parse.urlsplit(raw)
          db=parsed.path.strip("/")
          opts={"user":urllib.parse.unquote(parsed.username or ""), "password":urllib.parse.unquote(parsed.password or ""), "host":parsed.hostname or "localhost", "port":str(parsed.port or 3306)}
          with tempfile.TemporaryDirectory(prefix=".mysql-readonly-retention-",dir=str(home/".cagefs/tmp")) as tmp:
              optfile=Path(tmp)/"client.cnf"
              def esc(v): return '"' + str(v).replace("\\","\\\\").replace('"','\\"') + '"'
              optfile.write_text("[client]\n"+"".join("{}={}\n".format(k,esc(v)) for k,v in opts.items()))
              optfile.chmod(0o600)
              def q(sql):
                  r=subprocess.run(["mysql","--defaults-extra-file="+str(optfile),"--batch","--skip-column-names","--raw",db,"--execute",sql],capture_output=True,text=True,timeout=45,check=True)
                  return r.stdout.splitlines()
              tables=["core_agenttask","core_factoryevidence","core_report","core_auditlog"]
              cols={}
              sql="SELECT TABLE_NAME,COLUMN_NAME,DATA_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='"+db+"' AND TABLE_NAME IN ("+ ",".join("'"+t+"'" for t in tables)+") ORDER BY TABLE_NAME,ORDINAL_POSITION"
              for line in q(sql):
                  t,col,typ=line.split("\t")
                  cols.setdefault(t,[]).append({"column":col,"type":typ})
              print("RETENTION_TABLE_COLUMNS="+json.dumps(cols,separators=(",",":")),flush=True)
              for t in tables:
                  if t not in cols: continue
                  names=set(x["column"] for x in cols[t])
                  datecol=next((x for x in ("created_at","created","date_created","timestamp","updated_at","run_at","started_at") if x in names),None)
                  if not datecol:
                      print("RETENTION_SIGNAL="+t+":NO_DATE_COLUMN",flush=True); continue
                  row=q("SELECT MIN("+datecol+"),MAX("+datecol+"),COUNT(*) FROM "+t)[0].split("\t")
                  print("RETENTION_SIGNAL="+t+":DATE_COLUMN="+datecol+":MIN="+row[0]+":MAX="+row[1]+":ROWS="+row[2],flush=True)
                  for y in ("2024","2025","2026"):
                      nxt=str(int(y)+1)
                      count=q("SELECT COUNT(*) FROM "+t+" WHERE "+datecol+" >= '"+y+"-01-01' AND "+datecol+" < '"+nxt+"-01-01'")[0]
                      print("RETENTION_YEAR="+t+":"+y+":ROWS="+count,flush=True)
              if "core_agenttask" in cols and "status" in set(x["column"] for x in cols["core_agenttask"]):
                  print("AGENTTASK_STATUS_COUNTS="+json.dumps(q("SELECT COALESCE(status,'(null)'),COUNT(*) FROM core_agenttask GROUP BY status ORDER BY COUNT(*) DESC"),separators=(",",":")),flush=True)
              if "core_factoryevidence" in cols and "status" in set(x["column"] for x in cols["core_factoryevidence"]):
                  print("EVIDENCE_STATUS_COUNTS="+json.dumps(q("SELECT COALESCE(status,'(null)'),COUNT(*) FROM core_factoryevidence GROUP BY status ORDER BY COUNT(*) DESC"),separators=(",",":")),flush=True)
          print("MYSQL_RETENTION_AUDIT_COMPLETE=yes")
          PY
          REMOTE
      - name: Read-only stale evidence and orphan signals
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess,tempfile,urllib.parse
          home=Path.home(); envfile=home/"Saeit-staging/.env"
          raw=next((line.split("=",1)[1].strip().strip("'") for line in envfile.read_text().splitlines() if line.startswith("DATABASE_URL=")),None)
          parsed=urllib.parse.urlsplit(raw); db=parsed.path.strip("/")
          opts={"user":urllib.parse.unquote(parsed.username or ""), "password":urllib.parse.unquote(parsed.password or ""), "host":parsed.hostname or "localhost", "port":str(parsed.port or 3306)}
          with tempfile.TemporaryDirectory(prefix=".mysql-readonly-stale-",dir=str(home/".cagefs/tmp")) as tmp:
              optfile=Path(tmp)/"client.cnf"
              def esc(v): return '"' + str(v).replace("\\","\\\\").replace('"','\\"') + '"'
              optfile.write_text("[client]\n"+"".join("{}={}\n".format(k,esc(v)) for k,v in opts.items())); optfile.chmod(0o600)
              def q(sql): return subprocess.run(["mysql","--defaults-extra-file="+str(optfile),"--batch","--skip-column-names","--raw",db,"--execute",sql],capture_output=True,text=True,timeout=60,check=True).stdout.strip()
              queries={
                "EVIDENCE_VALID_UNTIL": "SELECT COUNT(*),SUM(status='stale'),SUM(valid_until IS NOT NULL AND valid_until < NOW()),MIN(valid_until),MAX(valid_until) FROM core_factoryevidence",
                "EVIDENCE_ORPHAN_TASK": "SELECT COUNT(*) FROM core_factoryevidence e LEFT JOIN core_agenttask t ON t.id=e.task_id WHERE e.task_id IS NOT NULL AND t.id IS NULL",
                "EVIDENCE_ORPHAN_RUN": "SELECT COUNT(*) FROM core_factoryevidence e LEFT JOIN core_factoryrun r ON r.id=e.run_id WHERE e.run_id IS NOT NULL AND r.id IS NULL",
                "EVIDENCE_DUP_DIGEST_GROUPS": "SELECT COUNT(*) FROM (SELECT prerequisite_digest FROM core_factoryevidence WHERE prerequisite_digest IS NOT NULL AND prerequisite_digest<>'' GROUP BY prerequisite_digest HAVING COUNT(*)>1) x",
                "EVIDENCE_DUP_DIGEST_ROWS": "SELECT COALESCE(SUM(n),0) FROM (SELECT COUNT(*) n FROM core_factoryevidence WHERE prerequisite_digest IS NOT NULL AND prerequisite_digest<>'' GROUP BY prerequisite_digest HAVING COUNT(*)>1) x",
                "TASK_PAYLOAD_BYTES": "SELECT COUNT(*),COALESCE(SUM(OCTET_LENGTH(input_data)+OCTET_LENGTH(output_data)+OCTET_LENGTH(goal)+OCTET_LENGTH(prerequisite_snapshot)+OCTET_LENGTH(output_contract)),0),COALESCE(MAX(OCTET_LENGTH(input_data)+OCTET_LENGTH(output_data)+OCTET_LENGTH(goal)+OCTET_LENGTH(prerequisite_snapshot)+OCTET_LENGTH(output_contract)),0) FROM core_agenttask",
                "REPORT_CONTENT_BYTES": "SELECT COUNT(*),COALESCE(SUM(OCTET_LENGTH(content)),0),COALESCE(MAX(OCTET_LENGTH(content)),0) FROM core_report"
              }
              for label,sql in queries.items(): print(label+"="+q(sql),flush=True)
          print("MYSQL_STALE_ORPHAN_AUDIT_COMPLETE=yes")
          PY
          REMOTE
      - name: Delete SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
# Continued read-only live storage audit; no write operations.
