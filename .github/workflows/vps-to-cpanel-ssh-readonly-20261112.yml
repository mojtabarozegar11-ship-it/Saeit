name: VPS to cPanel SSH read-only verification 20261112
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-to-cpanel-ssh-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' }}"
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 3
    steps:
      - name: Verify VPS to cPanel SSH on port 1396
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$HOST_KEY"
          d="$RUNNER_TEMP/vps-to-cpanel-ssh-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 30s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no -p 1396 zomorod2@zohal.pws-dns.net 'printf "CPANEL_SSH_AUTH_OK=1\\n"; printf "CPANEL_HOST=%s\\n" "$(hostname -f 2>/dev/null || hostname)"'
