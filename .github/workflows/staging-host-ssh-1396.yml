name: Staging Hosting SSH Fingerprint Verification
on:
  workflow_dispatch:
  push:
    branches: [factory/integration-control-bridge-20261005]
    paths: [.github/workflows/staging-host-ssh-1396.yml]
permissions:
  contents: read
jobs:
  verify-host:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify host key on port 1396 without bypassing checking
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KEY" || { echo "::error::Missing VPS SSH key"; exit 1; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 8 -t rsa 178.239.147.150 2>/dev/null > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1{print $2}')" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          chmod 600 ~/.ssh/known_hosts
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -euo pipefail
          host=zohal.pws-dns.net
          port=1396
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ssh-keyscan -T 8 -p "$port" -t ed25519 "$host" 2>/dev/null > "$tmp"
          test -s "$tmp" || { echo "HOST_KEY_SCAN=failed"; exit 1; }
          observed="$(ssh-keygen -lf "$tmp" -E sha256 | awk 'NR==1{print $2}')"
          expected="SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          if [ "$observed" != "$expected" ]; then echo "HOST_KEY_FINGERPRINT=mismatch"; exit 1; fi
          echo "HOST_KEY_FINGERPRINT=matches_previously_observed"
          # This is a network-key consistency test, not independent identity verification.
          # No private hosting key is present; SSH auth is intentionally not attempted.
          REMOTE
