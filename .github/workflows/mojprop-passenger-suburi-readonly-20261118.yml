name: "MOJ PROP — verify safe cPanel Passenger sub-URI slot (READ ONLY)"
on:
  push:
    branches: [audit/mojprop-passenger-safe-suburi-20261118]
permissions:
  contents: read
concurrency:
  group: mojprop-cpanel-readonly-python-slot-20261118
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only Python/cPanel inspection across verified owner relay
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${HOST_KEY:?MISSING_OWNER_PRIVATE_CPANEL_SSH_AUTH}"
          umask 077
          dir="$RUNNER_TEMP/mojprop-passenger-readonly"
          install -d -m 700 "$dir"
          trap 'rm -f -- "$dir/key" "$dir/known"; rmdir "$dir" 2>/dev/null || true' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();sys.stdout.write(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n")' > "$dir/key"
          chmod 600 "$dir/key"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$dir/known"
          test "$(ssh-keygen -lf "$dir/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 105s ssh -T -i "$dir/key" -p 1396 \
            -o UserKnownHostsFile="$dir/known" -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no \
            -o RequestTTY=no -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            zomorod2@178.239.147.125 \
            'test "$(id -un)" = zomorod2; PYTHONDONTWRITEBYTECODE=1 /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/mojprop_cpanel_passenger_suburi_readonly_20261118.py \
            | python3 -B -c 'import json,sys;d=sys.stdin.read(12000);rows=[x for x in d.splitlines() if x.startswith("MOJPROP_PASSENGER_SUBURI_PREFLIGHT=")];assert len(rows)==1,d[-1800:];v=json.loads(rows[0].split("=",1)[1]);print(rows[0]);assert v.get("reads_only") is True and v.get("customer_data_read") is False and v.get("site_rewrites_changed") is False'
          echo "TARGET_APP_SLOT_INSPECTED_NOT_REGISTERED=true"
