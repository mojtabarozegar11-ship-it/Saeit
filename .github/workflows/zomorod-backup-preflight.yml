name: Zomorod read-only backup preflight
on:
  push:
    branches:
      - codex/zomorod-backup-preflight
    paths:
      - .github/workflows/zomorod-backup-preflight.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-backup-preflight"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY_READY=yes"
      - name: Read-only storage, app, and database preflight
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-backup-preflight"
          ssh -F "$d/config" saeit-cpanel 'bash -s' <<'REMOTE'
          set -eu
          app="$HOME/Saeit"
          web="$HOME/public_html"
          printf 'CPANEL_HOME=%s\n' "$HOME"
          for p in "$app" "$web" "$HOME/Saeit-staging"; do
            if test -d "$p"; then
              printf 'PATH_PRESENT=%s\n' "$p"
              du -sb "$p" 2>/dev/null | awk '{print "TREE_BYTES="$1}' || echo "TREE_BYTES=unavailable"
              find "$p" -xdev -type f 2>/dev/null | wc -l | awk '{print "TREE_FILES="$1}'
              find "$p" -xdev -type l 2>/dev/null | wc -l | awk '{print "TREE_SYMLINKS="$1}'
            else
              printf 'PATH_PRESENT=no:%s\n' "$p"
            fi
          done
          df -Pk "$HOME" | tail -n 1 | awk '{print "DISK_TOTAL_KB="$2; print "DISK_USED_KB="$3; print "DISK_FREE_KB="$4}'
          if command -v quota >/dev/null 2>&1; then quota -s 2>/dev/null || echo "ACCOUNT_QUOTA=unavailable"; else echo "ACCOUNT_QUOTA=command_unavailable"; fi
          cpapi2_bin="$(command -v cpapi2 2>/dev/null || true)"
          if test -z "$cpapi2_bin" && test -x /usr/local/cpanel/bin/cpapi2; then cpapi2_bin=/usr/local/cpanel/bin/cpapi2; fi
          if test -n "$cpapi2_bin"; then
            "$cpapi2_bin" --output=json --user=zomorod2 DiskUsage fetchdiskusagewithextras 2>/dev/null | python3 -c 'import sys,json
          try:
              j=json.load(sys.stdin)
              rows=j.get("cpanelresult",{}).get("data",[])
              row=rows[0] if rows else {}
              for k,label in (("quotaused","CPANEL_QUOTA_USED_BYTES"),("quotalimit","CPANEL_QUOTA_LIMIT_BYTES"),("mysql","CPANEL_MYSQL_BYTES"),("pgsql","CPANEL_PGSQL_BYTES")):
                  v=row.get(k)
                  print(label+"="+(str(v) if isinstance(v,(int,float)) else "unlimited_or_unavailable"))
              print("CPANEL_DISK_API_RESULT="+str(j.get("cpanelresult",{}).get("event",{}).get("result","unknown")))
          except Exception: print("CPANEL_DISK_API=unparseable")' || echo "CPANEL_DISK_API=unavailable"
          else
            echo "CPANEL_DISK_API=command_unavailable"
          fi
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=json --user=zomorod2 StatsBar get_stats display=diskusage 2>/dev/null | python3 -c 'import sys,json
          def walk(v):
              if isinstance(v,dict):
                  labels=[v.get(k) for k in ("name","label","key","display_name","display")]
                  label=next((str(x) for x in labels if isinstance(x,str)), "")
                  if any(t in label.lower() for t in ("disk","quota","storage")):
                      vals=[v.get(k) for k in ("value","usage","limit","total","used","available")]
                      for x in vals:
                          if isinstance(x,(int,float,str)) and str(x).replace(".","",1).isdigit():
                              print("CPANEL_STAT_"+label.upper().replace(" ","_")+"="+str(x)); break
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(json.load(sys.stdin))' || echo "CPANEL_DISK_STATS=unavailable"
          else
            echo "CPANEL_DISK_STATS=command_unavailable"
          fi
          if test -f "$app/.env"; then
            stat -c 'ENV_FILE_BYTES=%s ENV_FILE_MODE=%a' "$app/.env"
            python3 - "$app/.env" <<'PY'
          import sys, urllib.parse
          found = None
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line: continue
              key, value = line.split("=", 1)
              if key.strip() == "DATABASE_URL":
                  value = value.strip().strip("'\"")
                  found = urllib.parse.urlsplit(value).scheme.lower() or "unparsed"
                  break
          print("DATABASE_URL_SCHEME=" + (found or "not_in_dotenv"))
          PY
          else
            echo "ENV_FILE_PRESENT=no"
          fi
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=json ResourceUsage get_usages 2>/dev/null | python3 -c 'import sys,json
          def walk(v,p=""):
              if isinstance(v,dict):
                  for k,z in v.items(): walk(z,p+"_"+str(k).upper())
              elif isinstance(v,list):
                  for i,z in enumerate(v): walk(z,p+"_"+str(i))
              elif isinstance(v,(int,float,str)) and any(t in p for t in ("DISK","QUOTA","INODE")) and str(v).replace(".","",1).isdigit():
                  print("RESOURCE"+p+"="+str(v))
          walk(json.load(sys.stdin))' || echo "RESOURCE_USAGE=unavailable"
          else
            echo "RESOURCE_USAGE=command_unavailable"
          fi
          uapi --output=json PassengerApps list_applications 2>/dev/null | python3 -c 'import sys,json,urllib.parse
          def walk(v):
              if isinstance(v,dict):
                  if v.get("domain") in ("zomorodmelal.ir","www.zomorodmelal.ir"):
                      for k,z in v.items():
                          if "env" in str(k).lower():
                              if isinstance(z,dict):
                                  for ek,ev in z.items():
                                      print("PASSENGER_ENV_KEY="+str(ek))
                                      if str(ek).upper()=="DATABASE_URL":
                                          print("PASSENGER_DATABASE_URL_SCHEME="+(urllib.parse.urlsplit(str(ev)).scheme or "unparsed"))
                              elif isinstance(z,list):
                                  for item in z:
                                      if isinstance(item,dict):
                                          ek=item.get("name") or item.get("key")
                                          if ek: print("PASSENGER_ENV_KEY="+str(ek))
                                          if str(ek).upper()=="DATABASE_URL":
                                              ev=item.get("value","")
                                              print("PASSENGER_DATABASE_URL_SCHEME="+(urllib.parse.urlsplit(str(ev)).scheme or "unparsed"))
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(json.load(sys.stdin))' || echo "PASSENGER_ENV_INSPECTION=unavailable"
          python3 - "$app/config/settings.py" <<'PY'
          import ast,pathlib,re,sys,urllib.parse
          p=pathlib.Path(sys.argv[1])
          if not p.exists():
              print("DB_CONFIG_INSPECTION=no_settings_file")
              raise SystemExit(0)
          try:
              root=ast.parse(p.read_text(errors="replace"))
          except Exception as exc:
              print("DB_CONFIG_INSPECTION=parse_error_"+type(exc).__name__)
              raise SystemExit(0)
          seen=set()
          for n in ast.walk(root):
              if isinstance(n,ast.Dict):
                  keys=[k.value for k in n.keys if isinstance(k,ast.Constant) and isinstance(k.value,str)]
                  if "ENGINE" in keys or "NAME" in keys:
                      vals={k.value:v for k,v in zip(n.keys,n.values) if isinstance(k,ast.Constant) and isinstance(k.value,str)}
                      eng=vals.get("ENGINE")
                      name=vals.get("NAME")
                      if eng is not None and "ENGINE" in vals:
                          engine=eng.value if isinstance(eng,ast.Constant) and isinstance(eng.value,str) else "dynamic"
                          base=name.value if isinstance(name,ast.Constant) and isinstance(name.value,str) else "dynamic"
                          base=pathlib.Path(base).name if base!="dynamic" else "dynamic"
                          pair=(engine,base)
                          if pair not in seen:
                              print("DB_CONFIG_ENGINE="+engine)
                              print("DB_CONFIG_NAME_BASENAME="+base)
                              seen.add(pair)
              if isinstance(n,ast.Call):
                  fn=n.func
                  if isinstance(fn,ast.Attribute) and fn.attr in ("db","parse"):
                      for a in n.args[:1]:
                          if isinstance(a,ast.Constant) and isinstance(a.value,str) and ("DATABASE" in a.value.upper() or "DB"==a.value.upper()):
                              print("DB_ENV_REFERENCE="+a.value[:40])
                      defaults=list(n.args[1:])+[kw.value for kw in n.keywords if kw.arg in ("default","default_value")]
                      for d in defaults:
                          if isinstance(d,ast.Constant) and isinstance(d.value,str) and "sqlite" in d.value.lower():
                              u=urllib.parse.urlsplit(d.value)
                              print("DB_DEFAULT_SCHEME="+(u.scheme or "sqlite"))
                              print("DB_DEFAULT_NAME_BASENAME="+pathlib.Path(u.path).name)
          if not seen:
              for n in ast.walk(root):
                  if isinstance(n,ast.Constant) and isinstance(n.value,str):
                      v=n.value
                      if "sqlite" in v.lower():
                          m=re.search(r"([^/\\\\]+\\.sqlite3?|[^/\\\\]+\\.db)$",v)
                          if m: print("DB_SQLITE_BASENAME_CANDIDATE="+m.group(1))
              print("DB_CONFIG_ENGINE=dynamic_or_indirect")
          PY
          python3 - "$app" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          found=0
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in (".sqlite3",".sqlite",".db") and not any(x.lower()=="backups" for x in p.parts) and ".git" not in p.parts:
                  print("ACTIVE_DB_CANDIDATE="+str(p)+" BYTES="+str(p.stat().st_size)); found+=1
                  if found>=20: break
          PY
          du -x -s -B1 "$app"/* "$app"/.[!.]* 2>/dev/null | sort -rn | head -20 | awk '{print "APP_COMPONENT_BYTES="$1}'
          if test -d "$HOME/.backups"; then
            find "$HOME/.backups" -maxdepth 3 -type d -iname '*zomorod*' -print
            du -sb "$HOME/.backups" 2>/dev/null | awk '{print "EXISTING_BACKUPS_BYTES="$1}' || true
          else
            echo "BACKUP_ROOT_PRESENT=no"
          fi
          if test -f "$app/.git/HEAD"; then git -C "$app" rev-parse HEAD 2>/dev/null | sed 's/^/DEPLOYED_GIT_HEAD=/' || echo "DEPLOYED_GIT_HEAD=unavailable"; else echo "DEPLOYED_GIT_HEAD=not_a_git_checkout"; fi
          REMOTE
      - name: Create and verify private cPanel backup
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-backup-preflight"
          ssh -F "$d/config" saeit-cpanel 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          uapi_bin="$(command -v uapi 2>/dev/null || true)"
          if test -z "$uapi_bin" && test -x /usr/local/cpanel/bin/uapi; then uapi_bin=/usr/local/cpanel/bin/uapi; fi
          test -n "$uapi_bin"
          started="$(date +%s)"
          response="$("$uapi_bin" --output=json --user=zomorod2 Backup fullbackup_to_homedir homedir=include 2>/dev/null)"
          printf '%s' "$response" | python3 -c 'import json,sys
          j=json.load(sys.stdin)
          r=j.get("result",{})
          status=r.get("status",0)
          print("CPANEL_FULL_BACKUP_REQUEST_STATUS="+str(status))
          sys.exit(0 if str(status)=="1" else 1)'
          backup=""
          stable=0
          prev=0
          for _ in $(seq 1 240); do
            candidate="$(find "$HOME" -maxdepth 1 -type f -name 'backup-*.tar.gz' -newermt "@$started" -print -quit 2>/dev/null || true)"
            if test -n "$candidate"; then
              size="$(stat -c %s "$candidate" 2>/dev/null || echo 0)"
              if test "$size" -gt 0 && test "$size" = "$prev"; then stable=$((stable+1)); else stable=0; fi
              prev="$size"
              backup="$candidate"
              if test "$stable" -ge 2; then break; fi
            fi
            sleep 15
          done
          test -n "$backup" && test -s "$backup"
          gzip -t "$backup"
          members="$(tar -tzf "$backup" | wc -l | tr -d ' ')"
          test "$members" -gt 0
          python3 - "$backup" <<'PY'
          import pathlib,sys,tarfile
          p=pathlib.Path(sys.argv[1])
          with tarfile.open(p,"r:gz") as tf:
              names=0
              for m in tf:
                  parts=pathlib.PurePosixPath(m.name).parts
                  if pathlib.PurePosixPath(m.name).is_absolute() or ".." in parts:
                      raise SystemExit("BACKUP_PATH_VALIDATION=unsafe_member")
                  names+=1
              print("BACKUP_MEMBER_PATHS=valid")
              print("BACKUP_MEMBERS="+str(names))
          PY
          archive_bytes="$(stat -c %s "$backup")"
          archive_sha="$(sha256sum "$backup" | awk '{print $1}')"
          home_bytes="$(du -sb "$HOME" 2>/dev/null | awk '{print $1}')"
          printf 'BACKUP_ARCHIVE_NAME=%s\n' "$(basename "$backup")"
          printf 'BACKUP_ARCHIVE_BYTES=%s\n' "$archive_bytes"
          printf 'BACKUP_ARCHIVE_SHA256=%s\n' "$archive_sha"
          printf 'CPANEL_HOME_BYTES_AFTER=%s\n' "$home_bytes"
          printf 'BACKUP_TAR_MEMBERS=%s\n' "$members"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-backup-preflight"
