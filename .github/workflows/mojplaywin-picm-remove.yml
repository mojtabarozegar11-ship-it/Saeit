name: One-shot PICM full removal
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  remove:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      contains(github.event.issue.title, 'Ops: remove PICM completely')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned relay and cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          WORK="$RUNNER_TEMP/picm-remove-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P '' -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$WORK/config" <<EOF
          Host picm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          Host picm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump picm-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" picm-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          sed -i '/Host picm-host/,$ { /Host picm-host/!b; }' "$WORK/config" || true
      - name: Upload and execute fail-closed deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-remove-ssh"
          cat scripts/remove_mojplaywin_picm.py | ssh -F "$WORK/config" picm-host "install -m 700 /home/zomorod2/.picm-removal-$GITHUB_RUN_ID.py"
          ssh -F "$WORK/config" picm-host "python3 /home/zomorod2/.picm-removal-$GITHUB_RUN_ID.py --run-id $GITHUB_RUN_ID --source-commit $GITHUB_SHA"
          ssh -F "$WORK/config" picm-host "rm -f /home/zomorod2/.picm-removal-$GITHUB_RUN_ID.py"
      - name: Verify public deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import urllib.error, urllib.request
          for path in ("/picm/","/picm/login/","/picm/workspace/","/picm/media/"):
              try:
                  with urllib.request.urlopen("https://mojplaywin.com"+path, timeout=20) as r:
                      status=r.status
              except urllib.error.HTTPError as e:
                  status=e.code
              print(path, status)
              if status not in (404,410):
                  raise SystemExit("PICM_ROUTE_STILL_PUBLIC:"+path+":"+str(status))
          print("PICM_PUBLIC_ROUTES_REMOVED")
          PY
