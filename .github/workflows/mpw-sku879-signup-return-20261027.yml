name: MojPlayWin SKU879 signup checkout-return guarded repair
on:
  pull_request:
    paths:
      - scripts/mpw_sku879_signup_return_20261027.py
      - .github/workflows/mpw-sku879-signup-return-20261027.yml
  push:
    branches: [main]
    paths:
      - scripts/mpw_sku879_signup_return_20261027.py
      - .github/workflows/mpw-sku879-signup-return-20261027.yml
permissions:
  contents: read
concurrency:
  group: mpw-sku879-signup-guarded
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile and test exact-anchor transform and idempotence
        run: |
          python3 -m py_compile scripts/mpw_sku879_signup_return_20261027.py
          python3 scripts/mpw_sku879_signup_return_20261027.py selftest
  deploy:
    needs: regression
    if: github.event_name == 'push' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish existing pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-879-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Preview exact main-tenant template without writes
        run: |
          set -euo pipefail
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-879-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preview" < scripts/mpw_sku879_signup_return_20261027.py
      - name: Apply atomic backed-up patch and validate Django buyer routes
        id: install
        run: |
          set -euo pipefail
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-879-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - apply '$GITHUB_RUN_ID'" < scripts/mpw_sku879_signup_return_20261027.py
      - name: Verify public SKU 879 and preserved book registration links
        run: |
          python3 - <<'PY'
          import urllib.request
          for product in (72,225,879):
              route=f"https://mojplaywin.com/store/product/{product}/"
              with urllib.request.urlopen(urllib.request.Request(route,headers={"Cache-Control":"no-cache"}),timeout=25) as response:
                  body=response.read(400000).decode("utf-8","replace")
                  assert response.status==200
              expected=f"/accounts/register/?next=/store/product/{product}/checkout/"
              if expected not in body:
                  raise RuntimeError(f"Public checkout return missing: {route}")
              print(f"MPW_PUBLIC_SIGNUP_RETURN_OK={product}")
          PY
      - name: Roll back exact patch if post-install verification failed
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-879-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" < scripts/mpw_sku879_signup_return_20261027.py
      - name: Remove temporary relay credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-879-ssh"
