name: Banknew isolated financial-readiness checks
on:
  pull_request:
    paths:
      - 'banknew/**'
      - '.github/workflows/banknew-readiness-ci.yml'
  push:
    branches: [main]
    paths:
      - 'banknew/**'
      - '.github/workflows/banknew-readiness-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse isolated wallet source
        run: node --check banknew/app.js
      - name: Exact fee and wallet fail-closed regression tests
        run: node --test banknew/app.test.js
      - name: Audit the versioned public page and guarded deployment
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          page=Path('banknew/index.html').read_text(encoding='utf-8')
          workflow=Path('.github/workflows/banknew-service-catalog-20261027.yml').read_text(encoding='utf-8')
          class PageParser(HTMLParser): pass
          parser=PageParser(); parser.feed(page); parser.close()
          for item in ('<html lang="en">', 'id="wallet"', 'id="pricing"', 'id="access"', 'Connect a wallet to view balances.', 'Website-construction authorization', 'not independently verified', 'operating authorization is pending', 'No customer funds or payments are accepted', 'Google OAuth not connected', 'noindex,nofollow'):
              assert item in page, item
          assert 'Your wallet, connected.' not in page
          assert 'Website launch authorization:' not in page
          assert '<form' not in page.lower()
          assert 'banknew/index.html' in workflow
          assert 'b64decode' not in workflow
          assert 'rollback' in workflow.lower()
          PY
      - name: Validate isolated double-entry ledger and tamper detection
        run: |
          python3 -m unittest discover -s banknew -p 'test_ledger_core.py' -v
      - name: Reject unsettled or inconsistent external statements
        run: python3 -m unittest discover -s banknew -p 'test_reconciliation.py' -v
      - name: Install isolated official Google-auth verifier
        run: python3 -m pip install --disable-pip-version-check -r banknew/requirements-auth.txt
      - name: Verify server-side Google OIDC boundary
        run: |
          python3 -c 'from google.oauth2 import id_token; from google.auth.transport import requests; assert callable(id_token.verify_oauth2_token)'
          python3 -m unittest discover -s banknew -p 'test_google_identity.py' -v
      - name: Install isolated Django for identity bridge tests
        run: python3 -m pip install --disable-pip-version-check 'Django>=5.2,<6.0'
      - name: Verify Google-sub binding, one-use nonce, CSRF and no payment grants
        run: python3 -m django test banknew.test_identity_views --settings=banknew.identity_test_settings -v 2
      - name: Refuse production payment activation in this release
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('banknew/app.js','utf8'); if (/\b(?:sendTransaction|signTransaction|signMessage|writeContract)\s*\(/.test(s)) process.exit(1); console.log('No payment, key handling or signing methods introduced');"
