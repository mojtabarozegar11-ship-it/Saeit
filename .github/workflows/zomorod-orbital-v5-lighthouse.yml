name: Zomorod Orbital V5 measurable Lighthouse quality gate
on:
  push:
    branches: [zomorod/orbital-v5-safe-release-20261018]
    paths: [".github/workflows/zomorod-orbital-v5-lighthouse.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate production preview URL is online
        shell: bash
        run: |
          set -euo pipefail
          url="https://zomorodmelal.ir/__zm_orbital_v5_preview_20261018/"
          status="$(curl -L -sS --max-time 35 -o "$RUNNER_TEMP/v5.preview" -w '%{http_code}' "$url" || true)"
          echo "V5_PREVIEW_HTTP=$status"
          test "$status" = 200
          grep -Fq 'id="orbit-shelves"' "$RUNNER_TEMP/v5.preview"
      - name: Audit real web performance, accessibility, best practices, SEO
        shell: bash
        run: |
          set -euo pipefail
          url="https://zomorodmelal.ir/__zm_orbital_v5_preview_20261018/"
          npx --yes lighthouse@12.8.2 "$url" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="$RUNNER_TEMP/lighthouse-mobile.json" --quiet
          npx --yes lighthouse@12.8.2 "$url" --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="$RUNNER_TEMP/lighthouse-desktop.json" --quiet
          python3 - <<'PY'
          import json,os
          for kind in ("mobile","desktop"):
              p=os.path.join(os.environ["RUNNER_TEMP"],f"lighthouse-{kind}.json")
              r=json.load(open(p))
              scores={key:int(round(r["categories"][key]["score"]*100)) for key in ("performance","accessibility","best-practices","seo")}
              print(f"LH_{kind.upper()}={scores}")
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
                  out.write(f"## {kind}\n")
                  for key,score in scores.items():out.write(f"- {key}: **{score}/100**\n")
          PY
      - name: Preserve audit report artifacts for future improvements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zomorod-v5-lighthouse-real
          path: ${{ runner.temp }}/lighthouse-*.json
          if-no-files-found: ignore
          retention-days: 7
