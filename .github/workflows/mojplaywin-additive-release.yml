name: MojPlayWin additive release (manual)
on:
  push:
    branches: [seo/mojplaywin-40-isolated-20261009]
    paths: [.github/workflows/mojplaywin-additive-release.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate first; deploy only with explicit selection
        required: true
        type: choice
        options: [validate, deploy]
permissions:
  contents: read
concurrency:
  group: mojplaywin-additive-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core/mojplaywin_specialties.py core/mojplaywin_specialty_views.py core/mojplaywin_about_views.py
          test -s core/templates/brands/mojplaywin/includes/mega_nav.html
          test -s core/templates/brands/mojplaywin/specialty.html
          test -s core/templates/brands/mojplaywin/specialty_directory.html
          test -s core/templates/brands/mojplaywin/about.html
      - name: Configure pinned relay and host keys
        if: inputs.mode == 'deploy'
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          mkdir -p "$RUNNER_TEMP/moj-ssh"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/moj-ssh/vps.key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/moj-ssh/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$RUNNER_TEMP/moj-ssh/host.known"
          sed -i 's/\\r$//' "$RUNNER_TEMP/moj-ssh/"*.key
          chmod 600 "$RUNNER_TEMP/moj-ssh/"*
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/moj-ssh/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/moj-ssh/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$RUNNER_TEMP/moj-ssh/vps.known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/moj-ssh/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$RUNNER_TEMP/moj-ssh/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$RUNNER_TEMP/moj-ssh/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $RUNNER_TEMP/moj-ssh/vps.key
            UserKnownHostsFile $RUNNER_TEMP/moj-ssh/vps.known
          Host hosting
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $RUNNER_TEMP/moj-ssh/host.key
            UserKnownHostsFile $RUNNER_TEMP/moj-ssh/host.known
            ProxyJump relay
          Host *
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$RUNNER_TEMP/moj-ssh/config"
      - name: Deploy one backed-up navigation file through VPS
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -F "$RUNNER_TEMP/moj-ssh/config")
          SCP=(scp -F "$RUNNER_TEMP/moj-ssh/config")
          target=/home/zomorod2/Saeit-staging/core/templates/brands/mojplaywin/includes/mega_nav.html
          "${SSH[@]}" hosting "test -f $target && test -d /home/zomorod2/mojplaywin.com/tmp"
          "${SSH[@]}" hosting "umask 077; cp -p $target $target.before-additive-release"
          "${SCP[@]}" core/templates/brands/mojplaywin/includes/mega_nav.html "hosting:$target"
          "${SSH[@]}" hosting "test -s $target && touch /home/zomorod2/mojplaywin.com/tmp/restart.txt"
      - name: Verify public navigation
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 https://mojplaywin.com/ | grep -q '/editorial/products/'; then
              echo 'Public navigation verified'
              exit 0
            fi
            sleep 5
          done
          echo 'Public navigation not verified; inspect live template routing before claiming success' >&2
          exit 1
      - name: Clean temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/moj-ssh"
