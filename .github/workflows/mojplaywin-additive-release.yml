name: MojPlayWin additive release (manual approval required)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate first; deploy only with explicit selection
        required: true
        type: choice
        options: [validate, deploy]
permissions:
  contents: read
concurrency:
  group: mojplaywin-additive-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core/mojplaywin_specialties.py core/mojplaywin_specialty_views.py core/mojplaywin_about_views.py
          test -s core/templates/brands/mojplaywin/includes/mega_nav.html
          grep -Fq '/editorial/products/' core/templates/brands/mojplaywin/includes/mega_nav.html
          grep -Fq '/editorial/services/' core/templates/brands/mojplaywin/includes/mega_nav.html
          grep -Fq '/about/founder/' core/templates/brands/mojplaywin/includes/mega_nav.html
          test -s core/templates/brands/mojplaywin/specialty.html
          test -s core/templates/brands/mojplaywin/specialty_directory.html
          test -s core/templates/brands/mojplaywin/about.html
      - name: Configure pinned relay and host keys
        if: inputs.mode == 'deploy'
        shell: bash
        env:
          VPS_KEY: ${{ secrets.SAEIT_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$VPS_KNOWN" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          mkdir -p "$RUNNER_TEMP/moj-ssh"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/moj-ssh/vps.key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/moj-ssh/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$RUNNER_TEMP/moj-ssh/host.known"
          printf '%s\n' "$VPS_KNOWN" > "$RUNNER_TEMP/moj-ssh/vps.known"
          sed -i 's/\r$//' "$RUNNER_TEMP/moj-ssh/"*.key
          chmod 600 "$RUNNER_TEMP/moj-ssh/"*
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/moj-ssh/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/moj-ssh/host.key" >/dev/null
          # Use separately provisioned pinned known_hosts; never trust a live scan.
          # Normalize CRLF without modifying key material.
          sed -i 's/\r$//' "$RUNNER_TEMP/moj-ssh/"*.known
          fingerprint() {
            ssh-keygen -lf "$1" -E sha256 | awk '{print $2}' | sort -u
          }
          vps_fingerprint="$(fingerprint "$RUNNER_TEMP/moj-ssh/vps.known")"
          host_fingerprint="$(fingerprint "$RUNNER_TEMP/moj-ssh/host.known")"
          echo "VPS pinned fingerprint: $vps_fingerprint"
          echo "Hosting pinned fingerprint: $host_fingerprint"
          if [[ "$vps_fingerprint" != 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs' ]]; then
            echo "::error::VPS known_hosts fingerprint mismatch. Deployment blocked; verify out of band." >&2
            exit 1
          fi
          if [[ "$host_fingerprint" != 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04' ]]; then
            echo "::error::Hosting known_hosts fingerprint mismatch. Deployment blocked." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/moj-ssh/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $RUNNER_TEMP/moj-ssh/vps.key
            UserKnownHostsFile $RUNNER_TEMP/moj-ssh/vps.known
          Host hosting
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $RUNNER_TEMP/moj-ssh/host.key
            UserKnownHostsFile $RUNNER_TEMP/moj-ssh/host.known
            ProxyJump relay
          Host *
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$RUNNER_TEMP/moj-ssh/config"
      - name: Preflight production mapping (read-only)
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/moj-ssh/config" hosting 'set -eu
            echo "Production directory:"
            ls -ld /home/zomorod2/mojplaywin.com
            echo "Passenger entrypoint:"
            if test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py; then
              grep -nE "sys.path|DJANGO_SETTINGS_MODULE|application|activate_this" /home/zomorod2/mojplaywin.com/passenger_wsgi.py || true
            fi
            echo "Known template candidates:"
            for base in /home/zomorod2/mojplaywin.com /home/zomorod2/Saeit-staging /home/zomorod2/mojplaywin-release-20261009-200458/release-src; do
              for rel in core/templates/brands/mojplaywin/about.html core/templates/brands/mojplaywin/includes/mega_nav.html; do
                test ! -f "$base/$rel" || printf "FOUND %s\\n" "$base/$rel"
              done
            done'
          echo 'Preflight complete. Deployment remains staging-only and cannot be called a production release.'

      - name: Deploy one backed-up navigation file through VPS
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -F "$RUNNER_TEMP/moj-ssh/config")
          SCP=(scp -F "$RUNNER_TEMP/moj-ssh/config")
          target=/home/zomorod2/Saeit-staging/core/templates/brands/mojplaywin/includes/mega_nav.html
          staging="${target}.incoming-${GITHUB_RUN_ID}"
          backup="${target}.before-additive-release-${GITHUB_RUN_ID}"
          echo "BACKUP_PATH=$backup" >> "$GITHUB_ENV"
          echo "TARGET_PATH=$target" >> "$GITHUB_ENV"
          "${SSH[@]}" hosting "id -un | grep -Fxq zomorod2; test -f '$target' && test -d /home/zomorod2/mojplaywin.com/tmp"
          "${SSH[@]}" hosting "umask 077; cp -p '$target' '$backup'"
          "${SCP[@]}" core/templates/brands/mojplaywin/includes/mega_nav.html "hosting:$staging"
          "${SSH[@]}" hosting "set -eu; test -s '$staging'; grep -Fq '/editorial/products/' '$staging'; grep -Fq '/editorial/services/' '$staging'; grep -Fq '/about/founder/' '$staging'; mv -f '$staging' '$target'"
      - name: Mark replacement and restart Passenger
        if: inputs.mode == 'deploy'
        run: |
          ssh -F "$RUNNER_TEMP/moj-ssh/config" hosting "touch /home/zomorod2/mojplaywin.com/tmp/restart.txt"
      - name: Verify public navigation
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 \
              --output "$RUNNER_TEMP/moj-home.html" https://mojplaywin.com/; then
              if grep -Fq '/editorial/products/' "$RUNNER_TEMP/moj-home.html" &&
                 grep -Fq '/editorial/services/' "$RUNNER_TEMP/moj-home.html" &&
                 grep -Fq '/about/founder/' "$RUNNER_TEMP/moj-home.html"; then
                echo 'All three public navigation links verified'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Public navigation not verified; inspect live template routing before claiming success' >&2
          exit 1
      - name: Restore navigation backup if deployment verification failed
        if: failure() && inputs.mode == 'deploy' && env.BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/moj-ssh/config" && test -n "${BACKUP_PATH:-}"; then
            ssh -F "$RUNNER_TEMP/moj-ssh/config" hosting "set -eu; if test -s '$BACKUP_PATH' && test -f '$TARGET_PATH'; then cp -p '$BACKUP_PATH' '$TARGET_PATH'; touch /home/zomorod2/mojplaywin.com/tmp/restart.txt; echo ROLLBACK_COMPLETED; fi" || true
          fi
      - name: Clean temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/moj-ssh"
