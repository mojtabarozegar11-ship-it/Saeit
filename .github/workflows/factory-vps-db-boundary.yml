name: VPS Factory Database Boundary Inventory
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-db-boundary.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Read only factory database model and SQLite boundaries
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-host 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/zomorod2/Saeit-staging
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          for key in ('SAEIT_ENV','DJANGO_SETTINGS_MODULE'):
              print('ENV_FLAG',key, 'set' if os.environ.get(key) else 'unset')
          for path in [Path('db.sqlite3'),Path('var/db.sqlite3'),Path('var/staging.sqlite3')]:
              if path.is_file():
                  print('CANDIDATE_DB',str(path),'bytes',path.stat().st_size)
                  try:
                      c=sqlite3.connect('file:'+str(path.resolve())+'?mode=ro',uri=True)
                      rows=c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%factory%' ORDER BY name").fetchall()
                      print('FACTORY_TABLES',*[x[0] for x in rows])
                      c.close()
                  except sqlite3.Error as e: print('DB_PROBE_ERROR',type(e).__name__)
          PY
          echo FACTORY_MIGRATION_MODELS
          grep -nE '^class .*Factory|^class .*Agent|^class .*Product' core/models.py | head -50 || true
          echo FACTORY_AGENT_SEED_REFERENCES
          grep -nE 'agent|Agent|role|Role' core/management/commands/seed_factory_agents.py | head -35 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
