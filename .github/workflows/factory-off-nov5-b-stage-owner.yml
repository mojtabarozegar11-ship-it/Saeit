name: Factory OFF Nov5 completed transition final read-only quota and retention
on:
  pull_request:
    paths:
      - '.github/workflows/factory-off-nov5-b-stage-owner.yml'
permissions:
  contents: read
concurrency:
  group: factory-nov5-final-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  final-readonly:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm two retained VPS originals, two retained cPanel gzips and actual account quota; NO mutation
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          test "$(id -u)" -ne 0 || { echo OWNER_RUNNER_MUST_BE_NONROOT; exit 78; }
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/host.key"
          chmod 600 "$work/"*.key
          ssh-keygen -y -P "" -f "$work/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$work/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 127.0.0.1 > "$work/vps.known" 2>/dev/null
          test -s "$work/vps.known"
          test "$(ssh-keygen -lf "$work/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$work/config" <<EOF
          Host saeit-vps
            HostName 127.0.0.1
            User githubops
            Port 22
            IdentityFile $work/vps.key
            UserKnownHostsFile $work/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $work/host.key
            UserKnownHostsFile $work/cpanel.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          scan="$(ssh -T -F "$work/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$work/cpanel.known"
          chmod 600 "$work/cpanel.known" "$work/vps.known"
          test "$(ssh-keygen -lf "$work/cpanel.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          test "$(git hash-object scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py)" = '81e79c7bb29f2c367f665eb16e11b2e7478fb453'
          test "$(git hash-object scripts/factory_cpanel_nov5_hybrid_readonly_inventory_20261118.py)" = '4b81ca19cc2a4aeece247bff8eec1a135783e4d6'
          timeout 400s ssh -T -F "$work/config" saeit-vps 'exec python3 -B -' < scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py
          timeout 400s ssh -T -F "$work/config" saeit-cpanel 'exec nice -n 15 python3 -B -' < scripts/factory_cpanel_nov5_hybrid_readonly_inventory_20261118.py > "$work/inventory"
          cat "$work/inventory"
          python3 -B - "$work/inventory" <<'PY'
          import json,sys
          lines=open(sys.argv[1]).read().splitlines()
          data=[json.loads(s.split("=",1)[1]) for s in lines if s.startswith("FACTORY_CPANEL_NOV5_HYBRID_INTEGRITY=")]
          assert len(data)==1
          items=data[0]["snapshots"]
          assert {i["snapshot"] for i in items}=={"nov5-a","nov5-b"} and len(items)==2
          for i in items:
              assert i["raw_present"] is False and i["gzip_present"] is True
              proof=i["gzip_integrity"]
              assert all(proof[k] is True for k in ("gzip_crc_verified","gzip_sha256_verified","restored_source_sha256_verified"))
          print("FACTORY_FINAL_TWO_GZIP_ONLY_RETENTION_PROVEN=true")
          PY
          timeout 60s ssh -T -F "$work/config" saeit-cpanel 'exec python3 -B -' <<'PY'
          import json,math,os,pathlib,pwd,subprocess
          assert pwd.getpwuid(os.geteuid()).pw_name=="zomorod2"
          p=subprocess.run(["uapi","--output=json","Quota","get_quota_info"],capture_output=True,timeout=45)
          assert p.returncode==0 and len(p.stdout)<32768
          result=json.loads(p.stdout)["result"]
          assert result["status"]==1
          d=result["data"]
          remain=float(d["megabytes_remain"])
          assert math.isfinite(remain) and remain>=0
          receipt={"quota_remaining_mib":remain,"source":"cPanel Quota UAPI","quota_cache_possible":True,"files_written":0,"raw_deletions":0,"factory_started":False}
          for k in ("megabytes_used","megabyte_limit","megabytes_limit"):
              if k in d:
                  try:
                      v=float(d[k])
                      if math.isfinite(v) and v>=0:receipt[k]=v
                  except (ValueError,TypeError):pass
          print("FACTORY_FINAL_ACCOUNT_QUOTA="+json.dumps(receipt,sort_keys=True))
          PY
          echo FACTORY_HISTORICAL_TRANSITION_POSTCHECK_COMPLETE=true
          echo FACTORY_NO_NEW_DESTRUCTIVE_ACTION=true
