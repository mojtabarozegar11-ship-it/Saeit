name: Factory OFF owner existing cloud credential and artifact quota audit READ ONLY
on:
  pull_request:
    paths:
      - '.github/workflows/factory-off-existing-cloud-auth-readonly.yml'
      - 'scripts/factory_off_existing_destination_credentials_metadata_20261118.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: factory-off-owner-existing-cloud-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  existing-credential-census:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.head.repo.full_name == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect local runner existing credential metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/factory_off_existing_destination_credentials_metadata_20261118.py)" = '0d6f0e7a9716817e8872108b7f64d893b689d1b0'
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m scripts.factory_off_existing_destination_credentials_metadata_20261118
      - name: Inspect VPS githubops HOME existing credential metadata using pinned SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" || { echo OWNER_VPS_KEY_UNAVAILABLE; exit 78; }
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 8 -t rsa 127.0.0.1 > "$d/known" 2>/dev/null
          test -s "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 60s ssh -T -i "$d/key" -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$d/known" -o GlobalKnownHostsFile=/dev/null \
            -o BatchMode=yes -o ForwardAgent=no -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 githubops@127.0.0.1 \
            'exec python3 -B -' < scripts/factory_off_existing_destination_credentials_metadata_20261118.py
          echo FACTORY_OWNER_REMOTE_USER_METADATA_ONLY=true
          echo FACTORY_BACKUP_BYTES_COPIED=0
          echo FACTORY_SERVICE_STARTED=0
      - name: Read repository GitHub artifact inventory without creating artifacts
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN_READONLY: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GH_REPOSITORY']
          if repo!="mojtabarozegar11-ship-it/Saeit":raise SystemExit("REPO_MISMATCH")
          token=os.environ.get('GH_TOKEN_READONLY')
          if not token:raise SystemExit("ARTIFACT_AUDIT_NO_READ_TOKEN")
          headers={
            'Authorization':'Bearer '+token,
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'factory-off-owner-quota-readonly'}
          seen=set()
          total=None
          collected=0
          active_bytes=0
          active_count=0
          expired_count=0
          pages=0
          for page in range(1,11):
              url=("https://api.github.com/repos/"+repo+
                   "/actions/artifacts?per_page=100&page="+str(page))
              q=urllib.request.Request(url,headers=headers,method="GET")
              with urllib.request.urlopen(q,timeout=15) as resp:
                  if resp.status!=200:raise SystemExit("ARTIFACT_AUDIT_HTTP_HOLD")
                  doc=json.loads(resp.read(256000))
              rows=doc.get('artifacts',[])
              n=doc.get('total_count',-1)
              if type(n) is not int or n<0 or not isinstance(rows,list) or len(rows)>100:
                  raise SystemExit("ARTIFACT_RESPONSE_UNTRUSTED")
              if total is None:total=n
              if n!=total:raise SystemExit("ARTIFACT_INVENTORY_CHANGED")
              pages+=1
              for obj in rows:
                  if not isinstance(obj,dict) or type(obj.get('id')) is not int:
                      raise SystemExit("ARTIFACT_ID_INVALID")
                  if obj['id'] in seen:raise SystemExit("DUPLICATE_ARTIFACT_ID")
                  seen.add(obj['id'])
                  if obj.get('expired') is True:expired_count+=1
                  elif obj.get('expired') is False:
                      if type(obj.get('size_in_bytes')) is not int:
                          raise SystemExit("ARTIFACT_SIZE_MISSING")
                      active_bytes+=obj['size_in_bytes']
                      active_count+=1
                  else:raise SystemExit("ARTIFACT_EXPIRY_UNKNOWN")
              collected+=len(rows)
              if collected>=total:break
              if not rows:raise SystemExit("ARTIFACT_PAGE_INCOMPLETE")
          full=collected==total
          result={'schema':'factory.off.actions-artifacts.full-readonly.v2',
                  'account_storage_quota_verified':False,
                  'repository_artifact_count':total,
                  'artifact_counted':collected,
                  'active_artifact_count':active_count,
                  'expired_artifact_count':expired_count,
                  'active_artifact_bytes':active_bytes,
                  'pages_checked':pages,
                  'full_repository_census':full,
                  'account_global_storage_bytes_unknown':True,
                  'backup_uploaded':False,
                  'artifact_created':False,
                  'factory_started':False,
                  'production_mutated':False}
          print('FACTORY_ACTIONS_QUOTA_METADATA='+json.dumps(result,sort_keys=True),flush=True)
          if not full:raise SystemExit("ARTIFACT_CENSUS_INCOMPLETE")
          PY
