name: Zomorod LSWSGI recent error inspection
on:
  push:
    branches: [diagnostic/zomorod-503-readonly-20261015]
    paths: [.github/workflows/zomorod-recent-errors.yml]
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-restore"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"
      - name: Inspect last 503 and 500 traces with redaction
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/zomorod-restore/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,datetime
          choices=[
            pathlib.Path("/home/zomorod2/Saeit/stderr.log"),
            pathlib.Path("/home/zomorod2/Saeit/error_log"),
            pathlib.Path("/home/zomorod2/public_html/error_log"),
            pathlib.Path("/home/zomorod2/logs/zomorodmelal.ir-ssl_log"),
          ]
          for p in choices:
              if not p.is_file() or not p.stat().st_size: continue
              print("LOG_NAME="+str(p),"BYTES="+str(p.stat().st_size))
              try:
                  with p.open("rb") as f:
                      f.seek(max(0,p.stat().st_size-16000))
                      s=f.read().decode("utf8","replace")
                  lines=s.splitlines()[-130:]
                  # Limit only error and WSGI lines, redacting values.
                  filtered=[x for x in lines if any(z in x.lower() for z in ("traceback","exception","error","litespeed","lswsgi","import","failed","wsgi","django","503","500"))]
                  for line in filtered[-55:]:
                      line=re.sub(r"(?i)(password|token|secret|private_key|api_key)([=: ]+)[^ \t,;]+",r"\1\2[redacted]",line)
                      line=re.sub(r"(?i)(authorization:\s*).*",r"\1[redacted]",line)
                      print("LOG_ERROR="+line[:300])
              except Exception as e: print("LOG_READ_ERROR="+type(e).__name__)
          PY
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-restore"
