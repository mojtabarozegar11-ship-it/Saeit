name: Factory one-time guarded global quality gate on private VPS
on:
  push:
    branches: [fix/factory-evidence-integrity-f28-metamorphic-20261028]
    paths:
      - ".github/workflows/factory-global-quality-one-time-guarded-vps-20261028.yml"
permissions: {contents: read}
concurrency:
  group: saeit-global-premium-once-20261028
  cancel-in-progress: false
jobs:
  comprehensive-domain-and-production-audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && github.ref == 'refs/heads/fix/factory-evidence-integrity-f28-metamorphic-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Run real 40-family adversarial quality gate tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_global_premium_quality_gate.py -v
          python3 -m py_compile scripts/factory_global_premium_quality_gate.py
          echo ALL_40_FAMILIES_HAVE_SEPARATE_TECHNICAL_AND_PREMIUM_STATUS=PASS
      - name: Verify pinned VPS identity and audit actual private factory products
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/global-quality-vps"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          stage="/home/githubops/factory-runtime/operations/.global-premium-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          free_bytes="$(timeout 30s ssh -T "${opts[@]}" githubops@178.239.147.150 "df -PB1 /home/githubops/factory-runtime | awk 'NR==2{print \$4}'")"
          test -n "$free_bytes"
          case "$free_bytes" in *[!0-9]*) echo VPS_QA_DISK_UNREADABLE; exit 1;; esac
          test "$free_bytes" -ge 1073741824 || { echo VPS_QA_DISK_TOO_LOW; exit 1; }
          echo "VPS_GLOBAL_QA_DISK_FREE_BYTES=$free_bytes"
          ssh -T "${opts[@]}" githubops@178.239.147.150 "set -eu; test \"\$(id -un)\" = githubops; umask 077; test ! -e '$stage'; mkdir -m 700 '$stage'"
          scp -q "${opts[@]}" scripts/factory_global_premium_quality_gate.py githubops@178.239.147.150:"$stage/qa.py"
          scp -q "${opts[@]}" factory_config/forty_families.json githubops@178.239.147.150:"$stage/forty_families.json"
          qsha="$(sha256sum scripts/factory_global_premium_quality_gate.py | awk '{print $1}')"
          regsha="$(sha256sum factory_config/forty_families.json | awk '{print $1}')"
          timeout 120s ssh -T "${opts[@]}" githubops@178.239.147.150 \
            python3 -B - "$stage" "$qsha" "$regsha" "$GITHUB_RUN_ID" <<'PY'
          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          stage,want_policy,want_registry,run_id=sys.argv[1:]
          folder=Path(stage)
          policy_file=folder/"qa.py";registry_file=folder/"forty_families.json"
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(policy_file)==want_policy and sha(registry_file)==want_registry
          spec=importlib.util.spec_from_file_location("factory_global_qa_deployed",policy_file)
          gate=importlib.util.module_from_spec(spec);spec.loader.exec_module(gate)
          profiles=gate.load_registry(registry_file)
          assert len(profiles)==40
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          assert root.is_dir() and not root.is_symlink()
          entries=[]
          for candidate in (root/"digital-products",root/"product-lifecycle"/"digital-products"):
              if candidate.is_dir() and not candidate.is_symlink():
                  for recipe_dir in sorted(candidate.iterdir()):
                      if len(entries)>=200:break
                      if recipe_dir.is_symlink() or not recipe_dir.is_dir():continue
                      metadata=recipe_dir/"manufacturing_manifest.json"
                      if not metadata.is_file() or metadata.is_symlink():continue
                      try:
                          doc=json.loads(metadata.read_text(encoding="utf-8"))
                          recipe=str(doc.get("recipe",""))
                          assert recipe==recipe_dir.name
                          artifact=recipe_dir/(recipe+"-internal-qa.zip")
                          entry={"family_id":doc.get("family_id"),
                                 "artifact":{"path":artifact.name,
                                  "sha256":sha(artifact) if artifact.is_file() and not artifact.is_symlink() else ""}}
                          result=gate.inspect(entry,recipe_dir,profiles,doc)
                          entries.append({"recipe":recipe,"family_id":result["family_id"],
                                          "technical_test_passed":result["technical_test_passed"],
                                          "premium_quality_verdict":result["quality_verdict"],
                                          "critical_defects":result["blocker_count"],
                                          "stop_ship_codes":[x["code"] for x in result["blockers"]]})
                      except (OSError,ValueError,KeyError,AssertionError,TypeError) as error:
                          entries.append({"recipe":recipe_dir.name,
                                          "premium_quality_verdict":"BLOCKED_AUDIT_ERROR",
                                          "stop_ship_codes":["P0_AUDIT_ERROR_"+type(error).__name__]})
          family_policies={fam:gate.inspect({"family_id":fam},root,profiles)
                           for fam in sorted(profiles)}
          assert len(family_policies)==40
          assert all(q["public_release_allowed"] is False for q in family_policies.values())
          assert all(x["premium_quality_verdict"].startswith("BLOCKED") for x in entries)
          summary={"schema":"saeit.factory.global-premium-private-vps-inventory.v1",
                   "run_id":run_id,"policy_sha256":want_policy,"registry_sha256":want_registry,
                   "registered_families_checked":len(family_policies),
                   "existing_products_audited":len(entries),
                   "technically_passed_products":sum(x.get("technical_test_passed") is True for x in entries),
                   "globally_premium_qualified":0,
                   "public_sales_authorized":False,
                   "product_findings":entries,
                   "family_policy_missing_count":0,
                   "all_families_require_external_global_benchmarks":True}
          evidence=root/"global-premium-quality-receipts"
          assert not evidence.is_symlink()
          evidence.mkdir(mode=0o700,exist_ok=True)
          os.chmod(evidence,0o700)
          output=evidence/("global-premium-run-"+run_id+".json")
          assert not output.exists() and not output.is_symlink()
          with output.open("x",encoding="utf-8") as f:
              json.dump(summary,f,sort_keys=True,indent=2,ensure_ascii=False)
              f.write("\n");f.flush();os.fsync(f.fileno())
          os.chmod(output,0o600)
          assert json.loads(output.read_text())["public_sales_authorized"] is False
          print("VPS_GLOBAL_PREMIUM_40_FAMILY_POLICY_AUDITED=40")
          print("VPS_ACTUAL_MANUFACTURING_PRODUCTS_AUDITED="+str(len(entries)))
          print("VPS_TECHNICAL_TEST_PASSED_PRODUCTS="+str(summary["technically_passed_products"]))
          print("VPS_WORLD_NUMBER_ONE_CERTIFIED=0")
          print("VPS_GLOBAL_PREMIUM_PUBLIC_SALES_ALLOWED=0")
          print("VPS_REAL_PREMIUM_QA_RECEIPT_SHA256="+sha(output))
          PY
          ssh -T "${opts[@]}" githubops@178.239.147.150 "set -eu; rm -f -- '$stage/qa.py' '$stage/forty_families.json'; rmdir -- '$stage'"
