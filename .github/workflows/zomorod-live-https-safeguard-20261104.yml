name: Zomorod live HTTPS safeguard 2026-11-04
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-live-https-safeguard-20261104.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-live-https-safeguard-once
  cancel-in-progress: false
jobs:
  onefile-live:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Back up and atomically protect the live Zomorod document root
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel "ZOMOROD_HTTPS_RUN_ID=$GITHUB_RUN_ID python3 -" <<'PY'
          import os,stat,hashlib,shutil
          from pathlib import Path
          root=Path('/home/zomorod2/public_html')
          target=root/'.htaccess'
          run=os.environ['ZOMOROD_HTTPS_RUN_ID']
          assert run.isdigit() and 1<=len(run)<=22
          if root.is_symlink() or not root.is_dir() or str(root.resolve())!=str(root):raise SystemExit('UNSAFE_PUBLIC_ROOT')
          before=target.lstat()
          if not stat.S_ISREG(before.st_mode) or target.is_symlink():raise SystemExit('UNSAFE_HTACCESS')
          original=target.read_bytes()
          if len(original)<100 or len(original)>300000:raise SystemExit('HTACCESS_SIZE_OUTSIDE_SAFE_BOUND')
          if b'PassengerAppRoot "/home/zomorod2/Saeit"' not in original:raise SystemExit('LIVE_PASSENGER_ROOT_MISMATCH')
          marker=b'# ZOMOROD_HTTPS_SAFEGUARD_20261104'
          if marker in original:
              print('HTTPS_SAFEGUARD_ALREADY_PRESENT=1');raise SystemExit(0)
          if shutil.disk_usage(root).free<2097152:raise SystemExit('INSUFFICIENT_FREE_DISK')
          backup_dir=Path('/home/zomorod2/.backups/zomorod-https-safeguard-20261104')
          if backup_dir.is_symlink():raise SystemExit('UNSAFE_BACKUP_DIRECTORY')
          backup_dir.mkdir(mode=0o700,exist_ok=True)
          backup=backup_dir/('htaccess-before-'+run)
          fd=os.open(backup,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb') as out:
              out.write(original);out.flush();os.fsync(out.fileno())
          if backup.read_bytes()!=original:raise SystemExit('BACKUP_READBACK_FAILED')
          redirect=(b'# ZOMOROD_HTTPS_SAFEGUARD_20261104\n'
                    b'<IfModule mod_rewrite.c>\n'
                    b'RewriteEngine On\n'
                    b'RewriteCond %{HTTP_HOST} ^(www\\.)?zomorodmelal\\.ir$ [NC]\n'
                    b'RewriteCond %{HTTPS} !=on\n'
                    b'RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]\n'
                    b'RewriteRule ^ https://zomorodmelal.ir%{REQUEST_URI} [R=307,L,NE]\n'
                    b'</IfModule>\n'
                    b'# END_ZOMOROD_HTTPS_SAFEGUARD_20261104\n')
          updated=redirect+original
          tmp=root/('.htaccess.safeguard-'+run+'.tmp')
          fd=os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_EXCL,stat.S_IMODE(before.st_mode))
          try:
              with os.fdopen(fd,'wb') as out:
                  out.write(updated);out.flush();os.fsync(out.fileno())
              os.replace(tmp,target)
          finally:
              if tmp.exists():tmp.unlink()
          if target.read_bytes()!=updated:raise SystemExit('REPAIR_READBACK_FAILED')
          print('HTTPS_SAFEGUARD_APPLIED=1')
          print('HTACCESS_BEFORE_SHA256='+hashlib.sha256(original).hexdigest())
          print('HTACCESS_AFTER_SHA256='+hashlib.sha256(updated).hexdigest())
          PY
      - name: Verify real HTTP redirects and unaffected HTTPS on both public paths
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          paths=('/','/store/','/ask-master/index.php','/research/projects/')
          for path in paths:
              http='http://zomorodmelal.ir'+path
              good=False
              for attempt in range(1,7):
                  req=urllib.request.Request(http,headers={'User-Agent':'Mozilla/5.0 (compatible; ZomorodSSLVerify/1.0)','Cache-Control':'no-cache'})
                  try:
                      res=opener.open(req,timeout=15)
                  except urllib.error.HTTPError as e:
                      res=e
                  code=res.status
                  location=res.headers.get('Location','')
                  if code==307 and location=='https://zomorodmelal.ir'+path:
                      good=True;break
                  time.sleep(2)
              print('LIVE_HTTP_CHECK='+json.dumps({'path':path,'status':code,'location':location,'ok':good},sort_keys=True))
              if not good:raise SystemExit('HTTPS_REDIRECT_MISSING:'+path)
              req=urllib.request.Request('https://zomorodmelal.ir'+path,headers={'User-Agent':'Mozilla/5.0 (compatible; ZomorodSSLVerify/1.0)'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as secure: secure_code=secure.status
              except urllib.error.HTTPError as e:secure_code=e.code
              print('LIVE_HTTPS_CHECK='+json.dumps({'path':path,'status':secure_code}))
              if secure_code!=200:raise SystemExit('HTTPS_PATH_REGRESSION:'+path)
          print('ZOMOROD_LIVE_HTTPS_SAFEGUARD=PASS')
          PY
      - name: Restore exact original configuration on failure
        if: failure() && steps.repair.outcome != 'skipped'
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -f "$d/config"; then
            ssh -T -F "$d/config" saeit-cpanel "ZOMOROD_HTTPS_RUN_ID=$GITHUB_RUN_ID python3 -" <<'PY'
          import os,stat
          from pathlib import Path
          p=Path('/home/zomorod2/public_html/.htaccess')
          b=Path('/home/zomorod2/.backups/zomorod-https-safeguard-20261104')/('htaccess-before-'+os.environ['ZOMOROD_HTTPS_RUN_ID'])
          if not b.is_file() or b.is_symlink():print('ROLLBACK_BACKUP_ABSENT');raise SystemExit(0)
          data=p.read_bytes()
          if not data.startswith(b'# ZOMOROD_HTTPS_SAFEGUARD_20261104'):raise SystemExit('ROLLBACK_REFUSED_NOT_OURS')
          restored=b.read_bytes()
          tmp=p.parent/('.htaccess.rollback-'+os.environ['ZOMOROD_HTTPS_RUN_ID']+'.tmp')
          fd=os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_EXCL,stat.S_IMODE(p.stat().st_mode))
          with os.fdopen(fd,'wb') as f:f.write(restored);f.flush();os.fsync(f.fileno())
          os.replace(tmp,p)
          if p.read_bytes()!=restored:raise SystemExit('ROLLBACK_READBACK_FAILED')
          print('ORIGINAL_HTACCESS_RESTORED=1')
          PY
          fi
      - name: Remove runner-only SSH material
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -rf -- "$d"; fi
