name: MojPlayWin disposable MySQL restore capability probe
on:
  push:
    branches: [ops/mpw-private-backup-20261014]
    paths:
      - .github/workflows/mojplaywin-restore-capability-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect VPS isolated MySQL options and cPanel grants without writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 35s ssh -F "$d/config" relay 'bash -se' <<'PROBE'
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, shutil
          mem = 0
          for ln in pathlib.Path("/proc/meminfo").read_text().splitlines():
              if ln.startswith("MemAvailable:"):
                  mem = int(ln.split()[1]) * 1024
          free = shutil.disk_usage(pathlib.Path.home()).free
          print("MPW_VPS_FREE_MEM_MB", mem // 1048576)
          print("MPW_VPS_DISK_FREE_MB", free // 1048576)
          PY
          if command -v docker >/dev/null 2>&1 && timeout 8s docker info >/dev/null 2>&1; then
            echo MPW_VPS_DOCKER_AVAILABLE=True
          else
            echo MPW_VPS_DOCKER_AVAILABLE=False
          fi
          if command -v podman >/dev/null 2>&1 && timeout 8s podman info >/dev/null 2>&1; then
            echo MPW_VPS_PODMAN_AVAILABLE=True
          else
            echo MPW_VPS_PODMAN_AVAILABLE=False
          fi
          if command -v mysqld >/dev/null 2>&1 || command -v mariadbd >/dev/null 2>&1; then
            echo MPW_VPS_MYSQL_SERVER_BINARY=True
          else
            echo MPW_VPS_MYSQL_SERVER_BINARY=False
          fi
          PROBE
          timeout 65s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export DJANGO_SETTINGS_MODULE=config.settings
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import django
          django.setup()
          from django.db import connections
          from django.conf import settings
          from pathlib import Path
          import os
          assert settings.DATABASES["default"]["ENGINE"] == "django.db.backends.mysql"
          with connections["default"].cursor() as cur:
              cur.execute("SHOW GRANTS FOR CURRENT_USER()")
              grants = [str(row[0]).upper() for row in cur.fetchall()]
          global_create = any(" ON *.*" in g and ("ALL PRIVILEGES" in g or "CREATE" in g) for g in grants)
          home = Path.home()
          root = home / ".mpw-private-db-backups"
          archives = list(root.glob("*/mysql-full.sql.gz")) if root.exists() else []
          print("MPW_HOST_MYSQL_GLOBAL_CREATE_GRANT=" + str(global_create))
          print("MPW_HOST_PRIVATE_ARCHIVE_COUNT=" + str(len(archives)))
          print("MPW_HOST_PRIVATE_BACKUPS_MODE0700=" + str(root.is_dir() and (root.stat().st_mode & 0o777) == 0o700))
          print("MPW_NO_SCHEMA_OR_SITE_CHANGES=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
