name: C04-C10 bot-to-desk commercial handoff, PHP NO-GO, CRM and pricing
on:
  pull_request:
    paths:
      - .github/workflows/mojtaba-revenue-c04-single-intake-ci-20261114.yml
      - core/service_quote_draft.py
      - core/service_lead_handoff.py
      - core/tests/test_autonomous_service_desk_handoff_c10_20261114.py
      - core/admin.py
      - command_center/service_proposal_funnel.py
      - deploy/company_public_intake_probe_readonly.py
      - command_center/service_pricing_workbench.py
      - command_center/templates/command_center/service_pricing_workbench.html
      - core/tests/test_service_pricing_workbench_c08_20261114.py
      - tests/test_company_public_intake_probe_20261114.py
      - deploy/company_public_intake_release_gate.py
      - tests/test_company_public_intake_release_gate_20261114.py
      - command_center/templates/command_center/service_proposal_funnel.html
      - command_center/templates/command_center/dashboard.html
      - command_center/urls.py
      - core/tests/test_service_lead_queue_c07_20261114.py
      - core/management/commands/mojtaba_prepare_service_drafts.py
      - core/tests/test_service_proposal_conversion_c05_20261114.py
      - core/economic_tool_pack.py
      - core/autonomous_brain.py
      - core/management/commands/seed_online_income_agents.py
      - core/service_intake_routing.py
      - core/company_content_views.py
      - core/views.py
      - core/templates/core/platform_page.html
      - core/tests/test_company_portal_single_source_c06_20261114.py
      - tests/test_company_inquiry_validation_20261106.py
  push:
    branches:
      - feature/mojtaba-bot-lead-source-of-truth-c04-20261114
    paths:
      - .github/workflows/mojtaba-revenue-c04-single-intake-ci-20261114.yml
      - core/service_quote_draft.py
      - core/service_lead_handoff.py
      - core/tests/test_autonomous_service_desk_handoff_c10_20261114.py
      - core/admin.py
      - command_center/service_proposal_funnel.py
      - deploy/company_public_intake_probe_readonly.py
      - command_center/service_pricing_workbench.py
      - command_center/templates/command_center/service_pricing_workbench.html
      - core/tests/test_service_pricing_workbench_c08_20261114.py
      - tests/test_company_public_intake_probe_20261114.py
      - deploy/company_public_intake_release_gate.py
      - tests/test_company_public_intake_release_gate_20261114.py
      - command_center/templates/command_center/service_proposal_funnel.html
      - command_center/templates/command_center/dashboard.html
      - command_center/urls.py
      - core/tests/test_service_lead_queue_c07_20261114.py
      - core/management/commands/mojtaba_prepare_service_drafts.py
      - core/tests/test_service_proposal_conversion_c05_20261114.py
      - core/economic_tool_pack.py
      - core/autonomous_brain.py
      - core/management/commands/seed_online_income_agents.py
      - core/service_intake_routing.py
      - core/company_content_views.py
      - core/views.py
      - core/templates/core/platform_page.html
      - core/tests/test_company_portal_single_source_c06_20261114.py
      - tests/test_company_inquiry_validation_20261106.py
permissions:
  contents: read
jobs:
  single-source-of-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SECRET_KEY: isolated-ci-no-live-secret
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///test-c04-single-source.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact C04 head
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standard project requirements without prod secrets
        run: python -m pip install -r requirements.txt
      - name: Compile changed files and all target tests
        run: |
          python -m py_compile config/settings.py core/service_intake_routing.py
          python -m py_compile core/service_lead_views.py core/services_views.py core/economic_master_agent.py
          python -m py_compile command_center/service_intake_diagnostics.py command_center/urls.py
          python -m py_compile core/management/commands/mojtaba_intake_source_readonly.py
          python -m py_compile core/service_quote_draft.py core/autonomous_brain.py core/economic_tool_pack.py
          python -m py_compile core/service_lead_handoff.py core/tests/test_autonomous_service_desk_handoff_c10_20261114.py
          python -m py_compile core/admin.py command_center/service_proposal_funnel.py command_center/urls.py
          python -m py_compile command_center/service_pricing_workbench.py core/tests/test_service_pricing_workbench_c08_20261114.py
          python -m py_compile deploy/company_public_intake_probe_readonly.py tests/test_company_public_intake_probe_20261114.py
          python -m py_compile deploy/company_public_intake_release_gate.py tests/test_company_public_intake_release_gate_20261114.py
          python -m py_compile core/management/commands/mojtaba_prepare_service_drafts.py
          python -m py_compile core/management/commands/seed_online_income_agents.py core/company_content_views.py core/views.py
          python -m py_compile core/tests/test_company_portal_single_source_c06_20261114.py tests/test_company_inquiry_validation_20261106.py
          python -m py_compile command_center/tests/test_service_intake_source_c04_20261114.py
          python -m py_compile core/tests/test_service_lead_intake_c03_20261114.py
          python -m py_compile core/tests/test_service_proposal_conversion_c05_20261114.py
          python -m py_compile core/tests/test_service_lead_queue_c07_20261114.py
      - name: Verify public-only host probe logic without external requests
        run: |
          python -m unittest discover -s tests -p 'test_company_public_intake_probe_20261114.py' -q
          python -m unittest discover -s tests -p 'test_company_public_intake_release_gate_20261114.py' -q
      - name: Public first-party form GET evidence (no secrets, non-blocking)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python deploy/company_public_intake_probe_readonly.py | tee "$RUNNER_TEMP/zm_public_intake_probe.jsonline"
          python deploy/company_public_intake_release_gate.py "$RUNNER_TEMP/zm_public_intake_probe.jsonline"
      - name: Verify Django system and URL configuration
        run: python manage.py check
      - name: Preserve prior pricing and service science regression gates
        run: |
          python -m unittest discover -s core/tests -p 'test_revenue_unit_economics_20261114.py' -q
          python -m unittest discover -s core/tests -p 'test_service_sales_controls_20261114.py' -q
      - name: CRM plus source-of-truth tests in isolated SQLite
        run: |
          python -m pytest -q --disable-warnings --maxfail=1 \
            command_center/tests/test_revenue_operations_20261114.py \
            core/tests/test_service_lead_intake_c03_20261114.py \
            command_center/tests/test_lead_workqueue_c03_20261114.py \
            command_center/tests/test_lead_cli_c03_20261114.py \
            command_center/tests/test_service_intake_source_c04_20261114.py \
            core/tests/test_service_proposal_conversion_c05_20261114.py \
            core/tests/test_company_portal_single_source_c06_20261114.py \
            tests/test_company_inquiry_validation_20261106.py \
            core/tests/test_service_lead_queue_c07_20261114.py \
            core/tests/test_service_pricing_workbench_c08_20261114.py \
            core/tests/test_autonomous_service_desk_handoff_c10_20261114.py
