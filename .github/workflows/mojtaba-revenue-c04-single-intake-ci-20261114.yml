name: C04 sole intake source of truth and CRM regression
on:
  push:
    branches:
      - feature/mojtaba-bot-lead-source-of-truth-c04-20261114
    paths:
      - .github/workflows/mojtaba-revenue-c04-single-intake-ci-20261114.yml
permissions:
  contents: read
jobs:
  single-source-of-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SECRET_KEY: isolated-ci-no-live-secret
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///test-c04-single-source.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact C04 head
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standard project requirements without prod secrets
        run: python -m pip install -r requirements.txt
      - name: Compile changed files and all target tests
        run: |
          python -m py_compile config/settings.py core/service_intake_routing.py
          python -m py_compile core/service_lead_views.py core/services_views.py core/economic_master_agent.py
          python -m py_compile command_center/service_intake_diagnostics.py command_center/urls.py
          python -m py_compile core/management/commands/mojtaba_intake_source_readonly.py
          python -m py_compile command_center/tests/test_service_intake_source_c04_20261114.py
          python -m py_compile core/tests/test_service_lead_intake_c03_20261114.py
      - name: Verify Django system and URL configuration
        run: python manage.py check
      - name: Preserve prior pricing and service science regression gates
        run: |
          python -m unittest discover -s core/tests -p 'test_revenue_unit_economics_20261114.py' -q
          python -m unittest discover -s core/tests -p 'test_service_sales_controls_20261114.py' -q
      - name: CRM plus source-of-truth tests in isolated SQLite
        run: |
          python -m pytest -q --disable-warnings --maxfail=1 \
            command_center/tests/test_revenue_operations_20261114.py \
            core/tests/test_service_lead_intake_c03_20261114.py \
            command_center/tests/test_lead_workqueue_c03_20261114.py \
            command_center/tests/test_lead_cli_c03_20261114.py \
            command_center/tests/test_service_intake_source_c04_20261114.py
