name: AE-2026-001 official WDI component revision identity (noncausal)
on:
  push:
    branches: [research/mr-2026-001-novelty-audit]
    paths:
      - .github/workflows/ae-2026-001-official-component-revision-identity.yml
      - research/manuscripts/AE-2026-001/analysis/official_wdi_two_vintage_value_added_implied_labor_decomposition.py
      - research/manuscripts/AE-2026-001/analysis/official_wdi_2024_vs_2026_vintage_audit.py
      - research/manuscripts/AE-2026-001/AE-2026-001_OFFICIAL_WDI_OBSERVED_COUNTRY_PANEL_2026-10-25.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-original-archive-component-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source XLSX parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Audit historical source series, SHA256, matched countries and algebraic residual
        run: python research/manuscripts/AE-2026-001/analysis/official_wdi_two_vintage_value_added_implied_labor_decomposition.py
      - name: Archive numerical results, not an editorial novelty claim
        uses: actions/upload-artifact@v4
        with:
          name: AE-2026-001-2024-2025-official-value-added-implied-labor-identity
          path: research/manuscripts/AE-2026-001/AE-2026-001_2024_2025_COMPONENT_REVISION_IDENTITY_AUDIT_2026-10-26.json
          retention-days: 7
          if-no-files-found: error
