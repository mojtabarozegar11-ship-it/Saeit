name: MojPlayWin About postpublication SEO refinement exact static only
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-about-seo-refinement-20261018.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-about-exact-static-prod
  cancel-in-progress: false
jobs:
  refine-about:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-mpw-about-seo-20261018]')
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check narrow-only About patch source and synthetic semantic test
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_about_seo_exact_patch_20261018.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          import mojplaywin_about_seo_exact_patch_20261018 as m
          original=(
            '<!doctype html><html><head>'
            '<title>About MojPlayWin | Scientific, Digital &amp; Complementary Business Profile</title>'
            '<meta property="og:title" content="Generic brand title">'
            '<meta property="og:description" content="Generic brand description">'
            '</head><body><main><h1>Original games. Measured evolution.</h1>'
            '<h2>Our complete company profile</h2>'
            '<p>MPW_ABOUT_RESEARCH_80_20_V1 SPECIALISM 28 COMPLEMENTARY SPECIALISM 30 Original by Default</p>'
            '</main></body></html>')
          result=m.patch(original)
          assert result.count('<h1')==1
          assert '<h1>About MojPlayWin</h1>' in result
          assert 'mpw-about-original-tagline' in result
          assert 'mpw-about-schema-20261018' in result
          assert 'Generic brand title' not in result
          assert 'Generic brand description' not in result
          print("MPW_ABOUT_SEO_SYNTHETIC_PASS=true")
          PY
      - name: Capture nine protected routes before content-only amendment
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          urls=["https://mojplaywin.com/","https://mojplaywin.com/store/",
            "https://mojplaywin.com/about/mojtaba-rozegar/",
            "https://mojplaywin.com/mojtaba.roozegar/",
            "https://mojplaywin.com/mojtaba.roozegar/about/",
            "https://mojplaywin.com/farnaz/","https://mojplaywin.com/saman/",
            "https://mojplaywin.com/picm/","https://zomorodmelal.ir/"]
          status={}
          for url in urls:
            req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"MPWAboutSeoScope/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=19) as res:code=res.status
            except urllib.error.HTTPError as exc:code=exc.code
            status[url]=code
            print("PRE_SCOPE="+url+" "+str(code))
          for url in (urls[0],urls[1],urls[3],urls[5]):
            if status[url]!=200:raise SystemExit("PRE_SCOPE_NO_GO "+url)
          with open(os.environ["RUNNER_TEMP"]+"/mpw-about-before-routes.json","w") as out:
            json.dump(status,out)
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Atomic edit of original About static file with strict SHA gates
        id: edit
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - install '$GITHUB_RUN_ID'" \
            < scripts/mojplaywin_about_seo_exact_patch_20261018.py
      - name: Confirm SEO signals, every specialist chapter and protected routes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html.parser,urllib.request,urllib.error,os,json,time
          class Analyze(html.parser.HTMLParser):
            def __init__(self):
              super().__init__();self.h=[];self.title=[];self.meta={};self.cur=None
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=="h1":self.cur="h1";self.h.append("")
              if tag=="title":self.cur="title"
              if tag=="meta":
                key=d.get("property") or d.get("name")
                if key:self.meta[key]=d.get("content")
            def handle_data(self,s):
              if self.cur=="h1":self.h[-1]+=s
              if self.cur=="title":self.title.append(s)
            def handle_endtag(self,tag):
              if tag in ("h1","title"):self.cur=None
          verified=False
          for attempt in range(1,5):
            try:
              url="https://mojplaywin.com/about/?__mpw_seo_live="+os.environ["GITHUB_RUN_ID"]+"-"+str(attempt)
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"MPWAboutSeoCheck/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:raw=r.read(250000).decode("utf-8","replace")
              p=Analyze();p.feed(raw)
              verified=(
                p.h==["About MojPlayWin"] and
                "About MojPlayWin" in "".join(p.title) and
                (p.meta.get("og:title") or "").startswith("About MojPlayWin") and
                "10 complementary" in (p.meta.get("og:description") or "") and
                raw.count('id="mpw-about-schema-20261018"')==1 and
                all(w in raw for w in ("Original games. Measured evolution.","Original by Default",
                    "SPECIALISM 28","COMPLEMENTARY SPECIALISM 30")))
              print("MPW_ABOUT_SEO_LIVE_ATTEMPT="+str(attempt)+" verified="+str(verified))
              if verified:break
            except Exception as exc:
              print("SEO_CHECK_RETRY="+type(exc).__name__)
            time.sleep(3)
          if not verified:raise SystemExit("SEO_LIVE_NOT_VERIFIED:ROLLBACK_REQUIRED")
          original=json.load(open(os.environ["RUNNER_TEMP"]+"/mpw-about-before-routes.json"))
          for url,baseline in original.items():
            req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"MPWAboutSeoScope/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:code=r.status
            except urllib.error.HTTPError as e:code=e.code
            print("MPW_PROTECTED_SEO="+url+" status="+str(code))
            if code!=baseline:raise SystemExit("PROTECTED_PATH_CHANGED "+url)
          print("MPW_ABOUT_SEO_POSTRELEASE_PASS=true")
          PY
      - name: Restore single About HTML if smoke fails
        if: failure() && steps.edit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel \
            "python3 - rollback '$GITHUB_RUN_ID'" \
            < scripts/mojplaywin_about_seo_exact_patch_20261018.py
