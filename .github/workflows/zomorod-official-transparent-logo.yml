name: Publish approved transparent company emblem only on Zomorod main site
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-official-transparent-logo.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-official-logo-main-only
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Check uploaded genuine transparent PNG and no removed old logo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_zomorod_transparent_brand.py -v
          python3 -m py_compile scripts/deploy_zomorod_transparent_logo.py
          echo "ZM_LOGO_SOURCE=approved_transparent_png_verified"
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Create private backups before transferring logo or templates
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          umask 077
          sha="$1"
          root="$HOME/.backups/zomorod-approved-logo/$sha"
          test ! -e "$root"
          mkdir -p "$(dirname "$root")"
          mkdir -m 700 "$root"
          mkdir -m 700 "$root/staging"
          mkdir -m 700 "$root/original"
          test -s "$HOME/public_html/static/site/company/company-logo.png"
          test ! -e "$HOME/public_html/static/site/company/company-logo-transparent.png"
          echo "ZM_LOGO_PRIVATE_BACKUP_PATH=created"
          REMOTE
      - name: Transfer exact GitHub-approved image and eight templates to protected staging only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          stage="$RUNNER_TEMP/zomorod-logo-release-files"
          mkdir -m 700 "$stage"
          cp content/zomorod-brand/logo-transparent-128.png "$stage/logo.png"
          cp content/zomorod-new-home/index.html "$stage/root.html"
          for slug in company about services industry research knowledge; do
            cp "content/zomorod-nova-pages/$slug.html" "$stage/$slug.html"
          done
          cp templates/admin/base_site.html "$stage/admin.html"
          cp scripts/deploy_zomorod_transparent_logo.py "$stage/deploy_logo.py"
          tar -cf - -C "$stage" . |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C /home/zomorod2/.backups/zomorod-approved-logo/$GITHUB_SHA/staging"
          echo "ZM_LOGO_SOURCE_TRANSFER=complete"
      - name: Perform strictly scoped validated logo-only switch and roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha="$1"
          root="$HOME/.backups/zomorod-approved-logo/$sha/staging"
          test -s "$root/deploy_logo.py"
          python3 "$root/deploy_logo.py" "$root"
          REMOTE
      - name: Remove all temporary runner SSH keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory" "$RUNNER_TEMP/zomorod-logo-release-files"
