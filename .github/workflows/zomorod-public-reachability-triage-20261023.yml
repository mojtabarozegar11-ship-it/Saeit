name: Zomorod public HTTPS reachability triage — read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-public-reachability-triage-20261023.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fingerprint pinned relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Compare external DNS and TCP from VPS with local cPanel origin
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          for node in vps host; do
            echo "DIAGNOSTIC_NODE=$node"
            timeout 80s ssh -T -F "$d/config" "$node" 'python3 -' <<'PY'
          import socket,subprocess,hashlib
          from pathlib import Path
          host="zomorodmelal.ir"
          try:
              addresses=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              print("PUBLIC_DNS_RESOLVES",bool(addresses),"RECORDS",len(addresses))
              for item in addresses[:2]:
                  try:
                      sock=socket.create_connection(item[4],timeout=5)
                      print("PUBLIC_TCP_443",True);sock.close();break
                  except OSError as e:print("PUBLIC_TCP_443",False,"ERROR_CLASS",type(e).__name__)
          except Exception as e:print("PUBLIC_DNS_RESOLVES",False,"ERROR_CLASS",type(e).__name__)
          for name,args in [
              ("PUBLIC_HTTPS",["curl","-sS","-L","--connect-timeout","6","--max-time","10","-o","/dev/null","-w","%{http_code}","https://"+host+"/"]),
              ("ORIGIN_LOCAL_HTTP",["curl","-sS","--connect-timeout","4","--max-time","8","-H","Host: "+host,"-o","/dev/null","-w","%{http_code}","http://127.0.0.1/"]),
              ("ORIGIN_LOCAL_HTTPS",["curl","-sS","-L","--connect-timeout","4","--max-time","8","--resolve",host+":443:127.0.0.1","-o","/dev/null","-w","%{http_code}","https://"+host+"/"])]:
              p=subprocess.run(args,capture_output=True,text=True,timeout=13)
              print(name,"HTTP",p.stdout.strip(),"RC",p.returncode,"ERROR_TYPE",("timeout" if p.returncode==28 else "connection" if p.returncode==7 else "tls" if p.returncode in (35,60) else "none" if p.returncode==0 else "other"))
          if Path.home().joinpath("public_html","index.html").is_file():
              p=Path.home()/"public_html"/"index.html"
              print("DOCROOT_ROOT_PRESENT",True,"SIZE",p.stat().st_size,"SHA_PREFIX",hashlib.sha256(p.read_bytes()).hexdigest()[:16])
          PY
          done
      - name: Persist private blocked-or-queued hourly release receipt without public writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 65s ssh -T -F "$d/config" host "python3 - '$GITHUB_RUN_ID' '$GITHUB_SHA'" <<'PY'
          import hashlib,json,os,socket,sys,time
          from pathlib import Path
          run,sha=sys.argv[1:]
          home=Path.home();web=home/'public_html'
          store=home/'.backups'/'zomorod-hourly-cycle'/run
          store.mkdir(parents=True,mode=0o700,exist_ok=False)
          root=web/'index.html'
          try:
              conn=socket.create_connection(('zomorodmelal.ir',443),timeout=6)
              conn.close();available=True
          except OSError:available=False
          manifest={
              'status':'queued' if available else 'blocked',
              'release_id':run,
              'commit_sha':sha,
              'source_release_commit':'60f9e44751fcb754f1d44b9ab5a0b6881fdd02b4',
              'run_url':'https://github.com/mojtabarozegar11-ship-it/Saeit/actions/runs/'+run,
              'source_test_run_url':'https://github.com/mojtabarozegar11-ship-it/Saeit/actions/runs/39946146761',
              'backup_path':str(home/'.backups'/'zomorod-field-tools-20261023'/'39946146761'),
              'public_urls':[],
              'public_http':{'https://zomorodmelal.ir/':'unreachable' if not available else 'recheck'},
              'hashes':{'protected_root':hashlib.sha256(root.read_bytes()).hexdigest()},
              'counts':{'tools':{'built':2,'tested':2,'published':0},
                        'articles':{'built':2,'tested':2,'published':0},
                        'images':{'built':2,'tested':2,'published':0},
                        'games':{'built':0,'tested':0,'published':0}},
              'previous_attempts':[
                  {'run_id':'39945985056','status':'rolled_back'},
                  {'run_id':'39946146761','status':'rolled_back'},
                  {'run_id':'39946652709','status':'blocked_preflight'},
                  {'run_id':'39946880562','status':'blocked_preflight'}],
              'error':None if available else 'PUBLIC_TCP_443_REFUSED_FROM_VPS_AND_CPANEL; EXTERNAL_HTTP_UNREACHABLE',
              'next':'recheck_external_https_and_only_then_attempt_scoped_live_release',
              'created_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
          }
          p=store/'manifest.json'
          p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          os.chmod(p,0o600)
          print('PRIVATE_CYCLE_RECEIPT_STATE',manifest['status'],'ROOT_SHA_PREFIX',manifest['hashes']['protected_root'][:16])
          PY
      - name: Scrub SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/farm-v4-ssh"
