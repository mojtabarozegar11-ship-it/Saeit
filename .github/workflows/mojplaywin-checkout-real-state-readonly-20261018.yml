name: MojPlayWin crypto checkout actual-state read-only audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-checkout-real-state-readonly-20261018.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Audit existing checkout and cryptocurrency flow without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,re,os
          app=Path('/home/zomorod2/Saeit-staging')
          wsgi=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          if not app.is_dir() or app.is_symlink() or not wsgi.is_file() or "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):
              raise SystemExit('LIVE_APP_PIN_UNVERIFIED')
          relative=['config/urls.py','core/urls.py','core/commerce_views.py','core/mojplaywin_views.py',
            'core/api.py','core/models.py','core/templates/mojplaywin/store.html',
            'core/templates/mojplaywin/checkout.html','core/templates/mojplaywin/payment.html']
          report=[]
          for rel in relative:
              p=app/rel
              if not p.is_file() or p.is_symlink():
                  report.append({'path':rel,'exists':False});continue
              b=p.read_bytes();content=b.decode('utf-8','replace')
              report.append({'path':rel,'exists':True,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),
                 'has_payment_routes':('payments/' in content or 'checkout/' in content),
                 'has_approval_logic':('awaiting_approval' in content or 'ready_for_gateway' in content),
                 'has_store_guides':('store_ten_buyer_guides_20261018' in content)})
          print('MPW_PAYMENT_ACTIVE_FILES='+json.dumps(report))
          target=app/'config/urls.py'
          s=target.read_text('utf8','replace') if target.is_file() else ''
          route_lines=[x.strip()[:160] for x in s.splitlines() if re.search(r'checkout|payment|store/|api/',x,re.I)]
          print('MPW_CHECKOUT_URL_ROUTES='+json.dumps(route_lines))
          cryptos=[]
          for folder in [app/'core',app/'config']:
              if folder.is_dir() and not folder.is_symlink():
                  for p in folder.iterdir():
                      if p.suffix not in ('.py','.json') or not p.is_file() or p.is_symlink():continue
                      if re.search('crypto|wallet|tron|trc20|erc20|onchain|payment',p.name,re.I):
                          cryptos.append({'path':str(p.relative_to(app)),'bytes':p.stat().st_size})
          print('MPW_CRYPTO_FILE_MAP='+json.dumps(cryptos[:70]))
          env_markers=['PAYMENT_WEBHOOK_SECRET','TRON_API_KEY','TRONGRID_API_KEY',
            'CRYPTO_PAYMENT_ENABLED','PAYMENT_LIVE_ENABLED','USDT_TRC20_WALLET',
            'USDT_ERC20_WALLET','ETH_RECEIVE_ADDRESS','TRX_RECEIVE_ADDRESS']
          print('MPW_CRYPTO_ENV_FLAGS='+json.dumps({k:bool(os.environ.get(k,'')) for k in env_markers}))
          PY
      - name: Verify checkout and payment API statuses read only no orders or transactions
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          paths=['/store/','/checkout/','/api/orders/','/api/payments/','/api/payment-webhooks/']
          for path in paths:
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPWCryptoCheckoutSafeAudit/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      status=r.status;ct=r.headers.get('Content-Type','')
              except urllib.error.HTTPError as e:
                  status=e.code;ct=e.headers.get('Content-Type','')
              print('MPW_PAYMENT_PUBLIC_STATUS='+json.dumps({'path':path,'status':status,'mime':ct[:75]}))
          PY
