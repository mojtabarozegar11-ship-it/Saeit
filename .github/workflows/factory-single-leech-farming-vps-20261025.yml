              {"id":"ceylan2026","publisher":"Frontiers in Veterinary Science",
               "title":"Influence of various reproduction substrates on the survival, health, and reproductive output of broodstock Mediterranean medicinal leech (Hirudo verbana)",
               "url":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1969385/full",
               "checked_date":"2026-10-25",
               "evidence_note":"Original controlled substrate study used 40 gravid Hirudo verbana and compared four breeding media; the small single-cycle design limits universal recommendations."},
              {"id":"fda2024","publisher":"United States Food and Drug Administration",
