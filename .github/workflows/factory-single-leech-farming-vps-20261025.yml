            "chapters":["species identification and traceability","physiology and ecology","responsible facility design","water physicochemistry and monitoring","breeding and cocoons","juvenile care and welfare","feeding and lawful sourcing","biosecurity and pathogen surveillance","quarantine and veterinary management","population and batch analytics","waste and environmental protection","conservation and CITES","jurisdiction-specific regulatory approvals","medical-use regulatory separation","farm operations and staffing","CAPEX OPEX unit economics","risk analysis and case studies","professional competency assessment"],
