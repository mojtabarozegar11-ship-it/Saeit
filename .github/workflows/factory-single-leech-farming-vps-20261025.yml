name: Owner single English leech-farming F01 VPS manufacturing intake
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/factory-single-leech-farming-vps-20261025.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: owner-single-leech-farming-private-20261025
  cancel-in-progress: false
jobs:
  single-private-intake:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[owner-leech-vps-start-20261025]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start exactly one private F01 order on pinned VPS if previous queue was cleared
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/leech-private-intake"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 190s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import fcntl, hashlib, importlib.util, json, os, re, shutil, sys
          from pathlib import Path
          base=Path("/home/githubops/factory-runtime")
          root=base/"private/autonomous-product-cycle"
          area=root/"production-instructions"
          orders=area/"orders"
          ops=base/"operations/production-instructions"
          worker=ops/"stage1-english-first-worker.py"
          stage2=ops/"stage2-research-serial.py"
          ident="WO-26102501"
          product_key="vocational-leech-farming-en-20261025"
          reserve=2*1024**3
          for p in (base,root,area,orders,ops):
              if p.is_symlink() or not p.is_dir(): raise SystemExit("LEECH_BLOCKED_UNSAFE_OR_MISSING_VPS_PATH")
          for p in (worker,stage2):
              if p.is_symlink() or not p.is_file(): raise SystemExit("LEECH_BLOCKED_EXISTING_WORKER_UNAVAILABLE")
          free=shutil.disk_usage(root).free
          if free<reserve:
              print("LEECH_VPS_START_BLOCKED="+json.dumps({"reason":"BELOW_2_GIB_RESERVE","free_gib":round(free/2**30,3),"mutations":0}))
              raise SystemExit(2)
          title="The Professional Leech Farming Handbook: Biology, Breeding, Biosecurity, Farm Economics and Responsible Commercial Operations"
          scope={
            "title":title,"product_key":product_key,"family_id":"F01",
            "language":"en-GB","market":"mojplaywin.com","minimum_original_words":150001,
            "format":["accessible PDF","EPUB","editable source","original diagrams","economic workbook","SOPs","assessment and answers"],
            "chapters":["species identification and traceability","physiology and ecology","responsible facility design","water physicochemistry and monitoring","breeding and cocoons","juvenile care and welfare","feeding and lawful sourcing","biosecurity and pathogen surveillance","quarantine and veterinary management","population and batch analytics","waste and environmental protection","conservation and CITES","jurisdiction-specific regulatory approvals","medical-use regulatory separation","farm operations and staffing","CAPEX OPEX unit economics","risk analysis and case studies","professional competency assessment"],
            "primary_sources":[
              "Aminov et al. 2025 DOI:10.17420/ap71.549",
              "Ceylan 2026 DOI:10.3389/fvets.2026.1969385",
              "FDA CBER Medicinal Leeches NRN 2024-12-30 transfer",
              "CITES official trade and appendices (jurisdiction verification required)"
            ]}
          digest=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,ensure_ascii=False,separators=(",",":")).encode()).hexdigest()
          instruction=("Professionally author exactly ONE complete original English vocational specialist book of at least 150001 verified substantive words, not a prototype. Cover species-specific Hirudo biology, controlled breeding, biosecurity, zoonoses and Aeromonas risk, traceable lawful husbandry, reproductive substrates, care, QC, plant design, cost model, welfare, CITES, clinical marketing limitations and jurisdictional permits. Include assessments, solved cases, professional SOPs and editable operational records. Cite authentic current peer-reviewed primary evidence and official authorities, reject invented statistics, citations, certification or legal permissions. Prohibit unapproved wild collection, direct human feeding, clinical treatment claims and unsupported husbandry instructions. Deliver accessible PDF/EPUB, original source and model, figures, glossary/index and full rights/provenance. Apply existing 12-stage independent QC1000 and per-defect rework; never auto-publish.")
          order={
           "schema":"saeit.factory.production-instructions.v1","id":ident,
           "origin":"owner_requested_single_leech_english_20261025",
           "source_product_id":product_key,"source_sha256":digest(scope),
           "priority":"P0","priority_rank":1,"priority_group":"OWNER_SINGLE_PRODUCT",
           "priority_reason":"OWNER_DIRECTIVE_2026_10_25",
           "family_id":"F01","related_learning_family":"F07","phase":"engineering_specification",
           "slot":1,"subject":title,"instruction":instruction,"scope":scope,
           "editions":[{"locale":"en-GB","site":"mojplaywin.com","title_working":title,"currency":"USD"}],
           "minimum_original_prose_words":150001,"authoring_target_original_words":160000,
           "required_chapters":30,"actual_chapters_verified":0,
           "acceptance":[
              "Substantive original English coverage at least 150001 words; independent chapter-by-chapter technical review",
              "Verify species, evidence per claim and dated primary source provenance",
              "Real safe husbandry SOPs, pathogen/biosecurity management, lawful feed and welfare protocols",
              "Jurisdiction-specific CITES, wildlife and medicinal-use regulatory compliance review",
              "Accessible original PDF and EPUB, editable source, diagrams, glossary, assessment and financial model",
              "Independent authenticated specialist and legal-rights review, 12-stage receipts and QC1000 before finished goods",
              "No store, customer order, payment or commercial release before owner exact-version approval"
            ],
           "product_goal_count":1,"technical_product_release":False,
           "status":"issued","instruction_kind":"private_factory_work_order",
           "independent_of_websites":True,"requires_customer_order":False,"api_required":False,
           "manufacturing_qa_passed":False,"publication_approved":False,
           "public_distribution_allowed":False,"warehouse_goods_created":False,
           "commercial_release":False,"pricing_authority":"CHATGPT_FAIR_BASE_PRICE_SUBJECT_TO_REVIEW",
           "discount_authority":"OWNER_ONLY","discount_percent":0
          }
          order["fingerprint"]=digest({k:v for k,v in order.items() if k not in ("schema","status","instruction_kind","fingerprint")})
          target=orders/(ident+".json")
          lockpath=area/".orders.lock"
          if lockpath.is_symlink(): raise SystemExit("LEECH_BLOCKED_UNSAFE_LOCK")
          with lockpath.open("a+b") as mutex:
              os.fchmod(mutex.fileno(),0o600)
              fcntl.flock(mutex.fileno(),fcntl.LOCK_EX)
              prior=sorted(orders.iterdir())
              if any(x.is_symlink() or not x.is_file() or re.fullmatch(r"WO-[0-9]{8}\.json",x.name) is None for x in prior):
                  raise SystemExit("LEECH_BLOCKED_UNSAFE_OLD_QUEUE")
              legacy=[file for file in prior if file.name!=target.name]
              if legacy:
                  from collections import Counter
                  origin,status,sites=Counter(),Counter(),Counter()
                  for file in legacy:
                      try:
                          doc=json.loads(file.read_text(encoding="utf8"))
                          origin[str(doc.get("origin","missing"))[:80]]+=1
                          status[str(doc.get("status","missing"))[:50]]+=1
                          sites[str(doc.get("requesting_site","internal"))[:60]]+=1
                      except (ValueError,OSError):
                          origin["unreadable"]+=1
                  import subprocess
                  cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=6,check=False)
                  active=[x.strip().rsplit("#",1)[-1].strip()[:100] for x in cron.stdout.splitlines()
                      if x.strip() and not x.lstrip().startswith("#")]
                  expected_origins={"mojplaywin-site-qa-return":15,"owner_requested_education700_p0":1,"site-topic-snapshot":54}
                  expected_status={"blocked_rework":15,"issued":55}
                  expected_sites={"internal":1,"mojplaywin.com":15,"zomorodmelal.ir":54}
                  if (len(legacy)!=70 or dict(origin)!=expected_origins
                      or dict(status)!=expected_status or dict(sites)!=expected_sites):
                      print("LEECH_VPS_START_BLOCKED="+json.dumps({"reason":"UNEXPECTED_LEGACY_QUEUE",
                          "old_queue_count":len(legacy),"origin_counts":dict(origin),
                          "status_counts":dict(status),"requesting_site_counts":dict(sites),
                          "mutations":0},sort_keys=True))
                      raise SystemExit(2)
                  for file in legacy:
                      doc=json.loads(file.read_text(encoding="utf8"))
                      if doc.get("source_product_id")==product_key:
                          raise SystemExit("LEECH_BLOCKED_DUPLICATE_PRODUCT_KEY")
                  print("LEECH_PROTECTED_LEGACY_ORDERS="+json.dumps({"preserved":len(legacy),
                      "known_origins":dict(origin),"legacy_queue_modified":False,
                      "existing_english_first_cron_present":("SAEIT_ENGLISH_FIRST_SINGLE_ACTIVE_20261025" in active)},sort_keys=True))
              if target.exists():
                  old=json.loads(target.read_text(encoding="utf8"))
                  if old!=order: raise SystemExit("LEECH_BLOCKED_PREEXISTING_ORDER_COLLISION")
                  created=False
              else:
                  fd=os.open(str(target),os.O_WRONLY|os.O_CREAT|os.O_EXCL|getattr(os,"O_NOFOLLOW",0),0o600)
                  with os.fdopen(fd,"w",encoding="utf8") as out:
                      json.dump(order,out,sort_keys=True,ensure_ascii=False,indent=2)
                      out.write("\n");out.flush();os.fsync(out.fileno())
                  created=True
              module_spec=importlib.util.spec_from_file_location("stage1_leech_existing",worker)
              module=importlib.util.module_from_spec(module_spec)
              module_spec.loader.exec_module(module)
              module.validate_order(order,ident)
              forwarded=module.forward(root,order,revision=1)
          receipt=area/"stage-01/receipts"/(ident+"--r001.json")
          inbox=area/"stage-02/inbox"/(ident+"--r001.json")
          if not receipt.is_file() or not inbox.is_file():
              raise SystemExit("LEECH_STAGE1_RECEIPT_MISSING")
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          print("LEECH_SINGLE_PRODUCT_VPS="+json.dumps({
            "product_key":product_key,"order_id":ident,"order_created":created,
            "stage1_forwarded":forwarded,"stage1_receipt_sha256":sha(receipt),
            "stage2_inbox_sha256":sha(inbox),"private_only":True,
            "quality1000_certified":False,"published":False,
            "free_gib_at_preflight":round(free/2**30,3)},sort_keys=True))
          import subprocess
          cmd=[str(base/".venv/bin/python"),"-B",str(stage2),"--factory-private",str(root),
               "--only-order-id",ident,"--batch","1"]
          try:
              run=subprocess.run(cmd,capture_output=True,text=True,timeout=48,check=False)
              step={"order_id":ident,"stage2_exit":run.returncode,
                    "stdout_tail":run.stdout[-900:],"stderr_tail":run.stderr[-900:],
                    "research_needed":(area/"stage-02/research-needed"/(ident+"--r001.json")).is_file(),
                    "research_receipt":(area/"stage-02/receipts"/(ident+"--r001.json")).is_file()}
          except subprocess.TimeoutExpired:
              step={"order_id":ident,"stage2_exit":"timeout_48s","research_completed":False}
          print("LEECH_STAGE2_ONE_ORDER="+json.dumps(step,sort_keys=True))
          # One-order-only evidence adapter: the existing 200-item bilingual
          # source validator remains unchanged on disk and for all other orders.
          s2spec=importlib.util.spec_from_file_location("single_leech_stage2_adapter",stage2)
          s2=importlib.util.module_from_spec(s2spec)
          s2spec.loader.exec_module(s2)
          s2.TOPIC_ID=re.compile(re.escape(product_key)+r"\Z")
          s2.LOCALES={"en-GB"}
          pkt,verified_order=s2.verified_stage1_packet(area,ident+"--r001.json")
          if verified_order!=order: raise SystemExit("LEECH_SOURCE_ORDER_CHANGED")
          evidence={
            "schema":"saeit.factory.stage2-source-evidence.v1",
            "source_product_id":product_key,"revision":1,
            "work_order_sha256":s2.sha(verified_order),
            "locale_scopes":{"en-GB":"Original English-language professional training for responsible leech husbandry. Species, climate, water, substrates, public health and commercial/legal requirements must be verified for every operating jurisdiction; no universal UK or global permit is assumed."},
            "sources":[
              {"id":"aminov2025","publisher":"Annals of Parasitology",
               "title":"Optimal artificial conditions for keeping and breeding medicinal leeches Hirudo verbana and Hirudo orientalis",
               "url":"https://annals-parasitology.eu/index.php/AoP/article/view/153",
               "checked_date":"2026-10-25",
               "evidence_note":"The original peer-reviewed study compared artificial keeping and breeding conditions in 180 medicinal leeches of two named species; species-specific findings require context."},
              {"id":"ceylan2026","publisher":"Frontiers in Veterinary Science",
               "title":"Influence of various reproduction substrates on the survival, health, and reproductive output of broodstock Mediterranean medicinal leech (Hirudo verbana)",
               "url":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1969385/full",
               "checked_date":"2026-10-25",
               "evidence_note":"Original controlled substrate study used 40 gravid Hirudo verbana and compared four breeding media; the small single-cycle design limits universal recommendations."},
              {"id":"fda2024","publisher":"United States Food and Drug Administration",
               "title":"Transfer of Regulatory Responsibility From CDRH to CBER for Medical Maggots and Medicinal Leeches",
               "url":"https://www.fda.gov/vaccines-blood-biologics/development-approval-process-cber/transfer-regulatory-responsibility-center-devices-and-radiological-health-center-biologics",
               "checked_date":"2026-10-25",
               "evidence_note":"The FDA formally transferred regulatory responsibility for medicinal leeches with product code NRN to CBER effective December 30 2024; a farm is not thereby licensed."},
              {"id":"cites2026","publisher":"Convention on International Trade in Endangered Species",
               "title":"CITES Animals Committee analysis of international trade in listed animal species",
               "url":"https://cites.org/sites/default/files/documents/AC/34/agenda/E-AC34-14-02-A1.pdf",
               "checked_date":"2026-10-25",
               "evidence_note":"Official CITES documentation identifies Hirudo medicinalis in Appendix II and the historical listing year 1987. Product-level trade advice must check current national authorities."}
            ],
            "claims":[
              {"id":"species_scope","statement":"The 2025 controlled husbandry study evaluated both Hirudo verbana and Hirudo orientalis, so findings cannot be attributed without distinction to every medicinal-leech taxon.","source_ids":["aminov2025"]},
              {"id":"study_population","statement":"Aminov and colleagues reported 180 medicinal leeches across the two named species, comparing experimental and conventional conditions in their original study.","source_ids":["aminov2025"]},
              {"id":"breeding_outcome","statement":"In the 2025 study, the experimental conditions were associated with greater juvenile output and reported reductions in certain parent and juvenile mortality outcomes; these results need independent replication.","source_ids":["aminov2025"]},
              {"id":"substrate_hazard","statement":"A 2026 study of forty gravid Hirudo verbana found that survival strongly depended on substrate: vermicompost and commercial lake peat caused early complete mortality in the studied groups.","source_ids":["ceylan2026"]},
              {"id":"substrate_limits","statement":"The 2026 substrate comparison linked high ionic and osmotic loading, including elevated electrical conductivity and particular metals, with poor survival, but studied only one breeding cycle and a limited set of materials.","source_ids":["ceylan2026"]},
              {"id":"medical_regulator","statement":"For the United States, the FDA assigned oversight of medicinal leeches under product code NRN to CBER effective 30 December 2024; cultivation alone does not demonstrate regulatory clearance for medical marketing.","source_ids":["fda2024"]},
              {"id":"wildlife_trade","statement":"CITES records identify Hirudo medicinalis as an Appendix II listed taxon since 1987, requiring a species- and jurisdiction-specific check before international trade recommendations.","source_ids":["cites2026"]}
            ],
            "scientific_review_completed":False,
            "public_distribution_allowed":False
          }
          metrics=s2.validate_evidence(evidence,verified_order,1)
          source_file=area/"stage-02/source-evidence"/(product_key+"--r001.json")
          seeded=s2.record_once(source_file,evidence,"LEECH_SOURCE_EVIDENCE_COLLISION")
          stage2_after=s2.stage2_loop(root,batch=1,only_order_id=ident)
          research_file=area/"stage-02/receipts"/(ident+"--r001.json")
          stage3_file=area/"stage-03/inbox"/(ident+"--r001.json")
          if not research_file.is_file() or not stage3_file.is_file():
              raise SystemExit("LEECH_STAGE2_TO_STAGE3_NOT_PROVEN")
          print("LEECH_STAGE2_VERIFIED_SOURCE_HANDOFF="+json.dumps({
            "order_id":ident,"source_evidence_written":seeded,
            "source_sha256":sha(source_file),"stage2_receipt_sha256":sha(research_file),
            "stage3_inbox_sha256":sha(stage3_file),"sources":metrics["source_count"],
            "claims":metrics["claim_count"],"locale":"en-GB",
            "independent_review_completed":False,"manuscript_created":False,
            "public_distribution":False,"stage2_results":stage2_after},sort_keys=True))
          PY
          echo LEECH_OWNER_SINGLE_PRODUCT_VPS_HANDOFF_COMPLETED=true
