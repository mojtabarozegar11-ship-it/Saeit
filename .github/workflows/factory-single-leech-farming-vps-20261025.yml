          import types
          worker_source=stage2.read_text(encoding="utf8")
          py39_only='domains.add(domain.removeprefix("www."))'
          compatible='domains.add(domain[4:] if domain.startswith("www.") else domain)'
          if worker_source.count(py39_only)!=1:
