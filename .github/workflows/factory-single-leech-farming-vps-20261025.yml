            ("Reproductive Biology and Breeding Calendar",["Mating behaviours","Broodstock staging","Seasonality caveats","Reproduction records"],"Build a species-specific reproduction data model",["breeding_outcome"]),
            ("Cocoon Substrate Chemistry and Screening",["Substrate provenance","Electrical conductivity","Ionic and metal hazards","Study limitations"],"Specify a substrate incoming-inspection form",["substrate_hazard","substrate_limits"]),
