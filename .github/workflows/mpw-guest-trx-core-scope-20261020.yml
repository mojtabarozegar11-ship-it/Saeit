name: MojPlayWin guest TRX main-only scope and wallet readiness
# Simulate with required CSRF cookie and same-origin referer 2026-10-24.
# Capture the guarded start endpoint response in isolated simulation 2026-10-24.
# Simulate active invoice reservation tuple contract without external payment 2026-10-24.
# Continue in-memory buyer checkout simulation with corrected fixture 2026-10-24.
# Rerun after corrected in-memory ORM fixture; no production record writes.
# Exercise live create-order and start-invoice handlers with in-memory fixtures only.
# Include order-selection code and exact live TRX form in read-only review 2026-10-24.
# Rerun read-only production route mapping after buyer-path repair 2026-10-24.
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-guest-trx-core-scope-20261020.yml"]
permissions: {contents: read}
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate scope audit syntax
        run: python3 -m py_compile scripts/mpw_guest_trx_core_scope_readonly_20261020.py
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect active TRX merchant and guest checkout code safely
        run: timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" < scripts/mpw_guest_trx_core_scope_readonly_20261020.py
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
