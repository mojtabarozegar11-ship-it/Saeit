name: One-shot deploy objective factory quality policy to VPS
on:
  push:
    branches: [factory/deploy-objective-quality-v2-20261106]
    paths:
      - .github/workflows/factory-objective-quality-one-shot-20261106.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-vps-single-product-objective-quality-migration
  cancel-in-progress: false
jobs:
  verify_and_deploy:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently verify tested factory policy before changing VPS
        run: |
          set -euo pipefail
          bash -n deploy/install_factory_objective_quality_20261106.sh
          python3 -m unittest -q \
            tests.test_factory_product_maker \
            tests.test_factory_verified_customer_cycle_20261021 \
            tests.test_factory_vps_product_cycle \
            tests.test_factory_production_warehouse \
            tests.test_factory_commercial_quality_release_guard_v1 \
            tests.test_factory_commercial_quality_release_guard_real1000_20261024 \
            tests.test_factory_measured_qa \
            tests.test_factory_recipe_designer
      - name: Install bounded modules without changing native cron or customer site
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-objective-quality"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_opts=(-T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no)
          remote=githubops@178.239.147.150
          stage="$(ssh "${ssh_opts[@]}" "$remote" 'set -eu; umask 077; test "$(id -un)" = githubops; mktemp -d "$HOME/factory-runtime/operations/.objective-quality-stage.XXXXXXXX"')"
          [[ "$stage" =~ ^/home/githubops/factory-runtime/operations/\.objective-quality-stage\.[A-Za-z0-9]{8}$ ]] || { echo OBJECTIVE_FACTORY_STAGE_PATH_INVALID; exit 1; }
          tar -cf - \
            deploy/install_factory_objective_quality_20261106.sh \
            scripts/factory_product_maker.py \
            scripts/factory_verified_customer_cycle_20261021.py \
            scripts/factory_vps_product_cycle.py \
            scripts/factory_production_warehouse.py \
            | ssh "${ssh_opts[@]}" "$remote" "tar -xf - -C '$stage'"
          ssh "${ssh_opts[@]}" "$remote" "bash '$stage/deploy/install_factory_objective_quality_20261106.sh'"
          ssh "${ssh_opts[@]}" "$remote" "test -d '$stage' && rm -r -- '$stage'"
          echo FACTORY_OBJECTIVE_POLICY_DEPLOYMENT_VERIFIED=PASS
