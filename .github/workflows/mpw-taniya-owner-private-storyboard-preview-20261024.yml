name: MojPlayWin owner-only Taniya storyboard source preview
on:
  push:
    branches: [ops/taniya-private-preview-20261024]
    paths: [".github/workflows/mpw-taniya-owner-private-storyboard-preview-20261024.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Extract limited Taniya storyboard preview and mail only to owner
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 150s ssh -T -F "$d/config" saeit-cpanel bash -s <<'BASH'
          set -euo pipefail
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os,subprocess,tempfile,shutil
          from pathlib import Path
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid
          pdf=Path('/home/zomorod2/MojPlayWin_Private_Assets/taniya-little-baker-worms/Taniya_and_the_Little_Baker_Worms.pdf')
          if pdf.is_symlink() or not pdf.is_file() or pdf.stat().st_size<10000:
              raise RuntimeError('Owner-book PDF not found or unexpected file type')
          if not shutil.which('pdfinfo') or not shutil.which('pdftotext'):
              raise RuntimeError('PDF tools not available on host')
          info=subprocess.run(['pdfinfo',str(pdf)],capture_output=True,text=True,check=True,timeout=20).stdout
          pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
          if not (35<=pages<=60):
              raise RuntimeError('Unexpected Taniya book page count; no export performed')
          selections=sorted({1,3,6,10,16,23,31,pages-1})
          message=EmailMessage()
          message['From']='MojPlayWin Owner Preview <zomorod2@zohal.pws-dns.net>'
          message['To']='mojtaba.rozegar11@gmail.com'
          message['Subject']='Owner-only: Taniya original book storyboard source (selected pages)'
          message['Date']=formatdate(localtime=True)
          message['Message-ID']=make_msgid(domain='zohal.pws-dns.net')
          body=['PRIVATE OWNER PREVIEW — NOT PUBLIC','Selected material only, for checking character design and actual book events before making YouTube promotions.',f'Original PDF pages: {pages}.']
          images=[]
          with tempfile.TemporaryDirectory(prefix='mpw-owner-storyboard-') as td:
              for p in selections:
                  extracted=subprocess.run(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],capture_output=True,text=True,timeout=20,check=True).stdout.strip()
                  excerpt=' '.join(extracted.split())
                  body.append(f'\nBOOK PAGE {p}: {excerpt[:850] if excerpt else "[Illustration/no selectable text]"}')
                  if shutil.which('pdftoppm'):
                      stem=Path(td)/f'taniya-page-{p:02d}'
                      subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-singlefile','-scale-to','800','-png',str(pdf),str(stem)],capture_output=True,timeout=25,check=True)
                      im=stem.with_suffix('.png')
                      if im.is_file() and im.stat().st_size<1500000:
                          images.append((im.name,im.read_bytes()))
              message.set_content('\n'.join(body))
              for image_name,image_bytes in images:
                  message.add_attachment(image_bytes,maintype='image',subtype='png',filename=image_name)
              sendmail=shutil.which('sendmail') or '/usr/sbin/sendmail'
              if os.path.isfile(sendmail):
                  result=subprocess.run([sendmail,'-t','-oi'],input=message.as_bytes(),capture_output=True,timeout=45)
                  if result.returncode:
                      raise RuntimeError(f'Local mailer failed (exit {result.returncode})')
              else:
                  import smtplib
                  with smtplib.SMTP('127.0.0.1',25,timeout=20) as smtp:
                      smtp.send_message(message)
          print('MPW_TANIYA_OWNER_ONLY_PREVIEW_SENT; pages_checked='+str(pages)+'; sample_pages='+str(len(selections))+'; no_pdf_export; public_excerpt_count=0')
          PY
          BASH
