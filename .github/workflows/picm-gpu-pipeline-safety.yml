name: PICM GPU Pipeline Isolated Safety Tests
on:
  push:
    branches: [feature/picm-gpu-one-command-20261015]
    paths:
      - ops/picm-gpu/**
      - tests/test_picm_story_pipeline.py
      - tests/test_picm_story_comfy.py
      - tests/test_picm_story_assemble.py
      - tests/test_picm_video_bridge.py
      - tests/test_picm_video_worker_client.py
      - tests/test_picm_gpu_preflight.py
      - core/picm_mp4_verify.py
      - templates/picm/story_preview.js
      - core/picm_video_bridge.py
      - core/picm_video_urls.py
      - .github/workflows/picm-gpu-pipeline-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate isolated Python syntax
        run: |
          python -m py_compile ops/picm-gpu/story_pipeline.py ops/picm-gpu/story_comfy.py ops/picm-gpu/story_assemble.py
      - name: Install local-only FFmpeg and FFprobe for actual MP4 muxer CI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Prove no movie can be fabricated without GPU
        run: |
          python -m unittest discover -s tests -p 'test_picm_story_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_picm_story_comfy.py' -v
          python -m unittest discover -s tests -p 'test_picm_story_assemble.py' -v
      - name: Verify private Django owner-to-GPU bridge with isolated storage
        env:
          SECRET_KEY: picm-disposable-gpu-bridge-ci-only-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile core/picm_mp4_verify.py core/picm_video_bridge.py core/picm_video_urls.py ops/picm-gpu/video_worker_client.py ops/picm-gpu/gpu_preflight.py
          pytest -q tests/test_picm_video_bridge.py tests/test_picm_video_worker_client.py tests/test_picm_gpu_preflight.py
          node --check templates/picm/story_preview.js
      - name: Explicit evidence statement
        run: echo 'PICM_ISOLATED_SOFTWARE_GATES_ONLY_NOT_A_GPU_RENDER'
