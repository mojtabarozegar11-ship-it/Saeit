name: Termux Reverse SSH Bridge Presence Readonly
on:
  push:
    branches: [audit/vps-comfyui-hardware-20261014]
    paths: [.github/workflows/termux-reverse-bridge-presence-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Termux reverse tunnel prerequisites without changes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/termux-inspect"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          timeout 45s ssh -i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          p="$HOME/.local/share/saeit-termux-bridge/phone_user"
          k="$HOME/.ssh/saeit_termux_operator_ed25519"
          if test -s "$p"; then echo TERMUX_USERNAME_METADATA_PRESENT; else echo TERMUX_USERNAME_METADATA_MISSING; fi
          if test -s "$k"; then echo TERMUX_OPERATOR_SSH_KEY_PRESENT; else echo TERMUX_OPERATOR_SSH_KEY_MISSING; fi
          if test -s "$k.pub"; then echo TERMUX_OPERATOR_PUBLIC_KEY_PRESENT; else echo TERMUX_OPERATOR_PUBLIC_KEY_MISSING; fi
          if command -v ss >/dev/null 2>&1; then
            if ss -lntH '( sport = :18022 )' | grep -q .; then echo TERMUX_REVERSE_SSH_PORT_18022_LISTENING; else echo TERMUX_REVERSE_SSH_PORT_18022_NOT_LISTENING; fi
          else echo TERMUX_LISTENER_CHECK_UNAVAILABLE; fi
          f="$HOME/factory-runtime/operations/vps-only-loop.pid"
          if test -f "$f"; then
            n="$(cat "$f")"
            if [[ "$n" =~ ^[0-9]+$ ]] && kill -0 "$n" 2>/dev/null; then echo FACTORY_LOOP_ALIVE; else echo FACTORY_LOOP_NOT_VERIFIED; fi
          fi
          echo TERMUX_READONLY_BRIDGE_CHECK_FINISHED
          REMOTE
