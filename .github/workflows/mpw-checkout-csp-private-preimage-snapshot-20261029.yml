name: S-01 private checkout preimage snapshot only
on:
  pull_request:
    paths:
      - scripts/mpw_checkout_csp_private_preimage_snapshot_20261029.py
      - tests/test_mpw_checkout_csp_private_preimage_snapshot_20261029.py
      - .github/workflows/mpw-checkout-csp-private-preimage-snapshot-20261029.yml
permissions: {contents: read}
concurrency:
  group: ${{ contains(github.event.pull_request.labels.*.name, 's01-preimage-snapshot-authorized') && 's01-pinned-cpanel-relay-single-session' || format('s01-preimage-disabled-{0}', github.run_id) }}
  cancel-in-progress: false
# Explicit opt-in for this cPanel write-capable private backup. Normal PR updates
# run the read-only provenance probe; do not reattempt a known SHA-drift snapshot.
jobs:
  snapshot_only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 's01-preimage-snapshot-authorized')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify non-destructive source snapshot contract
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_checkout_csp_private_preimage_snapshot_20261029.py -v
      - name: Establish existing pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/s01-preimage-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # Public F-verified VPS host key; no network keyscan before authentication.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" || { echo 'S01_VPS_HOST_PIN=BLOCKED'; exit 1; }
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/control-%C
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # Pinned 30GB host identity. Only read-only identity probes may retry.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" || { echo 'S01_CPANEL_HOST_PIN=BLOCKED'; exit 1; }
          # Diagnose the VPS hop separately; F-01 has authenticated to this
          # pinned host on earlier runs, which does NOT prove cPanel access.
          vps_ready=0
          for attempt in 1 2; do
            if timeout 35s ssh -T -F "$d/config" -o ConnectTimeout=15 -o ConnectionAttempts=1 saeit-vps 'test "$(id -un)" = "githubops"' >/dev/null 2>&1; then
              vps_ready=1
              break
            fi
            echo "S01_VPS_HOP_RETRY=$attempt"
          done
          test "$vps_ready" = 1 || { echo 'S01_VPS_HOP=BLOCKED'; exit 1; }
          echo 'S01_VPS_HOP=VERIFIED'
          session_ready=0
          # Use the previously successful pinned two-hop banner timing from
          # the existing owner command relay; do not relax host-key checks.
          for attempt in 1 2 3; do
            if timeout 55s ssh -T -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2"' >/dev/null 2>&1; then
              session_ready=1
              break
            fi
            echo "S01_PINNED_IDENTITY_RETRY=$attempt"
            if [ "$attempt" -lt 3 ]; then sleep 12; fi
          done
          test "$session_ready" = 1 || { echo 'S01_PINNED_SESSION=BLOCKED'; exit 1; }
          echo 'S01_PINNED_SESSION=VERIFIED'
      - name: Copy exact checkout preimage into private cPanel backup directory ONLY
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/s01-preimage-ssh"
          script64="$(base64 -w0 scripts/mpw_checkout_csp_private_preimage_snapshot_20261029.py)"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c 'import base64,sys;exec(compile(base64.b64decode(sys.argv[1]),\"s01_snapshot\",\"exec\"))' '$script64'"
          echo "S01_PREIMAGE_SCOPE=PRIVATE_BACKUP_ONLY_NO_PRODUCTION_SOURCE_CHANGE"
          echo "S01_OFFHOST_RESTORE=NOT_VERIFIED"
          echo "S01_PASSENGER_DB_AUTHORITY=NOT_VERIFIED"
          echo "S01_DEPLOY=BLOCKED"
      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/s01-preimage-ssh"
          if [ -d "$d" ]; then
            if [ -f "$d/config" ]; then ssh -F "$d/config" -O exit saeit-cpanel >/dev/null 2>&1 || true; fi
            rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"
            rmdir "$d"
          fi
