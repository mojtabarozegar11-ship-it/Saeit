name: Zomorod assistant-to-task safe acceptance
on:
  push:
    branches: ["feature/zomorod-assistant-followups-20261017"]
  pull_request:
    branches: ["feature/zomorod-ecosystem-hub-v2-20261017"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: "isolated-company-followup-ci-only"
      ALLOWED_HOSTS: "localhost,testserver,zomorodmelal.ir"
      DATABASE_URL: "sqlite:///isolated_followup_ci.sqlite3"
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Validate schema and public-route preservation
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base="origin/feature/zomorod-ecosystem-hub-v2-20261017"
          allowed={
            "ecosystem_hub/models.py","ecosystem_hub/admin.py",
            "ecosystem_hub/views.py","ecosystem_hub/urls.py",
            "ecosystem_hub/templates/ecosystem_hub/report.html",
            "ecosystem_hub/tests.py","ecosystem_hub/migrations/0003_assistantfollowup.py",
            ".github/workflows/zomorod-assistant-followup-qa.yml",
            "docs/zomorod-assistant-followups.md",
          }
          changed=subprocess.check_output(["git","diff","--name-status",base+"...HEAD"],text=True).splitlines()
          for line in changed:
            parts=line.split("\t")
            assert len(parts)==2 and parts[0] in ("A","M") and parts[1] in allowed, line
          for path in ("config/urls.py","enterprise_portal/urls.py"):
            original=subprocess.check_output(["git","show",base+":"+path],text=True)
            assert Path(path).read_text()==original, "Route altered: "+path
          print("EXISTING_SITE_AND_ERP_ROUTES_UNCHANGED=yes")
          PY
      - name: Run both full private company test suites in isolated database
        run: |
          python manage.py migrate --noinput
          python manage.py test enterprise_portal ecosystem_hub --verbosity 2
