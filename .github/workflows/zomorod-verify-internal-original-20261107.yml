name: Read-only compare internal theme against original

on:
  push:
    branches: [restore-zomorod-pre-seo-20261107]
    paths: [.github/workflows/zomorod-verify-internal-original-20261107.yml]

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare strictly pinned host connection
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-theme-origin-audit"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),chr(10)).replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'

      - name: Inspect only static pages and relevant backup files
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from datetime import datetime,timezone
          import hashlib,os,re,tarfile
          home=Path('/home/zomorod2'); web=home/'public_html'
          assert os.geteuid()==web.stat().st_uid
          root=web/'index.html'
          homepage=root.read_bytes()
          print('APPROVED_HOME_SHA',hashlib.sha256(homepage).hexdigest(),'bytes',len(homepage))
          print('APPROVED_HOME_CSS',re.findall(rb'<link[^>]+stylesheet[^>]*>',homepage,re.I)[:12])
          print('APPROVED_HOME_LINKS',sorted(set(x.decode(errors='replace') for x in re.findall(rb'href=["\'](/[^"\'#?]*)',homepage)))[:130])
          ignore={'ghanadi','amozeshgah','mohammad','.well-known','cgi-bin','site-heritage','static','assets','media','images','css','js','fonts','uploads'}
          files=[root]
          for d in sorted(web.iterdir()):
              if d.is_dir() and d.name not in ignore:
                  f=d/'index.html'
                  if f.is_file():files.append(f)
          counts=Counter()
          for f in files:
              b=f.read_bytes(); rel=f.relative_to(web)
              tags=[t for t in ('zm-unified-v7-20261018','zm-nova','zm-v7-header','zm-v10','zm-agri-design-v3') if t.encode() in b]
              css=[c.decode(errors='replace') for c in re.findall(rb'<link[^>]+stylesheet[^>]*>',b,re.I)[:8]]
              counts['v7' if 'zm-unified-v7-20261018' in tags else 'not-v7']+=1
              print('LIVE_PAGE',str(rel),'bytes',len(b),'sha',hashlib.sha256(b).hexdigest()[:14],'markers',','.join(tags),'css',css)
          print('LIVE_COUNTER',dict(counts))
          versions=[('v7-unify',home/'.backups/zomorod-v7-unify'),('v10-content',home/'.backups/zomorod-v10-content-restore'),('v9-real',home/'.backups/zomorod-v9-real-pages'),('v7-rescue',home/'.backups/zomorod-v7-static-rescue'),('v11',home/'.backups/zomorod-v11'),('recent-live',home/'.backups/zomorod-live-inpage'),('before-seo',home/'.private/zm-home-services-seo-backups'),('nova-six',home/'.backups/zomorod-nova-six-pages')]
          slugs=('company','about','services','industry','research','knowledge','agriculture','topics','apps','news','contact','business','agents','blog','economy','market','weather')
          for key,base in versions:
              if not base.is_dir():continue
              for v in sorted((d for d in base.iterdir() if d.is_dir()),key=lambda d:d.stat().st_mtime,reverse=True)[:3]:
                  print('BACKUP_VERSION',key,v.name,datetime.fromtimestamp(v.stat().st_mtime,timezone.utc).isoformat())
                  for pattern in ('candidate','staging','static-pages','pages'):
                      for sub in (v/pattern,):
                          if not sub.is_dir():continue
                          for slug in slugs:
                              f=sub/slug/'index.html'
                              if f.is_file() and f.stat().st_size<700000:
                                  b=f.read_bytes()
                                  flags=','.join(t for t in ('zm-unified-v7-20261018','zm-nova-subpage-v1','zm-v7-header','zm-v10') if t.encode() in b)
                                  css=[c.decode(errors='replace') for c in re.findall(rb'<link[^>]+stylesheet[^>]*>',b,re.I)[:4]]
                                  print('BACKUP_PAGE',key,v.name,pattern,slug,'size',len(b),'sha',hashlib.sha256(b).hexdigest()[:14],'flags',flags,'css',css)
                  tar=v/'original-pages.tar'
                  if tar.is_file():
                      with tarfile.open(tar) as a:
                          members=set(a.getnames())
                          present=[s for s in slugs if s+'/index.html' in members]
                          print('BACKUP_TAR_COVERAGE',key,v.name,len(members),present)
              print('BACKUP_ROOT_DONE',key)
          print('NO_LIVE_WRITES_PERFORMED=yes')
          PY

      - name: Locate exact pre-rollback copies of affected inner pages
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,os,re
          home=Path('/home/zomorod2');web=home/'public_html'
          assert os.geteuid()==web.stat().st_uid
          paths=[]
          for base in (home/'.private',home/'.backups'):
              if not base.is_dir():continue
              for pattern in ('*/moved-*/index.html','*/*/moved-*/index.html','*/*/static-pages/about/index.html','*/*/candidate/about/index.html','*/*/staging/about/index.html','*/*/about/index.html','*/*/topics/index.html'):
                  paths.extend(base.glob(pattern))
          wanted={'about','company','services','industry','research','knowledge','agriculture','topics'}
          candidates=[]
          for f in set(paths):
              if not f.is_file() or f.stat().st_size>700000:continue
              if not any(x in wanted or x.startswith('moved-') for x in f.parts[-3:-1]):continue
              candidates.append(f)
          candidates.sort(key=lambda f:f.stat().st_mtime,reverse=True)
          print('PRE_ROLLBACK_CANDIDATES',len(candidates))
          for f in candidates[:110]:
              b=f.read_bytes()
              marks=[v for v in ('zm-nova-subpage-v1','zm-unified-v7-20261018','zm-v7-header','zm-v10','zm-agri-design-v3') if v.encode() in b]
              print('PRE_ROLLBACK_FILE',f.relative_to(home),'date',datetime.fromtimestamp(f.stat().st_mtime,timezone.utc).strftime('%Y-%m-%dT%H:%MZ'),'bytes',len(b),'sha',hashlib.sha256(b).hexdigest()[:14],'marks',','.join(marks))
          for d in sorted((home/'.private/zm-internal-pre-seo-restore-20261107').glob('*')):
              print('FIRST_RESTORE_STASH',d.relative_to(home),'contents',sorted(p.name for p in d.iterdir())[:35])
          print('PRE_ROLLBACK_AUDIT_READ_ONLY=yes')
          PY

      - name: Compare rescue stash with last complete pre-SEO snapshot
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os,re
          h=Path('/home/zomorod2');w=h/'public_html'
          assert os.geteuid()==w.stat().st_uid
          stash=h/'.private/zm-internal-pre-seo-restore-20261107'
          pages=('company','about','services','industry','research','knowledge','agriculture')
          refs={
            'pre-seo-20261106':h/'.backups/zomorod-live-inpage/158204fe725b5ec8f46cefc7a4d18e34f22fda67/static-pages',
            'v12-20261018':h/'.backups/zomorod-v12-contact/dcf6ce733aa95770954d6a6103730c1017089c6a/candidate',
            'v10-20261018':h/'.backups/zomorod-v10-content-restore/39611e09708ac8a4e5df1aac0209e03f44e06ad1/candidate',
          }
          for d in sorted(stash.glob('*')):
              for sub in ('original-static-pages','agriculture'):
                  x=d/sub
                  if x.is_dir():
                      names=[str(f.relative_to(x)) for f in x.rglob('*') if f.is_file()]
                      print('STASH_TREE',d.name,sub,'count',len(names),'first',names[:90])
              f=d/'manifest.json'
              if f.is_file():
                  try:
                      m=json.loads(f.read_text())
                      print('STASH_MANIFEST',d.name,str(m)[:1600])
                  except Exception as e:print('STASH_MANIFEST_ERROR',type(e).__name__)
          for slug in pages:
              print('PAGE_BASELINE',slug)
              for key,base in refs.items():
                  f=base/slug/'index.html'
                  if not f.is_file():
                      print('SUGGESTED_SOURCE_ABSENT',slug,key);continue
                  b=f.read_bytes();links=[u.decode(errors='replace') for u in re.findall(rb'<link[^>]+stylesheet[^>]*>',b,re.I)]
                  print('SUGGESTED_SOURCE',slug,key,'bytes',len(b),'sha',hashlib.sha256(b).hexdigest(),'links',links[:5])
          print('RESCUE_COMPARE_READ_ONLY=yes')
          PY

      - name: Identify authentic internal-page archive candidates without changing files
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,os,re
          home=Path('/home/zomorod2');web=home/'public_html'
          assert os.geteuid()==web.stat().st_uid
          slugs=('about','contact','agriculture','topics','business','apps','agents','news','blog','economy','market','weather')
          bases=[]
          for root in (home/'.backups',home/'.private'):
              if not root.is_dir():continue
              for category in root.iterdir():
                  if not category.is_dir():continue
                  for version in category.iterdir():
                      if not version.is_dir():continue
                      for sub in ('candidate','static-pages','staging','pages'):
                          base=version/sub
                          if base.is_dir():bases.append(base)
          print('ARCHIVE_BASES_REVIEWED',len(bases))
          for slug in slugs:
              live=web/slug/'index.html'
              if not live.is_file():continue
              b=live.read_bytes(); hash=lambda data:hashlib.sha256(data).hexdigest()
              link=lambda data:[x.decode(errors='replace') for x in re.findall(rb'<link[^>]+stylesheet[^>]*>',data,re.I)]
              print('CURRENT_PAGE',slug,'bytes',len(b),'sha',hash(b),'css',link(b)[:4])
              candidates=[]
              for base in bases:
                  f=base/slug/'index.html'
                  if not f.is_file() or f.stat().st_size>1000000:continue
                  contents=f.read_bytes()
                  candidates.append((str(f.relative_to(home)),len(contents),hash(contents),link(contents)[:3],datetime.fromtimestamp(f.stat().st_mtime,timezone.utc).strftime('%Y-%m-%dT%H:%MZ')))
              for c in candidates[:35]:print('ARCHIVE_CANDIDATE',slug,*c)
              print('ARCHIVE_CANDIDATE_COUNT',slug,len(candidates))
          homepage=(web/'index.html').read_bytes()
          assert hashlib.sha256(homepage).hexdigest()=='0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585'
          print('ARCHIVE_INVENTORY_READ_ONLY_AND_HOMEPAGE_UNCHANGED=yes')
          PY

      - name: Verify all recovered research URLs and protect homepage read only
        shell: bash
        run: |
          set -euo pipefail
          timeout 200s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import concurrent.futures,hashlib,os,time,urllib.request
          home=Path('/home/zomorod2');web=home/'public_html'
          source=home/'.private/zm-internal-pre-seo-restore-20261107/42325682473/original-static-pages/research'
          assert os.geteuid()==web.stat().st_uid
          sha=lambda data:hashlib.sha256(data).hexdigest()
          assert sha((web/'index.html').read_bytes())=='0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585'
          pages=[]
          for f in source.rglob('index.html'):
              if f==source/'index.html':continue
              rel=f.relative_to(home/'.private/zm-internal-pre-seo-restore-20261107/42325682473/original-static-pages')
              assert (web/rel).is_file() and sha((web/rel).read_bytes())==sha(f.read_bytes()),('NOT_EXACTLY_RESTORED',str(rel))
              pages.append((rel,f))
          def check(item):
              rel,f=item
              url='https://zomorodmelal.ir/'+str(rel.parent)+'/?inner_integrity='+str(time.monotonic_ns())
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read(700000)
                      if response.status!=200 or sha(data)!=sha(f.read_bytes()):
                          return (str(rel),'ERROR',response.status,len(data))
                      return (str(rel),'OK',200,len(data))
              except Exception as exc:
                  return (str(rel),'ERROR',type(exc).__name__,str(exc)[:130])
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              outcomes=list(pool.map(check,pages))
          for result in outcomes:
              print('RESEARCH_DESCENDANT_PUBLIC_CHECK',*result)
          failed=[r for r in outcomes if r[1]!='OK']
          print('RESEARCH_DESCENDANT_COUNT',len(outcomes),'HTTP_OK',len(outcomes)-len(failed),'HTTP_FAILED',len(failed))
          assert not failed,('RESEARCH_DESCENDANT_PUBLIC_FAILURE',failed[:5])
          print('HOME_AND_ALL_RESTORED_RESEARCH_URLS_VERIFIED=yes')
          PY

      - name: Inventory old theme archives for exact-scope cleanup without deleting anything
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,os,stat
          h=Path('/home/zomorod2');w=h/'public_html'
          assert os.geteuid()==w.stat().st_uid
          expected='0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585'
          assert hashlib.sha256((w/'index.html').read_bytes()).hexdigest()==expected
          wanted=('zomorod-v7-unify','zomorod-v7-static-rescue','zomorod-v9-real-pages','zomorod-v10-content-restore','zomorod-v11','zomorod-v12-contact','zomorod-nova-six-pages','zomorod-live-inpage')
          for name in wanted:
              root=h/'.backups'/name
              if not root.is_dir() or root.is_symlink():
                  print('THEME_ARCHIVE_MISSING_OR_UNSAFE',name);continue
              total=0;files=0;symlinks=0;types=Counter();sample=[]
              for base,dirs,names in os.walk(root,followlinks=False):
                  for d in list(dirs):
                      p=Path(base)/d
                      if p.is_symlink():symlinks+=1;dirs.remove(d)
                  for n in names:
                      p=Path(base)/n
                      if p.is_symlink():symlinks+=1;continue
                      info=p.lstat()
                      if not stat.S_ISREG(info.st_mode):continue
                      total+=info.st_size;files+=1;types[p.suffix.lower() or '[none]']+=1
                      if len(sample)<9:sample.append(str(p.relative_to(root)))
              print('THEME_ARCHIVE_INVENTORY',name,'bytes',total,'files',files,'symlinks',symlinks,'types',dict(types.most_common(8)),'example',sample)
          print('PROTECTED_ACTIVE_THEME','index.html',expected)
          for rel in ('static/site/zomorod-v7/inner-v7.css','static/site/zomorod-v10/inner-v10.css','assets/zm-nova-detail-v1.css','agriculture/assets/zm-nova-agriculture-v1.css'):
              p=w/rel
              print('ACTIVE_THEME_ASSET',rel,p.is_file(),p.stat().st_size if p.is_file() else 0)
          print('OLD_THEME_INVENTORY_READ_ONLY=yes')
          PY

      - name: Classify remaining mixed archives and private rollback stashes without deletion
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/zm-theme-origin-audit/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,os,stat
          h=Path('/home/zomorod2');web=h/'public_html'
          assert os.geteuid()==web.stat().st_uid
          assert hashlib.sha256((web/'index.html').read_bytes()).hexdigest()=='0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585'
          roots={
              'mixed-v11':h/'.backups/zomorod-v11',
              'mixed-v12':h/'.backups/zomorod-v12-contact',
              'mixed-live-inpage':h/'.backups/zomorod-live-inpage',
              'historic-stash':h/'.private/zm-internal-pre-seo-restore-20261107',
              'about-recovery-stash':h/'.private/zm-about-v12-recovery-20261107',
              'current-preserved':h/'.private/zm-current-theme-snapshot-20261107',
          }
          for label,root in roots.items():
              if not root.is_dir() or root.is_symlink():
                  print('MIXED_ROOT_ABSENT',label);continue
              count=size=0;types=Counter();groups=Counter();records=[]
              for base,dirs,files in os.walk(root,followlinks=False):
                  assert all(not (Path(base)/x).is_symlink() for x in dirs)
                  for name in files:
                      f=Path(base)/name;info=f.lstat()
                      assert stat.S_ISREG(info.st_mode)
                      count+=1;size+=info.st_size;types[f.suffix or '[none]']+=1
                      rel=f.relative_to(root);groups[rel.parts[0]]+=1
                      if label in ('mixed-v11','mixed-v12'):
                          records.append((str(rel),info.st_size,hashlib.sha256(f.read_bytes()).hexdigest()[:14]))
              print('MIXED_ARCHIVE_SUMMARY',label,'files',count,'bytes',size,'types',dict(types),'top_groups',dict(groups.most_common(20)))
              for record in records:print('MIXED_ARCHIVE_FILE',label,*record)
          print('MIXED_ARCHIVE_SCOPE_AUDIT_READ_ONLY=yes')
          PY

      - name: Remove ephemeral SSH identity files
        # Historical audit jobs remain read-only; no previous theme is restored by this file.
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zm-theme-origin-audit"
