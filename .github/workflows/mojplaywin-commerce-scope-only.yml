name: MojPlayWin Commerce Scope — Read Only

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  protect-products-and-payments:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/mojplaywin-complete-17-sections-20261017' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce fail-closed source allowlist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/mojplaywin_commerce_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Run negative tests for protected paths
        run: python -m unittest discover -s tests -p test_mojplaywin_commerce_scope.py -v

  snapshot-known-public-health:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/mojplaywin-complete-17-sections-20261017' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout read-only revision without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify existing deployment jobs remain hard stopped
        run: python3 -m unittest discover -s tests -p test_mojplaywin_shared_deploy_hard_stop.py -v
      - name: Verify anonymous public GET probe has safe fixed allowlist
        run: python3 -m unittest discover -s tests -p test_mojplaywin_public_subsite_smoke_baseline.py -v
      - name: Read-only baseline for 11 known public main and child routes
        run: |
          python3 - <<'PY'
          from scripts.mojplaywin_public_subsite_smoke_baseline import PUBLIC_PATHS, report
          observations = report()
          assert len(observations["responses"]) == len(PUBLIC_PATHS) == 11
          failures = []
          for rec in observations["responses"]:
              path, status = rec["path"], rec["status"]
              error = rec["error_class"]
              # PICM intentionally requires authentication: anonymous 401/403 is acceptable.
              acceptable = {200} | ({401, 403} if path == "/picm/login/" else set())
              ok = status in acceptable and error in (None, "http_status")
              print(f"READONLY_HEALTH path={path} http={status} redirects={rec['redirects']} state={'OK' if ok else 'NO_GO'}")
              if not ok:
                  failures.append(path)
          print("UNKNOWN_SUBSITES_CERTIFIED=false")
          print("PAYMENTS_CERTIFIED=false")
          print("BACKUP_RESTORABILITY_CERTIFIED=false")
          print("LIVE_DEPLOY_AUTHORIZED=false")
          if failures:
              raise SystemExit(f"Protected public route NO-GO count={len(failures)}")
          PY

      - name: Read-only baseline for 17 current main-site category and venture routes
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request
          from scripts.mojplaywin_public_subsite_smoke_baseline import StrictRedirect, UnsafeRedirect

          # Fixed exact public routes only; no discovery, payment, account, or form URLs.
          pages = (
              "/agriculture/", "/industry/", "/research/", "/knowledge/",
              "/economy/", "/studio/", "/market/", "/agents/", "/company/",
              "/ventures/agriculture/", "/ventures/cafe-restaurant/",
              "/ventures/fuel-station/", "/ventures/jewelry-gold/",
              "/ventures/carpets/", "/ventures/currency-crypto/",
              "/ventures/ecommerce/", "/ventures/hospitality/",
          )
          assert len(set(pages)) == 17
          opener = urllib.request.build_opener(StrictRedirect())
          failures = []
          for path in pages:
              request = urllib.request.Request(
                  "https://mojplaywin.com" + path,
                  headers={"User-Agent": "MojPlayWin-ReadOnly-PageHealth/1.0", "Accept": "text/html",
                           "Cache-Control": "no-cache"},
                  method="GET",
              )
              status = None
              try:
                  with opener.open(request, timeout=10) as response:
                      status = response.status
                      response.read(256)
              except urllib.error.HTTPError as exc:
                  status = exc.code
              except (urllib.error.URLError, OSError, TimeoutError, ValueError, UnsafeRedirect):
                  pass
              print(f"PUBLIC_MAIN_PAGE path={path} status={status} state={'OK' if status == 200 else 'NO_GO'}")
              if status != 200:
                  failures.append(path)
          print("CONTENT_PARITY_VERIFIED=false")
          print("CHECKOUT_TESTED=false")
          print("UNKNOWN_CHILD_SITES_VERIFIED=false")
          print("PRODUCTION_RELEASE_AUTHORIZED=false")
          if failures:
              raise SystemExit(f"NO-GO: {len(failures)} of 17 main-site routes failed anonymous GET")
          PY

      - name: Read-only main-site footer coverage inventory
        run: |
          python3 - <<'PY'
          import re
          import urllib.error
          import urllib.request
          from scripts.mojplaywin_public_subsite_smoke_baseline import StrictRedirect, UnsafeRedirect

          # Explicit known main-site editorial/service pages, never child sites.
          main_paths = (
              '/', '/store/', '/agriculture/', '/industry/', '/research/',
              '/knowledge/', '/economy/', '/studio/', '/market/', '/agents/', '/company/',
              '/games/', '/products/', '/services/', '/ai/', '/blockchain/',
              '/crypto-payments/', '/commerce/', '/global-business/', '/research-lab/',
              '/agro-industry/', '/canada-vision/', '/support/', '/privacy/',
              '/terms/', '/cookies/', '/about/', '/contact/',
          )
          forbidden = ('/mojtaba.roozegar/', '/studio.Roham/', '/saman/',
                       '/farnaz/', '/zahra$$/', '/taniya/', '/picm/')
          assert len(set(main_paths)) == 28
          assert all(not any(x.startswith(prefix) for prefix in forbidden) for x in main_paths)
          opener = urllib.request.build_opener(StrictRedirect())
          statuses = {}; signatures = []; unknown = []
          for path in main_paths:
              req = urllib.request.Request(
                  'https://mojplaywin.com' + path,
                  headers={'User-Agent': 'MojPlayWin-MainOnlyFooterInventory/1.0',
                           'Accept': 'text/html', 'Cache-Control': 'no-cache'},
                  method='GET',
              )
              status = None; html = ''
              try:
                  with opener.open(req, timeout=8) as res:
                      status = res.status
                      html = res.read(250000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as exc:
                  status = exc.code
              except (urllib.error.URLError, OSError, TimeoutError, ValueError, UnsafeRedirect):
                  pass
              footer = re.search(r'<footer\\b[^>]*>(.*?)</footer>', html, re.I | re.S)
              signed = bool(footer and 'Mojtaba Roozegar' in footer.group(1))
              statuses[path] = status
              if signed: signatures.append(path)
              if status != 200: unknown.append(path)
              print(f'MAIN_ONLY_FOOTER_AUDIT path={path} http={status} signature_inside_footer={signed}')
          print(f'MAIN_ONLY_FOOTER_TOTAL={len(main_paths)}')
          print(f'MAIN_ONLY_FOOTER_SIGNED={len(signatures)}')
          print(f'MAIN_ONLY_FOOTER_UNREACHABLE={len(unknown)}')
          print('SUBSITE_CONTENT_READ_OR_WRITTEN=false')
          print('DEPLOY_AUTHORIZED_BY_AUDIT=false')
          # Existing production state is only being inventoried: unsigned
          # pages are a publishing gap, not a CI source-code failure.
          PY
