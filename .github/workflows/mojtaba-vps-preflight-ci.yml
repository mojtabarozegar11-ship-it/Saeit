name: Mojtaba VPS preflight offline regression

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mojtaba-live-topology-readonly.yml"
      - ".github/workflows/mojtaba-vps-preflight-ci.yml"
      - "deploy/mojtaba_live_topology_readonly.py"
      - "tests/test_mojtaba_live_topology_readonly.py"

permissions:
  contents: read

jobs:
  offline-observer-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      SECRET_KEY: "mojtaba-preflight-ci-ephemeral-not-production"
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - name: Checkout reviewed candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the observer and bash diagnostics without host access
        run: |
          python -m py_compile deploy/mojtaba_live_topology_readonly.py
          python -m pytest -q tests/test_mojtaba_live_topology_readonly.py
