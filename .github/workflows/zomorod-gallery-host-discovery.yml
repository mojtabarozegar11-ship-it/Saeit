name: Zomorod gallery host discovery (read only)
on:
  push:
    branches: [ops/zomorod-gallery-publish-20261014]
    paths: [.github/workflows/zomorod-gallery-host-discovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect Django and Passenger application roots via pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-gallery-ssh"; mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
            LogLevel ERROR
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 110s ssh -F "$d/config" saeit-host 'python3 -' <<'REMOTE'
          from pathlib import Path
          import ast, re
          h=Path('/home/zomorod2/Saeit')
          for x in ['config/urls.py','portal/urls.py','portal/models.py','portal/views.py','config/settings.py','passenger_wsgi.py']:
            p=h/x
            print('TOPFILE',x,'exists',p.exists(),'size',p.stat().st_size if p.exists() else 0)
            if not p.is_file():continue
            s=p.read_text(errors='replace')
            if x.endswith('urls.py'):
              for n,ln in enumerate(s.splitlines(),1):
                if re.search(r'gallery|blog|news|media|article|company|admin|portal',ln,re.I):
                  print('ROUTE_LINE',x,n,ln.strip()[:230])
            if x.endswith('models.py'):
              try:
                tree=ast.parse(s)
                for node in tree.body:
                  if isinstance(node,ast.ClassDef):
                    fields=[(a.targets[0].id,a.value.func.attr if isinstance(a.value,ast.Call) and isinstance(a.value.func,ast.Attribute) else '') for a in node.body if isinstance(a,ast.Assign) and a.targets and isinstance(a.targets[0],ast.Name) and isinstance(a.value,ast.Call)]
                    print('MODEL_CLASS',node.name,fields[:25])
              except Exception as e:print('MODEL_AST_ERR',type(e).__name__)
            if x.endswith('views.py'):
              try:
                tree=ast.parse(s)
                for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and re.search(r'gallery|blog|news|media|company|post|article',node.name,re.I):
                    print('VIEW_FN',node.name,'line',node.lineno,'end',node.end_lineno)
                    for ln in s.splitlines()[node.lineno-1:min(node.end_lineno,node.lineno+34)]:
                      if re.search(r'secret|password|token|api.key|authorization|DATABASES',ln,re.I):continue
                      print(' VIEW',ln[:230])
              except Exception as e:print('VIEW_AST_ERR',type(e).__name__)
            if x=='config/settings.py':
              print('SETTINGS_MEDIA',[(key,key in s) for key in ['MEDIA_ROOT','MEDIA_URL','STATIC_ROOT','DATABASES','INSTALLED_APPS']])
          for sub in ['templates','portal/templates','static','portal/static']:
            p=h/sub
            if not p.exists():continue
            names=[]
            for f in p.rglob('*'):
              if f.is_file() and len(f.relative_to(p).parts)<7 and re.search('gallery|blog|news|company|media|image',f.name,re.I):names.append(str(f.relative_to(h)))
              if len(names)>30:break
            print('RELATED_ASSETS',sub,names[:30])
          for sub in ['core','portal','moj']:
            p=h/sub
            if p.is_dir():print('APPS',sub,sorted(f.name for f in p.iterdir() if f.is_file())[:55])
          for f in [h/'.venv/bin/python',h/'venv/bin/python',Path('/home/zomorod2/virtualenv/Saeit/3.11/bin/python')]:
            if f.exists():print('PYTHON_CANDIDATE',str(f))
          print('LIVE_MAP_DONE')
          REMOTE
      - name: Remove SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-gallery-ssh"