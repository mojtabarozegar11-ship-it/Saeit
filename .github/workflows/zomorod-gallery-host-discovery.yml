name: Zomorod gallery host discovery (read only)
on:
  push:
    branches: [ops/zomorod-gallery-publish-20261014]
    paths: [.github/workflows/zomorod-gallery-host-discovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect Django and Passenger application roots via pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-gallery-ssh"; mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
            LogLevel ERROR
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 100s ssh -F "$d/config" saeit-host 'cd /home/zomorod2/Saeit && .venv/bin/python -' <<'REMOTE'
          from pathlib import Path
          import os,sys,ast,re
          h=Path('/home/zomorod2/Saeit')
          print('PYTHON',sys.version.split()[0])
          for x in ['config/urls.py','portal/urls.py','portal/gallery_media.py','portal/gallery_media_policy.py','portal/admin.py','templates/modern/pages/company-gallery.html','templates/core/company_gallery.html','portal/templates/portal/gallery.html','moj/modern_site.py','moj/site_views.py']:
            p=h/x
            print('SOURCE',x,'exists',p.exists(),'size',p.stat().st_size if p.exists() else 0)
            if not p.is_file():continue
            ls=p.read_text(errors='replace').splitlines()
            if x.endswith('urls.py'):
              for n,line in enumerate(ls,1):
                if n<57 and x=='config/urls.py' or ('gallery' in line.lower() or 'article' in line.lower() or 'news' in line.lower()):
                  print('ROUTE',x,n,line[:300])
            elif 'gallery' in x.lower():
              for n,line in enumerate(ls[:130],1):
                if re.search(r'GalleryPhoto|photos|illustrations|<img|media|image|gallery|photo|url|article',line,re.I):print('GALLERY_SNIP',x,n,line[:260])
            elif x=='portal/admin.py':
              for n,line in enumerate(ls,1):
                if 'GalleryPhoto' in line or 'ArticleAdmin' in line or re.search(r'@admin.register\(Article',line):print('ADMIN_LINE',n,line[:240])
            elif x=='moj/site_views.py':
              for n,line in enumerate(ls,1):
                if re.search(r'gallery|articles|news|blog|_page',line,re.I):print('SITE_VIEW_LINE',n,line[:200])
          try:
            os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
            import django
            django.setup()
            from django.conf import settings
            from django.urls import resolve,Resolver404
            print('DJANGO',django.get_version(),'MEDIA_ROOT',str(getattr(settings,'MEDIA_ROOT',''))[:180],'MEDIA_URL',str(getattr(settings,'MEDIA_URL',''))[:180])
            print('DATABASE_ENGINE',settings.DATABASES.get('default',{}).get('ENGINE','unknown'))
            for u in ['/','/company-gallery/','/gallery/','/portal/gallery/','/knowledge/','/blog/','/news/','/admin/','/media/example.webp','/portal/media/example.webp']:
              try:
                r=resolve(u)
                print('RESOLVE',u,'module',getattr(r.func,'__module__',''),'name',getattr(r.func,'__name__',''), 'urlname',r.url_name)
              except Resolver404: print('RESOLVE',u,'NOT_FOUND')
            from portal.models import GalleryPhoto,Article
            for model in [GalleryPhoto,Article]:
              for f in model._meta.fields:
                if f.name in ['image','cover','state','category','language','slug','publication_mode','is_approved','approved_by']:
                  print('MODEL_FIELD',model.__name__,f.name,'null',f.null,'blank',f.blank,'upload_to',str(getattr(f,'upload_to',''))[:80],'default',str(f.get_default())[:80],'choices',str(list(f.choices))[:180] if f.choices else '')
            for model in [GalleryPhoto,Article]:
              try:
                print('MODEL_COUNT',model.__name__,model.objects.count())
                if model is GalleryPhoto:print('APPROVED_PHOTOS',model.objects.filter(is_approved=True).count())
                else:print('PUBLISHED_ARTICLES',model.objects.filter(state='published').count())
              except Exception as e:print('DB_INSPECT_ERROR',model.__name__,type(e).__name__)
          except Exception as e:print('DJANGO_INSPECT_ERROR',type(e).__name__,str(e)[:120])
          print('PUBLICATION_READ_ONLY_READY')
          REMOTE
      - name: Remove SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-gallery-ssh"