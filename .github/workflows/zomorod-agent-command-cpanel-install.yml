name: Install missing Zomorod site agent commands once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agent-command-cpanel-install
  cancel-in-progress: false
jobs:
  install-existing-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-agent-install"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Stage exact existing command files only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent-install"
          run_id="${{ github.run_id }}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          ssh -F "$d/config" saeit-cpanel "bash -se" <<REMOTE
          set -euo pipefail
          stage="/home/zomorod2/.private/saeit-agent-cmd-$run_id"
          test -d /home/zomorod2/.private && test ! -e "\$stage"
          install -d -m 700 "\$stage"
          test -d /home/zomorod2/Saeit/core/management/commands
          test -f /home/zomorod2/Saeit/manage.py
          REMOTE
          tar -cf - \
            deploy/cpanel_site_agent_command_install.py \
            core/management/commands/company_activity_agent_cycle.py \
            core/management/commands/knowledge_agent_cycle.py \
            | ssh -F "$d/config" saeit-cpanel \
              "tar -xf - -C '/home/zomorod2/.private/saeit-agent-cmd-$run_id' --no-same-owner"
          echo "CPANEL_AGENT_COMMAND_STAGE=verified"
      - name: Install with schema checks and atomic no-overwrite rollback
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-agent-install"
          run_id="${{ github.run_id }}"
          ssh -F "$d/config" saeit-cpanel \
            "/home/zomorod2/Saeit/.venv/bin/python /home/zomorod2/.private/saeit-agent-cmd-$run_id/deploy/cpanel_site_agent_command_install.py --app /home/zomorod2/Saeit --stage /home/zomorod2/.private/saeit-agent-cmd-$run_id --python /home/zomorod2/Saeit/.venv/bin/python --run-id $run_id"
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-agent-install"
          if test -d "$d"; then rm -rf -- "$d"; fi
