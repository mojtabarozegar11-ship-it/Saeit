name: MojPlayWin isolated SYNTHETIC GPGv2 throughput test
on:
  push:
    branches:
      - feature/mojplaywin-crypto-gateway-20261018
    paths:
      - .github/workflows/mojplaywin-crypto-synthetic-gpgv2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojplaywin-synthetic-gpgv2-staging
  cancel-in-progress: false

jobs:
  synthetic-only-never-production:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate synthetic-only script before SSH
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_gpg_synthetic_stream_vps.py
          echo "NO_PRODUCTION_BACKUP_STARTED=true"
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"

      - name: Transfer 128MiB of fake random data and test isolated GPGv2 roundtrip
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          payload64="$(base64 -w0 scripts/mojplaywin_gpg_synthetic_stream_vps.py)"
          pycall="import base64,sys; exec(base64.b64decode(sys.argv[1]))"
          timeout 300s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import os,sys; o=sys.stdout.buffer; [o.write(os.urandom(1048576)) for _ in range(128)]; o.flush()'" |
            timeout 180s ssh -T -F "$d/config" saeit-vps "python3 -c '$pycall' '$payload64'" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,sort_keys=True)); assert d.get("roundtrip_integrity_verified") is True and d.get("fixture_bytes")==134217728 and d.get("real_backup_modified") is False'
      - name: Production release denied regardless of synthetic result
        run: |
          echo "ONLY_EPHEMERAL_SYNTHETIC_VPS_FIXTURE=true"
          echo "CUSTOMER_DATA_READ=false"
          echo "DATABASE_DUMP_EXECUTED=false"
          echo "ACTUAL_RECOVERABLE_BACKUP_CREATED=false"
          echo "PRODUCTION_RELEASE_PERMITTED=false"
