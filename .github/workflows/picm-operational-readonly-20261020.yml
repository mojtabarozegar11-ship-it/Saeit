name: PICM Isolated Operations Read-Only Audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: PICM isolated readiness audit 2026-10-20'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned relay and cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/picm-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P '' -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$WORK/config" <<EOF
          Host picm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" picm-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat >> "$WORK/config" <<EOF
          Host picm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump picm-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo PICM_RELAY_READY
      - name: Check ffmpeg binaries and encoder support without doing any render
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          for host in picm-host picm-vps; do
            echo "PICM_VIDEO_HOST_CHECK_$host"
            timeout 35s ssh -F "$WORK/config" "$host" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo PICM_FFMPEG_PRESENT
            ffmpeg -hide_banner -version 2>&1 | head -n 1
            ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'libx264|mpeg4|libvpx|h264_' | head -n 10 || true
          else
            echo PICM_FFMPEG_NOT_PRESENT
          fi
          if command -v avconv >/dev/null 2>&1; then
            echo PICM_AVCONV_PRESENT
          else
            echo PICM_AVCONV_MISSING
          fi
          echo PICM_READ_ONLY_ENCODER_CHECK_OK
          REMOTE
          done
      - name: Inspect isolated VPS hardware and private PICM worker
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 45s ssh -F "$WORK/config" picm-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo PICM_VPS_INSPECTION_START
          echo "PICM_CPU_CORES=$(getconf _NPROCESSORS_ONLN)"
          awk '/^model name/{print "PICM_CPU_MODEL="$0; exit}' /proc/cpuinfo || true
          awk '/^MemTotal:|^MemAvailable:/{print "PICM_MEMORY="$0}' /proc/meminfo
          df -Pk "$HOME" | awk 'NR==2{print "PICM_DISK_AVAILABLE_KB="$4}'
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo PICM_NVIDIA_SMI_PRESENT
            timeout 5s nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || echo PICM_NVIDIA_QUERY_UNAVAILABLE
          elif test -e /dev/nvidia0; then
            echo PICM_NVIDIA_DEVICE_PRESENT
          else
            echo PICM_NVIDIA_NOT_DETECTED
          fi
          if command -v lspci >/dev/null 2>&1; then lspci | grep -Ei 'VGA compatible|3D controller|Display controller' || true; fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path.home()/'.local/share/saeit-picm'
          pidfile=root/'worker.pid'
          token=root/'worker-token'
          print('PICM_WORKER_TOKEN_FILE_PRESENT' if token.is_file() and not token.is_symlink() else 'PICM_WORKER_TOKEN_FILE_MISSING')
          running=False
          try:
              pid=int(pidfile.read_text().strip())
              cmdline=(Path('/proc')/str(pid)/'cmdline').read_bytes().replace(b'\0', b' ')
              os.kill(pid, 0)
              running=b'saeit-picm/worker.py' in cmdline
          except (OSError,ValueError):
              pass
          print('PICM_WORKER_RUNNING' if running else 'PICM_WORKER_NOT_RUNNING')
          print('PICM_COMFYUI_CODE_PRESENT' if (Path.home()/'comfyui-isolated/source-v0.40.0/main.py').is_file() else 'PICM_COMFYUI_CODE_NOT_FOUND')
          PY
          echo PICM_VPS_INSPECTION_COMPLETE
          REMOTE
      - name: Read PICM factory guard and sanitized worker failure diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 35s ssh -F "$WORK/config" picm-vps 'python3 -' <<'PY'
          from pathlib import Path
          import os, urllib.request
          home=Path.home()
          pidfile=home/'factory-runtime/operations/vps-only-loop.pid'
          valid=False
          try:
              pid=int(pidfile.read_text().strip())
              os.kill(pid,0)
              valid=True
          except (OSError,ValueError):
              pass
          print('PICM_FACTORY_GUARD_RUNNING' if valid else 'PICM_FACTORY_GUARD_BLOCKED')
          try:
              with open('/proc/meminfo',encoding='ascii') as f:
                  avail=next(int(l.split()[1]) for l in f if l.startswith('MemAvailable:'))
              print('PICM_RAM_GUARD_PASS' if avail>=2850000 else 'PICM_RAM_GUARD_BLOCKED')
              print('PICM_RAM_AVAILABLE_KB='+str(avail))
          except (OSError,StopIteration):
              print('PICM_RAM_GUARD_UNKNOWN')
          try:
              with urllib.request.urlopen('http://127.0.0.1:18188/system_stats',timeout=3) as r:
                  print('PICM_COMFYUI_ALREADY_RUNNING' if r.status==200 else 'PICM_COMFYUI_UNKNOWN_RESPONSE')
          except Exception:
              print('PICM_COMFYUI_NOT_CURRENTLY_RUNNING')
          logfile=home/'.local/share/saeit-picm/worker.log'
          if logfile.is_file() and not logfile.is_symlink():
              safe=[]
              for line in logfile.read_text(errors='replace').splitlines()[-300:]:
                  if line.startswith(('PICM_RENDER_ERROR=', 'PICM_JOB_REPORTED_FAILED_', 'PICM_WORKER_RECOVERABLE_ERROR=', 'PICM_JOB_DELIVERED_', 'PICM_QUEUE_EMPTY', 'PICM_JOB_CLAIMED')):
                      safe.append(line[:130])
              print('PICM_SANITIZED_RECENT_LOG_START')
              print('\n'.join(safe[-30:]))
              print('PICM_SANITIZED_RECENT_LOG_END')
          else:
              print('PICM_WORKER_LOG_MISSING')
          PY
      - name: Classify previous private ComfyUI boot failure safely
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 35s ssh -F "$WORK/config" picm-vps 'python3 -' <<'PY'
          from pathlib import Path
          import os, time
          root=Path.home()/'comfyui-isolated'
          python=root/'env-cpu/bin/python'
          source=root/'source-v0.40.0/main.py'
          controller=Path.home()/'.local/share/saeit-picm/control.sh'
          print('PICM_PYTHON_READY' if python.is_file() and os.access(python,os.X_OK) else 'PICM_PYTHON_MISSING')
          print('PICM_MAIN_READY' if source.is_file() else 'PICM_MAIN_MISSING')
          print('PICM_CONTROLLER_READY' if controller.is_file() else 'PICM_CONTROLLER_MISSING')
          pidfile=root/'.control/comfyui.pid'
          if pidfile.is_file():
              try:
                  pid=int(pidfile.read_text().strip())
                  alive=(Path('/proc')/str(pid)).is_dir()
              except (OSError,ValueError):
                  alive=False
              print('PICM_COMFYUI_PID_ACTIVE' if alive else 'PICM_COMFYUI_PID_STALE')
          else:
              print('PICM_COMFYUI_PID_ABSENT')
          p=root/'.control/comfyui.log'
          if p.is_file() and not p.is_symlink():
              tail=p.read_text(errors='replace').splitlines()[-600:]
              print('PICM_COMFYUI_LAST_LOG_AGE_SECONDS='+str(int(time.time()-p.stat().st_mtime)))
              print('PICM_COMFYUI_LOG_LINES_SCANNED='+str(len(tail)))
              clues=['ModuleNotFoundError','No module named','ImportError','RuntimeError','PermissionError','Address already in use','Illegal instruction','Cannot allocate memory','No space left on device','Killed','Traceback','Failed to import','Error loading']
              for phrase in clues:
                  matches=sum(1 for line in tail if phrase.lower() in line.lower())
                  if matches:
                      print('PICM_COMFYUI_LOG_CLUE_'+phrase.upper().replace(' ','_')+'='+str(matches))
              print('PICM_COMFYUI_LOG_SCAN_OK')
          else:
              print('PICM_COMFYUI_LOG_UNAVAILABLE')
          PY
      - name: Check private cPanel PICM installation without reading private data
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 40s ssh -F "$WORK/config" picm-host 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo PICM_CPANEL_INSPECTION_START
          test -f "$HOME/Saeit-staging/core/picm_views.py" && echo PICM_VIEWS_INSTALLED || echo PICM_VIEWS_MISSING
          test -f "$HOME/Saeit-staging/templates/picm/index.html" && echo PICM_WORKSPACE_TEMPLATE_INSTALLED || echo PICM_WORKSPACE_TEMPLATE_MISSING
          if test -f "$HOME/.picm-queue/.owner-user-id" && test ! -L "$HOME/.picm-queue/.owner-user-id"; then
            echo PICM_OWNER_BINDING_PRESENT
          else
            echo PICM_OWNER_BINDING_MISSING
          fi
          if test -f "$HOME/.picm-queue/worker-token" && test ! -L "$HOME/.picm-queue/worker-token"; then
            echo PICM_HOST_WORKER_TOKEN_PRESENT
          else
            echo PICM_HOST_WORKER_TOKEN_MISSING
          fi
          if test -d "$HOME/.picm-queue"; then
            count="$(find "$HOME/.picm-queue" -maxdepth 1 -type f -name '*.stage.json' | wc -l)"
            echo "PICM_PRIVATE_PENDING_REFERENCE_COUNT=$count"
          fi
          echo PICM_CPANEL_INSPECTION_COMPLETE
          REMOTE
      - name: Diagnose PICM user queue and quota safely without exposing prompts or IDs
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 40s ssh -F "$WORK/config" picm-host 'python3 -' <<'PY'
          import collections
          import json
          import time
          from pathlib import Path
          home=Path.home()
          root=home/'.picm-queue'
          print('PICM_QUEUE_ROOT_PRESENT='+str(root.is_dir() and not root.is_symlink()))
          binding=root/'.owner-user-id'
          owner=binding.read_text(encoding='utf-8').strip() if binding.is_file() and not binding.is_symlink() else None
          print('PICM_OWNER_BOUND='+str(bool(owner)))
          now=time.time()
          counts=collections.Counter()
          owner_24h=collections.Counter()
          recent_age=[]
          total=0
          for path in root.glob('*.json'):
              if path.is_symlink() or len(path.stem)!=32:
                  continue
              try:
                  job=json.loads(path.read_text(encoding='utf-8'))
              except (OSError,ValueError):
                  counts['invalid']+=1
                  continue
              if not isinstance(job,dict) or job.get('id')!=path.stem: 
                  counts['untrusted']+=1
                  continue
              total+=1
              state=job.get('state')
              if state not in ('queued','running','done','failed'):
                  state='other'
              counts[state]+=1
              try:
                  age=max(0,now-float(job.get('created',0)))
              except (TypeError,ValueError):
                  age=999999999
              if owner and str(job.get('user_id'))==owner:
                  if age<86400:owner_24h[state]+=1
                  if age<172800:recent_age.append((age,state))
          print('PICM_JOB_FILES_TOTAL='+str(total))
          for state in ('queued','running','done','failed','other','invalid','untrusted'):
              print('PICM_JOB_'+state.upper()+'_COUNT='+str(counts[state]))
          print('PICM_OWNER_LAST_24H_TOTAL='+str(sum(owner_24h.values())))
          for state in ('queued','running','done','failed'):
              print('PICM_OWNER_LAST_24H_'+state.upper()+'='+str(owner_24h[state]))
          for age,state in sorted(recent_age)[:5]:
              print('PICM_RECENT_JOB_STATE='+state+';AGE_MINUTES='+str(int(age//60)))
          template=home/'Saeit-staging/templates/picm/index.html'
          js=home/'Saeit-staging/templates/picm/text_image.js'
          print('PICM_LIVE_TEXT_IMAGE_CONTROLS='+str(template.is_file() and b'mode-text_image' in template.read_bytes()))
          print('PICM_LIVE_TEXT_IMAGE_SCRIPT='+str(js.is_file() and b'/picm/api/submit/' in js.read_bytes()))
          print('PICM_DIAGNOSTICS_READ_ONLY_COMPLETE')
          PY
      - name: Read-only classify exact current PICM template variants for guarded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 45s ssh -F "$WORK/config" picm-host 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib
          base=Path.home()/'Saeit-staging/templates/picm'
          markers={
            "index.html":{
              "PICM_HTML_DEFAULT_OLD":'<input type="hidden" id="mode" name="mode" value="image_edit">',
              "PICM_HTML_DEFAULT_NEW":'<input type="hidden" id="mode" name="mode" value="text_image">',
              "PICM_HTML_FILE_REQUIRED_OLD":'name="photo" id="photo" accept="image/png,image/jpeg" required',
              "PICM_HTML_FILE_OPTIONAL_NEW":'name="photo" id="photo" accept="image/png,image/jpeg" hidden',
              "PICM_HTML_AI_TILE_OLD":'id="mode-text_image" type="button" aria-pressed="false"',
              "PICM_HTML_AI_TILE_NEW":'id="mode-text_image" type="button" aria-pressed="true"',
              "PICM_HTML_EDIT_TILE_OLD":'id="mode-image_edit" type="button" aria-pressed="true"',
              "PICM_HTML_EDIT_TILE_NEW":'id="mode-image_edit" type="button" aria-pressed="false"',
              "PICM_HTML_AI_OPTIONS_OLD":'<div id="text-image-options" hidden>',
              "PICM_HTML_AI_OPTIONS_NEW":'<div id="text-image-options">',
            },
            "text_image.js":{
              "PICM_JS_NOVALIDATE_OLD":'  const selected=isText();\n  textOptions.hidden=!selected;',
              "PICM_JS_NOVALIDATE_NEW":'form.noValidate=selected;',
              "PICM_JS_REAL_POST":'fetch("/picm/api/submit/"',
            }
          }
          for filename, signatures in markers.items():
            f=base/filename
            if f.is_symlink() or not f.is_file():
              print("PICM_LIVE_ASSET_NOT_REGULAR="+filename)
              continue
            raw=f.read_bytes()
            content=raw.decode('utf-8')
            gitblob=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
            print('PICM_LIVE_BLOB_SHA_'+filename.replace('.','_')+'='+gitblob)
            print('PICM_LIVE_SHA256_'+filename.replace('.','_')+'='+hashlib.sha256(raw).hexdigest())
            print('PICM_LIVE_BYTES_'+filename.replace('.','_')+'='+str(len(raw)))
            for label,signature in signatures.items():
              print(label+'_COUNT='+str(content.count(signature)))
          print('PICM_LIVE_TEMPLATE_VARIANT_DIAG_DONE')
          PY
      - name: Render actual owner PICM Django workbench privately without modifying data
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 60s ssh -F "$WORK/config" picm-host 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/zomorod2/Saeit-staging
          found=0
          for py in "$PWD/.venv/bin/python" "$PWD/venv/bin/python" /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python; do
            if test -x "$py" && "$py" -c 'import django' >/dev/null 2>&1; then
              found=1
              "$py" - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.test import RequestFactory
          from types import SimpleNamespace
          from core.picm_access import owner_id
          from core.picm_views import picm_workbench
          owner=owner_id()
          assert owner is not None, "PICM_OWNER_NOT_BOUND"
          req=RequestFactory().get('/picm/workspace/')
          req.user=SimpleNamespace(pk=int(owner),is_authenticated=True,is_active=True)
          response=picm_workbench(req)
          print('PICM_DJANGO_OWNER_RENDER_HTTP='+str(response.status_code))
          assert response.status_code==200
          html=response.content.decode('utf-8')
          details={
            'PICM_DJANGO_DEFAULT_TEXT_IMAGE':'id="mode" name="mode" value="text_image"' in html,
            'PICM_DJANGO_TEXT_IMAGE_TILE_ACTIVE':'id="mode-text_image" type="button" aria-pressed="true"' in html,
            'PICM_DJANGO_PHOTO_NOT_REQUIRED':'name="photo" id="photo" accept="image/png,image/jpeg" hidden' in html,
            'PICM_DJANGO_PROMPT_VALIDATION':'form.noValidate=selected' in html,
            'PICM_DJANGO_PRIVATE_POST':'fetch("/picm/api/submit/"' in html,
            'PICM_DJANGO_TEXT_IMAGE_SCRIPT':'PICM private' in html or 'Owner-only, genuine PICM' in html,
          }
          for key,val in details.items():
            print(key+'='+str(val))
          assert all(details.values()),"PICM_DJANGO_TEMPLATE_OLDER_THAN_DISK"
          print('PICM_LIVE_DJANGO_OWNER_NEW_UI_RENDER_CONFIRMED')
          req.user=SimpleNamespace(pk=-3219889,is_authenticated=True,is_active=True)
          print('PICM_DJANGO_NONOWNER_HTTP='+str(picm_workbench(req).status_code))
          assert picm_workbench(req).status_code==403
          PY
              break
            fi
          done
          test "$found" = 1 || { echo PICM_DJANGO_RUNTIME_NOT_FOUND; exit 33; }
          REMOTE
      - name: Verify public PICM security boundaries read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          for entry in 'picm/login/|200' 'picm/|302' 'picm/workspace/|302' 'picm/api/reference/|405' 'picm/worker/health/|403'; do
            path="$(printf '%s' "$entry" | cut -d '|' -f1)"
            expected="$(printf '%s' "$entry" | cut -d '|' -f2)"
            actual="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://mojplaywin.com/$path" || true)"
            echo "PICM_HTTP_STATUS=$path:$actual"
            test "$actual" = "$expected" || exit 9
          done
          echo PICM_HTTP_SECURITY_BOUNDARIES_OK
      - name: Remove private connection files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/picm-ssh"
