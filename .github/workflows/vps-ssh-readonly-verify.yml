name: VPS SSH Read-Only Verification
on:
  workflow_dispatch:
  push:
    branches:
      - factory/integration-control-bridge-20261005
    paths:
      - .github/workflows/vps-ssh-readonly-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify required configuration
        shell: bash
        env:
          VPS_HOST: "178.239.147.150"
          VPS_USER: "githubops"
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_KEY; do
            if [[ -z "${!v}" ]]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          test "$VPS_USER" = githubops || { echo "::error::Unexpected SSH user"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 -t rsa "$VPS_HOST" 2>/dev/null > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::Could not obtain VPS RSA host key"; exit 1; }
          actual_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          expected_fingerprint="SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Observed VPS RSA fingerprint: $actual_fingerprint"
            echo "::error::VPS host fingerprint mismatch; SSH authentication intentionally blocked"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/vps_key >/dev/null
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH configuration parsed successfully"
      - name: Run safe identity check
        shell: bash
        env:
          VPS_HOST: "178.239.147.150"
          VPS_USER: "githubops"
        run: |
          set -euo pipefail
          result="$(ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" whoami)"
          test "$result" = githubops || { echo "::error::Unexpected remote identity"; exit 1; }
          echo "VPS SSH verified: githubops"

      - name: Check VPS to hosting network only
        shell: bash
        env:
          VPS_HOST: "178.239.147.150"
          VPS_USER: "githubops"
        run: |
          set -euo pipefail
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          for host in staging.zomorodmelal.ir zomorodmelal.ir; do
            echo "HOST=$host"
            getent ahostsv4 "$host" | awk 'NR==1 {print "RESOLVED_IP="$1}' || true
            if timeout 6 bash -c 'echo >/dev/tcp/"$1"/22' _ "$host" 2>/dev/null; then
              echo "TCP22=reachable"
            else
              echo "TCP22=unreachable_or_filtered"
            fi
          done
          REMOTE

      - name: Check common SSH ports on hosting IP from VPS
        shell: bash
        env:
          VPS_HOST: "178.239.147.150"
          VPS_USER: "githubops"
        run: |
          set -euo pipefail
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          target=178.239.147.125
          for port in 22 2222 2022 2200; do
            if timeout 4 bash -c 'echo >/dev/tcp/"$1"/"$2"' _ "$target" "$port" 2>/dev/null; then
              echo "hosting_ssh_candidate_port_$port=reachable"
            else
              echo "hosting_ssh_candidate_port_$port=unreachable_or_filtered"
            fi
          done
          REMOTE

      - name: Inspect VPS port 443 locally
        shell: bash
        run: |
          set -euo pipefail
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o IdentitiesOnly=yes githubops@178.239.147.150 'bash -s' <<'REMOTE'
          if timeout 5 bash -c 'echo >/dev/tcp/127.0.0.1/443' 2>/dev/null; then
            echo 'VPS_TCP443=reachable_from_loopback'
          else
            echo 'VPS_TCP443=not_reachable_from_loopback'
          fi
          REMOTE

      - name: Inspect VPS SSH and HTTPS listeners read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o IdentitiesOnly=yes githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -u
          echo "DIAGNOSTIC_START"
          for cmd in ss curl ssh sshd; do command -v "$cmd" || true; done
          if command -v ss >/dev/null; then
            ss -H -ltn | awk '$4 ~ /:(22|443|8443|22222)$/ {print "LISTENER="$4}'
          fi
          for port in 22 443 8443; do
            if timeout 3 bash -c 'echo >/dev/tcp/127.0.0.1/"$1"' _ "$port" 2>/dev/null; then
              echo "LOCAL_PORT_${port}=reachable"
            else
              echo "LOCAL_PORT_${port}=unreachable"
            fi
          done
          echo "DIAGNOSTIC_END"
          REMOTE

      - name: Check reverse tunnel presence and sshd forwarding policy
        shell: bash
        run: |
          set -euo pipefail
          ssh -F /dev/null -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o IdentitiesOnly=yes githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -u
          if timeout 3 bash -c 'echo >/dev/tcp/127.0.0.1/22222' 2>/dev/null; then
            echo "REVERSE_TUNNEL_22222=LISTENING"
          else
            echo "REVERSE_TUNNEL_22222=NOT_LISTENING"
          fi
          if command -v ss >/dev/null; then
            ss -H -ltn | awk '$4 ~ /:(22222)$/ {print "TUNNEL_SOCKET="$4}'
          fi
          echo "VPS_USER=$(id -un)"
          REMOTE
