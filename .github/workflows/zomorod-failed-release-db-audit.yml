name: Old failed release backups and staging DB schema audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-failed-release-db-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-old-release-db-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read-only inspection of failed release contents and staging SQLite allocations
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,json,sqlite3
          from pathlib import Path
          H=Path.home()
          root=H/".backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b"
          names=["failed-app-057e92ce4bf3373b5f431276e6febbaa3c2a42fe","release-candidate-950883c89208641be51f2871cfd70705ea8b37b0","live-source-compat-v3-20261016"]
          for name in names:
              d=root/name
              if not d.is_dir():continue
              print("FAILED_SNAPSHOT_ROOT="+name)
              for p in sorted(d.iterdir(),key=lambda x:x.stat().st_size if x.is_file() else 0,reverse=True)[:45]:
                  try:
                      if p.is_dir():
                          r=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=30)
                          sz=int(r.stdout.split()[0])*1024 if r.stdout else -1
                      else:sz=p.stat().st_size
                      print("FAILED_SNAPSHOT_CHILD="+json.dumps({"parent":name,"name":p.name,"bytes":sz,"dir":p.is_dir()}))
                  except OSError:pass
          db=H/"Saeit-staging/mojplaywin.sqlite3"
          assert db.is_file()
          con=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True,timeout=5)
          for pragma in ("page_count","page_size","freelist_count","auto_vacuum","journal_mode"):
              print("STAGING_SQLITE_PRAGMA="+pragma+":"+str(con.execute("PRAGMA "+pragma).fetchone()[0]))
          print("STAGING_SQLITE_TABLE_COUNT="+str(con.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]))
          con.close()
          print("RELEASE_DB_AUDIT_COMPLETE=yes")
          PY
          REMOTE
      - name: Clear runner connection keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
