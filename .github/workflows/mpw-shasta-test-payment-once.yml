name: MPW One Shasta Test Transfer With No Mainnet Access
on:
  push:
    branches: [fix/mpw-tron-provider-auth-20261022]
    paths:
      - .github/workflows/mpw-shasta-test-payment-once.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  shasta-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Parse test-only transaction source
        run: node --check scripts/mpw_shasta_one_test_transfer_20261023.mjs
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 3\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 50s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Verify existing protected signer without exposing its secret
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-vps 'python3 -' < scripts/mpw_trx_shasta_signer_preflight_20261023.py
      - name: Execute journaled one-time Shasta test-only transfer
        run: |
          set -euo pipefail
          tar -cf - scripts/mpw_shasta_one_test_transfer_20261023.mjs | timeout 50s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-vps 'cd /home/githubops/.local/share/moj1-shasta-test-20261021/runtime-governance/moj1-pilot && tar -xf - --no-same-owner --no-same-permissions'
          timeout 105s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-vps 'cd /home/githubops/.local/share/moj1-shasta-test-20261021/runtime-governance/moj1-pilot && MPW_SHASTA_CANARY_CONFIRM=SHASTA_ONLY_SEND_ONE_TEST_TRX /home/githubops/.local/share/moj1-shasta-test-20261021/moj1-node scripts/mpw_shasta_one_test_transfer_20261023.mjs'
      - name: Cleanup
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-gateway-contract-ssh"
