name: Zomorod private command-center schema activation without owner impersonation
on:
  push:
    branches: [feature/zomorod-command-bridge-private-v4-20261029]
    paths: [".github/workflows/zomorod-company-bridge-v4-schema-init.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-private-command-center-schema-init
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Connect through pinned VPS to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_PRIVATE_RELAY=verified"





      - name: Initialize only the private command-center control database and check bridge readiness
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-business-tokenless"
          expected="$(sha256sum content/zomorod-business/command_center.php | awk '{print $1}')"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$expected" <<'REMOTE'
          set -euo pipefail
          p="$HOME/.private/zomorod-business"
          fail(){ echo "COMMAND_BRIDGE_SCHEMA_INIT_BLOCKED=$1";exit 43; }
          test -d "$p" && test ! -L "$p" || fail private_directory
          test -f "$p/command_center.php" && test ! -L "$p/command_center.php" || fail missing_controller
          test -f "$p/command_quality.php" && test ! -L "$p/command_quality.php" || fail missing_quality
          test -f "$p/command_planner.php" && test ! -L "$p/command_planner.php" || fail missing_planner
          test -f "$p/company_bridge.py" && test ! -L "$p/company_bridge.py" || fail missing_signed_bridge
          test -f "$p/.company-bridge.key" && test ! -L "$p/.company-bridge.key" || fail missing_private_signer_key
          test "$(sha256sum "$p/command_center.php" | awk '{print $1}')" = "$1" || fail changed_control_code
          if test -e "$p/command-center.sqlite3";then
            test -f "$p/command-center.sqlite3" && test ! -L "$p/command-center.sqlite3" || fail unsafe_existing_control_db
            echo "PRIVATE_CONTROL_DB=EXISTING"
          else
            echo "PRIVATE_CONTROL_DB=CREATING_EMPTY_SCHEMA"
          fi
          phpbin="$(command -v php || true)"
          if test -z "$phpbin";then phpbin="/opt/cpanel/ea-php82/root/usr/bin/php";fi
          "$phpbin" -l "$p/command_center.php" >/dev/null
          "$phpbin" -r '
            require $argv[1];
            $db=zmCcDb($argv[2]);
            if($db->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(44);
            $actual=$db->query("SELECT name FROM sqlite_master WHERE type=\"table\"")->fetchAll(PDO::FETCH_COLUMN);
            foreach(["tasks","task_events","task_quality"] as $name){
              if(!in_array($name,$actual,true))exit(45);
            }
            if((int)$db->query("SELECT COUNT(*) FROM tasks")->fetchColumn()!==0){
              echo "PRIVATE_CONTROL_DB=EXISTING_WORK_ITEMS_PRESERVED\n";
            }
            echo "PRIVATE_CONTROL_DB_SCHEMA=VALID\n";
          ' "$p/command_center.php" "$p"
          test -f "$p/command-center.sqlite3" && test ! -L "$p/command-center.sqlite3"
          test "$(stat -c %a "$p/command-center.sqlite3")" = 600
          python3 "$p/company_bridge.py" --db "$p/command-center.sqlite3" --key "$p/.company-bridge.key" status
          echo "COMPANY_COMMAND_BRIDGE_PRIVATE_SELF_TEST=PASS"
          echo "EXTERNAL_SIGNER=NOT_CONFIGURED"
          echo "RECURRING_AUTOMATION=NOT_CREATED"
          echo "ACCOUNTING_DB=NOT_ACCESSED"
          REMOTE
      - name: Clean temporary relay keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-business-tokenless"
