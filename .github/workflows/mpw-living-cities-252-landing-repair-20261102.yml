name: MojPlayWin Living Cities 252 quests verified landing copy repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-living-cities-252-landing-repair-20261102.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: mpw-living-cities-landing-copy-eca666, cancel-in-progress: false}
jobs:
  repair:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check game scope and literal mission-stat correction
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_living_cities_landing_copy_repair.py
          grep -Fq "eca666cbb730a6fcf70d284328893a78ad966881" scripts/mpw_living_cities_landing_copy_repair.py
          grep -Fq "200 world + 52 weekly" scripts/mpw_living_cities_landing_copy_repair.py
          echo MPW_252_LANDING_COPY_SCOPE_GATE=PASS
      - name: Pinned GitHub VPS cPanel transport
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Privately preserve exact existing public landing before any change
        id: backup
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 45s ssh -T -F "$d/config" host 'python3 - backup' < scripts/mpw_living_cities_landing_copy_repair.py
          original="$HOME/.private/mpw-living-cities-global/landing-copy-eca666/index-original.html"
          timeout 45s ssh -T -F "$d/config" host 'cat "$HOME/.private/mpw-living-cities-global/landing-copy-eca666/index-original.html"' |
            timeout 50s ssh -T -F "$d/config" vps 'umask 077; cat > "$HOME/.private/living-cities-transport/mpw-landing-eca666-original.pending"'
          timeout 45s ssh -T -F "$d/config" vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          d="$HOME/.private/living-cities-transport"
          p="$d/mpw-landing-eca666-original.pending"
          test -s "$p" && test ! -L "$p"
          test "$(grep -c '200 evolving world missions' "$p")" -ge 1
          chmod 600 "$p"
          mv -T "$p" "$d/mpw-landing-eca666-original.html"
          sha256sum "$d/mpw-landing-eca666-original.html" | awk '{print "MPW_252_OFFHOST_ORIGINAL_SHA256="$1}'
          echo MPW_252_OFFHOST_BACKUP=PASS
          REMOTE
      - name: Replace only malformed 252200 text in owned game landing
        id: apply
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 50s ssh -T -F "$d/config" host 'python3 - apply' < scripts/mpw_living_cities_landing_copy_repair.py
      - name: Validate HTTP 200 and correct game count; other MojPlayWin sections intact
        id: smoke
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 75s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          ip="$(getent ahostsv4 mojplaywin.com | awk 'NR==1{print $1}')"
          test -n "$ip"
          for route in /living-cities/ /living-cities/play/                        /living-cities/static/living_cities/weekly-expeditions.mjs                        /games/ /store/ /; do
            temp="$(mktemp)"
            code=000
            for n in 1 2 3; do
              code="$(curl -ksS -4 --connect-timeout 5 --max-time 15                 --resolve "mojplaywin.com:443:$ip"                 -H "Cache-Control: no-cache" -o "$temp" -w '%{http_code}'                 "https://mojplaywin.com$route" || true)"
              test "$code" = 200 && break
              sleep 2
            done
            echo "MPW_LANDING_REPAIR_ORIGIN=$route HTTP=$code"
            test "$code" = 200 || { rm -f "$temp"; exit 1; }
            case "$route" in
              /living-cities/)
                grep -Fq '<b>252</b>Total quests (200 world + 52 weekly)' "$temp"
                ! grep -Fq '<b>252</b>200 world' "$temp"
                ;;
              /living-cities/play/) grep -Fq 'data-lc-edition="browser"' "$temp";;
              /living-cities/static/living_cities/weekly-expeditions.mjs)
                grep -Fq 'YEARLY_CONTRACTS' "$temp";;
              /games/) grep -Fq '/living-cities/play/' "$temp";;
            esac
            rm -f "$temp"
          done
          echo MPW_LANDING_COPY_PUBLIC_ACCEPTANCE=PASS
          REMOTE
          timeout 40s ssh -T -F "$d/config" host 'python3 - verify' < scripts/mpw_living_cities_landing_copy_repair.py
      - name: Restore original only if post-write public acceptance fails
        if: failure() && steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          if [ -f "$d/config" ]; then
            timeout 45s ssh -T -F "$d/config" host 'python3 - rollback' < scripts/mpw_living_cities_landing_copy_repair.py
          fi
      - name: Erase ephemeral runner SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
