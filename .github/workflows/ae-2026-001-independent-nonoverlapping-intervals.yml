name: AE-2026-001 real-WDI nonoverlapping growth reproducibility
on:
  push:
    branches: [research/mr-2026-001-novelty-audit]
    paths:
      - .github/workflows/ae-2026-001-independent-nonoverlapping-intervals.yml
      - research/manuscripts/AE-2026-001/analysis/wdi_nonoverlapping_period_growth_from_archived_official_panel.py
      - research/manuscripts/AE-2026-001/AE-2026-001_OFFICIAL_WDI_OBSERVED_COUNTRY_PANEL_2026-10-25.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute-from-genuine-archived-world-bank-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual country-level observations and recompute distinct 2019-2023 period
        run: python research/manuscripts/AE-2026-001/analysis/wdi_nonoverlapping_period_growth_from_archived_official_panel.py
      - name: Preserve independent real-data analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: AE-2026-001-REAL-WDI-nonoverlapping-intervals
          path: research/manuscripts/AE-2026-001/AE-2026-001_NONOVERLAPPING_2000_2019_VS_2019_2023_REAL_WDI_2026-10-25.json
          retention-days: 14
          if-no-files-found: error
