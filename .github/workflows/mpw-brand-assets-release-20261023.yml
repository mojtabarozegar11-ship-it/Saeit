name: MojPlayWin brand icon isolated release
on:
  pull_request:
    paths: [assets/mpw-brand-coin-icon-20261023.png, scripts/mpw_brand_assets_release_20261023.py, .github/workflows/mpw-brand-assets-release-20261023.yml]
  push:
    branches: [main]
    paths: [assets/mpw-brand-coin-icon-20261023.png, scripts/mpw_brand_assets_release_20261023.py, .github/workflows/mpw-brand-assets-release-20261023.yml]
permissions:
  contents: read
concurrency:
  group: mpw-brand-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile isolated installer and validate artwork
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_brand_assets_release_20261023.py
          python3 -m pip install -q "Pillow>=10,<13"
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("assets/mpw-brand-coin-icon-20261023.png").convert("RGBA")
          assert min(im.size)>=512 and max(im.size)<=2048
          assert im.getpixel((0,0))[3]<20 and im.getpixel((im.width//2,im.height//2))[3]>200
          print("MPW_BRAND_SOURCE=PASS",im.size)
          PY
  publish:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      contains(github.event.head_commit.message, '[approved-mpw-brand-20261023]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build optimized icon files
        run: |
          set -euo pipefail
          python3 -m pip install -q "Pillow>=10,<13"
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("assets/mpw-brand-coin-icon-20261023.png").convert("RGBA")
          out=Path("bundle");out.mkdir()
          def icon(size):return src.resize((size,size),Image.Resampling.LANCZOS)
          icon(384).save(out/"coin.png",optimize=True)
          large=icon(512)
          bg=Image.new("RGB",(512,512),"#080807")
          bg.paste(large,mask=large.getchannel("A"))
          bg.save(out/"header.jpg",quality=88,optimize=True,subsampling=0)
          icon(180).save(out/"apple-touch-icon.png",optimize=True)
          icon(192).save(out/"android-chrome-192x192.png",optimize=True)
          large.save(out/"android-chrome-512x512.png",optimize=True)
          icon(256).save(out/"favicon.ico",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          assert len(list(out.iterdir()))==6
          for p in out.iterdir():
              assert 1000<p.stat().st_size<900000,(p,p.stat().st_size)
          PY
      - name: Read-only production preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error
          found={}
          for path in ("/","/company/","/store/","/games/","/static/site/mojplaywin-header-emblem.jpg","/static/site/mojplaywin-coin-logo.420e0d1f954b.png"):
              try:
                  with urllib.request.urlopen("https://mojplaywin.com"+path,timeout=18) as r:
                      found[path]=(r.status,len(r.read(250000)))
              except urllib.error.HTTPError as error:
                  found[path]=(error.code,0)
              except Exception as error:
                  found[path]=(type(error).__name__,0)
              print("MPW_BRAND_PUBLIC_PRECHECK",path,found[path],flush=True)
          assert found["/"][0]==200, "Main site unavailable; refuse brand deployment"
          print("BRAND_MAIN_PRECHECK=PASS")
          PY
      - name: Set up pinned VPS to cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-brand-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read-only cPanel icon path inventory
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-brand-ssh"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel \
            'for p in /home/zomorod2/mojplaywin.com/static/site/mojplaywin-header-emblem.jpg /home/zomorod2/mojplaywin.com/static/site/mojplaywin-coin-logo.420e0d1f954b.png /home/zomorod2/Saeit-staging/core/static/site/mojplaywin-header-emblem.jpg /home/zomorod2/mojplaywin.com/.htaccess; do if test -f "$p"; then stat -c "ICON_SOURCE_PRESENT %n %s" "$p"; else echo "ICON_SOURCE_MISSING $p"; fi; done'
      - name: Transfer only brand bundle to site owner account
        id: stage
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-brand-ssh"
          stage="/home/zomorod2/.mpw-brand-stage-$GITHUB_RUN_ID"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          tar -czf "$RUNNER_TEMP/mpw-brand-release.tgz" scripts/mpw_brand_assets_release_20261023.py bundle
          timeout 70s ssh -T -F "$d/config" saeit-cpanel "tar -xzf - -C '$stage'" < "$RUNNER_TEMP/mpw-brand-release.tgz"
      - name: Install isolated brand assets atomically
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-brand-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            "python3 /home/zomorod2/.mpw-brand-stage-$GITHUB_RUN_ID/scripts/mpw_brand_assets_release_20261023.py install '$GITHUB_RUN_ID'"
      - name: Verify public file hashes and critical routes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          paths={"header.jpg":"/static/site/mojplaywin-header-emblem.jpg",
                 "coin.png":"/static/site/mojplaywin-coin-logo.420e0d1f954b.png",
                 "favicon.ico":"/favicon.ico",
                 "apple-touch-icon.png":"/apple-touch-icon.png",
                 "android-chrome-192x192.png":"/android-chrome-192x192.png",
                 "android-chrome-512x512.png":"/android-chrome-512x512.png"}
          for name,path in paths.items():
              expected=hashlib.sha256(open("bundle/"+name,"rb").read()).digest()
              for attempt in range(4):
                  try:
                      req=urllib.request.Request("https://mojplaywin.com"+path+"?v="+os.environ["GITHUB_RUN_ID"],headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          actual=hashlib.sha256(r.read(1000000)).digest()
                      if expected==actual:break
                  except Exception:pass
                  time.sleep(3)
              else:raise SystemExit("Public icon hash mismatch: "+path)
          for path in ("/","/company/","/store/","/games/"):
              with urllib.request.urlopen("https://mojplaywin.com"+path,timeout=20) as r:assert r.status==200
          print("MPW_BRAND_LIVE=VERIFIED")
          PY
      - name: Safe rollback after a failed public check
        if: failure() && steps.install.outcome == 'success'
        run: |
          d="$RUNNER_TEMP/mpw-brand-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            "python3 /home/zomorod2/.mpw-brand-stage-$GITHUB_RUN_ID/scripts/mpw_brand_assets_release_20261023.py rollback '$GITHUB_RUN_ID'"
