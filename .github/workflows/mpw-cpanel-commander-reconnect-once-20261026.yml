name: Restore already paired cPanel Remote Desktop Commander once
# One-time owner-authorized reconnection through the already pinned direct cPanel SSH route.
# Isolated branch: does not touch web, payment, database, cron, or VPS.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-cpanel-commander-direct-reconnect-20261101
  cancel-in-progress: false
jobs:
  reconnect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/ops/cpanel-commander-direct-reconnect-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reconnect paired cPanel device via pinned direct SSH (no VPS)
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$HOST_KEY" || { echo 'CPANEL_KEY_NOT_CONFIGURED'; exit 1; }
          d="$RUNNER_TEMP/mpw-cpanel-commander-direct-$GITHUB_RUN_ID"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/site.key" "$d/site.known"; rmdir -- "$d" 2>/dev/null || true' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/site.key"
          chmod 600 "$d/site.key"
          ssh-keygen -y -P '' -f "$d/site.key" >/dev/null
          ssh-keyscan -T 12 -p 1396 -t ed25519 178.239.147.125 > "$d/site.known" 2>/dev/null
          test -s "$d/site.known" || { echo 'CPANEL_PORT_UNREACHABLE'; exit 1; }
          fingerprint="$(ssh-keygen -lf "$d/site.known" -E sha256 | awk '{print $2}' | sort -u)"
          test "$fingerprint" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04' || { echo 'CPANEL_HOST_KEY_PIN_MISMATCH'; exit 1; }
          timeout 100s ssh -T -F /dev/null \
            -i "$d/site.key" \
            -o UserKnownHostsFile="$d/site.known" \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=12 \
            -o ConnectionAttempts=1 \
            -o ForwardAgent=no \
            -p 1396 zomorod2@178.239.147.125 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
          command -v node >/dev/null
          command -v npx >/dev/null
          echo 'MPW_REMOTE_NODE_RUNTIME=READY'
          if pgrep -u "$(id -un)" -f '[d]esktop-commander.*remote' >/dev/null 2>&1; then
            echo 'MPW_REMOTE_COMMANDER_ALREADY_RUNNING=true'
          else
            umask 077
            (nohup npx --yes @wonderwhy-er/desktop-commander@0.2.51 remote </dev/null >> "$HOME/desktop-commander.log" 2>&1 &)
            sleep 15
            echo 'MPW_REMOTE_COMMANDER_START_ATTEMPTED=true'
          fi
          if pgrep -u "$(id -un)" -f '[d]esktop-commander.*remote' >/dev/null 2>&1; then
            echo 'MPW_REMOTE_COMMANDER_PROCESS_PRESENT=true'
          else
            echo 'MPW_REMOTE_COMMANDER_PROCESS_PRESENT=false'
            exit 1
          fi
          REMOTE
          echo 'MPW_CPANEl_DIRECT_SSH_TASK=COMPLETED'
