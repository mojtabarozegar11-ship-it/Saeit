name: Restore already paired cPanel Remote Desktop Commander once
# Owner-requested continuation of private 72/225/879 visual QA.
# Does not access/change product files, web apps, prices, rights, or payments.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-cpanel-commander-reconnect-once-20261026.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-cpanel-commander-reconnect-once
  cancel-in-progress: false
jobs:
  reconnect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Establish pinned no-agent-forwarding GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          install -d -m 700 "$d"
          for variable in VPS_KEY HOST_KEY; do
            file="$d/$variable.key"
            printf '%s' "${!variable}" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$file"
            chmod 600 "$file"
            ssh-keygen -y -P '' -f "$file" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Reconnect existing paired device only (no site or cron changes)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          timeout 110s ssh -T -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
          command -v node >/dev/null
          command -v npx >/dev/null
          echo 'MPW_REMOTE_NODE_RUNTIME=READY'
          if pgrep -u "$(id -un)" -f '[d]esktop-commander.*remote' >/dev/null 2>&1; then
            echo 'MPW_REMOTE_COMMANDER_ALREADY_RUNNING=true'
          else
            umask 077
            (nohup npx --yes @wonderwhy-er/desktop-commander@0.2.51 remote </dev/null >> "$HOME/desktop-commander.log" 2>&1 &)
            sleep 15
            echo 'MPW_REMOTE_COMMANDER_START_ATTEMPTED=true'
          fi
          if pgrep -u "$(id -un)" -f '[d]esktop-commander.*remote' >/dev/null 2>&1; then
            echo 'MPW_REMOTE_COMMANDER_PROCESS_PRESENT=true'
          else
            echo 'MPW_REMOTE_COMMANDER_PROCESS_PRESENT=false'
            exit 1
          fi
          REMOTE
      - name: Classify agent readiness and remote reachability without exposing private log
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          timeout 45s ssh -T -F "$d/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path.home() / "desktop-commander.log"
          if not path.is_file():
              print("MPW_REMOTE_DIAGNOSTIC=" + json.dumps({"log_exists": False}))
          else:
              with path.open("rb") as stream:
                  size = path.stat().st_size
                  stream.seek(max(0, size - 131072))
                  log = stream.read().decode("utf-8", errors="replace").casefold()
              terms = {
                  "connected": "connected to remote mcp",
                  "session_restored": "session restored",
                  "channel_subscribed": "channel subscribed",
                  "device_ready": "device ready",
                  "marked_online": "device marked as online",
                  "auth_flow_required": "device code received",
                  "session_invalid": "persisted session invalid",
                  "fetch_failed": "fetch failed",
                  "startup_failed": "device startup failed",
              }
              print("MPW_REMOTE_DIAGNOSTIC=" + json.dumps({"log_exists": True, "log_bytes": size,
                  "markers": {key: value in log for key, value in terms.items()}}, sort_keys=True))
          PY
          python3 - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen("https://mcp.desktopcommander.app", timeout=9) as response:
                  print("MPW_REMOTE_ENDPOINT_HTTP=" + str(response.status))
          except Exception as exc:
              print("MPW_REMOTE_ENDPOINT_ERROR_TYPE=" + type(exc).__name__)
          PY
          REMOTE
      - name: Remove only this run's transient SSH identity
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/mpw-live-three-private-qa"; then
            rm -rf -- "$RUNNER_TEMP/mpw-live-three-private-qa"
          fi
