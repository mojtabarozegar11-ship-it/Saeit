name: MOJ7 read-only deploy Energy simulation (zero spend)
on:
  push:
    branches: [moj7-compile-20261104-only]
    paths:
      - .github/workflows/moj7-energy-readonly.yml
permissions:
  contents: read
  actions: read
jobs:
  estimate:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve actual compiled ABI and bytecode from successful prior run
        uses: actions/download-artifact@v4
        with:
          name: moj7-tron-compile-only
          run-id: 41865233491
          github-token: ${{ github.token }}
          path: build
      - name: Simulate deployment using TRON Mainnet read-only endpoint - NEVER SIGN OR BROADCAST
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p estimate
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request,urllib.error,time
          from datetime import datetime,timezone
          wallet="THFNU1iEXHd71WjEgjqUksd2UnMg2pUi73"
          alphabet="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          value=0
          for c in wallet:
              if c not in alphabet: raise SystemExit("INVALID_BASE58")
              value=value*58+alphabet.index(c)
          raw=value.to_bytes(25,"big")
          if raw[0]!=0x41 or hashlib.sha256(hashlib.sha256(raw[:21]).digest()).digest()[:4]!=raw[21:]:
              raise SystemExit("INVALID_TRON_ADDRESS_CHECKSUM")
          constructor_word=raw[1:].hex().rjust(64,"0")
          r=json.loads(pathlib.Path("build/report.json").read_text())
          if r["status"]!="COMPILE_SUCCESS" or r["source_sha256"]!="c94aa5fbbb2d738aab49c1fcd22b5e7aef42603048b316e2d5b7a544c505d53b":
              raise SystemExit("SOURCE_HASH_OR_COMPILE_NOT_VERIFIED")
          creation=pathlib.Path("build/MOJ7.bytecode.txt").read_text().strip()
          if hashlib.sha256(bytes.fromhex(creation)).hexdigest()!="05f09a4b9f2d173d439d78767f8f043404049a81b31761f990f5c53acbd6d792":
              raise SystemExit("BYTECODE_SHA256_MISMATCH")
          if len(creation)//2!=2085: raise SystemExit("BYTECODE_SIZE_MISMATCH")
          body={"owner_address":wallet,"data":creation+constructor_word,"visible":True}
          base="https://api.trongrid.io"
          def rpc(path,payload):
              data=json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,headers={"Content-Type":"application/json","User-Agent":"MOJ7-ReadOnly-Estimate"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      return {"http_status":resp.status,"body":json.loads(resp.read().decode())}
              except urllib.error.HTTPError as e:
                  return {"http_status":e.code,"error":e.read(800).decode(errors="replace")}
              except Exception as e:
                  return {"error":str(e)}
          simulation=rpc("/wallet/triggerconstantcontract",body)
          account=rpc("/wallet/getaccount",{"address":wallet,"visible":True})
          resource=rpc("/wallet/getaccountresource",{"address":wallet,"visible":True})
          params=rpc("/wallet/getchainparameters",{})
          sim=simulation.get("body",{})
          energy=sim.get("energy_used")
          if sim.get("result",{}).get("result") is not True or not isinstance(energy,int) or energy<=0:
              energy=None
          energy_price=None
          if isinstance(params.get("body"),dict):
              for x in params["body"].get("chainParameter",[]):
                  if x.get("key")=="getEnergyFee": energy_price=x.get("value")
          report={"checked_at_utc":datetime.now(timezone.utc).isoformat(),"network":"TRON Mainnet",
                  "mode":"simulation_readonly_no_signature_no_broadcast","owner_address":wallet,
                  "compiled_source_sha256":r["source_sha256"],"creation_bytecode_sha256":r["creation_bytecode_sha256"],
                  "constructor_holder_address":wallet,"constructor_parameter_32byte_hex":constructor_word,
                  "energy_used":energy,"energy_price_sun":energy_price,
                  "energy_only_estimated_trx":round(energy*energy_price/1e6,6) if energy is not None and isinstance(energy_price,int) else None,
                  "account_balance_trx":account.get("body",{}).get("balance",0)/1e6 if account.get("http_status")==200 else None,
                  "account_resource":resource.get("body"),
                  "simulation_response":simulation,"params_status":params.get("http_status"),
                  "account_status":account.get("http_status"),"resource_status":resource.get("http_status"),
                  "not_included":"Bandwidth, eventual chain state changes and signature fees, if any",
                  "deployment":False,"signature":False,"trx_spent":0}
          pathlib.Path("estimate/energy_readonly.json").write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print("MOJ7_READONLY_ESTIMATE_SUMMARY="+json.dumps({k:report[k] for k in
                ("network","energy_used","energy_price_sun","energy_only_estimated_trx","account_balance_trx","params_status","account_status","resource_status","deployment","signature","trx_spent")},separators=(",",":")))
          if energy is None:
              print("MOJ7_SIMULATION_UNAVAILABLE="+json.dumps(simulation)[:1300])
              raise SystemExit("NO_VALID_ENERGY_ESTIMATE; no action performed")
          PY
      - name: Upload read-only simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moj7-readonly-energy-report
          path: estimate/
          retention-days: 1
          if-no-files-found: warn
