name: Astra 0049 Nonempty VPS SQLite Copy Canary (Never In-place)

on:
  push:
    branches: [feature/astra-v2-0048-integration-canary-20261015]
    paths: [.github/workflows/astra-v2-0049-vps-copy-canary.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-0049-nonempty-copy-canary
  cancel-in-progress: false

jobs:
  isolated-copy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble Django pure-Python dependencies in isolated runner directory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-compile \
            --target "$RUNNER_TEMP/astra-0049-pydeps" \
            'Django>=5.2,<6' 'django-environ>=0.12,<1' \
            'djangorestframework>=3.16,<4' 'whitenoise>=6.9,<7'
      - name: Verify research-only schema defaults before contacting VPS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile core/migrations/0049_astra_private_research_intake.py
          python3 -m unittest discover -s tests -p test_astra_v2_stage45_probe.py -q
      - name: Verify pinned VPS and stage code in a new private operations directory
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          run_id="$GITHUB_RUN_ID"_"$GITHUB_RUN_ATTEMPT"
          temp="$RUNNER_TEMP/astra-0049-vps-copy"
          install -d -m 700 "$temp"
          trap 'rm -rf -- "$temp"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$temp/key"
          chmod 600 "$temp/key"
          ssh-keygen -y -P '' -f "$temp/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$temp/known" 2>/dev/null
          test "$(ssh-keygen -lf "$temp/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          SSH=(ssh -i "$temp/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 githubops@178.239.147.150)
          "${SSH[@]}" 'python3 -c "import sqlite3; print(sqlite3.sqlite_version)"'
          tar -cf - core config manage.py | "${SSH[@]}" \
            "set -euo pipefail; umask 077; stage=\$HOME/factory-runtime/operations/astra-v2-0049-copy-source-$run_id; test ! -e \"\$stage\"; mkdir -m 700 \"\$stage\"; tar -xf - -C \"\$stage\""
          tar -cf - -C "$RUNNER_TEMP/astra-0049-pydeps" . | "${SSH[@]}" \
            "set -euo pipefail; umask 077; stage=\$HOME/factory-runtime/operations/astra-v2-0049-copy-source-$run_id; test -d \"\$stage\"; mkdir -m 700 \"\$stage/_deps\"; tar -xf - -C \"\$stage/_deps\""
          "${SSH[@]}" 'bash -se' "$run_id" <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = githubops
          [[ "$1" =~ ^[0-9]+_[0-9]+$ ]]
          stage="$HOME/factory-runtime/operations/astra-v2-0049-copy-source-$1"
          original="$HOME/factory-runtime/private/factory-fresh-isolated.sqlite3"
          test -d "$stage" && test ! -L "$stage"
          test -f "$original" && test ! -L "$original"
          test -f "$stage/core/migrations/0049_astra_private_research_intake.py"
          test -f "$stage/manage.py"
          test -f "$stage/_deps/django/__init__.py"
          export PYTHONPATH="$stage/_deps:$stage"
          python3 -c 'import django,environ,rest_framework,whitenoise; print("ASTRA_VPS_ISOLATED_DJANGO_DEPENDENCIES=PASS")'
          scratch="$(mktemp -d "$HOME/factory-runtime/private/.astra-0049-copy-XXXXXXXX")"
          chmod 700 "$scratch"
          cleanup() {
            case "$scratch" in
              "$HOME"/factory-runtime/private/.astra-0049-copy-*)
                rm -rf -- "$scratch" ;;
              *) echo ASTRA_COPY_CANARY_CLEANUP_GUARD_FAILED >&2; exit 3 ;;
            esac
          }
          trap cleanup EXIT
          python3 - "$original" "$scratch" <<'PY'
          import os,pathlib,shutil,sqlite3,sys
          original=pathlib.Path(sys.argv[1])
          scratch=pathlib.Path(sys.argv[2])
          available=shutil.disk_usage(scratch).free
          needed=original.stat().st_size*2+512*1024*1024
          assert original.stat().st_size<=256*1024*1024,"factory DB exceeds bounded canary"
          assert available>=needed,"insufficient disk safety reserve for private clone"
          db=scratch/"factory-0048-copy.sqlite3"
          uri=original.resolve().as_uri()+"?mode=ro"
          with sqlite3.connect(uri,uri=True,timeout=10) as src:
              src.execute("PRAGMA query_only=ON")
              with sqlite3.connect(str(db),timeout=10) as dest:
                  src.backup(dest,pages=64,sleep=.1)
          os.chmod(db,0o600)
          with sqlite3.connect(str(db)) as c:
              row=c.execute("SELECT name FROM django_migrations WHERE app='core' ORDER BY name DESC LIMIT 1").fetchone()
              assert row==("0048_business_market_architecture",),row
              assert c.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='core_factoryqueueitem'").fetchone()[0]==0
              counts={name:c.execute("SELECT COUNT(*) FROM "+name).fetchone()[0] for name in ("core_product","core_researchsource","core_evidence","core_factoryrun")}
          (scratch/"baseline-counts.json").write_text(__import__("json").dumps(counts))
          os.chmod(scratch/"baseline-counts.json",0o600)
          print("ASTRA_0049_NONEMPTY_PRIVATE_SNAPSHOT=CREATED_ON_VPS_ONLY")
          print("ASTRA_0049_SOURCE_LIVE_DATABASE_OPENED_READ_ONLY=true")
          print("ASTRA_0049_COPIED_FACTORY_PRODUCTS="+str(counts["core_product"]))
          PY
          export SAEIT_ENV=ci
          export SECRET_KEY=astra-vps-disposable-copy-rehearsal-only
          export DEBUG=False
          export ALLOWED_HOSTS=localhost,127.0.0.1
          export DATABASE_URL="sqlite:///$scratch/factory-0048-copy.sqlite3"
          cd "$stage"
          python3 manage.py migrate core 0049 --noinput --skip-checks --verbosity 0
          python3 - "$scratch" <<'PY'
          import json,pathlib,sqlite3,sys
          p=pathlib.Path(sys.argv[1])
          counts=json.loads((p/"baseline-counts.json").read_text())
          with sqlite3.connect(str(p/"factory-0048-copy.sqlite3")) as c:
              current={n:c.execute("SELECT COUNT(*) FROM "+n).fetchone()[0] for n in counts}
              assert current==counts,(current,counts)
              present={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {"core_factoryqueueitem","core_discoverysnapshot"}.issubset(present)
              for t in ("core_factoryqueueitem","core_discoverysnapshot"):
                  assert c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]==0
          print("ASTRA_0049_NONEMPTY_COPY_ORIGINAL_COUNTS_PRESERVED=true")
          print("ASTRA_0049_NEW_RESEARCH_TABLES=PASS")
          PY
          python3 manage.py migrate core 0048 --noinput --skip-checks --verbosity 0
          python3 - "$scratch" <<'PY'
          import pathlib,sqlite3,sys,json
          p=pathlib.Path(sys.argv[1])
          counts=json.loads((p/"baseline-counts.json").read_text())
          with sqlite3.connect(str(p/"factory-0048-copy.sqlite3")) as c:
              assert {n:c.execute("SELECT COUNT(*) FROM "+n).fetchone()[0] for n in counts}==counts
              names={x[0] for x in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert "core_factoryqueueitem" not in names and "core_discoverysnapshot" not in names
          print("ASTRA_0049_NONEMPTY_COPY_ROLLBACK_TO_0048=PASS")
          PY
          python3 manage.py migrate core 0049 --noinput --skip-checks --verbosity 0
          echo ASTRA_0049_NONEMPTY_COPY_REAPPLY=PASS
          echo ASTRA_0049_NEW_COMMERCIAL_PRODUCTS=0
          echo ASTRA_0049_ORIGINAL_FACTORY_MIGRATION_UNCHANGED=true
          echo ASTRA_0049_ORIGINAL_CRON_SITES_PAYMENTS_UNCHANGED=true
          echo ASTRA_0049_SENSITIVE_COPY_REMOVED_ON_EXIT=true
          REMOTE
