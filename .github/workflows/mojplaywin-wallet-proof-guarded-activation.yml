name: MojPlayWin protected merchant wallet proof page guarded activation
on:
  push:
    branches: [release/mojplaywin-chess-product-20261014]
    paths: ['.github/workflows/mojplaywin-wallet-proof-guarded-activation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Full MySQL backup then activate only private owner wallet page
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-proof-preflight"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
            p=Path(filename)
            p.write_text(p.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          python3 -m py_compile scripts/mpw_activate_wallet_proof.py
          tar -czf "$RUNNER_TEMP/mpw-wallet-proof-candidate.tar.gz" \
              mpw_native_checkout \
              scripts/mpw_activate_wallet_proof.py \
              scripts/mojplaywin_native_chain_verify.py \
              scripts/mojplaywin_purchase_events.py
          sha_local="$(sha256sum "$RUNNER_TEMP/mpw-wallet-proof-candidate.tar.gz" | cut -d' ' -f1)"
          timeout 60s ssh -F "$d/config" host \
            'set -e; umask 077; mkdir -p "$HOME/.mpw-proof-drop"; cat > "$HOME/.mpw-proof-drop/new-source.tar.gz"' \
            < "$RUNNER_TEMP/mpw-wallet-proof-candidate.tar.gz"
          sha_remote="$(timeout 35s ssh -F "$d/config" host 'sha256sum "$HOME/.mpw-proof-drop/new-source.tar.gz"' | cut -d' ' -f1)"
          test "$sha_local" = "$sha_remote"
          status_before="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://mojplaywin.com/ || true)"
          timeout 245s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          umask 077
          archive="$HOME/.mpw-proof-drop/new-source.tar.gz"
          source="$HOME/.mpw-proof-drop/source"
          if test -e "$source"; then
             mv "$source" "$HOME/.mpw-proof-drop/previous-source-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          mkdir -p "$source"
          tar -xzf "$archive" -C "$source"
          rm -f "$archive"
          python3 -m py_compile "$source/scripts/mpw_activate_wallet_proof.py"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" "$source/scripts/mpw_activate_wallet_proof.py" --activate
          echo MPW_OWNER_WALLET_PAGE_ENABLED_WITH_MYSQL_BACKUP
          echo MPW_CHECKOUT_AND_FACTORY_UNCHANGED
          REMOTE
          result="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://mojplaywin.com/merchant/wallet-proof/ || true)"
          status_after="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://mojplaywin.com/ || true)"
          echo "MPW_ANONYMOUS_PROOF_HTTP_STATUS=$result"
          echo "MPW_HOMEPAGE_STATUS_BEFORE=$status_before AFTER=$status_after"
          if test "$result" != "302" || test "$status_before" != "$status_after"; then
             echo "MPW_SMOKE_FAILED_ROLLING_BACK_CONFIG"
             timeout 75s ssh -F "$d/config" host \
               'python3 "$HOME/.mpw-proof-drop/source/scripts/mpw_activate_wallet_proof.py" --rollback' || true
             exit 1
          fi
          echo MPW_PRIVATE_ADMIN_PROOF_URL_SMOKE_OK
          echo MPW_PAYMENTS_STILL_DISABLED
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-proof-preflight"
# Retry the isolated owner proof page after safe diagnostics; checkout stays disabled.
# Safe render diagnostic rerun; payment endpoints remain disabled.
# Safe render retry after confirmed MojPlayWin host allowlist.
