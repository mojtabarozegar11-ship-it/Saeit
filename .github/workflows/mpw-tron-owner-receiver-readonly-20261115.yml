name: TRON owner receiver — safe live cPanel read-only evidence

on:
  pull_request:
    paths:
      - ".github/workflows/mpw-tron-owner-receiver-readonly-20261115.yml"
      - "scripts/mpw_tron_owner_wallet_live_readonly_20261115.py"
      - "tests/test_mpw_tron_owner_wallet_live_readonly_20261115.py"
      - "tests/test_mpw_tron_owner_factory_readonly_workflow_c89.py"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: mpw-owner-trx-receiver-readonly
  cancel-in-progress: false

jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify receiver never edits funds, host, database or customer data
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_mpw_tron_owner_wallet_live_readonly_20261115 tests.test_mpw_tron_owner_factory_readonly_workflow_c89 -v
          python3 -B -m py_compile scripts/mpw_tron_owner_wallet_live_readonly_20261115.py
          ! grep -Eq 'objects\.(create|update|delete)|\.save\(|\.delete\(|requests\.post|urlopen|subprocess\.run|private_key|mnemonic|seed_phrase|broadcasttransaction' scripts/mpw_tron_owner_wallet_live_readonly_20261115.py

  inspect-receiver:
    # A GitHub-hosted VPS relay repeatedly timed out; trusted factory runner
    # was already verified for direct, host-key-pinned read-only cPanel access.
    # NO PUSH, SCHEDULE, MERGE OR PR CAN INVOKE THIS HOST JOB.
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.event.issue.number == 1600 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'MPW-TRON-OWNER-CURRENT-READONLY-20261115'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed immutable probe source and local regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object -- scripts/mpw_tron_owner_wallet_live_readonly_20261115.py)" = "b194580753fbf18994ea8752e3cd39a3a25b2e57"
          python3 -B -m unittest tests.test_mpw_tron_owner_wallet_live_readonly_20261115 tests.test_mpw_tron_owner_factory_readonly_workflow_c89 -q
      - name: Inspect effective current MojPlayWin TRON receiver from trusted cPanel account
        shell: bash
        env:
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          work="$RUNNER_TEMP/mpw-tron-owner-cpanel-only"
          install -d -m 700 "$work"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n"; sys.stdout.write(s)' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P "" -f "$work/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$work/known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$work/config" <<EOF
          Host owner-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $work/host.key
            UserKnownHostsFile $work/known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          timeout 105s ssh -T -F "$work/config" owner-cpanel \
            'test "$(id -un)" = "zomorod2" && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && exec /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -' \
            < scripts/mpw_tron_owner_wallet_live_readonly_20261115.py \
            | python3 -c 'import json,sys; raw=sys.stdin.read(8192); xs=[l for l in raw.splitlines() if l.startswith("MPW_TRON_OWNER_WALLET_LIVE_READONLY=")]; assert len(xs)==1,"missing sanitized live report"; d=json.loads(xs[0].split("=",1)[1]); assert d["schema"]=="mpw.tron.receiver.live.readonly.v1" and d["read_only"] is True and d["live_sale_verified"] is False and d["payment_finality_checked"] is False and d["customer_delivery_checked"] is False; print(json.dumps(d,sort_keys=True))'
          echo "TRON_RECEIVER_RUNTIME_INSPECTED=true; INVOICES_AND_PAYMENTS_UNTOUCHED=true"
