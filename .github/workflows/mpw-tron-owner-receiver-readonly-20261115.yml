name: TRON owner receiver — safe live cPanel read-only evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-tron-owner-receiver-readonly-20261115.yml"
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: mpw-owner-trx-receiver-readonly
  cancel-in-progress: false

jobs:
  inspect-receiver:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify this job never modifies funds, server files or customer data
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_tron_owner_wallet_live_readonly_20261115.py
          python3 -B -m unittest tests.test_mpw_tron_owner_wallet_live_readonly_20261115 -q
          ! grep -Eq 'objects\.(create|update|delete)|\.save\(|\.delete\(|requests\.post|urlopen|subprocess\.run|secret_key|private_key|mnemonic|seed_phrase|broadcasttransaction' scripts/mpw_tron_owner_wallet_live_readonly_20261115.py
      - name: Authenticate existing pinned VPS-to-cPanel read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-tron-owner-readonly"
          install -d -m 700 "$d"
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Compare effective host TRX recipient with QR approval — READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-tron-owner-readonly/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" \
            < scripts/mpw_tron_owner_wallet_live_readonly_20261115.py
          echo 'OWNER_TRON_RUNTIME_PROBE=COMPLETED_READ_ONLY'
          echo 'A completed inspection is NOT evidence of a matching live receiver or paid sales.' >> "$GITHUB_STEP_SUMMARY"
      - name: Erase temporary SSH credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mpw-tron-owner-readonly"
