name: MojPlayWin qualified commercial enquiries automatic acknowledgement
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/mpw_support_qualified_lead_responder_20261026.py
      - tests/test_mpw_support_qualified_lead_responder_20261026.py
      - .github/workflows/mpw-qualified-lead-replies-20261026.yml
  push:
    branches: [main]
    paths:
      - scripts/mpw_support_qualified_lead_responder_20261026.py
      - tests/test_mpw_support_qualified_lead_responder_20261026.py
      - .github/workflows/mpw-qualified-lead-replies-20261026.yml
  workflow_dispatch:
  schedule:
    - cron: '26 * * * *'
permissions: {contents: read}
concurrency:
  group: mpw-support-commercial-qualified-reply
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify qualified lead rules and duplicate-send guards
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_mpw_support_qualified_lead_responder_20261026 -v
          python3 - <<'PY'
          import ast,pathlib
          s=pathlib.Path("scripts/mpw_support_qualified_lead_responder_20261026.py").read_text()
          ast.parse(s)
          assert "MAX_PER_RUN = 3" in s and "MAX_PER_DAY = 8" in s
          assert "reserved_before_send" in s
          assert "Auto-Submitted" in s
          assert "MPW_QUALIFIED_LEAD_ACK=" in s
          print("MPW_QUALIFIED_LEAD_CONTRACT=PASS")
          PY
  live_qualified_replies:
    needs: contracts
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish existing pinned VPS cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-qualified-leads-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Reply only to genuine-format incoming commercial requests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-qualified-leads-ssh"
          timeout 115s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B -" < scripts/mpw_support_qualified_lead_responder_20261026.py
          echo MPW_QUALIFIED_SUPPORT_WORKER_EXECUTION=PASS
      - name: Dispose of transient relay credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mpw-qualified-leads-ssh"
