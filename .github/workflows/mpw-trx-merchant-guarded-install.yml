name: MojPlayWin gated TRX app install with rollback
on:
  push:
    branches: [fix/mpw-tron-provider-auth-20261022]
    paths:
      - .github/workflows/mpw-trx-merchant-guarded-install.yml
      - scripts/mpw_trx_install_canary_gated_20261023.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  install-gated-trx:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify code and release gate tests before touching cPanel
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_trx_install_canary_gated_20261023.py services/mpw_trx_walletless_core.py services/mpw_tron_independent_solidified_rpc.py services/mpw_tron_readonly_deposit_candidates.py services/mpw_trx_walletless_checkout_ui.py services/mpw_trx_walletless_one_tap_ui.py services/mpw_walletless_django_test_bridge.py services/mpw_walletless_commercial_intent.py services/mpw_trx_commercial_chain.py services/mpw_trx_reconcile_cursor.py services/mpw_trx_commercial_web.py scripts/mpw_tron_public_dual_probe_readonly_20261023.py scripts/mpw_trx_commercial_reconcile_cron.py
          python3 -B -m unittest tests.test_mpw_trx_commercial_gateway tests.test_mpw_tron_readonly_deposit_candidates -q
          python3 -B -m py_compile scripts/mpw_trx_install_gated_checkout_button.py services/mpw_trx_commercial_context.py
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 3\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 50s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Deploy tested customer download survival on TRX acceptance pause
        run: |
          set -euo pipefail
          remote="$(timeout 40s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel 'mktemp -d /home/zomorod2/.local/share/mpw-trx-deploy-XXXXXXXX')"
          case "$remote" in /home/zomorod2/.local/share/mpw-trx-deploy-*) ;; *) exit 5;; esac
          trap 'ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel "rm -rf -- $remote" >/dev/null 2>&1 || true' EXIT
          tar -cf - services/mpw_trx_walletless_core.py services/mpw_tron_independent_solidified_rpc.py services/mpw_tron_readonly_deposit_candidates.py services/mpw_trx_walletless_checkout_ui.py services/mpw_trx_walletless_one_tap_ui.py services/mpw_walletless_django_test_bridge.py services/mpw_walletless_commercial_intent.py services/mpw_trx_commercial_chain.py services/mpw_trx_reconcile_cursor.py services/mpw_trx_commercial_web.py scripts/mpw_tron_public_dual_probe_readonly_20261023.py scripts/mpw_trx_commercial_reconcile_cron.py | timeout 65s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel "umask 077; tar -xf - -C $remote --no-same-owner --no-same-permissions"
          timeout 135s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - $remote" < scripts/mpw_trx_install_canary_gated_20261023.py
      - name: Add hidden-until-approved TRX purchase control to the verified real product template
        run: |
          set -euo pipefail
          remote="$(timeout 40s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel 'mktemp -d /home/zomorod2/.local/share/mpw-trx-button-XXXXXXXX')"
          case "$remote" in /home/zomorod2/.local/share/mpw-trx-button-*) ;; *) exit 5;; esac
          tar -cf - services/mpw_trx_commercial_context.py | timeout 55s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel "umask 077; tar -xf - -C $remote --no-same-owner --no-same-permissions"
          timeout 130s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - $remote/services/mpw_trx_commercial_context.py" < scripts/mpw_trx_install_gated_checkout_button.py
          ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel "rm -rf -- $remote"
      - name: Cleanup relay key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-gateway-contract-ssh"
