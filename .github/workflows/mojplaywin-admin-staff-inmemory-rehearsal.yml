name: MojPlayWin in-memory admin alias namespace isolation test
on:
  push:
    branches: [audit/mpw-live-staff-url-20261014]
    paths:
      - .github/workflows/mojplaywin-admin-staff-inmemory-rehearsal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rehearse unique namespace for staff alias without unavailable command center
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 125s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          export PYTHONDONTWRITEBYTECODE=1
          export DJANGO_SETTINGS_MODULE=config.settings
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import sys
          import types
          import importlib.util
          import django
          django.setup()
          from django.contrib import admin
          from django.core.checks import run_checks, Tags
          from django.test.utils import override_settings
          from django.urls import path, include, get_resolver, reverse, resolve, URLResolver, clear_url_caches
          import config.urls as live
          baseline = tuple(live.urlpatterns)
          staff = [p for p in baseline if str(p.pattern)=='staff/']
          admins = [p for p in baseline if str(p.pattern)=='admin/']
          assert len(staff)==len(admins)==1
          assert isinstance(staff[0],URLResolver) and staff[0].namespace=='admin'
          assert admins[0].namespace=='admin'
          print("MPW_LIVE_COMMAND_CENTER_PACKAGE_AVAILABLE="+str(importlib.util.find_spec("command_center") is not None))
          candidate = [
              path("staff/",include((admin.site.get_urls(),"admin"),namespace="staff_admin"))
              if item is staff[0] else item for item in baseline
          ]
          assert len(candidate)==len(baseline)
          synthetic=types.ModuleType("mpw_admin_staff_namespaces_qa_only")
          synthetic.urlpatterns=candidate
          sys.modules[synthetic.__name__]=synthetic
          try:
              with override_settings(ROOT_URLCONF=synthetic.__name__):
                  clear_url_caches()
                  messages=run_checks(tags=[Tags.urls])
                  print("MPW_INMEMORY_URL_WARNINGS",",".join(m.id for m in messages) or "none")
                  assert not any(m.id=="urls.W005" for m in messages), "Duplicate admin warning persists"
                  routes={
                      "/admin/":"admin:index",
                      "/admin/login/":"admin:login",
                      "/staff/":"staff_admin:index",
                      "/staff/login/":"staff_admin:login",
                  }
                  for route,view in routes.items():
                      assert resolve(route).view_name == view
                      print("MPW_INMEMORY_ROUTE_OK",route)
                  assert reverse("admin:index")=="/admin/"
                  assert reverse("admin:login")=="/admin/login/"
                  assert reverse("staff_admin:index")=="/staff/"
                  assert reverse("staff_admin:login")=="/staff/login/"
                  assert get_resolver().namespace_dict.get("admin")
                  assert get_resolver().namespace_dict.get("staff_admin")
                  print("MPW_INMEMORY_ADMIN_STAFF_COLLISION_FIXED=True")
                  print("MPW_INMEMORY_ALL_EXISTING_ADMIN_ROUTES_PRESERVED=True")
          finally:
              sys.modules.pop(synthetic.__name__,None)
              clear_url_caches()
          print("MPW_LIVE_URLS_FILE_UNCHANGED=True")
          print("MPW_LIVE_DATABASE_UNTOUCHED=True")
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
