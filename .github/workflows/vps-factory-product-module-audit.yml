name: Factory Product Runtime Dependency Audit
on:
  push:
    branches: [fix/factory-vps-quality-module-deploy-20261015]
    paths:
      - .github/workflows/vps-factory-product-module-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-product-runtime-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate dependency inspector locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import ast; ast.parse(open("ops/factory-audit/diagnose_product_runtime_dependencies.py",encoding="utf-8").read())'
      - name: Run read-only VPS dependency audit
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/saeit-product-audit"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 \
            githubops@178.239.147.150 python3 - < ops/factory-audit/diagnose_product_runtime_dependencies.py
