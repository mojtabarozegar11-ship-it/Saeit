name: MojPlayWin owner-approved one-time encrypted primary backup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-encrypted-backup-once-20261017.yml"
      - "scripts/mojplaywin_backup_stream_cpanel.py"
      - "scripts/mojplaywin_backup_encrypt_vps.py"
      - "tests/test_mojplaywin_backup_stream_and_encryption.py"
permissions:
  contents: read
concurrency:
  group: mojplaywin-owner-approved-one-time-encrypted-backup-20261017
  cancel-in-progress: false
jobs:
  authorized-backup-primary-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, '[approved-backup-once-20261017]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test authenticated encryption and fail-closed source in synthetic data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'cryptography>=41,<47'
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_stream_and_encryption.py'
          python3 -m py_compile scripts/mojplaywin_backup_encrypt_vps.py scripts/mojplaywin_backup_stream_cpanel.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Transfer one-time MySQL then application roots directly to encrypted VPS archive
        shell: bash
        timeout-minutes: 39
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/mojplaywin_backup_stream_cpanel.py)"
          dst64="$(base64 -w0 scripts/mojplaywin_backup_encrypt_vps.py)"
          python_call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          errors=0
          for kind in mysql files; do
            echo "Starting pinned-SSH stream for $kind; raw data and keys are never logged"
            if (timeout 1120s ssh -T -F "$d/config" saeit-cpanel "python3 -c '$python_call' '$src64' '$kind'" |
                timeout 1120s ssh -T -F "$d/config" saeit-vps "python3 -c '$python_call' '$dst64' '$kind'"); then
              echo "$kind: transfer finished and AES-GCM authentication checked on destination"
            else
              echo "$kind: NO VERIFIED BACKUP (source failure/transport/capacity/integrity)"
              errors=$((errors+1))
            fi
          done
          test "$errors" -eq 0
