name: Mojtaba canonical name variants and scholarly author SEO
on:
  pull_request:
    paths:
      - scripts/mojtaba_identity_seo_20261027.py
      - tests/test_mojtaba_identity_seo_20261027.py
      - .github/workflows/mojtaba-identity-seo-20261027.yml
  push:
    branches: [main]
    paths:
      - scripts/mojtaba_identity_seo_20261027.py
      - tests/test_mojtaba_identity_seo_20261027.py
      - .github/workflows/mojtaba-identity-seo-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojtaba-v17-inner-pages-production
  cancel-in-progress: false
jobs:
  tests:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify one Person, all spellings, academic authorship and protected scope
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_identity_seo_20261027.py
          python3 -m unittest discover -s tests -p 'test_mojtaba_identity_seo_20261027.py' -v
  publish:
    needs: tests
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish pinned GitHub to VPS to cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-official-hub-ssh"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "HUB_SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Guarded semantic SEO deployment, Django and live public verification
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mojtaba-identity-seo-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$HUB_SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 60s scp -q -F "$HUB_SSH_CONFIG" scripts/mojtaba_identity_seo_20261027.py "saeit-host:$stage/"
          timeout 1100s ssh -T -F "$HUB_SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          umask 077
          id="$1"
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          py="/home/zomorod2/mojtaba_personal/.venv_personal_test/bin/python"
          stage="/home/zomorod2/.mojtaba-identity-seo-$id"
          script="$stage/mojtaba_identity_seo_20261027.py"
          backup="/home/zomorod2/.backups/mojtaba-person-identity-seo-20261027/$id"
          installed=0
          verified=0
          finish() {
            status=$?
            trap - EXIT
            if test "$installed" = 1 && test "$verified" = 0 && test -f "$backup/manifest.json"; then
              "$py" "$script" rollback --run-id "$id" && echo "IDENTITY_SEO_ROLLBACK=VERIFIED" || echo "IDENTITY_SEO_ROLLBACK_REQUIRES_REVIEW=YES"
              test ! -d "$app/tmp" || touch "$app/tmp/restart.txt"
            fi
            if test -d "$stage" && test ! -L "$stage"; then
              rm -f -- "$stage/mojtaba_identity_seo_20261027.py"
              rmdir -- "$stage" || true
            fi
            exit "$status"
          }
          trap finish EXIT
          test -f "$app/manage.py" && test ! -L "$app" && test -x "$py"
          "$py" "$script" check
          installed=1
          "$py" "$script" install --run-id "$id"
          cd "$app"
          "$py" manage.py check
          "$py" - <<'PYDJANGO'
          import os,json,re
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.test import Client
          c=Client(HTTP_HOST='mojplaywin.com')
          required=('مجتبی روزگار','روزگار','Mojtaba Roozegar','Roozegar','Mojtaba Rozegar','Rozegar','Mojtaba Rouzegar','Rouzegar')
          for route in ('','about/','contact/','resume/','gallery/','blog/'):
              response=c.get('/mojtaba.roozegar/'+route,secure=True)
              if response.status_code!=200:raise RuntimeError('PERSONAL_ROUTE_BAD '+route)
              html=response.content.decode('utf8','replace')
              m=re.findall(r'<script type="application/ld\+json">(.*?)</script>',html,re.S)
              if len(m)!=1:raise RuntimeError('SCHEMA_COUNT_BAD '+route)
              node=json.loads(m[0])
              person=node['mainEntity']
              aliases=person['alternateName']
              if not all(x in aliases for x in required):raise RuntimeError('ALIAS_MISSING '+route)
              if len(aliases)!=len(set(aliases)):raise RuntimeError('ALIAS_DUPLICATION '+route)
              if 'Author' not in person['jobTitle']:raise RuntimeError('SCHOLARLY_AUTHOR_MISSING '+route)
              if person['alumniOf']['name']!='Universiti Putra Malaysia (UPM)':raise RuntimeError('UNIVERSITY_REGRESSION')
              if route=='':
                  if 'scientific author' not in html or 'مجتبی روزگار' not in html:raise RuntimeError('HOME_COPY_REGRESSION')
              if route=='about/':
                  if 'Mojtaba Rouzegar' not in html or 'several scientific articles' not in html:raise RuntimeError('ABOUT_AUTHOR_COPY_REGRESSION')
                  if 'Vancouver, British Columbia, Canada' not in html:raise RuntimeError('RESIDENCE_REGRESSION')
                  if 'lecturer' in html.lower():raise RuntimeError('UNVERIFIED_LECTURER')
              if route=='contact/' and 'name="csrfmiddlewaretoken"' not in html:raise RuntimeError('CONTACT_FORM_REGRESSION')
              if route=='resume/' and ('id="mr-scholar-title"' not in html or 'No independently verified peer-reviewed' not in html):raise RuntimeError('SCHOLARLY_CV_REGRESSION')
              if route=='gallery/' and 'owner_gallery_20261015/photo-01.' not in html:raise RuntimeError('GALLERY_CHANGED')
              if route=='blog/' and 'id="mpw-journal-longform-index-20261016"' not in html:raise RuntimeError('RESEARCH_INDEX_CHANGED')
              print('IDENTITY_DJANGO_ROUTE_200='+route,flush=True)
          PYDJANGO
          test ! -d "$app/tmp" || touch "$app/tmp/restart.txt"
          "$py" - <<'PYHTTP'
          import time
          from urllib.request import Request,urlopen
          base='https://mojplaywin.com/mojtaba.roozegar/'
          import json,re
          for route in ('','about/'):
              for attempt in range(8):
                  try:
                      url=base+route+'?_identity='+str(time.time_ns())
                      with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
                          html=r.read(1000000).decode('utf8','replace')
                          if r.status!=200:raise RuntimeError('PERSONAL_HTTP_NOT_200')
                      structured=re.findall(r'<script type="application/ld\+json">(.*?)</script>',html,re.S)
                      if len(structured)!=1:raise RuntimeError('PUBLIC_SCHEMA_DUPLICATE')
                      node=json.loads(structured[0]);p=node['mainEntity'];aliases=p['alternateName']
                      for name in ('مجتبی روزگار','روزگار','Mojtaba Roozegar','Roozegar','Mojtaba Rozegar','Rozegar','Mojtaba Rouzegar','Rouzegar'):
                          if name not in aliases:raise RuntimeError('PUBLIC_NAME_MISSING '+name)
                      if 'Author' not in p['jobTitle']:raise RuntimeError('PUBLIC_AUTHOR_MISSING')
                      if route=='about/' and 'several scientific articles' not in html:raise RuntimeError('PUBLIC_RESEARCH_MISSING')
                      if route=='' and 'scientific author' not in html:raise RuntimeError('PUBLIC_HOMEPAGE_MISSING')
                      print('PUBLIC_IDENTITY_SEO_VERIFIED='+route,flush=True)
                      break
                  except Exception as exc:
                      if attempt==7:raise
                      print('HTTP_REFRESH_RETRY='+repr(exc),flush=True)
                      time.sleep(4)
          for url in (base+'resume/',base+'gallery/',base+'blog/','https://mojplaywin.com/','https://zomorodmelal.ir/'):
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
                  if r.status!=200:raise RuntimeError('PROTECTED_HTTP_BAD '+url)
              print('AFTER_200='+url,flush=True)
          PYHTTP
          verified=1
          echo "MOJTABA_IDENTITY_SEO_RELEASE=VERIFIED"
          echo "MOJTABA_IDENTITY_SEO_BACKUP=$backup"
          REMOTE
      - name: Remove ephemeral relay credentials
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-official-hub-ssh"
          test ! -d "$d" || rm -rf -- "$d"
