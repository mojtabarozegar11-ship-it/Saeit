name: Retire MojPlayWin trial publication without deleting orders
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-retire-trial-publication-preserve-orders-20261107.yml"]
permissions: {contents: read}
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Establish relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; umask 077; d="$RUNNER_TEMP/r"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/v"; printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/h"; chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/v" >/dev/null; ssh-keygen -y -P "" -f "$d/h" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vk" 2>/dev/null; test "$(ssh-keygen -lf "$d/vk" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/c" <<EOF
          Host v
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/v
            UserKnownHostsFile $d/vk
          Host h
            HostName zohal.pws-dns.net
            User zomorod2
            Port 22
            IdentityFile $d/h
            UserKnownHostsFile $d/hk
            ProxyJump v
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            RequestTTY no
          EOF
          sed -i 's/Port 22/Port 1396/' "$d/c"
          timeout 30s ssh -F "$d/c" v 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/hc" 2>/dev/null; test "$(ssh-keygen -lf "$d/hc" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; mv "$d/hc" "$d/hk"
      - name: Unpublish only trial article and preserve all order data
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/r/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging'); P=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          if A.is_symlink() or P.is_symlink() or not P.is_file() or "APP='/home/zomorod2/Saeit-staging'" not in P.read_text(errors='replace'): raise RuntimeError('UNTRUSTED_ROOT')
          os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,OrderItem
          p=Product.objects.select_related('knowledge_article').get(pk=779)
          if not isinstance(p.metadata,dict) or p.metadata.get('mpw_micro_trial')!='mpw-native-trx-micro-trial-20261020-v1': raise RuntimeError('SKU_MARKER_MISMATCH')
          n=OrderItem.objects.filter(product_id=779).count()
          p.knowledge_article.published=False; p.knowledge_article.save(update_fields=['published'])
          for folder in (A/'tmp',P.parent/'tmp'):
              folder.mkdir(mode=0o700,exist_ok=True); flag=folder/'restart.txt'; fd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600);os.close(fd);os.utime(flag,None)
          print('MPW_TRIAL_PUBLICATION_RETIRED='+json.dumps({'product_active':p.active,'article_published':p.knowledge_article.published,'orders_preserved':n,'database_rows_deleted':0}))
          if not p.active or n<1: raise RuntimeError('PRESERVATION_FAILED')
          PY
      - name: Verify live public catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request('https://mojplaywin.com/commerce/trx-easy/?after=0',headers={'Cache-Control':'no-cache, no-store, max-age=0','User-Agent':'MPW-Retire-Publication-779/1'})
          with urllib.request.urlopen(req,timeout=25) as r: body=r.read(240000).decode('utf-8','replace')
          if 'MojPlayWin Secure TRX Purchase' in body or '/commerce/book/779/' in body: raise RuntimeError('TRIAL_STILL_PUBLIC')
          for path in ('/store/','/store/product/72/','/store/product/225/','/store/product/879/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Retire-Publication-779/1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status!=200: raise RuntimeError(path+' HTTP '+str(r.status))
          print('MPW_PUBLIC_CATALOG=PASS');print('MPW_ORIGINAL_PRODUCTS=HEALTHY')
          PY
      - name: Clean relay
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/r"
