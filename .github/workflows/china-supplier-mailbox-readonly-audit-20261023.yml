name: Read-only supplier reply and forwarding audit
run-name: Company mailbox read-only audit - 24 Oct 2026
on:
  push:
    branches: ['ops/china-import-500-final136-20261023']
    paths: ['.github/workflows/china-supplier-mailbox-readonly-audit-20261023.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned read-only SSH bridge to cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/company-mail-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/vps.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          {
            echo 'Host bridge'; echo '  HostName 178.239.147.150'; echo '  User githubops'; echo "  IdentityFile $d/vps.key"; echo "  UserKnownHostsFile $d/vps.known";
            echo 'Host company'; echo '  HostName zohal.pws-dns.net'; echo '  User zomorod2'; echo '  Port 1396'; echo "  IdentityFile $d/host.key"; echo "  UserKnownHostsFile $d/host.known"; echo '  ProxyJump bridge';
            echo 'Host *'; echo '  StrictHostKeyChecking yes'; echo '  IdentitiesOnly yes'; echo '  BatchMode yes'; echo '  ConnectTimeout 12'; echo '  ForwardAgent no'; echo '  RequestTTY no';
          } > "$d/config"
          chmod 600 "$d/config"
          echo SSH_BRIDGE_PIN_VERIFIED
      - name: Inspect company mailbox metadata only (no message bodies or addresses exposed)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/company-mail-inspect"
          cat <<'PY' | timeout 60s ssh -T -F "$d/config" company python3 -
          from pathlib import Path
          from collections import Counter
          from email.parser import BytesParser
          from email.policy import default
          from email.utils import parseaddr
          import datetime as dt
          import os
          root=Path.home()/"mail"/"zomorodmelal.ir"/"moj_1ro_1"
          counts=Counter()
          cutoff=dt.datetime(2026,10,20,tzinfo=dt.timezone.utc).timestamp()
          print("AUDIT_TYPE=READ_ONLY_MAILDIR_HEADERS",flush=True)
          print("MAILDIR_EXISTS="+str(root.is_dir()).lower(),flush=True)
          if root.is_dir():
              for folder in ("new","cur"):
                  sub=root/folder
                  if not sub.is_dir():
                      continue
                  for path in sub.iterdir():
                      if counts["files_scanned"]>=15000: break
                      if not path.is_file(): continue
                      counts["files_scanned"]+=1
                      try:
                          if path.stat().st_mtime < cutoff:
                              counts["older_files"]+=1
                              continue
                          with path.open("rb") as fp:
                              head=fp.read(65536)
                          if b"\r\n\r\n" in head:
                              head=head.split(b"\r\n\r\n",1)[0]+b"\r\n\r\n"
                          elif b"\n\n" in head:
                              head=head.split(b"\n\n",1)[0]+b"\n\n"
                          msg=BytesParser(policy=default).parsebytes(head,headersonly=True)
                          fr=parseaddr(str(msg.get("From","")))[1].lower()
                          subtext=str(msg.get("Subject","")).lower()
                          autosub=str(msg.get("Auto-Submitted","")).lower()
                          counts["recent_total"]+=1
                          if not fr:
                              counts["missing_sender"]+=1
                          elif fr.endswith("@zomorodmelal.ir"):
                              counts["self_domain"]+=1
                          elif "mailer-daemon" in fr or "postmaster" in fr or "delivery status" in subtext or "undeliver" in subtext or "failure notice" in subtext:
                              counts["bounce_or_delivery_notice"]+=1
                          elif autosub and autosub != "no":
                              counts["auto_response"]+=1
                          else:
                              counts["external_human_candidate"]+=1
                              if msg.get("In-Reply-To") or msg.get("References") or subtext.startswith(("re:","fw:","fwd:")):
                                  counts["thread_reply_candidate"]+=1
                      except (OSError,ValueError,UnicodeError):
                          counts["unreadable_header"]+=1
          for k in ("files_scanned","recent_total","external_human_candidate","thread_reply_candidate","auto_response","bounce_or_delivery_notice","self_domain","missing_sender","unreadable_header"):
              print(k.upper()+"="+str(counts[k]),flush=True)
          print("SUPPLIER_REPLY_IDENTITY_AND_RELEVANCE_UNVERIFIED",flush=True)
          PY
      - name: Inspect existing forwarders without changing them
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/company-mail-inspect"
          timeout 40s ssh -T -F "$d/config" company 'uapi --output=json Email list_forwarders domain=zomorodmelal.ir' | python3 -c 'import sys,json; d=json.load(sys.stdin).get("result",{}); a=d.get("data") or []; rows=[x for x in a if isinstance(x,dict)]; present=any("moj_1ro_1@zomorodmelal.ir" in json.dumps(x).lower() and "mojtaba.rozegar11@gmail.com" in json.dumps(x).lower() for x in rows); print("FORWARDER_QUERY_OK="+str(d.get("status")==1)); print("FORWARDER_TO_PRIMARY_GMAIL="+str(present)); print("FORWARDER_COUNT="+str(len(rows)))'
      - name: Diagnose delivery failures as aggregate codes only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/company-mail-inspect"
          cat <<'PY' | timeout 75s ssh -T -F "$d/config" company python3 -
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          from email.utils import parseaddr
          from collections import Counter
          import re, datetime as dt
          root=Path.home()/"mail"/"zomorodmelal.ir"/"moj_1ro_1"
          cutoff=dt.datetime(2026,10,20,tzinfo=dt.timezone.utc).timestamp()
          codes=Counter()
          groups=Counter()
          bounce_found=0
          for folder in ("new","cur"):
              sub=root/folder
              if not sub.is_dir():
                  continue
              for path in sub.iterdir():
                  if not path.is_file() or path.stat().st_mtime<cutoff:
                      continue
                  with path.open("rb") as f:
                      raw=f.read(180000)
                  msg=BytesParser(policy=default).parsebytes(raw,headersonly=False)
                  sender=parseaddr(str(msg.get("From","")))[1].lower()
                  subj=str(msg.get("Subject","")).lower()
                  if not ("mailer-daemon" in sender or "postmaster" in sender or "delivery status" in subj or "undeliver" in subj or "failure notice" in subj):
                      continue
                  bounce_found+=1
                  txt=raw.decode("utf-8","replace")
                  statuses=re.findall(r'(?im)^Status:\s*([245]\.[0-9]\.[0-9])\s*$',txt)
                  if not statuses:
                      statuses=re.findall(r'(?i)\b([245]\.[0-9]\.[0-9])\b',txt)
                  code=statuses[0] if statuses else "none"
                  codes[code]+=1
                  lower=txt.lower()
                  if code.startswith("5.1.") or any(x in lower for x in ("no such user","user unknown","unknown recipient","address rejected","recipient not found")):
                      groups["invalid_recipient"]+=1
                  elif code.startswith("5.7.") or any(x in lower for x in ("blocked by","spam policy","spamhaus","blacklist","not authorized","access denied","policy rejection")):
                      groups["spam_policy_or_authentication"]+=1
                  elif code.startswith("5.2.") or any(x in lower for x in ("mailbox full","quota exceeded")):
                      groups["mailbox_or_quota"]+=1
                  elif code.startswith("4.") or any(x in lower for x in ("timed out","temporary failure","try again later","connection refused")):
                      groups["transient_network_failure"]+=1
                  elif code.startswith("5.4.") or any(x in lower for x in ("no mx","domain not found","name or service not known","dns error")):
                      groups["domain_or_routing"]+=1
                  elif code.startswith("5.3."):
                      groups["mail_system_or_size"]+=1
                  else:
                      groups["unclassified"]+=1
          print("DSN_BOUNCES_PROCESSED="+str(bounce_found))
          for key in ("invalid_recipient","spam_policy_or_authentication","mailbox_or_quota","transient_network_failure","domain_or_routing","mail_system_or_size","unclassified"):
              print("DSN_REASON_"+key.upper()+"="+str(groups[key]))
          for code,count in codes.most_common(12):
              print("DSN_STATUS_"+code.replace(".","_").replace("-","_")+"="+str(count))
          print("NO_PRIVATE_EMAIL_ADDRESSES_OR_MESSAGE_BODIES_PRINTED")
          PY
      - name: Classify secondary remote SMTP codes in bounced messages (aggregate only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/company-mail-inspect"
          cat <<'PY' | timeout 70s ssh -T -F "$d/config" company python3 -
          from pathlib import Path
          from collections import Counter
          from email.parser import BytesParser
          from email.policy import default
          from email.utils import parseaddr
          import datetime as dt, re
          root=Path.home()/"mail"/"zomorodmelal.ir"/"moj_1ro_1"
          cutoff=dt.datetime(2026,10,20,tzinfo=dt.timezone.utc).timestamp()
          result=Counter()
          for folder in ("new","cur"):
              sub=root/folder
              if not sub.is_dir(): continue
              for path in sub.iterdir():
                  if not path.is_file() or path.stat().st_mtime<cutoff: continue
                  raw=path.read_bytes()[:200000]
                  msg=BytesParser(policy=default).parsebytes(raw,headersonly=True)
                  sender=parseaddr(str(msg.get("From","")))[1].lower()
                  subject=str(msg.get("Subject","")).lower()
                  if not ("mailer-daemon" in sender or "postmaster" in sender or "delivery status" in subject or "undeliver" in subject or "failure notice" in subject): continue
                  txt=raw.decode("utf-8","replace").lower()
                  result["bounce_notices"]+=1
                  codes=set(re.findall(r"(?<![.\d])([45]\d\d)(?![.\d])",txt))
                  for status in ("550","551","552","553","554","450","451","452","421","500","501","502"):
                      if status in codes: result["SMTP_"+status]+=1
                  phrases={
                      "sender_verification_or_authentication":("sender verify failed","sender address rejected","spf fail","dkim fail","dmarc","unauthenticated sender","authentication required","sender rejected"),
                      "antispam_policy":("spamhaus","spam detected","marked as spam","unsolicited","blocked by","blacklisted","blacklist","spam filter"),
                      "bad_recipient_or_address":("user unknown","no such user","unknown recipient","unrouteable address","recipient address rejected","recipient not found","mailbox not found","invalid recipient"),
                      "mail_routing_dns":("host not found","domain not found","unrouteable domain","dns lookup","no mx record","mx record"),
                      "outbound_volume_or_rate":("too many messages","rate limit","message quota","outbound limit","maximum number of emails"),
                      "temporary_delivery":("temporarily deferred","try again later","connection timed out","connection refused","timed out"),
                      "non_delivery_terminal":("permanent error","failed to deliver","delivery failed","returned to sender")
                  }
                  for key,words in phrases.items():
                      if any(w in txt for w in words): result["EVIDENCE_"+key.upper()]+=1
                  if "smtp error from remote mail server" in txt: result["REMOTE_SERVER_REJECTED"]+=1
                  if "remote host" in txt: result["REMOTE_HOST_MENTIONED"]+=1
          for k,v in sorted(result.items()):
              print(k+"="+str(v))
          print("AGGREGATES_ONLY_NO_SENSITIVE_CONTENT")
          PY
      - name: Confirm Gmail to corporate mailbox canary from message headers only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/company-mail-inspect"
          cat <<'PY' | timeout 45s ssh -T -F "$d/config" company python3 -
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          from email.utils import parseaddr
          import datetime as dt
          root=Path.home()/"mail"/"zomorodmelal.ir"/"moj_1ro_1"
          subject="ZM-MAIL-INBOUND-CANARY-20261024-1105"
          cutoff=dt.datetime(2026,10,24,tzinfo=dt.timezone.utc).timestamp()
          counts={"matches":0,"files_scanned":0}
          for folder in ("new","cur"):
              sub=root/folder
              if not sub.is_dir(): continue
              for file in sub.iterdir():
                  if not file.is_file(): continue
                  if file.stat().st_mtime < cutoff: continue
                  counts["files_scanned"]+=1
                  with file.open("rb") as fp:
                      data=fp.read(65536)
                  if b"\r\n\r\n" in data: data=data.split(b"\r\n\r\n",1)[0]+b"\r\n\r\n"
                  elif b"\n\n" in data: data=data.split(b"\n\n",1)[0]+b"\n\n"
                  msg=BytesParser(policy=default).parsebytes(data,headersonly=True)
                  sender=parseaddr(str(msg.get("From","")))[1].lower()
                  if str(msg.get("Subject","")).strip()==subject and sender.endswith("@gmail.com"):
                      counts["matches"]+=1
          print("GMAIL_CORPORATE_CANARY_HEADER_MATCHES="+str(counts["matches"]))
          print("GMAIL_CORPORATE_CANARY_FILES_SCANNED="+str(counts["files_scanned"]))
          print("CANARY_CONTENT_AND_ADDRESSES_NOT_EXPORTED")
          PY
      - name: Inspect public DNS mail policy and PTR (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,re
          def lookup(kind,name):
              p=subprocess.run(['dig','+time=3','+tries=1','+short',kind,name],capture_output=True,text=True,timeout=8)
              return [s.strip().strip('"') for s in p.stdout.splitlines() if s.strip()]
          domain='zomorodmelal.ir'
          spf=[s for s in lookup('TXT',domain) if s.startswith('v=spf1')]
          dmarc=[s for s in lookup('TXT','_dmarc.'+domain) if 'v=DMARC1' in s]
          mx=lookup('MX',domain)
          ptr=lookup('PTR','124.147.239.178.in-addr.arpa')
          a=lookup('A','zohal.pws-dns.net')
          ptr_names=[x.lower().rstrip('.') for x in ptr]
          print('MAIL_DNS_SPF_RECORD_COUNT='+str(len(spf)))
          print('MAIL_DNS_DMARC_RECORD_COUNT='+str(len(dmarc)))
          policy=re.search(r'(?i)(?:^|;)\\s*p\\s*=\\s*(none|quarantine|reject)',dmarc[0]) if dmarc else None
          print('MAIL_DNS_DMARC_POLICY='+(policy.group(1).lower() if policy else 'not_resolved'))
          print('MAIL_DNS_MX_RECORD_COUNT='+str(len(mx)))
          print('OUTBOUND_IP_PTR_PRESENT='+str(bool(ptr)))
          print('OUTBOUND_PTR_MATCHES_SMTP_HOST='+str('zohal.pws-dns.net' in ptr_names))
          print('SMTP_HOST_A_MATCHES_OUTBOUND_IP='+str('178.239.147.124' in a))
          print('PUBLIC_DNS_ONLY_NO_PRIVATE_MAIL_SCANNED')
          PY
      - name: Remove SSH keys
        if: always()
        run: |
          d="$RUNNER_TEMP/company-mail-inspect"
          test ! -d "$d" || find "$d" -maxdepth 1 -type f -exec shred -u {} +
