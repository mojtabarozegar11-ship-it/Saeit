name: Publish Zomorod IndexNow public verification key
on:
  push:
    branches: [main]
    paths:
      - public/6ffbcd2d1f8d739fca4d0d6790164dba.txt
      - .github/workflows/zomorod-indexnow-key-20261023.yml
  pull_request:
    branches: [main]
    paths:
      - public/6ffbcd2d1f8d739fca4d0d6790164dba.txt
      - .github/workflows/zomorod-indexnow-key-20261023.yml
permissions: {contents: read}
concurrency:
  group: zomorod-indexnow-key-20261023
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate one public IndexNow key and exact filename
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path("public/6ffbcd2d1f8d739fca4d0d6790164dba.txt")
          content=f.read_text(encoding="ascii").strip()
          assert len(content)==32 and content.isalnum()
          assert f.name == content+".txt"
          assert f.read_text(encoding="ascii").strip()+"\n" == f.read_text(encoding="ascii")
          print("INDEXNOW_KEY_SOURCE_VALID=yes")
          PY
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare pinned cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/indexnow-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -T -F "$d/config" vps 'timeout 10s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
      - name: Stage SHA-verified public key and install without overwriting any unrelated file
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/indexnow-ssh"
          stage="/home/zomorod2/.private-indexnow/$GITHUB_RUN_ID"
          timeout 45s ssh -T -F "$d/config" cpanel "umask 077; test ! -e '$stage' && mkdir -p '$stage' && chmod 700 '$stage'"
          timeout 45s scp -q -F "$d/config" public/6ffbcd2d1f8d739fca4d0d6790164dba.txt "cpanel:$stage/key.txt"
          expected="$(sha256sum public/6ffbcd2d1f8d739fca4d0d6790164dba.txt | cut -d' ' -f1)"
          timeout 60s ssh -T -F "$d/config" cpanel python3 - "$GITHUB_RUN_ID" "$expected" <<'PY'
          import hashlib,os,sys,tempfile
          from pathlib import Path
          run,want=sys.argv[1:]
          assert run.isdigit() and len(want)==64
          home=Path("/home/zomorod2")
          assert Path.home()==home
          stage=home/".private-indexnow"/run
          src=stage/"key.txt"
          dst=home/"public_html"/"6ffbcd2d1f8d739fca4d0d6790164dba.txt"
          assert src.is_file() and not src.is_symlink() and not dst.is_symlink()
          blob=src.read_bytes()
          assert hashlib.sha256(blob).hexdigest()==want
          assert blob.decode("ascii").strip()+".txt"==dst.name
          if dst.exists():
              assert dst.is_file() and dst.read_bytes()==blob
              print("INDEXNOW_PUBLIC_KEY_ALREADY_IDENTICAL=yes")
              sys.exit(0)
          fd,temp=tempfile.mkstemp(prefix=".indexnow-",dir=str(dst.parent))
          try:
              with os.fdopen(fd,"wb") as f:
                  os.fchmod(f.fileno(),0o644);f.write(blob);f.flush();os.fsync(f.fileno())
              os.replace(temp,dst)
          finally:
              if os.path.lexists(temp):os.unlink(temp)
          assert dst.read_bytes()==blob
          (stage/"installed.sha256").write_text(want+"\n",encoding="ascii")
          print("INDEXNOW_PUBLIC_KEY_INSTALLED=yes")
          PY
      - name: Verify the public key file serves exact text without redirect
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/indexnow-live" -w '%{http_code}' "https://zomorodmelal.ir/6ffbcd2d1f8d739fca4d0d6790164dba.txt")"
          test "$code" = 200
          cmp -s public/6ffbcd2d1f8d739fca4d0d6790164dba.txt "$RUNNER_TEMP/indexnow-live"
          echo INDEXNOW_KEY_LIVE_200_AND_EXACT_BYTES=yes
      - name: Roll back only the new matching key file if public check failed
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/indexnow-ssh"
          timeout 45s ssh -T -F "$d/config" cpanel python3 - "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import hashlib,sys
          run=sys.argv[1]
          stage=Path("/home/zomorod2/.private-indexnow")/run
          proof=stage/"installed.sha256"
          dst=Path("/home/zomorod2/public_html/6ffbcd2d1f8d739fca4d0d6790164dba.txt")
          if proof.is_file():
              assert dst.is_file() and not dst.is_symlink()
              assert hashlib.sha256(dst.read_bytes()).hexdigest()==proof.read_text().strip()
              dst.unlink()
              print("INDEXNOW_KEY_SCOPED_ROLLBACK=yes")
          PY
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/indexnow-ssh"
