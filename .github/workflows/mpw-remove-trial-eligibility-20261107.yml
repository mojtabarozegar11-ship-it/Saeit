name: Remove MojPlayWin trial from live eligibility and detail
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-remove-trial-eligibility-20261107.yml"]
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Establish pinned relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; umask 077; d="$RUNNER_TEMP/r"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/v"; printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/h"; chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/v" >/dev/null; ssh-keygen -y -P "" -f "$d/h" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vk" 2>/dev/null; test "$(ssh-keygen -lf "$d/vk" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/c" <<EOF
          Host v
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/v
            UserKnownHostsFile $d/vk
          Host h
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/h
            UserKnownHostsFile $d/hk
            ProxyJump v
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            RequestTTY no
          EOF
          timeout 30s ssh -F "$d/c" v 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/hc" 2>/dev/null; test "$(ssh-keygen -lf "$d/hc" -E sha256|awk '{print $2}'|sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; mv "$d/hc" "$d/hk"
      - name: Remove trial from eligibility and public detail only
        run: |
          set -euo pipefail
          timeout 120s ssh -T -F "$RUNNER_TEMP/r/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,pwd,stat,json
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging'); W=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          files={'view':A/'core/brand_views.py','settings':A/'config/settings.py','detail':A/'core/templates/brands/mojplaywin/product.html'}
          if pwd.getpwuid(os.getuid()).pw_name!='zomorod2' or A.is_symlink() or W.is_symlink() or not W.is_file() or "APP='/home/zomorod2/Saeit-staging'" not in W.read_text(errors='replace'): raise RuntimeError('UNTRUSTED_ROOT')
          old="    if product.pk in canary_ids or not _eligible(product): raise Http404"
          new=("    owner_approved_micro_trial = (\n"
          "        product.pk == 779 and product.currency == 'USD'\n"
          "        and str(product.price) == '0.03'\n"
          "        and isinstance(product.metadata, dict)\n"
          "        and product.metadata.get('mpw_micro_trial') == 'mpw-native-trx-micro-trial-20261020-v1'\n"
          "        and product.metadata.get('asset_verified') is True\n"
          "        and product.metadata.get('rights_cleared') is True\n"
          "        and product.metadata.get('checkout_enabled') is True\n"
          "    )\n"
          "    if (product.pk in canary_ids and not owner_approved_micro_trial) or not _eligible(product): raise Http404\n"
          "    if owner_approved_micro_trial:\n"
          "        product.metadata = dict(product.metadata)\n"
          "        product.metadata['summary'] = 'Original one-page educational PDF on the secure TRX checkout process.'\n"
          "        product.metadata['seo_description'] = 'Three-cent MojPlayWin TRX digital PDF trial: invoice, safe payment and private download.'")
          before={k:p.read_text(errors='replace') for k,p in files.items()}
          if before['view'].count(new)!=1 or before['settings'].count('MPW_TRX_PUBLIC_PRODUCT_IDS = (72, 225, 879, 779)')!=1: raise RuntimeError('EXPECTED_PATCH_NOT_FOUND')
          detail=before['detail']; start=detail.find('{% elif product.pk == 779 %}'); end=detail.find('{% elif product.pk == 72 or product.pk == 225 %}',start)
          if start<0 or end<0: raise RuntimeError('DETAIL_BRANCH_NOT_FOUND')
          detail=detail[:start]+detail[end:]
          detail='\n'.join(line for line in detail.split('\n') if '779' not in line)
          after={'view':before['view'].replace(new,old,1),'settings':before['settings'].replace('MPW_TRX_PUBLIC_PRODUCT_IDS = (72, 225, 879, 779)','MPW_TRX_PUBLIC_PRODUCT_IDS = (72, 225, 879)',1),'detail':detail}
          compile(after['view'],'brand_views.py','exec'); compile(after['settings'],'settings.py','exec')
          for k,p in files.items():
              tmp=p.with_name('.mpw-final-'+k); fd=os.open(str(tmp),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,stat.S_IMODE(p.stat().st_mode))
              try:
                  with os.fdopen(fd,'w') as f: f.write(after[k]); f.flush(); os.fsync(f.fileno())
                  os.replace(tmp,p)
              finally:
                  if tmp.exists(): tmp.unlink()
          for folder in (A/'tmp',W.parent/'tmp'):
              folder.mkdir(mode=0o700,exist_ok=True); flag=folder/'restart.txt'; fd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600); os.close(fd); os.utime(flag,None)
          os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,OrderItem
          p=Product.objects.get(pk=779); n=OrderItem.objects.filter(product_id=779).count()
          print('MPW_FINAL_PRESERVATION='+json.dumps({'active':p.active,'orders':n,'database_rows_changed':0}))
          if not p.active or n<1: raise RuntimeError('PRESERVATION_FAILED')
          PY
      - name: Verify public catalog and original products
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          u='https://mojplaywin.com/commerce/trx-easy/'
          req=urllib.request.Request(u,headers={'Cache-Control':'no-cache, no-store, max-age=0','User-Agent':'MPW-Final-779/1'})
          with urllib.request.urlopen(req,timeout=25) as r: body=r.read(240000).decode('utf-8','replace')
          if 'MojPlayWin Secure TRX Purchase' in body or '/store/product/779/' in body or '/commerce/book/779/' in body: raise RuntimeError('TRIAL_STILL_PUBLIC')
          for path in ('/store/','/store/product/72/','/store/product/225/','/store/product/879/'):
              req=urllib.request.Request('https://mojplaywin.com'+path,headers={'Cache-Control':'no-cache','User-Agent':'MPW-Final-779/1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status!=200: raise RuntimeError(path+' HTTP '+str(r.status))
          print('MPW_PUBLIC_CATALOG=PASS');print('MPW_ORIGINAL_PRODUCTS=HEALTHY')
          PY
      - name: Clean relay
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/r"
