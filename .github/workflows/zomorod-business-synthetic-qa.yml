name: Synthetic QA for Zomorod business accounting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-business-synthetic-qa.yml"
      - "content/zomorod-business/app.php"
      - "content/zomorod-business/approvals.php"
      - "scripts/zomorod_business_synthetic_qa.py"
      - "scripts/zomorod_project_approval_snapshot.py"
      - "tests/test_zomorod_approval_snapshot.py"
  pull_request:
    paths:
      - ".github/workflows/zomorod-business-synthetic-qa.yml"
      - "content/zomorod-business/app.php"
      - "content/zomorod-business/approvals.php"
      - "scripts/zomorod_business_synthetic_qa.py"
      - "scripts/zomorod_project_approval_snapshot.py"
      - "tests/test_zomorod_approval_snapshot.py"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Test PHP and SQLite without production data
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          php -l content/zomorod-business/app.php
          php -l content/zomorod-business/approvals.php
          php -l content/zomorod-business/index.php
          python3 -m py_compile scripts/zomorod_business_synthetic_qa.py
          python3 -m py_compile scripts/zomorod_project_approval_snapshot.py tests/test_zomorod_approval_snapshot.py
          python3 -m unittest discover -s tests -p 'test_zomorod_approval_snapshot.py'
          mkdir -p "$HOME/.private/zomorod-business" "$HOME/public_html/business"
          cp content/zomorod-business/app.php "$HOME/.private/zomorod-business/app.php"
          cp content/zomorod-business/index.php "$HOME/public_html/business/index.php"
          python3 scripts/zomorod_business_synthetic_qa.py "$GITHUB_SHA"
