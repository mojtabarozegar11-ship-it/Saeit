name: Synthetic QA for Zomorod business accounting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-business-synthetic-qa.yml"
      - "content/zomorod-business/app.php"
      - "content/zomorod-business/approvals.php"
      - "content/zomorod-business/genetics-center.php"
      - "scripts/zomorod_business_genetics_guarded_install.sh"
      - "scripts/zomorod_business_genetics_readonly_preflight.sh"
      - "scripts/zomorod_business_genetics_overlay_preview.py"
      - "tests/test_zomorod_business_genetics_overlay_preview.py"
      - "tests/test_zomorod_business_quota_guards.py"
      - "tests/test_zomorod_business_sqlite_backup_restore.py"
      - "scripts/zomorod_business_homepage_invariant.sh"
      - "tests/test_zomorod_business_homepage_invariant.py"
      - "scripts/zomorod_business_public_surface_invariant.py"
      - "tests/test_zomorod_business_public_surface_invariant.py"
      - ".github/workflows/zomorod-business-update.yml"
      - "scripts/zomorod_business_synthetic_qa.py"
      - "scripts/zomorod_project_approval_snapshot.py"
      - "tests/test_zomorod_approval_snapshot.py"
  pull_request:
    paths:
      - ".github/workflows/zomorod-business-synthetic-qa.yml"
      - "content/zomorod-business/app.php"
      - "content/zomorod-business/approvals.php"
      - "content/zomorod-business/genetics-center.php"
      - "scripts/zomorod_business_genetics_guarded_install.sh"
      - "scripts/zomorod_business_genetics_readonly_preflight.sh"
      - "scripts/zomorod_business_genetics_overlay_preview.py"
      - "tests/test_zomorod_business_genetics_overlay_preview.py"
      - "tests/test_zomorod_business_quota_guards.py"
      - "tests/test_zomorod_business_sqlite_backup_restore.py"
      - "scripts/zomorod_business_homepage_invariant.sh"
      - "tests/test_zomorod_business_homepage_invariant.py"
      - "scripts/zomorod_business_public_surface_invariant.py"
      - "tests/test_zomorod_business_public_surface_invariant.py"
      - ".github/workflows/zomorod-business-update.yml"
      - "scripts/zomorod_business_synthetic_qa.py"
      - "scripts/zomorod_project_approval_snapshot.py"
      - "tests/test_zomorod_approval_snapshot.py"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any PR change to public homepage or unrelated site files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/zomorod-business-direct-live-audit.yml|\
              .github/workflows/zomorod-business-synthetic-qa.yml|\
              .github/workflows/zomorod-business-update.yml|\
              content/zomorod-business/app.php|\
              content/zomorod-business/genetics-center.php|\
              docs/zomorod-business-provider-portal-internal-entry-20261112.md|\
              scripts/zomorod_business_genetics_guarded_install.sh|\
              scripts/zomorod_business_genetics_overlay_preview.py|\
              scripts/zomorod_business_genetics_readonly_preflight.sh|\
              scripts/zomorod_business_homepage_invariant.sh|\
              scripts/zomorod_business_public_surface_invariant.py|\
              scripts/zomorod_business_live_semantic_readonly.py|\
              scripts/zomorod_business_synthetic_qa.py|\
              tests/test_zomorod_business_genetics_overlay_preview.py|\
              tests/test_zomorod_business_homepage_invariant.py|\
              tests/test_zomorod_business_public_surface_invariant.py|\
              tests/test_zomorod_business_quota_guards.py|\
              tests/test_zomorod_business_sqlite_backup_restore.py)
                ;;
              *)
                echo "::error::PUBLIC_HOMEPAGE_PROTECTION=BLOCKED_UNSCOPED_FILE"
                exit 9
                ;;
            esac
          done < <(git diff --name-only -z FETCH_HEAD HEAD)
          echo 'PUBLIC_HOMEPAGE_PR_SCOPE=PRIVATE_BUSINESS_FILES_ONLY'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Test PHP and SQLite without production data
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          php -l content/zomorod-business/app.php
          php -l content/zomorod-business/approvals.php
          php -l content/zomorod-business/genetics-center.php
          bash -n scripts/zomorod_business_genetics_guarded_install.sh
          bash -n scripts/zomorod_business_genetics_readonly_preflight.sh
          bash -n scripts/zomorod_business_homepage_invariant.sh
          php -l content/zomorod-business/index.php
          python3 -m py_compile scripts/zomorod_business_synthetic_qa.py
          python3 -m py_compile scripts/zomorod_project_approval_snapshot.py tests/test_zomorod_approval_snapshot.py
          python3 -m unittest discover -s tests -p 'test_zomorod_approval_snapshot.py'
          python3 -m unittest discover -s tests -p 'test_zomorod_business_genetics_overlay_preview.py'
          python3 -m unittest discover -s tests -p 'test_zomorod_business_quota_guards.py'
          python3 -m unittest discover -s tests -p 'test_zomorod_business_sqlite_backup_restore.py'
          python3 -m unittest discover -s tests -p 'test_zomorod_business_homepage_invariant.py'
          python3 -m unittest discover -s tests -p 'test_zomorod_business_public_surface_invariant.py'
          mkdir -p "$HOME/.private/zomorod-business" "$HOME/public_html/business"
          cp content/zomorod-business/app.php "$HOME/.private/zomorod-business/app.php"
          cp content/zomorod-business/genetics-center.php "$HOME/.private/zomorod-business/genetics-center.php"
          cp content/zomorod-business/index.php "$HOME/public_html/business/index.php"
          python3 scripts/zomorod_business_synthetic_qa.py "$GITHUB_SHA"
