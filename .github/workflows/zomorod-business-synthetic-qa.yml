name: Synthetic QA for Zomorod business accounting
on:
  push:
    branches: [main, feature/zm-business-php-chatgpt-reports-20261102]
    paths:
      - ".github/workflows/zomorod-business-synthetic-qa.yml"
      - "content/zomorod-business/app.php"
      - "content/zomorod-business/chatgpt_reports.php"
      - "scripts/zomorod_chatgpt_report_snapshot.py"
      - "scripts/zm_business_live_report_patch.py"
      - "tests/test_zm_business_live_report_patch.py"
      - "tests/test_zomorod_chatgpt_report_snapshot.py"
      - "content/zomorod-business/approvals.php"
      - "scripts/zomorod_business_synthetic_qa.py"
      - "scripts/zomorod_project_approval_snapshot.py"
      - "tests/test_zomorod_approval_snapshot.py"
  pull_request:
    paths:
      - ".github/workflows/zomorod-business-synthetic-qa.yml"
      - "content/zomorod-business/app.php"
      - "content/zomorod-business/approvals.php"
      - "scripts/zomorod_business_synthetic_qa.py"
      - "scripts/zomorod_project_approval_snapshot.py"
      - "tests/test_zomorod_approval_snapshot.py"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - name: Test PHP and SQLite without production data
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          php -l content/zomorod-business/app.php
          php -l content/zomorod-business/approvals.php
          php -l content/zomorod-business/chatgpt_reports.php
          php -l content/zomorod-business/index.php
          python3 -m py_compile scripts/zomorod_business_synthetic_qa.py
          python3 -m py_compile scripts/zomorod_project_approval_snapshot.py tests/test_zomorod_approval_snapshot.py
          python3 -m unittest discover -s tests -p 'test_zomorod_approval_snapshot.py'
          python3 -m unittest discover -s tests -p 'test_zomorod_chatgpt_report_snapshot.py'
          python3 -m unittest discover -s tests -p 'test_zm_business_live_report_patch.py'
          mkdir -p "$HOME/.private/zomorod-business" "$HOME/public_html/business"
          cp content/zomorod-business/app.php "$HOME/.private/zomorod-business/app.php"
          cp content/zomorod-business/index.php "$HOME/public_html/business/index.php"
          python3 scripts/zomorod_business_synthetic_qa.py "$GITHUB_SHA"
      - name: Verify real numbered reports without production writes
        env:
          ZM_GITHUB_REPORTS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/zomorod_chatgpt_report_snapshot.py --pages 1 > "$RUNNER_TEMP/zm-report-probe.log"
          grep -Fq 'ZM_CHATGPT_SNAPSHOT=PREVIEW_ONLY' "$RUNNER_TEMP/zm-report-probe.log"
          grep -Fq 'FINANCIAL_DB_TOUCHED=no' "$RUNNER_TEMP/zm-report-probe.log"
          echo 'ZM_REPORT_SOURCE_READONLY=passed'
          grep -F 'VALID_NUMBERED_REPORTS=' "$RUNNER_TEMP/zm-report-probe.log"
