name: Atelier Interior exact existing ZIP private-release readiness audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atelier-interior-live-readiness-20261021.yml"
      - "scripts/atelier_interior_release_probe_20261021.py"
  pull_request:
    paths:
      - ".github/workflows/atelier-interior-live-readiness-20261021.yml"
      - "scripts/atelier_interior_release_probe_20261021.py"
permissions: {contents: read}
concurrency:
  group: atelier-interior-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prove strict ZIP safety gates without touching any live system
        run: |
          set -euo pipefail
          python3 -B scripts/atelier_interior_release_probe_20261021.py selftest
          python3 - <<'PY'
          from pathlib import Path
          src=Path('scripts/atelier_interior_release_probe_20261021.py').read_text()
          assert 'f17eb13a5e546c5ca9974885b30b6d8b5bc44ecf5474edf75b544f8f7d254d3d' in src
          assert 'atelier-interior-kit-v1.zip' in src
          assert 'Product.objects.filter(title=TITLE)' in src
          assert 'customer_payment_and_download_tested": False' in src
          print('ATELIER_EXACT_PRODUCT_AND_NO_FALSE_CHECKOUT_CLAIM=PASS')
          PY
  inspect_existing_server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate read-only demo and live store are reachable
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          for url in ('https://atelier-interior-kit-demo.mojtaba-rozegar11.chatgpt.site/',
                      'https://mojplaywin.com/store/'):
              with urlopen(Request(url,headers={'User-Agent':'AtelierReadOnlyProbe/1.0'}),timeout=20) as r:
                  if r.status!=200:raise RuntimeError('Live demo/store not available')
                  print('ATELIER_PUBLIC_READONLY_HTTP='+str(r.status))
          PY
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect exact ZIP and native commercial path on cPanel read-only
        run: |
          set -euo pipefail
          timeout 105s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel             "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -"             < scripts/atelier_interior_release_probe_20261021.py
