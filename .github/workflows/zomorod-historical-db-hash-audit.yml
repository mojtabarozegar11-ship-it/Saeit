name: SHA-256 verification of duplicate historical robot databases
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-historical-db-hash-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-historical-db-hashes
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Compare all historical backup SQLite files byte-for-byte against retained lab sources
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,json,stat
          H=Path.home()
          src=H/"Saeit/var/mother_robot/lab"
          saved=H/".backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b/database/var/mother_robot/lab"
          assert src.is_dir() and saved.is_dir()
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(4*1024*1024),b""):h.update(b)
              return h.hexdigest()
          sizes={"same":0,"different":0,"missing":0}
          counts={"same":0,"different":0,"missing":0}
          for path,dirs,files in os.walk(saved,followlinks=False):
              dirs[:]=[d for d in dirs if not (Path(path)/d).is_symlink()]
              for name in files:
                  a=Path(path)/name
                  if not a.is_file() or a.is_symlink():continue
                  rel=a.relative_to(saved);b=src/rel
                  if not b.is_file() or b.is_symlink():status="missing"
                  elif a.stat().st_size!=b.stat().st_size:status="different"
                  elif sha(a)!=sha(b):status="different"
                  else:status="same"
                  sizes[status]+=a.stat().st_size
                  counts[status]+=1
                  print("DB_DUPLICATE="+json.dumps({"name":str(rel),"bytes":a.stat().st_size,"status":status}))
          print("DB_BACKUP_HASH_COUNTS="+json.dumps(counts))
          print("DB_BACKUP_HASH_BYTES="+json.dumps(sizes))
          print("BACKUP_HASH_TEST_COMPLETE=yes")
          PY
          REMOTE
      - name: Clear ssh identities
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
