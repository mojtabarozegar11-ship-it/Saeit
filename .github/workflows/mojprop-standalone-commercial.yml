name: MojProp.top standalone commercial gate

on:
  pull_request:
    paths:
      - ".github/workflows/mojprop-standalone-commercial.yml"
      - "templates/moj-prop/**"
      - "templates/moj-prop-v4/**"
      - "services/mojprop_standalone_boundary.py"
      - "config/mpw_commerce_urls.py"
      - "tests/test_mojprop_standalone_boundary_20261126.py"
      - "docs/mojprop/**"

permissions:
  contents: read

jobs:
  validate-standalone-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "true"
      SECRET_KEY: "mojprop-branch-ci-only-not-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,mojprop.top,www.mojprop.top,mojplaywin.com"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
      - name: Install declared project dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile the boundary and URL registry
        run: |
          set -euo pipefail
          python -m py_compile services/mojprop_standalone_boundary.py config/mpw_commerce_urls.py
      - name: Run MojProp HTTP and HTTPS regression tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_mojprop_standalone_boundary_20261126.py
      - name: Validate dedicated MojProp surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              Path("templates/moj-prop/index.html"),
              Path("templates/moj-prop/contact/index.html"),
              Path("templates/moj-prop-v4/index.html"),
              Path("templates/moj-prop-v4/catalog/index.html"),
              Path("templates/moj-prop-v4/starter-30-trx/index.html"),
          ]
          legacy = ("mojplaywin.com", "MojPlayWin", "MOJPLAYWIN")
          for page in pages:
              text = page.read_text(encoding="utf-8")
              for token in legacy:
                  if token in text:
                      raise SystemExit(f"legacy token {token!r} remains in {page}")
              if "mojprop.top" not in text.lower():
                  raise SystemExit(f"dedicated host missing from {page}")
          print("MOJPROP_STANDALONE_SURFACE=PASS")
          PY
      - name: Confirm no deployment path is enabled by this gate
        run: |
          set -euo pipefail
          test ! -f deploy/mojprop-production-enable.flag
          echo "MOJPROP_DEPLOYMENT=NOT_PERFORMED"
          echo "MOJPROP_PAYMENT=DISABLED"
          echo "MOJPROP_RESTORE_EVIDENCE=REQUIRED"
