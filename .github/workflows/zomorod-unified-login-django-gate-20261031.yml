name: Zomorod unified sign-in Django consumer and OTP security gate (offline)
on:
  push:
    branches: [feature/zomorod-unified-login-20261031]
    paths:
      - "enterprise_portal/**"
      - "ecosystem_hub/tests.py"
      - "config/settings.py"
      - ".github/workflows/zomorod-unified-login-django-gate-20261031.yml"
permissions:
  contents: read
jobs:
  django-sso-offline:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SECRET_KEY: "sso-isolated-ci-only-not-production"
      DEBUG: "false"
      ALLOWED_HOSTS: "testserver,zomorodmelal.ir"
      DATABASE_URL: "sqlite:///unified_sso_ci_only.sqlite3"
      COMPANY_MESSAGING_SEND_ENABLED: "false"
      COMPANY_MARKETING_PUBLISH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify additive migrations and strict offline SSO security
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run enterprise_portal
          python manage.py test enterprise_portal.test_sso_consumer --verbosity 2
          python manage.py test company_messaging company_marketing enterprise_portal ecosystem_hub --verbosity 1
          echo ZOMOROD_SSO_DJANGO_OFFLINE_GATE=PASS
          echo ZOMOROD_LIVE_SSO_ENABLED=false
          echo ZOMOROD_LIVE_PHP_UNCHANGED=true
