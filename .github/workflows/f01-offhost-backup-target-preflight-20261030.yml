name: F-01 independent off-host backup destination preflight
on:
  push:
    branches: [ops/offhost-backup-target-preflight-20261030]
    paths: [.github/workflows/f01-offhost-backup-target-preflight-20261030.yml]
permissions:
  contents: read
concurrency:
  group: f01-offhost-backup-target-preflight
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned private SSH relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-command-channel"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Measure backup destination filesystem and account quota (read only)
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 45s ssh -F "$RUNNER_TEMP/zomorod-command-channel/config" "$COMMAND_HOST" 'python3 -B -' <<'PY'
          import json, os, pwd, re, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          assert pwd.getpwuid(os.getuid()).pw_name == "zomorod2"
          home = Path.home().resolve()
          assert home == Path("/home/zomorod2")
          vfs = os.statvfs(home)
          base = {
              "schema": "f01-cpanel-offhost-capacity-probe.v1",
              "observed_utc": datetime.now(timezone.utc).isoformat(),
              "read_only": True,
              "account_identity_verified": True,
              "fs_available_bytes": vfs.f_bavail * vfs.f_frsize,
              "fs_free_bytes_including_reserve": vfs.f_bfree * vfs.f_frsize,
              "fs_total_bytes": vfs.f_blocks * vfs.f_frsize,
              "private_parent_exists": (home / ".private").is_dir() and not (home / ".private").is_symlink(),
              "account_quota": "NOT_VERIFIED",
              "account_used": "NOT_VERIFIED",
              "backup_streamed": False,
              "backup_or_restore_proven": False,
              "restart_authorized": False,
          }
          # Read account-specific disk statistics; never print the raw API response.
          base["statsbar_status"] = "UNAVAILABLE"
          base["statsbar_row_ids"] = []
          try:
              p = subprocess.run(["/usr/local/cpanel/bin/uapi","--output=json",
                                  "StatsBar","get_stats","display=diskusage"],
                                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                                  timeout=18,check=False,text=True)
              base["statsbar_status"] = ("CLI_OK" if p.returncode == 0 else "CLI_NONZERO")
              if p.returncode == 0 and len(p.stdout) < 200000:
                  d = json.loads(p.stdout)
                  base["statsbar_top_keys"] = sorted(k for k in d if k in ("data","result","status","errors"))
                  data = d.get("result",{}).get("data",d.get("data")) if isinstance(d.get("result"),dict) else d.get("data")
                  base["statsbar_data_type"] = type(data).__name__
                  if isinstance(data,list):
                      for row in data[:30]:
                          if not isinstance(row,dict): continue
                          name = str(row.get("id",row.get("name",""))).lower()
                          if re.fullmatch(r"[a-z0-9_]{1,40}",name):
                              base["statsbar_row_ids"].append(name)
                          if name != "diskusage": continue
                          base["diskusage_field_types"] = {k:type(row[k]).__name__ for k in ("count","max","units","_count","_max") if k in row}
                          numeric = r"[0-9]+(?:[.][0-9]+)?"
                          used = str(row.get("count",row.get("_count",""))).strip()
                          limit = str(row.get("max",row.get("_max",""))).strip()
                          unit = str(row.get("units","")).strip()
                          if re.fullmatch(numeric,used) and re.fullmatch(r"(?:B|KB|MB|GB|TB)",unit,re.I):
                              base["account_used"] = used+" "+unit
                          if re.fullmatch(numeric,limit) and re.fullmatch(r"(?:B|KB|MB|GB|TB)",unit,re.I):
                              base["account_quota"] = limit+" "+unit
                              base["account_limit_source"] = "CPANEL_UAPI_STATS"
          except (OSError,ValueError,TypeError,subprocess.TimeoutExpired):
              base["statsbar_status"] = "ERROR_OR_TIMEOUT"
          # Deprecated cPanel API 2 fallback: bounded read-only StatsBar::stat.
          base["api2_status"] = "UNAVAILABLE"
          try:
              p = subprocess.run(["/usr/local/cpanel/bin/cpapi2","--user=zomorod2",
                                  "StatsBar","stat","display=diskusage",
                                  "warnings=0","warninglevel=90","warnout=0",
                                  "infinityimg=/home/zomorod2/.cpanel/infinity.png",
                                  "infinitylang=infinity","rowcounter=even"],
                                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                                  timeout=15,check=False,text=True)
              base["api2_status"] = "CLI_OK" if p.returncode == 0 else "CLI_NONZERO"
              if p.returncode == 0 and len(p.stdout) < 150000:
                  d = json.loads(p.stdout)
                  result = d.get("cpanelresult",{})
                  if isinstance(result,dict) and isinstance(result.get("data"),list):
                      for row in result["data"][:20]:
                          if not isinstance(row,dict) or str(row.get("id","")).lower() != "diskusage":continue
                          unit = str(row.get("units","")).strip()
                          used = str(row.get("count",row.get("_count",""))).strip()
                          limit = str(row.get("max",row.get("_max",""))).strip()
                          numeric = r"[0-9]+(?:[.][0-9]+)?"
                          if re.fullmatch(numeric,used) and re.fullmatch(r"B|KB|MB|GB|TB",unit,re.I):
                              base["account_used"] = used+" "+unit
                          if re.fullmatch(numeric,limit) and re.fullmatch(r"B|KB|MB|GB|TB",unit,re.I):
                              base["account_quota"] = limit+" "+unit
                              base["account_limit_source"] = "CPANEL_API2_STATS"
          except (OSError,ValueError,TypeError,subprocess.TimeoutExpired):
              base["api2_status"] = "ERROR_OR_TIMEOUT"
          # Shell quota is a secondary signal only; not a substitute for account quotas.
          base["quota_cli_available"] = False
          try:
              q = subprocess.run(["quota","-u","-s","zomorod2"],
                                 stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                                 check=False,timeout=3,text=True)
              base["quota_cli_available"] = True
              base["quota_cli_success"] = q.returncode == 0
          except (OSError,subprocess.TimeoutExpired):
              pass
          print("CPANEL_CAPACITY_EVIDENCE="+json.dumps(base,sort_keys=True))
          PY
      - name: Remove ephemeral private relay credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-command-channel"
