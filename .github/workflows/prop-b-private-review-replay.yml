name: Prop B private reviewer replay targeted regressions
on:
  pull_request:
    paths:
      - 'prop_firm/plan1_private_review_replay.py'
      - 'prop_firm/plan1_reviewed_buyer_terms.py'
      - 'prop_firm/test_plan1_review_replay_anchor_20261118.py'
      - 'tests/test_plan1_claimed_review_20261118.py'
      - '.github/workflows/prop-b-private-review-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-replay-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned project testing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify durable replay registry (stdlib)
        run: python -m unittest -v prop_firm.test_plan1_review_replay_anchor_20261118
      - name: Generate an ephemeral CI-only Django secret
        run: python -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"
      - name: Verify independent buyer review claim (Django initialized)
        run: python manage.py test tests.test_plan1_claimed_review_20261118 --noinput -v 2
