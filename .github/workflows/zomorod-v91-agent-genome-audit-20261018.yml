name: V91 vs Zomorod agent genome and generation audit (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-v91-agent-genome-audit-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v91-zomorod-genome-readonly-20261018
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Compare agent generations, genetic mechanisms, capabilities and full code structure
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          test "$HOME" = /home/zomorod2
          cd "$HOME/Saeit"
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast, hashlib, os, re, json
          from collections import Counter
          from pathlib import Path
          source=Path.home()/"saeit_v91"
          active=Path.home()/"Saeit"
          assert source.is_dir() and active.is_dir()
          assert (active/"portal"/"agent_engine.py").is_file()
          assert (source/"zomorodmelal"/"portal"/"agent_engine.py").is_file()
          exclude={"mojplaywin","mojplaywin_site","picm","saman","farnaz","zahra","taniya","raha","studio","mohammad","tala","shop","payment","wallet","crypto","private","secrets","credentials","backup","backups","venv",".venv","virtualenv","site-packages",".git","__pycache__","node_modules","static","media","logs"}
          tokens=("agent","master","robot","evol","mutation","genome","genetic","generation","gene","fitness","lineage","breed","learning","experiment","self_improv","capability","orchestrat","autonomous","policy","scheduler","task_queue","worker","ژن","نسل","تکامل","جهش")
          signal=re.compile("|".join(re.escape(t) for t in tokens),re.I)
          high_signal=re.compile(r"genom|genetic|generat|generation|evol|mutat|fitness|lineage|breed|ژن|نسل|تکامل|جهش",re.I)
          def parse(path):
              try:
                  if path.stat().st_size>350000:return None
                  b=path.read_bytes()
                  s=b.decode("utf-8-sig")
                  tree=ast.parse(s) if path.suffix==".py" else None
                  return (b,s,tree)
              except (UnicodeError,SyntaxError,ValueError,OSError):return None
          def symbols(tree):
              if tree is None:return set()
              return {n.name for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))}
          def symbol_features(tree):
              if tree is None:return {"classes":0,"functions":0,"async":0,"except":0,"tests":0,"imports":0}
              nodes=list(ast.walk(tree))
              return {
                  "classes":sum(isinstance(n,ast.ClassDef) for n in nodes),
                  "functions":sum(isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) for n in nodes),
                  "async":sum(isinstance(n,ast.AsyncFunctionDef) for n in nodes),
                  "except":sum(isinstance(n,ast.ExceptHandler) for n in nodes),
                  "asserts":sum(isinstance(n,ast.Assert) for n in nodes),
                  "imports":sum(isinstance(n,(ast.Import,ast.ImportFrom)) for n in nodes),
              }
          def safe_str(x,n=175):
              return str(x).replace(chr(10)," ").replace(chr(13)," ")[:n]
          print("GENOME_AUDIT_SOURCE="+str(source))
          print("GENOME_AUDIT_TARGET="+str(active))
          print("GENOME_SOURCE_ROOTS="+",".join(sorted(x.name for x in source.iterdir() if x.is_dir())[:40]))
          vroot=source/"zomorodmelal"
          if not vroot.is_dir():
              raise SystemExit("EXPECTED_V91_ZOMOROD_SUBTREE_MISSING")
          print("GENOME_TARGET_ROOTS="+",".join(sorted(x.name for x in active.iterdir() if x.is_dir())[:40]))
          flagged=[]
          source_files=0
          old_total_bytes=0
          categories=Counter()
          for root,subdirs,files in os.walk(vroot,followlinks=False):
              relative=Path(root).relative_to(vroot)
              subdirs[:]=[x for x in subdirs if x.lower() not in exclude and not (Path(root)/x).is_symlink() and len(relative.parts)<9]
              for name in files:
                  p=Path(root)/name
                  if p.is_symlink() or not p.is_file() or p.suffix.lower() not in {".py",".php",".json",".yaml",".yml",".sh",".md"}:continue
                  source_files+=1
                  if name.startswith("test_") or any(x.lower().startswith("test") for x in relative.parts):continue
                  parsed=parse(p)
                  if parsed is None:continue
                  b,s,tree=parsed
                  old_total_bytes+=len(b)
                  matches=sorted(set(x.group(0).lower() for x in signal.finditer(s)))
                  rel=p.relative_to(vroot)
                  is_code=p.suffix.lower() in {".py",".php",".sh"}
                  is_agent_path=bool(signal.search(str(rel)))
                  if not matches and not is_agent_path:continue
                  if not is_code and not high_signal.search(str(rel)):continue
                  dst=active/rel
                  a=parse(dst) if dst.is_file() and not dst.is_symlink() else None
                  identical=a is not None and hashlib.sha256(a[0]).digest()==hashlib.sha256(b).digest()
                  sf=symbols(tree)
                  df=symbols(a[2]) if a is not None else set()
                  features=symbol_features(tree)
                  existing_features=symbol_features(a[2]) if a else {}
                  high_hits=sorted(set(x.group(0).lower() for x in high_signal.finditer(s)))
                  # Only identifiers, counts and flags are printed, never source or values.
                  category=("identical" if identical else "different" if a is not None else "missing")
                  categories[category]+=1
                  record={"path":str(rel),"kind":p.suffix,"status":category,
                          "old_bytes":len(b),"new_bytes":len(a[0]) if a else 0,
                          "old_sha256":hashlib.sha256(b).hexdigest()[:16],
                          "new_sha256":hashlib.sha256(a[0]).hexdigest()[:16] if a else None,
                          "old_features":features,"new_features":existing_features,
                          "old_symbols_only":sorted(sf-df)[:35],
                          "new_symbols_only":sorted(df-sf)[:35],
                          "gene_hits":high_hits[:18],
                          "agent_related":is_agent_path}
                  flagged.append(record)
          print("GENOME_SOURCE_FILES_INSPECTED="+str(source_files))
          print("GENOME_RELEVANT_MODULES="+str(len(flagged)))
          print("GENOME_IDENTICAL="+str(categories["identical"]))
          print("GENOME_DIFFERENT="+str(categories["different"]))
          print("GENOME_MISSING="+str(categories["missing"]))
          for item in flagged:
              if item["agent_related"] or item["gene_hits"] or item["status"]!="identical":
                  print("GENOME_MODULE="+json.dumps(item,ensure_ascii=False,separators=(",",":")))
          print("GENOME_ACTIVE_INDEPENDENT_MODULES")
          active_count=0
          for rel in ["core/agent_registry.py","core/orchestrator.py","core/autonomous_brain.py","core/master_agent_capability_pack.py","core/task_runtime.py","core/worker_runner.py","core/queue_dispatcher.py","scripts/vps_master_evolution_cycle.py"]:
              p=active/rel
              a=parse(p) if p.is_file() else None
              if not a:continue
              active_count+=1
              print("ACTIVE_INDEPENDENT_MODULE="+json.dumps({"path":rel,"bytes":len(a[0]),"symbols":sorted(symbols(a[2]))[:30],"version_markers":bool(re.search(r"version|generation|evolution|mutation|fitness",a[1],re.I))},separators=(",",":")))
          print("ACTIVE_INDEPENDENT_MODULE_COUNT="+str(active_count))
          for rel in ["portal/agent_engine.py","portal/agent_claims.py","portal/agent_run_lock.py","portal/agent_services.py","portal/management/commands/run_site_agents.py","portal/management/commands/run_site_master.py"]:
              p=active/rel
              o=vroot/rel
              if p.is_file() and o.is_file():
                  print("MAIN_AGENT_HASH_MATCH "+rel+"="+str(hashlib.sha256(p.read_bytes()).hexdigest()==hashlib.sha256(o.read_bytes()).hexdigest()))
          private=Path.home()/".private"/"zomorod-business"
          print("SITE_PRIVATE_AGENT_RUNNER_PRESENT="+str((private/"site_agents.php").is_file()))
          print("SITE_PRIVATE_AGENT_DB_PRESENT="+str((private/"site_agents.sqlite3").is_file()))
          print("GENOME_AUDIT_COMPLETE=read_only")
          PY
          REMOTE
      - name: Validate generation 12 to 64 dependency graph and test inventory (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import ast, hashlib, re, os, json
          src=Path.home()/"saeit_v91"/"zomorodmelal"/"site_master"
          app=Path.home()/"Saeit"
          assert src.is_dir() and (src/"vendor"/"master_gen64").is_dir()
          modules=list(sorted(src.rglob("*.py")))
          assert len(modules)>=60
          def names(tree):
              result=[]
              for n in ast.walk(tree):
                  if isinstance(n,ast.Import):
                      result += [a.name for a in n.names]
                  elif isinstance(n,ast.ImportFrom):
                      result += [("."+n.module if n.level and n.module else n.module or "") for a in n.names]
              return sorted(set(result))
          count=Counter()
          python_ok=0
          highrisk=[]
          detail=[]
          for p in modules:
              rel=p.relative_to(src)
              s=p.read_text(encoding="utf-8-sig")
              tree=ast.parse(s,filename=str(p))
              compile(tree,str(p),"exec")
              python_ok+=1
              imported=names(tree)
              role=rel.parts[1] if len(rel.parts)>2 and rel.parts[0]=="vendor" else "support"
              count[role]+=1
              risks=[]
              calls=[n.func for n in ast.walk(tree) if isinstance(n,ast.Call)]
              call_names=[]
              for n in calls:
                  if isinstance(n,ast.Name):call_names.append(n.id)
                  elif isinstance(n,ast.Attribute):call_names.append(n.attr)
              for flag in ("eval","exec","system","popen","Popen","remove","unlink","rmtree","subprocess","connect","urlopen","requests","post","delete","replace"):
                  if flag in call_names:risks.append(flag)
              if risks:highrisk.append((str(rel),risks))
              detail.append({"path":str(rel),"imports":imported[:14],"symbols":sorted({n.name for n in ast.walk(tree) if isinstance(n,(ast.ClassDef,ast.FunctionDef,ast.AsyncFunctionDef))})[:20]})
          print("GENE_PYTHON_FILES_SYNTAX_OK="+str(python_ok))
          print("GENE_GENERATIONS="+json.dumps(dict(count),sort_keys=True))
          print("GENE_IMPORT_INVENTORY="+json.dumps(detail,ensure_ascii=False,separators=(",",":")))
          print("GENE_STATIC_RISK_CALLS="+json.dumps(highrisk,separators=(",",":")))
          testfiles=[]
          for base in (Path.home()/"saeit_v91"/"zomorodmelal",Path.home()/"saeit_v91"):
              for dirpath,dirs,files in os.walk(base,followlinks=False):
                  depth=len(Path(dirpath).relative_to(base).parts)
                  dirs[:]=[x for x in dirs if x.lower() not in ("venv",".venv","site-packages",".git","node_modules","__pycache__","mojplaywin_site","mojplaywin") and depth<6]
                  for name in files:
                      if name.endswith(".py") and ("test" in name.lower() or "test" in str(Path(dirpath).relative_to(base)).lower()) and re.search(r"master|gen\d+|agent|evol|proof",name+" "+dirpath,re.I):
                          testfiles.append(str((Path(dirpath)/name).relative_to(Path.home()/"saeit_v91")))
          print("GENE_TEST_FILE_PATHS="+json.dumps(sorted(set(testfiles))[:100],ensure_ascii=False))
          for rel in ("site_master","portal/agent_engine.py","portal/management/commands/run_site_master.py"):
              p=app/rel
              print("ACTIVE_GENE_TARGET_EXIST="+rel+"="+str(p.exists()))
          print("GENE_DEPENDENCY_AUDIT_COMPLETE=read_only")
          PY
          REMOTE
      - name: Inspect generation API contracts and master command extension points
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast,json
          from pathlib import Path
          root=Path.home()/"Saeit"
          g=root/"agent_imports"/"v91_genomes"/"site_master"
          sources=[
              root/"portal/management/commands/run_site_master.py",
              root/"portal/agent_engine.py",
              g/"bridge.py",
              g/"vendor/master_gen56/controller.py",
              g/"vendor/master_gen56/risk.py",
              g/"vendor/master_gen56/slo.py",
              g/"vendor/master_gen56/learning.py",
              g/"vendor/master_gen64/controller.py",
              g/"vendor/master_gen64/cycles.py",
              g/"vendor/master_gen64/proof.py",
              Path.home()/"saeit_v91"/"zomorodmelal/tests_offline/test_v25_hosting_gen64.py"]
          for p in sources:
              if not p.is_file(): continue
              tree=ast.parse(p.read_text("utf-8-sig"))
              defs=[]
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      defs.append({"name":node.name,"args":[a.arg for a in node.args.args],"kw":[a.arg for a in node.args.kwonlyargs],"defaults":len(node.args.defaults),"body_nodes":len(node.body)})
                  if isinstance(node,ast.ClassDef):
                      methods=[]
                      for m in node.body:
                          if isinstance(m,(ast.FunctionDef,ast.AsyncFunctionDef)):
                              methods.append({"name":m.name,"args":[a.arg for a in m.args.args],"kw":[a.arg for a in m.args.kwonlyargs],"defaults":len(m.args.defaults),"body_nodes":len(m.body)})
                      defs.append({"class":node.name,"methods":methods})
              label=str(p.relative_to(root)) if p.is_relative_to(root) else "V91/"+str(p.name)
              print("GENOME_API="+json.dumps({"path":label,"definitions":defs},ensure_ascii=False,separators=(",",":")))
          print("GENOME_API_AUDIT_COMPLETE=read_only")
          PY
          REMOTE
      - name: Check public site baseline without mutation
        shell: bash
        run: |
          for path in / /agents/; do
            status="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "PUBLIC_HEALTH path=$path status=$status"
          done
      - name: Remove temporary SSH relay material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
