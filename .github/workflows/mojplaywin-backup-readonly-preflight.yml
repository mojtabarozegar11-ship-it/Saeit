name: MojPlayWin read-only backup transport preflight
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths:
      - ".github/workflows/mojplaywin-backup-readonly-preflight.yml"
permissions:
  contents: read
concurrency:
  group: mojplaywin-readonly-backup-preflight-20261017
  cancel-in-progress: false
jobs:
  readonly-transport:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/audit/mojplaywin-backup-transport-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify both remote command channels independently
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          echo "PHASE=vps-command"
          timeout 35s ssh -T -F "$d/config" saeit-vps 'printf "VPS_COMMAND_PASS\\n"'
          echo "PHASE=cpanel-command-via-relay"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel 'printf "CPANEL_COMMAND_PASS\\n"'
      - name: Read-only source prerequisites and bounded root size (no filenames)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 155s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import pathlib,shutil,subprocess,sys
          roots=[pathlib.Path("/home/zomorod2/Saeit-staging"),pathlib.Path("/home/zomorod2/mojplaywin.com")]
          for i,root in enumerate(roots,1):
              if root.is_symlink() or not root.is_dir():
                  print("SOURCE_ROOT_%s_MISSING_OR_UNSAFE"%i,flush=True); sys.exit(2)
              print("SOURCE_ROOT_%s_PRESENT"%i,flush=True)
          for cmd in ("tar","mariadb-dump","mariadb","uapi"):
              print("SOURCE_TOOL_%s=%s"%(cmd,"yes" if shutil.which(cmd) else "no"),flush=True)
          for i,root in enumerate(roots,1):
              try:
                  out=subprocess.run(["du","-skx",str(root)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=65,check=True)
                  print("SOURCE_ROOT_%s_KIB=%s"%(i,int(out.stdout.split()[0])),flush=True)
              except (subprocess.TimeoutExpired,ValueError,IndexError,subprocess.CalledProcessError):
                  print("SOURCE_ROOT_%s_SIZE_TIMEOUT_OR_ERROR"%i,flush=True);sys.exit(3)
          PY
      - name: Read-only VPS capacity and failed-partial inventory
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-vps 'python3 -' <<'PY'
          import os,pathlib,shutil
          h=pathlib.Path.home()
          s=os.statvfs(h)
          free=s.f_bavail*s.f_frsize
          backup=h/".private-mojplaywin-offhost-backups"
          partials=sum(1 for _ in backup.glob("mojplaywin_*.partial")) if backup.is_dir() else 0
          completed=sum(1 for _ in backup.glob("mojplaywin_*.gpg")) if backup.is_dir() else 0
          print("VPS_FREE_GIB=%s"%(free//(1024**3)))
          print("VPS_GPG_AVAILABLE=%s"%bool(shutil.which("gpg")))
          print("VPS_STALE_PARTIAL_COUNT=%s"%partials)
          print("VPS_COMPLETED_GPG_COUNT=%s"%completed)
          print("VPS_MINIMUM_14_GIB_CAPACITY_PASS=%s"%(free >= 14*1024**3))
          PY
      - name: Test only synthetic 1MiB stream cPanel to VPS via two SSH links
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          echo "PHASE=synthetic-cpanel-to-vps"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel "python3 -c 'import sys;sys.stdout.buffer.write(b\"A\"*1048576)'" |
            timeout 40s ssh -T -F "$d/config" saeit-vps "python3 -c 'import sys;d=sys.stdin.buffer.read();ok=(len(d)==1048576 and d==b\"A\"*1048576);print(\"SYNTHETIC_STREAM_PASS\" if ok else \"SYNTHETIC_STREAM_FAIL\",flush=True);sys.exit(0 if ok else 1)'"
          echo "Read-only synthetic channel check passed. NO real database, tar, archive, or restore attempted."
          echo "RELEASE_NO_GO: backup + isolated restore still required" >> "$GITHUB_STEP_SUMMARY"
