name: MR-2026-001 source-verified V5 exact Word for human scientific review
on:
  push:
    branches: [research/mr-2026-001-novelty-audit]
    paths:
      - .github/workflows/mr-2026-001-source-verified-v2-word-author-review.yml
      - research/manuscripts/MR-2026-001/MR-2026-001_DIRECT_IRRIGATION_ADHERENCE_PRIOR_ART_AUTHOR_REVIEW_V5_2026-10-26.md
      - research/manuscripts/MR-2026-001/C34_V5_DIRECT_ADHERENCE_PREDECESSOR_ADVERSARIAL_AI_REVIEW_2026-10-26.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce-exact-version-v5-author-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-locked mechanical review (not scientific acceptance)
        shell: bash
        run: |
          python - <<'PY'
          import re,hashlib
          from pathlib import Path
          p=Path('research/manuscripts/MR-2026-001/MR-2026-001_DIRECT_IRRIGATION_ADHERENCE_PRIOR_ART_AUTHOR_REVIEW_V5_2026-10-26.md')
          t=p.read_text(encoding='utf-8')
          a=t.split('## Abstract\n\n',1)[1].split('\n\n## ',1)[0]
          refs=t.split('## References\n\n',1)[1]
          doi=re.findall(r'https://doi.org/(10\.\S+)',refs)
          nums=[int(x) for x in re.findall(r'^(\d+)\. ',refs,re.M)]
          assert len(a.split())<250
          assert len(doi)==22 and len(set(doi))==22
          assert nums==list(range(1,23))
          assert '6. **Counterfactual attribution:**' in t
          assert '**Cross-cutting follow-up:**' in t
          assert '45/72 = 62.5%' in t
          assert '25% savings were independently metered' in t # explicit prohibited inference in table
          assert 'not a validated' in t.lower()
          assert '26+7+3+6+15+17' not in t
          assert 'TIDieR' in t and 'Carroll' in t
          assert '10.48130/tia-0026-0009' in t and '10.1016/j.agsy.2026.104867' in t
          assert all(x in t for x in ['10.1016/j.agwat.2024.108838','10.3390/w18172174','10.1002/ird.70098'])
          assert 'TIDieR/Carroll-informed extraction form' in t
          assert 'Darouich' in t and 'Tapsuwan' in t and 'MAGDA' in t
          assert '10.3390/agronomy14010066' in t and '10.1002/ird.1887' in t and '10.3390/rs17111855' in t
          assert 'weekly surveys' in t and 'not automatically an independently calibrated meter' in t
          assert 'not a validated' in t.lower()
          assert Path('research/manuscripts/MR-2026-001/C34_V5_DIRECT_ADHERENCE_PREDECESSOR_ADVERSARIAL_AI_REVIEW_2026-10-26.md').exists()
          print('V5 mechanical gates passed; abstract words',len(a.split()),'DOIs',len(doi),'SHA256',hashlib.sha256(t.encode()).hexdigest())
          PY
      - name: Build exact V5 Word using no-cost hosted tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pandoc
          fi
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          mkdir -p /tmp/mr-v5-author-review
          pandoc research/manuscripts/MR-2026-001/MR-2026-001_DIRECT_IRRIGATION_ADHERENCE_PRIOR_ART_AUTHOR_REVIEW_V5_2026-10-26.md \
            --from=gfm --to=docx --standalone \
            -o /tmp/mr-v5-author-review/MR-2026-001_EXACT_V5_AUTHOR_SCIENTIFIC_REVIEW.docx
          python - <<'PY'
          from docx import Document
          from docx.shared import Inches,Pt
          from pathlib import Path
          p=Path('/tmp/mr-v5-author-review/MR-2026-001_EXACT_V5_AUTHOR_SCIENTIFIC_REVIEW.docx')
          d=Document(p)
          for sec in d.sections:
              sec.top_margin=sec.bottom_margin=sec.left_margin=sec.right_margin=Inches(1)
          for style in d.styles:
              if style.type==1:
                  style.font.name='Arial'
                  style.font.size=Pt(12)
          for para in d.paragraphs:
              for run in para.runs:
                  run.font.name='Arial'
                  if not para.style.name.startswith('Heading'):
                      run.font.size=Pt(12)
          for tab in d.tables:
              for row in tab.rows:
                  for cell in row.cells:
                      for para in cell.paragraphs:
                          for run in para.runs:
                              run.font.name='Arial'
                              run.font.size=Pt(12)
          d.core_properties.title='What Does an Irrigation Recommendation Actually Change?'
          d.core_properties.author='Proposed human author approval pending'
          d.save(p)
          assert p.stat().st_size>20000 and len(d.tables)>=1
          print('EXACT V5 AUTHOR REVIEW WORD',p.stat().st_size,'bytes')
          PY
          cp research/manuscripts/MR-2026-001/C34_V5_DIRECT_ADHERENCE_PREDECESSOR_ADVERSARIAL_AI_REVIEW_2026-10-26.md /tmp/mr-v5-author-review/
          cp research/manuscripts/MR-2026-001/C27_AUTHOR_DECISION_DOSSIER_AND_VERIFIED_DISCOVER_AGRICULTURE_COST_GATE_2026-10-25.md /tmp/mr-v5-author-review/
          printf '%s\n' 'AUTHOR SCIENTIFIC REVIEW ONLY. V5 MAJOR REVISION. NO HUMAN AUTHOR APPROVAL. NO JOURNAL SUBMISSION OR APC COMMITMENT.' > /tmp/mr-v5-author-review/READ_ME_FIRST.txt
      - name: Preserve exact V5 manuscript and honest author-gate dossier
        uses: actions/upload-artifact@v5
        with:
          name: MR-2026-001-V5-author-scientific-review-NOT-SUBMITTED
          path: /tmp/mr-v5-author-review/
          retention-days: 14
          if-no-files-found: error
