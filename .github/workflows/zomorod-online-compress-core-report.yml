name: Online lossless compress of live report table with backup
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-online-compress-core-report.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-online-compress-core-report
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read MySQL table sizes using temporary local client config with no leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess,tempfile,os,re,json,urllib.parse
          home=Path.home()
          assert str(home)=="/home/zomorod2"
          envfile=home/"Saeit-staging/.env"
          assert envfile.is_file()
          raw=next((line.split("=",1)[1].strip().strip("'\"") for line in envfile.read_text().splitlines() if line.startswith("DATABASE_URL=")),None)
          assert raw and "mysql" in raw
          parsed=urllib.parse.urlsplit(raw)
          db=parsed.path.strip("/")
          assert db=="zomorod2_sites_main"
          opts={"user":urllib.parse.unquote(parsed.username or ""), "password":urllib.parse.unquote(parsed.password or ""), "host":parsed.hostname or "localhost", "port":str(parsed.port or 3306)}
          assert opts["user"] and opts["password"]
          with tempfile.TemporaryDirectory(prefix=".mysql-readonly-",dir=str(home/".cagefs/tmp")) as tmp:
              optfile=Path(tmp)/"client.cnf"
              def esc(v):return '"'+str(v).replace("\\","\\\\").replace('"','\\"')+'"'
              optfile.write_text("[client]\n"+"".join(f"{k}={esc(v)}\n" for k,v in opts.items()))
              optfile.chmod(0o600)
              backup=home/".backups/mysql-precompression-20261018.sql.gz"
              manifest=home/".backups/mysql-precompression-20261018.manifest.json"
              assert backup.is_file() and manifest.is_file()
              m=json.loads(manifest.read_text())
              assert m["database"]==db and m["gzip_crc_verified"] and backup.stat().st_size==m["compressed_bytes"]
              digest=__import__("hashlib").sha256()
              with backup.open("rb") as f:
                  for chunk in iter(lambda:f.read(4*1024*1024),b""):digest.update(chunk)
              assert digest.hexdigest()==m["sha256_gzip"]
              def query(sql,timeout=45):
                  r=subprocess.run(["mysql","--defaults-extra-file="+str(optfile),"--batch","--skip-column-names","--raw",db,"--execute",sql],capture_output=True,text=True,timeout=timeout)
                  if r.returncode!=0:raise RuntimeError("MYSQL_COMMAND_REJECTED_"+str(r.returncode)+" "+("permission" if "denied" in r.stderr.lower() else "unsupported_or_locked"))
                  return r.stdout.strip()
              table="core_report"
              before_rows=int(query("SELECT COUNT(*) FROM "+table))
              before=query("SELECT ROW_FORMAT,DATA_LENGTH+INDEX_LENGTH FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_NAME='"+table+"'")
              assert before.split("\t")[0].lower()=="dynamic"
              print("REPORT_ROWS_BEFORE="+str(before_rows))
              print("REPORT_TABLE_BEFORE="+before.replace("\t",":"))
              query("SET SESSION lock_wait_timeout=5; ALTER TABLE "+table+" ROW_FORMAT=COMPRESSED, KEY_BLOCK_SIZE=8, ALGORITHM=INPLACE, LOCK=NONE",600)
              after_rows=int(query("SELECT COUNT(*) FROM "+table))
              after=query("SELECT ROW_FORMAT,DATA_LENGTH+INDEX_LENGTH FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_NAME='"+table+"'")
              assert after.split("\t")[0].lower()=="compressed"
              assert after_rows>=before_rows-5, "LARGE_UNEXPECTED_ROW_LOSS"
              print("REPORT_ROWS_AFTER="+str(after_rows))
              print("REPORT_TABLE_AFTER="+after.replace("\t",":"))
              print("REPORT_ONLINE_LOCK_NONE_SUCCESS=yes")
              print("BACKUP_VERIFIED_AND_LIVE_RECORDS_PRESERVED=yes")
          print("REPORT_COMPRESSION_OPERATION_FINISHED=yes")
          PY
          REMOTE
      - name: Confirm site and agent portals after online storage change
        shell: bash
        run: |
          set -euo pipefail
          for u in https://zomorodmelal.ir/ https://zomorodmelal.ir/agents/ https://mojplaywin.com/; do
            c="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "$u" || true)"
            echo "REPORT_ONLINE_HEALTH=$u:$c"
            test "$c" = 200
          done
      - name: Delete SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
