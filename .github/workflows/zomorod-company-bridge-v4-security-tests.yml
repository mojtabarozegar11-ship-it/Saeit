name: Zomorod company private command bridge v4 security QA
on:
  push:
    branches: [feature/zomorod-command-bridge-private-v4-20261029]
    paths:
      - "scripts/zomorod_company_private_bridge_v4.py"
      - "scripts/test_zomorod_company_private_bridge_v4.py"
      - ".github/workflows/zomorod-company-bridge-v4-security-tests.yml"
  pull_request:
    paths:
      - "scripts/zomorod_company_private_bridge_v4.py"
      - "scripts/test_zomorod_company_private_bridge_v4.py"
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and private synthetic task bridge regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_company_private_bridge_v4.py scripts/test_zomorod_company_private_bridge_v4.py
          python3 scripts/test_zomorod_company_private_bridge_v4.py
