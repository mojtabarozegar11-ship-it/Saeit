name: Staff panel staging release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed Git revision to stage
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staff-staging-release
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Prepare archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/staff-release.tar.gz"
          sha256sum "$RUNNER_TEMP/staff-release.tar.gz"
      - name: Stage over existing SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/ssh/vps.key"
          printf '%s\n' "$HOST_KEY" | sed 's/\\n/\n/g' > "$RUNNER_TEMP/ssh/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$RUNNER_TEMP/ssh/host.known"
          chmod 600 "$RUNNER_TEMP/ssh/"*
          echo "SSH relay configuration must be validated before enabling staging upload."
