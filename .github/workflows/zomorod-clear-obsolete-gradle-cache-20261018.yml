name: Remove cached inactive Gradle wrapper distribution
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-clear-obsolete-gradle-cache-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-clean-legacy-gradle-cache
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Remove only rebuildable 19-day-old Gradle distribution cache, protect live site and source
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,shutil,time
          h=Path.home()
          assert h==Path("/home/zomorod2")
          root=h/".gradle/wrapper/dists"
          target=root/"gradle-8.10.2-bin"
          assert root.is_dir() and target.is_dir() and not root.is_symlink() and not target.is_symlink()
          assert time.time()-target.stat().st_mtime>10*86400
          assert (h/"Saeit/manage.py").is_file() and (h/"Saeit-staging/manage.py").is_file()
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10)
          proc=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10)
          assert str(target) not in cron.stdout and str(target) not in proc.stdout
          assert not any("gradle" in line.lower() and "bash -se" not in line for line in proc.stdout.splitlines())
          for directory,dirs,files in os.walk(target,followlinks=False):
              for name in dirs+files:
                  assert not (Path(directory)/name).is_symlink()
          r=subprocess.run(["du","-sk",str(target)],capture_output=True,text=True,timeout=40,check=True)
          before=int(r.stdout.split()[0])*1024
          assert 140_000_000<before<160_000_000
          shutil.rmtree(target)
          assert not target.exists() and root.is_dir()
          print("REBUILDABLE_GRADLE_DIST_CACHE_REMOVED=yes")
          print("GRADLE_CACHE_BYTES_FREED="+str(before))
          print("WEBSITES_VENV_SOURCE_AND_GRADLE_WRAPPER_CONFIG_UNCHANGED=yes")
          PY
          REMOTE
      - name: Verify public websites
        shell: bash
        run: |
          for u in "https://zomorodmelal.ir/" "https://mojplaywin.com/"; do
            c="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "$u" || true)"
            echo "GRADLE_CACHE_HEALTH=$u:$c"
            test "$c" = 200
          done
      - name: Clear runner identities
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
