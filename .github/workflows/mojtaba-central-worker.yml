name: mojtaba.bot.ai central cycle worker

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle A, B, C, D or E"
        required: true
        type: choice
        options: [A, B, C, D, E]
      queue_path:
        description: "Repository-relative JSON queue containing real actions"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  central-worker:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100

      - name: Execute evidence-gated cycle worker
        env:
          CYCLE: ${{ inputs.cycle }}
          QUEUE_PATH: ${{ inputs.queue_path }}
        run: |
          set -euo pipefail
          case "$CYCLE" in A|B|C|D|E) ;; *) echo "INVALID_CYCLE"; exit 2;; esac
          if [ -z "$QUEUE_PATH" ]; then
            QUEUE_PATH="$(python3 -c 'import json,sys; print(json.load(open("runtime/unified_master_stage_v1.json"))["queues"][sys.argv[1]])' "$CYCLE")"
          fi
          # Owner-approved repo-relative queues only; never accept absolute
          # paths, traversal or arbitrary workflow-supplied scripts.
          case "$QUEUE_PATH" in
            runtime/queue_A_books_mojplaywin.json|runtime/queue_B_research.json|runtime/queue_C_games_tokens.json|runtime/queue_D_products_services.json|runtime/queue_E_command_commercialization.json) ;;
            *) echo "UNTRUSTED_QUEUE_PATH"; exit 2;;
          esac
          test -f "$QUEUE_PATH"
          export FACTORY_VPS_RUNNER=1
          # Only read-only cPanel operations require an existing host secret.
          if python3 -c 'import json,sys; sys.exit(0 if any(x.get("kind")=="cpanel_readonly" for x in json.load(open(sys.argv[1]))) else 1)' "$QUEUE_PATH"; then
            export HOST_KEY="${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}"
            test -n "$HOST_KEY" || { echo "READONLY_CPANEL_SECRET_REQUIRED"; exit 2; }
          fi
          state="$HOME/.local/state/mojtaba.bot.ai/central_cycle_state.json"
          mkdir -p "$(dirname "$state")"
          python3 deploy/mojtaba_bot_cycle_worker.py \
            --cycle "$CYCLE" --queue "$QUEUE_PATH" --state "$state" \
            --run-id "$CYCLE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
