name: MojPlayWin evidence and VPS telemetry safety tests
on:
  push:
    branches: [feature/mpw-factory-private-telemetry-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated Django tests
        run: |
          pip install -r requirements.txt
          DJANGO_SETTINGS_MODULE=tests.mpw_evidence_ci_settings python -m django check
          DJANGO_SETTINGS_MODULE=tests.mpw_evidence_ci_settings python -m django test tests.test_mpw_evidence_metrics tests.test_mpw_factory_status --noinput -v 2
