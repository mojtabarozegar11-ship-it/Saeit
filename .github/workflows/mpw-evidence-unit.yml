name: MojPlayWin evidence metrics unit tests
on:
  push:
    branches: [feature/mpw-command-center-evidence-metrics-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated Django tests
        run: |
          pip install 'Django>=5.2,<6' 'djangorestframework>=3.16,<4'
          DJANGO_SETTINGS_MODULE=tests.mpw_evidence_ci_settings python -m django check
          DJANGO_SETTINGS_MODULE=tests.mpw_evidence_ci_settings python -m django test tests.test_mpw_evidence_metrics --noinput -v 2
