name: Port Android Ramadan War to the existing web game route
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zomorod-ramadan-war-web-card.yml', 'games/ramadan-war/**']
permissions:
  contents: read
concurrency:
  group: zm-ramadan-war-second-card
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      contains(github.event.head_commit.message, '[approved-zm-ramadan-card-live-20261022]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and validate complete immutable-source 3D models
        run: bash games/ramadan-war/fetch_verified_models.sh
      - name: Check the release marker, 3D client, vendored engine and scoped updater
        run: |
          set -euo pipefail
          test -s games/ramadan-war/index.html
          test -s games/ramadan-war/game.js
          test -s games/ramadan-war/game.css
          test -s games/ramadan-war/upgrade-policy.mjs
          test -s games/ramadan-war/moj1-commerce-policy.mjs
          test -s games/ramadan-war/input-guard.mjs
          test -s games/ramadan-war/missile-targets.mjs
          test -s games/ramadan-war/enemy-action-policy.mjs
          test -s games/ramadan-war/save-validation.mjs
          test -s games/ramadan-war/engine3d.js
          test -s games/ramadan-war/three.module.js
          test -s games/ramadan-war/three.core.min.js
          test -s games/ramadan-war/THREE-LICENSE.txt
          test -s games/ramadan-war/ASSET-CREDITS.md
          bash -n games/ramadan-war/fetch_verified_models.sh
          test -s games/ramadan-war/weapon-overlay.webp
          test -s games/ramadan-war/soldier-enemy.webp
          test -s games/ramadan-war/stone-wall.webp
          test -s games/ramadan-war/scene-desert.webp
          test -s games/ramadan-war/scene-sniper-desert-v2.webp
          test -s games/ramadan-war/scene-night.webp
          test -s games/ramadan-war/scene-airbase.webp
          test -s games/ramadan-war/soldier-rigged-ccby.glb
          test -s games/ramadan-war/m24-sniper-ccby.glb
          test -s games/ramadan-war/arms_basecolor.webp
          test -s games/ramadan-war/arms_normal.webp
          test -s games/ramadan-war/three-addons/loaders/GLTFLoader.js
          test -s games/ramadan-war/three-addons/utils/SkeletonUtils.js
          test -s games/ramadan-war/three-addons/utils/BufferGeometryUtils.js
          test -s games/ramadan-war/three-addons/libs/meshopt_decoder.module.js
          python3 -m py_compile games/ramadan-war/deploy.py
          node --check games/ramadan-war/site-smoke.cjs
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Check(HTMLParser): pass
          html=Path('games/ramadan-war/index.html').read_text(encoding='utf-8')
          assert Path('games/ramadan-war/route.htaccess').read_text(encoding='utf-8') == 'PassengerEnabled off\nDirectoryIndex index.html\n'
          Check().feed(html)
          assert html.count('ZM-RAMADAN-WAR-WEB-CARD-20261022') == 1
          assert '<script type="module" src="./game.js"></script>' in html and '<link rel="stylesheet" href="./game.css">' in html
          gamejs=Path('games/ramadan-war/game.js').read_text(encoding='utf-8')
          assert 'RamadanWarDebug' in gamejs and "from './engine3d.js'" in gamejs and not any(line.startswith('+') for line in gamejs.splitlines())
          engine=Path('games/ramadan-war/engine3d.js').read_text(encoding='utf-8')
          assert "from './three.module.js'" in engine and 'WebGLRenderer' in engine
          assert 'three.core.min.js' in Path('games/ramadan-war/three.module.js').read_text(encoding='utf-8')
          PY
          node --check games/ramadan-war/game.js
          node --check games/ramadan-war/engine3d.js
          node --check games/ramadan-war/three-addons/loaders/GLTFLoader.js
          node --check games/ramadan-war/three-addons/utils/SkeletonUtils.js
          node --check games/ramadan-war/three-addons/utils/BufferGeometryUtils.js
          node --check games/ramadan-war/three-addons/libs/meshopt_decoder.module.js
      - name: Validate staged web assets, module imports, and disabled commerce before relay
        run: |
          set -euo pipefail
          python3 -m unittest discover -s games/ramadan-war -p 'test_preview_runtime_deps.py' -v
          node --test tests/game/ramadan-input-guard.test.mjs tests/game/ramadan-save-validation.test.mjs
      - name: Reject unsafe rollback before any relay or production staging
        run: |
          set -euo pipefail
          python3 -m unittest discover -s games/ramadan-war -p 'test_deploy_rollback.py' -v
      - name: Test timed firing, special weapons and save resume before deployment
        run: |
          set -euo pipefail
          mkdir -p /tmp/ramadan-playwright && cd /tmp/ramadan-playwright
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 --directory games/ramadan-war > /tmp/ramadan-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          GAME_URL=http://127.0.0.1:8765/ NODE_PATH=/tmp/ramadan-playwright/node_modules node games/ramadan-war/site-smoke.cjs
      - name: Confirm the existing second card and nearby production routes before editing
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import json,re
          root='https://zomorodmelal.ir'
          for route in ['/','/topics/zm-r25/game-development/','/farm-wars/','/agriculture/','/research/']:
           with urlopen(Request(root+route,headers={'Cache-Control':'no-cache','User-Agent':'RamadanWarReleasePreflight/1'}),timeout=35) as r:
            assert r.status==200,(route,r.status)
            body=r.read(2600000) if route=='/' else b''
           print('PROTECTED_ROUTE_BEFORE',route,'200',flush=True)
           if route=='/':
            m=re.search(rb'window\.ZOMOROD_ORBIT_DATA=(\{.*?\});</script>',body,re.S)
            assert m,'live homepage manifest not found'
            data=json.loads(m.group(1));row=next(r for r in data['rows'] if r.get('id')=='ZM-R25')
            assert row['title']=='فناوری اطلاعات و خدمات دیجیتال' and len(row['cards'])>=24
            assert row['cards'][0]['id']=='ZM-R25-GAME-FARM-DOMINION-20261019'
            assert row['cards'][1]['id']=='ZM-R25-GAME-RAMADAN-WAR-20261022'
            assert row['cards'][1]['canonicalUrl']=='/ramadan-war/' and row['cards'][2]['id']=='ZM-R25-GAME-ARROW-ESCAPE-20261022' and row['cards'][2]['canonicalUrl']=='/arrow-escape/' and row['cards'][3]['slug']=='website-design'
          with urlopen(Request(root+'/ramadan-war/',headers={'Cache-Control':'no-cache','User-Agent':'RamadanWarWebPort/1'}),timeout=35) as r:
           assert r.status==200
           body=r.read(1000000)
          assert b'ZM-RAMADAN-WAR-WEB-CARD-20261022' in body
          print('EXISTING_GAME_ROUTE_BEFORE_UPDATE=PASS',flush=True)
          PY
      - name: Establish the pinned GitHub Actions to VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Transfer the replacement web client and scoped updater to private staging
        id: stage
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-ramadan-war-$GITHUB_RUN_ID"
          timeout 45s ssh -T -F "$d/config" host "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage/incoming'"
          timeout 45s ssh -T -F "$d/config" host "install -d -m 700 '$stage/incoming/three-addons/loaders' '$stage/incoming/three-addons/utils' '$stage/incoming/three-addons/libs'"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/deploy.py "host:$stage/incoming/deploy.py"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/index.html "host:$stage/incoming/index.html"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/route.htaccess "host:$stage/incoming/.htaccess"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/game.js "host:$stage/incoming/game.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/upgrade-policy.mjs "host:$stage/incoming/upgrade-policy.mjs"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/moj1-commerce-policy.mjs "host:$stage/incoming/moj1-commerce-policy.mjs"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/input-guard.mjs "host:$stage/incoming/input-guard.mjs"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/missile-targets.mjs "host:$stage/incoming/missile-targets.mjs"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/enemy-action-policy.mjs "host:$stage/incoming/enemy-action-policy.mjs"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/save-validation.mjs "host:$stage/incoming/save-validation.mjs"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/game.css "host:$stage/incoming/game.css"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/engine3d.js "host:$stage/incoming/engine3d.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/three.module.js "host:$stage/incoming/three.module.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/three.core.min.js "host:$stage/incoming/three.core.min.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/THREE-LICENSE.txt "host:$stage/incoming/THREE-LICENSE.txt"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/ASSET-CREDITS.md "host:$stage/incoming/ASSET-CREDITS.md"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/weapon-overlay.webp "host:$stage/incoming/weapon-overlay.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/soldier-enemy.webp "host:$stage/incoming/soldier-enemy.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/stone-wall.webp "host:$stage/incoming/stone-wall.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/scene-desert.webp "host:$stage/incoming/scene-desert.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/scene-sniper-desert-v2.webp "host:$stage/incoming/scene-sniper-desert-v2.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/scene-night.webp "host:$stage/incoming/scene-night.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/scene-airbase.webp "host:$stage/incoming/scene-airbase.webp"
          timeout 55s scp -q -F "$d/config" games/ramadan-war/soldier-rigged-ccby.glb "host:$stage/incoming/soldier-rigged-ccby.glb"
          timeout 55s scp -q -F "$d/config" games/ramadan-war/m24-sniper-ccby.glb "host:$stage/incoming/m24-sniper-ccby.glb"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/arms_basecolor.webp "host:$stage/incoming/arms_basecolor.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/arms_normal.webp "host:$stage/incoming/arms_normal.webp"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/three-addons/loaders/GLTFLoader.js "host:$stage/incoming/three-addons/loaders/GLTFLoader.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/three-addons/utils/SkeletonUtils.js "host:$stage/incoming/three-addons/utils/SkeletonUtils.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/three-addons/utils/BufferGeometryUtils.js "host:$stage/incoming/three-addons/utils/BufferGeometryUtils.js"
          timeout 50s scp -q -F "$d/config" games/ramadan-war/three-addons/libs/meshopt_decoder.module.js "host:$stage/incoming/three-addons/libs/meshopt_decoder.module.js"
          timeout 45s ssh -T -F "$d/config" host "python3 '$stage/incoming/deploy.py' prepare '$GITHUB_RUN_ID'"
      - name: Replace only game client files and preserve the second card
        id: publish
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-ramadan-war-$GITHUB_RUN_ID"
          timeout 75s ssh -T -F "$d/config" host "python3 '$stage/incoming/deploy.py' publish '$GITHUB_RUN_ID'"
          timeout 55s ssh -T -F "$d/config" host "python3 '$stage/incoming/deploy.py' verify '$GITHUB_RUN_ID'"
      - name: Verify the public game route and card order
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import json,re
          import time
          root='https://zomorodmelal.ir'
          game=None
          for attempt in range(1,11):
           try:
            with urlopen(Request(root+'/ramadan-war/?release='+str(time.time_ns()),headers={'Cache-Control':'no-cache,no-store','Pragma':'no-cache'}),timeout=35) as r:
             if r.status==200:game=r.read(1000000)
           except HTTPError as e:
            if e.code!=404:raise
           if game and b'ZM-RAMADAN-WAR-WEB-CARD-20261022' in game:break
           game=None;time.sleep(1)
          assert game,'new public route is still unavailable after ten fresh requests'
          assert b'canvas' in game and b'./game.js' in game and b'./game.css' in game
          with urlopen(Request(root+'/ramadan-war/game.js?asset='+str(time.time_ns()),headers={'Cache-Control':'no-cache,no-store'}),timeout=35) as r:js=r.read(250000)
          assert b'RamadanWarDebug' in js and b'engine3d.js' in js
          for asset,needle in [('engine3d.js',b'three.module.js'),('three.module.js',b'WebGLRenderer'),('three.core.min.js',b'Matrix4')]:
           with urlopen(Request(root+'/ramadan-war/'+asset+'?asset='+str(time.time_ns()),headers={'Cache-Control':'no-cache,no-store'}),timeout=35) as r:
            assert r.status==200;asset_body=r.read(1200000)
           assert needle in asset_body,asset
          with urlopen(Request(root+'/?ramadan_card='+str(time.time_ns()),headers={'Cache-Control':'no-cache,no-store'}),timeout=40) as r:
           data=r.read(2600000)
          d=json.loads(re.search(rb'window\.ZOMOROD_ORBIT_DATA=(\{.*?\});</script>',data,re.S).group(1))
          row=next(x for x in d['rows'] if x.get('id')=='ZM-R25')
          assert row['cards'][1]['id']=='ZM-R25-GAME-RAMADAN-WAR-20261022'
          assert row['cards'][1]['canonicalUrl']=='/ramadan-war/' and row['cards'][2]['id']=='ZM-R25-GAME-ARROW-ESCAPE-20261022' and row['cards'][2]['canonicalUrl']=='/arrow-escape/' and row['cards'][3]['slug']=='website-design'
          for asset in ['weapon-overlay.webp','soldier-enemy.webp','stone-wall.webp','scene-desert.webp','scene-sniper-desert-v2.webp','scene-night.webp','scene-airbase.webp']:
           with urlopen(Request(root+'/ramadan-war/'+asset+'?asset='+str(time.time_ns()),headers={'Cache-Control':'no-cache,no-store'}),timeout=35) as r:
            assert r.status==200 and len(r.read())>50000,asset
          print('LIVE_CARD_TWO_AND_GAME_ROUTE=PASS')
          PY
      - name: Reject stale or mixed-version public game assets by exact SHA-256
        run: python3 games/ramadan-war/verify_public_release.py
      - name: Test 3D rendering and campaign controls on desktop and mobile browsers
        run: |
          GAME_URL=https://zomorodmelal.ir/ramadan-war/ NODE_PATH=/tmp/ramadan-playwright/node_modules node games/ramadan-war/site-smoke.cjs
      - name: Restore the previous game client files after any deployment or browser failure
        if: failure() && steps.stage.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-ramadan-war-$GITHUB_RUN_ID"
          timeout 65s ssh -T -F "$d/config" host "python3 '$stage/incoming/deploy.py' rollback '$GITHUB_RUN_ID'"
