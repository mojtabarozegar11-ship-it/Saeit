name: Factory VPS Isolated State Snapshot
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-isolated-state-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Stream factory runtime state excluding secrets and historical backups
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-host 'bash -s' > "$RUNNER_TEMP/factory-state.tar.gz" <<'REMOTE'
          set -euo pipefail
          cd /home/zomorod2/Saeit-staging
          tar --warning=no-file-changed --exclude='astra-backups' --exclude='Saeit-Astra-Luna' --exclude='*.key' --exclude='*.pem' --exclude='*.env' --exclude='*.sqlite*' --exclude='*.db' --exclude='*.bak' --exclude='*.log' --exclude='*.lock' --exclude='*secret*' --exclude='*credential*' --exclude='*token*' -czf - var/factory/discovery var/factory/research
          REMOTE
          test -s "$RUNNER_TEMP/factory-state.tar.gz"
          tar -tzf "$RUNNER_TEMP/factory-state.tar.gz" | grep -q '^var/factory/discovery/'
          echo SOURCE_STATE_HASH
          sha256sum "$RUNNER_TEMP/factory-state.tar.gz"
          ssh -F "$d/config" saeit-vps 'mkdir -p "$HOME/factory-transfer-incoming" && chmod 700 "$HOME/factory-transfer-incoming"'
          cat "$RUNNER_TEMP/factory-state.tar.gz" | ssh -F "$d/config" saeit-vps 'cat > "$HOME/factory-transfer-incoming/factory-state-snapshot.tar.gz" && chmod 600 "$HOME/factory-transfer-incoming/factory-state-snapshot.tar.gz"'
          ssh -F "$d/config" saeit-vps 'echo DESTINATION_STATE_HASH; sha256sum "$HOME/factory-transfer-incoming/factory-state-snapshot.tar.gz"; echo STATE_FILE_COUNT; tar -tzf "$HOME/factory-transfer-incoming/factory-state-snapshot.tar.gz" | wc -l'
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay" "$RUNNER_TEMP/factory-state.tar.gz"
