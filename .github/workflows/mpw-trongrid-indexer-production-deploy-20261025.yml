name: Deploy safe paced TronGrid indexer 2026-10-25
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-trongrid-indexer-production-deploy-20261025.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-trongrid-indexer-live-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout immutable regression-tested indexer
        uses: actions/checkout@v4
        with:
          ref: 8045e5170b68e51a7a573393c05f0339326cc850
          persist-credentials: false
      - name: Gate source and verified offline regressions
        run: |
          set -euo pipefail
          test "$(sha256sum services/mpw_tron_readonly_deposit_candidates.py | awk '{print $1}')" = "9853deb6163b83b19575a096ebdc7e5cafac3b552ef83fc23fd80d3f1bbaa58c"
          python3 -m py_compile services/mpw_tron_readonly_deposit_candidates.py
          python3 -m unittest discover -s tests -p test_mpw_trongrid_rate_20261025.py -v
          python3 -m unittest discover -s tests -p test_mpw_tron_readonly_deposit_candidates.py -v
          python3 -m unittest discover -s tests -p test_mpw_tron_bounded_finalized_head_20261025.py -v
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage rate control adapter without touching production imports
        run: |
          set -euo pipefail
          scp -q -F "$RUNNER_TEMP/mpw-revenue-ssh/config" \
            services/mpw_tron_readonly_deposit_candidates.py \
            saeit-cpanel:/home/zomorod2/Saeit-staging/services/.mpw_tron_readonly_deposit_candidates.py.pending-20261025
      - name: Enforce pin backup atomic install and safe live indexer probe
        run: |
          set -euo pipefail
          timeout 125s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,stat,hashlib,shutil,importlib,urllib.parse
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          folder=app/'services'
          if app.is_symlink() or folder.is_symlink() or not app.is_dir() or not folder.is_dir():
              raise SystemExit('INDEXER_UNSAFE_APP_ROOT')
          live=folder/'mpw_tron_readonly_deposit_candidates.py'
          staged=folder/'.mpw_tron_readonly_deposit_candidates.py.pending-20261025'
          backup=folder/'.mpw_tron_readonly_deposit_candidates.py.pre-rate-20261025.bak'
          old='5390e08d9d67dab0fa48c501a53066acea42b66ea75fb431bafc8d4655376996'
          new='9853deb6163b83b19575a096ebdc7e5cafac3b552ef83fc23fd80d3f1bbaa58c'
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          if live.is_symlink() or staged.is_symlink() or backup.is_symlink() or not live.is_file() or not staged.is_file():
              raise SystemExit('INDEXER_UNSAFE_FILE')
          if digest(live)!=old or digest(staged)!=new:
              raise SystemExit('INDEXER_SOURCE_DRIFT_ABORTED')
          mode=stat.S_IMODE(live.stat().st_mode)
          if backup.exists():
              if not backup.is_file() or digest(backup)!=old:raise SystemExit('INDEXER_BACKUP_COLLISION')
          else:
              shutil.copy2(live,backup)
              if digest(backup)!=old:raise SystemExit('INDEXER_BACKUP_CHECK_FAILED')
          compile(staged.read_bytes(),str(staged),'exec')
          os.chmod(staged,mode)
          installed=False
          try:
              os.replace(staged,live)
              installed=True
              os.chdir(app);sys.path.insert(0,str(app))
              os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
              importlib.invalidate_caches()
              import django;django.setup()
              from core.models import PaymentIntent
              from services.mpw_walletless_commercial_intent import _decode,PROVIDER,WAITING
              from services.mpw_tron_readonly_deposit_candidates import fetch_page,ORIGIN,MAX_PAGE
              from services.mpw_trx_walletless_core import PaymentHold
              intent=PaymentIntent.objects.filter(provider=PROVIDER,status=WAITING).order_by('pk').first()
              if intent is None:raise RuntimeError('No existing invoice to verify indexer')
              inv=_decode(intent)
              params={'only_confirmed':'true','only_to':'true','limit':str(MAX_PAGE),
                      'min_block_timestamp':str(max(1,int(inv.issued_at.timestamp()*1000)-30000)),
                      'max_block_timestamp':str(int(inv.expires_at.timestamp()*1000)+30000),
                      'order_by':'block_timestamp,desc'}
              url=ORIGIN+'/v1/accounts/'+inv.recipient+'/transactions?'+urllib.parse.urlencode(params)
              page=fetch_page(url)
              if page.get('success') is not True or not isinstance(page.get('data'),list):
                  raise RuntimeError('Indexer JSON invalid')
              if digest(live)!=new:raise RuntimeError('Indexer source drift after install')
              print('MPW_TRONGRID_RATE_DEPLOY=VERIFIED_ACTIVE_INDEXER_JSON')
              print('MPW_TRONGRID_RATE_FINANCIAL_WRITES=ZERO')
          except BaseException:
              if installed:
                  rollback=folder/'.mpw_tron_readonly_deposit_candidates.py.rollback-20261025'
                  shutil.copy2(backup,rollback)
                  os.replace(rollback,live)
                  print('MPW_TRONGRID_RATE_DEPLOY=ROLLED_BACK_TO_PINNED_BASELINE')
              raise
          PY
      - name: Gracefully reload Passenger after verified rate control
        run: |
          set -euo pipefail
          timeout 30s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -c 'from pathlib import Path; p=Path(\"/home/zomorod2/mojplaywin.com/tmp/restart.txt\"); assert p.parent.is_dir() and not p.parent.is_symlink(); p.touch(); print(\"MPW_TRONGRID_PASSENGER_RELOAD_REQUESTED=TRUE\")'"
      - name: Verify live secure checkout still responds
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://mojplaywin.com/store/product/72/checkout/)"
          test "$code" = 200
          echo "MPW_TRONGRID_CHECKOUT_AFTER_FIX=HTTP_200"
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
