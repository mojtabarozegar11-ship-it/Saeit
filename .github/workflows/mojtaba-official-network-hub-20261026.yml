name: Mojtaba official central social and business hub
on:
  pull_request:
    paths:
      - .github/workflows/mojtaba-official-network-hub-20261026.yml
      - scripts/mojtaba_official_network_hub_20261026.py
      - tests/test_mojtaba_official_network_hub_20261026.py
      - content/mojtaba_official_social_registry_20261026.json
  push:
    branches: [main]
    paths:
      - .github/workflows/mojtaba-official-network-hub-20261026.yml
      - scripts/mojtaba_official_network_hub_20261026.py
      - tests/test_mojtaba_official_network_hub_20261026.py
      - content/mojtaba_official_social_registry_20261026.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojtaba-v17-inner-pages-production
  cancel-in-progress: false

jobs:
  tests:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate personal-only patch and official account registry
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_official_network_hub_20261026.py
          python3 -m unittest discover -s tests -p 'test_mojtaba_official_network_hub_20261026.py' -v

  publish:
    needs: tests
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original public entrypoints
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          for url in ('https://mojplaywin.com/mojtaba.roozegar/', 'https://mojplaywin.com/', 'https://zomorodmelal.ir/'):
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                  if r.status != 200:raise RuntimeError('Baseline not healthy: '+url)
                  if '/mojtaba.roozegar/' in url:
                      body=r.read(1500000).decode('utf-8','replace')
                      if not all(s in body for s in ('mpw-primary-personal-profile-20261016','mpw-complete-standard-20261019-toc','id="hero-title"')):
                          raise RuntimeError('Personal site structure changed')
              print('BASELINE_200='+url)
          PY
      - name: Establish pinned GitHub to VPS to cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-official-hub-ssh"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "HUB_SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Preflight and safely deploy to independent personal Django homepage
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-official-hub-stage-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$HUB_SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 60s scp -q -F "$HUB_SSH_CONFIG" scripts/mojtaba_official_network_hub_20261026.py "saeit-host:$stage/install.py"
          timeout 60s scp -q -F "$HUB_SSH_CONFIG" content/mojtaba_official_social_registry_20261026.json "saeit-host:$stage/registry.json"
          timeout 900s ssh -T -F "$HUB_SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          run_id="$1"
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          py="/home/zomorod2/mojtaba_personal/.venv_personal_test/bin/python"
          stage="/home/zomorod2/.mpw-official-hub-stage-$run_id"
          script="$stage/install.py"
          registry="$stage/registry.json"
          backup="/home/zomorod2/.backups/mojtaba-official-network-hub/$run_id"
          installed=0
          verified=0
          finalize(){
            code=$?
            trap - EXIT
            if test "$installed" = 1 && test "$verified" = 0 && test -f "$backup/manifest.json"; then
              "$py" "$script" rollback --run-id "$run_id" && echo "HUB_AUTO_ROLLBACK=success" || echo "HUB_REQUIRES_MANUAL_RECOVERY=YES"
              test -d "$app/tmp" && touch "$app/tmp/restart.txt" || true
            fi
            if test -d "$stage" && test ! -L "$stage"; then
              rm -f -- "$script" "$registry"
              rmdir -- "$stage" || true
            fi
            exit "$code"
          }
          trap finalize EXIT
          test -x "$py" && test -f "$app/manage.py" && test ! -L "$app"
          "$py" "$script" check --content "$registry"
          "$py" "$script" install --content "$registry" --run-id "$run_id"
          installed=1
          cd "$app"
          "$py" manage.py check
          "$py" - <<'PYDJANGO'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.test import Client
          from django.urls import reverse
          c=Client(HTTP_HOST='mojplaywin.com')
          for name in ('home','about','posts','projects','contact'):
              r=c.get(reverse('personal_site:'+name),secure=True)
              if r.status_code!=200:raise RuntimeError('PERSONAL_ROUTE_FAILED '+name)
              body=r.content.decode('utf-8','replace')
              mark='mpw-social-central-hub-20261026'
              if (mark in body)!=(name=='home'):
                  raise RuntimeError('HUB_ROUTE_SCOPE_FAILED '+name)
              print('PERSONAL_ROUTE_200='+name,flush=True)
          PYDJANGO
          test -d "$app/tmp" && touch "$app/tmp/restart.txt" || true
          "$py" - <<'PYHTTP'
          import time
          from urllib.request import urlopen,Request
          target='https://mojplaywin.com/mojtaba.roozegar/'
          required=('mpw-social-central-hub-20261026','https://zomorodmelal.ir/','https://mojplaywin.com/store/','mpw-complete-standard-20261019-toc')
          for attempt in range(6):
              try:
                  url=target+'?_hub='+str(attempt)
                  with urlopen(Request(url,headers={'Cache-Control':'no-cache','User-Agent':'OfficialHubReleaseCheck/1'}),timeout=22) as r:
                      data=r.read(1500000).decode('utf-8','replace')
                      if r.status!=200 or not all(term in data for term in required):
                          raise RuntimeError('Hub not visible in production')
                  print('PERSONAL_HUB_LIVE=PASS',flush=True)
                  break
              except Exception as exc:
                  if attempt==5:raise
                  print('PUBLIC_RETRY='+repr(exc),flush=True)
                  time.sleep(5)
          for url in ('https://mojplaywin.com/','https://zomorodmelal.ir/'):
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                  if r.status!=200:raise RuntimeError('Other site affected: '+url)
              print('OTHER_SITE_PRESERVED='+url,flush=True)
          PYHTTP
          verified=1
          echo "MOJTABA_HUB_RELEASE=verified"
          echo "PERSONAL_BACKUP=$backup"
          REMOTE
      - name: Remove ephemeral relay credentials
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-official-hub-ssh"
          test ! -d "$d" || rm -rf -- "$d"
