name: cPanel Django var logs and MySQL table metadata audit READ ONLY
on:
  pull_request:
    paths:
      - .github/workflows/cpanel-live-django-var-and-mysql-table-metadata-20261025.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Identify high volume live app logs and database tables without accessing customer records
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-incomplete-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          timeout 350s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,json,subprocess,time,shutil,heapq
          h=Path('/home/zomorod2')
          if os.geteuid()==0 or h.is_symlink() or Path.home()!=h:raise SystemExit('UNSAFE_CPANEL_IDENTITY')
          roots=['Saeit/var','Saeit/backups','Saeit-staging/var','Saeit-staging/releases']
          deep={}
          for rel in roots:
              root=h/rel
              if not root.is_dir() or root.is_symlink():continue
              try:
                  r=subprocess.run(['du','-x','-B1','--max-depth=2',str(root)],capture_output=True,text=True,timeout=110)
                  rows=[]
                  for line in r.stdout.splitlines():
                      if '\t' not in line:continue
                      a,b=line.split('\t',1)
                      try:size=int(a)
                      except ValueError:continue
                      rows.append({'path':str(Path(b).relative_to(h))[:130],'bytes':size})
                  deep[rel]={'ok':r.returncode==0,'rows':sorted(rows,key=lambda d:-d['bytes'])[:30]}
              except Exception as e:deep[rel]={'ok':False,'error':type(e).__name__}
          files=[]
          for rel in roots[:3]:
              root=h/rel
              if not root.is_dir() or root.is_symlink():continue
              for here,dirs,names in os.walk(str(root),followlinks=False):
                  dirs[:]=[x for x in dirs if not (Path(here)/x).is_symlink()]
                  for name in names:
                      p=Path(here)/name
                      if p.is_symlink() or not p.is_file():continue
                      st=p.stat()
                      if st.st_size>1024*1024:
                          files.append({'path':str(p.relative_to(h))[:145],'size':st.st_size,
                            'age_days':round((time.time()-st.st_mtime)/86400,1)})
          files=sorted(files,key=lambda d:-d['size'])[:45]
          binary=shutil.which('mysql') or shutil.which('mariadb')
          sql={'client_installed':bool(binary),'my_cnf_exists':(h/'.my.cnf').is_file()}
          if binary:
              query=("SELECT TABLE_NAME,DATA_LENGTH,INDEX_LENGTH,TABLE_ROWS,ENGINE FROM information_schema.TABLES "
                     "WHERE TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys') "
                     "ORDER BY DATA_LENGTH+INDEX_LENGTH DESC LIMIT 35")
              try:
                  x=subprocess.run([binary,'--batch','--skip-column-names','--connect-timeout=8','-e',query],
                      capture_output=True,text=True,timeout=35)
                  if x.returncode==0:
                      tbl=[]
                      for row in x.stdout.splitlines():
                          z=row.split('\t')
                          if len(z)>=5:
                              try:tbl.append({'table':z[0][:85],'data_bytes':int(z[1]),'index_bytes':int(z[2]),'approx_rows':int(z[3]) if z[3]!='NULL' else None,'engine':z[4][:20]})
                              except ValueError:continue
                      sql['metadata_access']=True
                      sql['top_table_sizes']=tbl
                  else:sql['metadata_access']=False
              except Exception as e:sql['metadata_access']=False
          print('CPANEL_APP_STORAGE_AND_MYSQL_TABLE_METADATA='+json.dumps({'deep':deep,'large_files':files,'sql':sql,'mutations':0,'read_only':True},sort_keys=True),flush=True)

          PY
          echo CPANEL_DJANGO_MYSQL_METADATA_READONLY=PASS
