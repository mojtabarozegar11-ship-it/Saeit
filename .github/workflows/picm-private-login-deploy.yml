name: PICM Private Account Login Production
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: picm-motion-browser-deploy-20261015
  cancel-in-progress: false
jobs:
  login:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: deploy PICM private login 2026-10-15'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm authentication tests before changing the live site
        env:
          SECRET_KEY: picm-test-secret
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          python -m py_compile core/picm_auth.py core/picm_access.py scripts/picm_bind_owner.py scripts/deploy_picm_login.py
          node --check templates/picm/free_motion.js
          pytest -q tests/test_picm_auth.py tests/test_picm_views.py
          python manage.py check
      - name: Configure pinned relay and cPanel SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/picm-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P '' -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$WORK/config" <<EOF
          Host picm-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          timeout 30s ssh -F "$WORK/config" picm-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$WORK/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat >> "$WORK/config" <<EOF
          Host picm-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump picm-vps
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
          EOF
          chmod 600 "$WORK/config"
          echo PICM_RELAY_READY
      - name: Verify MojPlayWin and create isolated deployment stage
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 40s ssh -F "$WORK/config" picm-host 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/Saeit-staging/core/picm_views.py && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py'
          timeout 20s ssh -F "$WORK/config" picm-host "install -d -m 700 /home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID"
          tar -cf "$RUNNER_TEMP/picm-login.tar" scripts/deploy_picm_login.py scripts/picm_bind_owner.py core/picm_auth.py core/picm_views.py core/picm_access.py templates/picm/login.html templates/picm/index.html templates/picm/free_motion.js
          scp -q -F "$WORK/config" "$RUNNER_TEMP/picm-login.tar" "picm-host:/home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID/archive.tar"
          timeout 40s ssh -F "$WORK/config" picm-host "tar -xf /home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID/archive.tar -C /home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID"
      - name: Securely bind PICM to existing sole non-admin owner
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 85s ssh -F "$WORK/config" picm-host "RUN_ID=$GITHUB_RUN_ID bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$(id -un)" = zomorod2
          cd /home/zomorod2/Saeit-staging
          for py in "$PWD/.venv/bin/python" "$PWD/venv/bin/python" /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python; do
            if test -x "$py" && "$py" -c 'import django' >/dev/null 2>&1; then
              DJANGO_SETTINGS_MODULE=config.settings "$py" "/home/zomorod2/.mojplaywin-picm-login-$RUN_ID/scripts/picm_bind_owner.py"
              exit 0
            fi
          done
          echo PICM_DJANGO_RUNTIME_MISSING
          exit 9
          REMOTE
      - name: Install login views, independent routes and templates
        id: install
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 70s ssh -F "$WORK/config" picm-host "python3 /home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID/scripts/deploy_picm_login.py deploy $GITHUB_RUN_ID"
      - name: Verify real HTTPS login and preservation of image studio
        id: smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 12); do
            a="$(curl -sS --max-time 15 -o "$RUNNER_TEMP/picm-auth.html" -w '%{http_code}' https://mojplaywin.com/picm/login/ || true)"
            b="$(curl -sS --max-time 15 -D "$RUNNER_TEMP/picm-entry.headers" -o /dev/null -w '%{http_code}' https://mojplaywin.com/picm/ || true)"
            c="$(curl -sS --max-time 15 -D "$RUNNER_TEMP/picm-workspace.headers" -o /dev/null -w '%{http_code}' https://mojplaywin.com/picm/workspace/ || true)"
            d="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://mojplaywin.com/picm/api/reference/ || true)"
            if [[ "$a" == 200 && "$b" == 302 && "$c" == 302 && "$d" == 405 ]] &&
              grep -Fq '<title>ورود به PICM | MojPlayWin</title>' "$RUNNER_TEMP/picm-auth.html" &&
              grep -Fiq 'location: /picm/login/' "$RUNNER_TEMP/picm-entry.headers" &&
              grep -Fiq 'location: /picm/login/' "$RUNNER_TEMP/picm-workspace.headers"; then
              echo PICM_FIRST_PAGE_LOGIN_HTTP_200
              echo PICM_ENTRY_REDIRECTS_TO_LOGIN_HTTP_302
              echo PICM_SECOND_WORKSPACE_REJECTS_UNAUTHENTICATED_HTTP_302
              echo PICM_REFERENCE_UPLOAD_ROUTE_EXISTS_GET_HTTP_405
              exit 0
            fi
            sleep 3
          done
          echo PICM_LOGIN_SMOKE_FAILED
          exit 1
      - name: Prove authenticated Django workbench renders free 60-second video engine
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 70s ssh -F "$WORK/config" picm-host 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          test "$(id -un)" = zomorod2
          cd /home/zomorod2/Saeit-staging
          for py in "$PWD/.venv/bin/python" "$PWD/venv/bin/python" /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python; do
            if test -x "$py" && "$py" -c 'import django' >/dev/null 2>&1; then
              "$py" - <<'PYTHON'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from types import SimpleNamespace
          from django.test import RequestFactory
          from core.picm_views import picm_workbench
          from core.picm_access import owner_id, owner_allowed
          bound = owner_id()
          assert bound is not None, "PICM_OWNER_BINDING_MISSING"
          owner = SimpleNamespace(is_authenticated=True, is_active=True, pk=int(bound))
          request=RequestFactory().get("/picm/workspace/")
          request.user=owner
          assert owner_allowed(owner)
          response=picm_workbench(request)
          assert response.status_code==200
          request.user=SimpleNamespace(is_authenticated=True,is_active=True,pk=-404404)
          assert picm_workbench(request).status_code==403
          print("PICM_UNRELATED_SIGNED_IN_USERS_DENIED")
          data=response.content.decode("utf-8")
          assert "captureStream(20)" in data
          assert "MediaRecorder" in data
          assert 'value="60" selected' in data
          assert 'id="video-options"' in data
          assert "video-cancel" in data
          assert 'action="/picm/logout/"' in data
          print("PICM_FREE_60S_MOTION_AUTHENTICATED_PAGE_RENDER_OK")
          PYTHON
              exit 0
            fi
          done
          echo PICM_DJANGO_RUNTIME_NOT_AVAILABLE
          exit 9
          REMOTE
      - name: Rollback only newly installed login if live check fails
        if: failure() && steps.install.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          WORK="$RUNNER_TEMP/picm-ssh"
          timeout 45s ssh -F "$WORK/config" picm-host "python3 /home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID/scripts/deploy_picm_login.py rollback $GITHUB_RUN_ID" || true
      - name: Remove temporary SSH and staging
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/picm-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/picm-ssh/config" picm-host "rm -rf /home/zomorod2/.mojplaywin-picm-login-$GITHUB_RUN_ID" || true
          fi
          rm -rf -- "$RUNNER_TEMP/picm-ssh" "$RUNNER_TEMP/picm-login.tar" "$RUNNER_TEMP/picm-auth.html" "$RUNNER_TEMP/picm-page.html" "$RUNNER_TEMP/picm-entry.headers" "$RUNNER_TEMP/picm-workspace.headers"
