name: MojPlayWin native TRX micro-priced real PDF trial isolated release
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-native-trx-micro-trial-release-20261020.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-main-isolated-real-micro-trx-trial
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify guarded trial PDF generator and compile
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_native_trx_micro_trial_release_20261020.py
          python3 scripts/mpw_native_trx_micro_trial_release_20261020.py selftest
      - name: Baseline main and sibling public sites
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          routes=("/", "/store/", "/taniya/", "/farnaz/", "/saman/", "/picm/", "/zahra/")
          for route in routes:
              req=urllib.request.Request("https://mojplaywin.com"+route, headers={"User-Agent":"MPWMicroTRXTrial/1"})
              try:
                  with urllib.request.urlopen(req,timeout=16) as r:status=r.status
              except urllib.error.HTTPError as e:status=e.code
              print("MPW_MICRO_BASELINE="+json.dumps({"route":route,"status":status}))
              if status!=200 and not (route=="/zahra/" and status==404):raise RuntimeError("Protected public route unhealthy: "+route)
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Preview one-page isolated private PDF and temporary USD 0.03 test listing
        run: |
          set -euo pipefail
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preview" < scripts/mpw_native_trx_micro_trial_release_20261020.py
      - name: Inspect current trial detail resolver and product state without writes
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,inspect,json
          os.chdir("/home/zomorod2/Saeit-staging")
          sys.path.insert(0,os.getcwd())
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.urls import resolve
          from django.test import Client
          from core.models import Product
          for pk in (72,225,779,879):
              v=Product.objects.filter(pk=pk).values("id","active","price","currency","knowledge_article__published","product_type").first()
              path="/store/product/%s/"%pk
              try:
                  match=resolve(path)
                  handler=match.func
                  name=handler.__module__+"."+handler.__name__
                  code=inspect.getsource(handler)
                  if pk==779: print('MPW_TRIAL_LIVE_VIEW_SOURCE='+code[:6000].replace(chr(10),'\\n'))
                  selected=[line.strip() for line in code.splitlines() if any(term in line.lower() for term in ("get_object_or_404","filter(","404","active","published","product","redirect","allowlist","whitelist","guard","pk"))]
                  status=Client(raise_request_exception=False).get(path,secure=True,HTTP_HOST="mojplaywin.com").status_code
                  print("MPW_TRIAL_ROUTE_DIAGNOSTIC="+json.dumps({"pk":pk,"product":v,"handler":name,"code_lines":selected[:36],"status":status},default=str))
              except Exception as e:
                  print("MPW_TRIAL_ROUTE_DIAGNOSTIC_ERROR="+repr(e))
          from django.urls import resolve
          from django.conf import settings
          for path in ("/commerce/book/779/","/store/product/779/"):
              match=resolve(path)
              print("MPW_TRIAL_GATE_ROUTE="+json.dumps({"path":path,"func":match.func.__module__+"."+match.func.__name__,"anonymous_http":Client(raise_request_exception=False).get(path,secure=True,HTTP_HOST="mojplaywin.com").status_code}))
          from mpw_commerce.product_checkout_page import approved_for_checkout,product_checkout_page
          print("MPW_TRIAL_CHECKOUT_APPROVAL_SOURCE="+inspect.getsource(approved_for_checkout)[:5500].replace(chr(10),"\\n"))
          import importlib
          for name in settings.MIDDLEWARE:
              mod,cls=name.rsplit(".",1)
              try: code=inspect.getsource(getattr(importlib.import_module(mod),cls))
              except (OSError,AttributeError,ImportError): continue
              if ("779" in code or "CANARY_PRODUCT" in code):
                  print("MPW_TRIAL_MIDDLEWARE_CANARY="+json.dumps({"middleware":name,"lines":[x.strip() for x in code.splitlines() if "779" in x or "CANARY_PRODUCT" in x]}))
          PY
      - name: Create real test listing, never modify originals or payment ledger
        id: publish_sample
        run: |
          set -euo pipefail
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - publish" < scripts/mpw_native_trx_micro_trial_release_20261020.py
      - name: Verify real Django checkout eligibility and PDF file integrity
        run: |
          set -euo pipefail
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify" < scripts/mpw_native_trx_micro_trial_release_20261020.py
      - name: Verify main and sibling websites remain intact
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          for route in ("/","/store/","/taniya/","/farnaz/","/saman/","/picm/","/zahra/"):
              req=urllib.request.Request("https://mojplaywin.com"+route,headers={"Cache-Control":"no-cache","User-Agent":"MPWMicroTRXTrial/1"})
              try:
                  with urllib.request.urlopen(req,timeout=16) as r:status=r.status
              except urllib.error.HTTPError as e:status=e.code
              print("MPW_MICRO_POST_HTTP="+json.dumps({"route":route,"status":status}))
              if status!=200 and not (route=="/zahra/" and status==404):raise RuntimeError("Protected sibling changed unexpectedly: "+route)
          PY
      - name: Roll back only unsold trial listing on failed release
        if: failure() && steps.publish_sample.outcome == 'success'
        run: |
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback" < scripts/mpw_native_trx_micro_trial_release_20261020.py
      - name: Locate exact active product-detail CTA template for trial only
        run: |
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,inspect
          from pathlib import Path
          ROOT=Path('/home/zomorod2/Saeit-staging');os.chdir(ROOT);sys.path.insert(0,str(ROOT))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.urls import resolve
          for route in ('/store/product/779/','/commerce/book/779/'):
              match=resolve(route);fn=inspect.unwrap(match.func)
              print('MPW_MICRO_CTA_ROUTE='+json.dumps({'route':route,'module':fn.__module__,'function':fn.__name__}))
              source=inspect.getsource(fn)
              safe=[s[:180] for s in source.splitlines() if any(z in s.lower() for z in ('template','render(', 'checkout','product', 'login'))]
              print('MPW_MICRO_CTA_HANDLER='+json.dumps({'route':route,'lines':safe[:45]}))
          for parent in (ROOT/'core/templates',ROOT/'mpw_commerce/templates'):
              if not parent.is_dir() or parent.is_symlink():continue
              for p in parent.rglob('*.html'):
                  if p.is_symlink() or not p.is_file():continue
                  t=p.read_text('utf8','replace')
                  keys=('Enquire about this product','Contact MojPlayWin to confirm','Secure order path.')
                  for key in keys:
                      pos=t.find(key)
                      if pos>=0:
                          print('MPW_MICRO_CTA_TEMPLATE='+json.dumps({'path':str(p.relative_to(ROOT)),'key':key,'snippet':t[max(0,pos-800):pos+700]}))
                          break
          print('MPW_MICRO_CTA_INSPECTION=PASS')
          PY
      - name: Remove temporary SSH relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"
# Owner-directed revalidation of the existing USD 0.03 native-TRX test SKU, 2026-10-26.
