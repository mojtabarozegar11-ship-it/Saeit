name: Zomorod scoped author URL Android 500 static route canary
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-author-utm-500-static-canary.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-author-profile-utm-canary
  cancel-in-progress: false
jobs:
  author-route-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and exact scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          path=Path("scripts/zomorod_author_utm_static_rewrite_20261028.py")
          source=path.read_text()
          compile(source,str(path),"exec")
          assert 'RewriteRule ^authors/mojtaba-rozegar/?$ /authors/mojtaba-rozegar/index.html [L,NC]' in source
          assert "ROLLBACK_CONCURRENT_CHANGE" in source
          print("AUTHOR_CANARY_SOURCE_GUARDS=passed")
          PY
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Guarded route change and automatic rollback on failed checks
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          script="scripts/zomorod_author_utm_static_rewrite_20261028.py"
          remote() {
            ssh -F "$d/config" saeit-cpanel python3 - "$1" < "$script"
          }
          applied=0
          rollback_on_error() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$applied" = 1 ]; then
              echo "AUTHOR_CANARY_RESULT=failed_rolling_back"
              remote rollback || echo "AUTHOR_CANARY_ROLLBACK=manual_attention_required"
            fi
          }
          trap rollback_on_error EXIT
          remote plan
          for path in / /api/health/ /authors/mojtaba-rozegar/index.html; do
            code="$(curl -sS -L --max-time 18 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "AUTHOR_BASELINE path=$path code=$code"
            test "$code" = 200
          done
          remote apply
          applied=1
          sleep 2
          for path in / /api/health/ /about/ /authors/mojtaba-rozegar/ /authors/mojtaba-rozegar/index.html '/authors/mojtaba-rozegar/?utm_source=chatgpt.com'; do
            code="$(curl -sS -L --max-time 20 -A 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36' -H 'Accept-Language: fa-IR,fa;q=0.9,en-US;q=0.8' -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "AUTHOR_AFTER path=$path code=$code"
            test "$code" = 200
          done
          for count in 1 2 3; do
            code="$(curl -sS -L --max-time 20 -A 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36' -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/authors/mojtaba-rozegar/?utm_source=chatgpt.com&canary=$count" || true)"
            echo "AUTHOR_TRACKED_ANDROID_CANARY=$count code=$code"
            test "$code" = 200
          done
          remote status
          echo "AUTHOR_CANARY_RESULT=passed_one_route_only"
          applied=0
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
