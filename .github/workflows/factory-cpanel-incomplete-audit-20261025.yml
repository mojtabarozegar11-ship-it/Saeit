name: Read only cPanel staging and account storage audit
on:
  pull_request:
    paths:
      - .github/workflows/factory-cpanel-incomplete-audit-20261025.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect cPanel account storage through pinned VPS relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-incomplete-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          timeout 240s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          import os,shutil,json,subprocess
          from pathlib import Path
          h=Path("/home/zomorod2")
          if h.is_symlink() or not h.is_dir() or Path.home()!=h:raise SystemExit("CPANEL_HOME_UNSAFE")
          def sz(p):
              if not p.exists() or p.is_symlink():return None
              try:return int(subprocess.run(["du","-s","-B1","--",str(p)],capture_output=True,text=True,check=True,timeout=32).stdout.split()[0])
              except Exception:return None
          dirs=[p for p in h.iterdir() if p.is_dir() and not p.is_symlink()]
          sizes={p.name:sz(p) for p in dirs}
          top=sorted(sizes.items(),key=lambda a:-(a[1] if a[1] is not None else -1))[:27]
          staging=h/"Saeit-staging"
          stag=[]
          if staging.is_dir() and not staging.is_symlink():
              for p in sorted(staging.iterdir())[:70]:
                  if p.is_dir() and not p.is_symlink():stag.append({"name":p.name,"bytes":sz(p),"immediate":len(list(p.iterdir()))})
          quota=subprocess.run(["uapi","--output=json","Quota","get_quota_info"],capture_output=True,text=True,timeout=22)
          q={}
          if quota.returncode==0:
              x=json.loads(quota.stdout).get("result",{}).get("data",{})
              q={k:v for k,v in x.items() if isinstance(v,(int,float,str,bool)) and any(z in k.lower() for z in ("quota","limit","used","byte","percent","mb"))}
          print("CPANEL_INCOMPLETE_READ_ONLY="+json.dumps({"mount_free_gib":round(shutil.disk_usage(h).free/2**30,3),"home_top":top,"staging_families":stag,"quota":q,"paths_deleted":0,"storefronts_untouched":True},sort_keys=True))
          PY
          rm -rf "$d"
