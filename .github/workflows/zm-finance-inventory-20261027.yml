name: Inspect ZM financial services path
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zm-finance-inventory-20261027.yml']
permissions:
  contents: read
concurrency:
  group: zm-finance-isolated
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read target and deployment instructions
        run: |
          timeout 120s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request
          root=Path('/home/zomorod2/public_html')
          for p in [Path('/AGENTS.md'),Path('/home/AGENTS.md'),Path('/home/zomorod2/AGENTS.md'),root/'AGENTS.md',root/'$$zm'/'AGENTS.md']:
              if p.is_file():print('INSTRUCTIONS',str(p),p.read_text()[:16000])
          target=root/'$$zm'
          print('TARGET_EXISTS',target.exists(),'SYMLINK',target.is_symlink())
          if target.is_dir() and not target.is_symlink():
              for p in sorted(target.rglob('*')):
                  if p.is_file() and not p.is_symlink():
                      print('FILE',str(p.relative_to(target)),p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
                      if p.suffix in ('.html','.css','.js') and p.stat().st_size<40000: print('SOURCE',p.name,p.read_text())
          for url in ['https://zomorodmelal.ir/','https://zomorodmelal.ir/%24%24zm/']:
              try:
                  with urllib.request.urlopen(url,timeout=25) as r:print('HTTP',url,r.status,r.read(300).decode('utf-8','replace'))
              except Exception as e:print('HTTP_ERROR',url,str(e))
          
          PY
      - name: Remove temporary keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-structure-ssh"
