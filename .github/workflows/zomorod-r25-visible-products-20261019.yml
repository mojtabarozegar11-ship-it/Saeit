name: Zomorod R25 Show Products In Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zomorod-r25-visible-products-20261019.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zm-r25-visible-products-20261019
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[approved-r25-visible-products-20261019]'))
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test product placement without deleting original text
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_r25_product_visibility_20261019.py
          python3 - <<'PY'
          import importlib.util
          p='scripts/zomorod_r25_product_visibility_20261019.py'
          spec=importlib.util.spec_from_file_location('visibility',p)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          slug='website-design'
          begin='<!-- ZM-IT-PRODUCT-20261019:'+slug+':BEGIN -->'
          end='<!-- ZM-IT-PRODUCT-20261019:'+slug+':END -->'
          html=('<html><main><h1>عنوان کارت</h1><p>مقاله علمی قدیمی</p><h2>بخش پژوهش</h2>'+
                begin+'<section><h2>محصول دیجیتال</h2><iframe loading="lazy" src="/digital-lab/?tool='+slug+'"></iframe></section>'+end+
                '</main></html>').encode()
          after=module.transform(html,slug)
          assert after.index(begin.encode())<after.index(b'<p>')<after.index(b'<h2')
          assert after.count(begin.encode())==1
          assert b'loading="eager"' in after
          assert b'ZM-R25-VISIBLE-20261019:START' in after
          assert 'مقاله علمی قدیمی'.encode() in after
          print('VISIBLE_PRODUCT_LOCAL_TEST=PASS')
          PY
      - name: Ensure the existing 21 products are deployed before moving them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          base='https://zomorodmelal.ir'
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(base+u,headers={'User-Agent':'ZM-R25-Visibility'}),timeout=35) as r:
                  assert r.status==200
                  return r.read(240000).decode('utf-8','replace')
          cards=[c for c in json.loads(get('/topics/topic-manifest.json'))['topics'] if c['row']=='ZM-R25']
          assert len(cards)==21
          for c in cards:
              slug=c['path'].split('/')[-2];p=get(c['path'])
              assert 'ZM-IT-PRODUCT-20261019:'+slug+':BEGIN' in p,slug
              assert '/digital-lab/?tool='+slug in p,slug
          assert 'ZOMOROD DIGITAL LAB' in get('/digital-lab/?tool=seo')
          assert 'FARM DOMINION' in get('/farm-wars/')
          print('21_ORIGINAL_PRODUCTS_AND_GAME=PASS',flush=True)
          PY
      - name: Connect authorized pinned VPS SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Back up and stage 21 tagged pages
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-r25-visibility-$GITHUB_RUN_ID"
          timeout 45s ssh -T -F "$d/config" host "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          timeout 45s scp -q -F "$d/config" scripts/zomorod_r25_product_visibility_20261019.py "host:$stage/visibility.py"
          timeout 100s ssh -T -F "$d/config" host "python3 '$stage/visibility.py' prepare '$GITHUB_RUN_ID'"
      - name: Make all 21 product panels visible directly below page headings
        id: install
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-r25-visibility-$GITHUB_RUN_ID"
          timeout 120s ssh -T -F "$d/config" host "python3 '$stage/visibility.py' install '$GITHUB_RUN_ID'"
          timeout 75s ssh -T -F "$d/config" host "python3 '$stage/visibility.py' verify '$GITHUB_RUN_ID'"
      - name: Confirm 21 products visibly precede long articles on live website
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://zomorodmelal.ir'
          def get(route):
              for n in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base+route,headers={'User-Agent':'ZmR25VisibleLiveQA','Cache-Control':'no-cache'}),timeout=35) as r:
                          assert r.status==200
                          return r.read(240000).decode('utf-8','replace')
                  except Exception:
                      if n==3: raise
                      time.sleep(3)
          cards=[c for c in json.loads(get('/topics/topic-manifest.json'))['topics'] if c['row']=='ZM-R25']
          assert len(cards)==21
          for c in cards:
              slug=c['path'].split('/')[-2]
              page=get(c['path'])
              begin='<!-- ZM-IT-PRODUCT-20261019:'+slug+':BEGIN -->'
              assert page.count(begin)==1,slug
              assert page.count('ZM-R25-VISIBLE-20261019:START')==1,slug
              assert page.index(begin)<page.index('<h2'),slug
              assert '/digital-lab/?tool='+slug in page,slug
              print('VISIBLE=PASS '+slug,flush=True)
          assert 'FARM DOMINION' in get('/farm-wars/')
          print('VISIBLE_R25_PRODUCTS_21_AND_GAME_PASS',flush=True)
          PY
      - name: Restore originals on release failure
        if: failure() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-r25-visibility-$GITHUB_RUN_ID"
          if test -f "$d/config"; then
            timeout 120s ssh -T -F "$d/config" host "test -f '$stage/state.json' && python3 '$stage/visibility.py' rollback '$GITHUB_RUN_ID'" || true
          fi
      - name: Clean private backup after full live verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          stage="/home/zomorod2/.zm-r25-visibility-$GITHUB_RUN_ID"
          timeout 85s ssh -T -F "$d/config" host "python3 '$stage/visibility.py' cleanup '$GITHUB_RUN_ID'"
      - name: Remove ephemeral SSH keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/farm-v4-ssh"
