name: Restore agriculture landing page without Django
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-agriculture-static-canary.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-agriculture-static
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Back up agriculture config and test static Passenger isolation
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          web="$HOME/public_html"
          root="$web/index.html"
          root_config="$web/.htaccess"
          agriculture="$web/agriculture"
          target="$agriculture/.htaccess"
          backup="$HOME/.backups/zomorod-agriculture-static-canary/$sha"
          test -f "$root" && test -f "$root_config" && test -f "$agriculture/index.html"
          test -d "$agriculture" && ! test -L "$agriculture"
          test ! -L "$target"
          test "$(stat -c %U "$agriculture")" = "$USER"
          for rel in mohammad/ ghanadi/ amozeshgah/; do
            test -s "$web/$rel/index.html" || exit 1
          done
          mkdir -p "$(dirname "$backup")"
          test ! -e "$backup" && mkdir -m 700 "$backup"
          sha256sum "$root" "$root_config" \
            "$web/mohammad/index.html" \
            "$web/ghanadi/index.html" \
            "$web/amozeshgah/index.html" > "$backup/immutable.sha256"
          if test -e "$target"; then
            cp -p "$target" "$backup/previous.htaccess"
            cmp -s "$target" "$backup/previous.htaccess"
          fi
          rollback() {
            set +e
            if test -f "$backup/previous.htaccess"; then
              cp -p "$backup/previous.htaccess" "$target.rollback"
              mv -f "$target.rollback" "$target"
            else
              rm -f "$target"
            fi
            echo "AGRICULTURE_CANARY_ROLLBACK=complete"
          }
          active=1
          trap 'rc=$?; trap - EXIT; if test "$active" = 1; then rollback; fi; exit "$rc"' EXIT
          cat > "$target.new" <<'HT'
          # Static agriculture pages do not start the main Django Passenger app.
          PassengerEnabled off
          DirectoryIndex index.html
          RewriteEngine On
          RewriteRule ^$ index.html [END]
          HT
          chmod 644 "$target.new"
          mv -f "$target.new" "$target"
          code="$(curl -sS -L --max-time 28 -H 'Cache-Control: no-cache' -o "$backup/agriculture-response.html" -w '%{http_code}' "https://zomorodmelal.ir/agriculture/?__static_canary=$sha" || true)"
          echo "AGRICULTURE_STATIC_CANARY_HTTP=$code"
          test "$code" = 200
          grep -Fq '<!-- saeit-zomorod-agriculture-v1 -->' "$backup/agriculture-response.html"
          for route in / /mohammad/ /ghanadi/ /amozeshgah/; do
            code="$(curl -sS -L --max-time 22 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
            echo "PROTECTED_ROUTE $route $code"
            test "$code" = 200
          done
          sha256sum -c --status "$backup/immutable.sha256"
          echo "IMMUTABLE_ROOT_AND_SUBSITES=verified"
          active=0
          trap - EXIT
          echo "AGRICULTURE_STATIC_CANARY=success"
          REMOTE
      - name: Remove ephemeral SSH relay material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
