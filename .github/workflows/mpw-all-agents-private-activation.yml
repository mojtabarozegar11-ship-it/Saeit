name: MojPlayWin all private agents actual live audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-all-agents-private-activation.yml]
  schedule:
    - cron: "37 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-all-agents-private-control
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Current main does not contain the historical private robot sources/tests.
          # Pin reviewed agent bundle with scalable editorial checks; no live-site edits.
          ref: 9dbc0e471a33179eb53a2445ae34ebdde20f495c
      - name: Offline safety and functional tests for five robots
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_main_private_execution_robots.py -v
          python3 -m py_compile scripts/mpw_main_private_execution_robots.py scripts/mpw_install_private_execution_robots_cpanel.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Run extended robots offline tests and syntax
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_main_extended_robots.py -v
          python3 -m py_compile scripts/mpw_main_extended_robots.py
      - name: Package six additional private robots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,tarfile
          from pathlib import Path
          raw=Path("scripts/mpw_main_extended_robots.py").read_bytes()
          manifest=json.dumps({"tenant":"mojplaywin-main","scope":"mpw_six_main_readonly_execution_robots","sha256":hashlib.sha256(raw).hexdigest()}).encode()
          with tarfile.open("/tmp/mpw-six-private-robots.tgz","w:gz") as tar:
              for name,body in (("runner.py",raw),("manifest.json",manifest)):
                  member=tarfile.TarInfo(name)
                  member.size=len(body)
                  member.mode=0o600
                  tar.addfile(member,io.BytesIO(body))
          assert Path("/tmp/mpw-six-private-robots.tgz").stat().st_size < 37000
          PY
      - name: Package pinned, private-only robot source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,tarfile
          from pathlib import Path
          source=Path("scripts/mpw_main_private_execution_robots.py").read_bytes()
          manifest=json.dumps({"tenant":"mojplaywin-main",
              "scope":"five_main_site_only_private_execution_robots",
              "runner_sha256":hashlib.sha256(source).hexdigest()},sort_keys=True).encode()
          with tarfile.open("/tmp/mpw-five-robots-private.tgz","w:gz") as output:
              for name,raw in (("runner.py",source),("manifest.json",manifest)):
                  part=tarfile.TarInfo(name)
                  part.size=len(raw)
                  part.mode=0o600
                  part.mtime=0
                  output.addfile(part,io.BytesIO(raw))
          assert Path("/tmp/mpw-five-robots-private.tgz").stat().st_size<35000
          PY
      - name: Install and actually run all five execution robots on cPanel
        shell: bash
        run: |
          set -euo pipefail
          controller="$(base64 -w0 scripts/mpw_install_private_execution_robots_cpanel.py)"
          timeout 155s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$controller\"))'" < /tmp/mpw-five-robots-private.tgz
      - name: Activate six private review and safety robots
        shell: bash
        run: |
          set -euo pipefail
          script="$(base64 -w0 scripts/mpw_install_extended_robots_cpanel.py)"
          timeout 110s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))'" < /tmp/mpw-six-private-robots.tgz
      - name: Execute actual safe MojPlayWin workers now under existing private locks
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import os,subprocess,json,sys
          from pathlib import Path
          base=Path("/home/zomorod2/.private_mojplaywin_main_agents")
          v91=base/"v91_verified_main_port_20261018"
          health=base/"site_health_v11_port_20261018"
          quality=base/"quality_review_agent_20261018"
          management=base/"management_intelligence_20261018"
          evo=base/"evolution_runtime_20261018"
          pairs=[
              ("gen64_original_worker",None,
               ["/usr/bin/python3","-B","-m","mpw_v91_port.worker","--once"],v91,65),
              ("eleven_site_health_roles",health/"cron_worker.lock",
               ["/usr/bin/python3","-B",str(health/"mpw_v91_port/site_health_v11.py"),"--once"],v91,120),
              ("quality_review_agent",quality/"review.lock",
               ["/usr/bin/python3","-B",str(quality/"review_private_drafts.py")],v91,55),
              ("two_management_economic_policy_roles",management/"cycle.lock",
               ["/usr/bin/python3","-B",str(management/"worker.py")],v91,55),
              ("gen65_private_evolution",evo/"cron.lock",
               ["/usr/bin/python3","-B",str(v91/"mpw_v91_port/evolution.py"),"--once"],v91,65),
          ]
          before=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=15).stdout
          result=[]
          for name,lock,command,cwd,seconds in pairs:
              allowed=all(path.is_file() and not path.is_symlink()
                          for path in [Path(command[2])] if path.exists()) if name!="gen64_original_worker" else (v91/"mpw_v91_port/worker.py").is_file()
              if not allowed: raise RuntimeError("PRIVATE_AGENT_SOURCE_NOT_PRESENT:"+name)
              env=os.environ.copy();env["PYTHONPATH"]=str(v91);env["PYTHONDONTWRITEBYTECODE"]="1"
              cmd=(["/usr/bin/flock","-n",str(lock)]+command) if lock else command
              process=subprocess.run(cmd,capture_output=True,text=True,timeout=seconds,cwd=cwd,env=env)
              if process.returncode!=0:
                  raise RuntimeError("PRIVATE_AGENT_RUN_FAILED:"+name+":"+str(process.returncode)+":"+process.stderr[-250:])
              out=process.stdout.strip()
              if not out:
                  # Quality and management write to private report rather than STDOUT;
                  # successful exit is sufficient only with output files checked below.
                  state="completed_zero_exit"
              else:
                  try:
                      row=json.loads(out.splitlines()[-1])
                      state=row.get("status",row.get("site", "completed"))
                  except ValueError:
                      state="completed_zero_exit"
              result.append({"agent_group":name,"execution":"successful","status":state})
          after=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=15).stdout
          assert before==after,"UNEXPECTED_PRIVATE_AGENT_CRON_CHANGE"
          assert (management/"latest_economic_policy.json").is_file()
          economics=json.loads((management/"latest_economic_policy.json").read_text())
          assert economics["report"]["trades_or_payments_executed"]==0
          agents=json.loads((health/"last_scan.json").read_text())
          assert agents["total_agents"]==11 and len(agents["runs"])==11
          assert (quality/"last_review.log").is_file() or (quality/"review_private_drafts.py").is_file()
          private=json.loads((evo/"gen65_operational_report.json").read_text())
          assert private["status"]=="gen65_operational_private"
          assert private["active_private_generation"]==65
          assert private["existing_public_master_generation"]==64
          print("ALL_PRIVATE_MPW_AGENT_GROUPS_REAL_RUN_COMPLETED="+json.dumps(result,ensure_ascii=False,sort_keys=True))
          print("ALL_PRIVATE_AGENT_CRON_JOBS_PRESERVED=true")
          print("GEN65_VERIFIED_RUNNING=true")
          print("ELEVEN_SITE_AGENT_ROLES_EXECUTED=11")
          print("NO_ECONOMIC_TRANSACTIONS=true")
          PY
      - name: Audit actual private workers, role outputs and unchanged scheduler
        shell: bash
        run: |
          set -euo pipefail
          timeout 55s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess,os
          from pathlib import Path
          from datetime import datetime,timezone
          base=Path("/home/zomorod2/.private_mojplaywin_main_agents")
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=15).stdout
          agents={
            "gen64_main_worker":("# MPW_V91_MAIN_ONLY_20261018",base/"v91_verified_main_port_20261018/operator_state/heartbeat.json","last_master_callback_utc"),
            "v11_11_site_auditors":("# MPW_V11_MAIN_ONLY_SITE_HEALTH_20261018",base/"site_health_v11_port_20261018/last_scan.json","observed_utc"),
            "private_quality_reviewer":("# MPW_ZOMOROD_QUALITY_REVIEW_MAIN_ONLY_20261018",base/"quality_review_agent_20261018/last_review.log",None),
            "management_economic":("# MPW_ZOMOROD_MANAGEMENT_INTELLIGENCE_MAIN_ONLY_20261018",base/"management_intelligence_20261018/latest_company_operations.json",None),
            "private_evolution_and_gen65":("MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018",base/"evolution_runtime_20261018/gen65_operational_report.json","observed_utc"),
          }
          info={"site":"mojplaywin-main","cron_entries":len([v for v in cron.splitlines() if v.strip() and not v.lstrip().startswith("#")]),"workers":[]}
          now=datetime.now(timezone.utc)
          for role,(mark,report,stamp) in agents.items():
              entries=[x for x in cron.splitlines() if mark in x and not x.lstrip().startswith("#")]
              value={"role":role,"unique_job":len(entries)==1,
                     "schedule":entries[0].split(" # ")[0].split(" ",5)[:5] if len(entries)==1 else None,
                     "report_exists":report.is_file() and not report.is_symlink(),
                     "report_age_minutes":None}
              if report.is_file() and not report.is_symlink() and report.stat().st_size<30000:
                  if report.suffix==".json":
                      data=json.loads(report.read_text())
                      value["report_status"]=data.get("status","unknown")
                      value["tenant"]=data.get("tenant")
                      value["master_generation"]=data.get("master_generation",data.get("active_private_generation"))
                      if role=="v11_11_site_auditors":
                          value["total_roles"]=data.get("total_agents")
                          value["role_statuses"]={r.get("code"):r.get("status") for r in data.get("runs",[])}
                      if stamp and isinstance(data.get(stamp),str):
                          try:
                              dt=datetime.fromisoformat(data[stamp].replace("Z","+00:00"))
                              value["report_age_minutes"]=round((now-dt).total_seconds()/60,1)
                          except (ValueError,TypeError):pass
                  else:
                      stat=report.stat()
                      value["report_age_minutes"]=round((now-datetime.fromtimestamp(stat.st_mtime,timezone.utc)).total_seconds()/60,1)
                      lines=report.read_text(encoding="utf-8",errors="replace")[-500:]
                      value["log_nonempty"]=bool(lines.strip())
              info["workers"].append(value)
          for name,path in (
             ("economic_policy",base/"management_intelligence_20261018/latest_economic_policy.json"),
             ("content_pipeline",base/"evolution_runtime_20261018/page_content_20261018/last_report.json"),
             ("publisher",base/"evolution_runtime_20261018/editorial_publication_state.json")):
              data={"role":name,"report_exists":path.is_file() and not path.is_symlink()}
              if data["report_exists"]:
                  j=json.loads(path.read_text())
                  data["status"]=j.get("status")
                  data["tenant"]=j.get("tenant")
                  data["articles"]=j.get("articles",j.get("total_drafts"))
                  if name=="economic_policy":
                      data["trades_executed"]=j.get("report",{}).get("trades_or_payments_executed")
              info["workers"].append(data)
          own=base/"v91_verified_main_port_20261018/mpw_v91_port/ORIGIN.json"
          if own.is_file():
              j=json.loads(own.read_text())
              info["ported_module_count"]=j.get("file_count")
          print("MPW_ALL_AGENTS_READONLY_INVENTORY="+json.dumps(info,ensure_ascii=False,sort_keys=True))
          assert all(row["unique_job"] for row in info["workers"] if "unique_job" in row),"MISSING_SCHEDULED_PRIVATE_WORKER"
          print("ALL_FIVE_PRIVATE_MAIN_AGENT_JOBS_SCHEDULED=true")
          PY
      - name: Independently verify all five robots, queue and new Cron after activation
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          evo=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          def read(name):
              path=evo/name
              assert path.is_file() and not path.is_symlink() and path.stat().st_size<20000
              return json.loads(path.read_text())
          report=read("robots_execution_20261018.json")
          queue=read("robots_editorial_review_queue_20261018.json")
          assert report["tenant"]=="mojplaywin-main"
          assert report["status"]=="five_main_robots_executed"
          assert report["robot_count"]==5 and len(report["roles"])==5
          assert report["successful"]==5 and report["warnings"]==0
          assert report["site_writes"]==0 and report["subsite_writes"]==0
          assert report["financial_actions"]==0
          names={p["name"] for p in report["roles"]}
          assert names=={"main_route_observer","editorial_integrity",
                         "draft_fingerprint","editorial_review_queue",
                         "agent_runtime_watch"}
          assert queue["tenant"]=="mojplaywin-main"
          assert queue["automated_approval"] is False
          # The private review backlog grows and shrinks; it is not always 2.
          # Keep the bounded queue and no-automatic-approval invariants.
          assert queue["published"] is False
          assert isinstance(queue["items"],list) and 1<=len(queue["items"])<=8
          assert all(item.get("can_auto_approve") is False
                     and item.get("required_checks")==[
                       "source_fact_check","copyright","duplicate_live_content","editorial_clarity"]
                     for item in queue["items"])
          t=datetime.fromisoformat(report["observed_utc"].replace("Z","+00:00"))
          assert 0<=(datetime.now(timezone.utc)-t).total_seconds()<600
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=15).stdout
          expected=["MPW_V91_MAIN_ONLY_20261018",
                    "MPW_V11_MAIN_ONLY_SITE_HEALTH_20261018",
                    "MPW_ZOMOROD_QUALITY_REVIEW_MAIN_ONLY_20261018",
                    "MPW_ZOMOROD_MANAGEMENT_INTELLIGENCE_MAIN_ONLY_20261018",
                    "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018",
                    "MPW_77_MODULES_MAIN_ONLY_20261018",
                    "MPW_MAIN_PRIVATE_EXECUTION_ROBOTS_20261018"]
          for marker in expected:
              rows=[r for r in cron.splitlines() if marker in r and not r.lstrip().startswith("#")]
              assert len(rows)==1,marker
              if marker=="MPW_MAIN_PRIVATE_EXECUTION_ROBOTS_20261018":
                  assert rows[0].startswith("26 * * * * ")
          print("INDEPENDENTLY_VERIFIED_EXECUTED_PRIVATE_ROBOTS=5")
          print("INDEPENDENTLY_VERIFIED_HEALTHY_ROBOTS=5")
          print("MAIN_ONLY_ROBOT_SCHEDULER_HOURLY=true")
          print("ALL_EXISTING_AGENTS_AND_MODULE_CRONS_INTACT=true")
          print("REVIEW_TASK_QUEUE_ITEMS="+str(len(queue["items"])))
          print("PUBLIC_SITE_AND_PAYMENTS_UNCHANGED=true")
          PY
      - name: Independently verify all eleven actual robots
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          def read(name):
              p=root/name
              assert p.is_file() and not p.is_symlink()
              obj=json.loads(p.read_text())
              assert obj.get("tenant")=="mojplaywin-main"
              return obj
          old=read("robots_execution_20261018.json")
          extra=read("extended_robots_status_20261018.json")
          review=read("extended_robots_pending_release_20261018.json")
          gen=read("gen65_operational_report.json")
          modules=read("all_77_modules_last_run.json")
          assert old["robot_count"]==old["successful"]==5 and old["warnings"]==0
          # Agent activation and content quality are different dimensions.
          # Surface real warnings; do not falsely claim every audit is healthy.
          assert extra["robot_count"]==6
          assert extra["healthy"]+extra["warnings"]==6
          statuses={role["name"]:role["status"] for role in extra["roles"]}
          assert len(statuses)==6 and all(v in ("ok","warning") for v in statuses.values())
          warnings=sorted(name for name,status in statuses.items() if status=="warning")
          print("PRIVATE_AGENT_ROLE_HEALTH="+json.dumps(statuses,sort_keys=True))
          print("PRIVATE_AGENT_WARNINGS="+json.dumps(warnings))
          # Safety and resource exhaustion remain hard stop conditions.
          if statuses["public_content_security"]!="ok":
              findings=next(x for x in extra["roles"] if x["name"]=="public_content_security")
              print("::warning title=MojPlayWin content security agent::"
                    +"Detected risky pages="+str(findings.get("risky_pages","unknown"))
                    +"; public-content release remains unapproved")
              print("PUBLIC_CONTENT_SECURITY_RELEASE_GATE=blocked")
          else:
              print("PUBLIC_CONTENT_SECURITY_RELEASE_GATE=clear")
          assert statuses["disk_capacity"]=="ok", "PRIVATE_AGENT_CAPACITY_WARNING"
          assert not extra["public_site_modified"] and not extra["sibling_sites_modified"] and not extra["finance_executed"]
          assert review["automatic_publication"] is False
          assert gen["active_private_generation"]==65 and gen["status"]=="gen65_operational_private"
          assert modules["modules_import_executed"]==modules["modules_hash_verified"]==77
          latest=datetime.fromisoformat(extra["observed_utc"].replace("Z","+00:00"))
          assert 0<=(datetime.now(timezone.utc)-latest).total_seconds()<600
          cron=subprocess.run(["crontab","-l"],text=True,capture_output=True,check=True,timeout=15).stdout
          tags=["MPW_V91_MAIN_ONLY_20261018","MPW_V11_MAIN_ONLY_SITE_HEALTH_20261018","MPW_ZOMOROD_QUALITY_REVIEW_MAIN_ONLY_20261018","MPW_ZOMOROD_MANAGEMENT_INTELLIGENCE_MAIN_ONLY_20261018","MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018","MPW_77_MODULES_MAIN_ONLY_20261018","MPW_MAIN_PRIVATE_EXECUTION_ROBOTS_20261018","MPW_MAIN_EXTENDED_ROBOTS_20261018"]
          for tag in tags:
              lines=[x for x in cron.splitlines() if tag in x and not x.lstrip().startswith("#")]
              assert len(lines)==1,tag
          assert any(x.startswith("32 * * * * ") for x in cron.splitlines() if "MPW_MAIN_EXTENDED_ROBOTS_20261018" in x)
          print("ALL_11_MOJPLAYWIN_MAIN_ROBOTS_CONFIRMED=true")
          print("ALL_11_ROBOTS_EXECUTED=true")
          print("ROBOT_HEALTHY_COUNT="+str(old["successful"]+extra["healthy"]))
          print("ROBOT_WARNING_COUNT="+str(extra["warnings"]))
          print("ALL_8_PRIVATE_AGENT_AND_ROBOT_CRONS_PRESENT=true")
          print("GEN65_AND_77_SOURCE_MODULES_RUNNING_IN_PRIVATE=true")
          print("NO_CROSS_SITE_OR_FINANCIAL_MUTATIONS=true")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
          rm -f -- /tmp/mpw-five-robots-private.tgz
