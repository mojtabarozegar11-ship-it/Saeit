name: MojPlayWin all private agents actual live audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-all-agents-private-activation.yml]
permissions:
  contents: read
concurrency:
  group: mpw-all-agents-private-control
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Audit actual private workers, role outputs and unchanged scheduler
        shell: bash
        run: |
          set -euo pipefail
          timeout 55s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess,os
          from pathlib import Path
          from datetime import datetime,timezone
          base=Path("/home/zomorod2/.private_mojplaywin_main_agents")
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,check=True,timeout=15).stdout
          agents={
            "gen64_main_worker":("# MPW_V91_MAIN_ONLY_20261018",base/"v91_verified_main_port_20261018/operator_state/heartbeat.json","last_master_callback_utc"),
            "v11_11_site_auditors":("# MPW_V11_MAIN_ONLY_SITE_HEALTH_20261018",base/"site_health_v11_port_20261018/last_scan.json","observed_utc"),
            "private_quality_reviewer":("# MPW_ZOMOROD_QUALITY_REVIEW_MAIN_ONLY_20261018",base/"quality_review_agent_20261018/last_review.log",None),
            "management_economic":("# MPW_ZOMOROD_MANAGEMENT_INTELLIGENCE_MAIN_ONLY_20261018",base/"management_intelligence_20261018/latest_company_operations.json",None),
            "private_evolution_and_gen65":("MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018",base/"evolution_runtime_20261018/gen65_operational_report.json","observed_utc"),
          }
          info={"site":"mojplaywin-main","cron_entries":len([v for v in cron.splitlines() if v.strip() and not v.lstrip().startswith("#")]),"workers":[]}
          now=datetime.now(timezone.utc)
          for role,(mark,report,stamp) in agents.items():
              entries=[x for x in cron.splitlines() if mark in x and not x.lstrip().startswith("#")]
              value={"role":role,"unique_job":len(entries)==1,
                     "schedule":entries[0].split(" # ")[0].split(" ",5)[:5] if len(entries)==1 else None,
                     "report_exists":report.is_file() and not report.is_symlink(),
                     "report_age_minutes":None}
              if report.is_file() and not report.is_symlink() and report.stat().st_size<30000:
                  if report.suffix==".json":
                      data=json.loads(report.read_text())
                      value["report_status"]=data.get("status","unknown")
                      value["tenant"]=data.get("tenant")
                      value["master_generation"]=data.get("master_generation",data.get("active_private_generation"))
                      if role=="v11_11_site_auditors":
                          value["total_roles"]=data.get("total_agents")
                          value["role_statuses"]={r.get("code"):r.get("status") for r in data.get("runs",[])}
                      if stamp and isinstance(data.get(stamp),str):
                          try:
                              dt=datetime.fromisoformat(data[stamp].replace("Z","+00:00"))
                              value["report_age_minutes"]=round((now-dt).total_seconds()/60,1)
                          except (ValueError,TypeError):pass
                  else:
                      stat=report.stat()
                      value["report_age_minutes"]=round((now-datetime.fromtimestamp(stat.st_mtime,timezone.utc)).total_seconds()/60,1)
                      lines=report.read_text(encoding="utf-8",errors="replace")[-500:]
                      value["log_nonempty"]=bool(lines.strip())
              info["workers"].append(value)
          for name,path in (
             ("economic_policy",base/"management_intelligence_20261018/latest_economic_policy.json"),
             ("content_pipeline",base/"evolution_runtime_20261018/page_content_20261018/last_report.json"),
             ("publisher",base/"evolution_runtime_20261018/editorial_publication_state.json")):
              data={"role":name,"report_exists":path.is_file() and not path.is_symlink()}
              if data["report_exists"]:
                  j=json.loads(path.read_text())
                  data["status"]=j.get("status")
                  data["tenant"]=j.get("tenant")
                  data["articles"]=j.get("articles",j.get("total_drafts"))
                  if name=="economic_policy":
                      data["trades_executed"]=j.get("report",{}).get("trades_or_payments_executed")
              info["workers"].append(data)
          own=base/"v91_verified_main_port_20261018/mpw_v91_port/ORIGIN.json"
          if own.is_file():
              j=json.loads(own.read_text())
              info["ported_module_count"]=j.get("file_count")
          print("MPW_ALL_AGENTS_READONLY_INVENTORY="+json.dumps(info,ensure_ascii=False,sort_keys=True))
          assert all(row["unique_job"] for row in info["workers"] if "unique_job" in row),"MISSING_SCHEDULED_PRIVATE_WORKER"
          print("ALL_FIVE_PRIVATE_MAIN_AGENT_JOBS_SCHEDULED=true")
          PY
      - name: Clean ephemeral runner identity material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
