name: MojPlayWin relay key normalization diagnostic v4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 3
    env:
      HOST_KEY: \${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
      VPS_KEY: \${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test bounded non-network key repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          def variants(value):
              raw = value.strip()
              out = [("raw", raw)]
              lines = raw.splitlines()
              if lines and lines[0].startswith("\\"):
                  out.append(("remove_one_leading_backslash", "\n".join([lines[0][1:]] + lines[1:])))
              if lines and lines[0].startswith('"'):
                  out.append(("remove_one_leading_double_quote", "\n".join([lines[0][1:]] + lines[1:])))
              if lines and lines[0].startswith("'"):
                  out.append(("remove_one_leading_single_quote", "\n".join([lines[0][1:]] + lines[1:])))
              if lines and lines[-1].endswith("\\"):
                  out.append(("remove_one_trailing_backslash", "\n".join(lines[:-1] + [lines[-1][:-1]])))
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
                  out.append(("remove_outer_quotes", raw[1:-1]))
              unique = []
              seen = set()
              for label, text in out:
                  if text not in seen:
                      unique.append((label, text))
                      seen.add(text)
              return unique

          def probe(text):
              lines = text.splitlines()
              begin = [line for line in lines if line.startswith("-----BEGIN ") and line.endswith("-----")]
              end = [line for line in lines if line.startswith("-----END ") and line.endswith("-----")]
              fd, path = tempfile.mkstemp(prefix="mpw-key-", dir=os.environ.get("RUNNER_TEMP"))
              try:
                  os.write(fd, text.encode("utf-8"))
                  os.close(fd)
                  p = subprocess.run(["ssh-keygen", "-y", "-P", "", "-f", path], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True, timeout=5, check=False)
                  stderr = p.stderr.lower()
                  if p.returncode == 0:
                      status = "ok"
                  elif "incorrect passphrase" in stderr or "enter passphrase" in stderr or "passphrase" in stderr:
                      status = "encrypted_or_passphrase_required"
                  elif "invalid format" in stderr:
                      status = "invalid_format"
                  else:
                      status = "other_error"
                  return {
                      "bytes": len(text.encode("utf-8")),
                      "line_count": len(lines),
                      "begin_markers": len(begin),
                      "end_markers": len(end),
                      "ssh_keygen": status,
                  }
              finally:
                  try:
                      os.unlink(path)
                  except OSError:
                      pass

          for name in ("HOST_KEY", "VPS_KEY"):
              rows = [{"candidate": label, **probe(text)} for label, text in variants(os.environ.get(name, ""))]
              print(name + "_REPAIRS=" + json.dumps(rows, sort_keys=True))
          print("NETWORK_CONTACTED=0")
          print("KEY_VALUES_DISCLOSED=0")
          PY
