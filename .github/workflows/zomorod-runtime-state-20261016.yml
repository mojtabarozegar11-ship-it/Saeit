name: Read only Zomorod runtime inventory
on:
  push:
    branches:
      - codex/zomorod-runtime-repair-20261016
    paths:
      - ".github/workflows/zomorod-runtime-state-20261016.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-runtime-state
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-runtime-state"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Compare existing virtualenv packages and route status without writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-runtime-state"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          test -f "$app/manage.py"
          if git -C "$app" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "LIVE_SOURCE_GIT=yes"
            git -C "$app" rev-parse HEAD | sed 's/^/LIVE_SOURCE_HEAD=/'
            git -C "$app" status --porcelain --untracked-files=no | wc -l | awk '{print "LIVE_TRACKED_CHANGES=" $1}'
            git -C "$app" remote get-url origin 2>/dev/null | sed -E 's#https?://[^/@]+:[^/@]+@#https://[redacted]@#' | sed 's/^/LIVE_SOURCE_ORIGIN=/'
            for rel in config/urls.py core/mojplaywin_views.py requirements.txt; do
              if test -f "$app/$rel"; then
                sha256sum "$app/$rel" | awk -v f="$rel" '{print "LIVE_FILE_" f "_SHA256=" $1}'
                if git -C "$app" cat-file -e "HEAD:$rel" 2>/dev/null; then echo "LIVE_HEAD_HAS_$rel=yes"; else echo "LIVE_HEAD_HAS_$rel=no"; fi
              else
                echo "LIVE_FILE_MISSING=$rel"
              fi
            done
            echo "LIVE_REQUIREMENTS_BEGIN"
            sed -n '1,15p' "$app/requirements.txt"
            echo "LIVE_REQUIREMENTS_END"
          else
            echo "LIVE_SOURCE_GIT=no"
          fi
          for version in 3.10 3.11; do
            py="/home/zomorod2/virtualenv/Saeit/$version/bin/python"
            echo "RUNTIME_VERSION=$version PRESENT=$(test -x "$py" && echo yes || echo no)"
            if test -x "$py"; then
              "$py" - <<'PY'
          import importlib,importlib.metadata
          for module,dist in (
              ("django","Django"),
              ("rest_framework","djangorestframework"),
              ("environ","django-environ"),
              ("whitenoise","whitenoise"),
              ("PIL","Pillow"),
              ("psycopg","psycopg"),
              ("openai","openai"),
          ):
              try:
                  importlib.import_module(module)
                  try: version=importlib.metadata.version(dist)
                  except Exception: version="installed"
                  print(f"PACKAGE_{module.upper()}={version}")
              except Exception as exc:
                  print(f"PACKAGE_{module.upper()}=MISSING:{type(exc).__name__}")
          PY
              "$py" -m pip check 2>&1 | head -25 || true
            fi
          done
          echo "LIVE_PASSENGER_SETTINGS_BEGIN"
          awk '$1=="PassengerAppRoot" || $1=="PassengerBaseURI" || $1=="PassengerPython" || $1=="PassengerStartupFile" {print}' /home/zomorod2/public_html/.htaccess
          echo "LIVE_PASSENGER_SETTINGS_END"
          for path in / /industry/ /agents/ /api/health/ /api/bridge/health/ /admin/login/ /amozeshgah/ /mohammad/ /ghanadi/; do
            code="$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://zomorodmelal.ir${path}?readonly_state=20261016" || true)"
            echo "LIVE_ROUTE=${path} HTTP=${code}"
          done
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-runtime-state"
