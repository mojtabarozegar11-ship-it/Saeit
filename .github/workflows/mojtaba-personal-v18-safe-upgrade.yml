name: Personal V18 protected dark-gold enterprise SEO release
on:
  pull_request:
    paths:
      - .github/workflows/mojtaba-personal-v18-safe-upgrade.yml
      - scripts/mojtaba_personal_v18_enterprise_refresh.py
      - tests/test_mojtaba_personal_v18_enterprise_refresh.py
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: mojtaba-personal-v18-only-safe-release
  cancel-in-progress: false
jobs:
  local-tests:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
        github.event.issue.title == 'Ops: Personal V18 safe theme SEO release 2026-10-16'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and additive preservation tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojtaba_personal_v18_enterprise_refresh.py
          python3 -m unittest discover -s tests -p 'test_mojtaba_personal_v18_enterprise_refresh.py' -v
  publish:
    needs: local-tests
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: Personal V18 safe theme SEO release 2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate pinned two-hop SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/personal-v18-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "PERSONAL_V18_SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Stage personal-only installer
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.personal-v18-stage-$GITHUB_RUN_ID"
          timeout 25s ssh -F "$PERSONAL_V18_SSH_CONFIG" saeit-host "test ! -e '$stage' && install -d -m 700 '$stage'"
          timeout 70s scp -F "$PERSONAL_V18_SSH_CONFIG" scripts/mojtaba_personal_v18_enterprise_refresh.py "saeit-host:$stage/installer.py"
      - name: Backup and guarded install, Django routes and public smoke tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s ssh -F "$PERSONAL_V18_SSH_CONFIG" saeit-host "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          umask 077
          job="$1"
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          stage="/home/zomorod2/.personal-v18-stage-$job"
          script="$stage/installer.py"
          backup="/home/zomorod2/.backups/mojtaba-personal-v18-snapshot/$job"
          py="/home/zomorod2/mojtaba_personal/.venv_personal_test/bin/python"
          installed=0
          verified=0
          finish() {
            result=$?
            trap - EXIT
            if test "$installed" = 1 && test "$verified" = 0 && test -f "$backup/manifest.json"; then
              "$py" "$script" rollback --app "$app" --backup "$backup" && echo "PERSONAL_V18_AUTO_ROLLBACK=yes" || echo "PERSONAL_V18_MANUAL_REVIEW_REQUIRED=yes"
              test -d "$app/tmp" && touch "$app/tmp/restart.txt" || true
            fi
            rm -rf -- "$stage"
            exit "$result"
          }
          trap finish EXIT
          test ! -L "$app" && test -f "$app/manage.py"
          test -x "$py" && test ! -L "$stage" && test -f "$script"
          cd "$app"
          "$py" "$script" check --app "$app"
          "$py" "$script" install --app "$app" --backup "$backup"
          installed=1
          "$py" manage.py check --deploy
          "$py" "$script" verify --app "$app" --backup "$backup"
          "$py" - <<'PYTEST'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django;django.setup()
          from django.test import Client
          from django.urls import reverse
          from core.models import Post
          c=Client(HTTP_HOST="mojplaywin.com")
          names=("home","about","resume","activities","memories","stories","projects","posts","gallery","contact")
          for n in names:
              u=reverse("personal_site:"+n)
              r=c.get(u,secure=True,follow=False)
              if r.status_code!=200:raise RuntimeError("Personal route failed: "+n+"="+str(r.status_code))
              if n=="contact" and b"<form" not in r.content.lower():raise RuntimeError("Contact form missing")
              if b"mpw-enterprise-v18-20261016" not in r.content:
                  raise RuntimeError("Dark-gold style not loaded: "+n)
              if n in ("home","posts","resume","projects","contact") and ("mpw-enterprise-v18-20261016-"+n).encode() not in r.content:
                  raise RuntimeError("Enterprise section absent: "+n)
              print("PERSONAL_DJANGO_ROUTE="+n+" HTTP=200",flush=True)
          slugs=list(Post.objects.filter(published=True).values_list("slug",flat=True))
          if len(slugs)<93:raise RuntimeError("93 published articles not preserved")
          for slug in slugs:
              u=reverse("personal_site:post_detail",kwargs={"slug":slug})
              r=c.get(u,secure=True,follow=False)
              if r.status_code!=200:raise RuntimeError("Article route failed: "+slug+"="+str(r.status_code))
          print("PERSONAL_ALL_PUBLISHED_ARTICLE_ROUTES_PASSED="+str(len(slugs)),flush=True)
          from core.forms import ContactForm
          fields=set(ContactForm().fields)
          if not {"name","email","subject","message"}.issubset(fields):raise RuntimeError("Contact fields missing")
          print("PERSONAL_CONTACT_FIELDS_PRESENT=yes; no fake submission made",flush=True)
          PYTEST
          test -d "$app/tmp" && touch "$app/tmp/restart.txt"
          "$py" - <<'PYHTTP'
          import time
          from urllib.request import Request,urlopen
          root="https://mojplaywin.com/mojtaba.roozegar/"
          routes=("","blog/","about/","resume/","projects/","works-activities/","gallery/","memories/","stories/","contact/","sitemap.xml","feed.xml")
          blocks={"":"home","blog/":"posts","resume/":"resume","projects/":"projects","contact/":"contact"}
          def check(route):
              for trial in range(5):
                  try:
                      u=root+route
                      with urlopen(Request(u,headers={"User-Agent":"MojtabaPersonalV18ReleaseAudit/1"}),timeout=18) as r:
                          body=r.read(800000)
                          if r.status!=200:raise RuntimeError("HTTP "+str(r.status))
                          if route not in ("sitemap.xml","feed.xml"):
                              html=body.decode("utf-8","replace")
                              if "mpw-enterprise-v18-20261016" not in html:raise RuntimeError("New personal CSS missing")
                              if route in blocks and "mpw-enterprise-v18-20261016-"+blocks[route] not in html:
                                  raise RuntimeError("New professional block missing")
                          print("PERSONAL_LIVE_HTTPS="+route+" HTTP=200",flush=True)
                          return
                  except Exception as exc:
                      print("PERSONAL_HTTP_RETRY="+route+" "+str(exc)[:100],flush=True)
                      time.sleep(2)
              raise RuntimeError("Failed live route: "+route)
          for route in routes:check(route)
          print("PERSONAL_TWELVE_PUBLIC_SMOKE_ROUTES_PASSED=yes",flush=True)
          PYHTTP
          "$py" "$script" verify --app "$app" --backup "$backup"
          verified=1
          echo "PERSONAL_V18_SAFE_LIVE_PUBLISH=success"
          echo "PERSONAL_V18_BACKUP=$backup"
          echo "OTHER_DOMAINS_AND_VPS_FACTORY_UNTOUCHED=yes"
          REMOTE
      - name: Delete temporary runner SSH keys
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/personal-v18-relay"
          test ! -d "$d" || rm -rf -- "$d"
