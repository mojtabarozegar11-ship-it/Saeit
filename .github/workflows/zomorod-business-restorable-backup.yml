name: Protect Zomorod existing private management DB and prove restore
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-business-restorable-backup.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-business-private-restorable-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "IMMUTABLE_HEAD_CHECKOUT=verified"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Create consistent snapshot and independently restore it in a private path
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 100s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$SOURCE_SHA" <<'REMOTE'
          set -euo pipefail
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          export SNAPSHOT_RELEASE_SHA="$1"
          python3 -O -B - <<'PY'
          from pathlib import Path
          import os,sqlite3,hashlib,urllib.parse,json
          home=Path.home()
          src=home/".private/zomorod-business/management.sqlite3"
          if not (src.is_file() and not src.is_symlink() and 80000<=src.stat().st_size<200000000): raise RuntimeError("SOURCE_DB_INVALID")
          before=src.stat()
          source_digest_before=hashlib.sha256(src.read_bytes()).hexdigest()
          base=home/".private/zomorod-messaging-recovery"
          if not (not base.is_symlink()): raise RuntimeError("PRIVATE_BACKUP_ROOT_UNSAFE")
          sha=os.environ["SNAPSHOT_RELEASE_SHA"]
          if not (len(sha)==40 and all(x in "0123456789abcdef" for x in sha)): raise RuntimeError("SOURCE_SHA_INVALID")
          root=base/sha
          if not (not root.exists()): raise RuntimeError("BACKUP_TARGET_EXISTS")
          base.mkdir(mode=0o700,parents=True,exist_ok=True)
          root.mkdir(mode=0o700)
          dest=root/"business.snapshot.sqlite3"
          restored=root/"restore-verify.sqlite3"
          uri="file:"+urllib.parse.quote(str(src))+"?mode=ro"
          with sqlite3.connect(uri,uri=True,timeout=8) as source:
              if not (source.execute("PRAGMA quick_check").fetchone()[0]=="ok"): raise RuntimeError("SOURCE_DB_QUICK_CHECK_FAILED")
              tables={r[0] for r in source.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if not ({"users","journal_entries","journal_lines","invoices"} <= tables): raise RuntimeError("REQUIRED_LEDGER_TABLES_MISSING")
              users=source.execute("SELECT COUNT(*) FROM users").fetchone()[0]
              if not (users>=1): raise RuntimeError("LEDGER_USERS_MISSING")
              with sqlite3.connect(str(dest),timeout=10) as output:
                  source.backup(output,pages=64,sleep=0.03)
          dest.chmod(0o600)
          if not (dest.stat().st_size>=80000): raise RuntimeError("SNAPSHOT_SIZE_INVALID")
          with sqlite3.connect(str(dest),timeout=4) as db:
              if not (db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"): raise RuntimeError("SNAPSHOT_INTEGRITY_FAILED")
              with sqlite3.connect(str(restored)) as check:
                  db.backup(check)
          with sqlite3.connect(str(restored)) as check:
              if not (check.execute("PRAGMA integrity_check").fetchone()[0]=="ok"): raise RuntimeError("RESTORE_INTEGRITY_FAILED")
              if not ({r[0] for r in check.execute("SELECT name FROM sqlite_master WHERE type='table'")}==tables): raise RuntimeError("RESTORE_TABLE_SET_MISMATCH")
              if not (check.execute("SELECT COUNT(*) FROM users").fetchone()[0]==users): raise RuntimeError("RESTORE_USER_COUNT_MISMATCH")
          restored.unlink()
          digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          (root/"manifest.json").write_text(json.dumps({"schema":"zm-recovery.v1","bytes":dest.stat().st_size,"sha256":digest,"tables":len(tables),"user_count":users,"restore_test":"ok","production_db_modified":False}),encoding="utf-8")
          after=src.stat()
          if not (before.st_size==after.st_size and before.st_mtime_ns==after.st_mtime_ns): raise RuntimeError("SOURCE_STAT_CHANGED")
          if not (hashlib.sha256(src.read_bytes()).hexdigest()==source_digest_before): raise RuntimeError("SOURCE_DIGEST_CHANGED")
          print("BUSINESS_DB_SOURCE_CONTENT_SHA256_UNCHANGED=true")
          print("BUSINESS_DB_SNAPSHOT=created")
          print("BUSINESS_DB_RESTORE=verified")
          print("BUSINESS_DB_TABLES="+str(len(tables)))
          print("BUSINESS_DB_PRODUCTION_UNCHANGED=true")
          PY
          REMOTE
      - name: Encrypt and verify the privately streamed copy for off-host retention
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          src="/home/zomorod2/.private/zomorod-messaging-recovery/$SOURCE_SHA/business.snapshot.sqlite3"
          dest="$RUNNER_TEMP/zm-business-cipher-$GITHUB_RUN_ID"
          mkdir -m 700 "$dest"
          timeout 65s ssh -F "$d/config" "$COMMAND_HOST" "cat '$src'" > "$dest/business-temp.sqlite3"
          expected="$(ssh -F "$d/config" "$COMMAND_HOST" "sha256sum '$src' | cut -d' ' -f1")"
          actual="$(sha256sum "$dest/business-temp.sqlite3" | cut -d' ' -f1)"
          test "$expected" = "$actual"
          python3 -c "import cryptography"
          python3 scripts/f01_encrypted_stream_v1.py encrypt --input "$dest/business-temp.sqlite3" --output "$dest/business.sqlite3.f01enc" --public-key security/factory_recovery_public_20261030.pem
          test -s "$dest/business.sqlite3.f01enc"
          rm -f -- "$dest/business-temp.sqlite3"
          echo "OFFHOST_BACKUP_CIPHERTEXT_SHA256=$(sha256sum "$dest/business.sqlite3.f01enc" | cut -d' ' -f1)"
          printf 'format=F01ENC-RSA3072-AES256GCM-V1\nsnapshot_sha256=%s\n' "$expected" > "$dest/manifest.txt"
      - name: Store encrypted recovery artifact away from cPanel
        uses: actions/upload-artifact@v4
        with:
          name: zm-business-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/zm-business-cipher-${{ github.run_id }}/
          retention-days: 30
          if-no-files-found: error
      - name: Remove keys and transient plaintext in all outcomes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
          rm -rf -- "$RUNNER_TEMP/zm-business-cipher-$GITHUB_RUN_ID"
