name: MPW cPanel provenance bridge hardening and full CI unblock (offline)
on:
  push:
    branches: [fix/mpw-readonly-bridge-full-ci-unblock-20261114]
  pull_request:
    branches: [fix/mpw-cpanel-source-provenance-bridge-only-20261114]
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile critical Python and validate bash syntax
        run: |
          python3 -m py_compile tests/test_zomorod_fields_release_guard.py tests/test_mpw_cpanel_dispatch_boundaries_20261114.py
          bash -n deploy/cpanel_direct_command.sh
      - name: Run 29 new adversarial contract tests
        run: python3 -m unittest discover -s tests -p 'test_mpw_cpanel_dispatch_boundaries_20261114.py' -v
      - name: Recheck existing read-only source and bridge contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_mpw_onepass_cpanel_source_provenance_readonly_20261113.py' -v
          python3 -m unittest discover -s tests -p 'test_mpw_cpanel_source_bridge_readonly_20261113.py' -v
      - name: Run previously failing full CI test and forbidden operation test
        run: python3 -m pytest -q tests/test_zomorod_fields_release_guard.py -k 'cpanel_zero_write_audit_relay_is_pinned_and_syntax_valid or cpanel_relay_denies_unlisted_release_and_requires_host_key'
      - name: Explicit source-only NO-GO
        run: echo 'NO_CPANEL_SSH=YES; NO_PAYMENT=YES; NO_DEPLOY=YES; MAIN_ONLY_OWNER_GATED=YES'
