name: Remove identical unused Chromium binary from CloudLinux temp
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-remove-duplicated-cagefs-chromium.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-dedupe-cloudlinux-chromium
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify browser binary exact content and remove only identical old temp copy
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,subprocess
          from pathlib import Path
          H=Path.home()
          old=H/".cagefs/tmp/chromium"
          good=H/"browser/chromium"
          assert H==Path("/home/zomorod2")
          assert old.is_file() and good.is_file() and not old.is_symlink() and not good.is_symlink()
          assert old.stat().st_size==good.stat().st_size==209022176
          assert (H/"Saeit/manage.py").is_file()
          cr=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=10)
          proc=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10)
          assert str(old) not in cr.stdout and str(old) not in proc.stdout
          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as inp:
                  for block in iter(lambda:inp.read(4*1024*1024),b""):h.update(block)
              return h.hexdigest()
          digest=sha(good)
          assert sha(old)==digest
          old.unlink()
          assert not old.exists() and good.is_file() and sha(good)==digest
          print("CLOUDFLARE_TEMP_DUPLICATE_CHROMIUM_REMOVED=yes")
          print("CHROMIUM_DUPLICATE_BYTES_SAVED=209022176")
          print("BROWSER_PRIMARY_BINARY_PRESERVED=yes")
          PY
          REMOTE
      - name: Check protected public websites
        shell: bash
        run: |
          set -euo pipefail
          for u in "https://zomorodmelal.ir/" "https://mojplaywin.com/"; do
            s="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$u" || true)"
            echo "TEMP_CHROMIUM_POST=$u:$s"
            test "$s" = 200
          done
      - name: Delete runner private key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
