name: Mojtaba 10-photo read-only preflight
on:
  push:
    branches: ['feat/mojtaba-original-photo-gallery-20261015']
    paths:
      - '.github/workflows/mojtaba-photos-preflight.yml'
      - 'assets/mojtaba_20261015/**'
      - 'scripts/mojtaba_personal_photo_gallery.py'
permissions:
  contents: read
concurrency:
  group: mojtaba-original-photos-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check all 10 original photo digests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          spec=importlib.util.spec_from_file_location('gallery','scripts/mojtaba_personal_photo_gallery.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          mod.verify_photos(Path('assets/mojtaba_20261015'))
          print('TEN_ORIGINAL_PHOTOS_VERIFIED=yes')
          PY
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Read-only V17 static and template inspection
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ssh -F "$SSH_CONFIG" saeit-host 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP=/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17
          HOMEFILE="$APP/templates/personal_site/core/home.html"
          test -d "$APP" && test ! -L "$APP"
          test -f "$APP/manage.py" && test -f "$HOMEFILE" && test ! -L "$HOMEFILE"
          test "$(realpath "$HOMEFILE")" = "$HOMEFILE"
          grep -Fq "{% load static %}" "$HOMEFILE"
          grep -Fq "{% block content %}" "$HOMEFILE"
          ! grep -Fq 'id="owner-original-gallery-20261015"' "$HOMEFILE"
          test ! -e "$APP/static/personal_site/owner_gallery_20261015"
          echo "HOME_TEMPLATE_SHA256=$(sha256sum "$HOMEFILE" | awk '{print $1}')"
          python3 - "$APP" <<'PY'
          from pathlib import Path
          import sys,os
          app=Path(sys.argv[1])
          for d in ('static','static/personal_site','staticfiles','tmp'):
              p=app/d
              print('PATH_'+d.replace('/','_')+': present='+str(p.is_dir())+' writable='+str(p.is_dir() and os.access(p,os.W_OK)))
          for f in (app/'config/settings.py',app/'config/settings_prod.py'):
              if f.is_file():
                  for s in f.read_text(errors='replace').splitlines():
                      if any(x in s for x in ('STATIC_ROOT','STATICFILES_DIRS','STATIC_URL','WhiteNoise','whitenoise')):
                          print('SETTING='+s[:150])
          t=(app/'templates/personal_site/core/home.html').read_text()
          print('HOME_END_BLOCKS='+str(t.count('{% endblock %}')))
          PY
          for py in "$APP/../.venv_personal_test/bin/python" "$APP/.venv/bin/python" "$APP/venv/bin/python" /home/zomorod2/virtualenv/mojtaba_personal/mojtaba_roozegar_personal_v17/3.11/bin/python; do
            if test -x "$py" && "$py" -c 'import django' >/dev/null 2>&1; then echo "DJANGO_PYTHON_AVAILABLE=$py"; break; fi
          done
          echo 'READ_ONLY_PERSONAL_PREFLIGHT=passed'
          REMOTE
      - name: Delete temporary keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/photo-relay"
