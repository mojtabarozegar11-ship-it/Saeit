name: Audit Mojtaba personal public profile claims
on:
  push:
    branches: [main]
    paths: [.github/workflows/mojtaba-public-claims-audit-20261027.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojtaba-v17-inner-pages-production
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish pinned GitHub to VPS to cPanel SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-official-hub-ssh"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "HUB_SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Inspect only public biography source text on cPanel
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ssh -T -F "$HUB_SSH_CONFIG" saeit-host 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17')
          assert not root.is_symlink() and (root/'manage.py').is_file()
          base=root/'templates/personal_site/core'
          print('PROFILE_TEMPLATE_DIR='+str(base))
          candidates=sorted(p for p in base.glob('*.html') if any(s in p.name.lower() for s in ('about','contact','resume','works','gallery')))
          for p in candidates:
              print('TEMPLATE_FILE='+p.relative_to(root).as_posix())
              if p.is_symlink() or not p.is_file() or p.stat().st_size>1000000:
                  continue
              s=p.read_text(encoding='utf8')
              for token in ('Vancouver','Canada','lecturer','PROFESSIONAL PROFILE','mpw-new-originals-20261015-b','mr-scholar-title'):
                  count=s.lower().count(token.lower())
                  if count:print('TEMPLATE_TOKEN='+p.name+':'+token+':'+str(count))
              for n,line in enumerate(s.splitlines(),1):
                  if re.search(r'Vancouver|now based|my move|lecturer|LOCATION|mpw-new-originals-20261015-b|mr-scholar-title',line,re.I):
                      print('PUBLIC_COPY='+p.name+':'+str(n)+':'+line.strip()[:250])
          for py in sorted((root/'personal_site').rglob('views.py')):
              if py.is_symlink() or py.stat().st_size>1000000:continue
              for n,line in enumerate(py.read_text(encoding='utf8').splitlines(),1):
                  if re.search(r'lecturer|based in Vancouver|in Vancouver or remotely',line,re.I):
                      print('VIEW_META='+py.relative_to(root).as_posix()+':'+str(n)+':'+line.strip()[:220])
          PY
          REMOTE
      - name: Remove ephemeral relay credentials
        if: always()
        shell: bash
        run: |
          d="$RUNNER_TEMP/mpw-official-hub-ssh"
          test ! -d "$d" || rm -rf -- "$d"
