name: Restore Zomorod virtualenv packaging tools
on:
  push:
    branches:
      - codex/zomorod-runtime-repair-20261016
    paths:
      - ".github/workflows/zomorod-runtime-tooling-restore-20261016.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-runtime-tooling-restore
  cancel-in-progress: false
jobs:
  restore-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-tooling"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Restore exact prior pip tooling versions
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-tooling"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          py=/home/zomorod2/virtualenv/Saeit/3.10/bin/python
          test -x "$py"
          "$py" -m ensurepip --upgrade
          "$py" -m pip install --disable-pip-version-check --no-input --no-deps --force-reinstall 'pip==23.1' 'setuptools==67.6.1' 'wheel==0.40.0'
          "$py" - <<'PY'
          import importlib.metadata
          expected={"pip":"23.1","setuptools":"67.6.1","wheel":"0.40.0"}
          for name,want in expected.items():
              got=importlib.metadata.version(name)
              print(f"TOOL_{name.upper()}={got}")
              if got!=want: raise SystemExit(f"{name} version mismatch")
          PY
          echo "PACKAGING_TOOLING_RESTORED=verified"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-tooling"
