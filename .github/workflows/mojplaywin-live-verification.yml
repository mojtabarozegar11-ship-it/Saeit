name: MojPlayWin live 40-page verification (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source manifest and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts/verify_mojplaywin_live_specialties.py core/mojplaywin_specialties.py
      - name: Check live 40 editorial pages and both hubs
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/verify_mojplaywin_live_specialties.py | tee "$RUNNER_TEMP/mojplaywin-live-verification.log"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojplaywin-live-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/mojplaywin-live-verification.log
          if-no-files-found: ignore
          retention-days: 14
