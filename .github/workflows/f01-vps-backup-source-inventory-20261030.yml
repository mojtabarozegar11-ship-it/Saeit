name: F-01 VPS backup source size preflight (read only)
on:
  push:
    branches: [ops/offhost-backup-target-preflight-20261030]
    paths:
      - scripts/f01_backup_source_inventory_20261030.py
      - tests/test_f01_backup_source_inventory_20261030.py
      - .github/workflows/f01-vps-backup-source-inventory-20261030.yml
permissions:
  contents: read
concurrency:
  group: f01-vps-backup-source-inventory
  cancel-in-progress: false
jobs:
  source-inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify no-write and symlink regression contract
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_f01_backup_source_inventory_20261030.py' -v
      - name: Collect bounded existing-backup metadata via fingerprint-pinned SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/f01-backup-source"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          test -n "$VPS_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/known"
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ready=0
          for attempt in 1 2 3; do
            if timeout 65s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" \
              -o ConnectTimeout=20 -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ForwardAgent=no \
              githubops@178.239.147.150 \
              'python3 -B - --root /home/githubops/factory-runtime' \
              < scripts/f01_backup_source_inventory_20261030.py > "$d/inventory.json"; then
              ready=1
              echo "SOURCE_INSPECTION_SSH_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "SOURCE_INSPECTION_SSH_RETRY=$attempt"
            if test "$attempt" -lt 3; then sleep 7; fi
          done
          test "$ready" = 1 || { echo "SOURCE_INSPECTION=UNAVAILABLE"; exit 1; }
          python3 - "$d/inventory.json" <<'PY'
          import json,sys
          from pathlib import Path
          o=json.loads(Path(sys.argv[1]).read_text())
          assert o["schema"]=="f01-backup-source-inventory.v1"
          assert o["status"]=="INSPECT_ONLY" and o["read_only"] is True
          assert o["transfer_allowed"] is False and o["reboot_allowed"] is False
          print("F01_SOURCE_INVENTORY="+json.dumps(o,sort_keys=True))
          PY
          echo "OFFHOST_BACKUP=NOT_CREATED"
          echo "RESTORE=NOT_VERIFIED"
