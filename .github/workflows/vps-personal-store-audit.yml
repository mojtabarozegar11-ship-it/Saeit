name: Saeit Personal Store Read-only Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-personal-store-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-store-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-store-preflight"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            key="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$key"
            chmod 600 "$key"
            ssh-keygen -y -P '' -f "$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Inspect factory product handoff source
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          echo VPS_USER="$(id -un)"
          test -s "$base/private/autonomous-product-cycle/production-state.json"
          test -s "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          echo VPS_MANUFACTURED_ZIP_PRESENT
          stat -c 'VPS_ZIP_BYTES=%s PERMISSIONS=%a' "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          python3 - "$base/private/autonomous-product-cycle/production-state.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          for k in ('mode','depends_on_orders','built_product_count','artifact_qa_passed','publishable_product_count','store_distribution_state'):
            print('VPS_FACTORY_'+k.upper()+'='+str(j.get(k)))
          PY
          REMOTE
      - name: Inspect cPanel private staging and storefront runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo CPANEL_USER="$(id -un)"
          echo CPANEL_HOME="$HOME"
          for path in /home/zomorod2/Saeit-staging /home/zomorod2/zomorodmelal.ir /home/zomorod2/mojplaywin.com /home/zomorod2/mojtabarozegar.ir /home/zomorod2/public_html; do
            if test -d "$path" && test ! -L "$path"; then
              echo CPANEL_DIR_PRESENT="$(basename "$path")"
              if test -f "$path/manage.py"; then echo CPANEL_DJANGO_SOURCE="$(basename "$path")"; fi
              if test -f "$path/passenger_wsgi.py"; then echo CPANEL_PASSENGER_SOURCE="$(basename "$path")"; fi
              if test -d "$path/.venv"; then echo CPANEL_LOCAL_VENV="$(basename "$path")"; fi
            else
              echo CPANEL_DIR_MISSING="$(basename "$path")"
            fi
          done
          test -d /home/zomorod2/Saeit-staging
          test -w /home/zomorod2/Saeit-staging
          echo CPANEL_STAGING_WRITABLE
          if test -f /home/zomorod2/Saeit-staging/core/models.py; then
            grep -q '^class Product(' /home/zomorod2/Saeit-staging/core/models.py && echo CPANEL_DJANGO_PRODUCT_MODEL_PRESENT
          fi
          command -v python3 >/dev/null && python3 --version
          df -h "$HOME" | tail -n 1 | awk '{print "CPANEL_DISK_FREE=" $4}'
          REMOTE
      - name: Inspect Mojtaba personal app layout without modifying files
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          for root in "$HOME/mojplaywin.com/mojtaba.roozegar" "$HOME/mojtaba_personal"; do
            if test -d "$root" && test ! -L "$root"; then
              echo "PERSONAL_APP_FOLDER=$(basename "$root")"
              for path in manage.py passenger_wsgi.py wsgi.py app.py index.html index.php .htaccess config/urls.py config/settings.py pyproject.toml requirements.txt templates/index.html; do
                test -f "$root/$path" && echo "PERSONAL_APP_FILE=$(basename "$root")/$path" || true
              done
              for sub in shop store products market api admin manage; do
                test -d "$root/$sub" && echo "PERSONAL_APP_FOLDER_NESTED=$(basename "$root")/$sub" || true
              done
              python3 - "$root" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for ext in (".html",".py",".json",".php"):
              total=sum(1 for p in root.glob("*") if p.is_file() and p.suffix.lower()==ext)
              print("PERSONAL_ROOT_"+ext[1:].upper()+"_FILES="+str(total))
          PY
            fi
          done
          if test -f "$HOME/mojplaywin.com/mojtaba.roozegar/index.html"; then
            echo PERSONAL_PUBLIC_INDEX_FILE_PRESENT
            stat -c 'PERSONAL_PUBLIC_INDEX_SIZE=%s' "$HOME/mojplaywin.com/mojtaba.roozegar/index.html"
          fi
          echo PERSONAL_LAYOUT_AUDIT_DONE
          REMOTE
      - name: Classify personal public page and product routes without saving data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import urlopen,Request
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title=False
                  self.title=""
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="title": self.in_title=True
                  if tag=="a":
                      self.links.append(str(a.get("href","")))
              def handle_endtag(self,tag):
                  if tag=="title": self.in_title=False
              def handle_data(self,value):
                  if self.in_title: self.title+=value[:80]
          urls={
              "PERSONAL_ROOT":"https://mojplaywin.com/mojtaba.roozegar/",
              "PERSONAL_STORE":"https://mojplaywin.com/mojtaba.roozegar/store/",
              "PERSONAL_PRODUCTS":"https://mojplaywin.com/mojtaba.roozegar/products/",
              "PERSONAL_ADMIN":"https://mojplaywin.com/mojtaba.roozegar/manage/login/",
              "COMPANY_STORE":"https://zomorodmelal.ir/store/",
          }
          for label,url in urls.items():
              try:
                  response=urlopen(Request(url,headers={"User-Agent":"Saeit-ReadOnlyStoreAudit/1"}),timeout=12)
                  html=response.read(200000).decode("utf-8","replace")
                  parsed=Inspect();parsed.feed(html)
                  same=sum(1 for link in parsed.links if "mojtaba.roozegar" in link)
                  title=" ".join(parsed.title.split())[:100]
                  print(label+"_STATUS="+str(response.status))
                  print(label+"_HTML_TITLE="+title)
                  print(label+"_PERSONAL_INTERNAL_LINKS="+str(same))
                  print(label+"_HAS_SHOP_LINK="+str(any(x in link.lower() for link in parsed.links for x in ("/store","/shop","/products"))))
              except Exception as exc:
                  print(label+"_PROBE_ERROR="+type(exc).__name__)
          PY
      - name: Clean temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/factory-store-preflight"
