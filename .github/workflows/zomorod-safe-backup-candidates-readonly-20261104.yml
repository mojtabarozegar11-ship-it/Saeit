name: Zomorod safe backup transfer candidates metadata only
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-safe-backup-candidates-readonly-20261104.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-safe-backup-candidates-readonly-20261104
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: List backup group sizes and safe-to-transfer file metadata
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,subprocess,time
          from pathlib import Path
          root=Path("/home/zomorod2")
          assert Path.home()==root and root.is_dir()
          for relative in (".backups",".npm","Saeit/backups"):
              target=root/relative
              if not target.is_dir() or target.is_symlink():
                  print("TARGET_SKIPPED="+relative);continue
              p=subprocess.run(["du","-x","-k","--max-depth=1",str(target)],capture_output=True,text=True,timeout=180)
              if p.returncode:print("DU_INCOMPLETE="+relative)
              entries=[]
              for line in p.stdout.splitlines():
                  cells=line.split(None,1)
                  if len(cells)!=2:continue
                  try:size=int(cells[0])
                  except ValueError:continue
                  path=Path(cells[1])
                  if path==target:print("ROOT_KIB="+relative+":"+str(size))
                  elif path.parent==target:entries.append((size,path.name))
              for size,name in sorted(entries,reverse=True)[:25]:
                  print("CHILD_KIB="+relative+":"+name+":"+str(size))
              if relative!=".npm":
                  find=subprocess.run(["timeout","55s","find",str(target),"-xdev","-type","f","-size","+100M","-printf","%s %T@ %p\\n"],capture_output=True,text=True,timeout=65)
                  candidates=[]
                  for line in find.stdout.splitlines():
                      parts=line.split(" ",2)
                      if len(parts)!=3:continue
                      try:size=int(parts[0]);epoch=float(parts[1]);path=Path(parts[2])
                      except ValueError:continue
                      if path.is_relative_to(target):
                          candidates.append((size,str(path.relative_to(root)),time.strftime("%Y-%m-%d",time.gmtime(epoch))))
                  for size,path,modified in sorted(candidates,reverse=True)[:20]:
                      print("BACKUP_FILE_BYTES="+str(size)+" modified="+modified+" path="+path)
                  if find.returncode:print("FIND_INCOMPLETE="+relative)
          print("BACKUP_TRANSFER_CANDIDATES_AUDITED=yes")
          PY
      - name: Fingerprint duplicate cPanel backup files read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import hashlib,os,stat,time
          from pathlib import Path
          root=Path("/home/zomorod2/.backups")
          uid=os.geteuid(); total=0; count=0; old=0; groups={}; largest=[]
          cutoff=time.time()-30*86400
          for p in root.rglob("*"):
              try:
                  s=p.lstat()
                  if not stat.S_ISREG(s.st_mode) or s.st_uid!=uid: continue
                  count+=1; total+=s.st_size
                  if s.st_mtime<cutoff: old+=1
                  largest.append((s.st_size,p))
                  if s.st_size<1024*1024: continue
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
                  groups.setdefault((s.st_size,h.hexdigest()),[]).append(p)
              except (OSError,FileNotFoundError): pass
          print("BACKUP_DEDUP_FILES="+str(count)+":BYTES="+str(total)+":OLDER_30D="+str(old),flush=True)
          largest.sort(reverse=True,key=lambda x:x[0])
          for size,p in largest[:20]:
              print("BACKUP_LARGEST_BYTES="+str(size)+":AGE_DAYS="+str(max(0,int((time.time()-p.stat().st_mtime)/86400))),flush=True)
          dup_groups=[(size,digest,paths) for (size,digest),paths in groups.items() if len(paths)>1]
          dup_groups.sort(reverse=True,key=lambda x:x[0]*len(x[2]))
          print("BACKUP_DUPLICATE_GROUPS="+str(len(dup_groups)),flush=True)
          print("BACKUP_DUPLICATE_BYTES_EXCESS="+str(sum(size*(len(paths)-1) for size,digest,paths in dup_groups)),flush=True)
          for size,digest,paths in dup_groups[:20]:
              print("BACKUP_DUPLICATE=size:"+str(size)+":count:"+str(len(paths))+":sha256_prefix:"+digest[:16],flush=True)
              for p in sorted(paths, key=lambda q:(q.stat().st_mtime, str(q))):
                  age=max(0,int((time.time()-p.stat().st_mtime)/86400))
                  print("BACKUP_DUPLICATE_PATH=age_days:"+str(age)+":path:"+str(p.relative_to(Path("/home/zomorod2"))),flush=True)
          PY
      - name: Classify old cPanel backup groups read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,stat,time
          from pathlib import Path
          root=Path("/home/zomorod2/.backups")
          now=time.time()
          keywords=("old","preview","quarantine","candidate","snapshot","release","restore","before","v6","v8","v9","v11","v12")
          rows=[]
          for group in sorted(root.iterdir()):
              try:
                  if not group.is_dir() or group.is_symlink(): continue
                  total=files=0; oldest=now; newest=0
                  for p in group.rglob("*"):
                      try:
                          s=p.lstat()
                          if not stat.S_ISREG(s.st_mode) or s.st_uid!=os.geteuid(): continue
                          files+=1; total+=s.st_size; oldest=min(oldest,s.st_mtime); newest=max(newest,s.st_mtime)
                      except (OSError,FileNotFoundError): pass
                  age=max(0,int((now-newest)/86400)) if newest else -1
                  label="keyword" if any(k in group.name.lower() for k in keywords) else "ordinary"
                  rows.append((total,files,age,label,group.name))
              except (OSError,FileNotFoundError): pass
          rows.sort(reverse=True)
          print("BACKUP_GROUPS="+str(len(rows)),flush=True)
          for total,files,age,label,name in rows[:80]:
              print("BACKUP_GROUP=bytes:"+str(total)+":files:"+str(files)+":age_days:"+str(age)+":class:"+label+":name:"+name,flush=True)
          print("BACKUP_KEYWORD_GROUPS="+str(sum(1 for r in rows if r[3]=="keyword")),flush=True)
          print("BACKUP_KEYWORD_BYTES="+str(sum(r[0] for r in rows if r[3]=="keyword")),flush=True)
          PY
      - name: Check live references to backup archives read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,stat
          from pathlib import Path
          root=Path("/home/zomorod2/.backups")
          open_refs=[]; symlinks=[]
          for ent in Path("/proc").glob("[0-9]*"):
              try:
                  pid=int(ent.name)
                  for fd in (ent/"fd").iterdir():
                      try:
                          target=os.readlink(fd)
                          if str(root) in target: open_refs.append((pid,str(fd),target))
                      except (OSError,FileNotFoundError): pass
              except (OSError,ValueError): pass
          for p in Path("/home/zomorod2").rglob("*"):
              try:
                  if p.is_symlink() and str(root) in os.readlink(p): symlinks.append((str(p),os.readlink(p)))
              except (OSError,FileNotFoundError): pass
          print("BACKUP_OPEN_REFERENCES="+str(len(open_refs)),flush=True)
          for pid,fd,target in open_refs[:40]: print("BACKUP_OPEN_REF=pid:"+str(pid)+":fd:"+fd+":target:"+target,flush=True)
          print("BACKUP_SYMLINK_REFERENCES="+str(len(symlinks)),flush=True)
          for path,target in symlinks[:40]: print("BACKUP_SYMLINK_REF=path:"+path+":target:"+target,flush=True)
          PY
      - name: Audit npm cache and active processes read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,stat,time,subprocess
          from pathlib import Path
          root=Path("/home/zomorod2")
          for rel in (".npm/_cacache",".npm/_npx",".npm/_logs"):
              target=root/rel
              count=total=old=0
              if target.is_dir() and not target.is_symlink():
                  cutoff=time.time()-7*86400
                  for p in target.rglob("*"):
                      try:
                          s=p.lstat()
                          if stat.S_ISREG(s.st_mode) and s.st_uid==os.geteuid():
                              count+=1; total+=s.st_size
                              if s.st_mtime<cutoff: old+=s.st_size
                      except (OSError,FileNotFoundError): pass
              print("NPM_CACHE="+rel+":FILES="+str(count)+":BYTES="+str(total)+":OLDER_7D_BYTES="+str(old),flush=True)
          p=subprocess.run(["ps","-eo","pid,etime,args"],capture_output=True,text=True,timeout=15)
          hits=[line for line in p.stdout.splitlines() if any(token in line.lower() for token in ("npm","npx","node")) and "grep" not in line.lower()]
          print("NPM_ACTIVE_PROCESS_LINES="+str(len(hits)),flush=True)
          for line in hits[:20]: print("NPM_PROCESS="+line,flush=True)
          PY
      - name: Delete only exact duplicate cPanel backup files once
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import fcntl, hashlib, os, stat, time
          from pathlib import Path
          root=Path("/home/zomorod2")
          backup=root/".backups"
          marker=backup/".dedup-cleanup-20261107.done"
          if root != Path.home() or not backup.is_dir() or backup.is_symlink():
              raise SystemExit("CPANEL_DEDUP_ABORT_UNSAFE_ROOT")
          with (root/".dedup-cleanup-20261107.lock").open("a+") as lock:
              fcntl.flock(lock, fcntl.LOCK_EX|fcntl.LOCK_NB)
              if marker.exists():
                  print("CPANEL_DEDUP_ALREADY_APPLIED=1", flush=True)
              else:
                  open_refs=[]
                  for ent in Path("/proc").glob("[0-9]*"):
                      for fd in (ent/"fd").glob("*"):
                          try:
                              target=os.readlink(fd)
                              if str(backup) in target: open_refs.append(target)
                          except (OSError,FileNotFoundError): pass
                  if open_refs:
                      raise SystemExit("CPANEL_DEDUP_ABORT_OPEN_REFERENCE")
                  groups={}
                  for p in backup.rglob("*"):
                      try:
                          s=p.lstat()
                          if not stat.S_ISREG(s.st_mode) or s.st_uid!=os.geteuid() or s.st_size<1024*1024:
                              continue
                          h=hashlib.sha256()
                          with p.open("rb") as fh:
                              for chunk in iter(lambda:fh.read(1024*1024),b""): h.update(chunk)
                          groups.setdefault((s.st_size,h.hexdigest()),[]).append(p)
                      except (OSError,FileNotFoundError): pass
                  removed=0
                  reclaimed=0
                  for (size,digest), paths in groups.items():
                      if len(paths)<2: continue
                      paths.sort(key=lambda p:(p.stat().st_mtime,str(p)), reverse=True)
                      keep=paths[0]
                      for p in paths[1:]:
                          if p.is_symlink() or not p.is_file():
                              raise SystemExit("CPANEL_DEDUP_ABORT_TARGET_CHANGED")
                          p.unlink()
                          removed+=1; reclaimed+=size
                          print("CPANEL_DUPLICATE_REMOVED="+str(p.relative_to(root))+":BYTES="+str(size)+":KEPT="+str(keep.relative_to(root)),flush=True)
                  marker.write_text("exact-content duplicate cleanup completed 2026-11-07\\n")
                  os.chmod(marker,0o600)
                  print("CPANEL_DUPLICATE_REMOVED_COUNT="+str(removed),flush=True)
                  print("CPANEL_DUPLICATE_RECLAIMED_BYTES="+str(reclaimed),flush=True)
              print("CPANEL_DEDUP_NO_SERVICE_RESTART=1",flush=True)
              print("CPANEL_DEDUP_NO_CRON_CHANGED=1",flush=True)
          PY

      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          if test -d "$d"; then rm -rf -- "$d"; fi
# Continued read-only backup metadata audit; no transfer or deletion.
