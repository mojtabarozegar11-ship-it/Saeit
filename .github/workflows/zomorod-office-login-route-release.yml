name: Zomorod office private login route guard (CI only, no live release)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-login-route-release.yml"
      - "config/urls.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-login-route-release.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-office-login-route-source-check
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate current private office routes without touching the host
        run: |
          set -euo pipefail
          python3 -m py_compile config/urls.py
          python3 - <<'PY'
          from pathlib import Path

          source = Path("config/urls.py").read_text(encoding="utf-8")
          required = {
              "private_login_alias": 'path("company/office/login/", RedirectView.as_view(url="/company/office/secure-login/", permanent=False), name="company_office_login")',
              "private_office": 'path("company/office/", include("enterprise_portal.urls"))',
              "private_messages": 'path("company/office/messages/", include("company_messaging.urls"))',
              "private_marketing": 'path("company/office/marketing/", include("company_marketing.urls"))',
          }
          for name, route in required.items():
              if source.count(route) != 1:
                  raise SystemExit("OFFICE_ROUTE_INVALID:" + name)
          if 'url="/admin/login/?next=/staff/command-center/"' in source:
              raise SystemExit("OBSOLETE_STAFF_LOGIN_ALIAS_FORBIDDEN")
          print("PRIVATE_OFFICE_ROUTE_SOURCE=verified")
          print("HOST_OR_DB_MUTATION=none")
          PY
