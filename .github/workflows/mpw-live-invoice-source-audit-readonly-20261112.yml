name: MPW live invoice source and email dependency audit - readonly

on:
  workflow_dispatch:
  push:
    branches: [feature/mpw-recovery-01-20261105]
    paths:
      - '.github/workflows/mpw-live-invoice-source-audit-readonly-20261112.yml'
      - 'scripts/mpw_live_invoice_source_audit_readonly_20261112.py'
      - 'tests/test_mpw_live_invoice_source_audit_readonly_20261112.py'

permissions:
  contents: read

concurrency:
  group: mpw-invoice-source-readonly-draft
  cancel-in-progress: false

jobs:
  audit-only:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'workflow_dispatch' &&
      (
        github.ref == 'refs/heads/feature/mpw-recovery-01-20261105' ||
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate audit contract without production IO
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_mpw_live_invoice_source_audit_readonly_20261112
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m py_compile scripts/mpw_live_invoice_source_audit_readonly_20261112.py
      - name: Inspect cPanel invoice source through pinned SSH, no writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-invoice-source-audit"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          if [ -z "$HOST_KEY" ]; then
            echo 'MPW_CPANEL_DIRECT=BLOCKED_MISSING_HOST_KEY'
            exit 2
          fi
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/host.key"
          ssh-keygen -y -P "" -f "$d/host.key" > /dev/null
          # Verify cPanel directly first. Never relax the pinned host identity.
          mode=direct
          if timeout 18s ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net \
            > "$d/host.known" 2> /dev/null && test -s "$d/host.known"; then
            actual="$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)"
            if [ "$actual" != 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04' ]; then
              echo 'MPW_CPANEL_SSH=HOST_ID_MISMATCH_STOP'
              exit 10
            fi
            cat > "$d/config" <<EOF
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
            echo 'MPW_CPANEL_DIRECT=HOST_ID_VERIFIED'
          else
            echo 'MPW_CPANEL_DIRECT=HOST_KEY_UNREACHABLE'
            mode=relay
            # The VPS credential is needed only after the direct cPanel route
            # is proven unavailable. Never couple direct access to a VPS key.
            if [ -z "$VPS_KEY" ]; then
              echo 'MPW_VPS_RELAY=BLOCKED_MISSING_VPS_KEY'
              exit 12
            fi
            printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
            chmod 600 "$d/vps.key"
            ssh-keygen -y -P "" -f "$d/vps.key" > /dev/null
            if ! timeout 18s ssh-keyscan -T 10 -t rsa 178.239.147.150 \
              > "$d/vps.known" 2> /dev/null || ! test -s "$d/vps.known"; then
              echo 'MPW_VPS_RELAY=PORT22_HOST_KEY_UNREACHABLE'
              exit 11
            fi
            actual="$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)"
            if [ "$actual" != 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs' ]; then
              echo 'MPW_VPS_RELAY=HOST_ID_MISMATCH_STOP'
              exit 12
            fi
            cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
            if ! timeout 38s ssh -T -F "$d/config" saeit-vps \
                'timeout 15s ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' \
                > "$d/host.known" 2> /dev/null; then
              echo 'MPW_CPANEL_VIA_RELAY=HOST_KEY_UNREACHABLE'
              exit 13
            fi
            actual="$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)"
            if [ "$actual" != 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04' ]; then
              echo 'MPW_CPANEL_VIA_RELAY=HOST_ID_MISMATCH_STOP'
              exit 14
            fi
            echo 'MPW_CPANEL_VIA_RELAY=HOST_ID_VERIFIED'
          fi
          chmod 600 "$d/config"
          if ! result="$(timeout 90s ssh -T -F "$d/config" saeit-cpanel \
            'PYTHONDONTWRITEBYTECODE=1 python3 -B -' \
            < scripts/mpw_live_invoice_source_audit_readonly_20261112.py 2> "$d/ssh-error")"; then
            if grep -qi 'Permission denied' "$d/ssh-error"; then
              echo 'MPW_REMOTE_AUDIT=SSH_AUTH_DENIED'
            elif grep -Eqi 'timed out|Connection refused|No route to host|Network is unreachable' "$d/ssh-error"; then
              echo 'MPW_REMOTE_AUDIT=NETWORK_UNREACHABLE'
            else
              echo 'MPW_REMOTE_AUDIT=UNVERIFIED_REMOTE_ERROR'
            fi
            exit 15
          fi
          echo "MPW_CPANEL_AUDIT_TRANSPORT=$mode;READ_ONLY=TRUE;DEPLOYED=NO;PAYMENTS=0"
          # SSH success is transport evidence, NOT invoice or commercial readiness.
          # Never print unverified remote output; classify its bounded JSON instead.
          printf '%s\n' "$result" | python3 -B \
            scripts/mpw_live_invoice_source_audit_readonly_20261112.py --validate-report

  audit-on-factory-vps:
    # One-shot push of this workflow file, using the EXISTING factory-vps runner.
    # No deploy, database connection, invoice creation, email or paid operation.
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/mpw-recovery-01-20261105'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout only the pre-existing read-only audit and its fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/mpw_live_invoice_source_audit_readonly_20261112.py
            tests/test_mpw_live_invoice_source_audit_readonly_20261112.py
            services/mpw_trx_guest_commerce.py
          sparse-checkout-cone-mode: false
      - name: Validate source-only audit and evidence contract locally
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B -m unittest -q tests.test_mpw_live_invoice_source_audit_readonly_20261112
          echo 'MPW_CPANEL_SOURCE_AUDIT_LOCAL=PASS;LIVE_APP_WRITES=0'
      - name: Read live invoice source through pinned factory VPS to cPanel SSH
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if test -z "$HOST_KEY"; then
            echo 'MPW_CPANEL_SOURCE_AUDIT=BLOCKED_MISSING_HOST_SSH_KEY'
            exit 2
          fi
          d="$(mktemp -d "$RUNNER_TEMP/mpw-cpanel-invoice-ro.XXXXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$HOST_KEY" | python3 -B -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/host.key"
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          # Static, previously authenticated ED25519 public key: never use
          # opportunistic network keyscan or StrictHostKeyChecking=no.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.known"
          actual="$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)"
          if test "$actual" != 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'; then
            echo 'MPW_CPANEL_SOURCE_AUDIT=BLOCKED_PINNED_HOST_KEY_MISMATCH'
            exit 10
          fi
          cat > "$d/config" <<EOF
          Host mpw-cpanel-audit-only
            HostName 178.239.147.125
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ConnectionAttempts 1
            ServerAliveInterval 6
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          if ! timeout 65s ssh -T -F "$d/config" mpw-cpanel-audit-only \
            'PYTHONDONTWRITEBYTECODE=1 python3 -B -' \
            < scripts/mpw_live_invoice_source_audit_readonly_20261112.py \
            > "$d/remote-report" 2> "$d/transport-error"; then
            if grep -qi 'Permission denied' "$d/transport-error"; then
              echo 'MPW_CPANEL_SOURCE_AUDIT=BLOCKED_SSH_AUTH'
            elif grep -Eqi 'timed out|Connection refused|No route to host|Network is unreachable' "$d/transport-error"; then
              echo 'MPW_CPANEL_SOURCE_AUDIT=BLOCKED_TRANSPORT'
            else
              echo 'MPW_CPANEL_SOURCE_AUDIT=BLOCKED_REMOTE_OR_NETWORK_UNKNOWN'
            fi
            exit 15
          fi
          echo 'MPW_CPANEL_SOURCE_TRANSPORT=AUTHENTICATED_PINNED;READ_ONLY=TRUE;DEPLOYED=NO;INVOICES_CREATED=0'
          # Intentionally print only bounded status classifications, never
          # live Python source, customer information or a raw JSON report.
          python3 -B scripts/mpw_live_invoice_source_audit_readonly_20261112.py \
            --validate-report < "$d/remote-report"
