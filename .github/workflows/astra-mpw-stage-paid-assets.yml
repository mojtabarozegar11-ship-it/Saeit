name: Astra four commercial assets - private paid-delivery staging

on:
  push:
    branches: [factory/astra-commercial-catalog-20261015]
    paths:
      - .github/workflows/astra-mpw-stage-paid-assets.yml
      - scripts/astra_mpw_stage_paid_delivery.py
      - tests/test_astra_mpw_stage_paid_delivery.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-mpw-private-delivery-staging
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test private, checksum verified delivery staging
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/astra_mpw_stage_paid_delivery.py
          python3 -m unittest discover -s tests -p test_astra_mpw_stage_paid_delivery.py -v

  stage-private-assets:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned private SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/astra-transfer"
          mkdir -p "$d"
          for key in VPS_KEY HOST_KEY; do
            test -n "${!key}"
            printf '%s' "${!key}" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/$key"
            chmod 600 "$d/$key"
            ssh-keygen -y -P '' -f "$d/$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY
            UserKnownHostsFile $d/vps.known
          Host host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            ProxyJump vps
            IdentityFile $d/HOST_KEY
            UserKnownHostsFile $d/host.known
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 12
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
      - name: Install private delivery binder without changing active store code
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/astra-transfer"
          scp -q -F "$d/config" scripts/astra_mpw_stage_paid_delivery.py 'host:.saeit-astra-four-inbox/astra_mpw_stage_paid_delivery.py'
          ssh -F "$d/config" host 'chmod 600 "$HOME/.saeit-astra-four-inbox/astra_mpw_stage_paid_delivery.py"'
      - name: Copy four archives into private delivery root and bind disabled product metadata
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/astra-transfer/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          app="$HOME/Saeit-staging"
          doc="$HOME/mojplaywin.com"
          inbox="$HOME/.saeit-astra-four-inbox"
          py="$HOME/virtualenv/Saeit-staging/3.11/bin/python"
          test -x "$py" && test -f "$app/manage.py"
          test -f "$inbox/catalog.json" && test ! -L "$inbox"
          cd "$app"
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONPATH="$app"
          "$py" "$inbox/astra_mpw_stage_paid_delivery.py" --catalog "$inbox/catalog.json" --inbox "$inbox" --app "$app" --document-root "$doc"
          "$py" "$inbox/astra_mpw_stage_paid_delivery.py" --catalog "$inbox/catalog.json" --inbox "$inbox" --app "$app" --document-root "$doc" --apply
          "$py" "$inbox/astra_mpw_stage_paid_delivery.py" --catalog "$inbox/catalog.json" --inbox "$inbox" --app "$app" --document-root "$doc" --apply
          "$py" - <<'PY'
          import django
          django.setup()
          from django.apps import apps
          from django.conf import settings
          from types import SimpleNamespace
          from mpw_commerce.downloads import _private_file
          from pathlib import Path
          Product=apps.get_model("core","Product")
          products=list(Product.objects.filter(metadata__astra_sku__in=(
              "ASTRA-CIRCUIT-01","ASTRA-PROCURE-01","ASTRA-WATER-01","ASTRA-ORCHARD-01"
          )))
          assert len(products)==4
          doc=Path.home()/"mojplaywin.com"
          private=Path(settings.MPW_COMMERCE_PRIVATE_ASSET_ROOT).resolve()
          assert not (doc.resolve()==private or doc.resolve() in private.parents)
          for product in products:
              meta=product.metadata
              cfg=meta.get("mpw_commerce")
              assert product.active is False and product.factory_managed
              assert cfg["enabled"] is False and cfg["fulfillment"]=="digital"
              asset=_private_file(SimpleNamespace(product=product))
              assert asset.is_relative_to(private)
          print("ASTRA_DELIVERY_FOUR_PRIVATE_SHA_ASSETS_BOUND=4")
          print("ASTRA_DELIVERY_LIVE_SALE_FLAGS_UNCHANGED=YES")
          print("ASTRA_DELIVERY_DOWNLOADS_REQUIRE_VERIFIED_PAYMENT=YES")
          PY
          REMOTE
      - name: Verify public site remains safe and no asset has leaked
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/astra-transfer"
          status="$(curl -sSL --max-time 20 -o "$d/site.html" -w '%{http_code}' https://mojplaywin.com/store/)"
          echo ASTRA_DELIVERY_PUBLIC_STORE_HTTP="$status"
          test "$status" = 200
          grep -q 'ASTRA EARLY PREVIEW' "$d/site.html"
          echo ASTRA_DELIVERY_PUBLIC_STORE_UNCHANGED=TRUE
          echo ASTRA_DELIVERY_PAID_CHECKOUT_ENABLED=FALSE
      - name: Cleanup keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/astra-transfer"
