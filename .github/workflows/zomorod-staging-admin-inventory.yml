name: Zomorod admin isolated staging smoke test

on:
  push:
    branches:
      - feat/command-center-factory-readiness-20261014
    paths:
      - .github/workflows/zomorod-staging-admin-inventory.yml
      - core/**

permissions:
  contents: read

concurrency:
  group: zomorod-admin-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the reviewed PR source
        uses: actions/checkout@v4

      - name: Verify pinned SSH identities and prepare relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zomorod-staging-ssh"
          mkdir -p "$d"
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text().replace("\r\n", "\n").strip()
          p.write_text(text.replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          if [[ -n "$VPS_KNOWN" ]]; then
            printf '%s\n' "$VPS_KNOWN" > "$d/vps.known"
          else
            ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          fi
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
            LogLevel ERROR
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH identities pinned to the previously confirmed fingerprints."

      - name: Package only the reviewed Django project
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='.env.*' \
            -czf "$RUNNER_TEMP/saeit-admin-smoke.tar.gz" \
            manage.py requirements.txt config core command_center financial_core templates tests conftest.py pytest.ini
          test -s "$RUNNER_TEMP/saeit-admin-smoke.tar.gz"
          echo "Packaged Django source paths only; no V-version bundles, secrets, or databases."

      - name: Run isolated Django checks on staging
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          ACTION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-staging-ssh"
          short_sha="${SOURCE_SHA:0:12}"
          case "$short_sha" in (*[!a-f0-9]*|'') echo "Invalid source SHA"; exit 2;; esac
          release="/home/zomorod2/Saeit-staging/admin-smoke/$short_sha-$ACTION_RUN_ID"
          archive="$release/source.tar.gz"
          timeout 30s ssh -F "$d/config" saeit-host 'bash -se' <<'MAP'
          set -eu
          test "$(id -un)" = "zomorod2"
          stage=/home/zomorod2/Saeit-staging
          echo "READ_ONLY_STAGING_WEB_MAPPING:"
          for base in "$stage" "$HOME/public_html" "$HOME/domains/zomorodmelal.ir/public_html"; do
            test -d "$base" || continue
            echo "ROOT=$base"
            if test -f "$base/.htaccess"; then
              grep -Ei 'Passenger(AppRoot|BaseURI|Python)|RewriteRule|RewriteCond' "$base/.htaccess" | grep -Eiv 'password|secret|token|database_url|api[_-]?key' || true
            fi
            if test -f "$base/passenger_wsgi.py"; then
              grep -E 'sys\.path|DJANGO_SETTINGS_MODULE|get_wsgi_application' "$base/passenger_wsgi.py" || true
            fi
          done
          echo "STAGING_PASSENGER_ENTRYPOINTS:"
          find "$stage" -maxdepth 5 -type f \( -name passenger_wsgi.py -o -name .htaccess -o -name .cpanel.yml \) -print 2>/dev/null | sort | head -60 || true
          echo "CPANEL_DOMAIN_DOCUMENT_ROOTS:"
          if test -d "$HOME/domains"; then
            find "$HOME/domains" -maxdepth 3 -type d -name public_html -print 2>/dev/null | sort | head -40 || true
          fi
          if command -v uapi >/dev/null 2>&1; then
            echo "CPANEL_UAPI_DOMAIN_MAP:"
            domain_json="$(uapi --output=json DomainInfo domains_data 2>/dev/null)"
            printf '%s\n' "$domain_json" | python3 -c 'import json,sys; p=json.load(sys.stdin); r=p.get("result",{}); d=r.get("data",p.get("data",{})); d=d[0] if isinstance(d,list) and d else d; m=d.get("main_domain",{}) if isinstance(d,dict) else {}; print("UAPI_STATUS="+str(r.get("status","unknown"))); print("MAIN_DOMAIN="+str(m.get("domain","unknown"))+" ROOT="+str(m.get("documentroot","unknown"))); [print("DOMAIN="+str(x.get("domain",x.get("subdomain","")))+" ROOT="+str(x.get("documentroot",x.get("root_doc",x.get("dir",""))))) for k in ("addon_domains","sub_domains","parked_domains") for x in (d.get(k,[]) if isinstance(d,dict) else []) if isinstance(x,dict)]'
            stage_root="$(printf '%s\n' "$domain_json" | python3 -c 'import json,sys; p=json.load(sys.stdin); r=p.get("result",{}); d=r.get("data",p.get("data",{})); d=d[0] if isinstance(d,list) and d else d; xs=[x for k in ("addon_domains","sub_domains") for x in (d.get(k,[]) if isinstance(d,dict) else []) if isinstance(x,dict)]; x=next((x for x in xs if x.get("domain")=="staging.zomorodmelal.ir" or x.get("subdomain")=="staging"),{}); print(x.get("documentroot",x.get("root_doc",x.get("dir",""))))')"
            case "$stage_root" in
              "$HOME"/*)
                echo "STAGING_DOMAIN_DOCROOT=$stage_root"
                for f in "$stage_root/.htaccess" "$stage_root/passenger_wsgi.py"; do
                  if test -f "$f"; then
                    echo "STAGING_CONFIG_FILE=$f"
                    if [[ "$f" == */.htaccess ]]; then
                      grep -Ei 'Passenger(AppRoot|BaseURI|Python)|RewriteRule|RewriteCond' "$f" | grep -Eiv 'password|secret|token|database_url|api[_-]?key' || true
                    else
                      grep -E 'sys\\.path|DJANGO_SETTINGS_MODULE|get_wsgi_application' "$f" || true
                    fi
                  fi
                echo "STAGING_APP_ROOT_METADATA:"
                ls -ld "$stage_root"
                find "$stage_root" -mindepth 1 -maxdepth 1 -printf '%f %y\n' 2>/dev/null | sort | head -80
                if test -f "$stage_root/manage.py"; then
                  echo "STAGING_MANAGE_PY=present"
                  grep -E 'DJANGO_SETTINGS_MODULE' "$stage_root/manage.py" || true
                else
                  echo "STAGING_MANAGE_PY=missing"
                fi
                if test -f "$stage_root/.env"; then echo "STAGING_ENV_FILE=present (contents withheld)"; else echo "STAGING_ENV_FILE=missing"; fi
                if test -f "$stage_root/passenger_wsgi.py"; then
                  grep -E 'sys\\.path|DJANGO_SETTINGS_MODULE|get_wsgi_application' "$stage_root/passenger_wsgi.py" || true
                fi
                if test -d "$stage_root/.git"; then
                  git -C "$stage_root" rev-parse --short HEAD 2>/dev/null || true
                fi
                find "$stage_root" -maxdepth 3 -type f -name manage.py -printf '%p\n' 2>/dev/null | head -20 || true
                find "$stage_root" -maxdepth 3 -type f -name db.sqlite3 -printf '%p %s bytes\n' 2>/dev/null | head -20 || true
                find "$stage_root" -maxdepth 3 -type f -name '*.sqlite3' -printf '%p %s bytes\n' 2>/dev/null | head -20 || true
                python="$HOME/virtualenv/Saeit-staging/3.11/bin/python"
                if test -x "$python"; then
                  "$python" -c 'import django; print("STAGING_DJANGO_VERSION="+django.get_version())' 2>&1 || true
                fi
                done
                ;;
              *) echo "STAGING_DOMAIN_DOCROOT=unresolved";;
            esac
          else
            echo "CPANEL_UAPI=unavailable"
          fi
          echo "READ_ONLY_WEB_MAPPING_INVENTORY_COMPLETE"
          MAP
          timeout 30s ssh -F "$d/config" saeit-host "mkdir -p '$release' && test ! -e '$archive'"
          scp -F "$d/config" "$RUNNER_TEMP/saeit-admin-smoke.tar.gz" "saeit-host:$archive"
          timeout 240s ssh -F "$d/config" saeit-host "bash -se -- '$release' '$short_sha'" <<'REMOTE'
          set -eu
          release="$1"
          source_sha="$2"
          stage=/home/zomorod2/Saeit-staging
          case "$release" in "$stage"/admin-smoke/*) ;; *) echo "Refusing path outside isolated staging"; exit 20;; esac
          test "$(id -un)" = "zomorod2"
          test -d "$release"
          test -s "$release/source.tar.gz"
          tar -xzf "$release/source.tar.gz" -C "$release"
          rm -f "$release/source.tar.gz"
          test -f "$release/manage.py"
          python="$HOME/virtualenv/Saeit-staging/3.11/bin/python"
          test -x "$python"
          "$python" -c 'import django, environ; print("DJANGO_VERSION=" + django.get_version()); print("DJANGO_ENVIRON=available")'
          export SECRET_KEY="staging-smoke-$source_sha"
          export DEBUG=0
          export ALLOWED_HOSTS=localhost
          export DATABASE_URL="sqlite:///$release/isolated-smoke.sqlite3"
          cd "$release"
          "$python" manage.py check
          "$python" manage.py makemigrations --check --dry-run
          "$python" manage.py migrate --noinput
          "$python" manage.py collectstatic --noinput
          "$python" manage.py test
          echo "ISOLATED_STAGING_DJANGO_SMOKE=PASS"
          echo "SOURCE_SHA=$source_sha"
          echo "ISOLATED_RELEASE=$release"
          echo "DATABASE=private SQLite under this release directory"
          REMOTE

      - name: Connect the tested admin to staging.zomorodmelal.ir
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          ACTION_RUN_ID: ${{ github.run_id }}
          STAGING_ADMIN_PASSWORD_HASH: pbkdf2_sha256$1000000$9b9f0f016ae4a03a4543a986$E9ubOZPT4k/WeOswk3jnDn9xzI49V+aPIHE6w9qGE0U=
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-staging-ssh"
          short_sha="${SOURCE_SHA:0:12}"
          case "$short_sha" in (*[!a-f0-9]*|'') echo "Invalid source SHA"; exit 2;; esac
          release="/home/zomorod2/Saeit-staging/admin-smoke/$short_sha-$ACTION_RUN_ID"
          docroot=/home/zomorod2/Saeit-staging-web
          backup="/home/zomorod2/Saeit-staging/backups/staging-web-admin-$short_sha-$ACTION_RUN_ID"
          timeout 30s ssh -F "$d/config" saeit-host "STAGE_ADMIN_PASSWORD_HASH='$STAGING_ADMIN_PASSWORD_HASH' bash -se -- '$release' '$docroot' '$backup' '$short_sha'" <<'REMOTE'
          set -eu
          release="$1"
          docroot="$2"
          backup="$3"
          source_sha="$4"
          stage=/home/zomorod2/Saeit-staging
          case "$release" in "$stage"/admin-smoke/*) ;; *) echo "Refusing release outside Saeit-staging"; exit 30;; esac
          test "$docroot" = /home/zomorod2/Saeit-staging-web
          test "$(id -un)" = zomorod2
          test -f "$release/manage.py"
          test -s "$release/isolated-smoke.sqlite3"
          test -f "$docroot/.htaccess"
          test -f "$docroot/passenger_wsgi.py"
          test "$(grep -c '^PassengerAppRoot ' "$docroot/.htaccess")" = 1
          test "$(grep '^PassengerAppRoot ' "$docroot/.htaccess" | awk '{print $2}')" = "$docroot"
          test "$(grep '^PassengerBaseURI ' "$docroot/.htaccess" | awk '{print $2}')" = /
          python="$HOME/virtualenv/Saeit-staging/3.11/bin/python"
          test -x "$python"
          mkdir -p "$backup"
          cp -p "$docroot/.htaccess" "$backup/.htaccess"
          cp -p "$docroot/passenger_wsgi.py" "$backup/passenger_wsgi.py"
          secret="$("$python" -c 'import secrets; print(secrets.token_urlsafe(48))')"
          {
            printf 'SECRET_KEY=%s\n' "$secret"
            printf 'DEBUG=False\n'
            printf 'ALLOWED_HOSTS=staging.zomorodmelal.ir,localhost\n'
            printf 'CSRF_TRUSTED_ORIGINS=https://staging.zomorodmelal.ir\n'
            printf 'DATABASE_URL=sqlite:///%s/isolated-smoke.sqlite3\n' "$release"
          } > "$release/.env"
          chmod 600 "$release/.env" "$release/isolated-smoke.sqlite3"
          cat > "$release/passenger_wsgi.py" <<'PY'
          import os
          import sys
          BASE_DIR = os.path.dirname(os.path.abspath(__file__))
          if BASE_DIR not in sys.path:
              sys.path.insert(0, BASE_DIR)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          from django.core.wsgi import get_wsgi_application
          application = get_wsgi_application()
          PY
          chmod 644 "$release/passenger_wsgi.py"
          export STAGE_ADMIN_PASSWORD_HASH
          cd "$release"
          "$python" manage.py check
          "$python" manage.py migrate --noinput
          "$python" manage.py shell -c 'import os; from django.contrib.auth import get_user_model; User=get_user_model(); u,created=User.objects.get_or_create(username="09175814408"); u.email="admin@zomorodmelal.ir"; u.password=os.environ["STAGE_ADMIN_PASSWORD_HASH"]; u.is_active=True; u.is_staff=True; u.is_superuser=True; u.save(); print("STAGING_OWNER_SUPERUSER=ready")'
          unset STAGE_ADMIN_PASSWORD_HASH secret
          mkdir -p "$release/tmp"
          sed "s#^PassengerAppRoot .*#PassengerAppRoot $release#" "$backup/.htaccess" > "$docroot/.htaccess.next"
          test "$(grep -c "^PassengerAppRoot $release$" "$docroot/.htaccess.next")" = 1
          chmod --reference="$backup/.htaccess" "$docroot/.htaccess.next"
          mv "$docroot/.htaccess.next" "$docroot/.htaccess"
          touch "$release/tmp/restart.txt" "$docroot/tmp/restart.txt"
          "$python" manage.py check
          echo "STAGING_ADMIN_CONNECTED=1"
          echo "STAGING_URL=https://staging.zomorodmelal.ir/admin/"
          echo "STAGING_APP_ROOT=$release"
          echo "STAGING_BACKUP=$backup"
          echo "PRODUCTION_PATH_UNCHANGED=yes"
          REMOTE
          response="$RUNNER_TEMP/staging-admin-login.html"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 45 --retry 4 --retry-delay 2 --resolve staging.zomorodmelal.ir:443:178.239.147.125 -o "$response" -w '%{http_code}' https://staging.zomorodmelal.ir/admin/login/)"
          if [[ "$code" != "200" ]] || ! grep -Eqi 'name="username"|id="login-form"' "$response"; then
            echo "Staging admin login route did not return the expected Django login form (HTTP $code); restoring the previous staging Passenger root."
            timeout 30s ssh -F "$d/config" saeit-host "cp -p '$backup/.htaccess' '$docroot/.htaccess' && touch '$docroot/tmp/restart.txt'"
            exit 1
          fi
          css_url="$(python3 - "$response" <<'PY'
          import re, sys
          page = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r'href=["\x27]([^"\x27]*static/admin/css/base[^"\x27]*\.css)', page)
          print(match.group(1) if match else "/static/admin/css/base.css")
          PY
          )"
          css_code="$(curl --silent --show-error --connect-timeout 15 --max-time 30 --resolve staging.zomorodmelal.ir:443:178.239.147.125 -o /dev/null -w '%{http_code}' "https://staging.zomorodmelal.ir$css_url")"
          if [[ "$css_code" != "200" ]]; then
            echo "Staging admin CSS failed (HTTP $css_code); restoring the previous staging Passenger root."
            timeout 30s ssh -F "$d/config" saeit-host "cp -p '$backup/.htaccess' '$docroot/.htaccess' && touch '$docroot/tmp/restart.txt'"
            exit 1
          fi
          echo "STAGING_ADMIN_HTTP=200"
          echo "STAGING_ADMIN_CSS_HTTP=200"
          rm -f "$response"

      - name: Remove temporary SSH credentials and local archive
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zomorod-staging-ssh" "$RUNNER_TEMP/saeit-admin-smoke.tar.gz"
