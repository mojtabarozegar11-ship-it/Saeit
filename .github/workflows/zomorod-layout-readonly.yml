name: Audit Zomorod live layout without changing files
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-layout-readonly.yml"
permissions:
  contents: read
jobs:
  audit-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the confirmed pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-root"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"

      - name: List expected template paths and active root state
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'bash -s' <<'REMOTE'
          for rel in public_html/index.html public_html/.htaccess Saeit/core/templates/core/platform_page.html Saeit/core/templates/core/services.html Saeit/core/templates/core/blog.html Saeit/core/templates/core/academy.html Saeit-staging/core/templates/core/platform_page.html; do
            if test -f "$HOME/$rel"; then echo "PRESENT: $rel"; else echo "MISSING: $rel"; fi
          done
          if test -f "$HOME/public_html/index.html"; then
            if grep -q 'saeit-zomorod-root-homepage-v1' "$HOME/public_html/index.html"; then echo "MANAGED_ROOT=yes"; else echo "MANAGED_ROOT=no"; fi
          fi
          if test -f "$HOME/public_html/.htaccess"; then
            if grep -q 'PassengerAppRoot' "$HOME/public_html/.htaccess"; then echo "PASSENGER_DIRECTIVES=yes"; else echo "PASSENGER_DIRECTIVES=no"; fi
          fi
          REMOTE
      - name: Identify content roots and Passenger application paths
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'bash -s' <<'REMOTE'
          echo "ACTIVE_PASSENGER_MAPPING"
          uapi --output=json PassengerApps list_applications | python3 -c 'import sys,json; x=json.load(sys.stdin); stack=[x]; seen=set()
          while stack:
              y=stack.pop()
              if isinstance(y,dict):
                  if y.get("domain") in ("zomorodmelal.ir","www.zomorodmelal.ir"):
                      k=(y.get("domain"),y.get("base_uri"),y.get("path"),y.get("enabled"))
                      if k not in seen: seen.add(k); print("APP_MAP="+str(k))
                  stack.extend(y.values())
              elif isinstance(y,list): stack.extend(y)'
          echo "TEMPLATE_INVENTORY"
          for base in "$HOME/Saeit" "$HOME/Saeit-staging"; do
            if test -d "$base"; then
              find "$base" -maxdepth 6 -type f -name 'platform_page.html' -print | head -10
              find "$base" -maxdepth 6 -type f -name 'services.html' -print | head -10
              find "$base" -maxdepth 6 -type f -name 'passenger_wsgi.py' -print | head -10
            fi
          done
          for p in "$HOME/public_html/index.html" "$HOME/Saeit-staging/core/templates/core/platform_page.html" "$HOME/Saeit/core/views.py"; do
            if test -f "$p"; then
              echo "CONTENT_SHA $(sha256sum "$p" | cut -c1-20) FILE=$p"
            fi
          done
          if test -f "$HOME/public_html/index.html"; then
            grep -oi -m1 '<title>[^<]*</title>' "$HOME/public_html/index.html" || true
          fi
          echo "ROOT_HTACCESS_PASSENGER_APP_ROOT"
          if test -f "$HOME/public_html/.htaccess"; then
            grep -E '^Passenger(AppRoot|BaseURI|Python|AppType|StartupFile)' "$HOME/public_html/.htaccess" || true
          fi
          REMOTE
      - name: Map static route files without modifications
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'bash -s' <<'REMOTE'
          for route in industry research knowledge company blog market economy studio agents weather store auctions newsletter agriculture amozeshgah services education academy; do
            file="$HOME/public_html/$route/index.html"
            if test -f "$file"; then echo "STATIC_ROUTE $route = yes size=$(wc -c < "$file")"; else echo "STATIC_ROUTE $route = no"; fi
          done
          for route in industry research knowledge company blog store; do
            if test -f "$HOME/public_html/$route/index.html"; then
              grep -oi -m1 '<title>[^<]*</title>' "$HOME/public_html/$route/index.html" || true
            fi
          done
          REMOTE
      - name: Check public response codes
        shell: bash
        run: |
          for route in "" "industry/" "research/" "knowledge/" "company/" "blog/" "store/" "amozeshgah/" "agriculture/"; do
            status="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/$route" || true)"
            echo "HTTP /$route = $status"
          done
      - name: Compare live route identities
        shell: bash
        run: |
          for route in "" "industry/" "research/" "knowledge/" "company/" "blog/" "store/" "agriculture/" "amozeshgah/"; do
            file="$RUNNER_TEMP/zomorod-public-page.html"
            curl -fsSL --max-time 20 "https://zomorodmelal.ir/$route" -o "$file"
            digest="$(sha256sum "$file" | cut -c1-16)"
            title="$(grep -oim1 '<title>[^<]*</title>' "$file" | cut -c1-120 || true)"
            echo "PAGE_IDENTITY=/$route HASH=$digest SIZE=$(wc -c < "$file") TITLE=$title"
          done
      - name: Match served document hashes to safe document root files
        shell: bash
        run: |
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib
          root=Path.home()/"public_html"
          fingerprints={"industry":"6906e16c81e40e64","research":"45998edee4c9b1df","knowledge":"ba15e20397e6eab2","company":"c8a1a2689cf3aacb","blog":"72bc5a23d7b0c960","store":"7462edc1d3391a18","agriculture":"271bb8ff1aa59443","amozeshgah":"87f5aedc6bf858b6"}
          visited=0
          for p in root.rglob("*.html"):
              if p.is_symlink() or not p.is_file(): continue
              if len(p.relative_to(root).parts)>7: continue
              if p.stat().st_size>1000000: continue
              visited+=1
              digest=hashlib.sha256(p.read_bytes()).hexdigest()[:16]
              found=[k for k,v in fingerprints.items() if digest==v]
              if found: print("FINGERPRINT_MATCH="+",".join(found)+" FILE="+str(p.relative_to(root)))
          print("HTML_FILES_SCANNED="+str(visited))
          PY
      - name: Clean temporary access materials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-root"
