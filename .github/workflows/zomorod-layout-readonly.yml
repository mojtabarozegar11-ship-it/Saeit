name: Audit Zomorod live layout without changing files
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-layout-readonly.yml"
permissions:
  contents: read
jobs:
  audit-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the confirmed pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-root"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"

      - name: List expected template paths and active root state
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel 'bash -s' <<'REMOTE'
          for rel in public_html/index.html public_html/.htaccess Saeit/core/templates/core/platform_page.html Saeit/core/templates/core/services.html Saeit/core/templates/core/blog.html Saeit/core/templates/core/academy.html Saeit-staging/core/templates/core/platform_page.html; do
            if test -f "$HOME/$rel"; then echo "PRESENT: $rel"; else echo "MISSING: $rel"; fi
          done
          if test -f "$HOME/public_html/index.html"; then
            if grep -q 'saeit-zomorod-root-homepage-v1' "$HOME/public_html/index.html"; then echo "MANAGED_ROOT=yes"; else echo "MANAGED_ROOT=no"; fi
          fi
          if test -f "$HOME/public_html/.htaccess"; then
            if grep -q 'PassengerAppRoot' "$HOME/public_html/.htaccess"; then echo "PASSENGER_DIRECTIVES=yes"; else echo "PASSENGER_DIRECTIVES=no"; fi
          fi
          REMOTE
      - name: Check public response codes
        shell: bash
        run: |
          for route in "" "industry/" "research/" "knowledge/" "company/" "blog/" "store/" "amozeshgah/" "agriculture/"; do
            status="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/$route" || true)"
            echo "HTTP /$route = $status"
          done
      - name: Clean temporary access materials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-root"
