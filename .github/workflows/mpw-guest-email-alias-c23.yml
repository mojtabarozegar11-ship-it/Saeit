name: MPW guest purchase-email ownership contract

on:
  pull_request:
    branches: [integration/mpw-recovery-main-20261107]
    paths:
      - .github/workflows/mpw-guest-email-alias-c23.yml
      - services/mpw_trx_guest_commerce.py
      - tests/test_mpw_guest_email_only_checkout_20261108.py

permissions:
  contents: read

jobs:
  guest-email-alias:
    if: github.event_name == 'pull_request' && github.base_ref == 'integration/mpw-recovery-main-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-guest-ownership-only"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - name: Read repository source without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install existing project requirements
        run: python -m pip install -r requirements.txt
      - name: Verify guest-email source and exact regression tests with isolated settings
        run: |
          set -euo pipefail
          python -m py_compile services/mpw_trx_guest_commerce.py tests/test_mpw_guest_email_only_checkout_20261108.py
          pytest -q --ds=tests.mpw_recovery_test_settings tests/test_mpw_guest_email_only_checkout_20261108.py
