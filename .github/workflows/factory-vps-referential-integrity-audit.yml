name: Factory VPS Factory Referential Integrity Audit
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/factory-vps-referential-integrity-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Verify independent factory runtime assets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -f "$base/django-app/manage.py"
          test -f "$base/django-app/core/models.py"
          test -f "$base/django-app/config/settings.py"
          test -x "$base/.venv/bin/python"
          test -f "$HOME/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3"
          "$base/.venv/bin/python" -c 'import django,sqlite3; print("DJANGO",django.get_version())'
          "$base/.venv/bin/python" - <<'PY'
          import os,sqlite3
          p=os.path.expanduser("~/factory-transfer-incoming/private-db/factory-migration-snapshot.sqlite3")
          db=sqlite3.connect("file:"+p+"?mode=ro",uri=True)
          db.execute("pragma foreign_keys=on")
          violations=db.execute("pragma foreign_key_check").fetchall()
          print("GLOBAL_FOREIGN_KEY_VIOLATIONS",len(violations))
          for table in ("core_factoryrun","core_factoryevidence","core_factoryartifact","core_factoryreleasemanifest","core_factoryreleasegate","core_factorymarketeligibility"):
              print("FACTORY_FK_VIOLATIONS",table,sum(1 for row in violations if row[0]==table))
          print("FACTORY_AGENT_COUNT",db.execute("select count(*) from core_agent where code like 'factory-%'").fetchone()[0])
          print("FACTORY_TASKS",db.execute("select count(*) from core_agenttask where agent_id in (select id from core_agent where code like 'factory-%')").fetchone()[0])
          db.close()
          PY
          echo REFERENTIAL_INTEGRITY_AUDIT_COMPLETE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay"
