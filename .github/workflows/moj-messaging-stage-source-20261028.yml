name: "Moj Messaging - guarded private VPS source-only staging"
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths:
      - '.github/workflows/moj-messaging-stage-source-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: moj-messaging-source-stage-20261028
  cancel-in-progress: false
jobs:
  stage-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.actor == 'mojtabarozegar11-ship-it' && github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source-only archive
        shell: bash
        run: |
          set -euo pipefail
          cd ops/messaging-bridge
          python3 -B -m unittest discover -s tests -v
          node --check whatsapp.mjs
          node tests/test_whatsapp_flow.mjs
          bash -n install.sh control.sh
          cd ../..
          git ls-files -s ops/messaging-bridge | awk '$1 != "100644" && $1 != "100755" {bad=1} END {exit bad}'
          git archive --format=tar HEAD ops/messaging-bridge | gzip -n > "$RUNNER_TEMP/mmsg-source.tar.gz"
          test -s "$RUNNER_TEMP/mmsg-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/mmsg-source.tar.gz" > "$RUNNER_TEMP/mmsg-files.txt"
          grep -Fqx ops/messaging-bridge/telegram.py "$RUNNER_TEMP/mmsg-files.txt"
          grep -Fqx ops/messaging-bridge/whatsapp.mjs "$RUNNER_TEMP/mmsg-files.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$)|\.session|creds\.json|bridge\.env$)' "$RUNNER_TEMP/mmsg-files.txt"; then
            echo 'MMSG_ARCHIVE_REJECTED_UNSAFE_PATH_OR_CREDENTIAL'; exit 1
          fi
      - name: Copy SHA-verified source only (NO LOGIN OR DAEMON)
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$(mktemp -d "$RUNNER_TEMP/mmsg-stage-ssh.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10)
          revision="$(git rev-parse --short=12 HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{12}$ ]]
          checksum="$(sha256sum "$RUNNER_TEMP/mmsg-source.tar.gz" | awk '{print $1}')"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          timeout 40s ssh "${opts[@]}" githubops@178.239.147.150 'bash -s' "$revision" <<'REMOTE'
          set -eu
          revision="$1"
          test "$(id -un)" = githubops
          test -d /home/githubops/factory-runtime
          free_kib="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          test "$free_kib" -ge 524288
          release="$HOME/private-messaging-bridge/releases/$revision"
          umask 077
          mkdir -p -m 0700 "$release"
          echo 'MMSG_PRIVATE_STAGE_PATH_READY'
          REMOTE
          timeout 80s ssh "${opts[@]}" githubops@178.239.147.150 "umask 077; cat > \"\$HOME/private-messaging-bridge/releases/$revision/source.tar.gz\"" < "$RUNNER_TEMP/mmsg-source.tar.gz"
          timeout 60s ssh "${opts[@]}" githubops@178.239.147.150 'bash -s' "$revision" "$checksum" <<'REMOTE'
          set -eu
          revision="$1"; expected="$2"
          release="$HOME/private-messaging-bridge/releases/$revision"
          cd "$release"
          actual="$(sha256sum source.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -tzf source.tar.gz > source-files.txt
          grep -Fqx ops/messaging-bridge/telegram.py source-files.txt
          grep -Fqx ops/messaging-bridge/whatsapp.mjs source-files.txt
          tar --no-same-owner -xzf source.tar.gz
          test -s ops/messaging-bridge/telegram.py
          test -s ops/messaging-bridge/whatsapp.mjs
          echo 'MMSG_VPS_SOURCE_STAGE_SHA256=PASS'
          echo 'MMSG_NO_INSTALL_NO_SERVICE_NO_PAIRING=PASS'
          REMOTE
      - name: Record source-stage proof against exact commit SHA
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=moj-messaging-vps-source-stage \
            -f description='Isolated source archive SHA256 verified; no services or logins'
      - name: Record blocked source-stage proof (no secret data)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=moj-messaging-vps-source-stage \
            -f description='Source staging blocked; no login or service activation'
