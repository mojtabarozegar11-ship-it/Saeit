name: MojPlayWin isolated public editorial read-only survey
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-publisher-isolation-probe.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: fa53729c21dbbec8123ba1e0eedb49f68be98b92
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Identify independent web root and Passenger rewrite precedence READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          payload="$(base64 -w0 scripts/mpw_publication_readonly_probe_cpanel.py)"
          timeout 60s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$payload\"))'"
      - name: Independently measure public publication route prior to changes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          for path in ("/","/agents/","/knowledge/","/mpw-editorial/","/mpw-editorial/agents/"):
              url="https://mojplaywin.com"+path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"MPW-safe-probe/1.0"}),timeout=12) as r:
                      print("ROUTE_BEFORE path="+path+" status="+str(r.status)+" content_type="+r.headers.get("Content-Type","")[:60])
              except urllib.error.HTTPError as e:
                  print("ROUTE_BEFORE path="+path+" status="+str(e.code))
              except Exception as e:
                  print("ROUTE_BEFORE path="+path+" error="+type(e).__name__)
          PY
      - name: Clean ephemeral runner SSH keys
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
