name: MojPlayWin isolated public editorial read-only survey
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-publisher-isolation-probe.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: fa53729c21dbbec8123ba1e0eedb49f68be98b92
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Identify independent web root and Passenger rewrite precedence READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          payload="$(base64 -w0 scripts/mpw_publication_readonly_probe_cpanel.py)"
          timeout 60s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$payload\"))'"
      - name: Independently measure public publication route prior to changes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          for path in ("/","/agents/","/knowledge/","/mpw-editorial/","/mpw-editorial/agents/"):
              url="https://mojplaywin.com"+path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"MPW-safe-probe/1.0"}),timeout=12) as r:
                      print("ROUTE_BEFORE path="+path+" status="+str(r.status)+" content_type="+r.headers.get("Content-Type","")[:60])
              except urllib.error.HTTPError as e:
                  print("ROUTE_BEFORE path="+path+" status="+str(e.code))
              except Exception as e:
                  print("ROUTE_BEFORE path="+path+" error="+type(e).__name__)
          PY
      - name: Diagnose MojPlayWin real domain document root without writes
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json,subprocess
          p=subprocess.run(["uapi","--output=json","DomainInfo","single_domain_data","domain=mojplaywin.com"],capture_output=True,text=True,timeout=20)
          print("SINGLE_DOMAIN_INFO_OK="+str(p.returncode==0))
          if p.returncode==0:
              r=json.loads(p.stdout)
              def scan(obj):
                  if isinstance(obj,dict):
                      print("DOMAIN_DATA_FIELDS="+json.dumps({k:v for k,v in obj.items() if k.lower() in ("domain","documentroot","document_root","dir","homedir","type","domain_type","base_uri","webroot","web_root")},default=str)[:800])
                      for value in obj.values():scan(value)
                  elif isinstance(obj,list):
                      for value in obj:scan(value)
              scan(r.get("result",r))
          PY
      - name: Compare known public static targets without writes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          for path in ("/design-preview-20261017/production-home-20261017.html",
                       "/mpw-editorial/index.html","/mpw-editorial/style.css",
                       "/design-preview-20261017/"):
              url="https://mojplaywin.com"+path+"?probe="+str(time.time_ns())
              try:
                  with urllib.request.urlopen(url,timeout=14) as r:
                      body=r.read(1000).decode("utf8","replace")
                      print("STATIC_ROUTE_PROBE path="+path+" status="+str(r.status)
                            +" mime="+str(r.headers.get("Content-Type"))+" sample="+body[:90].replace("\n"," "))
              except urllib.error.HTTPError as e:
                  print("STATIC_ROUTE_PROBE path="+path+" status="+str(e.code))
              except Exception as e:
                  print("STATIC_ROUTE_PROBE path="+path+" failure="+type(e).__name__)
          PY
      - name: Independently confirm Gen65 is running and MAIN editorials are public
        shell: bash
        run: |
          set -euo pipefail
          timeout 55s ssh -T -F "$RUNNER_TEMP/mojplaywin-inventory-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json, subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path("/home/zomorod2/.private_mojplaywin_main_agents/evolution_runtime_20261018")
          public=Path("/home/zomorod2/mojplaywin.com/mpw-editorial")
          def read(path):
              assert path.is_file() and not path.is_symlink(),str(path)
              return json.loads(path.read_text())
          gen=read(root/"gen65_operational_report.json")
          evt=read(root/"last_report.json")
          content=read(root/"page_content_20261018/last_report.json")
          release=read(root/"editorial_publication_state.json")
          owner=read(public/".mpw-editorial-owner.json")
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=14,check=True)
          marks=[v for v in cron.stdout.splitlines() if "MPW_PRIVATE_EVOLUTION_MAIN_ONLY_20261018" in v]
          assert len(marks)==1 and marks[0].startswith("* * * * * ")
          assert gen["status"]=="gen65_operational_private"
          assert gen["active_private_generation"]==65
          assert gen["tenant"]=="mojplaywin-main"
          assert evt["master_generation"]==64
          assert evt["auto_published"] is False and evt["shared_runtime_modified"] is False
          assert content["status"]=="active_private_page_content_pipeline"
          assert content["tenant"]=="mojplaywin-main"
          assert content["total_drafts"]>=2
          assert owner["scope"]=="mojplaywin-main-static-mpw-editorial-only"
          assert owner["published_articles"]>=2
          assert release["status"]=="published_verified_by_external_smoke"
          assert (public/"index.html").is_file()
          assert (public/"agents/index.html").is_file()
          assert (public/"agents/ai-evaluation-before-deployment/index.html").is_file()
          seen=datetime.fromisoformat(gen["observed_utc"].replace("Z","+00:00"))
          lag=(datetime.now(timezone.utc)-seen).total_seconds()
          assert 0<=lag<=900, "Gen65 stale, last observation too old"
          print("GEN65_PRIVATE_OPERATION_RUNNING=true")
          print("GEN65_LAST_OBSERVATION_AGE_SECONDS="+str(int(lag)))
          print("GEN65_CYCLE_EPOCH="+str(gen["cycle_epoch"]))
          print("GEN65_CRON_EVERY_MINUTE=true")
          print("MAIN_CONTENT_PIPELINE_ACTIVE=true")
          print("GENERATED_DRAFTS="+str(content["total_drafts"]))
          print("PUBLISHED_MAIN_DOMAIN_ARTICLES="+str(owner["published_articles"]))
          print("PUBLICATION_EXTERNAL_HTTP_SMOKE_CONFIRMED=true")
          print("PUBLIC_MAIN_AND_SIBLING_SITES_UNTOUCHED=true")
          PY
      - name: Clean ephemeral runner SSH keys
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-inventory-ssh"
