name: Living Cities scoped HTTP origin diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/living-cities-http-origin-diagnostics-20261101.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  route-probe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compare runner IPv4/IPv6 HTTPS access before using remote host
        run: |
          set -euo pipefail
          for family in -4 -6; do
            for path in / /games/; do
              status="$(curl "$family" -sSL --connect-timeout 8 --max-time 15 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
              echo "RUNNER_HTTPS family=$family route=$path http=$status"
            done
          done
      - name: Create host-key pinned relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Compare cPanel local HTTPS using loopback and resolved host IPv4
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 80s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          for addr in 127.0.0.1; do
            for path in / /games/ /living-cities/play/; do
              code="$(curl -ksS -4 --connect-timeout 5 --max-time 9 --resolve "zomorodmelal.ir:443:$addr" -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
              echo "CPANEL_LOOPBACK addr=$addr route=$path http=$code"
            done
          done
          ip="$(getent ahostsv4 zomorodmelal.ir | awk 'NR==1{print $1}')"
          if [ -n "$ip" ]; then
            echo "CPANEL_RESOLVED_IPV4_PRESENT=yes"
            for path in / /games/ /living-cities/play/; do
              code="$(curl -ksS -4 --connect-timeout 5 --max-time 9 --resolve "zomorodmelal.ir:443:$ip" -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
              echo "CPANEL_RESOLVED route=$path http=$code"
            done
          fi
          REMOTE
      - name: Wipe SSH files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
