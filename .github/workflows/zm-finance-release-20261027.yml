name: Publish isolated ZM financial services portal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zm-finance-release-20261027.yml']
permissions:
  contents: read
concurrency:
  group: zm-finance-isolated
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-structure-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Publish isolated portal and verify requests with rollback
        run: |
          timeout 240s ssh -T -F "$RUNNER_TEMP/mpw-structure-ssh/config" saeit-cpanel 'python3 -' <<'PY'
          import json
          FILES=json.loads('{"index.html": "<!doctype html>\\n<html lang=\\"fa\\" dir=\\"rtl\\"><head><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\"><meta name=\\"theme-color\\" content=\\"#123d32\\"><meta name=\\"description\\" content=\\"مرکز خدمات مالی زمرد ملل؛ بررسی درخواست خدمات ریالی، ارزی، دیجیتال و طلا، همراه با ابزار محاسبه هزینه و پیگیری درخواست.\\"><title>زمرد پی | مرکز خدمات مالی زمرد ملل</title><link rel=\\"canonical\\" href=\\"https://zomorodmelal.ir/%24%24zm/\\"><link rel=\\"stylesheet\\" href=\\"style.css\\"></head>\\n<body><a class=\\"skip\\" href=\\"#main\\">رفتن به محتوای اصلی</a><aside><a class=\\"brand\\" href=\\"./\\"><span class=\\"brand-mark\\">◈</span><span>زمرد پی<small>خدمات مالی زمرد ملل</small></span></a><div class=\\"nav-label\\">میز خدمات شما</div><nav><a class=\\"selected\\" href=\\"#overview\\">⌂ <span>نمای کلی</span></a><a href=\\"#services\\">⊞ <span>همه خدمات</span></a><a href=\\"#calculator\\">⇄ <span>محاسبه ارز و طلا</span></a><a href=\\"#request\\">↗ <span>ثبت درخواست</span></a><a href=\\"#tracking\\">▤ <span>پیگیری درخواست</span></a><a href=\\"#questions\\">؟ <span>راهنما و شفافیت</span></a></nav><div class=\\"aside-foot\\"><span class=\\"dot\\"></span> ثبت درخواست بررسی فعال است<p>پرداخت و معامله هنوز فعال نیست.</p><a href=\\"/\\">بازگشت به زمرد ملل ←</a></div></aside>\\n<main id=\\"main\\"><header><span>زمرد ملل <b>/</b> مرکز خدمات مالی</span><a class=\\"outline\\" href=\\"#tracking\\">پیگیری درخواست ↗</a></header>\\n<section id=\\"overview\\" class=\\"hero\\"><div><span class=\\"eyebrow\\">ZOMOROD PAY · FINANCIAL SERVICES</span><h1>دنیای مالی شما،<br><em>یک\u200cجا و روشن.</em></h1><p class=\\"lead\\">از خدمات ریالی و پرداخت\u200cهای جهانی تا دارایی دیجیتال و طلا؛ نیازتان را انتخاب کنید، هزینه را بسنجید و درخواست بررسی را پیگیری کنید.</p><div class=\\"actions\\"><a class=\\"button\\" href=\\"#services\\">کشف خدمات <span>←</span></a><a class=\\"text-link\\" href=\\"#calculator\\">محاسبه هزینه ↙</a></div><div class=\\"hero-meta\\"><span>۳۶ عنوان خدمت</span><i></i><span>۶ حوزه تخصصی</span><i></i><span>پیگیری با کلید خصوصی</span></div></div><div class=\\"visual\\"><div class=\\"orbit one\\"></div><div class=\\"orbit two\\"></div><span class=\\"float f1\\">USD <b>↗</b></span><span class=\\"float f2\\">USDT <b>◈</b></span><span class=\\"float f3\\">GOLD <b>◇</b></span><div class=\\"finance-card\\"><div>زمرد پی <span>ZM</span></div><p>انتخاب آگاهانه، هزینه شفاف</p><strong>ارز · طلا · پرداخت</strong><div class=\\"card-bottom\\"><span>خدمات یکپارچه</span><span>◈ ◈ ◈</span></div></div><div class=\\"visual-caption\\"><span class=\\"dot\\"></span> ابزار محاسبه و ثبت درخواست در دسترس</div></div></section>\\n<div class=\\"service-strip\\"><a href=\\"#services\\" data-category=\\"پرداخت بین\u200cالمللی\\"><span>↗</span>پرداخت جهانی</a><a href=\\"#services\\" data-category=\\"ارز و حواله\\"><span>⇄</span>ارز و حواله</a><a href=\\"#services\\" data-category=\\"خدمات ریالی\\"><span>▤</span>خدمات ریالی</a><a href=\\"#services\\" data-category=\\"دارایی دیجیتال\\"><span>◈</span>دارایی دیجیتال</a><a href=\\"#services\\" data-category=\\"طلا و فلزات گران\u200cبها\\"><span>◇</span>طلای آب\u200cشده</a><a href=\\"#services\\" data-category=\\"خدمات دیجیتال و پذیرندگان\\"><span>⊞</span>خدمات پذیرندگان</a></div>\\n<div class=\\"notice\\"><strong>وضعیت ارائه خدمات</strong><span>ثبت درخواست برای بررسی امکان ارائه فعال است. دریافت وجه، صدور کارت، حواله، تبدیل ارز و معامله طلا تا اتصال و تأیید تأمین\u200cکننده فعال نیست؛ ثبت درخواست تعهد انجام خدمت ایجاد نمی\u200cکند.</span></div>\\n<section id=\\"services\\"><div class=\\"section-heading\\"><div><span class=\\"eyebrow\\">هر نیاز، یک مسیر مشخص</span><h2>خدمت موردنیازتان را پیدا کنید</h2></div><span id=\\"count\\" class=\\"tag\\">۳۶ عنوان خدمت</span></div><div class=\\"filters\\"><label class=\\"search\\">⌕ <input id=\\"search\\" type=\\"search\\" placeholder=\\"جست\u200cوجو؛ تتر، طلا، اشتراک، درگاه…\\" aria-label=\\"جست\u200cوجوی خدمات\\"></label><label>حوزه خدمت<select id=\\"category\\"><option value=\\"\\">همه خدمات</option></select></label></div><div id=\\"catalog\\" class=\\"catalog\\" aria-live=\\"polite\\"></div><p id=\\"catalog-error\\" role=\\"status\\"></p></section>\\n<section id=\\"calculator\\" class=\\"calculator\\"><div class=\\"calc-intro\\"><span class=\\"eyebrow\\">قبل از تصمیم، حساب کنید</span><h2>هزینه روشن.<br>انتخاب مطمئن\u200cتر.</h2><p>با نرخ دلخواه خودتان، مبلغ تبدیل ارز یا ارزش طلای آب\u200cشده را محاسبه کنید.</p><div class=\\"calc-note\\">نرخ زنده متصل نیست. اعداد این ابزار بر پایه ورودی شما هستند و پیشنهاد قطعی معامله محسوب نمی\u200cشوند.</div></div><div class=\\"panel\\"><div class=\\"tabs\\" role=\\"group\\" aria-label=\\"نوع محاسبه\\"><button id=\\"fx-tab\\" class=\\"active\\" aria-pressed=\\"true\\">تبدیل ارز</button><button id=\\"gold-tab\\" aria-pressed=\\"false\\">طلای آب\u200cشده</button></div><form id=\\"calc-form\\"><div id=\\"fx-fields\\"><div class=\\"two\\"><label>مقدار ارز<input id=\\"fx-amount\\" inputmode=\\"decimal\\" placeholder=\\"مثلاً ۱۰۰\\"></label><label>نوع ارز<select id=\\"fx-asset\\"><option>USD</option><option>EUR</option><option>AED</option><option>GBP</option><option>CAD</option><option>USDT</option><option>TRX</option></select></label></div><label>قیمت هر واحد ارز (تومان)<input id=\\"fx-rate\\" inputmode=\\"decimal\\" placeholder=\\"نرخ موردنظر خود را وارد کنید\\"></label></div><div id=\\"gold-fields\\" hidden><div class=\\"two\\"><label>وزن (گرم)<input id=\\"gold-weight\\" inputmode=\\"decimal\\" placeholder=\\"مثلاً ۲٫۵\\"></label><label>عیار از ۱۰۰۰<input id=\\"gold-purity\\" inputmode=\\"numeric\\" value=\\"750\\"></label></div><label>قیمت هر گرم طلای عیار ۷۵۰ (تومان)<input id=\\"gold-rate\\" inputmode=\\"decimal\\" placeholder=\\"قیمت مرجع خود را وارد کنید\\"></label></div><div class=\\"two\\"><label>کارمزد دلخواه (درصد)<input id=\\"fee\\" inputmode=\\"decimal\\" value=\\"0\\"></label><label>هزینه اضافی کل (تومان)<input id=\\"extra\\" inputmode=\\"decimal\\" value=\\"0\\"></label></div><button class=\\"button\\" type=\\"submit\\">محاسبه مبلغ <span>←</span></button><p id=\\"calc-error\\" role=\\"alert\\"></p><dl class=\\"result\\"><div><dt>ارزش پایه</dt><dd id=\\"base-result\\">—</dd></div><div><dt>کارمزد</dt><dd id=\\"fee-result\\">—</dd></div><div class=\\"total\\"><dt>جمع برآورد خرید</dt><dd id=\\"total-result\\">—</dd></div></dl><small>مالیات، اجرت، هزینه شبکه و تحویل به\u200cطور خودکار محاسبه نمی\u200cشوند؛ مجموع هزینه\u200cهای اعلام\u200cشده را در هزینه اضافی وارد کنید. مبالغ به نزدیک\u200cترین تومان گرد می\u200cشوند.</small></form></div></section>\\n<section class=\\"request-grid\\"><div id=\\"request\\" class=\\"panel\\"><span class=\\"eyebrow\\">شروع یک درخواست</span><h2>چه خدمتی نیاز دارید؟</h2><p>درخواست برای بررسی ثبت می\u200cشود؛ پیش از تأیید امکان ارائه، هیچ وجهی پرداخت نکنید.</p><form id=\\"request-form\\"><label>خدمت<select id=\\"request-service\\" required><option value=\\"\\">انتخاب خدمت</option></select></label><label>ایمیل یا شماره تماس<input id=\\"contact\\" type=\\"text\\" dir=\\"ltr\\" maxlength=\\"200\\" required autocomplete=\\"email\\" placeholder=\\"name@example.com / +989…\\"></label><label>شرح درخواست<textarea id=\\"note\\" rows=\\"4\\" minlength=\\"5\\" maxlength=\\"700\\" required placeholder=\\"مبلغ، ارز، مقصد یا وزن و عیار موردنیاز…\\"></textarea></label><p class=\\"small\\">رمز، شماره کامل کارت، تصویر مدرک، کلید کیف پول یا عبارت بازیابی ارسال نکنید.</p><label class=\\"check\\"><input id=\\"consent\\" type=\\"checkbox\\" required><span>با ثبت اطلاعات تماس و شرح درخواست برای بررسی، تا ۹۰ روز موافقم. می\u200cدانم این فرم سفارش قطعی یا احراز هویت مالی نیست.</span></label><button id=\\"submit-request\\" class=\\"button\\" type=\\"submit\\">ثبت درخواست بررسی <span>↗</span></button><p id=\\"request-status\\" role=\\"status\\" aria-live=\\"polite\\"></p></form><div id=\\"receipt\\" class=\\"receipt\\" hidden><h3>درخواست شما ثبت شد</h3><p>کد و کلید زیر را ذخیره کنید؛ کلید پیگیری را در اختیار دیگران قرار ندهید.</p><label>کد درخواست<input id=\\"receipt-id\\" readonly dir=\\"ltr\\"></label><label>کلید محرمانه پیگیری<input id=\\"receipt-secret\\" readonly dir=\\"ltr\\"></label><button id=\\"download-receipt\\" class=\\"outline\\">دانلود رسید پیگیری</button><p>دریافت درخواست به معنی قبول معامله نیست. زمان پاسخ هنوز تضمین نشده است.</p></div></div><div><div id=\\"tracking\\" class=\\"panel tracking\\"><span class=\\"eyebrow\\">از درخواستتان خبر بگیرید</span><h2>پیگیری درخواست</h2><form id=\\"track-form\\"><label>کد درخواست<input id=\\"track-id\\" placeholder=\\"ZM-…\\" dir=\\"ltr\\" required maxlength=\\"15\\"></label><label>کلید محرمانه پیگیری<input id=\\"track-secret\\" type=\\"password\\" dir=\\"ltr\\" required maxlength=\\"48\\" autocomplete=\\"off\\"></label><button class=\\"button\\" type=\\"submit\\">بررسی وضعیت ←</button><p id=\\"track-status\\" role=\\"status\\" aria-live=\\"polite\\"></p></form></div><div class=\\"trust\\"><span>◇</span><h3>شفافیت از قدم اول</h3><p>نرخ، کارمزد، تأمین\u200cکننده و شرایط تسویه باید پیش از پرداخت روشن باشند. این صفحه هیچ موجودی بانکی یا طلای نگهداری\u200cشده\u200cای برای شما ایجاد نمی\u200cکند.</p><a href=\\"#questions\\">بیشتر بدانید ←</a></div></div></section>\\n<section id=\\"questions\\"><span class=\\"eyebrow\\">پاسخ\u200cهای روشن</span><h2>پیش از شروع بدانید</h2><details><summary>کدام بخش\u200cها اکنون قابل استفاده\u200cاند؟</summary><p>فهرست و جست\u200cوجوی خدمات، محاسبه\u200cگر ارز و طلا با نرخ ورودی، ثبت درخواست بررسی و پیگیری آن فعال\u200cاند. پرداخت، تبدیل ارز، حواله، صدور کارت و خریدوفروش طلا هنوز فعال نیستند.</p></details><details><summary>آیا زمرد پی یک بانک یا حساب سپرده است؟</summary><p>خیر. این بخش در وضعیت فعلی مرکز معرفی و بررسی درخواست خدمات است؛ حساب بانکی، سپرده، اعتبار یا تضمین سود ارائه نمی\u200cکند.</p></details><details><summary>قیمت طلا و ارز چگونه محاسبه می\u200cشود؟</summary><p>نرخ را شما وارد می\u200cکنید. ارزش طلا از وزن × عیار ÷ ۷۵۰ × قیمت هر گرم عیار ۷۵۰ محاسبه می\u200cشود. اصالت، انگ و عیار باید در معامله واقعی جداگانه بررسی شوند.</p></details><details><summary>درگاه ریالی، ارزی و رمزارزی چه وضعیتی دارد؟</summary><p>هنوز به این بخش متصل نشده\u200cاند. هر روش پرداخت پس از تأیید پذیرندگی، شرایط تأمین\u200cکننده و بررسی عملی تراکنش فعال خواهد شد.</p></details><details><summary>اطلاعات درخواست کجا نگهداری می\u200cشود؟</summary><p>اطلاعات تماس و شرح درخواست در فضای خصوصی سرور ذخیره و در چرخه پاک\u200cسازی درخواست\u200cها پس از ۹۰ روز حذف می\u200cشود. پیگیری فقط با کد و کلید محرمانه ممکن است. این کلید جایگزین احراز هویت مالی نیست.</p></details></section>\\n<footer><a class=\\"brand\\" href=\\"/\\">◈ زمرد ملل</a><span>زمرد پی · مرکز خدمات مالی<br><small>خدمات مالی متصل\u200cنشده، قابل معامله نیستند.</small></span><a href=\\"/contact/\\">ارتباط با شرکت ↗</a></footer></main>\\n<dialog id=\\"detail\\"><button id=\\"close-detail\\" class=\\"close\\" aria-label=\\"بستن\\">×</button><span class=\\"eyebrow\\" id=\\"detail-category\\"></span><h2 id=\\"detail-title\\"></h2><p id=\\"detail-description\\"></p><div class=\\"notice\\"><span id=\\"detail-needs\\"></span></div><p class=\\"small\\">وضعیت: نیازمند اتصال و تأیید تأمین\u200cکننده. فعلاً فقط درخواست بررسی ثبت می\u200cشود.</p><button id=\\"choose-service\\" class=\\"button\\">ثبت درخواست این خدمت ←</button></dialog><noscript><div class=\\"nojs\\">برای جست\u200cوجو، محاسبه و ثبت درخواست، JavaScript مرورگر باید فعال باشد.</div></noscript><script src=\\"app.js\\" defer></script></body></html>\\n", "style.css": ":root{--green:#123d32;--light:#e9f1e7;--gold:#c29b55;--text:#233f37;--muted:#748078;--line:#e2e7df;--bg:#f7f8f3}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.9 Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a,input,select,textarea{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}[hidden]{display:none!important}aside{position:fixed;right:0;top:0;bottom:0;width:236px;background:#fff;padding:34px 25px;border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:bold}.brand small{display:block;font-size:10px;font-weight:normal;color:var(--muted)}.brand-mark{width:47px;height:49px;border-radius:15px;background:var(--green);color:#e6d6ac;display:grid;place-items:center;font-size:33px}.nav-label{margin:46px 12px 14px;font-size:10px;color:var(--muted)}nav a{display:flex;align-items:center;gap:13px;margin:6px 0;padding:12px 14px;border-radius:9px;font-size:17px}nav a span{font-size:12px}nav a:hover,nav a.selected{background:var(--light);color:var(--green)}.aside-foot{margin-top:auto;font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:24px}.aside-foot p{margin:7px 0 20px}.dot{display:inline-block;width:7px;height:7px;background:#5d8b62;border-radius:50%;margin-left:5px}main{margin-right:236px;padding:0 clamp(22px,4vw,65px);max-width:1700px}header{height:87px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}header b{margin:0 14px;color:#bbc6b9}.outline{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 15px;color:var(--green);font-size:11px}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:35px;align-items:center;padding:62px 0 40px}.eyebrow{color:#718477;font-size:10px;letter-spacing:1px;font-weight:bold}h1{font-size:clamp(32px,3.4vw,53px);line-height:1.65;margin:15px 0 20px;letter-spacing:-1.5px}h1 em{font-style:normal;color:#65856c}h2{font-size:25px;line-height:1.7;margin:9px 0 20px;letter-spacing:-.8px}h3{font-size:16px}.lead{color:var(--muted);