           status,response=call({'action':'lookup','csrf':csrf,'id':created,'secret':secret});assert status==200 and response['status']=='received' and 'contact' not in response
           assert not any((target/x).exists() for x in ['requests.sqlite','rate.key','manage_requests.py'])
           for name,sha in baseline.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,'Main site changed'
           get('https://zomorodmelal.ir/')
