\'=>\'حجم درخواست بیش از حد مجاز است.\']);\\n$origin=$_SERVER[\'HTTP_ORIGIN\']??\'\';\\nif ($origin!==\'\' && $origin!==\'https://zomorodmelal.ir\') reply(403,[\'error\'=>\'مبدأ درخواست معتبر نیست.\']);\\n$raw=file_get_contents(\'php://input\',false,null,0,8193);\\nif(strlen($raw)>8192) reply(413,[\'error\'=>\'حجم درخواست بیش از حد مجاز است.\']);\\n$data=json_decode($raw,true);\\nif(!is_array($data)||!is_string($data[\'csrf\']??null)||!hash_equals($_SESSION[\'csrf\'],$data[\'csrf\'])) reply(403,[\'error\'=>\'نشست معتبر نیست؛ صفحه را تازه\u200cسازی کنید.\']);\\n$action=$data[\'action\']??\'\';\\ntry {\\n $dir=\'/home/zomorod2/zm-finance-private\';\\n if(!is_dir($dir)||is_link($dir)) throw new RuntimeException(\'storage\');\\n $db=new PDO(\'sqlite:\'.$dir.\'/requests.sqlite\');\\n $db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);\\n $db->exec(\'PRAGMA busy_timeout=5000\');\\n $db->exec(\'CREATE TABLE IF NOT EXISTS requests(id TEXT PRIMARY KEY, secret_hash TEXT NOT NULL, nonce TEXT UNIQUE NOT NULL, created INTEGER NOT NULL, service TEXT NOT NULL, contact TEXT NOT NULL, note TEXT NOT NULL, status TEXT NOT NULL DEFAULT \\"received\\")\');\\n $db->exec(\'CREATE TABLE IF NOT EXISTS limits(key TEXT PRIMARY KEY, bucket INTEGER NOT NULL, count INTEGER NOT NULL)\');\\n $db->exec(\'BEGIN IMMEDIATE\');\\n $now=time(); $ip=hash_hmac(\'sha256\',$_SERVER[\'REMOTE_ADDR\']??\'unknown\',trim(file_get_contents($dir.\'/rate.key\')));\\n $bucket=(int)floor($now/3600); $key=$ip.\':\'.($action===\'create\'?\'create\':\'lookup\');\\n $q=$db->prepare(\'SELECT bucket,count FROM limits WHERE key=?\');$q->execute([$key]);$row=$q->fetch(PDO::FETCH_ASSOC);\\n $count=$row && (int)$row[\'bucket\']===$bucket?(int)$row[\'count\']:0;\\n if($count>=($action===\'create\'?5:30)){$db->exec(\'ROLLBACK\');reply(429,[\'error\'=>\'تعداد درخواست زیاد است. یک ساعت دیگر تلاش کنید.\']);}\\n $q=$db->prepare(\'INSERT OR REPLACE INTO limits(key,bucket,count) VALUES(?,?,?)\');$q->execute([$key,$bucket,$count+1]);\\n $q=$db->prepare(\'DELETE FROM requests WHERE created<?\');$q->execute([$now-90*86400]);\\n $q=$db->prepare(\'DELETE FROM limits WHERE bucket<?\');$q->execute([$bucket-24]);\\n if($action===\'create\') {\\n  foreach([\'service\',\'contact\',\'note\',\'nonce\'] as $field) if(!is_string($data[$field]??null)){$db->exec(\'COMMIT\');reply(422,[\'error\'=>\'اطلاعات درخواست کامل نیست.\']);}\\n  $catalog=json_decode(file_get_contents(__DIR__.\'/services.json\'),true);$ids=array_column($catalog,\'id\');\\n  $contact=trim($data[\'contact\']);$note=trim($data[\'note\']);$nonce=$data[\'nonce\'];\\n  if(!in_array($data[\'service\'],$ids,true)||strlen($contact)>200||strlen($note)>2400||strlen($note)<5||!preg_match(\'/^[a-f0-9]{32}$/D\',$nonce)||($data[\'consent\']??false)!==true||(!filter_var($contact,FILTER_VALIDATE_EMAIL)&&!preg_match(\'/^\\\\+?[0-9]{10,15}$/D\',$contact))){$db->exec(\'COMMIT\');reply(422,[\'error\'=>\'خدمت، ایمیل یا شماره تماس و شرح درخواست را بررسی کنید.\']);}\\n  $q=$db->prepare(\'SELECT id FROM requests WHERE nonce=?\');$q->execute([$nonce]);\\n  if($q->fetch()){$db->exec(\'COMMIT\');reply(409,[\'error\'=>\'این درخواست قبلاً ثبت شده است. رسید ذخیره\u200cشده را بررسی کنید.\']);}\\n  if((int)$db->query(\'SELECT count(*) FROM requests\')->fetchColumn()>=10000){$db->exec(\'COMMIT\');reply(503,[\'error\'=>\'ظرفیت ثبت درخواست تکمیل است.\']);}\\n  $id=\'ZM-\'.strtoupper(bin2hex(random_bytes(6)));$secret=bin2hex(random_bytes(24));\\n  $q=$db->prepare(\'INSERT INTO requests(id,secret_hash,nonce,created,service,contact,note) VALUES(?,?,?,?,?,?,?)\');\\n  $q->execute([$id,hash(\'sha256\',$secret),$nonce,$now,$data[\'service\'],$contact,$note]);$db->exec(\'COMMIT\');\\n  reply(201,[\'id\'=>$id,\'secret\'=>$secret,\'status\'=>\'received\',\'message\'=>\'درخواست بررسی ثبت شد. این رسید، سفارش قطعی یا تأیید ارائه خدمت نیست.\']);\\n }\\n if($action===\'lookup\') {\\n  $id=$data[\'id\']??\'\';$secret=$data[\'secret\']??\'\';\\n  if(!is_string($id)||!is_string($secret)||!preg_match(\'/^ZM-[A-F0-9]{12}$/D\',$id)||!preg_match(\'/^[a-f0-9]{48}$/D\',$secret)){$db->exec(\'COMMIT\');reply(404,[\'error\'=>\'کد یا کلید پیگیری صحیح نیست.\']);}\\n  $q=$db->prepare(\'SELECT id,secret_hash,created,service,status FROM requests WHERE id=?\');$q->execute([$id]);$row=$q->fetch(PDO::FETCH_ASSOC);$db->exec(\'COMMIT\');\\n  if(!$row||!hash_equals($row[\'secret_hash\'],hash(\'sha256\',$secret)))reply(404,[\'error\'=>\'کد یا کلید پیگیری صحیح نیست.\']);\\n  unset($row[\'secret_hash\']);reply(200,$row);\\n }\\n $db->exec(\'COMMIT\');reply(400,[\'error\'=>\'عملیات ناشناخته است.\']);\\n} catch(Throwable $e) { if(isset($db)){try{$db->exec(\'ROLLBACK\');}catch(Throwable $ignored){}} reply(503,[\'error\'=>\'ثبت یا پیگیری موقتاً در دسترس نیست؛ درخواست موفق اعلام نشده است.\']); }\\n", ".htaccess": "<IfModule mod_passenger.c>\\nPassengerEnabled off\\n</IfModule>\\nDirectoryIndex index.html\\nOptions -Indexes\\n<IfModule mod_headers.c>\\nHeader always set X-Content-Type-Options \\"nosniff\\"\\nHeader always set Referrer-Policy \\"no-referrer\\"\\nHeader always set X-Frame-Options \\"DENY\\"\\nHeader always set Content-Security-Policy \\"default-src \'self\'; script-src \'self\'; style-src \'self\'; img-src \'self\' data:; connect-src \'self\'; frame-ancestors \'none\'; base-uri \'none\'; form-action \'self\'; object-src \'none\'\\"\\nHeader always set Cache-Control \\"no-store\\"\\n</IfModule>\\n"}')
          MANAGER='"""Private operator CLI; run only over authenticated SSH. Never place in webroot."""\nimport argparse,json,sqlite3\nfrom pathlib import Path\np=argparse.ArgumentParser();p.add_argument(\'action\',choices=[\'list\',\'show\',\'status\']);p.add_argument(\'--id\');p.add_argument(\'--status\',choices=[\'reviewing\',\'needs_information\',\'unavailable\',\'closed\']);a=p.parse_args()\ndb=sqlite3.connect(str(Path(__file__).parent/\'requests.sqlite\'));db.row_factory=sqlite3.Row\nif a.action==\'list\':\n rows=db.execute(\'SELECT id,created,service,status FROM requests ORDER BY created DESC LIMIT 100\').fetchall();print(json.dumps([dict(r) for r in rows],ensure_ascii=False))\nelif a.action==\'show\':\n r=db.execute(\'SELECT id,created,service,status,contact,note FROM requests WHERE id=?\',(a.id,)).fetchone();print(json.dumps(dict(r) if r else {},ensure_ascii=False))\nelse:\n if not a.id or not a.status:p.error(\'--id and --status required\')\n with db:\n  cur=db.execute(\'UPDATE requests SET status=? WHERE id=?\',(a.status,a.id))\n print(json.dumps({\'updated\':cur.rowcount}))\n'
          from pathlib import Path
