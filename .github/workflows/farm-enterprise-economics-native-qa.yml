name: Farm enterprise economics native expert QA
on:
  pull_request:
    paths:
      - "product_recipes/farm_enterprise_economics/**"
      - ".github/workflows/farm-enterprise-economics-native-qa.yml"
  push:
    branches: [main]
    paths:
      - "product_recipes/farm_enterprise_economics/**"
      - ".github/workflows/farm-enterprise-economics-native-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-economic-and-csv-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Python and offline browser arithmetic parity, input safety and packaging
        shell: bash
        working-directory: product_recipes/farm_enterprise_economics
        run: |
          set -euo pipefail
          python -B -m unittest discover -v -p 'test_*.py'
          python -B -m py_compile calculator.py test_calculator.py test_offline_package.py
          node --check offline_engine.js
          node --check offline_ui.js
          node -e 'const fs=require("fs"); const e=require("./offline_engine.js"); if(e.evaluate(JSON.parse(fs.readFileSync("example_inputs.json"))).results.length!==2)process.exit(1);'
          echo FARM_ENTERPRISE_SPECIALIST_INTERNAL_TESTS=PASS
          echo FACTORY_INDEPENDENT_QUALITY_CLEARANCE=false
          echo FACTORY_COMMERCIAL_RELEASE_ALLOWED=false
      - name: Cross-runtime browser arithmetic compared with independent Python engine
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          python -B -m unittest -v tests.test_farm_browser_parity
