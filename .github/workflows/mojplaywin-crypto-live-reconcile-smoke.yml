name: MojPlayWin live automatic crypto settlement operational smoke
on:
  push:
    branches: [feature/mojplaywin-crypto-gateway-20261018]
    paths: [.github/workflows/mojplaywin-crypto-live-reconcile-smoke.yml]
permissions:
  contents: read
concurrency:
  group: mojplaywin-live-crypto-reconcile-sanity
  cancel-in-progress: false
jobs:
  operational-sanity:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/mojplaywin-crypto-gateway-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up host-fingerprint-pinned read-only relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
          echo "PINNED_READONLY_RELAY=connected"


      - name: Prove active gateway and child routes remain reachable
        run: |
          set -euo pipefail
          for path in / /store/ /farnaz/ /taniya/ /mojtaba.roozegar/ /saman/; do
            curl -fsSL --max-time 18 "https://mojplaywin.com$path" -o /dev/null
          done
          curl -fsSL --max-time 20 "https://mojplaywin.com/checkout/crypto/index.php" -o /dev/null
          for path in /checkout/crypto/bootstrap.php /checkout/crypto/index.php?id=invalid; do
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$path")"
            test "$code" = "404"
          done
          echo "LIVE_CUSTOM_SERVICE_GATEWAY_HTTP=200"
          echo "PROTECTED_SITE_HTTP_SMOKE=passed"
          echo "PAYMENT_INTERNALS_HTTP_DENIED=true"
      - name: Execute only existing verified on-host transaction reconciler
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-crypto-preflight-ssh"
          # This is the existing idempotent CLI reconciler, not a new deployment.
          # It validates existing submitted transactions only; no transfer signing,
          # new invoices, product pricing or payment flag changes.
          timeout 60s ssh -T -F "$d/config" saeit-cpanel 'php /home/zomorod2/mojplaywin.com/checkout/crypto/index.php reconcile' > "$RUNNER_TEMP/reconcile.output"
          grep -q '^MOJPLAYWIN_AUTORECONCILE_CHECKED=' "$RUNNER_TEMP/reconcile.output"
          grep -q '^MOJPLAYWIN_AUTORECONCILE_ERRORS=' "$RUNNER_TEMP/reconcile.output"
          cat "$RUNNER_TEMP/reconcile.output"
          echo "MERCHANT_APPROVAL_FOR_VALID_CONFIRMED_PAYMENT_REQUIRED=false"
          echo "PAYMENT_KEYS_ACCESSED=false"
          echo "FUNDS_TRANSMITTED=false"
      - name: Recheck protected site and store availability
        run: |
          set -euo pipefail
          for path in / /store/ /farnaz/ /taniya/ /mojtaba.roozegar/ /saman/; do
            curl -fsSL --max-time 18 "https://mojplaywin.com$path" -o /dev/null
          done
          echo "CHILD_SITE_SMOKE_AFTER_RECONCILE=passed"
