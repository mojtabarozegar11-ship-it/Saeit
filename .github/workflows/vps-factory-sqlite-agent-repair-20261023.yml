name: VPS Private Factory SQLite Agent Contention Repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-factory-sqlite-agent-repair-20261023.yml
      - scripts/vps_private_sqlite_contention_repair_20261023.py
      - tests/test_vps_private_sqlite_contention_repair_20261023.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-vps-factory-sqlite-agent-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify idempotent fail-closed patch offline
        run: python3 -m unittest discover -s tests -p test_vps_private_sqlite_contention_repair_20261023.py -v
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve private source backup, repair agent reseed and verify SQLite timeout
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/vps-sqlite-agent"
          mkdir -p "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          echo VPS_HOSTKEY_VERIFIED
          opts=(-i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15)
          scp "${opts[@]}" scripts/vps_private_sqlite_contention_repair_20261023.py githubops@178.239.147.150:/home/githubops/factory-runtime/operations/vps_private_sqlite_contention_repair_20261023.py
          ssh "${opts[@]}" githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -f "$base/django-app/core/management/commands/factory_staging_tick.py"
          test -x "$base/.venv/bin/python"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          "$base/.venv/bin/python" "$base/operations/vps_private_sqlite_contention_repair_20261023.py" --root "$base/django-app" --backups "$base/operations/backups"
          echo FACTORY_SQLITE_AGENT_REPAIR_VPS_RUNTIME_VERIFIED
          REMOTE
