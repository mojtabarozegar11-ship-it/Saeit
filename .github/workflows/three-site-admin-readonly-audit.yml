name: Three website admin read-only audit

on:
  push:
    branches:
      - feat/command-center-factory-readiness-20261014
    paths:
      - .github/workflows/three-site-admin-readonly-audit.yml

permissions:
  contents: read

concurrency:
  group: three-site-admin-readonly-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify SSH relay identities and inspect deployed admin registrations
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/three-site-audit"
          mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text().replace("\r\n","\n").strip()
          p.write_text(s.replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 90s ssh -F "$d/config" saeit-host 'bash -se' <<'REMOTE'
          set -eu
          test "$(id -un)" = zomorod2
          inspect_admin() {
            label="$1"
            app="$2"
            python="$3"
            if test ! -f "$app/manage.py"; then
              echo "${label}_MANAGE=missing"
              return
            fi
            echo "${label}_MANAGE=present"
            if test -f "$app/config/urls.py" && grep -Eq 'admin\.site\.urls|path\(["\x27]admin/' "$app/config/urls.py"; then
              echo "${label}_ADMIN_ROUTE=present"
            else
              echo "${label}_ADMIN_ROUTE=not_found_in_config_urls"
            fi
            if test -x "$python"; then
              cd "$app"
              "$python" manage.py shell -c 'from django.contrib import admin; print("ADMIN_MODEL_COUNT="+str(len(admin.site._registry))); print("ADMIN_MODELS="+",".join(sorted(m._meta.label_lower for m in admin.site._registry))[:1500])' 2>&1 || echo "${label}_DJANGO_ADMIN_IMPORT=failed"
            else
              echo "${label}_PYTHON=missing"
            fi
          }
          inspect_admin ZOMOROD /home/zomorod2/Saeit /home/zomorod2/Saeit/.venv/bin/python
          wrapper=/home/zomorod2/mojplaywin.com/passenger_wsgi.py
          mojplay_app="$(python3 - "$wrapper" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          text=p.read_text(errors="ignore") if p.is_file() else ""
          value=""
          for line in text.splitlines():
              s=line.strip()
              if s.startswith("APP") and "=" in s:
                  value=s.split("=",1)[1].strip().strip('"').strip("'")
                  break
          print(value)
          PY
          )"
          if test -n "$mojplay_app"; then
            inspect_admin MOJPLAYWIN "$mojplay_app" /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python
          else
            echo "MOJPLAYWIN_APP_ROOT=unresolved"
          fi
          personal=/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17
          personal_python=/home/zomorod2/mojtaba_personal/.venv_personal_test/bin/python
          inspect_admin MOJTABA_PERSONAL "$personal" "$personal_python"
          if test -x "$personal_python"; then
            cd "$personal"
            "$personal_python" manage.py shell -c 'from django.urls import resolve, Resolver404; paths=["/admin/login/","/staff/login/","/personnel/login/","/login/","/mojtaba.roozegar/admin/login/"]; [(lambda p: print("PERSONAL_RESOLVE",p,"=>",resolve(p).view_name,resolve(p).route) if not isinstance((lambda: resolve(p))(), Resolver404) else None)(p) for p in []]' 2>&1 || true
            "$personal_python" manage.py shell -c 'from django.urls import resolve, Resolver404; paths=["/admin/login/","/staff/login/","/personnel/login/","/login/","/mojtaba.roozegar/admin/login/"]; exec("for p in paths:\\n try:\\n  r=resolve(p); print(\"PERSONAL_RESOLVE\",p,\"=>\",r.view_name,r.route)\\n except Resolver404: print(\"PERSONAL_RESOLVE\",p,\"=> NOT_FOUND\")")' 2>&1 || true
          fi
          for f in /home/zomorod2/mojplaywin.com/.htaccess /home/zomorod2/mojplaywin.com/mojtaba.roozegar/.htaccess; do
            if test -f "$f"; then
              echo "PERSONAL_MOUNT_CONFIG=$f"
              grep -E '^[[:space:]]*Passenger(AppRoot|BaseURI|StartupFile)|^[[:space:]]*Rewrite(Engine|Cond|Rule)' "$f" | head -25 || true
            else
              echo "PERSONAL_MOUNT_CONFIG_MISSING=$f"
            fi
          done
          REMOTE
      - name: Check public login routes (read-only HTTP GET)
        shell: bash
        run: |
          set -euo pipefail
          check_route() {
            label="$1"
            url="$2"
            body="$RUNNER_TEMP/$label.html"
            status="$(curl --silent --show-error --location --connect-timeout 12 --max-time 35 --retry 2 --retry-delay 2 -o "$body" -w '%{http_code}' "$url" || true)"
            if [[ "$status" == "200" ]] && grep -Eqi 'name="username"|id="login-form"|Log in|ورود' "$body"; then
              echo "${label}_LOGIN_FORM=200"
            else
              echo "${label}_LOGIN_FORM=$status"
            fi
          }
          check_route ZOMOROD_ADMIN https://zomorodmelal.ir/admin/login/
          check_route MOJPLAYWIN_ADMIN https://mojplaywin.com/admin/login/
          check_route MOJTAba_PERSONAL_ADMIN https://mojplaywin.com/mojtaba.roozegar/admin/login/
          check_route MOJTAba_PERSONAL_HOME https://mojplaywin.com/mojtaba.roozegar/
