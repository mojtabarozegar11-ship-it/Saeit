name: SEO Staging SSH Readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref_name == 'factory/integration-control-bridge-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out selected feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required SSH secrets
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          test -n "$STAGING_SSH_KEY" || { echo 'STAGING_SSH_KEY is missing'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'KNOWN_HOSTS is missing'; exit 1; }
      - name: Verify pinned staging host and read-only SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: bash scripts/seo_staging_ssh_probe.sh
