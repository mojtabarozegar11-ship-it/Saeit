name: Remove three regenerated static collections from isolated old test runs
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-prune-three-old-static-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-old-smoke-static-clean-a
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Validate and prune only static build output of three named old isolated admin smoke tests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,shutil
          home=Path.home()
          assert home==Path("/home/zomorod2")
          root=home/"Saeit-staging/admin-smoke"
          assert root.is_dir() and not root.is_symlink()
          assert (root/"ab090d03f5bc-38498776878/staticfiles").is_dir()
          assert (home/"Saeit/manage.py").is_file()
          names=("4bed451e8576-38498217004","3d0d2e78fb33-38487543837","a603e8fe5646-38486544944")
          c=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=9)
          p=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=9)
          for name in names:
              old=root/name
              generated=old/"staticfiles"
              assert old.is_dir() and not old.is_symlink()
              assert (old/"manage.py").is_file() and (old/"isolated-smoke.sqlite3").is_file()
              assert generated.is_dir() and not generated.is_symlink()
              assert str(old) not in c.stdout
              assert not any(str(old) in row and "python3 - " not in row for row in p.stdout.splitlines())
              for directory,dirs,files in os.walk(generated,followlinks=False):
                  for part in dirs+files:assert not (Path(directory)/part).is_symlink()
              size=int(subprocess.run(["du","-sk",str(generated)],capture_output=True,text=True,timeout=30,check=True).stdout.split()[0])*1024
              assert 19_000_000<size<23_000_000
          saved=0
          for name in names:
              old=root/name
              target=old/"staticfiles"
              amount=int(subprocess.run(["du","-sk",str(target)],capture_output=True,text=True,timeout=30,check=True).stdout.split()[0])*1024
              shutil.rmtree(target)
              assert not target.exists() and (old/"isolated-smoke.sqlite3").is_file()
              saved+=amount
              print("OLD_SMOKE_STATIC_REMOVED="+name+" bytes="+str(amount))
          print("OLD_SMOKE_STATIC_TOTAL_SAVED="+str(saved))
          print("SOURCE_AND_TEST_DATABASES_PRESERVED=yes")
          PY
          REMOTE
      - name: Verify live websites and agents
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://zomorodmelal.ir/" "https://zomorodmelal.ir/agents/" "https://mojplaywin.com/"; do
            c="$(curl --max-time 16 -sS -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "AFTER_STATIC_TEST_CLEAN=$url:$c"
            test "$c" = 200
          done
      - name: Clean SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
