name: MPW one-off scoped Passenger worker refresh

on:
  push:
    branches: [fix/mpw-passenger-app-restart-20261106]
    paths: [.github/workflows/mpw-passenger-app-restart-20261106.yml]

permissions: {contents: read}
concurrency:
  group: mpw-passenger-one-off-app-restart
  cancel-in-progress: false

jobs:
  scoped-refresh:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/fix/mpw-passenger-app-restart-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Configure previously fingerprint-pinned SSH relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-passenger-refresh-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 30s ssh -i "$d/vps.key" -p 22 -o UserKnownHostsFile="$d/vps.known" -o StrictHostKeyChecking=yes -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Read-only discover supported app restart tools and registered roots
        run: |
          set -euo pipefail
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-passenger-refresh-ssh/config" saeit-cpanel 'python3 -c '\''import os,pathlib,pwd,shutil,subprocess,json;root=pathlib.Path("/home/zomorod2/mojplaywin.com");template=pathlib.Path("/home/zomorod2/Saeit-staging/templates/taniya_studio/index.html");wsgi=root/"passenger_wsgi.py";assert pwd.getpwuid(os.geteuid()).pw_name=="zomorod2";assert root.is_dir() and not root.is_symlink();assert wsgi.is_file() and b"Saeit-staging" in wsgi.read_bytes();assert template.is_file() and template.read_bytes().count(b"rel="+bytes([34])+b"canonical"+bytes([34]))==1;print("MPW_LIVE_TEMPLATE=VALID",flush=True);print("PASSENGER_CLI",bool(shutil.which("passenger-config")),flush=True);exe=shutil.which("cloudlinux-selector") or "/usr/sbin/cloudlinux-selector";print("CLOUDLINUX_CLI",os.access(exe,os.X_OK),flush=True);r=subprocess.run([exe,"get","--json","--interpreter","python","--user","zomorod2"],capture_output=True,text=True,timeout=35) if os.access(exe,os.X_OK) else None;print("CLOUDLINUX_GET_RC",r.returncode if r else "unavailable",flush=True);j=json.loads(r.stdout) if r and r.returncode==0 else {};print("CLOUDLINUX_RESULT",j.get("result") if isinstance(j,dict) else "non-object",flush=True);data=j.get("data") if isinstance(j,dict) else None;print("CLOUDLINUX_DATA_TYPE",type(data).__name__,flush=True);print("CLOUDLINUX_DATA_KEYS",list(data.keys())[:20] if isinstance(data,dict) else "not-object",flush=True);print("CLOUDLINUX_APP_ROOTS",[o.get("app_root") for o in data.values() if isinstance(o,dict) and "app_root" in o] if isinstance(data,dict) else [],flush=True)'\'''
      - name: Recheck multiple independent public worker responses
        run: |
          python3 - <<'PY'
          import concurrent.futures,time,urllib.request,uuid
          def check(i):
              request=urllib.request.Request('https://mojplaywin.com/taniya/?refresh-check='+uuid.uuid4().hex,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  body=response.read(180000)
                  return response.status==200 and body.count(b'<link rel="canonical" href="https://mojplaywin.com/taniya/">')==1
          for attempt in range(6):
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  try: results=list(pool.map(check,range(12)))
                  except Exception as exc: results=[];print('Probe exception:',str(exc)[:140])
              print('PASS_COUNT',len(results),sum(results))
              if len(results)==12 and all(results):break
              if attempt==5:raise RuntimeError('Django workers still serving inconsistent Taniya templates')
              time.sleep(7)
          with urllib.request.urlopen('https://mojplaywin.com/store/',timeout=25) as response:
              assert response.status==200 and b'mpw-products' in response.read(100000)
          print('MPW_TANIYA_MULTIWORKER_AND_STORE=PASS')
          PY
      - name: Remove temporary SSH credentials
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-passenger-refresh-ssh"
          if test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/config"
            rmdir -- "$d"
          fi
