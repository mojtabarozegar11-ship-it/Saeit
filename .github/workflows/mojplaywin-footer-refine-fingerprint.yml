name: MojPlayWin founder minimal footer fix current SHA read-only
on:
  push:
    branches: ["audit/mojplaywin-backup-transport-20261017"]
    paths: [".github/workflows/mojplaywin-footer-refine-fingerprint.yml"]
permissions:
  contents: read
jobs:
  snapshot-existing-founder:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned GitHub to VPS to cPanel private read-only relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-footer-refine"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
      - name: Identify exact live root and 22 preview current signatures without changing files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-footer-refine"
          timeout 50s ssh -T -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/home/zomorod2/mojplaywin.com/design-preview-20261017")
          pages=sorted(p for p in root.iterdir() if p.name.endswith(".html") and p.is_file() and not p.is_symlink() and "noindex,nofollow,noarchive" in p.read_text("utf-8"))
          prod=root/"production-home-20261017.html"
          assert len(pages)==22 and prod not in pages and not prod.is_symlink()
          record={}
          for p in [prod]+pages:
              s=p.read_bytes()
              assert b'data-mpw-bottom-signoff="true"' in s
              assert b'<style id="mpw-footer-refined-gold-v3">' in s
              assert b'mpw-footer-bottom-signoff' in s
              record[p.name]={"sha":hashlib.sha256(s).hexdigest(),"bytes":len(s),"old_signature_markup":s.count(b'data-mpw-bottom-signoff="true"')}
          assert len(record)==23
          print("LIVE_MAIN_ONLY_FOUNDER_FINGERPRINT="+json.dumps(record,sort_keys=True,separators=(",",":")))
          print("SERVER_WRITES=0")
          PY
      - name: Remove private runner credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-footer-refine"

# Refresh SHA preimage after refined founder release; non-mutating
