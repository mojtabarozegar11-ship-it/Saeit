name: Moj Termux - read-only reverse SSH path health
on:
  push:
    branches: [feature/private-messaging-bridge-20261028]
    paths: ['.github/workflows/moj-termux-reverse-tunnel-audit-20261028.yml']
permissions:
  contents: read
jobs:
  read-only:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feature/private-messaging-bridge-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check only loopback bridge and phone relay metadata, never read secrets
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$(mktemp -d "$RUNNER_TEMP/moj-termux-reverse.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          chmod 600 "$d/known"
          timeout 45s ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=10 githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          d="$HOME/.local/share/saeit-termux-bridge"
          if test -r "$d/phone_user"; then
            echo 'TERMUX_REVERSE_PHONE_USER_METADATA=PRESENT'
          else
            echo 'TERMUX_REVERSE_PHONE_USER_METADATA=ABSENT'
          fi
          if test -r "$HOME/.ssh/saeit_termux_operator_ed25519"; then
            echo 'TERMUX_REVERSE_OPERATOR_KEY=PRESENT'
          else
            echo 'TERMUX_REVERSE_OPERATOR_KEY=ABSENT'
          fi
          if command -v ss >/dev/null 2>&1 && ss -H -ltn 'sport = :18022' | grep -Eq '127\.0\.0\.1:18022[[:space:]]'; then
            echo 'TERMUX_REVERSE_TUNNEL_18022=LISTENING_LOOPBACK'
          else
            echo 'TERMUX_REVERSE_TUNNEL_18022=NOT_LISTENING'
          fi
          echo 'TERMUX_VPS_READ_ONLY_PROBE=PASS'
          REMOTE
