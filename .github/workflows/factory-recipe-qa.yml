name: Factory recipe QA across supported Python versions
on:
  push:
    branches: [main]
    paths:
      - "scripts/factory_product_maker.py"
      - "product_recipes/**"
      - "tests/test_factory_product_maker.py"
      - ".github/workflows/factory-recipe-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/factory_product_maker.py"
      - "product_recipes/**"
      - "tests/test_factory_product_maker.py"
      - ".github/workflows/factory-recipe-qa.yml"
permissions:
  contents: read
jobs:
  recipe-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enforce nonzero test count and run product suites
        run: |
          python -m unittest discover -s tests -p 'test_factory_product_maker.py' -v
          python scripts/factory_product_maker.py --recipes product_recipes --verify-only
