name: MojPlayWin Trust Wallet merchant proof route diagnosis
on:
  push:
    branches: [qa/mpw-payment-release-preflight-20261015]
    paths: ['.github/workflows/mojplaywin-stage15-wallet-page-http-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect only public GET responses and redirects, no credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          cases={
            "home":"https://mojplaywin.com/",
            "wallet_page":"https://mojplaywin.com/merchant/wallet-proof/",
            "admin_login":"https://mojplaywin.com/admin/login/",
            "wallet_no_slash":"https://mojplaywin.com/merchant/wallet-proof"
          }
          for name,url in cases.items():
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"Mozilla/5.0 (compatible; MPW-Diagnostic/1.0)"},method="GET")
              try:
                  resp=urllib.request.urlopen(req,timeout=18)
                  code=resp.status
              except urllib.error.HTTPError as e:
                  resp=e;code=e.code
              except Exception as exc:
                  print("MPW_HTTP_"+name+"_ERROR="+type(exc).__name__)
                  continue
              with resp:
                  body=resp.read(2048).decode("utf-8","ignore")
                  dest=resp.geturl()
                  print("MPW_HTTP_"+name+"_STATUS="+str(code))
                  print("MPW_HTTP_"+name+"_FINAL_PATH="+urllib.parse.urlparse(dest).path)
                  print("MPW_HTTP_"+name+"_HOST="+str(urllib.parse.urlparse(dest).hostname))
                  print("MPW_HTTP_"+name+"_CONTENT_TYPE="+str(resp.headers.get("Content-Type","")).split(";")[0])
                  print("MPW_HTTP_"+name+"_APACHE_NOT_FOUND="+str("The requested resource was not found on this server" in body))
                  print("MPW_HTTP_"+name+"_LOGIN="+str("login" in dest.lower()))
          print("MPW_HTTP_DIAGNOSTIC_NO_CHANGES=True")
          PY
