name: MojPlayWin relay key structural diagnostic v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 3
    env:
      HOST_KEY: \${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
      VPS_KEY: \${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Classify key structure without network
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile

          def candidates(value):
              raw = value.strip()
              out = [("raw", raw)]
              out.append(("escaped_newlines_decoded", raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\r").strip()))
              compact = "".join(raw.split())
              try:
                  out.append(("base64_decoded_text", base64.b64decode(compact, validate=True).decode("utf-8")))
              except Exception:
                  pass
              unique = []
              seen = set()
              for label, text in out:
                  if text not in seen:
                      unique.append((label, text))
                      seen.add(text)
              return unique

          def error_class(stderr):
              s = stderr.lower()
              if "incorrect passphrase" in s or "enter passphrase" in s or "passphrase" in s:
                  return "encrypted_or_passphrase_required"
              if "invalid format" in s:
                  return "invalid_format"
              if "load failed" in s or "could not load" in s:
                  return "load_failed"
              if not s:
                  return "no_error_text"
              return "other_error"

          def inspect(label, text):
              lines = text.splitlines()
              begin = [line for line in lines if line.startswith("-----BEGIN ") and line.endswith("-----")]
              end = [line for line in lines if line.startswith("-----END ") and line.endswith("-----")]
              kind = "none"
              if begin:
                  marker = begin[0]
                  if "OPENSSH PRIVATE KEY" in marker:
                      kind = "openssh"
                  elif "RSA PRIVATE KEY" in marker:
                      kind = "rsa"
                  elif "EC PRIVATE KEY" in marker:
                      kind = "ec"
                  elif "PRIVATE KEY" in marker:
                      kind = "pkcs8_or_other"
              body = ""
              if begin and end:
                  try:
                      start = lines.index(begin[0]) + 1
                      stop = len(lines) - 1 - lines[::-1].index(end[-1])
                      body = "".join(lines[start:stop])
                  except ValueError:
                      body = ""
              body_clean = "".join(body.split())
              body_valid_chars = bool(body_clean) and re.fullmatch(r"[A-Za-z0-9+/=]+", body_clean) is not None
              try:
                  decoded_len = len(base64.b64decode(body_clean, validate=True))
                  body_decode = "valid"
              except Exception:
                  decoded_len = 0
                  body_decode = "invalid"
              def run_probe(cmd):
                  fd, path = tempfile.mkstemp(prefix="mpw-key-", dir=os.environ.get("RUNNER_TEMP"))
                  try:
                      os.write(fd, text.encode("utf-8"))
                      os.close(fd)
                      p = subprocess.run(cmd + [path], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=5, check=False, text=True)
                      return "ok" if p.returncode == 0 else error_class(p.stderr)
                  finally:
                      try:
                          os.unlink(path)
                      except OSError:
                          pass
              return {
                  "candidate": label,
                  "bytes": len(text.encode("utf-8")),
                  "line_count": len(lines),
                  "key_kind": kind,
                  "begin_markers": len(begin),
                  "end_markers": len(end),
                  "first_line_bytes": len(lines[0].encode("utf-8")) if lines else 0,
                  "last_line_bytes": len(lines[-1].encode("utf-8")) if lines else 0,
                  "contains_cr": "\r" in text,
                  "contains_literal_backslash_n": "\\n" in text,
                  "body_base64_chars": len(body_clean),
                  "body_base64_chars_valid": body_valid_chars,
                  "body_base64_decode": body_decode,
                  "body_decoded_bytes": decoded_len,
                  "ssh_keygen": run_probe(["ssh-keygen", "-y", "-P", ""]),
                  "openssl": run_probe(["openssl", "pkey", "-noout", "-passin", "pass:"]),
              }

          for name in ("HOST_KEY", "VPS_KEY"):
              rows = [inspect(label, text) for label, text in candidates(os.environ.get(name, ""))]
              print(name + "_STRUCTURE=" + json.dumps(rows, sort_keys=True))
          print("NETWORK_CONTACTED=0")
          print("KEY_VALUES_DISCLOSED=0")
          PY
