name: Deploy Zahra route to MojPlayWin

on:
  pull_request:
    paths:
      - ".github/workflows/mojplaywin-zahra-deploy.yml"
      - "scripts/deploy_mojplaywin_zahra.py"
      - "templates/zahra/index.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojplaywin-zahra-deploy.yml"
      - "scripts/deploy_mojplaywin_zahra.py"
      - "templates/zahra/index.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojplaywin-zahra-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Zahra static payload and installer
        run: |
          python3 -m py_compile scripts/deploy_mojplaywin_zahra.py
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("templates/zahra/index.html").read_text(encoding="utf-8")
          class Check(HTMLParser):
              pass
          Check().feed(html)
          required = ["<title>Zahra", "Good finds, made useful.", "Market notes that show their work.", "Launch preview"]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Zahra page missing required content: {missing}")
          assert 'href="/styles.css"' not in html and 'src="/app.js"' not in html
          print("Zahra page parses and contains the expected standalone content.")
          PY

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned VPS-to-cPanel SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          WORK="$RUNNER_TEMP/mojplaywin-zahra-ssh"
          install -d -m 700 "$WORK"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$WORK/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$WORK/host.key"
          chmod 600 "$WORK/"*.key
          ssh-keygen -y -P "" -f "$WORK/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$WORK/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$WORK/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$WORK/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$WORK/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $WORK/vps.key
            UserKnownHostsFile $WORK/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $WORK/host.key
            UserKnownHostsFile $WORK/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$WORK/config"
          scan="$(ssh -F "$WORK/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$WORK/host.candidate"
          test "$(ssh-keygen -lf "$WORK/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$WORK/host.candidate" "$WORK/host.known"
          echo "PINNED_RELAY_READY=yes"
      - name: Verify existing site and prepare isolated staging
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/)" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          WORK="$RUNNER_TEMP/mojplaywin-zahra-ssh"
          timeout 45s ssh -F "$WORK/config" saeit-host \
            'test -d /home/zomorod2/mojplaywin.com && test ! -L /home/zomorod2/mojplaywin.com && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/mojplaywin.com/.htaccess && test -d /home/zomorod2/Saeit-staging && test ! -L /home/zomorod2/Saeit-staging && grep -Fq "Saeit-staging" /home/zomorod2/mojplaywin.com/passenger_wsgi.py && test -f /home/zomorod2/Saeit-staging/config/urls.py'
          timeout 20s ssh -F "$WORK/config" saeit-host "install -d -m 700 /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID"
      - name: Package only Zahra installer and page
        run: tar -cf "$RUNNER_TEMP/zahra.tar" scripts/deploy_mojplaywin_zahra.py templates/zahra/index.html
      - name: Upload isolated Zahra package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-zahra-ssh"
          scp -F "$WORK/config" "$RUNNER_TEMP/zahra.tar" "saeit-host:/home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID/bundle.tar"
          timeout 30s ssh -F "$WORK/config" saeit-host \
            "tar -xf /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID/bundle.tar -C /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID && rm -f /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID/bundle.tar"
      - name: Install only /zahra$$/ route
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-zahra-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID/scripts/deploy_mojplaywin_zahra.py deploy $GITHUB_RUN_ID $GITHUB_SHA"
      - name: Verify Zahra route and preserve root and admin
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-zahra-ssh"
          url='https://mojplaywin.com/zahra$$/?_zahra_deploy='"$GITHUB_RUN_ID"
          status="000"
          for attempt in {1..10}; do
            status="$(curl -sS -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/zahra-live.html" -w '%{http_code}' "$url" || true)"
            [[ "$status" == "200" ]] && break
            echo "Zahra not ready (HTTP $status, attempt $attempt)."
            sleep 3
          done
          [[ "$status" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/)" == "200" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' https://mojplaywin.com/admin/login/)" == "200" ]]
          python3 - "$RUNNER_TEMP/zahra-live.html" <<'PY'
          from pathlib import Path
          import sys
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          assert "<title>Zahra" in html
          assert "Market notes that show their work." in html
          print("Zahra is live at /zahra$$/; MojPlayWin home and admin login still return HTTP 200.")
          PY
      - name: Roll back only Zahra route if deployment verification fails
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mojplaywin-zahra-ssh"
          timeout 60s ssh -F "$WORK/config" saeit-host \
            "python3 /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID/scripts/deploy_mojplaywin_zahra.py rollback $GITHUB_RUN_ID"
      - name: Remove remote staging bundle
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mojplaywin-zahra-ssh/config" ]]; then
            ssh -F "$RUNNER_TEMP/mojplaywin-zahra-ssh/config" -o ConnectTimeout=10 saeit-host \
              "rm -rf /home/zomorod2/.mojplaywin-zahra-$GITHUB_RUN_ID" || true
          fi
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mojplaywin-zahra-ssh" "$RUNNER_TEMP/zahra.tar" "$RUNNER_TEMP/zahra-live.html"
