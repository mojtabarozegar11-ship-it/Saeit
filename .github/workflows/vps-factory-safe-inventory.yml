name: VPS Factory Safe Read-only Inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-factory-safe-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: VPS SSH identity and capacity only
        env:
          SSH_HOST: ${{ secrets.SAEIT_VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.SAEIT_VPS_SSH_USER }}
          SSH_PORT: ${{ secrets.SAEIT_VPS_SSH_PORT }}
          SSH_KEY: ${{ secrets.SAEIT_VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_factory_inventory"
          printf '%s\n' "$SSH_KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_factory_inventory" "$HOME/.ssh/known_hosts"
          printf '%s' "$SSH_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r", "").replace("\\n", "\n"), end="")' > "$HOME/.ssh/id_factory_inventory"
          chmod 600 "$HOME/.ssh/id_factory_inventory" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_factory_inventory" >/dev/null
          ssh -i "$HOME/.ssh/id_factory_inventory" -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo VPS_IDENTITY; hostname; id -un
          echo VPS_DISK; df -h /
          echo VPS_MEMORY; free -m
          base="$HOME/factory-runtime"; ops="$base/operations"; log="$ops/vps-only-factory.log"
          if test -d "$base"; then
            echo FACTORY_RUNTIME_PRESENT
            find "$ops" -maxdepth 1 -type f -printf '%f\\n' 2>/dev/null | sort | head -40
            if test -f "$ops/vps-only-loop.pid"; then p="$(cat "$ops/vps-only-loop.pid")"; echo "FACTORY_PID=$p"; ps -p "$p" -o args= || true; fi
            if test -f "$log"; then echo FACTORY_LOG_TAIL; tail -n 25 "$log"; fi
            echo FACTORY_STAGE_CONFIG_LOCATIONS
            grep -RIlE 'stage.?4|stage_four|stage4|step.?4|STAGE_4|FACTORY_STAGE' "$ops" "$base/django-app/core" --include='*.sh' --include='*.py' 2>/dev/null | head -40 || true
            echo FACTORY_STAGE_CONFIG_LINE_NUMBERS
            grep -RInE 'stage.?4|stage_four|stage4|step.?4|STAGE_4|FACTORY_STAGE' "$ops" "$base/django-app/core" --include='*.sh' --include='*.py' 2>/dev/null | cut -d: -f1-2 | head -60 || true
            if test -f "$base/django-app/var/factory/discovery/latest.json"; then
              "$base/.venv/bin/python" - "$base/django-app/var/factory/discovery/latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          print("FACTORY_DISCOVERY_KEYS="+",".join(sorted(k for k in data if isinstance(k,str))[:40]))
          for key in ("status","stage","opportunity_count","evidence_count","pending_evidence_count","waiting_for_evidence"):
              value=data.get(key)
              if isinstance(value,(str,int,float,bool)) or value is None: print(f"FACTORY_DISCOVERY_{key.upper()}={value}")
          PY
            else echo FACTORY_DISCOVERY_FILE_MISSING; fi
          else echo FACTORY_RUNTIME_MISSING; fi
          REMOTE
