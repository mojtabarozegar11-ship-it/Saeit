name: VPS Factory Safe Read-only Inventory

on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-factory-safe-inventory.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-factory-readonly-inventory
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect standalone VPS factory without modifying anything
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-inventory"
          mkdir -m 700 -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          scan="$(ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null)"
          test -n "$scan"
          actual="$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}' | sort -u)"
          test "$actual" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf '%s\n' "$scan" > "$d/known"
          ssh -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          ops="$base/operations"
          app="$base/django-app"
          echo FACTORY_INVENTORY_BEGIN
          echo "VPS_USER=$(id -un)"
          echo "VPS_HOSTNAME=$(hostname)"
          echo "VPS_UPTIME=$(uptime -p)"
          df -h "$HOME" | tail -n 1 | awk '{print "VPS_DISK_USED=" $5 " VPS_DISK_FREE=" $4}'
          free -m | awk '/^Mem:/ {print "VPS_MEMORY_TOTAL_MB=" $2 " VPS_MEMORY_AVAILABLE_MB=" $7}'
          for p in "$base" "$ops" "$app" "$base/.venv/bin/python" "$ops/vps-only-loop.sh" "$base/private/factory-fresh-isolated.sqlite3"; do
            if test -e "$p"; then echo "FACTORY_PATH_PRESENT=$(basename "$p")"; else echo "FACTORY_PATH_MISSING=$(basename "$p")"; fi
          done
          if test -f "$ops/vps-only-loop.pid"; then
            pid="$(cat "$ops/vps-only-loop.pid")"
            if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null && ps -p "$pid" -o args= | grep -Fq 'vps-only-loop.sh'; then
              echo FACTORY_LOOP_ALIVE
              ps -p "$pid" -o etime= | awk '{print "FACTORY_PROCESS_ELAPSED=" $1}'
            else echo FACTORY_LOOP_NOT_VERIFIED; fi
          else echo FACTORY_PIDFILE_MISSING; fi
          if systemctl is-active --quiet cron 2>/dev/null || systemctl is-active --quiet crond 2>/dev/null; then
            echo FACTORY_CRON_ACTIVE
          else echo FACTORY_CRON_INACTIVE; fi
          if systemctl is-enabled --quiet cron 2>/dev/null || systemctl is-enabled --quiet crond 2>/dev/null; then
            echo FACTORY_CRON_BOOT_ENABLED
          else echo FACTORY_CRON_BOOT_NOT_ENABLED; fi
          crontab -l 2>/dev/null | grep -c 'SAEIT_FACTORY_AUTOSTART' | awk '{print "FACTORY_AUTOSTART_ENTRIES=" $1}' || true
          if test -f "$ops/vps-only-factory.log"; then
            echo FACTORY_LOG_LAST_DIAGNOSTICS
            grep -E 'FACTORY_(DAILY_PROBES_SCHEDULED|DISCOVERY_WAITING_FOR_EVIDENCE|TICK_OK|LOOP_|PROVIDER_|RESEARCH_)' "$ops/vps-only-factory.log" | tail -n 15 || true
          else echo FACTORY_LOG_MISSING; fi
          if test -f "$app/var/factory/discovery/latest.json"; then
            "$base/.venv/bin/python" - "$app/var/factory/discovery/latest.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          for k in ("status","stage","next_stage","opportunity_count","evidence_count","pending_evidence_count","waiting_for_evidence"):
              v=data.get(k)
              if isinstance(v,(str,int,float,bool)) or v is None:
                  print("FACTORY_DISCOVERY_"+k.upper()+"="+str(v))
          PY
          else echo FACTORY_DISCOVERY_MISSING; fi
          if test -f "$app/manage.py" && test -x "$base/.venv/bin/python"; then
            cd "$app"
            export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
            export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
            "$base/.venv/bin/python" - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          from django.db.models import Count
          names=("FactoryRun","AgentTask","ResearchProject","Product","Order","KnowledgeArticle","KnowledgeBook","Evidence","Finding","Report")
          for name in names:
              try:
                  model=apps.get_model("core",name)
              except LookupError:
                  print("FACTORY_MODEL_NOT_INSTALLED="+name)
                  continue
              try:
                  print("FACTORY_MODEL_COUNT_"+name.upper()+"="+str(model.objects.count()))
                  if any(f.name=="status" for f in model._meta.fields):
                      for row in model.objects.values("status").annotate(n=Count("pk")).order_by("-n")[:8]:
                          print("FACTORY_MODEL_STATUS_"+name.upper()+"="+str(row["status"])+":"+str(row["n"]))
                  if name=="Product" and any(f.name=="active" for f in model._meta.fields):
                      print("FACTORY_ACTIVE_PRODUCTS="+str(model.objects.filter(active=True).count()))
              except Exception as exc:
                  print("FACTORY_MODEL_QUERY_ERROR_"+name.upper()+"="+type(exc).__name__)
          PY
          else echo FACTORY_DJANGO_NOT_AVAILABLE; fi
          if test -f "$app/manage.py" && test -x "$base/.venv/bin/python"; then
            cd "$app"
            export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
            export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
            "$base/.venv/bin/python" - <<'PY'
          import os,re,collections
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          from django.db.models import Count
          for name in ("FactoryRun","AgentTask","Product","Order"):
              try: model=apps.get_model("core",name)
              except LookupError: continue
              fields={f.name for f in model._meta.fields}
              print("FACTORY_SCHEMA_FIELDS_"+name.upper()+"="+",".join(sorted(fields)))
              for field in ("action_type","capability_code","approval_status","stage","product_type","format","category"):
                  if field not in fields: continue
                  try:
                      for row in model.objects.values(field).annotate(n=Count("pk")).order_by("-n")[:10]:
                          key=str(row[field])
                          if re.fullmatch(r"[A-Za-z0-9_.:-]{1,60}",key):
                              print("FACTORY_CATEGORY_"+name.upper()+"_"+field.upper()+"="+key+":"+str(row["n"]))
                  except Exception as exc: print("FACTORY_AGGREGATE_ERROR_"+name.upper()+"_"+field.upper()+"="+type(exc).__name__)
              if name in ("FactoryRun","AgentTask") and "status" in fields:
                  reasons=collections.Counter()
                  candidates=("blocked_reason","failure_reason","error_message","last_error","error","reason","output_summary","notes","result_summary")
                  use=[n for n in candidates if n in fields]
                  for obj in model.objects.filter(status="blocked").only(*use).iterator(chunk_size=100):
                      message=" ".join(str(getattr(obj,n,"") or "") for n in use).lower()
                      matches=[tag for tag,pattern in (
                          ("owner_approval",r"approv|owner|permission|grant|تأیید|مجوز"),
                          ("evidence",r"evidence|source|proof|شواهد|مدرک"),
                          ("provider",r"provider|api|model|research"),
                          ("budget",r"budget|cost|token|quota|429|اعتبار"),
                          ("identity",r"identity|owner_id|user|auth"),
                          ("quality",r"quality|review|validation|qa"),
                      ) if re.search(pattern,message)]
                      reasons.update(matches if matches else ["unclassified_or_no_reason_field"])
                  for tag,n in reasons.most_common():
                      print("FACTORY_BLOCKER_CATEGORY_"+name.upper()+"_"+tag.upper()+"="+str(n))
          for model in apps.get_app_config("core").get_models():
              if "Approval" not in model.__name__: continue
              try:
                  names={f.name for f in model._meta.fields}
                  print("FACTORY_APPROVAL_MODEL="+model.__name__+" COUNT="+str(model.objects.count()))
                  for field in ("status","decision"):
                      if field in names:
                          for row in model.objects.values(field).annotate(n=Count("pk")).order_by("-n")[:8]:
                              value=str(row[field])
                              if re.fullmatch(r"[A-Za-z0-9_.:-]{1,60}",value):
                                  print("FACTORY_APPROVAL_"+field.upper()+"="+value+":"+str(row["n"]))
              except Exception as exc: print("FACTORY_APPROVAL_QUERY_ERROR="+type(exc).__name__)
          PY
          fi
          if test -f "$app/manage.py" && test -x "$base/.venv/bin/python"; then
            cd "$app"
            export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
            "$base/.venv/bin/python" - <<'PY'
          import os,re,collections
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          Product=apps.get_model("core","Product")
          Task=apps.get_model("core","AgentTask")
          def keys(d):
              return list(d) if isinstance(d,dict) else []
          for name,qs in (("INPUT",Task.objects.filter(status="blocked")),("OUTPUT",Task.objects.filter(status="blocked")),("PREREQUISITE",Task.objects.filter(status="blocked"))):
              attr={"INPUT":"input_data","OUTPUT":"output_data","PREREQUISITE":"prerequisite_snapshot"}[name]
              freq=collections.Counter()
              reasons=collections.Counter()
              for t in qs.only(attr).iterator(chunk_size=200):
                  d=getattr(t,attr,None)
                  if not isinstance(d,dict): continue
                  freq.update(k for k in d if re.fullmatch(r"[A-Za-z0-9_.:-]{1,80}",str(k)))
                  for k,v in d.items():
                      if not re.search(r"block|fail|error|reason|detail|approval|prerequisite|status",str(k),re.I): continue
                      text=str(v).lower()[:1000]
                      for tag,p in (
                          ("owner_or_approval",r"owner|approv|permission|grant"),
                          ("missing_evidence",r"evidence|source|proof|citation"),
                          ("provider_issue",r"provider|model|offline|network"),
                          ("budget_or_api",r"budget|quota|token|429|api.key"),
                          ("missing_project",r"project|identity|user"),
                          ("review",r"quality|review|validation"),
                      ):
                          if re.search(p,text): reasons[tag]+=1
              print("FACTORY_BLOCKED_TASK_"+name+"_KEYS="+",".join(k+":"+str(v) for k,v in freq.most_common(25)))
              print("FACTORY_BLOCKED_TASK_"+name+"_REASON_CATEGORIES="+",".join(k+":"+str(v) for k,v in reasons.most_common()))
          product_keys=collections.Counter()
          ready=collections.Counter()
          for p in Product.objects.all().iterator(chunk_size=100):
              m=p.metadata if isinstance(p.metadata,dict) else {}
              product_keys.update(str(k) for k in m if re.fullmatch(r"[A-Za-z0-9_.:-]{1,80}",str(k)))
              ready["priced"]+=int(p.price>0)
              ready["owner_attached"]+=int(p.owner_id is not None)
              ready["knowledge_article_attached"]+=int(p.knowledge_article_id is not None)
              ready["metadata_nonempty"]+=int(bool(m))
              ready["active"]+=int(bool(p.active))
          print("FACTORY_PRODUCT_METADATA_KEYS="+",".join(k+":"+str(v) for k,v in product_keys.most_common(30)))
          print("FACTORY_PRODUCT_READINESS_COUNTS="+",".join(k+":"+str(v) for k,v in ready.items()))
          PY
          fi
          if test -f "$app/manage.py" && test -x "$base/.venv/bin/python"; then
            cd "$app"
            export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
            "$base/.venv/bin/python" - <<'PY'
          import os,re,collections
          from datetime import datetime,timezone
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          from django.apps import apps
          U=get_user_model()
          print("FACTORY_OWNER_ACTIVE_SUPERUSER_COUNT="+str(U.objects.filter(is_active=True,is_superuser=True).count()))
          print("FACTORY_OWNER_USER_TOTAL_COUNT="+str(U.objects.count()))
          Task=apps.get_model("core","AgentTask")
          blocked=Task.objects.filter(status="blocked")
          patterns={
              "owner":r"owner","approval":r"approv","permission":r"permission",
              "provenance":r"provenance","project":r"project","not_found":r"not found|missing|unavailable",
              "research":r"research","retry":r"retry|attempt","policy":r"policy|risk",
          }
          counters=collections.Counter()
          for t in blocked.only("output_data","created_at").iterator(chunk_size=100):
              error=str((t.output_data or {}).get("error","")).lower()
              for tag,pattern in patterns.items():
                  if re.search(pattern,error): counters[tag]+=1
              if t.created_at:
                  counters["blocked_before_2026_10_10"]+=int(t.created_at.date().isoformat()<"2026-10-10")
                  counters["blocked_on_or_after_2026_10_10"]+=int(t.created_at.date().isoformat()>="2026-10-10")
          print("FACTORY_BLOCKER_SIGNAL_COUNTS="+",".join(k+":"+str(v) for k,v in counters.items()))
          P=apps.get_model("core","Product")
          values=collections.Counter()
          for p in P.objects.all().iterator(chunk_size=100):
              m=p.metadata if isinstance(p.metadata,dict) else {}
              v=m.get("factory_state")
              if isinstance(v,str) and re.fullmatch(r"[A-Za-z_]{1,40}",v):
                  values[v]+=1
              else: values["unclassified"]+=1
              validation=m.get("validation")
              if isinstance(validation,dict):
                  for k in validation:
                      if re.fullmatch(r"[A-Za-z_]{1,40}",str(k)):
                          values["validation_key_"+k]+=1
          print("FACTORY_PRODUCT_STATE_COUNTS="+",".join(k+":"+str(v) for k,v in values.items()))
          PY
          fi
          if test -f "$app/manage.py" && test -x "$base/.venv/bin/python"; then
            cd "$app"
            export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
            "$base/.venv/bin/python" - <<'PY'
          import os,re,collections
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          P=apps.get_model("core","Product")
          T=apps.get_model("core","AgentTask")
          F=apps.get_model("core","FactoryRun")
          def count_summary(queryset,field):
              d=collections.Counter(queryset.values_list(field,flat=True))
              return ",".join(str(k)+":"+str(v) for k,v in sorted(d.items(),key=lambda kv:str(kv[0])))
          for i,p in enumerate(P.objects.all().order_by("pk"),1):
              runs=F.objects.filter(product=p)
              tasks=T.objects.filter(product=p)
              m=p.metadata if isinstance(p.metadata,dict) else {}
              v=m.get("validation",{})
              validation=v.get("outcome","missing") if isinstance(v,dict) else "non_dict"
              if not (isinstance(validation,str) and re.fullmatch(r"[A-Za-z_.:-]{1,60}",validation)):
                  validation="not_public_enum"
              print("FACTORY_PRODUCT_"+str(i)+"_RUNS="+str(runs.count())+" STATES="+count_summary(runs,"status"))
              print("FACTORY_PRODUCT_"+str(i)+"_TASKS="+str(tasks.count())+" STATES="+count_summary(tasks,"status")+" TYPES="+count_summary(tasks,"action_type"))
              print("FACTORY_PRODUCT_"+str(i)+"_VALIDATION_OUTCOME="+validation)
              research=m.get("research",{})
              if isinstance(research,dict):
                  print("FACTORY_PRODUCT_"+str(i)+"_RESEARCH_KEYS="+",".join(k for k in research if re.fullmatch(r"[A-Za-z_.:-]{1,60}",str(k))))
              history=m.get("factory_history",[])
              print("FACTORY_PRODUCT_"+str(i)+"_HISTORY_LENGTH="+str(len(history) if isinstance(history,list) else 0))
          for name in ("ResearchProject","Report","Evidence","Finding"):
              M=apps.get_model("core",name)
              cols=[f.name for f in M._meta.fields]
              print("FACTORY_RESEARCH_"+name.upper()+"_RELATIONAL_COLUMNS="+",".join(k for k in cols if k.endswith("_id") or k in ("project","product","factory_run","source_report","owner","status")))
          PY
          fi
          echo FACTORY_INVENTORY_READ_ONLY_DONE
          REMOTE
