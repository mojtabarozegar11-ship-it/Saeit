name: MOJ1 Shasta read-only balance and VPS wallet check
on:
  push:
    branches: ['moj1/shasta-pilot-20261021']
    paths: ['.github/workflows/moj1-shasta-readonly-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moj1-shasta-readonly-check
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/moj1/shasta-pilot-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query two Shasta-only RPC endpoints without signing
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          address = "TWTBsKZPVuQgaGNbyJWJm9XR28g4wVBCNQ"
          endpoint = "https://api.shasta.trongrid.io"
          data = json.dumps({"address": address, "visible": True}).encode()
          balances = []
          for path in ("/wallet/getaccount", "/walletsolidity/getaccount"):
              req = urllib.request.Request(endpoint + path, data=data, method="POST",
                  headers={"Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      result = json.load(response)
                  if not isinstance(result, dict) or result.get("Error"):
                      raise ValueError("RPC returned invalid/error object")
                  returned_address = result.get("address")
                  if returned_address and returned_address != address:
                      raise ValueError("RPC account address mismatch")
                  sun = int(result.get("balance", 0))
                  if sun < 0:
                      raise ValueError("Negative balance returned")
                  balances.append(sun)
                  print("SHASTA_" + path.split("/")[1].upper() + "_TRX=" + str(sun / 1_000_000))
                  print("SHASTA_" + path.split("/")[1].upper() + "_ACCOUNT=" + ("PRESENT" if result.get("address") else "NOT_ACTIVATED"))
              except Exception as exc:
                  print("SHASTA_" + path.split("/")[1].upper() + "_RPC=UNVERIFIED_" + type(exc).__name__)
          if not balances:
              raise SystemExit("SHASTA_READONLY_STATUS=UNVERIFIED")
          print("SHASTA_READONLY_STATUS=FUNDED" if min(balances) > 0 else "SHASTA_READONLY_STATUS=NO_CONFIRMED_FUNDS")
          PY
      - name: Verify authorized VPS relay and preexisting public wallet metadata without reading private key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then echo "MOJ1_VPS_RELAY=NO_SECRET"; exit 1; fi
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/moj1_readonly_relay_key"
          ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null > "$RUNNER_TEMP/moj1_readonly_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/moj1_readonly_known_hosts" -E sha256 | grep -Fq 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 35s ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/moj1_readonly_known_hosts" -i "$RUNNER_TEMP/moj1_readonly_relay_key" githubops@178.239.147.150 'python3 -' <<'PY_VPS'
          import json, os, pathlib, stat
          root = pathlib.Path.home() / '.local/share/moj1-shasta-test-20261021'
          metadata = root / 'wallet-public.json'
          key = root / 'wallet.key'
          if root.is_symlink() or not root.is_dir() or stat.S_IMODE(root.stat().st_mode) != 0o700:
              raise SystemExit("MOJ1_VPS_WALLET=DIR_UNSAFE")
          if not metadata.is_file() or metadata.is_symlink() or not key.is_file() or key.is_symlink():
              raise SystemExit("MOJ1_VPS_WALLET=FILES_MISSING")
          if stat.S_IMODE(key.stat().st_mode) != 0o600:
              raise SystemExit("MOJ1_VPS_WALLET=KEY_MODE_UNSAFE")
          data = json.loads(metadata.read_text())
          if data.get('address_base58') != 'TWTBsKZPVuQgaGNbyJWJm9XR28g4wVBCNQ' or data.get('network') != 'Shasta-dedicated-test-use-only':
              raise SystemExit("MOJ1_VPS_WALLET=METADATA_MISMATCH")
          print("MOJ1_VPS_RELAY=CONNECTED")
          print("MOJ1_VPS_EXISTING_WALLET=VERIFIED")
          print("MOJ1_VPS_KEY_CONTENT_READ=NO")
          PY_VPS
