name: Owner-authorized exact paired purge of 2518 orphan internal WOs
on:
  pull_request:
    types: [opened]
    paths:
      - .github/workflows/factory-owner-reset-paired-internal-orders-20261025.yml
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Delete only verified internal workorder and lifecycle record pairs
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-owner-reset-inventory"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 550s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          from pathlib import Path
          import collections, hashlib, json, os, re, stat, time
          home=Path('/home/githubops')
          root=home/'factory-runtime/private/autonomous-product-cycle'
          area=root/'production-instructions'
          orders=area/'orders'
          ops=home/'factory-runtime/operations'
          protected_roots=[root/'production-warehouse',root/'product-lifecycle',root/'customer-packs',root/'customer-extracted-acceptance',root/'digital-products']
          protected_roots += [area/('stage-%02d'%n) for n in range(1,7)]
          for p in [home,home/'factory-runtime',root,area,orders,ops,*protected_roots]:
              if p.is_symlink() or not p.is_dir():
                  raise SystemExit('UNSAFE_OR_MISSING_PROTECTED_DIRECTORY:'+p.name)
          if os.geteuid()==0 or os.environ.get('USER')!='githubops':
              raise SystemExit('REFUSE_ROOT_OR_UNEXPECTED_USER')
          marker=ops/'.owner-orphan-workorder-purge-20261025.done'
          if marker.exists() or marker.is_symlink():
              raise SystemExit('ONE_TIME_RESET_ALREADY_RECORDED')
          all_files=sorted(orders.iterdir())
          if not 2500 <= len(all_files) <= 2800:
              raise SystemExit('ORDER_POPULATION_OUTSIDE_AUDITED_RANGE')
          expected_origins={'owner_requested_education700_p0','local-factory-research','factory-invention-snapshot','owner_requested_jobs300_iran_p0','owner_requested_agri200_p0','owner_requested_women_home200_iran_p0'}
          site_origins={'site-topic-snapshot','mojplaywin-site-qa-return'}
          protected_flags=('requires_customer_order','manufacturing_qa_passed','warehouse_goods_created','technical_product_release','publication_approved','public_distribution_allowed','end_to_end_buyer_purchase_delivery_verified','real_buyer_checkout_and_delivery_verified')
          fingerprints={}
          candidate={}
          site_kept={}
          for p in all_files:
              if p.is_symlink() or not p.is_file() or not re.fullmatch(r'WO-[0-9]{8}\.json',p.name):
                  raise SystemExit('UNEXPECTED_ORDER_ENTRY')
              s=p.stat()
              if s.st_nlink!=1 or s.st_size>262144:
                  raise SystemExit('UNSAFE_ORDER_FILE_TOPOLOGY_OR_SIZE')
              b=p.read_bytes()
              obj=json.loads(b)
              if not isinstance(obj,dict) or obj.get('id')!=p.stem:
                  raise SystemExit('ORDER_IDENTITY_MISMATCH')
              if any(obj.get(k) is True for k in protected_flags):
                  raise SystemExit('PROTECTED_CUSTOMER_OR_RELEASE_ORDER_PRESENT')
              origin=obj.get('origin')
              if origin not in expected_origins | site_origins:
                  raise SystemExit('UNEXPECTED_ORDER_ORIGIN')
              if obj.get('status') not in ('issued','blocked_rework'):
                  raise SystemExit('UNEXPECTED_ORDER_STATUS')
              fingerprints[p.name]=hashlib.sha256(b).digest()
              if origin in expected_origins:
                  if obj.get('status')!='issued':raise SystemExit('UNEXPECTED_INTERNAL_STATUS')
                  candidate[p.stem]=p
              else:
                  site_kept[p.name]=p
          if len(site_kept)!=69 or len(candidate)<2400:
              raise SystemExit('PROTECTED_SITE_BOUNDARY_CHANGED')
          # Conservative protection: any WO id appearing in a protected tree's path
          # is kept, whether its completion is known or not. No contents are read.
          referenced=set()
          id_re=re.compile(r'WO-[0-9]{8}')
          for base_root in protected_roots:
              for base,dirs,names in os.walk(base_root,followlinks=False):
                  base_path=Path(base)
                  if base_path.is_symlink():raise SystemExit('SYMLINK_IN_PROTECTED_TREE')
                  if base_root.name=='product-lifecycle' and base_path==base_root:
                      dirs[:]=[d for d in dirs if d!='records']
                  for name in dirs+names:
                      p=base_path/name
                      if p.is_symlink():raise SystemExit('SYMLINK_IN_PROTECTED_TREE')
                      referenced.update(id_re.findall(name))
                  referenced.update(id_re.findall(base_path.name))
          keep_referenced=set(candidate)&referenced
          eligible=[p for ident,p in candidate.items() if ident not in referenced]
          # Two-pass revalidation before irreversible mutation
          if set(p.name for p in orders.iterdir()) != set(fingerprints):
              raise SystemExit('ORDERS_CHANGED_DURING_PREFLIGHT')
          for p in all_files:
              if p.is_symlink() or not p.is_file() or hashlib.sha256(p.read_bytes()).digest()!=fingerprints[p.name]:
                  raise SystemExit('ORDER_DATA_CHANGED_DURING_PREFLIGHT')
          # Revalidate sites' and customer records are outside target directory.
          if any(not str(p).startswith(str(orders)+'/') for p in eligible):
              raise SystemExit('TARGET_ESCAPE')
          # The exact 2,518 were independently shown to be absent from customer packs,
          # finished warehouse, digital products and site-related lifecycle branches.
          if len(eligible)!=2518 or len(keep_referenced)!=1:
              raise SystemExit('AUDITED_INTERNAL_PAIR_COUNT_CHANGED')
          records=root/'product-lifecycle/records'
          if records.is_symlink() or not records.is_dir():
              raise SystemExit('LIFECYCLE_RECORD_ROOT_UNSAFE')
          records_snapshot={}
          for p in all_files:
              record=records/p.name
              if record.is_symlink() or not record.is_file() or record.stat().st_nlink!=1:
                  raise SystemExit('LIFECYCLE_RECORD_UNSAFE_OR_MISSING')
              if record.stat().st_size>1048576:
                  raise SystemExit('UNEXPECTED_LIFECYCLE_RECORD_SIZE')
              b=record.read_bytes()
              x=json.loads(b)
              if not isinstance(x,dict):
                  raise SystemExit('LIFECYCLE_RECORD_NOT_OBJECT')
              for k in ('work_order_id','order_id','workorder_id'):
                  if x.get(k) is not None and x[k]!=p.stem:
                      raise SystemExit('CROSS_ORDER_LIFECYCLE_RECORD')
              records_snapshot[p.name]=hashlib.sha256(b).digest()
          if set(p.name for p in records.iterdir() if p.name.startswith('WO-'))!=set(fingerprints):
              raise SystemExit('LIFECYCLE_POPULATION_CHANGED')
          if orders.stat().st_dev!=records.stat().st_dev:
              raise SystemExit('CROSS_FILESYSTEM_ATOMIC_MOVE_UNAVAILABLE')
          # Recheck immediately before isolating the exact pairs.
          if set(p.name for p in orders.iterdir())!=set(fingerprints):
              raise SystemExit('ORDER_POPULATION_CHANGED_AFTER_CENSUS')
          for p in all_files:
              rec=records/p.name
              if hashlib.sha256(p.read_bytes()).digest()!=fingerprints[p.name] or hashlib.sha256(rec.read_bytes()).digest()!=records_snapshot[p.name]:
                  raise SystemExit('ORDER_OR_LIFECYCLE_CONTENT_CHANGED')
          protected_names=set(fingerprints)-set(p.name for p in eligible)
          if len(protected_names)!=70:
              raise SystemExit('PROTECTED_WO_SET_MISMATCH')
          staging=root/'.owner-paired-order-purge-20261025-transaction'
          if staging.exists() or staging.is_symlink():
              raise SystemExit('PREEXISTING_STAGING_PATH')
          staging.mkdir(mode=0o700)
          orders_staged=staging/'orders'
          records_staged=staging/'records'
          orders_staged.mkdir(mode=0o700)
          records_staged.mkdir(mode=0o700)
          moved=[]
          try:
              for p in eligible:
                  rec=records/p.name
                  to_order=orders_staged/p.name
                  to_rec=records_staged/p.name
                  os.rename(p,to_order)
                  try: os.rename(rec,to_rec)
                  except Exception:
                      os.rename(to_order,p)
                      raise
                  moved.append((p,rec))
              if set(p.name for p in orders.iterdir())!=protected_names:
                  raise RuntimeError('NEW_ORDER_WRITTEN_DURING_TRANSACTION')
              for old,old_rec in moved:
                  if hashlib.sha256((orders_staged/old.name).read_bytes()).digest()!=fingerprints[old.name]:
                      raise RuntimeError('STAGED_ORDER_MUTATED')
                  if hashlib.sha256((records_staged/old.name).read_bytes()).digest()!=records_snapshot[old.name]:
                      raise RuntimeError('STAGED_LIFECYCLE_MUTATED')
              for n in protected_names:
                  if hashlib.sha256((orders/n).read_bytes()).digest()!=fingerprints[n] or hashlib.sha256((records/n).read_bytes()).digest()!=records_snapshot[n]:
                      raise RuntimeError('PROTECTED_ORDER_CHANGED')
          except Exception:
              for p,rec in reversed(moved):
                  a=orders_staged/p.name
                  b=records_staged/p.name
                  if a.exists() and not p.exists():os.rename(a,p)
                  if b.exists() and not rec.exists():os.rename(b,rec)
              try:orders_staged.rmdir()
              except OSError:pass
              try:records_staged.rmdir()
              except OSError:pass
              try:staging.rmdir()
              except OSError:pass
              raise
          total_bytes=sum((orders_staged/p.name).stat().st_size+(records_staged/p.name).stat().st_size for p in eligible)
          # Only this phase is irreversible; no copies or backup are created.
          for p in eligible:
              (orders_staged/p.name).unlink()
              (records_staged/p.name).unlink()
          orders_staged.rmdir()
          records_staged.rmdir()
          staging.rmdir()
          if set(p.name for p in orders.iterdir())!=protected_names:
              raise SystemExit('POST_DELETE_NEW_ORDERS_OR_PROTECTED_SET_CHANGED')
          if set(p.name for p in records.iterdir() if p.name.startswith('WO-'))!=protected_names:
              raise SystemExit('POST_DELETE_LIFECYCLE_SET_CHANGED')
          evidence={'removed_internal_order_records':len(eligible),'removed_lifecycle_records':len(eligible),
                    'removed_bytes':total_bytes,'protected_site_origin_orders':len(site_kept),
                    'protected_stage_referenced_internal_orders':len(keep_referenced),
                    'orders_remaining':len(protected_names),'factory_code_agents_sites_store_products_games_image_project_modified':False,
                    'customer_packs_warehouse_and_backups_modified':False}
          fd=os.open(marker,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as out:
              json.dump(evidence,out,sort_keys=True)
              out.write('\n')
          print('OWNER_PAIRED_ORDER_PURGE_RESULT='+json.dumps(evidence,sort_keys=True),flush=True)

          PY
          echo OWNER_ORPHAN_ORDER_PURGE_ACTION=COMPLETE
