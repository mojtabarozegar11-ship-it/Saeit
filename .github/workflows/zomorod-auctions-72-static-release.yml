name: Zomorod auctions 350-421 protected static release
on:
  pull_request:
    paths:
      - "public/auctions/**"
      - "public/sitemap-auctions.xml"
      - "content/auctions-72/**"
      - "scripts/zomorod_auctions_72_deploy.py"
      - "tests/test_zomorod_auctions_72_publication.py"
      - ".github/workflows/zomorod-auctions-72-static-release.yml"
  push:
    branches: [main]
    paths:
      - "public/auctions/**"
      - "public/sitemap-auctions.xml"
      - "content/auctions-72/**"
      - "scripts/zomorod_auctions_72_deploy.py"
      - ".github/workflows/zomorod-auctions-72-static-release.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-auctions-official-350-421
  cancel-in-progress: false

jobs:
  validate:
    name: Validate all 76 static notices and both sitemaps
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run release-specific checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_auctions_72_deploy.py
          python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python3 -m pytest -q tests/test_zomorod_auction_directory_artifacts.py tests/test_zomorod_auctions_72_publication.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("content/auctions-72/procurement-notices.json").read_text())
          n=d["notices"]
          assert len(n)==72
          assert [x["proposed_public_number"] for x in n if x["kind"]=="supply"]==list(range(350,386))
          assert [x["proposed_public_number"] for x in n if x["kind"]=="equipment"]==list(range(386,422))
          assert all(Path(f"public/auctions/{i}/index.html").is_file() for i in range(350,422))
          print("AUCTIONS_72_STATIC_SOURCE=valid")
          PY

  publish:
    name: Protected additive publication to Zomorod cPanel
    needs: validate
    if: ${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned GitHub Actions to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-auctions-72-relay"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 12 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test -s "$d/vps.known"
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 16s ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          ssh -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2'
          echo "ZOMOROD_AUCTIONS_RELAY=pinned_and_authenticated"

      - name: Stage exactly the approved static RFQ assets outside document root
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-auctions-72-relay"
          stage="/home/zomorod2/.zm-auctions-72-stage-$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          tar -cf - -C . public/auctions public/sitemap-auctions.xml scripts/zomorod_auctions_72_deploy.py |
            ssh -F "$d/config" saeit-cpanel "tar -xf - -C '$stage'"
          ssh -F "$d/config" saeit-cpanel "python3 '$stage/scripts/zomorod_auctions_72_deploy.py' check '$GITHUB_SHA'"
          echo "ZOMOROD_AUCTIONS_PRIVATE_STAGING=passed"

      - name: Publish exactly 72 new pages plus index and auction sitemap
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-auctions-72-relay"
          script="/home/zomorod2/.zm-auctions-72-stage-$GITHUB_SHA/scripts/zomorod_auctions_72_deploy.py"
          ssh -F "$d/config" saeit-cpanel "python3 '$script' apply '$GITHUB_SHA'"

      - name: Verify local integrity plus 72 live URLs and preserved original routes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-auctions-72-relay"
          script="/home/zomorod2/.zm-auctions-72-stage-$GITHUB_SHA/scripts/zomorod_auctions_72_deploy.py"
          ssh -F "$d/config" saeit-cpanel "python3 '$script' verify '$GITHUB_SHA'"
          python3 - <<'PY'
          import concurrent.futures
          from urllib.request import Request,urlopen
          from urllib.error import URLError
          import os, time
          base="https://www.zomorodmelal.ir"
          sha=os.environ["GITHUB_SHA"]
          def check(n):
              url=f"{base}/auctions/{n}/?release={sha}"
              last=None
              for attempt in range(3):
                  try:
                      req=Request(url,headers={"User-Agent":"ZomorodAuctionsRelease/1","Cache-Control":"no-cache"})
                      with urlopen(req,timeout=25) as r:
                          body=r.read(100000).decode("utf-8","replace")
                          assert r.status==200,(n,r.status)
                      if n>=350:
                          assert f"zm-auctions-72-v1 official-{n}" in body,n
                          assert f"شماره رسمی آگهی {n}" in body,n
                      else:
                          assert f"{n}" in body,n
                      return n
                  except Exception as e:
                      last=e
                      time.sleep(1+attempt)
              raise RuntimeError(f"PUBLIC_AD_FAILED_{n}: {last}")
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              found=list(ex.map(check,range(346,422)))
          assert found==list(range(346,422))
          req=Request(base+"/auctions/?release="+sha,headers={"Cache-Control":"no-cache"})
          with urlopen(req,timeout=28) as r:
              index=r.read(200000).decode("utf-8","replace")
              assert r.status==200
          assert "zm-auctions-72-index-v1" in index
          for n in range(346,422):
              assert f'/auctions/{n}/' in index,n
          assert '/auctions/supplier-kit/' in index
          with urlopen(base+"/sitemap-auctions.xml?release="+sha,timeout=28) as r:
              sitemap=r.read(100000).decode("utf-8","replace")
          for n in range(346,422):
              assert f'/auctions/{n}/' in sitemap
          with urlopen(base+"/auctions/supplier-kit/",timeout=25) as r:
              kit=r.read(50000).decode("utf-8","replace")
              assert r.status==200 and ("۳۴۶" in kit or "346" in kit)
          print("AUCTIONS_350_421_LIVE=72_verified")
          print("AUCTIONS_346_349_AND_SUPPLIER_KIT=PRESERVED")
          PY

      - name: Roll back only new pages and index/sitemap on release failure
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          d="$RUNNER_TEMP/zm-auctions-72-relay"
          if test -f "$d/config"; then
            script="/home/zomorod2/.zm-auctions-72-stage-$GITHUB_SHA/scripts/zomorod_auctions_72_deploy.py"
            ssh -F "$d/config" saeit-cpanel "python3 '$script' rollback '$GITHUB_SHA'" || true
          fi

      - name: Remove temporary SSH credentials from runner
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-auctions-72-relay"
