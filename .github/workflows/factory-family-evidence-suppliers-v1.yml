name: Per-family evidence supplier registry
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/factory_family_evidence_suppliers_v1.py
      - tests/test_factory_family_evidence_suppliers_v1.py
      - factory_config/forty_families.json
      - .github/workflows/factory-family-evidence-suppliers-v1.yml
  push:
    branches: [main]
    paths:
      - scripts/factory_family_evidence_suppliers_v1.py
      - tests/test_factory_family_evidence_suppliers_v1.py
      - factory_config/forty_families.json
      - .github/workflows/factory-family-evidence-suppliers-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: per-family-evidence-supplier-registry
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce one isolated evidence supplier per production family
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/factory_family_evidence_suppliers_v1.py
          python3 -B -m unittest discover -s tests -p test_factory_family_evidence_suppliers_v1.py -v
          python3 -B scripts/factory_family_evidence_suppliers_v1.py \
            --families factory_config/forty_families.json \
            --output "$RUNNER_TEMP/family-supplier-registry.json"
          python3 - "$RUNNER_TEMP/family-supplier-registry.json" <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["registered_family_count"] == 40
          assert data["supplier_count"] == 40
          assert data["connected_supplier_count"] == 0
          assert len({x["supplier_id"] for x in data["suppliers"]}) == 40
          assert all(x["evidence_request_capacity"] == "UNBOUNDED_APPEND_ONLY"
                     for x in data["suppliers"])
          assert data["evidence_fabricated"] is False
          assert data["production_release_authorized"] is False
          print("FACTORY_FAMILY_SUPPLIER_REGISTRY_CONTRACT=PASS")
          PY

  install-on-private-vps:
    needs: contract
    if: github.event_name != 'pull_request' && github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify pinned VPS SSH identity
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/family-supplier-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          echo FACTORY_EVIDENCE_SUPPLIER_VPS_HOST_PIN=PASS
      - name: Transfer tested supplier builder and family registry
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/family-supplier-ssh"
          stage="/home/githubops/factory-runtime/operations/.family-supplier-$GITHUB_RUN_ID"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=12)
          timeout 35s ssh "${opts[@]}" githubops@178.239.147.150 "set -eu; test ! -e '$stage'; install -d -m 700 '$stage'"
          timeout 35s scp -q "${opts[@]}" scripts/factory_family_evidence_suppliers_v1.py factory_config/forty_families.json "githubops@178.239.147.150:$stage/"
          for name in factory_family_evidence_suppliers_v1.py forty_families.json; do
            case "$name" in
              forty_families.json) local_path=factory_config/forty_families.json ;;
              *) local_path="scripts/$name" ;;
            esac
            expected="$(sha256sum "$local_path" | cut -d' ' -f1)"
            actual="$(timeout 25s ssh "${opts[@]}" githubops@178.239.147.150 "sha256sum '$stage/$name' | cut -d' ' -f1")"
            test "$expected" = "$actual"
          done
          echo FACTORY_FAMILY_SUPPLIER_TRANSFER_HASHES_MATCH=PASS
      - name: Install and build the immutable 40-line registry on VPS
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/family-supplier-ssh"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=12)
          timeout 180s ssh -T "${opts[@]}" githubops@178.239.147.150 "bash -se -- '$GITHUB_RUN_ID' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          run_id="$1"
          commit_sha="$2"
          base="/home/githubops/factory-runtime"
          stage="$base/operations/.family-supplier-$run_id"
          version="$base/operations/evidence-suppliers/versions/$commit_sha"
          root="$base/private/autonomous-product-cycle"
          registry_dir="$root/quality-excellence/evidence-supplier-registries"
          output="$registry_dir/registry-$run_id.json"
          test "$(id -un)" = githubops
          test ! -e "$version"
          test ! -e "$output"
          install -d -m 700 "$version" "$registry_dir"
          install -m 500 "$stage/factory_family_evidence_suppliers_v1.py" "$version/factory_family_evidence_suppliers_v1.py"
          install -m 400 "$stage/forty_families.json" "$version/forty_families.json"
          python3 -B "$version/factory_family_evidence_suppliers_v1.py" \
            --families "$version/forty_families.json" --output "$output"
          python3 - "$output" "$version/factory_family_evidence_suppliers_v1.py" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); code=Path(sys.argv[2])
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["registered_family_count"]==40 and d["supplier_count"]==40
          assert len({x["supplier_id"] for x in d["suppliers"]})==40
          assert d["connected_supplier_count"]==0 and d["evidence_fabricated"] is False
          assert d["production_release_authorized"] is False
          assert p.stat().st_mode & 0o077 == 0
          print("FACTORY_FAMILY_SUPPLIERS_INSTALLED=40")
          print("FACTORY_CONNECTED_EXTERNAL_SOURCES=0")
          print("FACTORY_EVIDENCE_FABRICATED=false")
          print("FACTORY_REGISTRY_RECEIPT="+str(p))
          print("FACTORY_REGISTRY_RECEIPT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          print("FACTORY_SUPPLIER_BUILDER_SHA256="+hashlib.sha256(code.read_bytes()).hexdigest())
          PY
          rm -rf -- "$stage"
          REMOTE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/family-supplier-ssh"
