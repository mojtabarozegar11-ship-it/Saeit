name: MojPlayWin payment and products immutable guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mojplaywin-commerce-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  no-payment-or-product-changes:
    if: contains(github.head_ref, 'mojplaywin')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate and historical base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR base and head for strict comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
      - name: Prevent changing checkout, wallet, product data or file bindings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/mojplaywin_commerce_freeze_guard.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --output mojplaywin-commerce-freeze-report.json
      - name: Test strict commerce freeze logic
        run: python3 -m unittest discover -s tests -p 'test_mojplaywin_commerce_freeze_guard.py'
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojplaywin-unchanged-payments-products
          path: mojplaywin-commerce-freeze-report.json
          if-no-files-found: warn
          retention-days: 30
