name: Publish Zomorod verified scientific project directory 20261023
on:
  push:
    branches: [zomorod/about-science-evidence-20261023]
    paths: [.github/workflows/zomorod-research-project-registry-live-20261023.yml]
permissions:
  contents: read
concurrency:
  group: zomorod-research-project-registry-safe
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict static and evidence validator selftests, site baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_research_registry_install_20261023.py scripts/zomorod_research_registry_updater_20261023.py
          python3 scripts/zomorod_research_registry_install_20261023.py selftest
          python3 scripts/zomorod_research_registry_updater_20261023.py selftest
          for route in / /about/ /company/ /research/ /contact/; do
            test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route")" = 200
            echo "REGISTRY_BASELINE_OK=$route"
          done
          test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' 'https://zomorodmelal.ir/research/projects/')" = 404
      - name: Prepare fingerprint-pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-about-science-evidence-relay"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "RELAY_PINNED=yes"
      - name: Install isolated public registry and private evidence updater on cPanel
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-about-science-evidence-relay"
          stage="/home/zomorod2/.zm-research-registry-20261023-$GITHUB_RUN_ID"
          backup="/home/zomorod2/.backups/zomorod-research-registry-20261023/$GITHUB_RUN_ID"
          ssh -T -F "$d/config" saeit-cpanel "umask 077; test ! -e '$stage'; install -d -m 700 '$stage'"
          ssh -T -F "$d/config" saeit-cpanel "cat > '$stage/installer.py'" < scripts/zomorod_research_registry_install_20261023.py
          ssh -T -F "$d/config" saeit-cpanel "cat > '$stage/updater.py'" < scripts/zomorod_research_registry_updater_20261023.py
          ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' selftest && python3 '$stage/updater.py' selftest"
          ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' publish --backup '$backup' --updater '$stage/updater.py'"
          echo "RESEARCH_PROJECT_REGISTRY_FILES_INSTALLED=yes"
      - name: Public functional audit with guarded rollback
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-about-science-evidence-relay"
          stage="/home/zomorod2/.zm-research-registry-20261023-$GITHUB_RUN_ID"
          backup="/home/zomorod2/.backups/zomorod-research-registry-20261023/$GITHUB_RUN_ID"
          audit() {
            curl -fsSL --max-time 30 "https://zomorodmelal.ir/research/projects/?audit=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/zm-research-registry-public.html" || return 1
            curl -fsSL --max-time 30 "https://zomorodmelal.ir/research/projects/projects.json?audit=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/zm-research-registry-public.json" || return 1
            curl -fsSL --max-time 30 "https://zomorodmelal.ir/research/?registry=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/zm-research-link-public.html" || return 1
            grep -Fq 'id="zm-research-project-directory-20261023"' "$RUNNER_TEMP/zm-research-registry-public.html" || return 1
            grep -Fq 'zm-registry-search' "$RUNNER_TEMP/zm-research-registry-public.html" || return 1
            grep -Fq 'شناسنامه طرح‌های پژوهشی' "$RUNNER_TEMP/zm-research-registry-public.html" || return 1
            grep -Fq 'id="zm-research-registry-link-20261023"' "$RUNNER_TEMP/zm-research-link-public.html" || return 1
            grep -Fq 'zm-research-rd-focus-20261023' "$RUNNER_TEMP/zm-research-link-public.html" || return 1
            python3 - "$RUNNER_TEMP/zm-research-registry-public.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f: o=json.load(f)
          assert o["schema_version"]==1 and o["projects"]==[]
          print("PUBLIC_RESEARCH_PROJECTS=0_NO_FABRICATED_RECORDS")
          PY
            for route in / /about/ /company/ /research/ /research/projects/ /contact/; do
              test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$route")" = 200 || return 1
            done
          }
          if audit; then
            ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' verify --backup '$backup'"
            echo "RESEARCH_PROJECT_REGISTRY_LIVE=verified"
            echo "ONLY_RESEARCH_INDEX_AND_NEW_PROJECT_DIRECTORY_UPDATED=yes"
          else
            echo "PUBLIC_AUDIT_FAILED_GUARDED_ROLLBACK=yes"
            ssh -T -F "$d/config" saeit-cpanel "python3 '$stage/installer.py' rollback --backup '$backup'"
            exit 1
          fi
      - name: Clear ephemeral runner SSH keys
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-about-science-evidence-relay"
          test ! -f "$d/vps.key" || shred -u "$d/vps.key"
          test ! -f "$d/host.key" || shred -u "$d/host.key"
