name: S-01 checkout CSP production read-only release preflight
on:
  pull_request:
    paths:
      - scripts/mpw_checkout_csp_zero_script_guard_20261029.py
      - tests/test_mpw_checkout_csp_zero_script_20261029.py
      - .github/workflows/mpw-checkout-csp-readonly-preflight-20261029.yml
permissions: {contents: read}
concurrency:
  group: s01-mpw-checkout-csp-readonly
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify scoped no-payment patch contract
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_mpw_checkout_csp_zero_script_20261029.py -v
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-invoice-diag-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect cPanel checkout source and rollback capacity without writes
        shell: bash
        run: |
          set -euo pipefail
          timeout 70s ssh -T -F "$RUNNER_TEMP/mpw-invoice-diag-ssh/config" saeit-cpanel \
            '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' <<'PY'
          import hashlib, json, os, pwd, stat
          from pathlib import Path
          app=Path('/home/zomorod2/Saeit-staging')
          target=app/'mpw_commerce/product_checkout_page.py'
          backup=Path('/home/zomorod2/.private_mojplaywin_main_agents')
          wsgi=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          expected='f33d80b7e843a66c9a55d8a8da46d5fb6049fb4c487f8f559c3471cfd42cdf74'
          result={'scope':'S-01_MPWCSP_READONLY','orders_created':0,'payments_created':0,
                  'writes_to_cpanel':False,'passenger_restart':False,
                  'offhost_restore_proof':'not_assessed'}
          result['shell_owner_expected']=pwd.getpwuid(os.getuid()).pw_name=='zomorod2'
          result['source_regular']=target.is_file() and not target.is_symlink()
          if result['source_regular']:
              content=target.read_bytes()
              result['source_sha256']=hashlib.sha256(content).hexdigest()
              result['source_expected']=result['source_sha256']==expected
              result['source_bytes']=len(content)
          result['passenger_wsgi_regular']=wsgi.is_file() and not wsgi.is_symlink()
          if result['passenger_wsgi_regular']:
              result['passenger_root_marker']=("APP='/home/zomorod2/Saeit-staging'" in wsgi.read_text('utf8','replace'))
          result['backup_directory_private']=backup.is_dir() and not backup.is_symlink() and not (stat.S_IMODE(backup.stat().st_mode)&0o077)
          for name,path in [('app',app),('backup',backup)]:
              if path.is_dir():
                  fs=os.statvfs(path)
                  result[name+'_available_bytes']=fs.f_bavail*fs.f_frsize
          result['safe_local_headroom']=min(result.get('app_available_bytes',0),result.get('backup_available_bytes',0))>=20*1024*1024
          required=('shell_owner_expected','source_regular','source_expected','passenger_wsgi_regular','passenger_root_marker','backup_directory_private','safe_local_headroom')
          result['local_preflight']=('PASS' if all(result.get(x,False) for x in required) else 'BLOCKED')
          print('S01_CSP_READONLY_PREFLIGHT='+json.dumps(result,sort_keys=True))
          PY
      - name: Inspect live checkout source signatures via existing pinned read-only relay
        shell: bash
        run: |
          set -euo pipefail
          # No imports from live Django app; no DB connections, writes or restarts.
          timeout 55s ssh -T -F "$RUNNER_TEMP/mpw-invoice-diag-ssh/config" saeit-cpanel \
            '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -' <<'PY'
          import hashlib, json, os, stat
          from pathlib import Path
          app = Path('/home/zomorod2/Saeit-staging')
          root = Path('/home/zomorod2/mojplaywin.com')
          filenames = {
              'checkout_view': app/'mpw_commerce/product_checkout_page.py',
              'trx_web': app/'services/mpw_trx_commercial_web.py',
              'rate_feed': app/'scripts/mojplaywin_direct_wallet_rates.py',
              'buyer_wallets': app/'mpw_commerce/buyer_wallets.py',
              'commerce_urls': app/'mpw_commerce/urls.py',
              'django_settings': app/'config/settings.py',
              'live_wsgi': root/'passenger_wsgi.py',
          }
          # Public CI: report only SHA/size of application source, never file bytes,
          # credentials, .env contents, DB host/user/name, process environment or keys.
          out = {'scope':'S01_CHECKOUT_ACTUAL_SOURCE_READONLY',
                 'site_writes':False,'factory_writes':False,
                 'db_queries':False,'passenger_restart':False,
                 'effective_passenger_db_proven':False,
                 'complete_offhost_restore_proven':False,'files':{}}
          for label,p in filenames.items():
              entry = {'present':False}
              try:
                  s=p.lstat()
                  entry['regular']=stat.S_ISREG(s.st_mode)
                  entry['symlink']=stat.S_ISLNK(s.st_mode)
                  if entry['regular'] and not entry['symlink'] and s.st_size<=524288:
                      entry.update(present=True,bytes=s.st_size,
                                   sha256=hashlib.sha256(p.read_bytes()).hexdigest())
              except FileNotFoundError:
                  pass
              except OSError:
                  entry['read_error']=True
              out['files'][label]=entry
          out['safe_to_release']=False  # DB authority + external restore not proven.
          print('S01_CHECKOUT_SOURCE_FINGERPRINTS='+json.dumps(out,sort_keys=True))
          PY
      - name: Capture non-transactional public HTTP and sitemap status
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.error, urllib.request
          targets={
              'mpw':['/','/store/','/store/product/72/','/store/product/225/','/store/product/879/','/sitemap.xml','/robots.txt'],
              'zm':['/','/academy/','/company-gallery/','/newsletter/','/research/','/sitemap.xml','/robots.txt']
          }
          domains={'mpw':'mojplaywin.com','zm':'zomorodmelal.ir'}
          for site,paths in targets.items():
              for path in paths:
                  req=urllib.request.Request('https://'+domains[site]+path,
                      headers={'User-Agent':'S01SafeReadOnly/20261029','Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(req,timeout=14) as response:
                          status=response.status
                          final=response.geturl()
                  except urllib.error.HTTPError as exc:
                      status=exc.code
                      final=exc.geturl()
                  except Exception as exc:
                      status='NETWORK_ERROR:'+type(exc).__name__
                      final=None
                  print('S01_PUBLIC_HTTP='+json.dumps({'site':site,'path':path,'status':status,
                      'redirected':bool(final and final.rstrip('/')!=('https://'+domains[site]+path).rstrip('/'))},sort_keys=True))
          PY
      - name: Delete runner-only SSH material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-invoice-diag-ssh"
          if [ -d "$d" ]; then
            rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"
            rmdir "$d"
          fi
