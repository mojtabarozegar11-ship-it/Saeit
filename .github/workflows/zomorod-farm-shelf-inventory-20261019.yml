name: Zomorod farm game shelf discovery read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zomorod-farm-shelf-inventory-20261019.yml','scripts/zm_farm_home_inventory_20261019.py']
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect actual public home shelf without changing website
        run: python3 scripts/zm_farm_home_inventory_20261019.py
