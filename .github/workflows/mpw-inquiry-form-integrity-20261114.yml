name: MojPlayWin form-integrity regression (offline only)

on:
  push:
    branches:
      - fix/mpw-inquiry-first-lead-20261114
    paths:
      - mpw_revenue_20261020/earn/inquiry.php
      - tests/test_mpw_inquiry_form_shape_20261114.py
      - .github/workflows/mpw-inquiry-form-integrity-20261114.yml
  pull_request:
    paths:
      - mpw_revenue_20261020/earn/inquiry.php
      - tests/test_mpw_inquiry_form_shape_20261114.py
      - .github/workflows/mpw-inquiry-form-integrity-20261114.yml

permissions:
  contents: read

concurrency:
  group: mpw-inquiry-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax checks without loading endpoint
        run: |
          php -l mpw_revenue_20261020/earn/inquiry.php
          python3 -m py_compile tests/test_mpw_inquiry_form_shape_20261114.py
      - name: Isolated pure form guard, no real requests
        run: python3 -m unittest discover -s tests -p 'test_mpw_inquiry_form_shape_20261114.py' -v
