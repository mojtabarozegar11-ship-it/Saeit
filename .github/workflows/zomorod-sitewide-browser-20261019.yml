name: Zomorod sitewide 28 route read only browser and accessibility audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/zomorod-sitewide-browser-20261019.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install headless browser and axe tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zomorod-sitewide-browser"
          cd "$RUNNER_TEMP/zomorod-sitewide-browser"
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install chromium
      - name: Read only audit of 28 routes on mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/zomorod-sitewide-browser"
          cp "$GITHUB_WORKSPACE/scripts/zomorod_sitewide_playwright_audit_20261019.cjs" ./audit.cjs
          node audit.cjs
      - name: Archive route-by-route findings and representative screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zomorod-sitewide-browser-report-20261019
          path: |
            ${{ runner.temp }}/zomorod-sitewide-browser/sitewide-visual.json
            ${{ runner.temp }}/zomorod-sitewide-browser/*.png
          retention-days: 14
          if-no-files-found: warn
