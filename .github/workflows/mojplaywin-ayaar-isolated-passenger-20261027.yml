name: AYAR independent Passenger app at exact MojPlayWin path
on:
  push:
    branches: [release/ayaar-exact-path-20261027]
    paths:
      - ".github/workflows/mojplaywin-ayaar-isolated-passenger-20261027.yml"
      - "scripts/deploy_ayaar_isolated_passenger_20261027.py"
      - "site_releases/mojplaywin/ayaar-20261027/passenger_wsgi.py"
permissions:
  contents: read
concurrency:
  group: mpw-ayaar-passenger-app-one-independent-prefix
  cancel-in-progress: false
jobs:
  independent-microsite:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/release/ayaar-exact-path-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate package scope and isolated WSGI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy_ayaar_isolated_passenger_20261027.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path('site_releases/mojplaywin/ayaar-20261027')
          expected={'index.html','methodology.html','styles.css','hero.css','app.js','favicon.svg','hero-art.svg','passenger_wsgi.py'}
          assert {p.name for p in root.iterdir()} == expected
          for p in root.iterdir():
              assert p.is_file() and not p.is_symlink() and 0<p.stat().st_size<350000
          assert 'mojplaywin.com/ayaar/' in (root/'index.html').read_text('utf-8')
          assert 'AYAR-PREASSESSMENT-v1' in (root/'app.js').read_text('utf-8')
          ast.parse((root/'passenger_wsgi.py').read_text('utf-8'))
          print('AYAAR_SELFCONTAINED_RELEASE_VALID=TRUE')
          PY
      - name: Record unchanged public baseline
        shell: bash
        run: |
          set -euo pipefail
          for route in / /store/ /saman/ /taniya/ /mojtaba.roozegar/; do
            status="$(curl --connect-timeout 9 --max-time 28 -L -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route")"
            echo "PRESERVED_BEFORE=$route:$status"
            test "$status" = 200
          done
          old="$(curl --connect-timeout 9 --max-time 28 -sS -o /dev/null -w '%{http_code}' 'https://mojplaywin.com/ayaar/')"
          echo "AYAAR_BEFORE=$old"
          test "$old" = 404
      - name: Secure GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/ayaar-isolated-relay"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            path="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$path"
            chmod 600 "$path"
            ssh-keygen -y -P '' -f "$path" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 13
          EOF
          chmod 600 "$d/config"
      - name: Preflight original apps and register only new AYAR prefix
        shell: bash
        run: |
          set -euo pipefail
          conf="$RUNNER_TEMP/ayaar-isolated-relay/config"
          rid="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sha="$GITHUB_SHA"
          [[ "$rid" =~ ^[0-9]{5,25}_[0-9]{1,3}$ ]]
          timeout 65s ssh -T -F "$conf" saeit-cpanel "python3 - preflight '$rid' '$sha'" < scripts/deploy_ayaar_isolated_passenger_20261027.py
          payload="$RUNNER_TEMP/ayaar-standalone"
          install -d -m 700 "$payload"
          cp -- site_releases/mojplaywin/ayaar-20261027/* "$payload/"
          ( cd "$payload" && sha256sum app.js favicon.svg hero-art.svg hero.css index.html methodology.html passenger_wsgi.py styles.css > manifest.sha256 )
          AYAAR_RUN="$rid" AYAAR_SHA="$sha" AYAAR_PATH="$payload" python3 - <<'PY'
          import json,os
          from pathlib import Path
          dest=Path(os.environ['AYAAR_PATH'])/'deployment.json'
          dest.write_text(json.dumps({'identity':'MPW_AYAAR_STANDALONE_PASSENGER_V1','run_id':os.environ['AYAAR_RUN'],'source_sha':os.environ['AYAAR_SHA']},sort_keys=True),encoding='utf-8')
          PY
          timeout 55s ssh -T -F "$conf" saeit-cpanel "mkdir -m 700 '/home/zomorod2/.mpw-ayaar-app-stage-$rid'"
          tar -C "$payload" -cf - . | timeout 65s ssh -T -F "$conf" saeit-cpanel "tar -C '/home/zomorod2/.mpw-ayaar-app-stage-$rid' -xf -"
          timeout 100s ssh -T -F "$conf" saeit-cpanel "python3 - install '$rid' '$sha'" < scripts/deploy_ayaar_isolated_passenger_20261027.py
      - name: Verify isolated AYAR and preserve existing domains or rollback
        shell: bash
        run: |
          set -euo pipefail
          conf="$RUNNER_TEMP/ayaar-isolated-relay/config"
          rid="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sha="$GITHUB_SHA"
          healthy=true
          home="$RUNNER_TEMP/ayaar-live.html"
          code="$(curl --connect-timeout 9 --max-time 28 --retry 1 -sS -o "$home" -w '%{http_code}' 'https://mojplaywin.com/ayaar/' || true)"
          echo "AYAAR_EXACT_PATH_HTTP=$code"
          if test "$code" != 200 || ! grep -q 'AYAR — Digital Product Review' "$home"; then healthy=false; fi
          for route in /ayaar/app.js /ayaar/styles.css /ayaar/methodology.html /ayaar/favicon.svg; do
            code="$(curl --connect-timeout 9 --max-time 28 --retry 1 -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "AYAAR_ASSET_HTTP=$route:$code"
            if test "$code" != 200; then healthy=false; fi
          done
          for route in / /store/ /saman/ /taniya/ /mojtaba.roozegar/; do
            code="$(curl --connect-timeout 9 --max-time 28 --retry 1 -L -sS -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "PRESERVED_AFTER=$route:$code"
            if test "$code" != 200; then healthy=false; fi
          done
          if test "$healthy" != true; then
            echo 'AYAAR_HEALTH_FAILURE_UNREGISTER_OWN_APP_ONLY'
            timeout 85s ssh -T -F "$conf" saeit-cpanel "python3 - rollback '$rid' '$sha'" < scripts/deploy_ayaar_isolated_passenger_20261027.py
            exit 1
          fi
          echo 'AYAAR_PUBLIC_STANDALONE_LIVE=TRUE'
          echo 'AYAAR_NO_SHARED_APP_CODE_OR_RESTART=TRUE'
