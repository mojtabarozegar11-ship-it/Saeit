name: Pause VPS factory schedulers below safe disk reserve
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-factory-low-disk-pause-20261029.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-vps-factory-low-disk-pause
  cancel-in-progress: false
jobs:
  pause-if-low:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Measure VPS reserve and pause only tagged production schedulers
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/factory-low-disk"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          chmod 600 "$d/known"
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 bash -se <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          root="$HOME/factory-runtime"
          test -d "$root" && test ! -L "$root"
          free_kib="$(df -Pk "$root" | awk 'NR==2 {print $4}')"
          [[ "$free_kib" =~ ^[0-9]+$ ]]
          echo FACTORY_DISK_AVAILABLE_KIB="$free_kib"
          reserve_kib=524288
          echo FACTORY_DISK_MINIMUM_RESERVE_KIB="$reserve_kib"
          tags=(SAEIT_MASTER_AGENT_V1 SAEIT_FACTORY_EVERY_MINUTE_V1 SAEIT_FACTORY_LIFECYCLE_12_V1)
          current="$(mktemp /tmp/factory-cron-before.XXXXXX)"
          staged="$(mktemp /tmp/factory-cron-after.XXXXXX)"
          trap 'rm -f -- "$current" "$staged"' EXIT
          crontab -l > "$current" 2>/dev/null || : > "$current"
          for tag in "${tags[@]}"; do
            echo FACTORY_CRON_TAG_COUNT_"$tag"="$(grep -c "$tag" "$current" || true)"
          done
          if (( free_kib >= reserve_kib )); then
            echo FACTORY_LOW_DISK_PAUSE=not_required
            exit 0
          fi
          grep -Ev 'SAEIT_MASTER_AGENT_V1|SAEIT_FACTORY_EVERY_MINUTE_V1|SAEIT_FACTORY_LIFECYCLE_12_V1' "$current" > "$staged" || true
          crontab "$staged"
          after="$(crontab -l 2>/dev/null || true)"
          for tag in "${tags[@]}"; do
            if grep -q "$tag" <<<"$after"; then
              echo FACTORY_LOW_DISK_PAUSE=verification_failed >&2
              exit 1
            fi
          done
          echo FACTORY_LOW_DISK_PAUSE=production_schedulers_paused
          echo FACTORY_AUTO_RESUME=false
          REMOTE
