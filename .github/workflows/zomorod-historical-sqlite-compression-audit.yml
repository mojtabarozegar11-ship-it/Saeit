name: Read-only compressibility test for historical SQLite archives
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-historical-sqlite-compression-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-historical-compression
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Estimate archival savings by gzip-streaming sample database files without writing them
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,zlib,json,sqlite3,hashlib
          from pathlib import Path
          H=Path.home()
          pfx=H/".backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b/database/var/mother_robot/lab"
          candidates=[
              H/"Saeit/var/mother_robot/lab/upgrade-g28-1791077099027995723/project/db.sqlite3",
              H/"Saeit/var/mother_robot/lab/upgrade-g9-1791048367445544855/project/db.sqlite3",
              pfx/"upgrade-g28-1791077099027995723/project/db.sqlite3",
              pfx/"upgrade-g9-1791048367445544855/project/db.sqlite3",
              H/"Saeit-staging/mojplaywin.sqlite3"
          ]
          for p in candidates:
              if not p.is_file() or p.is_symlink():continue
              comp=zlib.compressobj(level=1,wbits=31)
              size=0
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(4*1024*1024),b""):
                      size+=len(comp.compress(chunk))
              size+=len(comp.flush())
              print("COMPRESS_SAMPLE="+json.dumps({"path":str(p.relative_to(H)),"original":p.stat().st_size,"gzip_level1_size":size,"ratio":round(size/max(1,p.stat().st_size),4)}))
          stat=os.statvfs(H)
          print("HOST_DISK_FREE_BYTES="+str(stat.f_bavail*stat.f_frsize))
          print("COMPRESSION_AUDIT_DONE=yes")
          PY
          REMOTE
      - name: Clean temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
