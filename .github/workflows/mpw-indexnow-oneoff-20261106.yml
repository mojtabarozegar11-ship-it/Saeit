name: MPW one-off free IndexNow updated revenue URL notification

on:
  push:
    branches: [feat/mpw-indexnow-oneoff-20261106]
    paths:
      - .github/workflows/mpw-indexnow-oneoff-20261106.yml

permissions: {contents: read}
concurrency:
  group: mpw-indexnow-oneoff-20261106
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/feat/mpw-indexnow-oneoff-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify one-file host ownership protocol
        run: |
          python3 -m py_compile scripts/mpw_indexnow_oneoff_20261106.py
          python3 scripts/mpw_indexnow_oneoff_20261106.py selftest
      - name: Establish pinned SSH relay to MojPlayWin cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-indexnow-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 30s ssh -i "$d/vps.key" -p 22 -o UserKnownHostsFile="$d/vps.known" -o StrictHostKeyChecking=yes -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Create one public domain verification TXT
        id: publication
        run: |
          set -euo pipefail
          payload="$(base64 -w0 scripts/mpw_indexnow_oneoff_20261106.py)"
          config="$RUNNER_TEMP/mpw-indexnow-ssh/config"
          timeout 60s ssh -T -F "$config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$payload\"))' preflight"
          timeout 60s ssh -T -F "$config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$payload\"))' publish '$GITHUB_RUN_ID'"
      - name: Verify public key and notify participating search engines once
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          key='fa0cd1f147d5dc00d1e02b5f8d2f8c94'
          key_url=f'https://mojplaywin.com/{key}.txt'
          with urllib.request.urlopen(key_url,timeout=30) as response:
              if response.status != 200 or response.read(256).strip().decode('ascii') != key:
                  raise RuntimeError('Public IndexNow domain key verification failed')
          page_url='https://mojplaywin.com/mpw-editorial/revenue/index.html'
          with urllib.request.urlopen(page_url,timeout=25) as response:
              page=response.read(100000).decode('utf8','replace')
              if response.status != 200 or 'class="mpw-live-store-offers"' not in page:
                  raise RuntimeError('Updated indexable commercial page not live')
          request=urllib.request.Request('https://api.indexnow.org/indexnow',
                  data=json.dumps({'host':'mojplaywin.com','key':key,'urlList':[page_url]}).encode('utf8'),
                  headers={'Content-Type':'application/json; charset=utf-8'},method='POST')
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  code=response.status
          except urllib.error.HTTPError as exc:
              code=exc.code
          if code not in (200,202):
              raise RuntimeError(f'IndexNow did not accept changed URL: HTTP {code}')
          print('MPW_INDEXNOW_UPDATED_REVENUE_URL_SUBMITTED=PASS status='+str(code))
          PY
      - name: Remove only the newly created verification file on failure
        if: failure() && steps.publication.outcome == 'success'
        run: |
          payload="$(base64 -w0 scripts/mpw_indexnow_oneoff_20261106.py)"
          timeout 60s ssh -T -F "$RUNNER_TEMP/mpw-indexnow-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$payload\"))' rollback '$GITHUB_RUN_ID'"
      - name: Delete only temporary runner SSH material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-indexnow-ssh"
          if test -d "$d"; then
            rm -f -- "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/config"
            rmdir -- "$d"
          fi
