name: MojPlayWin twelve interactive revenue tools safe public release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-12-functional-tools-release-20261020.yml"
permissions: {contents: read}
concurrency:
  group: mpw-static-twelve-revenue-apps
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check executable JavaScript, safe publisher and all twelve usable tools
        run: |
          set -euo pipefail
          node --check mpw_revenue_tools_20261020/toolkit.js
          python3 -m py_compile scripts/mpw_revenue_tools_safe_publisher_20261020.py
          python3 scripts/mpw_revenue_tools_safe_publisher_20261020.py selftest
          node - <<'JS'
          const fs=require('fs'),s=fs.readFileSync('mpw_revenue_tools_20261020/toolkit.js','utf8');
          const list=['website-doctor','landing-page-studio','ai-automation','business-spreadsheets','website-templates','social-media-kits','resume-builder','logo-studio','browser-games','marketing-ai','business-calculators','website-care'];
          for (const name of list) if(!s.includes('"'+name+'":')) throw Error('Missing usable app: '+name);
          if(!s.includes('download(')||!s.includes('addEventListener'))throw Error('Inert or missing app interactions');
          console.log('MPW_TWELVE_BROWSER_UTILITIES_CODE_CHECK=PASS');
          JS
          tar -czf "$RUNNER_TEMP/mpw-working-tools.tgz" -C mpw_revenue_tools_20261020 toolkit.js toolkit.css
      - name: Snapshot protected main and independent subsite HTTP status
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          paths=('/','/store/','/accounts/login/','/farnaz/','/saman/','/taniya/','/picm/')
          found={}
          for p in paths:
              try:
                  with urllib.request.urlopen('https://mojplaywin.com'+p,timeout=20) as r:found[p]=r.status
              except urllib.error.HTTPError as e:found[p]=e.code
          assert all(x==200 for x in found.values()),found
          open(os.environ['RUNNER_TEMP']+'/mpw-tools-baseline.json','w').write(json.dumps(found))
          print('MPW_TOOL_RELEASE_BASELINE='+json.dumps(found))
          PY
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Install and checksum exactly twelve dynamic browser apps plus directory entry
        id: publish
        run: |
          set -euo pipefail
          script="$(base64 -w0 scripts/mpw_revenue_tools_safe_publisher_20261020.py)"
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))' publish '$GITHUB_RUN_ID'" < "$RUNNER_TEMP/mpw-working-tools.tgz"
      - name: Verify live tool pages, interactive resources and no sibling changes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os,time
          domain='https://mojplaywin.com'
          slugs=('website-doctor','landing-page-studio','ai-automation','business-spreadsheets','website-templates','social-media-kits','resume-builder','logo-studio','browser-games','marketing-ai','business-calculators','website-care')
          for slug in slugs:
              path=f'/mpw-editorial/revenue/{slug}/index.html?appversion='+str(time.time_ns())
              req=urllib.request.Request(domain+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  html=r.read(200000).decode('utf8','replace')
                  if r.status!=200 or 'data-tool="'+slug+'"' not in html or 'assets/tools-v1.js' not in html:
                      raise RuntimeError('Unpublished or inert browser utility: '+slug)
              print('MPW_FREE_INTERACTIVE_APP_PUBLIC='+slug)
          for p in ('/mpw-editorial/revenue/assets/tools-v1.js','/mpw-editorial/revenue/assets/tools-v1.css'):
              with urllib.request.urlopen(domain+p,timeout=20) as r:
                  content=r.read(150000)
                  if r.status!=200 or len(content)<1500:raise RuntimeError('Empty functional app resource '+p)
          with urllib.request.urlopen(domain+'/mpw-editorial/revenue/index.html',timeout=20) as r:
              assert '12 working, free interactive tools' in r.read(200000).decode('utf8','replace')
          before=json.load(open(os.environ['RUNNER_TEMP']+'/mpw-tools-baseline.json'))
          for path,status in before.items():
              try:
                  with urllib.request.urlopen(domain+path,timeout=18) as r:got=r.status
              except urllib.error.HTTPError as e:got=e.code
              if got!=status:raise RuntimeError('Protected route changed: '+path)
          print('MPW_12_REAL_APPS_DEPLOYED_AND_INDEPENDENT_SITES_HTTP=PASS')
          PY
      - name: Atomic rollback of only tool files if smoke fails
        if: failure() && steps.publish.outcome == 'success'
        run: |
          script="$(base64 -w0 scripts/mpw_revenue_tools_safe_publisher_20261020.py)"
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "python3 -c 'import base64;exec(base64.b64decode(\"$script\"))' rollback '$GITHUB_RUN_ID'"
      - name: Destroy ephemeral SSH authentication materials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh" "$RUNNER_TEMP/mpw-working-tools.tgz"
