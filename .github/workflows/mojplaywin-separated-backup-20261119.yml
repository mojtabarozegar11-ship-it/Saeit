name: MojPlayWin separated store and email backup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mojplaywin-separated-backup-20261119.yml
  workflow_dispatch:

jobs:
  backup:
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
      FACTORY_VPS_RUNNER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned cPanel relay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          work="$RUNNER_TEMP/mpw-separated-backup"
          install -d -m 700 "$work"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/host.key"
          chmod 600 "$work/host.key"
          ssh-keygen -y -P '' -f "$work/host.key" >/dev/null
          ssh-keyscan -T 10 -p 1396 -t ed25519 178.239.147.125 > "$work/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$work/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$work/config" <<EOF
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $work/host.key
            UserKnownHostsFile $work/host.known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 20
            ServerAliveCountMax 3
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          printf '%s\n' "$work" > "$RUNNER_TEMP/mpw-separated-backup-path"
      - name: Create separate store and email archives on cPanel
        shell: bash
        run: |
          set -euo pipefail
          work="$(cat "$RUNNER_TEMP/mpw-separated-backup-path")"
          timeout 900s ssh -T -F "$work/config" saeit-cpanel 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          dest=/home/zomorod2/separated-backups/20261119
          mkdir -p "$dest"
          chmod 700 "$dest"
          store="$dest/mojplaywin-store-code-20261119.tar.gz"
          email="$dest/mojplaywin-email-mailboxes-20261119.tar.gz"
          if [ ! -s "$store" ]; then
            tmp="$store.part.$$"
            tar --exclude='*.env' --exclude='.env' --exclude='*.sqlite3' --exclude='db.sqlite3' --exclude='*.log' --exclude='backups' -czf "$tmp" -C /home/zomorod2/Saeit-staging config core services templates mpw_commerce mpw_native_checkout passenger_wsgi.py requirements.txt -C /home/zomorod2 mojplaywin.com/store
            chmod 600 "$tmp"
            mv -n "$tmp" "$store"
            test ! -e "$tmp" || rm -f "$tmp"
          fi
          if [ ! -s "$email" ]; then
            tmp="$email.part.$$"
            tar --ignore-failed-read -czf "$tmp" -C /home/zomorod2 mail
            chmod 600 "$tmp"
            mv -n "$tmp" "$email"
            test ! -e "$tmp" || rm -f "$tmp"
          fi
          tar -tzf "$store" >/dev/null
          tar -tzf "$email" >/dev/null
          test -n "$(tar -tzf "$email" | grep -E '^mail/(mojplaywin\.com|zomorodmelal\.ir)/' | head -1)"
          printf '%s\n' 'BACKUP_COMPLETE' > "$dest/BACKUP_STATUS.txt"
          printf '%s\n' 'STORE_ARCHIVE='"$store" >> "$dest/BACKUP_STATUS.txt"
          printf '%s\n' 'EMAIL_ARCHIVE='"$email" >> "$dest/BACKUP_STATUS.txt"
          printf '%s\n' 'STORE_SIZE_BYTES='"$(stat -c '%s' "$store")" >> "$dest/BACKUP_STATUS.txt"
          printf '%s\n' 'EMAIL_SIZE_BYTES='"$(stat -c '%s' "$email")" >> "$dest/BACKUP_STATUS.txt"
          sha256sum "$store" "$email" > "$dest/SHA256SUMS.txt"
          chmod 600 "$dest"/BACKUP_STATUS.txt "$dest"/SHA256SUMS.txt
          cat "$dest/BACKUP_STATUS.txt"
          cat "$dest/SHA256SUMS.txt"
          REMOTE_SCRIPT
      - name: Confirm no deployment or deletion
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'BACKUP_ONLY=1' 'DEPLOYMENT=0' 'DELETION=0' 'DATABASE_DUMP_NOT_TOUCHED=1'


      - name: Run read-only recovery inventory on the same pinned relay
        shell: bash
        run: |
          set -euo pipefail
          work="$(cat "$RUNNER_TEMP/mpw-separated-backup-path")"
          stage="/home/zomorod2/.local/share/mpw-live-preflight-$GITHUB_RUN_ID"
          timeout 30s ssh -T -F "$work/config" saeit-cpanel "umask 077; rm -rf -- '$stage'; mkdir -p -- '$stage'"
          tar -C "$GITHUB_WORKSPACE" -czf - scripts/mpw_live_email_recovery_capability_readonly_20261105.py scripts/mpw_live_guest_email_linkage_readonly_20261105.py scripts/mpw_trx_canary_existing_receipts_readonly_20261116.py scripts/mpw_live_source_lineage_readonly_20261119.py | timeout 45s ssh -T -F "$work/config" saeit-cpanel "tar -xzf - -C '$stage'"
          timeout 180s ssh -T -F "$work/config" saeit-cpanel "cd /home/zomorod2/Saeit-staging && /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_live_email_recovery_capability_readonly_20261105.py'"
          timeout 180s ssh -T -F "$work/config" saeit-cpanel "cd /home/zomorod2/Saeit-staging && /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_live_guest_email_linkage_readonly_20261105.py'"
          timeout 180s ssh -T -F "$work/config" saeit-cpanel "cd /home/zomorod2/Saeit-staging && /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_trx_canary_existing_receipts_readonly_20261116.py'"
          timeout 60s ssh -T -F "$work/config" saeit-cpanel "cd /home/zomorod2/Saeit-staging && /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B '$stage/scripts/mpw_live_source_lineage_readonly_20261119.py'"
          timeout 60s ssh -T -F "$work/config" saeit-cpanel "cd /home/zomorod2/Saeit-staging && /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -B - <<'PY'
          import json, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.conf import settings
          print('MPW_LIVE_FLAGS=' + json.dumps({
              'recovery_enabled': getattr(settings,'MPW_GUEST_RECOVERY_ENABLED',False) is True,
              'recovery_email_approved': getattr(settings,'MPW_GUEST_RECOVERY_EMAIL_APPROVED',False) is True,
              'email_send_approved': getattr(settings,'MPW_GUEST_EMAIL_SEND_APPROVED',False) is True,
              'merchant_canary': getattr(settings,'MPW_WALLETLESS_TRX_MERCHANT_CANARY_PASSED',False) is True,
              'email_backend': str(getattr(settings,'EMAIL_BACKEND',''))[:120],
              'default_from_configured': bool(str(getattr(settings,'DEFAULT_FROM_EMAIL','')).strip()),
          }, sort_keys=True))
          PY"
          timeout 30s ssh -T -F "$work/config" saeit-cpanel "rm -rf -- '$stage'"
