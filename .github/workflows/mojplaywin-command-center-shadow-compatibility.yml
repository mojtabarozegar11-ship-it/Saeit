name: MojPlayWin isolated command center compatibility on cPanel
on:
  push:
    branches: [qa/mpw-command-center-isolated-20261014]
    paths:
      - .github/workflows/mojplaywin-command-center-shadow-compatibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private command center shadow install and Django route and template QA
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 60s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          umask 077
          shadow="$HOME/.mpw-command-center-qa/source"
          test ! -e "$shadow" && test ! -L "$shadow"
          mkdir -p "$shadow"
          chmod 700 "$HOME/.mpw-command-center-qa" "$shadow"
          REMOTE
          test -d "$GITHUB_WORKSPACE/command_center"
          tar -C "$GITHUB_WORKSPACE" -cf - command_center | timeout 95s ssh -F "$d/config" host 'tar -xf - -C "$HOME/.mpw-command-center-qa/source"'
          timeout 150s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import os,sys,types,importlib
          from pathlib import Path
          site=Path.home()/'Saeit-staging'
          shadow=Path.home()/'.mpw-command-center-qa/source'
          assert shadow.is_dir() and (shadow/'command_center/urls.py').is_file()
          assert not (site/'command_center').exists(), 'Live package unexpectedly present'
          sys.path.insert(0,str(shadow))
          os.environ['DJANGO_SETTINGS_MODULE']='config.settings'
          import django
          from django.conf import settings
          assert 'command_center' not in settings.INSTALLED_APPS, 'Unexpected live app'
          settings.INSTALLED_APPS=list(settings.INSTALLED_APPS)+['command_center']
          django.setup()
          from core import models as core_models
          expected=('Agent','ApprovalRequest','NewsletterStory')
          for name in expected:
              print('MPW_CC_MODEL_AVAILABLE_'+name.upper()+'='+str(hasattr(core_models,name)))
          from django.contrib.auth.models import AnonymousUser
          from django.urls import include,path,resolve,reverse,clear_url_caches
          from django.test import RequestFactory
          from django.core.checks import run_checks,Tags
          from django.test.utils import override_settings
          import config.urls as live
          assert any(str(p.pattern)=='staff/' for p in live.urlpatterns)
          candidate=[path('staff/command-center/',include('command_center.urls')),*live.urlpatterns]
          module=types.ModuleType('mpw_cc_shadow_routes_only')
          module.urlpatterns=candidate
          sys.modules[module.__name__]=module
          try:
              with override_settings(ROOT_URLCONF=module.__name__):
                  clear_url_caches()
                  issues=run_checks(tags=[Tags.urls])
                  assert not any(x.id=='urls.W005' for x in issues)
                  for route,n in (
                    ('/admin/','admin:index'),
                    ('/staff/','staff_admin:index'),
                    ('/staff/command-center/','command_center_dashboard'),
                    ('/staff/command-center/api/overview/','command_center_overview_api'),
                    ('/staff/command-center/api/agents/','command_center_agent_metrics_api')):
                      assert resolve(route).view_name==n,(route,resolve(route).view_name)
                      print('MPW_CC_SHADOW_ROUTE_OK',route)
                  rf=RequestFactory()
                  from command_center.views import dashboard,overview_api
                  req=rf.get('/staff/command-center/',HTTP_HOST='mojplaywin.com')
                  req.user=AnonymousUser()
                  resp=dashboard(req)
                  assert resp.status_code in (301,302)
                  print('MPW_CC_ANONYMOUS_DENIED=True')
                  staff=types.SimpleNamespace(is_authenticated=True,is_active=True,is_staff=True,is_superuser=True)
                  req=rf.get('/staff/command-center/',HTTP_HOST='mojplaywin.com')
                  req.user=staff
                  rsp=dashboard(req)
                  assert rsp.status_code==200 and len(rsp.content)>200
                  print('MPW_CC_STAFF_DASHBOARD_RENDER_200=True')
                  req=rf.get('/staff/command-center/api/overview/',HTTP_HOST='mojplaywin.com')
                  req.user=staff
                  api=overview_api(req)
                  assert api.status_code==200 and b'expected_components' in api.content
                  print('MPW_CC_STAFF_OVERVIEW_READONLY_200=True')
        for route in (
          '/staff/command-center/api/agents/',
          '/staff/command-center/api/agents/directory/',
          '/staff/command-center/api/approvals/pending/',
          '/staff/command-center/api/content/stats/',
          '/staff/command-center/api/content/queue/',
          '/staff/command-center/api/content/album/',
          '/staff/command-center/api/content/album/search/',
        ):
            resolved=resolve(route)
            req=rf.get(route,HTTP_HOST='mojplaywin.com')
            req.user=staff
            rsp=resolved.func(req,**resolved.kwargs)
            assert rsp.status_code==200, (route,rsp.status_code)
            print('MPW_CC_STAFF_READONLY_API_OK',route)
        for route in ('/staff/command-center/api/agents/proposals/','/staff/command-center/api/content/album/'):
            resolved=resolve(route)
            req=rf.get(route,HTTP_HOST='mojplaywin.com')
            req.user=AnonymousUser()
            rsp=resolved.func(req,**resolved.kwargs)
            assert rsp.status_code in (301,302), (route,rsp.status_code)
        print('MPW_CC_ANONYMOUS_WRITE_ENDPOINTS_BLOCKED=True')
          finally:
              sys.modules.pop(module.__name__,None)
              clear_url_caches()
          print('MPW_CC_ACTIVE_SITE_UNTOUCHED=True')
          print('MPW_CC_NO_PAYMENT_CHANGE=True')
          PY
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
