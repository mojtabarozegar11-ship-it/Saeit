name: One-time isolated production theme repair for both sites
on:
  push:
    branches: [fix/live-theme-audit-20261105]
    paths:
      - .github/workflows/live-theme-isolated-release-20261105.yml
permissions:
  contents: read
concurrency:
  group: production-live-theme-repair-20261105
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release script and approved source changes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/live_theme_isolated_release_20261105.py
          php -l content/zomorod-v11/store_index.php
          php -l content/zomorod-business/app.php
      - name: Establish fingerprint-pinned VPS to cPanel connection
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/live-theme-publish-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          dest = Path(os.environ['SSH_DIR'])
          for label, filename in [('vps.known', 'vps.known'), ('host.candidate', 'host.known')]:
              suffix = f'> "$d/{label}"'
              matches = [line.strip() for line in source.splitlines()
                         if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit('PINNED_HOST_KEY_NOT_AVAILABLE:' + label)
              value = matches[0].split("printf '%s\\n' '", 1)[1].rsplit("' >", 1)[0]
              (dest / filename).write_text(value + '\n')
          for env_key, filename in [('VPS_KEY', 'vps.key'), ('HOST_KEY', 'host.key')]:
              value = os.environ.get(env_key, '')
              if not value:
                  raise SystemExit('SSH_IDENTITY_NOT_CONFIGURED:' + env_key)
              value = value.replace('\r\n', '\n').replace('\r', '').replace('\\n', '\n')
              key_file = dest / filename
              key_file.write_text(value.rstrip() + '\n')
              key_file.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          ssh_host=''
          for attempt in 1 2 3; do
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel
              echo 'AUTHENTICATED_PINNED_VPS_CPANEL_RELAY'
              break
            fi
            echo "PINNED_RELAY_RETRY=$attempt"
          done
          if test -z "$ssh_host"; then
            if timeout 45s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/mojplaywin.com/passenger_wsgi.py' >/dev/null 2>&1; then
              ssh_host=saeit-cpanel-direct
              echo 'AUTHENTICATED_PINNED_DIRECT_FALLBACK'
            else
              echo 'NO_VERIFIED_CPANEL_CHANNEL'
              exit 1
            fi
          fi
          echo "command_host=$ssh_host" >> "$GITHUB_OUTPUT"
      - name: Confirm matching originals and PHP lint before writes
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/live-theme-publish-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/live_theme_isolated_release_20261105.py
      - name: Publish UI-only changes atomically with private backup
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 110s ssh -T -F "$RUNNER_TEMP/live-theme-publish-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/live_theme_isolated_release_20261105.py
      - name: Verify two public storefronts and guest checkout route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time
          from urllib.request import Request, urlopen
          checks = (
              ('https://zomorodmelal.ir/store/', ('class="zm-theme-nav"', 'live-theme-fix-20261105')),
              ('https://mojplaywin.com/store/', ('live-theme-fix-20261105', '/commerce/book/72/')),
          )
          for url, tokens in checks:
              for attempt in range(1, 13):
                  try:
                      req = Request(url, headers={'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache'})
                      with urlopen(req, timeout=20) as response:
                          page = response.read(250000).decode('utf-8', 'replace')
                          if response.status == 200 and all(token in page for token in tokens):
                              print('LIVE_THEME_ROUTE_VERIFIED=' + url)
                              break
                  except Exception as exc:
                      print('VERIFY_RETRY=' + url + ':' + type(exc).__name__)
                  if attempt == 12:
                      raise RuntimeError('LIVE_UI_NOT_OBSERVED:' + url)
                  time.sleep(5)
          PY
      - name: Roll back all UI changes if publication verification failed
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 100s ssh -T -F "$RUNNER_TEMP/live-theme-publish-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/live_theme_isolated_release_20261105.py
