name: Zomorod two new tools CI
on:
  pull_request:
    paths: ["content/zomorod-hourly-20261022-02/**", ".github/workflows/zomorod-hourly-two-tools-ci.yml"]
  push:
    branches: [main]
    paths: ["content/zomorod-hourly-20261022-02/**", ".github/workflows/zomorod-hourly-two-tools-ci.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          base="content/zomorod-hourly-20261022-02"
          node --check "$base/greenhouse-spacing/app.js"
          node --check "$base/feed-dm-compare/app.js"
          node "$base/test_tools.cjs"
