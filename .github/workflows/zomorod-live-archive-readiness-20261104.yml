name: Verify VPS historical SQL archive and live hosting quota read-only
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-live-archive-readiness-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-live-archive-readiness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-page-compression"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 2
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify archived database checksum and available VPS capacity without changing any files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-page-compression"
          ssh -F "$d/config" saeit-vps 'timeout 420s bash -se' <<'REMOTE'
          set -euo pipefail
          archive=/home/githubops/.db-backups/zomorod2_sites_main-pre-page-compression-20261028.sql.gz
          df -Pk /home/githubops | awk 'NR==2 {print "VPS_FREE_KB="$4}'
          if [ ! -f "$archive" ]; then echo VPS_ARCHIVE_MISSING=yes; exit 1; fi
          size=$(stat -c %s "$archive")
          echo VPS_PREVIOUS_TABLE_ARCHIVE_SIZE_BYTES="$size"
          if [ "$size" -ne 2981105692 ]; then echo VPS_ARCHIVE_SIZE_MISMATCH=yes; exit 1; fi
          echo VPS_ARCHIVE_SIZE_VERIFIED=yes
          sum=$(sha256sum "$archive" | cut -d " " -f1)
          if [ "$sum" != "9f15e25b0b7ce21dfc4588fcf15712c43add276889f44343f3c46b257f6debf39" ]; then
            echo VPS_ARCHIVE_SHA_MISMATCH=yes
            exit 1
          fi
          echo VPS_ARCHIVE_SHA_VERIFIED=yes
          if ! gzip -t "$archive"; then echo VPS_ARCHIVE_GZIP_INVALID=yes; exit 1; fi
          echo VPS_PREVIOUS_TABLE_ARCHIVE_VERIFIED=yes
          REMOTE
      - name: Read current hosting quota without editing the website or database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-page-compression"
          ssh -F "$d/config" saeit-cpanel 'uapi --output=json Quota get_quota_info' | python3 -c 'import json,sys;d=json.load(sys.stdin).get("result",{}).get("data",{});assert d,"QUOTA_QUERY_EMPTY";print("CURRENT_HOST_QUOTA="+json.dumps({k:d.get(k) for k in ("megabytes_used","megabyte_limit","megabytes_remain","under_quota_overall")},ensure_ascii=False))'
      - name: Confirm both public websites still respond
        shell: bash
        run: |
          set -euo pipefail
          for domain in zomorodmelal.ir mojplaywin.com; do
            status="$(curl --max-time 15 -sSL -o /dev/null -w '%{http_code}' "https://$domain/")"
            case "$status" in 200|301|302) echo "PUBLIC_SITE_OK=$domain:$status" ;; *) echo "PUBLIC_SITE_FAILED=$domain:$status"; exit 1;; esac
          done
