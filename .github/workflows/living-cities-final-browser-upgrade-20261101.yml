name: Living Cities release validated 20-business gameplay to Zomorod
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/living-cities-final-browser-upgrade-20261101.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: zomorod-living-cities-final-upgrade, cancel-in-progress: false}
jobs:
  guarded-game-upgrade:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check immutable encrypted artifact and scoped deployment code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/living_cities_static_upgrade.py
          test -s secure-artifacts/living-cities-final-50a4480.b64
          grep -Fq '50a44804d1b90df1bd6098ca75da2c3af6632e18' scripts/living_cities_static_upgrade.py
          grep -Fq 'original-browser-release-' scripts/living_cities_static_upgrade.py
          echo GAME_QUALITY_ASSET_PRECONDITION=PASS
      - name: Establish fingerprint-pinned GitHub-to-VPS-to-cPanel relay
        id: relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Copy AES-GCM encrypted source only to locked VPS storage
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 80s scp -q -F "$d/config" secure-artifacts/living-cities-final-50a4480.b64 vps:.private/living-cities-transport/final-50a4480.b64
          timeout 40s ssh -T -F "$d/config" vps 'chmod 600 "$HOME/.private/living-cities-transport/final-50a4480.b64"'
      - name: Authenticated decrypt and attest immutable game archive on VPS
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 80s ssh -T -F "$d/config" vps 'python3 -' <<'PY'
          from pathlib import Path
          import base64,hashlib,io,json,os,tarfile
          from cryptography.hazmat.backends import default_backend
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          sha="50a44804d1b90df1bd6098ca75da2c3af6632e18"
          root=Path.home()/".private/living-cities-transport"
          enc=root/"final-50a4480.b64"
          keyfile=root/"private.pem"
          assert enc.is_file() and not enc.is_symlink() and enc.stat().st_size<1000000
          assert keyfile.is_file() and not keyfile.is_symlink()
          env=json.loads(base64.b64decode(enc.read_bytes().strip(),validate=True))
          assert env["schema"]==1 and env["source_commit"]==sha
          assert env["algorithm"]=="RSA3072-OAEP-SHA256+A256GCM"
          priv=serialization.load_pem_private_key(keyfile.read_bytes(),password=None,backend=default_backend())
          key=priv.decrypt(base64.b64decode(env["key"]),padding.OAEP(
             mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          aad=b"living-cities-20261101:"+bytes.fromhex(sha)
          payload=AESGCM(key).decrypt(base64.b64decode(env["nonce"]),base64.b64decode(env["ciphertext"]),aad)
          assert 10000 < len(payload) < 4194304
          digest=hashlib.sha256(payload).hexdigest()
          assert digest==env["payload_sha256"]
          with tarfile.open(fileobj=io.BytesIO(payload),mode="r:gz") as tar:
              members=tar.getmembers()
              names={m.name for m in members}
              assert all(not m.name.startswith("/") and ".." not in Path(m.name).parts and
                         (m.isdir() or m.isfile()) for m in members)
              assert {"apps/living_cities/static/living_cities/progression.mjs",
                      "apps/living_cities/static/living_cities/tycoon-panel.mjs",
                      "apps/living_cities/templates/living_cities/play.html"}.issubset(names)
          target=root/("final-"+sha+".tgz")
          if target.exists():
              assert not target.is_symlink() and hashlib.sha256(target.read_bytes()).hexdigest()==digest
          else:
              temp=root/("final-"+sha+".pending")
              assert not temp.exists()
              with temp.open("xb") as f:
                  f.write(payload);f.flush();os.fsync(f.fileno())
              temp.chmod(0o600)
              temp.replace(target)
          print("LIVING_CITIES_VERIFIED_PRIVATE_BUNDLE=PASS")
          print("LIVING_CITIES_PINNED_SOURCE="+sha)
          print("LIVING_CITIES_ARCHIVE_SHA256="+digest)
          print("LIVING_CITIES_ARCHIVE_MEMBER_COUNT="+str(len(members)))
          PY
      - name: SSH-stream verified private source into isolated cPanel upgrade directory
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 45s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          test ! -L "$HOME/.private"
          test ! -L "$HOME/.private/living-cities-app"
          install -d -m 700 "$HOME/.private/living-cities-app/upgrades"
          dest="$HOME/.private/living-cities-app/upgrades/50a44804d1b90df1bd6098ca75da2c3af6632e18"
          test ! -e "$dest" && test ! -L "$dest"
          install -d -m 700 "$dest"
          REMOTE
          timeout 110s ssh -T -F "$d/config" vps 'cat "$HOME/.private/living-cities-transport/final-50a44804d1b90df1bd6098ca75da2c3af6632e18.tgz"' |
            timeout 110s ssh -T -F "$d/config" host 'umask 077; cat > "$HOME/.private/living-cities-app/upgrades/50a44804d1b90df1bd6098ca75da2c3af6632e18/source.pending"'
          timeout 40s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          dest="$HOME/.private/living-cities-app/upgrades/50a44804d1b90df1bd6098ca75da2c3af6632e18"
          test -s "$dest/source.pending" && test ! -L "$dest/source.pending"
          chmod 600 "$dest/source.pending"
          mv -T "$dest/source.pending" "$dest/source.tgz"
          echo LIVING_CITIES_ENCRYPTED_TRANSPORT_TO_CPANEL=PASS
          REMOTE
      - name: Construct new complete game in isolated unpublished docroot stage
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 65s ssh -T -F "$d/config" host 'python3 - prepare' < scripts/living_cities_static_upgrade.py
      - name: Atomically publish new game and retain the previous complete release
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 70s ssh -T -F "$d/config" host 'python3 - publish' < scripts/living_cities_static_upgrade.py
      - name: Verify real public origin HTML, all game modules and unchanged site routes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 175s ssh -T -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          ip="$(getent ahostsv4 zomorodmelal.ir | awk 'NR==1{print $1}')"
          test -n "$ip"
          for route in /living-cities/play/ /living-cities/static/living_cities/app.mjs /living-cities/static/living_cities/tycoon-panel.mjs /living-cities/static/living_cities/progression.mjs /living-cities/static/living_cities/tycoon.css /living-cities/static/living_cities/sim.mjs /living-cities/static/living_cities/render.mjs / /games/; do
            tmp="$(mktemp)"
            status=000
            for i in 1 2 3; do
              status="$(curl -ksS -4 --connect-timeout 7 --max-time 18 --resolve "zomorodmelal.ir:443:$ip" -o "$tmp" -w '%{http_code}' "https://zomorodmelal.ir$route" || true)"
              if [ "$status" = 200 ]; then break; fi
              sleep 2
            done
            echo "GAME_FINAL_LIVE=$route HTTP=$status"
            if [ "$status" != 200 ]; then rm -f "$tmp";exit 1; fi
            case "$route" in
              /living-cities/play/)
                grep -Fq 'data-lc-edition="browser"' "$tmp"
                grep -Fq 'LIVING CITIES' "$tmp"
                grep -Fq 'product-code verification' "$tmp"
                ;;
              /living-cities/static/living_cities/tycoon-panel.mjs)
                grep -Fq 'businessRoadmap' "$tmp"
                grep -Fq 'smart-upgrade' "$tmp"
                ;;
              /living-cities/static/living_cities/progression.mjs)
                grep -Fq 'GAMEPLAY_MILESTONES' "$tmp"
                ;;
            esac
            rm -f "$tmp"
          done
          echo LIVING_CITIES_PUBLIC_UPGRADE_SMOKE=PASS
          REMOTE
          timeout 40s ssh -T -F "$d/config" host 'python3 - verify' < scripts/living_cities_static_upgrade.py
      - name: Scoped automatic restore of previous game if publication smoke fails
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          if [ -f "$d/config" ]; then
            timeout 80s ssh -T -F "$d/config" host 'python3 - rollback' < scripts/living_cities_static_upgrade.py
          fi
      - name: Erase runner SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
