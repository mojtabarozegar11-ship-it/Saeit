name: Mojtaba.bot.ai one-shot independent VPS and cPanel audit

# Triggered only by the single reviewed change to this file on main.
# Separate jobs prevent a VPS outage from suppressing cPanel evidence.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mojtaba-one-shot-readonly-dispatch.yml"

permissions:
  contents: read

concurrency:
  group: mojtaba-one-shot-independent-hosts
  cancel-in-progress: false

jobs:
  cpanel-readonly:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'audit: inspect cPanel and VPS independently read-only') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify observer and pinned direct cPanel SSH, then read sanitized evidence
        shell: bash
        env:
          CPANEL_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m py_compile deploy/mojtaba_live_topology_readonly.py
          if [[ -z "${CPANEL_KEY:-}" ]]; then
            echo "MOJTABA_CPANEL_OBSERVATION=blocked_missing_existing_key"
            exit 2
          fi
          d="$RUNNER_TEMP/mojtaba-one-shot-cpanel"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$CPANEL_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          if ! timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net > "$d/known" 2>/dev/null; then
            echo "MOJTABA_CPANEL_HOST_KEY=unavailable"
            exit 3
          fi
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04" || {
            echo "MOJTABA_CPANEL_HOST_KEY=not_matching_existing_pin"
            exit 4
          }
          echo "MOJTABA_CPANEL_HOST_KEY=verified"
          if ! timeout 45s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=12 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no -p 1396 zomorod2@zohal.pws-dns.net 'if test -x "$HOME/Saeit/.venv/bin/python"; then exec "$HOME/Saeit/.venv/bin/python" - --role cpanel; elif command -v python3.11 >/dev/null 2>&1; then exec python3.11 - --role cpanel; else exit 84; fi' < deploy/mojtaba_live_topology_readonly.py > "$d/out" 2>"$d/err"; then
            echo "MOJTABA_CPANEL_OBSERVATION=ssh_or_interpreter_failed_no_host_mutation"
            exit 5
          fi
          python3 - "$d/out" <<'VERIFY'
          import json
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          if len(raw) != 1 or not raw[0].startswith("MOJTABA_LIVE_TOPOLOGY="):
              raise SystemExit("MOJTABA_CPANEL_OBSERVATION=invalid_output")
          row = json.loads(raw[0].split("=", 1)[1])
          if (row.get("schema") != "mojtaba.bot.ai.live-topology-observation.v1"
              or row.get("host_role") != "cpanel"
              or row.get("expected_user_verified") is not True
              or row.get("read_only") is not True
              or row.get("attestation", {}).get("automatic_deactivation_authorized") is not False):
              raise SystemExit("MOJTABA_CPANEL_OBSERVATION=invalid_source_contract")
          php = row["private_php_site_registry"]
          result = {
              "role": "cpanel",
              "cron_state": row["cron"]["state"],
              "cron_entries": row["cron"]["enumerated_entries"],
              "process_state": row["processes"]["state"],
              "known_process_route_indicators": row["processes"]["route_match_counts"],
              "system_service_state": row["system_services"]["state"],
              "user_service_state": row["user_services"]["state"],
              "php_registry_state": php["state"],
              "php_known_roles": php["known_roles_found"],
              "php_enabled_records_not_bots": php["enabled_count"],
              "source_files_observed_not_runtime_proof": sum(
                  x.get("state") == "file_observed_not_runtime_executed"
                  for x in row["installed_source_digests"].values()
              ),
              "live_agent_count_verified": None,
              "retirement_authorized": False,
          }
          print("MOJTABA_CPANEL_READONLY_RESULT=" + json.dumps(result, sort_keys=True))
          VERIFY

  vps-readonly:
    if: "${{ github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'audit: inspect cPanel and VPS independently read-only') }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify VPS pinned SSH separately, then read sanitized evidence
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m py_compile deploy/mojtaba_live_topology_readonly.py
          if [[ -z "${VPS_KEY:-}" ]]; then
            echo "MOJTABA_VPS_OBSERVATION=blocked_missing_existing_key"
            exit 2
          fi
          d="$RUNNER_TEMP/mojtaba-one-shot-vps"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          if ! timeout 12s ssh-keyscan -T 8 -p 22 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null; then
            echo "MOJTABA_VPS_HOST_KEY=unavailable"
            exit 3
          fi
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs" || {
            echo "MOJTABA_VPS_HOST_KEY=not_matching_existing_pin"
            exit 4
          }
          echo "MOJTABA_VPS_HOST_KEY=verified"
          if ! timeout 55s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=20 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no -p 22 githubops@178.239.147.150 'if command -v python3.11 >/dev/null 2>&1; then exec python3.11 - --role vps; elif test -x "$HOME/factory-runtime/django-app/.venv/bin/python"; then exec "$HOME/factory-runtime/django-app/.venv/bin/python" - --role vps; else exit 84; fi' < deploy/mojtaba_live_topology_readonly.py > "$d/out" 2>"$d/err"; then
            echo "MOJTABA_VPS_OBSERVATION=ssh_or_interpreter_failed_no_host_mutation"
            exit 5
          fi
          python3 - "$d/out" <<'VERIFY'
          import json
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          if len(raw) != 1 or not raw[0].startswith("MOJTABA_LIVE_TOPOLOGY="):
              raise SystemExit("MOJTABA_VPS_OBSERVATION=invalid_output")
          row = json.loads(raw[0].split("=", 1)[1])
          if (row.get("schema") != "mojtaba.bot.ai.live-topology-observation.v1"
              or row.get("host_role") != "vps"
              or row.get("expected_user_verified") is not True
              or row.get("read_only") is not True
              or row.get("attestation", {}).get("automatic_deactivation_authorized") is not False):
              raise SystemExit("MOJTABA_VPS_OBSERVATION=invalid_source_contract")
          result = {
              "role": "vps",
              "cron_state": row["cron"]["state"],
              "cron_entries": row["cron"]["enumerated_entries"],
              "process_state": row["processes"]["state"],
              "known_process_route_indicators": row["processes"]["route_match_counts"],
              "system_service_state": row["system_services"]["state"],
              "user_service_state": row["user_services"]["state"],
              "source_files_observed_not_runtime_proof": sum(
                  x.get("state") == "file_observed_not_runtime_executed"
                  for x in row["installed_source_digests"].values()
              ),
              "live_agent_count_verified": None,
              "retirement_authorized": False,
          }
          print("MOJTABA_VPS_READONLY_RESULT=" + json.dumps(result, sort_keys=True))
          VERIFY
