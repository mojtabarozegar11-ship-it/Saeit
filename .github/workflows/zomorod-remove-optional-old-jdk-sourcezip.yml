name: Remove optional Java source ZIP only from old temp JDK
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-remove-optional-old-jdk-sourcezip.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-optional-java-source-clean
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Prune only optional src.zip from old inactive cached JDK without affecting compiler/runtime
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,time,stat
          from pathlib import Path
          H=Path.home()
          assert H==Path("/home/zomorod2")
          jdk=H/".cagefs/tmp/jdk-17.0.20.1+1"
          source=jdk/"lib/src.zip"
          assert jdk.is_dir() and not jdk.is_symlink()
          assert source.is_file() and not source.is_symlink()
          assert 50_000_000<source.stat().st_size<53_000_000
          assert time.time()-source.stat().st_mtime>25*86400
          assert (jdk/"lib/modules").is_file() and (jdk/"bin/java").is_file()
          assert (H/"Saeit/manage.py").is_file()
          ps=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=12)
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=12)
          assert str(jdk) not in ps.stdout and str(jdk) not in cron.stdout
          before=source.stat().st_size
          source.unlink()
          assert not source.exists() and (jdk/"lib/modules").is_file() and (jdk/"bin/java").is_file()
          print("ONLY_OPTIONAL_JDK_SOURCE_ARCHIVE_REMOVED=yes")
          print("OPTIONAL_SOURCE_BYTES_FREED="+str(before))
          print("JAVA_EXECUTABLE_COMPILER_AND_DJANGO_PRESERVED=yes")
          PY
          REMOTE
      - name: Verify protected sites
        shell: bash
        run: |
          set -euo pipefail
          for u in "https://zomorodmelal.ir/" "https://zomorodmelal.ir/agents/" "https://mojplaywin.com/"; do
            c="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$u" || true)"
            echo "JAVA_SOURCE_PRUNE_SITE=$u:$c"
            test "$c" = 200
          done
      - name: Clear temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
