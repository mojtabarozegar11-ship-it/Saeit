name: Verify cPanel disk usage after V91 package and duplicate cleanup
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-final-space-verify-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-final-space-verify
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Final actual usage, core file protection and cPanel quota read-only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          test "$HOME" = /home/zomorod2
          for p in "$HOME/Saeit/manage.py" "$HOME/Saeit/agent_imports/v91_genomes/generation64_dependency_manifest.json" "$HOME/Saeit/backups/communication-core-20261005-051054" "$HOME/Saeit/backups/zomorodmelal-live-theme-20261011T015315Z.zip" "$HOME/Saeit/backups/zomorodmelal-current-original-theme-20261011.zip" "$HOME/saeit_v91" "$HOME/Saeit-staging/mojplaywin.sqlite3"; do
             test -e "$p" && test ! -L "$p"
          done
          echo "CRITICAL_PRESERVATION=passed"
          for p in "$HOME" "$HOME/saeit_v91" "$HOME/Saeit" "$HOME/Saeit-staging" "$HOME/.backups" "$HOME/Saeit-staging/zomorod_json_admin_stage/backups"; do
             du -sk -- "$p" | awk -F '\t' '{print "FINAL_DU_KB=" $1 " PATH=" $2}'
          done
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=json Quota get_quota_info 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin).get("result",{}).get("data",{});print("QUOTA_REPORTED_MB_USED="+str(d.get("megabytes_used")));print("QUOTA_LIMIT_MB="+str(d.get("megabyte_limit")));print("QUOTA_REMAIN_MB="+str(d.get("megabytes_remain")))' || true
          fi
          echo FINAL_DISK_INSPECTION=done
          echo RECHECK_AFTER_V91_ZIP_REMOVAL=yes
          REMOTE
      - name: Public health check
        shell: bash
        run: |
          for path in / /agents/ /admin/login/; do
            code="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "FINAL_PUBLIC_HEALTH=$path:$code"
          done
      - name: Remove temporary access credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
