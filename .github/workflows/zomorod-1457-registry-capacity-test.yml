name: Zomorod 1457 evidence gated registry capacity test
on:
  push:
    branches: [zomorod/research-evidence-inventory-20261024]
    paths:
      - "scripts/zomorod_research_registry_updater_20261023.py"
      - ".github/workflows/zomorod-1457-registry-capacity-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate 1457 unique controlled project records without publishing
        run: python3 -B scripts/zomorod_research_registry_updater_20261023.py selftest
