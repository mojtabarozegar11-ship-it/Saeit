name: Restore Zomorod Django runtime dependencies safely
on:
  push:
    branches:
      - codex/zomorod-runtime-repair-20261016
    paths:
      - ".github/workflows/zomorod-runtime-repair-20261016.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-runtime-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-runtime"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Build, test, and safely activate a complete root-app release
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-runtime"
          ssh -F "$d/config" saeit-cpanel bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          home=/home/zomorod2
          app="$home/Saeit"
          py="$home/virtualenv/Saeit/3.10/bin/python"
          backup="$home/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b"
          stage="$home/.backups/zomorodmelal-complete/source-preflight-47c38ec3810326790f6f954b515b4f11d59042d1"
          packages="$home/.backups/zomorodmelal-complete/packages-preflight-47c38ec3810326790f6f954b515b4f11d59042d1"
          source_db="$app/backups/pre_phase19_cleanup_20261004-124041/db.sqlite3"
          proven_db="$home/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b/compatibility-test-pre-phase19-v2-20261016/db.sqlite3"
          release="$backup/release-candidate-$sha"
          old="$backup/previous-app-$sha"
          failed="$backup/failed-app-$sha"
          baseline="$backup/$sha-packages.json"
          smoke_file="$home/.zomorod-release-smoke-$sha.html"
          changed=no
          active_new=no
          test -d "$app" && test -f "$app/manage.py" && test -x "$py"
          test -f "$stage/manage.py" && test -d "$packages"
          test -f "$app/.env" && test -s "$source_db" && test -s "$proven_db"
          test ! -e "$app/db.sqlite3"
          test ! -e "$release" && test ! -e "$old" && test ! -e "$failed" && test ! -e "$baseline"
          if grep -q '^[[:space:]]*DATABASE_URL=' "$app/.env"; then
            echo "RELEASE_ABORTED=unexpected_DATABASE_URL_in_live_environment"
            exit 1
          fi
          cmp -s "$source_db" "$proven_db"
          echo "PINNED_SOURCE_COMMIT=47c38ec3810326790f6f954b515b4f11d59042d1"
          echo "LIVE_DATABASE_TARGET=db.sqlite3_absent"
          echo "RECOVERY_DATABASE=verified_copy_of_named_pre_cleanup_snapshot"
          "$py" - "$baseline" <<'PY'
          import importlib.metadata,json,sys
          packages={}
          for dist in importlib.metadata.distributions():
              name=dist.metadata.get("Name")
              if name: packages[name.lower().replace("_","-")]=dist.version
          with open(sys.argv[1],"x",encoding="utf-8") as f: json.dump(packages,f,sort_keys=True)
          print("LIVE_PACKAGE_BASELINE_COUNT="+str(len(packages)))
          PY
          chmod 600 "$baseline"
          rollback() {
            status=$?
            rm -f -- "$smoke_file"
            if [ "$status" -ne 0 ]; then
              echo "RELEASE_RESULT=failed_rollback_started"
              if [ -d "$old" ] && [ ! -e "$app" ]; then
                mv -T "$old" "$app"
                active_new=no
                echo "SOURCE_ROLLBACK=previous_app_restored"
              elif [ "$active_new" = yes ] && [ -d "$old" ] && [ -d "$app" ]; then
                test ! -e "$failed"
                mv -T "$app" "$failed"
                mv -T "$old" "$app"
                active_new=no
                echo "SOURCE_ROLLBACK=previous_app_restored"
              fi
              if [ "$changed" = yes ]; then
                "$py" - "$baseline" <<'PY'
          import importlib.metadata,json,subprocess,sys
          before=json.load(open(sys.argv[1],encoding="utf-8"))
          current={}
          for dist in importlib.metadata.distributions():
              name=dist.metadata.get("Name")
              if name: current[name.lower().replace("_","-")]=dist.version
          added=sorted(name for name in current if name not in before)
          if added: subprocess.run([sys.executable,"-m","pip","uninstall","-y",*added],check=False)
          restore=[f"{name}=={version}" for name,version in sorted(before.items()) if current.get(name)!=version]
          if restore: subprocess.run([sys.executable,"-m","pip","install","--disable-pip-version-check","--no-input","--no-deps","--force-reinstall",*restore],check=False)
          print("DEPENDENCY_ROLLBACK=completed")
          PY
              fi
              if [ -d "$app" ]; then mkdir -p "$app/tmp"; touch "$app/tmp/restart.txt"; fi
            fi
            exit "$status"
          }
          trap rollback EXIT
          selector="$(command -v cloudlinux-selector || true)"
          if [ -z "$selector" ] && [ -x /usr/sbin/cloudlinux-selector ]; then selector=/usr/sbin/cloudlinux-selector; fi
          test -x "$selector"
          "$selector" install-modules --json --interpreter python --user "$USER" --app-root Saeit --modules django-environ,djangorestframework,whitenoise,psycopg,psycopg-binary,openai
          changed=yes
          "$py" -m pip check
          "$py" -c 'import django,environ,rest_framework,whitenoise,PIL,psycopg,openai; print("REQUIRED_IMPORTS=passed"); print("DJANGO_VERSION="+django.get_version())'
          install -d -m 700 "$release"
          tar -C "$stage" --exclude=./db.sqlite3 --exclude=./.env --exclude=./media --exclude=./var --exclude=./tmp --exclude=./logs --exclude=./backups --exclude=./.git -cf - . | tar -xf - -C "$release"
          cp -p "$app/.env" "$release/.env"
          chmod 600 "$release/.env"
          cp -p "$source_db" "$release/db.sqlite3"
          chmod 600 "$release/db.sqlite3"
          for directory in media var backups logs; do
            if [ -d "$app/$directory" ] && [ ! -e "$release/$directory" ]; then
              ln -s "$old/$directory" "$release/$directory"
            fi
          done
          mkdir -p "$release/tmp"
          "$py" - "$release/db.sqlite3" <<'PY'
          import sqlite3,sys
          con=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True)
          quick=con.execute("pragma quick_check").fetchone()[0]
          rows=con.execute("select count(*) from django_migrations").fetchone()[0]
          def count(name):
              try: return con.execute('select count(*) from "'+name+'"').fetchone()[0]
              except sqlite3.Error: return -1
          print("RELEASE_DB_QUICK_CHECK="+quick)
          print("RELEASE_DB_MIGRATION_ROWS="+str(rows))
          print("RELEASE_DB_BLOG_ARTICLES="+str(count("core_blogarticle")))
          print("RELEASE_DB_BLOG_PAGES="+str(count("core_blogpage")))
          print("RELEASE_DB_AGENTS="+str(count("core_agent")))
          article_count=count("core_blogarticle")
          con.close()
          if quick!="ok" or article_count<1: raise SystemExit("release_database_not_usable")
          PY
          cd "$release"
          export DJANGO_SETTINGS_MODULE=config.settings
          "$py" manage.py check
          plan="$("$py" manage.py migrate --plan 2>&1)"
          printf '%s\n' "$plan" | awk 'NF { print "RELEASE_MIGRATION_PLAN=" $0; n++; if(n==8) exit }'
          "$py" manage.py collectstatic --noinput
          "$py" - <<'PY'
          import django
          django.setup()
          from django.test import Client
          client=Client(HTTP_HOST="zomorodmelal.ir")
          paths=["/","/industry/","/agriculture/","/agents/","/api/health/","/api/bridge/health/","/admin/login/","/agriculture/livestock/","/blog/"]
          failed=[]
          for path in paths:
              response=client.get(path,secure=True)
              print(f"RELEASE_ROUTE_{path.replace('/','_')}_STATUS={response.status_code}")
              if response.status_code!=200: failed.append(path)
          if failed: raise SystemExit("RELEASE_ROUTE_PREFLIGHT_FAILED="+",".join(failed))
          PY
          echo "ISOLATED_RELEASE_PREFLIGHT=passed"
          cd "$home"
          mv -T "$app" "$old"
          if ! mv -T "$release" "$app"; then
            mv -T "$old" "$app"
            echo "SOURCE_SWITCH=failed_previous_restored"
            exit 1
          fi
          active_new=yes
          touch "$app/tmp/restart.txt"
          "$selector" restart --json --interpreter python --user "$USER" --app-root Saeit
          echo "CLOUDLINUX_SELECTOR_RESTART=issued"
          sleep 4
          selector_check="$home/.zomorod-selector-check-$sha.json"
          "$selector" run-script --json --interpreter python --user "$USER" --app-root Saeit --script-name manage.py -- check > "$selector_check"
          "$py" - "$selector_check" <<'PY'
          import base64,json,sys
          result=json.load(open(sys.argv[1],encoding="utf-8"))
          try: output=base64.b64decode(result.get("data","")).decode("utf-8","replace")
          except Exception: output=""
          ok=result.get("result")=="success" and "system check identified no issues" in output.lower()
          print("CLOUDLINUX_SELECTOR_SYSTEM_CHECK="+("passed" if ok else "failed"))
          if not ok: raise SystemExit(1)
          PY
          rm -f -- "$selector_check"
          failures=0
          for path in / /industry/ /agriculture/ /agents/ /api/health/ /api/bridge/health/ /admin/login/ /amozeshgah/ /mohammad/ /ghanadi/ /agriculture/livestock/ /blog/; do
            code="$(curl --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 --max-redirs 5 --connect-timeout 10 --max-time 30 -o "$smoke_file" -w '%{http_code}' -H 'Cache-Control: no-cache' "https://zomorodmelal.ir$path?release_check=$sha" || true)"
            echo "LIVE_RELEASE_ROUTE=$path HTTP=$code"
            if [ "$code" != 200 ]; then failures=$((failures+1)); fi
          done
          for image in agriculture.webp platform-home.webp research.webp; do
            code="$(curl --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 --max-time 30 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/static/site/heroes/$image?release_check=$sha" || true)"
            echo "LIVE_RELEASE_IMAGE=$image HTTP=$code"
            if [ "$code" != 200 ]; then failures=$((failures+1)); fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "LIVE_RELEASE_FAILURES=$failures"
            if [ -f "$app/stderr.log" ]; then
              echo "LIVE_PASSENGER_ERROR_TAIL_BEGIN"
              tail -n 80 "$app/stderr.log" | python3 -c 'import sys; keys=("Traceback","Error:","Exception","No module named","ImportError","RuntimeError"); [print(line.rstrip()[:500]) for line in sys.stdin if any(k in line for k in keys)]'
              echo "LIVE_PASSENGER_ERROR_TAIL_END"
            fi
            exit 1
          fi
          "$py" - "$app/db.sqlite3" <<'PY'
          import sqlite3,sys
          con=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True)
          quick=con.execute("pragma quick_check").fetchone()[0]
          migrations=con.execute("select count(*) from django_migrations").fetchone()[0]
          articles=con.execute("select count(*) from core_blogarticle").fetchone()[0]
          pages=con.execute("select count(*) from core_blogpage").fetchone()[0]
          agents=con.execute("select count(*) from core_agent").fetchone()[0]
          print(f"LIVE_RELEASE_DB_QUICK_CHECK={quick}")
          print(f"LIVE_RELEASE_DB_MIGRATIONS={migrations}")
          print(f"LIVE_RELEASE_DB_BLOG_ARTICLES={articles}")
          print(f"LIVE_RELEASE_DB_BLOG_PAGES={pages}")
          print(f"LIVE_RELEASE_DB_AGENTS={agents}")
          con.close()
          if quick!="ok" or migrations!=113 or articles!=25139 or pages!=50 or agents!=45:
              raise SystemExit("live_database_content_guard_failed")
          PY
          echo "LIVE_RELEASE_VALIDATION=passed"
          echo "PREVIOUS_APP_BACKUP=$old"
          echo "RUNTIME_REPAIR_LIVE_SMOKE=passed"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-runtime"
