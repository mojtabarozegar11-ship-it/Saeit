name: MojPlayWin stage 6 register disabled commerce and isolated migrations
on:
  push:
    branches: [qa/mpw-payment-release-preflight-20261015]
    paths: ['.github/workflows/mojplaywin-stage6-register-disabled-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-stage6-guarded-commerce-schema
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Audit deployed sitewide commerce readiness via verified VPS relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-root-audit"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              f=Path(filename)
              f.write_text(f.read_text().replace("\r\n","\n").strip().replace("\\n","\n")+"\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 100s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          export PYTHONDONTWRITEBYTECODE=1
          cd /home/zomorod2/Saeit-staging
          /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - <<'PY'
          import os
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection
          from django.db.migrations.recorder import MigrationRecorder
          from django.urls import get_resolver
          from core.models import Product,Order
          home=Path("/home/zomorod2")
          live=home/"Saeit-staging"
          domain=home/"mojplaywin.com"
          wsgi=domain/"passenger_wsgi.py"
          source=wsgi.read_text(errors="replace") if wsgi.is_file() else ""
          print("MPW_DOMAIN_PASSENGER_TO_EXPECTED_CODEBASE",str(str(live) in source).lower())
          print("MPW_DOMAIN_FOLDER_EXISTS",str(domain.is_dir()).lower())
          print("MPW_ACTIVE_DJANGO_DB_VENDOR",connection.vendor)
          print("MPW_LIVE_ALLOWED_HOST",str(
              "mojplaywin.com" in settings.ALLOWED_HOSTS or
              ".mojplaywin.com" in settings.ALLOWED_HOSTS or
              "*" in settings.ALLOWED_HOSTS
          ).lower())
          print("MPW_COMMERCE_PACKAGE_IN_LIVE_CODEBASE",str(
              (live/"mpw_commerce"/"models.py").is_file()
          ).lower())
          print("MPW_COMMERCE_APP_INSTALLED",str(
              "mpw_commerce" in settings.INSTALLED_APPS
          ).lower())
          migration=MigrationRecorder(connection).applied_migrations()
          print("MPW_COMMERCE_DB_MIGRATION_0001",str(
              ("mpw_commerce","0001_initial") in migration
          ).lower())
          print("MPW_COMMERCE_DB_MIGRATION_0002",str(
              ("mpw_commerce","0002_buyerwalletchallenge") in migration
          ).lower())
          # Resolve the actual route instead of searching for text/comments
          # in the URLconf (which can produce misleading true positives).
          from django.urls import NoReverseMatch, reverse
          try:
              reverse("mpw_commerce:invoice")
          except NoReverseMatch:
              invoice_route_exists = False
          else:
              invoice_route_exists = True
          print("MPW_COMMERCE_INVOICE_ROUTE_RESOLVABLE",str(invoice_route_exists).lower())
          for key in (
              "MPW_COMMERCE_RELEASE_READY","MPW_COMMERCE_INVOICING_ENABLED",
              "MPW_COMMERCE_SETTLEMENT_ENABLED","MPW_COMMERCE_REAL_RPC_ENABLED",
              "MPW_COMMERCE_AUTORECONCILE_ENABLED",
              "MPW_COMMERCE_BUYER_SIGNATURE_ENABLED",
              "MPW_COMMERCE_CUSTOMER_HTTP_ENABLED",
              "MPW_COMMERCE_DOWNLOADS_ENABLED",
              "MPW_COMMERCE_COURSE_AUTO_ENROLL_ENABLED",
          ):
              print("MPW_LIVE_FEATURE",key,str(
                  getattr(settings,key,False) is True
              ).lower())
          eligible=0
          for product in Product.objects.filter(active=True).only(
              "id","metadata","currency","price"
          ).order_by("id")[:500]:
              policy=(product.metadata or {}).get("mpw_commerce") if isinstance(product.metadata,dict) else None
              if isinstance(policy,dict) and policy.get("enabled") is True:
                  eligible+=1
          print("MPW_PRODUCTS_ENABLED_FOR_COMMERCE_FIRST_500",eligible)
          print("MPW_PRODUCT72_ACTIVE",str(
              Product.objects.filter(id=72,active=True).exists()
          ).lower())
          print("MPW_ORDERS_PENDING",Order.objects.filter(status="pending").count())
          print("MPW_DB_BACKUP_TOOL_READY",str(
              __import__("shutil").which("mysqldump") is not None or
              __import__("shutil").which("mariadb-dump") is not None
          ).lower())
          print("MPW_PRIVATE_BOOK_PRESENT",str(
              (home/"MojPlayWin_Private_Assets"/"chess-improvement-2026"/
               "MojPlayWin_Science_and_Practice_of_Chess_Improvement.pdf").is_file()
          ).lower())
          # Aggregated counts only; no customer records, PII or credentials.
          from core.models import PaymentIntent
          print("MPW_LIVE_ALL_PRODUCTS",Product.objects.count())
          print("MPW_LIVE_ACTIVE_PRODUCTS",Product.objects.filter(active=True).count())
          print("MPW_LIVE_PRICED_PRODUCTS",Product.objects.filter(price__gt=0).count())
          from collections import Counter
          print("MPW_LIVE_PRODUCT_TYPE_BREAKDOWN",sorted(Counter(
              Product.objects.values_list("product_type",flat=True)
          ).items()))
          approved_count=0
          for m in Product.objects.values_list("metadata",flat=True):
              if isinstance(m,dict) and m.get("factory_publication_permission") is True:
                  approved_count+=1
          print("MPW_LIVE_FACTORY_PUBLICATION_PERMISSION_COUNT",approved_count)
          print("MPW_LIVE_ALL_ORDERS",Order.objects.count())
          print("MPW_LIVE_ALL_PAYMENT_INTENTS",PaymentIntent.objects.count())
          print("MPW_LIVE_PAYMENT_INTENTS_PAID",PaymentIntent.objects.filter(status="paid").count())
          print("MPW_COMMERCE_RELEASE_NOT_YET_DEPLOYED="+str(
              "mpw_commerce" not in settings.INSTALLED_APPS
          ).lower())
          assert (live/"mpw_commerce"/"models.py").is_file(), "Installed source missing"
          assert "mpw_commerce" not in settings.INSTALLED_APPS, "Unexpected app activation"
          assert ("mpw_commerce","0001_initial") not in migration
          assert ("mpw_commerce","0002_buyerwalletchallenge") not in migration
          assert invoice_route_exists is False, "Unexpected public invoice route"
          assert Product.objects.filter(active=True).count()==0, "Catalog unexpectedly published"
          for key in (
              "MPW_COMMERCE_RELEASE_READY",
              "MPW_COMMERCE_SETTLEMENT_ENABLED",
              "MPW_COMMERCE_REAL_RPC_ENABLED",
              "MPW_COMMERCE_CUSTOMER_HTTP_ENABLED",
          ):
              assert getattr(settings,key,False) is not True, key
          print("MPW_STAGE4_AFTER_INSTALL_INVARIANTS_GREEN=True")
          print("MPW_STAGE6_PRE_DEPLOY_INVARIANTS_GREEN=True")
          PY
          # Append-only settings change; exact original source retained in
          # the private checkpoint. All commerce operations remain OFF.
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile, datetime
          from pathlib import Path
          home=Path.home()
          site=home/"Saeit-staging"
          target=site/"config"/"settings.py"
          backups=sorted((home/".mpw-private-db-backups").glob("*/manifest.json"),
                         key=lambda p:p.stat().st_mtime,reverse=True)
          assert backups
          manifest=json.loads(backups[0].read_text())
          age=(datetime.datetime.now(datetime.timezone.utc)-
               datetime.datetime.fromisoformat(manifest["timestamp_utc"])).total_seconds()
          assert 0<=age<3600, "Require recent checkpoint"
          recorded=manifest["code_rollback_checksums"]["config/settings.py"]
          rollback=backups[0].parent/"source-rollback"/"config/settings.py"
          assert rollback.is_file() and not rollback.is_symlink()
          original=target.read_bytes()
          assert hashlib.sha256(original).hexdigest()==recorded
          assert hashlib.sha256(rollback.read_bytes()).hexdigest()==recorded
          package=site/"mpw_commerce"
          assert (package/".mpw_inert_release_marker").is_file()
          assert (package/".mpw_inert_release_marker").read_text().strip()=="MPW-STAGE4-20261015"
          marker=b"# MPW_STAGE6_DISABLED_COMMERCE_BEGIN"
          assert marker not in original
          appended=b"""
          # MPW_STAGE6_DISABLED_COMMERCE_BEGIN
          if "mpw_commerce" not in INSTALLED_APPS:
              INSTALLED_APPS = list(INSTALLED_APPS) + ["mpw_commerce"]
          MPW_COMMERCE_RELEASE_READY = False
          MPW_COMMERCE_INVOICING_ENABLED = False
          MPW_COMMERCE_SETTLEMENT_ENABLED = False
          MPW_COMMERCE_REAL_RPC_ENABLED = False
          MPW_COMMERCE_AUTORECONCILE_ENABLED = False
          MPW_COMMERCE_BUYER_SIGNATURE_ENABLED = False
          MPW_COMMERCE_CUSTOMER_HTTP_ENABLED = False
          MPW_COMMERCE_DOWNLOADS_ENABLED = False
          MPW_COMMERCE_COURSE_AUTO_ENROLL_ENABLED = False
          # MPW_STAGE6_DISABLED_COMMERCE_END
          """
          candidate=original+appended
          compile(candidate.decode("utf-8"),str(target),"exec")
          def atomic_write(data):
              fd,name=tempfile.mkstemp(prefix=".mpw-settings-",dir=str(target.parent))
              try:
                  with os.fdopen(fd,"wb") as f:
                      f.write(data);f.flush();os.fsync(f.fileno())
                  os.chmod(name,target.stat().st_mode & 0o777)
                  os.replace(name,target)
              finally:
                  if os.path.exists(name): os.unlink(name)
          atomic_write(candidate)
          runner=site/".."/"virtualenv"/"Saeit-staging"/"3.11"/"bin"/"python"
          runner=home/"virtualenv/Saeit-staging/3.11/bin/python"
          script=r"""
          import django
          django.setup()
          from django.conf import settings
          from django.core.management import call_command
          from django.db import connection
          from django.db.migrations.executor import MigrationExecutor
          from django.db.migrations.recorder import MigrationRecorder
          from django.urls import reverse, NoReverseMatch
          assert connection.vendor=="mysql"
          assert "mpw_commerce" in settings.INSTALLED_APPS
          for key in (
              "MPW_COMMERCE_RELEASE_READY","MPW_COMMERCE_INVOICING_ENABLED",
              "MPW_COMMERCE_SETTLEMENT_ENABLED","MPW_COMMERCE_REAL_RPC_ENABLED",
              "MPW_COMMERCE_AUTORECONCILE_ENABLED","MPW_COMMERCE_BUYER_SIGNATURE_ENABLED",
              "MPW_COMMERCE_CUSTOMER_HTTP_ENABLED","MPW_COMMERCE_DOWNLOADS_ENABLED",
              "MPW_COMMERCE_COURSE_AUTO_ENROLL_ENABLED",
          ):
              assert getattr(settings,key,None) is False,key
          try:
              reverse("mpw_commerce:invoice")
          except NoReverseMatch: pass
          else: raise RuntimeError("Never activate buyer URLs in stage 6")
          target=("mpw_commerce","0002_buyerwalletchallenge")
          migration_plan=MigrationExecutor(connection).migration_plan([target])
          assert len(migration_plan)==2
          assert all(x.app_label=="mpw_commerce" and not backwards for x,backwards in migration_plan)
          call_command("check",verbosity=0)
          call_command("migrate","mpw_commerce",verbosity=0,interactive=False)
          rows=MigrationRecorder(connection).applied_migrations()
          assert target in rows and ("mpw_commerce","0001_initial") in rows
          names=set(connection.introspection.table_names())
          expected={"mpw_commerce_commerceinvoice","mpw_commerce_commercereceipt",
                    "mpw_commerce_commercefulfillment","mpw_commerce_buyerwalletchallenge"}
          assert expected <= names
          from core.models import Product,Order,PaymentIntent
          print("MPW_STAGE6_PRODUCTS",Product.objects.count())
          print("MPW_STAGE6_ORDERS",Order.objects.count())
          print("MPW_STAGE6_PAYMENT_INTENTS",PaymentIntent.objects.count())
          print("MPW_STAGE6_DJANGO_REGISTERED=True")
          print("MPW_STAGE6_ONLY_TWO_APP_MIGRATIONS_APPLIED=True")
          print("MPW_STAGE6_FOUR_EMPTY_COMMERCE_TABLES_READY=True")
          print("MPW_STAGE6_FLAGS_DISABLED_AND_PUBLIC_ROUTES_ABSENT=True")
          """
          try:
              import os
              env=os.environ.copy()
              env["DJANGO_SETTINGS_MODULE"]="config.settings"
              env["PYTHONDONTWRITEBYTECODE"]="1"
              check=subprocess.run([str(runner),"-c",script],cwd=site,env=env,
                                   capture_output=True,text=True,timeout=110)
              if check.returncode!=0:
                  raise RuntimeError("Commerce migration preflight/verification failed")
              for line in check.stdout.splitlines():
                  if line.startswith("MPW_STAGE6_"): print(line)
          except Exception:
              # Return the exact prior settings file; leave any new inert DB
              # tables untouched rather than risk deleting unrelated records.
              if target.exists() and target.read_bytes()==candidate:
                  atomic_write(original)
                  print("MPW_STAGE6_SETTINGS_ROLLBACK_EXECUTED=True")
              raise
          print("MPW_STAGE6_ORIGINAL_SETTINGS_PREFIX_PRESERVED=True")
          PY
          REMOTE
      - name: Check site status from outside after disabled schema registration
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-root-audit"
          h="$(curl -L -sS --max-time 15 -o /dev/null -w '%{http_code}' https://mojplaywin.com/ || true)"
          s="$(curl -L -sS --max-time 15 -o /dev/null -w '%{http_code}' https://mojplaywin.com/store/ || true)"
          c="$(curl -L -sS --max-time 15 -o /dev/null -w '%{http_code}' https://mojplaywin.com/checkout/ || true)"
          echo "MPW_STAGE6_HOME_HTTP=$h"
          echo "MPW_STAGE6_STORE_HTTP=$s"
          echo "MPW_STAGE6_CHECKOUT_HTTP=$c"
          if [ "$h" != 200 ] || [ "$s" != 200 ] || [ "$c" != 404 ]; then
            echo MPW_STAGE6_HTTP_SMOKE_FAILED_REVERT_SETTINGS
            timeout 55s ssh -F "$d/config" host 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib,json,os,tempfile
          root=Path.home()/".mpw-private-db-backups"
          b=sorted(root.glob("*/manifest.json"),key=lambda p:p.stat().st_mtime,reverse=True)
          if b:
              info=json.loads(b[0].read_text())
              orig=b[0].parent/"source-rollback"/"config/settings.py"
              target=Path.home()/"Saeit-staging/config/settings.py"
              raw=target.read_bytes()
              if b"# MPW_STAGE6_DISABLED_COMMERCE_BEGIN" in raw and orig.is_file():
                  base=orig.read_bytes()
                  assert hashlib.sha256(base).hexdigest()==info["code_rollback_checksums"]["config/settings.py"]
                  assert raw.startswith(base)
                  fd,name=tempfile.mkstemp(prefix=".mpw-restore-",dir=str(target.parent))
                  with os.fdopen(fd,"wb") as f:
                      f.write(base);f.flush();os.fsync(f.fileno())
                  os.chmod(name,target.stat().st_mode & 0o777)
                  os.replace(name,target)
                  print("MPW_STAGE6_SETTINGS_ONLY_ROLLBACK=True")
          PY
            exit 1
          fi
          echo MPW_STAGE6_PUBLIC_SITE_HEALTH_GREEN=True
          echo MPW_STAGE6_CHECKOUT_NOT_ACTIVATED=True
      - name: Remove transient keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-root-audit"
