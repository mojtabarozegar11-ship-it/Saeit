name: MPW private TRX Mainnet canary isolated acceptance
on:
  push:
    branches: [fix/mpw-trx-private-mainnet-canary-20261023]
    paths:
      - .github/workflows/mpw-trx-private-mainnet-canary-20261023.yml
      - scripts/mpw_trx_private_canary_20261023.py
      - tests/test_mpw_trx_private_canary_20261023.py
      - tests/test_mpw_trx_commercial_real_mariadb_e2e.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  safety-and-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile private canary and run no-Django release safety tests
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/mpw_trx_private_canary_20261023.py tests/test_mpw_trx_private_canary_20261023.py
          python3 -B -m unittest tests.test_mpw_trx_private_canary_20261023 -v
          echo 'PRIVATE_MAINNET_CANARY_PUBLIC_GATES_STAY_CLOSED=PASS'
  mainnet-canary-isolated-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: test_walletless_ci
          MARIADB_USER: walletless
          MARIADB_PASSWORD: local-only-no-money
          MARIADB_ROOT_PASSWORD: local-root-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install synthetic MariaDB verification dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Django>=5.2,<6' 'mysqlclient>=2.2,<3' 'PyMySQL==1.1.2' 'segno==1.6.6'
      - name: Prove private canary invoice is paid and files remain buyer-only
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_mpw_trx_commercial_real_mariadb_e2e -v
          echo 'PRIVATE_CANARY_SYNTHETIC_CHAIN_MARIADB=PASS; MAINNET_BROADCASTS=0'

  live-mainnet-readonly-preflight:
    needs: [safety-and-receipts, mainnet-canary-isolated-mariadb]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Authenticate pinned GitHub-to-VPS-to-cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-gateway-contract-ssh"
          install -d -m 700 "$d"
          test -n "$VPS_KEY"
          test -n "$HOST_KEY"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host saeit-vps\n HostName 178.239.147.150\n User githubops\n Port 22\n IdentityFile %s/vps.key\n UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n HostName zohal.pws-dns.net\n User zomorod2\n Port 1396\n IdentityFile %s/host.key\n UserKnownHostsFile %s/host.known\n ProxyJump saeit-vps\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 15\n ConnectionAttempts 3\n ForwardAgent no\n RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          timeout 50s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Check both actual TRON solidified heads on cPanel without funds or DB writes
        run: |
          set -euo pipefail
          timeout 125s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preflight' < scripts/mpw_trx_private_canary_20261023.py
      - name: Inventory real low-value digital SKU and merchant staff accounts without writes
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/mpw-gateway-contract-ssh/config" saeit-cpanel '/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - inventory' < scripts/mpw_trx_private_canary_20261023.py
      - name: Cleanup relay key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-gateway-contract-ssh"
