name: Transfer Isolated Factory Source to VPS
on:
  push:
    branches: [chore/ssh-vps-relay-20261009]
    paths: [.github/workflows/transfer-isolated-factory-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          d="$RUNNER_TEMP/factory-relay"; mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          printf '%s\n' "$HOST_KNOWN" > "$d/host.known"
          chmod 600 "$d/"*
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -F "$d/config" saeit-vps 'timeout 12 ssh-keyscan -T 7 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.scan" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.scan" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cp "$d/host.scan" "$d/host.known"
          ssh -F "$d/config" saeit-host 'id -un' | grep -qx zomorod2
          ssh -F "$d/config" saeit-vps 'id -un' | grep -qx githubops
      - name: Prepare isolated factory-only bundle with strict manifest
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-host 'bash -s' > "$RUNNER_TEMP/factory-only.tar.gz" <<'REMOTE'
          set -euo pipefail
          cd /home/zomorod2/Saeit-staging
          # Explicitly include only the factory Python modules and factory data, not entire app/agent trees.
          # Exclude snapshots, credentials, databases, and any agent-like state until classification.
          find core -maxdepth 1 -type f -name 'factory*.py' -printf '%p\n' | sort > /tmp/factory-transfer-modules-$$
          test -s /tmp/factory-transfer-modules-$$
          tar -czf - --files-from=/tmp/factory-transfer-modules-$$ --exclude='*.env' --exclude='*.key' --exclude='*.pem'
          rm -f /tmp/factory-transfer-modules-$$
          REMOTE
          tar -tzf "$RUNNER_TEMP/factory-only.tar.gz" | grep -q '^core/factory_stage4.py$'
          if tar -tzf "$RUNNER_TEMP/factory-only.tar.gz" | grep -Ei '(^|/)(master_agent|content_agents|agent_empire|\.env|.*\.key|.*\.pem)(/|$)'; then echo 'DENIED_AGENT_OR_SECRET_IN_ARCHIVE'; exit 3; fi
          sha256sum "$RUNNER_TEMP/factory-only.tar.gz"
      - name: Upload factory-only modules to isolated nonproduction VPS staging
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/factory-relay"
          ssh -F "$d/config" saeit-vps 'mkdir -p "$HOME/factory-transfer-incoming" && chmod 700 "$HOME/factory-transfer-incoming"'
          cat "$RUNNER_TEMP/factory-only.tar.gz" | ssh -F "$d/config" saeit-vps 'cat > "$HOME/factory-transfer-incoming/factory-only-modules.tar.gz" && chmod 600 "$HOME/factory-transfer-incoming/factory-only-modules.tar.gz"'
          ssh -F "$d/config" saeit-vps 'set -eu; cd "$HOME/factory-transfer-incoming"; tar -tzf factory-only-modules.tar.gz | grep -q "^core/factory_stage4.py$"; echo TRANSFERRED_SHA256; sha256sum factory-only-modules.tar.gz; echo MODULE_COUNT; tar -tzf factory-only-modules.tar.gz | wc -l'
      - name: Cleanup ephemeral credentials and local bundle
        if: always()
        run: rm -rf "$RUNNER_TEMP/factory-relay" "$RUNNER_TEMP/factory-only.tar.gz"
