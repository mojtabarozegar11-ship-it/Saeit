name: Zomorod bounded disposable package cache cleanup
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-safe-package-cache-cleanup-20261018.yml"]
  pull_request:
    paths: [".github/workflows/zomorod-safe-package-cache-cleanup-20261018.yml"]
  workflow_dispatch:
    inputs:
      cleanup_action:
        description: "Preview only or apply deletion of four disposable package cache directories"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
      confirm_disposable_only:
        description: "I confirm: delete only package download caches, never apps/databases/backups"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zomorod-safe-package-cache-cleanup
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify public site before cache cleanup
        shell: bash
        run: |
          set -euo pipefail
          for path in / /agents/; do
            status="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "CACHE_BEFORE_HEALTH=$path:$status"
            test "$status" = 200
          done
      - name: Identify other safely reviewable storage on both hosts (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,subprocess
          from pathlib import Path
          base=Path("/home/zomorod2")
          candidates={
              "cpanel-user-cache":base/".cache",
              "cpanel-node-gyp-cache":base/".cache/node-gyp",
              "cpanel-uv-cache":base/".cache/uv",
              "cpanel-composer-cache":base/".cache/composer",
              "cpanel-yarn-cache":base/".cache/yarn",
              "cpanel-pnpm-store":base/".local/share/pnpm/store",
              "cpanel-npm-logs":base/".npm/_logs",
              "cpanel-trash":base/".local/share/Trash/files",
              "cpanel-temp":base/"tmp",
              "cpanel-cpanel-temp":base/".cpanel/tmp",
              "cpanel-repo-node-cache":base/"Saeit/node_modules/.cache",
              "cpanel-repo-python-cache":base/"Saeit/.mypy_cache",
              "cpanel-repo-pytest-cache":base/"Saeit/.pytest_cache",
          }
          for label,p in candidates.items():
              if not p.exists():
                  print("SPACE_CANDIDATE="+label+":ABSENT",flush=True);continue
              if p.is_symlink() or not p.is_dir() or p.stat().st_uid!=os.geteuid():
                  print("SPACE_CANDIDATE="+label+":UNSAFE_SKIP",flush=True);continue
              try:
                  res=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=18,check=True)
                  print("SPACE_CANDIDATE="+label+":BYTES="+str(int(res.stdout.split()[0])*1024),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("SPACE_CANDIDATE="+label+":UNAVAILABLE",flush=True)
          PY
          ssh -F "$d/config" saeit-vps 'python3 -' <<'PY'
          import os,subprocess
          from pathlib import Path
          base=Path.home()
          candidates={
              "vps-user-cache":base/".cache",
              "vps-npm-logs":base/".npm/_logs",
              "vps-trash":base/".local/share/Trash/files",
              "vps-temp":base/"tmp",
              "vps-factory-temp":base/"factory-runtime/operations/tmp",
              "vps-factory-logs":base/"factory-runtime/logs",
              "vps-operations-logs":base/"factory-runtime/operations/logs",
          }
          for label,p in candidates.items():
              if not p.exists():
                  print("SPACE_CANDIDATE="+label+":ABSENT",flush=True);continue
              if p.is_symlink() or not p.is_dir() or p.stat().st_uid!=os.geteuid():
                  print("SPACE_CANDIDATE="+label+":UNSAFE_SKIP",flush=True);continue
              try:
                  res=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=18,check=True)
                  print("SPACE_CANDIDATE="+label+":BYTES="+str(int(res.stdout.split()[0])*1024),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("SPACE_CANDIDATE="+label+":UNAVAILABLE",flush=True)
          PY
      - name: Inventory VPS filesystem and bounded cache candidates (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-vps 'python3 -' <<'PY'
          import os,subprocess
          from pathlib import Path
          home=Path.home()
          base=home/"factory-runtime"
          st=os.statvfs("/")
          print("VPS_DISK_FREE_BYTES="+str(st.f_bavail*st.f_frsize),flush=True)
          print("VPS_DISK_TOTAL_BYTES="+str(st.f_blocks*st.f_frsize),flush=True)
          candidates={
              "apt-archive-cache":Path("/var/cache/apt/archives"),
              "systemd-journal":Path("/var/log/journal"),
              "system-temp":Path("/tmp"),
              "var-temp":Path("/var/tmp"),
              "user-pip-cache":home/".cache/pip",
              "user-npm-cache":home/".npm/_cacache",
              "user-npx-cache":home/".npm/_npx",
              "user-huggingface-cache":home/".cache/huggingface",
              "factory-runtime":base,
              "factory-backups":base/"operations/backups"
          }
          for label,p in candidates.items():
              if p.is_symlink():
                  print("VPS_SIZE_"+label+"=SYMLINK_SKIP",flush=True);continue
              if not p.exists():
                  print("VPS_SIZE_"+label+"=ABSENT",flush=True);continue
              try:
                  result=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=22)
                  if result.returncode:
                      print("VPS_SIZE_"+label+"=UNAVAILABLE",flush=True)
                  else:
                      print("VPS_SIZE_"+label+"_BYTES="+str(int(result.stdout.split()[0])*1024),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("VPS_SIZE_"+label+"=UNAVAILABLE",flush=True)
          PY
      - name: Inspect or clear only disposable npm/pip/Gradle download caches
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.cleanup_action }}
          CONFIRM_DISPOSABLE_ONLY: ${{ inputs.confirm_disposable_only }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          mode=preview
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${REQUESTED_ACTION:-preview}" == "apply" ]]; then
            if [[ "${CONFIRM_DISPOSABLE_ONLY:-false}" != "true" ]]; then
              echo "CLEANUP_BLOCKED_EXPLICIT_CONFIRMATION_REQUIRED"
              exit 8
            fi
            mode=apply
          fi
          echo "CACHE_CLEANUP_MODE=$mode"
          ssh -F "$d/config" saeit-cpanel "CACHE_CLEANUP_MODE=$mode bash -se" <<'REMOTE'
          set -euo pipefail
          test "$HOME" = /home/zomorod2
          test -f "$HOME/Saeit/manage.py"
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import os,stat,shutil,subprocess
          from pathlib import Path
          home=Path("/home/zomorod2")
          paths=(".npm/_cacache",".npm/_npx",".cache/pip",".gradle/caches")
          print("CLEANUP_KIND=disposable_download_caches_only")
          proc=subprocess.run(["ps","-u","zomorod2","-o","pid=,etimes=,args="],capture_output=True,text=True,timeout=12,check=True)
          active_counts={}
          active_profiles={}
          active_pids=[]
          for row in proc.stdout.splitlines():
              fields=row.strip().split(None,2)
              if len(fields)!=3 or not fields[0].isdigit() or not fields[1].isdigit():
                  continue
              pid=int(fields[0])
              elapsed=int(fields[1])
              lower=fields[2].lower()
              if not any(token in lower for token in ("npm ","npx ","pnpm ","yarn ",".npm/_npx","pip install","pip download","gradle ")):
                  continue
              # Never print process commands, paths, IDs or environment data.
              kind=("npm-install" if any(t in lower for t in ("npm install","npm ci","npm pack")) else
                    "npm-run" if "npm run" in lower else
                    "npx" if "npx " in lower or ".npm/_npx" in lower else
                    "pnpm" if "pnpm " in lower else
                    "yarn" if "yarn " in lower else
                    "pip" if "pip install" in lower or "pip download" in lower else
                    "gradle" if "gradle " in lower else "npm-other")
              active_counts[kind]=active_counts.get(kind,0)+1
              age=("<5m" if elapsed<300 else "5m-1h" if elapsed<3600 else "1h-1d" if elapsed<86400 else "1d+")
              try:
                  cwd=os.readlink("/proc/"+str(pid)+"/cwd")
                  cwd_kind=("npx-cache" if cwd.startswith(str(home/".npm/_npx")) else
                            "repo" if cwd.startswith(str(home/"Saeit")) else
                            "home" if cwd==str(home) else "other")
              except OSError:
                  cwd_kind="unknown"
              cache_fds=0
              writable_cache_fds=0
              fd_dir=Path("/proc")/str(pid)/"fd"
              try:
                  for fd in fd_dir.iterdir():
                      try:
                          target=os.readlink(fd)
                          if target.startswith(str(home/".npm/")) or target.startswith(str(home/".cache/pip/")):
                              cache_fds+=1
                              for line in (Path("/proc")/str(pid)/"fdinfo"/fd.name).read_text().splitlines():
                                  if line.startswith("flags:") and int(line.split()[1],8)&os.O_ACCMODE:
                                      writable_cache_fds+=1
                                      break
                      except (OSError,ValueError):
                          pass
              except OSError:
                  pass
              fd_kind=("writer" if writable_cache_fds else "reader" if cache_fds else "none")
              profile=(kind,age,cwd_kind,fd_kind)
              active_profiles[profile]=active_profiles.get(profile,0)+1
              active_pids.append((pid,kind,age,cwd_kind))
          # Two bounded, read-only snapshots describe whether long-lived
          # package processes are actually consuming CPU or writing data.
          # Emit aggregate categories only; no PIDs, command lines or paths.
          import time
          def counters(target_pid):
              base=Path("/proc")/str(target_pid)
              out={"cpu":None,"io":None,"state":"unknown","parent":"unknown"}
              try:
                  raw=(base/"stat").read_text()
                  vals=raw[raw.rfind(")")+2:].split()
                  out["cpu"]=int(vals[11])+int(vals[12])
                  out["state"]=vals[0]
              except (OSError,ValueError,IndexError):
                  pass
              try:
                  io={}
                  for line in (base/"io").read_text().splitlines():
                      key,_,value=line.partition(":")
                      if key in ("read_bytes","write_bytes"):
                          io[key]=int(value.strip())
                  if len(io)==2:
                      out["io"]=sum(io.values())
              except (OSError,ValueError):
                  pass
              try:
                  statinfo=(base/"status").read_text().splitlines()
                  ppid=int(next(line.split()[1] for line in statinfo if line.startswith("PPid:")))
                  if ppid==1:
                      out["parent"]="init"
                  else:
                      parent=Path("/proc")/str(ppid)
                      if parent.stat().st_uid==os.geteuid():
                          out["parent"]="same-user"
                      else:
                          out["parent"]="system"
              except (OSError,ValueError,StopIteration):
                  pass
              return out
          # Classify socket state from kernel procfs without logging endpoints.
          network_sockets={}
          for proto in ("tcp","tcp6","udp","udp6"):
              try:
                  for row in (Path("/proc/net")/proto).read_text().splitlines()[1:]:
                      cols=row.split()
                      if len(cols)>9:
                          network_sockets[cols[9]]=cols[3]
              except OSError:
                  pass
          tracked={pid:kind for pid,kind,_,_ in active_pids}
          first={pid:counters(pid) for pid,_,_,_ in active_pids}
          time.sleep(2)
          for pid,kind,age,cwd_kind in active_pids:
              prior=first[pid]
              last=counters(pid)
              activity=("active" if prior["cpu"] is not None and last["cpu"] is not None and last["cpu"]>prior["cpu"] else
                        "idle" if prior["cpu"] is not None and last["cpu"] is not None else "unknown")
              disk_io=("active" if prior["io"] is not None and last["io"] is not None and last["io"]>prior["io"] else
                       "idle" if prior["io"] is not None and last["io"] is not None else "unknown")
              print("PACKAGE_PROCESS_LIFECYCLE="+kind+"/"+age+"/"+cwd_kind+
                    "/state="+last["state"]+"/parent="+last["parent"]+
                    "/cpu="+activity+"/disk_io="+disk_io,flush=True)
              procdir=Path("/proc")/str(pid)
              try:
                  cmd=(procdir/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace").lower()
                  role=("mcp" if "mcp" in cmd else
                        "service-like" if any(token in cmd for token in ("server","serve","listen","watch","start","vite","next dev")) else
                        "package-build" if any(token in cmd for token in ("install","rebuild","compile"," build ")) else
                        "package-exec" if any(token in cmd for token in ("exec","npx")) else "unknown")
              except OSError:
                  role="unknown"
              try:
                  ppid=int(next(line.split()[1] for line in (procdir/"status").read_text().splitlines() if line.startswith("PPid:")))
                  relation=("package-parent" if ppid in tracked else "init" if ppid==1 else "other-parent")
              except (OSError,ValueError,StopIteration):
                  relation="unknown"
              attached=[]
              listener=0
              established=0
              stdio=[]
              try:
                  fd_list=list((procdir/"fd").iterdir())
              except OSError:
                  fd_list=[]
              for fd in fd_list:
                  try:
                      dest=os.readlink(fd)
                  except OSError:
                      continue
                  if dest.startswith("socket:["):
                      inode=dest[8:-1]
                      attached.append(inode)
                      listener+=network_sockets.get(inode)=="0A"
                      established+=network_sockets.get(inode)=="01"
                  if fd.name in ("0","1","2"):
                      io_type=("pipe" if dest.startswith("pipe:[") else
                               "socket" if dest.startswith("socket:[") else
                               "tty" if dest.startswith("/dev/pts") else "file")
                      stdio.append(fd.name+":"+io_type)
              print("PACKAGE_PROCESS_SERVICE_ROLE="+kind+"/"+cwd_kind+"/role="+role+
                    "/ancestor="+relation+"/sockets="+str(len(attached))+
                    "/listening="+str(listener)+"/established="+str(established)+
                    "/stdio="+",".join(sorted(stdio)),flush=True)
          # Report profiles but do not let npm/npx block unrelated pip/Gradle caches.
          if active_counts:
              for (kind,age,cwd_kind,fd_kind),count in sorted(active_profiles.items()):
                  print("PACKAGE_PROCESS_PROFILE="+kind+"/"+age+"/"+cwd_kind+"/"+fd_kind+":"+str(count),flush=True)
              print("PACKAGE_MANAGER_BLOCKER_CLASSES="+",".join(
                  str(k)+":"+str(v) for k,v in sorted(active_counts.items())),flush=True)
          apply=os.environ.get("CACHE_CLEANUP_MODE")=="apply"
          print("CACHE_APPLY="+str(apply),flush=True)
          # Inspect every current-user process, not just command names, for an
          # open handle or cwd in a candidate cache. On uncertain visibility,
          # skip deletion of ALL candidates.
          references={rel:0 for rel in paths}
          incomplete=0
          uid=os.geteuid()
          for procdir in Path("/proc").iterdir():
              if not procdir.name.isdigit():
                  continue
              try:
                  if procdir.stat().st_uid != uid:
                      continue
              except (FileNotFoundError,ProcessLookupError):
                  continue
              except OSError:
                  incomplete+=1
                  continue
              try:
                  cwd=os.readlink(procdir/"cwd")
                  for rel in paths:
                      root=str(home/rel)
                      if cwd==root or cwd.startswith(root+"/"):
                          references[rel]+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  incomplete+=1
              try:
                  for fd in (procdir/"fd").iterdir():
                      try:
                          target=os.readlink(fd)
                      except FileNotFoundError:
                          continue
                      except OSError:
                          incomplete+=1
                          continue
                      for rel in paths:
                          root=str(home/rel)
                          if target==root or target.startswith(root+"/"):
                              references[rel]+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  incomplete+=1
          print("CACHE_PROC_INSPECTION_INCOMPLETE="+str(incomplete),flush=True)
          total=0
          freed=0
          for rel in paths:
              p=home/rel
              if not p.exists():
                  print("CACHE_ABSENT="+rel,flush=True)
                  continue
              if p.is_symlink() or not p.is_dir() or p.resolve()!=p:
                  raise RuntimeError("CACHE_PATH_UNSAFE")
              for ancestor in (p.parent,p):
                  if ancestor.is_symlink() or ancestor.stat().st_uid!=uid:
                      raise RuntimeError("CACHE_COMPONENT_UNSAFE")
              before=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=40,check=True)
              size=int(before.stdout.split()[0])*1024
              print("CACHE_CANDIDATE="+rel+" bytes_du="+str(size),flush=True)
              total+=size
              is_npm=rel.startswith(".npm/")
              busy=(any(k.startswith("npm") or k in ("npx","pnpm","yarn") for k in active_counts)
                    if is_npm else
                    (bool(active_counts.get("pip")) if rel==".cache/pip" else bool(active_counts.get("gradle"))))
              if busy or references[rel] or incomplete:
                  why=("package-manager-active" if busy else "cache-open-or-cwd" if references[rel] else "proc-visibility-incomplete")
                  print("CACHE_HELD="+rel+" reason="+why+" refs="+str(references[rel]),flush=True)
                  continue
              print("CACHE_ELIGIBLE="+rel+" bytes_du="+str(size),flush=True)
              if apply:
                  # Re-inspect process occupancy just before a bounded removal.
                  # No production app, database, or backup path is ever targeted.
                  for procdir in Path("/proc").iterdir():
                      if not procdir.name.isdigit():
                          continue
                      try:
                          if procdir.stat().st_uid!=uid:
                              continue
                          cwd=os.readlink(procdir/"cwd")
                          if cwd==str(p) or cwd.startswith(str(p)+"/"):
                              raise RuntimeError("CACHE_BECAME_IN_USE")
                          for fd in (procdir/"fd").iterdir():
                              try:
                                  target=os.readlink(fd)
                              except FileNotFoundError:
                                  continue
                              if target==str(p) or target.startswith(str(p)+"/"):
                                  raise RuntimeError("CACHE_BECAME_IN_USE")
                      except FileNotFoundError:
                          continue
                      except RuntimeError:
                          raise
                      except OSError:
                          raise RuntimeError("CACHE_PROCESS_CHECK_FAILED")
                  shutil.rmtree(p)
                  if p.exists():
                      raise RuntimeError("CACHE_REMOVE_INCOMPLETE")
                  freed+=size
                  print("CACHE_DELETED="+rel+" bytes_du="+str(size),flush=True)
          print("CACHE_CANDIDATE_BYTES="+str(total),flush=True)
          print("CACHE_FREED_BYTES="+str(freed),flush=True)
          if apply and freed==0:
              print("CACHE_NO_SAFE_RECLAIM=true",flush=True)
          PY
          echo 'POST_CACHE_CPANEL_QUOTA'
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=json Quota get_quota_info 2>/dev/null | python3 -c 'import json,sys; j=json.load(sys.stdin).get("result",{}).get("data",{});print("POST_CACHE_MB_USED="+str(j.get("megabytes_used")));print("POST_CACHE_MB_LIMIT="+str(j.get("megabyte_limit")))' || true
          fi
          REMOTE
      - name: Public smoke after cache cleanup
        shell: bash
        run: |
          for path in / /agents/; do
            status="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "CACHE_POST_HEALTH=$path:$status"
            test "$status" = 200
          done
      - name: Remove runner SSH identities
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
# Preview by default; apply only with explicit confirmation, bounded cache paths and live process guard.
