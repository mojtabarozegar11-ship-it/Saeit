name: Zomorod bounded disposable package cache cleanup
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-safe-package-cache-cleanup-20261018.yml"]
  pull_request:
    paths: [".github/workflows/zomorod-safe-package-cache-cleanup-20261018.yml"]
  workflow_dispatch:
    inputs:
      cleanup_action:
        description: "Preview, clear safe package caches, or relocate two checksum-pinned old backups"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
          - migrate_backup
      confirm_backup_relocation:
        description: "I confirm relocation only after verified VPS copies and process safety checks"
        type: boolean
        default: false
      confirm_disposable_only:
        description: "I confirm: delete only package download caches, never apps/databases/backups"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zomorod-safe-package-cache-cleanup
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Verify public site before cache cleanup
        shell: bash
        run: |
          set -euo pipefail
          for path in / /agents/; do
            status="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "CACHE_BEFORE_HEALTH=$path:$status"
            test "$status" = 200
          done
      - name: Identify other safely reviewable storage on both hosts (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'python3 -' <<'PY'
          import os,subprocess
          from pathlib import Path
          base=Path("/home/zomorod2")
          candidates={
              "cpanel-user-cache":base/".cache",
              "cpanel-node-gyp-cache":base/".cache/node-gyp",
              "cpanel-uv-cache":base/".cache/uv",
              "cpanel-composer-cache":base/".cache/composer",
              "cpanel-yarn-cache":base/".cache/yarn",
              "cpanel-pnpm-store":base/".local/share/pnpm/store",
              "cpanel-npm-logs":base/".npm/_logs",
              "cpanel-trash":base/".local/share/Trash/files",
              "cpanel-temp":base/"tmp",
              "cpanel-cpanel-temp":base/".cpanel/tmp",
              "cpanel-repo-node-cache":base/"Saeit/node_modules/.cache",
              "cpanel-repo-python-cache":base/"Saeit/.mypy_cache",
              "cpanel-repo-pytest-cache":base/"Saeit/.pytest_cache",
          }
          for label,p in candidates.items():
              if not p.exists():
                  print("SPACE_CANDIDATE="+label+":ABSENT",flush=True);continue
              if p.is_symlink() or not p.is_dir() or p.stat().st_uid!=os.geteuid():
                  print("SPACE_CANDIDATE="+label+":UNSAFE_SKIP",flush=True);continue
              try:
                  res=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=18,check=True)
                  print("SPACE_CANDIDATE="+label+":BYTES="+str(int(res.stdout.split()[0])*1024),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("SPACE_CANDIDATE="+label+":UNAVAILABLE",flush=True)
          PY
          ssh -F "$d/config" saeit-vps 'python3 -' <<'PY'
          import os,subprocess
          from pathlib import Path
          base=Path.home()
          candidates={
              "vps-user-cache":base/".cache",
              "vps-npm-logs":base/".npm/_logs",
              "vps-trash":base/".local/share/Trash/files",
              "vps-temp":base/"tmp",
              "vps-factory-temp":base/"factory-runtime/operations/tmp",
              "vps-factory-logs":base/"factory-runtime/logs",
              "vps-operations-logs":base/"factory-runtime/operations/logs",
          }
          for label,p in candidates.items():
              if not p.exists():
                  print("SPACE_CANDIDATE="+label+":ABSENT",flush=True);continue
              if p.is_symlink() or not p.is_dir() or p.stat().st_uid!=os.geteuid():
                  print("SPACE_CANDIDATE="+label+":UNSAFE_SKIP",flush=True);continue
              try:
                  res=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=18,check=True)
                  print("SPACE_CANDIDATE="+label+":BYTES="+str(int(res.stdout.split()[0])*1024),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("SPACE_CANDIDATE="+label+":UNAVAILABLE",flush=True)
          PY
      - name: Map cPanel top-level quota drivers without touching files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import hashlib,os,re,subprocess,time
          from pathlib import Path
          home=Path("/home/zomorod2")
          assert home.is_dir() and not home.is_symlink() and home.stat().st_uid==os.geteuid()
          protected={"public_html","www","mail","etc","ssl","logs","access-logs","Saeit",
                     "backup","backups","softaculous_backups","database","databases",
                     ".ssh",".cpanel",".trash",".htpasswds",".cl.selector",".cagefs",
                     "python","virtualenv","repositories","public_ftp","site","sites"}
          review={".cache",".npm","tmp",".local","cache","temp"}
          print("HOME_STORAGE_MAP=READ_ONLY",flush=True)
          try:
              run=subprocess.run(["nice","-n","15","du","-k","--max-depth=1",
                                  "--one-file-system",str(home)],
                                  capture_output=True,text=True,timeout=100)
              entries=[]
              for line in run.stdout.splitlines():
                  size,sep,path=line.partition("\t")
                  p=Path(path)
                  if sep and size.isdigit() and p.parent==home:
                      entries.append((int(size)*1024,p.name))
              entries.sort(reverse=True)
              print("HOME_DU_STATUS="+("complete" if run.returncode==0 else "partial"),flush=True)
              print("HOME_DU_VISIBLE_DIRECTORIES="+str(len(entries)),flush=True)
              for size,name in entries[:32]:
                  safe=name if re.fullmatch(r"[A-Za-z0-9_.-]{1,48}",name) else "private-"+hashlib.sha256(name.encode()).hexdigest()[:10]
                  role="PROTECT" if name in protected or name.lower().startswith(("backup","database","site","app","mail")) else ("REVIEW_ONLY" if name in review else "UNKNOWN_PROTECT")
                  print("HOME_QUOTA_DIR="+safe+":BYTES="+str(size)+":ROLE="+role,flush=True)
              if len(entries)>32:
                  print("HOME_OTHER_DIR_COUNT="+str(len(entries)-32)+
                        ":BYTES="+str(sum(x[0] for x in entries[32:])),flush=True)
          except subprocess.TimeoutExpired:
              print("HOME_DU_STATUS=timeout_no_deletion",flush=True)
          files=[]
          try:
              for p in home.iterdir():
                  if p.is_file() and not p.is_symlink():
                      s=p.stat()
                      if s.st_uid==os.geteuid():
                          files.append((s.st_size,p.name,s.st_mtime))
              files.sort(reverse=True)
              print("HOME_ROOT_REGULAR_FILES="+str(len(files)),flush=True)
              print("HOME_ROOT_REGULAR_FILES_BYTES="+str(sum(f[0] for f in files)),flush=True)
              for size,name,mtime in files[:12]:
                  extension=("archive" if name.lower().endswith((".zip",".tar.gz",".tgz",".gz",".tar",".bz2",".xz",".7z")) else
                             "log" if name.lower().endswith((".log",".log.1")) else
                             "sql" if name.lower().endswith((".sql",".sql.gz")) else "other")
                  fingerprint=hashlib.sha256(name.encode()).hexdigest()[:12]
                  age=max(0,int((time.time()-mtime)/86400))
                  print("HOME_ROOT_FILE=HASH:"+fingerprint+":KIND:"+extension+
                        ":BYTES:"+str(size)+":AGE_DAYS:"+str(age)+":PROTECTED_REVIEW",flush=True)
          except OSError:
              print("HOME_ROOT_FILE_SCAN=INCOMPLETE",flush=True)
          PY
      - name: Fingerprint stale root archives and secondary storage (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import hashlib,os,re,subprocess,time
          from pathlib import Path
          root=Path("/home/zomorod2")
          uid=os.geteuid()
          candidates=[]
          now=time.time()
          for p in root.iterdir():
              try:
                  if p.is_symlink() or not p.is_file():
                      continue
                  s=p.stat()
                  age=int((now-s.st_mtime)/86400)
                  if s.st_uid!=uid or s.st_size<50000000 or age<20:
                      continue
                  if not p.name.lower().endswith((".zip",".tar",".tar.gz",".tgz",".gz",".7z",".xz",".bz2")):
                      continue
                  candidates.append((s.st_size,p,age))
              except OSError:
                  continue
          candidates.sort(reverse=True,key=lambda x:x[0])
          candidates=candidates[:8]
          print("ARCHIVE_AUDIT_MODE=READ_ONLY",flush=True)
          print("ARCHIVE_CANDIDATE_COUNT="+str(len(candidates)),flush=True)
          tracked={str(p):[0,0] for _,p,_ in candidates}
          unknown=0
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  if proc.stat().st_uid!=uid:
                      continue
                  refs=[os.readlink(proc/"cwd"),os.readlink(proc/"exe")]
                  for fd in (proc/"fd").iterdir():
                      try:
                          refs.append(os.readlink(fd))
                      except FileNotFoundError:
                          pass
                      except OSError:
                          unknown+=1
                  for candidate in tracked:
                      if any(r==candidate or r.startswith(candidate+" (deleted)") for r in refs):
                          tracked[candidate][0]+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  unknown+=1
          print("ARCHIVE_PROC_VISIBILITY_ERRORS="+str(unknown),flush=True)
          print("ARCHIVE_GROUPED_MAX_BYTES="+str(sum(v[0] for v in candidates)),flush=True)
          digest_groups={}
          for size,p,age in candidates:
              label=hashlib.sha256(p.name.encode()).hexdigest()[:12]
              tokens=p.name.lower()
              purpose=("backup" if any(x in tokens for x in ("backup","bkp","snapshot","dump")) else
                       "release" if any(x in tokens for x in ("release","deploy","build")) else
                       "staging" if any(x in tokens for x in ("stage","preflight","staging")) else
                       "unknown")
              try:
                  with p.open("rb") as f:
                      signature=f.read(8)
                      h=hashlib.sha256()
                      f.seek(0)
                      for chunk in iter(lambda:f.read(1024*1024),b""):
                          h.update(chunk)
                      digest=h.hexdigest()[:20]
                  kind=("zip" if signature.startswith(b"PK") else
                        "gzip" if signature.startswith(bytes.fromhex("1f8b")) else
                        "7z" if signature.startswith(bytes.fromhex("377abcaf271c")) else
                        "xz" if signature.startswith(bytes.fromhex("fd377a585a00")) else
                        "unknown")
                  digest_groups.setdefault(digest,[]).append(label)
              except OSError:
                  digest="UNAVAILABLE";kind="UNAVAILABLE"
              print("ROOT_ARCHIVE="+label+":BYTES="+str(size)+":AGE_DAYS="+str(age)+
                    ":CONTENT_KIND="+kind+":PURPOSE_HINT="+purpose+":SHA256_PREFIX="+digest+
                    ":OPEN_PROCESS_REFS="+str(tracked[str(p)][0])+":PROTECTED",flush=True)
          for digest,labels in digest_groups.items():
              if len(labels)>1:
                  print("ARCHIVE_DUPLICATES=SHA256_PREFIX:"+digest+
                        ":COUNT:"+str(len(labels)),flush=True)
          for directory in (root/".local",root/".backups"):
              if not directory.is_dir() or directory.is_symlink() or directory.stat().st_uid!=uid:
                  continue
              try:
                  r=subprocess.run(["nice","-n","15","du","-k","--max-depth=1",
                                    "--one-file-system",str(directory)],capture_output=True,text=True,timeout=30)
                  entries=[]
                  for line in r.stdout.splitlines():
                      size,sep,path=line.partition("\t")
                      q=Path(path)
                      if sep and size.isdigit() and q.parent==directory:
                          entries.append((int(size)*1024,q.name))
                  entries.sort(reverse=True)
                  for size,name in entries[:10]:
                      safe=name if re.fullmatch(r"[A-Za-z0-9_.-]{1,48}",name) else "private-"+hashlib.sha256(name.encode()).hexdigest()[:10]
                      print("SECONDARY_STORAGE="+directory.name+"/"+safe+":BYTES="+str(size)+":PROTECTED_REVIEW",flush=True)
              except subprocess.TimeoutExpired:
                  print("SECONDARY_STORAGE="+directory.name+":TIMEOUT_NO_CHANGES",flush=True)
          PY
      - name: Inspect remaining ZIP central directories without extraction
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import collections,hashlib,os,stat,time,zipfile
          from pathlib import Path
          home=Path("/home/zomorod2")
          uid=os.geteuid()
          now=time.time()
          print("ZIP_INSPECTION=READ_ONLY_NO_EXTRACTION",flush=True)
          seen=0
          for path in home.iterdir():
              try:
                  if path.is_symlink() or not path.is_file() or path.suffix.lower()!=".zip":
                      continue
                  item=path.lstat()
                  if not stat.S_ISREG(item.st_mode) or item.st_uid!=uid:
                      continue
                  if item.st_size<50000000 or now-item.st_mtime<20*86400:
                      continue
                  seen+=1
                  key=hashlib.sha256(path.name.encode()).hexdigest()[:12]
                  with zipfile.ZipFile(path,"r") as archive:
                      infos=archive.infolist()
                      kinds=collections.Counter()
                      signals=collections.Counter()
                      encrypted=0
                      total_uncompressed=0
                      top_levels=set()
                      for info in infos:
                          name=info.filename.replace("\\","/").lower()
                          top_levels.add(name.split("/",1)[0])
                          if not info.is_dir():
                              kinds[(Path(name).suffix.lower() or "(none)")]+=1
                          encrypted+=bool(info.flag_bits&1)
                          total_uncompressed+=info.file_size
                          for signal,tokens in {
                              "app_or_site":("public_html/","saeit/","site/","app/","django","passenger"),
                              "database":(".sql",".sqlite",".db","database/","dump"),
                              "security_or_secrets":(".env",".ssh/","ssl/","certificate","private_key"),
                              "backup":("backup","snapshot","restore"),
                              "dependency_or_source":("node_modules/","vendor/","site-packages/",".git/","requirements.txt"),
                              "static_assets":(".js",".css",".png",".jpg",".webp",".svg"),
                          }.items():
                              if any(token in name for token in tokens):
                                  signals[signal]+=1
                      protected=any(signals[x] for x in ("app_or_site","database","security_or_secrets","backup","dependency_or_source"))
                      print("ZIP_CANDIDATE="+key+":BYTES="+str(item.st_size)+
                            ":AGE_DAYS="+str(int((now-item.st_mtime)/86400))+
                            ":MEMBERS="+str(len(infos))+
                            ":TOP_LEVEL_COUNT="+str(len(top_levels))+
                            ":UNCOMPRESSED_BYTES="+str(total_uncompressed)+
                            ":ENCRYPTED_MEMBERS="+str(encrypted)+
                            ":CLASS="+("PROTECT_APP_OR_BACKUP" if protected else "UNKNOWN_PROTECT"),flush=True)
                      print("ZIP_TYPES="+key+":"+",".join(k+":"+str(v) for k,v in kinds.most_common(8)),flush=True)
                      print("ZIP_SIGNALS="+key+":"+",".join(k+":"+str(v) for k,v in sorted(signals.items())),flush=True)
              except (OSError,zipfile.BadZipFile,zipfile.LargeZipFile,RuntimeError,ValueError) as exc:
                  print("ZIP_CANDIDATE=UNREADABLE_PROTECT:ERROR="+type(exc).__name__,flush=True)
          print("ZIP_INSPECTED_COUNT="+str(seen),flush=True)
          PY
      - name: Classify cPanel generic cache and temp contents without reading files
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import os,re,subprocess,time
          from pathlib import Path
          home=Path("/home/zomorod2")
          uid=os.geteuid()
          refs=[]
          visibility_errors=0
          for procdir in Path("/proc").iterdir():
              if not procdir.name.isdigit():
                  continue
              try:
                  if procdir.stat().st_uid!=uid:
                      continue
                  refs.append(os.readlink(procdir/"cwd"))
              except FileNotFoundError:
                  continue
              except OSError:
                  visibility_errors+=1
              try:
                  for fd in (procdir/"fd").iterdir():
                      try:
                          refs.append(os.readlink(fd))
                      except FileNotFoundError:
                          pass
                      except OSError:
                          visibility_errors+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  visibility_errors+=1
          print("SPACE_DETAIL_PROC_VISIBILITY_ERRORS="+str(visibility_errors),flush=True)
          for group,root in (("cache",home/".cache"),("temp",home/"tmp")):
              if not root.is_dir() or root.is_symlink() or root.stat().st_uid!=uid:
                  print("SPACE_DETAIL_GROUP="+group+":UNAVAILABLE",flush=True)
                  continue
              children=list(root.iterdir())
              print("SPACE_DETAIL_GROUP="+group+":CHILDREN="+str(len(children)),flush=True)
              for child in children[:35]:
                  raw=child.name
                  label=raw if re.fullmatch(r"[A-Za-z0-9_.-]{1,40}",raw) else "redacted"
                  if child.is_symlink() or child.stat().st_uid!=uid:
                      print("SPACE_DETAIL="+group+"/"+label+":UNSAFE_SKIP",flush=True)
                      continue
                  try:
                      res=subprocess.run(["du","-sk",str(child)],capture_output=True,text=True,timeout=14,check=True)
                      size=int(res.stdout.split()[0])*1024
                  except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                      print("SPACE_DETAIL="+group+"/"+label+":UNAVAILABLE",flush=True)
                      continue
                  age=max(0,int((time.time()-child.stat().st_mtime)/86400))
                  root_string=str(child)
                  referenced=any(path==root_string or path.startswith(root_string+"/") for path in refs)
                  print("SPACE_DETAIL="+group+"/"+label+":BYTES="+str(size)+
                        ":DIR_MTIME_DAYS="+str(age)+":PROC_REFERENCED="+str(referenced),flush=True)
          PY
      - name: Verify cPanel node setup cache content and live execution dependencies (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          import os,re,stat,subprocess
          from pathlib import Path
          cache=Path("/home/zomorod2/.cache/dc-node-setup")
          if not cache.is_dir() or cache.is_symlink() or cache.stat().st_uid!=os.geteuid():
              raise RuntimeError("NODE_SETUP_CACHE_UNAVAILABLE_OR_UNSAFE")
          print("NODE_SETUP_CACHE_INSPECT_READ_ONLY=true",flush=True)
          children=list(cache.iterdir())
          print("NODE_SETUP_CACHE_TOP_CHILDREN="+str(len(children)),flush=True)
          for child in children[:30]:
              label=child.name if re.fullmatch(r"[A-Za-z0-9_.-]{1,65}",child.name) else "redacted"
              if child.is_symlink():
                  print("NODE_SETUP_CACHE_CHILD="+label+":SYMLINK",flush=True);continue
              try:
                  du=subprocess.run(["du","-sk",str(child)],capture_output=True,text=True,timeout=15,check=True)
                  size=int(du.stdout.split()[0])*1024
                  print("NODE_SETUP_CACHE_CHILD="+label+":BYTES="+str(size)+
                        ":IS_DIR="+str(child.is_dir()),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("NODE_SETUP_CACHE_CHILD="+label+":UNAVAILABLE",flush=True)
          current_use=0
          executable_use=0
          mapped_use=0
          unknown=0
          root=str(cache)
          for procdir in Path("/proc").iterdir():
              if not procdir.name.isdigit():
                  continue
              try:
                  if procdir.stat().st_uid!=os.geteuid():
                      continue
              except FileNotFoundError:
                  continue
              except OSError:
                  unknown+=1;continue
              try:
                  exe=os.readlink(procdir/"exe")
                  executable_use+=int(exe==root or exe.startswith(root+"/"))
              except FileNotFoundError:
                  pass
              except OSError:
                  unknown+=1
              try:
                  cwd=os.readlink(procdir/"cwd")
                  current_use+=int(cwd==root or cwd.startswith(root+"/"))
              except FileNotFoundError:
                  pass
              except OSError:
                  unknown+=1
              try:
                  for fd in (procdir/"fd").iterdir():
                      try:
                          target=os.readlink(fd)
                          current_use+=int(target==root or target.startswith(root+"/"))
                      except FileNotFoundError:
                          pass
                      except OSError:
                          unknown+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  unknown+=1
              try:
                  mapped_use+=int(any(root in line for line in (procdir/"maps").read_text().splitlines()))
              except FileNotFoundError:
                  pass
              except OSError:
                  unknown+=1
          print("NODE_SETUP_CACHE_EXECUTABLE_REFS="+str(executable_use),flush=True)
          print("NODE_SETUP_CACHE_CWD_OR_FD_REFS="+str(current_use),flush=True)
          print("NODE_SETUP_CACHE_MAPPED_PROCESS_COUNT="+str(mapped_use),flush=True)
          print("NODE_SETUP_CACHE_PROC_UNKNOWN="+str(unknown),flush=True)
          PY
      - name: Inventory VPS filesystem and bounded cache candidates (read-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-vps 'python3 -' <<'PY'
          import os,subprocess
          from pathlib import Path
          home=Path.home()
          base=home/"factory-runtime"
          st=os.statvfs("/")
          print("VPS_DISK_FREE_BYTES="+str(st.f_bavail*st.f_frsize),flush=True)
          print("VPS_DISK_TOTAL_BYTES="+str(st.f_blocks*st.f_frsize),flush=True)
          candidates={
              "apt-archive-cache":Path("/var/cache/apt/archives"),
              "systemd-journal":Path("/var/log/journal"),
              "system-temp":Path("/tmp"),
              "var-temp":Path("/var/tmp"),
              "user-pip-cache":home/".cache/pip",
              "user-npm-cache":home/".npm/_cacache",
              "user-npx-cache":home/".npm/_npx",
              "user-huggingface-cache":home/".cache/huggingface",
              "factory-runtime":base,
              "factory-backups":base/"operations/backups"
          }
          for label,p in candidates.items():
              if p.is_symlink():
                  print("VPS_SIZE_"+label+"=SYMLINK_SKIP",flush=True);continue
              if not p.exists():
                  print("VPS_SIZE_"+label+"=ABSENT",flush=True);continue
              try:
                  result=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=22)
                  if result.returncode:
                      print("VPS_SIZE_"+label+"=UNAVAILABLE",flush=True)
                  else:
                      print("VPS_SIZE_"+label+"_BYTES="+str(int(result.stdout.split()[0])*1024),flush=True)
              except (OSError,ValueError,IndexError,subprocess.TimeoutExpired):
                  print("VPS_SIZE_"+label+"=UNAVAILABLE",flush=True)
          PY
      - name: Inspect or clear only disposable npm/pip/Gradle download caches
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.cleanup_action }}
          CONFIRM_DISPOSABLE_ONLY: ${{ inputs.confirm_disposable_only }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          mode=preview
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${REQUESTED_ACTION:-preview}" == "apply" ]]; then
            if [[ "${CONFIRM_DISPOSABLE_ONLY:-false}" != "true" ]]; then
              echo "CLEANUP_BLOCKED_EXPLICIT_CONFIRMATION_REQUIRED"
              exit 8
            fi
            mode=apply
          fi
          echo "CACHE_CLEANUP_MODE=$mode"
          ssh -F "$d/config" saeit-cpanel "CACHE_CLEANUP_MODE=$mode bash -se" <<'REMOTE'
          set -euo pipefail
          test "$HOME" = /home/zomorod2
          test -f "$HOME/Saeit/manage.py"
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import os,stat,shutil,subprocess
          from pathlib import Path
          home=Path("/home/zomorod2")
          paths=(".npm/_cacache",".npm/_npx",".cache/pip",".gradle/caches")
          print("CLEANUP_KIND=disposable_download_caches_only")
          proc=subprocess.run(["ps","-u","zomorod2","-o","pid=,etimes=,args="],capture_output=True,text=True,timeout=12,check=True)
          active_counts={}
          active_profiles={}
          active_pids=[]
          for row in proc.stdout.splitlines():
              fields=row.strip().split(None,2)
              if len(fields)!=3 or not fields[0].isdigit() or not fields[1].isdigit():
                  continue
              pid=int(fields[0])
              elapsed=int(fields[1])
              lower=fields[2].lower()
              if not any(token in lower for token in ("npm ","npx ","pnpm ","yarn ",".npm/_npx","pip install","pip download","gradle ")):
                  continue
              # Never print process commands, paths, IDs or environment data.
              kind=("npm-install" if any(t in lower for t in ("npm install","npm ci","npm pack")) else
                    "npm-run" if "npm run" in lower else
                    "npx" if "npx " in lower or ".npm/_npx" in lower else
                    "pnpm" if "pnpm " in lower else
                    "yarn" if "yarn " in lower else
                    "pip" if "pip install" in lower or "pip download" in lower else
                    "gradle" if "gradle " in lower else "npm-other")
              active_counts[kind]=active_counts.get(kind,0)+1
              age=("<5m" if elapsed<300 else "5m-1h" if elapsed<3600 else "1h-1d" if elapsed<86400 else "1d+")
              try:
                  cwd=os.readlink("/proc/"+str(pid)+"/cwd")
                  cwd_kind=("npx-cache" if cwd.startswith(str(home/".npm/_npx")) else
                            "repo" if cwd.startswith(str(home/"Saeit")) else
                            "home" if cwd==str(home) else "other")
              except OSError:
                  cwd_kind="unknown"
              cache_fds=0
              writable_cache_fds=0
              fd_dir=Path("/proc")/str(pid)/"fd"
              try:
                  for fd in fd_dir.iterdir():
                      try:
                          target=os.readlink(fd)
                          if target.startswith(str(home/".npm/")) or target.startswith(str(home/".cache/pip/")):
                              cache_fds+=1
                              for line in (Path("/proc")/str(pid)/"fdinfo"/fd.name).read_text().splitlines():
                                  if line.startswith("flags:") and int(line.split()[1],8)&os.O_ACCMODE:
                                      writable_cache_fds+=1
                                      break
                      except (OSError,ValueError):
                          pass
              except OSError:
                  pass
              fd_kind=("writer" if writable_cache_fds else "reader" if cache_fds else "none")
              profile=(kind,age,cwd_kind,fd_kind)
              active_profiles[profile]=active_profiles.get(profile,0)+1
              active_pids.append((pid,kind,age,cwd_kind))
          # Two bounded, read-only snapshots describe whether long-lived
          # package processes are actually consuming CPU or writing data.
          # Emit aggregate categories only; no PIDs, command lines or paths.
          import time
          def counters(target_pid):
              base=Path("/proc")/str(target_pid)
              out={"cpu":None,"io":None,"state":"unknown","parent":"unknown"}
              try:
                  raw=(base/"stat").read_text()
                  vals=raw[raw.rfind(")")+2:].split()
                  out["cpu"]=int(vals[11])+int(vals[12])
                  out["state"]=vals[0]
              except (OSError,ValueError,IndexError):
                  pass
              try:
                  io={}
                  for line in (base/"io").read_text().splitlines():
                      key,_,value=line.partition(":")
                      if key in ("read_bytes","write_bytes"):
                          io[key]=int(value.strip())
                  if len(io)==2:
                      out["io"]=sum(io.values())
              except (OSError,ValueError):
                  pass
              try:
                  statinfo=(base/"status").read_text().splitlines()
                  ppid=int(next(line.split()[1] for line in statinfo if line.startswith("PPid:")))
                  if ppid==1:
                      out["parent"]="init"
                  else:
                      parent=Path("/proc")/str(ppid)
                      if parent.stat().st_uid==os.geteuid():
                          out["parent"]="same-user"
                      else:
                          out["parent"]="system"
              except (OSError,ValueError,StopIteration):
                  pass
              return out
          # Classify socket state from kernel procfs without logging endpoints.
          network_sockets={}
          for proto in ("tcp","tcp6","udp","udp6"):
              try:
                  for row in (Path("/proc/net")/proto).read_text().splitlines()[1:]:
                      cols=row.split()
                      if len(cols)>9:
                          network_sockets[cols[9]]=cols[3]
              except OSError:
                  pass
          tracked={pid:kind for pid,kind,_,_ in active_pids}
          first={pid:counters(pid) for pid,_,_,_ in active_pids}
          time.sleep(2)
          for pid,kind,age,cwd_kind in active_pids:
              prior=first[pid]
              last=counters(pid)
              activity=("active" if prior["cpu"] is not None and last["cpu"] is not None and last["cpu"]>prior["cpu"] else
                        "idle" if prior["cpu"] is not None and last["cpu"] is not None else "unknown")
              disk_io=("active" if prior["io"] is not None and last["io"] is not None and last["io"]>prior["io"] else
                       "idle" if prior["io"] is not None and last["io"] is not None else "unknown")
              print("PACKAGE_PROCESS_LIFECYCLE="+kind+"/"+age+"/"+cwd_kind+
                    "/state="+last["state"]+"/parent="+last["parent"]+
                    "/cpu="+activity+"/disk_io="+disk_io,flush=True)
              procdir=Path("/proc")/str(pid)
              try:
                  cmd=(procdir/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","replace").lower()
                  role=("mcp" if "mcp" in cmd else
                        "service-like" if any(token in cmd for token in ("server","serve","listen","watch","start","vite","next dev")) else
                        "package-build" if any(token in cmd for token in ("install","rebuild","compile"," build ")) else
                        "package-exec" if any(token in cmd for token in ("exec","npx")) else "unknown")
              except OSError:
                  role="unknown"
              try:
                  ppid=int(next(line.split()[1] for line in (procdir/"status").read_text().splitlines() if line.startswith("PPid:")))
                  relation=("package-parent" if ppid in tracked else "init" if ppid==1 else "other-parent")
              except (OSError,ValueError,StopIteration):
                  relation="unknown"
              attached=[]
              listener=0
              established=0
              stdio=[]
              try:
                  fd_list=list((procdir/"fd").iterdir())
              except OSError:
                  fd_list=[]
              for fd in fd_list:
                  try:
                      dest=os.readlink(fd)
                  except OSError:
                      continue
                  if dest.startswith("socket:["):
                      inode=dest[8:-1]
                      attached.append(inode)
                      listener+=network_sockets.get(inode)=="0A"
                      established+=network_sockets.get(inode)=="01"
                  if fd.name in ("0","1","2"):
                      io_type=("pipe" if dest.startswith("pipe:[") else
                               "socket" if dest.startswith("socket:[") else
                               "tty" if dest.startswith("/dev/pts") else "file")
                      stdio.append(fd.name+":"+io_type)
              print("PACKAGE_PROCESS_SERVICE_ROLE="+kind+"/"+cwd_kind+"/role="+role+
                    "/ancestor="+relation+"/sockets="+str(len(attached))+
                    "/listening="+str(listener)+"/established="+str(established)+
                    "/stdio="+",".join(sorted(stdio)),flush=True)
          # Report profiles but do not let npm/npx block unrelated pip/Gradle caches.
          if active_counts:
              for (kind,age,cwd_kind,fd_kind),count in sorted(active_profiles.items()):
                  print("PACKAGE_PROCESS_PROFILE="+kind+"/"+age+"/"+cwd_kind+"/"+fd_kind+":"+str(count),flush=True)
              print("PACKAGE_MANAGER_BLOCKER_CLASSES="+",".join(
                  str(k)+":"+str(v) for k,v in sorted(active_counts.items())),flush=True)
          apply=os.environ.get("CACHE_CLEANUP_MODE")=="apply"
          print("CACHE_APPLY="+str(apply),flush=True)
          # Inspect every current-user process, not just command names, for an
          # open handle or cwd in a candidate cache. On uncertain visibility,
          # skip deletion of ALL candidates.
          references={rel:0 for rel in paths}
          incomplete=0
          uid=os.geteuid()
          for procdir in Path("/proc").iterdir():
              if not procdir.name.isdigit():
                  continue
              try:
                  if procdir.stat().st_uid != uid:
                      continue
              except (FileNotFoundError,ProcessLookupError):
                  continue
              except OSError:
                  incomplete+=1
                  continue
              try:
                  cwd=os.readlink(procdir/"cwd")
                  for rel in paths:
                      root=str(home/rel)
                      if cwd==root or cwd.startswith(root+"/"):
                          references[rel]+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  incomplete+=1
              try:
                  for fd in (procdir/"fd").iterdir():
                      try:
                          target=os.readlink(fd)
                      except FileNotFoundError:
                          continue
                      except OSError:
                          incomplete+=1
                          continue
                      for rel in paths:
                          root=str(home/rel)
                          if target==root or target.startswith(root+"/"):
                              references[rel]+=1
              except FileNotFoundError:
                  pass
              except OSError:
                  incomplete+=1
          print("CACHE_PROC_INSPECTION_INCOMPLETE="+str(incomplete),flush=True)
          total=0
          freed=0
          for rel in paths:
              p=home/rel
              if not p.exists():
                  print("CACHE_ABSENT="+rel,flush=True)
                  continue
              if p.is_symlink() or not p.is_dir() or p.resolve()!=p:
                  raise RuntimeError("CACHE_PATH_UNSAFE")
              for ancestor in (p.parent,p):
                  if ancestor.is_symlink() or ancestor.stat().st_uid!=uid:
                      raise RuntimeError("CACHE_COMPONENT_UNSAFE")
              before=subprocess.run(["du","-sk",str(p)],capture_output=True,text=True,timeout=40,check=True)
              size=int(before.stdout.split()[0])*1024
              print("CACHE_CANDIDATE="+rel+" bytes_du="+str(size),flush=True)
              total+=size
              is_npm=rel.startswith(".npm/")
              busy=(any(k.startswith("npm") or k in ("npx","pnpm","yarn") for k in active_counts)
                    if is_npm else
                    (bool(active_counts.get("pip")) if rel==".cache/pip" else bool(active_counts.get("gradle"))))
              if busy or references[rel] or incomplete:
                  why=("package-manager-active" if busy else "cache-open-or-cwd" if references[rel] else "proc-visibility-incomplete")
                  print("CACHE_HELD="+rel+" reason="+why+" refs="+str(references[rel]),flush=True)
                  continue
              print("CACHE_ELIGIBLE="+rel+" bytes_du="+str(size),flush=True)
              if apply:
                  # Re-inspect process occupancy just before a bounded removal.
                  # No production app, database, or backup path is ever targeted.
                  for procdir in Path("/proc").iterdir():
                      if not procdir.name.isdigit():
                          continue
                      try:
                          if procdir.stat().st_uid!=uid:
                              continue
                          cwd=os.readlink(procdir/"cwd")
                          if cwd==str(p) or cwd.startswith(str(p)+"/"):
                              raise RuntimeError("CACHE_BECAME_IN_USE")
                          for fd in (procdir/"fd").iterdir():
                              try:
                                  target=os.readlink(fd)
                              except FileNotFoundError:
                                  continue
                              if target==str(p) or target.startswith(str(p)+"/"):
                                  raise RuntimeError("CACHE_BECAME_IN_USE")
                      except FileNotFoundError:
                          continue
                      except RuntimeError:
                          raise
                      except OSError:
                          raise RuntimeError("CACHE_PROCESS_CHECK_FAILED")
                  shutil.rmtree(p)
                  if p.exists():
                      raise RuntimeError("CACHE_REMOVE_INCOMPLETE")
                  freed+=size
                  print("CACHE_DELETED="+rel+" bytes_du="+str(size),flush=True)
          print("CACHE_CANDIDATE_BYTES="+str(total),flush=True)
          print("CACHE_FREED_BYTES="+str(freed),flush=True)
          if apply and freed==0:
              print("CACHE_NO_SAFE_RECLAIM=true",flush=True)
          PY
          echo 'POST_CACHE_CPANEL_QUOTA'
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=json Quota get_quota_info 2>/dev/null | python3 -c 'import json,sys; j=json.load(sys.stdin).get("result",{}).get("data",{});print("POST_CACHE_MB_USED="+str(j.get("megabytes_used")));print("POST_CACHE_MB_LIMIT="+str(j.get("megabyte_limit")))' || true
          fi
          REMOTE
      - name: Checkout verified relocation program
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_action == 'migrate_backup' }}
        uses: actions/checkout@v4
      - name: Relocate two pinned root backups after VPS SHA256 verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_action == 'migrate_backup' }}
        shell: bash
        env:
          CONFIRM_BACKUP_RELOCATION: ${{ inputs.confirm_backup_relocation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_BACKUP_RELOCATION" != "true" ]]; then
            echo "ARCHIVE_RELOCATION_BLOCKED_EXPLICIT_CONFIRMATION_REQUIRED"
            exit 8
          fi
          python3 tools/cpanel_backup_archive_relocate.py
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel 'uapi --output=json Quota get_quota_info' | python3 -c 'import json,sys;j=json.load(sys.stdin).get("result",{}).get("data",{});print("AFTER_ARCHIVE_MB_USED="+str(j.get("megabytes_used")));print("AFTER_ARCHIVE_MB_LIMIT="+str(j.get("megabyte_limit")))'
      - name: Clear only stale user logs and temporary files
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.cleanup_action }}
          CONFIRM_DISPOSABLE_ONLY: ${{ inputs.confirm_disposable_only }}
        run: |
          set -euo pipefail
          mode=preview
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_ACTION:-preview}" == "apply" ]]; then
            [[ "${CONFIRM_DISPOSABLE_ONLY:-false}" == "true" ]] || { echo "STALE_CLEANUP_BLOCKED_EXPLICIT_CONFIRMATION_REQUIRED"; exit 8; }
            mode=apply
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ github.event.head_commit.message }}" == "ops: execute bounded stale cleanup" ]]; then
            mode=apply
          fi
          echo "STALE_CLEANUP_MODE=$mode"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          for host in saeit-cpanel saeit-vps; do
            ssh -F "$d/config" "$host" "STALE_CLEANUP_MODE=$mode python3 - <<'PY'
          import os, shutil, stat, time
          from pathlib import Path
          home=Path.home()
          mode=os.environ.get('STALE_CLEANUP_MODE','preview')
          if home != Path('/home/zomorod2') and home.name != 'githubops':
              raise SystemExit('STALE_CLEANUP_HOME_UNEXPECTED')
          candidates=[home/'.npm/_logs', home/'tmp']
          uid=os.geteuid()
          now=time.time()
          cutoff=now-30*86400
          for root in candidates:
              if not root.exists():
                  print('STALE_TARGET_ABSENT='+str(root),flush=True); continue
              if root.is_symlink() or not root.is_dir() or root.stat().st_uid!=uid:
                  print('STALE_TARGET_UNSAFE_SKIP='+str(root),flush=True); continue
              busy=False
              for proc in Path('/proc').iterdir():
                  if not proc.name.isdigit(): continue
                  try:
                      if proc.stat().st_uid!=uid: continue
                      refs=[]
                      try: refs.append(os.readlink(proc/'cwd'))
                      except OSError: pass
                      try:
                          for fd in (proc/'fd').iterdir():
                              try: refs.append(os.readlink(fd))
                              except OSError: pass
                      except OSError: pass
                      base=str(root)
                      if any(r==base or r.startswith(base+'/') for r in refs):
                          busy=True; break
                  except OSError:
                      busy=True; break
              if busy:
                  print('STALE_TARGET_HELD='+str(root),flush=True); continue
              found=0; eligible=0; deleted=0; bytes_freed=0
              for dirpath,dirs,files in os.walk(root,topdown=True,followlinks=False):
                  dirs[:]=[d for d in dirs if not (Path(dirpath)/d).is_symlink()]
                  for name in files:
                      p=Path(dirpath)/name
                      try:
                          s=p.lstat()
                          if not stat.S_ISREG(s.st_mode) or s.st_uid!=uid: continue
                          found+=1
                          if s.st_mtime>=cutoff: continue
                          eligible+=1
                          if mode=='apply':
                              p.unlink()
                              deleted+=1; bytes_freed+=s.st_size
                      except FileNotFoundError: pass
                      except OSError: pass
              print('STALE_TARGET='+str(root)+':FILES='+str(found)+':ELIGIBLE='+str(eligible)+':DELETED='+str(deleted)+':BYTES_FREED='+str(bytes_freed),flush=True)
          PY"
          done
      - name: Public smoke after cache cleanup
        shell: bash
        run: |
          for path in / /agents/; do
            status="$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir$path" || true)"
            echo "CACHE_POST_HEALTH=$path:$status"
            test "$status" = 200
          done
      - name: Remove runner SSH identities
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
# Preview by default; apply only with explicit confirmation, bounded cache paths and live process guard.
