name: MojPlayWin active store route safety inspection
# Read-only post-deployment audit 2026-10-24: verify route and public origin after store update.
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-active-store-actual-template-preflight.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Read exact active template and Apache route hashes
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/home/zomorod2/Saeit-staging')
          site=Path('/home/zomorod2/mojplaywin.com')
          app=root/'core/templates/mojplaywin/store.html'
          ht=site/'.htaccess'
          wsgi=site/'passenger_wsgi.py'
          if root.is_symlink() or not root.is_dir() or site.is_symlink() or not site.is_dir():
              raise SystemExit('MPW_ROOT_UNSAFE')
          if not app.is_file() or app.is_symlink() or not ht.is_file() or ht.is_symlink():
              raise SystemExit('MPW_TEMPLATE_OR_HTACCESS_UNSAFE')
          if not wsgi.is_file() or wsgi.is_symlink():
              raise SystemExit('MPW_WSGI_UNSAFE')
          raw=app.read_bytes()
          rawht=ht.read_bytes()
          prefix=b'RewriteCond %{REQUEST_URI} ^/(store|games|ai|'
          matches=[line.decode('utf8','replace').strip() for line in rawht.splitlines() if prefix in line]
          print('MPW_STORE_TEMPLATE='+json.dumps({'sha':hashlib.sha256(raw).hexdigest(),'size':len(raw)}))
          print('MPW_STORE_HTACCESS='+json.dumps({'sha':hashlib.sha256(rawht).hexdigest(),'size':len(rawht),'route_count':len(matches),'route_lines':matches}))
          print('MPW_STORE_WSGI='+json.dumps({'uses_app':"APP='/home/zomorod2/Saeit-staging'" in wsgi.read_text('utf8','replace')}))
          if len(matches)!=1:
              raise SystemExit('EXPECTED_EXACTLY_ONE_STORE_ROUTE_RULE')
          PY
      - name: Confirm public store currently follows the old route
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          url='https://mojplaywin.com/store/?__route_audit=20261024'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MPWRouteAudit/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read(400000)
              print('MPW_STORE_PUBLIC='+json.dumps({'status':r.status,'bytes':len(body),'has_old_catalog':b'INITIAL COLLECTION' in body,'has_new_catalog':b'Shop available books' in body,'cache_control':r.headers.get('Cache-Control')}))
          except urllib.error.HTTPError as e:
            print('MPW_STORE_PUBLIC='+json.dumps({'status':e.code}))
            raise
          PY
