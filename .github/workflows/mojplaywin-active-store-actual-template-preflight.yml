name: MojPlayWin active store template exact safety inspection
# Read-only hash refresh requested 2026-10-24 after source mismatch gate.
on:
  push:
    branches: [main]
    paths: [".github/workflows/mojplaywin-active-store-actual-template-preflight.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect active staging store template without mutations
        run: |
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 60s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path('/home/zomorod2/Saeit-staging')
          path=root/'core/templates/mojplaywin/store.html'
          incoming=root/'core/templates/mojplaywin/store_ten_buyer_guides_20261018.html'
          wsgi=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py')
          if not root.is_dir() or root.is_symlink():raise SystemExit("APP_NOT_SAFE")
          m={'active_app_exists':True,
            'store_exists':path.is_file(),'store_symlink':path.is_symlink(),
            'guide_exists':incoming.exists(),'guide_symlink':incoming.is_symlink(),
            'app_manage_py':(root/'manage.py').is_file(),
            'wsgi_uses_app':"APP='/home/zomorod2/Saeit-staging'" in wsgi.read_text('utf8','replace')}
          if path.is_file() and not path.is_symlink():
            s=path.read_text('utf-8','replace')
            m.update({'store_sha':hashlib.sha256(path.read_bytes()).hexdigest(),
               'store_chars':len(s),'expected_mw_catalog':'INITIAL COLLECTION' in s,
               'has_existing_guides':'store_ten_buyer_guides_20261018' in s,
               'first_450':s[:450], 'last_900':s[-900:],
               'starts_django_base':s.lstrip().startswith('{% extends "base.html" %}')})
          print("MPW_STORE_ACTUAL_TEMPLATE_STATE="+json.dumps(m))
          PY
