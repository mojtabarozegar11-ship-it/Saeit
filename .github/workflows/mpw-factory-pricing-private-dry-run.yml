name: MojPlayWin private factory 90 percent priced draft dry-run
on:
  push:
    branches: [feature/factory-fair-90pct-pricing-20261014]
    paths:
      - .github/workflows/mpw-factory-pricing-private-dry-run.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dry-run conservative price application on the real verified cPanel factory receipt records
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-readonly-host"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/vps.key" "$d/host.key" <<'PY'
          from pathlib import Path
          import sys
          for name in sys.argv[1:]:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n").strip().replace("\\n", "\n") + "\n")
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host host
            HostName zohal.pws-dns.net
            Port 1396
            User zomorod2
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump relay
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
          EOF
          timeout 30s ssh -F "$d/config" relay 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 50s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "zomorod2"
          umask 077
          folder="$HOME/.mpw-factory-fair-pricing-qa"
          test ! -L "$folder"
          if test ! -d "$folder"; then mkdir -m 700 "$folder"; fi
          test -d "$folder" && chmod 700 "$folder"
          REMOTE
          tar -C "$GITHUB_WORKSPACE" -cf - \
            scripts/factory_fair_90pct_pricing.py \
            scripts/factory_apply_verified_pricing.py \
            pricing/factory_2026-10-14_valuation.json \
            | timeout 85s ssh -F "$d/config" host \
              'tar -xf - -C "$HOME/.mpw-factory-fair-pricing-qa"'
          timeout 110s ssh -F "$d/config" host 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          export DJANGO_SETTINGS_MODULE=config.settings
          export PYTHONPATH="$HOME/Saeit-staging"
          export PYTHONDONTWRITEBYTECODE=1
          cd "$HOME/Saeit-staging"
          "$HOME/virtualenv/Saeit-staging/3.11/bin/python" \
            "$HOME/.mpw-factory-fair-pricing-qa/scripts/factory_apply_verified_pricing.py"
          echo MPW_FACTORY_PRICE_REAL_DB_DRY_RUN_COMPLETE=True
          REMOTE
      - name: Erase runner-only transient SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-readonly-host"
