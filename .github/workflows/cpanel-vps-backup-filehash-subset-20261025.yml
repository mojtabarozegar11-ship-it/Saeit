name: cPanel and VPS immutable backup file SHA census READ ONLY
on:
  pull_request:
    paths:
      - .github/workflows/cpanel-vps-backup-filehash-subset-20261025.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Compare backed up file bytes cryptographically without copying content
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-incomplete-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          timeout 280s ssh -T -F "$d/config" saeit-cpanel python3 - > "$d/cpanel-digest.json" <<'PYCP'
          from pathlib import Path
          import os,hashlib,json,stat
          root=Path('/home/zomorod2/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b')
          if os.geteuid()==0 or str(Path.home())!='/home/zomorod2' or not root.is_dir() or root.is_symlink():
              raise SystemExit('UNSAFE_MIRROR_ROOT')
          root_device=root.stat().st_dev
          files={}
          symlinks=0
          for here,dirs,names in os.walk(str(root),followlinks=False):
              for name in list(dirs):
                  p=Path(here)/name
                  st=p.lstat()
                  if st.st_dev!=root_device:raise SystemExit('BACKUP_CONTAINS_MOUNT')
                  if stat.S_ISLNK(st.st_mode):
                      rel=str(p.relative_to(root))
                      pathid=hashlib.sha256(rel.encode('utf-8')).hexdigest()
                      files[pathid]=[0,hashlib.sha256(('link:'+os.readlink(p)).encode('utf-8')).hexdigest()]
                      dirs.remove(name)
                      symlinks+=1
              for name in names:
                  p=Path(here)/name
                  st=p.lstat()
                  if st.st_dev!=root_device:raise SystemExit('BACKUP_CONTAINS_MOUNT')
                  rel=str(p.relative_to(root))
                  pathid=hashlib.sha256(rel.encode('utf-8')).hexdigest()
                  if stat.S_ISLNK(st.st_mode):
                      files[pathid]=[0,hashlib.sha256(('link:'+os.readlink(p)).encode('utf-8')).hexdigest()]
                      symlinks+=1
                  elif stat.S_ISREG(st.st_mode):
                      dig=hashlib.sha256()
                      with p.open('rb') as stream:
                          for chunk in iter(lambda:stream.read(1024*1024),b''):dig.update(chunk)
                      files[pathid]=[st.st_size,dig.hexdigest()]
                  else:raise SystemExit('SPECIAL_BACKUP_FILE')
          print(json.dumps({'count':len(files),'bytes':sum(v[0] for v in files.values()),'symlinks':symlinks,'files':files,'read_only':True},sort_keys=True))
          PYCP
          timeout 280s ssh -T -F "$d/config" saeit-vps 'PYTHONDONTWRITEBYTECODE=1 python3 -' > "$d/vps-digest.json" <<'PYVP'
          from pathlib import Path
          import os,hashlib,json,stat
          root=Path('/home/githubops/offsite-zomorod-20261018/archive/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b')
          if os.geteuid()==0 or str(Path.home())!='/home/githubops' or not root.is_dir() or root.is_symlink():
              raise SystemExit('UNSAFE_MIRROR_ROOT')
          root_device=root.stat().st_dev
          files={}
          symlinks=0
          for here,dirs,names in os.walk(str(root),followlinks=False):
              for name in list(dirs):
                  p=Path(here)/name
                  st=p.lstat()
                  if st.st_dev!=root_device:raise SystemExit('BACKUP_CONTAINS_MOUNT')
                  if stat.S_ISLNK(st.st_mode):
                      rel=str(p.relative_to(root))
                      pathid=hashlib.sha256(rel.encode('utf-8')).hexdigest()
                      files[pathid]=[0,hashlib.sha256(('link:'+os.readlink(p)).encode('utf-8')).hexdigest()]
                      dirs.remove(name)
                      symlinks+=1
              for name in names:
                  p=Path(here)/name
                  st=p.lstat()
                  if st.st_dev!=root_device:raise SystemExit('BACKUP_CONTAINS_MOUNT')
                  rel=str(p.relative_to(root))
                  pathid=hashlib.sha256(rel.encode('utf-8')).hexdigest()
                  if stat.S_ISLNK(st.st_mode):
                      files[pathid]=[0,hashlib.sha256(('link:'+os.readlink(p)).encode('utf-8')).hexdigest()]
                      symlinks+=1
                  elif stat.S_ISREG(st.st_mode):
                      dig=hashlib.sha256()
                      with p.open('rb') as stream:
                          for chunk in iter(lambda:stream.read(1024*1024),b''):dig.update(chunk)
                      files[pathid]=[st.st_size,dig.hexdigest()]
                  else:raise SystemExit('SPECIAL_BACKUP_FILE')
          print(json.dumps({'count':len(files),'bytes':sum(v[0] for v in files.values()),'symlinks':symlinks,'files':files,'read_only':True},sort_keys=True))
          PYVP
          python3 - "$d/cpanel-digest.json" "$d/vps-digest.json" <<'PYCMP'
          import sys,json
          with open(sys.argv[1]) as f:a=json.load(f)
          with open(sys.argv[2]) as f:b=json.load(f)
          fa,fb=a['files'],b['files']
          same=[k for k,v in fa.items() if fb.get(k)==v]
          different=[k for k,v in fa.items() if k in fb and fb[k]!=v]
          absent=[k for k in fa if k not in fb]
          report={'cpanel_file_count':a['count'],'cpanel_content_bytes':a['bytes'],'cpanel_symlinks':a['symlinks'],
          'vps_file_count':b['count'],'vps_content_bytes':b['bytes'],'vps_symlinks':b['symlinks'],
          'exact_mirror_file_count':len(same),'exact_mirror_content_bytes':sum(fa[k][0] for k in same),
          'changed_content_file_count':len(different),'changed_content_bytes':sum(fa[k][0] for k in different),
          'missing_from_vps_file_count':len(absent),'missing_from_vps_bytes':sum(fa[k][0] for k in absent),
          'cpanel_fully_covered':len(same)==len(fa),'mutations':0,'read_only':True}
          print('CPANEL_VPS_OFFSITE_FILEHASH_COMPARISON='+json.dumps(report,sort_keys=True),flush=True)
          PYCMP
          rm -f -- "$d/cpanel-digest.json" "$d/vps-digest.json"
          echo CPANEL_OFFSITE_HASH_READONLY=PASS
