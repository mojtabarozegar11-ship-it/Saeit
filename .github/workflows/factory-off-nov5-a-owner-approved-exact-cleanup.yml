name: Factory OFF Nov5-A exact raw cleanup after successful isolated restore
on:
  pull_request:
    paths:
      - '.github/workflows/factory-off-nov5-a-owner-approved-exact-cleanup.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: factory-one-raw-exact-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  all-gates:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mojtabarozegar11-ship-it'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable exact code, seven fail-closed offline cases and previous real isolated restore
        shell: bash
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/factory_cpanel_nov5_a_exact_cleanup_20261118.py)" = '67cba308918ee15326368bd8cc23f2a88a9b0718'
          test "$(git hash-object tests/test_factory_cpanel_nov5_a_exact_cleanup_20261118.py)" = '904ee3846882ce8070cd9968aa4665a944f21a05'
          test "$(git hash-object scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py)" = '81e79c7bb29f2c367f665eb16e11b2e7478fb453'
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_factory_cpanel_nov5_a_exact_cleanup_20261118.py' -q
          python3 -B - <<'PY'
          import json,os,urllib.request
          if not os.environ.get('GH_ACTIONS_READ_TOKEN'):raise SystemExit("READ_ACTION_TOKEN_MISSING")
          root='https://api.github.com/repos/mojtabarozegar11-ship-it/Saeit'
          for url,kind in [
              (root+'/actions/runs/44228450886','run'),
              (root+'/actions/jobs/134547324197','job')]:
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+os.environ['GH_ACTIONS_READ_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'factory-onefile-owner-cleanup-readonly'
              },method='GET')
              with urllib.request.urlopen(req,timeout=25) as response:
                  if response.status!=200:raise SystemExit("RESTORE_PROOF_NOT_READABLE")
                  data=json.loads(response.read(160000))
              if data.get('status')!='completed' or data.get('conclusion')!='success':
                  raise SystemExit("RESTORE_PROOF_NOT_SUCCESS")
              if kind=='run' and data.get('head_sha')!='c5131b703db82885a164c99ad9463042c32006cc':
                  raise SystemExit("WRONG_PINNED_RESTORE_COMMIT")
              if kind=='job' and data.get('run_id')!=44228450886:
                  raise SystemExit("WRONG_RESTORE_JOB_ORIGIN")
          print('OWNER_PINNED_HISTORICAL_GZIP_INDEPENDENT_RESTORE_SUCCESS=true')
          PY
          echo EXACT_CLEANUP_PRECONDITIONS_OFFLINE_PASS=true
  unlink-only-nov5-a-raw:
    needs: all-gates
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Before unlink, independently re-check BOTH original VPS historical SQLite files
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0 || { echo OWNER_NONROOT_REQUIRED; exit 78; }
          test -n "$VPS_KEY" && test -n "$HOST_KEY" || { echo OWNER_KEYS_MISSING; exit 78; }
          test "$(git hash-object scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py)" = '81e79c7bb29f2c367f665eb16e11b2e7478fb453'
          test "$(git hash-object scripts/factory_cpanel_nov5_a_exact_cleanup_20261118.py)" = '67cba308918ee15326368bd8cc23f2a88a9b0718'
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$work/cpanel.key"
          chmod 600 "$work/"*.key
          ssh-keygen -y -P "" -f "$work/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$work/cpanel.key" >/dev/null
          ssh-keyscan -T 8 -t rsa 127.0.0.1 > "$work/vps.known" 2>/dev/null
          test -s "$work/vps.known"
          test "$(ssh-keygen -lf "$work/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$work/config" <<EOF
          Host saeit-vps
            HostName 127.0.0.1
            User githubops
            Port 22
            IdentityFile $work/vps.key
            UserKnownHostsFile $work/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $work/cpanel.key
            UserKnownHostsFile $work/cpanel.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$work/config"
          scan="$(ssh -T -F "$work/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$work/cpanel.known"
          chmod 600 "$work/cpanel.known" "$work/vps.known"
          test "$(ssh-keygen -lf "$work/cpanel.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          timeout 780s ssh -T -F "$work/config" saeit-vps 'exec python3 -B -' < scripts/factory_vps_nov5_sqlite_integrity_readonly_20261118.py
          echo FACTORY_BOTH_VPS_ORIGINALS_FRESH_SHA_AND_SQLITE_INTEGRITY=PASS
          timeout 780s ssh -T -F "$work/config" saeit-cpanel 'exec nice -n 15 python3 -B - --approval OWNER_DELEGATED_2026-11-18_EXACT_NOV5_A_AFTER_ISOLATED_RESTORE' < scripts/factory_cpanel_nov5_a_exact_cleanup_20261118.py
          echo FACTORY_EXACT_RAW_NOV5_A_CLEANUP_COMPLETED=true
          echo FACTORY_NOV5_B_RAW_UNCHANGED=true
          echo FACTORY_PRODUCTION_DATABASE_UNTOUCHED=true
          echo FACTORY_STARTED=false
