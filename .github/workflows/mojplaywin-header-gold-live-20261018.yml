name: MojPlayWin gold search header - isolated live HTML repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mojplaywin-header-gold-live-20261018.yml
      - scripts/mojplaywin_home_header_golden_live_20261018.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mojplaywin-static-header-repair-20261018
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate surgical patch offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mojplaywin_home_header_golden_live_20261018.py
          python3 scripts/mojplaywin_home_header_golden_live_20261018.py selftest
      - name: Baseline public homepage and store
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          for uri in ('/','/store/','/ai/'):
            req=urllib.request.Request('https://mojplaywin.com'+uri, headers={'User-Agent':'MPWGoldHeaderPreflight/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as res:
              assert res.status==200, (uri,res.status)
              content=res.read(1500000).decode('utf8','replace')
              assert len(content)>4000
              print('PRE_REPAIR_ROUTE_OK='+uri,flush=True)
              if uri=='/':
                assert 'mpw-home-ten-guides' in content and 'Mojtaba Roozegar' in content
                assert 'mpw-top-search-gold-20261018' not in content
          PY
      - name: Prepare pinned VPS relay to exact cPanel account
        id: relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-gold-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "MPW_PINNED_RELAY_READY=yes"
      - name: Stage only gold header patch to private temporary directory
        shell: bash
        run: |
          set -euo pipefail
          stage="/home/zomorod2/.mpw-gold-header-$GITHUB_RUN_ID"
          ssh -T -F "$RUNNER_TEMP/mpw-gold-ssh/config" saeit-cpanel "test ! -e '$stage' && test ! -L '$stage' && install -d -m 700 '$stage'"
          cat scripts/mojplaywin_home_header_golden_live_20261018.py | ssh -T -F "$RUNNER_TEMP/mpw-gold-ssh/config" saeit-cpanel "cat > '$stage/patch.py'"
          ssh -T -F "$RUNNER_TEMP/mpw-gold-ssh/config" saeit-cpanel "test -s '$stage/patch.py' && python3 '$stage/patch.py' selftest"
      - name: Patch just active homepage HTML with verified original backup
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/mpw-gold-ssh/config" saeit-cpanel "python3 '/home/zomorod2/.mpw-gold-header-$GITHUB_RUN_ID/patch.py' apply '$GITHUB_RUN_ID'"
      - name: Verify public gold search and unchanged store routes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time,urllib.request
          suffix='?__mpw_gold_header='+os.environ['GITHUB_RUN_ID']
          for attempt in range(1,6):
            req=urllib.request.Request('https://mojplaywin.com/'+suffix+str(attempt),headers={'Cache-Control':'no-cache,no-store','User-Agent':'MPWGoldHeaderSmoke/1.0'})
            with urllib.request.urlopen(req,timeout=25) as res:
              body=res.read(1500000).decode('utf8','replace')
              assert res.status==200
            header=body.find('<header class="mw-site-nav"')
            control=body.find('id="mpw-top-search-gold-20261018"')
            header_end=body.find('</header>',header)
            footer=body.rfind('<footer class="mw-site-footer"')
            valid=(0<=header<control<header_end<footer and body.count('id="mpw-top-search-gold-20261018"')==1
                 and 'action="/search/"' in body and 'Enter Store ↗' in body
                 and 'background:linear-gradient(145deg,#f8e4a8,#d7a746)' in body
                 and 'mpw-home-ten-guides' in body and 'Mojtaba Roozegar' in body
                 and 'mpw-17x20-mainonly-autostart' in body)
            print('GOLD_HOME_PUBLIC_CHECK attempt='+str(attempt)+' success='+str(valid)+' response_length='+str(len(body)),flush=True)
            if valid: break
            if attempt==5: raise SystemExit('Patched header is not visible on public MojPlayWin')
            time.sleep(2)
          for uri in ('/store/','/ai/'):
            req=urllib.request.Request('https://mojplaywin.com'+uri,headers={'User-Agent':'MPWGoldHeaderSmoke/1.0'})
            with urllib.request.urlopen(req,timeout=20) as res:
              assert res.status==200
              assert len(res.read(1500000))>4000
            print('POST_REPAIR_ROUTE_UNCHANGED='+uri,flush=True)
          print('MOJPLAYWIN_GOLD_HEADER_PUBLICLY_VERIFIED=yes',flush=True)
          PY
      - name: Automatically rollback if any post-apply step fails
        if: failure() && steps.relay.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-gold-ssh"
          stage="/home/zomorod2/.mpw-gold-header-$GITHUB_RUN_ID"
          backup="/home/zomorod2/.mojplaywin-backups/mpw-gold-search-$GITHUB_RUN_ID/manifest.json"
          ssh -T -F "$d/config" saeit-cpanel "if test -f '$backup' && test -f '$stage/patch.py'; then python3 '$stage/patch.py' rollback '$GITHUB_RUN_ID'; else echo 'NO_APPLIED_BACKUP_TO_ROLLBACK'; fi"
      - name: Remove staging and SSH material but preserve verified backup
        if: always()
        shell: bash
        run: |
          set +e
          d="$RUNNER_TEMP/mpw-gold-ssh"
          if test -f "$d/config"; then
            ssh -T -F "$d/config" saeit-cpanel "rm -f -- '/home/zomorod2/.mpw-gold-header-$GITHUB_RUN_ID/patch.py' && rmdir '/home/zomorod2/.mpw-gold-header-$GITHUB_RUN_ID'" || true
          fi
          rm -rf -- "$d"
