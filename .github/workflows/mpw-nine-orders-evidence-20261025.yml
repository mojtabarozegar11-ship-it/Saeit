name: MojPlayWin nine pending orders evidence
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mpw-nine-orders-evidence-20261025.yml"
permissions: {contents: read}
concurrency:
  group: mpw-sales-funnel-read-only-audit
  cancel-in-progress: false
jobs:
  audit-live:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only audit source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,pathlib
          p=pathlib.Path("scripts/mpw_guest_trx_core_scope_readonly_20261020.py")
          ast.parse(p.read_text("utf8"))
          source=p.read_text("utf8")
          assert "production_db_writes\":False" in source
          assert "MPW_LIVE_ORDER_AGGREGATE=" in source
          print("MPW_AUDIT_SOURCE_VALID=true")
          PY
      - name: Establish pinned SSH relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-sales-audit-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Inspect all existing pending invoices without financial writes
        run: |
          set -euo pipefail
          timeout 240s ssh -T -F "$RUNNER_TEMP/mpw-sales-audit-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,re,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/home/zomorod2/Saeit-staging')
          os.chdir(root);sys.path.insert(0,str(root));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Order,PaymentIntent
          from services.mpw_walletless_commercial_intent import PROVIDER,WAITING,_decode
          from services.mpw_tron_readonly_deposit_candidates import find_candidate_hashes
          from services.mpw_trx_reconcile_cursor import read_cursor,pick_pending_page
          from services.mpw_trx_commercial_chain import read_only_independent_pair
          from django.db import connection
          connection.ensure_connection()
          with connection.cursor() as c:c.execute('SET SESSION TRANSACTION READ ONLY')
          now=datetime.now(timezone.utc)
          queued=list(PaymentIntent.objects.filter(provider=PROVIDER,status=WAITING).select_related('order__customer').order_by('pk')[:100])
          print('MPW_NINE_SUMMARY='+json.dumps({'pending_native_trx':len(queued),'orders_total':Order.objects.count(),'read_only':True,'at':now.isoformat()}))
          try:
           cursor=read_cursor(Path('/home/zomorod2/.local/share'))
           one=pick_pending_page(PaymentIntent,PROVIDER,WAITING,cursor,6)
           two=pick_pending_page(PaymentIntent,PROVIDER,WAITING,one[-1].pk if one else 0,6)
           print('MPW_QUEUE_COVERAGE='+json.dumps({'two_cycles_cover_all':{x.pk for x in queued}.issubset({x.pk for x in one+two}),'pending':len(queued)}))
          except Exception as e:print('MPW_QUEUE_ERROR='+type(e).__name__)
          try:
           read_only_independent_pair();print('MPW_DUAL_NODE_READY=true')
          except Exception as e:print('MPW_DUAL_NODE_ERROR='+type(e).__name__)
          for n,item in enumerate(queued,1):
           row={'ordinal':n,'order_status':item.order.status,'created_day':item.order.created_at.date().isoformat()}
           u=item.order.customer
           row['staff_account']=bool(u.is_staff or u.is_superuser)
           label=str(u.get_username())+' '+str(getattr(u,'email',''))
           row['test_marker']=bool(re.search(r'example\.(invalid|com)|mpw-smoke-|testbuyer|smoketest|mpw-test|checkout-test|audit-test',label,re.I))
           try:
            inv=_decode(item);row['invoice_day']=inv.issued_at.date().isoformat();row['expired']=now>inv.expires_at
            hits=find_candidate_hashes(inv.recipient,inv.amount_sun,inv.issued_at,inv.expires_at)
            row['matching_confirmed_transfer_count']=len(hits)
           except Exception as e:row['lookup_error']=type(e).__name__;row['cause_type']=type(e.__cause__).__name__ if e.__cause__ else None
           print('MPW_ORDER_EVIDENCE='+json.dumps(row,sort_keys=True),flush=True)
          cron=root/'scripts/mpw_trx_commercial_reconcile_cron.py'
          s=cron.read_text();print('MPW_CURSOR_SOURCE='+json.dumps({'rotation': 'pick_pending_page' in s,'advances':'write_cursor' in s,'sha256':hashlib.sha256(s.encode()).hexdigest()}))
          PY
      - name: Remove relay keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-sales-audit-ssh"
