name: MojPlayWin fresh scoped GPG backup and isolated restore (owner-armed)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BACKUP_AND_ISOLATED_RESTORE (creates only private VPS ciphertext; production source read-only)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mojplaywin-fresh-private-backup-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complete_owner_armed_scoped_backup_and_restore:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'mojtabarozegar11-ship-it' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'BACKUP_AND_ISOLATED_RESTORE'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify strict source and GPG synthetic roundtrip before any production read
        shell: bash
        run: |
          set -euo pipefail
          command -v gzip
          command -v docker
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_gpg_v2.py'
          python3 -m unittest discover -s tests -p 'test_mojplaywin_recovery_isolated_once.py'
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_link_guard_20261101.py'
          python3 -m unittest discover -s tests -p 'test_mojplaywin_backup_pair_identity_20261101.py'
          python3 -m py_compile scripts/mojplaywin_backup_stream_cpanel.py scripts/mojplaywin_backup_encrypt_vps_gpg.py scripts/mojplaywin_recovery_stream_vps.py scripts/mojplaywin_restore_files_isolated_runner.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Preflight approved three public aliases and transactional CLI database (no dump)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/mojplaywin_backup_stream_cpanel.py)"
          call='import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))'
          timeout 120s ssh -T -F "$d/config" saeit-cpanel "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$src64' preflight-scoped-files"
          timeout 80s ssh -T -F "$d/config" saeit-cpanel "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$src64' preflight-mysql"
          echo "BACKUP_PREFLIGHT=PASSED; PASSENGER_DB_IDENTITY=NOT_PROVEN; RELEASE_PERMITTED=NO"
      - name: Require existing VPS recovery key and prepare unique explicit backup pair identity
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          probe64="$(base64 -w0 scripts/mpw_vps_backup_runtime_gate_readonly_20261101.py)"
          call='import base64,sys;payload=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(payload))'
          timeout 45s ssh -T -F "$d/config" saeit-vps "PYTHONDONTWRITEBYTECODE=1 python3 -B -c '$call' '$probe64' --require-ready"
          stem="mojplaywin_$(date -u +%Y%m%dT%H%M%SZ)_$(openssl rand -hex 8)"
          [[ "$stem" =~ ^mojplaywin_[0-9]{8}T[0-9]{6}Z_[0-9a-f]{16}$ ]]
          echo "MPW_BACKUP_SET_STEM=$stem" >> "$GITHUB_ENV"
          echo "OWNER_APPROVED_BACKUP_SET_ID=generated; NO_PRODUCTION_WRITES=YES"
      - name: Back up fresh MySQL transactionally using gzip-1 and private VPS GPG AES256
        shell: bash
        timeout-minutes: 105
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/mojplaywin_backup_stream_cpanel.py)"
          dst64="$(base64 -w0 scripts/mojplaywin_backup_encrypt_vps_gpg.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          echo "MYSQL_GPGV2_TRANSFER=started; transport=gzip-level1-before-SSH; destination=AES256-GPG; no plaintext files"
          # gzip is produced in the cPanel process and expanded only inside the VPS process.
          # Pipefail covers source mysql dump, gzip, ssh, gunzip and GPG archive verification.
          timeout 6000s ssh -T -F "$d/config" saeit-cpanel "bash -o pipefail -c \"python3 -c '$call' '$src64' mysql | gzip -1 -c\"" |
            timeout 6000s ssh -T -F "$d/config" saeit-vps "MPW_BACKUP_SET_STEM=$MPW_BACKUP_SET_STEM bash -o pipefail -c \"gzip -dc | python3 -c '$call' '$dst64' mysql\""
          echo "MYSQL_GPGV2_TRANSFER=verified_complete_new_name"
      - name: Back up fresh scoped file roots with public aliases materialized (no source write)
        shell: bash
        timeout-minutes: 70
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          src64="$(base64 -w0 scripts/mojplaywin_backup_stream_cpanel.py)"
          dst64="$(base64 -w0 scripts/mojplaywin_backup_encrypt_vps_gpg.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 3900s ssh -T -F "$d/config" saeit-cpanel "bash -o pipefail -c \"python3 -B -c '$call' '$src64' files | gzip -1 -c\"" |
            timeout 3900s ssh -T -F "$d/config" saeit-vps "MPW_BACKUP_SET_STEM=$MPW_BACKUP_SET_STEM bash -o pipefail -c \"gzip -dc | python3 -B -c '$call' '$dst64' files\""
          echo "SCOPED_FILES_GPGV2_TRANSFER=verified_complete; ORIGINAL_SOURCE_UNCHANGED=YES"
      - name: Demand exactly this new explicit GPG AES256 SQL plus files manifest pair
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          script64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          timeout 50s ssh -T -F "$d/config" saeit-vps "python3 -B -c '$call' '$script64' check-pair '$MPW_BACKUP_SET_STEM'"
      - name: Restore database on isolated temporary Docker with network disabled and restore app files to private runner
        shell: bash
        timeout-minutes: 110
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          stream64="$(base64 -w0 scripts/mojplaywin_recovery_stream_vps.py)"
          call="import base64,sys;code=sys.argv[1];sys.argv=[sys.argv[0]]+sys.argv[2:];exec(base64.b64decode(code))"
          label="mjwp-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_dir=""
          cleanup() {
            docker rm -f "$label" >/dev/null 2>&1 || true
            if [ -n "$restore_dir" ] && [[ "$restore_dir" == "$RUNNER_TEMP"/mojplaywin-restore-* ]]; then
              rm -rf -- "$restore_dir"
            fi
          }
          trap cleanup EXIT
          command -v docker >/dev/null
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$free" -ge 9000000000 || { echo "NO-GO: isolated runner free disk below 9GB"; exit 1; }
          docker pull mariadb:11.8.9 >/dev/null
          docker run -d --rm --name "$label" --network none \
            --memory 2g --cpus 2 --pids-limit 200 \
            --security-opt no-new-privileges \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 mariadb:11.8.9 >/dev/null
          ready=0
          for i in $(seq 1 90); do
            if docker exec "$label" mariadb-admin --no-defaults -uroot ping --silent >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo "NO-GO: isolated MariaDB container did not start"; exit 1; }
          echo "MariaDB sandbox ready: no published port, container network disabled"
          timeout 5500s ssh -T -F "$d/config" saeit-vps \
            "python3 -B -c '$call' '$stream64' mysql-pair '$MPW_BACKUP_SET_STEM'" |
            timeout 5500s docker exec -i "$label" mariadb --no-defaults -uroot --binary-mode
          table_count=$(docker exec "$label" mariadb --no-defaults -uroot --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA NOT IN ('mysql','performance_schema','information_schema','sys') AND TABLE_TYPE='BASE TABLE'")
          schema_count=$(docker exec "$label" mariadb --no-defaults -uroot --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name NOT IN ('mysql','performance_schema','information_schema','sys')")
          test "$table_count" -gt 0 && test "$schema_count" -gt 0 || { echo "NO-GO: restored database has no application schema/tables"; exit 1; }
          echo "Isolated MySQL restore passed; schemas=$schema_count application_tables=$table_count"
          docker rm -f "$label" >/dev/null
          echo "Temporary MariaDB removed before extracting files to reduce peak runner disk usage"
          restore_dir=$(mktemp -d "$RUNNER_TEMP/mojplaywin-restore-XXXXXXXX")
          chmod 700 "$restore_dir"
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$free" -ge 6000000000 || { echo "NO-GO: not enough room for isolated file restore"; exit 1; }
          timeout 5500s ssh -T -F "$d/config" saeit-vps \
            "python3 -B -c '$call' '$stream64' files-pair '$MPW_BACKUP_SET_STEM'" |
            timeout 5500s python3 scripts/mojplaywin_restore_files_isolated_runner.py "$restore_dir"
          echo "PASS: ciphertext verified by GPG+SHA256, SQL imported and queried in isolated MariaDB, both main filesystem roots extracted."
          echo "LIMIT: unknown independent subsites are NOT certified; backup key has no verified copy outside VPS."
          echo "LIMIT: test container and temporary plaintext restored files are being removed; production never written."
          {
            echo "## MojPlayWin verified primary-backup restore rehearsal"
            echo "- Encrypted GPGv2 archive source and SHA256 verified for SQL and files"
            echo "- SQL imported into GitHub-hosted temporary MariaDB container, **network none**, tables: $table_count"
            echo "- Both known app and public-web source roots restored into private temporary test directory"
            echo "- Production cPanel, Passenger, all live payments and independent child sites untouched"
            echo "- This is **NOT** complete recovery coverage for unknown child sites"
            echo "- **NO-GO** main-site redesign until separate backup-key escrow and tenant isolation are proven"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live store and the three customer checkout GET pages (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for url in https://mojplaywin.com/ https://mojplaywin.com/store/ https://mojplaywin.com/store/product/72/checkout/ https://mojplaywin.com/store/product/225/checkout/ https://mojplaywin.com/store/product/879/checkout/; do
            status="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "READONLY_SITE_STATUS=$status"
            test "$status" = 200
          done
          echo "MPW_NEW_PRIMARY_BACKUP_AND_ISOLATED_RESTORATION=VERIFIED"
          echo "MPW_PASSENGER_DB_IDENTITY=NOT_PROVEN"
          echo "MPW_RECOVERY_KEY_OFF_VPS=NOT_VERIFIED"
          echo "MPW_RELEASE_PERMITTED=NO"
          echo "TRX_PAYMENT_AND_PUBLIC_RELEASE=STILL_GATED_SEPARATELY"
