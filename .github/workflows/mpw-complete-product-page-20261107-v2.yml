name: MojPlayWin source-owned product template guarded release
on:
  workflow_dispatch:
    inputs:
      expected_source_sha256:
        description: Exact reviewed SHA-256 of the product.html source file
        required: true
        type: string
permissions: {contents: read}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin reviewed source before any host connection
        env:
          EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,re
          from pathlib import Path
          src=Path('core/templates/brands/mojplaywin/product.html')
          if not src.is_file() or src.is_symlink(): raise RuntimeError('SOURCE_MISSING_OR_SYMLINK')
          raw=src.read_bytes(); actual=hashlib.sha256(raw).hexdigest()
          expected=os.environ.get('EXPECTED_SOURCE_SHA256','').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{64}',expected) or actual!=expected: raise RuntimeError('SOURCE_SHA256_MISMATCH')
          contents=raw.decode('utf8')
          for required in ('product.pk == 72','product.pk == 225','product.pk == 879','server-side blockchain verification'):
              if required not in contents: raise RuntimeError('SOURCE_CONTRACT_MISMATCH')
          if '<script' in contents.lower(): raise RuntimeError('UNREVIEWED_SCRIPT_IN_TEMPLATE')
          print('REVIEWED_SOURCE_SHA256='+actual)
          PY
      - name: Relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; umask 077; d="$RUNNER_TEMP/r"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/v"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/h"
          chmod 600 "$d/"*; ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vk" 2>/dev/null; test "$(ssh-keygen -lf "$d/vk" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          printf 'Host v\n HostName 178.239.147.150\n User githubops\n IdentityFile %s\n UserKnownHostsFile %s\nHost h\n HostName 178.239.147.125\n User zomorod2\n Port 1396\n IdentityFile %s\n UserKnownHostsFile %s\n ProxyJump v\nHost *\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 10\n RequestTTY no\n' "$d/v" "$d/vk" "$d/h" "$d/hk" > "$d/c"
          timeout 30s ssh -F "$d/c" v 'ssh-keyscan -T 8 -p 1396 -t ed25519 178.239.147.125' > "$d/hk" 2>/dev/null; test "$(ssh-keygen -lf "$d/hk" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
      - name: Install full template and verify
        env:
          EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
        run: |
          set -Eeuo pipefail
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DEPLOYED=0
          INSTALL_ATTEMPTED=0
          rollback_if_needed() {
            previous=$?
            trap - ERR
            # SSH can disconnect after cPanel atomically replaces the template
            # but before its success response reaches the runner. A failed
            # install attempt therefore needs the same digest-guarded rollback
            # as a failed post-install check. An unchanged target is refused.
            if [ "$INSTALL_ATTEMPTED" = 1 ]; then
              timeout 120s ssh -T -F "$RUNNER_TEMP/r/c" h "EXPECTED_SOURCE_SHA256='$EXPECTED_SOURCE_SHA256' RELEASE_ID='$RELEASE_ID' /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import hashlib,os,re
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging');W=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py');T=A/'core/templates/brands/mojplaywin/product.html'
          release_id=os.environ['RELEASE_ID'];expected=os.environ['EXPECTED_SOURCE_SHA256'].lower()
          if not re.fullmatch(r'[0-9]+-[0-9]+',release_id): raise RuntimeError('INVALID_RELEASE_ID')
          backup=T.with_name('product.html.mpw-backup-'+release_id)
          if A.is_symlink() or W.is_symlink() or T.is_symlink() or backup.is_symlink() or not backup.is_file(): raise RuntimeError('UNTRUSTED_ROLLBACK_TARGET')
          if hashlib.sha256(T.read_bytes()).hexdigest()!=expected: raise RuntimeError('ROLLBACK_REFUSES_CHANGED_TARGET')
          previous=backup.read_bytes();rb=T.with_name('.mpw-rollback-'+release_id)
          fd=os.open(str(rb),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o640)
          with os.fdopen(fd,'wb') as f:f.write(previous);f.flush();os.fsync(f.fileno())
          os.replace(rb,T)
          for folder in (A/'tmp',W.parent/'tmp'):
              folder.mkdir(mode=0o700,exist_ok=True);flag=folder/'restart.txt';rfd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600);os.close(rfd);os.utime(flag,None)
          if T.read_bytes()!=previous: raise RuntimeError('ROLLBACK_CONTENT_MISMATCH')
          print('MPW_ROLLBACK_COMPLETE')
          PY
            fi
            exit "$previous"
          }
          trap rollback_if_needed ERR
          TEMPLATE_B64="$(base64 -w0 core/templates/brands/mojplaywin/product.html)"
          INSTALL_ATTEMPTED=1
          timeout 120s ssh -T -F "$RUNNER_TEMP/r/c" h "TEMPLATE_B64='$TEMPLATE_B64' EXPECTED_SOURCE_SHA256='$EXPECTED_SOURCE_SHA256' RELEASE_ID='$RELEASE_ID' /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,base64,hashlib,re
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging');W=Path('/home/zomorod2/mojplaywin.com/passenger_wsgi.py');T=A/'core/templates/brands/mojplaywin/product.html'
          if A.is_symlink() or W.is_symlink() or not T.is_file() or T.is_symlink() or "APP='/home/zomorod2/Saeit-staging'" not in W.read_text(errors='replace'): raise RuntimeError('UNTRUSTED_TARGET')
          release_id=os.environ['RELEASE_ID']
          if not re.fullmatch(r'[0-9]+-[0-9]+',release_id): raise RuntimeError('INVALID_RELEASE_ID')
          raw=base64.b64decode(os.environ['TEMPLATE_B64']);expected=os.environ['EXPECTED_SOURCE_SHA256'].lower()
          if hashlib.sha256(raw).hexdigest()!=expected: raise RuntimeError('TRANSFER_SHA256_MISMATCH')
          new=raw.decode('utf8')
          old=T.read_text('utf8'); backup=T.with_name('product.html.mpw-backup-'+release_id)
          if backup.exists():
              if backup.is_symlink() or backup.read_bytes()!=old.encode('utf8'): raise RuntimeError('UNTRUSTED_EXISTING_BACKUP')
          else:
              bfd=os.open(str(backup),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(bfd,'wb') as bf: bf.write(old.encode('utf8'));bf.flush();os.fsync(bf.fileno())
          os.chmod(backup,0o600)
          if hashlib.sha256(backup.read_bytes()).hexdigest()!=hashlib.sha256(old.encode()).hexdigest(): raise RuntimeError('BACKUP_INTEGRITY_FAILED')
          tmp=T.with_name('.mpw-full-v2');fd=os.open(str(tmp),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o640)
          try:
              with os.fdopen(fd,'w',encoding='utf8') as f:f.write(new);f.flush();os.fsync(f.fileno())
              os.replace(tmp,T)
          finally:
              if tmp.exists():tmp.unlink()
          def request_restart():
              for folder in (A/'tmp',W.parent/'tmp'):
                  folder.mkdir(mode=0o700,exist_ok=True);flag=folder/'restart.txt';rfd=os.open(str(flag),os.O_CREAT|os.O_APPEND|os.O_WRONLY|os.O_NOFOLLOW,0o600);os.close(rfd);os.utime(flag,None)
          try:
              request_restart()
              os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
              import django;django.setup()
              from django.template.loader import get_template
              get_template('brands/mojplaywin/product.html')
              if hashlib.sha256(T.read_bytes()).hexdigest()!=expected: raise RuntimeError('POST_INSTALL_SHA256_MISMATCH')
              print('MPW_FULL_TEMPLATE=PASS')
              print('MPW_BACKUP_PATH='+str(backup))
          except Exception:
              rb=T.with_name('.mpw-auto-rollback-v2')
              rfd=os.open(str(rb),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(rfd,'wb') as rf:rf.write(old.encode('utf8'));rf.flush();os.fsync(rf.fileno())
              os.replace(rb,T)
              request_restart()
              print('MPW_TEMPLATE_ROLLED_BACK_AFTER_LOCAL_CHECK_FAILURE',file=sys.stderr)
              raise
          PY
          DEPLOYED=1
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          ps=('/store/','/store/product/72/','/store/product/225/','/store/product/879/','/commerce/trx-easy/','/commerce/book/72/','/commerce/book/225/','/commerce/book/879/','/commerce/trx-easy/purchases/','/sitemap.xml');o={}
          detail_markers={'/store/product/72/':'415 pages','/store/product/225/':'40 pages','/store/product/879/':'five original SVG'}
          for p in ps:
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://mojplaywin.com'+p,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
                      o[p]=r.status
                      if p in detail_markers and detail_markers[p] not in r.read(200000).decode('utf8','replace'): raise RuntimeError('PRODUCT_DETAILS_NOT_LIVE_'+p)
              except urllib.error.HTTPError as e:o[p]=e.code
          print('MPW_ROUTES='+json.dumps(o,sort_keys=True))
          if any(v!=200 for v in o.values()):raise RuntimeError('ROUTE_QA_FAILED')
          PY
          timeout 90s ssh -T -F "$RUNNER_TEMP/r/c" h "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys
          from pathlib import Path
          A=Path('/home/zomorod2/Saeit-staging');os.chdir(A);sys.path.insert(0,str(A));os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from core.models import Product,OrderItem
          p=Product.objects.get(pk=779);n=OrderItem.objects.filter(product_id=779).count()
          print('MPW_ORDERS_PRESERVED',p.active,n)
          if not p.active or n<1:raise RuntimeError('ORDER_PRESERVATION_FAILED')
          PY
      - name: Clean
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/r"
