name: MojPlayWin easy one-tap TRX buyer checkout CI
on:
  push:
    branches: [feature/mpw-walletless-trx-e2e-20261022, fix/mpw-tron-provider-auth-20261022]
    paths:
      - services/mpw_trx_walletless_one_tap_ui.py
      - tests/test_mpw_trx_walletless_one_tap_ui.py
      - services/mpw_trx_walletless_checkout_ui.py
      - tests/test_mpw_trx_walletless_smart_ui.py
      - .github/workflows/mpw-walletless-trx-one-tap-ci-20261022.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  customer-one-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install QR encoder for isolated render test
        run: python3 -m pip install --disable-pip-version-check 'segno==1.6.6'
      - name: Verify invoice security and buyer ease
        run: |
          set -euo pipefail
          python3 -m py_compile services/mpw_trx_walletless_one_tap_ui.py tests/test_mpw_trx_walletless_one_tap_ui.py
          python3 -m unittest discover -s tests -p 'test_mpw_trx_walletless_one_tap_ui.py' -v
          python3 -m unittest discover -s tests -p 'test_mpw_walletless_checkout_ui.py' -v
          python3 -m unittest discover -s tests -p 'test_mpw_trx_walletless_smart_ui.py' -v
      - name: Compile injected one-tap wallet JS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from services.mpw_trx_walletless_one_tap_ui import WALLET_ACTION_JS
          Path('/tmp/mpw-walletless-one-tap.js').write_text(WALLET_ACTION_JS)
          PY
          node --check /tmp/mpw-walletless-one-tap.js
          echo "MPW_ONE_TAP_TRX_WALLET_CSP_QR_BOTH_READY=PASS; LIVE_PAYMENTS=0"
