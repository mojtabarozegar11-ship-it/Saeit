name: Zomorod V11 hourly site agent telemetry
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-v11-agent-hourly.yml"]
permissions:
  contents: read
concurrency:
  group: zomorod-v11-hourly-site-agents
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # The VPS key scan can intermittently time out on hosted runners.
          # Retry network acquisition only; trust remains pinned to the exact SHA-256.
          scan=""
          for attempt in 1 2 3; do
            scan="$(ssh-keyscan -T 8 -t rsa 178.239.147.150 2>/dev/null || true)"
            test -n "$scan" && break
            sleep 2
          done
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/vps.known"
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # cPanel identity is acquired through the verified VPS jump host.
          # Missing response gets three bounded retries; fingerprint mismatch fails.
          scan=""
          for attempt in 1 2 3; do
            scan="$(timeout 28s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null || true)"
            test -n "$scan" && break
            sleep 2
          done
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Check all eleven isolated site agents and record real outcomes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app="$HOME/.private/zomorod-business/site_agents.php"
          db="$HOME/.private/zomorod-business/site_agents.sqlite3"
          test -s "$app" && test -s "$db" && test ! -L "$app" && test ! -L "$db"
          phpbin="$(command -v php || true)"
          if test -z "$phpbin"; then phpbin=/opt/cpanel/ea-php82/root/usr/bin/php; fi
          "$phpbin" -d display_errors=0 -r '
          require $argv[1];
          $private=dirname($argv[1]);
          $db=zmAgentDb($private);
          $before=(int)$db->query("SELECT COUNT(*) FROM runs")->fetchColumn();
          $out=zmAgentCycle($db);
          $after=(int)$db->query("SELECT COUNT(*) FROM runs")->fetchColumn();
          if(count($out)!==11 || $after-$before !== count($out))exit(7);
          foreach($out as [$code,$status,$http]) {
            echo "SITE_AGENT code=".$code." status=".$status." http=".$http."\n";
          }
          echo "SITE_AGENTS_EXECUTED=".count($out)."\n";
          echo "SITE_AGENT_RUN_DATA_PRIVATE=yes\n";
          $expected=["agriculture","commerce","content","economic","master","media","quality","research","security","seo","weather"];
          $seen=[]; $fail=[];
          foreach($out as $entry) {
            if(!is_array($entry) || count($entry)<3){ $fail[]="malformed"; continue; }
            [$code,$status,$http]=$entry;
            $seen[]=$code;
            if($status!=="ok" || (int)$http!==200) $fail[]=$code;
          }
          if(array_diff($expected,$seen) || count(array_unique($seen))!==11) $fail[]="missing_or_duplicate";
          echo "SITE_AGENTS_FAILED=".count($fail)."\\n";
          if($fail){ fwrite(STDERR,"SITE_AGENTS_NOT_HEALTHY=".implode(",",$fail)."\\n"); exit(8); }
          ' "$app"
          REMOTE
      - name: Remove runner SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
