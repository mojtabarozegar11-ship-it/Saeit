name: Zomorod desk recoverable code and SQLite snapshot
on:
  push:
    branches:
      - ops/zomorod-business-safe-snapshot-20261104
    paths:
      - ".github/workflows/zomorod-business-safe-snapshot.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-business-safe-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Declare exact production snapshot and no deployment
        run: |
          echo "SCOPE=zomorod business PHP and management SQLite only"
          echo "NO_DEPLOY_NO_DB_MUTATION_NO_RESTART_NO_MESSAGES=1"
          echo "BACKUP_STORAGE=private host, not offsite"
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
            ControlMaster auto
            ControlPath $d/direct.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            # Emergency fallback is the same fingerprint-pinned cPanel host and
            # same private user; no host-key bypass or public ingress endpoint.
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=20 -o ConnectionAttempts=1 saeit-cpanel-direct 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              command_host=saeit-cpanel-direct
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=AUTHENTICATED'
            else
              echo 'PINNED_DIRECT_CPANEL_FALLBACK=UNAVAILABLE'
              exit 1
            fi
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Create guarded online snapshot of exact live version
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 70s ssh -F "$d/config" "$COMMAND_HOST" bash -se -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          umask 077
          commit="$1"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          root=/home/zomorod2/.private/zomorod-business
          source="$root/app.php"
          parent=/home/zomorod2/.backups
          test -d "$root" && test ! -L "$root"
          test -d "$parent" && test ! -L "$parent"
          test -f "$source" && test ! -L "$source"
          test -f "$root/management.sqlite3" && test ! -L "$root/management.sqlite3"
          expected=2ed9274affa87f3e9c51f7dff0c72d7461118c7aca0ae0ab732b1c81cbfd6005
          actual="$(sha256sum "$source" | awk '{print $1}')"
          if test "$actual" != "$expected"; then
            echo "SNAPSHOT_ABORT=LIVE_CODE_CHANGED"
            exit 41
          fi
          target="$parent/zomorod-business-20261104-${commit:0:12}"
          test ! -e "$target" && test ! -L "$target"
          mkdir -m 700 "$target"
          python3 -B - "$target" "$commit" <<'PY'
          import os, pathlib, shutil, sqlite3, sys, hashlib, urllib.parse
          source=pathlib.Path('/home/zomorod2/.private/zomorod-business')
          public=pathlib.Path('/home/zomorod2/public_html/business/index.php')
          target=pathlib.Path(sys.argv[1])
          commit=sys.argv[2]
          def fingerprint(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          sources=sorted(p for p in source.glob('*.php') if p.is_file() and not p.is_symlink())
          if len(sources)<1 or (source/'app.php') not in sources:raise RuntimeError('PHP_SOURCE_SET_INVALID')
          phpdir=target/'php';phpdir.mkdir(mode=0o700)
          for src in sources:
              dst=phpdir/src.name
              shutil.copyfile(src,dst)
              os.chmod(dst,0o600)
              if fingerprint(src)!=fingerprint(dst):raise RuntimeError('PHP_COPY_MISMATCH')
          if not public.is_file() or public.is_symlink():raise RuntimeError('PUBLIC_ENTRY_UNSAFE')
          entry=target/'public-index.php'
          shutil.copyfile(public,entry);os.chmod(entry,0o600)
          if fingerprint(public)!=fingerprint(entry):raise RuntimeError('ENTRY_COPY_MISMATCH')
          dbfile=source/'management.sqlite3'
          uri='file:'+urllib.parse.quote(str(dbfile))+'?mode=ro'
          backup=target/'management.sqlite3'
          with sqlite3.connect(uri,uri=True,timeout=8) as src:
              check=src.execute('PRAGMA quick_check(1)').fetchone()[0]
              if check!='ok':raise RuntimeError('SOURCE_SQLITE_INTEGRITY_NOT_OK')
              with sqlite3.connect(str(backup),timeout=8) as dst:
                  src.backup(dst)
                  check2=dst.execute('PRAGMA quick_check(1)').fetchone()[0]
                  if check2!='ok':raise RuntimeError('BACKUP_SQLITE_INTEGRITY_NOT_OK')
          os.chmod(backup,0o600)
          with sqlite3.connect('file:'+urllib.parse.quote(str(backup))+'?mode=ro',uri=True) as b:
              if b.execute('PRAGMA quick_check(1)').fetchone()[0]!='ok':raise RuntimeError('BACKUP_REOPEN_INVALID')
          receipt=target/'receipt.txt'
          receipt.write_text('schema=1\norigin=zomorod-private-desk\ncommit='+commit+'\napp_sha256='+fingerprint(source/'app.php')+'\nbackup_sha256='+fingerprint(backup)+'\n',encoding='utf-8')
          os.chmod(receipt,0o600)
          print('BACKUP_SOURCE_APP_SHA256='+fingerprint(source/'app.php'))
          print('BACKUP_PHP_FILES='+str(len(sources)))
          print('BACKUP_SQLITE_QUICK_CHECK=ok')
          print('BACKUP_VERIFIED_READBACK=true')
          print('BACKUP_TOTAL_BYTES='+str(sum(p.stat().st_size for p in target.rglob('*') if p.is_file())))
          print('LIVE_FILES_MODIFIED=false')
          print('BACKUP_IS_OFFHOST=false')
          PY
          test -s "$target/receipt.txt"
          echo "PRIVATE_HOST_SNAPSHOT=COMPLETE"
          REMOTE
      - name: Remove temporary runner credentials
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/zm-marketing-ro"; then
            rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
          fi
