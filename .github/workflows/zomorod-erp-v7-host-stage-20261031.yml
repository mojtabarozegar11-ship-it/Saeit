name: Zomorod ERP V7 authenticated private host staging only
on:
  push:
    branches:
      - feature/zomorod-erp-v7-host-stage-20261031
    paths:
      - .github/workflows/zomorod-erp-v7-host-stage-20261031.yml
permissions:
  contents: read
concurrency:
  group: zomorod-erp-v7-private-host-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97e3991d5b8b7e2c484c8ff6db74789dcaa7edec
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring
      - name: Strict source and test gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 97e3991d5b8b7e2c484c8ff6db74789dcaa7edec
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
          python3 scripts/run_all_offline_qa.py --report-out OFFLINE_QA_REPORT.json
          python3 - OFFLINE_QA_REPORT.json <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r.get('offline_checks_available_here')=='PASS'
          assert r.get('php_sqlite_business_tests')=='PASS'
          assert r.get('full_offline_database_tests_verified') is True
          assert not r.get('failed_or_timed_out', [])
          print('V7_OFFLINE_GATE=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/v7dist"
          ZOMOROD_BUNDLE_OUTPUT="$RUNNER_TEMP/v7dist" python3 scripts/build_erp_offline_bundle.py
          python3 scripts/verify_erp_bundle.py "$RUNNER_TEMP/v7dist/zomorod-erp-offline-v7.zip" "$RUNNER_TEMP/v7dist/zomorod-erp-offline-v7.tar.gz"
          printf '%s  %s\n' fa69ee0aaa4b4ccce938e03569c50a352c6eeb08820f778af1a3a725b10e5ef9 "$RUNNER_TEMP/v7dist/zomorod-erp-offline-v7.zip" | sha256sum -c -
          printf '%s  %s\n' 9e622147a9d235db86db4bb6897b2ab07d2d21f99f65ae9097f1196f91a6d15c "$RUNNER_TEMP/v7dist/zomorod-erp-offline-v7.tar.gz" | sha256sum -c -
          echo V7_SOURCE_ARCHIVE=verified_exact_pinned_revision
      - name: Verify fingerprint-pinned access and copy archive to private non-executable backup area
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          test "$GITHUB_RUN_ID" -gt 0
          d="$RUNNER_TEMP/zomorod-v7-host-credentials"
          install -d -m 700 "$d"
          trap 'rm -f "$d/vps.key" "$d/host.key" "$d/config" "$d/vps.known" "$d/host.known"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/host.key"
          chmod 600 "$d/vps.key" "$d/host.key"
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 12 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 15
            ConnectionAttempts 1
          EOF
          chmod 600 "$d/config"
          target=""
          for host in saeit-cpanel saeit-cpanel-direct; do
            if timeout 55s ssh -F "$d/config" "$host" 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/business/index.php && test -d /home/zomorod2/.private/zomorod-business' >/dev/null; then
              target="$host"
              break
            fi
          done
          test -n "$target"
          stage="/home/zomorod2/.backups/zomorod-erp-v7-staged/$GITHUB_RUN_ID"
          ssh -F "$d/config" "$target" "umask 077; test ! -e '$stage'; mkdir -p /home/zomorod2/.backups/zomorod-erp-v7-staged; mkdir -m 700 '$stage'"
          scp -q -F "$d/config" "$RUNNER_TEMP/v7dist/zomorod-erp-offline-v7.zip" "$target:$stage/"
          scp -q -F "$d/config" "$RUNNER_TEMP/v7dist/zomorod-erp-offline-v7.tar.gz" "$target:$stage/"
          scp -q -F "$d/config" "OFFLINE_QA_REPORT.json" "$target:$stage/"
          ssh -F "$d/config" "$target" "set -eu; cd '$stage'; printf '%s  %s\n' fa69ee0aaa4b4ccce938e03569c50a352c6eeb08820f778af1a3a725b10e5ef9 zomorod-erp-offline-v7.zip | sha256sum -c --status; printf '%s  %s\n' 9e622147a9d235db86db4bb6897b2ab07d2d21f99f65ae9097f1196f91a6d15c zomorod-erp-offline-v7.tar.gz | sha256sum -c --status; test -f /home/zomorod2/public_html/business/index.php; echo V7_PRIVATE_STAGE_VERIFIED=YES"
          echo "PRIVATE_STAGE_PATH=$stage"
          echo LIVE_SITE_CODE_CHANGED=NO
          echo PRODUCTION_DATABASE_TOUCHED=NO
          echo FACTORY_HOLD_UNCHANGED=YES
