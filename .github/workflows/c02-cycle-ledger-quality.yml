name: C02 cycle execution evidence quality
on:
  push:
    branches:
      - work/unified-master-c02-evidence-gates-20261112
    paths:
      - deploy/mojtaba_bot_cycle_worker.py
      - deploy/mojtaba_bot_cycle_coordinator.py
      - tests/test_unified_c02_evidence_gate.py
      - tests/test_mojtaba_c02_coordinator_proof.py
      - tests/test_c02_worker_50_receipts.py
      - tests/test_c03_cycle_receipt_bridge.py
      - deploy/mojtaba_bot_cycle_receipt_bridge.py
      - deploy/mojtaba_bot_cycle_auditor.py
      - tests/test_c03_cycle_auditor.py
      - .github/workflows/c02-cycle-ledger-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout committed branch with Git ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run isolated ledger regressions (NO factory or live system access)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest
          python3 -m pytest --noconftest -q             tests/test_unified_c02_evidence_gate.py             tests/test_mojtaba_c02_coordinator_proof.py             tests/test_c02_worker_50_receipts.py tests/test_c03_cycle_receipt_bridge.py tests/test_c03_cycle_auditor.py

      - name: Assert no production secrets or external transfers
        run: |
          echo 'C02 QA only: no VPS, cPanel, server secrets, live payment or deployment.'
