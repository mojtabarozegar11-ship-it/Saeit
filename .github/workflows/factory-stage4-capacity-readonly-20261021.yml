name: Factory Stage4 persisted research capacity and release-chain evidence (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/factory-stage4-capacity-readonly-20261021.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: factory-stage4-research-readonly-20261021
  cancel-in-progress: false
jobs:
  inspect-live-vps:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Authenticate pinned VPS SSH identity
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/stage4-readonly"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          echo STAGE4_RESEARCH_VPS_HOST_PIN_VERIFIED=PASS
      - name: Read bounded Stage4 budget evidence and release model counters without writes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 150s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test "$(id -un)" = githubops
          test -d "$base/django-app" && test -x "$base/.venv/bin/python"
          cd "$base/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
          "$base/.venv/bin/python" -B - <<'PY'
          import datetime, hashlib, json, os, re, sys
          from pathlib import Path
          root=Path.home()/"factory-runtime"
          app=root/"django-app"
          report={"schema":"saeit.factory.stage4-research-budget-readonly.v1",
                  "read_only":True,"policy_modified":False,
                  "payment_modified":False,"product_release_modified":False}
          paths={
            "stage4":app/"core/factory_stage4.py",
            "agent_runtime":app/"core/factory_agent_runtime.py",
            "factory_loop":root/"operations/vps-only-loop.sh"}
          review={}
          for label,p in paths.items():
              if p.is_symlink():
                  review[label]={"state":"unsafe_symlink"}
                  continue
              if not p.is_file():
                  review[label]={"state":"missing"}
                  continue
              size=p.stat().st_size
              if size>2_000_000:
                  review[label]={"state":"oversize"}
                  continue
              raw=p.read_bytes()
              text=raw.decode("utf-8","replace").lower()
              review[label]={"state":"present","sha256":hashlib.sha256(raw).hexdigest(),
                             "size_bytes":size,"budget_references":len(re.findall(r"\bbudget\b",text)),
                             "capacity_references":len(re.findall(r"\bcapacity\b",text)),
                             "persisted_references":len(re.findall(r"\bpersist",text))}
          report["source_evidence"]=review
          log=root/"operations/vps-only-factory.log"
          if log.is_symlink():
              report["log_probe"]={"state":"unsafe_symlink"}
          elif not log.is_file():
              report["log_probe"]={"state":"missing"}
          else:
              stat=log.stat()
              with log.open("rb") as f:
                  f.seek(max(0,stat.st_size-524288))
                  tail=f.read(524288).decode("utf-8","replace")
              report["log_probe"]={
                "state":"present",
                "log_size_bytes":stat.st_size,
                "last_modified_utc":datetime.datetime.fromtimestamp(stat.st_mtime,datetime.timezone.utc).isoformat(),
                "budget_wait_mentions_in_last_512k":tail.count("Stage 4 research is waiting for its persisted budget window or capacity policy"),
                "stage4_mentions_in_last_512k":len(re.findall(r"stage.?4",tail,re.I))}
          try:
              os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
              sys.path.insert(0,str(app))
              import django
              django.setup()
              from django.apps import apps
              from django.db.models import Count
              models={}
              for name in ("AgentTask","FactoryRun","FactoryEvidence","FactoryArtifact","FactoryReleaseGate","FactoryReleaseManifest"):
                  try: cls=apps.get_model("core",name)
                  except LookupError:
                      models[name]={"state":"model_not_registered"}
                      continue
                  fields={f.name for f in cls._meta.fields}
                  v={"state":"present","rows":cls.objects.count()}
                  v["capacity_field_names"]=sorted(
                      f for f in fields if any(key in f.lower() for key in ("budget","capacity","window","quota","reset")))
                  if "status" in fields:
                      v["status_counts"]={str(x["status"])[:45]:x["total"] for x in
                          cls.objects.values("status").annotate(total=Count("pk")).order_by("status")[:30]}
                  models[name]=v
              report["database_probe"]={"state":"read_ok","models":models}
          except Exception as err:
              report["database_probe"]={"state":"read_blocked","error_type":type(err).__name__}
          print("FACTORY_STAGE4_BUDGET_EVIDENCE="+json.dumps(report,sort_keys=True,ensure_ascii=True))
          print("STAGE4_RESEARCH_READONLY_NO_CAPACITY_OVERRIDE=PASS")
          PY
          REMOTE
      - name: Inspect Stage4 backoff and research retry control-flow safely
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 90s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' <<'PY'
          import ast, hashlib, json, re
          from pathlib import Path
          base=Path.home()/"factory-runtime/django-app/core"
          picks={"factory_stage4.py":(50,117),"factory_agent_runtime.py":(235,313)}
          for name,(start,end) in picks.items():
              path=base/name
              if path.is_symlink() or not path.is_file() or path.stat().st_size>150000:
                  print("STAGE4_SOURCE_UNSAFE="+name)
                  continue
              raw=path.read_text(encoding="utf8")
              ast.parse(raw)
              print("STAGE4_SOURCE_SHA256_"+name+"="+hashlib.sha256(raw.encode()).hexdigest())
              for idx,line in enumerate(raw.splitlines(),1):
                  if start<=idx<=end and len(line)<350 and not re.search(r"password|secret|credential|private.key|api.key|auth.token|https?://",line,re.I):
                      print("STAGE4_CODE_"+name+":"+str(idx)+"="+line)
          PY
      - name: Locate original Stage4 wait reason and report per-run retry budget health
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 80s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' <<'PY'
          from pathlib import Path
          from collections import Counter
          import ast,hashlib,re,json,datetime
          root=Path.home()/"factory-runtime/django-app/core"
          needle="Stage 4 research is waiting for its persisted budget window or capacity policy"
          count=0
          for p in sorted(root.glob("*.py")):
              if p.is_symlink() or p.stat().st_size>250000:continue
              lines=p.read_text(encoding="utf8",errors="replace").splitlines()
              for i,line in enumerate(lines):
                  if needle in line:
                      count+=1
                      print("STAGE4_WAIT_OWNER_FILE="+p.name+";line="+str(i+1))
                      lo=max(0,i-18);hi=min(len(lines),i+20)
                      for j in range(lo,hi):
                          v=lines[j]
                          if len(v)<350 and not re.search("secret|password|credential|private.key|api.key|auth.token|https?://",v,re.I):
                              print("STAGE4_WAIT_SOURCE_"+p.name+":"+str(j+1)+"="+v)
          print("STAGE4_EXACT_WAIT_SITE_COUNT="+str(count))
          PY
      - name: Inspect redacted budget-policy conditions without exposing source secrets
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 100s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          test -d "$base/django-app" && test -x "$base/.venv/bin/python"
          cd "$base/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
          "$base/.venv/bin/python" -B - <<'PY'
          import ast, copy, json, os, re, sys
          from pathlib import Path
          root=Path.home()/"factory-runtime"/"django-app"
          pattern=re.compile(r"capacity|budget|window|persist|quota|research",re.I)
          class Redact(ast.NodeTransformer):
              def visit_Constant(self,node):
                  if isinstance(node.value,str):
                      return ast.copy_location(ast.Constant(value="REDACTED_LITERAL"),node)
                  return node
          sections={}
          for name in ("factory_stage4.py","factory_agent_runtime.py"):
              p=root/"core"/name
              if not p.is_file() or p.is_symlink() or p.stat().st_size>150000:
                  sections[name]={"state":"missing_or_untrusted"}
                  continue
              tree=ast.parse(p.read_text(encoding="utf8"))
              selected=[]
              for node in ast.walk(tree):
                  if not isinstance(node,(ast.If,ast.Assign,ast.AnnAssign,ast.While)):
                      continue
                  ast_copy=Redact().visit(copy.deepcopy(node.test if isinstance(node,(ast.If,ast.While)) else node))
                  text=ast.unparse(ast_copy)
                  if pattern.search(text):
                      selected.append({"line":getattr(node,"lineno",0),
                                       "kind":type(node).__name__,
                                       "redacted_logic":text[:280]})
                  if len(selected)>=40:break
              sections[name]={"state":"parsed","redacted_policy_nodes":selected}
          try:
              os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
              sys.path.insert(0,str(root))
              import django
              django.setup()
              from django.apps import apps
              models=[]
              for cls in apps.get_app_config("core").get_models():
                  label=cls.__name__
                  if not pattern.search(label):continue
                  fields=[f.name for f in cls._meta.fields
                          if pattern.search(f.name) and not re.search(r"token|password|secret|key",f.name,re.I)]
                  if fields:models.append({"model":label,"policy_field_names":fields[:20]})
              policy_models=models[:25]
          except Exception as exc:
              policy_models=[{"state":"inspection_blocked","error_type":type(exc).__name__}]
          print("FACTORY_STAGE4_REDACTED_POLICY_LOGIC="+json.dumps({
              "schema":"saeit.factory.stage4-policy-ast-readonly.v1","read_only":True,
              "redacted_string_constants":True,"sources":sections,
              "policy_models":policy_models},sort_keys=True))
          PY
          REMOTE

      - name: Count persisted Stage4 retry windows and overdue records without changes
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 110s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/factory-runtime/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          export FACTORY_RESEARCH_PROVIDER=core.self_hosted_research_provider.SelfHostedStagingResearchProvider
          "$HOME/factory-runtime/.venv/bin/python" -B - <<'PY'
          import collections, datetime, json, os, sys
          from django.utils.dateparse import parse_datetime
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.apps import apps
          now=datetime.datetime.now(datetime.timezone.utc)
          cls=apps.get_model("core", "Product")
          counts=collections.Counter()
          statuses=collections.Counter()
          scanned=0
          for metadata in cls.objects.values_list("metadata",flat=True).iterator(chunk_size=100):
              scanned+=1
              if scanned>5000:
                  counts["scan_truncated"]=1
                  break
              if not isinstance(metadata,dict):
                  continue
              validation=metadata.get("validation")
              stage=validation.get("stage4_research") if isinstance(validation,dict) else None
              if not isinstance(stage,dict):
                  stage=metadata.get("stage4_research")
              if not isinstance(stage,dict) or not stage:
                  continue
              counts["stage4_records"]+=1
              status=str(stage.get("status") or "unknown")
              statuses[status[:40]]+=1
              stamp=stage.get("next_retry_at")
              if not stamp:
                  counts["without_retry_timestamp"]+=1
                  continue
              try:
                  when=parse_datetime(stamp) if isinstance(stamp,str) else None
                  if when is None or when.tzinfo is None:
                      counts["invalid_or_naive_retry_timestamp"]+=1
                  elif when<=now:
                      counts["retry_due_or_overdue"]+=1
                  else:
                      counts["retry_not_due"]+=1
              except (ValueError,TypeError,OverflowError):
                  counts["invalid_or_naive_retry_timestamp"]+=1
          print("STAGE4_PERSISTED_RETRY_DISTRIBUTION="+json.dumps({
              "schema":"saeit.factory.stage4-retry-due-readonly.v1",
              "read_only":True,"evaluated_at_utc":now.isoformat(),
              "products_scanned_capped":min(scanned,5000),
              "counts":dict(sorted(counts.items())),
              "statuses":dict(sorted(statuses.items())),
              "budget_or_capacity_modified":False,
              "release_or_approval_modified":False},sort_keys=True))
          PY
          REMOTE
      - name: Check unique factory worker and last activity without restarting it
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 60s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' <<'PY'
          import datetime, json, os, shutil, subprocess, time
          from pathlib import Path
          root=Path.home()/"factory-runtime/operations"
          loop=root/"vps-only-loop.sh"
          pidfile=root/"vps-only-loop.pid"
          log=root/"vps-only-factory.log"
          if any(p.is_symlink() for p in (root,loop,pidfile,log)):
              raise SystemExit("FACTORY_MONITOR_UNSAFE_SYMLINK")
          if not loop.is_file() or not pidfile.is_file() or not log.is_file():
              raise SystemExit("FACTORY_MONITOR_REQUIRED_FILE_MISSING")
          pid_text=pidfile.read_text().strip()
          expected_pid=int(pid_text) if pid_text.isdecimal() else -1
          listing=subprocess.run(["ps","-eo","pid=,args="],check=True,capture_output=True,text=True,timeout=10).stdout
          matches=[]
          for row in listing.splitlines():
              parts=row.strip().split(None,2)
              if len(parts)!=3 or not parts[0].isdigit():
                  continue
              cmd=parts[1:]
              if cmd[0].endswith(("/bash","/sh")) or cmd[0] in ("bash","sh"):
                  if cmd[1].split()[0]==str(loop):
                      matches.append(int(parts[0]))
          st=log.stat()
          age=max(0,round(time.time()-st.st_mtime))
          disk=shutil.disk_usage(str(root))
          mem={}
          for row in Path("/proc/meminfo").read_text().splitlines():
              if row.startswith(("MemTotal:","MemAvailable:")):
                  k,v=row.split(":",1)
                  mem[k]=int(v.strip().split()[0])*1024
          result={
              "schema":"saeit.factory.unique-worker-activity-readonly.v1",
              "read_only":True,
              "expected_pid_matches_unique_worker":len(matches)==1 and matches[0]==expected_pid,
              "worker_count":len(matches),
              "log_last_modified_utc":datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat(),
              "log_age_seconds":age,
              "log_size_bytes":st.st_size,
              "activity_recent_5m":age<=300,
              "disk_free_bytes":disk.free,
              "memory_available_bytes":mem.get("MemAvailable"),
              "memory_total_bytes":mem.get("MemTotal"),
              "service_modified":False,
              "worker_restarted":False}
          print("FACTORY_UNIQUE_WORKER_ACTIVITY="+json.dumps(result,sort_keys=True))
          PY

      - name: Read master Stage4 retry decision and classify due linked runs safely
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 90s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/factory-runtime/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          "$HOME/factory-runtime/.venv/bin/python" -B - <<'PY'
          import ast,collections,datetime,hashlib,json,os,re
          from pathlib import Path
          from django.utils.dateparse import parse_datetime
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          path=Path("core/autonomous_brain.py")
          if path.is_symlink() or not path.is_file() or path.stat().st_size>180000:
              raise SystemExit("STAGE4_MASTER_SOURCE_UNSAFE")
          src=path.read_text(encoding="utf8")
          ast.parse(src)
          lines=src.splitlines()
          needles=[i for i,s in enumerate(lines) if "if not revised_evidence:" in s]
          if len(needles)!=1:
              raise SystemExit("STAGE4_MASTER_DECISION_MARKER_CHANGED")
          pos=needles[0]
          for i in range(max(0,pos-24),min(len(lines),pos+31)):
              line=lines[i]
              if len(line)<=250 and not re.search(r"secret|password|credential|private.key|api.key|auth.token|https?://|address|email",line,re.I):
                  print("STAGE4_MASTER_DECISION_LINE="+str(i+1)+":"+line)
          Product=apps.get_model("core","Product")
          FactoryRun=apps.get_model("core","FactoryRun")
          run_fields={f.name for f in FactoryRun._meta.fields}
          now=datetime.datetime.now(datetime.timezone.utc)
          due=collections.Counter()
          status_counts=collections.Counter()
          scanned=0
          for pk,metadata in Product.objects.values_list("pk","metadata").iterator(chunk_size=100):
              scanned+=1
              if scanned>5000:
                  due["truncated"]=1
                  break
              if not isinstance(metadata,dict):
                  continue
              v=metadata.get("validation")
              s=v.get("stage4_research") if isinstance(v,dict) else None
              if not isinstance(s,dict):
                  s=metadata.get("stage4_research")
              if not isinstance(s,dict):
                  continue
              stamp=s.get("next_retry_at")
              if not isinstance(stamp,str):
                  continue
              when=parse_datetime(stamp)
              if when is None or when.tzinfo is None or when>now:
                  continue
              due["due_products"]+=1
              if "product" not in run_fields:
                  due["run_link_not_available"]+=1
                  continue
              runs=list(FactoryRun.objects.filter(product_id=pk).values_list("status",flat=True)[:20])
              if not runs:
                  due["no_linked_run"]+=1
              else:
                  due["linked_run"]+=1
                  for status in set(map(str,runs)):
                      status_counts[status[:40]]+=1
          print("STAGE4_DUE_RUN_ELIGIBILITY="+json.dumps({
              "read_only":True,"schema":"saeit.factory.stage4-due-run-eligibility.v1",
              "master_source_sha256":hashlib.sha256(src.encode()).hexdigest(),
              "run_link_field_available":"product" in run_fields,
              "counts":dict(sorted(due.items())),
              "linked_run_statuses":dict(sorted(status_counts.items())),
              "policy_modified":False},sort_keys=True))
          PY
          REMOTE
      - name: Diagnose Stage4 overdue eligibility without modifying factory state
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 90s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/factory-runtime/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          "$HOME/factory-runtime/.venv/bin/python" -B - <<'PY'
          import collections,datetime,json,os
          from django.utils.dateparse import parse_datetime
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          from django.db.models import Count
          from django.utils import timezone
          Product=apps.get_model("core","Product")
          Run=apps.get_model("core","FactoryRun")
          now=timezone.now()
          out=collections.Counter()
          by_run=collections.Counter()
          for pk,metadata in Product.objects.values_list("pk","metadata").iterator(chunk_size=100):
              if not isinstance(metadata,dict):
                  continue
              v=metadata.get("validation")
              progress=v.get("stage4_research") if isinstance(v,dict) else None
              if not isinstance(progress,dict):
                  continue
              stamp=progress.get("next_retry_at")
              due=parse_datetime(stamp) if isinstance(stamp,str) else None
              status=progress.get("status")
              if status=="capacity_exhausted":
                  out["capacity_exhausted"]+=1
                  continue
              if not due or timezone.is_naive(due):
                  out["no_valid_retry_window"]+=1
                  continue
              if due>now:
                  out["not_yet_due"]+=1
                  continue
              out["due"]+=1
              runs=list(Run.objects.filter(product_id=pk).order_by("-created_at","-pk").values("status","run_id")[:2])
              if not runs:
                  out["due_no_run"]+=1
                  continue
              if len(runs)>1:
                  out["due_multiple_runs"]+=1
              current=runs[0]
              by_run[str(current["status"])[:32]]+=1
              if current["status"]=="active":
                  out["due_active_run"]+=1
          print("STAGE4_DUE_DECISION_DIAGNOSTIC="+json.dumps({
              "read_only":True,"schema":"saeit.stage4.due-decision-diagnostic.v1",
              "utc":now.isoformat(),"counts":dict(sorted(out.items())),
              "latest_run_statuses":dict(sorted(by_run.items())),
              "research_requests_started":0,"budget_changed":False},sort_keys=True))
          PY
          REMOTE
      - name: Inspect due-active master scheduling branch without mutation
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-readonly"
          timeout 75s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' <<'PY'
          import ast, hashlib, re
          from pathlib import Path
          p=Path.home()/"factory-runtime/django-app/core/autonomous_brain.py"
          if p.is_symlink() or not p.is_file() or p.stat().st_size>180000:
              raise SystemExit("STAGE4_MASTER_SOURCE_UNSAFE")
          src=p.read_text(encoding="utf8")
