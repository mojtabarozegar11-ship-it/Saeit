name: Zomorod MySQL live table and free-space inventory read-only
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-mysql-live-storage-inventory.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-mysql-table-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Obtain sizes of live SQL tables and unused InnoDB space without exposing any row data
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Saeit-staging"
          SAEIT_ENV=production DJANGO_SETTINGS_MODULE=config.settings /home/zomorod2/Saeit/.venv/bin/python -B - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          from django.conf import settings
          db=settings.DATABASES["default"]
          assert db.get("NAME")=="zomorod2_sites_main", "Unexpected live database; refusing query."
          client=shutil.which("mysql") or shutil.which("mariadb")
          if not client:
              raise SystemExit("MYSQL_CLIENT_UNAVAILABLE")
          def option(value):
              value=str(value or "")
              if "\n" in value or "\r" in value:
                  raise SystemExit("MYSQL_OPTION_VALUE_INVALID")
              return '"' + value.replace("\\","\\\\").replace('"','\\"') + '"'
          lines=["[client]"]
          for key,source in (("user","USER"),("password","PASSWORD"),("host","HOST"),("port","PORT"),("socket","OPTIONS")):
              if key=="socket":
                  value=(db.get("OPTIONS") or {}).get("unix_socket","")
              else:
                  value=db.get(source,"")
              if value not in ("",None):
                  lines.append(key+"="+option(value))
          fd,path=tempfile.mkstemp(prefix="saeit-mysql-readonly-",dir="/tmp")
          try:
              os.fchmod(fd,0o600)
              with os.fdopen(fd,"w",encoding="utf-8") as f:
                  f.write("\n".join(lines)+"\n"); f.flush(); os.fsync(f.fileno())
              summary="""SELECT CONCAT('LIVE_MYSQL_TABLE_COUNT=',COUNT(*)),CONCAT('LIVE_MYSQL_DATA_BYTES=',COALESCE(SUM(DATA_LENGTH),0)),CONCAT('LIVE_MYSQL_INDEX_BYTES=',COALESCE(SUM(INDEX_LENGTH),0)),CONCAT('LIVE_MYSQL_REPORTED_FREE_BYTES=',COALESCE(SUM(DATA_FREE),0)) FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_TYPE='BASE TABLE';"""
              tables="""SELECT CONCAT('MYSQL_TABLE_SUMMARY=',JSON_OBJECT('name',TABLE_NAME,'engine',ENGINE,'estimated_rows',COALESCE(TABLE_ROWS,0),'data_bytes',COALESCE(DATA_LENGTH,0),'index_bytes',COALESCE(INDEX_LENGTH,0),'free_bytes',COALESCE(DATA_FREE,0))) FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_TYPE='BASE TABLE' ORDER BY DATA_LENGTH+INDEX_LENGTH DESC LIMIT 55;"""
              for query in (summary,tables):
                  result=subprocess.run([client,"--defaults-extra-file="+path,"--batch","--skip-column-names","--database=zomorod2_sites_main","-e",query],capture_output=True,text=True,timeout=90)
                  if result.returncode:
                      raise SystemExit("MYSQL_INVENTORY_QUERY_FAILED exit="+str(result.returncode))
                  for line in result.stdout.splitlines():
                      if line.startswith(("LIVE_MYSQL_","MYSQL_TABLE_SUMMARY=")):
                          print(line)
              print("LIVE_MYSQL_STORAGE_INVENTORY=complete")
          finally:
              try: os.unlink(path)
              except FileNotFoundError: pass
          PY
          REMOTE
      - name: Clear connection material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"

# Read-only storage and preservation recheck authorized 2026-10-28.
