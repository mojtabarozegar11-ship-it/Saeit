name: Zomorod MySQL live table and free-space inventory read-only
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-mysql-live-storage-inventory.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-mysql-table-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Obtain sizes of live SQL tables and unused InnoDB space without exposing any row data
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          cd "$HOME/Saeit-staging"
          python3 -B - <<'PY'
          import json, os, re, shutil, subprocess, urllib.parse
          from pathlib import Path
          app=Path.home()/"Saeit-staging"
          candidates=(app/".env",app/".env.production",app/".env.local",Path.home()/"mojplaywin.com"/".env")
          urls=[]
          for path in candidates:
              try:
                  if path.is_symlink() or not path.is_file() or path.stat().st_size>65536: continue
                  for line in path.read_text(encoding="utf-8",errors="replace").splitlines():
                      match=re.match(r"^\s*(?:export\s+)?DATABASE_URL\s*=\s*(.*?)\s*$",line)
                      if match:
                          parsed=urllib.parse.urlsplit(match.group(1).strip().strip('"').strip("'"))
                          if parsed.scheme.lower() not in {"mysql","mariadb","mysql2"}:
                              raise SystemExit("MYSQL_CONFIG_SCHEME_UNEXPECTED")
                          urls.append(parsed)
              except OSError:
                  continue
          if len(urls)!=1: raise SystemExit("MYSQL_CONFIG_URL_NOT_UNIQUE")
          parsed=urls[0]
          db=urllib.parse.unquote(parsed.path.lstrip("/"))
          user=urllib.parse.unquote(parsed.username or "")
          password=urllib.parse.unquote(parsed.password or "")
          host=parsed.hostname or "localhost"
          client=shutil.which("mariadb") or shutil.which("mysql")
          if not all((db,user,password,client)): raise SystemExit("MYSQL_CONNECTION_CONFIG_INCOMPLETE")
          if db!="zomorod2_sites_main": raise SystemExit("MYSQL_DATABASE_SCOPE_MISMATCH")
          uapi=subprocess.run(["uapi","--output=json","Mysql","list_databases"],capture_output=True,timeout=15,check=False)
          if uapi.returncode or len(uapi.stdout)>300000: raise SystemExit("CPANEL_DATABASE_ALLOWLIST_UNAVAILABLE")
          payload=json.loads(uapi.stdout).get("result",{})
          databases=payload.get("data",[])
          if payload.get("status")!=1 or len(databases)!=1 or databases[0].get("database")!=db:
              raise SystemExit("CPANEL_DATABASE_ALLOWLIST_MISMATCH")
          args=[client,"--no-defaults","--batch","--skip-column-names","--host="+host,"--user="+user,
                "--database="+db,"--connect-timeout=8"]
          if parsed.port is not None: args.append("--port="+str(parsed.port))
          env=dict(os.environ,MYSQL_PWD=password)
          queries=[
              """SELECT CONCAT('LIVE_MYSQL_TABLE_COUNT=',COUNT(*)),CONCAT('LIVE_MYSQL_DATA_BYTES=',COALESCE(SUM(DATA_LENGTH),0)),CONCAT('LIVE_MYSQL_INDEX_BYTES=',COALESCE(SUM(INDEX_LENGTH),0)),CONCAT('LIVE_MYSQL_REPORTED_FREE_BYTES=',COALESCE(SUM(DATA_FREE),0)) FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_TYPE='BASE TABLE';""",
              """SELECT CONCAT('MYSQL_TABLE_SUMMARY=',JSON_OBJECT('name',TABLE_NAME,'engine',ENGINE,'estimated_rows',COALESCE(TABLE_ROWS,0),'data_bytes',COALESCE(DATA_LENGTH,0),'index_bytes',COALESCE(INDEX_LENGTH,0),'free_bytes',COALESCE(DATA_FREE,0))) FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_TYPE='BASE TABLE' ORDER BY DATA_LENGTH+INDEX_LENGTH DESC LIMIT 55;""",
              """SELECT CONCAT('TASK_STATUS_AGE=',JSON_OBJECT('status',status,'rows',COUNT(*),'oldest',MIN(created_at),'newest',MAX(created_at),'older_7d',SUM(created_at<NOW()-INTERVAL 7 DAY),'older_30d',SUM(created_at<NOW()-INTERVAL 30 DAY),'older_90d',SUM(created_at<NOW()-INTERVAL 90 DAY))) FROM core_agenttask GROUP BY status ORDER BY status;""",
              """SELECT CONCAT('EVIDENCE_STATUS_AGE=',JSON_OBJECT('status',status,'type',evidence_type,'rows',COUNT(*),'oldest',MIN(created_at),'newest',MAX(created_at),'older_30d',SUM(created_at<NOW()-INTERVAL 30 DAY),'older_90d',SUM(created_at<NOW()-INTERVAL 90 DAY),'expired',SUM(valid_until IS NOT NULL AND valid_until<NOW()))) FROM core_factoryevidence GROUP BY status,evidence_type ORDER BY status,evidence_type;""",
              """SELECT CONCAT('TASK_MONTH=',JSON_OBJECT('month',DATE_FORMAT(created_at,'%Y-%m'),'status',status,'rows',COUNT(*))) FROM core_agenttask GROUP BY DATE_FORMAT(created_at,'%Y-%m'),status ORDER BY DATE_FORMAT(created_at,'%Y-%m'),status;""",
              """SELECT CONCAT('TASK_PAYLOAD_BUCKET=',JSON_OBJECT('status',status,'age_bucket',IF(created_at<NOW()-INTERVAL 7 DAY,'older_7d','newer_7d'),'rows',COUNT(*),'payload_bytes',SUM(COALESCE(OCTET_LENGTH(input_data),0)+COALESCE(OCTET_LENGTH(output_data),0)+COALESCE(OCTET_LENGTH(goal),0)+COALESCE(OCTET_LENGTH(output_contract),0)+COALESCE(OCTET_LENGTH(prerequisite_snapshot),0)))) FROM core_agenttask GROUP BY status,IF(created_at<NOW()-INTERVAL 7 DAY,'older_7d','newer_7d') ORDER BY status;""",
              """SELECT CONCAT('EVIDENCE_PAYLOAD_BUCKET=',JSON_OBJECT('status',status,'type',evidence_type,'age_bucket',IF(created_at<NOW()-INTERVAL 7 DAY,'older_7d','newer_7d'),'rows',COUNT(*),'payload_bytes',SUM(COALESCE(OCTET_LENGTH(details),0)))) FROM core_factoryevidence GROUP BY status,evidence_type,IF(created_at<NOW()-INTERVAL 7 DAY,'older_7d','newer_7d') ORDER BY status,evidence_type;"""
          ]
          for query in queries:
              result=subprocess.run(args+["--execute="+query],env=env,capture_output=True,text=True,timeout=180,check=False)
              if result.returncode: raise SystemExit("MYSQL_INVENTORY_QUERY_FAILED exit="+str(result.returncode))
              for line in result.stdout.splitlines():
                  if line.startswith(("LIVE_MYSQL_","MYSQL_TABLE_SUMMARY=","TASK_STATUS_AGE=","EVIDENCE_STATUS_AGE=","TASK_MONTH=","TASK_PAYLOAD_BUCKET=","EVIDENCE_PAYLOAD_BUCKET=")): print(line)
          print("LIVE_MYSQL_STORAGE_INVENTORY=complete")
          PY
          REMOTE
      - name: Clear connection material
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"

# Read-only storage and preservation recheck authorized 2026-10-28.

