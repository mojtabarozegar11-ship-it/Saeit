name: MojPlayWin production guest TRX checkout release
# Explicit release trigger only. The job remains hard-blocked pending independent
# off-host full restore, effective Passenger DB attestation and rollback rehearsal.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpw-guest-checkout-live-release
  cancel-in-progress: false
jobs:
  release:
    # Fail closed even for manual dispatch until a separately reviewed gate-unlock PR.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile reviewed release files
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_guest_checkout_live_release.py services/mpw_trx_guest_commerce.py scripts/test_mpw_guest_first_order_identity.py
          python3 scripts/test_mpw_guest_first_order_identity.py
      - name: Record storefront baseline
        run: |
          python3 - <<'PY'
          import json,urllib.request
          origin='https://mojplaywin.com'
          paths=('/store/','/store/product/72/','/store/product/225/','/store/product/879/')
          state={}
          for path in paths:
              req=urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read(220000).decode('utf8','replace')
                  if r.status!=200: raise RuntimeError('STORE_BASELINE_NOT_200:'+path)
                  if path=='/store/' and not all('/store/product/'+i+'/' in body for i in ('72','225','879')):
                      raise RuntimeError('PUBLIC_PRODUCTS_MISSING')
                  state[path]=r.status
          with open('/tmp/mpw-guest-baseline.json','w') as f: json.dump(state,f)
          print('MPW_GUEST_STORE_BASELINE=PASS')
          PY
      - name: Establish fingerprint-pinned VPS to cPanel relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-guest-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Stage the adapter and release controller
        run: |
          set -euo pipefail
          remote="/home/zomorod2/.mpw-guest-release-$GITHUB_RUN_ID"
          config="$RUNNER_TEMP/mpw-guest-ssh/config"
          timeout 45s ssh -T -F "$config" saeit-cpanel "install -d -m 700 '$remote'"
          timeout 50s scp -O -q -F "$config" scripts/mpw_guest_checkout_live_release.py "saeit-cpanel:$remote/release.py"
          timeout 50s scp -O -q -F "$config" services/mpw_trx_guest_commerce.py "saeit-cpanel:$remote/guest.py"
          timeout 45s ssh -T -F "$config" saeit-cpanel "chmod 600 '$remote/release.py' '$remote/guest.py'"
      - name: Fail closed unless exact modules can accept the reviewed adapter
        run: |
          set -euo pipefail
          remote="/home/zomorod2/.mpw-guest-release-$GITHUB_RUN_ID"
          timeout 90s ssh -T -F "$RUNNER_TEMP/mpw-guest-ssh/config" saeit-cpanel \
            "python3 '$remote/release.py' preview '$remote/guest.py'"
      - name: Atomically install guest checkout over the existing TRX order and ledger
        id: install
        run: |
          set -euo pipefail
          remote="/home/zomorod2/.mpw-guest-release-$GITHUB_RUN_ID"
          timeout 110s ssh -T -F "$RUNNER_TEMP/mpw-guest-ssh/config" saeit-cpanel \
            "python3 '$remote/release.py' publish '$GITHUB_RUN_ID' '$remote/guest.py'"
      - name: Verify anonymous checkout pages without creating an order or payment
        run: |
          set -euo pipefail
          remote="/home/zomorod2/.mpw-guest-release-$GITHUB_RUN_ID"
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-guest-ssh/config" saeit-cpanel \
            "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python '$remote/release.py' verify"
      - name: Verify the public buyer pages remain healthy
        run: |
          python3 - <<'PY'
          import json,urllib.request
          origin='https://mojplaywin.com'
          for route in ('/store/','/store/product/72/checkout/','/store/product/225/checkout/','/store/product/879/checkout/','/commerce/trx-easy/purchases/','/commerce/trx-easy/'):
              req=urllib.request.Request(origin+route,headers={'Cache-Control':'no-cache','Cookie':''})
              with urllib.request.urlopen(req,timeout=25) as r:
                  if r.status!=200: raise RuntimeError('GUEST_ROUTE_NOT_200:'+route)
                  if route == '/commerce/trx-easy/purchases/':
                      body=r.read(20000)
                      if b'No active purchase session' not in body:
                          raise RuntimeError('GUEST_RECOVERY_BODY_MISSING')
                      if r.headers.get('X-Robots-Tag') != 'noindex, nofollow':
                          raise RuntimeError('GUEST_RECOVERY_NOINDEX_MISSING')
                      if 'no-store' not in r.headers.get('Cache-Control',''):
                          raise RuntimeError('GUEST_RECOVERY_NOSTORE_MISSING')
                  if route == '/commerce/trx-easy/':
                      body=r.read(220000)
                      if not all(('/store/product/'+i+'/checkout/').encode() in body for i in ('72','225','879')):
                          raise RuntimeError('PUBLIC_TRX_CATALOG_MISSING_REAL_SKU')
                      if b'/commerce/book/779/' in body or b'/store/product/779/checkout/' in body or b'$0.03' in body:
                          raise RuntimeError('PUBLIC_TRX_MICRO_TRIAL_EXPOSED')
                      if b'No account is required' not in body:
                          raise RuntimeError('PUBLIC_TRX_GUEST_COPY_MISSING')
              print('MPW_GUEST_PUBLIC_ROUTE='+json.dumps({'route':route,'http':200,'anonymous':True,'payment_created':False}))
          before=json.load(open('/tmp/mpw-guest-baseline.json'))
          for route,status in before.items():
              with urllib.request.urlopen(origin+route,timeout=25) as r:
                  if r.status!=status: raise RuntimeError('BASELINE_ROUTE_CHANGED:'+route)
          print('MPW_GUEST_PUBLIC_SMOKE=PASS')
          PY
      - name: Restore exact prior modules if release verification fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          remote="/home/zomorod2/.mpw-guest-release-$GITHUB_RUN_ID"
          timeout 100s ssh -T -F "$RUNNER_TEMP/mpw-guest-ssh/config" saeit-cpanel \
            "python3 '$remote/release.py' rollback '$GITHUB_RUN_ID'"
      - name: Remove runner-only SSH material
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-guest-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
