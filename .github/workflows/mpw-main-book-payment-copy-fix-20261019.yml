name: MojPlayWin correct book purchase availability wording main store only
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-main-book-payment-copy-fix-20261019.yml"]
permissions: {contents: read}
jobs:
  exact_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check bounded store patch source
        run: python3 -m py_compile scripts/mpw_two_books_live_payment_copy_20261019.py
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Update book payment notice without changing commercial settings
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 100s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - publish '$GITHUB_RUN_ID'" < scripts/mpw_two_books_live_payment_copy_20261019.py
      - name: Reload only pinned production app after main-store template edit
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 40s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          h=Path('/home/zomorod2');web=h/'mojplaywin.com';app=h/'Saeit-staging'
          wsgi=web/'passenger_wsgi.py';store=app/'core/templates/mojplaywin/store.html'
          if not wsgi.is_file() or wsgi.is_symlink() or web.is_symlink() or store.is_symlink():
              raise RuntimeError('Unverified app root')
          if "APP='/home/zomorod2/Saeit-staging'" not in wsgi.read_text('utf8','replace'):
              raise RuntimeError('App pin mismatch')
          if store.read_bytes().count(b'To purchase, sign in and follow the secure, order-specific checkout invoice.') != 2:
              raise RuntimeError('Book copy not installed')
          tmp=web/'tmp'
          if tmp.is_symlink():raise RuntimeError('Unsafe cache directory')
          tmp.mkdir(exist_ok=True)
          marker=tmp/'restart.txt'
          if marker.is_symlink():raise RuntimeError('Unsafe marker')
          marker.touch()
          print('MPW_PURCHASE_COPY_RELOADED=REQUESTED')
          PY
      - name: Verify checkout directions and protected page status via live HTTPS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          ok=0
          for i in range(18):
              req=urllib.request.Request('https://mojplaywin.com/store/?buyer_notice_fix='+str(i)+'-'+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as r:html=r.read(950000).decode('utf8','replace')
              good=html.count('To purchase, sign in and follow the secure, order-specific checkout invoice.')==2 and 'Checkout is not open.' not in html and html.count('href="/store/product/72/checkout/"')==1 and html.count('href="/store/product/225/checkout/"')==1
              if i>=5:
                  if not good:raise RuntimeError('Inconsistent public checkout directions')
                  ok+=1
          for route in ('/','/store/','/store/product/72/','/store/product/225/','/taniya/','/farnaz/','/saman/','/picm/'):
              with urllib.request.urlopen('https://mojplaywin.com'+route,timeout=18) as r:
                  if r.status!=200:raise RuntimeError('Protected page unhealthy')
          print('MPW_BUYER_DIRECTIONS_LIVE=VERIFIED;SIBLING_HTTP=OK;SAMPLES='+str(ok))
          PY
      - name: Roll back exact main-store copy if verification fails
        if: failure() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          timeout 90s ssh -T -F "$d/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback '$GITHUB_RUN_ID'" < scripts/mpw_two_books_live_payment_copy_20261019.py
