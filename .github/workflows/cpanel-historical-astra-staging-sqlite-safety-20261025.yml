name: cPanel old Astra staging snapshots customer-safety READ ONLY
on:
  pull_request:
    paths:
      - .github/workflows/cpanel-historical-astra-staging-sqlite-safety-20261025.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check aged staged SQLite backups for customer records and live references
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/cpanel-incomplete-inspect"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          printf 'Host saeit-vps\n  HostName 178.239.147.150\n  User githubops\n  Port 22\n  IdentityFile %s/vps.key\n  UserKnownHostsFile %s/vps.known\nHost saeit-cpanel\n  HostName zohal.pws-dns.net\n  User zomorod2\n  Port 1396\n  IdentityFile %s/host.key\n  UserKnownHostsFile %s/host.known\n  ProxyJump saeit-vps\nHost *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 10\n  ConnectionAttempts 1\n  ForwardAgent no\n  RequestTTY no\n' "$d" "$d" "$d" "$d" > "$d/config"
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          timeout 330s ssh -T -F "$d/config" saeit-cpanel python3 - <<'PY'
          from pathlib import Path
          import os,json,gzip,sqlite3,subprocess,time,re,stat
          home=Path('/home/zomorod2')
          root=home/'Saeit-staging/var/factory/astra-backups'
          if os.geteuid()==0 or Path.home()!=home or root.is_symlink() or not root.is_dir():
              raise SystemExit('UNSAFE_CPANEL_STAGING_ROOT')
          items=[]
          for here,dirs,files in os.walk(str(root),followlinks=False):
              for n in dirs+files:
                  p=Path(here)/n
                  if p.is_symlink():raise SystemExit('BACKUP_TREE_HAS_SYMLINK')
              for n in files:
                  p=Path(here)/n
                  if not p.is_file():raise SystemExit('NONFILE_BACKUP_ENTRY')
                  items.append(p)
          names=[str(p.relative_to(root)) for p in items]
          proc=subprocess.run(['ps','-u','zomorod2','-o','args='],capture_output=True,text=True,timeout=12)
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=12)
          passenger=subprocess.run(['uapi','--output=json','PassengerApps','list_applications'],capture_output=True,text=True,timeout=30)
          if passenger.returncode!=0:raise SystemExit('PASSENGER_PREFLIGHT_FAILED')
          references=(proc.stdout if proc.returncode==0 else '')+'\n'+(cron.stdout if cron.returncode==0 else '')+'\n'+passenger.stdout
          ref=str(root) in references or 'astra-backups' in references
          c=sqlite3.connect(':memory:')
          deserializable=hasattr(c,'deserialize')
          c.close()
          checks=[]
          for p in sorted(items):
              st=p.stat()
              item={'relative_name':str(p.relative_to(root))[:170],'bytes':st.st_size,
                    'age_days':round((time.time()-st.st_mtime)/86400,1)}
              if p.suffix=='.gz' and p.name.endswith('.sqlite3.gz') and deserializable and st.st_size<=15000000:
                  try:
                      with gzip.open(str(p),'rb') as f:buf=f.read(96*1024*1024+1)
                      if len(buf)>96*1024*1024:raise ValueError('sqlite_too_large')
                      if not buf.startswith(b'SQLite format 3'):raise ValueError('not_sqlite')
                      db=sqlite3.connect(':memory:')
                      try:
                          db.deserialize(buf)
                          tab=[t[0] for t in db.execute("SELECT name FROM sqlite_master WHERE type='table'")]
                          patterns=re.compile('order|payment|buyer|customer|client|invoice|contact|inquiry|trade|email|subscriber|enroll|purchase|sales|wallet|ledger|chat|message|lead',re.I)
                          flagged={}
                          for table in tab:
                              if patterns.search(table):
                                  quoted='"'+table.replace('"','""')+'"'
                                  flagged[table]=int(db.execute('SELECT COUNT(*) FROM '+quoted).fetchone()[0])
                          item['flagged_counts']=flagged
                          item['product_rows']=int(db.execute('SELECT COUNT(*) FROM core_product').fetchone()[0]) if 'core_product' in tab else None
                          item['schema_tables']=len(tab)
                          item['sqlite_ok']=True
                      finally:db.close()
                  except Exception as e:item['sqlite_ok']=False;item['scan_error']=type(e).__name__
              checks.append(item)
          print('CPANEL_ASTRA_OLD_BACKUP_SAFETY='+json.dumps({'items':checks[:80],'all_file_count':len(items),'all_bytes':sum(p.stat().st_size for p in items),
          'has_sqlite_deserialize':deserializable,'active_reference':ref,'mutations':0,'read_only':True},sort_keys=True),flush=True)

          PY
          echo CPANEL_ASTRA_OLD_BACKUP_READONLY=PASS
