name: VPS to cPanel Django Store Identity Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-store-identity-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saeit-factory-store-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH identities
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/factory-store-preflight"
          install -d -m 700 "$d"
          for item in VPS_KEY HOST_KEY; do
            key="$d/${item}.key"
            printf '%s' "${!item}" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$key"
            chmod 600 "$key"
            ssh-keygen -y -P '' -f "$key" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Inspect factory product handoff source
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-vps 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/factory-runtime"
          echo VPS_USER="$(id -un)"
          test -s "$base/private/autonomous-product-cycle/production-state.json"
          test -s "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          echo VPS_MANUFACTURED_ZIP_PRESENT
          stat -c 'VPS_ZIP_BYTES=%s PERMISSIONS=%a' "$base/private/autonomous-product-cycle/digital-products/farm_enterprise_economics/farm_enterprise_economics-internal-qa.zip"
          python3 - "$base/private/autonomous-product-cycle/production-state.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          for k in ('mode','depends_on_orders','built_product_count','artifact_qa_passed','publishable_product_count','store_distribution_state'):
            print('VPS_FACTORY_'+k.upper()+'='+str(j.get(k)))
          PY
          REMOTE
      - name: Inspect cPanel private staging and storefront runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo CPANEL_USER="$(id -un)"
          echo CPANEL_HOME="$HOME"
          for path in /home/zomorod2/Saeit-staging /home/zomorod2/zomorodmelal.ir /home/zomorod2/mojplaywin.com /home/zomorod2/mojtabarozegar.ir /home/zomorod2/public_html; do
            if test -d "$path" && test ! -L "$path"; then
              echo CPANEL_DIR_PRESENT="$(basename "$path")"
              if test -f "$path/manage.py"; then echo CPANEL_DJANGO_SOURCE="$(basename "$path")"; fi
              if test -f "$path/passenger_wsgi.py"; then echo CPANEL_PASSENGER_SOURCE="$(basename "$path")"; fi
              if test -d "$path/.venv"; then echo CPANEL_LOCAL_VENV="$(basename "$path")"; fi
            else
              echo CPANEL_DIR_MISSING="$(basename "$path")"
            fi
          done
          test -d /home/zomorod2/Saeit-staging
          test -w /home/zomorod2/Saeit-staging
          echo CPANEL_STAGING_WRITABLE
          if test -f /home/zomorod2/Saeit-staging/core/models.py; then
            grep -q '^class Product(' /home/zomorod2/Saeit-staging/core/models.py && echo CPANEL_DJANGO_PRODUCT_MODEL_PRESENT
          fi
          command -v python3 >/dev/null && python3 --version
          df -h "$HOME" | tail -n 1 | awk '{print "CPANEL_DISK_FREE=" $4}'
          REMOTE
      - name: Identify Django store binding and read-only product table
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP=/home/zomorod2/Saeit-staging
          cd "$APP"
          for docroot in /home/zomorod2/public_html /home/zomorod2/mojplaywin.com; do
            if test -f "$docroot/passenger_wsgi.py"; then
              if grep -Fq 'Saeit-staging' "$docroot/passenger_wsgi.py"; then
                echo "DOCROOT_STAGING_LINKED=$(basename "$docroot")"
              else
                echo "DOCROOT_STAGING_NOT_CONFIRMED=$(basename "$docroot")"
              fi
            fi
          done
          for python in "$APP/.venv/bin/python" "$APP/venv/bin/python" /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python /home/zomorod2/virtualenv/Saeit-staging/3.10/bin/python /home/zomorod2/virtualenv/Saeit/3.11/bin/python /home/zomorod2/virtualenv/Saeit/3.10/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.11/bin/python /home/zomorod2/virtualenv/mojplaywin.com/3.10/bin/python; do
            if test -x "$python" && "$python" -c 'import django' >/dev/null 2>&1; then
              echo "DJANGO_CANDIDATE_AVAILABLE=$(basename "$(dirname "$(dirname "$python")")")"
              DJANGO_SETTINGS_MODULE=config.settings "$python" - <<'PY'
          import django
          from django.conf import settings
          try:
              django.setup()
              from django.apps import apps
              from django.db import connection
              from django.urls import resolve
              p=apps.get_model("core","Product")
              allowed={str(x).lower() for x in settings.ALLOWED_HOSTS}
              for host in ("zomorodmelal.ir","mojplaywin.com","mojtabarozegar.com"):
                  print("DJANGO_DOMAIN_CONFIGURED_"+host.replace(".","_").upper()+"="+str(host in allowed))
              print("DJANGO_SETTINGS_DEBUG_DISABLED="+str(settings.DEBUG is False))
              print("DJANGO_PRODUCT_TABLE="+p._meta.db_table)
              print("DJANGO_PRODUCT_COUNT="+str(p.objects.count()))
              print("DJANGO_DB_VENDOR="+str(connection.vendor))
              print("DJANGO_STORE_URL_RESOLVED="+str(resolve("/store/").url_name=="store"))
              print("DJANGO_PRODUCT_API_URL_RESOLVED="+str(resolve("/api/products/").url_name=="product-list"))
          except Exception as exc:
              print("DJANGO_PROBE_ERROR="+type(exc).__name__)
          PY
              break
            fi
          done
          echo STORE_IDENTITY_PROBE_DONE
          REMOTE
      - name: Inspect live Zomorod document-root performance and routing
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/zomorod2/public_html
          APP=/home/zomorod2/Saeit-staging
          for item in "$ROOT/index.html" "$ROOT/.htaccess" "$ROOT/passenger_wsgi.py"; do
            if test -f "$item" && test ! -L "$item"; then
              stat -c 'LIVE_FILE path=%n bytes=%s mode=%a sha256=%n' "$item"
              sha256sum "$item" | awk '{print "LIVE_SHA256 path='"$item"' value="$1}'
            else
              echo "LIVE_FILE_MISSING_OR_UNSAFE=$item"
            fi
          done
          if test -f "$ROOT/.htaccess"; then
            grep -Eiq 'deflate|brotli|expires|cache-control|compression' "$ROOT/.htaccess" && echo LIVE_COMPRESSION_DIRECTIVE_PRESENT || echo LIVE_COMPRESSION_DIRECTIVE_NOT_FOUND
          fi
          if test -f "$ROOT/passenger_wsgi.py"; then
            grep -Fq 'Saeit-staging' "$ROOT/passenger_wsgi.py" && echo LIVE_PASSENGER_TARGET=SAEIT_STAGING || echo LIVE_PASSENGER_TARGET=UNCONFIRMED
          fi
          if test -f "$APP/manage.py"; then
            echo LIVE_APP_SOURCE_PRESENT
            stat -c 'APP_SOURCE_BYTES=%s APP_SOURCE_MTIME=%y' "$APP/manage.py"
          fi
          REMOTE
      - name: Read live root routing rules before performance fix
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/zomorod2/public_html
          echo LIVE_HTACCESS_BEGIN
          sed -n '1,220p' "$ROOT/.htaccess"
          echo LIVE_HTACCESS_END
          REMOTE
      - name: Apply guarded root compression fix
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/zomorod2/public_html
          HT="$ROOT/.htaccess"
          EXPECTED=b2562f36aec90bac80fbf3bc40173bf5b416adc2e22c0736a907ae532914f3a1
          test -f "$HT" && test ! -L "$HT"
          if grep -Fq 'ZM-COMPRESSION-V1' "$HT"; then
            echo LIVE_COMPRESSION_ALREADY_MARKED
            exit 0
          fi
          backup="$HOME/.backups/zomorod-root-compression/$(date +%Y%m%d-%H%M%S)"
          install -d -m 700 "$backup"
          cp -p "$HT" "$backup/.htaccess.before"
          sha256sum "$HT" > "$backup/.htaccess.before.sha256"
          tmp="$(mktemp "$HOME/.htaccess.zm.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          cat "$HT" > "$tmp"
          cat >> "$tmp" <<'BLOCK'

          # ZM-COMPRESSION-V1
          <IfModule mod_deflate.c>
              AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
              AddOutputFilterByType DEFLATE application/javascript application/json application/xml application/xhtml+xml application/rss+xml image/svg+xml
          </IfModule>
          BLOCK
          test "$(wc -c < "$tmp")" -gt "$(wc -c < "$HT")"
          install -m 0644 "$tmp" "$HT"
          test "$(sha256sum "$HT" | awk '{print $1}')" != "$EXPECTED"
          echo LIVE_COMPRESSION_FIX_APPLIED backup="$backup"
          REMOTE
      - name: Verify live root compression
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI -H 'Accept-Encoding: gzip' https://zomorodmelal.ir/ | tr -d '\r' | grep -Eiq 'content-encoding: gzip'
          echo LIVE_ROOT_GZIP_PASS
      - name: Apply guarded MojPlayWin static store fallback
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/factory-store-preflight/config" saeit-cpanel 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/zomorod2/mojplaywin.com
          HT="$ROOT/.htaccess"
          STORE="$ROOT/store"
          test -d "$ROOT" && test ! -L "$ROOT"
          test -f "$HT" && test ! -L "$HT"
          if grep -Fq 'MPW_STATIC_STORE_FALLBACK_V1' "$HT"; then
            echo MPW_STATIC_STORE_FALLBACK_ALREADY_PRESENT
            exit 0
          fi
          backup="$HOME/.backups/mojplaywin-static-store/$(date +%Y%m%d-%H%M%S)"
          install -d -m 700 "$backup"
          cp -p "$HT" "$backup/.htaccess.before"
          sha256sum "$HT" > "$backup/.htaccess.before.sha256"
          if test -e "$STORE" || test -L "$STORE"; then
            test -d "$STORE" && test ! -L "$STORE"
            if test -e "$STORE/index.html"; then
              cp -p "$STORE/index.html" "$backup/store-index.before"
              sha256sum "$STORE/index.html" > "$backup/store-index.before.sha256"
            fi
          else
            install -d -m 755 "$STORE"
          fi
          if test -e "$STORE/index.html"; then
            grep -Fq 'MPW_STATIC_STORE_FALLBACK_V1' "$STORE/index.html" || { echo EXISTING_STORE_INDEX_NOT_OWNED; exit 1; }
          else
            cat > "$STORE/index.html" <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Store | MojPlayWin</title><meta name="description" content="Original digital books and a client-ready website kit from MojPlayWin."><style>
          :root{color-scheme:dark;--bg:#080807;--panel:#15140f;--line:#d6ad55;--text:#f5f0e4;--muted:#c5c0b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3b2f16 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(1180px,100%);margin:auto;padding:24px 18px 60px}nav{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 16px;border:1px solid #d6ad5580;border-radius:14px;background:#11110e}a{color:#f0cf82}h1{font-size:clamp(2.3rem,6vw,5rem);line-height:1.05;margin:56px 0 12px}h2{font-size:1.25rem;margin:0 0 8px;color:#f0cf82}p{color:var(--muted)}.lead{max-width:760px;font-size:1.08rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}.card{display:flex;flex-direction:column;min-height:290px;padding:22px;border:1px solid #d6ad5580;border-radius:16px;background:linear-gradient(155deg,#1b1912,#0e0e0c)}.price{margin-top:auto;color:#f0cf82;font-size:1.2rem;font-weight:800}.button{display:inline-block;margin-top:14px;padding:10px 13px;border:1px solid #f0cf82;border-radius:9px;text-decoration:none;font-weight:700}.info{margin-top:24px;padding:18px;border-left:3px solid #d6ad55;background:#12120f;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
          </style></head><body><main><nav><strong>MOJPLAYWIN</strong><a href="/">Home</a></nav><h1>Digital products with a clear purpose.</h1><p class="lead">Explore three original digital products. Review the details, then use the secure checkout route for a guest TRX invoice.</p><section class="grid" aria-label="MojPlayWin products"><article class="card"><h2>The Science and Practice of Chess Improvement</h2><p>English PDF · 415 pages · 84-day training plan, worksheets and game-review guidance.</p><div class="price">US $7.50</div><a class="button" href="/store/product/72/">View details</a><a class="button" href="/store/product/72/checkout/">Guest checkout with TRX</a></article><article class="card"><h2>Taniya and the Little Baker Worms</h2><p>English illustrated PDF · 40 pages · landscape-format storybook for young readers and families.</p><div class="price">US $4.00</div><a class="button" href="/store/product/225/">View details</a><a class="button" href="/store/product/225/checkout/">Guest checkout with TRX</a></article><article class="card"><h2>Atelier Interior — Client-Ready Website Kit</h2><p>Responsive HTML/CSS/JavaScript website kit with gallery, editable details and inquiry handoff.</p><div class="price">US $6.80</div><a class="button" href="/store/product/879/">View details</a><a class="button" href="/store/product/879/checkout/">Guest checkout with TRX</a></article></section><aside class="info"><strong>How payment works:</strong> enter your email, create the order-specific native TRX invoice, and send only the exact amount shown on the invoice. No wallet connection is required. The file unlocks only after server-confirmed on-chain payment.</aside><p><small>MPW_STATIC_STORE_FALLBACK_V1 · Product details, payment verification and delivery remain server-controlled.</small></p></main></body></html>
          HTML
            chmod 644 "$STORE/index.html"
          fi
          tmp="$(mktemp "$HOME/.mpw-htaccess.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          cat > "$tmp" <<'RULES'
          # MPW_STATIC_STORE_FALLBACK_V1
          RewriteEngine On
          RewriteCond %{REQUEST_METHOD} ^GET$
          RewriteCond %{REQUEST_URI} ^/store/?$
          RewriteRule ^store/?$ store/index.html [END]
          
          RULES
          cat "$HT" >> "$tmp"
          install -m 0644 "$tmp" "$HT"
          grep -Fq 'MPW_STATIC_STORE_FALLBACK_V1' "$HT"
          grep -Fq 'MPW_STATIC_STORE_FALLBACK_V1' "$STORE/index.html"
          echo MPW_STATIC_STORE_FALLBACK_APPLIED backup="$backup"
          REMOTE
      - name: Verify MojPlayWin static store and live checkout
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --compressed --max-time 30 https://mojplaywin.com/store/ | grep -Fq 'MPW_STATIC_STORE_FALLBACK_V1'
          for url in https://mojplaywin.com/store/product/72/checkout/ https://mojplaywin.com/store/product/225/checkout/ https://mojplaywin.com/store/product/879/checkout/; do
            curl -fsSL --compressed --max-time 30 "$url" | grep -Eiq 'name="email"|type="email"'
          done
          echo MPW_STATIC_STORE_AND_GUEST_CHECKOUT=PASS
      - name: Clean temporary SSH keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/factory-store-preflight"
