name: MojPlayWin isolated main Passenger refresh and live sale guarded release
on:
  push:
    branches: [mpw-two-books-unified-release-20261019]
    paths: [".github/workflows/mpw-two-books-main-passenger-refresh-release-20261019.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish host-pinned private relay without disclosing keys
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Verify isolated release artifact and stage on private host
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_live_two_books_safe_release_20261019.py
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          sha256sum scripts/mpw_live_two_books_safe_release_20261019.py | cut -d' ' -f1 > "$RUNNER_TEMP/mpw-release.sha"
          timeout 30s ssh -T -F "$d/config" saeit-cpanel 'install -d -m 700 /home/zomorod2/.mpw-commerce-two-books'
          timeout 35s scp -q -F "$d/config" scripts/mpw_live_two_books_safe_release_20261019.py saeit-cpanel:/home/zomorod2/.mpw-commerce-two-books/live_release.staged.py
      - name: Activate only books 72 and 225 with rollback if buyer HTTP pages fail
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mojplaywin-inventory-ssh"
          HASH=$(cat "$RUNNER_TEMP/mpw-release.sha")
          timeout 260s ssh -T -F "$d/config" saeit-cpanel \
            "MPW_EXPECTED_RELEASE_SHA=$HASH /home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,pathlib,hashlib,subprocess,sys
          root=pathlib.Path('/home/zomorod2/.mpw-commerce-two-books')
          script=root/'live_release.staged.py'
          expected=os.environ['MPW_EXPECTED_RELEASE_SHA']
          assert script.is_file() and not script.is_symlink() and root.is_dir() and not root.is_symlink()
          assert hashlib.sha256(script.read_bytes()).hexdigest()==expected
          job=subprocess.run(['/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python',str(script)],
              capture_output=True,text=True,timeout=205)
          for line in job.stdout.splitlines():
            if line.startswith(('MPW_PRODUCTION_OPEN=','MPW_PRODUCTION_RELEASE_FAILED=','MPW_PRODUCTION_ROLLBACK=','MPW_RELEASE_FAILURE_CODE=')):
              print(line,flush=True)
          if job.returncode:
            print('MPW_RELEASE_RESULT=BLOCKED_WITH_SAFETY_ROLLBACK',flush=True)
            raise RuntimeError('Two-book guarded activation checks did not pass')
          if 'MPW_PRODUCTION_OPEN=VERIFIED_MAIN_DOMAIN_TWO_BOOKS' not in job.stdout:
            raise RuntimeError('No verified live activation receipt')
          print('MPW_RELEASE_RESULT=CONFIRMED_LIVE_TWO_BOOKS',flush=True)
          PY
