name: Test lossless InnoDB row compression in isolated probe table
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-innodb-temporary-row-compression-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-mysql-compression-probe
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Read MySQL table sizes using temporary local client config with no leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess,tempfile,os,re,json,urllib.parse
          home=Path.home()
          assert str(home)=="/home/zomorod2"
          envfile=home/"Saeit-staging/.env"
          assert envfile.is_file()
          raw=next((line.split("=",1)[1].strip().strip("'\"") for line in envfile.read_text().splitlines() if line.startswith("DATABASE_URL=")),None)
          assert raw and "mysql" in raw
          parsed=urllib.parse.urlsplit(raw)
          db=parsed.path.strip("/")
          assert db=="zomorod2_sites_main"
          opts={"user":urllib.parse.unquote(parsed.username or ""), "password":urllib.parse.unquote(parsed.password or ""), "host":parsed.hostname or "localhost", "port":str(parsed.port or 3306)}
          assert opts["user"] and opts["password"]
          with tempfile.TemporaryDirectory(prefix=".mysql-readonly-",dir=str(home/".cagefs/tmp")) as tmp:
              optfile=Path(tmp)/"client.cnf"
              def esc(v):return '"'+str(v).replace("\\","\\\\").replace('"','\\"')+'"'
              optfile.write_text("[client]\n"+"".join(f"{k}={esc(v)}\n" for k,v in opts.items()))
              optfile.chmod(0o600)
              table="zomorod_lossless_probe_20261018"
              def sql(query,t=50):
                  r=subprocess.run(["mysql","--defaults-extra-file="+str(optfile),"--batch","--skip-column-names","--raw",db,"--execute",query],capture_output=True,text=True,timeout=t)
                  if r.returncode!=0:raise RuntimeError("SQL_CHECK_FAILED_"+str(r.returncode)+" "+("permissions" if "denied" in r.stderr.lower() else "unsupported"))
                  return r.stdout.strip()
              assert sql("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_NAME='"+table+"'")=="0"
              created=False
              try:
                  sql("CREATE TABLE "+table+" (id BIGINT PRIMARY KEY, details LONGTEXT) ENGINE=InnoDB ROW_FORMAT=COMPRESSED KEY_BLOCK_SIZE=8",60)
                  created=True
                  sql("INSERT INTO "+table+" (id,details) SELECT id,details FROM core_factoryevidence WHERE details IS NOT NULL ORDER BY id LIMIT 20",70)
                  probe=sql("SELECT COUNT(*),COALESCE(SUM(OCTET_LENGTH(details)),0),COALESCE(SUM(CRC32(details)),0) FROM "+table,50)
                  orig=sql("SELECT COUNT(*),COALESCE(SUM(OCTET_LENGTH(details)),0),COALESCE(SUM(CRC32(details)),0) FROM (SELECT details FROM core_factoryevidence WHERE details IS NOT NULL ORDER BY id LIMIT 20) a",50)
                  assert probe==orig
                  fmt=sql("SELECT ROW_FORMAT,DATA_LENGTH FROM information_schema.TABLES WHERE TABLE_SCHEMA='zomorod2_sites_main' AND TABLE_NAME='"+table+"'",40)
                  print("ISOLATED_ROW_FORMAT="+fmt)
                  print("ISOLATED_ROW_DATA_EQUALITY=yes")
                  print("ISOLATED_SOURCE_ROWS_UNMODIFIED=yes")
              finally:
                  if created:
                      sql("DROP TABLE "+table,70)
                  print("ISOLATED_PROBE_TABLE_REMOVED="+str(created))
          print("MYSQL_ISOLATED_COMPRESSION_TEST_COMPLETE=yes")
          PY
          REMOTE
      - name: Delete SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
