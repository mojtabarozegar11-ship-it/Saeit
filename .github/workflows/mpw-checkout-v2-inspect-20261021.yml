name: MojPlayWin inspect modern buyer checkout template structure
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-checkout-v2-inspect-20261021.yml
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned VPS to cPanel connection
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-csp-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Safely inspect only checkout and billing template shape (read only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/mpw-csp-ssh/config" saeit-cpanel python3 - <<'PY'
          import re,json,hashlib
          from pathlib import Path
          base=Path('/home/zomorod2/Saeit-staging')
          for rel in ['mpw_commerce/templates/mpw_commerce/product_checkout.html',
                      'mpw_commerce/templates/mpw_commerce/purchased_downloads.html',
                      'mpw_commerce/templates/mpw_commerce/customer_login.html',
                      'core/templates/brands/mojplaywin/checkout.html']:
              p=base/rel
              if not p.is_file() or p.is_symlink():raise RuntimeError('Missing or unsafe template')
              s=p.read_text('utf8','replace')
              tags=[]
              for m in re.finditer(r'<(main|header|footer|section|article|aside|div|form|button|input|h1|h2|h3|label|span|p|nav|style|script|link)\b[^>]{0,1200}>',s,re.I):
                  t=m.group(0)
                  attrs={}
                  for key in ('class','id','type','name'):
                      v=re.search(key+r'=["\x27]([^"\x27]{1,120})',t,re.I)
                      if v:attrs[key]=v.group(1)
                  if m.group(1).lower() in ('input','script') and attrs.get('name') not in ('csrfmiddlewaretoken','network','amount','txid','action'):
                      attrs.pop('name',None)
                  tags.append(dict(tag=m.group(1).lower(),attrs=attrs))
              print('MPW_FINTECH_TEMPLATE_STRUCTURE='+json.dumps({
                'template':rel,'sha256':hashlib.sha256(s.encode()).hexdigest(),
                'bytes':len(s),'has_head':s.count('</head>'),'has_main':s.count('</main>'),
                'styles':len(re.findall(r'<style\b',s,re.I)),
                'scripts':len(re.findall(r'<script\b',s,re.I)),
                'form_count':len(re.findall(r'<form\b',s,re.I)),
                'csrf_literal_count':s.count('{% csrf_token %}'),
                'sample':tags[:100]},ensure_ascii=False))
          PY
      - name: Inspect actual low-value TRX trial route and additional payment templates
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/mpw-csp-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python -" <<'PY'
          import os,sys,json,inspect,ast,re,hashlib
          from pathlib import Path
          root=Path('/home/zomorod2/Saeit-staging')
          os.chdir(root);sys.path.insert(0,str(root))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django;django.setup()
          from django.urls import resolve
          for url in ('/commerce/book/779/','/store/product/779/checkout/','/commerce/book/72/','/store/product/72/checkout/'):
              try:
                  fn=inspect.unwrap(resolve(url).func)
                  source=inspect.getsource(fn)
                  templates=sorted(set(re.findall(r'["\x27]([A-Za-z0-9_./-]+\.html)["\x27]',source)))
                  print('MPWF_PAYMENT_ROUTE='+json.dumps({'path':url,'module':fn.__module__,
                       'function':fn.__name__,'templates':templates[:15]},ensure_ascii=False))
              except Exception as exc:
                  print('MPWF_PAYMENT_ROUTE='+json.dumps({'path':url,'error':type(exc).__name__}))
          tdir=root/'mpw_commerce/templates/mpw_commerce'
          for p in sorted(tdir.glob('*.html')):
              raw=p.read_text('utf8','replace')
              print('MPWF_ADDITIONAL_TEMPLATE='+json.dumps({'name':p.name,'bytes':len(raw),
                   'sha':hashlib.sha256(raw.encode()).hexdigest(),
                   'has_invoice':bool(re.search('invoice|payment|checkout|TRX',raw,re.I)),
                   'has_head':raw.count('</head>'),'style_count':len(re.findall(r'<style\b',raw)),
                   'script_count':len(re.findall(r'<script\b',raw)),
                   'forms':len(re.findall(r'<form\b',raw))}))
          PY
      - name: Read only the 373-byte legacy checkout template and base extension block names
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -F "$RUNNER_TEMP/mpw-csp-ssh/config" saeit-cpanel python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('/home/zomorod2/Saeit-staging')
          checkout=root/'core/templates/brands/mojplaywin/checkout.html'
          base=root/'core/templates/brands/mojplaywin/base.html'
          text=checkout.read_text('utf8','replace')
          if len(text)>1200 or any(x in text.lower() for x in ('private_key','secret_key','password=')):
              raise RuntimeError('Unexpected checkout content, refuse to print')
          print('MPWF_LEGACY_CHECKOUT_SOURCE='+json.dumps(text))
          text=base.read_text('utf8','replace')
          blocks=re.findall(r'\{%\s*block\s+([a-zA-Z_][a-zA-Z_0-9]*)\s*%\}',text)
          print('MPWF_LEGACY_BASE_BLOCKS='+json.dumps(blocks))
          PY
      - name: Remove temporary keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-csp-ssh"
