name: Personal V17 inner pages read-only audit
on:
  push:
    branches: ['feat/mojtaba-personal-inner-pages-20261015']
    paths: ['.github/workflows/mojtaba-inner-pages-audit.yml']
permissions:
  contents: read
concurrency:
  group: personal-v17-inner-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/photo-relay"
          mkdir -p "$d"
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          echo "SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
      - name: Inspect all personal templates without changing them
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh -F "$SSH_CONFIG" saeit-host 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="/home/zomorod2/mojtaba_personal/mojtaba_roozegar_personal_v17"
          test -f "$app/manage.py"
          python3 - "$app" <<'PY'
          import pathlib,sys,hashlib
          root=pathlib.Path(sys.argv[1])
          names=["about","projects","posts","gallery","resume","activities","memories","stories"]
          for name in names:
              p=root/"templates/personal_site/core"/(name+".html")
              assert p.is_file() and not p.is_symlink()
              data=p.read_text(encoding="utf-8")
              print("=== TEMPLATE_START "+name+" SHA256="+hashlib.sha256(data.encode()).hexdigest()+" BYTES="+str(len(data.encode()))+" ===")
              print(data[:15000])
              print("=== TEMPLATE_END "+name+" ===")
          for name in ("base.html","core/page_header.html"):
              p=root/"templates/personal_site"/name
              if p.is_file():
                  print("=== STRUCTURE "+name+" ===")
                  print(p.read_text(encoding="utf-8")[:4500])
          print("AUDIT_READ_ONLY_COMPLETE=yes")
          PY
          REMOTE
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/photo-relay"
