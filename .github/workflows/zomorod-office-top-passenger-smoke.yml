name: Test isolated top-level Zomorod Passenger binding with rollback
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-top-passenger-smoke.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-office-independent-preflight-once
  cancel-in-progress: false
jobs:
  preview-only-fix:
    if: github.event.pull_request.number == 1724 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/zomorod-office-messaging-current-main-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            exit 1
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Scoped Passenger and login smoke with in-session rollback
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          test "$COMMAND_HOST" = saeit-cpanel
          timeout 240s ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = zomorod2
          rel="zomorod_office_top_preflight_9ab790b15a42"
          uri="/office-preflight-9ab790b15a42"
          home="/home/zomorod2"
          root="$home/$rel"
          web="$home/public_html"
          target="$web$uri/.htaccess"
          initial="$root/.public-html-htaccess.original"
          backup="$root/.top-level-passenger-original"
          marker="# ZOMOROD_PREVIEW_PASSENGER_ROUTE_BEGIN"
          py="$home/virtualenv/$rel/3.10/bin/python"
          selector="/usr/sbin/cloudlinux-selector"
          test -d "$root" && test ! -L "$root"
          test -f "$root/.preview-registered" && test ! -L "$root/.preview-registered"
          grep -Fxq 'source=9ab790b15a42b3ea24e46982b361e9596d0ec828' "$root/.preview-registered"
          grep -Fxq 'uri=office-preflight-9ab790b15a42' "$root/.preview-registered"
          test -f "$root/office_passenger_wsgi.py"
          test -f "$root/.env" && test "$(stat -c '%a' "$root/.env")" = 600
          grep -Fxq 'COMPANY_MESSAGING_SEND_ENABLED=false' "$root/.env"
          grep -Fxq 'COMPANY_MARKETING_PUBLISH_ENABLED=false' "$root/.env"
          grep -Fxq 'ZM_OFFICE_BASE_PATH=/office-preflight-9ab790b15a42' "$root/.env"
          grep -Fxq "DATABASE_URL=sqlite:///$root/office-preview.sqlite3" "$root/.env"
          test -x "$py" && test -x "$selector"
          test -f "$target" && test ! -L "$target"
          test -d "$web$uri" && test ! -L "$web$uri"
          test -f "$initial" && test ! -L "$initial"
          test -f "$web/.htaccess" && test ! -L "$web/.htaccess"
          cmp -s "$web/.htaccess" "$initial"
          grep -Eq '^[[:space:]]*PassengerEnabled[[:space:]]+off[[:space:]]*$' "$web/company/.htaccess"
          test ! -e "$backup" && test ! -L "$backup"
          python3 -B - "$root/office-preview.sqlite3" "$target" <<'PY'
          import sqlite3,sys
          from pathlib import Path
          with sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM auth_user").fetchone()[0]==0
          lines=[line.strip() for line in Path(sys.argv[2]).read_text().splitlines()
                 if line.strip() and not line.lstrip().startswith("#")]
          assert len(lines)==2 and lines[0].startswith("<IfModule ") and lines[1]=="</IfModule>"
          print("OFFICE_TOP_SMOKE_ISOLATION=zero_users_no_external_send")
          print("OFFICE_TOP_SMOKE_TARGET=unmodified_placeholder")
          PY
          health="$(curl -fsS --max-time 20 -o /dev/null -w '%{http_code}' https://zomorodmelal.ir/api/health/)"
          test "$health" = 200
          echo "OFFICE_TOP_SMOKE_PUBLIC_BEFORE=200"
          cp -p -- "$target" "$backup"
          chmod 600 "$backup"
          original_sha="$(sha256sum "$target" | awk '{print $1}')"
          tmp="$web$uri/.htaccess.office-scoped.$$"
          response="$root/.login-smoke-body.$$"
          cleanup() {
            result=$?
            trap - EXIT HUP INT TERM
            set +e
            "$selector" stop --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" >/dev/null 2>&1
            stopped=$?
            if test -f "$backup" && test ! -L "$backup" && test ! -L "$target"; then
              cp -p -- "$backup" "$tmp"
              restored_copy=$?
              if test "$restored_copy" = 0; then mv -fT -- "$tmp" "$target"; fi
            fi
            rm -f -- "$response" "$tmp"
            final_sha="$(sha256sum "$target" 2>/dev/null | awk '{print $1}')"
            if test "$final_sha" = "$original_sha" && cmp -s -- "$target" "$backup"; then
              echo "OFFICE_TOP_SMOKE_TARGET_ROLLBACK=exact_verified"
            else
              echo "OFFICE_TOP_SMOKE_TARGET_ROLLBACK=FAILED"
              result=1
            fi
            if cmp -s -- "$web/.htaccess" "$initial"; then
              echo "OFFICE_TOP_SMOKE_PUBLIC_HTACCESS=unchanged"
            else
              echo "OFFICE_TOP_SMOKE_PUBLIC_HTACCESS=FAILED"
              result=1
            fi
            if test "$stopped" = 0; then
              echo "OFFICE_TOP_SMOKE_SELECTOR_STOP=confirmed"
            else
              echo "OFFICE_TOP_SMOKE_SELECTOR_STOP=unverified"
              result=1
            fi
            if test "$result" = 0; then rm -f -- "$backup"; fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 143' HUP INT TERM
          cp -p -- "$target" "$tmp"
          printf '%s\n' \
            "$marker" \
            'PassengerEnabled on' \
            "PassengerAppRoot $root" \
            "PassengerBaseURI $uri" \
            "PassengerPython $py" \
            'PassengerAppType wsgi' \
            'PassengerStartupFile office_passenger_wsgi.py' \
            '# ZOMOROD_PREVIEW_PASSENGER_ROUTE_END' >> "$tmp"
          chmod 644 "$tmp"
          mv -T -- "$tmp" "$target"
          test "$(grep -c '^PassengerAppRoot ' "$target")" = 1
          test "$(grep -c '^PassengerBaseURI ' "$target")" = 1
          echo "OFFICE_TOP_SMOKE_PASSENGER_MAPPING=temporary"
          "$selector" start --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" > "$root/.selector-top-smoke-start.json"
          python3 -B - "$root/.selector-top-smoke-start.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: result=json.load(f)
          assert result.get("result")=="success"
          print("OFFICE_TOP_SMOKE_SELECTOR_START=success")
          PY
          code=000
          passed=false
          for try_number in 1 2 3 4; do
            code="$(curl -sS --max-redirs 0 --max-time 18 --output "$response" --write-out '%{http_code}' "https://zomorodmelal.ir$uri/secure-login/" || true)"
            if test "$code" = 200 &&
                grep -Fq 'ZOMOROD MELAL' "$response" &&
                grep -Fq 'login-form' "$response" &&
                grep -Fq 'name="username"' "$response"; then
              passed=true
              break
            fi
            sleep 6
          done
          echo "OFFICE_TOP_SMOKE_HTTPS_LOGIN_STATUS=$code"
          echo "OFFICE_TOP_SMOKE_DJANGO_LOGIN_CONFIRMED=$passed"
          health_after="$(curl -sS --max-time 20 --output /dev/null --write-out '%{http_code}' https://zomorodmelal.ir/api/health/ || true)"
          echo "OFFICE_TOP_SMOKE_PUBLIC_HEALTH_AFTER=$health_after"
          test "$passed" = true && test "$health_after" = 200
          REMOTE
      - name: Always verify and restore isolated preview rollback
        if: always() && steps.link.outcome == 'success'
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          test "$COMMAND_HOST" = saeit-cpanel
          d="$RUNNER_TEMP/zm-marketing-ro"
          timeout 125s ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = zomorod2
          rel="zomorod_office_top_preflight_9ab790b15a42"
          root="/home/zomorod2/$rel"
          target="/home/zomorod2/public_html/office-preflight-9ab790b15a42/.htaccess"
          backup="$root/.top-level-passenger-original"
          test ! -L "$target" && test ! -L "$backup"
          if test -f "$backup"; then
            tmp="$target.always-rollback.$$"
            test ! -e "$tmp" && test ! -L "$tmp"
            cp -p -- "$backup" "$tmp"
            mv -T -- "$tmp" "$target"
            cmp -s -- "$backup" "$target"
            /usr/sbin/cloudlinux-selector stop --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" >/dev/null
            echo "OFFICE_TOP_ALWAYS_ROLLBACK=verified"
          else
            # An absent backup is safe only if the original placeholder is intact.
            python3 -B - "$target" <<'PY'
          from pathlib import Path
          import sys
          lines=[x.strip() for x in Path(sys.argv[1]).read_text().splitlines()
                 if x.strip() and not x.lstrip().startswith("#")]
          assert len(lines)==2 and lines[0].startswith("<IfModule ") and lines[1]=="</IfModule>"
          print("OFFICE_TOP_ALWAYS_TARGET=untouched_placeholder")
          PY
          fi
          cmp -s -- /home/zomorod2/public_html/.htaccess "$root/.public-html-htaccess.original"
          echo "OFFICE_TOP_ALWAYS_PUBLIC_ROOT=exact_verified"
          REMOTE
      - name: Remove runner transient relay credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
