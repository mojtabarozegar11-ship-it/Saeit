name: Test isolated top-level Zomorod Passenger binding with rollback
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-office-top-passenger-smoke.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-office-top-passenger-smoke
  cancel-in-progress: false
jobs:
  preview-only-fix:
    if: github.event.pull_request.number == 1724 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/zomorod-office-messaging-current-main-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Set up pinned GitHub to VPS to cPanel relay
        id: link
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-marketing-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          # This public host key was collected through the pinned relay and fingerprint-verified.
          printf '%s\n' '178.239.147.150 ssh-rsa ' > "$d/vps.known"
          vps_fp_output="$(ssh-keygen -lf "$d/vps.known" -E sha256 2>/dev/null || true)"
          vps_observed="$(printf '%s\n' "$vps_fp_output" | awk '{print $2}' | sort -u)"
          if test -z "$vps_observed"; then
            echo "VPS_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$vps_observed" != "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"; then
            echo "VPS_HOST_KEY=MISMATCH"
            echo "VPS_HOST_KEY_OBSERVED=$vps_observed"
            exit 1
          fi
          echo "VPS_HOST_KEY=verified"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            ControlMaster auto
            ControlPath $d/cpanel.sock
            ControlPersist 300
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          # 30GB hosting public key; verify fingerprint before any authentication.
          printf '%s\n' '[178.239.147.125]:1396 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9vaKJLZ+5IhpcoTWOpsR9jauZVBqxOUpBHXS7Rh/Ia' > "$d/host.candidate"
          fingerprint_output="$(ssh-keygen -lf "$d/host.candidate" -E sha256 2>/dev/null || true)"
          observed="$(printf '%s\n' "$fingerprint_output" | awk '{print $2}' | sort -u)"
          if test -z "$observed"; then
            echo "CPANEL_KEYSCAN=INVALID"
            exit 1
          fi
          if test "$observed" != "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"; then
            echo "CPANEL_HOST_KEY=MISMATCH"
            echo "CPANEL_HOST_KEY_OBSERVED=$observed"
            exit 1
          fi
          cp "$d/host.candidate" "$d/host.known"
          echo "CPANEL_HOST_KEY=verified"
          echo "PINNED_PRIVATE_RELAY=verified"
          # The VPS port-22 ingress intermittently rejects its SSH banner. Do not
          # consume a separate fragile VPS connection just to preflight it.
          # A single successful, pinned two-hop identity test proves both hops
          # and keeps the authenticated cPanel control session for subsequent steps.
          session_ready=0
          for attempt in 1 2 3 4 5; do
            if timeout 55s ssh -F "$d/config" -o ConnectTimeout=25 -o ConnectionAttempts=1 saeit-cpanel 'test "$(id -un)" = "zomorod2" && test -r /home/zomorod2/.private/zomorod-business/company_ingress.py' >/dev/null; then
              session_ready=1
              echo "PINNED_30GB_RELAY_AUTHENTICATED_ON_ATTEMPT=$attempt"
              break
            fi
            echo "PINNED_30GB_RELAY_RETRY_ATTEMPT=$attempt"
            if test "$attempt" -lt 5; then sleep 12; fi
          done
          if test "$session_ready" = 1; then
            command_host=saeit-cpanel
            echo 'PINNED_SESSION=AUTHENTICATED_VIA_VPS'
          else
            echo 'PINNED_30GB_RELAY_UNAVAILABLE'
            exit 1
          fi
          printf 'command_host=%s\n' "$command_host" >> "$GITHUB_OUTPUT"
      - name: Verify production HTTP health before preview-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL --max-time 25 --output /dev/null --write-out '%{http_code}' https://zomorodmelal.ir/api/health/)" = 200
          echo "PUBLIC_HEALTH_BEFORE_ROUTE_FIX=200"
      - name: Restore Passenger mapping in isolated preview directory only
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-marketing-ro"
          case "$COMMAND_HOST" in saeit-cpanel) ;; *) exit 1 ;; esac
          timeout 120s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          umask 077
          rel="zomorod_office_top_preflight_9ab790b15a42"
          uri="/office-preflight-9ab790b15a42"
          root="/home/zomorod2/$rel"
          child="/home/zomorod2/public_html$uri"
          parent="/home/zomorod2/public_html/company/.htaccess"
          main="/home/zomorod2/public_html/.htaccess"
          initial="/home/zomorod2/.private/zomorod-company-office/.public-html-htaccess.original"
          py="/home/zomorod2/virtualenv/$rel/3.10/bin/python"
          selector="/usr/sbin/cloudlinux-selector"
          test -d "$root" && test ! -L "$root" && test -f "$root/.preview-registered"
          test -x "$selector"
          test -f "$root/office_passenger_wsgi.py"
          test -f "$root/.env" && test "$(stat -c '%a' "$root/.env")" = 600
          grep -Fxq 'COMPANY_MESSAGING_SEND_ENABLED=false' "$root/.env"
          grep -Fxq 'COMPANY_MARKETING_PUBLISH_ENABLED=false' "$root/.env"
          grep -Fxq 'ZM_OFFICE_BASE_PATH=/office-preflight-9ab790b15a42' "$root/.env"
          grep -Fxq 'uri=office-preflight-9ab790b15a42' "$root/.preview-registered"
          grep -Fxq 'source=9ab790b15a42b3ea24e46982b361e9596d0ec828' "$root/.preview-registered"
          grep -Fxq "DATABASE_URL=sqlite:///$root/office-preview.sqlite3" "$root/.env"
          python3 -B - "$root/office-preview.sqlite3" <<'PY'
          import sqlite3,sys
          with sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert db.execute("SELECT COUNT(*) FROM auth_user").fetchone()[0] == 0
          print("TOP_LEVEL_ISOLATED_DB=zero_users_verified")
          PY
          test -x "$py"
          echo "PREVIEW_SELECTOR_PYTHON=verified"
          test -d "$child" && test ! -L "$child"
          test -f "$child/.htaccess" && test ! -L "$child/.htaccess"
          test -f "$parent" && test -f "$initial" && test -f "$main"
          cmp -s -- "$main" "$initial"
          grep -Eq '^[[:space:]]*PassengerEnabled[[:space:]]+off[[:space:]]*$' "$parent"
          echo "PRODUCTION_ROOT_AND_COMPANY_RULES=unchanged_verified"
          test ! -e "$root/.top-level-passenger-original" && test ! -L "$root/.top-level-passenger-original"
          python3 -B - "$child/.htaccess" <<'PY'
          from pathlib import Path
          import sys
          lines=[x.strip() for x in Path(sys.argv[1]).read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")]
          assert len(lines)==2 and lines[0].startswith("<IfModule ") and lines[1]=="</IfModule>"
          print("TOP_LEVEL_ROUTE_PLACEHOLDER=verified")
          PY
          backup="$root/.top-level-passenger-original"
          marker="# ZOMOROD_PREVIEW_PASSENGER_ROUTE_BEGIN"
          if grep -Fqx "$marker" "$child/.htaccess"; then
            echo "PREVIEW_ONLY_HTACCESS=already_configured"
          else
            test ! -e "$backup" && test ! -L "$backup"
            test -z "$(grep -E '^[[:space:]]*(PassengerAppRoot|PassengerBaseURI|PassengerPython|PassengerStartupFile)' "$child/.htaccess" || true)"
            cp -p -- "$child/.htaccess" "$backup"
            chmod 600 "$backup"
            tmp="$child/.htaccess.office-new"
            test ! -e "$tmp" && test ! -L "$tmp"
            cp -p -- "$child/.htaccess" "$tmp"
            printf '%s\n' \
              "$marker" \
              'PassengerEnabled on' \
              "PassengerAppRoot $root" \
              "PassengerBaseURI $uri" \
              "PassengerPython $py" \
              'PassengerAppType wsgi' \
              'PassengerStartupFile office_passenger_wsgi.py' \
              '# ZOMOROD_PREVIEW_PASSENGER_ROUTE_END' >> "$tmp"
            chmod 644 "$tmp"
            mv -T -- "$tmp" "$child/.htaccess"
            echo "PREVIEW_ONLY_HTACCESS=created_with_private_backup"
          fi
          test "$(grep -c '^PassengerAppRoot ' "$child/.htaccess")" = 1
          test "$(grep -c '^PassengerBaseURI ' "$child/.htaccess")" = 1
          if "$selector" start --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" > "$root/.selector-route-start.json" 2> "$root/.selector-route-start.stderr"; then
            python3 - "$root/.selector-route-start.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])).get("result")=="success"
          print("PREVIEW_SELECTOR_START=success")
          PY
          else
            cp -p -- "$backup" "$child/.htaccess"
            echo "PREVIEW_SELECTOR_START=failed_rollback_applied"
            exit 1
          fi
          echo "PREVIEW_ONLY_PASSENGER_MAPPING=applied"
          echo "MAIN_OFFICE_ROUTE_UNCHANGED=true"
          echo "TOP_LEVEL_ROUTE_ONLY=true"
          REMOTE
      - name: Verify preview HTTPS and perform fail-closed rollback if needed
        shell: bash
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          code=000
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' 'https://zomorodmelal.ir/office-preflight-9ab790b15a42/secure-login/' || true)"
            if test "$code" = 200; then break; fi
            sleep 10
          done
          echo "PREVIEW_ROUTE_FIX_HTTPS_LOGIN_STATUS=$code"
          if test "$code" = 200; then
            echo "TOP_LEVEL_DJANGO_LOGIN_BODY=needs_confirmation"
          fi
          health="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' 'https://zomorodmelal.ir/api/health/' || true)"
          echo "PUBLIC_HEALTH_AFTER_ROUTE_FIX=$health"
          if test "$code" != 200 || test "$health" != 200; then
            d="$RUNNER_TEMP/zm-marketing-ro"
            timeout 90s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE' || true
          set -euo pipefail
          rel="zomorod_office_top_preflight_9ab790b15a42"
          root="/home/zomorod2/$rel"
          child="/home/zomorod2/public_html/office-preflight-9ab790b15a42/.htaccess"
          backup="$root/.top-level-passenger-original"
          if test -f "$backup" && grep -Fqx '# ZOMOROD_PREVIEW_PASSENGER_ROUTE_BEGIN' "$child"; then
            tmp="$child.office-rollback"
            test ! -e "$tmp" && test ! -L "$tmp"
            cp -p -- "$backup" "$tmp"
            mv -T -- "$tmp" "$child"
            echo "PREVIEW_ONLY_HTACCESS_ROLLBACK=restored_original"
          fi
          /usr/sbin/cloudlinux-selector stop --json --interpreter python --domain zomorodmelal.ir --app-root "$rel" >/dev/null 2>&1 || true
          echo "PREVIEW_SELECTOR_STATE=stopped_after_failed_smoke"
          REMOTE
            echo "PREVIEW_ROUTE_FIX=failed_rolled_back_or_requires_review"
            exit 1
          fi
          echo "PREVIEW_ROUTE_FIX_HTTPS_LOGIN=200"
          echo "PUBLIC_SITE_UNCHANGED=true"
          # Even successful preview must be stopped and restored exactly.
          d="$RUNNER_TEMP/zm-marketing-ro"
          timeout 100s ssh -F "$d/config" "$COMMAND_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          root="/home/zomorod2/zomorod_office_top_preflight_9ab790b15a42"
          child="/home/zomorod2/public_html/office-preflight-9ab790b15a42/.htaccess"
          backup="$root/.top-level-passenger-original"
          test -f "$backup" && test ! -L "$backup" && test ! -L "$child"
          /usr/sbin/cloudlinux-selector stop --json --interpreter python --domain zomorodmelal.ir --app-root zomorod_office_top_preflight_9ab790b15a42 >/dev/null
          cp -p -- "$backup" "$child"
          cmp -s -- "$backup" "$child"
          cmp -s -- /home/zomorod2/public_html/.htaccess "$root/.public-html-htaccess.original"
          echo "TOP_LEVEL_PASSENGER_ROLLBACK=exact_verified"
          echo "TOP_LEVEL_PREVIEW_STOP=confirmed"
          REMOTE
      - name: Remove runner transient relay credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/zm-marketing-ro"
