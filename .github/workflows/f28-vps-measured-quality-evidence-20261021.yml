name: F28 actual VPS product quality evidence dossier
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/factory_f28_measured_quality_evidence_20261021.py
      - .github/workflows/f28-vps-measured-quality-evidence-20261021.yml
  push:
    branches: [main]
    paths:
      - scripts/factory_f28_measured_quality_evidence_20261021.py
      - .github/workflows/f28-vps-measured-quality-evidence-20261021.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: factory-f28-actual-quality-evidence
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Real local ZIP and negative input verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/factory_f28_measured_quality_evidence_20261021.py
          python3 -B scripts/factory_f28_measured_quality_evidence_20261021.py --selftest
          echo F28_EVIDENCE_SELFTEST_CI=PASS
  vps-measure:
    needs: preflight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin SSH host and transfer scripts to private VPS staging
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/f28-evidence-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host factory-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/key
            UserKnownHostsFile $d/known
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 12
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          stage="/home/githubops/factory-runtime/operations/.f28-evidence-$GITHUB_RUN_ID"
          timeout 35s ssh -T -F "$d/config" factory-vps "set -eu; test \$(id -un) = githubops; umask 077; test ! -e '$stage'; mkdir -m 700 '$stage'"
          timeout 35s scp -q -F "$d/config" scripts/factory_f28_measured_quality_evidence_20261021.py "factory-vps:$stage/measure.py"
          timeout 35s scp -q -F "$d/config" factory_config/quality_100_criteria.json "factory-vps:$stage/criteria.json"
          wanted="$(sha256sum scripts/factory_f28_measured_quality_evidence_20261021.py | cut -d' ' -f1)"
          have="$(timeout 30s ssh -T -F "$d/config" factory-vps "sha256sum '$stage/measure.py' | cut -d' ' -f1")"
          test "$wanted" = "$have"
          wanted="$(sha256sum factory_config/quality_100_criteria.json | cut -d' ' -f1)"
          have="$(timeout 30s ssh -T -F "$d/config" factory-vps "sha256sum '$stage/criteria.json' | cut -d' ' -f1")"
          test "$wanted" = "$have"
          echo FACTORY_F28_EVIDENCE_SOURCE_PINNING=PASS
      - name: Measure exact real F28 ZIP and retain immutable private proof
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/f28-evidence-ssh"
          stage="/home/githubops/factory-runtime/operations/.f28-evidence-$GITHUB_RUN_ID"
          root="/home/githubops/factory-runtime/private/autonomous-product-cycle"
          source_sha="c446aeaa32494c93a453f524390ee14061d6f36da3228b3d4b15c5b794d2bc1e"
          artifact_sha="7ba2168c90617b236d10ee4542ec9fd276f3f524809ddd001f18f5a5634fc553"
          timeout 190s ssh -T -F "$d/config" factory-vps \
            "python3 -B '$stage/measure.py' --factory-root '$root' --source-sha256 '$source_sha' --artifact-sha256 '$artifact_sha' --criteria '$stage/criteria.json'"
          runner_sha="$(sha256sum scripts/factory_f28_measured_quality_evidence_20261021.py | cut -d' ' -f1)"
          timeout 40s ssh -T -F "$d/config" factory-vps python3 - "$root" "$artifact_sha" "$runner_sha" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); artifact=sys.argv[2]; runner_sha=sys.argv[3]
          base=root/"quality-excellence/private-measured-evidence/F28"/artifact
          file=base/("technical-"+runner_sha+".json")
          assert file.is_file() and not file.is_symlink()
          data=json.loads(file.read_text(encoding="utf8"))
          assert data["evidence_runner_sha256"]==runner_sha
          assert data["artifact_sha256"]==artifact
          assert data["valid_real_customer_cli_scenarios_oracle_checked"]==160
          assert data["invalid_customer_cli_scenarios_rejected"]==64
          assert data["metamorphic_customer_scenario_pairs_checked"]==128
          assert len(data["metamorphic_properties"])==4
          assert data["quality_criteria_total"]==100
          assert data["professional_1000_quality_points"] is None
          assert data["professional_1000_quality_approved"] is False
          assert data["customer_publication_allowed"] is False
          print("VPS_F28_REAL_PRODUCT_QUALITY_DOSSIER_READBACK=PASS")
          print("VPS_F28_METAMORPHIC_TECHNICAL_PROPERTIES=128")
          print("VPS_F28_QUALITY_1000_INDEPENDENT_APPROVAL=PENDING")
          print("VPS_F28_REAL_ARTIFACT_SHA256="+artifact)
          PY
      - name: Delete ephemeral SSH credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/f28-evidence-ssh"
