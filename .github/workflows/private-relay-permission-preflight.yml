name: Private relay admission permission preflight (NO INSTALL)
on:
  push:
    branches: [audit/private-relay-permission-preflight-20261118]
    paths: ['.github/workflows/private-relay-permission-preflight.yml']
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/audit/private-relay-permission-preflight-20261118'
    runs-on: [self-hosted, factory-vps]
    timeout-minutes: 2
    steps:
      - name: Observe existing account permissions without elevation or writes to targets
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$(id -un)" = githubrunner
          test -n "${VPS_KEY:-}"
          d="$(mktemp -d "$RUNNER_TEMP/audit-preflight.XXXXXXXX")"
          trap 'rm -f "$d/key" "$d/known"; rmdir "$d" 2>/dev/null || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          unset VPS_KEY
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null 2>&1
          timeout 10s ssh-keyscan -T 6 -t rsa 127.0.0.1 > "$d/known" 2>/dev/null
          fp="$(ssh-keygen -lf "$d/known" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)"
          test "$fp" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 30s ssh -T -i "$d/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=7 githubops@127.0.0.1 'test "$(id -un)" = githubops && PYTHONDONTWRITEBYTECODE=1 python3 -B -' <<'PY'
          import json, os, shutil, subprocess
          def available(args):
              try:
                  return subprocess.run(args,stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5,check=False).returncode==0
              except (OSError,subprocess.TimeoutExpired):
                  return False
          sudo = shutil.which("sudo")
          sc = shutil.which("systemctl")
          print("PERMISSION_PREFLIGHT="+json.dumps({
              "expected_account_authenticated":True,
              "uid_is_root":os.geteuid()==0,
              "noninteractive_sudo_listing_available":bool(sudo and available([sudo,"-n","-l"])),
              "systemd_system_unit_dir_writable":os.access("/etc/systemd/system",os.W_OK),
              "opt_writable":os.access("/opt",os.W_OK),
              "user_systemd_manager_reachable":bool(sc and available([sc,"--user","show-environment"])),
              "python_available":True,
              "elevated_command_executed":False,
              "installation_performed":False,
              "release_permitted":False
          },sort_keys=True))
          PY
