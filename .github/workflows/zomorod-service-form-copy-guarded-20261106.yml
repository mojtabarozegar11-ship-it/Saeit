name: Guarded live Zomorod agricultural service form copy
on:
  push:
    branches: [audit/live-sites-subsites-20261105]
    paths:
      - scripts/zomorod_service_form_copy_guarded_20261106.py
      - .github/workflows/zomorod-service-form-copy-guarded-20261106.yml
permissions:
  contents: read
concurrency:
  group: zm-service-form-copy-20261106
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact content-only change
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zomorod_service_form_copy_guarded_20261106.py
          python3 scripts/zomorod_service_form_copy_guarded_20261106.py selftest
      - name: Connect to existing pinned cPanel identity without remote desktop
        id: link
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zm-form-copy-ssh"
          install -d -m 700 "$d"
          export SSH_DIR="$d"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path('.github/workflows/mpw-guest-checkout-live-release.yml').read_text()
          directory=Path(os.environ['SSH_DIR'])
          for source_name,dest_name in [('vps.known','vps.known'),('host.candidate','host.known')]:
              suffix=f'> "$d/{source_name}"'
              matches=[line.strip() for line in source.splitlines() if line.strip().startswith("printf '%s\\n' '") and line.strip().endswith(suffix)]
              if len(matches)!=1:raise SystemExit('FORM_COPY_PIN_MISSING:'+source_name)
              (directory/dest_name).write_text(matches[0].split("printf '%s\\n' '",1)[1].rsplit("' >",1)[0]+'\n')
          for key,filename in [('VPS_KEY','vps.key'),('HOST_KEY','host.key')]:
              value=os.environ.get(key,'')
              if not value:raise SystemExit('FORM_COPY_IDENTITY_MISSING:'+key)
              dest=directory/filename
              dest.write_text(value.replace('\r\n','\n').replace('\r','').replace('\\n','\n').rstrip()+'\n')
              dest.chmod(0o600)
          PY
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}')" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}')" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host saeit-cpanel-direct
            HostName 178.239.147.125
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump none
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          host=''
          if timeout 40s ssh -T -F "$d/config" saeit-cpanel-direct 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            host=saeit-cpanel-direct
          elif timeout 45s ssh -T -F "$d/config" saeit-cpanel 'test "$(id -un)" = zomorod2 && test -f /home/zomorod2/public_html/.htaccess' >/dev/null 2>&1; then
            host=saeit-cpanel
          else
            exit 1
          fi
          echo "command_host=$host" >> "$GITHUB_OUTPUT"
          echo 'FORM_COPY_AUTHENTICATED=1'
      - name: Require previous exact release and valid PHP change
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-form-copy-ssh/config" "$COMMAND_HOST" 'python3 - preview' < scripts/zomorod_service_form_copy_guarded_20261106.py
      - name: Back up and publish only the current form labels
        id: publish
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-form-copy-ssh/config" "$COMMAND_HOST" "python3 - publish '$GITHUB_RUN_ID'" < scripts/zomorod_service_form_copy_guarded_20261106.py
      - name: Verify origin plus general and specialist public forms with GET only
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          timeout 75s ssh -T -F "$RUNNER_TEMP/zm-form-copy-ssh/config" "$COMMAND_HOST" "python3 - verify '$GITHUB_RUN_ID'" < scripts/zomorod_service_form_copy_guarded_20261106.py
          python3 - <<'PY'
          import os,re,time
          from urllib.request import Request,urlopen
          base='https://zomorodmelal.ir/ask-master/index.php'
          run_id=os.environ['RUN_ID']
          for kind,query in [('specialist','?service=1&zm_copy='+run_id),('general','?zm_copy='+run_id)]:
              for attempt in range(6):
                  try:
                      req=Request(base+query+'-'+str(attempt),headers={'Cache-Control':'no-cache','User-Agent':'Zomorod-Form-Copy-Origin-Check/1.0'})
                      with urlopen(req,timeout=27) as response:
                          html=response.read(150000).decode('utf-8','replace')
                          if response.status!=200:raise RuntimeError('FORM_COPY_HTTP_NOT_200')
                      for marker in ['<title>درخواست خدمات و پرسش | زمرد ملل</title>',
                                     '<h1>درخواست خدمات و پرسش | زمرد ملل</h1>',
                                     'برای درخواست خدمات کشاورزی و اقتصادی',
                                     'شرح درخواست یا پرسش',
                                     '<button type="submit">ثبت درخواست</button>',
                                     'name="csrf"', 'name="email"', 'name="kind"']:
                          if marker not in html:raise RuntimeError('FORM_COPY_PUBLIC_TEXT_MISSING:'+marker)
                      selected='<option value="service_question" selected>' in html
                      if selected!=(kind=='specialist'):raise RuntimeError('FORM_COPY_SELECTION_CHANGED')
                      print('FORM_COPY_PUBLIC_VERIFIED='+kind)
                      break
                  except Exception:
                      if attempt==5:raise
                      time.sleep(4)
          PY
      - name: Restore exact previous PHP if public verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          COMMAND_HOST: ${{ steps.link.outputs.command_host }}
        run: |
          set -euo pipefail
          case "$COMMAND_HOST" in saeit-cpanel|saeit-cpanel-direct) ;; *) exit 1 ;; esac
          timeout 80s ssh -T -F "$RUNNER_TEMP/zm-form-copy-ssh/config" "$COMMAND_HOST" "python3 - rollback '$GITHUB_RUN_ID'" < scripts/zomorod_service_form_copy_guarded_20261106.py
