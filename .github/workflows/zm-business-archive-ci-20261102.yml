name: ZM immutable Persian report archive and private viewer CI
on:
  push:
    branches: [feature/zm-business-php-persian-reports-20261102]
    paths:
      - ".github/workflows/zm-business-archive-ci-20261102.yml"
      - "scripts/zomorod_chatgpt_report_snapshot.py"
      - "content/zomorod-business/chatgpt_reports.php"
      - "tests/test_zomorod_chatgpt_report_snapshot.py"
      - "tests/test_zm_business_report_archive_php.py"
permissions:
  contents: read
jobs:
  archive-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
      - name: Exact-head source tests for private append-only report archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -l content/zomorod-business/chatgpt_reports.php
          python3 -m py_compile scripts/zomorod_chatgpt_report_snapshot.py
          python3 -m unittest discover -v -s tests -p 'test_zomorod_chatgpt_report_snapshot.py'
          python3 -m unittest discover -v -s tests -p 'test_zm_business_report_archive_php.py'
          echo "IMMUTABLE_PRIVATE_REPORT_ARCHIVE_CI=PASS"
          echo "PRODUCTION_DATABASE_TOUCHED=no"
