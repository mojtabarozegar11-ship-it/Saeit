name: Mojtaba personal site SSH mapping (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: v91-staff-ssh-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: Mojtaba personal readonly SSH mapping 2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Authenticated SSH relay to cPanel; no deployment, no writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/v91-staff-ssh"
          mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 70s ssh -F "$d/config" saeit-host 'bash -se' <<'REMOTE'
          set -eu
          printf 'USER='; id -un
          printf 'HOST='; hostname
          echo PERSONAL_PROJECTS
          for p in "$HOME"/mojtaba_personal/mojtaba_roozegar_personal_v16 "$HOME"/mojtaba_personal/mojtaba_roozegar_personal_v17; do
            if test -d "$p"; then
              printf 'PERSONAL_PROJECT=%s\n' "$p"
              test -f "$p/manage.py" && echo DJANGO_MANAGE_PRESENT || true
              test -f "$p/passenger_wsgi.py" && echo PASSENGER_PRESENT || true
            fi
          done
          echo PERSONAL_SYMLINKS
          find "$HOME/mojtaba_personal" -maxdepth 2 -type l -print 2>/dev/null | head -20 | while IFS= read -r link; do
            printf 'SYMLINK=%s -> %s\n' "$link" "$(readlink -f "$link" || true)"
          done
          echo DOMAIN_ENTRYPOINTS
          find "$HOME" -maxdepth 4 -type f \( -name passenger_wsgi.py -o -name .htaccess \) -print 2>/dev/null | head -120 | while IFS= read -r f; do
            case "$f" in
              *mojtaba*|*rozegar*|*roozegar*|"$HOME"/public_html/*)
                printf 'ENTRYPOINT=%s\n' "$f"
                case "$f" in
                  */.htaccess) grep -E '^[[:space:]]*Passenger(AppRoot|StartupFile|BaseURI)' "$f" | head -6 || true ;;
                  */passenger_wsgi.py)
                    python3 - "$f" <<'PYREAD'
          import pathlib,re,sys
          txt=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for p in sorted(set(re.findall(r"/home/zomorod2/[A-Za-z0-9_./-]+",txt)))[:8]:
              print("WRAPPER_PATH="+p)
          PYREAD
                    ;;
                esac
              ;;
            esac
          done
          echo PERSONAL_MAPPING_READONLY_COMPLETE
          REMOTE
