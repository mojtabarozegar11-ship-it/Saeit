name: Mojtaba personal site SSH mapping (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: v91-staff-ssh-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: >-
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      github.event.issue.user.login == 'mojtabarozegar11-ship-it' &&
      github.event.issue.title == 'Ops: Mojtaba personal readonly SSH mapping 2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Authenticated SSH relay to cPanel; no deployment, no writes
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/v91-staff-ssh"
          mkdir -p "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$VPS_KEY" > "$d/vps.key"
          printf '%s\n' "$HOST_KEY" > "$d/host.key"
          python3 - "$d/host.key" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          t=p.read_text().replace('\r\n','\n').strip()
          p.write_text(t.replace('\\n','\n')+'\n')
          PY
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
            StrictHostKeyChecking yes
          Host saeit-host
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
            StrictHostKeyChecking yes
          Host *
            BatchMode yes
            IdentitiesOnly yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 10
            ConnectionAttempts 1
          EOF
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          timeout 70s ssh -F "$d/config" saeit-host 'bash -se' <<'REMOTE'
          set -eu
          printf 'USER='; id -un
          printf 'HOST='; hostname
          echo PERSONAL_PROJECTS
          for p in "$HOME"/mojtaba_personal/mojtaba_roozegar_personal_v16 "$HOME"/mojtaba_personal/mojtaba_roozegar_personal_v17; do
            if test -d "$p"; then
              printf 'PERSONAL_PROJECT=%s\n' "$p"
              test -f "$p/manage.py" && echo DJANGO_MANAGE_PRESENT || true
              test -f "$p/passenger_wsgi.py" && echo PASSENGER_PRESENT || true
            fi
          done
          echo PERSONAL_SYMLINKS
          find "$HOME/mojtaba_personal" -maxdepth 2 -type l -print 2>/dev/null | head -20 | while IFS= read -r link; do
            printf 'SYMLINK=%s -> %s\n' "$link" "$(readlink -f "$link" || true)"
          done
          echo DOMAIN_ENTRYPOINTS
          find "$HOME" -maxdepth 4 -type f \( -name passenger_wsgi.py -o -name .htaccess \) -print 2>/dev/null | head -120 | while IFS= read -r f; do
            case "$f" in
              *mojtaba*|*rozegar*|*roozegar*|"$HOME"/public_html/*)
                printf 'ENTRYPOINT=%s\n' "$f"
                case "$f" in
                  */.htaccess) grep -E '^[[:space:]]*Passenger(AppRoot|StartupFile|BaseURI)' "$f" | head -6 || true ;;
                  */passenger_wsgi.py)
                    python3 - "$f" <<'PYREAD'
          import pathlib,re,sys
          txt=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for p in sorted(set(re.findall(r"/home/zomorod2/[A-Za-z0-9_./-]+",txt)))[:8]:
              print("WRAPPER_PATH="+p)
          PYREAD
                    ;;
                esac
              ;;
            esac
          done
          echo PUBLICATION_SCHEMA_INSPECTION
          app="$HOME/mojtaba_personal/mojtaba_roozegar_personal_v17"
          for f in "$app"/config/urls.py "$app"/core/urls.py "$app"/blog/urls.py "$app"/blog/models.py "$app"/core/models.py "$app"/config/settings.py; do
            if test -f "$f"; then
              echo "SCHEMA_FILE=$f"
              case "$f" in
                */models.py)
                  grep -nE '^class |^[[:space:]]{4}[a-z_]+ = models\.|^[[:space:]]{4}def (save|published|slug|__str__)' "$f" | head -100 || true ;;
                */urls.py) grep -nE 'path\(|re_path\(|include\(' "$f" | head -90 || true ;;
                */settings.py) grep -A30 -m 1 'INSTALLED_APPS' "$f" | grep -E 'blog|post|articles|core|content|site' | head -25 || true ;;
              esac
            fi
          done
          echo PROJECT_TOP_DIRECTORIES
          find "$app" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -Ev '^\.|^__pycache__' | head -45
          echo PUBLICATION_SCHEMA_INSPECTION_COMPLETE
          echo ARTICLE_POST_MODEL
          sed -n '34,46p' "$HOME/mojtaba_personal/mojtaba_roozegar_personal_v17/core/models.py"
          echo ARTICLE_POST_MODEL_DONE
          echo PERSONAL_SEO_AUDIT_BEGIN
          app="$HOME/mojtaba_personal/mojtaba_roozegar_personal_v17"
          python3 - "$app" <<'PYSEO'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from xml.etree import ElementTree
          import json, re, sys
          root=Path(sys.argv[1])
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title_on=False; self.h1_on=False
                  self.title=[]; self.h1=[]; self.meta={}; self.canonical=[]
                  self.ld_on=False; self.ld=[]; self.ld_types=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="title": self.title_on=True
                  if tag=="h1": self.h1_on=True
                  if tag=="meta" and a.get("name","").lower() in ("description","robots","googlebot"):
                      self.meta[a["name"].lower()]=a.get("content","")[:300]
                  if tag=="link" and "canonical" in a.get("rel","").lower().split():
                      self.canonical.append(a.get("href","")[:300])
                  if tag=="script" and a.get("type","").lower()=="application/ld+json": self.ld_on=True; self.ld=[]
              def handle_endtag(self, tag):
                  if tag=="title": self.title_on=False
                  if tag=="h1": self.h1_on=False
                  if tag=="script" and self.ld_on:
                      raw="".join(self.ld)
                      self.ld_types += re.findall(r'"@type"\s*:\s*"([^"]+)"', raw)
                      self.ld_on=False
              def handle_data(self,data):
                  if self.title_on and len(self.title)<1: self.title.append(data.strip()[:250])
                  if self.h1_on and len(self.h1)<3: self.h1.append(data.strip()[:250])
                  if self.ld_on: self.ld.append(data)
          print("SEO_TEMPLATE_SCAN_BEGIN")
          templates=root/"templates"
          found=0
          for path in sorted(templates.rglob("*.html")) if templates.is_dir() else []:
              try: html=path.read_text(encoding="utf-8")
              except Exception: continue
              p=Head(); p.feed(html)
              if p.title or p.meta or p.canonical or p.ld_types or p.h1:
                  print("SEO_TEMPLATE="+str(path.relative_to(root))+" TITLE="+json.dumps(" ".join(p.title),ensure_ascii=False)+" DESCRIPTION="+json.dumps(p.meta.get("description",""),ensure_ascii=False)+" ROBOTS="+json.dumps(p.meta.get("robots",""),ensure_ascii=False)+" CANONICAL="+json.dumps(p.canonical[:2],ensure_ascii=False)+" H1="+json.dumps([x for x in p.h1 if x],ensure_ascii=False)+" JSONLD_TYPES="+json.dumps(sorted(set(p.ld_types)),ensure_ascii=False))
                  found+=1
                  if found>=30: break
          print("SEO_TEMPLATE_FILES_REPORTED="+str(found))
          import re
          base_path=root/"templates"/"personal_site"/"base.html"
          if base_path.is_file():
              source=base_path.read_text(encoding="utf-8",errors="replace")
              print("SEO_BASE_TEMPLATE_PUBLIC_MARKUP_BEGIN")
              for block in re.findall(r'<script[^>]+application/ld\+json[^>]*>.*?</script>',source,re.I|re.S):
                  print("SEO_BASE_JSONLD_TEMPLATE="+block[:5000].replace("\\n"," "))
              for pattern in (r'<title[^>]*>.*?</title>',r'<meta[^>]+name=["\']description["\'][^>]*>',r'<link[^>]+canonical[^>]*>',r'Vancouver',r'jobTitle'):
                  for match in re.finditer(pattern,source,re.I|re.S):
                      print("SEO_BASE_MATCH="+match.group(0)[:500].replace("\\n"," "))
              print("SEO_BASE_TEMPLATE_PUBLIC_MARKUP_END")
          home_path=root/"templates"/"personal_site"/"core"/"home.html"
          if home_path.is_file():
              source=home_path.read_text(encoding="utf-8",errors="replace")
              print("SEO_HOME_TEMPLATE_TEXT_BEGIN")
              for match in re.finditer(r'<h1[^>]*>.*?</h1>|<p[^>]*>.*?</p>',source,re.I|re.S):
                  print("SEO_HOME_VISIBLE_COPY="+re.sub(r"\\s+"," ",match.group(0))[:450])
              print("SEO_HOME_TEMPLATE_TEXT_END")
          views=root/"core"/"views.py"
          if views.is_file():
              lines=views.read_text(encoding="utf-8",errors="replace").splitlines()
              for i,line in enumerate(lines):
                  if re.match(r'\s*def\s+(home|robots|health)\b',line):
                      print("SEO_VIEW_SOURCE="+str(i+1)+":"+line.strip())
                      for j in range(i+1,min(i+30,len(lines))):
                          if "render(" in lines[j] or "HttpResponse" in lines[j] or "sitemap" in lines[j].lower() or "robots" in lines[j].lower():
                              print("SEO_VIEW_ROUTE_DETAIL="+str(j+1)+":"+lines[j].strip()[:220])
          print("SEO_TEMPLATE_SCAN_END")
          PYSEO
          python3 - <<'PYHTTP'
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from xml.etree import ElementTree
          from urllib.parse import urljoin
          import re
          base="https://mojplaywin.com"
          target=base+"/mojtaba.roozegar/"
          paths=[target, base+"/robots.txt", base+"/sitemap.xml",
                 target+"robots.txt", target+"sitemap.xml", target+"feed.xml"]
          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title_on=False; self.title=[]; self.meta={}; self.canonical=[]; self.h1_on=False; self.h1=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="title": self.title_on=True
                  if tag=="h1": self.h1_on=True
                  if tag=="meta" and a.get("name","").lower() in ("description","robots","googlebot"):
                      self.meta[a["name"].lower()]=a.get("content","")[:300]
                  if tag=="link" and "canonical" in a.get("rel","").lower().split(): self.canonical.append(a.get("href","")[:300])
              def handle_endtag(self,tag):
                  if tag=="title": self.title_on=False
                  if tag=="h1": self.h1_on=False
              def handle_data(self,data):
                  if self.title_on: self.title.append(data.strip()[:250])
                  if self.h1_on and len(self.h1)<3: self.h1.append(data.strip()[:250])
          for url in paths:
              try:
                  req=Request(url,headers={"User-Agent":"SaeitPersonalSEOReadOnlyAudit/1.0"})
                  with urlopen(req,timeout=12) as response:
                      raw=response.read(2000000); text=raw.decode("utf-8","replace")
                      print("SEO_HTTP="+url+" STATUS="+str(response.status)+" TYPE="+response.headers.get("Content-Type","")+" BYTES="+str(len(raw)))
                  if url==target:
                      p=Meta(); p.feed(text)
                      print("SEO_LIVE_PAGE_TITLE="+" ".join(x for x in p.title if x)[:300])
                      print("SEO_LIVE_DESCRIPTION="+p.meta.get("description",""))
                      print("SEO_LIVE_ROBOTS="+p.meta.get("robots",""))
                      print("SEO_LIVE_CANONICAL="+repr(p.canonical[:2]))
                      print("SEO_LIVE_H1="+repr([x for x in p.h1 if x]))
                  elif url.endswith("/robots.txt"):
                      for line in text.splitlines():
                          if re.match(r"\s*(user-agent|allow|disallow|sitemap)\s*:",line,re.I):
                              print("SEO_ROBOTS_LINE="+url+" "+line.strip()[:300])
                  elif url.endswith("/sitemap.xml"):
                      try:
                          root=ElementTree.fromstring(text)
                          locs=[x.text or "" for x in root.iter() if x.tag.endswith("loc")]
                          print("SEO_SITEMAP_URLS="+url+" COUNT="+str(len(locs))+" TARGET_PRESENT="+str(target in locs))
                          print("SEO_SITEMAP_PERSONAL_URLS="+repr([x for x in locs if "mojtaba.roozegar" in x][:20]))
                      except Exception as exc: print("SEO_SITEMAP_PARSE_ERROR="+url+" "+type(exc).__name__)
              except HTTPError as exc: print("SEO_HTTP="+url+" STATUS="+str(exc.code))
              except Exception as exc: print("SEO_HTTP_ERROR="+url+" "+type(exc).__name__)
          print("PERSONAL_SEO_AUDIT_COMPLETE")
          PYHTTP
          echo PERSONAL_SEO_AUDIT_END
          
          echo PERSONAL_MAPPING_READONLY_COMPLETE
          REMOTE
