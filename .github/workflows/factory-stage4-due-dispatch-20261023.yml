name: VPS Stage4 due validation dispatch and recurring native scheduler
on:
  push:
    branches: [main]
    paths:
      - scripts/factory_stage4_due_dispatch_20261023.py
      - tests/test_factory_stage4_due_dispatch_20261023.py
      - deploy/install_factory_stage4_due_dispatch.sh
      - .github/workflows/factory-stage4-due-dispatch-20261023.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: saeit-stage4-native-due-dispatch
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test dispatcher and installer safety
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_factory_stage4_due_dispatch_20261023.py -v
          python3 -B -m py_compile scripts/factory_stage4_due_dispatch_20261023.py
          bash -n deploy/install_factory_stage4_due_dispatch.sh
  install-native-vps:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate pinned VPS SSH identity
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/stage4-dispatch"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          echo VPS_HOST_IDENTITY=PINNED
      - name: Transfer checksum-pinned dispatcher and guarded installer
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-dispatch"
          stage="/home/githubops/factory-runtime/operations/.stage4-due-$GITHUB_RUN_ID"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          timeout 40s ssh -T "${opts[@]}" githubops@178.239.147.150 "umask 077; mkdir -p '$stage'"
          timeout 70s scp -q "${opts[@]}" scripts/factory_stage4_due_dispatch_20261023.py deploy/install_factory_stage4_due_dispatch.sh "githubops@178.239.147.150:$stage/"
          expected_py="$(sha256sum scripts/factory_stage4_due_dispatch_20261023.py | awk '{print $1}')"
          expected_sh="$(sha256sum deploy/install_factory_stage4_due_dispatch.sh | awk '{print $1}')"
          timeout 35s ssh -T "${opts[@]}" githubops@178.239.147.150 "test \"\$(sha256sum '$stage/factory_stage4_due_dispatch_20261023.py' | cut -d' ' -f1)\" = '$expected_py' && test \"\$(sha256sum '$stage/install_factory_stage4_due_dispatch.sh' | cut -d' ' -f1)\" = '$expected_sh'"
          echo VPS_STAGE4_TRANSFER_SHA256=VERIFIED
      - name: Pilot real due validation through master agent then activate VPS cron
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage4-dispatch"
          stage="/home/githubops/factory-runtime/operations/.stage4-due-$GITHUB_RUN_ID"
          expected_py="$(sha256sum scripts/factory_stage4_due_dispatch_20261023.py | awk '{print $1}')"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          timeout 200s ssh -T "${opts[@]}" githubops@178.239.147.150 "bash '$stage/install_factory_stage4_due_dispatch.sh' '$stage/factory_stage4_due_dispatch_20261023.py' '$expected_py'"
      - name: Verify a real native cron tick and queue consumption
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          d="$RUNNER_TEMP/stage4-dispatch"
          opts=(-i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15)
          timeout 65s ssh -T "${opts[@]}" githubops@178.239.147.150 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/factory-runtime/django-app"
          export SAEIT_ENV=production MOJ_FACTORY_LOCAL_MODE=1
          "$HOME/factory-runtime/.venv/bin/python" -B - <<'PY'
          import collections,datetime,json,os
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings")
          import django
          django.setup()
          from django.apps import apps
          from django.utils import timezone
          root=Path.home()/"factory-runtime/operations"
          log=root/"stage4-due-dispatch.log"
          if log.is_symlink():
              raise SystemExit("STAGE4_CRON_LOG_UNSAFE")
          ticks=[]
          if log.is_file():
              with log.open("rb") as f:
                  f.seek(max(0,log.stat().st_size-30000))
                  for raw in f.read().decode("utf8","replace").splitlines():
                      if raw.startswith("STAGE4_DUE_DISPATCH="):
                          try: ticks.append(json.loads(raw.partition("=")[2]))
                          except ValueError: pass
          AgentTask=apps.get_model("core","AgentTask")
          since=timezone.now()-datetime.timedelta(minutes=10)
          recent=AgentTask.objects.filter(action_type="product_validation",created_at__gte=since)
          statuses=collections.Counter(recent.values_list("status",flat=True))
          result={"schema":"saeit.factory.stage4-dispatch-verification.v1",
                  "read_only":True,"cron_ticks_seen_in_log":len(ticks),
                  "last_tick_counts":ticks[-1].get("counts",{}) if ticks else {},
                  "recent_validation_tasks":sum(statuses.values()),
                  "recent_task_statuses":dict(sorted(statuses.items())),
                  "site_mutations":0,"approvals_modified":False}
          print("STAGE4_NATIVE_CRON_VERIFICATION="+json.dumps(result,sort_keys=True))
          if not ticks:
              raise SystemExit("STAGE4_NATIVE_CRON_TICK_NOT_OBSERVED")
          PY
          REMOTE
      - name: Remove runner SSH key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/stage4-dispatch"
