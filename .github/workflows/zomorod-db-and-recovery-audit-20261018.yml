name: Zomorod historical database and offsite recovery audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/zomorod-db-and-recovery-audit-20261018.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-db-recovery-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_RELAY=verified"
      - name: Inspect large backup database subtree and real database users
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-baseline-inventory"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,os,json,re,stat
          H=Path.home()
          def du(p):
              try:
                  r=subprocess.run(["du","-sk","--",str(p)],capture_output=True,text=True,timeout=55,check=True)
                  return int(r.stdout.split()[0])*1024
              except Exception:return -1
          root=H/".backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b"
          for folder in ("database","database/var","database/var/mother_robot","database/var/mother_robot/lab"):
              p=root/folder
              if not p.is_dir():continue
              print("DB_ARCHIVE_DIR="+folder+" total="+str(du(p)))
              for q in sorted(p.iterdir(),key=lambda p:du(p) if p.is_dir() else p.stat().st_size,reverse=True)[:28]:
                  print("DB_ARCHIVE_CHILD="+json.dumps({"parent":folder,"name":q.name,"dir":q.is_dir(),"size":du(q) if q.is_dir() else q.stat().st_size},ensure_ascii=False))
          for folder in ("Saeit/var/mother_robot","Saeit/var/mother_robot/lab","Saeit-staging/admin-smoke","Saeit-staging/var/factory/astra-backups"):
              p=H/folder
              if not p.is_dir():continue
              print("LIVE_HISTORY="+folder+" bytes="+str(du(p)))
          for fname in ("database-manifest.json","README.restore.txt"):
              p=root/fname
              if p.is_file():
                  if p.suffix==".json":
                      try:
                          j=json.loads(p.read_text(errors="ignore"))
                          print("BACKUP_MANIFEST_TOP_KEYS="+str(list(j)[:30]))
                          for k,v in j.items():
                              if isinstance(v,list):print("BACKUP_MANIFEST_LIST="+k+" length="+str(len(v)))
                      except Exception:print("BACKUP_MANIFEST_PARSE=failed")
                  else:
                      print("RESTORE_DOC_EXISTS=yes bytes="+str(p.stat().st_size))
          # Identify nonproduction DB candidates in staging without exposing secrets.
          p=H/"Saeit-staging/mojplaywin.sqlite3"
          if p.is_file():
              print("STAGING_DB_SIZE="+str(p.stat().st_size))
              for f in (H/"Saeit-staging/config/settings.py",H/"Saeit/config/settings.py",H/"Saeit/config/settings_production.py"):
                  if not f.is_file():continue
                  txt=f.read_text(errors="ignore")
                  print("DB_CONFIG="+str(f.relative_to(H))+" mentions_staging_mojplaywin="+str("mojplaywin.sqlite3" in txt)+" mentions_Saeit_staging="+str("Saeit-staging" in txt))
          for name in ("saeit_v91_runtime_stage_20261012","Saeit-staging/admin-smoke","Saeit-staging/var/factory/astra-backups"):
              pattern=name
              proc=subprocess.run(["ps","-u","zomorod2","-o","args="],capture_output=True,text=True,timeout=10).stdout
              matches=[x[:150] for x in proc.splitlines() if pattern in x and "bash -se" not in x and "python3 - " not in x]
              print("RUNTIME_REFERENCE="+name+" count="+str(len(matches)))
          print("DB_RECOVERY_AUDIT_DONE=yes")
          PY
          REMOTE
      - name: Cleanup ssh material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zomorod-baseline-inventory"
