name: Zomorod B2B free public SEO audit — no deploy
on:
  pull_request:
    types: [opened]
    branches: [feature/zomorod-b2b-trust-inquiries-20261118]
    paths: [".github/workflows/zomorod-b2b-seo-public-audit-20261118.yml"]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.head_ref == 'audit/zomorod-b2b-seo-readonly-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Passive public GET only, fixed same-host endpoints
        run: |
          python3 -B - <<'PY'
          import http.client, ssl, json, hashlib, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.robotparser import RobotFileParser
          from concurrent.futures import ThreadPoolExecutor
          host="zomorodmelal.ir"
          base="https://"+host
          paths=["/robots.txt","/sitemap.xml","/topics/sitemap.xml","/ghanadi/sitemap.xml","/llms.txt","/","/company/","/b2b/","/b2b/privacy/"]
          target={base+"/b2b/",base+"/b2b/privacy/"}
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical=[]; self.robots=[]; self.links=set(); self.jsonld=False; self.description=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="a" and d.get("href"): self.links.add(urljoin(base,d["href"]))
                  if tag=="link" and "canonical" in (d.get("rel") or "").lower().split(): self.canonical.append(d.get("href"))
                  if tag=="meta" and (d.get("name") or "").lower() in ("robots","googlebot","bingbot"): self.robots.append(d.get("content"))
                  if tag=="meta" and (d.get("name") or "").lower()=="description": self.description=bool(d.get("content"))
                  if tag=="script" and d.get("type")=="application/ld+json": self.jsonld=True
          def fetch(path):
              out={"path":path}; raw=b""
              for attempt in range(2):
                  conn=http.client.HTTPSConnection(host,timeout=12,context=ssl.create_default_context())
                  try:
                      conn.request("GET",path,headers={"Accept-Encoding":"identity","User-Agent":"Zomorod-SEO-readonly-audit/1.0"})
                      r=conn.getresponse()
                      raw=r.read(4194305)
                      out.update(status=r.status,tls_verified=True,content_type=r.getheader("Content-Type",""),x_robots_tag=r.getheader("X-Robots-Tag"),oversize=len(raw)>4194304,sha256=hashlib.sha256(raw).hexdigest())
                      break
                  except Exception as e:
                      out.update(status=None,error_type=type(e).__name__)
                  finally: conn.close()
              if out.get("status")!=200 or out.get("oversize"): return out
              if path=="/robots.txt" and "text/plain" in out.get("content_type","").lower():
                  rp=RobotFileParser(); rp.parse(raw.decode("utf-8","replace").splitlines())
                  out["crawler_permissions"]={a:{u:rp.can_fetch(a,u) for u in sorted(target)} for a in ("Googlebot","bingbot","OAI-SearchBot","GPTBot","Claude-SearchBot","PerplexityBot")}
                  out["declared_sitemaps"]=rp.site_maps() or []
              elif "sitemap.xml" in path:
                  try:
                      root=ET.fromstring(raw); locs=[n.text for n in root.iter() if n.tag.split("}")[-1]=="loc" and n.text]
                      out.update(xml_valid=True,root_kind=root.tag.split("}")[-1],loc_count=len(locs),b2b_listed=sorted(set(locs)&target))
                  except ET.ParseError: out["xml_valid"]=False
              elif "text/html" in out.get("content_type","").lower():
                  page=Page(); page.feed(raw.decode("utf-8","replace"))
                  out.update(canonical=page.canonical,meta_robots=page.robots,description_present=page.description,structured_data_present=page.jsonld,b2b_links=sorted(page.links&target))
              return out
          with ThreadPoolExecutor(max_workers=2) as pool: rows=list(pool.map(fetch,paths))
          print("ZOMOROD_B2B_SEO_AUDIT="+json.dumps({"observations":rows,"site_modified":False,"submission_performed":False,"indexing_verified":False},sort_keys=True))
          PY
