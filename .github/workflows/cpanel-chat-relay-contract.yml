name: Authenticated cPanel chat relay contract
on:
  pull_request:
    paths:
      - .github/workflows/zomorod-private-command-dispatch.yml
      - .github/workflows/cpanel-chat-relay-contract.yml
      - tests/test_zomorod_private_command_bridge_contract.py
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-private-command-dispatch.yml
      - .github/workflows/cpanel-chat-relay-contract.yml
      - tests/test_zomorod_private_command_bridge_contract.py
permissions:
  contents: read
jobs:
  scoped-contract:
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gate, identity, and no-mutation regression checks
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_zomorod_private_command_bridge_contract.py
