name: ComfyUI VPS Read-Only Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SSH secret presence
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Required VPS_HOST, VPS_USER or VPS_SSH_KEY secret missing"; exit 1
          fi
          echo "Secrets present (values hidden)"
      - name: Read-only VPS inventory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS secret required"; exit 1; }
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/comfy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > /tmp/comfy_known_hosts
          trap 'rm -f /tmp/comfy_key /tmp/comfy_known_hosts' EXIT
          ssh -i /tmp/comfy_key -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/comfy_known_hosts "$VPS_USER@$VPS_HOST" 'set -eu; echo "=== Host ==="; hostname; echo "=== Capacity ==="; free -h; df -h /; echo "=== GPU ==="; if command -v nvidia-smi >/dev/null; then nvidia-smi --query-gpu=name,memory.total --format=csv,noheader; else echo "No NVIDIA GPU tool"; fi; echo "=== Python ==="; python3 --version 2>&1 || :; echo "=== ComfyUI process ==="; pgrep -af "[m]ain.py.*ComfyUI" || :; echo "=== Port 8188 ==="; ss -ltn "( sport = :8188 )" || :'
