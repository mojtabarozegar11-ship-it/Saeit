name: Add header, images and valuable content to existing Zomorod homepage
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zomorod-home-gallery-publish.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-root-homepage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate additive content and existing image paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path("public/zomorod-home-additive-20261016.html").read_text(encoding="utf-8")
          assert s.count("<!-- ZM_HOME_RIBBON_BEGIN -->")==1
          assert s.count("<!-- ZM_HOME_RIBBON_END -->")==1
          assert s.count("<!-- ZM_HOME_FEATURE_BEGIN -->")==1
          assert s.count("<!-- ZM_HOME_FEATURE_END -->")==1
          assert s.count('id="zm-home-feature-20261016"')==1
          assert s.count("<article>")==3
          assert s.count("<img ")==4
          assert len(s)>7000
          assert all(path in s for path in (
            "/agriculture/","/agriculture/greenhouse/","/agriculture/livestock/","/industry/","/research/"
          ))
          print("HOME_HEADER_GALLERY_AND_THREE_ARTICLES=valid")
          PY
          for filename in platform-home agriculture smart-agriculture industry; do
            code="$(curl -L -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/static/site/heroes/$filename.webp" || true)"
            echo "REUSED_IMAGE=$filename HTTP=$code"
            test "$code" = 200
          done
      - name: Prepare the confirmed pinned VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-root"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "CONFIRMED_PINNED_RELAY_READY=yes"


      - name: Stage additions away from published document root
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          dir="/home/zomorod2/.zm-home-addition-$GITHUB_SHA"
          ssh -F "$d/config" saeit-cpanel "test ! -e '$dir' && mkdir -m 700 '$dir'"
          tar -czf - public/zomorod-home-additive-20261016.html | ssh -F "$d/config" saeit-cpanel "tar -xzf - -C '$dir'"
      - name: Append header ribbon and visual editorial section to original live page
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel python3 - "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import os,sys
          sha=sys.argv[1]
          home=Path.home()
          root=home/"public_html"
          target=root/"index.html"
          fragment=home/(".zm-home-addition-"+sha)/"public/zomorod-home-additive-20261016.html"
          backup=home/".backups"/"zomorod-home-header-gallery"/sha
          assert root.is_dir() and not root.is_symlink()
          assert target.is_file() and not target.is_symlink()
          assert target.stat().st_uid==os.getuid()
          assert fragment.is_file() and not fragment.is_symlink()
          original=target.read_bytes()
          src=fragment.read_bytes()
          assert b"ZM_HOME_FEATURE_BEGIN" in src
          assert b"ZM_HOME_RIBBON_BEGIN" in src
          assert b"ZM_HOME_FEATURE_BEGIN" not in original
          assert b"ZM_HOME_RIBBON_BEGIN" not in original
          assert original.count(b"</header>")>=1
          assert original.count(b"</main>")==1
          assert b'<section class="wrap hero"' in original, "Original hero changed, refusing risky insertion"
          assert b'zm-specialist-library-20261016' in original, "Existing expert articles missing"
          assert b'zm-compendium-navigation-20261016' in original, "Existing compendium link missing"
          ribbon_begin=src.index(b"<!-- ZM_HOME_RIBBON_BEGIN -->")
          ribbon_end=src.index(b"<!-- ZM_HOME_RIBBON_END -->")+len(b"<!-- ZM_HOME_RIBBON_END -->")
          feature_begin=src.index(b"<!-- ZM_HOME_FEATURE_BEGIN -->")
          feature_end=src.index(b"<!-- ZM_HOME_FEATURE_END -->")+len(b"<!-- ZM_HOME_FEATURE_END -->")
          ribbon=src[ribbon_begin:ribbon_end]
          feature=src[feature_begin:feature_end]
          assert len(ribbon)>300 and len(feature)>6000 and feature.count(b"<img ")==4
          assert not backup.exists()
          backup.mkdir(parents=True)
          snapshot=backup/"index.before.html"
          snapshot.write_bytes(original)
          assert snapshot.read_bytes()==original
          amended=original.replace(b"</header>",b"\n"+ribbon+b"\n</header>",1)
          hero_start=amended.index(b'<section class="wrap hero"')
          hero_end=amended.find(b"</section>",hero_start)
          assert hero_end>hero_start and hero_end-hero_start<8000
          hero_end+=len(b"</section>")
          amended=amended[:hero_end]+b"\n"+feature+b"\n"+amended[hero_end:]
          assert amended.count(b"ZM_HOME_RIBBON_BEGIN")==1
          assert amended.count(b"ZM_HOME_FEATURE_BEGIN")==1
          assert amended.count(b"</main>")==1
          temp=target.with_name("index.zm-gallery-"+sha+".tmp")
          temp.write_bytes(amended)
          os.chmod(temp,target.stat().st_mode & 0o777)
          os.replace(temp,target)
          print("ORIGINAL_HOME_PAGE_BACKUP=verified")
          print("HEADER_AND_PHOTO_CONTENT_INSTALLED=yes")
          print("ADDITIVE_BYTES="+str(len(amended)-len(original)))
          PY
      - name: Verify live header, images, articles, academy and agricultural routes
        run: |
          set -euo pipefail
          html="$RUNNER_TEMP/zm-verified-home.html"
          status="$(curl -L -sS --max-time 35 -H 'Cache-Control: no-cache' "https://zomorodmelal.ir/?new_header=$GITHUB_SHA" -o "$html" -w '%{http_code}' || true)"
          echo "HOME_HTTP=$status"
          test "$status" = 200
          for marker in ZM_HOME_RIBBON_BEGIN ZM_HOME_FEATURE_BEGIN zm-home-feature-20261016 zm-specialist-library-20261016 zm-compendium-navigation-20261016; do
            grep -Fq "$marker" "$html"
          done
          grep -Fq 'از شناخت مزرعه تا تصمیم درست برای تولید' "$html"
          grep -Fq 'پیش از کشت: برآورد هزینه و نقطه سربه‌سر' "$html"
          grep -Fq 'در طول تولید: پایش آب و خاک با داده معتبر' "$html"
          grep -Fq 'پس از برداشت: کیفیت، فرآوری و بازار' "$html"
          for route in agriculture/ agriculture/greenhouse/ agriculture/livestock/ industry/ research/ amozeshgah/ company/ blog/ store/; do
            result="$(curl -L -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://zomorodmelal.ir/$route" || true)"
            echo "PROTECTED_ROUTE=/$route HTTP=$result"
            test "$result" = 200
          done
          echo "LIVE_HOMEPAGE_HEADER_GALLERY_AND_CONTENT=verified"
      - name: Restore exact original homepage if any public verification fails
        if: failure()
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-root"
          ssh -F "$d/config" saeit-cpanel python3 - "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import os,sys
          sha=sys.argv[1]
          target=Path("/home/zomorod2/public_html/index.html")
          snapshot=Path.home()/".backups"/"zomorod-home-header-gallery"/sha/"index.before.html"
          if snapshot.is_file() and target.is_file() and b"ZM_HOME_FEATURE_BEGIN" in target.read_bytes():
              temp=target.with_name("index.zm-gallery-rollback-"+sha+".tmp")
              temp.write_bytes(snapshot.read_bytes())
              os.chmod(temp,target.stat().st_mode & 0o777)
              os.replace(temp,target)
              assert target.read_bytes()==snapshot.read_bytes()
              print("PREVIOUS_HOMEPAGE_RESTORED=verified")
          else:
              print("NO_NEW_GALLERY_INSTALLATION_TO_RESTORE=yes")
          PY
      - name: Remove temporary SSH keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/zomorod-root"
