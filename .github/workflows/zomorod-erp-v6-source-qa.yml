name: Zomorod ERP V6 verified source-only CI
on:
  push:
    branches: ['feature/zomorod-erp-v6-verified-source-20261029']
    paths:
      - 'release-candidates/zomorod-erp-v6-verified/**'
      - '.github/workflows/zomorod-erp-v6-source-qa.yml'
  pull_request:
    paths:
      - 'release-candidates/zomorod-erp-v6-verified/**'
      - '.github/workflows/zomorod-erp-v6-source-qa.yml'
permissions:
  contents: read
jobs:
  v6-offline-php-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
      - name: Validate V6 byte-for-byte source manifest (no production writes)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('release-candidates/zomorod-erp-v6-verified')
          m=json.loads((root/'MANIFEST.json').read_text())
          assert m['status']=='DEVELOPMENT_ONLY_NOT_PRODUCTION_DEPLOYABLE'
          assert m['production_data_included'] is False
          assert m['secret_material_included'] is False
          assert len(m['files'])==45
          for row in m['files']:
              p=root/row['path']
              assert p.is_file() and not p.is_symlink()
              blob=p.read_bytes()
              assert len(blob)==row['bytes'] and hashlib.sha256(blob).hexdigest()==row['sha256'], row['path']
          print('V6_SOURCE_MANIFEST_45_OF_45=PASS')
          print('PRODUCTION_DEPLOYMENT=NOT_PERFORMED')
          PY
      - name: Full PHP and Python SQLite offline suite for V6 exact source
        shell: bash
        run: |
          set -euo pipefail
          php -r 'exit(extension_loaded("pdo_sqlite")?0:1);'
          cd release-candidates/zomorod-erp-v6-verified
          python3 scripts/run_all_offline_qa.py --report-out "$RUNNER_TEMP/zm-v6-qa.json"
          python3 - "$RUNNER_TEMP/zm-v6-qa.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['offline_checks_available_here']=='PASS'
          assert report['php_sqlite_business_tests']=='PASS'
          assert report['full_offline_database_tests_verified'] is True
          assert report['full_erp_readiness'] is False
          print('V6_PHP_SQLITE_OFFLINE_TESTS=PASS')
          print('PRODUCTION_DEPLOYMENT=NOT_PERFORMED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zomorod-erp-v6-offline-php-${{ matrix.php }}
          path: ${{ runner.temp }}/zm-v6-qa.json
          retention-days: 14
