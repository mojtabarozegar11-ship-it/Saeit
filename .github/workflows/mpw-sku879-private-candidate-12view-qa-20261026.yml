name: Private comprehensive 12-view QA of SKU879 fixed candidate
# SHA-bound and private: never attach source ZIP, screenshots or client data.
on:
  pull_request:
    paths:
      - scripts/mpw_sku879_private_browser_qa_20261026.py
      - scripts/mpw_sku879_private_candidate_12view_qa_20261026.py
      - tests/test_mpw_sku879_private_candidate_12view_qa_20261026.py
      - .github/workflows/mpw-sku879-private-candidate-12view-qa-20261026.yml
  push:
    branches: [main]
    paths:
      - scripts/mpw_sku879_private_browser_qa_20261026.py
      - scripts/mpw_sku879_private_candidate_12view_qa_20261026.py
      - tests/test_mpw_sku879_private_candidate_12view_qa_20261026.py
      - .github/workflows/mpw-sku879-private-candidate-12view-qa-20261026.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mpw-sku879-private-12view-candidate
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prove expanded real browser viewports and accessibility smoke gates
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          command -v chromedriver
          python3 -B -m py_compile scripts/mpw_sku879_private_browser_qa_20261026.py scripts/mpw_sku879_private_candidate_12view_qa_20261026.py
          python3 -B -m unittest discover -s tests -p test_mpw_sku879_private_candidate_12view_qa_20261026.py -v
  candidate-matrix:
    needs: tests
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Establish pinned no-agent-forwarding GitHub to VPS to cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          install -d -m 700 "$d"
          for variable in VPS_KEY HOST_KEY; do
            file="$d/$variable.key"
            printf '%s' "${!variable}" | python3 -c 'import sys;print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$file"
            chmod 600 "$file"
            ssh-keygen -y -P '' -f "$file" >/dev/null
          done
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh -i "$d/VPS_KEY.key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/vps.known" -o BatchMode=yes githubops@178.239.147.150 'ssh-keyscan -T 10 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/VPS_KEY.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/HOST_KEY.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
      - name: Read only private hash-pinned repair candidate and verify on runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          candidate='/home/githubops/factory-runtime/private/autonomous-product-cycle/design-intake/mpw-live-three-sku-qa/quality1000-rework/879/20894f2de0228318c0e96ba407c2bd4aa98b62ba2f3f2f2fbca53987c9276783/mobile-candidates/b6f171affcafcafc777279e70649dbebda87a0f7fd45389252423ffb0d1066f3.zip'
          timeout 90s ssh -T -F "$d/config" saeit-vps "test -f '$candidate' && cat '$candidate'" > "$d/sku879-responsive-private.zip"
          test "$(sha256sum "$d/sku879-responsive-private.zip" | awk '{print $1}')" = 'b6f171affcafcafc777279e70649dbebda87a0f7fd45389252423ffb0d1066f3'
          chmod 600 "$d/sku879-responsive-private.zip"
          echo 'MPW879_RESPONSIVE_CANDIDATE_HASH_VERIFIED=true'
      - name: Run 12 real browser viewports, persist immutable factory QA, fail closed
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mpw-live-three-private-qa"
          qa_status=0
          python3 -B scripts/mpw_sku879_private_candidate_12view_qa_20261026.py audit "$d/sku879-responsive-private.zip" "$d/candidate-12view-receipt.json" || qa_status=$?
          test -s "$d/candidate-12view-receipt.json"
          script_b64="$(base64 -w0 scripts/mpw_sku879_private_candidate_12view_qa_20261026.py)"
          timeout 90s ssh -T -F "$d/config" saeit-vps "python3 -c 'import base64;exec(base64.b64decode(\"$script_b64\"))' ingest" < "$d/candidate-12view-receipt.json"
          test "$qa_status" -eq 0
      - name: Remove transient private product, metrics and SSH credentials
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/mpw-live-three-private-qa"; then
            rm -rf -- "$RUNNER_TEMP/mpw-live-three-private-qa"
          fi
