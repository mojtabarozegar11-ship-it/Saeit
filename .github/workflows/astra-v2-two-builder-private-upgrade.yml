name: Astra V2 Private Two-Builder Scheduler Upgrade

on:
  push:
    branches: [feature/astra-factory-v2-architecture-20261014]
    paths: [.github/workflows/astra-v2-two-builder-private-upgrade.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-v2-two-builder-private-upgrade
  cancel-in-progress: false

jobs:
  deploy-private-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify arithmetic, security and private queue integration
        run: |
          python -m unittest discover -s tests -p test_astra_farm_procurement_audit.py -q
          python -m unittest discover -s tests -p test_astra_orchard_decision_audit.py -q
          python -m unittest discover -s tests -p test_astra_v2_private_pipeline.py -q
          node --check product_prototypes/orchard_decision_audit/app.js
      - name: Stage, independently verify and safely switch only the private scheduler code
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          tmp="$RUNNER_TEMP/astra-private-two-builder"
          install -d -m 700 "$tmp"
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$tmp/key"
          chmod 600 "$tmp/key"
          ssh-keygen -y -P '' -f "$tmp/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$tmp/known" 2>/dev/null
          test "$(ssh-keygen -lf "$tmp/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          SSH=(ssh -i "$tmp/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 githubops@178.239.147.150)
          tar -cf - scripts/astra_v2_private_pipeline.py tests/test_astra_orchard_decision_audit.py tests/test_astra_farm_procurement_audit.py tests/test_astra_v2_private_pipeline.py product_prototypes/orchard_decision_audit product_prototypes/farm_procurement_audit | "${SSH[@]}" 'set -eu; umask 077; dest="$HOME/factory-runtime/operations/astra-v2-two-builder-upgrade-candidate"; mkdir -p "$dest"; tar -xf - -C "$dest"'
          "${SSH[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = githubops
          stage="$HOME/factory-runtime/operations/astra-v2-two-builder-upgrade-candidate"
          active="$HOME/factory-runtime/operations/astra-v2-vps-canary-source"
          private="$HOME/factory-runtime/private/astra-v2-canary-products"
          test -d "$stage" && test -d "$active" && test -d "$private"
          test -f "$private/queue.sqlite3"
          cd "$stage"
          python3 -m unittest discover -s tests -p test_astra_farm_procurement_audit.py -q
          python3 -m unittest discover -s tests -p test_astra_orchard_decision_audit.py -q
          python3 -m unittest discover -s tests -p test_astra_v2_private_pipeline.py -q
          python3 product_prototypes/farm_procurement_audit/self_test.py
          python3 product_prototypes/orchard_decision_audit/self_test.py
          oldcron="$(crontab -l | sha256sum | awk '{print $1}')"
          test "$(crontab -l | grep -F -c ASTRA_V2_PRIVATE_RND_TICK)" = 1
          # The same lock is used by the already installed five-minute cron.
          # The original factory's service/cron and all sites are untouched.
          (
            flock -w 100 9
            test -d "$active"
            backup="$private/source-before-two-builder-upgrade.tar"
            if test ! -f "$backup"; then
              tar -cf "$backup" -C "$active" scripts/astra_v2_private_pipeline.py tests product_prototypes
              chmod 600 "$backup"
            fi
            test -s "$backup"
            switched=false
            rollback_owned_code() {
              if test "$switched" = true; then
                tar -xf "$backup" -C "$active"
                echo ASTRA_V2_PRIVATE_CODE_ROLLBACK=EXECUTED
              fi
            }
            trap rollback_owned_code EXIT
            # Update only private source files while the clock worker cannot run.
            switched=true
            tar -cf - -C "$stage" scripts/astra_v2_private_pipeline.py tests product_prototypes | tar -xf - -C "$active"
            cd "$active"
            python3 product_prototypes/farm_procurement_audit/self_test.py
            python3 product_prototypes/orchard_decision_audit/self_test.py
            python3 -m unittest discover -s tests -p test_astra_farm_procurement_audit.py -q
            python3 -m unittest discover -s tests -p test_astra_v2_private_pipeline.py -q
            # Fail-safe rollback of only the owned source, if tests fail;
            # do not alter original factory or its cron.
            python3 - <<'PY'
          import json,pathlib,stat
          private=pathlib.Path.home()/"factory-runtime/private/astra-v2-canary-products"
          inbox=private/"incoming"
          inbox.mkdir(mode=0o700,exist_ok=True)
          assert not inbox.is_symlink()
          p=inbox/"procurement_product_private_reference.json"
          data={
            "brief_id":"private_procurement_quote_audit_v1",
            "builder":"farm_procurement_audit_v1",
            "development_scope":"private_reference_prototype",
            "publication_allowed":False,
            "market_demand_verified":False,
            "paid_api_budget":0,
            "problem":"Review agricultural input supplier quotes by usable quantity, delivered total cost, declared capacity and delivery deadline."
          }
          if p.exists():
            assert json.loads(p.read_text())==data
          else:
            p.write_text(json.dumps(data,sort_keys=True)+chr(10))
            p.chmod(0o600)
          PY
            python3 scripts/astra_v2_private_pipeline.py tick --root "$private"
            python3 scripts/astra_v2_private_pipeline.py tick --root "$private"
            python3 - "$private" <<'PY'
          import pathlib,sqlite3,sys,json
          root=pathlib.Path(sys.argv[1])
          con=sqlite3.connect(str(root/"queue.sqlite3"))
          rows=con.execute("SELECT DISTINCT builder FROM jobs WHERE stage='PRIVATE_QA_PASSED'").fetchall()
          names={row[0] for row in rows}
          assert "orchard_decision_audit_v2" in names,names
          assert "farm_procurement_audit_v1" in names,names
          manifest=[json.loads(path.read_text()) for path in root.glob("qa-*.json")]
          for item in manifest:
            assert item["sale_ready"] is False and item["quality_score"] is None
            assert item["owner_publication_approval"] is False and item["real_payment_allowed"] is False
          print("ASTRA_V2_ACTIVE_PRIVATE_FACTORY_BUILDERS=2")
          print("ASTRA_V2_PRIVATE_TWO_PRODUCT_FAMILIES=CONFIRMED")
          print("ASTRA_V2_PRIVATE_AUTO_INBOX_INTAKE=ENABLED")
          print("ASTRA_V2_COMMERCIAL_QUALITY_VERIFIED=false")
          print("ASTRA_V2_STORE_PUBLICATION=false")
          PY
            switched=false
            trap - EXIT
          ) 9>"$private/.timer-lock"
          newcron="$(crontab -l | sha256sum | awk '{print $1}')"
          test "$oldcron" = "$newcron"
          echo ASTRA_V2_ORIGINAL_CRONTAB_UNCHANGED=true
          echo ASTRA_V2_ORIGINAL_FACTORY_UNCHANGED=true
          echo ASTRA_V2_MARKET_VALIDATION_NOT_CLAIMED=true
          REMOTE
