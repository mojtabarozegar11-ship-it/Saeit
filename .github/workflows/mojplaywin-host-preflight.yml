name: MojPlayWin SSH host preflight (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch payload
        run: |
          set -euo pipefail
          test -s core/mojplaywin_specialties.py
          test -s core/mojplaywin_specialty_views.py
          test -s core/templates/brands/mojplaywin/specialty.html
          python -m compileall -q core/mojplaywin_specialties.py core/mojplaywin_specialty_views.py core/mojplaywin_about_views.py
      - name: Configure pinned SSH
        env:
          VPS_KEY: ${{ secrets.SAEIT_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN: ${{ secrets.SAEIT_VPS_SSH_KNOWN_HOSTS }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
          HOST_KNOWN: ${{ secrets.SAEIT_HOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$VPS_KNOWN" && test -n "$HOST_KEY" && test -n "$HOST_KNOWN"
          mkdir -p "$RUNNER_TEMP/moj-ssh"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/moj-ssh/vps.key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/moj-ssh/host.key"
          printf '%s\n' "$VPS_KNOWN" > "$RUNNER_TEMP/moj-ssh/vps.known"
          printf '%s\n' "$HOST_KNOWN" > "$RUNNER_TEMP/moj-ssh/host.known"
          sed -i 's/\r$//' "$RUNNER_TEMP/moj-ssh/"*
          chmod 600 "$RUNNER_TEMP/moj-ssh/"*
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/moj-ssh/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/moj-ssh/host.key" >/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/moj-ssh/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          test "$(ssh-keygen -lf "$RUNNER_TEMP/moj-ssh/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          cat > "$RUNNER_TEMP/moj-ssh/config" <<EOF
          Host relay
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $RUNNER_TEMP/moj-ssh/vps.key
            UserKnownHostsFile $RUNNER_TEMP/moj-ssh/vps.known
          Host hosting
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $RUNNER_TEMP/moj-ssh/host.key
            UserKnownHostsFile $RUNNER_TEMP/moj-ssh/host.known
            ProxyJump relay
          Host *
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 10
            ForwardAgent no
          EOF
          chmod 600 "$RUNNER_TEMP/moj-ssh/config"
      - name: Read-only production compatibility inventory
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/moj-ssh/config" hosting 'set -eu
            test "$(id -un)" = zomorod2
            echo "ACCOUNT=$(id -un)"
            for d in /home/zomorod2/Saeit-staging /home/zomorod2/mojplaywin.com; do
              if test -d "$d"; then echo "DIRECTORY_EXISTS=$d"; else echo "DIRECTORY_MISSING=$d"; fi
            done
            for f in /home/zomorod2/Saeit-staging/config/urls.py /home/zomorod2/Saeit-staging/core/mojplaywin_specialties.py /home/zomorod2/Saeit-staging/core/templates/brands/mojplaywin/includes/mega_nav.html /home/zomorod2/mojplaywin.com/passenger_wsgi.py; do
              if test -f "$f"; then echo "FILE_EXISTS=$f"; sha256sum "$f"; else echo "FILE_MISSING=$f"; fi
            done
            if command -v python3 >/dev/null 2>&1; then python3 --version; fi
            if command -v git >/dev/null 2>&1 && test -d /home/zomorod2/Saeit-staging/.git; then git -C /home/zomorod2/Saeit-staging rev-parse HEAD; fi
          '
      - name: Remove SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/moj-ssh"
