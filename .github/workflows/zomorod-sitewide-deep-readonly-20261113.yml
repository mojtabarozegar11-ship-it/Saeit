name: Zomorod existing sitewide deep audit — read only
on:
  pull_request:
    paths:
      - 'scripts/zomorod_public_sitewide_readonly_audit_20261113.py'
      - 'tests/test_zomorod_sitewide_readonly_parser_20261113.py'
      - 'content/zomorod-business/app.php'
      - 'scripts/zomorod_sitewide_playwright_audit_20261019.cjs'
      - 'scripts/zomorod_store_overflow_readonly_20261113.cjs'
      - 'scripts/zomorod_cpanel_store_provenance_readonly_20261114.py'
      - 'scripts/zomorod_cpanel_store_readonly_relay_20261114.sh'
      - 'tests/test_zomorod_cpanel_store_provenance_readonly_20261114.py'
      - '.github/workflows/zomorod-sitewide-deep-readonly-20261113.yml'
permissions:
  contents: read
concurrency:
  group: zm-sitewide-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  public-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse syntax and verify anonymous GET-only policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          code=Path('scripts/zomorod_public_sitewide_readonly_audit_20261113.py').read_text()
          ast.parse(code)
          assert 'method="GET"' in code
          assert 'MAX_SCAN=200' in code
          assert '"site_writes":0' in code
          print('ZM_SITEWIDE_READONLY_POLICY=VERIFIED')
          PY
          python3 -B -m unittest discover -s tests -p 'test_zomorod_sitewide_readonly_parser_20261113.py' -v
          python3 -B -m unittest discover -s tests -p 'test_zomorod_cpanel_store_provenance_readonly_20261114.py' -v
          bash -n scripts/zomorod_cpanel_store_readonly_relay_20261114.sh
      - name: Crawl sitemap and sample up to 200 existing public site pages
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/zomorod_public_sitewide_readonly_audit_20261113.py |
            tee "$RUNNER_TEMP/sitewide-public-log.txt"
      - name: Publish report artifact ONLY (no site changes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-existing-sitewide-http-audit
          path: |
            ${{ runner.temp }}/zm-sitewide-audit/
            ${{ runner.temp }}/sitewide-public-log.txt
          retention-days: 7
          if-no-files-found: warn
  browser-visual-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install temporary Chromium and accessibility checks (runner only)
        shell: bash
        run: |
          set -euo pipefail
          npm --silent init -y >/dev/null
          npm --silent install --no-save playwright@1.55.0 @axe-core/playwright@4.10.0
          npx playwright install chromium
      - name: Audit existing production layout at 390px and 1440px (GET only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zm-deep-browser"
          node scripts/zomorod_sitewide_playwright_audit_20261019.cjs |
            tee "$RUNNER_TEMP/zm-deep-browser/trace.txt"
          test -s sitewide-visual.json
          cp sitewide-visual.json "$RUNNER_TEMP/zm-deep-browser/"
          for img in *.png; do
            test -f "$img" || continue
            cp "$img" "$RUNNER_TEMP/zm-deep-browser/"
          done
          python3 - <<'PY'
          import json,os
          p=json.load(open('sitewide-visual.json'))
          issues=p.get('issues',{})
          print('ZM_DEEP_BROWSER_AUDIT',json.dumps({
           'path_count':len(p.get('scope',[])),
           'viewports':p.get('widths',[]),
           'reports':len(p.get('results',[])),
           'issues':{key:len(val) for key,val in issues.items()},
           'site_writes':0},ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
           f.write('\n## Existing Zomorod site — visual / accessibility audit\n\n')
           f.write('No site, page, template, form or payment mutations.\n\n')
           for key,val in issues.items():
            f.write('- '+key+': '+str(len(val))+' findings\n')
           f.write('\nFull details are in the GitHub Actions artifact.\n')
          PY
      - name: Preserve only screenshots and findings for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-existing-sitewide-browser-axe-audit
          path: ${{ runner.temp }}/zm-deep-browser/
          retention-days: 7
          if-no-files-found: warn
  store-mobile-overflow-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install temporary Chromium (read-only audit)
        shell: bash
        run: |
          set -euo pipefail
          npm --silent install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Diagnose exact existing store element causing horizontal spill
        shell: bash
        run: |
          set -euo pipefail
          node scripts/zomorod_store_overflow_readonly_20261113.cjs
      - name: Save browser element evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-existing-store-overflow-diagnostic
          path: ${{ runner.temp }}/zm-store-overflow-readonly/
          retention-days: 7
          if-no-files-found: warn

  store-cpanel-source-provenance:
    # No repo forks or arbitrary PR branches may access privileged runner secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/zomorod-entire-site-readonly-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated source/relay contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_zomorod_cpanel_store_provenance_readonly_20261114.py' -v
          bash -n scripts/zomorod_cpanel_store_readonly_relay_20261114.sh
      - name: Attest exact current cPanel native-store source (read-only, pinned relay)
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash scripts/zomorod_cpanel_store_readonly_relay_20261114.sh |
            tee "$RUNNER_TEMP/zm-store-source-provenance.jsonl"
      - name: Preserve sanitized hash-and-CSS flags only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-store-cpanel-source-provenance
          path: ${{ runner.temp }}/zm-store-source-provenance.jsonl
          retention-days: 7
          if-no-files-found: warn
