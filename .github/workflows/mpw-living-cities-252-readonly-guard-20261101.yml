name: MojPlayWin Living Cities truthful browser and account API readiness gate
on:
  push:
    branches: [main]
    paths: [.github/workflows/mpw-living-cities-252-readonly-guard-20261101.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  guard:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Connect via pinned relay
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash games/farm-wars-v3/scripts/ssh_relay.sh
      - name: Independently check original game owner and private staging prerequisites only
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/farm-v4-ssh"
          timeout 50s ssh -T -F "$d/config" host 'python3 -' <<'PY'
          from pathlib import Path
          import os
          h=Path.home()
          game=h/"mojplaywin.com/living-cities"
          marker=game/"LC-OWNER.txt"
          expected="MPW-LIVING-CITIES-GLOBAL-20-LANG-eca666cbb730a6fcf70d284328893a78ad966881"
          source=h/".private/mpw-living-cities-global/releases/eca666cbb730a6fcf70d284328893a78ad966881/source.tgz"
          checks={
            "correct_user":os.geteuid()==h.stat().st_uid,
            "home_dot_private_not_symlink":not (h/".private").is_symlink(),
            "site_not_symlink":not (h/"mojplaywin.com").is_symlink(),
            "public_game_is_real_folder":game.is_dir() and not game.is_symlink(),
            "public_game_owner_file_exists":marker.is_file() and not marker.is_symlink(),
            "current_release_owner_exact":marker.is_file() and marker.read_text().strip()==expected,
            "new_private_root_not_symlink":not (h/".private/mpw-living-cities-global").is_symlink(),
            "current_release_not_symlink":not source.parent.is_symlink(),
            "current_source_archive_regular":source.is_file() and not source.is_symlink(),
            "current_source_archive_large_enough":source.is_file() and source.stat().st_size>10000,
          }
          for key,value in checks.items():print("MPW_252_PREFLIGHT_"+key+"="+("PASS" if value else "FAIL"))
          if not all(checks.values()):
              print("MPW_252_READINESS_GATE=FAIL")
              raise SystemExit(1)
          print("MPW_252_BROWSER_RELEASE_OWNERSHIP=PASS")
          PY
      - name: Require real MojPlayWin account API policy and playable browser route
        shell: bash
        run: |
          set -euo pipefail
          for item in '/living-cities/play/ 200' '/api/living-cities/rewards/moj1-policy/ 200' '/api/living-cities/tycoon/ 401'; do
            read -r route expected_code <<< "$item"
            code="$(curl -sS -L --connect-timeout 6 --max-time 18 -o /dev/null -w '%{http_code}' "https://mojplaywin.com$route" || true)"
            echo "MPW_READINESS_HTTP route=$route status=$code expected=$expected_code"
            if [ "$code" != "$expected_code" ]; then
              echo "MPW_ACCOUNT_RELEASE_NOT_READY=FAIL"
              exit 1
            fi
          done
          echo MPW_BROWSER_AND_ACCOUNT_API_READINESS=PASS
      - name: Wipe SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/farm-v4-ssh"
