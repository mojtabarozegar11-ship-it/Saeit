name: Factory QC184 license-safe alternative literature discovery
on:
  pull_request:
    paths:
      - scripts/factory_qc184_licensed_replacement_discovery_20261024.py
      - tests/test_factory_qc184_licensed_replacement_discovery_20261024.py
      - deploy/install_factory_qc184_licensed_replacements_20261024.sh
      - .github/workflows/factory-qc184-licensed-alternative-discovery-20261024.yml
  push:
    branches: [main]
    paths:
      - scripts/factory_qc184_licensed_replacement_discovery_20261024.py
      - tests/test_factory_qc184_licensed_replacement_discovery_20261024.py
      - deploy/install_factory_qc184_licensed_replacements_20261024.sh
      - .github/workflows/factory-qc184-licensed-alternative-discovery-20261024.yml
permissions: {contents: read}
concurrency:
  group: factory-qc184-alternative-discovery
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check lawful alternative source candidates without fake QC certification
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_factory_qc184_licensed_replacement_discovery_20261024.py' -v
          python3 -B -m unittest discover -s tests -p 'test_factory_primary_fulltext_acquisition_20261024.py' -v
          bash -n deploy/install_factory_qc184_licensed_replacements_20261024.sh
  live-private-factory:
    needs: regression
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-live-qc184-alternative-discovery-20261024]')
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install private candidate discovery only after host key and byte checks
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/qc184-alternatives"
          install -d -m 700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh_vps() {
            ssh -T -i "$d/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 githubops@178.239.147.150 "$@"
          }
          py='/home/githubops/factory-runtime/.venv/bin/python'
          target="/home/githubops/factory-runtime/operations/.qc184-alternatives-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_vps "test \"\$(id -un)\" = githubops; umask 077; test ! -e '$target'; install -d -m 700 '$target/scripts' '$target/tests' '$target/deploy'"
          for file in scripts/factory_primary_fulltext_acquisition_20261024.py scripts/factory_qc184_licensed_replacement_discovery_20261024.py tests/test_factory_qc184_licensed_replacement_discovery_20261024.py deploy/install_factory_qc184_licensed_replacements_20261024.sh; do
            ssh_vps "umask 077; cat > '$target/$file'; chmod 600 '$target/$file'" < "$file"
            expected="$(sha256sum "$file" | awk '{print $1}')"
            ssh_vps "test \"\$(sha256sum '$target/$file' | awk '{print \$1}')\" = '$expected'"
          done
          ssh_vps "timeout 100s '$py' -B -m unittest discover -s '$target/tests' -p test_factory_qc184_licensed_replacement_discovery_20261024.py -v"
          ssh_vps "bash -n '$target/deploy/install_factory_qc184_licensed_replacements_20261024.sh'"
          ssh_vps "GITHUB_RUN_ID='$GITHUB_RUN_ID' timeout 520s bash '$target/deploy/install_factory_qc184_licensed_replacements_20261024.sh' '$target/scripts/factory_qc184_licensed_replacement_discovery_20261024.py'"
          printf '%s\n' 'QC184_ALTERNATIVE_DISCOVERY=INSTALLED' 'NO_SCIENTIFIC_APPROVAL' 'NO_PUBLIC_RELEASE'
