name: VPS historical DB critical content protection READ ONLY
on:
  pull_request:
    paths:
      - .github/workflows/vps-old-transfer-db-critical-records-census-20261025.yml
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Count preserved product, content, agent and configuration records in old transfer DBs
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/factory-owner-reset-inventory"
          install -d -m 700 "$d"
          trap 'rm -f -- "$d/key" "$d/known"; rmdir "$d" || true' EXIT
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          timeout 550s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'PYTHONDONTWRITEBYTECODE=1 python3 -' <<'PY'
          from pathlib import Path
          import json,sqlite3,os
          base=Path('/home/githubops/factory-transfer-incoming/private-db')
          names=('factory-fresh-20261010.sqlite3','factory-migration-snapshot.sqlite3')
          tables=('core_product','core_blogpage','core_blogpublication','core_knowledgebook','core_knowledgearticle','core_legalentity','core_brandsite','core_agent','core_agenttask','core_factoryartifact','core_factoryrun','core_researchproject','core_companyinquiry','core_walletconnection','core_ledgerentry','core_companygallerymedia','core_companycontentlink','core_chatmessage','core_chatsession','core_educationcourse','core_evidence','django_session')
          if os.geteuid()==0 or base.is_symlink() or sorted(x.name for x in base.iterdir())!=sorted(names):
              raise SystemExit('UNSAFE_TRANSFER_DB_INSPECTION')
          report={}
          for name in names:
              p=base/name
              conn=sqlite3.connect('file:'+str(p)+'?mode=ro&immutable=1',uri=True)
              try:
                  present={x[0] for x in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  counts={}
                  for t in tables:
                      if t in present:counts[t]=int(conn.execute('SELECT COUNT(*) FROM '+t).fetchone()[0])
                  report[name]=counts
              finally:conn.close()
          print('VPS_TRANSFER_DATABASE_PROTECTED_CONTENT='+json.dumps({'table_record_counts':report,'read_only':True,'mutations':0},sort_keys=True),flush=True)

          PY
          echo VPS_OLD_DB_PROTECTED_CONTENT_READONLY=PASS
