name: Zomorod site-only VPS warehouse bridge plus 3 production orders
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zomorod-vps-warehouse-3order-bridge.yml
      - scripts/zomorod_vps_warehouse_3order_bridge.py
      - scripts/zomorod_factory_store_import.py
      - scripts/factory_store_sender.py
      - scripts/store_receiver.py
      - tests/test_existing_courier_customer_packages.py
      - content/zomorod-v11/site_store.php
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zomorod-vps-warehouse-bridge-site-only
  cancel-in-progress: false
jobs:
  bridge:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verify three-order and native private store safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zomorod_warehouse_3order_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_existing_courier_customer_packages.py' -v
          python3 -m py_compile scripts/factory_store_sender.py scripts/store_receiver.py scripts/zomorod_vps_warehouse_3order_bridge.py
          php -l content/zomorod-v11/site_store.php
          echo ZM_BRIDGE_TESTS=passed
      - name: Prepare pinned SSH to both VPS and Zomorod cPanel
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-site-factory-bridge"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host zm-vps
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host zm-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump zm-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ForwardAgent no
            RequestTTY no
            ConnectTimeout 12
            ConnectionAttempts 1
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -T -F "$d/config" zm-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo ZM_BRIDGE_BOTH_PINNED_HOSTS=verified
      - name: Stage site-only robot modules on VPS without touching factory executors
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          ssh -T -F "$d/config" zm-vps bash -se <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = githubops
          test -d "$HOME/factory-runtime/private/autonomous-product-cycle"
          test -s "$HOME/factory-runtime/operations/production-instructions/generate-orders.py"
          test -s "$HOME/factory-runtime/operations/factory_store_sender.py"
          test -s "$HOME/.ssh/saeit_factory_store_ed25519"
          test -s "$HOME/.ssh/saeit_factory_store_hosts"
          dest="$HOME/factory-runtime/operations/zomorod-site-bridge"
          test ! -L "$dest"
          install -d -m 700 "$dest"
          for f in bridge.py warehouse.py sender.py families.json;do test ! -L "$dest/$f";done
          REMOTE
          # Keep the previous runner-backed bridge before replacing live VPS code.
          # Atomic replacement of the changed bridge module prevents partial SCP writes.
          ssh -T -F "$d/config" zm-vps bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          run="$1"
          dest="$HOME/factory-runtime/operations/zomorod-site-bridge"
          backup="$HOME/factory-runtime/operations/backups/zomorod-courier-$run"
          test -d "$dest" && test ! -L "$dest"
          test ! -L "$dest/bridge.py"
          install -d -m 700 "$backup"
          if test -f "$dest/bridge.py";then
            cp -p "$dest/bridge.py" "$backup/bridge.before.py"
            chmod 600 "$backup/bridge.before.py"
            cmp -s "$dest/bridge.py" "$backup/bridge.before.py"
            echo ZM_COURIER_PRIOR_CODE_SNAPSHOT=verified
          fi
          REMOTE
          scp -q -F "$d/config" scripts/zomorod_vps_warehouse_3order_bridge.py zm-vps:factory-runtime/operations/zomorod-site-bridge/.bridge-candidate-$GITHUB_RUN_ID.py
          scp -q -F "$d/config" scripts/factory_production_warehouse.py zm-vps:factory-runtime/operations/zomorod-site-bridge/warehouse.py
          scp -q -F "$d/config" scripts/factory_store_sender.py zm-vps:factory-runtime/operations/zomorod-site-bridge/sender.py
          scp -q -F "$d/config" factory_config/forty_families.json zm-vps:factory-runtime/operations/zomorod-site-bridge/families.json
          ssh -T -F "$d/config" zm-vps bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          run="$1"
          x="$HOME/factory-runtime/operations/zomorod-site-bridge"
          chmod 600 "$x/"*.py "$x/families.json"
          python3 -B - "$x" "$run" <<'PY'
          import ast,json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          for f in ["warehouse.py","sender.py"]:ast.parse((p/f).read_text())
          candidate=p/(".bridge-candidate-"+sys.argv[2]+".py")
          assert candidate.is_file() and not candidate.is_symlink()
          ast.parse(candidate.read_text())
          assert len(json.loads((p/"families.json").read_text())["profiles"])==40
          print("ZM_BRIDGE_VPS_40_FAMILY_REGISTRY_AND_ROBOT_READY=yes")
          PY
          test ! -L "$x/.bridge-candidate-$run.py"
          mv -f -- "$x/.bridge-candidate-$run.py" "$x/bridge.py"
          chmod 600 "$x/bridge.py"
          python3 -m py_compile "$x/bridge.py"
          echo ZM_COURIER_ATOMIC_CODE_INSTALL=verified
          REMOTE
      - name: Diagnose live native factory order capacity and exact backlog safely
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          timeout 40s ssh -T -F "$d/config" zm-vps 'python3 -' <<'PY'
          from pathlib import Path
          import json,re
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          folder=root/"production-instructions/orders"
          if not folder.is_dir() or folder.is_symlink():
              print("ZM_BRIDGE_PREFLIGHT=QUEUE_DIRECTORY_MISSING");raise SystemExit(1)
          order_re=re.compile(r"^WO-[0-9]{8}\.json$")
          counts={"issued":0,"in_engineering":0,"blocked_rework":0,"completed_verified":0}
          invalid=0;num=0;max_id=0
          for file in sorted(folder.iterdir()):
              num+=1
              if file.is_symlink() or not file.is_file() or not order_re.fullmatch(file.name):
                  invalid+=1
                  continue
              if file.stat().st_size>100000:
                  invalid+=1;continue
              try:
                  data=json.loads(file.read_text(encoding="utf-8"))
              except (OSError,ValueError):
                  invalid+=1;continue
              if data.get("schema")!="saeit.factory.production-instructions.v1" or data.get("id")!=file.stem or data.get("status") not in counts:
                  invalid+=1;continue
              max_id=max(max_id,int(file.stem[3:]))
              counts[data["status"]]+=1
          active=counts["issued"]+counts["in_engineering"]+counts["blocked_rework"]
          print("ZM_BRIDGE_NATIVE_ORDER_RECORDS="+str(num))
          print("ZM_BRIDGE_NATIVE_ORDERS_BY_STATUS="+json.dumps(counts,sort_keys=True))
          print("ZM_BRIDGE_NATIVE_ORDER_UNEXPECTED_ENTRIES="+str(invalid))
          print("ZM_BRIDGE_NATIVE_PENDING="+str(active))
          print("ZM_BRIDGE_NATIVE_SLOTS_FOR_THREE="+("yes" if active<=294 and num<=14997 else "no"))
          print("ZM_BRIDGE_NATIVE_LAST_ID="+str(max_id))
          PY
      - name: Preserve changed LIVE store and update only existing private importer
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          scp -q -F "$d/config" scripts/zomorod_factory_store_import.py \
            zm-cpanel:".private/zomorod-business/.customer-importer-${GITHUB_RUN_ID}.py"
          ssh -T -F "$d/config" zm-cpanel bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          id="$1"
          test "$HOME" = /home/zomorod2
          dir="$HOME/.private/zomorod-business"
          live="$dir/site_store.php"
          db="$dir/site_store.sqlite3"
          importer="$dir/zomorod_factory_store_import.py"
          incoming="$dir/.customer-importer-$id.py"
          test -f "$live" && test ! -L "$live"
          test -f "$db" && test ! -L "$db"
          test -f "$incoming" && test ! -L "$incoming"
          test ! -L "$importer"
          before="$(sha256sum "$live" | cut -c1-64)"
          python3 -B - "$incoming" "$db" <<'PY'
          import ast,sqlite3,sys
          from pathlib import Path
          ast.parse(Path(sys.argv[1]).read_text(encoding="utf8"))
          with sqlite3.connect("file:"+sys.argv[2]+"?mode=ro",uri=True) as c:
              tables={row[0] for row in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {"products","payment_state"}.issubset(tables)
          PY
          back="$HOME/.backups/zomorod-site-factory-bridge/$id"
          install -d -m 700 "$back"
          if test -f "$importer" && test ! -e "$back/private-importer.before.py";then
            cp -p "$importer" "$back/private-importer.before.py"
            chmod 600 "$back/private-importer.before.py"
          fi
          chmod 600 "$incoming"
          mv -f "$incoming" "$importer"
          test "$(sha256sum "$live" | cut -c1-64)" = "$before"
          echo ZM_BRIDGE_LIVE_STORE_UNTOUCHED=verified
          echo ZM_BRIDGE_PRIVATE_IMPORTER_UPDATED=yes
          REMOTE
      - name: Install private consumer sidecar support into EXISTING SHA-verified site receiver
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          target=".saeit-factory-inbox/bin"
          scp -q -F "$d/config" scripts/store_receiver.py zm-cpanel:"$target/.receiver-customer-qa-${GITHUB_RUN_ID}.py"
          ssh -T -F "$d/config" zm-cpanel bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          rid="$1"
          target="$HOME/.saeit-factory-inbox/bin"
          old="$target/store_receiver.py"
          candidate="$target/.receiver-customer-qa-$rid.py"
          test "$HOME" = "/home/zomorod2"
          test -d "$target" && test ! -L "$target"
          test -f "$old" && test ! -L "$old"
          test -f "$candidate" && test ! -L "$candidate"
          python3 -B - "$old" "$candidate" <<'PY'
          import ast,sys
          for f in sys.argv[1:]:
              ast.parse(open(f,encoding="utf8").read())
          PY
          grep -Fq 'def validate_package(' "$candidate"
          grep -Fq 'def consumer_finalize(' "$candidate"
          backup="$HOME/.backups/zomorod-site-factory-bridge/$rid"
          install -d -m 700 "$backup"
          if test ! -e "$backup/store_receiver.before.py";then
            cp -p "$old" "$backup/store_receiver.before.py"
            chmod 600 "$backup/store_receiver.before.py"
          fi
          chmod 600 "$candidate"
          mv -f "$candidate" "$old"
          python3 -B - "$old" <<'PY'
          import importlib.util,sys
          path=sys.argv[1]
          spec=importlib.util.spec_from_file_location("zm_receiver",path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          assert callable(mod.consumer_status) and callable(mod.consumer_finalize)
          print("ZM_PRIVATE_CONSUMER_RECEIVER_VERIFY=PASS")
          PY
          echo ZM_EXISTING_RECEIVER_CONSUMER_SUPPORT=installed
          REMOTE
      - name: Deliver authentic warehouse QA goods and issue exactly three site production orders
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          timeout 230s ssh -T -F "$d/config" zm-vps bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          run="$1"
          private="$HOME/factory-runtime/private/autonomous-product-cycle"
          ops="$HOME/factory-runtime/operations"
          bridge="$ops/zomorod-site-bridge"
          exec 8>"$bridge/.zomorod-cycle.lock"
          flock -w 30 8
          python3 -B "$bridge/bridge.py" \
            --factory-private "$private" \
            --orders-engine "$ops/production-instructions/generate-orders.py" \
            --warehouse-module "$bridge/warehouse.py" \
            --sender-module "$bridge/sender.py" \
            --families "$bridge/families.json" \
            --ssh-key "$HOME/.ssh/saeit_factory_store_ed25519" \
            --known-hosts "$HOME/.ssh/saeit_factory_store_hosts" \
            --cycle "$(date -u +%F)-r$run" \
            --max-ship 3
          REMOTE
      - name: Import private goods into Zomorod store and verify no paid products fabricated
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          timeout 130s ssh -T -F "$d/config" zm-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          dir="$HOME/.private/zomorod-business"
          python3 -B "$dir/zomorod_factory_store_import.py" \
            --inbox "$HOME/.saeit-factory-inbox" \
            --store-db "$dir/site_store.sqlite3" --limit 20
          python3 - "$dir/site_store.sqlite3" <<'PY'
          import sqlite3,sys
          with sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True) as db:
              names={x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {"factory_drafts","products"}.issubset(names)
              n=db.execute("SELECT COUNT(*) FROM factory_drafts").fetchone()[0]
              bad=db.execute("SELECT COUNT(*) FROM factory_drafts WHERE public_enabled<>0 OR paid_price_irr IS NOT NULL").fetchone()[0]
              assert bad==0
              c=db.execute("SELECT COUNT(*) FROM factory_consumer_candidates").fetchone()[0]
              pending=db.execute("SELECT COUNT(*) FROM factory_consumer_candidates WHERE public_enabled<>0 OR paid_price_irr IS NOT NULL").fetchone()[0]
              assert pending==0
              print("ZM_BRIDGE_CONSUMER_PACKAGES_IN_PRIVATE_STORE="+str(c))
              print("ZM_BRIDGE_STORE_VERIFIED_DRAFTS="+str(n))
              print("ZM_BRIDGE_PUBLIC_PURCHASE_ACTIVATIONS=0")
          PY
          REMOTE
      - name: Verify three site requests and distinguish capacity-staged versus native orders
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zm-site-factory-bridge"
          ssh -T -F "$d/config" zm-vps python3 - "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import datetime,json,sys,re
          root=Path.home()/"factory-runtime/private/autonomous-product-cycle"
          area=root/"production-instructions"
          cycle=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")+"-r"+sys.argv[1]
          path=area/"zomorod-site-intake"/(cycle+".json")
          assert path.is_file() and not path.is_symlink(),"Intake receipt not found"
          data=json.loads(path.read_text(encoding="utf8"))
          assert data["schema"]=="saeit.zomorod.site-factory-intake.v1"
          assert data["site"]=="zomorodmelal.ir" and data["cycle"]==cycle
          assert data["public_distribution"] is False and data["is_native_order"] is False
          requests=data["requests"]
          assert len(requests)==3 and {r["slot"] for r in requests}=={1,2,3}
          ids=[r["request_id"] for r in requests]
          assert len(set(ids))==3 and all(re.fullmatch(r"ZMREQ-[0-9a-f]{20}",i) for i in ids)
          states={r["state"] for r in requests}
          assert states in ({"awaiting_native_capacity"},{"admitted"})
          print("ZM_BRIDGE_SITE_REQUESTS_VERIFIED=3")
          print("ZM_BRIDGE_SITE_REQUEST_IDS="+json.dumps(ids))
          if states=={"admitted"}:
              native=[r["native_work_order"] for r in requests]
              assert len(set(native))==3 and all(re.fullmatch(r"WO-[0-9]{8}",x) for x in native)
              for oid in native:
                  orderfile=area/"orders"/(oid+".json")
                  assert orderfile.is_file() and not orderfile.is_symlink()
                  order=json.loads(orderfile.read_text(encoding="utf8"))
                  assert order["requesting_site"]=="zomorodmelal.ir"
                  assert order["bridge_cycle"]==cycle
                  assert order["public_distribution_allowed"] is False
              print("ZM_BRIDGE_NATIVE_FACTORY_ORDERS_VERIFIED=3")
              print("ZM_BRIDGE_NATIVE_ORDER_IDS="+json.dumps(native))
          else:
              assert all(r["native_work_order"] is None for r in requests)
              print("ZM_BRIDGE_NATIVE_FACTORY_ORDERS_VERIFIED=0")
              print("ZM_BRIDGE_NATIVE_CAPACITY_WAITING=yes")
          PY
      - name: Remove only ephemeral GitHub runner SSH keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/zm-site-factory-bridge"
