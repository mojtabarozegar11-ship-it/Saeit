name: Controlled VPS transient archive cleanup
on:
  push:
    branches: [main]
    paths: [".github/workflows/vps-controlled-transient-cleanup-20261107.yml"]
permissions:
  contents: read
concurrency:
  group: vps-controlled-transient-cleanup-20261107
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare pinned VPS SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/vps-transient-cleanup"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          echo "PINNED_VPS=verified"
      - name: Remove only verified stale transient folders and old operation logs
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vps-transient-cleanup"
          timeout 420s ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known" -o ConnectTimeout=15 githubops@178.239.147.150 'python3 -' <<'PY'
          import fcntl, os, shutil, stat, subprocess, time
          from pathlib import Path
          root=Path.home()/"factory-runtime"
          ops=root/"operations"
          lock=ops/"master-agent"/"activation.lock"
          if root.is_symlink() or not root.is_dir() or ops.is_symlink() or not ops.is_dir():
              raise SystemExit("CLEANUP_ABORT_UNSAFE_ROOT")
          with lock.open("a+") as fh:
              fcntl.flock(fh,fcntl.LOCK_EX|fcntl.LOCK_NB)
              prefixes=(".qa1000-supply-",".stage4-due-",".primary-acquisition-",".stage4-readonly-",".factory-audit-")
              cutoff=time.time()-48*3600
              cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=8).stdout
              proc=subprocess.run(["ps","-u",str(os.getuid()),"-o","args="],capture_output=True,text=True,timeout=8).stdout
              candidates=[]
              for item in ops.iterdir():
                  try:
                      if not item.name.startswith(prefixes) or item.is_symlink() or not item.is_dir(): continue
                      s=item.stat()
                      if s.st_uid!=os.getuid() or s.st_mtime>=cutoff: continue
                      if item.name in cron or str(item) in cron or item.name in proc or str(item) in proc:
                          raise SystemExit("CLEANUP_ABORT_REFERENCED_TARGET="+item.name)
                      open_ref=False
                      for ent in Path("/proc").glob("[0-9]*"):
                          for fd in (ent/"fd").glob("*"):
                              try:
                                  if str(item) in os.readlink(fd): open_ref=True; break
                              except (OSError,FileNotFoundError): pass
                          if open_ref: break
                      if open_ref: raise SystemExit("CLEANUP_ABORT_OPEN_TARGET="+item.name)
                      candidates.append(item)
                  except (OSError,FileNotFoundError): pass
              removed_bytes=0
              for item in candidates:
                  size=int(subprocess.run(["du","-s","-B1","--",str(item)],capture_output=True,text=True,check=True).stdout.split()[0])
                  shutil.rmtree(item)
                  removed_bytes+=size
                  print("VPS_TRANSIENT_REMOVED="+item.name+":BYTES="+str(size),flush=True)
              old_logs=[]
              for item in ops.iterdir():
                  try:
                      s=item.lstat()
                      if s.st_uid==os.getuid() and stat.S_ISREG(s.st_mode) and item.name.endswith(".log") and s.st_mtime < time.time()-7*86400:
                          old_logs.append(item)
                  except (OSError,FileNotFoundError): pass
              old_log_bytes=0
              for item in old_logs:
                  s=item.stat()
                  if item.name in cron or item.name in proc: raise SystemExit("CLEANUP_ABORT_REFERENCED_LOG="+item.name)
                  item.unlink()
                  old_log_bytes+=s.st_size
                  print("VPS_OLD_LOG_REMOVED="+item.name+":BYTES="+str(s.st_size),flush=True)
              # One-time exact cleanup of two verified obsolete native-master snapshots.
              # Guarded by an on-host marker so later workflow edits cannot repeat deletion.
              native_marker = ops / ".native-master-retention-20261107.done"
              native_targets = [
                  ops / "backups" / "native-master-20261027T123903Z-72038",
                  ops / "backups" / "native-master-20261028T194214Z-622692",
              ]
              native_removed = []
              if not native_marker.exists():
                  source_suffixes = {".py",".sh",".yml",".yaml",".toml",".ini",".conf",".service"}
                  for target in native_targets:
                      if target.is_symlink() or not target.is_dir():
                          raise SystemExit("NATIVE_MASTER_ABORT_TARGET_MISSING_OR_UNSAFE="+str(target))
                      info = target.stat()
                      if info.st_uid != os.getuid() or info.st_mtime >= time.time()-7*86400:
                          raise SystemExit("NATIVE_MASTER_ABORT_AGE_OR_OWNER="+target.name)
                      if target.name in cron or str(target) in cron or target.name in proc or str(target) in proc:
                          raise SystemExit("NATIVE_MASTER_ABORT_REFERENCED="+target.name)
                      for ent in Path("/proc").glob("[0-9]*"):
                          for fd in (ent/"fd").glob("*"):
                              try:
                                  if str(target) in os.readlink(fd):
                                      raise SystemExit("NATIVE_MASTER_ABORT_OPEN="+target.name)
                              except (OSError,FileNotFoundError):
                                  pass
                      for base, dirs, names in os.walk(target, followlinks=False):
                          base_path = Path(base)
                          dirs[:] = [name for name in dirs if not (base_path/name).is_symlink()]
                          for name in names:
                              path = base_path/name
                              if path.is_symlink():
                                  raise SystemExit("NATIVE_MASTER_ABORT_SYMLINK="+str(path))
                              if path.suffix.lower() in source_suffixes:
                                  raise SystemExit("NATIVE_MASTER_ABORT_SOURCE_FILE="+str(path))
                      size = int(subprocess.run(["du","-s","-B1","--",str(target)],
                                                capture_output=True,text=True,check=True).stdout.split()[0])
                      shutil.rmtree(target)
                      native_removed.append({"name":target.name,"bytes":size})
                      print("VPS_NATIVE_MASTER_REMOVED="+target.name+":BYTES="+str(size),flush=True)
                  native_marker.write_text("verified exact native-master cleanup 2026-11-07\\n")
                  os.chmod(native_marker,0o600)
              else:
                  print("VPS_NATIVE_MASTER_ALREADY_APPLIED=1",flush=True)
              print("VPS_NATIVE_MASTER_REMOVED_COUNT="+str(len(native_removed)),flush=True)
              print("VPS_NATIVE_MASTER_REMOVED_BYTES="+str(sum(row["bytes"] for row in native_removed)),flush=True)
              print("VPS_TRANSIENT_REMOVED_COUNT="+str(len(candidates)),flush=True)
              print("VPS_TRANSIENT_REMOVED_BYTES="+str(removed_bytes),flush=True)
              print("VPS_OLD_LOG_REMOVED_BYTES="+str(old_log_bytes),flush=True)
              print("VPS_CLEANUP_NO_BACKUPS_DELETED=1",flush=True)
              print("VPS_CLEANUP_NO_CRON_CHANGED=1",flush=True)
              print("VPS_CLEANUP_NO_SERVICE_RESTART=1",flush=True)
              print("VPS_FREE_BYTES_AFTER="+str(os.statvfs(root).f_bavail*os.statvfs(root).f_frsize),flush=True)
          PY
      - name: Remove runner-only SSH files
        if: always()
        run: |
          d="$RUNNER_TEMP/vps-transient-cleanup"
          if test -d "$d"; then rm -rf -- "$d"; fi
