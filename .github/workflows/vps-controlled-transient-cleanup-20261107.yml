name: VPS controlled transient cleanup RETIRED — protected operations
# The former age-only log deletion removed an operations log referenced by
# factory monitoring. This workflow no longer accesses VPS or deletes files.
# The pre-retirement version remains available in Git commit history only.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-controlled-transient-cleanup-20261107.yml"
permissions:
  contents: read
jobs:
  deletion-retired:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce no destructive execution
        shell: bash
        run: |
          set -euo pipefail
          echo "AGE_BASED_VPS_LOG_DELETION=RETIRED"
          echo "VPS_REMOTE_CONNECTION=NOT_REQUESTED"
          echo "PRODUCTION_FILES_MODIFIED=FALSE"
          echo "VPS_CRON_OR_SERVICE_CHANGED=FALSE"
          echo "BACKUPS_MODIFIED=FALSE"
          echo "MANUAL_REVIEW_REQUIRED_FOR_FUTURE_CLEANUP=TRUE"
