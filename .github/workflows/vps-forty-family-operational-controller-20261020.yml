name: Activate evidence-gated operational controller for all forty factory families
on:
  push:
    branches: [main]
    paths: ["scripts/factory_six_specialist_executors.py", "tests/test_factory_six_specialist_executors.py", "scripts/factory_build50_native_media.py", "scripts/factory_native_media_review.py", "tests/test_factory_build50_native_media.py", "scripts/factory_build50_learning_4.py", "scripts/factory_learning_independent_review.py", "tests/test_factory_build50_learning_4.py", "scripts/factory_build50_creative_kits.py", "scripts/factory_creative_independent_review.py", "tests/test_factory_build50_creative_kits.py", ".github/workflows/vps-forty-family-operational-controller-20261020.yml", "scripts/factory_40_execution_controller.py", "tests/test_factory_40_execution_controller.py", "scripts/factory_build50_f31_planner.py", "scripts/factory_f31_independent_review.py", "tests/test_factory_build50_f31_planner.py", "deploy/install_factory_40_execution_controller.sh", "scripts/factory_batch5_build.py", "scripts/factory_batch5_specs.py", "scripts/factory_batch5_review.py", "tests/test_factory_batch5.py", "scripts/factory_product_planner.py", "scripts/factory_product_routes.py", "tests/test_factory_product_planner.py", "scripts/factory_build50_f18_webapps.py", "scripts/factory_f18_independent_review.py", "scripts/factory_capability_organizer.py", "tests/test_factory_f18_and_organizer.py"]
permissions: {contents: read}
concurrency:
  group: saeit-forty-family-operational-controller-activation
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install and stage pinned catalog QA dependencies
        run: |
          set -euo pipefail
          packages=(Pillow==11.3.0 openpyxl==3.1.5 python-docx==1.2.0 python-pptx==1.0.2 reportlab==4.4.3)
          python -m pip install "${packages[@]}"
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/factory-wheelhouse" "${packages[@]}"
      - name: Test honest 40-family admission, proof separation and safe script
        run: |
          set -euo pipefail
          bash -n deploy/install_factory_40_execution_controller.sh
          python3 -m py_compile scripts/factory_40_execution_controller.py
          python3 -m unittest discover -s tests -p 'test_factory_40_execution_controller.py' -v
          python3 -B -m unittest discover -s tests -p 'test_factory_six_specialist_executors.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build50_family_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build50_f31_planner.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_batch5.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_product_planner.py' -v
          python3 -m unittest discover -s tests -p '*f19*' -v
          python3 -m unittest discover -s tests -p '*f34*' -v
          python3 -m unittest discover -s tests -p '*workbook*' -v
          python3 -m unittest discover -s tests -p 'test_factory_f18_and_organizer.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build50_creative_kits.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build50_learning_4.py' -v
          python3 -m unittest discover -s tests -p 'test_factory_build50_native_media.py' -v
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/factory_40_execution_controller.py').read_text()
          assert 'pilotmod.toolchain(toolchain_manifest)' in p
          assert "'commercial_release_allowed':False" in p
          assert "'warehouse_promotion_enabled':False" in p
          assert "'store_publication_enabled':False" in p
          assert "subprocess.run(" in p
          print('FORTY_FAMILY_REAL_DISPATCH_ADMISSION_TEST=PASS')
          PY
      - name: Open host-key-verified SSH connection to existing private factory VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY"
          d="$RUNNER_TEMP/forty-proof-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace("\r\n","\n").replace("\r","").replace("\\n","\n").rstrip()+"\n",end="")' > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -P "" -f "$d/key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-factory-verified
            HostName 178.239.147.150
            User githubops
            IdentityFile $d/key
            UserKnownHostsFile $d/known
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 2
            ForwardAgent no
          EOF
          chmod 600 "$d/config"
          ssh -T -F "$d/config" saeit-factory-verified 'set -eu; test "$(id -un)" = githubops; test -x "$HOME/factory-runtime/.venv/bin/python"; test -s "$HOME/factory-runtime/operations/forty-family-master/forty_families.json"; test "$(crontab -l | grep -c SAEIT_FACTORY_EVERY_MINUTE_V1)" -eq 1; echo BUILD50_VPS_EXISTING_FACTORY_VERIFIED'
      - name: Stage complete pinned 40-family controller and exact required specialist tooling
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/forty-proof-ssh"
          folder="/home/githubops/factory-runtime/operations/.forty-control-release-$GITHUB_RUN_ID"
          ssh -T -F "$d/config" saeit-factory-verified "umask 077; test ! -e '$folder'; mkdir -m 700 '$folder'"
          ssh -T -F "$d/config" saeit-factory-verified "umask 077; mkdir -m 700 '$folder/wheelhouse'"
          files=(scripts/factory_six_specialist_executors.py scripts/factory_seven_missing_builders.py scripts/factory_40_execution_controller.py scripts/factory_40_family_master.py scripts/factory_build50_family_bridge.py scripts/factory_build_50.py scripts/factory_specialist_pilots.py scripts/factory_specialist_formats.py scripts/factory_build50_f31_planner.py scripts/factory_f31_independent_review.py scripts/factory_batch5_build.py scripts/factory_batch5_specs.py scripts/factory_batch5_review.py deploy/install_factory_40_execution_controller.sh scripts/factory_product_planner.py scripts/factory_product_routes.py scripts/factory_build50_f18_webapps.py scripts/factory_f18_independent_review.py scripts/factory_capability_organizer.py scripts/factory_build50_f19_web_template.py scripts/factory_f19_independent_web_review.py scripts/factory_build50_f34_icon_kit.py scripts/factory_f34_independent_icon_review.py scripts/factory_build50_workbook.py scripts/factory_build50_creative_kits.py scripts/factory_creative_independent_review.py scripts/factory_build50_learning_4.py scripts/factory_learning_independent_review.py scripts/factory_build50_native_media.py scripts/factory_native_media_review.py scripts/factory_build50_five_publications.py scripts/factory_five_publication_review.py scripts/factory_build50_next4_media.py scripts/factory_next4_review.py scripts/factory_build50_three_media.py scripts/factory_three_independent_review.py scripts/factory_build50_f15_game_assets.py scripts/factory_f15_independent_review.py scripts/factory_build50_f24_prompts.py scripts/factory_f24_prompt_review.py scripts/factory_build50_f35_cad.py scripts/factory_f35_cad_independent_review.py)
          # One bounded transfer replaces per-file SCP/SSH handshakes.
          tar -cf - --transform='s,.*/,,' "${files[@]}" | ssh -T -F "$d/config" saeit-factory-verified "umask 077; tar -xf - --no-same-owner --no-same-permissions -C '$folder'; chmod 600 '$folder'/*"
          tar -cf - -C "$RUNNER_TEMP/factory-wheelhouse" . | ssh -T -F "$d/config" saeit-factory-verified "umask 077; tar -xf - --no-same-owner --no-same-permissions -C '$folder/wheelhouse'; chmod 600 '$folder/wheelhouse'/*"
          manifest="$RUNNER_TEMP/forty-controller.sha256"
          : > "$manifest"
          for file in "${files[@]}";do
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$(basename "$file")" >> "$manifest"
          done
          while read -r hash name;do printf '%s  wheelhouse/%s\n' "$hash" "$name" >> "$manifest";done < <(cd "$RUNNER_TEMP/factory-wheelhouse" && sha256sum *)
          ssh -T -F "$d/config" saeit-factory-verified "cd '$folder'; sha256sum -c -" < "$manifest"
          echo FORTY_FAMILY_SOURCE_HASH_VERIFICATION=PASS
      - name: Activate real controller and pilot work on VPS for all registered families
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/forty-proof-ssh"
          folder="/home/githubops/factory-runtime/operations/.forty-control-release-$GITHUB_RUN_ID"
          timeout 1500s ssh -T -F "$d/config" saeit-factory-verified "bash '$folder/install_factory_40_execution_controller.sh' '$folder'"
      - name: Verify actual VPS per-family queue plus previous factory jobs and no commercial forgery
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/forty-proof-ssh"
          ssh -T -F "$d/config" saeit-factory-verified 'python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          h=Path.home()/'factory-runtime'
          p=h/'private/autonomous-product-cycle/production-family-management/forty-execution-dashboard.json'
          d=json.loads(p.read_text('utf8'))
          assert d['registered_families']==40 and len(d['families'])==40
          assert len({f['family_id'] for f in d['families']})==40
          assert d['commercial_release_enabled'] is False
          assert d['store_publication_enabled'] is False
          assert d['warehouse_promotion_enabled'] is False
          assert d['customer_orders_created']==0
          assert next(f for f in d['families'] if f['family_id']=='F31')['completed_50_stage_products']>=1
          for fid in ('F18','F20','F21','F22','F25','F28','F29','F30','F33','F06','F07','F10','F11','F36','F37','F39'):
              assert next(f for f in d['families'] if f['family_id']==fid)['completed_50_stage_products']>=1
          assert d['pilot_tick_result']['status'] in ('pilot_built','technical_pilots_verified'), 'pilot dispatch is unhealthy'
          cron=subprocess.check_output(['crontab','-l'],text=True)
          for marker in ('SAEIT_FACTORY_EVERY_MINUTE_V1','SAEIT_FACTORY_LIFECYCLE_12_V1',
            'SAEIT_FACTORY_FORTY_FAMILY_MASTER_V1','SAEIT_FACTORY_BUILD50_FORTY_FAMILY_BRIDGE_V1',
            'SAEIT_FACTORY_FORTY_FAMILY_OPERATIONAL_DISPATCH_V1'):
              assert cron.count(marker)==1,marker
          print('FORTY_REAL_FAMILY_QUEUE_VERIFIED='+str(d['counts']['registered']))
          print('FORTY_FULL_VERIFIED_EXECUTORS='+str(d['counts']['families_with_real_50_stage_products']))
          six=json.loads((h/'private/autonomous-product-cycle/quality-excellence/six-agent-supervisor/last-execution.json').read_text('utf8'))
          assert six['schema']=='saeit.factory.six-specialist-executors.v1'
          assert len(six['registered_workers'])==6
          assert set(six['registered_workers'])=={'F12','F13','F14','F16','F17','F26'}
          assert six['technical_candidates_rechecked']==6
          assert all(x['agent_executed'] and x['technical_candidate_hash_verified'] for x in six['outcomes'])
          assert six['native_50_stage_executors_certified']==0
          assert six['independent_quality_1000_certified']==0
          assert not six['public_release_authorized'] and six['sites_modified']==0
          print('SIX_FACTORY_SPECIALIST_EXECUTORS_PRIVATE_CANDIDATES=6')
          print('SIX_FACTORY_NATIVE_50_STAGE_PROVEN=0')
          print('FORTY_REAL_PRIVATE_PILOT_WORK='+json.dumps(d['pilot_tick_result'],sort_keys=True))
          print('FORTY_OPERATIONAL_CRON_ACTIVE=PASS')
          print('FORTY_NO_FALSE_SELLABLE_PRODUCTS=PASS')
          planner=json.loads((h/'private/autonomous-product-cycle/product-planning/dashboard.json').read_text('utf8'))
          assert planner['registered_family_routes']==40
          assert planner['unique_product_plans']>=40
          assert planner['custom_product_executors_verified']==0
          assert planner['verified_native_product_plans']>=9
          assert not planner['commercial_release']
          assert len(planner['families_awaiting_specialist_executor'])==0
          organized=json.loads((h/'private/autonomous-product-cycle/capability-organization/dashboard.json').read_text())
          assert organized['family_count']==40 and organized['native_recipe_families']>=10
          assert (organized['support_tool_bindings_available'],organized['unique_support_operations']) in ((1000,25),(3000,75))
          assert organized['real_family_support_invocations_this_cycle']==200
          assert organized['legacy']['matching_modules']==77
          assert len(organized['legacy']['robot_roles'])==11
          assert not organized['commercial_release'] and not organized['sites_modified']
          print('ORGANIZED_77_MODULES_AND_11_ROBOT_SOURCE_ROLES=PASS')
          print('ORGANIZED_40_FAMILY_BUILDER_DISCOVERY=PASS')
          print('ORGANIZED_REAL_SUPPORT_TOOL_EXECUTIONS=200')
          print('ORGANIZED_NATIVE_PRODUCT_FAMILIES='+str(organized['native_recipe_families']))
          print('ORGANIZED_BUILDER_MISSING_DEPENDENCIES='+json.dumps({f['family_id']:f['missing_engines'] for f in organized['families'] if f['missing_engines']}))
          print('PER_PRODUCT_ALL_FORTY_ROUTES=PASS')
          print('PER_PRODUCT_NATIVE_VERIFIED='+str(planner['verified_native_product_plans']))
          print('PER_PRODUCT_PLANS='+str(planner['unique_product_plans']))
          print('PER_PRODUCT_LEGACY_ORDERS_SCANNED='+str(planner['existing_orders_scanned']))
          print('PER_PRODUCT_RESOURCE_HOLDS='+json.dumps(planner['resource_holds']))
          print('PER_PRODUCT_QUALIFICATION_REQUEST='+json.dumps(next(r for r in planner['rows'] if r['request'].get('parameters',{}).get('week')==json.loads((h/'private/autonomous-product-cycle/product-planning/intake/qualification-next-week.json').read_text())['parameters']['week'])['status']))
          PY
