name: Protect current Zomorod theme and remove verified obsolete theme archives

on:
  push:
    branches: [restore-zomorod-pre-seo-20261107]
    paths: [.github/workflows/zomorod-guarded-purge-obsolete-theme-20261107.yml]

permissions:
  contents: read

concurrency:
  group: zomorod-guarded-obsolete-theme-purge
  cancel-in-progress: false

jobs:
  purge:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.actor == 'mojtabarozegar11-ship-it'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate pinned cPanel via existing SSH relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zm-obsolete-theme-cleanup"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P '' -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P '' -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.known"
          test "$(ssh-keygen -lf "$d/host.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'

      - name: Save exact current template snapshot then purge only five inventoried legacy bundles
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s ssh -T -F "$RUNNER_TEMP/zm-obsolete-theme-cleanup/config" saeit-cpanel "python3 - '$GITHUB_RUN_ID'" <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,stat,tarfile,tempfile,time
          runid=__import__('sys').argv[1]
          assert re.fullmatch(r'[0-9]{5,20}',runid)
          home=Path('/home/zomorod2');web=home/'public_html';backups=home/'.backups';private=home/'.private'
          assert os.geteuid()!=0 and os.geteuid()==web.stat().st_uid
          assert web.is_dir() and backups.is_dir() and private.is_dir()
          assert not any(p.is_symlink() for p in (web,backups,private))
          sha=lambda data:hashlib.sha256(data).hexdigest()
          current={
              'index.html':'0c8a0a26780645281da8d19cbc9e5926886922dcd37d56d0a06952a627a76585',
              'about/index.html':'cd980f1497190cd86ec9fd09e4794a699563894c529358fef39d63810e3ef107',
              'company/index.html':'75e9c3cb8387494fc25a67b5561af1853a478fbaca96d73e96a7a48ae0cd5281',
              'services/index.html':'189997166683646b29743a8f328cbc822c5ffeb68732f12cf999fecff0fcdcc0',
              'industry/index.html':'aa71ad70e6d01066800bf63cd8ea791dddebbbbcc07df13aae0aaa054889c039',
              'research/index.html':'e53fea2b0d7f1dc82c19b09fd246aef9107cbae7b812ab17e1c69c87f79b0ef7',
              'knowledge/index.html':'b489d29011e38c3a7bdf52340b8bedd75fbdb824eee7c83d2b8f47924aba5856',
              'agriculture/index.html':'d842c74262d254b1bae8ec89ba43fca11aada52da85871cf93f7a8234102af59',
              'contact/index.html':'c84d8040cf6b0b9cfdd2b778338b6377c19630a0b482c04e34dc0947ae5978bf',
          }
          assets=('static/site/zomorod-v7/inner-v7.css','static/site/zomorod-v10/inner-v10.css','assets/zm-nova-detail-v1.css','agriculture/assets/zm-nova-agriculture-v1.css','agriculture/assets/zm-agritech-luxe-v3.css')
          def protect():
              for rel,digest in current.items():
                  p=web/rel
                  assert p.is_file() and not p.is_symlink() and sha(p.read_bytes())==digest,('CURRENT_THEME_CHANGED_ABORT',rel)
              for rel in assets:
                  p=web/rel
                  assert p.is_file() and not p.is_symlink() and p.stat().st_size>100,('ACTIVE_CSS_MISSING_ABORT',rel)
          protect()
          exact={
              'zomorod-v7-unify':(16,2332339),
              'zomorod-v7-static-rescue':(10,66361),
              'zomorod-v9-real-pages':(7,6363239),
              'zomorod-v10-content-restore':(66,1635027),
              'zomorod-nova-six-pages':(14,136442),
          }
          def inventory(root):
              count=size=0
              for path,dirs,files in os.walk(root,followlinks=False):
                  for d in dirs:
                      q=Path(path)/d
                      assert not q.is_symlink(),('SYMLINK_DIR_ABORT',str(q))
                  for name in files:
                      q=Path(path)/name;st=q.lstat()
                      assert stat.S_ISREG(st.st_mode) and st.st_dev==backups.stat().st_dev,('NONREGULAR_FILE_ABORT',str(q))
                      count+=1;size+=st.st_size
              return count,size
          for name,spec in exact.items():
              root=backups/name
              assert root.is_dir() and not root.is_symlink() and root.parent==backups
              assert inventory(root)==spec,('ARCHIVE_INVENTORY_CHANGED_ABORT',name,inventory(root),spec)
          assert shutil.disk_usage(str(home)).free>100*1024*1024,'NO_SPACE_FOR_CURRENT_THEME_SNAPSHOT'
          required=[]
          for rel in tuple(current)+assets:
              required.append((rel,web/rel))
          roots=('research','agriculture','topics','company','about','services','industry','knowledge','contact','agents','blog','economy','market','weather','news','apps','business','studio')
          for slug in roots:
              d=web/slug
              if not d.is_dir() or d.is_symlink():continue
              for file in d.rglob('*.html'):
                  if file.is_file() and not file.is_symlink():required.append((str(file.relative_to(web)),file))
          unique={rel:p for rel,p in required}
          assert len(unique)<1500
          total=sum(p.stat().st_size for p in unique.values())
          assert total<35*1024*1024,('UNEXPECTED_CURRENT_THEME_SIZE',total)
          directory=private/'zm-current-theme-snapshot-20261107'
          directory.mkdir(mode=0o700,exist_ok=True)
          assert not directory.is_symlink()
          final=directory/runid
          assert not final.exists()
          staged=Path(tempfile.mkdtemp(prefix='.current-theme-',dir=directory))
          manifest={rel:{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for rel,p in sorted(unique.items())}
          try:
              archive=staged/'current-theme.tar.gz'
              with tarfile.open(archive,'w:gz') as tar:
                  for rel,p in sorted(unique.items()):
                      assert p.is_file() and not p.is_symlink()
                      assert sha(p.read_bytes())==manifest[rel]['sha256']
                      tar.add(p,arcname=rel,recursive=False)
              with tarfile.open(archive,'r:gz') as tar:
                  members=tar.getmembers()
                  assert len(members)==len(unique) and all(m.isfile() for m in members)
                  for m in members:
                      assert m.name in manifest and sha(tar.extractfile(m).read())==manifest[m.name]['sha256']
              (staged/'manifest.json').write_text(json.dumps({'run_id':runid,'source':'current-live-theme','files':manifest,'protected_core':current,'preserved_css':assets},ensure_ascii=False,sort_keys=True,indent=2),encoding='utf-8')
              (staged/'archive.sha256').write_text(sha(archive.read_bytes())+'  current-theme.tar.gz\n',encoding='utf-8')
              protect()
              assert all(inventory(backups/name)==spec for name,spec in exact.items())
              os.rename(staged,final)
          except BaseException:
              if staged.exists():shutil.rmtree(staged)
              raise
          print('VERIFIED_CURRENT_THEME_SNAPSHOT',str(final.relative_to(home)),'files',len(unique),'bytes_uncompressed',total,'archive_sha256',sha((final/'current-theme.tar.gz').read_bytes()),flush=True)
          staging_root=private/'zm-obsolete-theme-purge-staging-20261107'
          staging_root.mkdir(mode=0o700,exist_ok=True)
          assert not staging_root.is_symlink()
          staged_old=staging_root/runid
          staged_old.mkdir(mode=0o700)
          moved=[]
          try:
              protect()
              for name,spec in exact.items():
                  src=backups/name;dst=staged_old/name
                  assert inventory(src)==spec
                  os.rename(src,dst)
                  moved.append((src,dst))
              protect()
          except BaseException:
              for src,dst in reversed(moved):
                  if dst.exists() and not src.exists():os.rename(dst,src)
              raise
          removed=0
          for name,spec in exact.items():
              target=staged_old/name
              assert target.parent==staged_old and inventory(target)==spec
              shutil.rmtree(target)
              removed+=spec[1]
              print('PERMANENTLY_REMOVED_OLD_THEME_ARCHIVE',name,'bytes',spec[1],flush=True)
          staged_old.rmdir()
          protect()
          assert all(not (backups/name).exists() for name in exact)
          assert (final/'current-theme.tar.gz').is_file()
          print('GUARDED_LEGACY_TEMPLATE_CLEANUP_COMPLETE','removed_bundles',len(exact),'removed_bytes',removed,'current_theme_protected_yes',flush=True)
          print('MIXED_ARCHIVES_UNTOUCHED=zomorod-v11,zomorod-v12-contact,zomorod-live-inpage',flush=True)
          PY

      - name: Erase ephemeral runner SSH identities
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/zm-obsolete-theme-cleanup"
