name: MojPlayWin TRX trial 779 secure buyer button isolated live template patch
on:
  push:
    branches: [main]
    paths: [".github/workflows/mpw-trial-779-checkout-button-live-20261020.yml"]
permissions: {contents: read}
concurrency:
  group: mpw-isolated-trial-779-checkout-button
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify one template edit and local rollback assertions
        run: |
          python3 -m py_compile scripts/mpw_trial_779_checkout_cta_20261020.py
          python3 scripts/mpw_trial_779_checkout_cta_20261020.py selftest
      - name: Establish pinned VPS relay to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/mpw-revenue-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Guard actual MojPlayWin product template with Django compilation
        run: |
          set -euo pipefail
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - preview" < scripts/mpw_trial_779_checkout_cta_20261020.py
      - name: Patch only MojPlayWin main product template after sealed backup
        id: publish
        run: |
          set -euo pipefail
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - publish" < scripts/mpw_trial_779_checkout_cta_20261020.py
      - name: Verify trial-only CTA rendered on live Django code
        run: |
          set -euo pipefail
          timeout 95s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - verify" < scripts/mpw_trial_779_checkout_cta_20261020.py
      - name: Observe public trial buyer button and preserve siblings
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          base='https://mojplaywin.com'
          routes=['/','/store/','/store/product/779/','/taniya/','/farnaz/','/saman/','/picm/','/zahra/']
          for route in routes:
              req=urllib.request.Request(base+route,headers={'Cache-Control':'no-cache','User-Agent':'MPWTrialCTA/1'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:status=r.status;body=r.read(160000).decode('utf8','replace')
              except urllib.error.HTTPError as e:status=e.code;body=''
              visible='/commerce/book/779/' in body if route=='/store/product/779/' else None
              print('MPW_MICRO_CTA_PUBLIC='+json.dumps({'route':route,'status':status,'trial_buy_link_visible':visible}))
              if status!=200 and not (route=='/zahra/' and status==404):
                  raise RuntimeError('Unexpected protected route state: '+route)
          PY
      - name: Roll back exact unsafely released template on job failure
        if: failure() && steps.publish.outcome == 'success'
        run: |
          timeout 80s ssh -T -F "$RUNNER_TEMP/mpw-revenue-ssh/config" saeit-cpanel "/home/zomorod2/virtualenv/Saeit-staging/3.11/bin/python - rollback" < scripts/mpw_trial_779_checkout_cta_20261020.py
      - name: Delete temporary SSH secrets
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mpw-revenue-ssh"

# Retry after corrected strict CTA selftest (2026-10-20)
