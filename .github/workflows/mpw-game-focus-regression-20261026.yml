name: Game focus-loss input regression (non-deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'games/ramadan-war/game.js'
      - 'games/ramadan-war/site-smoke.cjs'
      - 'games/crown-defender/index.html'
      - 'tests/game/crown-v120.cjs'
      - 'templates/studio_raha/index.html'
      - 'templates/taniya_studio/index.html'
      - 'tests/game/studio-active-game-regressions.cjs'
      - 'site_releases/mojplaywin/games-20261021/beacon-labyrinth/index.html'
      - 'site_releases/mojplaywin/games-20261021/nebula-salvage/index.html'
      - 'tests/game/mpw-five-beta-mechanics-regressions.cjs'
      - 'scripts/game_candidate_packager.py'
      - '.github/workflows/mpw-game-focus-regression-20261026.yml'
permissions:
  contents: read
jobs:
  focus-loss-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse both games and execute Crown Defender runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check games/ramadan-war/game.js
          node --check games/ramadan-war/site-smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          src=Path('games/crown-defender/index.html').read_text('utf-8')
          assert src.count('<script>') == 1
          Path('/tmp/crown-focus-regression.js').write_text(src.split('<script>',1)[1].split('</script>',1)[0], 'utf-8')
          PY
          node --check /tmp/crown-focus-regression.js
          node tests/game/crown-v120.cjs
          python3 - <<'PY'
          from pathlib import Path
          for label,path in [('raha','templates/studio_raha/index.html'),('taniya','templates/taniya_studio/index.html')]:
              src=Path(path).read_text('utf-8')
              assert src.count('<script>') == 1, path
              Path('/tmp/'+label+'-active-game.js').write_text(src.split('<script>',1)[1].split('</script>',1)[0], 'utf-8')
          PY
          node --check /tmp/raha-active-game.js
          node --check /tmp/taniya-active-game.js
          node tests/game/studio-active-game-regressions.cjs
          python3 - <<'PY'
          from pathlib import Path
          for name in ('beacon-labyrinth','nebula-salvage'):
              src=Path('site_releases/mojplaywin/games-20261021/'+name+'/index.html').read_text('utf-8')
              Path('/tmp/'+name+'-beta.js').write_text(src.rsplit('<script>',1)[1].split('</script>',1)[0], 'utf-8')
          PY
          node --check /tmp/beacon-labyrinth-beta.js
          node --check /tmp/nebula-salvage-beta.js
          node tests/game/mpw-five-beta-mechanics-regressions.cjs
          echo 'GAME_FOCUS_LOSS_REGRESSION=PASS'
      - name: Package and verify deterministic source-only candidate
        run: |
          set -euo pipefail
          python3 scripts/game_candidate_packager.py build "$RUNNER_TEMP/game-source-candidate.zip"
          python3 scripts/game_candidate_packager.py verify "$RUNNER_TEMP/game-source-candidate.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: game-source-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/game-source-candidate.zip
          retention-days: 7
          if-no-files-found: error
