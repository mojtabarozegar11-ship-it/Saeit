name: Read live Django database configuration
on:
  push:
    branches:
      - codex/zomorod-runtime-repair-20261016
    paths:
      - ".github/workflows/zomorod-live-db-config-v2.yml"
permissions:
  contents: read
concurrency:
  group: zomorod-live-db-config-v2
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned cPanel relay
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/zomorod-live-db-v2"; install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d"/*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          scan="$(ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' 2>/dev/null)"
          test -n "$scan"
          printf '%s\n' "$scan" > "$d/host.candidate"
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          cp "$d/host.candidate" "$d/host.known"
          echo "PINNED_CPANEL_RELAY=verified"
      - name: Read database target
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zomorod-live-db-v2"
          ssh -F "$d/config" saeit-cpanel bash -se <<'REMOTE'
          set -euo pipefail
          app=/home/zomorod2/Saeit
          py=/home/zomorod2/virtualenv/Saeit/3.10/bin/python
          packages=/home/zomorod2/.backups/zomorodmelal-complete/packages-preflight-47c38ec3810326790f6f954b515b4f11d59042d1
          test -f "$app/manage.py" && test -d "$packages" && test -x "$py"
          echo "LIVE_PROJECT_FILES_BEGIN"
          find "$app" -maxdepth 3 -type f \( -path '*/settings.py' -o -name 'manage.py' -o -name 'passenger_wsgi.py' \) -printf '%P\n' | sort | head -40
          echo "LIVE_PROJECT_FILES_END"
          cd "$app"
          export PYTHONPATH="$packages:$app"
          "$py" - <<'PY'
          import json, os, pathlib, re
          app=pathlib.Path("/home/zomorod2/Saeit")
          source=(app/"manage.py").read_text(errors="replace")
          match=re.search(r"DJANGO_SETTINGS_MODULE\s*=\s*['\"]([^'\"]+)['\"]",source)
          print("LIVE_SETTINGS_MODULE="+(match.group(1) if match else "unresolved"))
          os.environ.setdefault("DJANGO_SETTINGS_MODULE",match.group(1) if match else "config.settings")
          from django.conf import settings
          db=settings.DATABASES["default"]
          print("LIVE_DB_BACKEND="+db["ENGINE"].split(".")[-1])
          if db["ENGINE"].endswith("sqlite3"):
              p=pathlib.Path(db["NAME"]).resolve()
              print("LIVE_DB_PATH="+str(p))
              print("LIVE_DB_EXISTS="+str(p.is_file()).lower())
              print("LIVE_DB_BYTES="+str(p.stat().st_size if p.is_file() else 0))
              manifest=pathlib.Path("/home/zomorod2/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b/database-manifest.json")
              data=json.loads(manifest.read_text())
              exact=[r for r in data.get("databases",[]) if (app/r["path"]).resolve()==p]
              print("LIVE_DB_EXACT_SNAPSHOTS="+str(len(exact)))
              if exact:
                  snap=pathlib.Path("/home/zomorod2/.backups/zomorodmelal-complete/9fcadc9ea749075785829565e57770f5cc173a8b/database")/exact[0]["snapshot"]
                  print("LIVE_DB_SNAPSHOT_VERIFIED="+str(snap.is_file()).lower())
          env=app/".env"
          print("LIVE_DATABASE_URL_PRESENT="+str(any(x.strip().startswith("DATABASE_URL=") for x in env.read_text(errors="replace").splitlines()) if env.is_file() else False).lower())
          PY
          python3 - <<'PY'
          import glob,os
          matched=[]
          for filename in glob.glob("/proc/[0-9]*/environ"):
              try:
                  raw=open(filename,"rb").read().split(b"\\0")
                  env={}
                  for item in raw:
                      if b"=" in item:
                          k,v=item.split(b"=",1); env[k.decode(errors="ignore")]=v.decode(errors="replace")
                  cmd=open(filename.replace("environ","cmdline"),"rb").read().replace(b"\\0",b" ").decode(errors="replace").lower()
                  if "passenger" not in cmd and "lswsgi" not in cmd and "/saeit" not in cmd: continue
                  setting=env.get("DJANGO_SETTINGS_MODULE","")
                  db=env.get("DATABASE_URL","")
                  scheme=db.split(":",1)[0] if ":" in db else ""
                  path=db.split("/",3)[-1].split("?",1)[0] if db else ""
                  matched.append((setting,scheme,path.rsplit("/",1)[-1]))
              except (OSError,PermissionError): pass
          print("PASSENGER_WORKER_ENV_MATCHES="+str(len(matched)))
          print("PASSENGER_WORKER_DJANGO_SETTINGS="+",".join(sorted({x[0] for x in matched if x[0]})) or "unset")
          print("PASSENGER_WORKER_DATABASE_URL_PRESENT="+str(any(x[1] for x in matched)).lower())
          print("PASSENGER_WORKER_DATABASE_SCHEMES="+(",".join(sorted({x[1] for x in matched if x[1]})) or "unset"))
          print("PASSENGER_WORKER_DATABASE_BASENAMES="+(",".join(sorted({x[2] for x in matched if x[2]})) or "unset"))
          PY
          echo "LIVE_TOPLEVEL_DB_FILES_BEGIN"
          find "$app" -maxdepth 2 -type f \( -name '*.sqlite3' -o -name '*.sqlite' -o -name '*.db' \) -printf '%P %s bytes\n' | sort
          echo "LIVE_TOPLEVEL_DB_FILES_END"
          python3 - <<'PY'
          import pathlib,re,subprocess
          bases=[pathlib.Path("/home/zomorod2/logs"),pathlib.Path("/home/zomorod2/Saeit"),pathlib.Path("/home/zomorod2/public_html")]
          files=[]
          for base in bases:
              if base.exists():
                  try:
                      for p in base.rglob("*"):
                          if p.is_file() and (p.name=="error_log" or p.suffix==".log" or "passenger" in p.name.lower()) and p.stat().st_mtime>__import__("time").time()-3600 and p.stat().st_size<20_000_000:
                              files.append(p)
                  except (OSError,PermissionError): pass
          unique=sorted(set(files),key=lambda p:p.stat().st_mtime,reverse=True)
          print("RECENT_ERROR_LOGS="+str(len(unique)))
          secret=re.compile(r"(?i)(secret[_ -]?key|password|token|api[_ -]?key|private[_ -]?key)(\\s*[:=]\\s*)[^\\s,;]+")
          urlpass=re.compile(r"(://[^/\\s:@]+:)[^/@\\s]+@")
          marker=re.compile(r"traceback|exception|error|failed|no module|importerror|runtimeerror|operationalerror|disallowedhost|staticfiles manifest|django|passenger",re.I)
          for p in unique[:4]:
              print("ERROR_LOG_FILE="+str(p))
              try: lines=p.read_text(errors="replace").splitlines()[-800:]
              except OSError: continue
              hits=[i for i,line in enumerate(lines) if marker.search(line)]
              for i in hits[-8:]:
                  for line in lines[max(0,i-2):min(len(lines),i+2)]:
                      line=secret.sub(r"\\1\\2[redacted]",line)
                      line=urlpass.sub(r"\\1[redacted]@",line)
                      print("ERROR_LOG_CONTEXT="+line[:500])
          PY
          echo "PASSENGER_STDERR_TAIL_BEGIN"
          if test -f /home/zomorod2/Saeit/stderr.log; then
            tail -n 70 /home/zomorod2/Saeit/stderr.log | python3 -c 'import re,sys; s1=re.compile(r"(?i)(secret[_ -]?key|password|token|api[_ -]?key|private[_ -]?key)(\\s*[:=]\\s*)[^\\s,;]+"); s2=re.compile(r"(://[^/\\s:@]+:)[^/@\\s]+@"); [print(s2.sub(r"\\1[redacted]@",s1.sub(r"\\1\\2[redacted]",line.rstrip()))[:500]) for line in sys.stdin]'
          fi
          echo "PASSENGER_STDERR_TAIL_END"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/zomorod-live-db-v2"
