name: MOJ1 VPS read-only TVM capacity preflight
on:
  push:
    branches: ['moj1/shasta-pilot-20261021']
    paths:
      - '.github/workflows/moj1-vps-readonly-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vps-capacity:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/moj1/shasta-pilot-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only VPS Docker and spare-capacity checks
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
            echo 'MOJ1_VPS_SSH=UNAVAILABLE'
            exit 1
          fi
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/moj1_vps_key"
          ssh-keyscan -T 10 -t rsa 178.239.147.150 2>/dev/null > "$RUNNER_TEMP/moj1_known_hosts"
          expected='SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          ssh-keygen -lf "$RUNNER_TEMP/moj1_known_hosts" -E sha256 | grep -Fq "$expected"
          timeout 65s ssh \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/moj1_known_hosts" \
            -i "$RUNNER_TEMP/moj1_vps_key" \
            githubops@178.239.147.150 'bash -s' <<'REMOTE'
          set -u
          printf 'MOJ1_VPS_USER='; id -un
          printf 'MOJ1_VPS_OS='; uname -s
          printf 'MOJ1_VPS_CORES='; getconf _NPROCESSORS_ONLN 2>/dev/null || true
          if command -v free >/dev/null; then free -m | awk '/^Mem:/{print "MOJ1_VPS_RAM_AVAILABLE_MB="$7}'; fi
          if command -v df >/dev/null; then df -Pm . | awk 'NR==2{print "MOJ1_VPS_CWD_DISK_AVAILABLE_MB="$4}'; fi
          for cmd in docker podman node npm timeout curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf 'MOJ1_VPS_COMMAND_%s=AVAILABLE\n' "$cmd"
            else
              printf 'MOJ1_VPS_COMMAND_%s=ABSENT\n' "$cmd"
            fi
          done
          if command -v docker >/dev/null 2>&1; then
            if docker info --format '{{.ServerVersion}}' >/dev/null 2>&1; then
              echo 'MOJ1_VPS_DOCKER_DAEMON_ACCESS=PASS'
            else
              echo 'MOJ1_VPS_DOCKER_DAEMON_ACCESS=DENIED_OR_UNAVAILABLE'
            fi
          fi
          if command -v ss >/dev/null 2>&1; then
            if ss -ltn | awk 'NR>1{print $4}' | grep -Eq ':9090$'; then
              echo 'MOJ1_VPS_PORT_9090=BUSY'
            else
              echo 'MOJ1_VPS_PORT_9090=FREE'
            fi
          else
            echo 'MOJ1_VPS_PORT_9090=UNVERIFIED'
          fi
          # A public Shasta RPC reachability probe from the *remote VPS*.
          # It is read-only and deliberately never references wallet material.
          if command -v curl >/dev/null 2>&1; then
            shasta_reply="$(curl --fail --silent --show-error --max-time 20 'https://api.shasta.trongrid.io/walletsolidity/getnowblock' 2>/dev/null)" || shasta_reply=''
            case "$shasta_reply" in
              *'"blockID"'*) echo 'MOJ1_VPS_TO_SHASTA_SOLIDIFIED_RPC=REACHABLE' ;;
              *) echo 'MOJ1_VPS_TO_SHASTA_SOLIDIFIED_RPC=UNAVAILABLE' ;;
            esac
          else
            echo 'MOJ1_VPS_TO_SHASTA_SOLIDIFIED_RPC=UNAVAILABLE'
          fi
          # Name-only existence inventory of previously created Shasta/MOJ1
          # facilities. Do not open, print, copy, or transmit any wallet contents.
          test_roots=''
          for d in /home/githubops /srv /opt /var/lib /home/zomorod2; do
            if [ -d "$d" ] && [ -r "$d" ]; then test_roots="$test_roots $d"; fi
          done
          if [ -n "$test_roots" ]; then
            candidate_files="$(find $test_roots -xdev -maxdepth 5 -type f \
              \( -iname '*shasta*' -o -iname '*moj1*' -o -iname '*tron*wallet*' \) \
              -print 2>/dev/null | wc -l || true)"
            candidate_dirs="$(find $test_roots -xdev -maxdepth 5 -type d \
              \( -iname '*shasta*' -o -iname '*moj1*' \) \
              -print 2>/dev/null | wc -l || true)"
            printf 'MOJ1_VPS_NAME_ONLY_CANDIDATE_FILES=%s\n' "$candidate_files"
            printf 'MOJ1_VPS_NAME_ONLY_CANDIDATE_DIRS=%s\n' "$candidate_dirs"
          else
            echo 'MOJ1_VPS_NAME_ONLY_INVENTORY=NO_ACCESSIBLE_ROOTS'
          fi
          for c in python3 openssl; do
            if command -v "$c" >/dev/null 2>&1; then
              printf 'MOJ1_VPS_TOOL_%s=AVAILABLE\n' "$c"
            else
              printf 'MOJ1_VPS_TOOL_%s=ABSENT\n' "$c"
            fi
          done
          if [ -w "$HOME" ]; then echo 'MOJ1_TEST_WALLET_PRIVATE_STORAGE=WRITABLE_HOME'; else echo 'MOJ1_TEST_WALLET_PRIVATE_STORAGE=UNAVAILABLE'; fi
          if command -v python3 >/dev/null 2>&1; then
            python3 -c 'import importlib.util; print("MOJ1_VPS_PY_CRYPTOGRAPHY=" + ("AVAILABLE" if importlib.util.find_spec("cryptography") else "ABSENT")); print("MOJ1_VPS_PY_PYCRYPTODOME=" + ("AVAILABLE" if importlib.util.find_spec("Crypto") else "ABSENT")); print("MOJ1_VPS_PY_TRONPY=" + ("AVAILABLE" if importlib.util.find_spec("tronpy") else "ABSENT"))'
          fi
          echo 'MOJ1_VPS_TEST_WALLET=NOT_ACCESSED'
          echo 'MOJ1_VPS_BROADCAST=NONE'
          echo 'MOJ1_VPS_PREFLIGHT_MODE=READ_ONLY'
          REMOTE
