name: MojPlayWin unify 18 free tools and learning page shells

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mpw-learning-tools-shell-20261026.yml
      - scripts/mpw_learning_tools_shell_20261026.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpw-only-free-tools-learning-shell
  cancel-in-progress: false

jobs:
  publish-free-resource-navigation:
    if: github.repository == 'mojtabarozegar11-ship-it/Saeit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate script and verify public 18-resource baseline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mpw_learning_tools_shell_20261026.py
          python3 scripts/mpw_learning_tools_shell_20261026.py selftest
          python3 - <<'PY'
          import concurrent.futures,urllib.request
          roots=['/mpw-free-tools/20261025/']+[
              '/mpw-free-tools/20261025/'+s+'/' for s in
              ('chess-calendar','taniya-storytime','atelier-seo','atelier-contrast',
               'browser-game-qa','research-evidence')]
          roots+=['/mpw-learning/20261025/']+[
              '/mpw-learning/20261025/'+s+'/' for s in
              ('chess-baseline','family-storytime','website-client-brief','research-methods')]
          roots+=['/mpw-learning/20261025b/'+s+'/' for s in
                  ('chess-error-review','taniya-creative-retelling',
                   'atelier-accessibility-acceptance','browser-game-retention-diagnostics',
                   'digital-product-license-check','research-data-audit-trail')]
          def check(path):
              with urllib.request.urlopen('https://mojplaywin.com'+path,timeout=30) as r:
                  assert r.status==200
                  data=r.read(200000).decode('utf8','replace')
                  assert '<main' in data and '<title>' in data
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              assert len(list(pool.map(check,roots)))==18
          print('ALL_18_PUBLIC_RESOURCE_URLS_HAVE_HEALTHY_BASELINE')
          PY
      - name: Establish pinned SSH relay through VPS to cPanel
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_KEY" && test -n "$HOST_KEY"
          d="$RUNNER_TEMP/mpw-learning-ssh"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs"
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 35s ssh -F "$d/config" saeit-vps 'timeout 15s ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = "SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04"
          mv "$d/host.candidate" "$d/host.known"
      - name: Publish exactly the 18 verified resource shells
        id: install
        run: |
          set -euo pipefail
          timeout 125s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 - publish '$GITHUB_RUN_ID'" < scripts/mpw_learning_tools_shell_20261026.py
      - name: Confirm 18 pages use official shell while original content and canonical routes remain
        run: |
          python3 - <<'PY'
          import concurrent.futures,time,urllib.request
          roots=['/mpw-free-tools/20261025/']+[
              '/mpw-free-tools/20261025/'+s+'/' for s in
              ('chess-calendar','taniya-storytime','atelier-seo','atelier-contrast',
               'browser-game-qa','research-evidence')]
          roots+=['/mpw-learning/20261025/']+[
              '/mpw-learning/20261025/'+s+'/' for s in
              ('chess-baseline','family-storytime','website-client-brief','research-methods')]
          roots+=['/mpw-learning/20261025b/'+s+'/' for s in
                  ('chess-error-review','taniya-creative-retelling',
                   'atelier-accessibility-acceptance','browser-game-retention-diagnostics',
                   'digital-product-license-check','research-data-audit-trail')]
          def get(path):
              req=urllib.request.Request('https://mojplaywin.com'+path,
                                         headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  assert r.status==200,path
                  return r.read(300000).decode('utf8','replace')
          for retry in range(7):
              first=get(roots[0])
              if 'data-mpw-content-shell="20261026"' in first:break
              time.sleep(2)
          assert 'data-mpw-content-shell="20261026"' in first
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              docs=list(pool.map(get,roots))
          for path,doc in zip(roots,docs):
              assert doc.count('data-mpw-content-shell="20261026"')==1,path
              assert doc.count('class="mw-site-nav mpw-unified-shell"')==1,path
              assert doc.count('<main')==1,path
              assert doc.count('<footer class="mpw-content-footer"')==1,path
              assert 'href="https://mojplaywin.com'+path+'"' in doc,path
              assert '<h1' in doc and '</main>' in doc,path
          print('ALL_18_FREE_PAGES_STANDALONE_UNIFIED_AND_CANONICAL_PASS')
          PY
      - name: Verify the 25 protected commerce, child and personal routes did not change
        run: |
          set -euo pipefail
          python3 scripts/mpw_subsite_continuity_guard_20261026.py
      - name: Roll back only verified 18-resource changes on smoke failure
        if: failure() && steps.install.outcome == 'success'
        run: |
          timeout 105s ssh -T -F "$RUNNER_TEMP/mpw-learning-ssh/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_learning_tools_shell_20261026.py
      - name: Remove temporary relay keys
        if: always()
        run: |
          d="$RUNNER_TEMP/mpw-learning-ssh"
          if [ -d "$d" ]; then rm -f "$d/vps.key" "$d/host.key" "$d/vps.known" "$d/host.known" "$d/host.candidate" "$d/config"; rmdir "$d"; fi
