name: Crown guarded live Django route promotion
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/mpw_crown_python_route_safe_publish.py
      - .github/workflows/crown-route-guarded-promote.yml
  push:
    branches: [main]
    paths:
      - scripts/mpw_crown_python_route_safe_publish.py
      - .github/workflows/crown-route-guarded-promote.yml
permissions:
  contents: read
concurrency:
  group: mpw-crown-live-code-scoped
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run narrow reversible-promotion tests
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_crown_python_route_promotion.py
      - name: Validate Python sources and safe defaults
        run: |
          python3 -m py_compile scripts/mpw_crown_python_route_safe_publish.py core/crown_checkout.py core/crown_tron_receipts.py core/crown_fleet.py
          test ! -e services/mpw_crown_mainnet_checkout.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/mpw_crown_python_route_safe_publish.py').read_text('utf8')
          import hashlib
          expected={
              'core/crown_checkout.py':'23615aa9d38c9c6796a19c94e07bc10d77458d4a5cfa0ce5853f2df473e8ec2a',
              'core/crown_fleet.py':'7c2195eac823065553c4f707f49abd1c197345b94fc251f73fff59dab541123f',
              'core/crown_tron_receipts.py':'4dbef1c009e99178a7b04858d9f3c2c2403f17ce03a82793d67dfe882f5c4f4b',
          }
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          assert 'OLD_STAGE' in source and 'PROMOTED' in source
          assert 'CROWN_STAGING_PURCHASES_ACTIVATED=NO' in source
          assert "core/crown_checkout.py" in source and "core/crown_tron_receipts.py" in source
          assert "config/urls.py" in source and "restart.txt" in source
          print('CROWN_PINNED_ROUTE_SCRIPT_TEST=PASS')
          PY
  deploy:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'mojtabarozegar11-ship-it/Saeit' &&
      contains(github.event.head_commit.message, '[approved-crown-route-promotion-20261022]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned existing GitHub to VPS to cPanel relay - read only
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.SAEIT_HOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/crown-pay-ro"
          install -d -m 700 "$d"
          printf '%s' "$VPS_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/vps.key"
          printf '%s' "$HOST_KEY" | python3 -c 'import sys;s=sys.stdin.read();print(s.replace(chr(13)+chr(10),chr(10)).replace(chr(13),"").replace(chr(92)+"n",chr(10)).rstrip()+chr(10),end="")' > "$d/host.key"
          chmod 600 "$d/"*.key
          ssh-keygen -y -P "" -f "$d/vps.key" >/dev/null
          ssh-keygen -y -P "" -f "$d/host.key" >/dev/null
          ssh-keyscan -T 10 -t rsa 178.239.147.150 > "$d/vps.known" 2>/dev/null
          test "$(ssh-keygen -lf "$d/vps.known" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:AYdzF3K5uSwAXElE1w/dKo04iT2BbMGwHbRA2Cu4rrs'
          cat > "$d/config" <<EOF
          Host saeit-vps
            HostName 178.239.147.150
            User githubops
            Port 22
            IdentityFile $d/vps.key
            UserKnownHostsFile $d/vps.known
          Host saeit-cpanel
            HostName zohal.pws-dns.net
            User zomorod2
            Port 1396
            IdentityFile $d/host.key
            UserKnownHostsFile $d/host.known
            ProxyJump saeit-vps
          Host *
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 1
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 600 "$d/config"
          timeout 30s ssh -F "$d/config" saeit-vps 'ssh-keyscan -T 8 -p 1396 -t ed25519 zohal.pws-dns.net' > "$d/host.candidate" 2>/dev/null
          test "$(ssh-keygen -lf "$d/host.candidate" -E sha256 | awk '{print $2}' | sort -u)" = 'SHA256:7gQbDdrCVLFQRVdY6DAw8lF70jvlPfbJQslYn787E04'
          mv "$d/host.candidate" "$d/host.known"
          echo 'CROWN_RELAY_IDENTITY_PINNED=YES'
      - name: Promote exactly scoped Crown code
        id: install
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/crown-pay-ro"
          timeout 65s ssh -T -F "$d/config" saeit-cpanel "python3 - install '$GITHUB_RUN_ID'" < scripts/mpw_crown_python_route_safe_publish.py
      - name: Verify exact code and public/free game
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/crown-pay-ro"
          timeout 35s ssh -T -F "$d/config" saeit-cpanel "python3 - status '$GITHUB_RUN_ID'" < scripts/mpw_crown_python_route_safe_publish.py
          python3 - <<'PY'
          import json,urllib.request
          root='https://mojplaywin.com'
          for path in ('/','/games/','/studio/','/store/','/games/crown-defender/'):
              with urllib.request.urlopen(root+path,timeout=25) as res:
                  assert res.status==200,path
                  if path.endswith('crown-defender/'):
                      assert b'100 / 100' in res.read(200000)
          with urllib.request.urlopen(root+'/api/crown-defender/fleet/',timeout=25) as res:
              items=json.load(res)['items']
          assert len(items)==5
          assert all(i['available'] is False and i['checkout'] is None for i in items)
          print('CROWN_PROTECTED_LIVE_GAME_AND_SALES_GATE=PASS')
          PY
      - name: Roll back exact scoped files if any check fails
        if: failure() && steps.install.outcome != 'skipped'
        run: |
          d="$RUNNER_TEMP/crown-pay-ro"
          timeout 55s ssh -T -F "$d/config" saeit-cpanel "python3 - rollback '$GITHUB_RUN_ID'" < scripts/mpw_crown_python_route_safe_publish.py
