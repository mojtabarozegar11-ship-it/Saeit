<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Forge | MojPlayWin</title><style>body{font:18px system-ui;background:#090e1c;color:#f5e9d0;max-width:800px;margin:30px auto;padding:16px}h1{color:#ffd889}.track{height:85px;background:#1b2b44;position:relative;border:2px solid #b58b48;border-radius:12px;margin:25px 0}.target{position:absolute;left:40%;width:18%;height:100%;background:#a97c2b}.needle{position:absolute;left:0;width:5px;height:100%;background:#fff}button{padding:16px 26px;border-radius:12px;background:#f5c978;color:#15110c;font-weight:bold;border:0;font-size:18px;min-height:48px}button:focus-visible{outline:3px solid white}p{line-height:1.5}</style><main><a href="/games/" style="color:#ffda8c">All games</a><h1>Pulse Forge</h1><p>Stop the traveling spark inside the golden target. Twelve rounds. Three misses end the run. Press Space or Strike.</p><p id="score" aria-live="polite"></p><div class="track" role="img" aria-label="Timing track with moving spark and gold target"><div class="target" id="target"></div><div class="needle" id="needle"></div></div><button id="strike">Strike</button><p id="status" role="status"></p><small>Offline, no tracking or payments. Best score stays on this device. Prototype for independent quality review; not a Google Play release.</small></main><script>(()=>{"use strict";let round=1,score=0,miss=0,combo=0,pos=0,direction=1,last=0,active=true,width=.18,center=.49,speed=.6;const scoreEl=document.getElementById("score"),status=document.getElementById("status"),needle=document.getElementById("needle"),target=document.getElementById("target"),button=document.getElementById("strike");let best=0;try{best=Number(localStorage.getItem("pulseforge-best"))||0}catch{}function render(){needle.style.left=(pos*100)+"%";target.style.left=((center-width/2)*100)+"%";target.style.width=(width*100)+"%";scoreEl.textContent="Round "+round+"/12 · Score "+score+" · Misses "+miss+"/3 · Best "+best}function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(active){pos+=dt*speed*direction;if(pos>1){pos=2-pos;direction=-1}if(pos<0){pos=-pos;direction=1}render()}requestAnimationFrame(frame)}function reset(){round=1;score=0;miss=0;combo=0;pos=0;direction=1;width=.18;center=.49;speed=.6;active=true;button.textContent="Strike";status.textContent="Time your strike";render()}function strike(){if(!active){reset();return}let delta=Math.abs(pos-center);if(delta<=width/2){combo++;let gain=100*combo;score+=gain;status.textContent="Perfect hit! +"+gain}else{miss++;combo=0;status.textContent="Miss. Try the next target."}if(score>best){best=score;try{localStorage.setItem("pulseforge-best",String(best))}catch{}}if(miss>=3||round===12){active=false;button.textContent="Play again";status.textContent+=" · Run finished.";render();return}round++;center=.22+((round*17)%57)/100;width=Math.max(.08,.18-round*.007);speed=.6+round*.08;render()}button.onclick=strike;document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();strike()}});requestAnimationFrame(frame);render()})();</script></html>
