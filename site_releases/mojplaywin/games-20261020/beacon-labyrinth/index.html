<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beacon Labyrinth | MojPlayWin</title><style>body{background:#091121;color:#f6eddd;font:17px system-ui;max-width:740px;margin:20px auto;padding:15px}h1{color:#f4ce82}#board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:520px;margin:20px auto}.tile{aspect-ratio:1;border-radius:8px;background:#1b3450;display:grid;place-items:center;font-size:clamp(12px,4vw,25px)}.wall{background:#05080f}.player{background:#c7943c;color:#101521}.beacon{color:#8df8d2}.exit{color:#ffdb8b}button{background:#dcb36d;color:#17120b;border:0;border-radius:8px;padding:13px 20px;font-size:19px;min-width:55px;min-height:48px;margin:3px}button:focus-visible{outline:3px solid white}a{color:#f4ce82}</style><main><a href="/games/">All games</a><h1>Beacon Labyrinth</h1><p>Collect three beacons and escape before your move budget expires. Use arrows, WASD or the touch buttons.</p><p id="hud" aria-live="polite"></p><div id="board" role="img" aria-label="Seven by seven maze"></div><div style="text-align:center"><button data-d="0,-1">↑</button><br><button data-d="-1,0">←</button><button data-d="0,1">↓</button><button data-d="1,0">→</button></div><button id="restart">Restart maze</button><p id="status" role="status"></p><small>Offline, no tracking, no ads. Unlocked level stored on this device. QA candidate, not a Google Play release.</small></main><script>(()=>{"use strict";const board=document.getElementById("board"),hud=document.getElementById("hud"),status=document.getElementById("status");let level=1;try{level=Number(localStorage.getItem("beacon-level"))||1}catch{}let p=0,steps=0,beacons=[],walls=[],limit=0,done=false;function distance(bs,ws){let queue=[[0,0,0]],seen=new Set(["0-0"]);for(let j=0;j<queue.length;j++){let [v,mask,n]=queue[j];if(v===48&&mask===7)return n;let x=v%7,y=Math.floor(v/7);for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy;if(nx<0||nx>6||ny<0||ny>6)continue;let w=ny*7+nx;if(ws[w])continue;let m=mask;bs.forEach((b,k)=>{if(w===b)m|=1<<k});let id=w+"-"+m;if(!seen.has(id)){seen.add(id);queue.push([w,m,n+1])}}}return -1}function start(){let seed=level*13421+13;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};for(let attempt=0;attempt<60;attempt++){walls=Array.from({length:49},(_,i)=>i!==0&&i!==48&&rand()<.18);beacons=[];while(beacons.length<3){let k=1+Math.floor(rand()*47);if(!walls[k]&&!beacons.includes(k))beacons.push(k)}let d=distance(beacons,walls);if(d>0){limit=d+10;break}}if(distance(beacons,walls)<0){walls.fill(false);beacons=[8,24,40];limit=30}p=0;steps=0;done=false;status.textContent="Find the lights and exit.";draw()}function draw(){board.replaceChildren();for(let i=0;i<49;i++){let t=document.createElement("span");t.className="tile "+(walls[i]?"wall":i===p?"player":beacons.includes(i)?"beacon":i===48?"exit":"");t.textContent=walls[i]?"":i===p?"◆":beacons.includes(i)?"✦":i===48?"⬡":"·";board.append(t)}hud.textContent="Level "+level+" · Moves "+steps+"/"+limit+" · Beacons left "+beacons.length}function move(dx,dy){if(done)return;let x=p%7+dx,y=Math.floor(p/7)+dy;if(x<0||x>6||y<0||y>6)return;let n=y*7+x;if(walls[n])return;p=n;steps++;beacons=beacons.filter(b=>b!==p);if(p===48&&!beacons.length){done=true;status.textContent="Solved! New level unlocked.";level++;try{localStorage.setItem("beacon-level",String(level))}catch{}setTimeout(start,850)}else if(steps>=limit){done=true;status.textContent="Out of moves. Restart to retry."}draw()}document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>move(...b.dataset.d.split(",").map(Number)));document.addEventListener("keydown",e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});document.getElementById("restart").onclick=start;start()})();</script></html>
