<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline Keeper | MojPlayWin</title><style>body{background:#080d1a;color:#f6eadd;font:17px system-ui;max-width:730px;margin:20px auto;padding:16px}h1{color:#f4d08d}#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:540px;margin:20px auto}.cell{aspect-ratio:1;min-width:0;border:1px solid #455674;border-radius:8px;background:#1c2c46;color:#b9cadb;font-size:clamp(14px,4vw,26px)}.cell.tower{background:#1c5266;color:#9df4ff}.cell.shield{background:#665034;color:#ffebad}.cell.enemy{background:#842f42;color:#fff}.cell:focus-visible,button:focus-visible{outline:3px solid white}button{cursor:pointer;touch-action:manipulation}.bar{display:flex;gap:9px;flex-wrap:wrap}.bar button{padding:12px 17px;border:1px solid #bd965e;background:#202e43;color:#ffe5b6;border-radius:10px;min-height:48px}button[aria-pressed=true]{background:#c99a4d;color:#101421}a{color:#f4d08d}</style><main><a href="/games/">All games</a><h1>Skyline Keeper</h1><p>Build turrets and shields, then advance the wave. Turrets destroy enemies within two rows in their column. Shields absorb one impact. Protect the core for twelve turns.</p><p id="hud" aria-live="polite"></p><div class="bar"><button data-type="1" aria-pressed="true">Turret · 3 energy</button><button data-type="2" aria-pressed="false">Shield · 2 energy</button><button id="advance">Advance wave</button></div><div id="grid" aria-label="Six by six tactical defense grid"></div><p id="status" role="status"></p><small>Single-player offline strategy. No payments, ads or tracking. QA candidate, not a Google Play release.</small></main><script>(()=>{"use strict";let wave=0,energy=7,core=5,type=1,grid=Array(36).fill(0),enemies=[],done=false,best=0;try{best=Number(localStorage.getItem("skyline-best-wave"))||0}catch{}const field=document.getElementById("grid"),hud=document.getElementById("hud"),status=document.getElementById("status"),advance=document.getElementById("advance");function draw(){field.replaceChildren();for(let i=0;i<36;i++){let b=document.createElement("button"),enemy=enemies.some(e=>e===i);b.className="cell "+(enemy?"enemy":grid[i]===1?"tower":grid[i]===2?"shield":"");b.textContent=enemy?"☄":grid[i]===1?"✧":grid[i]===2?"▣":i>=30?"⌂":"·";b.setAttribute("aria-label","Row "+(Math.floor(i/6)+1)+", column "+(i%6+1));b.onclick=()=>place(i);field.append(b)}hud.textContent="Wave "+wave+"/12 · Energy "+energy+" · Core "+core+"/5 · Best wave "+best}function place(i){if(done||i<6||i>=30||grid[i]||enemies.includes(i))return;let cost=type===1?3:2;if(energy<cost){status.textContent="Insufficient energy";return}grid[i]=type;energy-=cost;draw()}function tick(){if(done){reset();return}wave++;if(wave>best){best=wave;try{localStorage.setItem("skyline-best-wave",String(best))}catch{}}let next=[];for(let i of enemies){let n=i+6;if(n>=36){core--;continue}if(grid[n]===2){grid[n]=0;continue}next.push(n)}enemies=next;for(let i=0;i<36;i++)if(grid[i]===1){let target=enemies.find(e=>e%6===i%6&&Math.abs(Math.floor(e/6)-Math.floor(i/6))<=2);if(target!==undefined)enemies.splice(enemies.indexOf(target),1)}if(wave<=10){let n=1+Math.floor(wave/4);for(let k=0;k<n;k++)enemies.push((wave*3+k*2)%6)}energy=Math.min(12,energy+3);if(core<=0||wave>=12){done=true;status.textContent=core>0?"Victory! The skyline survived.":"Defeat. Try another tower layout.";advance.textContent="Play again"}else status.textContent="Wave "+wave+" resolved. Plan your next defense.";draw()}function reset(){wave=0;energy=7;core=5;type=1;grid=Array(36).fill(0);enemies=[];done=false;advance.textContent="Advance wave";status.textContent="Build your first defense.";draw()}document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{type=Number(b.dataset.type);document.querySelectorAll("[data-type]").forEach(x=>x.setAttribute("aria-pressed",String(Number(x.dataset.type)===type)))});advance.onclick=tick;reset()})();</script></htm
