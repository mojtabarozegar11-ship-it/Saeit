<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cipher Garden | MojPlayWin</title><style>body{background:radial-gradient(circle at top,#283c54,#080d1a);color:#f5e9d5;font:18px system-ui;max-width:740px;margin:20px auto;padding:18px}h1{color:#f9d58a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-width:460px;margin:24px auto}.tile{height:160px;background:#18324b;color:#d4e3e7;border:3px solid #927a4d;border-radius:25px;font-size:70px;transition:background .1s}.tile.lit{background:#f6d68b;color:#12171c}.tile:focus-visible,button:focus-visible{outline:3px solid white}button{cursor:pointer;touch-action:manipulation}#restart{background:#f1c778;padding:13px 22px;border:0;border-radius:10px;font-size:18px}a{color:#f9d58a}@media(prefers-reduced-motion:reduce){.tile{transition:none}}</style><main><a href="/games/">All games</a><h1>Cipher Garden</h1><p>Memorize each growing constellation, then repeat the illuminated sequence. Tap tiles or press keys 1–4.</p><p id="hud" aria-live="polite"></p><div class="grid" id="grid"></div><button id="restart">Restart garden</button><p id="status" role="status" aria-live="polite"></p><small>No ads, accounts or network. Best sequence saved locally. Independent QA candidate, not a Google Play release.</small></main><script>(()=>{"use strict";let seq=[],round=0,index=0,locked=true,active=true,best=0,timers=[];try{best=Number(localStorage.getItem("cipher-garden-best"))||0}catch{}const hud=document.getElementById("hud"),status=document.getElementById("status"),grid=document.getElementById("grid");const glyph=["☾","☀","❧","≈"],name=["Moon","Sun","Leaf","Tide"];let buttons=glyph.map((g,i)=>{let b=document.createElement("button");b.className="tile";b.textContent=g;b.setAttribute("aria-label",name[i]);b.onclick=()=>tap(i);grid.append(b);return b});function later(fn,ms){timers.push(setTimeout(fn,ms))}function glow(i){buttons[i].classList.add("lit");later(()=>buttons[i].classList.remove("lit"),340)}function next(){locked=true;index=0;round++;seq.push((round*7+Math.floor(round/3))%4);hud.textContent="Round "+round+" · Best "+best;status.textContent="Watch the constellation";seq.forEach((n,i)=>later(()=>glow(n),550+i*620));later(()=>{locked=false;status.textContent="Your turn: repeat the pattern"},600+seq.length*620)}function tap(i){if(locked||!active)return;glow(i);if(seq[index]!==i){active=false;locked=true;status.textContent="Pattern broken after "+(round-1)+" complete rounds. Restart to try again.";return}index++;if(index===seq.length){locked=true;best=Math.max(best,round);try{localStorage.setItem("cipher-garden-best",String(best))}catch{}status.textContent="Correct! Garden is growing.";later(next,850)}}function reset(){timers.forEach(clearTimeout);timers=[];buttons.forEach(b=>b.classList.remove("lit"));seq=[];round=0;index=0;active=true;next()}document.addEventListener("keydown",e=>{if(/^[1-4]$/.test(e.key))tap(Number(e.key)-1)});document.getElementById("restart").onclick=reset;reset()})();</script></html>
