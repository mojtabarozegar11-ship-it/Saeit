<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازی مسیر آب | زمرد ملل</title><style>body{background:#252b19;color:#f4f0df;font:16px Tahoma;text-align:center}main{max-width:600px;margin:auto}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;direction:ltr}button{padding:15px;font-size:25px;background:#39432a;color:#e2c373;border:1px solid #e2c373;border-radius:8px}button:focus-visible{outline:3px solid white}.wet{background:#1a607a}</style></head><body><main><h1>💧 مسیر آب</h1><p>لوله‌ها را بچرخانید تا آب از چپ به راست برسد.</p><p id="level"></p><div id="board"></div><p id="result" role="status"></p><button id="next">مرحله بعد</button><button id="reset">تکرار</button><p><a href="/agriculture/">کشاورزی</a></p></main><script>
let stage=1,turns=0,pipes=[];const board=document.getElementById("board"),result=document.getElementById("result"),next=document.getElementById("next");
function start(){turns=0;pipes=Array.from({length:5},(_,i)=>(i*stage+1)%2);render()}
function render(){board.textContent="";let ok=true;for(let i=0;i<5;i++){const b=document.createElement("button");b.type="button";b.textContent=pipes[i]?"│":"─";b.setAttribute("aria-label","لوله "+(i+1));b.onclick=()=>{pipes[i]=1-pipes[i];turns++;render()};board.append(b);if(pipes[i])ok=false}document.getElementById("level").textContent="مرحله "+stage+" از ۸ | چرخش "+turns;result.textContent=ok?"آب به مزرعه رسید!":"لوله‌ها را افقی کنید";next.disabled=!ok||stage===8}
next.onclick=()=>{if(stage<8){stage++;start()}};document.getElementById("reset").onclick=start;start();
</script></body></html>
