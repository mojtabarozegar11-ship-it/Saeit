server {
    listen 80;
    listen [::]:80;
    server_name mojplaywin.com www.mojplaywin.com;
    client_max_body_size 10m;

    location /static/ {
        alias /srv/saeit/current/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/saeit/gunicorn.sock;
    }
}
