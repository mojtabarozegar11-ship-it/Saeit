{% load static %}<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}MojPlayWin | Research, Games & Learning{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}MojPlayWin: research, games, digital products and practical technology.{% endblock %}">
  <link rel="canonical" href="https://mojplaywin.com{{ request.path }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MojPlayWin">
  <meta property="og:url" content="https://mojplaywin.com{{ request.path }}">
  <meta property="og:title" content="MojPlayWin | Digital Products, Research & Games">
  <meta property="og:description" content="Explore MojPlayWin digital products, original games, research and learning.">
  <meta property="og:image" content="https://mojplaywin.com/static/site/mojplaywin-brand.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/jpeg" href="{% static 'site/mojplaywin-brand.jpg' %}">
  <style id="mojplaywin-site-baseline">
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#08090b}
    body{margin:0;background:#08090b;color:#f7f4ed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mpx-skip{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
    .mpx-skip:focus{left:12px;top:12px;width:auto;height:auto;padding:12px 16px;z-index:999;background:#fff;color:#111}
    main{min-height:70vh}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="site-standard-v2 mojplaywin-site {% block body_class %}page-default{% endblock %}">
  <a class="mpx-skip" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
