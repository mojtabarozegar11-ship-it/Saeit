{% load static %}<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Moj Play Win | Games, AI, Research & Digital Products{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Moj Play Win (MojPlayWin) explores original games, AI tools, research, web development, digital products and learning resources.{% endblock %}">
  <link rel="canonical" href="https://mojplaywin.com{{ request.path }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Moj Play Win">
  <meta property="og:url" content="https://mojplaywin.com{{ request.path }}">
  <meta property="og:title" content="Moj Play Win | Games, AI, Research & Digital Products">
  <meta property="og:description" content="Explore games, AI tools, original research and digital products at Moj Play Win (MojPlayWin).">
  <meta property="og:image" content="https://mojplaywin.com/static/site/mojplaywin-brand.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:title" content="Moj Play Win | Games, AI, Research & Digital Products">
  <meta name="twitter:description" content="Games, AI, research, web development and digital products from Moj Play Win.">
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://mojplaywin.com/#organization","name":"Moj Play Win","alternateName":["MojPlayWin","Moj play win"],"url":"https://mojplaywin.com/"},{"@type":"WebSite","@id":"https://mojplaywin.com/#website","name":"Moj Play Win","alternateName":"MojPlayWin","url":"https://mojplaywin.com/","inLanguage":"en","publisher":{"@id":"https://mojplaywin.com/#organization"}}]}</script>
  <link rel="icon" type="image/webp" href="{% static 'site/mojplaywin-atelier/official-coin-80.webp' %}">
  <style id="mojplaywin-site-baseline">
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#08090b}
    body{margin:0;background:#08090b;color:#f7f4ed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mpx-skip{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
    .mpx-skip:focus{left:12px;top:12px;width:auto;height:auto;padding:12px 16px;z-index:999;background:#fff;color:#111}
    main{min-height:70vh}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="site-standard-v2 mojplaywin-site {% block body_class %}page-default{% endblock %}">
  <a class="mpx-skip" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
